ntly stir the mixture around the midpoint of the baking period.", "name": "Bake for 23–33 minutes. For evenly cooked granola with a looser texture, gently stir the mixture around the midpoint of the baking period.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-granola-recipe/#wprm-recipe-45498-step-0-5"}, {"@type": "HowToStep", "text": "For larger, more defined granola clusters, leave the mixture undisturbed and rotate the baking sheets halfway through baking instead of stirring.", "name": "For larger, more defined granola clusters, leave the mixture undisturbed and rotate the baking sheets halfway through baking instead of stirring.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-granola-recipe/#wprm-recipe-45498-step-0-6"}, {"@type": "HowToStep", "text": "When the granola develops a golden-brown color, typically at approximately the 25-minute mark, remove the baking sheets from the oven.", "name": "When the granola develops a golden-brown color, typically at approximately the 25-minute mark, remove the baking sheets from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-granola-recipe/#wprm-recipe-45498-step-0-7"}, {"@type": "HowToStep", "text": "Allow the granola to cool completely on the pans. It will continue to firm and become crisp as its temperature drops.", "name": "Allow the granola to cool completely on the pans. It will continue to firm and become crisp as its temperature drops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-granola-recipe/#wprm-recipe-45498-step-0-8"}, {"@type": "HowToStep", "text": "Once fully cooled, transfer the granola to an airtight storage container. Properly stored, it should remain fresh for approximately two weeks.", "name": "Once fully cooled, transfer the granola to an airtight storage container. Properly stored, it should remain fresh for approximately two weeks.", "url": "https://easy-recipes322.github.io/ea
