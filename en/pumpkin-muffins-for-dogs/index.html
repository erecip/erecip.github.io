 "Place the oat flour and baking soda in a large mixing bowl. Whisk or stir thoroughly so the baking soda is distributed evenly throughout the flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins-for-dogs/#wprm-recipe-41558-step-0-1"}, {"@type": "HowToStep", "text": "Add the eggs, unsweetened applesauce, pure pumpkin puree, and remaining melted coconut oil to the dry mixture. Stir only until the ingredients are incorporated. A few small lumps or faint streaks of flour may remain; avoid excessive mixing so the muffins retain a light, tender texture.", "name": "Add the eggs, unsweetened applesauce, pure pumpkin puree, and remaining melted coconut oil to the dry mixture. Stir only until the ingredients are incorporated. A few small lumps or faint streaks of flour may remain; avoid excessive mixing so the muffins retain a light, tender texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins-for-dogs/#wprm-recipe-41558-step-0-2"}, {"@type": "HowToStep", "text": "Divide the batter among the prepared muffin cups, filling each cavity approximately two-thirds full.", "name": "Divide the batter among the prepared muffin cups, filling each cavity approximately two-thirds full.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins-for-dogs/#wprm-recipe-41558-step-0-3"}, {"@type": "HowToStep", "text": "For standard-size muffins, bake for 15–20 minutes. For mini muffins, bake for 10–15 minutes. Test for doneness by inserting a toothpick into the center of a muffin; it should come out clean.", "name": "For standard-size muffins, bake for 15–20 minutes. For mini muffins, bake for 10–15 minutes. Test for doneness by inserting a toothpick into the center of a muffin; it should come out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins-for-dogs/#wprm-recipe-41558-step-0-4"}, {"@type": "HowToStep", "text": "Remove the baked muffins from the pan and place them on a wire cooling rack. Allow them to cool completely before serving so they can finish setting and develop their intended texture.", "name": "Remove the baked muffins from the pan and place them on a wire cooling rack. Allow them to cool completely before serving so they can finish setting and develop their intended texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins-for-dogs/#wprm-recipe-41558-step-0-5"}], "recipeCategory": ["Homemade Dog Treats"], "recipeCuisine": ["Pet-Friendly"], "keywords": "Pumpkin Muffins for Dogs"}</script>
