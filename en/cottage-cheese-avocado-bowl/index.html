y base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-avocado-bowl/#wprm-recipe-42470-step-0-1"}, {"@type": "HowToStep", "text": "Arrange the prepared avocado over the cottage cheese. Scatter the halved cherry tomatoes across the top.", "name": "Arrange the prepared avocado over the cottage cheese. Scatter the halved cherry tomatoes across the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-avocado-bowl/#wprm-recipe-42470-step-0-2"}, {"@type": "HowToStep", "text": "Add a handful of arugula over the avocado and tomatoes. Baby spinach may also be used as described in the original preparation.", "name": "Add a handful of arugula over the avocado and tomatoes. Baby spinach may also be used as described in the original preparation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-avocado-bowl/#wprm-recipe-42470-step-0-3"}, {"@type": "HowToStep", "text": "Sprinkle the mixed seeds over the bowl to provide additional texture. Season with kosher salt and freshly ground black pepper according to taste.", "name": "Sprinkle the mixed seeds over the bowl to provide additional texture. Season with kosher salt and freshly ground black pepper according to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-avocado-bowl/#wprm-recipe-42470-step-0-4"}, {"@type": "HowToStep", "text": "Finish with a light drizzle of extra-virgin olive oil and a squeeze of fresh lemon juice, if desired. Gently combine the ingredients before eating, or leave them arranged in layers for serving.", "name": "Finish with a light drizzle of extra-virgin olive oil and a squeeze of fresh lemon juice, if desired. Gently combine the ingredients before eating, or leave them arranged in layers for serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-avocado-bowl/#wprm-recipe-42470-step-0-5"}], "recipeCategory": ["Breakfast"], "keywords": "Cottage Cheese Av
