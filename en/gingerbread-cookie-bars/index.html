    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gingerbread Cookie Bars", "author": {"@type": "Person", "name": "BenDes"}, "description": "These gingerbread cookie bars feature a soft, tender base flavored with cinnamon, ginger, cloves, and rich unsulphured molasses. Freshly grated ginger may be added for a brighter, sharper spice note. Once completely cooled, the bars are finished with a smooth cream cheese icing and optional holiday sprinkles for a festive presentation.", "datePublished": "2021-10-20T05:25:04+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/gingerbread-cookie-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/gingerbread-cookie-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/gingerbread-cookie-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/gingerbread-cookie-bars.png"], "prepTime": "PT20M", "cookTime": "PT18M", "totalTime": "PT38M", "recipeIngredient": ["3/4 cup firmly packed light brown sugar", "1 teaspoon ground ginger", "1  large egg (brought to room temperature)", "1/2 cup unsalted butter (melted and allowed to cool to room temperature)", "1 tablespoon ground cinnamon (preferably freshly ground for a more aromatic flavor)", "1/3 cup unsulphured molasses; avoid blackstrap molasses", "2 cups all-purpose flour", "1/2 teaspoon fine salt", "1/4 cup granulated white sugar", "1/2 teaspoon ground cloves", "1 1/2 teaspoons baking soda", "1 teaspoon freshly grated ginger (optional, for a more pronounced fresh-ginger bite)", "1 teaspoon vanilla extract", "1 1/2 cups powdered sugar (sifted to eliminate lumps)", "1/4 cup unsalted butter (softened)", "1 cup full-fat (block-style cream cheese, softened; do not use whipped cream cheese)", "Holiday sprinkles (optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Line a 9 × 13-inch baking pan with parchment paper or coat it lightly with grease to prevent the bars from sticking and to make removal easier.", "name": "Preheat the oven to 350°F. Line a 9 × 13-inch baking pan with parchment paper or coat it lightly with grease to prevent the bars from sticking and to make removal easier.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-0"}, {"@type": "HowToStep", "text": "Place the all-purpose flour, baking soda, salt, cinnamon, ground ginger, and cloves in a medium mixing bowl. Whisk thoroughly so that the spices and leavening agent are distributed evenly throughout the flour.", "name": "Place the all-purpose flour, baking soda, salt, cinnamon, ground ginger, and cloves in a medium mixing bowl. Whisk thoroughly so that the spices and leavening agent are distributed evenly throughout the flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-1"}, {"@type": "HowToStep", "text": "Freshly ground cinnamon may be used when available for a brighter and more aromatic cinnamon flavor.", "name": "Freshly ground cinnamon may be used when available for a brighter and more aromatic cinnamon flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-2"}, {"@type": "HowToStep", "text": "Place the melted butter, after it has cooled to room temperature, in the bowl of a stand mixer or a large bowl suitable for a hand mixer. Add the packed light brown sugar and granulated sugar.", "name": "Place the melted butter, after it has cooled to room temperature, in the bowl of a stand mixer or a large bowl suitable for a hand mixer. Add the packed light brown sugar and granulated sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-3"}, {"@type": "HowToStep", "text": "Beat the mixture for approximately 2 minutes, or until it appears paler, lighter, and fluffier in texture. Properly beating these ingredients incorporates air and contributes to the tender texture of the finished bars.", "name": "Beat the mixture for approximately 2 minutes, or until it appears paler, lighter, and fluffier in texture. Properly beating these ingredients incorporates air and contributes to the tender texture of the finished bars.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-4"}, {"@type": "HowToStep", "text": "With the mixer operating, add the unsulphured molasses, room-temperature egg, and the optional freshly grated ginger.", "name": "With the mixer operating, add the unsulphured molasses, room-temperature egg, and the optional freshly grated ginger.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-5"}, {"@type": "HowToStep", "text": "Continue beating until the mixture is completely uniform. Scrape the sides and bottom of the bowl with a spatula as necessary, since the thick molasses can collect around the edges or remain in small pockets.", "name": "Continue beating until the mixture is completely uniform. Scrape the sides and bottom of the bowl with a spatula as necessary, since the thick molasses can collect around the edges or remain in small pockets.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-6"}, {"@type": "HowToStep", "text": "The optional fresh ginger supplies a sharper, livelier ginger flavor than ground ginger alone.", "name": "The optional fresh ginger supplies a sharper, livelier ginger flavor than ground ginger alone.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-7"}, {"@type": "HowToStep", "text": "Add the previously combined dry ingredients to the wet mixture. Mix on low speed only until the flour and spices have been incorporated and no dry streaks remain.", "name": "Add the previously combined dry ingredients to the wet mixture. Mix on low speed only until the flour and spices have been incorporated and no dry streaks remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-8"}, {"@type": "HowToStep", "text": "Avoid excessive mixing at this stage. Working the dough longer than necessary can encourage gluten development and produce firmer, tougher bars rather than a tender texture.", "name": "Avoid excessive mixing at this stage. Working the dough longer than necessary can encourage gluten development and produce firmer, tougher bars rather than a tender texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-9"}, {"@type": "HowToStep", "text": "Step 5: Spread and Bake", "name": "Step 5: Spread and Bake", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-10"}, {"@type": "HowToStep", "text": "Transfer the finished dough to the prepared baking pan. Press and spread it into an even layer across the bottom of the pan, using an offset spatula or the back of a measuring cup to smooth the surface if needed.", "name": "Transfer the finished dough to the prepared baking pan. Press and spread it into an even layer across the bottom of the pan, using an offset spatula or the back of a measuring cup to smooth the surface if needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-11"}, {"@type": "HowToStep", "text": "Bake for 16–18 minutes. The bars are ready when the outer edges are set and feel lightly firm while the center retains a small amount of softness or give.", "name": "Bake for 16–18 minutes. The bars are ready when the outer edges are set and feel lightly firm while the center retains a small amount of softness or give.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-12"}, {"@type": "HowToStep", "text": "Remove the pan from the oven. The residual heat will continue cooking the gingerbread slightly as it cools.", "name": "Remove the pan from the oven. The residual heat will continue cooking the gingerbread slightly as it cools.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-13"}, {"@type": "HowToStep", "text": "Allow the gingerbread layer to cool completely to room temperature before applying the icing. Frosting the bars while warm can cause the cream cheese topping to soften or melt.", "name": "Allow the gingerbread layer to cool completely to room temperature before applying the icing. Frosting the bars while warm can cause the cream cheese topping to soften or melt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-14"}, {"@type": "HowToStep", "text": "In a clean mixing bowl, beat the softened full-fat block cream cheese together with the softened unsalted butter for approximately 1 minute, or until the mixture is smooth and creamy.", "name": "In a clean mixing bowl, beat the softened full-fat block cream cheese together with the softened unsalted butter for approximately 1 minute, or until the mixture is smooth and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-15"}, {"@type": "HowToStep", "text": "Both ingredients should be softened to room temperature so they combine evenly without forming lumps.", "name": "Both ingredients should be softened to room temperature so they combine evenly without forming lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-16"}, {"@type": "HowToStep", "text": "Gradually incorporate the sifted powdered sugar along with the vanilla extract. Beat on medium speed for another 1–2 minutes, until the icing becomes light, fluffy, smooth, and easy to spread.", "name": "Gradually incorporate the sifted powdered sugar along with the vanilla extract. Beat on medium speed for another 1–2 minutes, until the icing becomes light, fluffy, smooth, and easy to spread.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-17"}, {"@type": "HowToStep", "text": "Sifting the powdered sugar beforehand helps prevent unwanted lumps and produces a finer-textured icing.", "name": "Sifting the powdered sugar beforehand helps prevent unwanted lumps and produces a finer-textured icing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-18"}, {"@type": "HowToStep", "text": "Spread the prepared cream cheese icing evenly over the completely cooled gingerbread base with an offset spatula or the back of a spoon.", "name": "Spread the prepared cream cheese icing evenly over the completely cooled gingerbread base with an offset spatula or the back of a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-19"}, {"@type": "HowToStep", "text": "While the icing is still slightly tacky, scatter holiday sprinkles over the surface so they adhere securely.", "name": "While the icing is still slightly tacky, scatter holiday sprinkles over the surface so they adhere securely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-20"}, {"@type": "HowToStep", "text": "Slice the frosted gingerbread into squares and serve.", "name": "Slice the frosted gingerbread into squares and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-cookie-bars/#wprm-recipe-41662-step-0-21"}], "recipeCategory": ["cake", "Dessert"], "recipeCuisine": ["American"], "keywords": "Gingerbread Cookie Bars"}</script>
