    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies with Egg Whites", "author": {"@type": "Person", "name": "BenDes"}, "description": "These delicate Christmas meringue cookies are prepared from whipped egg whites and sugar, then piped into festive tree shapes and decorated with colorful holiday sprinkles. Slow baking at a low temperature produces a light, crisp texture while helping the cookies retain their pale appearance.", "datePublished": "2018-02-12T03:25:03+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/christmas-cookies-with-egg-whites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/christmas-cookies-with-egg-whites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/christmas-cookies-with-egg-whites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/christmas-cookies-with-egg-whites2.png"], "cookTime": "PT90M", "totalTime": "PT90M", "recipeIngredient": ["1 cup white granulated sugar", "1/2 teaspoon pure vanilla extract", "4  large egg whites (brought to room temperature for optimal volume)", "Holiday sprinkles (as needed for decorating)", "1/4 teaspoon cream of tartar (for stabilizing the whipped egg whites)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 225°F (110°C). Cover two baking sheets with parchment paper to keep the meringues from adhering and promote consistent baking.", "name": "Heat the oven to 225°F (110°C). Cover two baking sheets with parchment paper to keep the meringues from adhering and promote consistent baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-0"}, {"@type": "HowToStep", "text": "Place the room-temperature egg whites in the bowl of an electric mixer and beat until foamy and frothy.", "name": "Place the room-temperature egg whites in the bowl of an electric mixer and beat until foamy and frothy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-1"}, {"@type": "HowToStep", "text": "Add the cream of tartar and continue whipping until the egg whites reach the soft-peak stage. Gradually raise the mixer speed to medium-high.", "name": "Add the cream of tartar and continue whipping until the egg whites reach the soft-peak stage. Gradually raise the mixer speed to medium-high.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-2"}, {"@type": "HowToStep", "text": "Add the granulated sugar slowly, approximately one tablespoon at a time. Allow each portion of sugar to dissolve thoroughly before adding the next.", "name": "Add the granulated sugar slowly, approximately one tablespoon at a time. Allow each portion of sugar to dissolve thoroughly before adding the next.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-3"}, {"@type": "HowToStep", "text": "Continue beating the mixture until firm, stiff peaks develop. Add the vanilla extract and beat briefly until it is evenly distributed throughout the meringue.", "name": "Continue beating the mixture until firm, stiff peaks develop. Add the vanilla extract and beat briefly until it is evenly distributed throughout the meringue.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the prepared meringue into a piping bag equipped with a star-shaped piping tip.", "name": "Transfer the prepared meringue into a piping bag equipped with a star-shaped piping tip.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-5"}, {"@type": "HowToStep", "text": "For Christmas tree shapes, begin at the center and pipe a circular foundation. Pipe two additional concentric layers above the base, gradually narrowing the shape and ending with a pointed top.", "name": "For Christmas tree shapes, begin at the center and pipe a circular foundation. Pipe two additional concentric layers above the base, gradually narrowing the shape and ending with a pointed top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-6"}, {"@type": "HowToStep", "text": "Scatter holiday sprinkles over the freshly piped meringues for decoration.", "name": "Scatter holiday sprinkles over the freshly piped meringues for decoration.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-7"}, {"@type": "HowToStep", "text": "Place the baking sheets in the preheated oven and bake the meringue trees for 1 1/2 to 2 hours.", "name": "Place the baking sheets in the preheated oven and bake the meringue trees for 1 1/2 to 2 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-8"}, {"@type": "HowToStep", "text": "Monitor the cookies carefully so they do not begin to brown, modifying the baking duration when necessary. The gentle oven temperature allows the meringues to dry gradually while preserving their light color.", "name": "Monitor the cookies carefully so they do not begin to brown, modifying the baking duration when necessary. The gentle oven temperature allows the meringues to dry gradually while preserving their light color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-9"}, {"@type": "HowToStep", "text": "When the meringues have finished baking, switch off the oven and leave the oven door slightly ajar.", "name": "When the meringues have finished baking, switch off the oven and leave the oven door slightly ajar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-10"}, {"@type": "HowToStep", "text": "Allow the cookies to cool gradually inside the oven until they reach room temperature. This slow cooling process helps reduce the likelihood of cracking.", "name": "Allow the cookies to cool gradually inside the oven until they reach room temperature. This slow cooling process helps reduce the likelihood of cracking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-11"}, {"@type": "HowToStep", "text": "Once completely cooled, transfer the Christmas meringue cookies to an airtight container. Keep them away from warmth and humidity so they remain dry and crisp.", "name": "Once completely cooled, transfer the Christmas meringue cookies to an airtight container. Keep them away from warmth and humidity so they remain dry and crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-egg-whites/#wprm-recipe-45887-step-0-12"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Christmas Cookies with Egg Whites"}</script>
