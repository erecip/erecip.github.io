    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Grilled Chicken Salad", "author": {"@type": "Person", "name": "BenDes"}, "description": "A wholesome and flavorful grilled chicken salad, ideal for a balanced lunch or a light dinner. This vibrant dish combines marinated grilled chicken with crisp vegetables and a honey vinaigrette, delivering both nutrition and taste.", "datePublished": "2024-03-20T09:36:38+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/grilled-chicken-salad.png", "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/grilled-chicken-salad.png", "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/grilled-chicken-salad.png", "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/grilled-chicken-salad.png"], "recipeYield": ["4"], "prepTime": "PT10M", "cookTime": "PT10M", "totalTime": "PT80M", "recipeIngredient": ["2 teaspoons white wine vinegar", "½ teaspoon salt", "¼ cup lemon juice", "½ teaspoon dried rosemary", "2 tablespoons dijon mustard", "¾ cup olive oil", "¼ cup plus 1 tablespoon honey", "½ cup feta cheese", "½ cup croutons (homemade or store-bought)", "½ cup cucumbers (sliced and quartered)", "10 ounces romaine lettuce", "1 to 1.5 pounds chicken breast (sliced or diced)", "½ cup honey vinaigrette", "½ cup grape tomatoes (quartered)", "1  avocado (sliced)"], "recipeInstructions": [{"@type": "HowToSection", "name": "Marinade & Dressing", "itemListElement": [{"@type": "HowToStep", "text": "Combine all marinade ingredients using a milk frother, emulsion blender, or whisk thoroughly by hand until well emulsified. This will yield approximately 1½ cups (12 ounces) of marinade. Set aside ½ cup to use later as the salad dressing.", "name": "Combine all marinade ingredients using a milk frother, emulsion blender, or whisk thoroughly by hand until well emulsified. This will yield approximately 1½ cups (12 ounces) of marinade. Set aside ½ cup to use later as the salad dressing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/#wprm-recipe-31865-step-0-0"}]}, {"@type": "HowToSection", "name": "Grilling the Chicken", "itemListElement": [{"@type": "HowToStep", "text": "Slice chicken breasts horizontally to butterfly them or use a meat mallet to flatten them evenly. Place in a container or bag with 1 cup of the prepared marinade, and refrigerate for a minimum of 1 hour and up to 24 hours.", "name": "Slice chicken breasts horizontally to butterfly them or use a meat mallet to flatten them evenly. Place in a container or bag with 1 cup of the prepared marinade, and refrigerate for a minimum of 1 hour and up to 24 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/#wprm-recipe-31865-step-1-0"}, {"@type": "HowToStep", "text": "Preheat the grill to medium heat, around 400°F (204°C).", "name": "Preheat the grill to medium heat, around 400°F (204°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/#wprm-recipe-31865-step-1-1"}, {"@type": "HowToStep", "text": "Remove chicken from marinade and place onto the hot grill. Optionally, brush a bit of the remaining marinade over the chicken to intensify the flavor.", "name": "Remove chicken from marinade and place onto the hot grill. Optionally, brush a bit of the remaining marinade over the chicken to intensify the flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/#wprm-recipe-31865-step-1-2"}, {"@type": "HowToStep", "text": "Grill each piece for about 3 minutes on one side, then flip and cook an additional 4–5 minutes, or until the internal temperature reaches 165°F (74°C). Let the grilled chicken rest for at least 5 minutes before slicing.", "name": "Grill each piece for about 3 minutes on one side, then flip and cook an additional 4–5 minutes, or until the internal temperature reaches 165°F (74°C). Let the grilled chicken rest for at least 5 minutes before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/#wprm-recipe-31865-step-1-3"}]}, {"@type": "HowToSection", "name": "Assembling the Salad", "itemListElement": [{"@type": "HowToStep", "text": "Distribute the romaine lettuce evenly across four large salad bowls. Top with cucumbers, grape tomatoes, feta cheese, croutons, and avocado slices.", "name": "Distribute the romaine lettuce evenly across four large salad bowls. Top with cucumbers, grape tomatoes, feta cheese, croutons, and avocado slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/#wprm-recipe-31865-step-2-0"}, {"@type": "HowToStep", "text": "Drizzle the reserved ½ cup of honey vinaigrette over the assembled ingredients and toss to combine.", "name": "Drizzle the reserved ½ cup of honey vinaigrette over the assembled ingredients and toss to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/#wprm-recipe-31865-step-2-1"}, {"@type": "HowToStep", "text": "Finish by layering the sliced grilled chicken atop each salad bowl and serve immediately.", "name": "Finish by layering the sliced grilled chicken atop each salad bowl and serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-salad/#wprm-recipe-31865-step-2-2"}]}], "recipeCategory": ["Main Course", "Salad"], "recipeCuisine": ["American"], "keywords": "grilled chicken salad"}</script>
