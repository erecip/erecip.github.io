    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Orange Scones", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender pumpkin scones warmly seasoned with pumpkin pie spice and cinnamon, studded with sweet candied orange peel, and finished with a smooth orange-cinnamon glaze. Frozen grated butter helps create a delicate, flaky texture.", "datePublished": "2022-07-04T22:39:07+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/pumpkin-orange-scones2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/pumpkin-orange-scones2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/pumpkin-orange-scones2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/pumpkin-orange-scones2.png"], "prepTime": "PT15M", "totalTime": "PT25M", "recipeIngredient": ["3/4 cup pumpkin purée", "1/2 cup frozen butter (grated)", "2 teaspoons pumpkin pie spice", "1/2 cup candied orange peel", "1/4 teaspoon fine salt", "2 1/2 cups all-purpose flour (plus a small amount as needed for shaping)", "1/2 teaspoon ground cinnamon", "1/4 cup firmly packed brown sugar", "1/4 teaspoon baking soda", "1/4 cup milk (with a small portion reserved for brushing)", "2 teaspoons baking powder", "1/2 teaspoon ground cinnamon", "4 teaspoons milk", "1 1/2 cups powdered sugar", "1/2 teaspoon orange extract"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F (200°C). In a large mixing bowl, thoroughly whisk together the all-purpose flour, packed brown sugar, baking powder, pumpkin pie spice, cinnamon, baking soda, and salt until the ingredients are evenly dispersed.", "name": "Preheat the oven to 400°F (200°C). In a large mixing bowl, thoroughly whisk together the all-purpose flour, packed brown sugar, baking powder, pumpkin pie spice, cinnamon, baking soda, and salt until the ingredients are evenly dispersed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-0"}, {"@type": "HowToStep", "text": "Using a box grater, grate the frozen butter directly into the flour mixture. Gently toss the grated butter through the dry ingredients until the mixture has a coarse, crumbly consistency. Keeping the butter cold at this stage contributes to a tender, flaky finished scone.", "name": "Using a box grater, grate the frozen butter directly into the flour mixture. Gently toss the grated butter through the dry ingredients until the mixture has a coarse, crumbly consistency. Keeping the butter cold at this stage contributes to a tender, flaky finished scone.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-1"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the pumpkin purée with the milk until evenly blended and smooth.", "name": "In a separate bowl, whisk the pumpkin purée with the milk until evenly blended and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-2"}, {"@type": "HowToStep", "text": "Pour the pumpkin mixture into the dry ingredients. Stir only until the flour is moistened and a rough dough begins to form, taking care not to overwork the mixture.", "name": "Pour the pumpkin mixture into the dry ingredients. Stir only until the flour is moistened and a rough dough begins to form, taking care not to overwork the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-3"}, {"@type": "HowToStep", "text": "Gently fold in the candied orange peel until it is distributed throughout the dough.", "name": "Gently fold in the candied orange peel until it is distributed throughout the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the dough to a lightly floured work surface. Dust with a small amount of additional flour as necessary to prevent sticking.", "name": "Transfer the dough to a lightly floured work surface. Dust with a small amount of additional flour as necessary to prevent sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-5"}, {"@type": "HowToStep", "text": "Knead gently approximately 10 times, just until the dough holds together. Shape it into a flat circle measuring about 8 inches across.", "name": "Knead gently approximately 10 times, just until the dough holds together. Shape it into a flat circle measuring about 8 inches across.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-6"}, {"@type": "HowToStep", "text": "Using a sharp knife or bench scraper, divide the round evenly into 8 wedge-shaped portions.", "name": "Using a sharp knife or bench scraper, divide the round evenly into 8 wedge-shaped portions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the scone wedges on a lightly greased baking sheet, leaving space between each piece.", "name": "Arrange the scone wedges on a lightly greased baking sheet, leaving space between each piece.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-8"}, {"@type": "HowToStep", "text": "Lightly brush the surface of each scone with milk to encourage a golden finish.", "name": "Lightly brush the surface of each scone with milk to encourage a golden finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-9"}, {"@type": "HowToStep", "text": "Bake at 400°F (200°C) for 12–15 minutes, or until the scones develop a pale golden-brown color.", "name": "Bake at 400°F (200°C) for 12–15 minutes, or until the scones develop a pale golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-10"}, {"@type": "HowToStep", "text": "Remove from the oven and allow the scones to cool on the baking sheet for approximately 10 minutes.", "name": "Remove from the oven and allow the scones to cool on the baking sheet for approximately 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-11"}, {"@type": "HowToStep", "text": "While the baked scones are cooling, combine the powdered sugar, milk, orange extract, and cinnamon in a small bowl. Whisk until the glaze becomes completely smooth.", "name": "While the baked scones are cooling, combine the powdered sugar, milk, orange extract, and cinnamon in a small bowl. Whisk until the glaze becomes completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-12"}, {"@type": "HowToStep", "text": "Drizzle the glaze over the slightly warm scones. Allow the topping to set before serving.", "name": "Drizzle the glaze over the slightly warm scones. Allow the topping to set before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-orange-scones/#wprm-recipe-45018-step-0-13"}], "recipeCategory": ["Breakfast and Brunch"], "keywords": "Pumpkin Orange Scones"}</script>
