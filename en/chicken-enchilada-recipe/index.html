e cheese (about 1½ cups).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-enchilada-recipe/#wprm-recipe-32169-step-0-5"}, {"@type": "HowToStep", "text": "Place the baking dish in the oven and bake uncovered for 20 minutes, or until the cheese is fully melted and begins to bubble.", "name": "Place the baking dish in the oven and bake uncovered for 20 minutes, or until the cheese is fully melted and begins to bubble.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-enchilada-recipe/#wprm-recipe-32169-step-0-6"}, {"@type": "HowToStep", "text": "Serve promptly and embellish with your choice of garnishes.", "name": "Serve promptly and embellish with your choice of garnishes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-enchilada-recipe/#wprm-recipe-32169-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Mexican"], "keywords": "chicken enchilada recipe"}</script>
