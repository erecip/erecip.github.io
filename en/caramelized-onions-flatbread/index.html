    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Caramelized Onions Flatbread", "author": {"@type": "Person", "name": "BenDes"}, "description": "Crisp, golden puff pastry forms the foundation of this savory flatbread, topped with deeply caramelized yellow onions, fresh thyme, Gruyère, Fontina, and delicate prosciutto. A final dusting of freshly grated nutmeg, salt, and cracked black pepper adds a fragrant, well-rounded finish.", "datePublished": "2019-02-11T23:47:58+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/caramelized-onions-flatbread2.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/caramelized-onions-flatbread2.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/caramelized-onions-flatbread2.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/caramelized-onions-flatbread2.png"], "cookTime": "PT20M", "totalTime": "PT50M", "recipeIngredient": ["1 teaspoon fresh thyme leaves", "2  large yellow onions (approximately 1 pound total, cut into 1/4-inch slices)", "Freshly cracked black pepper (as needed)", "1 tablespoon olive oil", "Kosher salt (as needed)", "2 tablespoons unsalted butter", "4  –6 thin slices high-quality prosciutto", "4 ounces Fontina cheese (shredded)", "4 ounces Gruyère cheese (freshly shredded)", "2 tablespoons olive oil", "Fresh nutmeg (finely grated for finishing)", "1  box frozen puff pastry (thawed, approximately 17.5 ounces, such as Pepperidge Farm)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the unsalted butter and 1 tablespoon olive oil in a large Dutch oven and warm over medium-high heat. Add the sliced yellow onions, then season them with kosher salt and freshly cracked black pepper.", "name": "Place the unsalted butter and 1 tablespoon olive oil in a large Dutch oven and warm over medium-high heat. Add the sliced yellow onions, then season them with kosher salt and freshly cracked black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-0"}, {"@type": "HowToStep", "text": "Cook the onions uncovered for 15 minutes, stirring from time to time. Reduce the heat to medium and continue cooking for another 10 minutes, stirring more frequently.", "name": "Cook the onions uncovered for 15 minutes, stirring from time to time. Reduce the heat to medium and continue cooking for another 10 minutes, stirring more frequently.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-1"}, {"@type": "HowToStep", "text": "Turn the heat down to medium-low and cook for an additional 5–10 minutes, or until the onions develop a deep golden-brown color. Fold in the fresh thyme leaves, remove the pot from the heat, and transfer the onions to a bowl to cool.", "name": "Turn the heat down to medium-low and cook for an additional 5–10 minutes, or until the onions develop a deep golden-brown color. Fold in the fresh thyme leaves, remove the pot from the heat, and transfer the onions to a bowl to cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-2"}, {"@type": "HowToStep", "text": "Preheat the oven to 400°F and arrange the oven racks in the upper and lower thirds. Line two baking sheets with parchment paper.", "name": "Preheat the oven to 400°F and arrange the oven racks in the upper and lower thirds. Line two baking sheets with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-3"}, {"@type": "HowToStep", "text": "On a lightly floured work surface, roll each thawed puff pastry sheet into a rectangle measuring approximately 9 × 14 inches. Transfer each pastry rectangle to a separate prepared baking sheet, then prick the entire surface repeatedly with a fork to limit excessive rising.", "name": "On a lightly floured work surface, roll each thawed puff pastry sheet into a rectangle measuring approximately 9 × 14 inches. Transfer each pastry rectangle to a separate prepared baking sheet, then prick the entire surface repeatedly with a fork to limit excessive rising.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-4"}, {"@type": "HowToStep", "text": "Lay another piece of parchment paper over each pastry, cover with foil, and place an additional baking sheet on top to weigh the pastry down while it bakes.", "name": "Lay another piece of parchment paper over each pastry, cover with foil, and place an additional baking sheet on top to weigh the pastry down while it bakes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-5"}, {"@type": "HowToStep", "text": "Bake the weighted puff pastry sheets for 15 minutes. Carefully remove the upper baking sheets along with the foil and top layers of parchment.", "name": "Bake the weighted puff pastry sheets for 15 minutes. Carefully remove the upper baking sheets along with the foil and top layers of parchment.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-6"}, {"@type": "HowToStep", "text": "Return the uncovered pastries to the oven and bake for another 5–8 minutes, until evenly golden. If the undersides become noticeably darker than the tops, turn the pastry sheets over to encourage more uniform browning.", "name": "Return the uncovered pastries to the oven and bake for another 5–8 minutes, until evenly golden. If the undersides become noticeably darker than the tops, turn the pastry sheets over to encourage more uniform browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-7"}, {"@type": "HowToStep", "text": "Remove the baked pastry from the oven and allow it to cool slightly.", "name": "Remove the baked pastry from the oven and allow it to cool slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-8"}, {"@type": "HowToStep", "text": "While the pastry is baking, place the shredded Gruyère and Fontina cheeses in a bowl. Tear or dice the prosciutto into smaller pieces and add it to the cheeses. Toss everything together until the ingredients are evenly distributed.", "name": "While the pastry is baking, place the shredded Gruyère and Fontina cheeses in a bowl. Tear or dice the prosciutto into smaller pieces and add it to the cheeses. Toss everything together until the ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-9"}, {"@type": "HowToStep", "text": "Lightly drizzle the baked puff pastry sheets with the remaining 2 tablespoons olive oil. Divide the cooled caramelized onions evenly between the two pastries and spread them over the surfaces.", "name": "Lightly drizzle the baked puff pastry sheets with the remaining 2 tablespoons olive oil. Divide the cooled caramelized onions evenly between the two pastries and spread them over the surfaces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-10"}, {"@type": "HowToStep", "text": "Distribute the Gruyère, Fontina, and prosciutto mixture equally over the onion layer. Return both flatbreads to the oven and bake for 5 minutes, or until the cheeses have melted and begun to develop browned spots.", "name": "Distribute the Gruyère, Fontina, and prosciutto mixture equally over the onion layer. Return both flatbreads to the oven and bake for 5 minutes, or until the cheeses have melted and begun to develop browned spots.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-11"}, {"@type": "HowToStep", "text": "Add additional freshly cracked black pepper at this stage if desired.", "name": "Add additional freshly cracked black pepper at this stage if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-12"}, {"@type": "HowToStep", "text": "Remove the finished flatbreads from the oven. Grate fresh nutmeg lightly over the tops, then season with additional kosher salt and freshly cracked black pepper according to taste.", "name": "Remove the finished flatbreads from the oven. Grate fresh nutmeg lightly over the tops, then season with additional kosher salt and freshly cracked black pepper according to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-13"}, {"@type": "HowToStep", "text": "Slice the flatbreads into serving pieces and serve while hot.", "name": "Slice the flatbreads into serving pieces and serve while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-flatbread/#wprm-recipe-42030-step-0-14"}], "recipeCategory": ["Appetizer"], "keywords": "Onion caramelization"}</script>
