    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Rotisserie Chicken Enchiladas", "author": {"@type": "Person", "name": "BenDes"}, "description": "This streamlined enchilada recipe transforms a store-bought rotisserie chicken into a hearty, comforting main dish, layered with bold flavor and melty cheese. With minimal prep and just one bowl, it’s ideal for busy weeknights.", "datePublished": "2024-02-29T03:23:27+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/Rotisserie-Chicken-Enchiladas.png", "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/Rotisserie-Chicken-Enchiladas.png", "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/Rotisserie-Chicken-Enchiladas.png", "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/Rotisserie-Chicken-Enchiladas.png"], "recipeYield": ["4"], "prepTime": "PT10M", "cookTime": "PT25M", "totalTime": "PT35M", "recipeIngredient": ["2  10 oz cans enchilada sauce", "1 ½ cups shredded cheddar cheese (divided)", "1  10 oz can diced tomatoes with green chilies, drained", "8  burrito-size flour tortillas", "1  rotisserie chicken (yielding at least 4 cups shredded meat)", "Sour cream (for serving)", "Fresh cilantro (for garnish)", "Cooking spray or oil (for greasing)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Lightly coat a 9×13-inch baking dish with cooking spray or oil.", "name": "Preheat the oven to 350°F (175°C). Lightly coat a 9×13-inch baking dish with cooking spray or oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/#wprm-recipe-31563-step-0-0"}, {"@type": "HowToStep", "text": "Remove the meat from the rotisserie chicken and place it into a large mixing bowl. Aim for at least 4 cups of shredded chicken. For quick shredding, use a hand mixer directly in the bowl.", "name": "Remove the meat from the rotisserie chicken and place it into a large mixing bowl. Aim for at least 4 cups of shredded chicken. For quick shredding, use a hand mixer directly in the bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/#wprm-recipe-31563-step-0-1"}, {"@type": "HowToStep", "text": "Spread about ½ cup of enchilada sauce across the bottom of the prepared baking dish, using the back of a spoon to coat evenly.", "name": "Spread about ½ cup of enchilada sauce across the bottom of the prepared baking dish, using the back of a spoon to coat evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/#wprm-recipe-31563-step-0-2"}, {"@type": "HowToStep", "text": "To the shredded chicken, add one full 10-ounce can of enchilada sauce, the drained diced tomatoes with green chilies, and 1 cup of the shredded cheddar cheese. Stir until all ingredients are well incorporated.", "name": "To the shredded chicken, add one full 10-ounce can of enchilada sauce, the drained diced tomatoes with green chilies, and 1 cup of the shredded cheddar cheese. Stir until all ingredients are well incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/#wprm-recipe-31563-step-0-3"}, {"@type": "HowToStep", "text": "Lay a tortilla flat and spoon approximately ½ cup of the chicken mixture into the center. Roll it tightly and place seam-side down in the baking dish. Repeat with the remaining tortillas and filling.", "name": "Lay a tortilla flat and spoon approximately ½ cup of the chicken mixture into the center. Roll it tightly and place seam-side down in the baking dish. Repeat with the remaining tortillas and filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/#wprm-recipe-31563-step-0-4"}, {"@type": "HowToStep", "text": "Pour the second can of enchilada sauce evenly over the assembled enchiladas. Use a spoon to distribute the sauce across the top. Sprinkle the remaining ½ cup of shredded cheddar cheese over everything.", "name": "Pour the second can of enchilada sauce evenly over the assembled enchiladas. Use a spoon to distribute the sauce across the top. Sprinkle the remaining ½ cup of shredded cheddar cheese over everything.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/#wprm-recipe-31563-step-0-5"}, {"@type": "HowToStep", "text": "Cover the dish with aluminum foil and bake for 20–25 minutes. In the final 5 minutes of baking, remove the foil to allow the cheese to melt fully and the sauce to bubble around the edges.", "name": "Cover the dish with aluminum foil and bake for 20–25 minutes. In the final 5 minutes of baking, remove the foil to allow the cheese to melt fully and the sauce to bubble around the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/#wprm-recipe-31563-step-0-6"}, {"@type": "HowToStep", "text": "Let the enchiladas rest for 5 minutes before serving. Garnish with fresh cilantro and serve with sour cream and any preferred toppings.", "name": "Let the enchiladas rest for 5 minutes before serving. Garnish with fresh cilantro and serve with sour cream and any preferred toppings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/#wprm-recipe-31563-step-0-7"}, {"@type": "HowToSection", "name": "Storage:", "itemListElement": [{"@type": "HowToStep", "text": "Store any leftovers in an airtight container in the refrigerator for up to 3 days. Reheat individual portions in the microwave for 1–2 minutes until warmed through.", "name": "Store any leftovers in an airtight container in the refrigerator for up to 3 days. Reheat individual portions in the microwave for 1–2 minutes until warmed through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-enchiladas/#wprm-recipe-31563-step-1-0"}]}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Tex-Mex"], "keywords": "rotisserie chicken enchiladas"}</script>
