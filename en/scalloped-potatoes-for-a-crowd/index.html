    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Scalloped Potatoes for a Crowd", "author": {"@type": "Person", "name": "BenDes"}, "description": "Thinly sliced potatoes are layered with sharp cheddar and Parmesan, then covered with a warm garlic-infused cream sauce and baked until tender beneath a deeply golden, bubbling cheese topping. This rich potato gratin is well suited to holiday meals, gatherings, and large family dinners.", "datePublished": "2020-10-29T15:47:41+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/scalloped-potatoes-for-a-crowd.png", "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/scalloped-potatoes-for-a-crowd.png", "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/scalloped-potatoes-for-a-crowd.png", "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/scalloped-potatoes-for-a-crowd.png"], "prepTime": "PT20M", "cookTime": "PT40M", "totalTime": "PT65M", "recipeIngredient": ["Freshly ground black pepper (added according to taste)", "2 cups heavy whipping cream", "3 pounds russet potatoes (peeled and cut into approximately 1/8-inch-thick slices)", "1 cup finely grated Parmesan cheese", "3  fresh garlic cloves (minced)", "1 tablespoon unsalted butter", "2 cups shredded sharp cheddar cheese", "1 teaspoon salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Set the oven to 350°F (175°C) and position an oven rack in the center.", "name": "Set the oven to 350°F (175°C) and position an oven rack in the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-0"}, {"@type": "HowToStep", "text": "Grate the sharp cheddar and Parmesan cheeses. Peel the potatoes, then use a mandoline slicer to cut them into uniform slices approximately 1/8 inch (3 mm) thick. Russet potatoes may be used as listed, while Yukon Gold potatoes are also noted as an option for a more buttery flavor and pleasing texture.", "name": "Grate the sharp cheddar and Parmesan cheeses. Peel the potatoes, then use a mandoline slicer to cut them into uniform slices approximately 1/8 inch (3 mm) thick. Russet potatoes may be used as listed, while Yukon Gold potatoes are also noted as an option for a more buttery flavor and pleasing texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-1"}, {"@type": "HowToStep", "text": "Place the butter in a small saucepan over medium-high heat and allow it to melt.", "name": "Place the butter in a small saucepan over medium-high heat and allow it to melt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-2"}, {"@type": "HowToStep", "text": "Add the freshly minced garlic and sauté for approximately 30 seconds, just until aromatic.", "name": "Add the freshly minced garlic and sauté for approximately 30 seconds, just until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-3"}, {"@type": "HowToStep", "text": "Pour in the heavy cream, stir in the salt, and season with black pepper as desired.", "name": "Pour in the heavy cream, stir in the salt, and season with black pepper as desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-4"}, {"@type": "HowToStep", "text": "Heat the cream mixture while stirring from time to time. As soon as it begins to reach a boil, remove the saucepan from the heat immediately to help prevent the cream from curdling.", "name": "Heat the cream mixture while stirring from time to time. As soon as it begins to reach a boil, remove the saucepan from the heat immediately to help prevent the cream from curdling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-5"}, {"@type": "HowToStep", "text": "Lightly coat a 9 × 13-inch baking dish with grease.", "name": "Lightly coat a 9 × 13-inch baking dish with grease.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-6"}, {"@type": "HowToStep", "text": "Arrange half of the sliced potatoes across the bottom, allowing the slices to overlap slightly. The arrangement does not need to be perfectly uniform.", "name": "Arrange half of the sliced potatoes across the bottom, allowing the slices to overlap slightly. The arrangement does not need to be perfectly uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-7"}, {"@type": "HowToStep", "text": "Drizzle half of the warm garlic cream sauce evenly over the first potato layer. Scatter half of the shredded cheddar and half of the grated Parmesan over the cream.", "name": "Drizzle half of the warm garlic cream sauce evenly over the first potato layer. Scatter half of the shredded cheddar and half of the grated Parmesan over the cream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-8"}, {"@type": "HowToStep", "text": "Add the remaining potato slices in a second layer. Pour over the rest of the garlic cream mixture, then distribute the remaining cheddar and Parmesan evenly across the top.", "name": "Add the remaining potato slices in a second layer. Pour over the rest of the garlic cream mixture, then distribute the remaining cheddar and Parmesan evenly across the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-9"}, {"@type": "HowToStep", "text": "Cover the baking dish securely with aluminum foil and transfer it to the preheated oven.", "name": "Cover the baking dish securely with aluminum foil and transfer it to the preheated oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-10"}, {"@type": "HowToStep", "text": "Bake the covered potatoes for 40 minutes.", "name": "Bake the covered potatoes for 40 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-11"}, {"@type": "HowToStep", "text": "Carefully remove the foil, then return the uncovered dish to the oven for an additional 25 to 35 minutes. The scalloped potatoes are ready when the slices can be easily pierced with a toothpick and the cheese topping is golden, melted, and bubbling.", "name": "Carefully remove the foil, then return the uncovered dish to the oven for an additional 25 to 35 minutes. The scalloped potatoes are ready when the slices can be easily pierced with a toothpick and the cheese topping is golden, melted, and bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-12"}, {"@type": "HowToStep", "text": "Take the finished potato gratin from the oven and allow it to stand for 5 to 10 minutes before serving. This brief resting period gives the layers time to settle and helps the portions hold their shape when cut.", "name": "Take the finished potato gratin from the oven and allow it to stand for 5 to 10 minutes before serving. This brief resting period gives the layers time to settle and helps the portions hold their shape when cut.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-for-a-crowd/#wprm-recipe-46129-step-0-13"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Scalloped Potatoes for a Crowd"}</script>
