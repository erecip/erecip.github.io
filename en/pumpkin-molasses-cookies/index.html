ed for approximately 2 minutes, or until the mixture becomes pale, airy, and fluffy.", "name": "Place the room-temperature butter and granulated sugar in the bowl of a stand mixer fitted with the paddle attachment. Beat at medium speed for approximately 2 minutes, or until the mixture becomes pale, airy, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-molasses-cookies/#wprm-recipe-39981-step-0-1"}, {"@type": "HowToStep", "text": "Add the molasses, pumpkin purée, vanilla extract, baking soda, kosher salt, and pumpkin pie spice. Continue mixing at medium speed for 1 minute, pausing to scrape down the sides of the bowl as necessary, until the mixture is evenly blended and smooth.", "name": "Add the molasses, pumpkin purée, vanilla extract, baking soda, kosher salt, and pumpkin pie spice. Continue mixing at medium speed for 1 minute, pausing to scrape down the sides of the bowl as necessary, until the mixture is evenly blended and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-molasses-cookies/#wprm-recipe-39981-step-0-2"}, {"@type": "HowToStep", "text": "Lower the mixer speed and gradually incorporate the all-purpose flour. Mix only until the final visible streaks of flour disappear. Avoid prolonged mixing to preserve the cookies’ soft, delicate texture.", "name": "Lower the mixer speed and gradually incorporate the all-purpose flour. Mix only until the final visible streaks of flour disappear. Avoid prolonged mixing to preserve the cookies’ soft, delicate texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-molasses-cookies/#wprm-recipe-39981-step-0-3"}, {"@type": "HowToStep", "text": "Measure the dough with a medium cookie scoop that holds approximately 2 tablespoons. Shape each portion into a ball and arrange the dough balls on the lined baking sheet, allowing roughly 2 inches of space between them.", "name": "Measure the dough with a medium cookie scoop that holds approximately 2 tablespoons. Shape each portion into a ball and arrange the dough balls on the lined baking sheet, allowing roughly 2 inches of space between them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-molasses-cookies/#wprm-recipe-39981-step-0-4"}, {"@type": "HowToStep", "text": "Bake for about 9 minutes, or until the surfaces appear just set. Remove the cookies from the oven and transfer them to a wire cooling rack. Allow them to cool completely before applying the icing.", "name": "Bake for about 9 minutes, or until the surfaces appear just set. Remove the cookies from the oven and transfer them to a wire cooling rack. Allow them to cool completely before applying the icing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-molasses-cookies/#wprm-recipe-39981-step-0-5"}, {"@type": "HowToStep", "text": "Whisk the sifted confectioners’ sugar, vanilla extract, and milk together until a smooth, uniform glaze forms.", "name": "Whisk the sifted confectioners’ sugar, vanilla extract, and milk together until a smooth, uniform glaze forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-molasses-cookies/#wprm-recipe-39981-step-0-6"}, {"@type": "HowToStep", "text": "Dip the top of each cooled cookie into the prepared icing. Place the glazed cookies aside until the coating has fully set.", "name": "Dip the top of each cooled cookie into the prepared icing. Place the glazed cookies aside until the coating has fully set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-molasses-cookies/#wprm-recipe-39981-step-0-7"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Molasses Cookies"}</script>
