    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Stuffed Pork Tenderloin", "author": {"@type": "Person", "name": "BenDes"}, "description": "Christmas Stuffed Pork Tenderloin is a festive main course featuring butterflied pork filled with cranberry sauce, wilted spinach, caramelized sweet onion, fresh sage, and creamy goat cheese. The tenderloin is rolled, tied, roasted, rested, and sliced for an elegant holiday presentation.", "datePublished": "2021-01-15T01:19:28+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/Christmas-Stuffed-Pork-Tenderloin1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/Christmas-Stuffed-Pork-Tenderloin1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/Christmas-Stuffed-Pork-Tenderloin1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/Christmas-Stuffed-Pork-Tenderloin1.png"], "prepTime": "PT25M", "cookTime": "PT65M", "totalTime": "PT110M", "recipeIngredient": ["1  boneless pork tenderloin (1 to 2 pounds, cut lengthwise to butterfly)", "6 ounces goat cheese (crumbled)", "1/2 cup cranberry sauce", "3 cups fresh spinach leaves", "3  garlic cloves (finely minced)", "1  sweet onion (thinly sliced to roughly 1/8 inch)", "2 tablespoons unsalted butter (divided)", "3 tablespoons fresh sage (finely chopped)", "1 teaspoon salt (divided)", "1/4 teaspoon freshly ground black pepper"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place a large pot over medium-low heat and melt 1 tablespoon of the unsalted butter.", "name": "Place a large pot over medium-low heat and melt 1 tablespoon of the unsalted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-0"}, {"@type": "HowToStep", "text": "Add the thinly sliced sweet onion along with 1/2 teaspoon salt, then stir to coat the onion evenly in the butter.", "name": "Add the thinly sliced sweet onion along with 1/2 teaspoon salt, then stir to coat the onion evenly in the butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-1"}, {"@type": "HowToStep", "text": "Cook the onion for 30 to 40 minutes, stirring frequently, until it becomes deeply softened and caramelized. Watch closely during cooking to prevent scorching.", "name": "Cook the onion for 30 to 40 minutes, stirring frequently, until it becomes deeply softened and caramelized. Watch closely during cooking to prevent scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-2"}, {"@type": "HowToStep", "text": "Stir the chopped fresh sage into the caramelized onion, then transfer the mixture to a bowl and set it aside.", "name": "Stir the chopped fresh sage into the caramelized onion, then transfer the mixture to a bowl and set it aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-3"}, {"@type": "HowToStep", "text": "Using the same pot, add the remaining 1 tablespoon unsalted butter and warm it over medium heat.", "name": "Using the same pot, add the remaining 1 tablespoon unsalted butter and warm it over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-4"}, {"@type": "HowToStep", "text": "Add the fresh spinach and cook, stirring occasionally, until the leaves wilt.", "name": "Add the fresh spinach and cook, stirring occasionally, until the leaves wilt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-5"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and cook for about 30 seconds, just until fragrant. Remove the pot from the heat and reserve the spinach mixture.", "name": "Stir in the minced garlic and cook for about 30 seconds, just until fragrant. Remove the pot from the heat and reserve the spinach mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-6"}, {"@type": "HowToStep", "text": "Preheat the oven to 450 degrees F.", "name": "Preheat the oven to 450 degrees F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-7"}, {"@type": "HowToStep", "text": "Line a roasting pan or baking sheet with aluminum foil, then coat the surface with nonstick spray.", "name": "Line a roasting pan or baking sheet with aluminum foil, then coat the surface with nonstick spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-8"}, {"@type": "HowToStep", "text": "Set the pork tenderloin on a cutting board. With a sharp knife, slice it open lengthwise, beginning about 1/4 inch from the bottom, then continue cutting to unfold the meat into a flat surface.", "name": "Set the pork tenderloin on a cutting board. With a sharp knife, slice it open lengthwise, beginning about 1/4 inch from the bottom, then continue cutting to unfold the meat into a flat surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-9"}, {"@type": "HowToStep", "text": "Season the inside of the opened pork tenderloin with the remaining salt and the black pepper.", "name": "Season the inside of the opened pork tenderloin with the remaining salt and the black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-10"}, {"@type": "HowToStep", "text": "Spread the cranberry sauce over the pork, keeping 1 to 2 inches clear around the edges to help with rolling.", "name": "Spread the cranberry sauce over the pork, keeping 1 to 2 inches clear around the edges to help with rolling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-11"}, {"@type": "HowToStep", "text": "Layer the wilted spinach over the cranberry sauce, then add the caramelized onion mixture.", "name": "Layer the wilted spinach over the cranberry sauce, then add the caramelized onion mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-12"}, {"@type": "HowToStep", "text": "Scatter the crumbled goat cheese evenly over the filling.", "name": "Scatter the crumbled goat cheese evenly over the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-13"}, {"@type": "HowToStep", "text": "Roll the pork tenderloin firmly around the filling, then secure it with kitchen twine.", "name": "Roll the pork tenderloin firmly around the filling, then secure it with kitchen twine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-14"}, {"@type": "HowToStep", "text": "Season the outside of the rolled tenderloin with salt and black pepper.", "name": "Season the outside of the rolled tenderloin with salt and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-15"}, {"@type": "HowToStep", "text": "Place the tied pork tenderloin on the prepared roasting pan or baking sheet.", "name": "Place the tied pork tenderloin on the prepared roasting pan or baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-16"}, {"@type": "HowToStep", "text": "Roast for 30 to 35 minutes, or until the internal temperature reaches about 140 to 145 degrees F.", "name": "Roast for 30 to 35 minutes, or until the internal temperature reaches about 140 to 145 degrees F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-17"}, {"@type": "HowToStep", "text": "Remove the pork tenderloin from the oven and allow it to rest for 20 minutes before slicing.", "name": "Remove the pork tenderloin from the oven and allow it to rest for 20 minutes before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-18"}, {"@type": "HowToStep", "text": "Cut the rested tenderloin into slices and serve with additional cranberry sauce, gravy, or preferred side dishes.", "name": "Cut the rested tenderloin into slices and serve with additional cranberry sauce, gravy, or preferred side dishes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-tenderloin/#wprm-recipe-38873-step-0-19"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Christmas Stuffed Pork Tenderloin"}</script>
