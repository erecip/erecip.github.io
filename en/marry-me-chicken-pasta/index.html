    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Marry Me Chicken Pasta Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A beloved twist on the classic 'Marry Me Chicken,' this dish features tender penne pasta bathed in a creamy, cheesy sun-dried tomato sauce. Every bite is bursting with flavor, making it a surefire favorite for any occasion.", "datePublished": "2025-03-01T07:57:35+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2025/03/Marry-Me-Chicken-Pasta1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2025/03/Marry-Me-Chicken-Pasta1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2025/03/Marry-Me-Chicken-Pasta1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2025/03/Marry-Me-Chicken-Pasta1-480x270.jpg"], "recipeYield": ["6"], "prepTime": "PT10M", "cookTime": "PT20M", "totalTime": "PT30M", "recipeIngredient": ["10 ounces penne pasta", "1 ½ pounds boneless (skinless chicken, cut into 1-inch pieces)", "¼ teaspoon black pepper", "½ teaspoon salt", "1 tablespoon olive oil", "3 tablespoons butter", "2 teaspoons garlic (minced)", "3 tablespoons all-purpose flour", "2 cups chicken broth", "1 teaspoon paprika", "1 cup heavy cream", "2 teaspoons dried Italian seasoning", "1 cup sun-dried tomatoes (drained)", "1 cup grated parmesan cheese", "Fresh basil (for garnish)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the penne pasta according to the package directions. Once cooked, drain and set aside. Meanwhile, cut the chicken into 1-inch pieces and season with salt and black pepper. Heat olive oil in a large skillet over medium-high heat. Add the chicken and cook for 6-8 minutes, stirring occasionally, until fully cooked and no longer pink in the center. Remove from the skillet and set aside.", "name": "Prepare the penne pasta according to the package directions. Once cooked, drain and set aside. Meanwhile, cut the chicken into 1-inch pieces and season with salt and black pepper. Heat olive oil in a large skillet over medium-high heat. Add the chicken and cook for 6-8 minutes, stirring occasionally, until fully cooked and no longer pink in the center. Remove from the skillet and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-pasta/#wprm-recipe-24338-step-0-0"}, {"@type": "HowToSection", "name": "Sauce", "itemListElement": [{"@type": "HowToStep", "text": "In the same skillet, melt the butter over medium heat. Add the minced garlic and sauté for about 30 seconds until fragrant. Sprinkle in the flour and stir continuously to form a paste. Gradually whisk in the chicken broth, followed by the heavy cream and parmesan cheese. Stir well until the mixture becomes smooth. Add the sun-dried tomatoes, paprika, and Italian seasoning, seasoning further with salt and pepper to taste. Let the sauce simmer for a few minutes until it thickens slightly. Return the cooked chicken and pasta to the skillet, tossing to coat everything in the creamy sauce.", "name": "In the same skillet, melt the butter over medium heat. Add the minced garlic and sauté for about 30 seconds until fragrant. Sprinkle in the flour and stir continuously to form a paste. Gradually whisk in the chicken broth, followed by the heavy cream and parmesan cheese. Stir well until the mixture becomes smooth. Add the sun-dried tomatoes, paprika, and Italian seasoning, seasoning further with salt and pepper to taste. Let the sauce simmer for a few minutes until it thickens slightly. Return the cooked chicken and pasta to the skillet, tossing to coat everything in the creamy sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-pasta/#wprm-recipe-24338-step-1-0"}, {"@type": "HowToStep", "text": "Garnish with freshly chopped basil and additional parmesan cheese before serving. Enjoy!", "name": "Garnish with freshly chopped basil and additional parmesan cheese before serving. Enjoy!", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-pasta/#wprm-recipe-24338-step-1-1"}]}], "aggregateRating": {"@type": "AggregateRating", "ratingValue": "5", "ratingCount": "1", "reviewCount": "1"}, "review": [{"@type": "Review", "reviewRating": {"@type": "Rating", "ratingValue": "5"}, "reviewBody": "This is by far the best recipe I've found online.  The blend of the seasonings is incredible.  The portions of meat vs. pasta is just right as I am not a big fan of pasta.  This dish beats spaghetti by far.  Try it! You won't be disappointed.", "author": {"@type": "Person", "name": "Lisa Stahl"}, "datePublished": "2025-03-28"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American", "Italian"], "keywords": "Marry Me Chicken Pasta Recipe"}</script>
