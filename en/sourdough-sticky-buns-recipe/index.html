    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sourdough Sticky Buns Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "These irresistibly tender sourdough sticky buns, also referred to as caramel rolls, are enriched with a natural sourdough starter and filled with a rich cinnamon-sugar blend. They undergo a leisurely overnight fermentation for depth of flavor and ease of preparation. Crowned with buttery caramel and toasted pecans, they emerge from the oven decadently gooey and aromatic.", "datePublished": "2024-06-09T13:32:48+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/Sourdough-Sticky-Buns-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/Sourdough-Sticky-Buns-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/Sourdough-Sticky-Buns-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/Sourdough-Sticky-Buns-Recipe1.png"], "prepTime": "PT40M", "cookTime": "PT35M", "totalTime": "PT975M", "recipeIngredient": ["7 grams fine sea salt", "70 grams unsalted butter (softened and divided into ½-tablespoon pieces)", "25 grams whole wheat flour", "130 grams active sourdough starter", "20 grams cane sugar", "1  large egg (room temperature)", "315 grams all-purpose flour", "180 grams whole milk (lukewarm)", "2 teaspoons ground cinnamon", "Pinch of fine sea salt", "2 tablespoons unsalted butter (melted)", "60 grams brown sugar", "6 tablespoons unsalted butter", "1/4 teaspoon fine sea salt", "50 grams honey", "3/4 cup raw pecans", "120 grams brown sugar", "115 grams 1/2 cup heavy cream"], "recipeInstructions": [{"@type": "HowToStep", "text": "In the bowl of a stand mixer, combine the all-purpose and whole wheat flours. In a separate bowl, whisk together the milk, egg, and sourdough starter until the mixture is smooth. Using the dough hook, start the mixer on speed 2 and slowly incorporate the liquid mixture into the dry ingredients. Increase to the next speed briefly once the flour is mostly absorbed to knead for 30 seconds. Let rest for 15 minutes.", "name": "In the bowl of a stand mixer, combine the all-purpose and whole wheat flours. In a separate bowl, whisk together the milk, egg, and sourdough starter until the mixture is smooth. Using the dough hook, start the mixer on speed 2 and slowly incorporate the liquid mixture into the dry ingredients. Increase to the next speed briefly once the flour is mostly absorbed to knead for 30 seconds. Let rest for 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/#wprm-recipe-49077-step-0-0"}, {"@type": "HowToStep", "text": "Resume mixing on speed 2, adding sugar, salt, and one piece of butter at a time, ensuring each piece is integrated before adding the next. Once all butter is added, increase to speed 4 and knead for 8 minutes until the dough is cohesive, glossy, and pulls from the sides, while remaining tacky.", "name": "Resume mixing on speed 2, adding sugar, salt, and one piece of butter at a time, ensuring each piece is integrated before adding the next. Once all butter is added, increase to speed 4 and knead for 8 minutes until the dough is cohesive, glossy, and pulls from the sides, while remaining tacky.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/#wprm-recipe-49077-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the dough to a bowl, cover it with a damp cloth or seal inside a large plastic bag. Allow to ferment overnight at room temperature (approximately 68–70°F) until it doubles in size and becomes airy—typically 10 hours.", "name": "Transfer the dough to a bowl, cover it with a damp cloth or seal inside a large plastic bag. Allow to ferment overnight at room temperature (approximately 68–70°F) until it doubles in size and becomes airy—typically 10 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/#wprm-recipe-49077-step-0-2"}, {"@type": "HowToStep", "text": "The next morning, gently turn the dough onto a generously floured surface. Pat into a rectangle and cover with a linen towel. Begin the caramel by melting the butter in a saucepan. Stir in the brown sugar, honey, salt, and cream. Bring to a boil, whisking constantly. Reduce to a simmer for 5 minutes until thick and glossy. Pour into a 9×13-inch baking pan and sprinkle pecans over the top. Chill the pan on a rack in the refrigerator for 15–20 minutes.", "name": "The next morning, gently turn the dough onto a generously floured surface. Pat into a rectangle and cover with a linen towel. Begin the caramel by melting the butter in a saucepan. Stir in the brown sugar, honey, salt, and cream. Bring to a boil, whisking constantly. Reduce to a simmer for 5 minutes until thick and glossy. Pour into a 9×13-inch baking pan and sprinkle pecans over the top. Chill the pan on a rack in the refrigerator for 15–20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/#wprm-recipe-49077-step-0-3"}, {"@type": "HowToStep", "text": "Roll the dough into a 16\" x 12\" rectangle using a floured pin. Brush melted butter over the surface, leaving a ½-inch margin along the edges. Combine the brown sugar, cinnamon, and salt, and distribute evenly over the buttered dough.", "name": "Roll the dough into a 16\" x 12\" rectangle using a floured pin. Brush melted butter over the surface, leaving a ½-inch margin along the edges. Combine the brown sugar, cinnamon, and salt, and distribute evenly over the buttered dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/#wprm-recipe-49077-step-0-4"}, {"@type": "HowToStep", "text": "With a bench scraper and floured hands, roll the dough tightly from the long edge into a log, pinching the seam to seal. Slice the log into roughly 2½-inch segments and place cut-side up in the caramel-coated pan.", "name": "With a bench scraper and floured hands, roll the dough tightly from the long edge into a log, pinching the seam to seal. Slice the log into roughly 2½-inch segments and place cut-side up in the caramel-coated pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/#wprm-recipe-49077-step-0-5"}, {"@type": "HowToStep", "text": "Cover the pan with a clean bag or cloth and leave to proof for around 3 hours in a warm area until the rolls expand and touch.", "name": "Cover the pan with a clean bag or cloth and leave to proof for around 3 hours in a warm area until the rolls expand and touch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/#wprm-recipe-49077-step-0-6"}, {"@type": "HowToStep", "text": "Preheat oven to 375°F. Bake for 30–35 minutes until golden and firm in the center. Check for an internal temperature of 205°F if desired.", "name": "Preheat oven to 375°F. Bake for 30–35 minutes until golden and firm in the center. Check for an internal temperature of 205°F if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/#wprm-recipe-49077-step-0-7"}, {"@type": "HowToStep", "text": "Let the pan rest for 5 minutes. Place a piece of parchment larger than the pan over the rolls, then a baking sheet on top. Invert the pan using oven mitts and remove the baking dish carefully. Allow any residual caramel to drip onto the buns.", "name": "Let the pan rest for 5 minutes. Place a piece of parchment larger than the pan over the rolls, then a baking sheet on top. Invert the pan using oven mitts and remove the baking dish carefully. Allow any residual caramel to drip onto the buns.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-sticky-buns-recipe/#wprm-recipe-49077-step-0-8"}], "recipeCategory": ["Breakfast", "Dessert"], "recipeCuisine": ["American"], "keywords": "Sourdough Sticky Buns Recipe"}</script>
