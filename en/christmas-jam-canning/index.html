    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Jam Canning", "author": {"@type": "Person", "name": "BenDes"}, "description": "A festive fruit preserve combining tart cranberries, sweet strawberries, fresh orange, and warming cinnamon. The jam may be stored in the refrigerator or processed in a boiling-water canner for longer storage.", "datePublished": "2018-05-28T06:22:47+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/christmas-jam-canning.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/christmas-jam-canning.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/christmas-jam-canning.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/christmas-jam-canning.png"], "totalTime": "PT10M", "recipeIngredient": ["4 cups white granulated sugar", "Finely grated zest from 1 fresh orange", "1  cinnamon stick (preferably Saigon cinnamon)", "1 pound strawberries (stems removed and fruit chopped)", "1/4 cup water or orange juice", "12 ounces fresh cranberries", "Chopped fruit segments from 1 orange"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the fruit. Rinse the fresh cranberries and strawberries thoroughly under cold running water. Remove the strawberry hulls and cut the berries into pieces.", "name": "Prepare the fruit. Rinse the fresh cranberries and strawberries thoroughly under cold running water. Remove the strawberry hulls and cut the berries into pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-0"}, {"@type": "HowToStep", "text": "Peel the orange and chop the individual segments. Finely grate the zest from the orange.", "name": "Peel the orange and chop the individual segments. Finely grate the zest from the orange.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-1"}, {"@type": "HowToStep", "text": "Place the cranberries, strawberries, orange pieces, and orange zest in a large cooking pot. Pour in 1/4 cup water or orange juice to provide enough liquid for the fruit to begin cooking.", "name": "Place the cranberries, strawberries, orange pieces, and orange zest in a large cooking pot. Pour in 1/4 cup water or orange juice to provide enough liquid for the fruit to begin cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-2"}, {"@type": "HowToStep", "text": "Incorporate the sugar and cinnamon. Add the granulated sugar and cinnamon stick to the prepared fruit mixture. Stir thoroughly to distribute the ingredients.", "name": "Incorporate the sugar and cinnamon. Add the granulated sugar and cinnamon stick to the prepared fruit mixture. Stir thoroughly to distribute the ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-3"}, {"@type": "HowToStep", "text": "Set the pot over medium heat and continue heating, stirring from time to time, until the sugar has dissolved completely.", "name": "Set the pot over medium heat and continue heating, stirring from time to time, until the sugar has dissolved completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-4"}, {"@type": "HowToStep", "text": "Cook the jam. Increase the heat and bring the fruit mixture to a boil. Once boiling, lower the temperature sufficiently to maintain a gentle simmer.", "name": "Cook the jam. Increase the heat and bring the fruit mixture to a boil. Once boiling, lower the temperature sufficiently to maintain a gentle simmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-5"}, {"@type": "HowToStep", "text": "Cook for approximately 10–15 minutes, stirring occasionally so the mixture does not stick to the bottom of the pot. As it cooks, the fruit will soften and break down while the liquid gradually thickens.", "name": "Cook for approximately 10–15 minutes, stirring occasionally so the mixture does not stick to the bottom of the pot. As it cooks, the fruit will soften and break down while the liquid gradually thickens.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-6"}, {"@type": "HowToStep", "text": "Check the consistency by placing a small spoonful of jam onto a chilled plate. The jam is ready when it thickens sufficiently to hold its shape.", "name": "Check the consistency by placing a small spoonful of jam onto a chilled plate. The jam is ready when it thickens sufficiently to hold its shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-7"}, {"@type": "HowToStep", "text": "Alternatively, check the temperature with an instant-read thermometer. At sea level, cook the jam to 220°F. For higher elevations, reduce the target temperature by 1°F for every 500 feet above sea level.", "name": "Alternatively, check the temperature with an instant-read thermometer. At sea level, cook the jam to 220°F. For higher elevations, reduce the target temperature by 1°F for every 500 feet above sea level.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-8"}, {"@type": "HowToStep", "text": "Fill and process the jars. Once the jam reaches the desired consistency, take the pot off the heat.", "name": "Fill and process the jars. Once the jam reaches the desired consistency, take the pot off the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-9"}, {"@type": "HowToStep", "text": "Carefully ladle the hot jam into sterilized canning jars, allowing 1/4 inch of headspace at the top of each jar. Wipe the rims clean and secure each jar with a two-piece canning lid.", "name": "Carefully ladle the hot jam into sterilized canning jars, allowing 1/4 inch of headspace at the top of each jar. Wipe the rims clean and secure each jar with a two-piece canning lid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-10"}, {"@type": "HowToStep", "text": "For shelf-stable storage, place the filled jars in a boiling-water bath canner and process for 10 minutes. At elevations above 6,000 feet, process the jars for 15 minutes.", "name": "For shelf-stable storage, place the filled jars in a boiling-water bath canner and process for 10 minutes. At elevations above 6,000 feet, process the jars for 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-11"}, {"@type": "HowToStep", "text": "For refrigerator jam, transfer the finished preserve into jars, allow them to cool, and store them in the refrigerator instead of processing them in a water-bath canner.", "name": "For refrigerator jam, transfer the finished preserve into jars, allow them to cool, and store them in the refrigerator instead of processing them in a water-bath canner.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-12"}, {"@type": "HowToStep", "text": "Cool and store. Leave the jars undisturbed at room temperature until completely cool. After cooling, inspect each jar to confirm that a proper seal has formed.", "name": "Cool and store. Leave the jars undisturbed at room temperature until completely cool. After cooling, inspect each jar to confirm that a proper seal has formed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-13"}, {"@type": "HowToStep", "text": "Keep correctly sealed jars in a cool, dark storage area for up to 12–18 months. Refrigerate the jam after opening.", "name": "Keep correctly sealed jars in a cool, dark storage area for up to 12–18 months. Refrigerate the jam after opening.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-jam-canning/#wprm-recipe-42801-step-0-14"}], "recipeCategory": ["Jam"], "recipeCuisine": ["American"], "keywords": "Christmas Jam Canning"}</script>
