    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Broccoli and Cream Cheese Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "This broccoli and cream cheese casserole combines crisp-tender broccoli with a rich blend of cream cheese, sour cream, cheddar, Parmesan, garlic, and Italian seasoning. Baked until bubbling with a lightly browned surface, it makes a creamy and flavorful vegetable casserole with an optional red pepper garnish for added heat.", "datePublished": "2023-08-10T17:19:36+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/broccoli-and-cream-cheese-casserole2.png", "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/broccoli-and-cream-cheese-casserole2.png", "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/broccoli-and-cream-cheese-casserole2.png", "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/broccoli-and-cream-cheese-casserole2.png"], "cookTime": "PT17M", "totalTime": "PT22M", "recipeIngredient": ["8 ounces cream cheese (softened to room temperature and cut into cubes)", "1/4 teaspoon ground black pepper", "1 1/2 pounds fresh broccoli florets (preferably fresh for the best texture)", "2  fresh garlic cloves (finely minced)", "1/4 cup finely grated Parmesan cheese", "Salt (added according to taste)", "1 cup shredded cheddar cheese", "1 teaspoon Italian seasoning (or adjusted to taste)", "1/4 cup full-fat sour cream", "Crushed red pepper flakes (optional, for garnishing)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the oven and baking dish. Preheat the oven to 350°F. Lightly coat a 2.5- to 3-quart baking dish with butter and set it aside.", "name": "Prepare the oven and baking dish. Preheat the oven to 350°F. Lightly coat a 2.5- to 3-quart baking dish with butter and set it aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/#wprm-recipe-45836-step-0-0"}, {"@type": "HowToStep", "text": "Cook the broccoli. Pour approximately 1/2 inch of water into a large skillet, season the water with salt, and bring it to a boil. Add the broccoli florets, cover the skillet, and cook over high heat for 3 to 4 minutes, or until the broccoli reaches a crisp-tender consistency.", "name": "Cook the broccoli. Pour approximately 1/2 inch of water into a large skillet, season the water with salt, and bring it to a boil. Add the broccoli florets, cover the skillet, and cook over high heat for 3 to 4 minutes, or until the broccoli reaches a crisp-tender consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/#wprm-recipe-45836-step-0-1"}, {"@type": "HowToStep", "text": "Drain the broccoli. Thoroughly drain the cooked florets, then transfer them directly to the prepared baking dish.", "name": "Drain the broccoli. Thoroughly drain the cooked florets, then transfer them directly to the prepared baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/#wprm-recipe-45836-step-0-2"}, {"@type": "HowToStep", "text": "Prepare the creamy cheese mixture. While the broccoli cools slightly, place the softened, cubed cream cheese in a mixing bowl with the sour cream, shredded cheddar, grated Parmesan, minced garlic, Italian seasoning, salt, and black pepper. Stir until all ingredients are thoroughly combined and evenly incorporated. Allowing the cream cheese to reach room temperature helps it blend smoothly with the remaining ingredients.", "name": "Prepare the creamy cheese mixture. While the broccoli cools slightly, place the softened, cubed cream cheese in a mixing bowl with the sour cream, shredded cheddar, grated Parmesan, minced garlic, Italian seasoning, salt, and black pepper. Stir until all ingredients are thoroughly combined and evenly incorporated. Allowing the cream cheese to reach room temperature helps it blend smoothly with the remaining ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/#wprm-recipe-45836-step-0-3"}, {"@type": "HowToStep", "text": "Coat the broccoli. Spoon the prepared cheese mixture over the broccoli in the baking dish. Stir carefully but thoroughly until the florets are evenly covered with the creamy cheese mixture.", "name": "Coat the broccoli. Spoon the prepared cheese mixture over the broccoli in the baking dish. Stir carefully but thoroughly until the florets are evenly covered with the creamy cheese mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/#wprm-recipe-45836-step-0-4"}, {"@type": "HowToStep", "text": "Bake the casserole. Place the dish in the preheated oven and bake for 17 to 20 minutes, or until the cheese mixture is bubbling and the top has developed a light golden-brown color.", "name": "Bake the casserole. Place the dish in the preheated oven and bake for 17 to 20 minutes, or until the cheese mixture is bubbling and the top has developed a light golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/#wprm-recipe-45836-step-0-5"}, {"@type": "HowToStep", "text": "Rest before serving. Remove the casserole from the oven and allow it to stand for approximately 5 minutes before serving. This brief resting period allows the mixture to settle and the flavors to meld.", "name": "Rest before serving. Remove the casserole from the oven and allow it to stand for approximately 5 minutes before serving. This brief resting period allows the mixture to settle and the flavors to meld.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/#wprm-recipe-45836-step-0-6"}, {"@type": "HowToStep", "text": "Garnish. If desired, scatter crushed red pepper flakes over the casserole immediately before serving to provide a subtle touch of heat and color.", "name": "Garnish. If desired, scatter crushed red pepper flakes over the casserole immediately before serving to provide a subtle touch of heat and color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cream-cheese-casserole/#wprm-recipe-45836-step-0-7"}], "recipeCategory": ["Casserole", "Side Dish"], "recipeCuisine": ["American"], "keywords": "Broccoli and Cream Cheese Casserole"}</script>
