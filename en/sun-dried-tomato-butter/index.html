    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sun-Dried Tomato Butter", "author": {"@type": "Person", "name": "BenDes"}, "description": "A savory compound butter enriched with finely chopped sun-dried tomatoes, fresh herbs, sea salt, and cracked black pepper. The finished butter may be stored in a container or formed into a log for convenient slicing and serving.", "datePublished": "2020-02-04T11:27:37+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/sun-dried-tomato-butter2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/sun-dried-tomato-butter2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/sun-dried-tomato-butter2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/sun-dried-tomato-butter2.png"], "recipeIngredient": ["1/4 cup finely minced fresh herbs (such as parsley, chives, basil, thyme, or rosemary)", "1 teaspoon freshly cracked black pepper", "1/2 cup unsalted butter (softened to room temperature)", "4 tablespoons oil-packed sun-dried tomatoes (thoroughly drained and finely chopped)", "1/2 teaspoon sea salt", "Optional herb variations: Green onions (tarragon, oregano, dill, sage, or additional chives may be incorporated for variety.)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Set the 1/2 cup of unsalted butter at room temperature for a few hours, allowing it to soften completely.", "name": "Set the 1/2 cup of unsalted butter at room temperature for a few hours, allowing it to soften completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-0"}, {"@type": "HowToStep", "text": "For quicker and more even softening, cut the butter into small cubes before leaving it at room temperature.", "name": "For quicker and more even softening, cut the butter into small cubes before leaving it at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-1"}, {"@type": "HowToStep", "text": "Using clean kitchen scissors, finely snip and mince the fresh herbs and the 4 tablespoons of drained sun-dried tomatoes.", "name": "Using clean kitchen scissors, finely snip and mince the fresh herbs and the 4 tablespoons of drained sun-dried tomatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-2"}, {"@type": "HowToStep", "text": "Place the chopped tomatoes and herbs in a small mug or glass jar, combining them until both ingredients are finely prepared and evenly distributed.", "name": "Place the chopped tomatoes and herbs in a small mug or glass jar, combining them until both ingredients are finely prepared and evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-3"}, {"@type": "HowToStep", "text": "If desired, include a combination of green onions, tarragon, chives, oregano, dill, or sage alongside the other herbs for additional variety.", "name": "If desired, include a combination of green onions, tarragon, chives, oregano, dill, or sage alongside the other herbs for additional variety.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the softened butter to a small bowl and add the finely chopped sun-dried tomatoes and herbs.", "name": "Transfer the softened butter to a small bowl and add the finely chopped sun-dried tomatoes and herbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-5"}, {"@type": "HowToStep", "text": "Season with 1/2 teaspoon sea salt and 1 teaspoon freshly cracked black pepper. If salted butter is used instead, omit the additional sea salt as preferred.", "name": "Season with 1/2 teaspoon sea salt and 1 teaspoon freshly cracked black pepper. If salted butter is used instead, omit the additional sea salt as preferred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-6"}, {"@type": "HowToStep", "text": "Blend the ingredients thoroughly with a spatula until the butter is smooth and the herbs, tomatoes, and seasonings are evenly incorporated.", "name": "Blend the ingredients thoroughly with a spatula until the butter is smooth and the herbs, tomatoes, and seasonings are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-7"}, {"@type": "HowToStep", "text": "Taste the mixture at this stage and adjust the amount of herbs or salt if necessary.", "name": "Taste the mixture at this stage and adjust the amount of herbs or salt if necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the prepared butter to a small airtight container with a fitted lid. Refrigerate for up to one week.", "name": "Transfer the prepared butter to a small airtight container with a fitted lid. Refrigerate for up to one week.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-9"}, {"@type": "HowToStep", "text": "Alternatively, spoon the butter onto a sheet of parchment paper, shape it into a log, then roll the parchment around it and twist both ends closed. Refrigerate for regular use or freeze for longer storage.", "name": "Alternatively, spoon the butter onto a sheet of parchment paper, shape it into a log, then roll the parchment around it and twist both ends closed. Refrigerate for regular use or freeze for longer storage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-10"}, {"@type": "HowToStep", "text": "For a decorative presentation, coat the outside of the butter log with additional finely chopped herbs before wrapping it in parchment paper.", "name": "For a decorative presentation, coat the outside of the butter log with additional finely chopped herbs before wrapping it in parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-butter/#wprm-recipe-42316-step-0-11"}], "keywords": "Sun-Dried Tomato Butter"}</script>
