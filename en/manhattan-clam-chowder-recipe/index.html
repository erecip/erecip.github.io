    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Manhattan Clam Chowder Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A robust and flavorful chowder brimming with tender clams, smoky bacon, fresh vegetables, and hearty potatoes, all enveloped in a rich tomato-infused broth. Ideal as a warming starter or a satisfying main course.", "datePublished": "2024-10-16T14:01:03+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/manhattan-clam-chowder-recipe/Manhattan-Clam-Chowder-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/manhattan-clam-chowder-recipe/Manhattan-Clam-Chowder-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/manhattan-clam-chowder-recipe/Manhattan-Clam-Chowder-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/manhattan-clam-chowder-recipe/Manhattan-Clam-Chowder-Recipe1.png"], "recipeYield": ["6"], "prepTime": "PT20M", "cookTime": "PT45M", "totalTime": "PT65M", "recipeIngredient": ["1  bay leaf", "2 8- ounce bottles clam juice", "1/2 teaspoon dried thyme", "6 slices bacon (chopped)", "2 tablespoons chopped parsley", "10- ounce can whole baby clams (drained)", "28- ounce can diced tomatoes (undrained)", "2 cups chicken broth", "1/4 cup tomato paste", "2  carrots (peeled, quartered, and sliced)", "1 pound Russet potatoes (peeled and diced into 1/2-inch cubes)", "1/2 cup onion (diced)", "1/2 cup celery (sliced)", "2 teaspoons minced garlic", "Salt and pepper (to taste)", "Oyster crackers and additional cooked bacon (for serving (optional))"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm a large pot over medium heat and render the bacon until crisp, stirring occasionally. Lift the bacon pieces from the pot and set aside on paper towels to drain. Introduce the diced onions, sliced carrots, and celery into the pot, seasoning with salt and pepper as needed. Sauté, stirring now and then, for about 6–8 minutes until the vegetables soften. Add the minced garlic and cook for an additional 30 seconds until fragrant. Incorporate the tomato paste, dried thyme, bay leaf, clam juice, chicken broth, and diced potatoes. Blend thoroughly and bring the mixture to a gentle simmer. Let it cook for 10–15 minutes, or until the potatoes yield to a fork. Fold in the diced tomatoes and drained baby clams, adjusting the seasoning with salt and pepper if necessary. Allow the chowder to simmer for 5 minutes more, then stir in the reserved bacon. Garnish with chopped parsley, add oyster crackers and extra bacon if desired, and serve piping hot.", "name": "Warm a large pot over medium heat and render the bacon until crisp, stirring occasionally. Lift the bacon pieces from the pot and set aside on paper towels to drain. Introduce the diced onions, sliced carrots, and celery into the pot, seasoning with salt and pepper as needed. Sauté, stirring now and then, for about 6–8 minutes until the vegetables soften. Add the minced garlic and cook for an additional 30 seconds until fragrant. Incorporate the tomato paste, dried thyme, bay leaf, clam juice, chicken broth, and diced potatoes. Blend thoroughly and bring the mixture to a gentle simmer. Let it cook for 10–15 minutes, or until the potatoes yield to a fork. Fold in the diced tomatoes and drained baby clams, adjusting the seasoning with salt and pepper if necessary. Allow the chowder to simmer for 5 minutes more, then stir in the reserved bacon. Garnish with chopped parsley, add oyster crackers and extra bacon if desired, and serve piping hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/manhattan-clam-chowder-recipe/#wprm-recipe-15314-step-0-0"}], "recipeCategory": ["Soup"], "recipeCuisine": ["American"], "keywords": "Manhattan Clam Chowder Recipe"}</script>
