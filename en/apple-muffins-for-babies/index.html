    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Apple Muffins for Babies", "author": {"@type": "Person", "name": "BenDes"}, "description": "A soft, naturally sweet mini muffin made with ripe banana, grated apple, carrot, whole grains, and warm cinnamon. These tender muffins are sized for small hands and can be served in age-appropriate pieces for babies who are ready for finger foods.", "datePublished": "2022-10-20T21:18:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/apple-muffins-for-babies/apple-muffins-for-babies2-1.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-muffins-for-babies/apple-muffins-for-babies2-1.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-muffins-for-babies/apple-muffins-for-babies2-1.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-muffins-for-babies/apple-muffins-for-babies2-1.png"], "cookTime": "PT20M", "recipeIngredient": ["¾ cup milk", "½ cup finely shredded apple (approximately 1 small apple)", "1 teaspoon ground cinnamon", "1  large egg (brought to room temperature)", "1 cup whole-wheat flour", "¼ cup unsalted butter (melted and allowed to cool slightly)", "1 cup thoroughly mashed ripe banana (approximately 2–3 small bananas)", "½ teaspoon baking soda", "¼ cup carrot (finely grated for a smoother consistency)", "1 teaspoon vanilla extract", "½ cup old-fashioned rolled oats", "⅛ teaspoon salt", "1 teaspoon baking powder"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the oven and muffin pan. Preheat the oven to 375°F (190°C). Lightly coat a 24-cavity mini muffin pan with nonstick cooking spray.", "name": "Prepare the oven and muffin pan. Preheat the oven to 375°F (190°C). Lightly coat a 24-cavity mini muffin pan with nonstick cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-muffins-for-babies/#wprm-recipe-42832-step-0-0"}, {"@type": "HowToStep", "text": "Mix the wet ingredients. Place the mashed banana, shredded apple, finely grated carrot, milk, melted and slightly cooled butter, egg, and vanilla extract in a medium mixing bowl. Stir until the ingredients are evenly combined and the mixture is cohesive.", "name": "Mix the wet ingredients. Place the mashed banana, shredded apple, finely grated carrot, milk, melted and slightly cooled butter, egg, and vanilla extract in a medium mixing bowl. Stir until the ingredients are evenly combined and the mixture is cohesive.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-muffins-for-babies/#wprm-recipe-42832-step-0-1"}, {"@type": "HowToStep", "text": "Add the dry ingredients. Incorporate the whole-wheat flour, rolled oats, cinnamon, baking powder, baking soda, and salt into the wet mixture. Fold gently but thoroughly, stopping as soon as no visible pockets of dry flour remain. Avoid excessive mixing to help preserve a tender muffin texture.", "name": "Add the dry ingredients. Incorporate the whole-wheat flour, rolled oats, cinnamon, baking powder, baking soda, and salt into the wet mixture. Fold gently but thoroughly, stopping as soon as no visible pockets of dry flour remain. Avoid excessive mixing to help preserve a tender muffin texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-muffins-for-babies/#wprm-recipe-42832-step-0-2"}, {"@type": "HowToStep", "text": "Portion the batter. Distribute the batter evenly among the prepared mini muffin cavities. Fill each cup to the edge, using approximately 2 tablespoons of batter per muffin.", "name": "Portion the batter. Distribute the batter evenly among the prepared mini muffin cavities. Fill each cup to the edge, using approximately 2 tablespoons of batter per muffin.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-muffins-for-babies/#wprm-recipe-42832-step-0-3"}, {"@type": "HowToStep", "text": "Bake. Transfer the pan to the preheated oven and bake for 16–20 minutes. The muffins are ready when a cake tester inserted into the center comes out clean. An 18-minute baking time falls within the recommended range.", "name": "Bake. Transfer the pan to the preheated oven and bake for 16–20 minutes. The muffins are ready when a cake tester inserted into the center comes out clean. An 18-minute baking time falls within the recommended range.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-muffins-for-babies/#wprm-recipe-42832-step-0-4"}, {"@type": "HowToStep", "text": "Cool. Leave the muffins in the pan for several minutes before moving them to a wire cooling rack. Allow them to cool completely before serving.", "name": "Cool. Leave the muffins in the pan for several minutes before moving them to a wire cooling rack. Allow them to cool completely before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-muffins-for-babies/#wprm-recipe-42832-step-0-5"}], "recipeCategory": ["Breakfast", "Snack"], "keywords": "Apple Muffins for Babies"}</script>
