    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pesto Pasta Salad", "author": {"@type": "Person", "name": "BenDes"}, "description": "A vibrant and flavorful pasta salad featuring fresh basil pesto, creamy bocconcini, and juicy cherry tomatoes. A touch of mayonnaise lends subtle creaminess without making the dish heavy, while preserving texture and moisture for next-day enjoyment. Perfect as a light main or a refreshing side for gatherings.", "datePublished": "2024-05-25T04:21:06+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pesto-pasta-salad/pesto-pasta-salad.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/pesto-pasta-salad/pesto-pasta-salad.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/pesto-pasta-salad/pesto-pasta-salad.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/pesto-pasta-salad/pesto-pasta-salad.jpg"], "prepTime": "PT15M", "cookTime": "PT15M", "totalTime": "PT30M", "recipeIngredient": ["1 cup tightly packed baby arugula (rocket) leaves (approx. 40g)", "2 tablespoons mayonnaise (preferably S&W or Hellman’s)", "220 g 7 oz baby bocconcini, halved and drained", "250 g heaped 1 cup cherry tomatoes, halved", "350 g 12 oz spiral pasta such as fusilli (approx. 3½ cups)", "1 tablespoon salt (for boiling pasta)", "Small basil leaves (for garnish (optional))", "½ teaspoon cooking or kosher salt", "½ teaspoon cooking or kosher salt", "½ cup finely grated parmesan cheese", "2 tablespoons toasted pinenuts (or substitute walnuts, cashews, almonds)", "2 cups tightly packed fresh basil leaves", "7 tablespoons extra virgin olive oil (or 50/50 blend with grapeseed oil)", "¼ teaspoon black pepper", "1  small garlic clove (minced)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring 3 litres of water to a rolling boil and add the salt. Cook the pasta according to package instructions, plus one additional minute. Drain using a colander, rinse thoroughly under cold water, and shake off any excess moisture. Allow the pasta to fully cool and dry.", "name": "Bring 3 litres of water to a rolling boil and add the salt. Cook the pasta according to package instructions, plus one additional minute. Drain using a colander, rinse thoroughly under cold water, and shake off any excess moisture. Allow the pasta to fully cool and dry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pesto-pasta-salad/#wprm-recipe-31187-step-0-0"}, {"@type": "HowToStep", "text": "To prepare the pesto, combine basil leaves, parmesan, toasted pinenuts, garlic, salt, pepper, and olive oil in a narrow container suitable for an immersion blender. Blend until mostly smooth—aim for a textured consistency with small green flecks rather than a completely uniform puree.", "name": "To prepare the pesto, combine basil leaves, parmesan, toasted pinenuts, garlic, salt, pepper, and olive oil in a narrow container suitable for an immersion blender. Blend until mostly smooth—aim for a textured consistency with small green flecks rather than a completely uniform puree.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pesto-pasta-salad/#wprm-recipe-31187-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the cooled pasta into a large mixing bowl. Spoon in the prepared pesto and add the mayonnaise. Toss thoroughly to coat all the pasta. Gently mix in the halved bocconcini and cherry tomatoes, stirring just enough to distribute evenly. Add the arugula and lightly fold through to incorporate.", "name": "Transfer the cooled pasta into a large mixing bowl. Spoon in the prepared pesto and add the mayonnaise. Toss thoroughly to coat all the pasta. Gently mix in the halved bocconcini and cherry tomatoes, stirring just enough to distribute evenly. Add the arugula and lightly fold through to incorporate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pesto-pasta-salad/#wprm-recipe-31187-step-0-2"}, {"@type": "HowToStep", "text":
