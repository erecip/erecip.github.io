    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Scalloped Red Potatoes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Thinly sliced red potatoes and sweet onion are layered with a smooth, richly seasoned cheddar-Parmesan sauce, then baked until the potatoes become tender and the sauce is hot and bubbling. A brief resting period allows the creamy layers to settle before serving.", "datePublished": "2021-05-25T14:40:26+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/scalloped-red-potatoes1.png", "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/scalloped-red-potatoes1.png", "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/scalloped-red-potatoes1.png", "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/scalloped-red-potatoes1.png"], "cookTime": "PT45M", "totalTime": "PT55M", "recipeIngredient": ["2 cups 2% milk", "1/2 teaspoon dried thyme", "2/3 cup Parmesan cheese (freshly grated)", "1 1/2 pounds red potatoes (cut into 1/8-inch-thick slices)", "1/8 teaspoon freshly ground black pepper", "3 tablespoons unsalted butter", "1 1/4 cups sharp or extra-sharp cheddar cheese (shredded)", "3/4 cup sweet yellow onion (chopped)", "1 teaspoon dried parsley", "1/2 teaspoon fine salt", "3 tablespoons all-purpose flour", "1/8 teaspoon ground paprika", "1/2 teaspoon garlic powder"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F (200°C). If necessary, slice the red potatoes into uniform 1/8-inch-thick rounds and finely chop the sweet yellow onion. Shred the cheddar and Parmesan cheeses if they have not already been prepared.", "name": "Preheat the oven to 400°F (200°C). If necessary, slice the red potatoes into uniform 1/8-inch-thick rounds and finely chop the sweet yellow onion. Shred the cheddar and Parmesan cheeses if they have not already been prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-0"}, {"@type": "HowToStep", "text": "Place a medium saucepan over medium heat and melt the butter until it begins to bubble gently.", "name": "Place a medium saucepan over medium heat and melt the butter until it begins to bubble gently.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-1"}, {"@type": "HowToStep", "text": "Add the flour, dried parsley, garlic powder, dried thyme, salt, paprika, and black pepper to the melted butter. Stir continuously until thoroughly combined, then cook the mixture for approximately 1 minute, keeping it moving so the roux bubbles without browning.", "name": "Add the flour, dried parsley, garlic powder, dried thyme, salt, paprika, and black pepper to the melted butter. Stir continuously until thoroughly combined, then cook the mixture for approximately 1 minute, keeping it moving so the roux bubbles without browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-2"}, {"@type": "HowToStep", "text": "Reduce the heat to low. Gradually pour the milk into the roux while stirring constantly to maintain a smooth consistency and prevent lumps from forming.", "name": "Reduce the heat to low. Gradually pour the milk into the roux while stirring constantly to maintain a smooth consistency and prevent lumps from forming.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-3"}, {"@type": "HowToStep", "text": "After all the milk has been incorporated, return the heat to medium and bring the mixture to a gentle simmer. Continue stirring until the sauce thickens, approximately 1 minute.", "name": "After all the milk has been incorporated, return the heat to medium and bring the mixture to a gentle simmer. Continue stirring until the sauce thickens, approximately 1 minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-4"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Add the shredded cheddar and grated Parmesan, stirring until both cheeses have melted completely and the sauce is thick, smooth, and evenly blended.", "name": "Remove the saucepan from the heat. Add the shredded cheddar and grated Parmesan, stirring until both cheeses have melted completely and the sauce is thick, smooth, and evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-5"}, {"@type": "HowToStep", "text": "Lightly coat a 9 × 13-inch baking dish with butter or cooking spray.", "name": "Lightly coat a 9 × 13-inch baking dish with butter or cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-6"}, {"@type": "HowToStep", "text": "Spread half of the sliced red potatoes across the bottom of the prepared dish in an even layer. Distribute all of the chopped onion over the potatoes.", "name": "Spread half of the sliced red potatoes across the bottom of the prepared dish in an even layer. Distribute all of the chopped onion over the potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-7"}, {"@type": "HowToStep", "text": "Pour approximately half of the cheese sauce over the potato-and-onion layer, spreading it evenly so the vegetables are well coated.", "name": "Pour approximately half of the cheese sauce over the potato-and-onion layer, spreading it evenly so the vegetables are well coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-8"}, {"@type": "HowToStep", "text": "Arrange the remaining potato slices over the first layer. Pour the rest of the cheese sauce across the top, ensuring the potatoes are thoroughly covered.", "name": "Arrange the remaining potato slices over the first layer. Pour the rest of the cheese sauce across the top, ensuring the potatoes are thoroughly covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-9"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 45–55 minutes, or until the sauce is bubbling and the potato slices are tender when pierced with a fork.", "name": "Bake in the preheated oven for 45–55 minutes, or until the sauce is bubbling and the potato slices are tender when pierced with a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-10"}, {"@type": "HowToStep", "text": "For a more deeply browned, bubbling surface, broil the dish for an additional 2 minutes at the end of baking, watching it closely to prevent scorching.", "name": "For a more deeply browned, bubbling surface, broil the dish for an additional 2 minutes at the end of baking, watching it closely to prevent scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-11"}, {"@type": "HowToStep", "text": "Allow the scalloped potatoes to rest for approximately 10 minutes before serving so the sauce can settle slightly and the layers are easier to portion.", "name": "Allow the scalloped potatoes to rest for approximately 10 minutes before serving so the sauce can settle slightly and the layers are easier to portion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-red-potatoes/#wprm-recipe-46149-step-0-12"}], "recipeCategory": ["Side Dish"], "keywords": "Scalloped Red Potatoes"}</script>
