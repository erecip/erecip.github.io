    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies with Dates", "author": {"@type": "Person", "name": "BenDes"}, "description": "These festive Christmas cookies combine tender, warmly spiced dough with naturally sweet chopped dates and crunchy pecans. A light scattering of granulated sugar over the surface creates a delicately sweet finish, while cinnamon, nutmeg, and cloves provide classic holiday flavor.", "datePublished": "2019-01-22T06:32:54+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-dates/christmas-cookies-with-dates2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-dates/christmas-cookies-with-dates2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-dates/christmas-cookies-with-dates2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-dates/christmas-cookies-with-dates2.png"], "cookTime": "PT16M", "totalTime": "PT18M", "recipeIngredient": ["3 cups plain all-purpose flour", "1/4 teaspoon finely ground cinnamon", "1 1/2 teaspoons baking powder", "1/4 teaspoon ground cloves", "1/4 teaspoon fine salt", "1/4 teaspoon ground nutmeg (preferably freshly grated for fuller flavor)", "1/2 cup packed light brown sugar", "2  large eggs (brought to room temperature to encourage smoother incorporation)", "1 cup unsalted butter", "1 teaspoon vanilla essence", "1 cup granulated white sugar", "2 1/2 cups pecans (chopped)", "2 1/2 cups pitted dates (finely chopped to distribute them evenly through the dough)", "2 tablespoons granulated white sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 325°F (163°C). Cover the baking sheets with parchment paper or silicone baking mats to prevent sticking and make the baked cookies easier to lift from the pans.", "name": "Preheat the oven to 325°F (163°C). Cover the baking sheets with parchme
