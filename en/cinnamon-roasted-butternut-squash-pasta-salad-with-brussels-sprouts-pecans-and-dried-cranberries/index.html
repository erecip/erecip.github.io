    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cinnamon Roasted Butternut Squash Pasta Salad with Brussels Sprouts Pecans and Dried Cranberries", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty pasta salad combining cinnamon-maple roasted butternut squash, caramelized Brussels sprouts, toasted pecans, and chewy dried cranberries. A balsamic finish brings a pleasant tang that balances the natural sweetness of the roasted vegetables and fruit. Serve the salad warm or at room temperature.", "datePublished": "2021-04-30T05:39:13+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries1.png", "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries1.png", "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries1.png", "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries1.png"], "prepTime": "PT15M", "cookTime": "PT25M", "totalTime": "PT40M", "recipeIngredient": ["12 oz Brussels sprouts (ends trimmed and sprouts sliced lengthwise into halves)", "2 tablespoons maple syrup", "1/2 teaspoon ground cinnamon", "1 lb butternut squash (peeled and seeded, then cut into 1-inch cubes)", "1/4 teaspoon salt", "2 tablespoons olive oil (for roasting the Brussels sprouts)", "1 tablespoon olive oil (for coating the butternut squash)", "8 oz dry pasta (such as rotini or penne)", "1 cup pecan halves (lightly toasted)", "1/2 cup dried cranberries", "3 tablespoons balsamic vinegar or balsamic glaze", "2 tablespoons extra-virgin olive oil (optional when using balsamic vinegar)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 400°F (200°C) and cover a baking sheet with parchment paper.", "name": "Heat the oven to 400°F (200°C) and cover a baking sheet with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-0"}, {"@type": "HowToStep", "text": "Place the halved Brussels sprouts in a medium bowl. Add 2 tablespoons olive oil and 1/4 teaspoon salt, tossing until the sprouts are evenly coated.", "name": "Place the halved Brussels sprouts in a medium bowl. Add 2 tablespoons olive oil and 1/4 teaspoon salt, tossing until the sprouts are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-1"}, {"@type": "HowToStep", "text": "Position the Brussels sprouts on the prepared pan with their cut surfaces facing downward. Roast for 20–25 minutes, or until the undersides are deeply browned and lightly charred without becoming blackened.", "name": "Position the Brussels sprouts on the prepared pan with their cut surfaces facing downward. Roast for 20–25 minutes, or until the undersides are deeply browned and lightly charred without becoming blackened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-2"}, {"@type": "HowToStep", "text": "While the Brussels sprouts cook, place the cubed butternut squash in a separate bowl. Add 1 tablespoon olive oil, 2 tablespoons maple syrup, and 1/2 teaspoon cinnamon.", "name": "While the Brussels sprouts cook, place the cubed butternut squash in a separate bowl. Add 1 tablespoon olive oil, 2 tablespoons maple syrup, and 1/2 teaspoon cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-3"}, {"@type": "HowToStep", "text": "Toss thoroughly so the squash pieces are coated on all sides. Arrange them in one layer on a second parchment-lined baking sheet.", "name": "Toss thoroughly so the squash pieces are coated on all sides. Arrange them in one layer on a second parchment-lined baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-4"}, {"@type": "HowToStep", "text": "Roast at 400°F (200°C) for approximately 20–25 minutes, until the squash is tender. Both vegetables may be roasted simultaneously on one sufficiently large baking sheet if there is enough room to keep them well spread out.", "name": "Roast at 400°F (200°C) for approximately 20–25 minutes, until the squash is tender. Both vegetables may be roasted simultaneously on one sufficiently large baking sheet if there is enough room to keep them well spread out.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-5"}, {"@type": "HowToStep", "text": "While the vegetables roast, bring a large pot of water to a rolling boil. Add the dry pasta and cook according to the package directions, generally about 10–12 minutes, until al dente.", "name": "While the vegetables roast, bring a large pot of water to a rolling boil. Add the dry pasta and cook according to the package directions, generally about 10–12 minutes, until al dente.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-6"}, {"@type": "HowToStep", "text": "Drain the pasta thoroughly and set it aside. If desired for a pasta salad, briefly rinse it with a small amount of cold water to help prevent the pieces from sticking together.", "name": "Drain the pasta thoroughly and set it aside. If desired for a pasta salad, briefly rinse it with a small amount of cold water to help prevent the pieces from sticking together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-7"}, {"@type": "HowToStep", "text": "Lower the oven temperature to 350°F (175°C). Arrange the pecan halves in a single layer on a baking sheet.", "name": "Lower the oven temperature to 350°F (175°C). Arrange the pecan halves in a single layer on a baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-8"}, {"@type": "HowToStep", "text": "Toast for about 5 minutes, watching carefully, until the pecans become slightly darker and aromatic. Remove them promptly to prevent burning and allow them to cool briefly.", "name": "Toast for about 5 minutes, watching carefully, until the pecans become slightly darker and aromatic. Remove them promptly to prevent burning and allow them to cool briefly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the cooked pasta to a large mixing bowl. Add the roasted Brussels sprouts, cinnamon-maple butternut squash, toasted pecans, and dried cranberries.", "name": "Transfer the cooked pasta to a large mixing bowl. Add the roasted Brussels sprouts, cinnamon-maple butternut squash, toasted pecans, and dried cranberries.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-10"}, {"@type": "HowToStep", "text": "Fold the ingredients together gently until evenly distributed, taking care not to crush or break apart the tender roasted vegetables.", "name": "Fold the ingredients together gently until evenly distributed, taking care not to crush or break apart the tender roasted vegetables.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-11"}, {"@type": "HowToStep", "text": "For a classic balsamic dressing, whisk 3 tablespoons balsamic vinegar with the optional 2 tablespoons extra-virgin olive oil. Alternatively, use balsamic glaze on its own for a sweeter, more concentrated finish.", "name": "For a classic balsamic dressing, whisk 3 tablespoons balsamic vinegar with the optional 2 tablespoons extra-virgin olive oil. Alternatively, use balsamic glaze on its own for a sweeter, more concentrated finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-12"}, {"@type": "HowToStep", "text": "Drizzle the chosen dressing over the pasta mixture and toss carefully until the ingredients are lightly coated.", "name": "Drizzle the chosen dressing over the pasta mixture and toss carefully until the ingredients are lightly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-13"}, {"@type": "HowToStep", "text": "Serve immediately while warm, or allow the pasta salad to reach room temperature before serving.", "name": "Serve immediately while warm, or allow the pasta salad to reach room temperature before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roasted-butternut-squash-pasta-salad-with-brussels-sprouts-pecans-and-dried-cranberries/#wprm-recipe-46222-step-0-14"}], "recipeCategory": ["Salad"], "recipeCuisine": ["American"], "keywords": "Cinnamon Roasted Butternut Squash Pasta Salad with Brussels Sprouts Pecans and Dried Cranberries"}</script>
