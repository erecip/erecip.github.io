    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Meringue Pie Tartlets", "author": {"@type": "Person", "name": "BenDes"}, "description": "These individual lemon meringue tartlets feature crisp, buttery pastry shells filled with smooth, brightly flavored lemon curd and finished with a glossy Swiss meringue topping. The meringue is lightly toasted at the end, creating a golden finish that complements the tangy citrus filling.", "datePublished": "2019-03-02T12:10:34+00:00", "image": ["https://erecip.github.io/en/lemon-meringue-pie-tartlets/lemon-meringue-pie-tartlets2.png", "https://erecip.github.io/en/lemon-meringue-pie-tartlets/lemon-meringue-pie-tartlets2.png", "https://erecip.github.io/en/lemon-meringue-pie-tartlets/lemon-meringue-pie-tartlets2.png", "https://erecip.github.io/en/lemon-meringue-pie-tartlets/lemon-meringue-pie-tartlets2.png"], "cookTime": "PT30M", "totalTime": "PT30M", "recipeIngredient": ["1 teaspoon kosher salt", "3 1/4 cups all-purpose flour", "2/3 cup ice-cold water (kept chilled with ice cubes)", "1 cup plus 6 tablespoons unsalted butter (thoroughly chilled and cut into small pieces)", "3 tablespoons finely grated fresh lemon zest (approximately from 3 medium lemons)", "3  large eggs", "6 tablespoons unsalted butter (softened to room temperature)", "1/3 cup freshly squeezed lemon juice", "1/2 cup granulated sugar", "Pinch of salt", "1 teaspoon vanilla extract or vanilla paste", "2  large egg whites", "1/2 cup granulated sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place 2/3 cup ice water in a small bowl with several ice cubes and keep it nearby while preparing the pastry.", "name": "Place 2/3 cup ice water in a small bowl with several ice cubes and keep it nearby while preparing the pastry.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-0"}, {"@type": "HowToStep", "text": "Add the all-purpose flour and kosher salt to the bowl of a food processor.", "name": "Add the all-purpose flour and kosher salt to the bowl of a food processor.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-1"}, {"@type": "HowToStep", "text": "Cut the chilled butter into approximately 1-inch pieces and scatter them evenly over the flour mixture.", "name": "Cut the chilled butter into approximately 1-inch pieces and scatter them evenly over the flour mixture.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-2"}, {"@type": "HowToStep", "text": "Pulse the mixture until the butter has broken down into pieces roughly the size of peas.", "name": "Pulse the mixture until the butter has broken down into pieces roughly the size of peas.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-3"}, {"@type": "HowToStep", "text": "Add the chilled water gradually, pulsing between additions, just until the dough begins to hold together. Small visible pieces of butter should remain throughout the dough.", "name": "Add the chilled water gradually, pulsing between additions, just until the dough begins to hold together. Small visible pieces of butter should remain throughout the dough.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the dough from the processor and shape it into a disc approximately 1 inch thick. Wrap the disc securely in plastic wrap.", "name": "Transfer the dough from the processor and shape it into a disc approximately 1 inch thick. Wrap the disc securely in plastic wrap.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-5"}, {"@type": "HowToStep", "text": "Refrigerate the pastry for 2 hours so the dough can become fully hydrated and properly chilled.", "name": "Refrigerate the pastry for 2 hours so the dough can become fully hydrated and properly chilled.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-6"}, {"@type": "HowToStep", "text": "Once the dough has chilled, lightly dust both the work surface and rolling pin with flour.", "name": "Once the dough has chilled, lightly dust both the work surface and rolling pin with flour.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-7"}, {"@type": "HowToStep", "text": "Roll the pastry into an even sheet approximately 1/4 inch thick.", "name": "Roll the pastry into an even sheet approximately 1/4 inch thick.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-8"}, {"@type": "HowToStep", "text": "Cut 12 circles slightly wider than the tartlet molds or muffin-tin cavities being used.", "name": "Cut 12 circles slightly wider than the tartlet molds or muffin-tin cavities being used.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-9"}, {"@type": "HowToStep", "text": "Carefully fit each pastry round into a mold, gently pressing the dough across the base and against the sides.", "name": "Carefully fit each pastry round into a mold, gently pressing the dough across the base and against the sides.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-10"}, {"@type": "HowToStep", "text": "Gather and re-roll the pastry scraps as necessary until all 12 tartlet shells have been formed.", "name": "Gather and re-roll the pastry scraps as necessary until all 12 tartlet shells have been formed.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-11"}, {"@type": "HowToStep", "text": "Transfer the unbaked shells to the freezer for 15 minutes.", "name": "Transfer the unbaked shells to the freezer for 15 minutes.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-12"}, {"@type": "HowToStep", "text": "Meanwhile, preheat the oven to 375°F.", "name": "Meanwhile, preheat the oven to 375°F.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-13"}, {"@type": "HowToStep", "text": "Prick the base of each chilled shell with a fork. Line each tartlet with parchment paper and add pie weights.", "name": "Prick the base of each chilled shell with a fork. Line each tartlet with parchment paper and add pie weights.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-14"}, {"@type": "HowToStep", "text": "Bake the weighted shells for 25 minutes. Carefully remove the parchment and weights, then return the shells to the oven for another 5 minutes, or until they have developed a light golden color.", "name": "Bake the weighted shells for 25 minutes. Carefully remove the parchment and weights, then return the shells to the oven for another 5 minutes, or until they have developed a light golden color.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-15"}, {"@type": "HowToStep", "text": "Set the pans on a wire rack and allow the pastry shells to cool completely before adding the filling.", "name": "Set the pans on a wire rack and allow the pastry shells to cool completely before adding the filling.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-16"}, {"@type": "HowToStep", "text": "While the pastry shells are chilling or baking, combine the eggs, granulated sugar, freshly squeezed lemon juice, and finely grated lemon zest in a medium saucepan.", "name": "While the pastry shells are chilling or baking, combine the eggs, granulated sugar, freshly squeezed lemon juice, and finely grated lemon zest in a medium saucepan.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-17"}, {"@type": "HowToStep", "text": "Set the saucepan over medium-low heat and whisk continuously. Continue cooking until the mixture becomes noticeably thick and begins to bubble, approximately 5 minutes.", "name": "Set the saucepan over medium-low heat and whisk continuously. Continue cooking until the mixture becomes noticeably thick and begins to bubble, approximately 5 minutes.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-18"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Pass the cooked lemon mixture through a fine-mesh sieve into a clean bowl for a smooth, silky consistency.", "name": "Remove the saucepan from the heat. Pass the cooked lemon mixture through a fine-mesh sieve into a clean bowl for a smooth, silky consistency.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-19"}, {"@type": "HowToStep", "text": "Whisk the softened butter into the strained curd 1 tablespoon at a time. Allow each portion of butter to become completely incorporated before adding the next.", "name": "Whisk the softened butter into the strained curd 1 tablespoon at a time. Allow each portion of butter to become completely incorporated before adding the next.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-20"}, {"@type": "HowToStep", "text": "Press plastic wrap directly against the surface of the lemon curd to prevent a skin from developing.", "name": "Press plastic wrap directly against the surface of the lemon curd to prevent a skin from developing.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-21"}, {"@type": "HowToStep", "text": "Refrigerate the curd for 1–2 hours, or until thoroughly chilled.", "name": "Refrigerate the curd for 1–2 hours, or until thoroughly chilled.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-22"}, {"@type": "HowToStep", "text": "Pour approximately 1 inch of water into a saucepan and bring it to high heat. Once heated, reduce the water to a gentle simmer.", "name": "Pour approximately 1 inch of water into a saucepan and bring it to high heat. Once heated, reduce the water to a gentle simmer.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-23"}, {"@type": "HowToStep", "text": "Position a heatproof bowl over the saucepan, making certain that the bottom of the bowl does not come into contact with the simmering water.", "name": "Position a heatproof bowl over the saucepan, making certain that the bottom of the bowl does not come into contact with the simmering water.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-24"}, {"@type": "HowToStep", "text": "Place the egg whites, granulated sugar, and a pinch of salt in the bowl.", "name": "Place the egg whites, granulated sugar, and a pinch of salt in the bowl.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-25"}, {"@type": "HowToStep", "text": "Whisk continuously over the simmering water until the mixture becomes warm, the sugar has completely dissolved, and the temperature reaches approximately 160°F.", "name": "Whisk continuously over the simmering water until the mixture becomes warm, the sugar has completely dissolved, and the temperature reaches approximately 160°F.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-26"}, {"@type": "HowToStep", "text": "Transfer the warmed egg-white mixture to the bowl of a stand mixer, or prepare to beat it with a handheld electric mixer.", "name": "Transfer the warmed egg-white mixture to the bowl of a stand mixer, or prepare to beat it with a handheld electric mixer.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-27"}, {"@type": "HowToStep", "text": "Whip on medium speed for approximately 1 minute, then increase to high speed and continue beating until the meringue becomes glossy and holds stiff, firm peaks.", "name": "Whip on medium speed for approximately 1 minute, then increase to high speed and continue beating until the meringue becomes glossy and holds stiff, firm peaks.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-28"}, {"@type": "HowToStep", "text": "Add the vanilla extract or vanilla paste and beat only until evenly incorporated.", "name": "Add the vanilla extract or vanilla paste and beat only until evenly incorporated.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-29"}, {"@type": "HowToStep", "text": "Spoon or pipe the chilled lemon curd into the completely cooled pastry shells, filling each shell nearly to the top.", "name": "Spoon or pipe the chilled lemon curd into the completely cooled pastry shells, filling each shell nearly to the top.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-30"}, {"@type": "HowToStep", "text": "Pipe or generously spoon the prepared Swiss meringue over the lemon filling.", "name": "Pipe or generously spoon the prepared Swiss meringue over the lemon filling.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-31"}, {"@type": "HowToStep", "text": "Using a kitchen blowtorch, carefully toast the exposed meringue until evenly golden. Alternatively, place the tartlets briefly beneath a high broiler and watch closely until the meringue develops the desired toasted color.", "name": "Using a kitchen blowtorch, carefully toast the exposed meringue until evenly golden. Alternatively, place the tartlets briefly beneath a high broiler and watch closely until the meringue develops the desired toasted color.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-32"}, {"@type": "HowToStep", "text": "Serve the finished tartlets immediately, or refrigerate them until ready to serve.", "name": "Serve the finished tartlets immediately, or refrigerate them until ready to serve.", "url": "https://erecip.github.io/en/lemon-meringue-pie-tartlets/#wprm-recipe-41793-step-0-33"}], "recipeCategory": ["Dessert"], "keywords": "Lemon Meringue Pie Tartlets"}</script>
