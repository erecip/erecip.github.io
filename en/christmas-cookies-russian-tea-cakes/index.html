    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies Russian Tea Cakes", "author": {"@type": "Person", "name": "BenDes"}, "description": "These classic Russian tea cakes are tender, buttery cookies studded with toasted pecans and flavored with vanilla. After baking, each cookie receives two coatings of confectioners’ sugar, creating the characteristic snowy finish and delicate, melt-in-the-mouth texture that makes them especially suitable for Christmas baking.", "datePublished": "2020-10-05T15:03:34+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/christmas-cookies-russian-tea-cakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/christmas-cookies-russian-tea-cakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/christmas-cookies-russian-tea-cakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/christmas-cookies-russian-tea-cakes2.png"], "cookTime": "PT10M", "totalTime": "PT70M", "recipeIngredient": ["¾ cup toasted pecans (finely chopped)", "2¼ cups plain all-purpose flour", "½ cup confectioners’ sugar", "2 teaspoons vanilla extract (preferably Madagascar bourbon vanilla)", "1 cup unsalted butter (softened to room temperature)", "½ teaspoon fine salt", "1 cup confectioners’ sugar (sifted until free of lumps)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the oven and pan. Preheat the oven to 375°F (190°C). Cover a cookie sheet with parchment paper or a silicone baking liner to prevent sticking.", "name": "Prepare the oven and pan. Preheat the oven to 375°F (190°C). Cover a cookie sheet with parchment paper or a silicone baking liner to prevent sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-0"}, {"@type": "HowToStep", "text": "Cream the butter and sugar. Place the softened butter and ½ cup confectioners’ sugar in a large mixing bowl. Beat until the mixture becomes creamy and completely smooth.", "name": "Cream the butter and sugar. Place the softened butter and ½ cup confectioners’ sugar in a large mixing bowl. Beat until the mixture becomes creamy and completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-1"}, {"@type": "HowToStep", "text": "Add the vanilla. Pour in the vanilla extract and continue beating until it has been thoroughly incorporated into the butter mixture.", "name": "Add the vanilla. Pour in the vanilla extract and continue beating until it has been thoroughly incorporated into the butter mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-2"}, {"@type": "HowToStep", "text": "Form the dough. Gradually blend in the all-purpose flour and salt using low speed. Mix only until the ingredients come together and a dough forms.", "name": "Form the dough. Gradually blend in the all-purpose flour and salt using low speed. Mix only until the ingredients come together and a dough forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-3"}, {"@type": "HowToStep", "text": "Incorporate the pecans. Fold the finely chopped toasted pecans into the dough, distributing them as evenly as possible throughout the mixture.", "name": "Incorporate the pecans. Fold the finely chopped toasted pecans into the dough, distributing them as evenly as possible throughout the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-4"}, {"@type": "HowToStep", "text": "Shape and refrigerate. Portion the dough by the tablespoon and gently roll each piece into a ball. Transfer the shaped dough to a plate or tray, then refrigerate for approximately 1 hour. Chilling helps the cookies retain their rounded shape during baking.", "name": "Shape and refrigerate. Portion the dough by the tablespoon and gently roll each piece into a ball. Transfer the shaped dough to a plate or tray, then refrigerate for approximately 1 hour. Chilling helps the cookies retain their rounded shape during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-5"}, {"@type": "HowToStep", "text": "Arrange for baking. Once chilled, place the dough balls on the prepared cookie sheet, leaving approximately 1–2 inches of space between each cookie.", "name": "Arrange for baking. Once chilled, place the dough balls on the prepared cookie sheet, leaving approximately 1–2 inches of space between each cookie.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-6"}, {"@type": "HowToStep", "text": "Bake. Transfer the pan to the preheated oven and bake for 7–10 minutes, or until the undersides are only lightly golden. Baking times may vary, so monitor the cookies closely near the end.", "name": "Bake. Transfer the pan to the preheated oven and bake for 7–10 minutes, or until the undersides are only lightly golden. Baking times may vary, so monitor the cookies closely near the end.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-7"}, {"@type": "HowToStep", "text": "Cool briefly. Remove the baking sheet from the oven and leave the cookies on the pan for several minutes, just until they are cool enough to handle without breaking.", "name": "Cool briefly. Remove the baking sheet from the oven and leave the cookies on the pan for several minutes, just until they are cool enough to handle without breaking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-8"}, {"@type": "HowToStep", "text": "Apply the first sugar coating. Place the 1 cup sifted confectioners’ sugar in a small bowl. While the cookies are still slightly warm, gently roll each one through the sugar until completely covered. Some of the coating will soften and partially melt against the warm surface.", "name": "Apply the first sugar coating. Place the 1 cup sifted confectioners’ sugar in a small bowl. While the cookies are still slightly warm, gently roll each one through the sugar until completely covered. Some of the coating will soften and partially melt against the warm surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-9"}, {"@type": "HowToStep", "text": "Cool completely. Transfer the sugar-coated cookies to a wire cooling rack and leave them until they have reached room temperature.", "name": "Cool completely. Transfer the sugar-coated cookies to a wire cooling rack and leave them until they have reached room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-10"}, {"@type": "HowToStep", "text": "Coat a second time. Once completely cool, roll each cookie in confectioners’ sugar again to create a thick, snowy exterior.", "name": "Coat a second time. Once completely cool, roll each cookie in confectioners’ sugar again to create a thick, snowy exterior.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-russian-tea-cakes/#wprm-recipe-44099-step-0-11"}], "recipeCategory": ["Cookies", "Dessert"], "keywords": "Christmas Cookies Russian Tea Cakes"}</script>
