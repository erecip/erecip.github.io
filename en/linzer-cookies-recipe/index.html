    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Linzer Cookies Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Delightfully delicate and charming, Linzer Cookies bring elegance to any holiday cookie spread. This classic Austrian treat, with its sweet jam filling and snowy dusting of powdered sugar, is surprisingly simple to prepare and can easily be made nut-free to suit any preference.", "datePublished": "2024-11-01T16:55:49+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Linzer-Cookies-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Linzer-Cookies-Recipe-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Linzer-Cookies-Recipe-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Linzer-Cookies-Recipe-480x270.png"], "recipeYield": ["25"], "prepTime": "PT30M", "cookTime": "PT10M", "totalTime": "PT70M", "recipeIngredient": ["½ teaspoon salt", "1 cup 226 g unsalted butter, softened", "1 Tablespoon cornstarch", "⅓ cup 160 g raspberry jam", "½ cup 100 g granulated sugar", "⅔ cup 67 g almond flour (see note for nut-free option)", "Powdered sugar (for dusting (optional))", "2 cups 250 g all-purpose flour", "¼ teaspoon ground cinnamon (optional)", "1 ½ teaspoons vanilla extract", "3 tablespoons light brown sugar (firmly packed)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Using an electric mixer, blend the butter, both sugars, and cinnamon until the mixture turns pale and airy, about 30 to 60 seconds, then stir in the vanilla extract. In a separate bowl, whisk together the all-purpose flour, almond flour, cornstarch, and salt, then gently incorporate this dry mixture into the butter blend, mixing only until no dry streaks remain. Shape the dough into two discs, wrap them tightly in plastic wrap, and chill in the refrigerator for no less than 30 minutes while preheating the oven to 350°F (175°C). Working with one disc at a time, roll the dough on a lightly floured surface to a thickness of ⅛ inch, then cut out 2½-inch rounds and place them on parchment-lined baking sheets, leaving 2 inches of space between each. Using a small heart or star-shaped cutter, cut a window in the center of half the rounds. Bake the cookies with cutouts separately from the solid rounds to ensure they bake evenly. Gather any leftover dough scraps and re-roll as needed. Bake each batch for 9 to 10 minutes, or until the edges just begin to turn a light golden hue. Let the cookies cool completely on a wire rack. Lightly dust the tops of the cookies with cutouts with powdered sugar. Place a generous teaspoon of raspberry jam onto the flat side of each solid cookie, then gently press a cutout cookie on top to create a beautiful sandwich.", "name": "Using an electric mixer, blend the butter, both sugars, and cinnamon until the mixture turns pale and airy, about 30 to 60 seconds, then stir in the vanilla extract. In a separate bowl, whisk together the all-purpose flour, almond flour, cornstarch, and salt, then gently incorporate this dry mixture into the butter blend, mixing only until no dry streaks remain. Shape the dough into two discs, wrap them tightly in plastic wrap, and chill in the refrigerator for no less than 30 minutes while preheating the oven to 350°F (175°C). Working with one disc at a time, roll the dough on a lightly floured surface to a thickness of ⅛ inch, then cut out 2½-inch rounds and place them on parchment-lined baking sheets, leaving 2 inches of space between each. Using a small heart or star-shaped cutter, cut a window in the center of half the rounds. Bake the cookies with cutouts separately from the solid rounds to ensure they bake evenly. Gather any leftover dough scraps and re-roll as needed. Bake each batch for 9 to 10 minutes, or until the edges just begin to turn a light golden hue. Let the cookies cool completely on a wire rack. Lightly dust the tops of the cookies with cutouts with powdered sugar. Place a generous teaspoon of raspberry jam onto the flat side of each solid cookie, then gently press a cutout cookie on top to create a beautiful sandwich.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/linzer-cookies-recipe/#wprm-recipe-49881-step-0-0"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["Austrian"], "keywords": "Linzer Cookies Recipe"}</script>
