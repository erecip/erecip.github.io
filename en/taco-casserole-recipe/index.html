sionally and breaking up the meat, for about 5-6 minutes until browned.", "name": "Warm the olive oil in a large skillet over medium-high heat. Add the ground beef and cook, stirring occasionally and breaking up the meat, for about 5-6 minutes until browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/taco-casserole-recipe/#wprm-recipe-314-step-0-1"}, {"@type": "HowToStep", "text": "Add the diced onion to the skillet and continue cooking for an additional 3-4 minutes, or until the onion becomes translucent.", "name": "Add the diced onion to the skillet and continue cooking for an additional 3-4 minutes, or until the onion becomes translucent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/taco-casserole-recipe/#wprm-recipe-314-step-0-2"}, {"@type": "HowToStep", "text": "Mix in the taco seasoning and diced tomatoes (along with their juice). Allow the mixture to simmer for 3-4 minutes.", "name": "Mix in the taco seasoning and diced tomatoes (along with their juice). Allow the mixture to simmer for 3-4 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/taco-casserole-recipe/#wprm-recipe-314-step-0-3"}, {"@type": "HowToStep", "text": "Arrange a layer of crushed tortilla chips evenly across the bottom of the prepared baking dish. Spread the refried beans over the chips in an even layer.", "name": "Arrange a layer of crushed tortilla chips evenly across the bottom of the prepared baking dish. Spread the refried beans over the chips in an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/taco-casserole-recipe/#wprm-recipe-314-step-0-4"}, {"@type": "HowToStep", "text": "Spoon the seasoned beef mixture over the layer of beans, then sprinkle the shredded cheddar cheese on top.", "name": "Spoon the seasoned beef mixture over the layer of beans, then sprinkle the shredded cheddar cheese on top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/taco-casserole-recipe/#wprm-recipe-314-ste
