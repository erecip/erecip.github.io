    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Fried Chicken Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "The simplest method for achieving perfectly crispy fried chicken with tender, juicy meat inside. This recipe utilizes a time-saving two-step dredging technique with a wet batter for superior crunch.", "datePublished": "2024-03-01T07:16:59+00:00", "image": ["https://erecip.github.io/en/fried-chicken-recipe/fried-chicken-recipe2.webp", "https://erecip.github.io/en/fried-chicken-recipe/fried-chicken-recipe2.webp", "https://erecip.github.io/en/fried-chicken-recipe/fried-chicken-recipe2.webp", "https://erecip.github.io/en/fried-chicken-recipe/fried-chicken-recipe2.webp"], "recipeYield": ["6"], "prepTime": "PT180M", "cookTime": "PT15M", "totalTime": "PT195M", "recipeIngredient": ["1/4 cup salt", "3  bay leaves", "2 cups cornstarch", "1 tbsp garlic powder", "1 tbsp baking powder", "1 cup seasoning mix", "4 cups whole milk (or water)", "2 cups flour (substitute with gluten-free if needed)", "Neutral oil for frying", "1/2 tbsp white pepper", "1 tbsp kosher salt", "8 cloves garlic", "3 lb drumsticks or thighs", "2 tbsp black peppercorns", "1/2 tbsp cayenne pepper", "1 cup cold water", "1 tbsp onion powder", "1 tbsp black pepper"], "recipeInstructions": [{"@type": "HowToStep", "text": "Use a knife to pierce the chicken pieces thoroughly, then immerse them in a brine of whole milk (or water), salt, garlic, black peppercorns, and bay leaves. Allow the chicken to soak for at least 2-3 hours, or overnight for maximum tenderness. In a sizable bowl, whisk together flour, cornstarch, kosher salt, white pepper, black pepper, garlic powder, onion powder, cayenne pepper, and baking powder until evenly combined. Reserve 1 cup of this seasoning blend and mix it separately with cold water to form a smooth wet batter. Remove the brined chicken, then add a few spoonfuls of the brine to the remaining dry seasoning mix, rubbing gently with your fingers to create small clumps for added crunch. Dip each chicken piece into the wet batter, letting excess drip off before pressing firmly into the dry seasoning until thoroughly coated. Arrange the coated chicken on a baking sheet while heating neutral oil in a cast iron skillet, Dutch oven, or heavy-bottomed pan to 350°F. Fry the chicken in batches for 8-12 minutes, adjusting for piece size, until the internal temperature reaches 165°F.", "name": "Use a knife to pierce the chicken pieces thoroughly, then immerse them in a brine of whole milk (or water), salt, garlic, black peppercorns, and bay leaves. Allow the chicken to soak for at least 2-3 hours, or overnight for maximum tenderness. In a sizable bowl, whisk together flour, cornstarch, kosher salt, white pepper, black pepper, garlic powder, onion powder, cayenne pepper, and baking powder until evenly combined. Reserve 1 cup of this seasoning blend and mix it separately with cold water to form a smooth wet batter. Remove the brined chicken, then add a few spoonfuls of the brine to the remaining dry seasoning mix, rubbing gently with your fingers to create small clumps for added crunch. Dip each chicken piece into the wet batter, letting excess drip off before pressing firmly into the dry seasoning until thoroughly coated. Arrange the coated chicken on a baking sheet while heating neutral oil in a cast iron skillet, Dutch oven, or heavy-bottomed pan to 350°F. Fry the chicken in batches for 8-12 minutes, adjusting for piece size, until the internal temperature reaches 165°F.", "url": "https://erecip.github.io/en/fried-chicken-recipe/#wprm-recipe-26637-step-0-0"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Fried Chicken Recipe"}</script>
