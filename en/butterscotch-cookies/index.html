    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Butterscotch Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These soft butterscotch cookies feature lightly golden edges, tender centers, and generous pockets of sweet butterscotch chips. Chilling the dough before baking helps control spreading while producing a pleasantly chewy texture.", "datePublished": "2022-06-16T07:12:29+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/butterscotch-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/butterscotch-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/butterscotch-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/butterscotch-cookies2.png"], "prepTime": "PT15M", "cookTime": "PT10M", "totalTime": "PT45M", "recipeIngredient": ["11 ounces butterscotch baking chips", "2  large eggs (brought to room temperature)", "1 teaspoon baking soda", "¾ cup firmly packed brown sugar", "½ teaspoon salt", "2½ cups all-purpose flour", "1 teaspoon pure vanilla extract", "¾ cup granulated white sugar", "¾ cup unsalted butter (softened; Kerrygold or another high-quality butter may be used)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the softened unsalted butter, packed brown sugar, and granulated sugar in a large mixing bowl. Beat at medium speed for approximately 3–4 minutes, or until the mixture appears pale, airy, and fluffy.", "name": "Place the softened unsalted butter, packed brown sugar, and granulated sugar in a large mixing bowl. Beat at medium speed for approximately 3–4 minutes, or until the mixture appears pale, airy, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-0"}, {"@type": "HowToStep", "text": "Blend in the vanilla extract until evenly incorporated.", "name": "Blend in the vanilla extract until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-1"}, {"@type": "HowToStep", "text": "Add the eggs individually, mixing thoroughly after each addition before introducing the next egg. Continue beating until the mixture is smooth and fully combined.", "name": "Add the eggs individually, mixing thoroughly after each addition before introducing the next egg. Continue beating until the mixture is smooth and fully combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl or large measuring vessel, whisk together the all-purpose flour, baking soda, and salt until evenly distributed.", "name": "In a separate bowl or large measuring vessel, whisk together the all-purpose flour, baking soda, and salt until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-3"}, {"@type": "HowToStep", "text": "Set the mixer to low speed and gradually add the dry mixture to the creamed ingredients. Mix only until no visible streaks of flour remain, taking care not to overwork the dough.", "name": "Set the mixer to low speed and gradually add the dry mixture to the creamed ingredients. Mix only until no visible streaks of flour remain, taking care not to overwork the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-4"}, {"@type": "HowToStep", "text": "Add the butterscotch chips and mix briefly until they are dispersed throughout the dough. For gentler handling, finish incorporating the chips by folding them in with a spatula.", "name": "Add the butterscotch chips and mix briefly until they are dispersed throughout the dough. For gentler handling, finish incorporating the chips by folding them in with a spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the completed cookie dough to the freezer for 20 minutes or place it in the refrigerator for 40 minutes.", "name": "Transfer the completed cookie dough to the freezer for 20 minutes or place it in the refrigerator for 40 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-6"}, {"@type": "HowToStep", "text": "Allowing the dough to chill helps limit excessive spreading during baking and contributes to a more substantial cookie texture.", "name": "Allowing the dough to chill helps limit excessive spreading during baking and contributes to a more substantial cookie texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-7"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C), then cover a baking sheet with parchment paper.", "name": "Preheat the oven to 350°F (175°C), then cover a baking sheet with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-8"}, {"@type": "HowToStep", "text": "Using a tablespoon-sized cookie scoop, portion the chilled dough into rounded mounds. Arrange them on the prepared baking sheet with approximately 2 inches of space between each portion.", "name": "Using a tablespoon-sized cookie scoop, portion the chilled dough into rounded mounds. Arrange them on the prepared baking sheet with approximately 2 inches of space between each portion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-9"}, {"@type": "HowToStep", "text": "Bake for 10–12 minutes, stopping when the edges are faintly golden while the centers still appear slightly underdone.", "name": "Bake for 10–12 minutes, stopping when the edges are faintly golden while the centers still appear slightly underdone.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-10"}, {"@type": "HowToStep", "text": "Remove the baking sheet from the oven and leave the cookies undisturbed on the pan for 5 minutes. This resting period allows their delicate centers to firm sufficiently.", "name": "Remove the baking sheet from the oven and leave the cookies undisturbed on the pan for 5 minutes. This resting period allows their delicate centers to firm sufficiently.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-11"}, {"@type": "HowToStep", "text": "Carefully move the cookies to a wire cooling rack and allow them to cool completely.", "name": "Carefully move the cookies to a wire cooling rack and allow them to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butterscotch-cookies/#wprm-recipe-40372-step-0-12"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Butterscotch Cookies"}</script>
