    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Anti-Inflammatory Turmeric Chicken Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warming chicken soup featuring turmeric, aromatic vegetables, creamy coconut milk, and fresh parsley. Slowly sautéed vegetables create a flavorful foundation, while gentle simmering keeps the chicken tender and the coconut-infused broth smooth.", "datePublished": "2019-12-11T23:15:35+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/anti-inflammatory-turmeric-chicken-soup2.png", "https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/anti-inflammatory-turmeric-chicken-soup2.png", "https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/anti-inflammatory-turmeric-chicken-soup2.png", "https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/anti-inflammatory-turmeric-chicken-soup2.png"], "prepTime": "PT15M", "cookTime": "PT40M", "totalTime": "PT55M", "recipeIngredient": ["6 cups chicken broth", "3  garlic cloves (roughly chopped)", "1  large leek (using the white and pale-green sections, thinly sliced)", "1 teaspoon ground turmeric", "1¼ pounds boneless (skinless chicken thighs or chicken breasts)", "3  celery stalks (cut into thin slices)", "¼ cup olive oil", "1  medium yellow onion (diced)", "1 teaspoon poultry seasoning", "3  large carrots (thinly sliced)", "1  can (13.5 ounces coconut milk)", "1 teaspoon kosher salt", "½ teaspoon ground black pepper", "¼ cup fresh parsley (chopped)", "1  bag (10 ounces frozen peas, optional)", "1 teaspoon kosher salt (or enough to adjust the final seasoning)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Sauté the vegetables. Heat the olive oil in a large soup pot over medium heat. Add the onion, leek, carrots, celery, and 1 teaspoon kosher salt. Cook for approximately 14–16 minutes, stirring from time to time, until the leek has softened and the vegetables begin to lightly caramelize.", "name": "Sauté the vegetables. Heat the olive oil in a large soup pot over medium heat. Add the onion, leek, carrots, celery, and 1 teaspoon kosher salt. Cook for approximately 14–16 minutes, stirring from time to time, until the leek has softened and the vegetables begin to lightly caramelize.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/#wprm-recipe-44802-step-0-0"}, {"@type": "HowToStep", "text": "Toast the aromatics and seasonings. Stir the chopped garlic, ground turmeric, and poultry seasoning into the softened vegetables. Continue cooking for 2–3 minutes, stirring frequently, until the garlic and spices become highly fragrant and begin to toast lightly.", "name": "Toast the aromatics and seasonings. Stir the chopped garlic, ground turmeric, and poultry seasoning into the softened vegetables. Continue cooking for 2–3 minutes, stirring frequently, until the garlic and spices become highly fragrant and begin to toast lightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/#wprm-recipe-44802-step-0-1"}, {"@type": "HowToStep", "text": "Add the broth, coconut milk, and chicken. Pour the chicken broth and coconut milk into the pot, then add the raw chicken thighs or breasts, making sure the meat is submerged. Scrape any browned bits from the bottom of the pot, partially cover, and bring the mixture to a very gentle simmer over low heat.", "name": "Add the broth, coconut milk, and chicken. Pour the chicken broth and coconut milk into the pot, then add the raw chicken thighs or breasts, making sure the meat is submerged. Scrape any browned bits from the bottom of the pot, partially cover, and bring the mixture to a very gentle simmer over low heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/#wprm-recipe-44802-step-0-2"}, {"@type": "HowToStep", "text": "Cook until tender. Maintain a low simmer for 15–20 minutes, or until the chicken is completely cooked and the vegetables are tender. Avoid a vigorous boil, as excessive heat may cause the coconut milk to separate.", "name": "Cook until tender. Maintain a low simmer for 15–20 minutes, or until the chicken is completely cooked and the vegetables are tender. Avoid a vigorous boil, as excessive heat may cause the coconut milk to separate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/#wprm-recipe-44802-step-0-3"}, {"@type": "HowToStep", "text": "Shred or cut the chicken. Transfer the cooked chicken to a cutting board and allow it to cool briefly. Shred it with two forks or cut it into bite-size pieces.", "name": "Shred or cut the chicken. Transfer the cooked chicken to a cutting board and allow it to cool briefly. Shred it with two forks or cut it into bite-size pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/#wprm-recipe-44802-step-0-4"}, {"@type": "HowToStep", "text": "Finish with peas and parsley. Return the chicken to the soup. Add the frozen peas, if using, along with the chopped fresh parsley. Bring the soup back to a gentle simmer and cook for about 5 minutes, until the peas are tender and bright green and the chicken is thoroughly reheated.", "name": "Finish with peas and parsley. Return the chicken to the soup. Add the frozen peas, if using, along with the chopped fresh parsley. Bring the soup back to a gentle simmer and cook for about 5 minutes, until the peas are tender and bright green and the chicken is thoroughly reheated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/#wprm-recipe-44802-step-0-5"}, {"@type": "HowToStep", "text": "Adjust the seasoning and serve. Taste the soup and add up to 1 teaspoon additional kosher salt, or the amount needed, together with ½ teaspoon black pepper. Serve hot, with additional fresh parsley as an optional garnish.", "name": "Adjust the seasoning and serve. Taste the soup and add up to 1 teaspoon additional kosher salt, or the amount needed, together with ½ teaspoon black pepper. Serve hot, with additional fresh parsley as an optional garnish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/anti-inflammatory-turmeric-chicken-soup/#wprm-recipe-44802-step-0-6"}], "recipeCategory": ["Main Course", "Soup"], "recipeCuisine": ["Contemporary"], "keywords": "Anti-Inflammatory Turmeric Chicken Soup"}</script>
