    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Cake Cups", "author": {"@type": "Person", "name": "BenDes"}, "description": "These lemon cake cups feature a soft, tender crumb infused with freshly squeezed lemon juice, finely grated zest, and vanilla. Once fully cooled, each cupcake is finished with vanilla buttercream and may be decorated with fresh lemon slices or additional zest.", "datePublished": "2022-09-27T21:42:49+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/lemon-cake-cups.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/lemon-cake-cups.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/lemon-cake-cups.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/lemon-cake-cups.png"], "prepTime": "PT20M", "cookTime": "PT18M", "totalTime": "PT38M", "recipeIngredient": ["⅓ cup freshly squeezed lemon juice", "1 cup granulated white sugar", "2 teaspoons baking powder", "½ cup unsalted butter (softened to room temperature)", "1½ tablespoons finely grated lemon zest", "2  large eggs (brought to approximately 70°F)", "½ cup whole milk", "1½ teaspoons vanilla extract", "½ teaspoon salt", "1½ cups all-purpose flour (preferably King Arthur, measured using the spoon-and-level method)", "Vanilla buttercream frosting", "Fresh lemon slices (optional)", "Additional finely grated lemon zest (optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (177°C). Place paper cupcake liners in all 12 wells of a standard muffin pan to prevent sticking and allow the baked cupcakes to release easily.", "name": "Preheat the oven to 350°F (177°C). Place paper cupcake liners in all 12 wells of a standard muffin pan to prevent sticking and allow the baked cupcakes to release easily.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened unsalted butter and granulated sugar in a large mixing bowl. Using a handheld mixer or a stand mixer fitted with the paddle attachment, beat the ingredients at medium-high speed for approximately 2 minutes, or until the mixture becomes pale, airy, and fluffy.", "name": "Place the softened unsalted butter and granulated sugar in a large mixing bowl. Using a handheld mixer or a stand mixer fitted with the paddle attachment, beat the ingredients at medium-high speed for approximately 2 minutes, or until the mixture becomes pale, airy, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-1"}, {"@type": "HowToStep", "text": "Pause the mixer and scrape the sides and base of the bowl to ensure the ingredients are evenly blended.", "name": "Pause the mixer and scrape the sides and base of the bowl to ensure the ingredients are evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-2"}, {"@type": "HowToStep", "text": "Add the room-temperature eggs and vanilla extract to the creamed butter mixture. Beat at medium-high speed for about 1 minute, continuing until the eggs are fully incorporated.", "name": "Add the room-temperature eggs and vanilla extract to the creamed butter mixture. Beat at medium-high speed for about 1 minute, continuing until the eggs are fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-3"}, {"@type": "HowToStep", "text": "Scrape the bowl once more so that no unmixed portions remain around the edges or bottom.", "name": "Scrape the bowl once more so that no unmixed portions remain around the edges or bottom.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-4"}, {"@type": "HowToStep", "text": "In a separate medium-sized bowl, thoroughly whisk together the all-purpose flour, baking powder, and salt.", "name": "In a separate medium-sized bowl, thoroughly whisk together the all-purpose flour, baking powder, and salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-5"}, {"@type": "HowToStep", "text": "Reduce the mixer to low speed. Gradually add the dry mixture to the butter-and-egg mixture.", "name": "Reduce the mixer to low speed. Gradually add the dry mixture to the butter-and-egg mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-6"}, {"@type": "HowToStep", "text": "Slowly pour in the whole milk, fresh lemon juice, and finely grated lemon zest. Continue mixing only until the batter is uniform and no visible streaks of flour remain. Avoid excessive mixing, as this may make the cupcakes dense rather than light and tender.", "name": "Slowly pour in the whole milk, fresh lemon juice, and finely grated lemon zest. Continue mixing only until the batter is uniform and no visible streaks of flour remain. Avoid excessive mixing, as this may make the cupcakes dense rather than light and tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-7"}, {"@type": "HowToStep", "text": "Divide the prepared batter evenly among the lined muffin wells, filling each liner approximately two-thirds full.", "name": "Divide the prepared batter evenly among the lined muffin wells, filling each liner approximately two-thirds full.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-8"}, {"@type": "HowToStep", "text": "Bake standard-sized cupcakes for 18–22 minutes. The cupcakes are ready when a toothpick inserted into the center comes out clean.", "name": "Bake standard-sized cupcakes for 18–22 minutes. The cupcakes are ready when a toothpick inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-9"}, {"@type": "HowToStep", "text": "For mini cupcakes, reduce the baking time to 11–13 minutes.", "name": "For mini cupcakes, reduce the baking time to 11–13 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-10"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and allow the cupcakes to cool completely before applying the frosting.", "name": "Remove the pan from the oven and allow the cupcakes to cool completely before applying the frosting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-11"}, {"@type": "HowToStep", "text": "Once the cupcakes have cooled fully, cover each one generously with vanilla buttercream frosting.", "name": "Once the cupcakes have cooled fully, cover each one generously with vanilla buttercream frosting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-12"}, {"@type": "HowToStep", "text": "Garnish with fresh lemon slices, if using. A light scattering of additional lemon zest may also be added immediately before serving.", "name": "Garnish with fresh lemon slices, if using. A light scattering of additional lemon zest may also be added immediately before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake-cups/#wprm-recipe-40272-step-0-13"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Lemon Cake Cups"}</script>
