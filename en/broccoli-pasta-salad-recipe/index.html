    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Broccoli Pasta Salad Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This broccoli pasta salad combines tender rotini, crisp broccoli, sharp red onion, and smoky bacon with a creamy red wine vinegar dressing. After chilling, the flavors blend into a cool, savory, slightly sweet pasta salad ideal for serving at gatherings, potlucks, or casual meals.", "datePublished": "2022-01-01T11:01:53+00:00", "image": ["https://erecip.github.io/en/broccoli-pasta-salad-recipe/Creamy-Broccoli-Pasta-Salad.png", "https://erecip.github.io/en/broccoli-pasta-salad-recipe/Creamy-Broccoli-Pasta-Salad.png", "https://erecip.github.io/en/broccoli-pasta-salad-recipe/Creamy-Broccoli-Pasta-Salad.png", "https://erecip.github.io/en/broccoli-pasta-salad-recipe/Creamy-Broccoli-Pasta-Salad.png"], "prepTime": "PT20M", "totalTime": "PT200M", "recipeIngredient": ["For the salad:", "1 pound fresh broccoli (trimmed and separated into small florets)", "1/2 pound fully cooked bacon (prepared until crisp and broken into crumbles)", "1  package rotini pasta (16 ounces)", "1/2 cup red onion (finely chopped into small pieces for a gentler bite)", "For the dressing:", "1/2 cup red wine vinegar", "2 cups mayonnaise (such as Hellmann’s)", "1 teaspoon freshly ground or ground black pepper", "1/2 cup granulated sugar", "2 teaspoons salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a pot of water to a boil and cook the rotini according to the directions on the package until properly tender. Drain thoroughly, then allow the pasta to cool slightly.", "name": "Bring a pot of water to a boil and cook the rotini according to the directions on the package until properly tender. Drain thoroughly, then allow the pasta to cool slightly.", "url": "https://erecip.github.io/en/broccoli-pasta-salad-recipe/#wprm-recipe-38750-step-0-0"}, {"@type": "HowToStep", "text": "While the pasta cooks, cut the broccoli into small florets, finely dice the red onion, and crumble the cooked bacon into bite-size pieces.", "name": "While the pasta cooks, cut the broccoli into small florets, finely dice the red onion, and crumble the cooked bacon into bite-size pieces.", "url": "https://erecip.github.io/en/broccoli-pasta-salad-recipe/#wprm-recipe-38750-step-0-1"}, {"@type": "HowToStep", "text": "In a separate mixing bowl, whisk together the mayonnaise, red wine vinegar, granulated sugar, salt, and black pepper until the dressing is smooth, creamy, and evenly blended.", "name": "In a separate mixing bowl, whisk together the mayonnaise, red wine vinegar, granulated sugar, salt, and black pepper until the dressing is smooth, creamy, and evenly blended.", "url": "https://erecip.github.io/en/broccoli-pasta-salad-recipe/#wprm-recipe-38750-step-0-2"}, {"@type": "HowToStep", "text": "Place the drained pasta in a large serving bowl. Add the prepared dressing, broccoli florets, and chopped red onion.", "name": "Place the drained pasta in a large serving bowl. Add the prepared dressing, broccoli florets, and chopped red onion.", "url": "https://erecip.github.io/en/broccoli-pasta-salad-recipe/#wprm-recipe-38750-step-0-3"}, {"@type": "HowToStep", "text": "Stir until the pasta is fully coated and the vegetables are evenly dispersed throughout the salad. Keep the bacon aside at this point so it stays crisp.", "name": "Stir until the pasta is fully coated and the vegetables are evenly dispersed throughout the salad. Keep the bacon aside at this point so it stays crisp.", "url": "https://erecip.github.io/en/broccoli-pasta-salad-recipe/#wprm-recipe-38750-step-0-4"}, {"@type": "HowToStep", "text": "Cover the bowl tightly with a lid or plastic wrap, then refrigerate the pasta salad for at least 3 hours so the dressing can absorb into the pasta and the flavors can develop.", "name": "Cover the bowl tightly with a lid or plastic wrap, then refrigerate the pasta salad for at least 3 hours so the dressing can absorb into the pasta and the flavors can develop.", "url": "https://erecip.github.io/en/broccoli-pasta-salad-recipe/#wprm-recipe-38750-step-0-5"}, {"@type": "HowToStep", "text": "Right before serving, scatter the crumbled bacon over the chilled salad. Stir well to combine, keeping the bacon pleasantly crisp, then serve immediately.", "name": "Right before serving, scatter the crumbled bacon over the chilled salad. Stir well to combine, keeping the bacon pleasantly crisp, then serve immediately.", "url": "https://erecip.github.io/en/broccoli-pasta-salad-recipe/#wprm-recipe-38750-step-0-6"}], "recipeCategory": ["Salad"], "recipeCuisine": ["American"], "keywords": "Broccoli Pasta Salad Recipe"}</script>
