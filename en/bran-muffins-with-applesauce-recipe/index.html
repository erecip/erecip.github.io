    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Bran Muffins with Applesauce Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Wholesome bran muffins inspired by Grandma, packed with whole grains and a touch of natural sweetness from blackstrap molasses. These muffins are tender and moist, thanks to applesauce, and make a perfect grab-and-go breakfast or snack. They freeze well, making them a convenient option for meal prep.", "datePublished": "2024-04-12T08:39:22+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-38-1.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-38-1-442x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-38-1-442x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-38-1-442x270.png"], "recipeYield": ["10", "10 Muffins"], "prepTime": "PT10M", "cookTime": "PT15M", "totalTime": "PT25M", "recipeIngredient": ["1 cup wheat bran", "1 1/2 cups whole wheat pastry flour or white whole wheat flour", "1 tablespoon baking powder", "1/4 teaspoon baking soda", "1/2 teaspoon salt", "1 1/2 teaspoons cinnamon", "1/4 cup blackstrap molasses", "2  eggs (at room temperature)", "1/4 cup brown sugar (or substitute coconut sugar)", "1/3 cup unsweetened applesauce", "3/4 cup unsweetened vanilla almond milk (or milk of choice)", "1 tablespoon apple cider vinegar", "1/3 cup melted coconut oil (or substitute melted butter or vegan butter)", "1/2 cup raisins", "3/4 cup fresh or frozen blueberries", "1/2 cup chopped walnuts"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F (200°C). Prepare a 12-cup muffin tin by lining 10 cups with paper liners and lightly spraying them with nonstick cooking spray. This step is crucial to prevent sticking.", "name": "P ibute the batter among the 10 prepared muffin liners. Bake for 15-20 minutes or until a toothpick inserted into the center comes out clean or with just a few crumbs attached.", "name": "Evenly distribute the batter among the 10 prepared muffin liners. Bake for 15-20 minutes or until a toothpick inserted into the center comes out clean or with just a few crumbs attached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bran-muffins-with-applesauce-recipe/#wprm-recipe-556-step-0-4"}, {"@type": "HowToStep", "text": "Allow the muffins to cool in the tin for 5 minutes, then transfer them to a wire rack to cool completely. These muffins are best enjoyed warm, with a touch of butter.", "name": "Allow the muffins to cool in the tin for 5 minutes, then transfer them to a wire rack to cool completely. These muffins are best enjoyed warm, with a touch of butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bran-muffins-with-applesauce-recipe/#wprm-recipe-556-step-0-5"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Bran Muffins with Applesauce Recipe"}</script>
