    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Apple Cake Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A remarkably simple yet exquisitely moist apple cake, brimming with tender apple pieces, warm cinnamon undertones, and the subtle depth of applesauce. Every forkful is soft and comforting, making it irresistible to stop at just one slice.", "datePublished": "2024-10-17T07:21:52+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/apple-cake-recipe/Apple-Cake-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-cake-recipe/Apple-Cake-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-cake-recipe/Apple-Cake-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-cake-recipe/Apple-Cake-Recipe1.png"], "recipeYield": ["9", "9 slices"], "prepTime": "PT15M", "cookTime": "PT30M", "totalTime": "PT45M", "recipeIngredient": ["1/2 cup unsweetened applesauce (or sweetened, if preferred)", "1 tbsp vanilla extract", "3/4 tsp baking powder", "1/4 tsp salt", "1 tsp cornstarch", "1/2 cup vegetable oil or melted and cooled butter", "3/4 cups light or dark brown sugar", "1 tsp ground cinnamon (plus 1/4 tsp for dusting apples)", "1 3/4 cups all-purpose flour", "2  medium Granny Smith apples (peeled and chopped (about 2 cups total))", "2  large eggs (or 3 small, at room temperature)", "3 tsps granulated white sugar", "1/4 tsp ground cinnamon (for sprinkling)", "3/4 tsp baking soda"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (180°C). Line the bottom and two sides of a 9x9 baking pan with parchment paper for easy removal, then lightly grease the remaining sides and set aside. Dice the apples into small cubes and toss gently with 1/4 tsp cinnamon; keep them aside. In a medium bowl, combine the flour, cornstarch, baking soda, baking powder, salt, and 1 tsp cinnamon, stirring until evenly mixed, then set aside. In a separate large bowl, whisk together the oil, brown sugar, eggs, vanilla, and applesauce for 2–3 minutes, ensuring the sides of the bowl are well scraped. Add the dry mixture to the wet ingredients and fold gently with a spatula until just combined, taking care not to over-mix. Incorporate the chopped apples and fold briefly to distribute evenly. Spread the batter smoothly into the prepared pan. Mix the white sugar and 1/4 tsp cinnamon in a small cup, then sprinkle the mixture evenly over the batter for a sweet, crunchy topping. Bake for 25–35 minutes, or until a toothpick inserted comes out clean; the cake is typically done in about 30 minutes. Allow it to cool slightly, slice, and serve. Store leftovers in an airtight container at room temperature for up to 3 days or refrigerate for up to a week.", "name": "Preheat the oven to 350°F (180°C). Line the bottom and two sides of a 9x9 baking pan with parchment paper for easy removal, then lightly grease the remaining sides and set aside. Dice the apples into small cubes and toss gently with 1/4 tsp cinnamon; keep them aside. In a medium bowl, combine the flour, cornstarch, baking soda, baking powder, salt, and 1 tsp cinnamon, stirring until evenly mixed, then set aside. In a separate large bowl, whisk together the oil, brown sugar, eggs, vanilla, and applesauce for 2–3 minutes, ensuring the sides of the bowl are well scraped. Add the dry mixture to the wet ingredients and fold gently with a spatula until just combined, taking care not to over-mix. Incorporate the chopped apples and fold briefly to distribute evenly. Spread the batter smoothly into the prepared pan. Mix the white sugar and 1/4 tsp cinnamon in a small cup, then sprinkle the mixture evenly over the batter for a sweet, crunchy topping. Bake for 25–35 minutes, or until a toothpick inserted comes out clean; the cake is typically done in about 30 minutes. Allow it to cool slightly, slice, and serve. Store leftovers in an airtight container at room temperature for up to 3 days or refrigerate for up to a week.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cake-recipe/#wprm-recipe-15332-step-0-0"}], "recipeCategory": ["Breakfast", "Dessert"], "recipeCuisine": ["American"], "keywords": "Apple Cake Recipe"}</script>
