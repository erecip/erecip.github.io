    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pasta Fagioli Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich and hearty Italian classic, this Pasta e Fagioli brings together tender vegetables, savory ground beef, and two varieties of beans in a tomato-infused broth. Perfect for comforting dinners, it's a flavorful medley ideal for cool evenings.", "datePublished": "2024-08-10T16:57:26+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pasta-fagioli-recipe/Pasta-Fagioli-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pasta-fagioli-recipe/Pasta-Fagioli-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pasta-fagioli-recipe/Pasta-Fagioli-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pasta-fagioli-recipe/Pasta-Fagioli-Recipe.png"], "prepTime": "PT15M", "cookTime": "PT35M", "totalTime": "PT50M", "recipeIngredient": ["1  15 oz can dark red kidney beans, drained and rinsed", "1/2 cup water (with more as needed)", "1 lb lean ground beef", "1  15 oz can great northern beans, drained and rinsed", "3 cloves garlic (minced (approximately 1 tablespoon))", "1 1/2 cups chopped yellow onion", "2 tsp granulated sugar", "1 cup dry ditalini pasta", "1 cup diced celery (around 3 stalks)", "2 Tbsp olive oil (divided)", "Salt and freshly ground black pepper", "1 tsp dried oregano", "1  15 oz can diced tomatoes", "1 cup diced carrots (roughly 2 medium)", "3 Tbsp minced fresh parsley", "3  8 oz cans tomato sauce", "1 1/2 tsp dried basil", "2 14.5 oz cans low-sodium chicken broth", "Finely shredded Romano or Parmesan cheese (for garnish)", "3/4 tsp dried thyme", "1/2 tsp dried marjoram"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm 1 tablespoon of the olive oil in a large stockpot set over medium-high heat, then add the ground beef. Brown the meat, breaking it up as it cooks, until fully done. Drain excess fat and remove the beef from the pot, setting it aside. Pour in the remaining tablespoon of olive oil into the same pot, add the onion, celery, and carrots, and sauté over medium-high heat until tender, about 6 minutes. Stir in the minced garlic and cook for 1 minute more. Introduce the chicken broth, tomato sauce, water, diced tomatoes, sugar, basil, oregano, thyme, marjoram, and the reserved beef. Season generously with salt and freshly ground black pepper. Raise the heat to bring the mixture to a boil, then reduce to a gentle simmer. Cover the pot and allow to cook for 15 to 20 minutes, stirring now and then, until vegetables soften. Meanwhile, cook the ditalini pasta separately according to the package directions until al dente. Drain thoroughly. Add the pasta, along with the kidney and great northern beans, to the soup base. If needed, incorporate additional broth or water to achieve desired consistency. Let simmer for an additional minute. Finish by stirring in the fresh parsley, and serve hot, garnished with grated Romano or Parmesan cheese.", "name": "Warm 1 tablespoon of the olive oil in a large stockpot set over medium-high heat, then add the ground beef. Brown the meat, breaking it up as it cooks, until fully done. Drain excess fat and remove the beef from the pot, setting it aside. Pour in the remaining tablespoon of olive oil into the same pot, add the onion, celery, and carrots, and sauté over medium-high heat until tender, about 6 minutes. Stir in the minced garlic and cook for 1 minute more. Introduce the chicken broth, tomato sauce, water, diced tomatoes, sugar, basil, oregano, thyme, marjoram, and the reserved beef. Season generously with salt and freshly ground black pepper. Raise the heat to bring the mixture to a boil, then reduce to a gentle simmer. Cover the pot and allow to cook for 15 to 20 minutes, stirring now and then, until vegetables soften. Meanwhile, cook the ditalini pasta separately according to the package directions until al dente. Drain thoroughly. Add the pasta, along with the kidney and great northern beans, to the soup base. If needed, incorporate additional broth or water to achieve desired consistency. Let simmer for an additional minute. Finish by stirring in the fresh parsley, and serve hot, garnished with grated Romano or Parmesan cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pasta-fagioli-recipe/#wprm-recipe-12582-step-0-0"}], "recipeCategory": ["Soup"], "recipeCuisine": ["Italian"], "keywords": "Pasta Fagioli Recipe"}</script>
