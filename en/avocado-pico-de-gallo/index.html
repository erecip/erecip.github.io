cado-pico-de-gallo/#wprm-recipe-40583-step-0-5"}, {"@type": "HowToStep", "text": "Using a spatula, carefully fold the avocado into the tomato mixture without crushing the pieces. Taste and adjust the salt or pepper as necessary.", "name": "Using a spatula, carefully fold the avocado into the tomato mixture without crushing the pieces. Taste and adjust the salt or pepper as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/avocado-pico-de-gallo/#wprm-recipe-40583-step-0-6"}, {"@type": "HowToStep", "text": "Serve immediately to preserve the avocado’s fresh color and firm, creamy texture.", "name": "Serve immediately to preserve the avocado’s fresh color and firm, creamy texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/avocado-pico-de-gallo/#wprm-recipe-40583-step-0-7"}], "recipeCategory": ["Appetizer", "salsa"], "recipeCuisine": ["Mexican"], "keywords": "Avocado Pico de Gallo"}</script>
