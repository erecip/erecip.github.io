    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Baby Back Ribs on Grill Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A straightforward method for preparing tender, flavorful baby back ribs on a gas grill. Features an effortless homemade pork rub and a simple sweet glaze—no specialized equipment required.", "datePublished": "2024-10-07T06:35:11+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/baby-back-ribs-on-grill-recipe/Baby-Back-Ribs-on-Grill-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/baby-back-ribs-on-grill-recipe/Baby-Back-Ribs-on-Grill-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/baby-back-ribs-on-grill-recipe/Baby-Back-Ribs-on-Grill-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/baby-back-ribs-on-grill-recipe/Baby-Back-Ribs-on-Grill-Recipe1.png"], "recipeYield": ["6"], "prepTime": "PT20M", "cookTime": "PT60M", "totalTime": "PT80M", "recipeIngredient": ["½ cup orange marmalade (or substitute with peach or apricot preserves)", "1  rack baby back pork ribs", "1 cup unsweetened apple juice", "½ cup pork seasoning rub (recipe below)", "¼ cup apple cider vinegar", "aluminum foil", "1  large disposable aluminum tray"], "recipeInstructions": [{"@type": "HowToStep", "text": "Take the baby back pork ribs from their packaging and thoroughly pat them dry using a paper towel. Lightly oil or coat the disposable aluminum pan with nonstick spray, then place the ribs inside. Carefully remove the silver skin from the underside of the ribs. Sprinkle a portion of the pork seasoning rub over the back of the ribs, massaging it firmly into the meat. Optionally, cut the rack in half for easier handling on the grill. Turn the ribs over and apply rub to the other side, pressing it in so it adheres. Discard any rub that doesn’t stick naturally. Pour the apple juice into the bottom of the pan, cover tightly with aluminum foil, and refrigerate until ready to grill.", "name": "Take the baby back pork ribs from their packaging and thoroughly pat them dry using a paper towel. Lightly oil or coat the disposable aluminum pan with nonstick spray, then place the ribs inside. Carefully remove the silver skin from the underside of the ribs. Sprinkle a portion of the pork seasoning rub over the back of the ribs, massaging it firmly into the meat. Optionally, cut the rack in half for easier handling on the grill. Turn the ribs over and apply rub to the other side, pressing it in so it adheres. Discard any rub that doesn’t stick naturally. Pour the apple juice into the bottom of the pan, cover tightly with aluminum foil, and refrigerate until ready to grill.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baby-back-ribs-on-grill-recipe/#wprm-recipe-51362-step-0-0"}, {"@type": "HowToStep", "text": "Preheat the gas grill to a steady 300°F, maintaining indirect heat by keeping the middle burner off and the outer burners on low if using a three-burner grill. Clean the grates well and lightly oil them. Set the covered pan of ribs onto the grill, close the lid, and cook for about an hour—possibly up to two—keeping the temperature consistent. The ribs are safe to eat at 145°F internally but aim for 180°F–190°F for peak tenderness; the meat should easily separate from the bone.", "name": "Preheat the gas grill to a steady 300°F, maintaining indirect heat by keeping the middle burner off and the outer burners on low if using a three-burner grill. Clean the grates well and lightly oil them. Set the covered pan of ribs onto the grill, close the lid, and cook for about an hour—possibly up to two—keeping the temperature consistent. The ribs are safe to eat at 145°F internally but aim for 180°F–190°F for peak tenderness; the meat should easily separate from the bone.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baby-back-ribs-on-grill-recipe/#wprm-recipe-51362-step-0-1"}, {"@type": "HowToStep", "text": "Remove the ribs from the pan and lay them directly onto the grill grates over low heat. In a small saucepan over medium heat, whisk together the orange marmalade and apple cider vinegar until well combined, about one to two minutes. Remove from heat and generously brush the glaze over the ribs. Close the grill lid and cook for five minutes, then baste once more and cook for an additional five minutes.", "name": "Remove the ribs from the pan and lay them directly onto the grill grates over low heat. In a small saucepan over medium heat, whisk together the orange marmalade and apple cider vinegar until well combined, about one to two minutes. Remove from heat and generously brush the glaze over the ribs. Close the grill lid and cook for five minutes, then baste once more and cook for an additional five minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baby-back-ribs-on-grill-recipe/#wprm-recipe-51362-step-0-2"}, {"@type": "HowToStep", "text": "Carefully transfer the ribs to a cutting board and allow them to rest briefly. Using a sharp knife, slice between the bones and serve warm.", "name": "Carefully transfer the ribs to a cutting board and allow them to rest briefly. Using a sharp knife, slice between the bones and serve warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baby-back-ribs-on-grill-recipe/#wprm-recipe-51362-step-0-3"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Baby Back Ribs on Grill Recipe"}</script>
