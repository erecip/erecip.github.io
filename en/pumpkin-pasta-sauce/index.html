    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Pasta Sauce", "author": {"@type": "Person", "name": "BenDes"}, "description": "A smooth, plant-based pumpkin pasta sauce made by roasting winter squash with tomatoes, red bell pepper, and garlic until tender and lightly caramelized. The roasted vegetables are blended with dairy-free cream to create a rich, velvety sauce, then tossed with pasta and finished with fresh herbs, vegan feta, walnuts, and optional chili flakes.", "datePublished": "2018-01-28T12:15:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/pumpkin-pasta-sauce.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/pumpkin-pasta-sauce.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/pumpkin-pasta-sauce.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/pumpkin-pasta-sauce.png"], "totalTime": "PT30M", "recipeIngredient": ["4  garlic cloves (left whole until prepared for roasting)", "7 oz plant-based cooking cream (such as oat or soy cream)", "1  red bell pepper", "Salt and freshly ground black pepper (as needed)", "3  small tomatoes or 1 large tomato", "2  –3 tbsp olive oil (preferably extra-virgin)", "21.2 oz pumpkin or winter squash (such as butternut, seeded and cut into cubes)", "Fresh parsley or sage (finely chopped as desired)", "14 oz dried pasta (such as fusilli or penne)", "Vegan feta cheese (for topping)", "Chili flakes (optional)", "Walnuts (preferably toasted, for serving)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 392°F (200°C).", "name": "Preheat the oven to 392°F (200°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-0"}, {"@type": "HowToStep", "text": "Wash the pumpkin or winter squash, cut it in half, remove the seeds, and dice the flesh into cubes. Wash the red bell pepper, remove its seeds, and cut it into pieces.", "name": "Wash the pumpkin or winter squash, cut it in half, remove the seeds, and dice the flesh into cubes. Wash the red bell pepper, remove its seeds, and cut it into pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-1"}, {"@type": "HowToStep", "text": "Rinse the tomatoes, remove the stem area, and cut them into quarters. Peel the garlic cloves.", "name": "Rinse the tomatoes, remove the stem area, and cut them into quarters. Peel the garlic cloves.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the squash, bell pepper, tomatoes, and garlic to a baking dish. Drizzle everything with 2–3 tablespoons of olive oil, then season lightly with salt and black pepper.", "name": "Transfer the squash, bell pepper, tomatoes, and garlic to a baking dish. Drizzle everything with 2–3 tablespoons of olive oil, then season lightly with salt and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-3"}, {"@type": "HowToStep", "text": "Roast for approximately 30 minutes, or until the vegetables are soft and have developed slight caramelization around the edges.", "name": "Roast for approximately 30 minutes, or until the vegetables are soft and have developed slight caramelization around the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-4"}, {"@type": "HowToStep", "text": "During the final 5–10 minutes of the vegetable roasting time, bring a large pot of well-salted water to a boil.", "name": "During the final 5–10 minutes of the vegetable roasting time, bring a large pot of well-salted water to a boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-5"}, {"@type": "HowToStep", "text": "Add the 14 oz dried pasta and cook according to the package directions until al dente, timing it so the pasta finishes at roughly the same time as the roasted vegetables.", "name": "Add the 14 oz dried pasta and cook according to the package directions until al dente, timing it so the pasta finishes at roughly the same time as the roasted vegetables.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-6"}, {"@type": "HowToStep", "text": "Allow the roasted vegetables to cool briefly after removing them from the oven.", "name": "Allow the roasted vegetables to cool briefly after removing them from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-7"}, {"@type": "HowToStep", "text": "Place the vegetables in a blender, or transfer them to a suitable container for an immersion blender. Add the 7 oz plant-based cream.", "name": "Place the vegetables in a blender, or transfer them to a suitable container for an immersion blender. Add the 7 oz plant-based cream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-8"}, {"@type": "HowToStep", "text": "Blend thoroughly until the mixture becomes completely smooth and creamy.", "name": "Blend thoroughly until the mixture becomes completely smooth and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-9"}, {"@type": "HowToStep", "text": "Taste and adjust the seasoning with additional salt and black pepper if necessary. If the sauce is thicker than desired, blend in a small quantity of water until the preferred consistency is reached. Continue blending a little longer for an especially silky texture.", "name": "Taste and adjust the seasoning with additional salt and black pepper if necessary. If the sauce is thicker than desired, blend in a small quantity of water until the preferred consistency is reached. Continue blending a little longer for an especially silky texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-10"}, {"@type": "HowToStep", "text": "Drain the cooked pasta and transfer it back to the pot or into a large serving bowl. Reserving a small amount of the pasta cooking water is useful in case the sauce requires thinning.", "name": "Drain the cooked pasta and transfer it back to the pot or into a large serving bowl. Reserving a small amount of the pasta cooking water is useful in case the sauce requires thinning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-11"}, {"@type": "HowToStep", "text": "Pour the creamy pumpkin sauce over the pasta and toss thoroughly until every piece is evenly coated. Add a splash of the reserved pasta water if a looser consistency is needed.", "name": "Pour the creamy pumpkin sauce over the pasta and toss thoroughly until every piece is evenly coated. Add a splash of the reserved pasta water if a looser consistency is needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-12"}, {"@type": "HowToStep", "text": "Portion the pumpkin pasta into individual bowls or plates.", "name": "Portion the pumpkin pasta into individual bowls or plates.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-13"}, {"@type": "HowToStep", "text": "Finish each serving with finely chopped parsley or sage, crumbled vegan feta, and walnuts. Sprinkle with chili flakes if additional heat is desired.", "name": "Finish each serving with finely chopped parsley or sage, crumbled vegan feta, and walnuts. Sprinkle with chili flakes if additional heat is desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-sauce/#wprm-recipe-41072-step-0-14"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Contemporary Plant-Based"], "keywords": "Pumpkin Pasta Sauce"}</script>
