    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Candy Corn Brownies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Rich, fudgy chocolate brownies are finished with a glossy layer of chocolate icing, colorful candy corn, and a decorative chocolate drizzle. Chopped walnuts may be included for additional texture.", "datePublished": "2018-07-07T06:35:05+00:00", "image": ["https://erecip.github.io/en/candy-corn-brownies/candy-corn-brownies2.png", "https://erecip.github.io/en/candy-corn-brownies/candy-corn-brownies2.png", "https://erecip.github.io/en/candy-corn-brownies/candy-corn-brownies2.png", "https://erecip.github.io/en/candy-corn-brownies/candy-corn-brownies2.png"], "prepTime": "PT15M", "cookTime": "PT20M", "totalTime": "PT50M", "recipeIngredient": ["2  large eggs (brought to room temperature)", "4 tablespoons unsweetened cocoa powder", "½ cup unsalted butter (melted and allowed to cool slightly)", "½ cup chopped walnuts (optional)", "½ cup all-purpose flour (measured slightly heaping)", "1 cup granulated sugar", "1 cup candy corn pieces", "½ cup melted chocolate (preferably milk chocolate chips)", "1 cup prepared chocolate icing (homemade or store-bought)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Coat an 8 × 8-inch glass baking pan evenly with cooking spray to prevent the brownies from adhering.", "name": "Preheat the oven to 350°F (175°C). Coat an 8 × 8-inch glass baking pan evenly with cooking spray to prevent the brownies from adhering.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-0"}, {"@type": "HowToStep", "text": "Place the melted butter and cocoa powder in a large mixing bowl. Stir thoroughly until the mixture becomes smooth and evenly chocolate-colored.", "name": "Place the melted butter and cocoa powder in a large mixing bowl. Stir thoroughly until the mixture becomes smooth and evenly chocolate-colored.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-1"}, {"@type": "HowToStep", "text": "Add the granulated sugar and room-temperature eggs. Beat until all ingredients are fully incorporated and the batter has a uniform consistency.", "name": "Add the granulated sugar and room-temperature eggs. Beat until all ingredients are fully incorporated and the batter has a uniform consistency.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-2"}, {"@type": "HowToStep", "text": "Fold in the slightly heaping flour and the chopped walnuts, if using. Mix only until no visible streaks of flour remain, taking care not to overwork the batter.", "name": "Fold in the slightly heaping flour and the chopped walnuts, if using. Mix only until no visible streaks of flour remain, taking care not to overwork the batter.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the brownie mixture to the prepared baking pan. Use a spatula to distribute the batter evenly across the pan.", "name": "Transfer the brownie mixture to the prepared baking pan. Use a spatula to distribute the batter evenly across the pan.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-4"}, {"@type": "HowToStep", "text": "Bake for approximately 20 minutes, or until the brownies have puffed slightly while the surface remains somewhat moist. Oven temperatures may vary, so monitor the brownies closely near the end of the baking period.", "name": "Bake for approximately 20 minutes, or until the brownies have puffed slightly while the surface remains somewhat moist. Oven temperatures may vary, so monitor the brownies closely near the end of the baking period.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-5"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and place it on a wire cooling rack. Let the brownies rest for approximately 15 minutes; they should remain slightly warm.", "name": "Remove the pan from the oven and place it on a wire cooling rack. Let the brownies rest for approximately 15 minutes; they should remain slightly warm.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-6"}, {"@type": "HowToStep", "text": "Spread the chocolate icing evenly over the warm surface. Applying the icing before the brownies cool completely helps create a smooth, glossy finish.", "name": "Spread the chocolate icing evenly over the warm surface. Applying the icing before the brownies cool completely helps create a smooth, glossy finish.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-7"}, {"@type": "HowToStep", "text": "Immediately scatter the candy corn pieces evenly over the freshly frosted brownies.", "name": "Immediately scatter the candy corn pieces evenly over the freshly frosted brownies.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-8"}, {"@type": "HowToStep", "text": "Leave the brownies at room temperature until they have cooled completely.", "name": "Leave the brownies at room temperature until they have cooled completely.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-9"}, {"@type": "HowToStep", "text": "Once fully cooled, drizzle the melted chocolate over the top using a fork or piping bag to create a decorative pattern.", "name": "Once fully cooled, drizzle the melted chocolate over the top using a fork or piping bag to create a decorative pattern.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-10"}, {"@type": "HowToStep", "text": "Allow the chocolate drizzle to set. Using a sharp knife, divide the brownies into 16 evenly sized bars before serving.", "name": "Allow the chocolate drizzle to set. Using a sharp knife, divide the brownies into 16 evenly sized bars before serving.", "url": "https://erecip.github.io/en/candy-corn-brownies/#wprm-recipe-40073-step-0-11"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Candy Corn Brownies"}</script>
