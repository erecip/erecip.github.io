d.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-enchilada-casserole/#wprm-recipe-44926-step-0-9"}, {"@type": "HowToStep", "text": "Spread ½ cup of enchilada sauce across the bottom of the prepared baking dish.", "name": "Spread ½ cup of enchilada sauce across the bottom of the prepared baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-enchilada-casserole/#wprm-recipe-44926-step-0-10"}, {"@type": "HowToStep", "text": "Coat 6 corn tortillas in the remaining enchilada sauce, then arrange them across the bottom of the dish to create the first tortilla layer.", "name": "Coat 6 corn tortillas in the remaining enchilada sauce, then arrange them across the bottom of the dish to create the first tortilla layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-enchilada-casserole/#wprm-recipe-44926-step-0-11"}, {"@type": "HowToStep", "text": "Divide the beef filling into two equal portions. Spread one half evenly over the tortillas, then scatter 1 cup of shredded Colby Jack cheese over the beef.", "name": "Divide the beef filling into two equal portions. Spread one half evenly over the tortillas, then scatter 1 cup of shredded Colby Jack cheese over the beef.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-enchilada-casserole/#wprm-recipe-44926-step-0-12"}, {"@type": "HowToStep", "text": "Dip the remaining 6 tortillas into the enchilada sauce and arrange them over the cheese layer.", "name": "Dip the remaining 6 tortillas into the enchilada sauce and arrange them over the cheese layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-enchilada-casserole/#wprm-recipe-44926-step-0-13"}, {"@type": "HowToStep", "text": "Spread the remaining beef mixture over the second tortilla layer. Finish by distributing the remaining 2 cups of Colby Jack cheese evenly across the top.", "name": "Spread the remaining beef mixture over the second tortilla layer. Finish by distributing
