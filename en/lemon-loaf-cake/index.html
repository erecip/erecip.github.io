    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Loaf Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "This tender lemon loaf combines fresh citrus juice and finely grated zest with butter, vanilla, and a smooth lemon glaze. The cake bakes with a golden exterior and a characteristic split along the center, while the icing adds a bright, sweet finish.", "datePublished": "2023-06-12T18:40:07+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/lemon-loaf-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/lemon-loaf-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/lemon-loaf-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/lemon-loaf-cake.png"], "cookTime": "PT60M", "totalTime": "PT105M", "recipeIngredient": ["3  large eggs (brought to room temperature)", "2 tablespoons finely grated lemon peel (obtained from approximately 2 lemons)", "1 cup granulated white sugar", "¼ cup milk (at room temperature)", "1½ cups all-purpose flour", "2 teaspoons pure vanilla extract", "2 tablespoons freshly pressed lemon juice", "1 cup unsalted butter (preferably cultured, softened to approximately 70°F)", "¼ teaspoon fine salt", "2 tablespoons mild-flavored oil (such as vegetable or canola oil)", "1 teaspoon baking powder", "1 tablespoon freshly squeezed lemon juice", "1 tablespoon milk or 2 tablespoons heavy cream", "1 cup confectioners’ sugar (sifted to remove lumps)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Set the oven to 350°F (175°C). Lightly grease an 8.5 x 4.5-inch loaf pan, then fit it with parchment paper so the baked cake can be removed cleanly.", "name": "Set the oven to 350°F (175°C). Lightly grease an 8.5 x 4.5-inch loaf pan, then fit it with parchment paper so the baked cake can be removed cleanly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-0"}, {"@type": "HowToStep", "text": "Place the all-purpose flour, granulated sugar, baking powder, and salt in a large mixing bowl. Using a hand mixer or stand mixer fitted with the paddle attachment, mix until the dry ingredients are evenly distributed.", "name": "Place the all-purpose flour, granulated sugar, baking powder, and salt in a large mixing bowl. Using a hand mixer or stand mixer fitted with the paddle attachment, mix until the dry ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-1"}, {"@type": "HowToStep", "text": "Add the softened unsalted butter to the dry mixture. Beat at medium speed only until the butter is completely worked into the ingredients and the mixture appears smooth and cohesive. Avoid excessive mixing at this stage.", "name": "Add the softened unsalted butter to the dry mixture. Beat at medium speed only until the butter is completely worked into the ingredients and the mixture appears smooth and cohesive. Avoid excessive mixing at this stage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-2"}, {"@type": "HowToStep", "text": "In a separate 2-cup measuring vessel, whisk together the eggs, milk, vanilla extract, neutral oil, lemon zest, and lemon juice.", "name": "In a separate 2-cup measuring vessel, whisk together the eggs, milk, vanilla extract, neutral oil, lemon zest, and lemon juice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-3"}, {"@type": "HowToStep", "text": "Keep the mixer operating at medium speed and gradually stream the liquid mixture into the butter and flour base. Continue mixing until the batter is evenly combined.", "name": "Keep the mixer operating at medium speed and gradually stream the liquid mixture into the butter and flour base. Continue mixing until the batter is evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-4"}, {"@type": "HowToStep", "text": "Should the batter remain slightly lumpy, increase the mixer speed for 10 to 15 seconds, stopping as soon as the texture becomes smooth.", "name": "Should the batter remain slightly lumpy, increase the mixer speed for 10 to 15 seconds, stopping as soon as the texture becomes smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-5"}, {"@type": "HowToStep", "text": "Use a rubber spatula to fold the batter several times by hand, scraping along the bottom and sides of the bowl to eliminate any remaining pockets of dry flour.", "name": "Use a rubber spatula to fold the batter several times by hand, scraping along the bottom and sides of the bowl to eliminate any remaining pockets of dry flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the finished batter to the prepared loaf pan. Smooth the surface into an even layer with a spatula.", "name": "Transfer the finished batter to the prepared loaf pan. Smooth the surface into an even layer with a spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-7"}, {"@type": "HowToStep", "text": "Bake for 1 hour to 1 hour 10 minutes. The loaf is ready when the top is puffed and golden brown, with a pronounced crack running through the center.", "name": "Bake for 1 hour to 1 hour 10 minutes. The loaf is ready when the top is puffed and golden brown, with a pronounced crack running through the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-8"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and leave the cake to cool at room temperature for approximately 45 minutes.", "name": "Remove the pan from the oven and leave the cake to cool at room temperature for approximately 45 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-9"}, {"@type": "HowToStep", "text": "While the loaf cools, place the sifted confectioners’ sugar, lemon juice, and milk or heavy cream in a bowl. Whisk until completely smooth and thick enough to resemble the consistency of glue.", "name": "While the loaf cools, place the sifted confectioners’ sugar, lemon juice, and milk or heavy cream in a bowl. Whisk until completely smooth and thick enough to resemble the consistency of glue.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-10"}, {"@type": "HowToStep", "text": "When the glaze is too fluid, incorporate a small amount of additional confectioners’ sugar. When it is overly thick, loosen it with very small additions of milk or cream until the proper texture is reached.", "name": "When the glaze is too fluid, incorporate a small amount of additional confectioners’ sugar. When it is overly thick, loosen it with very small additions of milk or cream until the proper texture is reached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-11"}, {"@type": "HowToStep", "text": "Once the loaf has cooled completely, lift it from the pan and position it on a serving plate or wire rack.", "name": "Once the loaf has cooled completely, lift it from the pan and position it on a serving plate or wire rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-12"}, {"@type": "HowToStep", "text": "Pour the lemon icing over the surface. Guide it gently with a spatula, allowing some of the glaze to flow naturally down the sides.", "name": "Pour the lemon icing over the surface. Guide it gently with a spatula, allowing some of the glaze to flow naturally down the sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-13"}, {"@type": "HowToStep", "text": "Let the icing firm slightly before cutting the loaf into slices.", "name": "Let the icing firm slightly before cutting the loaf into slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-loaf-cake/#wprm-recipe-40032-step-0-14"}], "recipeCategory": ["cake", "Dessert"], "keywords": "Lemon Loaf Cake"}</script>
