    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Pie From Scratch Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This from-scratch pumpkin pie combines smooth pumpkin purée with warm baking spices, brown and granulated sugars, rich dairy, and a splash of cognac or bourbon. The filling is gently cooked before baking, producing a creamy, fragrant custard inside a crisp homemade pie crust.", "datePublished": "2020-10-29T13:50:33+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/pumpkin-pie-from-scratch-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/pumpkin-pie-from-scratch-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/pumpkin-pie-from-scratch-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/pumpkin-pie-from-scratch-recipe.png"], "cookTime": "PT45M", "totalTime": "PT285M", "recipeIngredient": ["1  large egg (gently beaten)", "1 teaspoon water", "2 cups smooth pumpkin purée (about 15 ounces)", "1/4 cup sour cream", "3/4 teaspoon ground nutmeg", "3 tablespoons cognac (or bourbon for an alternative flavor)", "1/2 teaspoon sea salt", "2 tablespoons cornmeal", "1/4 teaspoon ground cloves", "1/2 cup firmly packed light brown sugar", "1 teaspoon vanilla essence", "1/2 cup heavy cream (for a richer and creamier filling)", "3  large eggs (lightly beaten)", "1 teaspoon ground ginger", "1/4 cup mascarpone cheese", "2 teaspoons ground cinnamon", "1/4 teaspoon ground allspice", "1/4 cup granulated sugar", "1  prepared disc of homemade pie dough (reserved from a two-disc batch)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the homemade pie crust dough and separate it into two discs. Reserve one disc for this pie, and refrigerate or freeze the second disc for another use.", "name": "Prepare the homemade pie crust dough and separate it into two discs. Reserve one disc for this pie, and refrigerate or freeze the second disc for another use.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-0"}, {"@type": "HowToStep", "text": "Chill the dough intended for the pumpkin pie for 30 minutes to 1 hour before rolling.", "name": "Chill the dough intended for the pumpkin pie for 30 minutes to 1 hour before rolling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-1"}, {"@type": "HowToStep", "text": "When using canned pumpkin, measure 15 ounces, or approximately 2 cups, and continue with the crust preparation.", "name": "When using canned pumpkin, measure 15 ounces, or approximately 2 cups, and continue with the crust preparation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-2"}, {"@type": "HowToStep", "text": "For fresh pumpkin purée, preheat the oven to 400°F (204°C). Cover a small rimmed baking sheet with two layers of parchment paper.", "name": "For fresh pumpkin purée, preheat the oven to 400°F (204°C). Cover a small rimmed baking sheet with two layers of parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-3"}, {"@type": "HowToStep", "text": "Remove the stems from two small sugar pumpkins or one large pumpkin. With a large, sharp knife, carefully slice the pumpkin into halves.", "name": "Remove the stems from two small sugar pumpkins or one large pumpkin. With a large, sharp knife, carefully slice the pumpkin into halves.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-4"}, {"@type": "HowToStep", "text": "Scoop out the seeds and fibrous interior. Discard the stringy pulp, reserving the seeds for roasting if desired.", "name": "Scoop out the seeds and fibrous interior. Discard the stringy pulp, reserving the seeds for roasting if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-5"}, {"@type": "HowToStep", "text": "Lightly season the cut interiors with salt. Arrange the pumpkin halves flesh-side down on the prepared baking sheet.", "name": "Lightly season the cut interiors with salt. Arrange the pumpkin halves flesh-side down on the prepared baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-6"}, {"@type": "HowToStep", "text": "Roast on the center oven rack for 35–40 minutes, or until the cooked flesh separates easily from the skin when scooped with a spoon.", "name": "Roast on the center oven rack for 35–40 minutes, or until the cooked flesh separates easily from the skin when scooped with a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-7"}, {"@type": "HowToStep", "text": "Let the roasted pumpkin cool. Scoop out the flesh and process it with an immersion blender or food processor until completely smooth.", "name": "Let the roasted pumpkin cool. Scoop out the flesh and process it with an immersion blender or food processor until completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-8"}, {"@type": "HowToStep", "text": "Drain away any excess liquid from the purée without pressing, squeezing, or mashing it to force out moisture.", "name": "Drain away any excess liquid from the purée without pressing, squeezing, or mashing it to force out moisture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-9"}, {"@type": "HowToStep", "text": "Roll the chilled pie dough into a circle measuring approximately 12–14 inches across. Carefully transfer it to a 9-inch pie plate.", "name": "Roll the chilled pie dough into a circle measuring approximately 12–14 inches across. Carefully transfer it to a 9-inch pie plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-10"}, {"@type": "HowToStep", "text": "Ease the pastry into the plate without stretching it. Fold the excess dough beneath itself around the rim to create a thicker border, then crimp the edge in the desired pattern.", "name": "Ease the pastry into the plate without stretching it. Fold the excess dough beneath itself around the rim to create a thicker border, then crimp the edge in the desired pattern.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-11"}, {"@type": "HowToStep", "text": "Using a fork, pierce several small holes across the base and sides of the crust.", "name": "Using a fork, pierce several small holes across the base and sides of the crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-12"}, {"@type": "HowToStep", "text": "Combine the lightly beaten egg with 1 teaspoon of water. Brush a thin layer of this egg wash over the crimped rim with a pastry brush.", "name": "Combine the lightly beaten egg with 1 teaspoon of water. Brush a thin layer of this egg wash over the crimped rim with a pastry brush.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-13"}, {"@type": "HowToStep", "text": "Refrigerate the shaped crust for 30 minutes, or place it in the freezer for 15 minutes, until well chilled and firm.", "name": "Refrigerate the shaped crust for 30 minutes, or place it in the freezer for 15 minutes, until well chilled and firm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-14"}, {"@type": "HowToStep", "text": "Preheat the oven to 425°F (220°C), with the oven rack positioned in the center.", "name": "Preheat the oven to 425°F (220°C), with the oven rack positioned in the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-15"}, {"@type": "HowToStep", "text": "Place a large saucepan over medium heat. Whisk together the light brown sugar, granulated sugar, cinnamon, ginger, nutmeg, cloves, allspice, sea salt, and cornmeal.", "name": "Place a large saucepan over medium heat. Whisk together the light brown sugar, granulated sugar, cinnamon, ginger, nutmeg, cloves, allspice, sea salt, and cornmeal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-16"}, {"@type": "HowToStep", "text": "Add the pumpkin purée, cognac or bourbon, and vanilla essence. Continue whisking until the mixture is evenly blended and smooth.", "name": "Add the pumpkin purée, cognac or bourbon, and vanilla essence. Continue whisking until the mixture is evenly blended and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-17"}, {"@type": "HowToStep", "text": "Cook for 4–5 minutes while whisking slowly. The mixture should become aromatic, begin to release visible steam or light smoke, and develop gentle bubbling.", "name": "Cook for 4–5 minutes while whisking slowly. The mixture should become aromatic, begin to release visible steam or light smoke, and develop gentle bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-18"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Whisk in the heavy cream, mascarpone cheese, sour cream, and beaten eggs until the filling is uniformly smooth.", "name": "Remove the saucepan from the heat. Whisk in the heavy cream, mascarpone cheese, sour cream, and beaten eggs until the filling is uniformly smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-19"}, {"@type": "HowToStep", "text": "Pour the warm pumpkin mixture into the thoroughly chilled pie shell. Set the pie on a parchment-lined baking sheet and place it on the middle oven rack.", "name": "Pour the warm pumpkin mixture into the thoroughly chilled pie shell. Set the pie on a parchment-lined baking sheet and place it on the middle oven rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-20"}, {"@type": "HowToStep", "text": "Bake at 425°F (220°C) for 15 minutes.", "name": "Bake at 425°F (220°C) for 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-21"}, {"@type": "HowToStep", "text": "Immediately reduce the oven temperature to 350°F (180°C) and continue baking for another 30–35 minutes. The majority of the filling should appear set, while the very center should retain a slight jiggle. Check the pie after 20, 25, and 30 minutes during this second stage of baking.", "name": "Immediately reduce the oven temperature to 350°F (180°C) and continue baking for another 30–35 minutes. The majority of the filling should appear set, while the very center should retain a slight jiggle. Check the pie after 20, 25, and 30 minutes during this second stage of baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-22"}, {"@type": "HowToStep", "text": "Transfer the pie dish to a wire cooling rack and leave it undisturbed for 2–3 hours, allowing the filling to cool completely and finish setting.", "name": "Transfer the pie dish to a wire cooling rack and leave it undisturbed for 2–3 hours, allowing the filling to cool completely and finish setting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-23"}, {"@type": "HowToStep", "text": "Refrigerate the cooled pie for an additional 2 hours before slicing and serving.", "name": "Refrigerate the cooled pie for an additional 2 hours before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-from-scratch-recipe/#wprm-recipe-45553-step-0-24"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Pie From Scratch Recipe"}</script>
