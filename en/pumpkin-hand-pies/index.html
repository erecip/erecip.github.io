xt": "If the pastry edges do not adhere easily, brush them lightly with some of the beaten egg before pressing them closed.", "name": "If the pastry edges do not adhere easily, brush them lightly with some of the beaten egg before pressing them closed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-hand-pies/#wprm-recipe-45385-step-0-7"}, {"@type": "HowToStep", "text": "Combine the raw sugar and ground cinnamon in a small bowl.", "name": "Combine the raw sugar and ground cinnamon in a small bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-hand-pies/#wprm-recipe-45385-step-0-8"}, {"@type": "HowToStep", "text": "Brush the surface of each hand pie with the remaining lightly beaten egg, then scatter the cinnamon-sugar mixture evenly over the tops.", "name": "Brush the surface of each hand pie with the remaining lightly beaten egg, then scatter the cinnamon-sugar mixture evenly over the tops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-hand-pies/#wprm-recipe-45385-step-0-9"}, {"@type": "HowToStep", "text": "Use the point of a knife or the tines of a fork to make a small opening in the top of each pie so steam can escape during baking.", "name": "Use the point of a knife or the tines of a fork to make a small opening in the top of each pie so steam can escape during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-hand-pies/#wprm-recipe-45385-step-0-10"}, {"@type": "HowToStep", "text": "Arrange the assembled hand pies on a cookie sheet.", "name": "Arrange the assembled hand pies on a cookie sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-hand-pies/#wprm-recipe-45385-step-0-11"}, {"@type": "HowToStep", "text": "Bake in the preheated 400°F oven for approximately 15 minutes, or until the pastry develops an even golden-brown color.", "name": "Bake in the preheated 400°F oven for approximately 15 minutes, or until the pastry develops an even golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-hand-pies/#wprm-recipe-45385-step-0-12"}, {"@type": "HowToStep", "text": "Remove the baked hand pies from the oven and allow them to cool slightly before serving.", "name": "Remove the baked hand pies from the oven and allow them to cool slightly before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-hand-pies/#wprm-recipe-45385-step-0-13"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Hand Pies"}</script>
