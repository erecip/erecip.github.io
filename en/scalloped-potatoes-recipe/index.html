nd bake for 45 minutes.", "name": "Repeat the layering process, seasoning with salt and pepper, ending with the remaining sauce on top. Cover the dish tightly with aluminum foil and bake for 45 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-recipe/#wprm-recipe-1581-step-0-5"}, {"@type": "HowToStep", "text": "Remove the foil and continue baking for an additional 35-45 minutes, or until the top is golden and the potatoes are tender. For a crispier top, broil for 3-4 minutes if desired.", "name": "Remove the foil and continue baking for an additional 35-45 minutes, or until the top is golden and the potatoes are tender. For a crispier top, broil for 3-4 minutes if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-recipe/#wprm-recipe-1581-step-0-6"}, {"@type": "HowToStep", "text": "Allow the dish to rest for at least 15 minutes before serving.", "name": "Allow the dish to rest for at least 15 minutes before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-recipe/#wprm-recipe-1581-step-0-7"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Scalloped Potatoes Recipe"}</script>
