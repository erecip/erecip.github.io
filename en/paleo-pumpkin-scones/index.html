    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Paleo Pumpkin Scones", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender and warmly spiced, these grain-free pumpkin scones combine almond, tapioca, and coconut flours for a delicate crumb. Chilled butter creates flaky layers, while a maple-spiced glaze provides a smooth, lightly sweet finish.", "datePublished": "2021-06-07T22:00:34+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/paleo-pumpkin-scones.png", "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/paleo-pumpkin-scones.png", "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/paleo-pumpkin-scones.png", "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/paleo-pumpkin-scones.png"], "prepTime": "PT20M", "cookTime": "PT20M", "totalTime": "PT70M", "recipeIngredient": ["½ cup well-drained pumpkin purée", "1¼ cups finely milled blanched almond flour", "6 tablespoons cold grass-fed butter (diced into small cubes)", "1  large egg (beaten)", "½ cup maple sugar or coconut sugar", "1 teaspoon ground cinnamon", "¼ cup full-fat coconut milk (plus additional milk for brushing)", "¾ cup tapioca starch or arrowroot starch", "½ teaspoon fine salt", "2 teaspoons pumpkin pie spice", "⅓ cup coconut flour", "½ teaspoon baking soda", "1½ teaspoons aluminum-free baking powder", "Extra tapioca starch or arrowroot flour (for shaping)", "¼ teaspoon pumpkin pie spice", "⅔ cup powdered maple sugar (sifted)", "2  –3 teaspoons coconut milk", "¼ teaspoon pure vanilla extract"], "recipeInstructions": [{"@type": "HowToStep", "text": "Measure all ingredients before beginning. Sift the powdered maple sugar to eliminate any clumps, then return it to a dry bowl until needed. Keep the cubed butter refrigerated so it remains firm.", "name": "Measure all ingredients before beginning. Sift the powdered maple sugar to eliminate any clumps, then return it to a dry bowl until needed. Keep the cubed butter refrigerated so it remains firm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, thoroughly whisk together the almond flour, tapioca starch, coconut flour, maple or coconut sugar, baking powder, baking soda, salt, cinnamon, and pumpkin pie spice. Continue mixing until the spices and leavening agents are evenly dispersed.", "name": "In a large mixing bowl, thoroughly whisk together the almond flour, tapioca starch, coconut flour, maple or coconut sugar, baking powder, baking soda, salt, cinnamon, and pumpkin pie spice. Continue mixing until the spices and leavening agents are evenly dispersed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-1"}, {"@type": "HowToStep", "text": "Add the chilled butter cubes to the flour mixture. Using a pastry blender, fork, or cool fingertips, work the butter into the dry ingredients until the mixture resembles coarse crumbs with visible pea-sized pieces of butter. Handle the mixture quickly to prevent the butter from softening.", "name": "Add the chilled butter cubes to the flour mixture. Using a pastry blender, fork, or cool fingertips, work the butter into the dry ingredients until the mixture resembles coarse crumbs with visible pea-sized pieces of butter. Handle the mixture quickly to prevent the butter from softening.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-2"}, {"@type": "HowToStep", "text": "In a separate small bowl, combine the beaten egg, drained pumpkin purée, and coconut milk. Stir until the mixture is smooth and evenly blended.", "name": "In a separate small bowl, combine the beaten egg, drained pumpkin purée, and coconut milk. Stir until the mixture is smooth and evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-3"}, {"@type": "HowToStep", "text": "Form a hollow in the center of the dry mixture and pour in the pumpkin mixture. Fold gently with a spatula or wooden spoon just until a cohesive dough develops. Avoid excessive mixing; a few faint traces of dry flour may remain.", "name": "Form a hollow in the center of the dry mixture and pour in the pumpkin mixture. Fold gently with a spatula or wooden spoon just until a cohesive dough develops. Avoid excessive mixing; a few faint traces of dry flour may remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-4"}, {"@type": "HowToStep", "text": "Cover the bowl and place the dough in the freezer for 30 minutes. During the chilling period, preheat the oven to 400°F (204°C) and line a baking sheet with parchment paper.", "name": "Cover the bowl and place the dough in the freezer for 30 minutes. During the chilling period, preheat the oven to 400°F (204°C) and line a baking sheet with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-5"}, {"@type": "HowToStep", "text": "Dust the prepared parchment lightly with tapioca starch or arrowroot flour. Transfer the chilled dough to the baking sheet with dampened hands and carefully form it into a round disk measuring approximately 7–8 inches across and ¾ inch thick.", "name": "Dust the prepared parchment lightly with tapioca starch or arrowroot flour. Transfer the chilled dough to the baking sheet with dampened hands and carefully form it into a round disk measuring approximately 7–8 inches across and ¾ inch thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-6"}, {"@type": "HowToStep", "text": "Moisten a knife and slice the disk into 8 evenly sized wedges, wetting the blade again between cuts when necessary. Gently move the wedges apart, leaving enough space for them to expand and brown during baking.", "name": "Moisten a knife and slice the disk into 8 evenly sized wedges, wetting the blade again between cuts when necessary. Gently move the wedges apart, leaving enough space for them to expand and brown during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-7"}, {"@type": "HowToStep", "text": "Using a pastry brush, lightly coat the surface of each wedge with coconut milk. Bake for approximately 20 minutes, or until the tops are pale golden and the scones are set while remaining tender in the center.", "name": "Using a pastry brush, lightly coat the surface of each wedge with coconut milk. Bake for approximately 20 minutes, or until the tops are pale golden and the scones are set while remaining tender in the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-8"}, {"@type": "HowToStep", "text": "Allow the scones to rest on the baking sheet for 5–10 minutes before applying the glaze.", "name": "Allow the scones to rest on the baking sheet for 5–10 minutes before applying the glaze.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-9"}, {"@type": "HowToStep", "text": "While the scones cool, whisk the sifted powdered maple sugar with 2 teaspoons coconut milk, the vanilla extract, and pumpkin pie spice. Continue whisking until smooth. Add the remaining coconut milk gradually, one teaspoon at a time, only as needed to produce a thick but pourable consistency.", "name": "While the scones cool, whisk the sifted powdered maple sugar with 2 teaspoons coconut milk, the vanilla extract, and pumpkin pie spice. Continue whisking until smooth. Add the remaining coconut milk gradually, one teaspoon at a time, only as needed to produce a thick but pourable consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-10"}, {"@type": "HowToStep", "text": "Drizzle the glaze generously over the cooled scones. Leave them undisturbed for several minutes so the coating can settle into a delicate, lightly set finish.", "name": "Drizzle the glaze generously over the cooled scones. Leave them undisturbed for several minutes so the coating can settle into a delicate, lightly set finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paleo-pumpkin-scones/#wprm-recipe-39811-step-0-11"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Paleo Pumpkin Scones"}</script>
