    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Italian Wedding Soup Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A beloved Italian-American classic, Italian Wedding Soup harmonizes tender mini meatballs, pasta, and leafy greens in a rich chicken broth. Despite the name, its origins lie in the Italian phrase \"minestra maritata,\" describing the delightful union of meat and vegetables. This nourishing soup is a staple for both family dinners and festive gatherings.", "datePublished": "2024-08-27T07:12:58+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/italian-wedding-soup-recipe/Italian-Wedding-Soup-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/italian-wedding-soup-recipe/Italian-Wedding-Soup-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/italian-wedding-soup-recipe/Italian-Wedding-Soup-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/italian-wedding-soup-recipe/Italian-Wedding-Soup-Recipe1.png"], "recipeYield": ["6"], "prepTime": "PT15M", "cookTime": "PT60M", "totalTime": "PT75M", "recipeIngredient": ["½ pound ground pork", "1 teaspoon kosher salt (such as Diamond Crystal)", "3 tablespoons chopped fresh parsley", "½ pound ground beef", "½ cup Italian bread crumbs or panko", "1 teaspoon dried oregano", "2  large garlic cloves (minced (about 1 tablespoon))", "⅓ cup grated Parmesan", "1  large egg", "½ teaspoon black pepper", "Olive oil (for shaping the meatballs)", "3 tablespoons olive oil", "2 to 3  large celery ribs (diced (about 1½ cups))", "½ cup acini di pepe (ditalini, or orzo)", "3 cups packed baby spinach", "Kosher salt (such as Diamond Crystal and black pepper)", "8 cups 2 quarts chicken broth, plus more if necessary", "2  large garlic cloves (minced (about 1 tablespoon))", "3  medium carrots (diced (about 2 cups))", "Grated Parmesan (for garnish)", "1  large yellow onion (chopped (about 2 cups))"], "recipeInstructions": [{"@type": "HowToStep", "text": "Crack the egg into a large mixing bowl and whisk lightly. Incorporate the ground beef, ground pork, bread crumbs, Parmesan, parsley, minced garlic, oregano, salt, and pepper. Combine the mixture thoroughly without overworking. Lightly coat hands with olive oil and shape the mixture into 1-inch meatballs using about 1 heaping teaspoon per meatball. Set aside on a plate or baking sheet; expect approximately 80 meatballs.", "name": "Crack the egg into a large mixing bowl and whisk lightly. Incorporate the ground beef, ground pork, bread crumbs, Parmesan, parsley, minced garlic, oregano, salt, and pepper. Combine the mixture thoroughly without overworking. Lightly coat hands with olive oil and shape the mixture into 1-inch meatballs using about 1 heaping teaspoon per meatball. Set aside on a plate or baking sheet; expect approximately 80 meatballs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-wedding-soup-recipe/#wprm-recipe-13614-step-0-0"}, {"@type": "HowToStep", "text": "Warm the olive oil in a large Dutch oven or heavy-bottomed pot over medium heat. Working in two batches, sear the meatballs until browned on most sides, about 3 to 4 minutes per batch. Transfer to a paper towel-lined plate.", "name": "Warm the olive oil in a large Dutch oven or heavy-bottomed pot over medium heat. Working in two batches, sear the meatballs until browned on most sides, about 3 to 4 minutes per batch. Transfer to a paper towel-lined plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-wedding-soup-recipe/#wprm-recipe-13614-step-0-1"}, {"@type": "HowToStep", "text": "To the same pot, add the onion, diced carrots, and celery. Sauté the vegetables until they are beginning to soften but still retain some bite, roughly 10 minutes. Stir in the minced garlic, along with 1 teaspoon salt (use 2 teaspoons if the broth is low-sodium) and ½ teaspoon pepper. Cook for an additional minute until the garlic becomes aromatic.", "name": "To the same pot, add the onion, diced carrots, and celery. Sauté the vegetables until they are beginning to soften but still retain some bite, roughly 10 minutes. Stir in the minced garlic, along with 1 teaspoon salt (use 2 teaspoons if the broth is low-sodium) and ½ teaspoon pepper. Cook for an additional minute until the garlic becomes aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-wedding-soup-recipe/#wprm-recipe-13614-step-0-2"}, {"@type": "HowToStep", "text": "Return the browned meatballs to the pot, pour in the chicken broth, and bring the soup to a simmer over medium-high heat. Stir in the pasta, reduce the heat, and let it simmer gently until the pasta is fully cooked, about 10 minutes.", "name": "Return the browned meatballs to the pot, pour in the chicken broth, and bring the soup to a simmer over medium-high heat. Stir in the pasta, reduce the heat, and let it simmer gently until the pasta is fully cooked, about 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-wedding-soup-recipe/#wprm-recipe-13614-step-0-3"}, {"@type": "HowToStep", "text": "Switch off the heat and mix in the spinach, stirring until the leaves have wilted. Taste and adjust seasoning as needed. Serve the soup hot, generously sprinkled with grated Parmesan. Note that the pasta will continue to absorb liquid over time; additional broth may be needed when reheating.", "name": "Switch off the heat and mix in the spinach, stirring until the leaves have wilted. Taste and adjust seasoning as needed. Serve the soup hot, generously sprinkled with grated Parmesan. Note that the pasta will continue to absorb liquid over time; additional broth may be needed when reheating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-wedding-soup-recipe/#wprm-recipe-13614-step-0-4"}], "recipeCategory": ["Soup"], "recipeCuisine": ["Italian"]}</script>
