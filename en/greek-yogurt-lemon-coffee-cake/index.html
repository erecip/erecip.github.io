    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Greek Yogurt Lemon Coffee Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender lemon coffee cake made with rich Greek yogurt, fresh lemon zest, and a smooth cream cheese layer, finished with a buttery flour crumble. The bright citrus flavor balances the creamy filling, while the crumb topping adds a delicate contrast in texture.", "datePublished": "2022-12-21T03:40:43+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/greek-yogurt-lemon-coffee-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/greek-yogurt-lemon-coffee-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/greek-yogurt-lemon-coffee-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/greek-yogurt-lemon-coffee-cake2.png"], "cookTime": "PT40M", "totalTime": "PT40M", "recipeIngredient": ["8 ounces Greek yogurt cream cheese (softened to approximately 70°F; regular cream cheese may also be used)", "1  large egg", "¼ cup granulated sugar", "1½ teaspoons freshly squeezed lemon juice", "1½ cups all-purpose flour", "Finely grated zest of 1 lemon (avoiding the bitter white pith)", "½ cup plain full-fat Greek yogurt", "¾ cup granulated sugar", "1  large egg", "1 tablespoon lemon juice", "½ cup vegetable oil", "½ teaspoon baking powder", "¼ teaspoon fine salt", "¼ teaspoon baking soda", "2 tablespoons cold unsalted butter (cut into small cubes)", "½ cup all-purpose flour", "¼ cup granulated sugar", "Powdered sugar (for an optional dusting)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Line an 8 x 8-inch baking dish with parchment paper, allowing excess parchment to extend beyond two opposite sides so the baked cake can be lifted from the pan easily. If parchment is unavailable, thoroughly coat the baking dish with nonstick cooking spray.", "name": "Preheat the oven to 350°F (175°C). Line an 8 x 8-inch baking dish with parchment paper, allowing excess parchment to extend beyond two opposite sides so the baked cake can be lifted from the pan easily. If parchment is unavailable, thoroughly coat the baking dish with nonstick cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened Greek yogurt cream cheese, granulated sugar, egg, and freshly squeezed lemon juice in a medium mixing bowl. Stir until the ingredients are completely blended and the mixture has a smooth, creamy consistency. Set aside while preparing the cake batter.", "name": "Place the softened Greek yogurt cream cheese, granulated sugar, egg, and freshly squeezed lemon juice in a medium mixing bowl. Stir until the ingredients are completely blended and the mixture has a smooth, creamy consistency. Set aside while preparing the cake batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-1"}, {"@type": "HowToStep", "text": "In a separate medium bowl, whisk together the all-purpose flour, baking powder, baking soda, and salt until evenly distributed. Reserve this mixture for incorporation into the wet ingredients.", "name": "In a separate medium bowl, whisk together the all-purpose flour, baking powder, baking soda, and salt until evenly distributed. Reserve this mixture for incorporation into the wet ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-2"}, {"@type": "HowToStep", "text": "Add the vegetable oil and granulated sugar to the bowl of an electric stand mixer and mix until combined. Add the egg and continue mixing until fully incorporated.", "name": "Add the vegetable oil and granulated sugar to the bowl of an electric stand mixer and mix until combined. Add the egg and continue mixing until fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-3"}, {"@type": "HowToStep", "text": "Blend in the Greek yogurt, finely grated lemon zest, and lemon juice. Mix at medium speed until the wet mixture appears smooth and creamy.", "name": "Blend in the Greek yogurt, finely grated lemon zest, and lemon juice. Mix at medium speed until the wet mixture appears smooth and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-4"}, {"@type": "HowToStep", "text": "Gradually add the prepared dry ingredients, mixing at low speed only until no visible streaks of flour remain. Avoid excessive mixing, as overworking the batter can result in a denser cake.", "name": "Gradually add the prepared dry ingredients, mixing at low speed only until no visible streaks of flour remain. Avoid excessive mixing, as overworking the batter can result in a denser cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the lemon cake batter to the prepared baking dish. Spread it into an even layer, smoothing the batter toward the edges of the pan.", "name": "Transfer the lemon cake batter to the prepared baking dish. Spread it into an even layer, smoothing the batter toward the edges of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-6"}, {"@type": "HowToStep", "text": "Carefully distribute the cream cheese mixture over the cake batter, spreading it almost to the edges to create a distinct creamy layer.", "name": "Carefully distribute the cream cheese mixture over the cake batter, spreading it almost to the edges to create a distinct creamy layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-7"}, {"@type": "HowToStep", "text": "Combine the flour and granulated sugar in a medium bowl. Add the cold cubed unsalted butter.", "name": "Combine the flour and granulated sugar in a medium bowl. Add the cold cubed unsalted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-8"}, {"@type": "HowToStep", "text": "Using a pastry cutter or two forks, work the butter into the dry ingredients until the mixture develops coarse, pea-sized crumbs. Scatter the crumble evenly over the cream cheese layer.", "name": "Using a pastry cutter or two forks, work the butter into the dry ingredients until the mixture develops coarse, pea-sized crumbs. Scatter the crumble evenly over the cream cheese layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-9"}, {"@type": "HowToStep", "text": "Bake at 350°F (175°C) for 40–45 minutes, until the surface is golden and a toothpick inserted near the center comes out clean.", "name": "Bake at 350°F (175°C) for 40–45 minutes, until the surface is golden and a toothpick inserted near the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-10"}, {"@type": "HowToStep", "text": "Allow the coffee cake to cool in the baking pan. Once cooled, lightly dust the surface with powdered sugar, if desired.", "name": "Allow the coffee cake to cool in the baking pan. Once cooled, lightly dust the surface with powdered sugar, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-yogurt-lemon-coffee-cake/#wprm-recipe-41815-step-0-11"}, {"@type": "HowToStep", "text": "Using the parchment overhang, lift the cake from the pan and place it on a cutting board.
