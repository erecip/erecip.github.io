    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Peanut Butter Bars", "author": {"@type": "Person", "name": "BenDes"}, "description": "These no-bake peanut butter bars feature a dense, buttery graham cracker base enriched with creamy peanut butter and finished with a smooth chocolate-peanut butter layer. Refrigeration allows the topping to set firmly while preserving the soft, rich texture beneath it.", "datePublished": "2018-11-06T01:07:04+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/peanut-butter-bars1.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/peanut-butter-bars1-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/peanut-butter-bars1-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/peanut-butter-bars1-480x270.png"], "totalTime": "PT90M", "recipeIngredient": ["2 cups graham crackers (finely crushed for the best texture, such as Nabisco)", "1¾ cups confectioners’ sugar", "1 cup smooth (creamy peanut butter)", "1 cup unsalted butter (melted and allowed to cool)", "¼ cup extra-creamy peanut butter (for a particularly smooth finish)", "1½ cups high-quality semisweet chocolate chips (such as Ghirardelli, or milk chocolate chips)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Line an 8 × 8-inch or 9 × 9-inch baking dish with parchment paper or aluminum foil, leaving enough material extending over the sides to assist with removing the finished bars.", "name": "Line an 8 × 8-inch or 9 × 9-inch baking dish with parchment paper or aluminum foil, leaving enough material extending over the sides to assist with removing the finished bars.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peanut-butter-bars/#wprm-recipe-40804-step-0-0"}, {"@type": "HowToStep", "text": "Place the graham crackers in a resealable bag and crush them finely with a rolling pin. Alternatively, process them in a food processor until they form fine crumbs.", "name": "Place the graham crackers in a resealable bag and crush them finely with a rolling pin. Alternatively, process them in a food processor until they form fine crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peanut-butter-bars/#wprm-recipe-40804-step-0-1"}, {"@type": "HowToStep", "text": "Add the melted and cooled unsalted butter and 1 cup of creamy peanut butter to a large mixing bowl. Stir thoroughly until the mixture is completely smooth.", "name": "Add the melted and cooled unsalted butter and 1 cup of creamy peanut butter to a large mixing bowl. Stir thoroughly until the mixture is completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peanut-butter-bars/#wprm-recipe-40804-step-0-2"}, {"@type": "HowToStep", "text": "Incorporate the confectioners’ sugar, mixing until no dry streaks remain. Gently fold in the finely crushed graham crackers until evenly distributed.", "name": "Incorporate the confectioners’ sugar, mixing until no dry streaks remain. Gently fold in the finely crushed graham crackers until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peanut-butter-bars/#wprm-recipe-40804-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the peanut butter mixture to the prepared baking dish. Press and level the surface with a spatula to create a uniform base.", "name": "Transfer the peanut butter mixture to the prepared baking dish. Press and level the surface with a spatula to create a uniform base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peanut-butter-bars/#wprm-recipe-40804-step-0-4"}, {"@type": "HowToStep", "text": "Combine the chocolate chips and the remaining ¼ cup of creamy peanut butter in a heatproof bowl.", "name": "Combine the chocolate chips and the remaining ¼ cup of creamy peanut butter in a heatproof bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peanut-butter-bars/#wprm-recipe-40804-step-0-5"}, {"@type": "HowToStep", "text": "Microwave the mixture in intervals of 20 to 30 seconds, stirring after each interval, until the chocolate and peanut butter have melted into a glossy, smooth topping.", "name": "Microwave the mixture in intervals of 20 to 30 seconds, stirring after each interval, until the chocolate and peanut butter have melted into a glossy, smooth topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peanut-butter-bars/#wprm-recipe-40804-step-0-6"}, {"@type": "HowToStep", "text": "Pour the chocolate-peanut butter mixture over the prepared base. Spread it evenly with a spatula, ensuring the entire surface is covered.", "name": "Pour the chocolate-peanut butter mixture over the prepared base. Spread it evenly with a spatula, ensuring the entire surface is covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peanut-butter-bars/#wprm-recipe-40804-step-0-7"}, {"@type": "HowToStep", "text": "Refrigerate the assembled bars for at least 90 minutes, or until the chocolate layer has set completely.", "name": "Refrigerate the assembled bars for at least 90 minutes, or until the chocolate layer has set completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peanut-butter-bars/#wprm-recipe-40804-step-0-8"}, {"@type": "HowToStep", "text": "Lift the chilled slab from the baking dish using the parchment paper or foil overhang. Place it on a cutting surface and divide it into squares or rectangular bars with a sharp knife.", "name": "Lift the chilled slab from the baking dish using the parchment paper or foil overhang. Place it on a cutting surface and divide it into squares or rectangular bars with a sharp knife.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peanut-butter-bars/#wprm-recipe-40804-step-0-9"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Peanut Butter Bars"}</script>
