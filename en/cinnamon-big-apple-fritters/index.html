    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cinnamon Big Apple Fritters", "author": {"@type": "Person", "name": "BenDes"}, "description": "Crisp, deep-golden apple fritters filled with tender Granny Smith apple pieces and warmly spiced with cinnamon. A smooth powdered-sugar glaze finishes each fritter with a sweet, delicate coating.", "datePublished": "2020-06-25T15:39:20+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/cinnamon-big-apple-fritters.png", "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/cinnamon-big-apple-fritters.png", "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/cinnamon-big-apple-fritters.png", "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/cinnamon-big-apple-fritters.png"], "cookTime": "PT6M", "totalTime": "PT11M", "recipeIngredient": ["2  large Granny Smith apples (peeled and cut into ½-inch cubes)", "¼ cup granulated sugar", "3 tablespoons plain (unsweetened applesauce, for added moisture and tenderness)", "1½ teaspoons ground cinnamon (preferably freshly ground for fuller flavor)", "2  large eggs (brought to room temperature)", "1½ cups all-purpose flour", "½ teaspoon vanilla extract", "2 teaspoons baking powder", "⅓ cup milk", "½ teaspoon salt", "Oil (as needed for frying)", "¼ cup milk", "2 cups confectioners’ sugar (sifted until free of lumps)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Peel the Granny Smith apples and cut them into approximately ½-inch pieces. Place the diced fruit in a bowl and toss with a very small pinch of the measured salt to help limit browning.", "name": "Peel the Granny Smith apples and cut them into approximately ½-inch pieces. Place the diced fruit in a bowl and toss with a very small pinch of the measured salt to help limit browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-0"}, {"@type": "HowToStep", "text": "Sift the all-purpose flour, baking powder, remaining salt, and ground cinnamon together into a large mixing bowl. Break apart any remaining clumps so the cinnamon and leavening are distributed evenly throughout the dry mixture.", "name": "Sift the all-purpose flour, baking powder, remaining salt, and ground cinnamon together into a large mixing bowl. Break apart any remaining clumps so the cinnamon and leavening are distributed evenly throughout the dry mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-1"}, {"@type": "HowToStep", "text": "Measure and arrange the remaining ingredients before proceeding with the batter.", "name": "Measure and arrange the remaining ingredients before proceeding with the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the room-temperature eggs with the milk, unsweetened applesauce, and vanilla extract until the mixture is smooth and uniform.", "name": "In a separate bowl, whisk the room-temperature eggs with the milk, unsweetened applesauce, and vanilla extract until the mixture is smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-3"}, {"@type": "HowToStep", "text": "Continue whisking for approximately 30 seconds so the eggs are thoroughly incorporated and the liquid mixture becomes cohesive.", "name": "Continue whisking for approximately 30 seconds so the eggs are thoroughly incorporated and the liquid mixture becomes cohesive.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-4"}, {"@type": "HowToStep", "text": "Pour the prepared wet mixture into the bowl containing the sifted dry ingredients. Stir gently only until the ingredients come together. Avoid excessive mixing, which may encourage too much gluten development and produce firmer fritters.", "name": "Pour the prepared wet mixture into the bowl containing the sifted dry ingredients. Stir gently only until the ingredients come together. Avoid excessive mixing, which may encourage too much gluten development and produce firmer fritters.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-5"}, {"@type": "HowToStep", "text": "Using a spatula, carefully fold the diced apples into the batter with light motions so the fruit pieces remain intact.", "name": "Using a spatula, carefully fold the diced apples into the batter with light motions so the fruit pieces remain intact.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-6"}, {"@type": "HowToStep", "text": "The completed batter should have a substantial, thick consistency while remaining soft enough to portion with a scoop.", "name": "The completed batter should have a substantial, thick consistency while remaining soft enough to portion with a scoop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-7"}, {"@type": "HowToStep", "text": "While the frying oil heats to 375°F, combine the sifted confectioners’ sugar with ¼ cup milk in a small bowl.", "name": "While the frying oil heats to 375°F, combine the sifted confectioners’ sugar with ¼ cup milk in a small bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-8"}, {"@type": "HowToStep", "text": "Whisk until completely smooth and pourable. The glaze should resemble the consistency of heavy cream—substantial enough to cling to the fritters while still flowing slowly from the whisk.", "name": "Whisk until completely smooth and pourable. The glaze should resemble the consistency of heavy cream—substantial enough to cling to the fritters while still flowing slowly from the whisk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-9"}, {"@type": "HowToStep", "text": "Heat the frying oil to 375°F in a sturdy, heavy-bottomed pot or deep skillet. Use a candy or deep-frying thermometer to monitor the temperature accurately.", "name": "Heat the frying oil to 375°F in a sturdy, heavy-bottomed pot or deep skillet. Use a candy or deep-frying thermometer to monitor the temperature accurately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-10"}, {"@type": "HowToStep", "text": "Working in batches so the pan does not become crowded, carefully lower approximately ¼-cup portions of apple batter into the hot oil using a measuring cup or cookie scoop.", "name": "Working in batches so the pan does not become crowded, carefully lower approximately ¼-cup portions of apple batter into the hot oil using a measuring cup or cookie scoop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-11"}, {"@type": "HowToStep", "text": "Cook each fritter for 2–3 minutes on the first side, turn once, and fry for another 2–3 minutes, or until the exterior develops a deep golden-brown color.", "name": "Cook each fritter for 2–3 minutes on the first side, turn once, and fry for another 2–3 minutes, or until the exterior develops a deep golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-12"}, {"@type": "HowToStep", "text": "Remove the cooked fritters from the oil and place them on a paper towel-lined plate to drain away excess oil. The finished fritters should have a crisp exterior and a tender center.", "name": "Remove the cooked fritters from the oil and place them on a paper towel-lined plate to drain away excess oil. The finished fritters should have a crisp exterior and a tender center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-13"}, {"@type": "HowToStep", "text": "Once the fritters remain warm but are comfortable to handle, dip each one into the prepared glaze. Allow the surplus coating to drip back into the bowl before transferring the fritters to a wire rack positioned over parchment paper.", "name": "Once the fritters remain warm but are comfortable to handle, dip each one into the prepared glaze. Allow the surplus coating to drip back into the bowl before transferring the fritters to a wire rack positioned over parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-14"}, {"@type": "HowToStep", "text": "Leave the glazed fritters undisturbed for 5–10 minutes, allowing the coating to firm and develop a smooth finish.", "name": "Leave the glazed fritters undisturbed for 5–10 minutes, allowing the coating to firm and develop a smooth finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-15"}, {"@type": "HowToStep", "text": "Serve the cinnamon apple fritters while they are still slightly warm for the preferred texture and flavor.", "name": "Serve the cinnamon apple fritters while they are still slightly warm for the preferred texture and flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-big-apple-fritters/#wprm-recipe-45153-step-0-16"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Cinnamon Big Apple Fritters"}</script>
