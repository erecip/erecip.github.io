    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Oatmeal Scones", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender pumpkin oatmeal scones flavored with warm pumpkin pie spice and naturally sweetened with pure maple syrup. Cold butter creates a delicate, flaky crumb, while pumpkin purée and oats provide moisture and a satisfying texture.", "datePublished": "2022-09-14T06:21:25+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/pumpkin-oatmeal-scones.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/pumpkin-oatmeal-scones.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/pumpkin-oatmeal-scones.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/pumpkin-oatmeal-scones.png"], "prepTime": "PT15M", "cookTime": "PT22M", "totalTime": "PT47M", "recipeIngredient": ["1 cup white whole-wheat flour (or an equal amount of gluten-free flour blend)", "3 tablespoons fat-free milk", "2 teaspoons pumpkin pie spice", "½ cup pure pumpkin purée (not pumpkin pie filling)", "1½ tablespoons cold unsalted butter (diced into small pieces)", "1 teaspoon pure vanilla extract", "½ cup instant oats (quick oats, or old-fashioned rolled oats)", "1½ teaspoons baking powder", "3 tablespoons pure maple syrup", "¼ teaspoon fine salt", "2 tablespoons fat-free milk (reserved for brushing)", "Parchment paper (for lining the baking sheet)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 425°F. Cover a baking sheet with parchment paper. Cut the chilled butter into small cubes and return it to a cool place while measuring the remaining ingredients.", "name": "Preheat the oven to 425°F. Cover a baking sheet with parchment paper. Cut the chilled butter into small cubes and return it to a cool place while measuring the remaining ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-0"}, {"@type": "HowToStep", "text": "Whisk the pumpkin purée, maple syrup, vanilla extract, and 3 tablespoons of fat-free milk in a medium bowl until the mixture is smooth and uniform.", "name": "Whisk the pumpkin purée, maple syrup, vanilla extract, and 3 tablespoons of fat-free milk in a medium bowl until the mixture is smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-1"}, {"@type": "HowToStep", "text": "Stir the oats into the pumpkin mixture, folding gently until they are distributed evenly throughout the wet ingredients.", "name": "Stir the oats into the pumpkin mixture, folding gently until they are distributed evenly throughout the wet ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-2"}, {"@type": "HowToStep", "text": "In a separate mixing bowl, thoroughly combine the flour, pumpkin pie spice, baking powder, and salt.", "name": "In a separate mixing bowl, thoroughly combine the flour, pumpkin pie spice, baking powder, and salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-3"}, {"@type": "HowToStep", "text": "Add the cold butter pieces to the dry mixture. Using a pastry blender, fork, or cool fingertips, cut the butter into the flour until the mixture develops a coarse, crumb-like consistency.", "name": "Add the cold butter pieces to the dry mixture. Using a pastry blender, fork, or cool fingertips, cut the butter into the flour until the mixture develops a coarse, crumb-like consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-4"}, {"@type": "HowToStep", "text": "Pour the pumpkin and oat mixture into the bowl of dry ingredients. Fold gently with a spatula or wooden spoon only until a cohesive dough begins to form. A few visible streaks or pockets of flour are acceptable; excessive mixing may produce firm scones.", "name": "Pour the pumpkin and oat mixture into the bowl of dry ingredients. Fold gently with a spatula or wooden spoon only until a cohesive dough begins to form. A few visible streaks or pockets of flour are acceptable; excessive mixing may produce firm scones.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the dough to the parchment-lined baking sheet. With lightly floured hands or a bench scraper, carefully shape it into a round approximately ¾ inch thick.", "name": "Transfer the dough to the parchment-lined baking sheet. With lightly floured hands or a bench scraper, carefully shape it into a round approximately ¾ inch thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-6"}, {"@type": "HowToStep", "text": "Use a sharp knife to score the round into eight evenly sized triangular portions. Do not slice completely through the dough or separate the wedges before baking.", "name": "Use a sharp knife to score the round into eight evenly sized triangular portions. Do not slice completely through the dough or separate the wedges before baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-7"}, {"@type": "HowToStep", "text": "Lightly coat the surface of the dough with the remaining 2 tablespoons of fat-free milk.", "name": "Lightly coat the surface of the dough with the remaining 2 tablespoons of fat-free milk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-8"}, {"@type": "HowToStep", "text": "Bake for 22–26 minutes, or until the top is lightly golden. Begin checking the scones at approximately 20 minutes because oven temperatures may vary.", "name": "Bake for 22–26 minutes, or until the top is lightly golden. Begin checking the scones at approximately 20 minutes because oven temperatures may vary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-9"}, {"@type": "HowToStep", "text": "Test the center with a toothpick. The scones are ready when the toothpick emerges with only a few moist crumbs attached.", "name": "Test the center with a toothpick. The scones are ready when the toothpick emerges with only a few moist crumbs attached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-10"}, {"@type": "HowToStep", "text": "Remove the baking sheet from the oven and allow the scones to rest on the pan for 10 minutes. Once their structure has set, gently separate them along the scored lines.", "name": "Remove the baking sheet from the oven and allow the scones to rest on the pan for 10 minutes. Once their structure has set, gently separate them along the scored lines.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-11"}, {"@type": "HowToStep", "text": "Serve the pumpkin oatmeal scones warm or at room temperature.", "name": "Serve the pumpkin oatmeal scones warm or at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-scones/#wprm-recipe-39661-step-0-12"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Pumpkin Oatmeal Scones"}</script>
