375°F (190°C). Cover two baking sheets with parchment paper to keep the scones from adhering to the pans and to simplify cleanup.", "name": "Heat the oven to 375°F (190°C). Cover two baking sheets with parchment paper to keep the scones from adhering to the pans and to simplify cleanup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-0"}, {"@type": "HowToStep", "text": "Place the all-purpose flour, packed brown sugar, baking powder, cinnamon, and salt in a large mixing bowl. Stir until the ingredients are evenly distributed.", "name": "Place the all-purpose flour, packed brown sugar, baking powder, cinnamon, and salt in a large mixing bowl. Stir until the ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-1"}, {"@type": "HowToStep", "text": "Add the grated cold unsalted butter to the flour mixture. Toss gently until the butter is dispersed throughout and the mixture develops a coarse, crumbly consistency.", "name": "Add the grated cold unsalted butter to the flour mixture. Toss gently until the butter is dispersed throughout and the mixture develops a coarse, crumbly consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the egg with ¼ cup of the buttermilk, the pumpkin puree, and vanilla extract until thoroughly blended.", "name": "In a separate bowl, whisk the egg with ¼ cup of the buttermilk, the pumpkin puree, and vanilla extract until thoroughly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-3"}, {"@type": "HowToStep", "text": "Pour the pumpkin mixture into the dry ingredients and stir gently only until the dough begins to come together. If it remains too dry, incorporate additional buttermilk 1 tablespoon at a time, using no more than ½ cup in total. Avoid excessive mixing.", "name": "Pour the pumpkin mixture into the dry ingredients and stir gently only until the dough begins to come together. If it remains too dry, incorporate additional buttermilk 1 tablespoon at a time, using no more than ½ cup in total. Avoid excessive mixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-4"}, {"@type": "HowToStep", "text": "Fold the white chocolate chips carefully into the dough until evenly distributed.", "name": "Fold the white chocolate chips carefully into the dough until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the dough to a lightly floured work surface. Gently pat it into a round approximately 1 inch thick.", "name": "Transfer the dough to a lightly floured work surface. Gently pat it into a round approximately 1 inch thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-6"}, {"@type": "HowToStep", "text": "With a sharp knife or bench scraper, divide the round into 8 evenly sized wedges.", "name": "With a sharp knife or bench scraper, divide the round into 8 evenly sized wedges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-7"}, {"@type": "HowToStep", "text": "Position the scone wedges approximately 2 inches apart on the parchment-lined baking sheets. Lightly coat the tops with additional buttermilk to encourage an evenly browned finish.", "name": "Position the scone wedges approximately 2 inches apart on the parchment-lined baking sheets. Lightly coat the tops with additional buttermilk to encourage an evenly browned finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the baking sheets to the freezer and chill the shaped scones for 15 minutes. This short chilling period helps them retain their form during baking.", "name": "Transfer the baking sheets to the freezer and chill the shaped scones for 15 minutes. This short chilling period helps them retain their form during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-9"}, {"@type": "HowToStep", "text": "Bake at 375°F (190°C) for 15–18 minutes. Rotate the baking sheets halfway through the baking period to promote even coloring.", "name": "Bake at 375°F (190°C) for 15–18 minutes. Rotate the baking sheets halfway through the baking period to promote even coloring.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-10"}, {"@type": "HowToStep", "text": "Once the scones are golden brown, remove them from the oven and allow them to cool for several minutes directly on the baking sheets. Slight cooling also prevents the glaze from immediately melting away when applied.", "name": "Once the scones are golden brown, remove them from the oven and allow them to cool for several minutes directly on the baking sheets. Slight cooling also prevents the glaze from immediately melting away when applied.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-11"}, {"@type": "HowToStep", "text": "While the scones bake, place 2 tablespoons unsalted butter in a small saucepan over medium heat. Melt the butter and continue cooking for 2–3 minutes, stirring frequently, until it develops a golden color and a distinctly nutty aroma.", "name": "While the scones bake, place 2 tablespoons unsalted butter in a small saucepan over medium heat. Melt the butter and continue cooking for 2–3 minutes, stirring frequently, until it develops a golden color and a distinctly nutty aroma.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-12"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat.", "name": "Remove the saucepan from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-13"}, {"@type": "HowToStep", "text": "Whisk the maple syrup and sifted powdered sugar into the browned butter. Add 1 tablespoon of strongly brewed coffee and whisk until smooth.", "name": "Whisk the maple syrup and sifted powdered sugar into the browned butter. Add 1 tablespoon of strongly brewed coffee and whisk until smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-14"}, {"@type": "HowToStep", "text": "If a thinner consistency is needed, add more coffee gradually, approximately 1 teaspoon at a time. Do not use more than 2 tablespoons of brewed coffee in total.", "name": "If a thinner consistency is needed, add more coffee gradually, approximately 1 teaspoon at a time. Do not use more than 2 tablespoons of brewed coffee in total.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-15"}, {"@type": "HowToStep", "text": "After the baked scones have cooled slightly, drizzle the brown butter espresso glaze generously over each wedge.", "name": "After the baked scones have cooled slightly, drizzle the brown butter espresso glaze generously over each wedge.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-16"}, {"@type": "HowToStep", "text": "Serve the scones while still warm for the best texture and flavor.", "name": "Serve the scones while still warm for the best texture and flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chocolate-pumpkin-scones-with-espresso-glaze/#wprm-recipe-41695-step-0-17"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "White Chocolate Pumpkin Scones with Espresso Glaze"}</script>
