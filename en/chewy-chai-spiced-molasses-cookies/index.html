    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chewy Chai Spiced Molasses Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These chewy molasses cookies combine deep caramel-like sweetness with a warming blend of ginger, cinnamon, cloves, and allspice. Chilling the dough allows the flavors to develop while helping the cookies bake with a pleasantly chewy center, lightly crisp edges, and beautifully cracked tops. A coating of ginger-cinnamon sugar provides an additional layer of sweetness and spice.", "datePublished": "2020-02-21T00:30:59+00:00", "image": ["https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/chewy-chai-spiced-molasses-cookies1.png", "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/chewy-chai-spiced-molasses-cookies1.png", "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/chewy-chai-spiced-molasses-cookies1.png", "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/chewy-chai-spiced-molasses-cookies1.png"], "cookTime": "PT9M", "totalTime": "PT69M", "recipeIngredient": ["1 cup unsalted butter (softened to room temperature)", "1/3 cup unsulphured molasses", "1/4 teaspoon ground allspice", "2 teaspoons pure vanilla extract", "3 cups all-purpose flour (measured by spooning into the cup and leveling)", "2/3 cup firmly packed light or dark brown sugar", "1 teaspoon ground cinnamon", "1  large egg (brought to approximately 70°F or room temperature)", "1/2 teaspoon salt", "1/4 teaspoon ground cloves", "2/3 cup granulated white sugar", "2 teaspoons ground ginger", "2 teaspoons baking soda", "1 teaspoon ground cinnamon", "1/2 cup granulated white sugar", "1/2 teaspoon ground ginger"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 350°F (175°C). Cover a large baking sheet with parchment paper or a silicone baking mat to keep the cookies from adhering during baking. Set the prepared pan aside.", "name": "Heat the oven to 350°F (175°C). Cover a large baking sheet with parchment paper or a silicone baking mat to keep the cookies from adhering during baking. Set the prepared pan aside.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, thoroughly whisk together the 3 cups all-purpose flour, 2 teaspoons baking soda, 2 teaspoons ground ginger, 1 teaspoon ground cinnamon, 1/4 teaspoon ground cloves, 1/4 teaspoon allspice, and 1/2 teaspoon salt. Continue whisking until the spices and leavening are evenly dispersed throughout the flour, then reserve the mixture.", "name": "In a large mixing bowl, thoroughly whisk together the 3 cups all-purpose flour, 2 teaspoons baking soda, 2 teaspoons ground ginger, 1 teaspoon ground cinnamon, 1/4 teaspoon ground cloves, 1/4 teaspoon allspice, and 1/2 teaspoon salt. Continue whisking until the spices and leavening are evenly dispersed throughout the flour, then reserve the mixture.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-1"}, {"@type": "HowToStep", "text": "Place the softened unsalted butter, 2/3 cup granulated sugar, and 2/3 cup packed brown sugar in the bowl of a stand mixer fitted with the paddle attachment. Beat at medium-high speed, approximately settings 6–8, for 5–8 minutes. Stop several times to scrape the bottom and sides of the bowl. The finished mixture should appear noticeably lighter and fluffy.", "name": "Place the softened unsalted butter, 2/3 cup granulated sugar, and 2/3 cup packed brown sugar in the bowl of a stand mixer fitted with the paddle attachment. Beat at medium-high speed, approximately settings 6–8, for 5–8 minutes. Stop several times to scrape the bottom and sides of the bowl. The finished mixture should appear noticeably lighter and fluffy.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-2"}, {"@type": "HowToStep", "text": "Add the room-temperature egg, 1/3 cup molasses, and 2 teaspoons vanilla extract to the creamed butter mixture. Begin mixing at low speed, then gradually raise the mixer to medium speed. Beat until the ingredients are completely blended, scraping the bowl whenever necessary for uniform incorporation.", "name": "Add the room-temperature egg, 1/3 cup molasses, and 2 teaspoons vanilla extract to the creamed butter mixture. Begin mixing at low speed, then gradually raise the mixer to medium speed. Beat until the ingredients are completely blended, scraping the bowl whenever necessary for uniform incorporation.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-3"}, {"@type": "HowToStep", "text": "Add the reserved flour mixture to the wet ingredients in two additions. Mix initially at low speed, then increase to medium-high as needed, periodically scraping the bowl. Continue only until no visible streaks of dry flour remain.", "name": "Add the reserved flour mixture to the wet ingredients in two additions. Mix initially at low speed, then increase to medium-high as needed, periodically scraping the bowl. Continue only until no visible streaks of dry flour remain.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-4"}, {"@type": "HowToStep", "text": "Cover the mixing bowl securely with plastic wrap and refrigerate the dough for at least 1 hour or as long as overnight. When the dough has been refrigerated overnight, leave it at room temperature for approximately 15 minutes before portioning so that it softens slightly.", "name": "Cover the mixing bowl securely with plastic wrap and refrigerate the dough for at least 1 hour or as long as overnight. When the dough has been refrigerated overnight, leave it at room temperature for approximately 15 minutes before portioning so that it softens slightly.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-5"}, {"@type": "HowToStep", "text": "In a small bowl, combine the 1/2 cup granulated sugar, 1 teaspoon cinnamon, and 1/2 teaspoon ground ginger, whisking until the spices are evenly distributed.", "name": "In a small bowl, combine the 1/2 cup granulated sugar, 1 teaspoon cinnamon, and 1/2 teaspoon ground ginger, whisking until the spices are evenly distributed.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-6"}, {"@type": "HowToStep", "text": "Using a 1.5-tablespoon cookie scoop, portion the chilled dough and roll each portion between your palms to create a smooth ball. Coat every dough ball completely in the spiced sugar mixture.", "name": "Using a 1.5-tablespoon cookie scoop, portion the chilled dough and roll each portion between your palms to create a smooth ball. Coat every dough ball completely in the spiced sugar mixture.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the coated portions on the prepared baking sheet, allowing at least 1 inch of space between the cookies.", "name": "Arrange the coated portions on the prepared baking sheet, allowing at least 1 inch of space between the cookies.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-8"}, {"@type": "HowToStep", "text": "Bake the cookies for 9–12 minutes, stopping when the edges appear set and cracks begin to form across the tops.", "name": "Bake the cookies for 9–12 minutes, stopping when the edges appear set and cracks begin to form across the tops.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-9"}, {"@type": "HowToStep", "text": "Leave the freshly baked cookies on the baking sheet for approximately 10 minutes. Transfer them afterward to a wire cooling rack and allow them to cool completely. Their texture will become firmer as they cool.", "name": "Leave the freshly baked cookies on the baking sheet for approximately 10 minutes. Transfer them afterward to a wire cooling rack and allow them to cool completely. Their texture will become firmer as they cool.", "url": "https://erecip.github.io/en/chewy-chai-spiced-molasses-cookies/#wprm-recipe-42558-step-0-10"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Chewy Chai Spiced Molasses Cookies"}</script>
