    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Corn Casserole Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This rich and comforting corn casserole features a harmonious blend of creamy textures and sweet corn flavors, brought together with a simple Jiffy mix base. Perfect for holiday feasts or everyday dinners, it can be conveniently prepared in advance.", "datePublished": "2024-07-21T11:39:36+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Corn-Casserole-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Corn-Casserole-Recipe1-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Corn-Casserole-Recipe1-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Corn-Casserole-Recipe1-480x270.png"], "recipeYield": ["6"], "prepTime": "PT5M", "cookTime": "PT55M", "totalTime": "PT65M", "recipeIngredient": ["1  stick butter (melted)", "8 oz. sour cream", "14.75 oz. creamed corn", "8.5 oz. Jiffy corn muffin mix", "1 cup cheddar cheese (shredded)", "15.25 oz. whole kernel sweet corn (drained)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. In a large mixing bowl, combine the creamed corn, whole kernel corn (drained), sour cream, melted butter, and Jiffy corn muffin mix, ensuring an even blend. Transfer the mixture into a greased 9x13-inch baking dish or a 10-inch cast iron skillet. Bake uncovered for 45 minutes. Sprinkle shredded cheddar cheese over the top and return to the oven for another 10 to 15 minutes, until a golden crust forms. Allow the casserole to rest for 5 minutes before serving.", "name": "Preheat the oven to 350°F. In a large mixing bowl, combine the creamed corn, whole kernel corn (drained), sour cream, melted butter, and Jiffy corn muffin mix, ensuring an even blend. Transfer the mixture into a greased 9x13-inch baking dish or a 10-inch cast iron skillet. Bake uncovered for 45 minutes. Sprinkle shredded cheddar cheese over the top and return to the oven for another 10 to 15 minutes, until a golden crust forms. Allow the casserole to rest for 5 minutes before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/corn-casserole-recipe/#wprm-recipe-11855-step-0-0"}, {"@type": "HowToSection", "name": "Crock Pot Method", "itemListElement": [{"@type": "HowToStep", "text": "In a large bowl, stir together the creamed corn, drained sweet corn, sour cream, melted butter, and corn muffin mix. Lightly grease the Crock Pot and pour in the mixture. Cook on high for 2 to 3 hours or on low for approximately 4 hours. Add shredded cheddar during the final 20 minutes of cooking. Ensure the center is fully set before serving.", "name": "In a large bowl, stir together the creamed corn, drained sweet corn, sour cream, melted butter, and corn muffin mix. Lightly grease the Crock Pot and pour in the mixture. Cook on high for 2 to 3 hours or on low for approximately 4 hours. Add shredded cheddar during the final 20 minutes of cooking. Ensure the center is fully set before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/corn-casserole-recipe/#wprm-recipe-11855-step-1-0"}, {"@type": "HowToStep", "text": "Notes", "name": "Notes", "url": "https://easy-recipes322.github.io/easy-recipes323/en/corn-casserole-recipe/#wprm-recipe-11855-step-1-1"}, {"@type": "HowToStep", "text": "Only the dry contents of the Jiffy box should be used—do not prepare it beforehand.", "name": "Only the dry contents of the Jiffy box should be used—do not prepare it beforehand.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/corn-casserole-recipe/#wprm-recipe-11855-step-1-2"}, {"@type": "HowToStep", "text": "Make-Ahead Option 1: Combine all ingredients except cheese, pour into a casserole dish, cover, and refrigerate. Let sit at room temperature for 30 minutes prior to baking.", "name": "Make-Ahead Option 1: Combine all ingredients except cheese, pour into a casserole dish, cover, and refrigerate. Let sit at room temperature for 30 minutes prior to baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/corn-casserole-recipe/#wprm-recipe-11855-step-1-3"}, {"@type": "HowToStep", "text": "Make-Ahead Option 2: Bake the casserole covered at 350°F for 50 minutes, allow it to cool, then refrigerate. Before serving, top with cheese and warm at 300°F for 10 minutes covered, then bake uncovered at 350°F for 10–15 minutes until cheese is melted.", "name": "Make-Ahead Option 2: Bake the casserole covered at 350°F for 50 minutes, allow it to cool, then refrigerate. Before serving, top with cheese and warm at 300°F for 10 minutes covered, then bake uncovered at 350°F for 10–15 minutes until cheese is melted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/corn-casserole-recipe/#wprm-recipe-11855-step-1-4"}, {"@type": "HowToStep", "text": "Cheese may also be added prior to baking and cooked covered for 55–60 minutes as an alternative approach.", "name": "Cheese may also be added prior to baking and cooked covered for 55–60 minutes as an alternative approach.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/corn-casserole-recipe/#wprm-recipe-11855-step-1-5"}]}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Corn Casserole Recipe"}</script>
