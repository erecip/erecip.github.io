    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sloppy Joe Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A beloved classic, Sloppy Joes offer a satisfying combination of rich, savory beef simmered in a tomato-based sauce with subtle sweetness and aromatic undertones. This version uses crushed tomatoes instead of overly sweetened canned sauces, making it a more balanced and hearty meal that freezes exceptionally well and scales easily for groups.", "datePublished": "2024-12-13T12:21:31+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/sloppy-joe-recipe.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/sloppy-joe-recipe.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/sloppy-joe-recipe.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/sloppy-joe-recipe.jpg"], "recipeYield": ["5", "5 people"], "prepTime": "PT10M", "cookTime": "PT40M", "totalTime": "PT50M", "recipeIngredient": ["1 tbsp tomato paste", "1  green capsicum/bell pepper (diced)", "2  garlic cloves (minced)", "1 tbsp /15g butter", "1 tbsp Dijon mustard or 1 tsp dry mustard", "1/4 tsp black pepper", "1  beef bouillon cube (crumbled (or 1.5 tsp beef stock powder))", "2 tsp Worcestershire sauce", "1  onion (finely chopped)", "500 g / 1 lb ground beef (mince)", "400 g / 14 oz crushed tomato (canned)", "1/2 cup ketchup", "1.5 tbsp brown sugar", "5 to 6  soft rolls (brioche or soft hamburger buns preferred)", "Cheese slices (optional)", "Optional fixings: pickles (jalapeños or chillies, hot sauce, corn chips, or slaw)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Melt the butter in a large saucepan over high heat.", "name": "Melt the butter in a large saucepan over high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/#wprm-recipe-31007-step-0-0"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and chopped onion, and sauté for approximately 2 minutes until the onion becomes nearly translucent.", "name": "Stir in the minced garlic and chopped onion, and sauté for approximately 2 minutes until the onion becomes nearly translucent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/#wprm-recipe-31007-step-0-1"}, {"@type": "HowToStep", "text": "Incorporate the diced capsicum and cook for another 2 minutes, allowing it to soften.", "name": "Incorporate the diced capsicum and cook for another 2 minutes, allowing it to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/#wprm-recipe-31007-step-0-2"}, {"@type": "HowToStep", "text": "Add the ground beef to the pan. Cook while breaking it apart, until it transitions fully from red to brown.", "name": "Add the ground beef to the pan. Cook while breaking it apart, until it transitions fully from red to brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/#wprm-recipe-31007-step-0-3"}, {"@type": "HowToStep", "text": "Mix in the ketchup, crushed tomato, tomato paste, Worcestershire sauce, mustard, brown sugar, crumbled beef bouillon cube, and black pepper. Stir thoroughly to combine.", "name": "Mix in the ketchup, crushed tomato, tomato paste, Worcestershire sauce, mustard, brown sugar, crumbled beef bouillon cube, and black pepper. Stir thoroughly to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/#wprm-recipe-31007-step-0-4"}, {"@type": "HowToStep", "text": "Lower the heat to medium-low (or low, depending on stove strength), then cover the pan. Let the mixture simmer for 30 minutes, stirring once or twice to prevent sticking. For a quicker version, simmer uncovered for 15 minutes.", "name": "Lower the heat to medium-low (or low, depending on stove strength), then cover the pan. Let the mixture simmer for 30 minutes, stirring once or twice to prevent sticking. For a quicker version, simmer uncovered for 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/#wprm-recipe-31007-step-0-5"}, {"@type": "HowToStep", "text": "Uncover the pot and stir vigorously for about a minute until the sauce thickens. The final mixture should be hearty, not overly saucy or runny. Taste and adjust salt if needed.", "name": "Uncover the pot and stir vigorously for about a minute until the sauce thickens. The final mixture should be hearty, not overly saucy or runny. Taste and adjust salt if needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/#wprm-recipe-31007-step-0-6"}, {"@type": "HowToStep", "text": "Toast the rolls and butter them if desired.", "name": "Toast the rolls and butter them if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/#wprm-recipe-31007-step-0-7"}, {"@type": "HowToStep", "text": "Generously heap the warm filling onto the bottom halves of the rolls. Immediately layer with cheese slices if using, allowing the residual heat to soften the cheese. Close with the top bun and serve promptly.", "name": "Generously heap the warm filling onto the bottom halves of the rolls. Immediately layer with cheese slices if using, allowing the residual heat to soften the cheese. Close with the top bun and serve promptly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-recipe/#wprm-recipe-31007-step-0-8"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Western"], "keywords": "sloppy joe recipe"}</script>
