    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pioneer Womans Beef Stroganoff", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich and savory beef stroganoff featuring tender strips of flank steak, browned mushrooms, onions, garlic, and a creamy beef-stock sauce. The finished mixture is served with wide egg noodles and may be garnished with fresh parsley and black pepper.", "datePublished": "2020-10-01T05:58:37+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/pioneer-womans-beef-stroganoff.png", "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/pioneer-womans-beef-stroganoff.png", "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/pioneer-womans-beef-stroganoff.png", "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/pioneer-womans-beef-stroganoff.png"], "prepTime": "PT15M", "cookTime": "PT30M", "totalTime": "PT45M", "recipeIngredient": ["1 pound wide egg noodles (uncooked)", "Fine sea salt (as needed for the cooking water)", "1 pound sliced mushrooms (such as cremini, baby bella, or button mushrooms)", "4  fresh garlic cloves (finely minced)", "1 1/2 pounds flank steak (cut into thin strips against the grain)", "1/2 cup plain Greek yogurt or light sour cream", "1  small white onion (thinly sliced)", "3 tablespoons all-purpose flour", "1 tablespoon Worcestershire sauce", "1 1/2 cups beef stock (preferably low-sodium)", "1/4 cup unsalted butter (divided)", "Fine sea salt and coarsely ground black pepper (to taste)", "Fresh parsley (chopped, for optional garnish)", "Coarsely ground black pepper (as desired)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large stockpot of generously salted water to a rolling boil. Add the wide egg noodles and cook according to the package directions until they reach an al dente texture.", "name": "Bring a large stockpot of generously salted water to a rolling boil. Add the wide egg noodles and cook according to the package directions until they reach an al dente texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-0"}, {"@type": "HowToStep", "text": "Drain the cooked noodles thoroughly and set them aside until needed.", "name": "Drain the cooked noodles thoroughly and set them aside until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-1"}, {"@type": "HowToStep", "text": "While the noodle water is heating or the noodles are cooking, place a large sauté pan over medium heat and melt 2 tablespoons of the butter.", "name": "While the noodle water is heating or the noodles are cooking, place a large sauté pan over medium heat and melt 2 tablespoons of the butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-2"}, {"@type": "HowToStep", "text": "Arrange the sliced flank steak in a single layer and season it well with fine sea salt and coarse black pepper. Leave the meat undisturbed for approximately 3 minutes so it can develop a browned exterior.", "name": "Arrange the sliced flank steak in a single layer and season it well with fine sea salt and coarse black pepper. Leave the meat undisturbed for approximately 3 minutes so it can develop a browned exterior.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-3"}, {"@type": "HowToStep", "text": "Turn the steak pieces and continue cooking for another 2–3 minutes, or until browned on the second side. Transfer the beef to a clean plate with a slotted spoon and reserve it for later.", "name": "Turn the steak pieces and continue cooking for another 2–3 minutes, or until browned on the second side. Transfer the beef to a clean plate with a slotted spoon and reserve it for later.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-4"}, {"@type": "HowToStep", "text": "If the pan cannot comfortably accommodate all of the steak in one layer, brown the meat in two batches, using approximately 1 tablespoon of butter for each batch.", "name": "If the pan cannot comfortably accommodate all of the steak in one layer, brown the meat in two batches, using approximately 1 tablespoon of butter for each batch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-5"}, {"@type": "HowToStep", "text": "Add the remaining 2 tablespoons of butter to the same sauté pan and melt it over medium heat.", "name": "Add the remaining 2 tablespoons of butter to the same sauté pan and melt it over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-6"}, {"@type": "HowToStep", "text": "Add the sliced onion and cook for approximately 3 minutes, allowing it to begin softening.", "name": "Add the sliced onion and cook for approximately 3 minutes, allowing it to begin softening.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-7"}, {"@type": "HowToStep", "text": "Stir in the sliced mushrooms and continue cooking for 5–7 minutes, stirring from time to time, until the mushrooms have browned and the onion is tender.", "name": "Stir in the sliced mushrooms and continue cooking for 5–7 minutes, stirring from time to time, until the mushrooms have browned and the onion is tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-8"}, {"@type": "HowToStep", "text": "Add the minced garlic and cook for an additional minute. As the vegetables cook, gently loosen any browned bits remaining on the bottom of the pan and incorporate them into the mixture.", "name": "Add the minced garlic and cook for an additional minute. As the vegetables cook, gently loosen any browned bits remaining on the bottom of the pan and incorporate them into the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-9"}, {"@type": "HowToStep", "text": "In a separate bowl, thoroughly whisk together the beef stock, Worcestershire sauce, and all-purpose flour until the mixture is completely smooth and free of flour lumps.", "name": "In a separate bowl, thoroughly whisk together the beef stock, Worcestershire sauce, and all-purpose flour until the mixture is completely smooth and free of flour lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-10"}, {"@type": "HowToStep", "text": "Pour the stock mixture into the pan containing the mushrooms and onions. Bring the sauce to a gentle simmer, stirring occasionally and scraping the bottom of the pan to incorporate any remaining browned residue.", "name": "Pour the stock mixture into the pan containing the mushrooms and onions. Bring the sauce to a gentle simmer, stirring occasionally and scraping the bottom of the pan to incorporate any remaining browned residue.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-11"}, {"@type": "HowToStep", "text": "Continue simmering for approximately 5 minutes, or until the sauce has thickened to the desired consistency.", "name": "Continue simmering for approximately 5 minutes, or until the sauce has thickened to the desired consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-12"}, {"@type": "HowToStep", "text": "Return the browned steak and any accumulated juices to the pan. Allow the stroganoff to simmer gently for 2–3 minutes, just until the beef is heated through.", "name": "Return the browned steak and any accumulated juices to the pan. Allow the stroganoff to simmer gently for 2–3 minutes, just until the beef is heated through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-13"}, {"@type": "HowToStep", "text": "Taste the finished sauce and season with additional fine sea salt and coarse black pepper as necessary. Remove the pan from the heat and allow the stroganoff to rest briefly before serving.", "name": "Taste the finished sauce and season with additional fine sea salt and coarse black pepper as necessary. Remove the pan from the heat and allow the stroganoff to rest briefly before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-14"}, {"@type": "HowToStep", "text": "Combine the cooked egg noodles with the beef and mushroom sauce, tossing gently until the noodles are evenly coated. Alternatively, portion the noodles onto individual plates and spoon the stroganoff over the top.", "name": "Combine the cooked egg noodles with the beef and mushroom sauce, tossing gently until the noodles are evenly coated. Alternatively, portion the noodles onto individual plates and spoon the stroganoff over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-15"}, {"@type": "HowToStep", "text": "Finish each serving with chopped fresh parsley and an additional sprinkling of coarse black pepper, if desired.", "name": "Finish each serving with chopped fresh parsley and an additional sprinkling of coarse black pepper, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-beef-stroganoff/#wprm-recipe-45593-step-0-16"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Pioneer Womans Beef Stroganoff"}</script>
