    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Irish Soda Bread Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This traditional Irish-American Soda Bread is delightfully simple, requiring no kneading or proofing. It bakes up with a tender, biscuit-like crumb that pairs wonderfully with butter and jam.", "datePublished": "2024-10-14T04:55:39+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Irish-Soda-Bread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Irish-Soda-Bread-Recipe-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Irish-Soda-Bread-Recipe-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Irish-Soda-Bread-Recipe-480x270.png"], "prepTime": "PT10M", "cookTime": "PT55M", "totalTime": "PT65M", "recipeIngredient": ["1 cup raisins or dried cranberries (optional)", "4 cups all-purpose flour (plus an additional 1/4 cup for dusting)", "1 tsp sea salt", "1  large cold egg", "6 Tbsp cold unsalted butter (plus 1/2 Tbsp for greasing the skillet)", "1 tsp baking soda", "1 3/4 cups cold low-fat buttermilk or kefir", "1/4 cup granulated sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 375°F and generously grease a 10-inch cast-iron skillet using 1/2 tablespoon of butter. In a spacious mixing bowl, combine the flour, granulated sugar, sea salt, and baking soda, whisking until evenly distributed. Cut the cold butter into small cubes, then, using your fingertips, blend the butter into the dry mixture until it resembles coarse crumbs; fold in the raisins or cranberries, ensuring they are evenly dispersed and separated. Form a well in the center of the dry ingredients. In a separate measuring jug, whisk together the cold buttermilk and egg until smooth, then pour this mixture into the flour blend. Using a wooden spoon, stir gently just until the dough begins to come together; avoid overworking it. Turn the dough onto a lightly floured surface, and with floured hands, shape it into a rustic round loaf, handling it as little as possible to maintain tenderness. If the dough feels excessively sticky, sprinkle lightly with extra flour. Position the formed loaf into the prepared skillet and, with a sharp knife, score a large, deep 'X' across the top. Bake on the middle rack for 50–55 minutes, or until the bread sounds hollow when tapped on its base. Remove the loaf from the skillet and place it on a wire rack to cool. For best texture and flavor, enjoy within two days, storing any remaining slices refrigerated for up to one week.", "name": "Preheat the oven to 375°F and generously grease a 10-inch cast-iron skillet using 1/2 tablespoon of butter. In a spacious mixing bowl, combine the flour, granulated sugar, sea salt, and baking soda, whisking until evenly distributed. Cut the cold butter into small cubes, then, using your fingertips, blend the butter into the dry mixture until it resembles coarse crumbs; fold in the raisins or cranberries, ensuring they are evenly dispersed and separated. Form a well in the center of the dry ingredients. In a separate measuring jug, whisk together the cold buttermilk and egg until smooth, then pour this mixture into the flour blend. Using a wooden spoon, stir gently just until the dough begins to come together; avoid overworking it. Turn the dough onto a lightly floured surface, and with floured hands, shape it into a rustic round loaf, handling it as little as possible to maintain tenderness. If the dough feels excessively sticky, sprinkle lightly with extra flour. Position the formed loaf into the prepared skillet and, with a sharp knife, score a large, deep 'X' across the top. Bake on the middle rack for 50–55 minutes, or until the bread sounds hollow when tapped on its base. Remove the loaf from the skillet and place it on a wire rack to cool. For best texture and flavor, enjoy within two days, storing any remaining slices refrigerated for up to one week.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-soda-bread-recipe/#wprm-recipe-49771-step-0-0"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American", "Irish"], "keywords": "Irish Soda Bread Recipe"}</script>
