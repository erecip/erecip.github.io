ose to the center should come out clean.", "name": "Transfer the pie to the preheated oven and bake for 45–55 minutes. The center should be set while retaining a slight jiggle, and a knife inserted close to the center should come out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paula-deens-pecan-pie/#wprm-recipe-43527-step-0-6"}, {"@type": "HowToStep", "text": "Check the pie at approximately the 40-minute point. If the pastry edges are becoming too dark, loosely shield them with aluminum foil for the remainder of the baking time.", "name": "Check the pie at approximately the 40-minute point. If the pastry edges are becoming too dark, loosely shield them with aluminum foil for the remainder of the baking time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paula-deens-pecan-pie/#wprm-recipe-43527-step-0-7"}, {"@type": "HowToStep", "text": "Allow the pecan pie to cool completely before cutting. Adequate cooling gives the filling time to firm properly and produces cleaner slices.", "name": "Allow the pecan pie to cool completely before cutting. Adequate cooling gives the filling time to firm properly and produces cleaner slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paula-deens-pecan-pie/#wprm-recipe-43527-step-0-8"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Paula Deen’s Pecan Pie"}</script>
