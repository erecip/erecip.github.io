    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Cheesecake Poke Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender lemon-infused sour cream cake is pierced while warm and saturated with a tangy sweetened condensed milk mixture. After chilling, the cake is finished with a smooth lemon cream cheese frosting for a rich, bright dessert with layers of citrus flavor.", "datePublished": "2021-07-23T03:25:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/lemon-cheesecake-poke-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/lemon-cheesecake-poke-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/lemon-cheesecake-poke-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/lemon-cheesecake-poke-cake.png"], "cookTime": "PT25M", "totalTime": "PT28M", "recipeIngredient": ["3  large eggs", "1 cup sour cream", "2 teaspoons baking powder", "1/2 cup unsalted butter (softened to approximately 70°F)", "1 to 1 1/2 teaspoons finely grated lemon zest", "2 cups all-purpose flour (such as King Arthur all-purpose flour)", "1/2 teaspoon salt", "2 to 3 teaspoons freshly squeezed lemon juice", "1 1/2 cups granulated sugar", "6 tablespoons freshly squeezed lemon juice", "2/3 cup sweetened condensed milk", "1 tablespoon freshly squeezed lemon juice", "2 1/2 to 3 cups confectioners’ sugar", "8 ounces cream cheese (softened, such as Philadelphia cream cheese)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the pan and dry mixture. Preheat the oven to 350°F (175°C). Grease a 9 x 13 x 2-inch baking pan. Alternatively, line it with parchment paper, then grease both the parchment and any uncovered areas of the pan.", "name": "Prepare the pan and dry mixture. Preheat the oven to 350°F (175°C). Grease a 9 x 13 x 2-inch baking pan. Alternatively, line it with parchment paper, then grease both the parchment and any uncovered areas of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-0"}, {"@type": "HowToStep", "text": "In a separate bowl, thoroughly whisk together the 2 cups all-purpose flour, 2 teaspoons baking powder, and 1/2 teaspoon salt. Set the dry mixture aside.", "name": "In a separate bowl, thoroughly whisk together the 2 cups all-purpose flour, 2 teaspoons baking powder, and 1/2 teaspoon salt. Set the dry mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-1"}, {"@type": "HowToStep", "text": "Mix the cake batter. Using an electric mixer at medium speed, cream the softened unsalted butter with the granulated sugar until pale, airy, and fluffy.", "name": "Mix the cake batter. Using an electric mixer at medium speed, cream the softened unsalted butter with the granulated sugar until pale, airy, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-2"}, {"@type": "HowToStep", "text": "Beat in the eggs individually, allowing each egg to become fully incorporated before adding the next.", "name": "Beat in the eggs individually, allowing each egg to become fully incorporated before adding the next.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-3"}, {"@type": "HowToStep", "text": "Blend in the 2 to 3 teaspoons fresh lemon juice and the finely grated lemon zest.", "name": "Blend in the 2 to 3 teaspoons fresh lemon juice and the finely grated lemon zest.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-4"}, {"@type": "HowToStep", "text": "Gradually incorporate the prepared flour mixture, mixing only until the dry ingredients disappear into the batter.", "name": "Gradually incorporate the prepared flour mixture, mixing only until the dry ingredients disappear into the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-5"}, {"@type": "HowToStep", "text": "Fold or mix in the sour cream until evenly distributed. Scrape down the sides and bottom of the mixing bowl a couple of times during this process to ensure the batter is uniformly combined.", "name": "Fold or mix in the sour cream until evenly distributed. Scrape down the sides and bottom of the mixing bowl a couple of times during this process to ensure the batter is uniformly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-6"}, {"@type": "HowToStep", "text": "Bake the cake. Transfer the batter to the prepared baking pan and spread it into an even layer.", "name": "Bake the cake. Transfer the batter to the prepared baking pan and spread it into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-7"}, {"@type": "HowToStep", "text": "Bake for 25 to 30 minutes, or until a toothpick or cake tester inserted in the center comes out clean.", "name": "Bake for 25 to 30 minutes, or until a toothpick or cake tester inserted in the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-8"}, {"@type": "HowToStep", "text": "Place the pan on a wire cooling rack and allow the freshly baked cake to rest for approximately 3 to 5 minutes.", "name": "Place the pan on a wire cooling rack and allow the freshly baked cake to rest for approximately 3 to 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-9"}, {"@type": "HowToStep", "text": "Add the lemon soak. While the cake remains warm, use the rounded handle of a wooden spoon to create holes across the entire surface, spacing them approximately 1/2 inch apart. Avoid pushing the handle completely through to the bottom of the cake.", "name": "Add the lemon soak. While the cake remains warm, use the rounded handle of a wooden spoon to create holes across the entire surface, spacing them approximately 1/2 inch apart. Avoid pushing the handle completely through to the bottom of the cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-10"}, {"@type": "HowToStep", "text": "In a small bowl, whisk the sweetened condensed milk with the 6 tablespoons fresh lemon juice until the mixture is smooth and evenly blended.", "name": "In a small bowl, whisk the sweetened condensed milk with the 6 tablespoons fresh lemon juice until the mixture is smooth and evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-11"}, {"@type": "HowToStep", "text": "Immediately pour the lemon milk mixture over the warm cake. Spread it across the surface so that it flows into the holes. Some of the mixture may remain visible on top rather than being completely absorbed.", "name": "Immediately pour the lemon milk mixture over the warm cake. Spread it across the surface so that it flows into the holes. Some of the mixture may remain visible on top rather than being completely absorbed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-12"}, {"@type": "HowToStep", "text": "Cool the cake completely, then place it in the refrigerator for at least 1 to 2 hours so the lemon mixture can settle into the cake and become properly chilled.", "name": "Cool the cake completely, then place it in the refrigerator for at least 1 to 2 hours so the lemon mixture can settle into the cake and become properly chilled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-13"}, {"@type": "HowToStep", "text": "Prepare the lemon cream cheese frosting. Once the cake is cold and the lemon topping has set, combine the softened cream cheese, 1 tablespoon fresh lemon juice, and 2 1/2 to 3 cups confectioners’ sugar in a mixing bowl.", "name": "Prepare the lemon cream cheese frosting. Once the cake is cold and the lemon topping has set, combine the softened cream cheese, 1 tablespoon fresh lemon juice, and 2 1/2 to 3 cups confectioners’ sugar in a mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-14"}, {"@type": "HowToStep", "text": "Beat with an electric mixer at medium speed until the frosting is smooth, creamy, and well aerated. Use the amount of confectioners’ sugar within the stated range that provides the preferred level of sweetness.", "name": "Beat with an electric mixer at medium speed until the frosting is smooth, creamy, and well aerated. Use the amount of confectioners’ sugar within the stated range that provides the preferred level of sweetness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-15"}, {"@type": "HowToStep", "text": "Spread the finished frosting evenly over the chilled cake.", "name": "Spread the finished frosting evenly over the chilled cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-16"}, {"@type": "HowToStep", "text": "Chill before serving. Refrigerate the frosted cake for at least 1 additional hour. This final chilling period allows the frosting to firm and helps produce cleaner slices when serving.", "name": "Chill before serving. Refrigerate the frosted cake for at least 1 additional hour. This final chilling period allows the frosting to firm and helps produce cleaner slices when serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-poke-cake/#wprm-recipe-46263-step-0-17"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Lemon Cheesecake Poke Cake"}</script>
