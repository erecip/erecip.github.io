    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Grilled Chicken Breast Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A brined and spice-rubbed chicken breast, yielding tender, juicy meat with a perfect balance of sweetness and savoriness. Ideal for a quick summer meal or a weeknight dinner.", "datePublished": "2024-10-02T06:36:19+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-breast-recipe/Grilled-Chicken-Breast-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-breast-recipe/Grilled-Chicken-Breast-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-breast-recipe/Grilled-Chicken-Breast-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-breast-recipe/Grilled-Chicken-Breast-Recipe.png"], "recipeYield": ["4"], "prepTime": "PT40M", "cookTime": "PT10M", "totalTime": "PT50M", "recipeIngredient": ["1 tsp brown sugar", "¼ tsp black pepper (freshly cracked)", "2  large boneless (skinless chicken breasts (approx. 1.61 lbs total))", "2 tsp smoked paprika", "¼ cup granulated sugar", "½ tsp onion powder", "¼ tsp cayenne pepper", "1 tsp garlic powder", "1 tsp salt", "¼ cup kosher salt", "2 quarts water"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine ¼ cup kosher salt and ¼ cup granulated sugar with 2 quarts of cold water to prepare the wet brine, stirring until fully dissolved. Puncture the chicken breasts all over using a fork, place them in a Ziplock bag, and gently pound them to a uniform thickness of ½ to ¾ inch with a rolling pin or tenderizer. Add the prepared brine to the bag, seal tightly, and allow the chicken to soak for 30 minutes at room temperature or refrigerate for up to 24 hours. In a separate bowl, mix together the salt, black pepper, cayenne, garlic powder, smoked paprika, onion powder, and brown sugar to form the seasoning blend. Once brined, remove the chicken breasts, rinse thoroughly, and pat dry using paper towels. Lightly drizzle with olive oil, then coat evenly with the spice rub on all sides. Preheat the grill to 475°F. For indoor grilling, it is recommended to place the chicken on the grill while it preheats to help the interior reach temperature without burning the exterior. If chilled, allow the chicken to sit at room temperature for at least 10 minutes prior to grilling. Grill the chicken for approximately 5–7 minutes per side, ensuring the internal temperature reaches 155–160°F before removing it from the heat. The chicken will finish cooking as it rests and must reach a final temperature of 165°F; return to the grill briefly if necessary.", "name": "Combine ¼ cup kosher salt and ¼ cup granulated sugar with 2 quarts of cold water to prepare the wet brine, stirring until fully dissolved. Puncture the chicken breasts all over using a fork, place them in a Ziplock bag, and gently pound them to a uniform thickness of ½ to ¾ inch with a rolling pin or tenderizer. Add the prepared brine to the bag, seal tightly, and allow the chicken to soak for 30 minutes at room temperature or refrigerate for up to 24 hours. In a separate bowl, mix together the salt, black pepper, cayenne, garlic powder, smoked paprika, onion powder, and brown sugar to form the seasoning blend. Once brined, remove the chicken breasts, rinse thoroughly, and pat dry using paper towels. Lightly drizzle with olive oil, then coat evenly with the spice rub on all sides. Preheat the grill to 475°F. For indoor grilling, it is recommended to place the chicken on the grill while it preheats to help the interior reach temperature without burning the exterior. If chilled, allow the chicken to sit at room temperature for at least 10 minutes prior to grilling. Grill the chicken for approximately 5–7 minutes per side, ensuring the internal temperature reaches 155–160°F before removing it from the heat. The chicken will finish cooking as it rests and must reach a final temperature of 165°F; return to the grill briefly if necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-chicken-breast-recipe/#wprm-recipe-49690-step-0-0"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Grilled Chicken Breast Recipe"}</script>
