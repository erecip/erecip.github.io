    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Southern Pecan Pie", "author": {"@type": "Person", "name": "BenDes"}, "description": "A traditional Southern-style pecan pie featuring a buttery pastry shell filled with toasted-nut richness and a smooth brown sugar–corn syrup custard. Cinnamon and pure vanilla provide gentle warmth, while the generous quantity of pecans creates a substantial, pleasantly textured filling.", "datePublished": "2018-02-28T23:33:08+00:00", "image": ["https://erecip.github.io/en/southern-pecan-pie/southern-pecan-pie2.png", "https://erecip.github.io/en/southern-pecan-pie/southern-pecan-pie2.png", "https://erecip.github.io/en/southern-pecan-pie/southern-pecan-pie2.png", "https://erecip.github.io/en/southern-pecan-pie/southern-pecan-pie2.png"], "cookTime": "PT55M", "totalTime": "PT175M", "recipeIngredient": ["2 1/2 cups pecans (approximately 10 ounces, coarsely chopped)", "3  large eggs (preferably brought to room temperature)", "1  unbaked or frozen 9-inch pastry shell", "3/4 cup firmly packed brown sugar", "1 cup light or dark corn syrup (according to preference)", "3 tablespoons unsalted butter (melted and allowed to cool to room temperature)", "1 teaspoon pure vanilla extract", "1/2 teaspoon salt", "1 teaspoon ground cinnamon (preferably freshly ground)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Arrange an oven rack in the lower-middle portion of the oven, then heat the oven to 350°F (175°C). This placement encourages even baking while helping protect the pastry from excessive browning.", "name": "Arrange an oven rack in the lower-middle portion of the oven, then heat the oven to 350°F (175°C). This placement encourages even baking while helping protect the pastry from excessive browning.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-0"}, {"@type": "HowToStep", "text": "If the eggs are still refrigerated, bring them to room temperature so they will combine more readily with the remaining filling ingredients.", "name": "If the eggs are still refrigerated, bring them to room temperature so they will combine more readily with the remaining filling ingredients.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-1"}, {"@type": "HowToStep", "text": "Coarsely chop the 2 1/2 cups of pecans, leaving a mixture of smaller pieces and larger chunks to provide varied texture throughout the finished pie.", "name": "Coarsely chop the 2 1/2 cups of pecans, leaving a mixture of smaller pieces and larger chunks to provide varied texture throughout the finished pie.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-2"}, {"@type": "HowToStep", "text": "Set the unbaked 9-inch pastry shell on a baking sheet. The sheet provides additional stability during handling and will catch any filling that may drip while baking.", "name": "Set the unbaked 9-inch pastry shell on a baking sheet. The sheet provides additional stability during handling and will catch any filling that may drip while baking.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-3"}, {"@type": "HowToStep", "text": "Place the 3 room-temperature eggs, 1 cup corn syrup, 3/4 cup packed brown sugar, 3 tablespoons melted and cooled unsalted butter, 1 teaspoon vanilla extract, 1 teaspoon cinnamon, and 1/2 teaspoon salt in a medium mixing bowl.", "name": "Place the 3 room-temperature eggs, 1 cup corn syrup, 3/4 cup packed brown sugar, 3 tablespoons melted and cooled unsalted butter, 1 teaspoon vanilla extract, 1 teaspoon cinnamon, and 1/2 teaspoon salt in a medium mixing bowl.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-4"}, {"@type": "HowToStep", "text": "Whisk the mixture energetically for approximately 1–2 minutes, continuing until the brown sugar has dissolved thoroughly and the filling appears smooth and evenly blended. Proper mixing helps prevent a grainy finished texture.", "name": "Whisk the mixture energetically for approximately 1–2 minutes, continuing until the brown sugar has dissolved thoroughly and the filling appears smooth and evenly blended. Proper mixing helps prevent a grainy finished texture.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-5"}, {"@type": "HowToStep", "text": "Continue until the eggs and melted butter are fully incorporated into a cohesive custard mixture. This emulsification contributes to the pie's smooth consistency and helps distribute the pecans through the filling during baking.", "name": "Continue until the eggs and melted butter are fully incorporated into a cohesive custard mixture. This emulsification contributes to the pie's smooth consistency and helps distribute the pecans through the filling during baking.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-6"}, {"@type": "HowToStep", "text": "Distribute the chopped pecans in an even layer over the base of the prepared pastry shell.", "name": "Distribute the chopped pecans in an even layer over the base of the prepared pastry shell.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-7"}, {"@type": "HowToStep", "text": "Gradually pour the custard mixture over the pecans, filling the shell nearly to the top. Depending on the depth of the crust, a very small amount of filling may remain.", "name": "Gradually pour the custard mixture over the pecans, filling the shell nearly to the top. Depending on the depth of the crust, a very small amount of filling may remain.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the assembled pie immediately to the preheated 350°F (175°C) oven, keeping it on the lower-middle rack. Bake for 55–60 minutes, or until the outer portion of the filling is set while the very center retains a slight jiggle. The remaining heat will continue setting the custard after the pie leaves the oven, helping prevent an overly firm or rubbery texture.", "name": "Transfer the assembled pie immediately to the preheated 350°F (175°C) oven, keeping it on the lower-middle rack. Bake for 55–60 minutes, or until the outer portion of the filling is set while the very center retains a slight jiggle. The remaining heat will continue setting the custard after the pie leaves the oven, helping prevent an overly firm or rubbery texture.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-9"}, {"@type": "HowToStep", "text": "Remove the baked pie from the oven and leave it on the baking sheet to cool at room temperature for a minimum of 2 hours before cutting.", "name": "Remove the baked pie from the oven and leave it on the baking sheet to cool at room temperature for a minimum of 2 hours before cutting.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-10"}, {"@type": "HowToStep", "text": "During this cooling period, the custard will continue to firm and stabilize. Slicing the pie while it is still warm may cause the filling to lose its shape.", "name": "During this cooling period, the custard will continue to firm and stabilize. Slicing the pie while it is still warm may cause the filling to lose its shape.", "url": "https://erecip.github.io/en/southern-pecan-pie/#wprm-recipe-43557-step-0-11"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["Southern American"], "keywords": "Southern Pecan Pie"}</script>
