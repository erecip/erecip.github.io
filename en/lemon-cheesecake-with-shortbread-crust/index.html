    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Cheesecake with Shortbread Crust", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, citrus-forward cheesecake featuring a buttery lemon-scented shortbread base, smooth cream cheese filling, glossy homemade lemon curd, and a decorative layer of vanilla whipped cream. Slow cooling and an overnight refrigerator rest produce a firm yet creamy texture and clean slices.", "datePublished": "2022-02-08T15:51:46+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/lemon-cheesecake-with-shortbread-crust1.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/lemon-cheesecake-with-shortbread-crust1.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/lemon-cheesecake-with-shortbread-crust1.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/lemon-cheesecake-with-shortbread-crust1.png"], "prepTime": "PT45M", "cookTime": "PT70M", "totalTime": "PT175M", "recipeIngredient": ["6 tablespoons freshly squeezed lemon juice", "1/4 cup unsalted butter (cut into small cubes)", "Pinch of salt", "2  large eggs (brought to room temperature, approximately 70°F)", "1 1/2 teaspoons finely grated lemon zest", "1/2 cup granulated sugar", "2 teaspoons grated lemon zest (approximately the zest of 1 lemon)", "5 tablespoons unsalted butter (melted and allowed to cool slightly)", "1/4 teaspoon salt", "1/4 cup granulated sugar", "2 cups finely crushed shortbread cookie crumbs (315 grams)", "1 cup room-temperature sour cream", "1 teaspoon fresh lemon juice", "4  large eggs (at room temperature)", "2 teaspoons arrowroot starch", "1 teaspoon pure vanilla extract", "1/4 teaspoon salt", "1 cup granulated sugar", "24 ounces full-fat cream cheese (softened and cut into cubes)", "1 teaspoon pure vanilla extract", "1 cup cold heavy whipping cream (preferably 36% milk fat or higher)", "1/2 cup confectioners’ sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Whisk the eggs, lemon juice, finely grated lemon zest, granulated sugar, and a pinch of salt together in a heavy-bottomed saucepan until evenly blended.", "name": "Whisk the eggs, lemon juice, finely grated lemon zest, granulated sugar, and a pinch of salt together in a heavy-bottomed saucepan until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-0"}, {"@type": "HowToStep", "text": "Set the saucepan over moderately low heat and cook while whisking continuously. Continue until the mixture begins to develop a slightly thicker consistency.", "name": "Set the saucepan over moderately low heat and cook while whisking continuously. Continue until the mixture begins to develop a slightly thicker consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-1"}, {"@type": "HowToStep", "text": "Add the cubed unsalted butter gradually, incorporating only a few pieces at a time. Allow each portion to melt fully before adding the next. Continue whisking until the lemon curd becomes smooth and sufficiently thick to coat the back of a spoon, approximately 5 minutes in total.", "name": "Add the cubed unsalted butter gradually, incorporating only a few pieces at a time. Allow each portion to melt fully before adding the next. Continue whisking until the lemon curd becomes smooth and sufficiently thick to coat the back of a spoon, approximately 5 minutes in total.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-2"}, {"@type": "HowToStep", "text": "Pass the finished curd through a fine-mesh sieve into a clean bowl. Place plastic wrap directly against the surface of the curd to prevent a skin from developing, then refrigerate for at least 1 hour, or until thoroughly chilled.", "name": "Pass the finished curd through a fine-mesh sieve into a clean bowl. Place plastic wrap directly against the surface of the curd to prevent a skin from developing, then refrigerate for at least 1 hour, or until thoroughly chilled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-3"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F.", "name": "Preheat the oven to 350°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-4"}, {"@type": "HowToStep", "text": "Coat the bottom and sides of a 9-inch springform pan evenly with softened butter. Fit a round piece of parchment paper over the bottom of the pan.", "name": "Coat the bottom and sides of a 9-inch springform pan evenly with softened butter. Fit a round piece of parchment paper over the bottom of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-5"}, {"@type": "HowToStep", "text": "Combine the finely crushed shortbread cookies, granulated sugar, salt, and grated lemon zest in a medium mixing bowl.", "name": "Combine the finely crushed shortbread cookies, granulated sugar, salt, and grated lemon zest in a medium mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-6"}, {"@type": "HowToStep", "text": "Pour in the melted, slightly cooled butter and stir until every crumb is moistened. The finished mixture should resemble damp sand and form large clumps when pressed together.", "name": "Pour in the melted, slightly cooled butter and stir until every crumb is moistened. The finished mixture should resemble damp sand and form large clumps when pressed together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-7"}, {"@type": "HowToStep", "text": "Firmly distribute the crumb mixture over the base of the prepared pan and approximately 1/2 inch up the sides. Compact the crust tightly and evenly with the flat bottom of a measuring cup.", "name": "Firmly distribute the crumb mixture over the base of the prepared pan and approximately 1/2 inch up the sides. Compact the crust tightly and evenly with the flat bottom of a measuring cup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-8"}, {"@type": "HowToStep", "text": "Bake for 10 to 12 minutes, or until the crust appears lightly golden and feels set.", "name": "Bake for 10 to 12 minutes, or until the crust appears lightly golden and feels set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-9"}, {"@type": "HowToStep", "text": "Place the pan on a wire cooling rack and allow the crust to cool for 30 minutes.", "name": "Place the pan on a wire cooling rack and allow the crust to cool for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-10"}, {"@type": "HowToStep", "text": "Lower the oven temperature to 300°F.", "name": "Lower the oven temperature to 300°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-11"}, {"@type": "HowToStep", "text": "Place the softened cream cheese, granulated sugar, arrowroot starch, and salt in a large mixing bowl.", "name": "Place the softened cream cheese, granulated sugar, arrowroot starch, and salt in a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-12"}, {"@type": "HowToStep", "text": "Beat the mixture on low speed for 1 minute. Stop the mixer and thoroughly scrape the sides and bottom of the bowl with a rubber spatula.", "name": "Beat the mixture on low speed for 1 minute. Stop the mixer and thoroughly scrape the sides and bottom of the bowl with a rubber spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-13"}, {"@type": "HowToStep", "text": "Add the room-temperature sour cream, pure vanilla extract, and lemon juice. Mix on low speed for approximately 30 seconds, then scrape the bowl again.", "name": "Add the room-temperature sour cream, pure vanilla extract, and lemon juice. Mix on low speed for approximately 30 seconds, then scrape the bowl again.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-14"}, {"@type": "HowToStep", "text": "Incorporate the eggs individually on low speed, mixing each egg only until it disappears into the batter, approximately 10 seconds per egg. Scrape the bowl after every addition to ensure an evenly blended filling without excessive mixing.", "name": "Incorporate the eggs individually on low speed, mixing each egg only until it disappears into the batter, approximately 10 seconds per egg. Scrape the bowl after every addition to ensure an evenly blended filling without excessive mixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-15"}, {"@type": "HowToStep", "text": "Pour the cheesecake batter onto the cooled shortbread crust and level the surface gently with an offset spatula.", "name": "Pour the cheesecake batter onto the cooled shortbread crust and level the surface gently with an offset spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-16"}, {"@type": "HowToStep", "text": "Bake at 300°F for 60 to 65 minutes. The cheesecake is ready when the outer edges have set while the center remains slightly puffed and retains a gentle wobble.", "name": "Bake at 300°F for 60 to 65 minutes. The cheesecake is ready when the outer edges have set while the center remains slightly puffed and retains a gentle wobble.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-17"}, {"@type": "HowToStep", "text": "Turn off the oven immediately after baking. Prop the oven door partially open with a wooden spoon and leave the cheesecake inside to cool gradually for 75 minutes.", "name": "Turn off the oven immediately after baking. Prop the oven door partially open with a wooden spoon and leave the cheesecake inside to cool gradually for 75 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-18"}, {"@type": "HowToStep", "text": "After the 75-minute oven-cooling period, transfer the springform pan to a wire rack.", "name": "After the 75-minute oven-cooling period, transfer the springform pan to a wire rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-19"}, {"@type": "HowToStep", "text": "Carefully slide a thin metal spatula around the perimeter of the cheesecake to separate it from the sides of the pan.", "name": "Carefully slide a thin metal spatula around the perimeter of the cheesecake to separate it from the sides of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-20"}, {"@type": "HowToStep", "text": "Allow the cheesecake to continue cooling at room temperature for 1 hour.", "name": "Allow the cheesecake to continue cooling at room temperature for 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-21"}, {"@type": "HowToStep", "text": "Keeping the cheesecake inside the springform pan, transfer it uncovered to the refrigerator. Chill overnight to allow the filling to set completely. Leaving it uncovered during this initial chilling period helps minimize condensation on the surface.", "name": "Keeping the cheesecake inside the springform pan, transfer it uncovered to the refrigerator. Chill overnight to allow the filling to set completely. Leaving it uncovered during this initial chilling period helps minimize condensation on the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-22"}, {"@type": "HowToStep", "text": "Pour the cold heavy cream into a chilled mixer bowl fitted with a wire whisk attachment.", "name": "Pour the cold heavy cream into a chilled mixer bowl fitted with a wire whisk attachment.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-23"}, {"@type": "HowToStep", "text": "Whip on medium-high speed until the cream begins to visibly thicken.", "name": "Whip on medium-high speed until the cream begins to visibly thicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-24"}, {"@type": "HowToStep", "text": "Add the confectioners’ sugar gradually, followed by the pure vanilla extract.", "name": "Add the confectioners’ sugar gradually, followed by the pure vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-25"}, {"@type": "HowToStep", "text": "Continue whipping until the cream forms stiff peaks. Using a thoroughly chilled bowl and whisk helps the cream whip efficiently and maintain a light, stable consistency.", "name": "Continue whipping until the cream forms stiff peaks. Using a thoroughly chilled bowl and whisk helps the cream whip efficiently and maintain a light, stable consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-26"}, {"@type": "HowToStep", "text": "Release and remove the outer ring of the springform pan. Slide a thin metal spatula underneath the cheesecake and carefully transfer it from the pan base to a serving plate.", "name": "Release and remove the outer ring of the springform pan. Slide a thin metal spatula underneath the cheesecake and carefully transfer it from the pan base to a serving plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-27"}, {"@type": "HowToStep", "text": "Spoon the thoroughly chilled lemon curd over the cheesecake and spread it into a smooth, even layer with an offset spatula.", "name": "Spoon the thoroughly chilled lemon curd over the cheesecake and spread it into a smooth, even layer with an offset spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-28"}, {"@type": "HowToStep", "text": "Place the prepared whipped cream in a piping bag fitted with a large star tip. Pipe the cream decoratively around the outer edge of the cheesecake.", "name": "Place the prepared whipped cream in a piping bag fitted with a large star tip. Pipe the cream decoratively around the outer edge of the cheesecake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-29"}, {"@type": "HowToStep", "text": "Garnish with lemon slices if desired.", "name": "Garnish with lemon slices if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-30"}, {"@type": "HowToStep", "text": "For clean portions, dip a sharp knife into hot water and wipe it completely dry before making each cut.", "name": "For clean portions, dip a sharp knife into hot water and wipe it completely dry before making each cut.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-with-shortbread-crust/#wprm-recipe-46573-step-0-31"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Lemon Cheesecake with Shortbread Crust"}</script>
