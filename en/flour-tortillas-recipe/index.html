    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Flour Tortillas Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Make your next Mexican-inspired meal unforgettable with these homemade flour tortillas, crafted from just five simple ingredients. Soft, flexible, yet robust enough to hold your favorite fillings, they’re ideal for tacos, burritos, enchiladas, and more. Best of all, they’re remarkably easy to prepare and require no special equipment.", "datePublished": "2024-04-17T23:24:59+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/366a77bd5d-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/366a77bd5d-1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/366a77bd5d-1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/366a77bd5d-1-480x270.jpg"], "recipeYield": ["16", "16 tortillas"], "prepTime": "PT30M", "cookTime": "PT30M", "totalTime": "PT75M", "recipeIngredient": ["1 cup hot water", "1/3 cup vegetable oil (shortening, or lard)", "3 cups all-purpose flour", "1 teaspoon baking powder", "1 teaspoon salt"], "recipeInstructions": [{"@type": "HowToSection", "name": "Stand Mixer Method", "itemListElement": [{"@type": "HowToStep", "text": "In a stand mixer bowl fitted with a dough hook, combine the flour, salt, and baking powder, and mix briefly to blend.", "name": "In a stand mixer bowl fitted with a dough hook, combine the flour, salt, and baking powder, and mix briefly to blend.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flour-tortillas-recipe/#wprm-recipe-4778-step-0-0"}, {"@type": "HowToStep", "text": "With the mixer set to medium, add the oil and water gradually. Mix for 1-2 minutes, pausing to scrape the bowl’s sides as needed. Once the dough forms into a cohesive ball, reduce the speed to low and continue mixing for another 1-2 minutes until smooth.", "name": "With the mixer set to medium, add the oil and water gradually. Mix for 1-2 minutes, pausing to scrape the bowl’s sides as needed. Once the dough forms into a cohesive ball, reduce the speed to low and continue mixing for another 1-2 minutes until smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flour-tortillas-recipe/#wprm-recipe-4778-step-0-1"}]}, {"@type": "HowToSection", "name": "Hand Mixing Method", "itemListElement": [{"@type": "HowToStep", "text": "In a large bowl, whisk together the flour, salt, and baking powder. Drizzle in the oil and stir until the mixture becomes crumbly.", "name": "In a large bowl, whisk together the flour, salt, and baking powder. Drizzle in the oil and stir until the mixture becomes crumbly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flour-tortillas-recipe/#wprm-recipe-4778-step-1-0"}, {"@type": "HowToStep", "text": "Pour in the warm water and mix to combine. Using floured hands, knead the dough briefly until it forms a rough, slightly sticky ball.", "name": "Pour in the warm water and mix to combine. Using floured hands, knead the dough briefly until it forms a rough, slightly sticky ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flour-tortillas-recipe/#wprm-recipe-4778-step-1-1"}]}, {"@type": "HowToSection", "name": "After Mixing", "itemListElement": [{"@type": "HowToStep", "text": "Transfer the dough from the mixing bowl onto a floured surface. Divide it into 16 even portions. Shape each piece into a small ball, then gently flatten each with your palm. Cover the dough balls with a clean kitchen towel and let rest for at least 15 minutes or up to an hour.", "name": "Transfer the dough from the mixing bowl onto a floured surface. Divide it into 16 even portions. Shape each piece into a small ball, then gently flatten each with your palm. Cover the dough balls with a clean kitchen towel and let rest for at least 15 minutes or up to an hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flour-tortillas-recipe/#wprm-recipe-4778-step-2-0"}, {"@type": "HowToStep", "text": "When ready to cook, preheat a large cast-iron or heavy-bottomed skillet over medium-high heat.", "name": "When ready to cook, preheat a large cast-iron or heavy-bottomed skillet over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flour-tortillas-recipe/#wprm-recipe-4778-step-2-1"}, {"@type": "HowToStep", "text": "On a lightly floured surface, roll each dough ball into a circle approximately 6 inches in diameter. Avoid stacking the rolled tortillas; if needed, use a sheet of lightly floured parchment paper for extra space.", "name": "On a lightly floured surface, roll each dough ball into a circle approximately 6 inches in diameter. Avoid stacking the rolled tortillas; if needed, use a sheet of lightly floured parchment paper for extra space.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flour-tortillas-recipe/#wprm-recipe-4778-step-2-2"}, {"@type": "HowToStep", "text": "Place one tortilla in the hot skillet, cooking for about 1 minute, until bubbles form on top and golden spots appear underneath. Adjust heat if needed. Flip and cook for an additional 30 seconds on the other side.", "name": "Place one tortilla in the hot skillet, cooking for about 1 minute, until bubbles form on top and golden spots appear underneath. Adjust heat if needed. Flip and cook for an additional 30 seconds on the other side.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flour-tortillas-recipe/#wprm-recipe-4778-step-2-3"}, {"@type": "HowToStep", "text": "Transfer cooked tortillas to a stack, loosely wrapped in a clean kitchen towel to keep them soft and warm.", "name": "Transfer cooked tortillas to a stack, loosely wrapped in a clean kitchen towel to keep them soft and warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flour-tortillas-recipe/#wprm-recipe-4778-step-2-4"}]}, {"@type": "HowToSection", "name": "Storage Instructions", "itemListElement": [{"@type": "HowToStep", "text": "Serve fresh, or let the tortillas cool completely before storage. To refrigerate, place tortillas in a zip-top bag for up to 3 days; microwave with a damp paper towel for 15-30 seconds before serving. For longer storage, separate tortillas with parchment or wax paper and freeze in a zip-top freezer bag for up to 2-3 months.", "name": "Serve fresh, or let the tortillas cool completely before storage. To refrigerate, place tortillas in a zip-top bag for up to 3 days; microwave with a damp paper towel for 15-30 seconds before serving. For longer storage, separate tortillas with parchment or wax paper and freeze in a zip-top freezer bag for up to 2-3 months.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flour-tortillas-recipe/#wprm-recipe-4778-step-3-0"}]}], "recipeCategory": ["Bread", "Side Dish"], "recipeCuisine": ["Mexican"]}</script>
