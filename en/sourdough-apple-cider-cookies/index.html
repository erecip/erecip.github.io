    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sourdough Apple Cider Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, richly spiced sourdough cookies made with browned butter, apple butter, dried apples, dark chocolate, and pecans, then finished with a homemade apple cider caramel glaze. Extended chilling develops the sourdough character while giving the dough a firmer texture for baking.", "datePublished": "2021-06-15T02:20:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/sourdough-apple-cider-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/sourdough-apple-cider-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/sourdough-apple-cider-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/sourdough-apple-cider-cookies.png"], "prepTime": "PT35M", "cookTime": "PT18M", "totalTime": "PT83M", "recipeIngredient": ["3 cups all-purpose flour (preferably unbleached, measured by spooning and leveling)", "1 cup pecans (roughly chopped)", "3/4 cup sourdough starter (either active or discard)", "1 teaspoon ground cinnamon", "3  egg yolks", "1/4 teaspoon ground cardamom", "1 cup unsalted butter (softened to room temperature)", "1 1/2 cups dried apples (chopped into small pieces)", "3/4 cup cane sugar", "1 teaspoon baking powder", "1/2 cup apple butter", "1/4 teaspoon ground nutmeg", "3/4 cup bittersweet or dark chocolate chips", "1 teaspoon fine sea salt", "1 cup packed brown sugar", "1/2 teaspoon ground ginger", "1 1/2 teaspoons vanilla extract", "1 teaspoon baking soda", "1/4 teaspoon ground allspice", "1/2 cup heavy cream", "2 cups unfiltered apple cider", "1/2 teaspoon vanilla extract", "4 tablespoons salted butter", "1/4 teaspoon sea salt", "1 cup cane sugar", "1/2 teaspoon ground cinnamon"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the 1 cup of unsalted butter in a small saucepan over medium-low heat and allow it to melt completely.", "name": "Place the 1 cup of unsalted butter in a small saucepan over medium-low heat and allow it to melt completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-0"}, {"@type": "HowToStep", "text": "Once liquefied, reduce the heat to a gentle simmer. Continue cooking for 10–15 minutes, stirring from time to time, until the butter takes on a golden-brown color, develops browned milk solids, and smells distinctly nutty and toasted.", "name": "Once liquefied, reduce the heat to a gentle simmer. Continue cooking for 10–15 minutes, stirring from time to time, until the butter takes on a golden-brown color, develops browned milk solids, and smells distinctly nutty and toasted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-1"}, {"@type": "HowToStep", "text": "Immediately pour the browned butter into a mixing bowl and leave it to cool while preparing the cider caramel.", "name": "Immediately pour the browned butter into a mixing bowl and leave it to cool while preparing the cider caramel.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-2"}, {"@type": "HowToStep", "text": "Using the same saucepan, pour in the 2 cups of apple cider and bring it to a boil over medium-high heat.", "name": "Using the same saucepan, pour in the 2 cups of apple cider and bring it to a boil over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-3"}, {"@type": "HowToStep", "text": "Continue boiling for approximately 15–20 minutes, or until the cider has concentrated to roughly 1/3 cup.", "name": "Continue boiling for approximately 15–20 minutes, or until the cider has concentrated to roughly 1/3 cup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-4"}, {"@type": "HowToStep", "text": "Turn the heat down to medium-low. Whisk in the 1 cup of cane sugar until it has completely dissolved into the reduced cider.", "name": "Turn the heat down to medium-low. Whisk in the 1 cup of cane sugar until it has completely dissolved into the reduced cider.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-5"}, {"@type": "HowToStep", "text": "Add the 4 tablespoons of salted butter followed by the 1/2 cup of heavy cream. Stir continuously and maintain a low simmer for about 5 minutes, allowing the mixture to thicken.", "name": "Add the 4 tablespoons of salted butter followed by the 1/2 cup of heavy cream. Stir continuously and maintain a low simmer for about 5 minutes, allowing the mixture to thicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-6"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Stir in the 1/2 teaspoon cinnamon, 1/4 teaspoon sea salt, and 1/2 teaspoon vanilla extract.", "name": "Remove the saucepan from the heat. Stir in the 1/2 teaspoon cinnamon, 1/4 teaspoon sea salt, and 1/2 teaspoon vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-7"}, {"@type": "HowToStep", "text": "Let the caramel cool slightly, then pour it into a glass jar and reserve it for glazing the finished cookies.", "name": "Let the caramel cool slightly, then pour it into a glass jar and reserve it for glazing the finished cookies.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-8"}, {"@type": "HowToStep", "text": "Add the 3/4 cup cane sugar and 1 cup packed brown sugar to the bowl containing the cooled browned butter.", "name": "Add the 3/4 cup cane sugar and 1 cup packed brown sugar to the bowl containing the cooled browned butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-9"}, {"@type": "HowToStep", "text": "Using either a stand mixer fitted with the paddle attachment or a hand mixer, beat the ingredients on medium-high speed until thoroughly blended. Because the browned butter remains liquid rather than creamed, the mixture is not expected to become light and fluffy.", "name": "Using either a stand mixer fitted with the paddle attachment or a hand mixer, beat the ingredients on medium-high speed until thoroughly blended. Because the browned butter remains liquid rather than creamed, the mixture is not expected to become light and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-10"}, {"@type": "HowToStep", "text": "Add the 3/4 cup sourdough starter and the 3 egg yolks. Mix on medium speed until evenly incorporated.", "name": "Add the 3/4 cup sourdough starter and the 3 egg yolks. Mix on medium speed until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-11"}, {"@type": "HowToStep", "text": "Blend in the 1/2 cup apple butter and 1 1/2 teaspoons vanilla extract, continuing only until the mixture becomes smooth and uniform.", "name": "Blend in the 1/2 cup apple butter and 1 1/2 teaspoons vanilla extract, continuing only until the mixture becomes smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-12"}, {"@type": "HowToStep", "text": "To the wet mixture, add the 3 cups flour, 1 teaspoon baking soda, 1 teaspoon baking powder, 1 teaspoon sea salt, 1 teaspoon cinnamon, 1/2 teaspoon ginger, 1/4 teaspoon allspice, 1/4 teaspoon cardamom, and 1/4 teaspoon nutmeg.", "name": "To the wet mixture, add the 3 cups flour, 1 teaspoon baking soda, 1 teaspoon baking powder, 1 teaspoon sea salt, 1 teaspoon cinnamon, 1/2 teaspoon ginger, 1/4 teaspoon allspice, 1/4 teaspoon cardamom, and 1/4 teaspoon nutmeg.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-13"}, {"@type": "HowToStep", "text": "Mix on low speed just until the dry ingredients disappear into the dough, stopping to scrape down the bowl when necessary. Avoid excessive mixing once the flour has been added.", "name": "Mix on low speed just until the dry ingredients disappear into the dough, stopping to scrape down the bowl when necessary. Avoid excessive mixing once the flour has been added.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-14"}, {"@type": "HowToStep", "text": "Add the 3/4 cup dark or bittersweet chocolate chips, 1 cup chopped pecans, and 1 1/2 cups chopped dried apples. Mix only until the additions are evenly dispersed throughout the dough.", "name": "Add the 3/4 cup dark or bittersweet chocolate chips, 1 cup chopped pecans, and 1 1/2 cups chopped dried apples. Mix only until the additions are evenly dispersed throughout the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-15"}, {"@type": "HowToStep", "text": "Cover the bowl securely with plastic wrap and refrigerate the cookie dough for at least 4 hours. This resting period allows the dough to become firm while the flavors develop.", "name": "Cover the bowl securely with plastic wrap and refrigerate the cookie dough for at least 4 hours. This resting period allows the dough to become firm while the flavors develop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-16"}, {"@type": "HowToStep", "text": "For a more pronounced sourdough character and a longer fermentation period, the covered dough may remain refrigerated for 24–72 hours.", "name": "For a more pronounced sourdough character and a longer fermentation period, the covered dough may remain refrigerated for 24–72 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-17"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Line two baking sheets with parchment paper.", "name": "Preheat the oven to 350°F (175°C). Line two baking sheets with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-18"}, {"@type": "HowToStep", "text": "Using a large cookie scoop, divide the chilled dough between the prepared baking sheets, leaving approximately 2 inches of space between each portion.", "name": "Using a large cookie scoop, divide the chilled dough between the prepared baking sheets, leaving approximately 2 inches of space between each portion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-19"}, {"@type": "HowToStep", "text": "For consistently sized cookies, portion approximately 68 grams of dough for each cookie. Alternatively, use about 3 tablespoons of dough per piece.", "name": "For consistently sized cookies, portion approximately 68 grams of dough for each cookie. Alternatively, use about 3 tablespoons of dough per piece.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-20"}, {"@type": "HowToStep", "text": "Bake for 16–18 minutes, stopping when the edges appear set but the centers remain soft. Do not bake beyond this stage.", "name": "Bake for 16–18 minutes, stopping when the edges appear set but the centers remain soft. Do not bake beyond this stage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-21"}, {"@type": "HowToStep", "text": "For a flatter finished shape, carefully drop or tap the hot baking sheet against a protected countertop once or twice immediately after removing it from the oven.", "name": "For a flatter finished shape, carefully drop or tap the hot baking sheet against a protected countertop once or twice immediately after removing it from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-22"}, {"@type": "HowToStep", "text": "Leave the baked cookies on their baking sheets for several minutes so they can begin to set.", "name": "Leave the baked cookies on their baking sheets for several minutes so they can begin to set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-23"}, {"@type": "HowToStep", "text": "Transfer the cookies to a wire cooling rack.", "name": "Transfer the cookies to a wire cooling rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-24"}, {"@type": "HowToStep", "text": "Drizzle the reserved apple cider caramel glaze over each cookie. If desired, finish with a small amount of flaked sea salt.", "name": "Drizzle the reserved apple cider caramel glaze over each cookie. If desired, finish with a small amount of flaked sea salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-25"}, {"@type": "HowToStep", "text": "Allow the caramel topping to set for several minutes before serving the cookies while they are still slightly warm.", "name": "Allow the caramel topping to set for several minutes before serving the cookies while they are still slightly warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-apple-cider-cookies/#wprm-recipe-44344-step-0-26"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Sourdough Apple Cider Cookies"}</script>
