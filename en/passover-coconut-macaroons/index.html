    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Passover Coconut Macaroons", "author": {"@type": "Person", "name": "BenDes"}, "description": "These Passover-friendly coconut macaroons feature tender, lightly golden centers with crisp toasted edges. Each macaroon is finished with a dark chocolate base and a decorative chocolate drizzle.", "datePublished": "2018-08-19T01:32:25+00:00", "image": ["https://erecip.github.io/en/passover-coconut-macaroons/passover-coconut-macaroons2.png", "https://erecip.github.io/en/passover-coconut-macaroons/passover-coconut-macaroons2.png", "https://erecip.github.io/en/passover-coconut-macaroons/passover-coconut-macaroons2.png", "https://erecip.github.io/en/passover-coconut-macaroons/passover-coconut-macaroons2.png"], "cookTime": "PT20M", "totalTime": "PT40M", "recipeIngredient": ["2 1/2 cups unsweetened shredded coconut", "1 teaspoon vanilla extract", "1/4 teaspoon fine salt", "4  large egg whites (preferably at room temperature for effective aeration)", "1 1/2 tablespoons potato starch", "1/2 cup granulated sugar", "13 ounces high-quality dark chocolate (divided into 9 ounces for dipping and 4 ounces for drizzling)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the shredded coconut, granulated sugar, potato starch, and salt in a large mixing bowl.", "name": "Combine the shredded coconut, granulated sugar, potato starch, and salt in a large mixing bowl.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-0"}, {"@type": "HowToStep", "text": "Blend the dry ingredients thoroughly with a fork, pressing apart any visible clumps of potato starch.", "name": "Blend the dry ingredients thoroughly with a fork, pressing apart any visible clumps of potato starch.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-1"}, {"@type": "HowToStep", "text": "In a separate small bowl, whisk the egg whites with the vanilla extract until the mixture becomes frothy.", "name": "In a separate small bowl, whisk the egg whites with the vanilla extract until the mixture becomes frothy.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-2"}, {"@type": "HowToStep", "text": "Pour the egg-white mixture over the coconut ingredients. Stir with a fork until every portion of coconut is evenly moistened.", "name": "Pour the egg-white mixture over the coconut ingredients. Stir with a fork until every portion of coconut is evenly moistened.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-3"}, {"@type": "HowToStep", "text": "Allow the mixture to stand for 20–30 minutes so the shredded coconut can absorb the liquid and soften.", "name": "Allow the mixture to stand for 20–30 minutes so the shredded coconut can absorb the liquid and soften.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 325°F (163°C). Line a baking sheet with parchment paper or a silicone baking mat.", "name": "Preheat the oven to 325°F (163°C). Line a baking sheet with parchment paper or a silicone baking mat.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-5"}, {"@type": "HowToStep", "text": "Stir the rested coconut mixture once more with a fork.", "name": "Stir the rested coconut mixture once more with a fork.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-6"}, {"@type": "HowToStep", "text": "Scoop tablespoon-sized portions onto the prepared baking sheet, arranging the mounds relatively close together.", "name": "Scoop tablespoon-sized portions onto the prepared baking sheet, arranging the mounds relatively close together.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-7"}, {"@type": "HowToStep", "text": "Because the mixture is delicate, dampen your fingers and carefully form each portion into a loose dome or haystack shape. The macaroons do not need to appear perfectly uniform.", "name": "Because the mixture is delicate, dampen your fingers and carefully form each portion into a loose dome or haystack shape. The macaroons do not need to appear perfectly uniform.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-8"}, {"@type": "HowToStep", "text": "Bake for 20–25 minutes, or until the lower edges are golden and the exposed coconut tips begin to brown.", "name": "Bake for 20–25 minutes, or until the lower edges are golden and the exposed coconut tips begin to brown.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-9"}, {"@type": "HowToStep", "text": "Remove the baking sheet from the oven as soon as the macaroons are properly colored to prevent them from becoming dry.", "name": "Remove the baking sheet from the oven as soon as the macaroons are properly colored to prevent them from becoming dry.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-10"}, {"@type": "HowToStep", "text": "Leave the baked macaroons undisturbed on the baking sheet until they have cooled completely.", "name": "Leave the baked macaroons undisturbed on the baking sheet until they have cooled completely.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-11"}, {"@type": "HowToStep", "text": "Do not attempt to move them while warm, as their delicate structure may cause them to crumble. Once fully cooled, they will be considerably easier to handle.", "name": "Do not attempt to move them while warm, as their delicate structure may cause them to crumble. Once fully cooled, they will be considerably easier to handle.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-12"}, {"@type": "HowToStep", "text": "Arrange the cooled macaroons on a flat surface lined with parchment paper.", "name": "Arrange the cooled macaroons on a flat surface lined with parchment paper.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-13"}, {"@type": "HowToStep", "text": "Place 9 ounces of the dark chocolate in a microwave-safe bowl. Heat at 50 percent power for 1 minute, then stir thoroughly.", "name": "Place 9 ounces of the dark chocolate in a microwave-safe bowl. Heat at 50 percent power for 1 minute, then stir thoroughly.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-14"}, {"@type": "HowToStep", "text": "Continue microwaving the chocolate in 15-second intervals, stirring after each interval, until it is completely melted and smooth.", "name": "Continue microwaving the chocolate in 15-second intervals, stirring after each interval, until it is completely melted and smooth.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-15"}, {"@type": "HowToStep", "text": "Dip the bottom of each macaroon into the melted chocolate, allowing the coating to extend approximately 1/4 inch up the sides.", "name": "Dip the bottom of each macaroon into the melted chocolate, allowing the coating to extend approximately 1/4 inch up the sides.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-16"}, {"@type": "HowToStep", "text": "Hold each macaroon over the bowl briefly so the surplus chocolate can fall away. A fork may be used to guide off excess chocolate and create a cleaner finish.", "name": "Hold each macaroon over the bowl briefly so the surplus chocolate can fall away. A fork may be used to guide off excess chocolate and create a cleaner finish.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-17"}, {"@type": "HowToStep", "text": "Return the dipped macaroons to the parchment-lined surface and repeat until every macaroon has been coated.", "name": "Return the dipped macaroons to the parchment-lined surface and repeat until every macaroon has been coated.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-18"}, {"@type": "HowToStep", "text": "Melt the remaining 4 ounces of dark chocolate until smooth.", "name": "Melt the remaining 4 ounces of dark chocolate until smooth.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-19"}, {"@type": "HowToStep", "text": "Spoon the melted chocolate into a small resealable plastic bag. Press the chocolate toward one corner, seal the bag, and carefully trim a very small opening from the tip of that corner.", "name": "Spoon the melted chocolate into a small resealable plastic bag. Press the chocolate toward one corner, seal the bag, and carefully trim a very small opening from the tip of that corner.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-20"}, {"@type": "HowToStep", "text": "Pipe the chocolate over the macaroons in a zigzag pattern.", "name": "Pipe the chocolate over the macaroons in a zigzag pattern.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-21"}, {"@type": "HowToStep", "text": "Leave the macaroons undisturbed until the chocolate has hardened completely. To shorten the setting period, place the tray in the refrigerator.", "name": "Leave the macaroons undisturbed until the chocolate has hardened completely. To shorten the setting period, place the tray in the refrigerator.", "url": "https://erecip.github.io/en/passover-coconut-macaroons/#wprm-recipe-41040-step-0-22"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["Jewesh"], "keywords": "Passover Coconut Macaroons"}</script>
