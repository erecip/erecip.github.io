    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Caramel Stuffed Apple Cider Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, warmly spiced apple cider cookies surround a rich caramel center and are finished with a cinnamon-sugar coating. Reducing the cider intensifies its apple flavor, while chilling the filled dough helps the cookies retain their shape during baking.", "datePublished": "2020-08-09T05:47:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/caramel-stuffed-apple-cider-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/caramel-stuffed-apple-cider-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/caramel-stuffed-apple-cider-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/caramel-stuffed-apple-cider-cookies.png"], "prepTime": "PT25M", "cookTime": "PT15M", "totalTime": "PT60M", "recipeIngredient": ["¾ cup apple cider", "1  large egg", "1 teaspoon pure vanilla extract", "⅔ cup firmly packed dark brown sugar", "¼ teaspoon fine salt", "1½ cups all-purpose flour (preferably King Arthur)", "½ teaspoon baking soda", "1 teaspoon ground cinnamon", "1  stick unsalted butter (softened to approximately 70°F)", "¼ teaspoon baking powder", "½ teaspoon pumpkin pie spice", "12  individually unwrapped caramel candies", "2 tablespoons granulated white sugar", "2 teaspoons ground cinnamon"], "recipeInstructions": [{"@type": "HowToStep", "text": "Pour the apple cider into a small saucepan and bring it to a gentle boil over medium-high heat. Continue cooking, stirring from time to time, until the liquid has reduced to 2 tablespoons.", "name": "Pour the apple cider into a small saucepan and bring it to a gentle boil over medium-high heat. Continue cooking, stirring from time to time, until the liquid has reduced to 2 tablespoons.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the concentrated cider to a small bowl and set it aside to cool. This reduction process strengthens the apple flavor without adding excess liquid to the dough.", "name": "Transfer the concentrated cider to a small bowl and set it aside to cool. This reduction process strengthens the apple flavor without adding excess liquid to the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-1"}, {"@type": "HowToStep", "text": "While the reduced cider cools, place the flour, 1 teaspoon ground cinnamon, pumpkin pie spice, baking soda, baking powder, and salt in a medium bowl.", "name": "While the reduced cider cools, place the flour, 1 teaspoon ground cinnamon, pumpkin pie spice, baking soda, baking powder, and salt in a medium bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-2"}, {"@type": "HowToStep", "text": "Whisk until the ingredients are evenly distributed, then reserve the mixture for the cookie dough.", "name": "Whisk until the ingredients are evenly distributed, then reserve the mixture for the cookie dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-3"}, {"@type": "HowToStep", "text": "Fit a stand mixer with the paddle attachment. Add the softened butter and packed dark brown sugar to the mixer bowl, then beat until pale, light, and fluffy.", "name": "Fit a stand mixer with the paddle attachment. Add the softened butter and packed dark brown sugar to the mixer bowl, then beat until pale, light, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-4"}, {"@type": "HowToStep", "text": "Add the egg, cooled cider reduction, and vanilla extract. Continue mixing until thoroughly incorporated.", "name": "Add the egg, cooled cider reduction, and vanilla extract. Continue mixing until thoroughly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-5"}, {"@type": "HowToStep", "text": "Turn the mixer to low speed. Gradually add the prepared dry mixture and blend just until a soft, uniform dough forms.", "name": "Turn the mixer to low speed. Gradually add the prepared dry mixture and blend just until a soft, uniform dough forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-6"}, {"@type": "HowToStep", "text": "Line a baking sheet with parchment paper or a silicone baking mat.", "name": "Line a baking sheet with parchment paper or a silicone baking mat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-7"}, {"@type": "HowToStep", "text": "Combine the granulated sugar and the remaining 2 teaspoons of cinnamon in a small bowl to prepare the coating.", "name": "Combine the granulated sugar and the remaining 2 teaspoons of cinnamon in a small bowl to prepare the coating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-8"}, {"@type": "HowToStep", "text": "Using a 1½-inch cookie scoop, portion out two scoops of dough and press them together. Shape the dough into a ball, then gently flatten it into a disc.", "name": "Using a 1½-inch cookie scoop, portion out two scoops of dough and press them together. Shape the dough into a ball, then gently flatten it into a disc.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-9"}, {"@type": "HowToStep", "text": "Set one unwrapped caramel candy in the middle. Fold the dough around the candy, pinch the edges closed, and carefully roll it into a smooth ball so the caramel is completely sealed inside.", "name": "Set one unwrapped caramel candy in the middle. Fold the dough around the candy, pinch the edges closed, and carefully roll it into a smooth ball so the caramel is completely sealed inside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-10"}, {"@type": "HowToStep", "text": "Coat the filled dough ball in the cinnamon-sugar mixture and arrange it on the lined baking sheet. Repeat until all 12 cookies have been assembled.", "name": "Coat the filled dough ball in the cinnamon-sugar mixture and arrange it on the lined baking sheet. Repeat until all 12 cookies have been assembled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-11"}, {"@type": "HowToStep", "text": "Place the baking sheet in the freezer for 20 minutes. Chilling firms the dough, limits excessive spreading, and helps keep the caramel enclosed.", "name": "Place the baking sheet in the freezer for 20 minutes. Chilling firms the dough, limits excessive spreading, and helps keep the caramel enclosed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-12"}, {"@type": "HowToStep", "text": "After the chilling period, preheat the oven to 350°F (175°C).", "name": "After the chilling period, preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-13"}, {"@type": "HowToStep", "text": "Bake the cookies for approximately 15 minutes. They should spread slightly and develop lightly golden edges while remaining soft across the tops.", "name": "Bake the cookies for approximately 15 minutes. They should spread slightly and develop lightly golden edges while remaining soft across the tops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-14"}, {"@type": "HowToStep", "text": "Leave the baked cookies on the baking sheet for 6–8 minutes. Carefully transfer them to a wire rack and allow them to cool completely.", "name": "Leave the baked cookies on the baking sheet for 6–8 minutes. Carefully transfer them to a wire rack and allow them to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-stuffed-apple-cider-cookies/#wprm-recipe-41053-step-0-15"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Caramel Stuffed Apple Cider Cookies"}</script>
