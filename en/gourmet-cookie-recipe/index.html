le attachment, cream together the butter and granulated sugar for approximately 2–3 minutes until light and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gourmet-cookie-recipe/#wprm-recipe-15632-step-0-1"}, {"@type": "HowToStep", "text": "Add in the eggs and vanilla extract, mixing thoroughly and scraping down the sides and base of the bowl as needed.", "name": "Add in the eggs and vanilla extract, mixing thoroughly and scraping down the sides and base of the bowl as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gourmet-cookie-recipe/#wprm-recipe-15632-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk together the cake flour, baking powder, baking soda, and salt until evenly combined.", "name": "In a separate bowl, whisk together the cake flour, baking powder, baking soda, and salt until evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gourmet-cookie-recipe/#wprm-recipe-15632-step-0-3"}, {"@type": "HowToStep", "text": "Gradually add the dry mixture to the creamed mixture, stirring in about a cup at a time until the dough comes together smoothly. Ensure the sides and bottom of the bowl are fully scraped down so no dry pockets remain; the dough will feel slightly tacky.", "name": "Gradually add the dry mixture to the creamed mixture, stirring in about a cup at a time until the dough comes together smoothly. Ensure the sides and bottom of the bowl are fully scraped down so no dry pockets remain; the dough will feel slightly tacky.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gourmet-cookie-recipe/#wprm-recipe-15632-step-0-4"}, {"@type": "HowToStep", "text": "Portion the dough into 3-Tablespoon (60g) mounds, rolling each into a smooth ball between your palms. Coat each dough ball completely in coarse sugar before placing it onto the prepared baking sheet, leaving at least 2 inches (5 cm) of space between cookies.", "name": "Portion the dough into 3-Tablespoon (60g) mounds, rolling each into a smooth ball between your palms. Coat each dough ball completely in coarse sugar before placing it onto the prepared baking sheet, leaving at least 2 inches (5 cm) of space between cookies.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gourmet-cookie-recipe/#wprm-recipe-15632-step-0-5"}, {"@type": "HowToStep", "text": "Position the baking sheet on the center rack and bake for 11–13 minutes. The cookies should remain pale with minimal browning on the edges. Once baked, allow them to cool fully on the baking sheet. For best results, test-bake one or two cookies first—flip them over to ensure the base is just faintly colored but not golden brown, adjusting your bake time if needed.", "name": "Position the baking sheet on the center rack and bake for 11–13 minutes. The cookies should remain pale with minimal browning on the edges. Once baked, allow them to cool fully on the baking sheet. For best results, test-bake one or two cookies first—flip them over to ensure the base is just faintly colored but not golden brown, adjusting your bake time if needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gourmet-cookie-recipe/#wprm-recipe-15632-step-0-6"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Gourmet Cookie Recipe"}</script>
