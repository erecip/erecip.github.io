    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "mushroom stuffed chicken breast", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender boneless chicken breasts are cut with pockets, filled with golden mushrooms, wilted baby spinach, garlic, thyme, and mozzarella, then seared until browned and finished in the oven for a savory main course.", "datePublished": "2023-10-04T15:27:25+00:00", "image": ["https://erecip.github.io/en/mushroom-stuffed-chicken-breast/Mushroom-Stuffed-Chicken-Breast2.png", "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/Mushroom-Stuffed-Chicken-Breast2.png", "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/Mushroom-Stuffed-Chicken-Breast2.png", "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/Mushroom-Stuffed-Chicken-Breast2.png"], "prepTime": "PT15M", "cookTime": "PT25M", "totalTime": "PT45M", "recipeIngredient": ["3 oz low-moisture part-skim mozzarella (cut into slices)", "2  boneless (skinless chicken breasts, about 7 oz each)", "2 cups fresh baby spinach (steamed and thoroughly squeezed dry)", "1 tablespoon olive oil (or another neutral cooking oil such as canola)", "7 oz mushrooms (sliced thinly)", "1/4 teaspoon ground black pepper", "2 tablespoons unsalted butter", "2 cloves fresh garlic (finely minced)", "3/4 teaspoon salt", "1/2 teaspoon thyme leaves"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 200°C/390°F, or 180°C if using a fan-forced oven.", "name": "Preheat the oven to 200°C/390°F, or 180°C if using a fan-forced oven.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-0"}, {"@type": "HowToStep", "text": "Place each chicken breast on a cutting board and carefully slice a pocket into the side, choosing the folded edge so the smoother side remains intact. Do not cut all the way through.", "name": "Place each chicken breast on a cutting board and carefully slice a pocket into the side, choosing the folded edge so the smoother side remains intact. Do not cut all the way through.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-1"}, {"@type": "HowToStep", "text": "Season the inside and outside of the chicken breasts with part of the salt and pepper, reserving the remainder for the mushroom filling.", "name": "Season the inside and outside of the chicken breasts with part of the salt and pepper, reserving the remainder for the mushroom filling.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-2"}, {"@type": "HowToStep", "text": "Melt the unsalted butter in a heavy-based, oven-safe skillet over high heat.", "name": "Melt the unsalted butter in a heavy-based, oven-safe skillet over high heat.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-3"}, {"@type": "HowToStep", "text": "Add the sliced mushrooms and cook for about 3 minutes, stirring as needed, until they begin to take on a light golden color.", "name": "Add the sliced mushrooms and cook for about 3 minutes, stirring as needed, until they begin to take on a light golden color.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-4"}, {"@type": "HowToStep", "text": "Stir in the minced garlic, thyme leaves, and the remaining salt and pepper. Continue cooking for another 2 minutes, or until the mushrooms are richly golden.", "name": "Stir in the minced garlic, thyme leaves, and the remaining salt and pepper. Continue cooking for another 2 minutes, or until the mushrooms are richly golden.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-5"}, {"@type": "HowToStep", "text": "Add the baby spinach and stir briefly until wilted, about 30 seconds.", "name": "Add the baby spinach and stir briefly until wilted, about 30 seconds.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-6"}, {"@type": "HowToStep", "text": "Spoon the mushroom and spinach mixture into the pocket of each chicken breast.", "name": "Spoon the mushroom and spinach mixture into the pocket of each chicken breast.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-7"}, {"@type": "HowToStep", "text": "Place the mozzarella slices over the filling inside each chicken breast.", "name": "Place the mozzarella slices over the filling inside each chicken breast.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-8"}, {"@type": "HowToStep", "text": "Secure the openings with toothpicks as well as possible. The pockets do not need to be sealed perfectly; mostly closed is enough for cooking.", "name": "Secure the openings with toothpicks as well as possible. The pockets do not need to be sealed perfectly; mostly closed is enough for cooking.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-9"}, {"@type": "HowToStep", "text": "Wipe the skillet clean with paper towels.", "name": "Wipe the skillet clean with paper towels.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-10"}, {"@type": "HowToStep", "text": "Add the olive oil to the skillet and warm it over medium-high heat.", "name": "Add the olive oil to the skillet and warm it over medium-high heat.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-11"}, {"@type": "HowToStep", "text": "Sear the stuffed chicken breasts for about 1 1/2 minutes per side, or until the exterior turns nicely golden.", "name": "Sear the stuffed chicken breasts for about 1 1/2 minutes per side, or until the exterior turns nicely golden.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the skillet with the seared chicken breasts to the preheated oven.", "name": "Transfer the skillet with the seared chicken breasts to the preheated oven.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-13"}, {"@type": "HowToStep", "text": "Bake for about 15 minutes, or until the internal temperature of the chicken meat reaches 65°C/149°F. Measure the chicken flesh rather than the mushroom filling for accuracy.", "name": "Bake for about 15 minutes, or until the internal temperature of the chicken meat reaches 65°C/149°F. Measure the chicken flesh rather than the mushroom filling for accuracy.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-14"}, {"@type": "HowToStep", "text": "Remove the chicken from the oven and transfer it to a plate.", "name": "Remove the chicken from the oven and transfer it to a plate.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-15"}, {"@type": "HowToStep", "text": "Cover loosely with foil and allow the chicken to rest for 5 minutes before serving.", "name": "Cover loosely with foil and allow the chicken to rest for 5 minutes before serving.", "url": "https://erecip.github.io/en/mushroom-stuffed-chicken-breast/#wprm-recipe-38823-step-0-16"}], "recipeCategory": ["Main Course"], "keywords": "mushroom stuffed chicken breast"}</script>
