    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Scalloped Potatoes and Pork Chops", "author": {"@type": "Person", "name": "BenDes"}, "description": "A comforting oven-baked main dish featuring thin layers of potatoes and onion enriched with milk, butter, and flour, then topped with seasoned bone-in pork chops. The casserole is baked in stages until the potatoes are tender and bubbling, the pork is very tender, and the edges develop a lightly browned finish.", "datePublished": "2020-10-29T05:51:25+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/scalloped-potatoes-and-pork-chops2.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/scalloped-potatoes-and-pork-chops2-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/scalloped-potatoes-and-pork-chops2-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/scalloped-potatoes-and-pork-chops2-480x270.png"], "totalTime": "PT90M", "recipeIngredient": ["8  medium Yukon Gold or similar potatoes (cut into thin slices approximately 1/8 inch thick; peel if desired)", "6 tablespoons all-purpose flour", "1/2 cup finely diced onion", "2 cups milk; whole milk may be used for a richer sauce", "6 tablespoons unsalted butter (divided and cut into small pats)", "Salt (as needed)", "Ground black pepper (as needed)", "6  bone-in pork chops (approximately 1 inch thick)", "Salt (to taste)", "Ground black pepper (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 350°F (175°C). Use approximately 1/2 tablespoon of the measured butter to thoroughly grease a 9 x 13-inch baking pan.", "name": "Heat the oven to 350°F (175°C). Use approximately 1/2 tablespoon of the measured butter to thoroughly grease a 9 x 13-inch baking pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-0"}, {"@type": "HowToStep", "text": "Arrange half of the thinly sliced potatoes in an even layer across the bottom of the prepared baking dish.", "name": "Arrange half of the thinly sliced potatoes in an even layer across the bottom of the prepared baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-1"}, {"@type": "HowToStep", "text": "Distribute half of the flour and half of the finely diced onion over the potatoes. Dot the surface with half of the remaining 5 1/2 tablespoons of butter, then season with salt and black pepper according to taste.", "name": "Distribute half of the flour and half of the finely diced onion over the potatoes. Dot the surface with half of the remaining 5 1/2 tablespoons of butter, then season with salt and black pepper according to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-2"}, {"@type": "HowToStep", "text": "Create a second layer using the remaining potatoes, flour, onion, and butter. Season once more with salt and pepper.", "name": "Create a second layer using the remaining potatoes, flour, onion, and butter. Season once more with salt and pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-3"}, {"@type": "HowToStep", "text": "Pour the 2 cups of milk evenly over the assembled potato mixture.", "name": "Pour the 2 cups of milk evenly over the assembled potato mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-4"}, {"@type": "HowToStep", "text": "Cover the baking dish securely with aluminum foil. Transfer it to the preheated oven and bake for 30 minutes, allowing the potatoes to begin softening.", "name": "Cover the baking dish securely with aluminum foil. Transfer it to the preheated oven and bake for 30 minutes, allowing the potatoes to begin softening.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-5"}, {"@type": "HowToStep", "text": "While the potatoes are baking, season all six pork chops on both sides with salt and black pepper. Allow them to come toward room temperature while the potatoes complete their initial baking period.", "name": "While the potatoes are baking, season all six pork chops on both sides with salt and black pepper. Allow them to come toward room temperature while the potatoes complete their initial baking period.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-6"}, {"@type": "HowToStep", "text": "After 30 minutes, remove the baking dish from the oven. Carefully stir the potato mixture to redistribute the ingredients and encourage even cooking.", "name": "After 30 minutes, remove the baking dish from the oven. Carefully stir the potato mixture to redistribute the ingredients and encourage even cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-7"}, {"@type": "HowToStep", "text": "Place the seasoned pork chops in a single layer over the partially cooked potatoes.", "name": "Place the seasoned pork chops in a single layer over the partially cooked potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-8"}, {"@type": "HowToStep", "text": "Cover the baking dish again with foil and return it to the oven. Bake for another 30 minutes.", "name": "Cover the baking dish again with foil and return it to the oven. Bake for another 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-9"}, {"@type": "HowToStep", "text": "Remove the foil and continue baking for an additional 30 to 45 minutes.", "name": "Remove the foil and continue baking for an additional 30 to 45 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-10"}, {"@type": "HowToStep", "text": "The dish is ready when the pork chops are very tender, the potato mixture is hot and bubbling, and the potatoes around the edges are beginning to turn golden brown.", "name": "The dish is ready when the pork chops are very tender, the potato mixture is hot and bubbling, and the potatoes around the edges are beginning to turn golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-and-pork-chops/#wprm-recipe-41183-step-0-11"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Scalloped Potatoes and Pork Chops"}</script>
