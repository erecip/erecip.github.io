    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Whole Wheat Sandwich Bread Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A wholesome and tender loaf, perfect for daily sandwiches and toasting.", "datePublished": "2024-10-11T18:26:14+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/whole-wheat-sandwich-bread-recipe/Whole-Wheat-Sandwich-Bread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/whole-wheat-sandwich-bread-recipe/Whole-Wheat-Sandwich-Bread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/whole-wheat-sandwich-bread-recipe/Whole-Wheat-Sandwich-Bread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/whole-wheat-sandwich-bread-recipe/Whole-Wheat-Sandwich-Bread-Recipe.png"], "recipeYield": ["2", "2 Loaves"], "recipeIngredient": ["2 tablespoons canola oil", "2 teaspoons active dry yeast", "1 tablespoon salt", "2 3/4 cups 13 3/4 oz all-purpose flour, plus extra for kneading", "2 3/4 cups 13 3/4 oz whole wheat flour", "1/4 cup 3 oz honey", "1 cup 8 oz milk — whole, 2%, or skim", "1 1/4 cups 10 oz warm (not hot) water"], "recipeInstructions": [{"@type": "HowToStep", "text": "Pour the warm water into the bowl of a stand mixer and sprinkle the yeast over it, allowing it to sit until the yeast dissolves. Stir in the milk, honey, and canola oil until well combined. Incorporate two cups of the all-purpose flour along with the salt, stirring to form a cohesive mixture. Add the remaining all-purpose flour and the whole wheat flour, then stir until a rough dough comes together. Leave the dough to rest for 20 minutes, permitting the flour to fully hydrate. Using a stand mixer fitted with a dough hook, knead for 8–9 minutes, or knead by hand on a lightly floured surface until the dough is smooth, supple, and springs back when gently pressed. If excessively sticky, add more flour gradually, one tablespoon at a time. Clean the mixing bowl and lightly oil it, shaping the dough into a ball and turning it to coat with oil. Cover and allow to rise in a warm place until noticeably puffed and nearly doubled, about 1 to 1 1/2 hours. Dust the counter with flour, transfer the dough, and divide it evenly in half. Shape each portion into a loose ball and let them rest for 10 minutes. Grease two 8x4-inch or 8 1/2 x 4 1/2-inch loaf pans. Shape each dough ball into a taut loaf and place into the prepared pans, ensuring the surface is smooth and tight to encourage a good rise. Leave the loaves to rise a second time until they dome just above the rims of the pans, approximately 30–40 minutes. Midway through the final rise, preheat the oven to 425°F. With a serrated knife, gently slash the tops of the loaves, then place them in the oven, immediately lowering the temperature to 375°F. Bake for 30–35 minutes until the crust is deep golden and the loaves sound hollow when tapped underneath. Remove from the pans and cool completely on a wire rack before slicing.", "name": "Pour the warm water into the bowl of a stand mixer and sprinkle the yeast over it, allowing it to sit until the yeast dissolves. Stir in the milk, honey, and canola oil until well combined. Incorporate two cups of the all-purpose flour along with the salt, stirring to form a cohesive mixture. Add the remaining all-purpose flour and the whole wheat flour, then stir until a rough dough comes together. Leave the dough to rest for 20 minutes, permitting the flour to fully hydrate. Using a stand mixer fitted with a dough hook, knead for 8–9 minutes, or knead by hand on a lightly floured surface until the dough is smooth, supple, and springs back when gently pressed. If excessively sticky, add more flour gradually, one tablespoon at a time. Clean the mixing bowl and lightly oil it, shaping the dough into a ball and turning it to coat with oil. Cover and allow to rise in a warm place until noticeably puffed and nearly doubled, about 1 to 1 1/2 hours. Dust the counter with flour, transfer the dough, and divide it evenly in half. Shape each portion into a loose ball and let them rest for 10 minutes. Grease two 8x4-inch or 8 1/2 x 4 1/2-inch loaf pans. Shape each dough ball into a taut loaf and place into the prepared pans, ensuring the surface is smooth and tight to encourage a good rise. Leave the loaves to rise a second time until they dome just above the rims of the pans, approximately 30–40 minutes. Midway through the final rise, preheat the oven to 425°F. With a serrated knife, gently slash the tops of the loaves, then place them in the oven, immediately lowering the temperature to 375°F. Bake for 30–35 minutes until the crust is deep golden and the loaves sound hollow when tapped underneath. Remove from the pans and cool completely on a wire rack before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/whole-wheat-sandwich-bread-recipe/#wprm-recipe-50134-step-0-0"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Whole Wheat Sandwich Bread Recipe"}</script>
