eces, then season them lightly with salt and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-divan-casserole-recipe/#wprm-recipe-44662-step-0-0"}, {"@type": "HowToStep", "text": "Cook the chicken and vegetables. Melt 2 tablespoons of butter in a large Dutch oven or sturdy pot over medium heat. Add the chicken pieces, diced onion, and chopped celery. Toss everything in the melted butter and sauté for about 3 minutes, until the chicken is approximately halfway cooked.", "name": "Cook the chicken and vegetables. Melt 2 tablespoons of butter in a large Dutch oven or sturdy pot over medium heat. Add the chicken pieces, diced onion, and chopped celery. Toss everything in the melted butter and sauté for about 3 minutes, until the chicken is approximately halfway cooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-divan-casserole-recipe/#wprm-recipe-44662-step-0-1"}, {"@type": "HowToStep", "text": "Add the broccoli. Place the broccoli florets into the pot and drizzle in 1 tablespoon of olive oil. Continue cooking for another 3–5 minutes, or until the chicken has cooked completely through. Remove the pot from the heat.", "name": "Add the broccoli. Place the broccoli florets into the pot and drizzle in 1 tablespoon of olive oil. Continue cooking for another 3–5 minutes, or until the chicken has cooked completely through. Remove the pot from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-divan-casserole-recipe/#wprm-recipe-44662-step-0-2"}, {"@type": "HowToStep", "text": "Assemble the creamy filling. Add the cream of chicken soup, sour cream, milk, garlic powder, onion powder, mustard powder, and half of the shredded cheddar cheese to the chicken and vegetables. Stir thoroughly until the ingredients are evenly incorporated.", "name": "Assemble the creamy filling. Add the cream of chicken soup, sour cream, milk, garlic powder, onion powder, mustard powder, and half of the shredded ep-0-6"}, {"@type": "HowToStep", "text": "Finish baking. Sprinkle the buttered cracker crumbs evenly over the casserole. Return the uncovered dish to the oven and bake for another 8–10 minutes, until the topping develops a golden-brown finish.", "name": "Finish baking. Sprinkle the buttered cracker crumbs evenly over the casserole. Return the uncovered dish to the oven and bake for another 8–10 minutes, until the topping develops a golden-brown finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-divan-casserole-recipe/#wprm-recipe-44662-step-0-7"}, {"@type": "HowToStep", "text": "Rest before serving. Remove the casserole from the oven and allow it to stand for 5 minutes so the filling can settle. Serve hot with rice, biscuits, or mashed potatoes.", "name": "Rest before serving. Remove the casserole from the oven and allow it to stand for 5 minutes so the filling can settle. Serve hot with rice, biscuits, or mashed potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-divan-casserole-recipe/#wprm-recipe-44662-step-0-8"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["American"], "keywords": "Chicken Divan Casserole Recipe"}</script>
