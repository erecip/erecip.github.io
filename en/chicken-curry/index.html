    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Curry", "author": {"@type": "Person", "name": "BenDes"}, "description": "A luscious and aromatic Indian chicken curry featuring tender pieces of marinated chicken in a velvety, spiced sauce enriched with yogurt and cream. This dish is best enjoyed with a side of basmati rice or warm naan to soak up every drop of its richly flavored gravy.", "datePublished": "2023-01-03T01:29:18+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/chicken-curry-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/chicken-curry-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/chicken-curry-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/chicken-curry-1.jpg"], "recipeYield": ["4"], "prepTime": "PT35M", "cookTime": "PT30M", "totalTime": "PT65M", "recipeIngredient": ["1 ½ pounds boneless (skinless chicken thighs or breast)", "1  medium onion (roughly chopped)", "3 tablespoons vegetable oil or ghee", "3 tablespoons heavy cream", "1 teaspoon Garam Masala", "2 tablespoons tomato paste", "1 ½ teaspoons fine sea salt (divided)", "1/2 teaspoon ground turmeric (divided)", "3/4 teaspoon ground coriander (divided)", "6  medium garlic cloves (peeled)", "1- inch piece of fresh ginger (peeled)", "1 teaspoon ground cumin (divided)", "1/4 teaspoon freshly ground black pepper", "1 ½ cups water (divided)", "4 tablespoons full-fat plain unsweetened yogurt", "1/8 to 1/4 teaspoon cayenne pepper (optional)", "Handful of chopped fresh cilantro leaves (for garnish (optional))"], "recipeInstructions": [{"@type": "HowToStep", "text": "Cut the chicken into bite-sized pieces, approximately 1 inch in size. Alternatively, if using bone-in chicken, it may be left whole.", "name": "Cut the chicken into bite-sized pieces, approximately 1 inch in size. Alternatively, if using bone-in chicken, it may be left whole.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/#wprm-recipe-31045-step-0-0"}, {"@type": "HowToStep", "text": "Place the chicken into a bowl and sprinkle with ½ teaspoon salt, ½ teaspoon ground cumin, ¼ teaspoon ground coriander, ¼ teaspoon ground turmeric, black pepper, and cayenne pepper if using. Toss thoroughly to coat the chicken in the spices. Set aside to marinate for a minimum of 20 minutes. If preparing ahead, cover and refrigerate for up to 24 hours.", "name": "Place the chicken into a bowl and sprinkle with ½ teaspoon salt, ½ teaspoon ground cumin, ¼ teaspoon ground coriander, ¼ teaspoon ground turmeric, black pepper, and cayenne pepper if using. Toss thoroughly to coat the chicken in the spices. Set aside to marinate for a minimum of 20 minutes. If preparing ahead, cover and refrigerate for up to 24 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/#wprm-recipe-31045-step-0-1"}, {"@type": "HowToStep", "text": "In a blender or food processor, combine the garlic cloves, ginger, chopped onion, and ½ cup of water. Process until the mixture is mostly smooth. An immersion blender with a cup attachment may also be used.", "name": "In a blender or food processor, combine the garlic cloves, ginger, chopped onion, and ½ cup of water. Process until the mixture is mostly smooth. An immersion blender with a cup attachment may also be used.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/#wprm-recipe-31045-step-0-2"}, {"@type": "HowToStep", "text": "Heat the oil or ghee in a wide, lidded skillet over medium-high heat. Arrange the marinated chicken pieces in a single layer and brown on both sides, about 2 to 3 minutes per side. Once browned, remove the chicken and set it aside. Leave the skillet on the heat.", "name": "Heat the oil or ghee in a wide, lidded skillet over medium-high heat. Arrange the marinated chicken pieces in a single layer and brown on both sides, about 2 to 3 minutes per side. Once browned, remove the chicken and set it aside. Leave the skillet on the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/#wprm-recipe-31045-step-0-3"}, {"@type": "HowToStep", "text": "Pour the blended onion-ginger mixture into the hot skillet. Cook, stirring regularly, until the liquid evaporates, approximately 5 minutes.", "name": "Pour the blended onion-ginger mixture into the hot skillet. Cook, stirring regularly, until the liquid evaporates, approximately 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/#wprm-recipe-31045-step-0-4"}, {"@type": "HowToStep", "text": "Sprinkle in the remaining ½ teaspoon ground cumin, ½ teaspoon ground coriander, and ¼ teaspoon ground turmeric. Stir and let cook for about 20 seconds until fragrant. Add the tomato paste and reduce the heat to medium-low. Stir and cook for an additional minute.", "name": "Sprinkle in the remaining ½ teaspoon ground cumin, ½ teaspoon ground coriander, and ¼ teaspoon ground turmeric. Stir and let cook for about 20 seconds until fragrant. Add the tomato paste and reduce the heat to medium-low. Stir and cook for an additional minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/#wprm-recipe-31045-step-0-5"}, {"@type": "HowToStep", "text": "Begin incorporating the yogurt, one tablespoon at a time, stirring thoroughly after each addition to prevent curdling.", "name": "Begin incorporating the yogurt, one tablespoon at a time, stirring thoroughly after each addition to prevent curdling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/#wprm-recipe-31045-step-0-6"}, {"@type": "HowToStep", "text": "Return the chicken and any accumulated juices to the skillet. Pour in the remaining 1 cup of water along with ¾ teaspoon salt. Bring to a gentle boil, then reduce the heat to low, cover with a lid, and simmer for 20 minutes.", "name": "Return the chicken and any accumulated juices to the skillet. Pour in the remaining 1 cup of water along with ¾ teaspoon salt. Bring to a gentle boil, then reduce the heat to low, cover with a lid, and simmer for 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/#wprm-recipe-31045-step-0-7"}, {"@type": "HowToStep", "text": "Uncover the skillet and stir in the Garam Masala and heavy cream. Taste the sauce and adjust the seasoning by adding the final ¼ teaspoon of salt if needed. Increase the heat to medium-high and cook, stirring occasionally, until the sauce has thickened and reduced, about 3 to 5 minutes.", "name": "Uncover the skillet and stir in the Garam Masala and heavy cream. Taste the sauce and adjust the seasoning by adding the final ¼ teaspoon of salt if needed. Increase the heat to medium-high and cook, stirring occasionally, until the sauce has thickened and reduced, about 3 to 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/#wprm-recipe-31045-step-0-8"}, {"@type": "HowToStep", "text": "Garnish with chopped cilantro leaves if desired, and serve immediately.", "name": "Garnish with chopped cilantro leaves if desired, and serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-curry/#wprm-recipe-31045-step-0-9"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Indian"], "keywords": "chicken curry"}</script>
