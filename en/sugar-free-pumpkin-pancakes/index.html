    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sugar-Free Pumpkin Pancakes", "author": {"@type": "Person", "name": "BenDes"}, "description": "These soft, warmly spiced pumpkin pancakes are sweetened with honey and applesauce rather than refined sugar. Pumpkin purée, cinnamon, and pumpkin pie spice create a rich autumn flavor, while almond milk keeps the batter light and tender.", "datePublished": "2021-08-19T09:30:03+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/sugar-free-pumpkin-pancakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/sugar-free-pumpkin-pancakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/sugar-free-pumpkin-pancakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/sugar-free-pumpkin-pancakes2.png"], "prepTime": "PT10M", "cookTime": "PT4M", "totalTime": "PT19M", "recipeIngredient": ["2 teaspoons baking powder", "2 teaspoons ground cinnamon", "½ teaspoon fine salt", "2 cups all-purpose flour (such as King Arthur)", "2 teaspoons pumpkin pie spice (preferably freshly ground)", "6 tablespoons canned pumpkin purée (such as Libby’s)", "2 teaspoons pure vanilla extract", "¼ cup honey", "2  large eggs (brought to room temperature)", "½ cup unsweetened applesauce", "1½ cups unsweetened almond milk"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the all-purpose flour, baking powder, salt, pumpkin pie spice, and ground cinnamon in a large mixing bowl. Whisk thoroughly, breaking apart any spice clumps and distributing the seasonings evenly throughout the flour. Set the bowl aside.", "name": "Place the all-purpose flour, baking powder, salt, pumpkin pie spice, and ground cinnamon in a large mixing bowl. Whisk thoroughly, breaking apart any spice clumps and distributing the seasonings evenly throughout the flour. Set the bowl aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/#wprm-recipe-40853-step-0-0"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the eggs, almond milk, pumpkin purée, applesauce, vanilla extract, and honey until the mixture appears smooth and evenly blended. Ensure that the honey and applesauce are fully incorporated.", "name": "In a separate bowl, whisk the eggs, almond milk, pumpkin purée, applesauce, vanilla extract, and honey until the mixture appears smooth and evenly blended. Ensure that the honey and applesauce are fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/#wprm-recipe-40853-step-0-1"}, {"@type": "HowToStep", "text": "Pour the wet mixture into the bowl containing the dry ingredients. Stir gently only until the ingredients come together. A few small lumps should remain, as excessive mixing may develop the gluten and produce firm pancakes.", "name": "Pour the wet mixture into the bowl containing the dry ingredients. Stir gently only until the ingredients come together. A few small lumps should remain, as excessive mixing may develop the gluten and produce firm pancakes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/#wprm-recipe-40853-step-0-2"}, {"@type": "HowToStep", "text": "Allow the prepared batter to stand for 5 minutes so the flour can absorb the liquid and the pancakes can develop a lighter texture.", "name": "Allow the prepared batter to stand for 5 minutes so the flour can absorb the liquid and the pancakes can develop a lighter texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/#wprm-recipe-40853-step-0-3"}, {"@type": "HowToStep", "text": "Preheat a large skillet or griddle over medium heat. When using an electric griddle, set the temperature to approximately 350°F. The surface is ready when a drop of water sizzles upon contact.", "name": "Preheat a large skillet or griddle over medium heat. When using an electric griddle, set the temperature to approximately 350°F. The surface is ready when a drop of water sizzles upon contact.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/#wprm-recipe-40853-step-0-4"}, {"@type": "HowToStep", "text": "Lightly coat the cooking surface with oil or butter. For each pancake, ladle approximately ⅓ cup of batter onto the heated surface, leaving enough room between portions for easy turning.", "name": "Lightly coat the cooking surface with oil or butter. For each pancake, ladle approximately ⅓ cup of batter onto the heated surface, leaving enough room between portions for easy turning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/#wprm-recipe-40853-step-0-5"}, {"@type": "HowToStep", "text": "Cook for about 2 minutes, or until the edges appear set and the underside is golden brown. Carefully flip each pancake and continue cooking for approximately 2 additional minutes, until the second side is evenly browned.", "name": "Cook for about 2 minutes, or until the edges appear set and the underside is golden brown. Carefully flip each pancake and continue cooking for approximately 2 additional minutes, until the second side is evenly browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-pumpkin-pancakes/#wprm-recipe-40853-step-0-6"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Sugar-Free Pumpkin Pancakes"}</script>
