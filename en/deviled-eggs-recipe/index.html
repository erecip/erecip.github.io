er or place them in an ice bath. Peel and chill in the refrigerator, loosely covered, for about 15 minutes.", "url": "https://erecip.github.io/en/deviled-eggs-recipe/#wprm-recipe-12127-step-0-0"}, {"@type": "HowToStep", "text": "Cut each egg in half lengthwise and gently scoop out the yolks. Place the yolks into a bowl and mash thoroughly using a fork. Add the mustard, Tabasco sauce, salt, black pepper, snipped chives, and mayonnaise, stirring until the mixture is smooth and well combined.", "name": "Cut each egg in half lengthwise and gently scoop out the yolks. Place the yolks into a bowl and mash thoroughly using a fork. Add the mustard, Tabasco sauce, salt, black pepper, snipped chives, and mayonnaise, stirring until the mixture is smooth and well combined.", "url": "https://erecip.github.io/en/deviled-eggs-recipe/#wprm-recipe-12127-step-0-1"}, {"@type": "HowToStep", "text": "Spoon or pipe approximately 1½ teaspoons of the yolk mixture into each egg white half. Lightly dust with paprika and decorate with whole chives. Arrange on a serving platter and serve chilled.", "name": "Spoon or pipe approximately 1½ teaspoons of the yolk mixture into each egg white half. Lightly dust with paprika and decorate with whole chives. Arrange on a serving platter and serve chilled.", "url": "https://erecip.github.io/en/deviled-eggs-recipe/#wprm-recipe-12127-step-0-2"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["American"], "keywords": "Deviled Eggs Recipe"}</script>
