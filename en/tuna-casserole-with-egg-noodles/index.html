er. Bake uncovered at 400°F for 20 minutes, or until thoroughly heated and beginning to bubble around the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-egg-noodles/#wprm-recipe-42855-step-0-3"}, {"@type": "HowToStep", "text": "Carefully remove the baking dish from the oven. Scatter the buttered breadcrumb mixture evenly across the surface of the casserole. Return the dish to the oven and continue baking for 5 minutes, until the topping develops a crisp, golden-brown finish.", "name": "Carefully remove the baking dish from the oven. Scatter the buttered breadcrumb mixture evenly across the surface of the casserole. Return the dish to the oven and continue baking for 5 minutes, until the topping develops a crisp, golden-brown finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-egg-noodles/#wprm-recipe-42855-step-0-4"}], "recipeCategory": ["Casserole", "Main Course"], "keywords": "Tuna Casserole with Egg Noodles"}</script>
