    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Bread with Maple Glaze", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender, warmly spiced pumpkin loaf made with whole-grain flour, pure maple syrup, and nutty browned butter. Once cooled, the bread is finished with a smooth maple glaze for added sweetness and an elegant presentation.", "datePublished": "2023-07-16T04:06:13+00:00", "image": ["https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/pumpkin-bread-with-maple-glaze.png", "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/pumpkin-bread-with-maple-glaze.png", "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/pumpkin-bread-with-maple-glaze.png", "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/pumpkin-bread-with-maple-glaze.png"], "prepTime": "PT20M", "cookTime": "PT50M", "totalTime": "PT70M", "recipeIngredient": ["One 15-ounce can pumpkin purée (425 grams)", "2  large eggs (preferably brought to room temperature)", "⅓ cup unsalted butter (75 grams)", "1 teaspoon pure vanilla extract", "½ cup pure maple syrup", "½ teaspoon ground ginger", "1¾ cups whole-wheat pastry flour or white whole-wheat flour (198 grams)", "¼ teaspoon fine salt", "½ teaspoon ground allspice", "1 teaspoon baking soda", "½ teaspoon ground nutmeg", "1½ teaspoons ground cinnamon", "1 tablespoon pure maple syrup", "½ cup sifted confectioners’ sugar (57 grams)", "Up to 1 tablespoon unsweetened almond milk or another milk (optional for adjusting the consistency)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 350°F (175°C). Line an 8½ x 4½-inch loaf pan with parchment paper, then lightly coat the interior with nonstick cooking spray. Set the prepared pan aside.", "name": "Heat the oven to 350°F (175°C). Line an 8½ x 4½-inch loaf pan with parchment paper, then lightly coat the interior with nonstick cooking spray. Set the prepared pan aside.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-0"}, {"@type": "HowToStep", "text": "Place the butter in a saucepan over medium heat. Whisk continuously while it melts, crackles, and begins to foam.", "name": "Place the butter in a saucepan over medium heat. Whisk continuously while it melts, crackles, and begins to foam.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-1"}, {"@type": "HowToStep", "text": "Continue cooking for several minutes, watching closely as golden-brown particles develop at the bottom of the pan and the butter releases a distinctly nutty aroma.", "name": "Continue cooking for several minutes, watching closely as golden-brown particles develop at the bottom of the pan and the butter releases a distinctly nutty aroma.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-2"}, {"@type": "HowToStep", "text": "Immediately remove the saucepan from the heat once the butter reaches an amber-golden color. Transfer the browned butter to a medium bowl and allow it to cool for 5–10 minutes, or until it is no longer hot to the touch.", "name": "Immediately remove the saucepan from the heat once the butter reaches an amber-golden color. Transfer the browned butter to a medium bowl and allow it to cool for 5–10 minutes, or until it is no longer hot to the touch.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-3"}, {"@type": "HowToStep", "text": "In a large mixing bowl, whisk the pumpkin purée, maple syrup, eggs, and vanilla extract together until the mixture is smooth and uniform.", "name": "In a large mixing bowl, whisk the pumpkin purée, maple syrup, eggs, and vanilla extract together until the mixture is smooth and uniform.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-4"}, {"@type": "HowToStep", "text": "Once the browned butter has cooled sufficiently, pour it into the pumpkin mixture. Whisk again until the butter is fully incorporated.", "name": "Once the browned butter has cooled sufficiently, pour it into the pumpkin mixture. Whisk again until the butter is fully incorporated.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-5"}, {"@type": "HowToStep", "text": "In a separate large bowl, thoroughly combine the whole-wheat pastry flour, baking soda, salt, cinnamon, nutmeg, ginger, and allspice.", "name": "In a separate large bowl, thoroughly combine the whole-wheat pastry flour, baking soda, salt, cinnamon, nutmeg, ginger, and allspice.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-6"}, {"@type": "HowToStep", "text": "Add the dry mixture to the bowl containing the pumpkin mixture. Stir gently only until no visible streaks of dry flour remain. Avoid excessive mixing, which may produce a dense loaf.", "name": "Add the dry mixture to the bowl containing the pumpkin mixture. Stir gently only until no visible streaks of dry flour remain. Avoid excessive mixing, which may produce a dense loaf.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared pan and level the surface with a spatula.", "name": "Transfer the batter to the prepared pan and level the surface with a spatula.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-8"}, {"@type": "HowToStep", "text": "Place the pan in the preheated oven and bake for 50–65 minutes. The bread is ready when a tester inserted into the center emerges clean or with only a few moist crumbs attached.", "name": "Place the pan in the preheated oven and bake for 50–65 minutes. The bread is ready when a tester inserted into the center emerges clean or with only a few moist crumbs attached.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-9"}, {"@type": "HowToStep", "text": "Allow the pumpkin bread to rest in the pan for 10 minutes. Carefully lift or turn it out of the pan, then place it on a wire cooling rack.", "name": "Allow the pumpkin bread to rest in the pan for 10 minutes. Carefully lift or turn it out of the pan, then place it on a wire cooling rack.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-10"}, {"@type": "HowToStep", "text": "Cool the loaf completely before adding the glaze so the topping sets properly rather than melting into the bread.", "name": "Cool the loaf completely before adding the glaze so the topping sets properly rather than melting into the bread.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-11"}, {"@type": "HowToStep", "text": "In a small bowl, stir the sifted confectioners’ sugar and maple syrup together until smooth.", "name": "In a small bowl, stir the sifted confectioners’ sugar and maple syrup together until smooth.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-12"}, {"@type": "HowToStep", "text": "For a thinner, more pourable glaze, incorporate the unsweetened almond milk or another preferred milk one teaspoon at a time. Stop adding liquid once the desired consistency is achieved.", "name": "For a thinner, more pourable glaze, incorporate the unsweetened almond milk or another preferred milk one teaspoon at a time. Stop adding liquid once the desired consistency is achieved.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-13"}, {"@type": "HowToStep", "text": "Drizzle the maple glaze evenly across the fully cooled pumpkin bread. Allow the topping to settle before slicing and serving.", "name": "Drizzle the maple glaze evenly across the fully cooled pumpkin bread. Allow the topping to settle before slicing and serving.", "url": "https://erecip.github.io/en/pumpkin-bread-with-maple-glaze/#wprm-recipe-39651-step-0-14"}], "recipeCategory": ["Bread", "Breakfast", "Snack"], "recipeCuisine": ["American"], "keywords": "Pumpkin Bread with Maple Glaze"}</script>
