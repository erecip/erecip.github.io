    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cream of Vegetable Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "A smooth, comforting vegetable soup prepared with red onion, garlic, carrots, celery, sweet potato, and zucchini simmered in chicken broth. The cooked vegetables are blended until velvety, seasoned with herbes de Provence, and finished with rich 35% heavy cream for a silky texture.", "datePublished": "2019-01-02T15:18:45+00:00", "image": ["https://erecip.github.io/en/cream-of-vegetable-soup/cream-of-vegetable-soup1.png", "https://erecip.github.io/en/cream-of-vegetable-soup/cream-of-vegetable-soup1.png", "https://erecip.github.io/en/cream-of-vegetable-soup/cream-of-vegetable-soup1.png", "https://erecip.github.io/en/cream-of-vegetable-soup/cream-of-vegetable-soup1.png"], "cookTime": "PT30M", "totalTime": "PT30M", "recipeIngredient": ["3 cups chicken broth", "1  large zucchini (sliced into large chunks)", "1/2 cup 35% heavy cream", "2  small carrots (roughly diced)", "1  medium red onion (chopped)", "1/4 teaspoon herbes de Provence", "1  celery stalk (chopped)", "3 tablespoons extra-virgin olive oil", "1/2  sweet potato (cut into large cubes)", "1  garlic clove (finely minced)", "Fine salt (as needed)", "Ground black pepper (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm the extra-virgin olive oil in a large pot over medium-high heat. Add the chopped red onion and finely minced garlic once the oil is hot. Cook for approximately 5 minutes, stirring from time to time, until the onion has softened and become translucent.", "name": "Warm the extra-virgin olive oil in a large pot over medium-high heat. Add the chopped red onion and finely minced garlic once the oil is hot. Cook for approximately 5 minutes, stirring from time to time, until the onion has softened and become translucent.", "url": "https://erecip.github.io/en/cream-of-vegetable-soup/#wprm-recipe-44510-step-0-0"}, {"@type": "HowToStep", "text": "Add the chopped celery and roughly diced carrots to the onion and garlic mixture. Continue sautéing for another 5 minutes, stirring occasionally, until the vegetables begin to soften.", "name": "Add the chopped celery and roughly diced carrots to the onion and garlic mixture. Continue sautéing for another 5 minutes, stirring occasionally, until the vegetables begin to soften.", "url": "https://erecip.github.io/en/cream-of-vegetable-soup/#wprm-recipe-44510-step-0-1"}, {"@type": "HowToStep", "text": "Place the cubed sweet potato into the pot and stir thoroughly to combine it with the other vegetables. Pour in the chicken broth.", "name": "Place the cubed sweet potato into the pot and stir thoroughly to combine it with the other vegetables. Pour in the chicken broth.", "url": "https://erecip.github.io/en/cream-of-vegetable-soup/#wprm-recipe-44510-step-0-2"}, {"@type": "HowToStep", "text": "Increase the heat and bring the soup to a boil. Reduce the heat to low and allow it to simmer for approximately 15 minutes, or until the carrots and sweet potato can be easily pierced with a fork.", "name": "Increase the heat and bring the soup to a boil. Reduce the heat to low and allow it to simmer for approximately 15 minutes, or until the carrots and sweet potato can be easily pierced with a fork.", "url": "https://erecip.github.io/en/cream-of-vegetable-soup/#wprm-recipe-44510-step-0-3"}, {"@type": "HowToStep", "text": "Stir the large zucchini pieces into the simmering soup. Continue cooking for about 5 additional minutes, just until the zucchini becomes tender.", "name": "Stir the large zucchini pieces into the simmering soup. Continue cooking for about 5 additional minutes, just until the zucchini becomes tender.", "url": "https://erecip.github.io/en/cream-of-vegetable-soup/#wprm-recipe-44510-step-0-4"}, {"@type": "HowToStep", "text": "Add the herbes de Provence, then season with salt and black pepper according to taste.", "name": "Add the herbes de Provence, then season with salt and black pepper according to taste.", "url": "https://erecip.github.io/en/cream-of-vegetable-soup/#wprm-recipe-44510-step-0-5"}, {"@type": "HowToStep", "text": "Using an immersion blender, carefully purée the soup directly in the pot until the vegetables form a smooth, creamy consistency.", "name": "Using an immersion blender, carefully purée the soup directly in the pot until the vegetables form a smooth, creamy consistency.", "url": "https://erecip.github.io/en/cream-of-vegetable-soup/#wprm-recipe-44510-step-0-6"}, {"@type": "HowToStep", "text": "Pour the heavy cream into the puréed soup and stir until evenly distributed. Blend the soup once more with the immersion blender to completely incorporate the cream and create a silky finish.", "name": "Pour the heavy cream into the puréed soup and stir until evenly distributed. Blend the soup once more with the immersion blender to completely incorporate the cream and create a silky finish.", "url": "https://erecip.github.io/en/cream-of-vegetable-soup/#wprm-recipe-44510-step-0-7"}, {"@type": "HowToStep", "text": "Serve the cream of vegetable soup while hot.", "name": "Serve the cream of vegetable soup while hot.", "url": "https://erecip.github.io/en/cream-of-vegetable-soup/#wprm-recipe-44510-step-0-8"}], "recipeCategory": ["Soup"], "recipeCuisine": ["European"], "keywords": "Cream of Vegetable Soup"}</script>
