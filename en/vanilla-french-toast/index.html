ly 30 seconds, allowing the bread to become well saturated and noticeably heavier without becoming so soft that it breaks apart.", "name": "Place each slice of day-old sandwich bread into the prepared custard, coating both surfaces completely. Leave each side in the mixture for approximately 30 seconds, allowing the bread to become well saturated and noticeably heavier without becoming so soft that it breaks apart.", "url": "https://erecip.github.io/en/vanilla-french-toast/#wprm-recipe-44292-step-0-1"}, {"@type": "HowToStep", "text": "Adjust the soaking period slightly according to the thickness and dryness of the bread. Gently pressing each slice into the custard can help it absorb the mixture evenly.", "name": "Adjust the soaking period slightly according to the thickness and dryness of the bread. Gently pressing each slice into the custard can help it absorb the mixture evenly.", "url": "https://erecip.github.io/en/vanilla-french-toast/#wprm-recipe-44292-step-0-2"}, {"@type": "HowToStep", "text": "Lightly grease a griddle and preheat it over medium heat. Arrange the soaked bread slices on the heated surface without overcrowding.", "name": "Lightly grease a griddle and preheat it over medium heat. Arrange the soaked bread slices on the heated surface without overcrowding.", "url": "https://erecip.github.io/en/vanilla-french-toast/#wprm-recipe-44292-step-0-3"}, {"@type": "HowToStep", "text": "Cook the first side for approximately 2–3 minutes, or until it develops an even golden-brown color. Turn each slice over and cook the second side until similarly golden and fully cooked through. Prepare the French toast in batches when necessary.", "name": "Cook the first side for approximately 2–3 minutes, or until it develops an even golden-brown color. Turn each slice over and cook the second side until similarly golden and fully cooked through. Prepare the French toast in batches when necessary.", "url": "https://erecip.github.io/en/vanilla-french-toast/#wprm-recipe-44292-step-0-4"}, {"@type": "HowToStep", "text": "Serve the French toast immediately while hot. Top as desired with butter, maple syrup, assorted fresh berries, and a light coating of powdered sugar.", "name": "Serve the French toast immediately while hot. Top as desired with butter, maple syrup, assorted fresh berries, and a light coating of powdered sugar.", "url": "https://erecip.github.io/en/vanilla-french-toast/#wprm-recipe-44292-step-0-5"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American", "French"], "keywords": "Vanilla French Toast"}</script>
