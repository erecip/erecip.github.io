    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Banana Zucchini Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "A moist, warmly spiced quick bread that combines ripe banana, pumpkin purée, grated zucchini, Greek yogurt, and flaxseed. Chopped pecans or walnuts may be added for a crisp, nutty contrast.", "datePublished": "2018-04-13T10:49:45+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/Pumpkin-Banana-Zucchini-Bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/Pumpkin-Banana-Zucchini-Bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/Pumpkin-Banana-Zucchini-Bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/Pumpkin-Banana-Zucchini-Bread.png"], "cookTime": "PT60M", "totalTime": "PT70M", "recipeIngredient": ["1 cup whole-wheat flour", "2 teaspoons baking powder", "¼ cup finely milled flaxseed", "½ teaspoon salt", "1 cup all-purpose flour", "1 teaspoon baking soda", "1 teaspoon pumpkin pie spice (or cinnamon for a simpler flavor)", "1 cup unsweetened pure pumpkin purée", "¼ cup neutral-flavored oil (such as canola or vegetable oil)", "1  large egg (brought to room temperature)", "1 cup mashed ripe banana (from approximately 2–3 bananas)", "⅓ cup firmly packed light brown sugar", "½ cup plain Greek yogurt", "1 cup grated zucchini (gently pressed to remove excess liquid)", "1 cup roughly chopped pecans or walnuts (optional)", "Butter or nonstick cooking spray"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Thoroughly coat the bottom and sides of a loaf pan with butter or cooking spray to help prevent the bread from sticking.", "name": "Preheat the oven to 350°F. Thoroughly coat the bottom and sides of a loaf pan with butter or cooking spray to help prevent the bread from sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/#wprm-recipe-39393-step-0-0"}, {"@type": "HowToStep", "text": "Mash the ripe bananas until smooth. Grate the zucchini, then wrap it in a clean kitchen towel or several layers of paper towel and gently squeeze away the surplus moisture. Chop the pecans or walnuts when including them.", "name": "Mash the ripe bananas until smooth. Grate the zucchini, then wrap it in a clean kitchen towel or several layers of paper towel and gently squeeze away the surplus moisture. Chop the pecans or walnuts when including them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/#wprm-recipe-39393-step-0-1"}, {"@type": "HowToStep", "text": "In a medium mixing bowl, whisk together the whole-wheat flour, all-purpose flour, milled flaxseed, baking powder, baking soda, pumpkin pie spice, and salt. Continue whisking until the leavening agents and seasonings are evenly dispersed, then set the bowl aside.", "name": "In a medium mixing bowl, whisk together the whole-wheat flour, all-purpose flour, milled flaxseed, baking powder, baking soda, pumpkin pie spice, and salt. Continue whisking until the leavening agents and seasonings are evenly dispersed, then set the bowl aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/#wprm-recipe-39393-step-0-2"}, {"@type": "HowToStep", "text": "In a large bowl, combine the mashed banana, pumpkin purée, Greek yogurt, packed brown sugar, neutral oil, and room-temperature egg. Whisk until the mixture appears smooth and evenly blended.", "name": "In a large bowl, combine the mashed banana, pumpkin purée, Greek yogurt, packed brown sugar, neutral oil, and room-temperature egg. Whisk until the mixture appears smooth and evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/#wprm-recipe-39393-step-0-3"}, {"@type": "HowToStep", "text": "Add the dry mixture to the wet ingredients. Using a spatula or wooden spoon, fold the batter only until the visible streaks of flour disappear. A few small lumps may remain; avoid excessive mixing, as it can produce a dense or tough loaf.", "name": "Add the dry mixture to the wet ingredients. Using a spatula or wooden spoon, fold the batter only until the visible streaks of flour disappear. A few small lumps may remain; avoid excessive mixing, as it can produce a dense or tough loaf.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/#wprm-recipe-39393-step-0-4"}, {"@type": "HowToStep", "text": "Gently fold the drained zucchini and chopped nuts into the batter until they are distributed throughout.", "name": "Gently fold the drained zucchini and chopped nuts into the batter until they are distributed throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/#wprm-recipe-39393-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared loaf pan and lightly smooth the surface. Bake at 350°F for 60–75 minutes. The loaf is ready when a toothpick inserted into the center emerges clean or carries only a few moist crumbs.", "name": "Transfer the batter to the prepared loaf pan and lightly smooth the surface. Bake at 350°F for 60–75 minutes. The loaf is ready when a toothpick inserted into the center emerges clean or carries only a few moist crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/#wprm-recipe-39393-step-0-6"}, {"@type": "HowToStep", "text": "When the top begins browning too rapidly, loosely cover the loaf with aluminum foil at approximately the 40-minute point and continue baking until the center is fully set.", "name": "When the top begins browning too rapidly, loosely cover the loaf with aluminum foil at approximately the 40-minute point and continue baking until the center is fully set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/#wprm-recipe-39393-step-0-7"}, {"@type": "HowToStep", "text": "Remove the bread from the oven and leave it in the pan for 10 minutes. This brief resting period allows the loaf to firm sufficiently before removal.", "name": "Remove the bread from the oven and leave it in the pan for 10 minutes. This brief resting period allows the loaf to firm sufficiently before removal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/#wprm-recipe-39393-step-0-8"}, {"@type": "HowToStep", "text": "Turn the bread out onto a wire rack and allow it to cool completely. Cooling it on a rack permits air to circulate beneath the loaf and helps prevent condensation from softening the bottom.", "name": "Turn the bread out onto a wire rack and allow it to cool completely. Cooling it on a rack permits air to circulate beneath the loaf and helps prevent condensation from softening the bottom.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-zucchini-bread/#wprm-recipe-39393-step-0-9"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Pumpkin Banana Zucchini Bread"}</script>
