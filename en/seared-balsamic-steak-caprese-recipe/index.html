    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Seared Balsamic Steak Caprese", "author": {"@type": "Person", "name": "BenDes"}, "description": "This elegant summer entrée features seared balsamic-marinated steak, sliced to perfection and crowned with a vibrant Caprese salad of fresh mozzarella, basil, and ripe cherry tomatoes. A protein-rich dish that brings together bold flavors and refreshing textures.", "datePublished": "2024-04-09T19:30:00+00:00", "image": ["https://erecip.github.io/en/seared-balsamic-steak-caprese-recipe/Seared-Balsamic-Steak-Caprese-Recipe1.webp", "https://erecip.github.io/en/seared-balsamic-steak-caprese-recipe/Seared-Balsamic-Steak-Caprese-Recipe1.webp", "https://erecip.github.io/en/seared-balsamic-steak-caprese-recipe/Seared-Balsamic-Steak-Caprese-Recipe1.webp", "https://erecip.github.io/en/seared-balsamic-steak-caprese-recipe/Seared-Balsamic-Steak-Caprese-Recipe1.webp"], "prepTime": "PT150M", "cookTime": "PT20M", "totalTime": "PT170M", "recipeIngredient": ["1.5 tablespoons coarse salt", "1 tablespoon brown sugar", "1.5 teaspoons Dijon mustard", "2 tablespoons Worcestershire sauce", "1 clove garlic (minced)", "¼ cup balsamic vinegar", "2.5 lbs. flank steak or skirt steak", "1 tablespoon balsamic vinegar", "8 oz. small mozzarella balls", "1 tablespoon olive oil", "½ teaspoon sea salt", "1 pint cherry tomatoes (halved)", "1 cup fresh basil (torn)", "Squeeze of fresh lemon juice"], "recipeInstructions": [{"@type": "HowToStep", "text": "Season both sides of the steak with coarse salt, massaging it thoroughly into the surface. Place the meat into a shallow dish or resealable plastic bag.", "name": "Season both sides of the steak with coarse salt, massaging it thoroughly into the surface. Place the meat into a shallow dish or resealable plastic bag.", "url": "https://erecip.github.io/en/seared-balsamic-steak-caprese-recipe/#wprm-recipe-26133-step-0-0"}, {"@type": "HowToStep", "text": "Combine balsamic vinegar, Worcestershire sauce, brown sugar, minced garlic, and Dijon mustard in a bowl. Whisk until fully blended, then pour the marinade over the steak, ensuring it is completely coated. Flip the meat as needed. Cover and refrigerate for no less than 30 minutes, preferably for over 2 hours for deeper flavor.", "name": "Combine balsamic vinegar, Worcestershire sauce, brown sugar, minced garlic, and Dijon mustard in a bowl. Whisk until fully blended, then pour the marinade over the steak, ensuring it is completely coated. Flip the meat as needed. Cover and refrigerate for no less than 30 minutes, preferably for over 2 hours for deeper flavor.", "url": "https://erecip.github.io/en/seared-balsamic-steak-caprese-recipe/#wprm-recipe-26133-step-0-1"}, {"@type": "HowToStep", "text": "While the steak marinates, prepare the Caprese topping by gently mixing the cherry tomatoes, mozzarella balls, basil, balsamic vinegar, olive oil, sea salt, and a squeeze of fresh lemon juice in a bowl. Store in the refrigerator until needed.", "name": "While the steak marinates, prepare the Caprese topping by gently mixing the cherry tomatoes, mozzarella balls, basil, balsamic vinegar, olive oil, sea salt, and a squeeze of fresh lemon juice in a bowl. Store in the refrigerator until needed.", "url": "https://erecip.github.io/en/seared-balsamic-steak-caprese-recipe/#wprm-recipe-26133-step-0-2"}, {"@type": "HowToStep", "text": "Allow the marinated steak to sit at room temperature for 10 to 15 minutes before cooking.", "name": "Allow the marinated steak to sit at room temperature for 10 to 15 minutes before cooking.", "url": "https://erecip.github.io/en/seared-balsamic-steak-caprese-recipe/#wprm-recipe-26133-step-0-3"}, {"@type": "HowToStep", "text": "Heat 2 tablespoons of olive oil in a large cast-iron skillet over medium-high heat. Once the oil is shimmering, add the steak. Sear each side for 4 to 7 minutes, depending on the thickness, or until the internal temperature reaches 135–14
