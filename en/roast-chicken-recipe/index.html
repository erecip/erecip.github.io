    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Roast Chicken Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This roast chicken is richly infused with a lemon-garlic-herb butter, resulting in succulent, juicy meat beneath a crisp, golden-brown skin. Accompanied by aromatic pan juices—ideal for drizzling—this preparation delivers deep, savory flavor throughout. Adjustments for different chicken sizes and an optional gravy method are included.", "datePublished": "2024-08-11T15:02:08+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/roast-chicken-recipe/Roast-Chicken-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/roast-chicken-recipe/Roast-Chicken-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/roast-chicken-recipe/Roast-Chicken-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/roast-chicken-recipe/Roast-Chicken-Recipe1.png"], "prepTime": "PT15M", "cookTime": "PT90M", "totalTime": "PT105M", "recipeIngredient": ["3  rosemary sprigs", "1  lemon (quartered)", "Salt and black pepper (to taste)", "1.75  – 2 kg (3.5 – 4 lb whole chicken, patted dry)", "2 tsp olive oil", "1  onion (quartered)", "1  garlic bulb (halved horizontally)", "1 cup 250 ml dry white wine or low-sodium chicken broth", "100 g 1 stick unsalted butter, melted", "2 tsp finely chopped rosemary", "1 tbsp finely chopped parsley", "1 tbsp finely chopped sage", "3  garlic cloves (minced)", "1/2 tsp salt", "1/2 tsp black pepper"], "recipeInstructions": [{"@type": "HowToStep", "text": "Remove the chicken from refrigeration 30 minutes prior to cooking. Preheat the oven to 220°C (450°F) for a standard oven or 200°C (430°F) for convection. Position the oven rack in the center. Combine all ingredients for the butter mixture, incorporating the juice from two lemon wedges.", "name": "Remove the chicken from refrigeration 30 minutes prior to cooking. Preheat the oven to 220°C (450°F) for a standard oven or 200°C (430°F) for convection. Position the oven rack in the center. Combine all ingredients for the butter mixture, incorporating the juice from two lemon wedges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roast-chicken-recipe/#wprm-recipe-12600-step-0-0"}, {"@type": "HowToStep", "text": "Position the chicken in a roasting pan. Gently separate the skin from the meat of the breast and drumsticks using the back of a spoon. While the bird is propped upright, distribute most of the butter mixture underneath the skin, reserving a portion for the surface.", "name": "Position the chicken in a roasting pan. Gently separate the skin from the meat of the breast and drumsticks using the back of a spoon. While the bird is propped upright, distribute most of the butter mixture underneath the skin, reserving a portion for the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roast-chicken-recipe/#wprm-recipe-12600-step-0-1"}, {"@type": "HowToStep", "text": "Coat the chicken’s exterior with the remaining butter and squeeze the juice of two additional lemon wedges over the surface. Insert the used lemon wedges and rosemary sprigs into the cavity. Tie the drumsticks with kitchen twine and tuck the wings under the body. Season the chicken generously with salt and pepper.", "name": "Coat the chicken’s exterior with the remaining butter and squeeze the juice of two additional lemon wedges over the surface. Insert the used lemon wedges and rosemary sprigs into the cavity. Tie the drumsticks with kitchen twine and tuck the wings under the body. Season the chicken generously with salt and pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roast-chicken-recipe/#wprm-recipe-12600-step-0-2"}, {"@type": "HowToStep", "text": "Arrange the onion and garlic in the roasting pan and place the chicken on top. Pour the wine or broth around the chicken and drizzle the bird with olive oil.", "na
