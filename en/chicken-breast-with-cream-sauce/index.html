    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Breast with Cream Sauce", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, golden-seared chicken breasts are finished in a rich garlic-Parmesan cream sauce with onion, chicken broth, and fresh parsley. The result is a savory, creamy main course suitable for serving with pasta, rice, mashed potatoes, cauliflower mash, or zucchini noodles.", "datePublished": "2022-08-10T19:06:26+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/chicken-breast-with-cream-sauce.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/chicken-breast-with-cream-sauce.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/chicken-breast-with-cream-sauce.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/chicken-breast-with-cream-sauce.png"], "prepTime": "PT15M", "cookTime": "PT30M", "totalTime": "PT45M", "recipeIngredient": ["2  –3 large skinless (boneless chicken breasts, approximately 1½ pounds in total)", "4 tablespoons finely grated Parmesan cheese", "1 teaspoon garlic powder", "4 tablespoons plain all-purpose flour", "2 teaspoons salt (preferably kosher salt)", "½ teaspoon ground black pepper", "1¼ cups full-fat heavy cream", "2 tablespoons unsalted butter", "1  small onion (finely diced)", "½ cup grated Parmesan cheese", "5 tablespoons olive oil", "1¼ cups chicken broth", "1  head garlic (minced, approximately 4–5 cloves)", "2 tablespoons finely chopped fresh parsley (for finishing)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Season the chicken breasts evenly with the salt, garlic powder, and black pepper.", "name": "Season the chicken breasts evenly with the salt, garlic powder, and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-0"}, {"@type": "HowToStep", "text": "Combine the all-purpose flour and grated Parmesan in a shallow dish. Coat each chicken breast thoroughly in the flour-Parmesan mixture, then gently shake away any loose excess.", "name": "Combine the all-purpose flour and grated Parmesan in a shallow dish. Coat each chicken breast thoroughly in the flour-Parmesan mixture, then gently shake away any loose excess.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-1"}, {"@type": "HowToStep", "text": "Warm 2 tablespoons of the olive oil together with 1 tablespoon of butter in a large skillet set over medium-high heat. Swirl the skillet so the fat coats the cooking surface evenly.", "name": "Warm 2 tablespoons of the olive oil together with 1 tablespoon of butter in a large skillet set over medium-high heat. Swirl the skillet so the fat coats the cooking surface evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-2"}, {"@type": "HowToStep", "text": "Cook 2–3 chicken breasts at a time for approximately 4–5 minutes per side, depending on their thickness. Continue cooking until both sides are golden, the centers are fully cooked, and no pink remains.", "name": "Cook 2–3 chicken breasts at a time for approximately 4–5 minutes per side, depending on their thickness. Continue cooking until both sides are golden, the centers are fully cooked, and no pink remains.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-3"}, {"@type": "HowToStep", "text": "Move the cooked chicken to a warm plate. If additional chicken remains, repeat the cooking process, adding more oil and butter when necessary. Place all finished chicken breasts together on the plate and reserve.", "name": "Move the cooked chicken to a warm plate. If additional chicken remains, repeat the cooking process, adding more oil and butter when necessary. Place all finished chicken breasts together on the plate and reserve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-4"}, {"@type": "HowToStep", "text": "Lower the heat to medium and carefully wipe the skillet with a sheet of paper towel.", "name": "Lower the heat to medium and carefully wipe the skillet with a sheet of paper towel.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-5"}, {"@type": "HowToStep", "text": "Add the diced onion to the remaining oil and pan juices. Sauté until the onion becomes tender and softened.", "name": "Add the diced onion to the remaining oil and pan juices. Sauté until the onion becomes tender and softened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-6"}, {"@type": "HowToStep", "text": "Using the blunt side of a knife, crush 6 whole garlic cloves. Add the remaining olive oil to the skillet and stir it through the onions.", "name": "Using the blunt side of a knife, crush 6 whole garlic cloves. Add the remaining olive oil to the skillet and stir it through the onions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-7"}, {"@type": "HowToStep", "text": "Add the crushed garlic, along with any additional whole garlic cloves, and sauté for approximately 2–3 minutes, or until aromatic.", "name": "Add the crushed garlic, along with any additional whole garlic cloves, and sauté for approximately 2–3 minutes, or until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-8"}, {"@type": "HowToStep", "text": "Pour the chicken broth into the skillet to deglaze the pan. Scrape the browned pieces from the bottom so they become incorporated into the sauce.", "name": "Pour the chicken broth into the skillet to deglaze the pan. Scrape the browned pieces from the bottom so they become incorporated into the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-9"}, {"@type": "HowToStep", "text": "Allow the broth mixture to simmer until its volume has reduced by roughly half, approximately 5 minutes.", "name": "Allow the broth mixture to simmer until its volume has reduced by roughly half, approximately 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-10"}, {"@type": "HowToStep", "text": "Lower the heat to medium-low and add the heavy cream. Bring the sauce to a mild simmer and cook for approximately 2–3 minutes so the ingredients and flavors combine.", "name": "Lower the heat to medium-low and add the heavy cream. Bring the sauce to a mild simmer and cook for approximately 2–3 minutes so the ingredients and flavors combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-11"}, {"@type": "HowToStep", "text": "Stir in the grated Parmesan cheese. Continue cooking gently for another 2–3 minutes, stirring from time to time, until the cheese has completely melted into the sauce.", "name": "Stir in the grated Parmesan cheese. Continue cooking gently for another 2–3 minutes, stirring from time to time, until the cheese has completely melted into the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-12"}, {"@type": "HowToStep", "text": "Taste the cream sauce and adjust with additional salt and black pepper as desired.", "name": "Taste the cream sauce and adjust with additional salt and black pepper as desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-13"}, {"@type": "HowToStep", "text": "Return the cooked chicken breasts to the skillet. Simmer them in the cream sauce for a further 2–3 minutes, allowing the chicken to absorb the sauce while the mixture thickens to the preferred consistency.", "name": "Return the cooked chicken breasts to the skillet. Simmer them in the cream sauce for a further 2–3 minutes, allowing the chicken to absorb the sauce while the mixture thickens to the preferred consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-14"}, {"@type": "HowToStep", "text": "Transfer the creamy chicken to a serving platter once the sauce has thickened and thoroughly coated the chicken.", "name": "Transfer the creamy chicken to a serving platter once the sauce has thickened and thoroughly coated the chicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-15"}, {"@type": "HowToStep", "text": "Finish with the chopped fresh parsley and a light scattering of freshly cracked black pepper. Serve with pasta, cauliflower mash, zucchini noodles, rice, or mashed potatoes.", "name": "Finish with the chopped fresh parsley and a light scattering of freshly cracked black pepper. Serve with pasta, cauliflower mash, zucchini noodles, rice, or mashed potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cream-sauce/#wprm-recipe-45166-step-0-16"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Chicken Breast with Cream Sauce"}</script>
