ing to their size and thickness.", "name": "Arrange the cut cookie shapes on a baking sheet and bake for 6–10 minutes, adjusting the baking time according to their size and thickness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-salted-butter/#wprm-recipe-44374-step-0-10"}, {"@type": "HowToStep", "text": "Thicker cookies generally require approximately 9–10 minutes, while smaller or thinner shapes may be ready after 6–7 minutes. Remove the cookies when they are set and the edges are only beginning to develop a faint golden color.", "name": "Thicker cookies generally require approximately 9–10 minutes, while smaller or thinner shapes may be ready after 6–7 minutes. Remove the cookies when they are set and the edges are only beginning to develop a faint golden color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-salted-butter/#wprm-recipe-44374-step-0-11"}, {"@type": "HowToStep", "text": "Do not overbake, as additional baking can cause the cookies to become dry.", "name": "Do not overbake, as additional baking can cause the cookies to become dry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-salted-butter/#wprm-recipe-44374-step-0-12"}, {"@type": "HowToStep", "text": "Allow the baked cookies to cool completely before decorating.", "name": "Allow the baked cookies to cool completely before decorating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-salted-butter/#wprm-recipe-44374-step-0-13"}, {"@type": "HowToStep", "text": "Finish the cooled cookies with buttercream frosting. The frosting may be tinted as desired for holiday decorations and provides a smooth, creamy topping.", "name": "Finish the cooled cookies with buttercream frosting. The frosting may be tinted as desired for holiday decorations and provides a smooth, creamy topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-coo
