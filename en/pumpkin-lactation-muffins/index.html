    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Lactation Muffins", "author": {"@type": "Person", "name": "BenDes"}, "description": "These warmly spiced pumpkin muffins combine oat flour, rolled oats, freshly milled flaxseed, and brewer’s yeast. Pumpkin purée keeps the crumb moist, while brown sugar and pumpkin pie spice provide a rich seasonal flavor.", "datePublished": "2021-04-19T11:15:59+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/pumpkin-lactation-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/pumpkin-lactation-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/pumpkin-lactation-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/pumpkin-lactation-muffins2.png"], "cookTime": "PT18M", "recipeIngredient": ["2 teaspoons pumpkin pie spice", "¼ cup finely ground flaxseed (preferably freshly milled)", "½ cup firmly packed brown sugar", "1 cup oat flour", "2 tablespoons brewer’s yeast", "½ teaspoon salt", "2 teaspoons baking powder", "¼ teaspoon baking soda", "¾ cup canned pumpkin purée", "¼ cup neutral-flavored oil (such as canola oil)", "1 teaspoon pure vanilla extract", "1  large egg (brought to room temperature)", "1 cup old-fashioned rolled oats", "¼ cup milk of choice"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 375°F. Place paper liners in the wells of a muffin pan and measure all ingredients before beginning.", "name": "Preheat the oven to 375°F. Place paper liners in the wells of a muffin pan and measure all ingredients before beginning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/#wprm-recipe-40021-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, whisk the oat flour, brown sugar, pumpkin pie spice, baking powder, baking soda, and salt for approximately 30 seconds. Thorough whisking helps distribute the leavening agents evenly throughout the mixture.", "name": "In a large mixing bowl, whisk the oat flour, brown sugar, pumpkin pie spice, baking powder, baking soda, and salt for approximately 30 seconds. Thorough whisking helps distribute the leavening agents evenly throughout the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/#wprm-recipe-40021-step-0-1"}, {"@type": "HowToStep", "text": "In a separate medium bowl, whisk the pumpkin purée, room-temperature egg, milk, neutral oil, and vanilla until smooth and evenly blended.", "name": "In a separate medium bowl, whisk the pumpkin purée, room-temperature egg, milk, neutral oil, and vanilla until smooth and evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/#wprm-recipe-40021-step-0-2"}, {"@type": "HowToStep", "text": "Add the ground flaxseed, brewer’s yeast, and rolled oats to the pumpkin mixture. Stir gently until all three ingredients are incorporated.", "name": "Add the ground flaxseed, brewer’s yeast, and rolled oats to the pumpkin mixture. Stir gently until all three ingredients are incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/#wprm-recipe-40021-step-0-3"}, {"@type": "HowToStep", "text": "Pour the wet mixture into the bowl containing the dry ingredients. Using a rubber spatula, fold the mixtures together only until no visible streaks of dry flour remain. The finished batter may retain a slightly uneven or lumpy appearance.", "name": "Pour the wet mixture into the bowl containing the dry ingredients. Using a rubber spatula, fold the mixtures together only until no visible streaks of dry flour remain. The finished batter may retain a slightly uneven or lumpy appearance.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/#wprm-recipe-40021-step-0-4"}, {"@type": "HowToStep", "text": "Divide the batter among the prepared muffin cups, filling each liner approximately three-quarters full.", "name": "Divide the batter among the prepared muffin cups, filling each liner approximately three-quarters full.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/#wprm-recipe-40021-step-0-5"}, {"@type": "HowToStep", "text": "Bake for 18 minutes. The muffins are ready when a toothpick inserted into the center comes out clean or carries only a few moist crumbs.", "name": "Bake for 18 minutes. The muffins are ready when a toothpick inserted into the center comes out clean or carries only a few moist crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/#wprm-recipe-40021-step-0-6"}, {"@type": "HowToStep", "text": "Allow the muffins to rest in the pan for about 5 minutes. Transfer them to a wire cooling rack and leave them to cool completely.", "name": "Allow the muffins to rest in the pan for about 5 minutes. Transfer them to a wire cooling rack and leave them to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-lactation-muffins/#wprm-recipe-40021-step-0-7"}], "recipeCategory": ["Breakfast", "Snack"], "recipeCuisine": ["American"], "keywords": "Pumpkin Lactation Muffins"}</script>
