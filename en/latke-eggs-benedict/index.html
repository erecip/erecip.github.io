    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Latke Eggs Benedict", "author": {"@type": "Person", "name": "BenDes"}, "description": "Crisp, golden potato latkes form the base of this savory Eggs Benedict variation, layered with cold-smoked salmon and tender poached eggs, then finished with warm, buttery hollandaise. Chives and finely minced red onion add freshness, color, and a subtle sharpness.", "datePublished": "2023-08-04T15:27:34+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/latke-eggs-benedict2.png", "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/latke-eggs-benedict2.png", "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/latke-eggs-benedict2.png", "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/latke-eggs-benedict2.png"], "prepTime": "PT30M", "cookTime": "PT45M", "totalTime": "PT75M", "recipeIngredient": ["1 1/2 pounds russet potatoes (peeled and finely grated)", "1 teaspoon kosher salt", "1/2  medium yellow onion (finely grated)", "2 tablespoons matzo meal (preferably Streit’s for added crispness)", "1/2 teaspoon freshly ground black pepper", "1  large egg (lightly whisked)", "Vegetable oil (enough to create a 1/4-inch layer in the frying pan)", "1/2 cup unsalted butter (gently melted and allowed to cool slightly)", "1 tablespoon freshly squeezed lemon juice", "1/4 teaspoon kosher salt", "3  large egg yolks", "8  large (very fresh eggs)", "A splash of white vinegar", "Chives (finely chopped)", "4 ounces cold-smoked salmon (thinly sliced)", "Red onion (finely diced)", "Flaky salt (to taste)", "Freshly ground black pepper (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Finely grate the peeled russet potatoes and yellow onion. A food processor fitted with a fine shredding or grating attachment may be used to make this process more efficient.", "name": "Finely grate the peeled russet potatoes and yellow onion. A food processor fitted with a fine shredding or grating attachment may be used to make this process more efficient.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the grated potatoes to a large bowl filled with lightly salted water. Allow them to soak for 20 to 30 minutes, or for as long as 1 hour when time permits. This soaking period removes excess starch while helping prevent discoloration.", "name": "Transfer the grated potatoes to a large bowl filled with lightly salted water. Allow them to soak for 20 to 30 minutes, or for as long as 1 hour when time permits. This soaking period removes excess starch while helping prevent discoloration.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-1"}, {"@type": "HowToStep", "text": "Thoroughly drain the soaked potatoes, then remove as much residual liquid as possible. Wrap them in a clean kitchen towel and firmly wring out the moisture, or use a salad spinner lined with paper towels.", "name": "Thoroughly drain the soaked potatoes, then remove as much residual liquid as possible. Wrap them in a clean kitchen towel and firmly wring out the moisture, or use a salad spinner lined with paper towels.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-2"}, {"@type": "HowToStep", "text": "Place the well-drained potatoes in a large mixing bowl with the grated onion, lightly beaten egg, matzo meal, kosher salt, and black pepper. Fold the ingredients together gently with a fork until everything is evenly distributed and the mixture holds together.", "name": "Place the well-drained potatoes in a large mixing bowl with the grated onion, lightly beaten egg, matzo meal, kosher salt, and black pepper. Fold the ingredients together gently with a fork until everything is evenly distributed and the mixture holds together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-3"}, {"@type": "HowToStep", "text": "Set a large skillet over medium heat. Once the pan is hot, pour in enough vegetable oil to reach approximately 1/4 inch up the sides.", "name": "Set a large skillet over medium heat. Once the pan is hot, pour in enough vegetable oil to reach approximately 1/4 inch up the sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-4"}, {"@type": "HowToStep", "text": "Allow the oil to heat until shimmering. Test the temperature with a small piece of the potato mixture; it should begin sizzling as soon as it touches the oil.", "name": "Allow the oil to heat until shimmering. Test the temperature with a small piece of the potato mixture; it should begin sizzling as soon as it touches the oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-5"}, {"@type": "HowToStep", "text": "Spoon approximately 3 to 4 tablespoons of potato mixture into the skillet for each latke, shaping each portion into a round about 3 inches across. Fry only 3 to 4 latkes at once so the pan does not become overcrowded.", "name": "Spoon approximately 3 to 4 tablespoons of potato mixture into the skillet for each latke, shaping each portion into a round about 3 inches across. Fry only 3 to 4 latkes at once so the pan does not become overcrowded.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-6"}, {"@type": "HowToStep", "text": "Cook the latkes for approximately 6 to 10 minutes on the first side, or until richly golden. Turn them carefully and continue frying for another 5 to 6 minutes.", "name": "Cook the latkes for approximately 6 to 10 minutes on the first side, or until richly golden. Turn them carefully and continue frying for another 5 to 6 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-7"}, {"@type": "HowToStep", "text": "Lift the cooked latkes from the oil with a slotted spatula and transfer them to a baking sheet to drain. Keep them warm in the oven while frying the remaining batches.", "name": "Lift the cooked latkes from the oil with a slotted spatula and transfer them to a baking sheet to drain. Keep them warm in the oven while frying the remaining batches.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-8"}, {"@type": "HowToStep", "text": "Crack each egg individually into a small ramekin or cup.", "name": "Crack each egg individually into a small ramekin or cup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-9"}, {"@type": "HowToStep", "text": "Fill a saucepan with approximately 2 inches of water and stir in a splash of white vinegar. Heat over medium until the water reaches a very gentle simmer, with small bubbles appearing at the bottom but no vigorous boiling.", "name": "Fill a saucepan with approximately 2 inches of water and stir in a splash of white vinegar. Heat over medium until the water reaches a very gentle simmer, with small bubbles appearing at the bottom but no vigorous boiling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-10"}, {"@type": "HowToStep", "text": "Carefully slide each egg into the simmering water. Poach for 4 1/2 to 5 minutes, until the whites are completely set and the yolks have a jammy consistency. For slightly firmer yolks, extend the cooking time by approximately 30 seconds.", "name": "Carefully slide each egg into the simmering water. Poach for 4 1/2 to 5 minutes, until the whites are completely set and the yolks have a jammy consistency. For slightly firmer yolks, extend the cooking time by approximately 30 seconds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-11"}, {"@type": "HowToStep", "text": "Remove each poached egg carefully and place it on a lightly oiled plate. Continue until all 8 eggs have been cooked.", "name": "Remove each poached egg carefully and place it on a lightly oiled plate. Continue until all 8 eggs have been cooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-12"}, {"@type": "HowToStep", "text": "Add the egg yolks, fresh lemon juice, and kosher salt to a blender. Process at medium-high speed until the mixture becomes smooth.", "name": "Add the egg yolks, fresh lemon juice, and kosher salt to a blender. Process at medium-high speed until the mixture becomes smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-13"}, {"@type": "HowToStep", "text": "Melt the unsalted butter until hot without allowing it to bubble. Reduce the blender to low speed and begin adding the butter in a very slow drizzle, allowing the sauce to emulsify.", "name": "Melt the unsalted butter until hot without allowing it to bubble. Reduce the blender to low speed and begin adding the butter in a very slow drizzle, allowing the sauce to emulsify.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-14"}, {"@type": "HowToStep", "text": "Continue pouring cautiously at first. Once the hollandaise begins to thicken, gradually incorporate the remaining melted butter until the sauce is smooth and cohesive.", "name": "Continue pouring cautiously at first. Once the hollandaise begins to thicken, gradually incorporate the remaining melted butter until the sauce is smooth and cohesive.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-15"}, {"@type": "HowToStep", "text": "If the hollandaise remains too thin, transfer it to a bowl and whisk it gently over a simmering water bath until it thickens slightly. Avoid excessive heat, which can cause the yolks to curdle.", "name": "If the hollandaise remains too thin, transfer it to a bowl and whisk it gently over a simmering water bath until it thickens slightly. Avoid excessive heat, which can cause the yolks to curdle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-16"}, {"@type": "HowToStep", "text": "Place one warm latke on each serving plate. Arrange a slice of cold-smoked salmon over the latke, followed by one freshly poached egg.", "name": "Place one warm latke on each serving plate. Arrange a slice of cold-smoked salmon over the latke, followed by one freshly poached egg.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-17"}, {"@type": "HowToStep", "text": "Spoon a generous amount of warm hollandaise over each egg. Finish with chopped chives, finely diced red onion, flaky salt, and freshly ground black pepper to taste.", "name": "Spoon a generous amount of warm hollandaise over each egg. Finish with chopped chives, finely diced red onion, flaky salt, and freshly ground black pepper to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-18"}, {"@type": "HowToStep", "text": "Serve the Latke Eggs Benedict immediately while the latkes remain crisp and the hollandaise is warm.", "name": "Serve the Latke Eggs Benedict immediately while the latkes remain crisp and the hollandaise is warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/latke-eggs-benedict/#wprm-recipe-43567-step-0-19"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American", "Jewish"], "keywords": "Latke Eggs Benedict"}</script>
