he oven and continue baking for another 5–10 minutes, until the mozzarella is fully melted and bubbling to the desired degree.", "name": "Place the pizza back in the oven and continue baking for another 5–10 minutes, until the mozzarella is fully melted and bubbling to the desired degree.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-pizza-crust/#wprm-recipe-42458-step-0-5"}, {"@type": "HowToStep", "text": "Remove the finished pizza from the oven. If desired, drizzle it lightly with extra-virgin olive oil and garnish with fresh basil. Slice and serve while hot.", "name": "Remove the finished pizza from the oven. If desired, drizzle it lightly with extra-virgin olive oil and garnish with fresh basil. Slice and serve while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-pizza-crust/#wprm-recipe-42458-step-0-6"}], "recipeCategory": ["Pizza"], "recipeCuisine": ["Italian"], "keywords": "Cottage Cheese Pizza Crust"}</script>
