c. Thoroughly toss until all pieces are coated, then spread them out in a single layer with the cut sides facing down. Place in the oven and roast for 45 to 55 minutes, turning the potatoes once and rotating the baking sheet 180° midway through roasting, until the potatoes are deeply golden and crisp. Remove from the oven, scatter the remaining ¼ teaspoon kosher salt over the potatoes, allow them to rest briefly, then serve immediately while hot.", "name": "Position an oven rack in the center and set the oven to preheat at 400°F. Prepare a large rimmed baking sheet by lining it with parchment paper or a silicone baking mat for effortless cleanup. Arrange the potatoes and garlic cloves, if using, in the middle of the baking sheet. In a separate bowl or measuring cup, whisk the olive oil together with ½ teaspoon of the kosher salt, black pepper, and rosemary. Drizzle this mixture over the potatoes and garlic. Thoroughly toss until all pieces are coated, then spread them out in a single layer with the cut sides facing down. Place in the oven and roast for 45 to 55 minutes, turning the potatoes once and rotating the baking sheet 180° midway through roasting, until the potatoes are deeply golden and crisp. Remove from the oven, scatter the remaining ¼ teaspoon kosher salt over the potatoes, allow them to rest briefly, then serve immediately while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/easy-oven-roasted-potatoes-recipe/#wprm-recipe-15179-step-0-0"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Easy Oven Roasted Potatoes Recipe"}</script>
