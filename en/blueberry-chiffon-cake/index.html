    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Blueberry Chiffon Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A light, airy chiffon-style layer cake filled with concentrated blueberry compote and finished with delicately flavored blueberry whipped cream. The soft cake layers are stacked with berry filling, coated in a smooth whipped-cream finish, and optionally decorated with blueberries and fresh thyme.", "datePublished": "2022-02-22T08:39:25+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/blueberry-chiffon-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/blueberry-chiffon-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/blueberry-chiffon-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/blueberry-chiffon-cake2.png"], "cookTime": "PT27M", "totalTime": "PT27M", "recipeIngredient": ["50 g water", "400 g frozen blueberries", "50 g white granulated sugar", "100 g cake flour", "50 g mild (neutral-flavored oil, such as avocado or canola oil)", "1 teaspoon baking powder", "5  large eggs (brought to room temperature)", "80 g dairy or non-dairy milk", "1 teaspoon vanilla extract", "¼ teaspoon cream of tartar", "120 g granulated white sugar", "3 tablespoons prepared blueberry compote", "1 teaspoon vanilla extract", "400 g heavy whipping cream or whipped cream", "30 g confectioners’ sugar", "Sprigs of fresh thyme", "Fresh blueberries or frozen blueberries that have been defrosted"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the frozen blueberries, granulated sugar, and water in a small saucepan and stir until combined.", "name": "Place the frozen blueberries, granulated sugar, and water in a small saucepan and stir until combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-0"}, {"@type": "HowToStep", "text": "Cover the saucepan and bring the berry mixture to a gentle simmer over medium heat.", "name": "Cover the saucepan and bring the berry mixture to a gentle simmer over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-1"}, {"@type": "HowToStep", "text": "Remove the lid and continue simmering for approximately 10–15 minutes, stirring from time to time. Cook until most of the liquid has evaporated and the blueberries have reduced to a thick, jam-like compote.", "name": "Remove the lid and continue simmering for approximately 10–15 minutes, stirring from time to time. Cook until most of the liquid has evaporated and the blueberries have reduced to a thick, jam-like compote.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the finished compote to a small bowl and allow it to cool completely before using it in the cake.", "name": "Transfer the finished compote to a small bowl and allow it to cool completely before using it in the cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-3"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Place parchment-paper circles on the bottoms of three 6-inch round cake pans, leaving the sides of the pans unlined.", "name": "Preheat the oven to 350°F (175°C). Place parchment-paper circles on the bottoms of three 6-inch round cake pans, leaving the sides of the pans unlined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-4"}, {"@type": "HowToStep", "text": "Separate the eggs, placing the whites in one large mixing bowl and the yolks in another.", "name": "Separate the eggs, placing the whites in one large mixing bowl and the yolks in another.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-5"}, {"@type": "HowToStep", "text": "Add the cream of tartar to the egg whites. Using a hand mixer on low speed, beat until the whites become foamy.", "name": "Add the cream of tartar to the egg whites. Using a hand mixer on low speed, beat until the whites become foamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-6"}, {"@type": "HowToStep", "text": "Add the 120 g granulated sugar gradually, approximately one spoonful at a time, while continuing to beat the egg whites. Whip until firm, stiff peaks develop, then set the meringue aside.", "name": "Add the 120 g granulated sugar gradually, approximately one spoonful at a time, while continuing to beat the egg whites. Whip until firm, stiff peaks develop, then set the meringue aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-7"}, {"@type": "HowToStep", "text": "Add the milk, neutral oil, and vanilla extract to the bowl containing the egg yolks. Mix until evenly incorporated.", "name": "Add the milk, neutral oil, and vanilla extract to the bowl containing the egg yolks. Mix until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-8"}, {"@type": "HowToStep", "text": "Sift the cake flour and baking powder directly into the yolk mixture. Stir until a smooth batter forms.", "name": "Sift the cake flour and baking powder directly into the yolk mixture. Stir until a smooth batter forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-9"}, {"@type": "HowToStep", "text": "Gently fold approximately one-third of the whipped egg whites into the yolk batter. Fold in the remaining egg whites, taking care to stop as soon as the mixture is evenly combined.", "name": "Gently fold approximately one-third of the whipped egg whites into the yolk batter. Fold in the remaining egg whites, taking care to stop as soon as the mixture is evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-10"}, {"@type": "HowToStep", "text": "Distribute the batter equally among the three prepared pans, using approximately 185–200 g of batter for each pan.", "name": "Distribute the batter equally among the three prepared pans, using approximately 185–200 g of batter for each pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-11"}, {"@type": "HowToStep", "text": "Tap the pans gently to release larger trapped air bubbles.", "name": "Tap the pans gently to release larger trapped air bubbles.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-12"}, {"@type": "HowToStep", "text": "Bake for 25–27 minutes, or until the cake layers are lightly golden.", "name": "Bake for 25–27 minutes, or until the cake layers are lightly golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-13"}, {"@type": "HowToStep", "text": "Immediately invert the baked cakes onto a wire rack and leave them upside down until completely cool. Once cooled, release the cakes from the pans and peel away the parchment paper.", "name": "Immediately invert the baked cakes onto a wire rack and leave them upside down until completely cool. Once cooled, release the cakes from the pans and peel away the parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-14"}, {"@type": "HowToStep", "text": "After both the cake layers and blueberry compote have cooled completely, place the whipping cream, confectioners’ sugar, 3 tablespoons of the prepared compote, and vanilla extract in a large mixing bowl.", "name": "After both the cake layers and blueberry compote have cooled completely, place the whipping cream, confectioners’ sugar, 3 tablespoons of the prepared compote, and vanilla extract in a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-15"}, {"@type": "HowToStep", "text": "Beat with a hand mixer until the cream reaches stiff peaks.", "name": "Beat with a hand mixer until the cream reaches stiff peaks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-16"}, {"@type": "HowToStep", "text": "Set the first cooled cake layer on a cake turntable.", "name": "Set the first cooled cake layer on a cake turntable.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-17"}, {"@type": "HowToStep", "text": "Cover the surface with a generous amount of blueberry whipped cream, then spoon and spread some of the blueberry compote into the center of the cream layer.", "name": "Cover the surface with a generous amount of blueberry whipped cream, then spoon and spread some of the blueberry compote into the center of the cream layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-18"}, {"@type": "HowToStep", "text": "Position the second cake layer on top. Repeat the same arrangement of blueberry whipped cream and compote.", "name": "Position the second cake layer on top. Repeat the same arrangement of blueberry whipped cream and compote.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-19"}, {"@type": "HowToStep", "text": "Place the third and final cake layer over the filling to complete the stack.", "name": "Place the third and final cake layer over the filling to complete the stack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-20"}, {"@type": "HowToStep", "text": "For greater stability during the final coating, the stacked cake may be chilled briefly before proceeding.", "name": "For greater stability during the final coating, the stacked cake may be chilled briefly before proceeding.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-21"}, {"@type": "HowToStep", "text": "Spread a thin layer of blueberry whipped cream over the entire stacked cake to form a crumb coat and trap loose crumbs.", "name": "Spread a thin layer of blueberry whipped cream over the entire stacked cake to form a crumb coat and trap loose crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-22"}, {"@type": "HowToStep", "text": "If desired, refrigerate the cake for approximately 10 minutes. The whipped-cream coating will not become firm in the same manner as buttercream, but brief chilling can help stabilize the layers.", "name": "If desired, refrigerate the cake for approximately 10 minutes. The whipped-cream coating will not become firm in the same manner as buttercream, but brief chilling can help stabilize the layers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-23"}, {"@type": "HowToStep", "text": "Apply a final, even coating of blueberry whipped cream over the top and sides of the cake.", "name": "Apply a final, even coating of blueberry whipped cream over the top and sides of the cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-24"}, {"@type": "HowToStep", "text": "Smooth the surface with a spatula or bench scraper, removing excess cream as necessary to create an even finish.", "name": "Smooth the surface with a spatula or bench scraper, removing excess cream as necessary to create an even finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-25"}, {"@type": "HowToStep", "text": "Arrange fresh or fully defrosted blueberries over the finished cake and add thyme sprigs as an optional garnish.", "name": "Arrange fresh or fully defrosted blueberries over the finished cake and add thyme sprigs as an optional garnish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-26"}, {"@type": "HowToStep", "text": "For additional color and presentation, a light dusting of confectioners’ sugar or a more abundant arrangement of blueberries may also be added.", "name": "For additional color and presentation, a light dusting of confectioners’ sugar or a more abundant arrangement of blueberries may also be added.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-chiffon-cake/#wprm-recipe-45142-step-0-27"}], "recipeCategory": ["cake", "Dessert"], "keywords": "Blueberry Chiffon Cake"}</script>
