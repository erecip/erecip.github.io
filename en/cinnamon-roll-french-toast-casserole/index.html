ve the refrigerated cinnamon rolls from their packaging, setting aside both containers of icing for later. Slice each cinnamon roll into six pieces by cutting it in half first, then dividing each half into three portions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roll-french-toast-casserole/#wprm-recipe-44885-step-0-0"}, {"@type": "HowToStep", "text": "Pour the melted butter into a 9 × 13-inch baking dish, distributing it evenly across the bottom. Arrange the cinnamon roll pieces throughout the dish in a single, even layer, separating them as needed to prevent clumping.", "name": "Pour the melted butter into a 9 × 13-inch baking dish, distributing it evenly across the bottom. Arrange the cinnamon roll pieces throughout the dish in a single, even layer, separating them as needed to prevent clumping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roll-french-toast-casserole/#wprm-recipe-44885-step-0-1"}, {"@type": "HowToStep", "text": "Place the eggs, whole milk, vanilla extract, and cinnamon in a separate bowl. Whisk thoroughly until the ingredients are evenly incorporated.", "name": "Place the eggs, whole milk, vanilla extract, and cinnamon in a separate bowl. Whisk thoroughly until the ingredients are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roll-french-toast-casserole/#wprm-recipe-44885-step-0-2"}, {"@type": "HowToStep", "text": "Pour the egg mixture uniformly over the cinnamon roll pieces. If using pecans, scatter the roughly chopped nuts over the top.", "name": "Pour the egg mixture uniformly over the cinnamon roll pieces. If using pecans, scatter the roughly chopped nuts over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roll-french-toast-casserole/#wprm-recipe-44885-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the baking dish to the preheated oven and bake for 30–35 minutes. The casserole is ready when the surface has developed a golden-brown color and the center is fully set.", "name": "Transfer the baking dish to the preheated oven and bake for 30–35 minutes. The casserole is ready when the surface has developed a golden-brown color and the center is fully set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roll-french-toast-casserole/#wprm-recipe-44885-step-0-4"}, {"@type": "HowToStep", "text": "While the casserole bakes, combine the sifted powdered sugar, softened cream cheese, and milk in a bowl. Whisk until the mixture becomes smooth and free of lumps.", "name": "While the casserole bakes, combine the sifted powdered sugar, softened cream cheese, and milk in a bowl. Whisk until the mixture becomes smooth and free of lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roll-french-toast-casserole/#wprm-recipe-44885-step-0-5"}, {"@type": "HowToStep", "text": "Add the two reserved containers of cinnamon roll icing and continue whisking until the frosting is completely blended and has a uniform consistency.", "name": "Add the two reserved containers of cinnamon roll icing and continue whisking until the frosting is completely blended and has a uniform consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roll-french-toast-casserole/#wprm-recipe-44885-step-0-6"}, {"@type": "HowToStep", "text": "Remove the finished casserole from the oven. Drizzle the prepared cream cheese icing evenly over the warm surface, using the desired amount.", "name": "Remove the finished casserole from the oven. Drizzle the prepared cream cheese icing evenly over the warm surface, using the desired amount.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-roll-french-toast-casserole/#wprm-recipe-44885-step-0-7"}, {"@type": "HowToStep", "text": "Serve the Cinnamon Roll French Toast Casserole while warm.", "name": "Serve the Cinnamon Roll French Toast Casserole while warm.", "url": "https://easy-r
