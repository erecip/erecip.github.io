irring continuously and allowing the mixture to cook for 1 to 2 minutes.", "name": "Incorporate the minced garlic, tomato paste, and Worcestershire sauce, stirring continuously and allowing the mixture to cook for 1 to 2 minutes.", "url": "https://erecip.github.io/en/beef-and-potatoes/#wprm-recipe-10791-step-0-1"}, {"@type": "HowToStep", "text": "Introduce the diced potatoes, carrots, and corn to the skillet, cooking for an additional 3 minutes while stirring.", "name": "Introduce the diced potatoes, carrots, and corn to the skillet, cooking for an additional 3 minutes while stirring.", "url": "https://erecip.github.io/en/beef-and-potatoes/#wprm-recipe-10791-step-0-2"}, {"@type": "HowToStep", "text": "Gradually pour in the beef broth, using a spatula to loosen any browned residue from the skillet’s bottom. Raise the heat to bring the mixture to a gentle boil, then reduce to medium-low, cover, and let simmer for 8 to 10 minutes, stirring occasionally, until the vegetables begin to soften.", "name": "Gradually pour in the beef broth, using a spatula to loosen any browned residue from the skillet’s bottom. Raise the heat to bring the mixture to a gentle boil, then reduce to medium-low, cover, and let simmer for 8 to 10 minutes, stirring occasionally, until the vegetables begin to soften.", "url": "https://erecip.github.io/en/beef-and-potatoes/#wprm-recipe-10791-step-0-3"}, {"@type": "HowToStep", "text": "Remove the lid and cook further until most of the liquid has evaporated. Adjust seasoning with additional salt and pepper if desired.", "name": "Remove the lid and cook further until most of the liquid has evaporated. Adjust seasoning with additional salt and pepper if desired.", "url": "https://erecip.github.io/en/beef-and-potatoes/#wprm-recipe-10791-step-0-4"}, {"@type": "HowToStep", "text": "Distribute the shredded cheese evenly across the top and transfer the skillet beneath a broiler for 2 to 3 minutes, or until the cheese melts and turns a golden hue.", "name": "
