    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Instant Pot Chicken Thighs Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, succulent chicken thighs prepared effortlessly in the Instant Pot. This method yields perfectly cooked meat every time, whether you choose bone-in, boneless, fresh, or frozen pieces, with an optional savory gravy to finish.", "datePublished": "2024-09-13T13:33:52+00:00", "image": ["https://erecip.github.io/en/instant-pot-chicken-thighs-recipe/Instant-Pot-Chicken-Thighs-Recipe.png", "https://erecip.github.io/en/instant-pot-chicken-thighs-recipe/Instant-Pot-Chicken-Thighs-Recipe.png", "https://erecip.github.io/en/instant-pot-chicken-thighs-recipe/Instant-Pot-Chicken-Thighs-Recipe.png", "https://erecip.github.io/en/instant-pot-chicken-thighs-recipe/Instant-Pot-Chicken-Thighs-Recipe.png"], "prepTime": "PT10M", "cookTime": "PT25M", "totalTime": "PT35M", "recipeIngredient": ["1 tablespoon olive oil", "½ teaspoon garlic powder", "1 tablespoon butter", "½ teaspoon paprika", "2 pounds chicken thighs (bone-in, skin-on (approximately 6–8 pieces))", "¼ teaspoon ground black pepper", "1 cup chicken stock or broth", "1 teaspoon salt", "½ teaspoon dried oregano"], "recipeInstructions": [{"@type": "HowToStep", "text": "Season the chicken thighs thoroughly with garlic powder, paprika, oregano, salt, and black pepper. Set the Instant Pot to the SAUTE function, add the olive oil, and melt the butter completely. Sear the chicken thighs starting with the skin side down for 2–3 minutes until golden, then turn and brown the other side for an additional 2 minutes. Remove the browned chicken and set aside, working in batches if required. Pour in the chicken stock and deglaze the pot, ensuring any browned bits are lifted from the bottom. Position a trivet inside the pot and arrange the chicken thighs atop it, allowing slight overlap if needed. Fasten the lid securely, set the valve to SEALING, and select PRESSURE COOK or MANUAL for 10 minutes on high pressure. The Instant Pot will take about 6–7 minutes to pressurize. Once the cooking cycle ends, let the steam release naturally for extra tender meat, or use quick release if preferred. Transfer the chicken thighs to a serving dish. To craft a gravy, activate the SAUTE mode, combine 1 tablespoon of cornstarch with 1 tablespoon of water, stir into the cooking liquid, and whisk until the sauce thickens. Adjust seasoning if necessary, then drizzle the sauce over the chicken and garnish with freshly chopped parsley.", "name": "Season the chicken thighs thoroughly with garlic powder, paprika, oregano, salt, and black pepper. Set the Instant Pot to the SAUTE function, add the olive oil, and melt the butter completely. Sear the chicken thighs starting with the skin side down for 2–3 minutes until golden, then turn and brown the other side for an additional 2 minutes. Remove the browned chicken and set aside, working in batches if required. Pour in the chicken stock and deglaze the pot, ensuring any browned bits are lifted from the bottom. Position a trivet inside the pot and arrange the chicken thighs atop it, allowing slight overlap if needed. Fasten the lid securely, set the valve to SEALING, and select PRESSURE COOK or MANUAL for 10 minutes on high pressure. The Instant Pot will take about 6–7 minutes to pressurize. Once the cooking cycle ends, let the steam release naturally for extra tender meat, or use quick release if preferred. Transfer the chicken thighs to a serving dish. To craft a gravy, activate the SAUTE mode, combine 1 tablespoon of cornstarch with 1 tablespoon of water, stir into the cooking liquid, and whisk until the sauce thickens. Adjust seasoning if necessary, then drizzle the sauce over the chicken and garnish with freshly chopped parsley.", "url": "https://erecip.github.io/en/instant-pot-chicken-thighs-recipe/#wprm-recipe-14180-step-0-0"}], "recipeCategory": ["Main Course"], "recip
