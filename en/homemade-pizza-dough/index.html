nter outward, then gently pull at the edges to expand. Maintain a slightly thicker edge to form the crust. If sticking occurs, dust with more flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-pizza-dough/#wprm-recipe-48970-step-0-4"}, {"@type": "HowToStep", "text": "Cut parchment paper into a round similar in size to the pizza. Place it on a pizza peel, inverted sheet pan, or cutting board, and carefully move the dough onto the parchment.", "name": "Cut parchment paper into a round similar in size to the pizza. Place it on a pizza peel, inverted sheet pan, or cutting board, and carefully move the dough onto the parchment.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-pizza-dough/#wprm-recipe-48970-step-0-5"}, {"@type": "HowToStep", "text": "Brush the dough surface lightly with olive oil, then top with your preferred sauce and toppings.", "name": "Brush the dough surface lightly with olive oil, then top with your preferred sauce and toppings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-pizza-dough/#wprm-recipe-48970-step-0-6"}, {"@type": "HowToStep", "text": "Lower the oven temperature to 450°F. Slide the pizza, parchment and all, onto the preheated stone. Bake for 9 to 12 minutes, or until the crust is golden and the cheese is bubbling.", "name": "Lower the oven temperature to 450°F. Slide the pizza, parchment and all, onto the preheated stone. Bake for 9 to 12 minutes, or until the crust is golden and the cheese is bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-pizza-dough/#wprm-recipe-48970-step-0-7"}], "recipeCategory": ["Entree"], "recipeCuisine": ["Italian"], "keywords": "Homemade Pizza Dough"}</script>
