    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Paleo Pumpkin Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warmly spiced, grain-free pumpkin loaf with a tender almond-flour crumb and subtle sweetness from pure maple syrup. The bread is suitable for serving on its own, transforming into French toast, or using as a foundation for other dishes.", "datePublished": "2022-11-18T16:03:08+00:00", "image": ["https://erecip.github.io/en/paleo-pumpkin-bread/paleo-pumpkin-bread2.png", "https://erecip.github.io/en/paleo-pumpkin-bread/paleo-pumpkin-bread2.png", "https://erecip.github.io/en/paleo-pumpkin-bread/paleo-pumpkin-bread2.png", "https://erecip.github.io/en/paleo-pumpkin-bread/paleo-pumpkin-bread2.png"], "cookTime": "PT60M", "totalTime": "PT65M", "recipeIngredient": ["⅓ cup pure Grade A amber maple syrup", "1 teaspoon pure vanilla extract", "3  large eggs (brought to room temperature)", "⅓ cup canned (full-fat coconut milk)", "1 cup pumpkin purée (such as Libby’s; organic may be used if preferred)", "1 tablespoon pumpkin pie spice blend", "Pinch of finely ground sea salt", "¼ cup tapioca starch", "½ teaspoon ground cinnamon", "1¾ cups finely milled (blanched almond flour)", "1 teaspoon baking soda", "1 tablespoon coconut flour"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Line an approximately 8½-by-4½-inch loaf pan with parchment paper, allowing a few inches of paper to extend beyond the sides for easier removal after baking.", "name": "Preheat the oven to 350°F (175°C). Line an approximately 8½-by-4½-inch loaf pan with parchment paper, allowing a few inches of paper to extend beyond the sides for easier removal after baking.", "url": "https://erecip.github.io/en/paleo-pumpkin-bread/#wprm-recipe-39500-step-0-0"}, {"@type": "HowToStep", "text": "Place the room-temperature eggs, pumpkin purée, full-fat coconut milk, maple syrup, and vanilla extract in a large mixing bowl. Whisk until the mixture is smooth, uniform, and thoroughly incorporated.", "name": "Place the room-temperature eggs, pumpkin purée, full-fat coconut milk, maple syrup, and vanilla extract in a large mixing bowl. Whisk until the mixture is smooth, uniform, and thoroughly incorporated.", "url": "https://erecip.github.io/en/paleo-pumpkin-bread/#wprm-recipe-39500-step-0-1"}, {"@type": "HowToStep", "text": "In a separate medium bowl, combine the almond flour, tapioca starch, coconut flour, baking soda, pumpkin spice, cinnamon, and fine sea salt. Whisk until the leavening and spices are distributed evenly throughout the flours.", "name": "In a separate medium bowl, combine the almond flour, tapioca starch, coconut flour, baking soda, pumpkin spice, cinnamon, and fine sea salt. Whisk until the leavening and spices are distributed evenly throughout the flours.", "url": "https://erecip.github.io/en/paleo-pumpkin-bread/#wprm-recipe-39500-step-0-2"}, {"@type": "HowToStep", "text": "Gradually add the dry mixture to the bowl containing the wet ingredients. Stir gently only until no visible pockets of dry flour remain. Avoid excessive mixing.", "name": "Gradually add the dry mixture to the bowl containing the wet ingredients. Stir gently only until no visible pockets of dry flour remain. Avoid excessive mixing.", "url": "https://erecip.github.io/en/paleo-pumpkin-bread/#wprm-recipe-39500-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the prepared batter to the parchment-lined pan. Use a spatula to scrape the bowl thoroughly and spread the batter evenly within the pan.", "name": "Transfer the prepared batter to the parchment-lined pan. Use a spatula to scrape the bowl thoroughly and spread the batter evenly within the pan.", "url": "https://erecip.github.io/en/paleo-pumpkin-bread/#wprm-recipe-39500-step-0-4"}, {"@type": "HowToStep", "text": "Place the pan in the preheated oven and bake for approximately 1 hour. The bread is ready when its surface is deeply golden and a toothpick inserted into the center emerges clean. Rotate the pan halfway through baking when necessary to encourage even browning.", "name": "Place the pan in the preheated oven and bake for approximately 1 hour. The bread is ready when its surface is deeply golden and a toothpick inserted into the center emerges clean. Rotate the pan halfway through baking when necessary to encourage even browning.", "url": "https://erecip.github.io/en/paleo-pumpkin-bread/#wprm-recipe-39500-step-0-5"}, {"@type": "HowToStep", "text": "Remove the baked loaf from the oven and leave it in the pan for about 5 minutes.", "name": "Remove the baked loaf from the oven and leave it in the pan for about 5 minutes.", "url": "https://erecip.github.io/en/paleo-pumpkin-bread/#wprm-recipe-39500-step-0-6"}, {"@type": "HowToStep", "text": "Lift the bread from the pan using the extended parchment edges and place it on a wire cooling rack. Allow the loaf to cool completely for at least 2 hours before cutting so the interior crumb can set properly and produce cleaner slices.", "name": "Lift the bread from the pan using the extended parchment edges and place it on a wire cooling rack. Allow the loaf to cool completely for at least 2 hours before cutting so the interior crumb can set properly and produce cleaner slices.", "url": "https://erecip.github.io/en/paleo-pumpkin-bread/#wprm-recipe-39500-step-0-7"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Paleo Pumpkin Bread"}</script>
