    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Melt in Your Mouth Pumpkin Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, tender pumpkin cookies are delicately flavored with cinnamon and vanilla, then finished with a smooth brown sugar frosting. The result is a rich, cake-like cookie with a light pumpkin flavor and a sweet, buttery topping.", "datePublished": "2022-12-07T00:55:23+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/melt-in-your-mouth-pumpkin-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/melt-in-your-mouth-pumpkin-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/melt-in-your-mouth-pumpkin-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/melt-in-your-mouth-pumpkin-cookies.png"], "prepTime": "PT25M", "cookTime": "PT10M", "totalTime": "PT65M", "recipeIngredient": ["1  can (15 ounces pure pumpkin puree)", "1 teaspoon fine salt", "2  large eggs", "2 teaspoons pure vanilla extract", "1 teaspoon ground cinnamon", "4 cups all-purpose flour", "2 teaspoons baking powder", "2 cups granulated white sugar", "2 teaspoons baking soda", "2 cups unsalted butter (brought to room temperature and softened)", "2 3/4 cups confectioners’ sugar", "1/4 cup milk", "1 teaspoon vanilla extract", "1/2 cup packed light brown sugar", "1/2 cup unsalted butter", "Ground cinnamon (optional, for a finishing sprinkle)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened unsalted butter in a large mixing bowl. Using an electric mixer set to medium-high speed, beat the butter for approximately 30 seconds, or until creamy.", "name": "Place the softened unsalted butter in a large mixing bowl. Using an electric mixer set to medium-high speed, beat the butter for approximately 30 seconds, or until creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-1"}, {"@type": "HowToStep", "text": "Add the granulated sugar, baking powder, baking soda, salt, and ground cinnamon. Continue beating until the ingredients are thoroughly incorporated, scraping down the sides of the bowl as necessary.", "name": "Add the granulated sugar, baking powder, baking soda, salt, and ground cinnamon. Continue beating until the ingredients are thoroughly incorporated, scraping down the sides of the bowl as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-2"}, {"@type": "HowToStep", "text": "Add the eggs and vanilla extract. Beat again until evenly blended.", "name": "Add the eggs and vanilla extract. Beat again until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-3"}, {"@type": "HowToStep", "text": "Mix in the pumpkin puree and continue beating until the batter appears smooth and uniform.", "name": "Mix in the pumpkin puree and continue beating until the batter appears smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-4"}, {"@type": "HowToStep", "text": "Gradually incorporate as much of the flour as the mixer can comfortably handle. If the dough becomes too thick for the mixer, use a wooden spoon to stir in the remaining flour until evenly combined. Avoid excessive mixing so the finished cookies remain tender.", "name": "Gradually incorporate as much of the flour as the mixer can comfortably handle. If the dough becomes too thick for the mixer, use a wooden spoon to stir in the remaining flour until evenly combined. Avoid excessive mixing so the finished cookies remain tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-5"}, {"@type": "HowToStep", "text": "Scoop the prepared pumpkin dough in generously rounded teaspoonfuls and arrange them on ungreased cookie sheets, leaving approximately 2 inches of space between each portion.", "name": "Scoop the prepared pumpkin dough in generously rounded teaspoonfuls and arrange them on ungreased cookie sheets, leaving approximately 2 inches of space between each portion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-6"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 10 to 12 minutes, or until the tops appear set and lightly spring back when gently touched.", "name": "Bake in the preheated oven for 10 to 12 minutes, or until the tops appear set and lightly spring back when gently touched.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the baked cookies carefully to a wire cooling rack. Allow them to cool completely before adding the frosting so the topping does not melt.", "name": "Transfer the baked cookies carefully to a wire cooling rack. Allow them to cool completely before adding the frosting so the topping does not melt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-8"}, {"@type": "HowToStep", "text": "Place the unsalted butter and packed light brown sugar in a small saucepan over medium heat.", "name": "Place the unsalted butter and packed light brown sugar in a small saucepan over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-9"}, {"@type": "HowToStep", "text": "Stir continuously as the butter and sugar melt together, continuing until the mixture is smooth. Remove the saucepan from the heat.", "name": "Stir continuously as the butter and sugar melt together, continuing until the mixture is smooth. Remove the saucepan from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-10"}, {"@type": "HowToStep", "text": "Transfer the warm brown sugar mixture to a medium mixing bowl.", "name": "Transfer the warm brown sugar mixture to a medium mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-11"}, {"@type": "HowToStep", "text": "Stir in the milk and vanilla extract until completely blended.", "name": "Stir in the milk and vanilla extract until completely blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-12"}, {"@type": "HowToStep", "text": "Gradually beat in the confectioners’ sugar until the frosting becomes smooth and easy to spread. Sifting the confectioners’ sugar beforehand can help produce a lump-free texture.", "name": "Gradually beat in the confectioners’ sugar until the frosting becomes smooth and easy to spread. Sifting the confectioners’ sugar beforehand can help produce a lump-free texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-13"}, {"@type": "HowToStep", "text": "If necessary, incorporate a small splash of additional milk to loosen the frosting until it reaches a smooth, spreadable consistency.", "name": "If necessary, incorporate a small splash of additional milk to loosen the frosting until it reaches a smooth, spreadable consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-14"}, {"@type": "HowToStep", "text": "Once the cookies have cooled completely, spread a generous coating of brown sugar frosting over the top of each cookie.", "name": "Once the cookies have cooled completely, spread a generous coating of brown sugar frosting over the top of each cookie.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-15"}, {"@type": "HowToStep", "text": "If desired, dust the frosted cookies lightly with ground cinnamon for additional warmth, flavor, and decoration.", "name": "If desired, dust the frosted cookies lightly with ground cinnamon for additional warmth, flavor, and decoration.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-16"}, {"@type": "HowToStep", "text": "Allow the frosting to set before serving.", "name": "Allow the frosting to set before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/melt-in-your-mouth-pumpkin-cookies/#wprm-recipe-41163-step-0-17"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Melt in Your Mouth Pumpkin Cookies"}</script>
