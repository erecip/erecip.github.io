 "text": "Warm 1 tablespoon of olive oil in a 12-inch nonstick skillet set over medium-high heat.", "name": "Warm 1 tablespoon of olive oil in a 12-inch nonstick skillet set over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-0"}, {"@type": "HowToStep", "text": "Pat the chicken thoroughly with paper towels to remove surface moisture.", "name": "Pat the chicken thoroughly with paper towels to remove surface moisture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-1"}, {"@type": "HowToStep", "text": "Season the chicken with kosher salt, freshly ground black pepper, 2 teaspoons Italian seasoning, 1/2 teaspoon garlic powder, 1/2 teaspoon onion powder, and 1 teaspoon lemon zest.", "name": "Season the chicken with kosher salt, freshly ground black pepper, 2 teaspoons Italian seasoning, 1/2 teaspoon garlic powder, 1/2 teaspoon onion powder, and 1 teaspoon lemon zest.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-2"}, {"@type": "HowToStep", "text": "Toss or turn the chicken until the seasonings are distributed evenly over the pieces. The seasoning may be applied directly on the cutting board for convenience.", "name": "Toss or turn the chicken until the seasonings are distributed evenly over the pieces. The seasoning may be applied directly on the cutting board for convenience.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-3"}, {"@type": "HowToStep", "text": "Add 1 tablespoon of unsalted butter to the heated skillet containing the olive oil and allow it to melt.", "name": "Add 1 tablespoon of unsalted butter to the heated skillet containing the olive oil and allow it to melt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-4"}, {"@type": "HowToStep", "text": "Arrange the seasoned chicken in the skillet and cook for approximately 3 minutes on the first side.", "name": "Arrange the seasoned chicken in the skillet and cook for approximately 3 minutes on the first side.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-5"}, {"@type": "HowToStep", "text": "Turn the chicken over and continue cooking for about 3 additional minutes, or until the thickest pieces register an internal temperature of 165°F.", "name": "Turn the chicken over and continue cooking for about 3 additional minutes, or until the thickest pieces register an internal temperature of 165°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the fully cooked chicken to a plate and loosely cover it with foil to retain its warmth.", "name": "Transfer the fully cooked chicken to a plate and loosely cover it with foil to retain its warmth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-7"}, {"@type": "HowToStep", "text": "Using the same skillet, add the remaining 1 tablespoon olive oil and 1 tablespoon unsalted butter. Heat over medium-high heat.", "name": "Using the same skillet, add the remaining 1 tablespoon olive oil and 1 tablespoon unsalted butter. Heat over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-8"}, {"@type": "HowToStep", "text": "Place the zucchini and yellow squash in the skillet, then season them with kosher salt, 1 teaspoon Italian seasoning, and 1/2 teaspoon garlic powder.", "name": "Place the zucchini and yellow squash in the skillet, then season them with kosher salt, 1 teaspoon Italian seasoning, and 1/2 teaspoon garlic powder.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-9"}, {"@type": "HowToStep", "text": "Cook for approximately 4 minutes, tossing occasionally, until the vegetables become just tender.", "name": "Cook for approximately 4 minutes, tossing occasionally, until the vegetables become just tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-10"}, {"@type": "HowToStep", "text": "Return the cooked chicken to the skillet with the sautéed zucchini and yellow squash.", "name": "Return the cooked chicken to the skillet with the sautéed zucchini and yellow squash.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-11"}, {"@type": "HowToStep", "text": "Pour the fresh lemon juice over the mixture and toss gently until the chicken and vegetables are evenly coated.", "name": "Pour the fresh lemon juice over the mixture and toss gently until the chicken and vegetables are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-12"}, {"@type": "HowToStep", "text": "Scatter the grated Parmesan and chopped parsley over the dish before serving.", "name": "Scatter the grated Parmesan and chopped parsley over the dish before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-13"}, {"@type": "HowToStep", "text": "Serve warm, adding more Parmesan cheese and fresh lemon zest as desired.", "name": "Serve warm, adding more Parmesan cheese and fresh lemon zest as desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-zucchini-and-squash/#wprm-recipe-41907-step-0-14"}], "recipeCate
