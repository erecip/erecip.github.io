    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Air Fryer Baked Apples", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender apple wedges are coated in a warmly spiced maple mixture and cooked in the air fryer until soft and lightly caramelized. This simple plant-based dessert may be served alone or paired with a preferred topping.", "datePublished": "2021-07-31T02:34:29+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/air-fryer-baked-apples2.png", "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/air-fryer-baked-apples2.png", "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/air-fryer-baked-apples2.png", "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/air-fryer-baked-apples2.png"], "cookTime": "PT12M", "totalTime": "PT12M", "recipeIngredient": ["4  large Granny Smith or Honeycrisp apples", "1 tablespoon tapioca starch or cornstarch", "1 teaspoon finely ground cinnamon", "1 tablespoon vegan butter or margarine (melted and allowed to cool, optional)", "3 tablespoons pure maple syrup", "¼ cup water (for the base of the air fryer)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a medium mixing bowl, whisk together the maple syrup, cinnamon, tapioca starch or cornstarch, and the melted vegan butter or margarine, when using. Continue mixing until the coating becomes smooth and evenly combined.", "name": "In a medium mixing bowl, whisk together the maple syrup, cinnamon, tapioca starch or cornstarch, and the melted vegan butter or margarine, when using. Continue mixing until the coating becomes smooth and evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/#wprm-recipe-40701-step-0-0"}, {"@type": "HowToStep", "text": "Rinse the apples thoroughly and remove any produce stickers. Cut each apple into eight wedges, discarding the core and seeds.", "name": "Rinse the apples thoroughly and remove any produce stickers. Cut each apple into eight wedges, discarding the core and seeds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/#wprm-recipe-40701-step-0-1"}, {"@type": "HowToStep", "text": "Place the apple wedges in the bowl containing the maple-cinnamon mixture. Toss carefully until every piece is evenly covered.", "name": "Place the apple wedges in the bowl containing the maple-cinnamon mixture. Toss carefully until every piece is evenly covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/#wprm-recipe-40701-step-0-2"}, {"@type": "HowToStep", "text": "Pour ¼ cup of water into the bottom of the air fryer beneath the basket. This added moisture helps prevent the apples from drying out as they cook.", "name": "Pour ¼ cup of water into the bottom of the air fryer beneath the basket. This added moisture helps prevent the apples from drying out as they cook.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/#wprm-recipe-40701-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the coated apple wedges inside the air fryer basket in a single, uniform layer.", "name": "Arrange the coated apple wedges inside the air fryer basket in a single, uniform layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/#wprm-recipe-40701-step-0-4"}, {"@type": "HowToStep", "text": "Air-fry the apples at 380°F (193°C) for 12–15 minutes. Stir or turn the wedges every five minutes to promote even cooking.", "name": "Air-fry the apples at 380°F (193°C) for 12–15 minutes. Stir or turn the wedges every five minutes to promote even cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/#wprm-recipe-40701-step-0-5"}, {"@type": "HowToStep", "text": "Check the apples a few minutes before the full cooking time has elapsed, as air fryer performance may vary. The wedges are ready when they can be easily pierced with a fork.", "name": "Check the apples a few minutes before the full cooking time has elapsed, as air fryer performance may vary. The wedges are ready when they can be easily pierced with a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/#wprm-recipe-40701-step-0-6"}, {"@type": "HowToStep", "text": "Carefully transfer the cooked apples from the basket to a serving dish. Serve them warm on their own or accompany them with vegan ice cream or an additional dusting of cinnamon.", "name": "Carefully transfer the cooked apples from the basket to a serving dish. Serve them warm on their own or accompany them with vegan ice cream or an additional dusting of cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-baked-apples/#wprm-recipe-40701-step-0-7"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Air Fryer Baked Apples"}</script>
