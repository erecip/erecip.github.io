    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Homemade Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This homemade cottage cheese is prepared by gently warming milk, curdling it with distilled white vinegar, and draining away the whey. The finished curds may be rinsed for a milder flavor and combined with cream and salt for a softer, richer consistency.", "datePublished": "2021-11-03T00:40:34+00:00", "image": ["https://erecip.github.io/en/cottage-cheese-homemade-recipe/cottage-cheese-homemade-recipe.png", "https://erecip.github.io/en/cottage-cheese-homemade-recipe/cottage-cheese-homemade-recipe.png", "https://erecip.github.io/en/cottage-cheese-homemade-recipe/cottage-cheese-homemade-recipe.png", "https://erecip.github.io/en/cottage-cheese-homemade-recipe/cottage-cheese-homemade-recipe.png"], "prepTime": "PT5M", "totalTime": "PT35M", "recipeIngredient": ["¾ cup distilled white vinegar", "Cream (optional, added as desired for a richer and creamier consistency)", "1 gallon milk", "Salt (optional, adjusted according to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Measure the gallon of milk and ¾ cup of distilled white vinegar before beginning. Keep cream and salt nearby if you plan to use them when finishing the cheese.", "name": "Measure the gallon of milk and ¾ cup of distilled white vinegar before beginning. Keep cream and salt nearby if you plan to use them when finishing the cheese.", "url": "https://erecip.github.io/en/cottage-cheese-homemade-recipe/#wprm-recipe-44895-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the milk to a heavy-bottomed saucepan, ideally one made from stainless steel or cast iron. Heat gently over medium heat, stirring from time to time to prevent scorching.", "name": "Transfer the milk to a heavy-bottomed saucepan, ideally one made from stainless steel or cast iron. Heat gently over medium heat, stirring from time to time to prevent scorching.", "url": "https://erecip.github.io/en/cottage-cheese-homemade-recipe/#wprm-recipe-44895-step-0-1"}, {"@type": "HowToStep", "text": "Continue warming until the milk reaches 120°F (49°C). Reaching this temperature should require approximately 20–25 minutes.", "name": "Continue warming until the milk reaches 120°F (49°C). Reaching this temperature should require approximately 20–25 minutes.", "url": "https://erecip.github.io/en/cottage-cheese-homemade-recipe/#wprm-recipe-44895-step-0-2"}, {"@type": "HowToStep", "text": "As soon as the milk reaches 120°F (49°C), remove the saucepan from the heat. Gradually pour in the ¾ cup distilled white vinegar, stirring gently for approximately 1–2 minutes.", "name": "As soon as the milk reaches 120°F (49°C), remove the saucepan from the heat. Gradually pour in the ¾ cup distilled white vinegar, stirring gently for approximately 1–2 minutes.", "url": "https://erecip.github.io/en/cottage-cheese-homemade-recipe/#wprm-recipe-44895-step-0-3"}, {"@type": "HowToStep", "text": "During this stage, the milk will begin separating into visible curds and liquid whey.", "name": "During this stage, the milk will begin separating into visible curds and liquid whey.", "url": "https://erecip.github.io/en/cottage-cheese-homemade-recipe/#wprm-recipe-44895-step-0-4"}, {"@type": "HowToStep", "text": "Place a lid over the saucepan and leave the mixture undisturbed for 30 minutes. This resting time allows the curds to fully form.", "name": "Place a lid over the saucepan and leave the mixture undisturbed for 30 minutes. This resting time allows the curds to fully form.", "url": "https://erecip.github.io/en/cottage-cheese-homemade-recipe/#wprm-recipe-44895-step-0-5"}, {"@type": "HowToStep", "text": "Line a colander or fine-mesh strainer with cheesecloth or a clean flour-sack towel. Carefully transfer the curds and whey into the prepared strainer, allowing the liquid to drain away.", "name": "Line a colander or fine-mesh strainer with cheesecloth or a clean flour-sack towel. Carefully transfer the curds and whey into the prepared strainer, allowing the liquid to drain away.", "url": "https://erecip.github.io/en/cottage-cheese-homemade-recipe/#wprm-recipe-44895-step-0-6"}, {"@type": "HowToStep", "text": "Leave the curds to drain for approximately 5 minutes, checking afterward to determine whether additional whey is still dripping from them.", "name": "Leave the curds to drain for approximately 5 minutes, checking afterward to determine whether additional whey is still dripping from them.", "url": "https://erecip.github.io/en/cottage-cheese-homemade-recipe/#wprm-recipe-44895-step-0-7"}, {"@type": "HowToStep", "text": "For a milder flavor, gather the curds together and rinse them under cold running water for 3–5 minutes. This optional step helps remove any lingering vinegar flavor.", "name": "For a milder flavor, gather the curds together and rinse them under cold running water for 3–5 minutes. This optional step helps remove any lingering vinegar flavor.", "url": "https://erecip.github.io/en/cottage-cheese-homemade-recipe/#wprm-recipe-44895-step-0-8"}, {"@type": "HowToStep", "text": "Break the drained curds apart. If desired, blend in cream until the cottage cheese reaches your preferred level of creaminess, then season with salt to taste.", "name": "Break the drained curds apart. If desired, blend in cream until the cottage cheese reaches your preferred level of creaminess, then season with salt to taste.", "url": "https://erecip.github.io/en/cottage-cheese-homemade-recipe/#wprm-recipe-44895-step-0-9"}], "recipeCuisine": ["General"], "keywords": "Cottage Cheese Homemade Recipe"}</script>
