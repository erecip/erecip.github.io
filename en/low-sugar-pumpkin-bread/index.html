h.", "name": "Crack the room-temperature eggs into a large mixing bowl and beat them until smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/low-sugar-pumpkin-bread/#wprm-recipe-39448-step-0-1"}, {"@type": "HowToStep", "text": "Add the pumpkin purée, followed by the oil, plain yogurt, or chosen mixture of the two. Stir in the granulated sugar and continue mixing until the wet ingredients are thoroughly combined and uniform.", "name": "Add the pumpkin purée, followed by the oil, plain yogurt, or chosen mixture of the two. Stir in the granulated sugar and continue mixing until the wet ingredients are thoroughly combined and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/low-sugar-pumpkin-bread/#wprm-recipe-39448-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk together the flour, baking soda, baking powder, pumpkin pie spice, and salt. Continue whisking until the dry mixture is evenly distributed and free of visible lumps.", "name": "In a separate bowl, whisk together the flour, baking soda, baking powder, pumpkin pie spice, and salt. Continue whisking until the dry mixture is evenly distributed and free of visible lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/low-sugar-pumpkin-bread/#wprm-recipe-39448-step-0-3"}, {"@type": "HowToStep", "text": "Gradually fold the dry ingredients into the pumpkin mixture. Stir gently and stop as soon as the flour has been incorporated and no dry streaks remain.", "name": "Gradually fold the dry ingredients into the pumpkin mixture. Stir gently and stop as soon as the flour has been incorporated and no dry streaks remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/low-sugar-pumpkin-bread/#wprm-recipe-39448-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared loaf pan. Use a spatula to level the surface when necessary.", "name": "Transfer the batter to the prepared loaf pan. Use a spatula to level the surface when necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/low-sugar-pumpkin-bread/#wprm-recipe-39448-step-0-5"}, {"@type": "HowToStep", "text": "Bake for approximately 60 minutes. Begin checking the loaf after 55 minutes by inserting a knife into the center. The bread is ready when the knife comes out mostly clean. Continue baking for a few additional minutes when needed.", "name": "Bake for approximately 60 minutes. Begin checking the loaf after 55 minutes by inserting a knife into the center. The bread is ready when the knife comes out mostly clean. Continue baking for a few additional minutes when needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/low-sugar-pumpkin-bread/#wprm-recipe-39448-step-0-6"}, {"@type": "HowToStep", "text": "Allow the pumpkin bread to cool completely in the pan. Once cooled, use the parchment-paper overhang to lift the loaf from the pan, then cut it into slices and serve.", "name": "Allow the pumpkin bread to cool completely in the pan. Once cooled, use the parchment-paper overhang to lift the loaf from the pan, then cut it into slices and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/low-sugar-pumpkin-bread/#wprm-recipe-39448-step-0-7"}], "recipeCategory": ["Bread", "Breakfast", "Snack"], "recipeCuisine": ["American"], "keywords": "Low-Sugar Pumpkin Bread"}</script>
