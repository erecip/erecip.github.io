.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/soft-dinner-rolls-recipe/#wprm-recipe-25769-step-0-4"}, {"@type": "HowToStep", "text": "Arrange the rolls evenly on a greased quarter-sheet pan or a 9x13-inch baking dish. Cover again and allow them to rise for an additional 30 minutes at room temperature.", "name": "Arrange the rolls evenly on a greased quarter-sheet pan or a 9x13-inch baking dish. Cover again and allow them to rise for an additional 30 minutes at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/soft-dinner-rolls-recipe/#wprm-recipe-25769-step-0-5"}, {"@type": "HowToStep", "text": "Meanwhile, preheat the oven to 375°F. Bake the rolls for 12 to 15 minutes until the tops are golden brown and the interiors are thoroughly cooked. If needed, cover loosely with foil to prevent over-browning.", "name": "Meanwhile, preheat the oven to 375°F. Bake the rolls for 12 to 15 minutes until the tops are golden brown and the interiors are thoroughly cooked. If needed, cover loosely with foil to prevent over-browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/soft-dinner-rolls-recipe/#wprm-recipe-25769-step-0-6"}, {"@type": "HowToStep", "text": "Remove from the oven and brush the hot rolls with melted butter. Serve immediately, or let cool and store in an airtight bag for up to three days.", "name": "Remove from the oven and brush the hot rolls with melted butter. Serve immediately, or let cool and store in an airtight bag for up to three days.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/soft-dinner-rolls-recipe/#wprm-recipe-25769-step-0-7"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "soft dinner rolls recipe"}</script>
