    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Herb Stuffing", "author": {"@type": "Person", "name": "BenDes"}, "description": "A savory, herb-forward stuffing made with toasted bread, buttery onions and celery, fresh garlic, aromatic herbs, and a broth-and-egg mixture that creates a moist interior with a crisp, golden surface.", "datePublished": "2018-03-12T21:48:29+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/herb-stuffing2.png", "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/herb-stuffing2.png", "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/herb-stuffing2.png", "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/herb-stuffing2.png"], "prepTime": "PT30M", "cookTime": "PT50M", "totalTime": "PT90M", "recipeIngredient": ["2  large eggs (brought to room temperature)", "2 cups celery (cut into approximately 1/2-inch dice)", "3 tablespoons finely chopped fresh parsley", "1 cup unsalted butter", "6  fresh garlic cloves (finely minced)", "18  –24 ounces bread (cut into 1/2-inch cubes, about 12–14 cups, toasted or allowed to become stale)", "3 tablespoons chopped fresh rosemary (or 1 tablespoon dried rosemary)", "2 1/2 cups low-sodium chicken broth or vegetable broth", "Kosher salt (as needed)", "3 cups sweet onion (chopped into roughly 1/2-inch pieces, about 2 large onions)", "Freshly ground black pepper (to taste)", "3 tablespoons chopped fresh sage (or 1 tablespoon dried sage)", "Fresh sage (parsley, or rosemary, for sprinkling)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Cut the bread into approximately 1/2-inch cubes and arrange them across a baking sheet. If the bread is already stale and dry, no additional drying is necessary.", "name": "Cut the bread into approximately 1/2-inch cubes and arrange them across a baking sheet. If the bread is already stale and dry, no additional drying is necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-0"}, {"@type": "HowToStep", "text": "For fresh bread, bake the cubes at 350°F for about 15 minutes, stirring them halfway through, until dry and lightly golden. Properly dried bread absorbs the broth more evenly without becoming overly soft or mushy.", "name": "For fresh bread, bake the cubes at 350°F for about 15 minutes, stirring them halfway through, until dry and lightly golden. Properly dried bread absorbs the broth more evenly without becoming overly soft or mushy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-1"}, {"@type": "HowToStep", "text": "Allow the toasted bread to cool slightly, then place it in a large mixing bowl.", "name": "Allow the toasted bread to cool slightly, then place it in a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-2"}, {"@type": "HowToStep", "text": "Melt the unsalted butter in a large skillet set over medium heat. Once the butter has melted and begins to foam, add the chopped sweet onion, diced celery, and a small amount of kosher salt.", "name": "Melt the unsalted butter in a large skillet set over medium heat. Once the butter has melted and begins to foam, add the chopped sweet onion, diced celery, and a small amount of kosher salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-3"}, {"@type": "HowToStep", "text": "Cook for 8–10 minutes, stirring from time to time, until the vegetables are tender and translucent and the onion develops a slight caramelized color.", "name": "Cook for 8–10 minutes, stirring from time to time, until the vegetables are tender and translucent and the onion develops a slight caramelized color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-4"}, {"@type": "HowToStep", "text": "Stir in the freshly minced garlic and continue cooking for approximately 1 minute, just until the garlic becomes fragrant.", "name": "Stir in the freshly minced garlic and continue cooking for approximately 1 minute, just until the garlic becomes fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-5"}, {"@type": "HowToStep", "text": "Add the sage, parsley, and rosemary to the skillet. If using dried sage or rosemary instead of fresh, use the specified dried quantities. Cook the herbs with the vegetables for 1 minute while stirring continuously to release their aromatic oils.", "name": "Add the sage, parsley, and rosemary to the skillet. If using dried sage or rosemary instead of fresh, use the specified dried quantities. Cook the herbs with the vegetables for 1 minute while stirring continuously to release their aromatic oils.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-6"}, {"@type": "HowToStep", "text": "Season with freshly ground black pepper, then pour in 1 cup of the chicken or vegetable broth. Scrape the bottom of the skillet to loosen any browned, flavorful pieces and allow the mixture to simmer for another minute.", "name": "Season with freshly ground black pepper, then pour in 1 cup of the chicken or vegetable broth. Scrape the bottom of the skillet to loosen any browned, flavorful pieces and allow the mixture to simmer for another minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-7"}, {"@type": "HowToStep", "text": "Pour the hot vegetable, herb, broth, and butter mixture over the prepared bread cubes in the large bowl.", "name": "Pour the hot vegetable, herb, broth, and butter mixture over the prepared bread cubes in the large bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-8"}, {"@type": "HowToStep", "text": "Gently toss until the bread is evenly coated and the vegetables and herbs are distributed throughout. The warmth and moisture of the mixture should begin softening the bread without completely saturating it.", "name": "Gently toss until the bread is evenly coated and the vegetables and herbs are distributed throughout. The warmth and moisture of the mixture should begin softening the bread without completely saturating it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-9"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the remaining 1 1/2 cups of chicken or vegetable broth together with the 2 room-temperature eggs until completely blended.", "name": "In a separate bowl, whisk the remaining 1 1/2 cups of chicken or vegetable broth together with the 2 room-temperature eggs until completely blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-10"}, {"@type": "HowToStep", "text": "The egg-and-broth mixture provides the moisture and structure needed to produce stuffing that remains cohesive rather than dry and crumbly.", "name": "The egg-and-broth mixture provides the moisture and structure needed to produce stuffing that remains cohesive rather than dry and crumbly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-11"}, {"@type": "HowToStep", "text": "Transfer the stuffing to a buttered baking dish and spread it into an even layer.", "name": "Transfer the stuffing to a buttered baking dish and spread it into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-12"}, {"@type": "HowToStep", "text": "Bake at 350°F for 45–50 minutes, or until the surface is golden brown and a knife inserted into the center comes out clean.", "name": "Bake at 350°F for 45–50 minutes, or until the surface is golden brown and a knife inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-13"}, {"@type": "HowToStep", "text": "If the surface begins browning too rapidly, cover the dish with foil for approximately the first 30 minutes of baking. Remove the foil for the final 15–20 minutes so the top can develop a crisp, golden finish.", "name": "If the surface begins browning too rapidly, cover the dish with foil for approximately the first 30 minutes of baking. Remove the foil for the final 15–20 minutes so the top can develop a crisp, golden finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-14"}, {"@type": "HowToStep", "text": "Remove the herb stuffing from the oven and allow it to rest for 10 minutes. This brief resting period helps the interior set and makes the stuffing easier to portion.", "name": "Remove the herb stuffing from the oven and allow it to rest for 10 minutes. This brief resting period helps the interior set and makes the stuffing easier to portion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-15"}, {"@type": "HowToStep", "text": "Immediately before serving, scatter fresh sage, parsley, rosemary, or a combination of the herbs over the top for additional color and fresh herbal flavor.", "name": "Immediately before serving, scatter fresh sage, parsley, rosemary, or a combination of the herbs over the top for additional color and fresh herbal flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-stuffing/#wprm-recipe-44049-step-0-16"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Herb Stuffing"}</script>
