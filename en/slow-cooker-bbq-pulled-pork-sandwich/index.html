ne all sauce ingredients in a medium saucepan and whisk until smooth. Bring to a gentle boil over medium heat, then reduce to a low simmer and cook for 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-bbq-pulled-pork-sandwich/#wprm-recipe-26122-step-0-4"}, {"@type": "HowToStep", "text": "Once the pork is ready, shred it using forks until it is completely tender and falls apart effortlessly.", "name": "Once the pork is ready, shred it using forks until it is completely tender and falls apart effortlessly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-bbq-pulled-pork-sandwich/#wprm-recipe-26122-step-0-5"}, {"@type": "HowToStep", "text": "Coat the shredded pork with the prepared BBQ sauce, adding as much as desired. The recipe yields enough sauce to generously flavor the meat without overwhelming it, with some reserved for serving.", "name": "Coat the shredded pork with the prepared BBQ sauce, adding as much as desired. The recipe yields enough sauce to generously flavor the meat without overwhelming it, with some reserved for serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-bbq-pulled-pork-sandwich/#wprm-recipe-26122-step-0-6"}, {"@type": "HowToStep", "text": "For assembly, heap the pulled pork onto warm sandwich rolls and garnish with coleslaw. Serve buffet-style for guests to build their own sandwiches.", "name": "For assembly, heap the pulled pork onto warm sandwich rolls and garnish with coleslaw. Serve buffet-style for guests to build their own sandwiches.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-bbq-pulled-pork-sandwich/#wprm-recipe-26122-step-0-7"}]}</script>
