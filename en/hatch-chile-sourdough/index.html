    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Hatch Chile Sourdough", "author": {"@type": "Person", "name": "BenDes"}, "description": "A naturally leavened sourdough loaf filled with well-drained Hatch green chile and cubes of smoky Gouda cheese. A series of stretch-and-folds builds strength while distributing the savory additions throughout the dough, followed by an extended fermentation and overnight cold proof for deeper flavor and a well-developed crumb.", "datePublished": "2021-05-20T15:36:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/hatch-chile-sourdough1.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/hatch-chile-sourdough1-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/hatch-chile-sourdough1-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/hatch-chile-sourdough1-480x270.png"], "cookTime": "PT50M", "totalTime": "PT110M", "recipeIngredient": ["1/2 cup 85 g smoked Gouda cheese, sliced into approximately 1/4-inch cubes", "1 1/2 cups 375 g filtered water, warmed to roughly 88°F", "1/3 cup 93 g active sourdough starter, maintained at 100% hydration", "1/2 cup 85 g Hatch green chile, roasted or canned and thoroughly drained", "2 1/4 teaspoons 14 g sea salt", "4 cups 500 g bread flour (King Arthur all-purpose flour may be used as noted in the original recipe)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Add the flour, 88°F filtered water, sea salt, and active sourdough starter to a large mixing bowl. Combine thoroughly until the ingredients come together into a unified, cohesive dough with no significant dry patches remaining.", "name": "Add the flour, 88°F filtered water, sea salt, and active sourdough starter to a large mixing bowl. Combine thoroughly until the ingredients come together into a unified, cohesive dough with no significant dry patches remaining.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-0"}, {"@type": "HowToStep", "text": "Begin the stretch-and-fold sequence. Over the following 2 hours, complete four sets of stretch-and-folds, allowing approximately 30 minutes between each set.", "name": "Begin the stretch-and-fold sequence. Over the following 2 hours, complete four sets of stretch-and-folds, allowing approximately 30 minutes between each set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-1"}, {"@type": "HowToStep", "text": "During the first set of folds, gently work the thoroughly drained Hatch green chile and 1/4-inch smoked Gouda cubes into the dough. The mixture may initially seem slick or difficult to handle because of the additions, but it should become progressively smoother and stronger with subsequent folds.", "name": "During the first set of folds, gently work the thoroughly drained Hatch green chile and 1/4-inch smoked Gouda cubes into the dough. The mixture may initially seem slick or difficult to handle because of the additions, but it should become progressively smoother and stronger with subsequent folds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-2"}, {"@type": "HowToStep", "text": "After the folding period, leave the dough to ferment at room temperature for up to 8 hours. Allow it to continue until it appears noticeably expanded, puffy, and aerated.", "name": "After the folding period, leave the dough to ferment at room temperature for up to 8 hours. Allow it to continue until it appears noticeably expanded, puffy, and aerated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-3"}, {"@type": "HowToStep", "text": "Once bulk fermentation is complete, form the dough into a round loaf. Transfer it upside down, with the seam facing upward, into a banneton or suitable bowl dusted with rice flour.", "name": "Once bulk fermentation is complete, form the dough into a round loaf. Transfer it upside down, with the seam facing upward, into a banneton or suitable bowl dusted with rice flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-4"}, {"@type": "HowToStep", "text": "Cover the shaped dough and place it in the refrigerator overnight. The extended chilled fermentation allows the loaf to proof gradually while further developing its flavor and texture.", "name": "Cover the shaped dough and place it in the refrigerator overnight. The extended chilled fermentation allows the loaf to proof gradually while further developing its flavor and texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-5"}, {"@type": "HowToStep", "text": "When ready to bake, place a Dutch oven inside the oven and preheat to 450°F for a minimum of 30 minutes.", "name": "When ready to bake, place a Dutch oven inside the oven and preheat to 450°F for a minimum of 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-6"}, {"@type": "HowToStep", "text": "The loaf may be baked directly from refrigeration, or it can rest outside the refrigerator for approximately 1 hour to move closer to room temperature before baking.", "name": "The loaf may be baked directly from refrigeration, or it can rest outside the refrigerator for approximately 1 hour to move closer to room temperature before baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-7"}, {"@type": "HowToStep", "text": "Carefully invert the proofed dough onto a sheet of parchment paper. Score the surface as desired so the loaf can expand in a controlled manner during baking.", "name": "Carefully invert the proofed dough onto a sheet of parchment paper. Score the surface as desired so the loaf can expand in a controlled manner during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-8"}, {"@type": "HowToStep", "text": "Wearing suitable oven mitts, carefully remove the fully heated Dutch oven. Lower the scored loaf, together with its parchment paper, into the hot pot.", "name": "Wearing suitable oven mitts, carefully remove the fully heated Dutch oven. Lower the scored loaf, together with its parchment paper, into the hot pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-9"}, {"@type": "HowToStep", "text": "Carefully pour a few tablespoons of water between the parchment paper and the sides of the Dutch oven. The water will boil immediately upon contacting the heated surface, so use appropriate caution.", "name": "Carefully pour a few tablespoons of water between the parchment paper and the sides of the Dutch oven. The water will boil immediately upon contacting the heated surface, so use appropriate caution.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-10"}, {"@type": "HowToStep", "text": "Place the lid on the Dutch oven and bake the loaf at 450°F for 20 minutes.", "name": "Place the lid on the Dutch oven and bake the loaf at 450°F for 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-11"}, {"@type": "HowToStep", "text": "Remove the lid and continue baking for an additional 30 minutes, or until the crust develops a deep golden-brown color and the loaf produces a hollow sound when tapped.", "name": "Remove the lid and continue baking for an additional 30 minutes, or until the crust develops a deep golden-brown color and the loaf produces a hollow sound when tapped.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-12"}, {"@type": "HowToStep", "text": "Remove the baked sourdough from the Dutch oven and place it on a wire cooling rack. Allow it to rest for at least 1 hour before slicing so the interior crumb can set properly.", "name": "Remove the baked sourdough from the Dutch oven and place it on a wire cooling rack. Allow it to rest for at least 1 hour before slicing so the interior crumb can set properly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-sourdough/#wprm-recipe-42513-step-0-13"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Hatch Chile Sourdough"}</script>
