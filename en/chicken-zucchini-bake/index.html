llions, beaten eggs, Italian herb blend, and a judicious pinch of salt and pepper in a large mixing bowl; keep this cheese mixture nearby.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-zucchini-bake/#wprm-recipe-26010-step-0-1"}, {"@type": "HowToStep", "text": "Warm olive oil in a deep skillet over medium-high heat, then sauté zucchini and mushrooms until they begin to release moisture and take on light color; season with salt and pepper during cooking.", "name": "Warm olive oil in a deep skillet over medium-high heat, then sauté zucchini and mushrooms until they begin to release moisture and take on light color; season with salt and pepper during cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-zucchini-bake/#wprm-recipe-26010-step-0-2"}, {"@type": "HowToStep", "text": "Add the cubed, pre-salted chicken to the skillet and continue sautéing about 5 minutes, just until the exterior turns golden.", "name": "Add the cubed, pre-salted chicken to the skillet and continue sautéing about 5 minutes, just until the exterior turns golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-zucchini-bake/#wprm-recipe-26010-step-0-3"}, {"@type": "HowToStep", "text": "Tip the skillet contents into a colander, allowing excess liquid to drain thoroughly.", "name": "Tip the skillet contents into a colander, allowing excess liquid to drain thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-zucchini-bake/#wprm-recipe-26010-step-0-4"}, {"@type": "HowToStep", "text": "Fold the drained vegetables and chicken into the prepared cheese mixture until all components are evenly coated.", "name": "Fold the drained vegetables and chicken into the prepared cheese mixture until all components are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-zucchini-bake/#wprm-recipe-26010-step-0-5"}, {"@type": "HowToStep", "text": "Spread the combined mixture into the oiled baking dish, level the surface, and sprinkle grated Parmesan over the top.", "name": "Spread the combined mixture into the oiled baking dish, level the surface, and sprinkle grated Parmesan over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-zucchini-bake/#wprm-recipe-26010-step-0-6"}, {"@type": "HowToStep", "text": "Bake 30–40 minutes, or until the casserole is deeply golden and the cheese bubbles at the edges.", "name": "Bake 30–40 minutes, or until the casserole is deeply golden and the cheese bubbles at the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-zucchini-bake/#wprm-recipe-26010-step-0-7"}, {"@type": "HowToStep", "text": "Remove from the oven; let the dish stand 5–10 minutes to settle before slicing and serving.", "name": "Remove from the oven; let the dish stand 5–10 minutes to settle before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-zucchini-bake/#wprm-recipe-26010-step-0-8"}]}</script>
