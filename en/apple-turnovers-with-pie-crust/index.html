    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Apple Turnovers with Pie Crust", "author": {"@type": "Person", "name": "BenDes"}, "description": "These apple turnovers feature a warmly spiced fruit filling enclosed in flaky refrigerated pie pastry. A light egg coating and a scattering of sugar create a crisp, golden exterior, while the tender apple center remains rich and aromatic.", "datePublished": "2021-10-27T16:15:31+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/apple-turnovers-with-pie-crust1.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/apple-turnovers-with-pie-crust1.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/apple-turnovers-with-pie-crust1.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/apple-turnovers-with-pie-crust1.png"], "prepTime": "PT25M", "cookTime": "PT25M", "totalTime": "PT65M", "recipeIngredient": ["¼ cup firmly packed brown sugar", "½ teaspoon pure vanilla extract", "2 tablespoons unsalted butter", "2  large Granny Smith apples (peeled, cored, and cut into small pieces)", "¼ teaspoon fine salt", "1 teaspoon ground cinnamon", "1  package refrigerated pie dough containing 2 crusts", "2 tablespoons granulated sugar", "1  large egg"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F (200°C). Line a baking sheet with parchment paper and set it aside.", "name": "Preheat the oven to 400°F (200°C). Line a baking sheet with parchment paper and set it aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-0"}, {"@type": "HowToStep", "text": "Peel and core the apples. Cut each apple into quarters, divide each quarter into three sections, and then chop the pieces finely.", "name": "Peel and core the apples. Cut each apple into quarters, divide each quarter into three sections, and then chop the pieces finely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-1"}, {"@type": "HowToStep", "text": "Melt the butter in a medium saucepan over medium heat.", "name": "Melt the butter in a medium saucepan over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-2"}, {"@type": "HowToStep", "text": "Add the prepared apples, brown sugar, cinnamon, salt, and vanilla extract. Stir until the apples are evenly coated.", "name": "Add the prepared apples, brown sugar, cinnamon, salt, and vanilla extract. Stir until the apples are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-3"}, {"@type": "HowToStep", "text": "Allow the mixture to simmer for approximately 5 minutes, stirring occasionally, until the fruit begins to soften. Remove the saucepan from the heat and leave the filling to cool while preparing the pastry.", "name": "Allow the mixture to simmer for approximately 5 minutes, stirring occasionally, until the fruit begins to soften. Remove the saucepan from the heat and leave the filling to cool while preparing the pastry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-4"}, {"@type": "HowToStep", "text": "Unroll both refrigerated pie crusts onto a clean, flat work surface. Using a round cutter or the rim of a glass, cut three circles from each crust.", "name": "Unroll both refrigerated pie crusts onto a clean, flat work surface. Using a round cutter or the rim of a glass, cut three circles from each crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-5"}, {"@type": "HowToStep", "text": "Gather and reroll the remaining pastry scraps when necessary to obtain a total of six dough circles.", "name": "Gather and reroll the remaining pastry scraps when necessary to obtain a total of six dough circles.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-6"}, {"@type": "HowToStep", "text": "Place approximately ¼ to ⅓ cup of the cooled apple mixture in the center of each pastry round.", "name": "Place approximately ¼ to ⅓ cup of the cooled apple mixture in the center of each pastry round.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-7"}, {"@type": "HowToStep", "text": "Fold each circle over the filling to form a half-moon shape. Press the edges together with your fingertips, then crimp or fold them again to create a secure seal.", "name": "Fold each circle over the filling to form a half-moon shape. Press the edges together with your fingertips, then crimp or fold them again to create a secure seal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the filled turnovers to the prepared baking sheet.", "name": "Transfer the filled turnovers to the prepared baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-9"}, {"@type": "HowToStep", "text": "Using a sharp knife, make three small slits in the top of each turnover. These openings allow steam to escape during baking and help preserve the pastry’s crisp texture.", "name": "Using a sharp knife, make three small slits in the top of each turnover. These openings allow steam to escape during baking and help preserve the pastry’s crisp texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-10"}, {"@type": "HowToStep", "text": "Crack the egg into a small bowl and beat it until evenly blended.", "name": "Crack the egg into a small bowl and beat it until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-11"}, {"@type": "HowToStep", "text": "Lightly brush the surface of each turnover with the beaten egg. Distribute the granulated sugar generously over the coated pastry.", "name": "Lightly brush the surface of each turnover with the beaten egg. Distribute the granulated sugar generously over the coated pastry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-12"}, {"@type": "HowToStep", "text": "Bake for about 25 minutes, or until the turnovers are crisp and evenly golden brown.", "name": "Bake for about 25 minutes, or until the turnovers are crisp and evenly golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-13"}, {"@type": "HowToStep", "text": "Remove the baking sheet from the oven and allow the turnovers to cool for at least 15 minutes before serving.", "name": "Remove the baking sheet from the oven and allow the turnovers to cool for at least 15 minutes before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-pie-crust/#wprm-recipe-40439-step-0-14"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Apple Turnovers with Pie Crust"}</script>
