    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gluten-Free Angel Food Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "This gluten-free angel food cake has a delicate, airy interior and a deeply golden exterior. Finely processed sugar and a blend of gluten-free flour and cornstarch create a smooth, tender crumb, while stabilized egg whites give the cake its characteristic height and light texture. Serve it with whipped cream and fresh berries.", "datePublished": "2023-05-27T00:18:54+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/gluten-free-angel-food-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/gluten-free-angel-food-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/gluten-free-angel-food-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/gluten-free-angel-food-cake.png"], "prepTime": "PT20M", "cookTime": "PT45M", "totalTime": "PT65M", "recipeIngredient": ["1½ cups granulated white sugar", "¼ teaspoon fine salt", "¾ cup gluten-free flour blend containing a binder", "2 teaspoons pure vanilla extract", "1½ teaspoons cream of tartar", "¼ cup cornstarch", "1½ cups room-temperature egg whites (obtained from approximately 10–11 large eggs)", "Whipped cream", "Assorted fresh berries"], "recipeInstructions": [{"@type": "HowToStep", "text": "Position the oven racks in the upper and lower thirds of the oven, then heat the oven to 350°F (175°C).", "name": "Position the oven racks in the upper and lower thirds of the oven, then heat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-0"}, {"@type": "HowToStep", "text": "Place the gluten-free flour blend and cornstarch in a medium bowl. Whisk until evenly combined, then set the mixture aside.", "name": "Place the gluten-free flour blend and cornstarch in a medium bowl. Whisk until evenly combined, then set the mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the granulated sugar to a blender or food processor. Pulse briefly until the crystals become noticeably finer.", "name": "Transfer the granulated sugar to a blender or food processor. Pulse briefly until the crystals become noticeably finer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-2"}, {"@type": "HowToStep", "text": "Do not process the sugar into a powder. The goal is a superfine texture that will dissolve more readily in the whipped egg whites.", "name": "Do not process the sugar into a powder. The goal is a superfine texture that will dissolve more readily in the whipped egg whites.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-3"}, {"@type": "HowToStep", "text": "Place the room-temperature egg whites, cream of tartar, and salt in the bowl of a stand mixer fitted with the whisk attachment. A large glass bowl and electric hand mixer may also be used.", "name": "Place the room-temperature egg whites, cream of tartar, and salt in the bowl of a stand mixer fitted with the whisk attachment. A large glass bowl and electric hand mixer may also be used.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-4"}, {"@type": "HowToStep", "text": "Beat at medium speed, approximately level 6 out of 10, for about 1 minute, or until the whites appear very foamy.", "name": "Beat at medium speed, approximately level 6 out of 10, for about 1 minute, or until the whites appear very foamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-5"}, {"@type": "HowToStep", "text": "Pour in the vanilla extract and continue mixing only until it is incorporated.", "name": "Pour in the vanilla extract and continue mixing only until it is incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-6"}, {"@type": "HowToStep", "text": "Reduce the mixer to medium-low speed, approximately level 4 out of 10. Gradually sprinkle the superfine sugar into the foamy egg whites, allowing it to dissolve as it is added.", "name": "Reduce the mixer to medium-low speed, approximately level 4 out of 10. Gradually sprinkle the superfine sugar into the foamy egg whites, allowing it to dissolve as it is added.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-7"}, {"@type": "HowToStep", "text": "After all the sugar has been incorporated, increase the mixer to medium-high speed, approximately level 8 out of 10.", "name": "After all the sugar has been incorporated, increase the mixer to medium-high speed, approximately level 8 out of 10.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-8"}, {"@type": "HowToStep", "text": "Continue whipping until the meringue becomes glossy and forms medium peaks. When the whisk is lifted, the mixture should retain its shape while the peak bends slightly at the tip. The full whipping process should take approximately 3–4 minutes.", "name": "Continue whipping until the meringue becomes glossy and forms medium peaks. When the whisk is lifted, the mixture should retain its shape while the peak bends slightly at the tip. The full whipping process should take approximately 3–4 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-9"}, {"@type": "HowToStep", "text": "Add the reserved flour and cornstarch blend to the meringue in three separate portions. Use the mixer on low speed or fold with a spatula, combining each portion only until no dry streaks remain before adding the next.", "name": "Add the reserved flour and cornstarch blend to the meringue in three separate portions. Use the mixer on low speed or fold with a spatula, combining each portion only until no dry streaks remain before adding the next.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-10"}, {"@type": "HowToStep", "text": "After the final addition, gently stir the batter with a spatula to ensure the dry ingredients are evenly distributed without unnecessarily deflating the mixture.", "name": "After the final addition, gently stir the batter with a spatula to ensure the dry ingredients are evenly distributed without unnecessarily deflating the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-11"}, {"@type": "HowToStep", "text": "Level the surface with the back of a spoon or an offset spatula.", "name": "Level the surface with the back of a spoon or an offset spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-12"}, {"@type": "HowToStep", "text": "Place the pan on the middle oven rack and bake for 45–47 minutes, or until the surface develops a deep golden-brown color.", "name": "Place the pan on the middle oven rack and bake for 45–47 minutes, or until the surface develops a deep golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-13"}, {"@type": "HowToStep", "text": "Angel food cake is more likely to collapse when underbaked, so a slightly longer bake is preferable to removing it too early.", "name": "Angel food cake is more likely to collapse when underbaked, so a slightly longer bake is preferable to removing it too early.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-14"}, {"@type": "HowToStep", "text": "Immediately after removing the cake from the oven, turn the pan upside down. Balance it over a foil-covered bottle or use the pan’s built-in cooling feet, when available.", "name": "Immediately after removing the cake from the oven, turn the pan upside down. Balance it over a foil-covered bottle or use the pan’s built-in cooling feet, when available.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-15"}, {"@type": "HowToStep", "text": "Allow the cake to cool completely in the inverted position to help preserve its height and prevent sagging.", "name": "Allow the cake to cool completely in the inverted position to help preserve its height and prevent sagging.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-16"}, {"@type": "HowToStep", "text": "Once fully cooled, return the pan to an upright position. Run a knife carefully around the edges to release the cake.", "name": "Once fully cooled, return the pan to an upright position. Run a knife carefully around the edges to release the cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-17"}, {"@type": "HowToStep", "text": "Cut the cake with a serrated knife. Serve each slice with whipped cream and fresh berries.", "name": "Cut the cake with a serrated knife. Serve each slice with whipped cream and fresh berries.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-angel-food-cake/#wprm-recipe-40242-step-0-18"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Gluten-Free Angel Food Cake"}</script>
