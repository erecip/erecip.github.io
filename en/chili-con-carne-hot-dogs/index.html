    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chili Con Carne Hot Dogs", "author": {"@type": "Person", "name": "BenDes"}, "description": "These chili con carne hot dogs combine grilled hot dogs and toasted buns with a hearty slow-cooked beef chili. Chuck roast is coated in a smoky spice blend, deeply seared, and cooked with kidney beans, tomatoes, aromatics, and beef broth until exceptionally tender. The finished hot dogs are topped with shredded beef chili, sour cream, cheese, and optional cilantro.", "datePublished": "2021-12-30T13:22:57+00:00", "prepTime": "PT30M", "cookTime": "PT480M", "totalTime": "PT530M", "recipeIngredient": ["3 lb beef chuck roast (trimmed as needed and cut into 1-inch cubes)", "1 cup beef broth", "1  bell pepper (seeds removed and finely diced into roughly 1/4-inch pieces)", "1 tbsp ground cumin", "2  cans kidney beans (thoroughly rinsed and drained)", "8  garlic cloves (freshly minced, about 2 generously filled tablespoons)", "1 tsp freshly ground black pepper", "2 tbsp vegetable oil", "1  can (28 oz diced tomatoes with their juices, preferably San Marzano)", "1 tbsp dried oregano", "1 1/2  sweet yellow onions (chopped into approximately 1/2-inch pieces)", "4  –5 tbsp Stubb’s Bar-B-Q spice rub", "1 tbsp garlic powder", "1 tsp salt", "1 tbsp smoked paprika", "1 tbsp onion powder", "10  –12 hot dog buns", "10  –12 hot dogs", "1 pint sour cream", "Shredded cheddar cheese (for topping)", "Fresh cilantro (for garnish, optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Cut the chuck roast into 1-inch cubes. Blot the pieces thoroughly with paper towels so the exterior is dry enough to brown effectively.", "name": "Cut the chuck roast into 1-inch cubes. Blot the pieces thoroughly with paper towels so the exterior is dry enough to brown effectively.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-0"}, {"@type": "HowToStep", "text": "Combine the Stubb’s Bar-B-Q spice rub, smoked paprika, cumin, onion powder, garlic powder, and dried oregano in a small bowl.", "name": "Combine the Stubb’s Bar-B-Q spice rub, smoked paprika, cumin, onion powder, garlic powder, and dried oregano in a small bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-1"}, {"@type": "HowToStep", "text": "Coat the beef pieces evenly and generously with the seasoning mixture, ensuring that the spices cover all sides.", "name": "Coat the beef pieces evenly and generously with the seasoning mixture, ensuring that the spices cover all sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-2"}, {"@type": "HowToStep", "text": "Allow the seasoned beef to remain at room temperature for 30 minutes while the vegetables are prepared.", "name": "Allow the seasoned beef to remain at room temperature for 30 minutes while the vegetables are prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-3"}, {"@type": "HowToStep", "text": "While the beef rests, mince the garlic, cut the sweet yellow onions into approximately 1/2-inch pieces, and finely chop the seeded bell pepper into roughly 1/4-inch pieces.", "name": "While the beef rests, mince the garlic, cut the sweet yellow onions into approximately 1/2-inch pieces, and finely chop the seeded bell pepper into roughly 1/4-inch pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-4"}, {"@type": "HowToStep", "text": "Pour the vegetable oil into a large skillet and heat it over medium-high heat until the oil begins to shimmer.", "name": "Pour the vegetable oil into a large skillet and heat it over medium-high heat until the oil begins to shimmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-5"}, {"@type": "HowToStep", "text": "Sear the seasoned beef in batches, leaving sufficient space between the pieces. Cook for approximately 3 minutes on each side, or until a deeply browned crust forms.", "name": "Sear the seasoned beef in batches, leaving sufficient space between the pieces. Cook for approximately 3 minutes on each side, or until a deeply browned crust forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-6"}, {"@type": "HowToStep", "text": "Avoid overcrowding the skillet, as cooking the meat in smaller batches encourages stronger browning and develops a richer savory flavor.", "name": "Avoid overcrowding the skillet, as cooking the meat in smaller batches encourages stronger browning and develops a richer savory flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-7"}, {"@type": "HowToStep", "text": "Transfer each batch of browned beef to a plate and reserve.", "name": "Transfer each batch of browned beef to a plate and reserve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-8"}, {"@type": "HowToStep", "text": "Using the same skillet and the flavorful fat remaining from the beef, add the chopped onions and bell pepper.", "name": "Using the same skillet and the flavorful fat remaining from the beef, add the chopped onions and bell pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-9"}, {"@type": "HowToStep", "text": "Cook over medium heat for 5–7 minutes, stirring periodically, until the vegetables have softened and the onions appear slightly translucent.", "name": "Cook over medium heat for 5–7 minutes, stirring periodically, until the vegetables have softened and the onions appear slightly translucent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-10"}, {"@type": "HowToStep", "text": "During the final minute, add the minced garlic. Stir continuously so the garlic releases its aroma without scorching.", "name": "During the final minute, add the minced garlic. Stir continuously so the garlic releases its aroma without scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-11"}, {"@type": "HowToStep", "text": "Cooking the vegetables in the same skillet builds the chili’s flavor base while incorporating the browned beef drippings.", "name": "Cooking the vegetables in the same skillet builds the chili’s flavor base while incorporating the browned beef drippings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the sautéed onion, pepper, and garlic mixture to the slow cooker.", "name": "Transfer the sautéed onion, pepper, and garlic mixture to the slow cooker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-13"}, {"@type": "HowToStep", "text": "Add the drained kidney beans, the diced tomatoes together with their juices, and the beef broth.", "name": "Add the drained kidney beans, the diced tomatoes together with their juices, and the beef broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-14"}, {"@type": "HowToStep", "text": "Season the mixture with the salt and freshly ground black pepper, then stir until evenly combined.", "name": "Season the mixture with the salt and freshly ground black pepper, then stir until evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-15"}, {"@type": "HowToStep", "text": "Arrange the seared beef pieces in the chili mixture, gently pressing them beneath the liquid as much as possible.", "name": "Arrange the seared beef pieces in the chili mixture, gently pressing them beneath the liquid as much as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-16"}, {"@type": "HowToStep", "text": "Cover the slow cooker and cook the chili on the LOW setting for 8 hours.", "name": "Cover the slow cooker and cook the chili on the LOW setting for 8 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-17"}, {"@type": "HowToStep", "text": "When finished, the chuck roast should be extremely tender and separate easily when pulled with a fork.", "name": "When finished, the chuck roast should be extremely tender and separate easily when pulled with a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-18"}, {"@type": "HowToStep", "text": "Carefully lift the beef pieces from the slow cooker with tongs or a slotted spoon and transfer them to a cutting board.", "name": "Carefully lift the beef pieces from the slow cooker with tongs or a slotted spoon and transfer them to a cutting board.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-19"}, {"@type": "HowToStep", "text": "Using two forks, pull the tender beef apart into bite-sized shreds.", "name": "Using two forks, pull the tender beef apart into bite-sized shreds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-20"}, {"@type": "HowToStep", "text": "Return the shredded meat to the slow cooker and stir it thoroughly into the chili so it can absorb the surrounding sauce.", "name": "Return the shredded meat to the slow cooker and stir it thoroughly into the chili so it can absorb the surrounding sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-21"}, {"@type": "HowToStep", "text": "Approximately 10 minutes before serving, grill the hot dogs over medium-high heat for 3–4 minutes. Turn them periodically until they are heated completely through and have developed light charring on the exterior.", "name": "Approximately 10 minutes before serving, grill the hot dogs over medium-high heat for 3–4 minutes. Turn them periodically until they are heated completely through and have developed light charring on the exterior.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-22"}, {"@type": "HowToStep", "text": "Place the buns on the grill and toast them for approximately 1–2 minutes, just until warmed and lightly golden.", "name": "Place the buns on the grill and toast them for approximately 1–2 minutes, just until warmed and lightly golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-23"}, {"@type": "HowToStep", "text": "Keep the finished chili hot in the slow cooker while the hot dogs and buns are prepared.", "name": "Keep the finished chili hot in the slow cooker while the hot dogs and buns are prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-24"}, {"@type": "HowToStep", "text": "Set one grilled hot dog inside each toasted bun.", "name": "Set one grilled hot dog inside each toasted bun.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-25"}, {"@type": "HowToStep", "text": "Spoon a generous portion of the hot shredded-beef chili over each hot dog, allowing some of the flavorful sauce to settle into the bun.", "name": "Spoon a generous portion of the hot shredded-beef chili over each hot dog, allowing some of the flavorful sauce to settle into the bun.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-26"}, {"@type": "HowToStep", "text": "Finish each serving with a spoonful of sour cream, shredded cheddar cheese, and fresh cilantro if desired.", "name": "Finish each serving with a spoonful of sour cream, shredded cheddar cheese, and fresh cilantro if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-27"}, {"@type": "HowToStep", "text": "Serve immediately while the hot dogs, buns, and chili are warm.", "name": "Serve immediately while the hot dogs, buns, and chili are warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chili-con-carne-hot-dogs/#wprm-recipe-42308-step-0-28"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Chili Con Carne Hot Dogs"}</script>
