    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Horchata Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A smooth, refreshing rice-based horchata infused with cinnamon and vanilla, then finished with milk and sugar. An overnight soak allows the rice and cinnamon to develop a fuller aroma and creamy texture before the beverage is strained and chilled.", "datePublished": "2018-04-11T17:36:19+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/horchata-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/horchata-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/horchata-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/horchata-recipe.png"], "prepTime": "PT10M", "totalTime": "PT490M", "recipeIngredient": ["1 1/2 cups uncooked long-grain white rice", "4 cups hot water (divided)", "2  Mexican cinnamon sticks (or Ceylon cinnamon sticks for a gentler cinnamon flavor)", "1/3 to 1/2 cup granulated sugar (adjusted according to preferred sweetness)", "2 teaspoons ground cinnamon", "2 cups milk (or unsweetened almond milk for a dairy-free alternative)", "2 teaspoons vanilla extract"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the 1 1/2 cups of uncooked long-grain white rice, 2 cinnamon sticks, and 2 cups of the hot water in a blender.", "name": "Place the 1 1/2 cups of uncooked long-grain white rice, 2 cinnamon sticks, and 2 cups of the hot water in a blender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-0"}, {"@type": "HowToStep", "text": "Blend for approximately 1 to 2 minutes, or until the rice and cinnamon sticks have been coarsely ground. This initial blending releases the cinnamon flavor while beginning to break down the rice.", "name": "Blend for approximately 1 to 2 minutes, or until the rice and cinnamon sticks have been coarsely ground. This initial blending releases the cinnamon flavor while beginning to break down the rice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-1"}, {"@type": "HowToStep", "text": "Pour the remaining 2 cups of hot water into the blender.", "name": "Pour the remaining 2 cups of hot water into the blender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-2"}, {"@type": "HowToStep", "text": "Blend the mixture again to further reduce the rice and cinnamon particles and distribute their flavors throughout the liquid.", "name": "Blend the mixture again to further reduce the rice and cinnamon particles and distribute their flavors throughout the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the blended rice-and-cinnamon mixture to a pitcher or container fitted with a lid.", "name": "Transfer the blended rice-and-cinnamon mixture to a pitcher or container fitted with a lid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-4"}, {"@type": "HowToStep", "text": "Place it in the refrigerator and allow it to soak overnight, or for a minimum of 8 hours. The extended resting period gives the cinnamon time to infuse the liquid while the rice contributes a fuller, creamier consistency.", "name": "Place it in the refrigerator and allow it to soak overnight, or for a minimum of 8 hours. The extended resting period gives the cinnamon time to infuse the liquid while the rice contributes a fuller, creamier consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-5"}, {"@type": "HowToStep", "text": "Once the soaking period is complete, strain the mixture through a fine-mesh strainer or cheesecloth into a clean pitcher or large bowl.", "name": "Once the soaking period is complete, strain the mixture through a fine-mesh strainer or cheesecloth into a clean pitcher or large bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-6"}, {"@type": "HowToStep", "text": "Discard the remaining rice and cinnamon solids so the resulting horchata base is as smooth as possible.", "name": "Discard the remaining rice and cinnamon solids so the resulting horchata base is as smooth as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-7"}, {"@type": "HowToStep", "text": "Pour 2 cups of milk or unsweetened almond milk into the strained rice liquid. Add 2 teaspoons of vanilla extract, 2 teaspoons of ground cinnamon, and 1/3 to 1/2 cup of granulated sugar.", "name": "Pour 2 cups of milk or unsweetened almond milk into the strained rice liquid. Add 2 teaspoons of vanilla extract, 2 teaspoons of ground cinnamon, and 1/3 to 1/2 cup of granulated sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-8"}, {"@type": "HowToStep", "text": "Stir thoroughly until the ingredients are evenly incorporated and the sugar has dissolved. Taste and adjust the amount of sugar within the stated range as desired.", "name": "Stir thoroughly until the ingredients are evenly incorporated and the sugar has dissolved. Taste and adjust the amount of sugar within the stated range as desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-9"}, {"@type": "HowToStep", "text": "Refrigerate the finished horchata until thoroughly chilled. Stir well immediately before serving, then pour over ice.", "name": "Refrigerate the finished horchata until thoroughly chilled. Stir well immediately before serving, then pour over ice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-recipe/#wprm-recipe-41394-step-0-10"}], "recipeCategory": ["Beverage"], "recipeCuisine": ["Mexican"], "keywords": "Horchata Recipe"}</script>
