    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Beef Stew and Dumplings", "author": {"@type": "Person", "name": "BenDes"}, "description": "A robust beef stew prepared with tender chuck, potatoes, carrots, aromatic herbs, and a savory beef stock base, finished with soft homemade dumplings that cook directly on top of the stew.", "datePublished": "2021-07-24T14:39:18+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/Beef-Stew-and-Dumplings.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/Beef-Stew-and-Dumplings.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/Beef-Stew-and-Dumplings.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/Beef-Stew-and-Dumplings.png"], "prepTime": "PT20M", "cookTime": "PT140M", "totalTime": "PT160M", "recipeIngredient": ["2 quarts beef stock", "4  garlic cloves (finely minced)", "3 cups peeled potatoes (chopped into 1-inch pieces)", "2 teaspoons sea salt", "2  sprigs fresh thyme", "2 teaspoons tomato paste", "4 to 5  carrots (peeled and sliced into 1/2-inch rounds)", "2 tablespoons all-purpose flour", "1  large onion (chopped)", "2 pounds chuck beef (cut into 1 1/2-inch cubes)", "1 teaspoon freshly ground black pepper", "1 teaspoon fresh rosemary (finely chopped)", "Garlic powder (to taste, for seasoning the beef)", "Butter or oil (as needed for searing and sautéing)", "1 tablespoon unsalted butter (softened to room temperature)", "1 cup all-purpose flour", "Fresh parsley and chives (finely chopped, optional for garnish and dumplings)", "2 teaspoons baking powder", "1/3 to 1/2 cup milk", "1/2 teaspoon sea salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Season the chuck beef generously on both sides with sea salt, freshly ground black pepper, and garlic powder.", "name": "Season the chuck beef generously on both sides with sea salt, freshly ground black pepper, and garlic powder.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-0"}, {"@type": "HowToStep", "text": "Sprinkle the beef with the all-purpose flour and toss until each piece is lightly and evenly coated.", "name": "Sprinkle the beef with the all-purpose flour and toss until each piece is lightly and evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-1"}, {"@type": "HowToStep", "text": "Warm butter or oil in a heavy pot over medium-high heat. Add the beef in batches, avoiding crowding, and sear for 2 to 3 minutes per side until well browned.", "name": "Warm butter or oil in a heavy pot over medium-high heat. Add the beef in batches, avoiding crowding, and sear for 2 to 3 minutes per side until well browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the browned beef to a plate and set it aside.", "name": "Transfer the browned beef to a plate and set it aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-3"}, {"@type": "HowToStep", "text": "Add the chopped onion to the same pot, adding a little more oil if needed. Cook until the onion becomes soft and fragrant.", "name": "Add the chopped onion to the same pot, adding a little more oil if needed. Cook until the onion becomes soft and fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-4"}, {"@type": "HowToStep", "text": "Add the carrots, potatoes, and chopped rosemary to the pot.", "name": "Add the carrots, potatoes, and chopped rosemary to the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-5"}, {"@type": "HowToStep", "text": "Season the vegetables with the sea salt and black pepper, then stir in the minced garlic and tomato paste to deepen the flavor of the stew base.", "name": "Season the vegetables with the sea salt and black pepper, then stir in the minced garlic and tomato paste to deepen the flavor of the stew base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-6"}, {"@type": "HowToStep", "text": "Return the seared beef to the pot and pour in the beef stock, making sure the liquid covers the meat and vegetables.", "name": "Return the seared beef to the pot and pour in the beef stock, making sure the liquid covers the meat and vegetables.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-7"}, {"@type": "HowToStep", "text": "Raise the heat to high and bring the mixture to a gentle simmer.", "name": "Raise the heat to high and bring the mixture to a gentle simmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-8"}, {"@type": "HowToStep", "text": "Once the stew begins to simmer, reduce the heat to low. Add the fresh thyme sprigs, cover the pot, and allow the stew to cook gently for about 2 hours.", "name": "Once the stew begins to simmer, reduce the heat to low. Add the fresh thyme sprigs, cover the pot, and allow the stew to cook gently for about 2 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-9"}, {"@type": "HowToStep", "text": "While the stew cooks, prepare the dumpling mixture. Finely chop the parsley and chives, if using, and set them aside.", "name": "While the stew cooks, prepare the dumpling mixture. Finely chop the parsley and chives, if using, and set them aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-10"}, {"@type": "HowToStep", "text": "In a mixing bowl, combine the flour, baking powder, and sea salt.", "name": "In a mixing bowl, combine the flour, baking powder, and sea salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-11"}, {"@type": "HowToStep", "text": "Stir in the chopped herbs, then add the softened butter.", "name": "Stir in the chopped herbs, then add the softened butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-12"}, {"@type": "HowToStep", "text": "Work the butter into the flour mixture with your hands until the texture becomes coarse and slightly grainy.", "name": "Work the butter into the flour mixture with your hands until the texture becomes coarse and slightly grainy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-13"}, {"@type": "HowToStep", "text": "Gradually pour in 1/3 cup of milk while mixing gently, adding more milk only as needed, until a sticky, airy dough forms.", "name": "Gradually pour in 1/3 cup of milk while mixing gently, adding more milk only as needed, until a sticky, airy dough forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-14"}, {"@type": "HowToStep", "text": "Do not overwork the dumpling dough. Cover the bowl with a towel and set it aside until ready to use.", "name": "Do not overwork the dumpling dough. Cover the bowl with a towel and set it aside until ready to use.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-15"}, {"@type": "HowToStep", "text": "After the stew has simmered for 2 hours, remove and discard the thyme stems.", "name": "After the stew has simmered for 2 hours, remove and discard the thyme stems.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-16"}, {"@type": "HowToStep", "text": "Scoop portions of dumpling batter with a spoon or by hand and drop them directly onto the surface of the stew. Keep each portion about the size of a golf ball or slightly smaller, without rolling the dough into firm balls.", "name": "Scoop portions of dumpling batter with a spoon or by hand and drop them directly onto the surface of the stew. Keep each portion about the size of a golf ball or slightly smaller, without rolling the dough into firm balls.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-17"}, {"@type": "HowToStep", "text": "For crisp-topped dumplings, place the uncovered pot in a 350°F oven until the dumplings are cooked through.", "name": "For crisp-topped dumplings, place the uncovered pot in a 350°F oven until the dumplings are cooked through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-18"}, {"@type": "HowToStep", "text": "For steamed dumplings, keep the pot on the stovetop, cover it, and cook for about 20 minutes, or until the dumplings are fully set.", "name": "For steamed dumplings, keep the pot on the stovetop, cover it, and cook for about 20 minutes, or until the dumplings are fully set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-19"}, {"@type": "HowToStep", "text": "Serve the beef stew hot, garnished with fresh parsley for a bright finishing touch.", "name": "Serve the beef stew hot, garnished with fresh parsley for a bright finishing touch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stew-and-dumplings/#wprm-recipe-38654-step-0-20"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Beef Stew and Dumplings"}</script>
