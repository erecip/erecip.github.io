    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Drunk Witch Halloween Drink", "author": {"@type": "Person", "name": "BenDes"}, "description": "A colorful Halloween cocktail made with vodka, blue curaçao, grenadine, and chilled cola. A bright green sugar rim adds a festive finish, while the combination of blue liqueur and red grenadine creates a dramatic witch-inspired appearance.", "datePublished": "2020-08-30T20:45:33+00:00", "image": ["https://erecip.github.io/en/drunk-witch-halloween-drink/drunk-witch-halloween-drink2.png", "https://erecip.github.io/en/drunk-witch-halloween-drink/drunk-witch-halloween-drink2.png", "https://erecip.github.io/en/drunk-witch-halloween-drink/drunk-witch-halloween-drink2.png", "https://erecip.github.io/en/drunk-witch-halloween-drink/drunk-witch-halloween-drink2.png"], "recipeIngredient": ["2  fl oz vodka (preferably Tito’s for a smooth blend)", "Chilled cola (as needed to finish the drink)", "2  fl oz grenadine (for sweetness and a vivid red swirl)", "Green decorating sugar (as needed for coating the rim)", "Ice cubes (as needed for chilling and serving)", "2  fl oz blue curaçao (for its bright blue hue)", "Corn syrup (as needed for coating the glass rim)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Pour the corn syrup into one shallow dish and place the green sugar in a separate shallow dish.", "name": "Pour the corn syrup into one shallow dish and place the green sugar in a separate shallow dish.", "url": "https://erecip.github.io/en/drunk-witch-halloween-drink/#wprm-recipe-45681-step-0-0"}, {"@type": "HowToStep", "text": "Dip the rim of the serving glass evenly into the corn syrup, then immediately press it into the green sugar until the edge is thoroughly coated. The corn syrup helps the sugar adhere securely and produces a vivid Halloween-themed rim.", "name": "Dip the rim of the serving glass evenly into the corn syrup, then immediately press it into the green sugar until the edge is thoroughly coated. The corn syrup helps the sugar adhere securely and produces a vivid Halloween-themed rim.", "url": "https://erecip.github.io/en/drunk-witch-halloween-drink/#wprm-recipe-45681-step-0-1"}, {"@type": "HowToStep", "text": "Fill the decorated glass with ice cubes and set it aside. Keeping the glass chilled helps the finished cocktail remain cold and reduces warming from the glassware.", "name": "Fill the decorated glass with ice cubes and set it aside. Keeping the glass chilled helps the finished cocktail remain cold and reduces warming from the glassware.", "url": "https://erecip.github.io/en/drunk-witch-halloween-drink/#wprm-recipe-45681-step-0-2"}, {"@type": "HowToStep", "text": "Gather the remaining drink ingredients and prepare a cocktail shaker while the glass chills.", "name": "Gather the remaining drink ingredients and prepare a cocktail shaker while the glass chills.", "url": "https://erecip.github.io/en/drunk-witch-halloween-drink/#wprm-recipe-45681-step-0-3"}, {"@type": "HowToStep", "text": "Fill a cocktail shaker with ice cubes. Pour in 2 fl oz vodka, 2 fl oz blue curaçao, and 2 fl oz grenadine.", "name": "Fill a cocktail shaker with ice cubes. Pour in 2 fl oz vodka, 2 fl oz blue curaçao, and 2 fl oz grenadine.", "url": "https://erecip.github.io/en/drunk-witch-halloween-drink/#wprm-recipe-45681-step-0-4"}, {"@type": "HowToStep", "text": "Secure the shaker firmly and shake vigorously for 10–15 seconds, or until the liquid is thoroughly chilled and evenly combined. Tito’s vodka may be used for a particularly smooth base that allows the sweeter flavors to remain prominent.", "name": "Secure the shaker firmly and shake vigorously for 10–15 seconds, or until the liquid is thoroughly chilled and evenly combined. Tito’s vodka may be used for a particularly smooth base that allows the sweeter flavors to remain prominent.", "url": "https://erecip.github.io/en/drunk-witch-halloween-drink/#wprm-recipe-45681-step-0-5"}, {"@type": "HowToStep", "text": "Strain the chilled cocktail mixture over the ice in the prepared glass.", "name": "Strain the chilled cocktail mixture over the ice in the prepared glass.", "url": "https://erecip.github.io/en/drunk-witch-halloween-drink/#wprm-recipe-45681-step-0-6"}, {"@type": "HowToStep", "text": "Slowly pour chilled cola over the drink to top it off. A gentle pour helps retain the visual layering and allows the grenadine to form its characteristic red swirls through the blue-colored base. The cola supplies additional sweetness and carbonation while enhancing the cauldron-like Halloween appearance.", "name": "Slowly pour chilled cola over the drink to top it off. A gentle pour helps retain the visual layering and allows the grenadine to form its characteristic red swirls through the blue-colored base. The cola supplies additional sweetness and carbonation while enhancing the cauldron-like Halloween appearance.", "url": "https://erecip.github.io/en/drunk-witch-halloween-drink/#wprm-recipe-45681-step-0-7"}], "recipeCategory": ["Cocktail"], "recipeCuisine": ["American"], "keywords": "Drunk Witch Halloween Drink"}</script>
