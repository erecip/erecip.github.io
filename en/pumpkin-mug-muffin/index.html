ToStep", "text": "Add the whole wheat flour, baking powder, and pumpkin pie spice to the wet mixture in the mug.", "name": "Add the whole wheat flour, baking powder, and pumpkin pie spice to the wet mixture in the mug.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-mug-muffin/#wprm-recipe-41153-step-0-2"}, {"@type": "HowToStep", "text": "Stir well with the fork until a uniform batter forms and no visible traces of dry flour remain.", "name": "Stir well with the fork until a uniform batter forms and no visible traces of dry flour remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-mug-muffin/#wprm-recipe-41153-step-0-3"}, {"@type": "HowToStep", "text": "Gently tap the mug against the countertop to help release any trapped air bubbles before cooking.", "name": "Gently tap the mug against the countertop to help release any trapped air bubbles before cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-mug-muffin/#wprm-recipe-41153-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the mug to the microwave and cook on high for 60 to 90 seconds, checking the muffin after the first 60 seconds.", "name": "Transfer the mug to the microwave and cook on high for 60 to 90 seconds, checking the muffin after the first 60 seconds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-mug-muffin/#wprm-recipe-41153-step-0-5"}, {"@type": "HowToStep", "text": "If the surface still appears wet or undercooked, continue heating in 10- to 20-second increments until the muffin has risen and the center is set.", "name": "If the surface still appears wet or undercooked, continue heating in 10- to 20-second increments until the muffin has risen and the center is set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-mug-muffin/#wprm-recipe-41153-step-0-6"}, {"@type": "HowToStep", "text": "Because microwave power levels differ, monitor the muffin closely to prevent it from becoming overcooked.", "name": "Because microwave power levels differ, monitor the muffin closely to prevent it from becoming overcooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-mug-muffin/#wprm-recipe-41153-step-0-7"}, {"@type": "HowToStep", "text": "Carefully take the mug out of the microwave, as both the mug and muffin will be hot.", "name": "Carefully take the mug out of the microwave, as both the mug and muffin will be hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-mug-muffin/#wprm-recipe-41153-step-0-8"}, {"@type": "HowToStep", "text": "Allow the muffin to cool for a few minutes before serving.", "name": "Allow the muffin to cool for a few minutes before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-mug-muffin/#wprm-recipe-41153-step-0-9"}, {"@type": "HowToStep", "text": "Enjoy it directly from the mug, or loosen the edges with a knife and carefully turn the muffin out onto a plate.", "name": "Enjoy it directly from the mug, or loosen the edges with a knife and carefully turn the muffin out onto a plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-mug-muffin/#wprm-recipe-41153-step-0-10"}], "keywords": "Pumpkin Mug Muffin"}</script>
