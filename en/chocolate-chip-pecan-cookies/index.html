    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chocolate Chip Pecan Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These classic cookies combine a buttery brown sugar dough with abundant semisweet chocolate chips and crisp pieces of toasted pecan. Chilling the dough produces a thicker, chewier texture, while baking it immediately creates cookies that spread more and develop crisper edges.", "datePublished": "2023-08-21T21:53:39+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/chocolate-chip-pecan-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/chocolate-chip-pecan-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/chocolate-chip-pecan-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/chocolate-chip-pecan-cookies.png"], "prepTime": "PT15M", "cookTime": "PT10M", "totalTime": "PT55M", "recipeIngredient": ["2  large eggs", "¾ cup firmly packed light brown sugar", "2½ cups all-purpose flour", "1 teaspoon baking soda", "1 cup unsalted butter (softened to approximately 70°F)", "1 teaspoon fine salt", "¾ cup granulated sugar", "1 teaspoon vanilla extract (preferably Madagascar vanilla for a fuller flavor)", "2 cups semisweet chocolate chips (such as Ghirardelli)", "1 cup pecans (roughly chopped and lightly toasted)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C). Cover a cookie sheet with parchment paper or a nonstick silicone baking mat.", "name": "Preheat the oven to 375°F (190°C). Cover a cookie sheet with parchment paper or a nonstick silicone baking mat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/#wprm-recipe-40764-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened butter, granulated sugar, and packed light brown sugar in a large mixing bowl. Using a stand mixer or handheld electric mixer, beat the ingredients on medium-high speed for 2–3 minutes, or until creamy and thoroughly blended.", "name": "Place the softened butter, granulated sugar, and packed light brown sugar in a large mixing bowl. Using a stand mixer or handheld electric mixer, beat the ingredients on medium-high speed for 2–3 minutes, or until creamy and thoroughly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/#wprm-recipe-40764-step-0-1"}, {"@type": "HowToStep", "text": "Add the eggs individually, mixing well after each addition. Pour in the vanilla extract and continue mixing until the wet ingredients are evenly incorporated.", "name": "Add the eggs individually, mixing well after each addition. Pour in the vanilla extract and continue mixing until the wet ingredients are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/#wprm-recipe-40764-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the flour, baking soda, and salt together until uniformly combined.", "name": "In a separate bowl, whisk the flour, baking soda, and salt together until uniformly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/#wprm-recipe-40764-step-0-3"}, {"@type": "HowToStep", "text": "Add the dry mixture to the butter mixture in several portions. Mix on low speed after each addition to prevent the flour from scattering, continuing only until a smooth and consistent dough forms.", "name": "Add the dry mixture to the butter mixture in several portions. Mix on low speed after each addition to prevent the flour from scattering, continuing only until a smooth and consistent dough forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/#wprm-recipe-40764-step-0-4"}, {"@type": "HowToStep", "text": "Fold the semisweet chocolate chips and chopped pecans gently into the dough, distributing both add-ins evenly throughout.", "name": "Fold the semisweet chocolate chips and chopped pecans gently into the dough, distributing both add-ins evenly throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/#wprm-recipe-40764-step-0-5"}, {"@type": "HowToStep", "text": "For thicker cookies with a chewier center, cover the dough and refrigerate it for at least 30 minutes. For thinner cookies with crisper edges, proceed directly to portioning the dough.", "name": "For thicker cookies with a chewier center, cover the dough and refrigerate it for at least 30 minutes. For thinner cookies with crisper edges, proceed directly to portioning the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/#wprm-recipe-40764-step-0-6"}, {"@type": "HowToStep", "text": "Scoop heaping tablespoon-sized portions of dough onto the prepared cookie sheet. Leave at least 2 inches of space between each portion to allow the cookies to spread.", "name": "Scoop heaping tablespoon-sized portions of dough onto the prepared cookie sheet. Leave at least 2 inches of space between each portion to allow the cookies to spread.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/#wprm-recipe-40764-step-0-7"}, {"@type": "HowToStep", "text": "Bake for 10–12 minutes, until the edges are golden brown and the centers appear just set.", "name": "Bake for 10–12 minutes, until the edges are golden brown and the centers appear just set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/#wprm-recipe-40764-step-0-8"}, {"@type": "HowToStep", "text": "Remove the cookie sheet from the oven and allow the cookies to rest on the pan for approximately 5 minutes. Transfer them to a wire rack and leave them to cool completely.", "name": "Remove the cookie sheet from the oven and allow the cookies to rest on the pan for approximately 5 minutes. Transfer them to a wire rack and leave them to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pecan-cookies/#wprm-recipe-40764-step-0-9"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Chocolate Chip Pecan Cookies"}</script>
