    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Banana Pudding", "author": {"@type": "Person", "name": "BenDes"}, "description": "This classic banana pudding features layers of vanilla wafers and freshly sliced bananas enveloped in a rich, homemade vanilla custard. After several hours of refrigeration, the wafers soften into a cake-like texture while the flavors blend into a smooth, comforting dessert.", "datePublished": "2019-10-06T07:12:59+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/banana-pudding2.png", "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/banana-pudding2.png", "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/banana-pudding2.png", "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/banana-pudding2.png"], "prepTime": "PT25M", "cookTime": "PT10M", "totalTime": "PT95M", "recipeIngredient": ["2½ cups full-fat whole milk", "4 tablespoons unsalted butter (divided into small pieces)", "¾ cup white granulated sugar", "2  large egg yolks (brought to room temperature)", "½ teaspoon fine salt", "4½ tablespoons cornstarch", "½ cup heavy whipping cream", "1  large egg (at room temperature)", "3 teaspoons pure vanilla extract", "4  large ripe bananas (cut into ¼-inch slices)", "1  box vanilla wafer cookies (such as Nabisco Nilla Wafers)", "Freshly whipped cream (as needed for serving)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Pour the whole milk and heavy cream into a medium saucepan. Set the pan over medium heat and warm the mixture until it reaches a gentle simmer, stirring frequently to prevent the dairy from scorching.", "name": "Pour the whole milk and heavy cream into a medium saucepan. Set the pan over medium heat and warm the mixture until it reaches a gentle simmer, stirring frequently to prevent the dairy from scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-0"}, {"@type": "HowToStep", "text": "In a medium mixing bowl, whisk the whole egg, egg yolks, granulated sugar, and cornstarch until completely blended and smooth.", "name": "In a medium mixing bowl, whisk the whole egg, egg yolks, granulated sugar, and cornstarch until completely blended and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-1"}, {"@type": "HowToStep", "text": "While whisking continuously, gradually spoon a small amount of the hot milk mixture into the egg mixture. Continue adding several more spoonfuls in stages, whisking throughout, until the eggs have been gently warmed without curdling.", "name": "While whisking continuously, gradually spoon a small amount of the hot milk mixture into the egg mixture. Continue adding several more spoonfuls in stages, whisking throughout, until the eggs have been gently warmed without curdling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-2"}, {"@type": "HowToStep", "text": "Pour the tempered egg mixture into the saucepan containing the remaining warm milk and cream.", "name": "Pour the tempered egg mixture into the saucepan containing the remaining warm milk and cream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-3"}, {"@type": "HowToStep", "text": "Cook over medium-low heat for 5–8 minutes, whisking constantly, until the custard becomes thick enough to coat the back of a spoon. Do not allow the mixture to boil, as excessive heat may compromise its smooth texture.", "name": "Cook over medium-low heat for 5–8 minutes, whisking constantly, until the custard becomes thick enough to coat the back of a spoon. Do not allow the mixture to boil, as excessive heat may compromise its smooth texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-4"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Add the butter pieces, vanilla extract, and salt, stirring until the butter has fully melted and all ingredients are evenly incorporated.", "name": "Remove the saucepan from the heat. Add the butter pieces, vanilla extract, and salt, stirring until the butter has fully melted and all ingredients are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-5"}, {"@type": "HowToStep", "text": "Pass the custard through a fine-mesh sieve into a clean container to remove any small lumps and create a silky consistency.", "name": "Pass the custard through a fine-mesh sieve into a clean container to remove any small lumps and create a silky consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-6"}, {"@type": "HowToStep", "text": "Press plastic wrap directly against the surface of the custard to prevent a skin from developing. Refrigerate for at least 1 hour, or until thoroughly chilled. Stir the custard well before assembling the dessert.", "name": "Press plastic wrap directly against the surface of the custard to prevent a skin from developing. Refrigerate for at least 1 hour, or until thoroughly chilled. Stir the custard well before assembling the dessert.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-7"}, {"@type": "HowToStep", "text": "Arrange a single layer of vanilla wafers across the bottom of a 9-inch square baking dish, trifle bowl, large serving bowl, or individual dessert dishes.", "name": "Arrange a single layer of vanilla wafers across the bottom of a 9-inch square baking dish, trifle bowl, large serving bowl, or individual dessert dishes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-8"}, {"@type": "HowToStep", "text": "Cover the wafers with a layer of sliced bananas, then spread half of the chilled custard evenly over the fruit.", "name": "Cover the wafers with a layer of sliced bananas, then spread half of the chilled custard evenly over the fruit.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-9"}, {"@type": "HowToStep", "text": "Repeat the layering process with additional wafers, bananas, and the remaining custard. Complete the dessert with a final covering of whole or crushed vanilla wafers.", "name": "Repeat the layering process with additional wafers, bananas, and the remaining custard. Complete the dessert with a final covering of whole or crushed vanilla wafers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-10"}, {"@type": "HowToStep", "text": "Cover the assembled pudding tightly with plastic wrap and refrigerate for 4–8 hours. This resting period allows the flavors to combine and the wafers to soften.", "name": "Cover the assembled pudding tightly with plastic wrap and refrigerate for 4–8 hours. This resting period allows the flavors to combine and the wafers to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-11"}, {"@type": "HowToStep", "text": "Immediately before serving, finish the banana pudding with freshly whipped cream.", "name": "Immediately before serving, finish the banana pudding with freshly whipped cream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/banana-pudding/#wprm-recipe-40828-step-0-12"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Banana Pudding"}</script>
