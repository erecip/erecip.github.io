    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Dry Rub Roasted Turkey", "author": {"@type": "Person", "name": "BenDes"}, "description": "A whole roasted turkey coated with olive oil and a savory blend of sage, rosemary, thyme, kosher salt, and black pepper. Onion and fresh thyme perfume the interior while the turkey roasts, producing crisp, deeply seasoned skin and tender meat.", "datePublished": "2023-01-14T18:21:00+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/dry-rub-roasted-turkey.png", "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/dry-rub-roasted-turkey.png", "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/dry-rub-roasted-turkey.png", "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/dry-rub-roasted-turkey.png"], "cookTime": "PT180M", "totalTime": "PT180M", "recipeIngredient": ["1  fresh whole turkey (weighing 10–12 lb, fully thawed)", "Several fresh thyme sprigs", "3 tablespoons extra-virgin olive oil", "1  onion (quartered)", "1 tablespoon dried rubbed sage", "1 teaspoon dried rosemary", "½ teaspoon ground black pepper (preferably freshly ground)", "1½ tablespoons kosher salt", "1 teaspoon dried thyme"], "recipeInstructions": [{"@type": "HowToStep", "text": "Remove the neck and giblets from the turkey cavities. Trim off excess fat and remove any remaining pinfeathers.", "name": "Remove the neck and giblets from the turkey cavities. Trim off excess fat and remove any remaining pinfeathers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-0"}, {"@type": "HowToStep", "text": "Rinse the turkey thoroughly with cold water, both inside and outside, then dry it completely with paper towels. Removing surface moisture helps the skin become crisp during roasting.", "name": "Rinse the turkey thoroughly with cold water, both inside and outside, then dry it completely with paper towels. Removing surface moisture helps the skin become crisp during roasting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-1"}, {"@type": "HowToStep", "text": "Place the kosher salt, black pepper, dried sage, rosemary, and dried thyme in a small bowl.", "name": "Place the kosher salt, black pepper, dried sage, rosemary, and dried thyme in a small bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-2"}, {"@type": "HowToStep", "text": "Stir thoroughly until all of the herbs and seasonings are evenly incorporated.", "name": "Stir thoroughly until all of the herbs and seasonings are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-3"}, {"@type": "HowToStep", "text": "Heat the oven to 375°F (190°C).", "name": "Heat the oven to 375°F (190°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-4"}, {"@type": "HowToStep", "text": "Set the prepared turkey breast-side up on a roasting rack positioned inside a deep roasting pan.", "name": "Set the prepared turkey breast-side up on a roasting rack positioned inside a deep roasting pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-5"}, {"@type": "HowToStep", "text": "Spread the olive oil evenly over the entire exterior of the turkey, making sure all areas of the skin are well coated.", "name": "Spread the olive oil evenly over the entire exterior of the turkey, making sure all areas of the skin are well coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-6"}, {"@type": "HowToStep", "text": "Place the quartered onion inside the neck cavity. Fold the loose neck skin over the onion to help hold it securely in place.", "name": "Place the quartered onion inside the neck cavity. Fold the loose neck skin over the onion to help hold it securely in place.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the fresh thyme sprigs inside the main body cavity, then scatter a portion of the prepared seasoning mixture inside the cavity.", "name": "Arrange the fresh thyme sprigs inside the main body cavity, then scatter a portion of the prepared seasoning mixture inside the cavity.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-8"}, {"@type": "HowToStep", "text": "Press the remaining dry rub evenly over the outside of the turkey so the entire surface is thoroughly seasoned.", "name": "Press the remaining dry rub evenly over the outside of the turkey so the entire surface is thoroughly seasoned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-9"}, {"@type": "HowToStep", "text": "Fold the wing tips underneath the turkey to protect them from excessive browning.", "name": "Fold the wing tips underneath the turkey to protect them from excessive browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-10"}, {"@type": "HowToStep", "text": "Secure the legs together with kitchen twine unless the turkey already has an attached leg holder.", "name": "Secure the legs together with kitchen twine unless the turkey already has an attached leg holder.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-11"}, {"@type": "HowToStep", "text": "Place the turkey in the preheated 375°F (190°C) oven and roast undisturbed for 30 minutes without opening the oven door.", "name": "Place the turkey in the preheated 375°F (190°C) oven and roast undisturbed for 30 minutes without opening the oven door.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-12"}, {"@type": "HowToStep", "text": "After the initial 30 minutes, lower the oven temperature to 325°F (165°C).", "name": "After the initial 30 minutes, lower the oven temperature to 325°F (165°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-13"}, {"@type": "HowToStep", "text": "Continue roasting for an additional 2 to 2½ hours. If desired, spoon the accumulated pan juices over the turkey once or twice during this stage to help keep the meat moist.", "name": "Continue roasting for an additional 2 to 2½ hours. If desired, spoon the accumulated pan juices over the turkey once or twice during this stage to help keep the meat moist.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-14"}, {"@type": "HowToStep", "text": "Check doneness with a food thermometer inserted into the innermost portion of the thigh and wing as well as the thickest section of the breast. The turkey is fully cooked when these areas reach an internal temperature of 165°F (74°C).", "name": "Check doneness with a food thermometer inserted into the innermost portion of the thigh and wing as well as the thickest section of the breast. The turkey is fully cooked when these areas reach an internal temperature of 165°F (74°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-15"}, {"@type": "HowToStep", "text": "Remove the roasted turkey from the oven and allow it to rest uncovered for 20 minutes before carving.", "name": "Remove the roasted turkey from the oven and allow it to rest uncovered for 20 minutes before carving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-16"}, {"@type": "HowToStep", "text": "The resting period gives the juices time to redistribute throughout the meat and helps produce cleaner slices.", "name": "The resting period gives the juices time to redistribute throughout the meat and helps produce cleaner slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dry-rub-roasted-turkey/#wprm-recipe-46625-step-0-17"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Dry Rub Roasted Turkey"}</script>
