heat the oven to 400°F. Lightly grease a 9×13-inch baking dish with avocado oil and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/green-enchilada-casserole/#wprm-recipe-31578-step-0-0"}, {"@type": "HowToStep", "text": "In a large skillet over medium-high heat, warm the avocado oil. Add the diced onion, minced garlic, and diced zucchini. Sauté until softened and fragrant, then remove from heat.", "name": "In a large skillet over medium-high heat, warm the avocado oil. Add the diced onion, minced garlic, and diced zucchini. Sauté until softened and fragrant, then remove from heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/green-enchilada-casserole/#wprm-recipe-31578-step-0-1"}, {"@type": "HowToStep", "text": "In a large mixing bowl, combine the sautéed vegetables with shredded chicken, Greek yogurt, lime juice, 1 cup of enchilada sauce, 4 oz of the pepper jack cheese, Hatch chiles, cumin, crushed red pepper flakes, salt, and pepper. Stir until evenly blended.", "name": "In a large mixing bowl, combine the sautéed vegetables with shredded chicken, Greek yogurt, lime juice, 1 cup of enchilada sauce, 4 oz of the pepper jack cheese, Hatch chiles, cumin, crushed red pepper flakes, salt, and pepper. Stir until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/green-enchilada-casserole/#wprm-recipe-31578-step-0-2"}, {"@type": "HowToStep", "text": "Spread 1/3 cup of the green enchilada sauce across the bottom of the prepared baking dish. Arrange 4 tortillas over the sauce, overlapping slightly to form a complete layer. Spoon a generous cup of the chicken mixture over the tortillas and spread evenly. Drizzle another 1/3 cup of enchilada sauce over the filling.", "name": "Spread 1/3 cup of the green enchilada sauce across the bottom of the prepared baking dish. Arrange 4 tortillas over the sauce, overlapping slightly to form a complete layer. Spoon a generous cup of the chicken mixture over the tortillas and spread evenly. Drizzle another 1/3 cup of enchilada sauce over the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/green-enchilada-casserole/#wprm-recipe-31578-step-0-3"}, {"@type": "HowToStep", "text": "Repeat the layering process twice more: tortillas, filling, then sauce—ending with the remaining chicken mixture on top.", "name": "Repeat the layering process twice more: tortillas, filling, then sauce—ending with the remaining chicken mixture on top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/green-enchilada-casserole/#wprm-recipe-31578-step-0-4"}, {"@type": "HowToStep", "text": "Pour the remaining enchilada sauce over the final layer and top evenly with the reserved 2 oz of pepper jack cheese and the Monterey Jack cheese.", "name": "Pour the remaining enchilada sauce over the final layer and top evenly with the reserved 2 oz of pepper jack cheese and the Monterey Jack cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/green-enchilada-casserole/#wprm-recipe-31578-step-0-5"}, {"@type": "HowToStep", "text": "Bake uncovered in the preheated oven for 20–25 minutes, or until the cheese is melted, bubbling, and lightly golden.", "name": "Bake uncovered in the preheated oven for 20–25 minutes, or until the cheese is melted, bubbling, and lightly golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/green-enchilada-casserole/#wprm-recipe-31578-step-0-6"}, {"@type": "HowToStep", "text": "Garnish as desired with chopped cilantro, diced red onion, avocado slices, jalapeños, lime wedges, and a dollop of sour cream or Greek yogurt.", "name": "Garnish as desired with chopped cilantro, diced red onion, avocado slices, jalapeños, lime wedges, and a dollop of sour cream or Greek yogurt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/green-enchilada-casserole/#wprm-recipe-31578-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Mexican-Inspired"], "keywords": "gr
