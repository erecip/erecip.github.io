    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin French Toast", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, pumpkin-spiced French toast made with homemade almond-flour bread. The loaf is baked until light and golden, dried overnight, cut into sticks, soaked in a creamy pumpkin custard, pan-fried, and finished with a cinnamon-sweetener coating.", "datePublished": "2019-04-04T03:44:19+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/pumpkin-french-toast1.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/pumpkin-french-toast1.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/pumpkin-french-toast1.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/pumpkin-french-toast1.png"], "cookTime": "PT40M", "totalTime": "PT40M", "recipeIngredient": ["3 tablespoons avocado oil", "1 cup finely ground almond flour", "3  large egg yolks", "2 teaspoons baking powder", "2 tablespoons water", "1/3 cup egg white protein powder (or whey protein powder as a substitute)", "1/2 teaspoon cream of tartar", "1  large whole egg", "2 tablespoons Swerve sweetener", "3  large egg whites", "1/2 teaspoon salt", "3 tablespoons pure pumpkin puree", "1 teaspoon pumpkin pie spice", "3  large eggs (preferably at room temperature)", "1/2 teaspoon vanilla extract", "1/4 cup heavy cream", "3 tablespoons powdered Swerve sweetener", "2 tablespoons butter or oil (for greasing the skillet)", "1/2 teaspoon ground cinnamon", "3 tablespoons Swerve sweetener"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 325°F (163°C). Cover only the bottom of a 9 × 5-inch loaf pan with parchment paper, leaving the sides of the pan ungreased.", "name": "Preheat the oven to 325°F (163°C). Cover only the bottom of a 9 × 5-inch loaf pan with parchment paper, leaving the sides of the pan ungreased.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-0"}, {"@type": "HowToStep", "text": "Place the almond flour, egg white protein powder, 2 tablespoons Swerve sweetener, baking powder, and salt in a large mixing bowl. Whisk thoroughly until evenly blended and any lumps have been broken apart.", "name": "Place the almond flour, egg white protein powder, 2 tablespoons Swerve sweetener, baking powder, and salt in a large mixing bowl. Whisk thoroughly until evenly blended and any lumps have been broken apart.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-1"}, {"@type": "HowToStep", "text": "In a medium bowl, whisk together the 3 egg yolks, 1 whole egg, avocado oil, and water until the mixture is smooth and uniform.", "name": "In a medium bowl, whisk together the 3 egg yolks, 1 whole egg, avocado oil, and water until the mixture is smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-2"}, {"@type": "HowToStep", "text": "Add the wet mixture to the dry ingredients. Whisk until a smooth, fully incorporated batter forms.", "name": "Add the wet mixture to the dry ingredients. Whisk until a smooth, fully incorporated batter forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-3"}, {"@type": "HowToStep", "text": "Place the 3 egg whites in a separate large bowl and add the cream of tartar. Beat until the whites hold very stiff peaks.", "name": "Place the 3 egg whites in a separate large bowl and add the cream of tartar. Beat until the whites hold very stiff peaks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-4"}, {"@type": "HowToStep", "text": "Carefully fold the whipped whites into the prepared batter. Continue folding gently until evenly incorporated and no visible white streaks remain, taking care to retain as much air in the mixture as possible.", "name": "Carefully fold the whipped whites into the prepared batter. Continue folding gently until evenly incorporated and no visible white streaks remain, taking care to retain as much air in the mixture as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared loaf pan and level the surface.", "name": "Transfer the batter to the prepared loaf pan and level the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-6"}, {"@type": "HowToStep", "text": "Bake for 40–50 minutes, until the loaf is risen and golden and the surface springs back when lightly pressed.", "name": "Bake for 40–50 minutes, until the loaf is risen and golden and the surface springs back when lightly pressed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-7"}, {"@type": "HowToStep", "text": "Remove the loaf from the oven and allow it to cool completely while still in the pan.", "name": "Remove the loaf from the oven and allow it to cool completely while still in the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-8"}, {"@type": "HowToStep", "text": "Once fully cooled, loosen the loaf by carefully running a sharp knife around the interior edges of the pan. Turn out the bread and remove the parchment from the bottom.", "name": "Once fully cooled, loosen the loaf by carefully running a sharp knife around the interior edges of the pan. Turn out the bread and remove the parchment from the bottom.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-9"}, {"@type": "HowToStep", "text": "Slice the loaf into 12 equal pieces. Arrange the slices on a wire rack and allow them to dry out overnight.", "name": "Slice the loaf into 12 equal pieces. Arrange the slices on a wire rack and allow them to dry out overnight.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-10"}, {"@type": "HowToStep", "text": "After drying, divide each bread slice into 3 sticks, producing 36 French toast sticks in total.", "name": "After drying, divide each bread slice into 3 sticks, producing 36 French toast sticks in total.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-11"}, {"@type": "HowToStep", "text": "In a broad, shallow bowl, combine the 3 eggs, heavy cream, pumpkin puree, powdered Swerve sweetener, pumpkin pie spice, and vanilla extract.", "name": "In a broad, shallow bowl, combine the 3 eggs, heavy cream, pumpkin puree, powdered Swerve sweetener, pumpkin pie spice, and vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-12"}, {"@type": "HowToStep", "text": "Whisk until the custard is completely smooth and the pumpkin is evenly distributed.", "name": "Whisk until the custard is completely smooth and the pumpkin is evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-13"}, {"@type": "HowToStep", "text": "Heat approximately one-quarter of the butter or oil in a large skillet over medium heat.", "name": "Heat approximately one-quarter of the butter or oil in a large skillet over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-14"}, {"@type": "HowToStep", "text": "Place the bread sticks in the pumpkin custard, turning them to coat all sides. Allow each stick to absorb the mixture for approximately 30 seconds.", "name": "Place the bread sticks in the pumpkin custard, turning them to coat all sides. Allow each stick to absorb the mixture for approximately 30 seconds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-15"}, {"@type": "HowToStep", "text": "Transfer one-quarter of the soaked sticks to the heated skillet without crowding the pan. Cook until golden on every side, allowing approximately 1 minute per side.", "name": "Transfer one-quarter of the soaked sticks to the heated skillet without crowding the pan. Cook until golden on every side, allowing approximately 1 minute per side.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-16"}, {"@type": "HowToStep", "text": "Move the cooked sticks to a platter. Repeat with the remaining bread, custard, and butter or oil until all batches have been cooked.", "name": "Move the cooked sticks to a platter. Repeat with the remaining bread, custard, and butter or oil until all batches have been cooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-17"}, {"@type": "HowToStep", "text": "Combine the 3 tablespoons Swerve sweetener and ground cinnamon in a shallow dish.", "name": "Combine the 3 tablespoons Swerve sweetener and ground cinnamon in a shallow dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-18"}, {"@type": "HowToStep", "text": "While the French toast sticks are still warm, roll each one through the cinnamon-sweetener mixture until evenly coated.", "name": "While the French toast sticks are still warm, roll each one through the cinnamon-sweetener mixture until evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-19"}, {"@type": "HowToStep", "text": "Serve warm, with butter or a preferred keto-friendly syrup if desired.", "name": "Serve warm, with butter or a preferred keto-friendly syrup if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-french-toast/#wprm-recipe-42681-step-0-20"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Pumpkin French Toast"}</script>
