    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "One-Pot Creamy Sausage Potato Chowder", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, comforting chowder featuring golden sausage, tender potatoes, wild rice, and aromatic vegetables in a smooth, cream-enriched broth. Everything is prepared in one pot for a deeply satisfying meal with minimal cleanup.", "datePublished": "2024-06-05T02:41:00+00:00", "image": ["https://erecip.github.io/en/creamy-sausage-potato-chowder/Creamy-Sausage-Potato-Chowder2.png", "https://erecip.github.io/en/creamy-sausage-potato-chowder/Creamy-Sausage-Potato-Chowder2.png", "https://erecip.github.io/en/creamy-sausage-potato-chowder/Creamy-Sausage-Potato-Chowder2.png", "https://erecip.github.io/en/creamy-sausage-potato-chowder/Creamy-Sausage-Potato-Chowder2.png"], "prepTime": "PT15M", "cookTime": "PT60M", "recipeIngredient": ["375 ml 1½ cups single cream, light cream, or half-and-half", "2  bay leaves", "3  medium potatoes (peeled and chopped into chunks)", "½ teaspoon dried thyme", "2  celery stalks (thinly sliced)", "100 g ½ cup wild rice", "1 tablespoon olive oil", "2  garlic cloves (finely minced)", "1  litre (4 cups chicken or vegetable stock)", "3 tablespoons plain or all-purpose flour", "2  carrots (sliced)", "400  g (approximately 6 sausages of any preferred flavour)", "1  onion (chopped)", "Salt (according to taste)", "Freshly ground black pepper (according to taste)", "Chopped fresh parsley (for serving)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm the olive oil in a large soup pot over medium heat. Remove the sausage meat from its casings and place it in the pot. Break the meat into smaller pieces with a spatula, then cook until browned on the outside and fully cooked through. Transfer the sausage to a separate plate. If the sausage releases a large amount of fat, discard the excess while retaining approximately 2 tablespoons in the pot.", "name": "Warm the olive oil in a large soup pot over medium heat. Remove the sausage meat from its casings and place it in the pot. Break the meat into smaller pieces with a spatula, then cook until browned on the outside and fully cooked through. Transfer the sausage to a separate plate. If the sausage releases a large amount of fat, discard the excess while retaining approximately 2 tablespoons in the pot.", "url": "https://erecip.github.io/en/creamy-sausage-potato-chowder/#wprm-recipe-39082-step-0-0"}, {"@type": "HowToStep", "text": "Add the chopped onion, sliced celery, and carrots to the same pot. Cook over low heat for 10 minutes, stirring occasionally, until the vegetables begin to soften.", "name": "Add the chopped onion, sliced celery, and carrots to the same pot. Cook over low heat for 10 minutes, stirring occasionally, until the vegetables begin to soften.", "url": "https://erecip.github.io/en/creamy-sausage-potato-chowder/#wprm-recipe-39082-step-0-1"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and dried thyme, then continue cooking for a further 30 seconds.", "name": "Stir in the minced garlic and dried thyme, then continue cooking for a further 30 seconds.", "url": "https://erecip.github.io/en/creamy-sausage-potato-chowder/#wprm-recipe-39082-step-0-2"}, {"@type": "HowToStep", "text": "Scatter the flour evenly over the vegetables and mix it thoroughly with the fat until a paste forms. Cook this mixture for another 2 minutes, then return the browned sausage to the pot.", "name": "Scatter the flour evenly over the vegetables and mix it thoroughly with the fat until a paste forms. Cook this mixture for another 2 minutes, then return the browned sausage to the pot.", "url": "https://erecip.github.io/en/creamy-sausage-potato-chowder/#wprm-recipe-39082-step-0-3"}, {"@type": "HowToStep", "text": "Pour in a small quantity of the stock and stir until it has blended smoothly with the flour mixture. Gradually add the remaining stock, followed by the bay leaves and wild rice.", "name": "Pour in a small quantity of the stock and stir until it has blended smoothly with the flour mixture. Gradually add the remaining stock, followed by the bay leaves and wild rice.", "url": "https://erecip.github.io/en/creamy-sausage-potato-chowder/#wprm-recipe-39082-step-0-4"}, {"@type": "HowToStep", "text": "Bring the chowder to a gentle simmer. Cook over low to medium heat for 30 minutes.", "name": "Bring the chowder to a gentle simmer. Cook over low to medium heat for 30 minutes.", "url": "https://erecip.github.io/en/creamy-sausage-potato-chowder/#wprm-recipe-39082-step-0-5"}, {"@type": "HowToStep", "text": "Add the potato chunks and continue simmering for approximately 15 minutes, or until both the potatoes and wild rice are tender.", "name": "Add the potato chunks and continue simmering for approximately 15 minutes, or until both the potatoes and wild rice are tender.", "url": "https://erecip.github.io/en/creamy-sausage-potato-chowder/#wprm-recipe-39082-step-0-6"}, {"@type": "HowToStep", "text": "Pour in the cream, then season the chowder with salt and freshly ground black pepper. Allow the soup to heat gently until the cream is warmed through, taking care not to bring it to a vigorous boil.", "name": "Pour in the cream, then season the chowder with salt and freshly ground black pepper. Allow the soup to heat gently until the cream is warmed through, taking care not to bring it to a vigorous boil.", "url": "https://erecip.github.io/en/creamy-sausage-potato-chowder/#wprm-recipe-39082-step-0-7"}, {"@type": "HowToStep", "text": "Remove the pot from the heat. Discard the bay leaves and serve the chowder garnished with chopped fresh parsley.", "name": "Remove the pot from the heat. Discard the bay leaves and serve the chowder garnished with chopped fresh parsley.", "url": "https://erecip.github.io/en/creamy-sausage-potato-chowder/#wprm-recipe-39082-step-0-8"}], "recipeCategory": ["Soup"], "recipeCuisine": ["American"]}</script>
