 and bake for 55–65 minutes, or until the surface is golden brown and the loaf feels firm when lightly touched.", "name": "Place the pan in the preheated oven and bake for 55–65 minutes, or until the surface is golden brown and the loaf feels firm when lightly touched.", "url": "https://erecip.github.io/en/keto-pumpkin-bread/#wprm-recipe-39480-step-0-6"}, {"@type": "HowToStep", "text": "Remove the bread from the oven and leave it in the pan until fully cooled. Complete cooling allows the loaf to set properly and maintain its shape when sliced.", "name": "Remove the bread from the oven and leave it in the pan until fully cooled. Complete cooling allows the loaf to set properly and maintain its shape when sliced.", "url": "https://erecip.github.io/en/keto-pumpkin-bread/#wprm-recipe-39480-step-0-7"}], "recipeCategory": ["Bread", "Breakfast", "Snack"], "recipeCuisine": ["American"], "keywords": "Keto Pumpkin Bread"}</script>
