    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Breast with Egg Noodles", "author": {"@type": "Person", "name": "BenDes"}, "description": "A comforting one-pot chicken and noodle dish featuring tender shredded chicken, soft egg noodles, and a rich, creamy chicken broth. The stovetop method produces a thick, savory sauce as the noodles finish cooking in the covered pot, while a slow cooker variation offers an alternative hands-off preparation.", "datePublished": "2023-07-19T15:32:12+00:00", "image": ["https://erecip.github.io/en/chicken-breast-with-egg-noodles/chicken-breast-with-egg-noodles1.png", "https://erecip.github.io/en/chicken-breast-with-egg-noodles/chicken-breast-with-egg-noodles1.png", "https://erecip.github.io/en/chicken-breast-with-egg-noodles/chicken-breast-with-egg-noodles1.png", "https://erecip.github.io/en/chicken-breast-with-egg-noodles/chicken-breast-with-egg-noodles1.png"], "totalTime": "PT40M", "recipeIngredient": ["4 cups chicken stock", "3  boneless chicken breasts", "½ teaspoon onion powder", "2  cans cream of chicken soup", "1 teaspoon freshly ground black pepper", "½ cup unsalted butter (melted)", "1 cup water", "½ teaspoon garlic powder", "1 teaspoon salt", "12 ounces egg noodles"], "recipeInstructions": [{"@type": "HowToSection", "name": "Stovetop Method", "itemListElement": [{"@type": "HowToStep", "text": "Pour the chicken stock and water into a large pot or Dutch oven. Add the salt, garlic powder, onion powder, and black pepper, then stir until evenly combined.", "name": "Pour the chicken stock and water into a large pot or Dutch oven. Add the salt, garlic powder, onion powder, and black pepper, then stir until evenly combined.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-0"}, {"@type": "HowToStep", "text": "Add the chicken breasts and melted butter to the seasoned broth. Cover the pot and cook over medium heat until the liquid reaches a boil.", "name": "Add the chicken breasts and melted butter to the seasoned broth. Cover the pot and cook over medium heat until the liquid reaches a boil.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-1"}, {"@type": "HowToStep", "text": "As soon as the broth begins boiling, lower the heat to low. Keep the pot covered and cook the chicken for 30 minutes.", "name": "As soon as the broth begins boiling, lower the heat to low. Keep the pot covered and cook the chicken for 30 minutes.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the cooked chicken breasts from the broth to a plate or other suitable surface and allow them to cool.", "name": "Transfer the cooked chicken breasts from the broth to a plate or other suitable surface and allow them to cool.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-3"}, {"@type": "HowToStep", "text": "When the chicken is cool enough to handle, either shred it using two forks or cut it into bite-sized pieces. Set the prepared chicken aside.", "name": "When the chicken is cool enough to handle, either shred it using two forks or cut it into bite-sized pieces. Set the prepared chicken aside.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-4"}, {"@type": "HowToStep", "text": "Add the cream of chicken soup to the broth remaining in the pot. Whisk thoroughly until the mixture becomes smooth and evenly blended.", "name": "Add the cream of chicken soup to the broth remaining in the pot. Whisk thoroughly until the mixture becomes smooth and evenly blended.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-5"}, {"@type": "HowToStep", "text": "Bring the creamy broth back to a boil. Add the uncooked egg noodles along with the shredded or chopped chicken.", "name": "Bring the creamy broth back to a boil. Add the uncooked egg noodles along with the shredded or chopped chicken.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-6"}, {"@type": "HowToStep", "text": "The noodles do not need to be completely covered by the liquid at first. As they soften during cooking, they will gradually settle into the broth.", "name": "The noodles do not need to be completely covered by the liquid at first. As they soften during cooking, they will gradually settle into the broth.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-7"}, {"@type": "HowToStep", "text": "Once the mixture returns to a simmer, reduce the heat to medium and cover the pot. Cook for 2–5 minutes, or until the noodles are approximately halfway cooked. At this stage, they should still be too firm to eat but flexible enough to bend in half without snapping.", "name": "Once the mixture returns to a simmer, reduce the heat to medium and cover the pot. Cook for 2–5 minutes, or until the noodles are approximately halfway cooked. At this stage, they should still be too firm to eat but flexible enough to bend in half without snapping.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-8"}, {"@type": "HowToStep", "text": "Turn off the burner while leaving the pot covered. Allow the dish to stand until the noodles are fully tender and the sauce has thickened slightly.", "name": "Turn off the burner while leaving the pot covered. Allow the dish to stand until the noodles are fully tender and the sauce has thickened slightly.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-9"}, {"@type": "HowToStep", "text": "Depending on the thickness, size, type, and quality of the egg noodles, this final covered resting period may require anywhere from 5–20 minutes.", "name": "Depending on the thickness, size, type, and quality of the egg noodles, this final covered resting period may require anywhere from 5–20 minutes.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-0-10"}]}, {"@type": "HowToSection", "name": "Slow Cooker Instructions", "itemListElement": [{"@type": "HowToStep", "text": "Add the chicken stock, cream of chicken soup, water, salt, garlic powder, onion powder, and black pepper to a large slow cooker. Stir until the ingredients are thoroughly combined.", "name": "Add the chicken stock, cream of chicken soup, water, salt, garlic powder, onion powder, and black pepper to a large slow cooker. Stir until the ingredients are thoroughly combined.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-1-0"}, {"@type": "HowToStep", "text": "Place the chicken breasts and melted butter into the broth mixture. Cover and cook on Low for 5–6 hours or on High for 2–4 hours.", "name": "Place the chicken breasts and melted butter into the broth mixture. Cover and cook on Low for 5–6 hours or on High for 2–4 hours.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-1-1"}, {"@type": "HowToStep", "text": "Remove the cooked chicken from the slow cooker and leave it to cool. If the slow cooker is not already set to High, increase the temperature to High while the chicken cools.", "name": "Remove the cooked chicken from the slow cooker and leave it to cool. If the slow cooker is not already set to High, increase the temperature to High while the chicken cools.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-1-2"}, {"@type": "HowToStep", "text": "Once cool enough to handle, shred the chicken with two forks or cut it into bite-sized portions.", "name": "Once cool enough to handle, shred the chicken with two forks or cut it into bite-sized portions.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-1-3"}, {"@type": "HowToStep", "text": "Return the prepared chicken to the slow cooker and add the uncooked egg noodles.", "name": "Return the prepared chicken to the slow cooker and add the uncooked egg noodles.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-1-4"}, {"@type": "HowToStep", "text": "Stir gently so the noodles are coated with the broth mixture. Cover and continue cooking for 20–40 minutes, or until the noodles reach the desired tenderness.", "name": "Stir gently so the noodles are coated with the broth mixture. Cover and continue cooking for 20–40 minutes, or until the noodles reach the desired tenderness.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-1-5"}, {"@type": "HowToStep", "text": "During this final cooking period, gently stir the mixture once or twice to encourage the noodles to cook evenly.", "name": "During this final cooking period, gently stir the mixture once or twice to encourage the noodles to cook evenly.", "url": "https://erecip.github.io/en/chicken-breast-with-egg-noodles/#wprm-recipe-43947-step-1-6"}]}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Chicken Breast with Egg Noodles"}</script>
