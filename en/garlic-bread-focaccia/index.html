    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Garlic Bread Focaccia", "author": {"@type": "Person", "name": "BenDes"}, "description": "A deeply golden, airy focaccia prepared with a slow refrigerated fermentation, then finished with aromatic garlic butter, fresh parsley, flaky sea salt, and grated Parmigiano Reggiano.", "datePublished": "2018-10-05T08:24:19+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/garlic-bread-focaccia.png", "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/garlic-bread-focaccia.png", "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/garlic-bread-focaccia.png", "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/garlic-bread-focaccia.png"], "totalTime": "PT1680M", "recipeIngredient": ["5 cups plain all-purpose flour", "2 1/4 teaspoons active dry yeast", "1/4 cup extra-virgin olive oil", "1 teaspoon granulated sugar", "1 1/2 tablespoons kosher salt", "2 cups water (warmed to approximately 105–115°F)", "4  garlic cloves (finely minced or pressed)", "4 tablespoons salted butter", "Flaky sea salt (several pinches)", "Freshly grated Parmigiano Reggiano (as needed)", "Chopped flat-leaf parsley (for garnishing)", "Olive oil (as needed for drizzling)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Pour the 2 cups of warm water into a medium mixing bowl. Add the active dry yeast and granulated sugar, then whisk until thoroughly combined.", "name": "Pour the 2 cups of warm water into a medium mixing bowl. Add the active dry yeast and granulated sugar, then whisk until thoroughly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-0"}, {"@type": "HowToStep", "text": "Leave the mixture undisturbed for 10 minutes. A layer of foam should develop across the surface, indicating that the yeast has activated.", "name": "Leave the mixture undisturbed for 10 minutes. A layer of foam should develop across the surface, indicating that the yeast has activated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-1"}, {"@type": "HowToStep", "text": "Add the all-purpose flour and kosher salt to the bowl of a stand mixer fitted with a dough hook. Briefly whisk the dry ingredients together to distribute the salt evenly.", "name": "Add the all-purpose flour and kosher salt to the bowl of a stand mixer fitted with a dough hook. Briefly whisk the dry ingredients together to distribute the salt evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-2"}, {"@type": "HowToStep", "text": "Pour the activated yeast mixture into the flour mixture. Knead on low speed for 6 minutes, or until the dough becomes elastic and begins pulling cleanly away from the sides of the bowl.", "name": "Pour the activated yeast mixture into the flour mixture. Knead on low speed for 6 minutes, or until the dough becomes elastic and begins pulling cleanly away from the sides of the bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-3"}, {"@type": "HowToStep", "text": "If kneading without a stand mixer, work the dough by hand until it develops a smooth, stretchy, and elastic texture.", "name": "If kneading without a stand mixer, work the dough by hand until it develops a smooth, stretchy, and elastic texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-4"}, {"@type": "HowToStep", "text": "Lightly coat the inside of a large bowl with extra-virgin olive oil. Transfer the kneaded dough to the prepared bowl and turn it so the exterior is lightly covered with oil.", "name": "Lightly coat the inside of a large bowl with extra-virgin olive oil. Transfer the kneaded dough to the prepared bowl and turn it so the exterior is lightly covered with oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-5"}, {"@type": "HowToStep", "text": "Seal the bowl securely with plastic wrap and refrigerate for 24 hours. This extended cold fermentation develops the focaccia's flavor and contributes to its airy texture.", "name": "Seal the bowl securely with plastic wrap and refrigerate for 24 hours. This extended cold fermentation develops the focaccia's flavor and contributes to its airy texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-6"}, {"@type": "HowToStep", "text": "Remove the refrigerated dough. Pour 1/4 cup extra-virgin olive oil into a 9 × 13-inch metal baking or cake pan, spreading it evenly over the base.", "name": "Remove the refrigerated dough. Pour 1/4 cup extra-virgin olive oil into a 9 × 13-inch metal baking or cake pan, spreading it evenly over the base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-7"}, {"@type": "HowToStep", "text": "Set the chilled dough in the oiled pan and gently stretch it toward the edges. Cover the pan and allow the dough to rest at room temperature for 15 minutes.", "name": "Set the chilled dough in the oiled pan and gently stretch it toward the edges. Cover the pan and allow the dough to rest at room temperature for 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-8"}, {"@type": "HowToStep", "text": "Once rested, the dough should be easier to handle. Using your fingertips, carefully extend it until it reaches the edges of the pan.", "name": "Once rested, the dough should be easier to handle. Using your fingertips, carefully extend it until it reaches the edges of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-9"}, {"@type": "HowToStep", "text": "Cover the pan tightly once more and leave the dough to rise at room temperature for 3 hours.", "name": "Cover the pan tightly once more and leave the dough to rise at room temperature for 3 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-10"}, {"@type": "HowToStep", "text": "Preheat the oven to 450°F. Once the oven reaches temperature, allow it to remain heated for an additional 5–10 minutes so the interior is thoroughly hot.", "name": "Preheat the oven to 450°F. Once the oven reaches temperature, allow it to remain heated for an additional 5–10 minutes so the interior is thoroughly hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-11"}, {"@type": "HowToStep", "text": "Remove the covering from the risen dough. Drizzle approximately 2 tablespoons of olive oil over the surface, then press your fingertips deeply into the dough to form characteristic focaccia dimples throughout.", "name": "Remove the covering from the risen dough. Drizzle approximately 2 tablespoons of olive oil over the surface, then press your fingertips deeply into the dough to form characteristic focaccia dimples throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-12"}, {"@type": "HowToStep", "text": "Scatter several pinches of flaky sea salt over the top.", "name": "Scatter several pinches of flaky sea salt over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-13"}, {"@type": "HowToStep", "text": "Bake for 20–25 minutes, until both the surface and sides are richly golden brown. Rotate the pan halfway through the baking period to encourage even coloring.", "name": "Bake for 20–25 minutes, until both the surface and sides are richly golden brown. Rotate the pan halfway through the baking period to encourage even coloring.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-14"}, {"@type": "HowToStep", "text": "While the focaccia bakes, melt the salted butter in a small saucepan or skillet over medium to medium-low heat.", "name": "While the focaccia bakes, melt the salted butter in a small saucepan or skillet over medium to medium-low heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-15"}, {"@type": "HowToStep", "text": "Stir in the minced or pressed garlic and cook for approximately 1 minute, just until fragrant and beginning to develop a light golden color.", "name": "Stir in the minced or pressed garlic and cook for approximately 1 minute, just until fragrant and beginning to develop a light golden color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-16"}, {"@type": "HowToStep", "text": "Immediately remove the pan from the heat and pour the garlic butter into a heatproof bowl so the garlic does not continue cooking and burn.", "name": "Immediately remove the pan from the heat and pour the garlic butter into a heatproof bowl so the garlic does not continue cooking and burn.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-17"}, {"@type": "HowToStep", "text": "As soon as the focaccia comes out of the oven, pour the warm garlic butter evenly across the surface. Use a pastry brush to distribute the butter and garlic over the entire top.", "name": "As soon as the focaccia comes out of the oven, pour the warm garlic butter evenly across the surface. Use a pastry brush to distribute the butter and garlic over the entire top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-18"}, {"@type": "HowToStep", "text": "Scatter chopped flat-leaf parsley over the bread, then generously finish with freshly grated Parmigiano Reggiano.", "name": "Scatter chopped flat-leaf parsley over the bread, then generously finish with freshly grated Parmigiano Reggiano.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-19"}, {"@type": "HowToStep", "text": "Allow the focaccia to cool slightly on a wire rack to help preserve its crisp exterior, or slice and serve while it remains warm.", "name": "Allow the focaccia to cool slightly on a wire rack to help preserve its crisp exterior, or slice and serve while it remains warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-bread-focaccia/#wprm-recipe-41875-step-0-20"}], "recipeCategory": ["Bread"], "recipeCuisine": ["Italian"], "keywords": "Garlic Bread Focaccia"}</script>
