    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Caramelized Onions Jam", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, savory-sweet onion preserve made by slowly caramelizing sweet yellow onions, then simmering them with balsamic vinegar, sugar, herbs, and seasonings until thick and syrupy. This deeply flavored jam pairs especially well with sharp cheeses, roasted meats, and charcuterie selections.", "datePublished": "2018-04-26T14:18:13+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/caramelized-onions-jam.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/caramelized-onions-jam.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/caramelized-onions-jam.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/caramelized-onions-jam.png"], "cookTime": "PT55M", "totalTime": "PT1495M", "recipeIngredient": ["1 1/2 cups balsamic vinegar", "2 tablespoons summer savory (finely minced, or an equivalent combination of thyme and rosemary)", "4 tablespoons extra-virgin olive oil", "1 teaspoon freshly ground black pepper", "4 pounds sweet yellow onions (sliced very thinly)", "2 teaspoons sea salt", "1 1/2 cups granulated sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Fill a canning pot with water, cover it, and bring the water to a boil. Starting this process early is helpful because a large quantity of water may require considerable time to reach the proper temperature.", "name": "Fill a canning pot with water, cover it, and bring the water to a boil. Starting this process early is helpful because a large quantity of water may require considerable time to reach the proper temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-0"}, {"@type": "HowToStep", "text": "Select clean canning jars and inspect the rims carefully. Do not use jars with chips, cracks, or damaged edges that could interfere with sealing.", "name": "Select clean canning jars and inspect the rims carefully. Do not use jars with chips, cracks, or damaged edges that could interfere with sealing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-1"}, {"@type": "HowToStep", "text": "Clean the canning lids and screw bands with hot, soapy water. When using specialty or non-standard lids, prepare them according to the manufacturer's directions.", "name": "Clean the canning lids and screw bands with hot, soapy water. When using specialty or non-standard lids, prepare them according to the manufacturer's directions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-2"}, {"@type": "HowToStep", "text": "Pour the extra-virgin olive oil into a large heavy-bottomed saucepan, Dutch oven, or spacious skillet, then add the finely sliced sweet yellow onions.", "name": "Pour the extra-virgin olive oil into a large heavy-bottomed saucepan, Dutch oven, or spacious skillet, then add the finely sliced sweet yellow onions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-3"}, {"@type": "HowToStep", "text": "Cook over medium heat for approximately 10–15 minutes, stirring occasionally rather than continuously. Allow the onions to soften gradually and develop an even golden color. Avoid increasing the heat to speed up the process, as gentle caramelization is important for developing the intended flavor.", "name": "Cook over medium heat for approximately 10–15 minutes, stirring occasionally rather than continuously. Allow the onions to soften gradually and develop an even golden color. Avoid increasing the heat to speed up the process, as gentle caramelization is important for developing the intended flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-4"}, {"@type": "HowToStep", "text": "Add the granulated sugar and balsamic vinegar directly to the caramelized onions and their cooking oil.", "name": "Add the granulated sugar and balsamic vinegar directly to the caramelized onions and their cooking oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-5"}, {"@type": "HowToStep", "text": "Continue cooking over medium heat for approximately 45 minutes. Stir from time to time as the liquid reduces and the mixture becomes thick, glossy, and syrup-like.", "name": "Continue cooking over medium heat for approximately 45 minutes. Stir from time to time as the liquid reduces and the mixture becomes thick, glossy, and syrup-like.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-6"}, {"@type": "HowToStep", "text": "Toward the end of the cooking period, stir in the sea salt, freshly ground black pepper, and finely chopped summer savory. If summer savory is unavailable, use a blend of thyme and rosemary with a similar herbal character.", "name": "Toward the end of the cooking period, stir in the sea salt, freshly ground black pepper, and finely chopped summer savory. If summer savory is unavailable, use a blend of thyme and rosemary with a similar herbal character.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-7"}, {"@type": "HowToStep", "text": "Taste the finished mixture and adjust the existing seasonings only if necessary, keeping the original flavor profile intact.", "name": "Taste the finished mixture and adjust the existing seasonings only if necessary, keeping the original flavor profile intact.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-8"}, {"@type": "HowToStep", "text": "While the onion jam is still hot, ladle it into the prepared jars. A canning funnel may be used for easier filling. Leave approximately 1/4 inch of headspace between the jam and the top of each jar.", "name": "While the onion jam is still hot, ladle it into the prepared jars. A canning funnel may be used for easier filling. Leave approximately 1/4 inch of headspace between the jam and the top of each jar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-9"}, {"@type": "HowToStep", "text": "Carefully wipe the jar rims clean, position the lids, and secure the screw bands until they are finger-tight.", "name": "Carefully wipe the jar rims clean, position the lids, and secure the screw bands until they are finger-tight.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-10"}, {"@type": "HowToStep", "text": "Using a jar lifter, lower the filled jars into the boiling-water canner. Make certain the jars are covered by at least 1 inch of water.", "name": "Using a jar lifter, lower the filled jars into the boiling-water canner. Make certain the jars are covered by at least 1 inch of water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-11"}, {"@type": "HowToStep", "text": "Return the water to a simmer and process the jars for 10 minutes. For higher elevations, add 1 additional minute of processing time for every 1,000 feet of altitude as needed.", "name": "Return the water to a simmer and process the jars for 10 minutes. For higher elevations, add 1 additional minute of processing time for every 1,000 feet of altitude as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-12"}, {"@type": "HowToStep", "text": "Lift the jars from the canner and place them upright on a towel-covered surface. Leave them undisturbed for 24 hours to cool completely.", "name": "Lift the jars from the canner and place them upright on a towel-covered surface. Leave them undisturbed for 24 hours to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-13"}, {"@type": "HowToStep", "text": "After the 24-hour cooling period, inspect each jar to confirm that it has sealed. A properly sealed lid should be drawn firmly downward and should not flex when pressed.", "name": "After the 24-hour cooling period, inspect each jar to confirm that it has sealed. A properly sealed lid should be drawn firmly downward and should not flex when pressed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-14"}, {"@type": "HowToStep", "text": "Remove the screw bands and clean the exterior surfaces of the jars before storing them in a cool, dry location.", "name": "Remove the screw bands and clean the exterior surfaces of the jars before storing them in a cool, dry location.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-15"}, {"@type": "HowToStep", "text": "Any jar that has failed to seal should be refrigerated and used before the properly sealed jars.", "name": "Any jar that has failed to seal should be refrigerated and used before the properly sealed jars.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-16"}, {"@type": "HowToStep", "text": "When the jam is not being canned, allow it to cool before transferring it to airtight containers and storing it in the refrigerator.", "name": "When the jam is not being canned, allow it to cool before transferring it to airtight containers and storing it in the refrigerator.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-jam/#wprm-recipe-41804-step-0-17"}], "recipeCategory": ["Condiment"], "keywords": "Caramelized Onions Jam"}</script>
