er loosely with foil to keep warm while preparing the sauce.", "name": "Remove the cooked chicken to a cutting board and let it rest for 3 minutes. Slice crosswise into ½-inch thick pieces. Cover loosely with foil to keep warm while preparing the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-alfredo-pasta/#wprm-recipe-32153-step-0-3"}, {"@type": "HowToStep", "text": "Lower the heat to medium-low and return the same skillet to the stove. Add the butter and pour in the heavy cream, whisking gently until the butter fully dissolves.", "name": "Lower the heat to medium-low and return the same skillet to the stove. Add the butter and pour in the heavy cream, whisking gently until the butter fully dissolves.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-alfredo-pasta/#wprm-recipe-32153-step-0-4"}, {"@type": "HowToStep", "text": "Add in the fresh garlic, garlic powder, Italian herbs, salt, and pepper. Whisk continuously until the mixture is smooth and homogenous.", "name": "Add in the fresh garlic, garlic powder, Italian herbs, salt, and pepper. Whisk continuously until the mixture is smooth and homogenous.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-alfredo-pasta/#wprm-recipe-32153-step-0-5"}, {"@type": "HowToStep", "text": "Allow the mixture to simmer gently (do not allow to boil) for 3 to 4 minutes, stirring frequently, until the sauce begins to thicken.", "name": "Allow the mixture to simmer gently (do not allow to boil) for 3 to 4 minutes, stirring frequently, until the sauce begins to thicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-alfredo-pasta/#wprm-recipe-32153-step-0-6"}, {"@type": "HowToStep", "text": "Gradually incorporate the Parmesan cheese, stirring until fully melted and the sauce turns velvety. If the consistency becomes overly thick, introduce a small amount of the reserved pasta water—1 to 2 tablespoons at a time—until desired texture is achieved.", "name": "Gradually incorporate the Parmesan cheese, stirring until fully melted and the sauce turns velvety. If the consistency becomes overly thick, introduce a small amount of the reserved pasta water—1 to 2 tablespoons at a time—until desired texture is achieved.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-alfredo-pasta/#wprm-recipe-32153-step-0-7"}, {"@type": "HowToStep", "text": "Remove the sauce from the heat and immediately toss in the cooked fettuccine, ensuring the noodles are fully coated.", "name": "Remove the sauce from the heat and immediately toss in the cooked fettuccine, ensuring the noodles are fully coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-alfredo-pasta/#wprm-recipe-32153-step-0-8"}, {"@type": "HowToStep", "text": "Distribute the creamy pasta among serving plates. Lay several slices of the warm chicken over each portion. Finish with a sprinkle of fresh parsley, extra Parmesan, and cracked black pepper, if desired.", "name": "Distribute the creamy pasta among serving plates. Lay several slices of the warm chicken over each portion. Finish with a sprinkle of fresh parsley, extra Parmesan, and cracked black pepper, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-alfredo-pasta/#wprm-recipe-32153-step-0-9"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American", "Italian"], "keywords": "chicken alfredo pasta"}</script>
