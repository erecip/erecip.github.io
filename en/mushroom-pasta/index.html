    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mushroom Pasta", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender fettuccine or linguine is coated in a velvety Parmesan cream sauce filled with deeply browned mushrooms, aromatic garlic, and a concentrated white wine reduction. Fresh parsley and additional Parmesan provide a bright, savory finish.", "datePublished": "2020-01-03T23:30:47+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/mushroom-pasta.png", "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/mushroom-pasta.png", "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/mushroom-pasta.png", "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/mushroom-pasta.png"], "prepTime": "PT10M", "cookTime": "PT20M", "totalTime": "PT30M", "recipeIngredient": ["10 ounces white or cremini mushrooms (cut into approximately ¼-inch slices)", "⅓ cup freshly and finely grated Parmesan cheese", "2 cloves fresh garlic (finely minced)", "¾ cup heavy cream", "½ teaspoon fine salt", "½ cup dry white wine (or an equal quantity of chicken broth)", "2 tablespoons unsalted butter", "½ teaspoon freshly ground black pepper", "½ cup reduced-sodium chicken broth", "½ tablespoon olive oil", "Roughly chopped fresh parsley (optional)", "6 ounces fettuccine or linguine", "Additional grated Parmesan cheese (for serving)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of generously salted water to a rolling boil. Add the fettuccine or linguine and cook it for one minute less than the time specified on the package. Before draining, reserve approximately 1 cup of the starchy cooking liquid. Set the drained pasta aside.", "name": "Bring a large pot of generously salted water to a rolling boil. Add the fettuccine or linguine and cook it for one minute less than the time specified on the package. Before draining, reserve approximately 1 cup of the starchy cooking liquid. Set the drained pasta aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-0"}, {"@type": "HowToStep", "text": "While the pasta cooks, slice the mushrooms to an even thickness of about ¼ inch and finely mince the garlic.", "name": "While the pasta cooks, slice the mushrooms to an even thickness of about ¼ inch and finely mince the garlic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-1"}, {"@type": "HowToStep", "text": "Place a large skillet over medium-high heat. Add the unsalted butter and olive oil, allowing the butter to melt and begin foaming.", "name": "Place a large skillet over medium-high heat. Add the unsalted butter and olive oil, allowing the butter to melt and begin foaming.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-2"}, {"@type": "HowToStep", "text": "Arrange the sliced mushrooms in the hot skillet and season them with a small pinch of the measured salt and black pepper. Leave them undisturbed for 2 to 3 minutes so that they develop a golden surface.", "name": "Arrange the sliced mushrooms in the hot skillet and season them with a small pinch of the measured salt and black pepper. Leave them undisturbed for 2 to 3 minutes so that they develop a golden surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-3"}, {"@type": "HowToStep", "text": "Stir the mushrooms and continue cooking for another 2 to 3 minutes, or until they are richly browned and the moisture they release has largely evaporated.", "name": "Stir the mushrooms and continue cooking for another 2 to 3 minutes, or until they are richly browned and the moisture they release has largely evaporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-4"}, {"@type": "HowToStep", "text": "Add the minced garlic to the skillet. Cook for approximately 1 minute, stirring continuously, until fragrant without allowing the garlic to become overly browned.", "name": "Add the minced garlic to the skillet. Cook for approximately 1 minute, stirring continuously, until fragrant without allowing the garlic to become overly browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-5"}, {"@type": "HowToStep", "text": "Pour in the dry white wine and scrape the bottom of the skillet with a wooden spoon to loosen the caramelized pieces. Simmer for 3 to 4 minutes, until the liquid has reduced by roughly three-quarters.", "name": "Pour in the dry white wine and scrape the bottom of the skillet with a wooden spoon to loosen the caramelized pieces. Simmer for 3 to 4 minutes, until the liquid has reduced by roughly three-quarters.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-6"}, {"@type": "HowToStep", "text": "Add the low-sodium chicken broth and heavy cream to the mushroom mixture. Bring the sauce to a gentle simmer.", "name": "Add the low-sodium chicken broth and heavy cream to the mushroom mixture. Bring the sauce to a gentle simmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-7"}, {"@type": "HowToStep", "text": "Stir in the finely grated Parmesan, the remaining salt, and the remaining black pepper. Continue stirring for about 2 minutes, until the cheese has fully melted and the sauce has begun to thicken.", "name": "Stir in the finely grated Parmesan, the remaining salt, and the remaining black pepper. Continue stirring for about 2 minutes, until the cheese has fully melted and the sauce has begun to thicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the drained pasta directly into the skillet. Toss it with the mushroom sauce over medium heat for 1 to 2 minutes, ensuring that every strand is evenly coated.", "name": "Transfer the drained pasta directly into the skillet. Toss it with the mushroom sauce over medium heat for 1 to 2 minutes, ensuring that every strand is evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-9"}, {"@type": "HowToStep", "text": "When necessary, incorporate the reserved pasta water 1 or 2 tablespoons at a time until the sauce reaches a smooth, flowing consistency that lightly clings to the noodles.", "name": "When necessary, incorporate the reserved pasta water 1 or 2 tablespoons at a time until the sauce reaches a smooth, flowing consistency that lightly clings to the noodles.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-10"}, {"@type": "HowToStep", "text": "Divide the mushroom pasta among serving bowls or plates. Garnish each portion with roughly chopped parsley, when using, and finish with additional grated Parmesan. Serve immediately while hot.", "name": "Divide the mushroom pasta among serving bowls or plates. Garnish each portion with roughly chopped parsley, when using, and finish with additional grated Parmesan. Serve immediately while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta/#wprm-recipe-40784-step-0-11"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Mushroom Pasta"}</script>
