    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Iced Apple Cider Caramel Oatmeal Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These oatmeal cookies combine browned salted butter, hearty rolled oats, homemade apple cider caramel, and optional Honeycrisp apple pieces. Once baked, the cookies are finished with a smooth maple-vanilla icing and a light scattering of flaky sea salt for a sweet-and-salty contrast.", "datePublished": "2019-03-27T07:36:37+00:00", "image": ["https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/iced-apple-cider-caramel-oatmeal-cookies.png", "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/iced-apple-cider-caramel-oatmeal-cookies.png", "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/iced-apple-cider-caramel-oatmeal-cookies.png", "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/iced-apple-cider-caramel-oatmeal-cookies.png"], "prepTime": "PT25M", "cookTime": "PT12M", "totalTime": "PT57M", "recipeIngredient": ["1/2 cup firmly packed dark brown sugar", "1 teaspoon salt", "1/4 cup apple cider", "2 tablespoons salted butter (brought to a softened consistency)", "2 cups old-fashioned rolled oats", "1  Honeycrisp apple (finely diced from thin slices, optional)", "1 teaspoon baking soda", "2  large eggs (preferably at room temperature)", "1 cup brown sugar", "2 cups all-purpose flour", "1 tablespoon vanilla extract", "1/2 teaspoon salt", "1 cup salted butter (equal to 2 sticks)", "1 tablespoon vanilla extract", "3/4 cup sifted confectioners’ sugar", "Flaky sea salt (for finishing)", "1/3 cup pure maple syrup"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the 2 tablespoons softened salted butter and 1/2 cup packed dark brown sugar in a large pot over medium heat.", "name": "Place the 2 tablespoons softened salted butter and 1/2 cup packed dark brown sugar in a large pot over medium heat.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-0"}, {"@type": "HowToStep", "text": "Allow the butter to melt completely, then pour in the 1/4 cup apple cider.", "name": "Allow the butter to melt completely, then pour in the 1/4 cup apple cider.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-1"}, {"@type": "HowToStep", "text": "Bring the mixture to a boil while stirring continuously. Continue cooking for approximately 10 minutes, or until the sugar has dissolved and the caramel becomes dark, vigorously bubbling, and noticeably thick.", "name": "Bring the mixture to a boil while stirring continuously. Continue cooking for approximately 10 minutes, or until the sugar has dissolved and the caramel becomes dark, vigorously bubbling, and noticeably thick.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-2"}, {"@type": "HowToStep", "text": "Mix in the 1 teaspoon salt.", "name": "Mix in the 1 teaspoon salt.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-3"}, {"@type": "HowToStep", "text": "Carefully transfer the hot caramel onto a baking sheet lined with parchment paper.", "name": "Carefully transfer the hot caramel onto a baking sheet lined with parchment paper.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-4"}, {"@type": "HowToStep", "text": "Leave the caramel undisturbed until fully set. Once firm, cut or break it into small pieces and reserve them for the cookie dough. Keep in mind that a longer cooking time will produce a firmer caramel after cooling.", "name": "Leave the caramel undisturbed until fully set. Once firm, cut or break it into small pieces and reserve them for the cookie dough. Keep in mind that a longer cooking time will produce a firmer caramel after cooling.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-5"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F.", "name": "Preheat the oven to 350°F.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-6"}, {"@type": "HowToStep", "text": "Arrange the finely diced Honeycrisp apple in one even layer on a parchment-lined baking sheet.", "name": "Arrange the finely diced Honeycrisp apple in one even layer on a parchment-lined baking sheet.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-7"}, {"@type": "HowToStep", "text": "Bake for approximately 10 minutes to remove some of the fruit’s excess moisture.", "name": "Bake for approximately 10 minutes to remove some of the fruit’s excess moisture.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-8"}, {"@type": "HowToStep", "text": "Take the apple pieces out of the oven and leave them to cool before incorporating them into the dough.", "name": "Take the apple pieces out of the oven and leave them to cool before incorporating them into the dough.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-9"}, {"@type": "HowToStep", "text": "Place the 1 cup salted butter in a skillet over medium heat.", "name": "Place the 1 cup salted butter in a skillet over medium heat.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-10"}, {"@type": "HowToStep", "text": "Melt the butter and continue cooking, stirring or gently swirling the pan from time to time. After approximately 3–4 minutes, the butter should develop a golden-brown color and a distinctly nutty aroma.", "name": "Melt the butter and continue cooking, stirring or gently swirling the pan from time to time. After approximately 3–4 minutes, the butter should develop a golden-brown color and a distinctly nutty aroma.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-11"}, {"@type": "HowToStep", "text": "Immediately pour the browned butter into a heat-resistant bowl.", "name": "Immediately pour the browned butter into a heat-resistant bowl.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-12"}, {"@type": "HowToStep", "text": "Allow it to cool for approximately 5 minutes before preparing the dough.", "name": "Allow it to cool for approximately 5 minutes before preparing the dough.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-13"}, {"@type": "HowToStep", "text": "Add the 1 cup brown sugar, 2 room-temperature eggs, and 1 tablespoon vanilla extract to the slightly cooled browned butter.", "name": "Add the 1 cup brown sugar, 2 room-temperature eggs, and 1 tablespoon vanilla extract to the slightly cooled browned butter.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-14"}, {"@type": "HowToStep", "text": "Stir thoroughly until the mixture is smooth and evenly blended.", "name": "Stir thoroughly until the mixture is smooth and evenly blended.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-15"}, {"@type": "HowToStep", "text": "Add the 2 cups all-purpose flour, 2 cups old-fashioned rolled oats, 1 teaspoon baking soda, and 1/2 teaspoon salt.", "name": "Add the 2 cups all-purpose flour, 2 cups old-fashioned rolled oats, 1 teaspoon baking soda, and 1/2 teaspoon salt.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-16"}, {"@type": "HowToStep", "text": "Mix just until all of the dry ingredients are evenly incorporated.", "name": "Mix just until all of the dry ingredients are evenly incorporated.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-17"}, {"@type": "HowToStep", "text": "Fold in the prepared apple cider caramel pieces along with the dried Honeycrisp apple, if using, distributing them throughout the dough.", "name": "Fold in the prepared apple cider caramel pieces along with the dried Honeycrisp apple, if using, distributing them throughout the dough.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-18"}, {"@type": "HowToStep", "text": "Keep the oven heated to 350°F.", "name": "Keep the oven heated to 350°F.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-19"}, {"@type": "HowToStep", "text": "Portion the prepared dough into rounded, tablespoon-sized balls.", "name": "Portion the prepared dough into rounded, tablespoon-sized balls.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-20"}, {"@type": "HowToStep", "text": "Place the dough portions on a parchment-lined baking sheet, leaving approximately 2 inches of space between each cookie.", "name": "Place the dough portions on a parchment-lined baking sheet, leaving approximately 2 inches of space between each cookie.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-21"}, {"@type": "HowToStep", "text": "Bake for 8 minutes, then rotate the baking sheet.", "name": "Bake for 8 minutes, then rotate the baking sheet.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-22"}, {"@type": "HowToStep", "text": "Continue baking for another 3–4 minutes, stopping when the edges of the cookies are just beginning to set.", "name": "Continue baking for another 3–4 minutes, stopping when the edges of the cookies are just beginning to set.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-23"}, {"@type": "HowToStep", "text": "Leave the cookies on the baking sheet until completely cool. The residual heat from the pan will continue cooking them slightly as they rest.", "name": "Leave the cookies on the baking sheet until completely cool. The residual heat from the pan will continue cooking them slightly as they rest.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-24"}, {"@type": "HowToStep", "text": "While the cookies cool, whisk together the 3/4 cup confectioners’ sugar, 1/3 cup pure maple syrup, 1 tablespoon vanilla extract, and a small pinch of salt until the glaze is completely smooth.", "name": "While the cookies cool, whisk together the 3/4 cup confectioners’ sugar, 1/3 cup pure maple syrup, 1 tablespoon vanilla extract, and a small pinch of salt until the glaze is completely smooth.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-25"}, {"@type": "HowToStep", "text": "If the icing is overly thick, add a small amount of water as necessary until it reaches a suitable consistency for drizzling.", "name": "If the icing is overly thick, add a small amount of water as necessary until it reaches a suitable consistency for drizzling.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-26"}, {"@type": "HowToStep", "text": "Generously drizzle the maple glaze over the fully cooled cookies.", "name": "Generously drizzle the maple glaze over the fully cooled cookies.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-27"}, {"@type": "HowToStep", "text": "Finish each cookie with a light sprinkling of flaky sea salt before serving.", "name": "Finish each cookie with a light sprinkling of flaky sea salt before serving.", "url": "https://erecip.github.io/en/iced-apple-cider-caramel-oatmeal-cookies/#wprm-recipe-46584-step-0-28"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Iced Apple Cider Caramel Oatmeal Cookies"}</script>
