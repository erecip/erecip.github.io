    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "New York Cheesecake Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic, dense, and luxuriously creamy New York Style Cheesecake crowned with a vibrant homemade strawberry topping. This timeless dessert is baked gently at a low temperature, ensuring an ultra-smooth, crack-free finish.", "datePublished": "2024-10-25T18:11:20+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/new-york-cheesecake-recipe/New-York-Cheesecake-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/new-york-cheesecake-recipe/New-York-Cheesecake-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/new-york-cheesecake-recipe/New-York-Cheesecake-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/new-york-cheesecake-recipe/New-York-Cheesecake-Recipe.png"], "recipeYield": ["10", "10 slices"], "prepTime": "PT30M", "cookTime": "PT160M", "totalTime": "PT670M", "recipeIngredient": ["1 pound fresh strawberries", "1 tbsp honey", "1/4 cup 50g granulated sugar", "Juice of 1/2 lemon", "1 tsp cornstarch", "1/2 tsp cinnamon", "1/2 cup 110g unsalted butter, melted", "2 cups 280g finely ground honey graham cracker crumbs (about 2 sleeves)", "1/8 tsp kosher salt", "1/3 cup 70g granulated sugar", "2 tsp lemon juice (freshly squeezed)", "4  large eggs plus 1 egg yolk (at room temperature)", "3 tbsp cornstarch", "1 cup 250g sour cream, room temperature", "2 tsp vanilla extract", "1 1/2 cups 300g granulated sugar", "4 8oz blocks full-fat Philadelphia cream cheese, room temperature"], "recipeInstructions": [{"@type": "HowToStep", "text": "Strawberry Topping", "name": "Strawberry Topping", "url": "https://easy-recipes322.github.io/easy-recipes323/en/new-york-cheesecake-recipe/#wprm-recipe-49826-step-0-0"}, {"@type": "HowToStep", "text": "Rinse, hull, and quarter the strawberries, reserving ½ cup aside. Combine sugar and cornstarch in a medium saucepan, then add the prepared strawberries (excluding the reserved portion) and toss to coat. Pour in the lemon juice and place over medium heat. Bring to a gentle boil, stirring occasionally, and cook for 5–8 minutes until the berries soften. Puree half the mixture using an immersion blender or transfer to a food processor, then return it to the pan along with the reserved fresh berries. Stir through the honey and heat for an additional minute until thickened and glossy. Remove from heat, cool at room temperature, then chill in the refrigerator.", "name": "Rinse, hull, and quarter the strawberries, reserving ½ cup aside. Combine sugar and cornstarch in a medium saucepan, then add the prepared strawberries (excluding the reserved portion) and toss to coat. Pour in the lemon juice and place over medium heat. Bring to a gentle boil, stirring occasionally, and cook for 5–8 minutes until the berries soften. Puree half the mixture using an immersion blender or transfer to a food processor, then return it to the pan along with the reserved fresh berries. Stir through the honey and heat for an additional minute until thickened and glossy. Remove from heat, cool at room temperature, then chill in the refrigerator.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/new-york-cheesecake-recipe/#wprm-recipe-49826-step-0-1"}, {"@type": "HowToStep", "text": "Graham Cracker Crust", "name": "Graham Cracker Crust", "url": "https://easy-recipes322.github.io/easy-recipes323/en/new-york-cheesecake-recipe/#wprm-recipe-49826-step-0-2"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F. Line a 9-inch springform pan with parchment on the base and sides, allowing the side strips to extend slightly above the rim. Lightly grease with cooking spray. In a medium bowl, combine graham cracker crumbs, sugar, cinnamon, and salt. Stir in melted butter until the mixture resembles damp sand. Firmly press into the base and up the sides of the pan. Bake for 10 minutes, then allow to cool while preparing the filling.", "name": "Preheat the oven to 350°F. Line a 9-inch springform pan with parchment on the base and sides, allowing the side strips to extend slightly above the rim. Lightly grease with cooking spray. In a medium bowl, combine graham cracker crumbs, sugar, cinnamon, and salt. Stir in melted butter until the mixture resembles damp sand. Firmly press into the base and up the sides of the pan. Bake for 10 minutes, then allow to cool while preparing the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/new-york-cheesecake-recipe/#wprm-recipe-49826-step-0-3"}, {"@type": "HowToStep", "text": "New York Cheesecake", "name": "New York Cheesecake", "url": "https://easy-recipes322.github.io/easy-recipes323/en/new-york-cheesecake-recipe/#wprm-recipe-49826-step-0-4"}, {"@type": "HowToStep", "text": "Reduce oven temperature to 305°F. Place a large baking pan on the oven’s bottom rack and bring a pot of water to a boil on the stovetop. Beat together eggs, lemon juice, and vanilla in a measuring cup and set aside. Using a stand mixer fitted with the paddle attachment, mix the softened cream cheese on medium-low speed until smooth, about 30–60 seconds. Add sugar and cornstarch, mixing on low for 30 seconds more. Scrape down the bowl and mix again briefly to ensure no lumps remain. With the mixer on the lowest speed, gradually stream in the egg mixture in three to four additions, mixing slowly and patiently. Gently fold in the sour cream by hand. Pour the cheesecake batter into the prepared crust, tapping the pan gently to release any trapped air bubbles. Pour the boiling water into the baking pan on the bottom rack, then immediately place the cheesecake on the middle rack above it to create steam. Bake for 1 hour and 40 minutes, until the edges are lightly golden and the center slightly wobbles when nudged. Switch off the oven, crack the door open, and let the cheesecake rest inside for 1 hour. Transfer the cheesecake to the refrigerator, uncovered, and chill overnight. The next day, release from the pan, slice, and garnish with powdered sugar or the chilled strawberry sauce.", "name": "Reduce oven temperature to 305°F. Place a large baking pan on the oven’s bottom rack and bring a pot of water to a boil on the stovetop. Beat together eggs, lemon juice, and vanilla in a measuring cup and set aside. Using a stand mixer fitted with the paddle attachment, mix the softened cream cheese on medium-low speed until smooth, about 30–60 seconds. Add sugar and cornstarch, mixing on low for 30 seconds more. Scrape down the bowl and mix again briefly to ensure no lumps remain. With the mixer on the lowest speed, gradually stream in the egg mixture in three to four additions, mixing slowly and patiently. Gently fold in the sour cream by hand. Pour the cheesecake batter into the prepared crust, tapping the pan gently to release any trapped air bubbles. Pour the boiling water into the baking pan on the bottom rack, then immediately place the cheesecake on the middle rack above it to create steam. Bake for 1 hour and 40 minutes, until the edges are lightly golden and the center slightly wobbles when nudged. Switch off the oven, crack the door open, and let the cheesecake rest inside for 1 hour. Transfer the cheesecake to the refrigerator, uncovered, and chill overnight. The next day, release from the pan, slice, and garnish with powdered sugar or the chilled strawberry sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/new-york-cheesecake-recipe/#wprm-recipe-49826-step-0-5"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "New York Cheesecake Recipe"}</script>
