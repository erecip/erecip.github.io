eks/#wprm-recipe-38450-step-0-4"}, {"@type": "HowToStep", "text": "Finish the dish by grating the vegetarian pecorino over the beans. Add the lemon juice and zest, then adjust the seasoning as needed.", "name": "Finish the dish by grating the vegetarian pecorino over the beans. Add the lemon juice and zest, then adjust the seasoning as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-beans-with-leeks/#wprm-recipe-38450-step-0-5"}, {"@type": "HowToStep", "text": "Sprinkle the chopped parsley over the top just before serving for freshness and color.", "name": "Sprinkle the chopped parsley over the top just before serving for freshness and color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-beans-with-leeks/#wprm-recipe-38450-step-0-6"}, {"@type": "HowToStep", "text": "Serve immediately with crisp slices of bread alongside, allowing the bread to complement the rich, cheesy sauce.", "name": "Serve immediately with crisp slices of bread alongside, allowing the bread to complement the rich, cheesy sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-beans-with-leeks/#wprm-recipe-38450-step-0-7"}], "recipeCategory": ["Main Course", "Side Dish"], "recipeCuisine": ["Vegetarian"], "keywords": "Butter Beans with Leeks"}</script>
