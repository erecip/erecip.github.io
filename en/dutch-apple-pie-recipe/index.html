nd salt in a mixing bowl. Add softened butter and work it in with your hands until the mixture forms coarse crumbs. Stir in the chopped pecans. Distribute the topping evenly over the apples.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie-recipe/#wprm-recipe-13660-step-0-3"}, {"@type": "HowToStep", "text": "Bake the pie uncovered for 50 to 60 minutes, or until the internal temperature reaches 175˚F. To prevent spills, place a sheet of foil on the lower rack. If the crumb topping darkens too quickly, tent with foil. Remove the pie from the oven and let it rest for 1 hour before slicing to allow the filling to firm up.", "name": "Bake the pie uncovered for 50 to 60 minutes, or until the internal temperature reaches 175˚F. To prevent spills, place a sheet of foil on the lower rack. If the crumb topping darkens too quickly, tent with foil. Remove the pie from the oven and let it rest for 1 hour before slicing to allow the filling to firm up.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie-recipe/#wprm-recipe-13660-step-0-4"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Dutch Apple Pie Recipe"}</script>
