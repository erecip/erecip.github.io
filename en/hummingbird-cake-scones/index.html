    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Hummingbird Cake Scones", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, fruit-filled scones featuring ripe banana, crushed pineapple, coconut, and warm cinnamon, finished with a creamy mascarpone glaze and a crisp topping of toasted pecans and coconut.", "datePublished": "2022-05-29T20:57:34+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/hummingbird-cake-scones.png", "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/hummingbird-cake-scones.png", "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/hummingbird-cake-scones.png", "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/hummingbird-cake-scones.png"], "cookTime": "PT10M", "totalTime": "PT10M", "recipeIngredient": ["2  ripe bananas (thoroughly mashed, approximately 3/4 cup)", "1/4 cup shredded coconut", "1 1/2 teaspoons ground cinnamon", "3 1/4 cups all-purpose flour", "1/3 cup crushed pineapple (very well drained)", "2 teaspoons vanilla extract", "1/2 teaspoon fine salt", "2/3 cup buttermilk (ideally brought to room temperature)", "1/3 cup brown sugar", "3/4 cup cold unsalted butter (cut into roughly 1/2-inch cubes)", "1/2 teaspoon baking soda", "2 1/2 teaspoons baking powder", "3 tablespoons chopped pecans", "3 tablespoons unsweetened coconut flakes", "1 cup confectioners' sugar", "4  –5 tablespoons milk", "4 ounces mascarpone cheese (softened to room temperature, approximately 70°F)", "2 teaspoons vanilla extract"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 425°F (220°C).", "name": "Preheat the oven to 425°F (220°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-0"}, {"@type": "HowToStep", "text": "Place the flour, brown sugar, baking powder, baking soda, salt, and cinnamon in a large mixing bowl. Whisk until the ingredients are evenly distributed.", "name": "Place the flour, brown sugar, baking powder, baking soda, salt, and cinnamon in a large mixing bowl. Whisk until the ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-1"}, {"@type": "HowToStep", "text": "Add the chilled butter cubes. Using a pastry cutter, fork, or your fingertips, work the butter into the flour mixture until the texture resembles coarse crumbs. This process generally takes about 2–3 minutes when done by hand.", "name": "Add the chilled butter cubes. Using a pastry cutter, fork, or your fingertips, work the butter into the flour mixture until the texture resembles coarse crumbs. This process generally takes about 2–3 minutes when done by hand.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-2"}, {"@type": "HowToStep", "text": "Create a well in the center of the flour-and-butter mixture. Pour in the buttermilk and vanilla, then add the mashed bananas and thoroughly drained crushed pineapple.", "name": "Create a well in the center of the flour-and-butter mixture. Pour in the buttermilk and vanilla, then add the mashed bananas and thoroughly drained crushed pineapple.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-3"}, {"@type": "HowToStep", "text": "Stir with a large spoon just until the mixture begins forming a dough. The consistency may remain somewhat sticky.", "name": "Stir with a large spoon just until the mixture begins forming a dough. The consistency may remain somewhat sticky.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-4"}, {"@type": "HowToStep", "text": "Gently fold in the shredded coconut. If necessary, use your hands to finish bringing the dough together. Lightly flour both your hands and the work surface to prevent excessive sticking.", "name": "Gently fold in the shredded coconut. If necessary, use your hands to finish bringing the dough together. Lightly flour both your hands and the work surface to prevent excessive sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-5"}, {"@type": "HowToStep", "text": "Divide the prepared dough into two equal portions. On a lightly floured surface, gently pat each portion into a circle measuring approximately 6 inches across.", "name": "Divide the prepared dough into two equal portions. On a lightly floured surface, gently pat each portion into a circle measuring approximately 6 inches across.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-6"}, {"@type": "HowToStep", "text": "Slice each round into either 6 or 8 wedge-shaped pieces.", "name": "Slice each round into either 6 or 8 wedge-shaped pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the wedges on a baking sheet with space between each scone. Bake in the preheated oven for 10–12 minutes, or until the scones develop a light golden color.", "name": "Arrange the wedges on a baking sheet with space between each scone. Bake in the preheated oven for 10–12 minutes, or until the scones develop a light golden color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-8"}, {"@type": "HowToStep", "text": "Remove them from the oven and allow them to cool before applying the glaze.", "name": "Remove them from the oven and allow them to cool before applying the glaze.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-9"}, {"@type": "HowToStep", "text": "While the scones bake, add the chopped pecans and unsweetened coconut flakes to a nonstick skillet set over medium-low heat.", "name": "While the scones bake, add the chopped pecans and unsweetened coconut flakes to a nonstick skillet set over medium-low heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-10"}, {"@type": "HowToStep", "text": "Toast for several minutes, stirring or tossing the mixture frequently, until the coconut becomes golden brown. Watch carefully because coconut can darken and burn rapidly.", "name": "Toast for several minutes, stirring or tossing the mixture frequently, until the coconut becomes golden brown. Watch carefully because coconut can darken and burn rapidly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-11"}, {"@type": "HowToStep", "text": "Remove the skillet from the heat and reserve the toasted mixture for garnishing.", "name": "Remove the skillet from the heat and reserve the toasted mixture for garnishing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-12"}, {"@type": "HowToStep", "text": "Place the room-temperature mascarpone in a large bowl and whisk until smooth and creamy.", "name": "Place the room-temperature mascarpone in a large bowl and whisk until smooth and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-13"}, {"@type": "HowToStep", "text": "Gradually blend in the confectioners' sugar, followed by the vanilla extract.", "name": "Gradually blend in the confectioners' sugar, followed by the vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-14"}, {"@type": "HowToStep", "text": "Slowly pour in 4 tablespoons of milk while whisking continuously. Continue mixing until the glaze is completely smooth and free from lumps.", "name": "Slowly pour in 4 tablespoons of milk while whisking continuously. Continue mixing until the glaze is completely smooth and free from lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-15"}, {"@type": "HowToStep", "text": "If a thinner consistency is required, incorporate additional milk 1 tablespoon at a time, whisking thoroughly after each addition.", "name": "If a thinner consistency is required, incorporate additional milk 1 tablespoon at a time, whisking thoroughly after each addition.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-16"}, {"@type": "HowToStep", "text": "Once the baked scones have cooled slightly, spoon, drizzle, or spread a generous layer of mascarpone glaze across their tops.", "name": "Once the baked scones have cooled slightly, spoon, drizzle, or spread a generous layer of mascarpone glaze across their tops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-17"}, {"@type": "HowToStep", "text": "Immediately scatter the toasted pecans and coconut flakes over the glaze.", "name": "Immediately scatter the toasted pecans and coconut flakes over the glaze.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-18"}, {"@type": "HowToStep", "text": "Serve the finished hummingbird cake scones promptly.", "name": "Serve the finished hummingbird cake scones promptly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hummingbird-cake-scones/#wprm-recipe-45806-step-0-19"}], "keywords": "Hummingbird Cake Scones"}</script>
