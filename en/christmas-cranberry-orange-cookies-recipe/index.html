-recipe/#wprm-recipe-38391-step-0-5"}, {"@type": "HowToStep", "text": "Drop tablespoon-sized portions of dough onto prepared cookie sheets, leaving enough space between each portion for spreading during baking.", "name": "Drop tablespoon-sized portions of dough onto prepared cookie sheets, leaving enough space between each portion for spreading during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-orange-cookies-recipe/#wprm-recipe-38391-step-0-6"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 8 to 10 minutes, or until the cookie edges turn lightly golden.", "name": "Bake in the preheated oven for 8 to 10 minutes, or until the cookie edges turn lightly golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-orange-cookies-recipe/#wprm-recipe-38391-step-0-7"}, {"@type": "HowToStep", "text": "Allow the baked cookies to rest on the cookie sheets for 2 minutes.", "name": "Allow the baked cookies to rest on the cookie sheets for 2 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-orange-cookies-recipe/#wprm-recipe-38391-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the cookies to cooling racks and let them cool completely before icing.", "name": "Transfer the cookies to cooling racks and let them cool completely before icing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-orange-cookies-recipe/#wprm-recipe-38391-step-0-9"}, {"@type": "HowToStep", "text": "While the cookies cool, prepare the icing by combining the powdered sugar, orange juice, and orange zest in a medium bowl. Stir until the mixture becomes smooth.", "name": "While the cookies cool, prepare the icing by combining the powdered sugar, orange juice, and orange zest in a medium bowl. Stir until the mixture becomes smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-orange-cookies-recipe/#wprm-recipe-38391-step-0-10"}, {"@type": "HowToStep", "text": "Drizzle the orange icing over the fully cooled cookies.", "name": "Drizzle the orange icing over the fully cooled cookies.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-orange-cookies-recipe/#wprm-recipe-38391-step-0-11"}, {"@type": "HowToStep", "text": "Let the icing firm completely on the cookies.", "name": "Let the icing firm completely on the cookies.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-orange-cookies-recipe/#wprm-recipe-38391-step-0-12"}, {"@type": "HowToStep", "text": "To help the icing set more quickly, place the cookies in the freezer briefly.", "name": "To help the icing set more quickly, place the cookies in the freezer briefly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-orange-cookies-recipe/#wprm-recipe-38391-step-0-13"}, {"@type": "HowToStep", "text": "Once the icing has hardened, store the cookies in an airtight container to preserve freshness.", "name": "Once the icing has hardened, store the cookies in an airtight container to preserve freshness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-orange-cookies-recipe/#wprm-recipe-38391-step-0-14"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Christmas Cranberry Orange Cookies"}</script>
