    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Boston Cream Donuts Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "These classic Boston cream donuts feature a tender yeast dough, filled with smooth vanilla pastry cream and topped with a glossy chocolate glaze. Perfectly indulgent and far superior to any store-bought version, these homemade treats make an exceptional dessert or breakfast.", "datePublished": "2024-08-10T12:07:00+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/Boston-Cream-Donuts-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/Boston-Cream-Donuts-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/Boston-Cream-Donuts-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/Boston-Cream-Donuts-Recipe1.png"], "recipeYield": ["9"], "prepTime": "PT60M", "cookTime": "PT30M", "totalTime": "PT210M", "recipeIngredient": ["⅔ cup 157 ml whole milk", "¾ teaspoon vanilla extract", "6 Tablespoons 85 g unsalted butter, melted", "3 ½ cups 438 g all-purpose flour, divided, plus more as necessary", "½ cup 118 ml heavy cream", "2  large eggs (lightly beaten and at room temperature)", "⅓ cup 67 g granulated sugar", "2 ¼ teaspoons instant or rapid-rise yeast", "Vegetable oil (for frying)", "1  batch homemade pastry cream (prepared in advance)", "1 teaspoon table salt", "3 oz 85 g chopped chocolate or ½ cup semisweet chocolate chips"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the pastry cream in advance and refrigerate it for several hours to allow proper chilling.", "name": "Prepare the pastry cream in advance and refrigerate it for several hours to allow proper chilling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl or the bowl of a stand mixer, stir together 2 cups (250 g) of flour, yeast, sugar, and salt.", "name": "In a large mixing bowl or the bowl of a stand mixer, stir together 2 cups (250 g) of flour, yeast, sugar, and salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-1"}, {"@type": "HowToStep", "text": "Warm the milk to 110–115°F (43–46°C) using the microwave. Add the warmed milk to the dry mixture and stir until fully incorporated.", "name": "Warm the milk to 110–115°F (43–46°C) using the microwave. Add the warmed milk to the dry mixture and stir until fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-2"}, {"@type": "HowToStep", "text": "Mix in the melted butter, beaten eggs, and vanilla extract until the dough begins to come together.", "name": "Mix in the melted butter, beaten eggs, and vanilla extract until the dough begins to come together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-3"}, {"@type": "HowToStep", "text": "Gradually add the remaining flour while mixing with a wooden spoon, spatula, or dough hook until the dough is smooth, cohesive, and slightly tacky but not sticky. Adjust the flour quantity based on texture if needed.", "name": "Gradually add the remaining flour while mixing with a wooden spoon, spatula, or dough hook until the dough is smooth, cohesive, and slightly tacky but not sticky. Adjust the flour quantity based on texture if needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-4"}, {"@type": "HowToStep", "text": "Place the dough into a lightly oiled bowl, cover it tightly with plastic wrap, and let it rise in a warm, draft-free location until doubled in volume, approximately 30 to 60 minutes.", "name": "Place the dough into a lightly oiled bowl, cover it tightly with plastic wrap, and let it rise in a warm, draft-free location until doubled in volume, approximately 30 to 60 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-5"}, {"@type": "HowToStep", "text": "Turn the risen dough out onto a lightly floured work surface. Roll or pat to a thickness of ¾ inch (2 cm), cut into rounds using a 3-inch biscuit cutter, and place them on a parchment-lined baking sheet with at least 1 inch (2.5 cm) of space between each. Cover and let rise until puffed and nearly doubled, about 30 minutes. Meanwhile, begin heating the frying oil.", "name": "Turn the risen dough out onto a lightly floured work surface. Roll or pat to a thickness of ¾ inch (2 cm), cut into rounds using a 3-inch biscuit cutter, and place them on a parchment-lined baking sheet with at least 1 inch (2.5 cm) of space between each. Cover and let rise until puffed and nearly doubled, about 30 minutes. Meanwhile, begin heating the frying oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-6"}, {"@type": "HowToStep", "text": "Pour vegetable oil into a medium-sized heavy-bottomed saucepan to a depth of 2–3 inches (5–8 cm) and attach a candy thermometer. Heat the oil over medium heat until it consistently holds a temperature of 350°F (175°C).", "name": "Pour vegetable oil into a medium-sized heavy-bottomed saucepan to a depth of 2–3 inches (5–8 cm) and attach a candy thermometer. Heat the oil over medium heat until it consistently holds a temperature of 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-7"}, {"@type": "HowToStep", "text": "Carefully lower one donut at a time into the hot oil and fry until light golden brown on both sides. Allow the oil temperature to recover between batches. Transfer fried donuts to a cooling rack or paper towel-lined plate to cool slightly before filling.", "name": "Carefully lower one donut at a time into the hot oil and fry until light golden brown on both sides. Allow the oil temperature to recover between batches. Transfer fried donuts to a cooling rack or paper towel-lined plate to cool slightly before filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-8"}, {"@type": "HowToStep", "text": "Insert a Wilton 12 piping tip into a piping bag filled with the prepared pastry cream. Use a sharp knife to pierce each donut halfway through, then insert the tip and squeeze in the filling. Repeat for all donuts.", "name": "Insert a Wilton 12 piping tip into a piping bag filled with the prepared pastry cream. Use a sharp knife to pierce each donut halfway through, then insert the tip and squeeze in the filling. Repeat for all donuts.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-9"}, {"@type": "HowToStep", "text": "To make the glaze, combine the chocolate and heavy cream in a microwave-safe bowl. Heat in 20-second intervals, stirring between each, until the mixture is smooth. Dip the top of each filled donut into the glaze and return them to the rack to set.", "name": "To make the glaze, combine the chocolate and heavy cream in a microwave-safe bowl. Heat in 20-second intervals, stirring between each, until the mixture is smooth. Dip the top of each filled donut into the glaze and return them to the rack to set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/boston-cream-donuts-recipe/#wprm-recipe-12573-step-0-10"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Boston Cream Donuts Recipe"}</script>
