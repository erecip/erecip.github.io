}, {"@type": "HowToStep", "text": "In a large Dutch oven over medium heat, warm the vegetable oil. Sear each chicken breast on both sides, working in batches if needed to avoid crowding the pot. Remove the chicken from the pot and set aside on a plate.", "name": "In a large Dutch oven over medium heat, warm the vegetable oil. Sear each chicken breast on both sides, working in batches if needed to avoid crowding the pot. Remove the chicken from the pot and set aside on a plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chilis-chicken-enchilada-soup-recipe/#wprm-recipe-4520-step-0-1"}, {"@type": "HowToStep", "text": "To the same pot, add garlic, chili powder, cumin, onion powder, and the remaining 1 ½ teaspoons of salt. Sauté for about 30 seconds until the mixture is fragrant.", "name": "To the same pot, add garlic, chili powder, cumin, onion powder, and the remaining 1 ½ teaspoons of salt. Sauté for about 30 seconds until the mixture is fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chilis-chicken-enchilada-soup-recipe/#wprm-recipe-4520-step-0-2"}, {"@type": "HowToStep", "text": "Reserve 2 cups of the chicken stock for later use. Pour the remaining stock into the pot, scraping any browned bits from the bottom. Return the seared chicken to the pot, bring it to a boil, then reduce to a simmer. Cover and cook for 30 minutes.", "name": "Reserve 2 cups of the chicken stock for later use. Pour the remaining stock into the pot, scraping any browned bits from the bottom. Return the seared chicken to the pot, bring it to a boil, then reduce to a simmer. Cover and cook for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chilis-chicken-enchilada-soup-recipe/#wprm-recipe-4520-step-0-3"}, {"@type": "HowToStep", "text": "Remove the chicken from the pot and thinly slice or shred. Return the chicken to the pot.", "name": "Remove the chicken from the pot and thinly slice or shred. Return the chicken to the pot.
