    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Keto Pumpkin Muffins", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, warmly spiced keto pumpkin muffins made with coconut flour, pumpkin puree, eggs, and butter, then finished with a smooth pumpkin cream cheese frosting. These muffins offer a rich autumn flavor while remaining gluten-free and low in added carbohydrates.", "datePublished": "2020-11-12T08:57:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/keto-pumpkin-muffins/keto-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/keto-pumpkin-muffins/keto-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/keto-pumpkin-muffins/keto-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/keto-pumpkin-muffins/keto-pumpkin-muffins2.png"], "prepTime": "PT15M", "cookTime": "PT25M", "totalTime": "PT70M", "recipeIngredient": ["6 tablespoons coconut flour (sifted to remove clumps)", "4  large eggs (brought to room temperature)", "2 teaspoons pure vanilla extract", "1 tablespoon avocado oil (reserved for coating the muffin liners)", "4 tablespoons butter (melted and allowed to cool to room temperature)", "1 teaspoon gluten-free baking powder", "½ cup pumpkin puree (such as Libby’s)", "2 teaspoons ground cinnamon (preferably freshly ground)", "1 teaspoon stevia glycerite (providing sweetness comparable to about ⅓ cup sugar)", "8 ounces cream cheese (softened to room temperature)", "½ teaspoon ground cinnamon", "¼ cup pumpkin puree", "½ teaspoon pure vanilla extract", "1 teaspoon stevia glycerite (approximately equivalent in sweetness to ⅓ cup powdered sugar)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Place paper liners in a muffin tin, then lightly coat the inside of each liner with the avocado oil to help prevent the baked muffins from sticking.", "name": "Prehea
