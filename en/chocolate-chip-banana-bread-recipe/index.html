    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chocolate Chip Banana Bread Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This delightfully rich banana bread bursts with the natural sweetness of ripe bananas, enhanced by a generous scattering of semi-sweet chocolate morsels. Each slice promises a moist, flavorful interior that maintains its tenderness for days, making it an irresistible treat for any occasion.", "datePublished": "2024-07-06T07:59:21+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-banana-bread-recipe/Chocolate-Chip-Banana-Bread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-banana-bread-recipe/Chocolate-Chip-Banana-Bread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-banana-bread-recipe/Chocolate-Chip-Banana-Bread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-banana-bread-recipe/Chocolate-Chip-Banana-Bread-Recipe.png"], "prepTime": "PT10M", "cookTime": "PT60M", "totalTime": "PT70M", "recipeIngredient": ["1/2 teaspoon vanilla extract", "1/2 teaspoon salt", "1/2 cup unsalted butter (softened (8 tablespoons))", "1 teaspoon baking soda", "2  large eggs (at room temperature)", "3  medium to large very ripe bananas (mashed (approximately 1 3/4 cups))", "1 1/2 cups all-purpose flour", "2/3 cup granulated sugar", "1 cup semisweet chocolate chips (divided (or use mini chips or chunks))"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Generously grease and flour a loaf pan measuring approximately 9.25 x 5.25 x 2.75 inches.", "name": "Preheat the oven to 350°F. Generously grease and flour a loaf pan measuring approximately 9.25 x 5.25 x 2.75 inches.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-banana-bread-recipe/#wprm-recipe-11473-step-0-0"}, {"@type": "HowToStep", "tex
