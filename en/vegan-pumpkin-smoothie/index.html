    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Vegan Pumpkin Smoothie", "author": {"@type": "Person", "name": "BenDes"}, "description": "This rich vegan pumpkin smoothie combines frozen bananas, pure pumpkin, chilled coconut milk, maple syrup, and warming spices. The result is a thick, velvety beverage with balanced sweetness and a smooth, dessert-like consistency.", "datePublished": "2019-03-22T01:12:40+00:00", "image": ["https://erecip.github.io/en/vegan-pumpkin-smoothie/vegan-pumpkin-smoothie2.png", "https://erecip.github.io/en/vegan-pumpkin-smoothie/vegan-pumpkin-smoothie2.png", "https://erecip.github.io/en/vegan-pumpkin-smoothie/vegan-pumpkin-smoothie2.png", "https://erecip.github.io/en/vegan-pumpkin-smoothie/vegan-pumpkin-smoothie2.png"], "prepTime": "PT10M", "totalTime": "PT70M", "recipeIngredient": ["3  medium bananas (sliced and frozen)", "1 tablespoon pure maple syrup (for natural sweetness and added depth)", "1 teaspoon pumpkin pie spice (or an equivalent mixture of cinnamon, ginger, nutmeg, and cloves)", "1  can light coconut milk (refrigerated until thoroughly chilled)", "¾ cup pure pumpkin purée (not pumpkin pie filling)", "Liquid stevia or monk fruit drops (adjusted to taste, beginning with ¼ teaspoon)", "¼ teaspoon vanilla extract (for a fuller and more aromatic flavor)", "Ground cinnamon (for a warm finishing note)", "Coconut whipped topping (optional, for additional creaminess)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Refrigerate the unopened can of light coconut milk for at least 1–2 hours. Chilling the milk helps produce a thicker, creamier smoothie. While it cools, measure the pumpkin purée, pumpkin pie spice, vanilla extract, and maple syrup into separate small containers.", "name": "Refrigerate the unopened can of light coconut milk for at least 1–2 hours. Chilling the milk helps produce a thicker, creamier smoothie. While it cools, measure the pumpkin purée, pumpkin pie spice, vanilla extract, and maple syrup into separate small containers.", "url": "https://erecip.github.io/en/vegan-pumpkin-smoothie/#wprm-recipe-40221-step-0-0"}, {"@type": "HowToStep", "text": "Place the frozen banana slices in a blender and pulse until they break down into small, crumbly pieces. This preliminary step encourages even blending and reduces the likelihood of fruit collecting around the blades.", "name": "Place the frozen banana slices in a blender and pulse until they break down into small, crumbly pieces. This preliminary step encourages even blending and reduces the likelihood of fruit collecting around the blades.", "url": "https://erecip.github.io/en/vegan-pumpkin-smoothie/#wprm-recipe-40221-step-0-1"}, {"@type": "HowToStep", "text": "Pour the chilled coconut milk over the crushed bananas. Blend at medium-high speed until the mixture is completely smooth and no frozen pieces remain.", "name": "Pour the chilled coconut milk over the crushed bananas. Blend at medium-high speed until the mixture is completely smooth and no frozen pieces remain.", "url": "https://erecip.github.io/en/vegan-pumpkin-smoothie/#wprm-recipe-40221-step-0-2"}, {"@type": "HowToStep", "text": "Add the pumpkin purée, pumpkin pie spice, vanilla extract, and maple syrup to the banana-coconut mixture. Blend at medium speed for 30–45 seconds, or until everything is evenly combined and the smoothie develops a uniform orange color.", "name": "Add the pumpkin purée, pumpkin pie spice, vanilla extract, and maple syrup to the banana-coconut mixture. Blend at medium speed for 30–45 seconds, or until everything is evenly combined and the smoothie develops a uniform orange color.", "url": "https://erecip.github.io/en/vegan-pumpkin-smoothie/#wprm-recipe-40221-step-0-3"}, {"@type": "HowToStep", "text": "Add approximately ¼ teaspoon of liquid stevia or monk fruit drops. Blend briefly, taste, and add more only as needed. Because these sweeteners are highly concentrated, incorporate them gradually.", "name": "Add approximately ¼ teaspoon of liquid stevia or monk fruit drops. Blend briefly, taste, and add more only as needed. Because these sweeteners are highly concentrated, incorporate them gradually.", "url": "https://erecip.github.io/en/vegan-pumpkin-smoothie/#wprm-recipe-40221-step-0-4"}, {"@type": "HowToStep", "text": "Immediately divide the finished smoothie among serving glasses. Add a generous spoonful of coconut whipped topping, if desired, and dust the surface lightly with ground cinnamon.", "name": "Immediately divide the finished smoothie among serving glasses. Add a generous spoonful of coconut whipped topping, if desired, and dust the surface lightly with ground cinnamon.", "url": "https://erecip.github.io/en/vegan-pumpkin-smoothie/#wprm-recipe-40221-step-0-5"}, {"@type": "HowToStep", "text": "Enjoy the smoothie at once while it remains cold and thick. The coconut topping will gradually soften, forming a creamy layer over the spiced pumpkin mixture.", "name": "Enjoy the smoothie at once while it remains cold and thick. The coconut topping will gradually soften, forming a creamy layer over the spiced pumpkin mixture.", "url": "https://erecip.github.io/en/vegan-pumpkin-smoothie/#wprm-recipe-40221-step-0-6"}], "recipeCategory": ["Beverage", "Smoothie"], "recipeCuisine": ["American"], "keywords": "Vegan Pumpkin Smoothie"}</script>
