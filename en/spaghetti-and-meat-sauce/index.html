2-inch pieces, finely mince the garlic, and measure the basil, parsley, oregano, and bay leaf so they are ready for use.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-0"}, {"@type": "HowToStep", "text": "Fill a large cooking pot with generously salted water and bring it to a vigorous boil. Begin heating the water before preparing the sauce so it will be ready when the spaghetti needs to be cooked.", "name": "Fill a large cooking pot with generously salted water and bring it to a vigorous boil. Begin heating the water before preparing the sauce so it will be ready when the spaghetti needs to be cooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-1"}, {"@type": "HowToStep", "text": "Warm the olive oil in a large, heavy-based saucepan or Dutch oven over medium heat.", "name": "Warm the olive oil in a large, heavy-based saucepan or Dutch oven over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-2"}, {"@type": "HowToStep", "text": "Add the diced onion and cook for approximately 3 minutes, stirring periodically, until it becomes soft and translucent.", "name": "Add the diced onion and cook for approximately 3 minutes, stirring periodically, until it becomes soft and translucent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and cook for about 30 seconds, stopping as soon as it becomes fragrant. Do not allow the garlic to brown.", "name": "Stir in the minced garlic and cook for about 30 seconds, stopping as soon as it becomes fragrant. Do not allow the garlic to brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-4"}, {"@type": "HowToStep", "text": "Raise the heat to medium-high and add the ground beef. Break the meat into small crumbles while it cooks.", "name": "Raise the heat to medium-high and add the ground beef. Break the meat into small crumbles while it cooks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-5"}, {"@type": "HowToStep", "text": "Season the beef with the sea salt, black pepper, and optional crushed red pepper flakes. Continue cooking for 6 to 8 minutes, or until the meat is thoroughly browned.", "name": "Season the beef with the sea salt, black pepper, and optional crushed red pepper flakes. Continue cooking for 6 to 8 minutes, or until the meat is thoroughly browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-6"}, {"@type": "HowToStep", "text": "Drain away excess rendered fat when necessary, retaining approximately 1 tablespoon in the pot for flavor.", "name": "Drain away excess rendered fat when necessary, retaining approximately 1 tablespoon in the pot for flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-7"}, {"@type": "HowToStep", "text": "Step 4: Cook the Tomato Paste and Reduce the Wine", "name": "Step 4: Cook the Tomato Paste and Reduce the Wine", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-8"}, {"@type": "HowToStep", "text": "Add the tomato paste and sugar to the browned beef. Stir continuously for 1 to 2 minutes, allowing the paste to darken slightly and lose its raw flavor.", "name": "Add the tomato paste and sugar to the browned beef. Stir continuously for 1 to 2 minutes, allowing the paste to darken slightly and lose its raw flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-9"}, {"@type": "HowToStep", "text": "Pour in the dry red wine, or substitute beef broth, and bring the mixture to a simmer. Cook for 3 to 5 minutes, until the liquid has reduced slightly.", "name": "Pour in the dry red wine, or substitute beef broth, and bring the mixture to a simmer. Cook for 3 to 5 minutes, until the liquid has reduced slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-10"}, {"@type": "HowToStep", "text": "Pour the water and the whole peeled tomatoes, together with their juices, into the pot. Crush the tomatoes by hand before adding them, or break them apart directly in the pot with a wooden spoon.", "name": "Pour the water and the whole peeled tomatoes, together with their juices, into the pot. Crush the tomatoes by hand before adding them, or break them apart directly in the pot with a wooden spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-11"}, {"@type": "HowToStep", "text": "Stir in the dried basil, parsley, oregano, and bay leaf.", "name": "Stir in the dried basil, parsley, oregano, and bay leaf.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-12"}, {"@type": "HowToStep", "text": "Bring the sauce to a gentle simmer. Partially cover the pot and cook for 30 minutes, stirring from time to time. Keeping the lid slightly open allows the sauce to reduce while limiting splattering.", "name": "Bring the sauce to a gentle simmer. Partially cover the pot and cook for 30 minutes, stirring from time to time. Keeping the lid slightly open allows the sauce to reduce while limiting splattering.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-13"}, {"@type": "HowToStep", "text": "Add the spaghetti to the boiling salted water and cook according to the package directions until al dente.", "name": "Add the spaghetti to the boiling salted water and cook according to the package directions until al dente.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-14"}, {"@type": "HowToStep", "text": "Approximately 2 minutes before draining the pasta, remove and reserve 1/4 cup of the starchy cooking water.", "name": "Approximately 2 minutes before draining the pasta, remove and reserve 1/4 cup of the starchy cooking water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-15"}, {"@type": "HowToStep", "text": "Drain the spaghetti, then transfer it directly into the meat sauce. Add the reserved pasta water and stir gently until the noodles are evenly coated.", "name": "Drain the spaghetti, then transfer it directly into the meat sauce. Add the reserved pasta water and stir gently until the noodles are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-16"}, {"@type": "HowToStep", "text": "Simmer the pasta and sauce together for 2 to 3 minutes. Remove the pot from the heat and allow the dish to rest for 1 minute before serving.", "name": "Simmer the pasta and sauce together for 2 to 3 minutes. Remove the pot from the heat and allow the dish to rest for 1 minute before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-17"}, {"@type": "HowToStep", "text": "Locate and discard the bay leaf.", "name": "Locate and discard the bay leaf.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spaghetti-and-meat-sauce/#wprm-recipe-39951-step-0-18"}, {"@type": "HowToStep", "text": "Portion the spaghetti and meat sauce among serving bowls or plates. Finish each serving with freshly grated Parmesan cheese, if desired.", "name": "Portion the spaghetti and meat sauce among serving bowls or plates. Finish each serving with freshly grated Parmesan cheese, if desired.", "u
