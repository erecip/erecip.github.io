    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mashed Potatoes with Chicken Broth", "author": {"@type": "Person", "name": "BenDes"}, "description": "Rich, velvety mashed russet potatoes simmered directly in chicken broth, then blended with salted butter, cream cheese, and buttermilk. The broth adds savory depth, while the dairy ingredients create a smooth, fluffy texture with a subtle tang.", "datePublished": "2019-01-21T17:11:57+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/mashed-potatoes-with-chicken-broth1.png", "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/mashed-potatoes-with-chicken-broth1.png", "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/mashed-potatoes-with-chicken-broth1.png", "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/mashed-potatoes-with-chicken-broth1.png"], "cookTime": "PT15M", "totalTime": "PT15M", "recipeIngredient": ["8 ounces cream cheese (brought to room temperature to ensure smooth blending)", "5 pounds russet potatoes (peeled and cut into quarters or 1–2-inch pieces for uniform cooking)", "¾ cup buttermilk (for creaminess and a lightly tangy finish)", "1 teaspoon salt (plus additional salt as desired for seasoning)", "8 cups chicken broth (or approximately 6–8 cups as needed to fully cover the potatoes)", "½ cup salted butter (melted or sufficiently softened for easy incorporation)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Peel and thoroughly rinse the russet potatoes. Cut them into evenly sized 1–2-inch chunks or quarters so they cook at a consistent rate, then transfer them to a large cooking pot.", "name": "Peel and thoroughly rinse the russet potatoes. Cut them into evenly sized 1–2-inch chunks or quarters so they cook at a consistent rate, then transfer them to a large cooking pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/#wprm-recipe-45306-step-0-0"}, {"@type": "HowToStep", "text": "Pour approximately 6–8 cups of chicken broth over the potatoes, using enough broth to completely cover them.", "name": "Pour approximately 6–8 cups of chicken broth over the potatoes, using enough broth to completely cover them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/#wprm-recipe-45306-step-0-1"}, {"@type": "HowToStep", "text": "Set the pot over high heat and bring the broth and potatoes to a full boil. Once boiling, lower the heat to medium and allow the potatoes to simmer for approximately 15 minutes, or until they are tender enough to be pierced easily with a fork.", "name": "Set the pot over high heat and bring the broth and potatoes to a full boil. Once boiling, lower the heat to medium and allow the potatoes to simmer for approximately 15 minutes, or until they are tender enough to be pierced easily with a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/#wprm-recipe-45306-step-0-2"}, {"@type": "HowToStep", "text": "While the potatoes cook, place the salted butter and softened cream cheese into a large mixing bowl. Allowing these ingredients to soften further will help them blend evenly into the hot potatoes.", "name": "While the potatoes cook, place the salted butter and softened cream cheese into a large mixing bowl. Allowing these ingredients to soften further will help them blend evenly into the hot potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/#wprm-recipe-45306-step-0-3"}, {"@type": "HowToStep", "text": "When the potatoes are fully tender, drain away most of the chicken broth while retaining a small amount of liquid in the pot.", "name": "When the potatoes are fully tender, drain away most of the chicken broth while retaining a small amount of liquid in the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/#wprm-recipe-45306-step-0-4"}, {"@type": "HowToStep", "text": "Carefully transfer the hot potatoes and the reserved broth into the mixing bowl containing the butter and cream cheese. Add the buttermilk and 1 teaspoon of salt.", "name": "Carefully transfer the hot potatoes and the reserved broth into the mixing bowl containing the butter and cream cheese. Add the buttermilk and 1 teaspoon of salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/#wprm-recipe-45306-step-0-5"}, {"@type": "HowToStep", "text": "Using a potato masher or hand mixer, mash and blend the mixture until the potatoes become creamy, light, and fluffy, with no noticeable lumps remaining.", "name": "Using a potato masher or hand mixer, mash and blend the mixture until the potatoes become creamy, light, and fluffy, with no noticeable lumps remaining.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/#wprm-recipe-45306-step-0-6"}, {"@type": "HowToStep", "text": "Taste the mashed potatoes and add additional salt only if needed.", "name": "Taste the mashed potatoes and add additional salt only if needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/#wprm-recipe-45306-step-0-7"}, {"@type": "HowToStep", "text": "Serve immediately while hot alongside the main dish of your choice.", "name": "Serve immediately while hot alongside the main dish of your choice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-chicken-broth/#wprm-recipe-45306-step-0-8"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Mashed Potatoes with Chicken Broth"}</script>
