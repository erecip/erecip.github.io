    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sun-Dried Tomato Bagels", "author": {"@type": "Person", "name": "BenDes"}, "description": "These naturally leavened sourdough bagels incorporate finely chopped sun-dried tomatoes throughout a firm bread-flour dough. A lengthy room-temperature fermentation followed by overnight refrigeration develops a deeper flavor, while boiling before baking produces the characteristically chewy bagel crust and tender interior.", "datePublished": "2020-01-09T13:22:36+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/sun-dried-tomato-bagels2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/sun-dried-tomato-bagels2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/sun-dried-tomato-bagels2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/sun-dried-tomato-bagels2.png"], "recipeIngredient": ["1/2 cup active sourdough starter", "1 1/2 teaspoons sea salt", "1/3 cup sun-dried tomatoes (thoroughly drained and finely diced)", "3/4 cup warm water (approximately 105–115°F)", "1/3 cup whole wheat flour", "1 tablespoon honey", "2 3/4 cups bread flour", "Eggs (as needed for the egg wash)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Drain 1/3 cup of sun-dried tomatoes thoroughly, particularly if they have been packed or soaked in oil. Chop them into small, fine pieces so they can disperse evenly through the dough without contributing excess oil.", "name": "Drain 1/3 cup of sun-dried tomatoes thoroughly, particularly if they have been packed or soaked in oil. Chop them into small, fine pieces so they can disperse evenly through the dough without contributing excess oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-0"}, {"@type": "HowToStep", "text": "Place the bread flour, whole wheat flour, warm water, active sourdough starter, honey, sea salt, and prepared sun-dried tomatoes in a medium mixing bowl. Mix by hand for approximately 2 minutes, or until the ingredients come together into a cohesive ball of dough.", "name": "Place the bread flour, whole wheat flour, warm water, active sourdough starter, honey, sea salt, and prepared sun-dried tomatoes in a medium mixing bowl. Mix by hand for approximately 2 minutes, or until the ingredients come together into a cohesive ball of dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-1"}, {"@type": "HowToStep", "text": "Cover the bowl and allow the dough to rest for 30 minutes. This resting period gives the flour time to absorb the moisture and allows gluten development to begin.", "name": "Cover the bowl and allow the dough to rest for 30 minutes. This resting period gives the flour time to absorb the moisture and allows gluten development to begin.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-2"}, {"@type": "HowToStep", "text": "Knead the rested dough for 2–3 minutes, continuing until its exterior becomes relatively smooth.", "name": "Knead the rested dough for 2–3 minutes, continuing until its exterior becomes relatively smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the dough to a covered container and leave it at room temperature for 6–8 hours, or until it has approximately doubled in volume.", "name": "Transfer the dough to a covered container and leave it at room temperature for 6–8 hours, or until it has approximately doubled in volume.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-4"}, {"@type": "HowToStep", "text": "For additional dough strength and improved crumb structure, 3 optional sets of stretch-and-folds may be performed during this initial fermentation. Space the sets approximately 1–1 1/2 hours apart. During each set, stretch each side of the dough and fold it over itself, rotating the container as you work.", "name": "For additional dough strength and improved crumb structure, 3 optional sets of stretch-and-folds may be performed during this initial fermentation. Space the sets approximately 1–1 1/2 hours apart. During each set, stretch each side of the dough and fold it over itself, rotating the container as you work.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-5"}, {"@type": "HowToStep", "text": "Turn the fermented dough out onto a work surface and divide it into 6–8 equal portions. For more precise sizing, each piece should weigh approximately 80–120 grams.", "name": "Turn the fermented dough out onto a work surface and divide it into 6–8 equal portions. For more precise sizing, each piece should weigh approximately 80–120 grams.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-6"}, {"@type": "HowToStep", "text": "Form each portion into a ball by drawing the edges or corners upward and folding them toward the center. Make an opening through the middle of each ball, then carefully stretch and rotate the dough until it forms an evenly shaped ring.", "name": "Form each portion into a ball by drawing the edges or corners upward and folding them toward the center. Make an opening through the middle of each ball, then carefully stretch and rotate the dough until it forms an evenly shaped ring.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the formed bagels inside a greased container or on a greased baking sheet, allowing enough room between each one for expansion. Cover them securely to prevent the surfaces from drying.", "name": "Arrange the formed bagels inside a greased container or on a greased baking sheet, allowing enough room between each one for expansion. Cover them securely to prevent the surfaces from drying.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-8"}, {"@type": "HowToStep", "text": "Leave the shaped bagels at room temperature for 1–2 hours, or until they appear noticeably puffy.", "name": "Leave the shaped bagels at room temperature for 1–2 hours, or until they appear noticeably puffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-9"}, {"@type": "HowToStep", "text": "Keep the bagels covered and transfer them to the refrigerator for an overnight cold fermentation. The extended chilled proof develops additional flavor while contributing to the finished texture.", "name": "Keep the bagels covered and transfer them to the refrigerator for an overnight cold fermentation. The extended chilled proof develops additional flavor while contributing to the finished texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-10"}, {"@type": "HowToStep", "text": "The following day, preheat the oven to 425°F (220°C). Line a clean baking sheet with parchment paper.", "name": "The following day, preheat the oven to 425°F (220°C). Line a clean baking sheet with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-11"}, {"@type": "HowToStep", "text": "Bring a large, wide pot of water to a full boil. Carefully lower 1–2 bagels into the water at a time, ensuring they have sufficient room to float freely.", "name": "Bring a large, wide pot of water to a full boil. Carefully lower 1–2 bagels into the water at a time, ensuring they have sufficient room to float freely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-12"}, {"@type": "HowToStep", "text": "Boil the bagels for 1 minute on the first side, turn them over, and boil for another 1 minute. Lift them from the water with a slotted spoon and allow excess water to drain before transferring them to the parchment-lined baking sheet.", "name": "Boil the bagels for 1 minute on the first side, turn them over, and boil for another 1 minute. Lift them from the water with a slotted spoon and allow excess water to drain before transferring them to the parchment-lined baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-13"}, {"@type": "HowToStep", "text": "Brush the tops of the boiled bagels with egg wash. This coating produces a glossy appearance and encourages the exterior to become attractively crisp.", "name": "Brush the tops of the boiled bagels with egg wash. This coating produces a glossy appearance and encourages the exterior to become attractively crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-14"}, {"@type": "HowToStep", "text": "Bake for 20–23 minutes, or until the bagels develop a rich golden-brown color.", "name": "Bake for 20–23 minutes, or until the bagels develop a rich golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-15"}, {"@type": "HowToStep", "text": "Allow the baked bagels to cool for at least 10 minutes before slicing. This brief resting period helps retain moisture within the crumb and makes the bagels easier to cut cleanly.", "name": "Allow the baked bagels to cool for at least 10 minutes before slicing. This brief resting period helps retain moisture within the crumb and makes the bagels easier to cut cleanly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-16"}, {"@type": "HowToStep", "text": "Serve sliced with cream cheese or another preferred topping.", "name": "Serve sliced with cream cheese or another preferred topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-bagels/#wprm-recipe-42297-step-0-17"}], "recipeCategory": ["Bread", "Breakfast"], "recipeCuisine": ["American"], "keywords": "Sun-Dried Tomato Bagels"}</script>
