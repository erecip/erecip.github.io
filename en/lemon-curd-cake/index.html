    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Curd Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A soft, lemon-zested buttermilk cake filled with homemade lemon curd and finished with a generous layer of lemon cream cheese frosting. Extra curd is swirled over the frosting for a bright, tangy finish.", "datePublished": "2020-08-19T20:12:46+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/lemon-curd-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/lemon-curd-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/lemon-curd-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/lemon-curd-cake2.png"], "cookTime": "PT60M", "totalTime": "PT60M", "recipeIngredient": ["¾ cup white granulated sugar", "1 tablespoon finely grated lemon zest (from approximately 1 large lemon)", "½ cup freshly squeezed lemon juice (obtained from roughly 2–3 lemons)", "⅛ teaspoon fine salt", "½ cup unsalted butter (cold and cut into cubes)", "4  large egg yolks (brought to room temperature)", "1 cup buttermilk (at room temperature)", "10 tablespoons unsalted butter (softened to approximately 70°F)", "¼ teaspoon baking soda", "3  large eggs (at room temperature)", "3 tablespoons finely grated lemon zest (from approximately 3 large lemons)", "2¼ cups all-purpose flour", "1 tablespoon vanilla extract", "1½ cups granulated sugar", "½ teaspoon salt", "1½ teaspoons baking powder", "6 ounces cream cheese (kept cold)", "½ tablespoon finely grated lemon zest", "2¼ cups confectioners' sugar", "¾ cup unsalted butter (softened to approximately 70°F)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the lemon juice, room-temperature egg yolks, granulated sugar, salt, and finely grated lemon zest in a medium saucepan.", "name": "Place the lemon juice, room-temperature egg yolks, granulated sugar, salt, and finely grated lemon zest in a medium saucepan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-0"}, {"@type": "HowToStep", "text": "Whisk the ingredients thoroughly until they form a uniform mixture.", "name": "Whisk the ingredients thoroughly until they form a uniform mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-1"}, {"@type": "HowToStep", "text": "Set the saucepan over medium-low heat and cook for 20–25 minutes, stirring frequently. Continue until the curd has thickened enough to coat the back of a spoon.", "name": "Set the saucepan over medium-low heat and cook for 20–25 minutes, stirring frequently. Continue until the curd has thickened enough to coat the back of a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-2"}, {"@type": "HowToStep", "text": "Take the pan off the heat. Gradually whisk in the cubes of cold unsalted butter, allowing each addition to melt completely into the curd.", "name": "Take the pan off the heat. Gradually whisk in the cubes of cold unsalted butter, allowing each addition to melt completely into the curd.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the finished lemon curd to a heatproof bowl. Press plastic wrap directly against the surface to prevent a skin from forming, then refrigerate until thoroughly chilled.", "name": "Transfer the finished lemon curd to a heatproof bowl. Press plastic wrap directly against the surface to prevent a skin from forming, then refrigerate until thoroughly chilled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-5"}, {"@type": "HowToStep", "text": "Coat a 9 × 9-inch baking pan with non-stick cooking spray, then line it with parchment paper.", "name": "Coat a 9 × 9-inch baking pan with non-stick cooking spray, then line it with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-6"}, {"@type": "HowToStep", "text": "In a medium mixing bowl, whisk the all-purpose flour with the baking powder, baking soda, and salt until evenly distributed.", "name": "In a medium mixing bowl, whisk the all-purpose flour with the baking powder, baking soda, and salt until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-7"}, {"@type": "HowToStep", "text": "In a separate large bowl, use an electric mixer to beat the softened butter and granulated sugar together for approximately 2 minutes, until well creamed.", "name": "In a separate large bowl, use an electric mixer to beat the softened butter and granulated sugar together for approximately 2 minutes, until well creamed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-8"}, {"@type": "HowToStep", "text": "Add the room-temperature eggs and vanilla extract. Beat at medium speed for about 1 minute, or until the mixture becomes smooth and pale.", "name": "Add the room-temperature eggs and vanilla extract. Beat at medium speed for about 1 minute, or until the mixture becomes smooth and pale.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-9"}, {"@type": "HowToStep", "text": "With the mixer operating on low speed, gradually alternate additions of the dry flour mixture and room-temperature buttermilk into the butter mixture. Mix only until the cake batter is combined.", "name": "With the mixer operating on low speed, gradually alternate additions of the dry flour mixture and room-temperature buttermilk into the butter mixture. Mix only until the cake batter is combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-10"}, {"@type": "HowToStep", "text": "Scrape down the sides and bottom of the bowl with a rubber spatula whenever necessary to ensure the batter is evenly mixed.", "name": "Scrape down the sides and bottom of the bowl with a rubber spatula whenever necessary to ensure the batter is evenly mixed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-11"}, {"@type": "HowToStep", "text": "Carefully fold the 3 tablespoons of lemon zest into the completed batter.", "name": "Carefully fold the 3 tablespoons of lemon zest into the completed batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared 9 × 9-inch pan and spread it evenly.", "name": "Transfer the batter to the prepared 9 × 9-inch pan and spread it evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-13"}, {"@type": "HowToStep", "text": "Bake for 35–40 minutes. The cake is ready when a toothpick inserted into the center comes out clean.", "name": "Bake for 35–40 minutes. The cake is ready when a toothpick inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-14"}, {"@type": "HowToStep", "text": "Place the pan on a wire cooling rack and allow the cake to cool completely before filling and frosting.", "name": "Place the pan on a wire cooling rack and allow the cake to cool completely before filling and frosting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-15"}, {"@type": "HowToStep", "text": "While the cake is cooling, place the softened butter in a large mixing bowl. Beat it with an electric mixer on high speed for approximately 5 minutes, until noticeably pale and fluffy.", "name": "While the cake is cooling, place the softened butter in a large mixing bowl. Beat it with an electric mixer on high speed for approximately 5 minutes, until noticeably pale and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-16"}, {"@type": "HowToStep", "text": "Add the cold cream cheese and continue beating on high speed for about 1 minute, until the mixture is light and evenly blended.", "name": "Add the cold cream cheese and continue beating on high speed for about 1 minute, until the mixture is light and evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-17"}, {"@type": "HowToStep", "text": "Sift the powdered sugar into the bowl. Begin mixing at low speed to incorporate it, then increase to high speed and continue beating until the frosting becomes fully combined and fluffy.", "name": "Sift the powdered sugar into the bowl. Begin mixing at low speed to incorporate it, then increase to high speed and continue beating until the frosting becomes fully combined and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-18"}, {"@type": "HowToStep", "text": "Add the ½ tablespoon of lemon zest and whip once more until evenly incorporated and airy.", "name": "Add the ½ tablespoon of lemon zest and whip once more until evenly incorporated and airy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-19"}, {"@type": "HowToStep", "text": "Once completely cool, carefully remove the cake from its pan and place it on a serving platter.", "name": "Once completely cool, carefully remove the cake from its pan and place it on a serving platter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-20"}, {"@type": "HowToStep", "text": "Using the handle of a wooden spoon or a thick skewer, make holes evenly across the entire surface of the cake.", "name": "Using the handle of a wooden spoon or a thick skewer, make holes evenly across the entire surface of the cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-21"}, {"@type": "HowToStep", "text": "Spoon the chilled lemon curd into a piping bag and pipe the curd directly into the prepared holes.", "name": "Spoon the chilled lemon curd into a piping bag and pipe the curd directly into the prepared holes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-22"}, {"@type": "HowToStep", "text": "Using an offset spatula, spread a thick, even covering of lemon cream cheese frosting across the top of the cake.", "name": "Using an offset spatula, spread a thick, even covering of lemon cream cheese frosting across the top of the cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-23"}, {"@type": "HowToStep", "text": "Finish by swirling additional lemon curd through the frosting to create a tangy lemon topping.", "name": "Finish by swirling additional lemon curd through the frosting to create a tangy lemon topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-24"}, {"@type": "HowToStep", "text": "Slice and serve.", "name": "Slice and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-cake/#wprm-recipe-41672-step-0-25"}], "recipeCategory": ["cake", "Dessert"], "recipeCuisine": ["American"], "keywords": "Lemon Curd Cake"}</script>
