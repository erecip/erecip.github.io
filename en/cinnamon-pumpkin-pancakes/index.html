    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cinnamon Pumpkin Pancakes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, warmly spiced pumpkin pancakes made with buttermilk, pure pumpkin, brown sugar, and a fragrant blend of cinnamon, nutmeg, ginger, and cloves. They cook to a golden finish and are best served warm with butter and maple syrup.", "datePublished": "2021-12-03T05:14:29+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/cinnamon-pumpkin-pancakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/cinnamon-pumpkin-pancakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/cinnamon-pumpkin-pancakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/cinnamon-pumpkin-pancakes2.png"], "cookTime": "PT6M", "totalTime": "PT6M", "recipeIngredient": ["1 teaspoon ground cinnamon", "2 teaspoons baking powder", "1/4 teaspoon ground ginger", "1 1/4 cups all-purpose flour", "1/8 teaspoon ground cloves", "2 tablespoons firmly packed light brown sugar", "1/4 teaspoon kosher salt", "1/4 teaspoon ground nutmeg", "1/2 cup canned pure pumpkin (not pumpkin pie filling)", "1 teaspoon pure vanilla extract", "2 tablespoons unsalted butter (melted and allowed to cool)", "1 cup room-temperature buttermilk", "1  large egg (brought to room temperature)", "Butter (according to preference)", "Maple syrup (as desired)", "Nonstick cooking spray or a small amount of butter (for greasing the cooking surface)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat an electric griddle to 350°F. Alternatively, place a large skillet over medium heat so the cooking surface is fully heated by the time the batter is prepared.", "name": "Preheat an electric griddle to 350°F. Alternatively, place a large skillet over medium heat so the cooking surface is fully heated by the time the batter is prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/#wprm-recipe-45764-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, thoroughly whisk together the all-purpose flour, light brown sugar, baking powder, kosher salt, cinnamon, nutmeg, ginger, and cloves. Set the combined dry ingredients aside.", "name": "In a large mixing bowl, thoroughly whisk together the all-purpose flour, light brown sugar, baking powder, kosher salt, cinnamon, nutmeg, ginger, and cloves. Set the combined dry ingredients aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/#wprm-recipe-45764-step-0-1"}, {"@type": "HowToStep", "text": "In a separate medium bowl, whisk the buttermilk, pumpkin, egg, cooled melted butter, and vanilla extract until the mixture is smooth and evenly blended. Ensure the melted butter has cooled sufficiently before adding it so the heat does not begin to cook the egg.", "name": "In a separate medium bowl, whisk the buttermilk, pumpkin, egg, cooled melted butter, and vanilla extract until the mixture is smooth and evenly blended. Ensure the melted butter has cooled sufficiently before adding it so the heat does not begin to cook the egg.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/#wprm-recipe-45764-step-0-2"}, {"@type": "HowToStep", "text": "Pour the pumpkin mixture into the bowl containing the dry ingredients. Stir only until the ingredients are incorporated. The finished batter should remain thick with a few small lumps rather than becoming completely smooth. If a thinner pancake consistency is preferred, incorporate a small additional amount of buttermilk.", "name": "Pour the pumpkin mixture into the bowl containing the dry ingredients. Stir only until the ingredients are incorporated. The finished batter should remain thick with a few small lumps rather than becoming completely smooth. If a thinner pancake consistency is preferred, incorporate a small additional amount of buttermilk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/#wprm-recipe-45764-step-0-3"}, {"@type": "HowToStep", "text": "Lightly grease the preheated griddle or skillet with nonstick cooking spray or a small quantity of butter. Portion approximately 1/3 cup of batter for each pancake onto the hot surface.", "name": "Lightly grease the preheated griddle or skillet with nonstick cooking spray or a small quantity of butter. Portion approximately 1/3 cup of batter for each pancake onto the hot surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/#wprm-recipe-45764-step-0-4"}, {"@type": "HowToStep", "text": "Cook the pancakes for approximately 2–3 minutes, or until bubbles appear on the surface and the edges begin to look set. Turn each pancake carefully, then continue cooking for another 2–3 minutes, until the second side is golden brown and the center is fully cooked. Continue in the same manner with the remaining batter.", "name": "Cook the pancakes for approximately 2–3 minutes, or until bubbles appear on the surface and the edges begin to look set. Turn each pancake carefully, then continue cooking for another 2–3 minutes, until the second side is golden brown and the center is fully cooked. Continue in the same manner with the remaining batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/#wprm-recipe-45764-step-0-5"}, {"@type": "HowToStep", "text": "Serve the pancakes while warm, finishing each portion with butter and maple syrup according to preference.", "name": "Serve the pancakes while warm, finishing each portion with butter and maple syrup according to preference.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-pumpkin-pancakes/#wprm-recipe-45764-step-0-6"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Cinnamon Pumpkin Pancakes"}</script>
