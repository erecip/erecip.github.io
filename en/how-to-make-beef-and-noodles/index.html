orporate the minced garlic and continue to sauté for an additional 30 seconds until its aroma is released, then transfer the mixture to a separate plate. In the same skillet, melt the butter, stir in the paprika, and then gradually whisk in the flour, cooking for 30 seconds to form a roux.", "name": "Incorporate the minced garlic and continue to sauté for an additional 30 seconds until its aroma is released, then transfer the mixture to a separate plate. In the same skillet, melt the butter, stir in the paprika, and then gradually whisk in the flour, cooking for 30 seconds to form a roux.", "url": "https://erecip.github.io/en/how-to-make-beef-and-noodles/#wprm-recipe-25899-step-0-2"}, {"@type": "HowToStep", "text": "Slowly whisk in the beef broth, bouillon cube, Worcestershire sauce, and thyme, allowing the mixture to simmer and thicken, which should take approximately 1–2 minutes.", "name": "Slowly whisk in the beef broth, bouillon cube, Worcestershire sauce, and thyme, allowing the mixture to simmer and thicken, which should take approximately 1–2 minutes.", "url": "https://erecip.github.io/en/how-to-make-beef-and-noodles/#wprm-recipe-25899-step-0-3"}, {"@type": "HowToStep", "text": "Lower the heat and stir in the heavy cream until fully integrated. Return the beef and onion mixture to the skillet, fold in the cooked egg noodles, and combine thoroughly.", "name": "Lower the heat and stir in the heavy cream until fully integrated. Return the beef and onion mixture to the skillet, fold in the cooked egg noodles, and combine thoroughly.", "url": "https://erecip.github.io/en/how-to-make-beef-and-noodles/#wprm-recipe-25899-step-0-4"}, {"@type": "HowToStep", "text": "Season with salt and black pepper to taste. Serve hot.", "name": "Season with salt and black pepper to taste. Serve hot.", "url": "https://erecip.github.io/en/how-to-make-beef-and-noodles/#wprm-recipe-25899-step-0-5"}]}</script>
