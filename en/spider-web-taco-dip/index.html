    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Spider Web Taco Dip", "author": {"@type": "Person", "name": "BenDes"}, "description": "A festive layered taco dip featuring seasoned cream cheese, refried beans, guacamole, cheese, and colorful fresh toppings. A piped sour cream spiderweb gives this savory appetizer a Halloween-inspired finish.", "datePublished": "2018-08-09T14:10:59+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/spider-web-taco-dip.png", "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/spider-web-taco-dip.png", "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/spider-web-taco-dip.png", "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/spider-web-taco-dip.png"], "prepTime": "PT20M", "cookTime": "PT30M", "totalTime": "PT50M", "recipeIngredient": ["16 ounces prepared guacamole (homemade or store-bought)", "1  packet taco seasoning", "1  can (15 ounces refried beans)", "8 ounces cream cheese (brought to room temperature and softened)", "1 1/2 cups sour cream", "1 tablespoon milk or water (used to loosen the mixture)", "1/4 cup sour cream", "1 cup tomatoes (chopped)", "1 1/2 cups shredded cheddar cheese or Mexican-style cheese blend", "Diced red or orange bell pepper", "1 tablespoon finely chopped fresh cilantro", "1/2 cup black olives (sliced)", "Chopped green onions", "Shredded iceberg lettuce", "Jalapeño peppers (sliced)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Spread the refried beans evenly across the bottom of a 12-inch pie plate. Use the back of a spoon or a spatula to form a smooth, uniform layer that will serve as the foundation of the dip.", "name": "Spread the refried beans evenly across the bottom of a 12-inch pie plate. Use the back of a spoon or a spatula to form a smooth, uniform layer that will serve as the foundation of the dip.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened cream cheese in a medium mixing bowl and beat it with a hand mixer until completely smooth.", "name": "Place the softened cream cheese in a medium mixing bowl and beat it with a hand mixer until completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-1"}, {"@type": "HowToStep", "text": "Add 1 1/2 cups of sour cream along with the taco seasoning. Continue mixing until the ingredients are thoroughly combined and the texture is creamy.", "name": "Add 1 1/2 cups of sour cream along with the taco seasoning. Continue mixing until the ingredients are thoroughly combined and the texture is creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-2"}, {"@type": "HowToStep", "text": "Carefully distribute the seasoned cream cheese mixture over the refried beans, spreading it all the way across the surface so the bean layer is fully covered.", "name": "Carefully distribute the seasoned cream cheese mixture over the refried beans, spreading it all the way across the surface so the bean layer is fully covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-3"}, {"@type": "HowToStep", "text": "Spoon the prepared guacamole over the creamy taco layer.", "name": "Spoon the prepared guacamole over the creamy taco layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-4"}, {"@type": "HowToStep", "text": "Using a spoon or offset spatula, gently smooth the guacamole into an even layer without disturbing the mixture underneath.", "name": "Using a spoon or offset spatula, gently smooth the guacamole into an even layer without disturbing the mixture underneath.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-5"}, {"@type": "HowToStep", "text": "In a small bowl, stir together 1/4 cup sour cream and 1 tablespoon milk or water until the mixture becomes thin enough to pipe while still holding its shape.", "name": "In a small bowl, stir together 1/4 cup sour cream and 1 tablespoon milk or water until the mixture becomes thin enough to pipe while still holding its shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the thinned sour cream to a piping bag, squeeze bottle, or zip-top bag with a small corner removed.", "name": "Transfer the thinned sour cream to a piping bag, squeeze bottle, or zip-top bag with a small corner removed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-7"}, {"@type": "HowToStep", "text": "Lightly mark the desired spiderweb pattern in the guacamole using a paring knife. Pipe the sour cream directly over the traced lines to produce the spiderweb design.", "name": "Lightly mark the desired spiderweb pattern in the guacamole using a paring knife. Pipe the sour cream directly over the traced lines to produce the spiderweb design.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-8"}, {"@type": "HowToStep", "text": "Sprinkle the shredded cheddar or Mexican cheese blend around the outer edge of the pie plate, forming a border while keeping the spiderweb visible.", "name": "Sprinkle the shredded cheddar or Mexican cheese blend around the outer edge of the pie plate, forming a border while keeping the spiderweb visible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-9"}, {"@type": "HowToStep", "text": "Add the chopped tomatoes, black olive slices, and fresh cilantro. Finish with the desired amount of sliced jalapeños, shredded iceberg lettuce, chopped green onions, and diced red or orange bell pepper.", "name": "Add the chopped tomatoes, black olive slices, and fresh cilantro. Finish with the desired amount of sliced jalapeños, shredded iceberg lettuce, chopped green onions, and diced red or orange bell pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-10"}, {"@type": "HowToStep", "text": "For a Halloween presentation, place a clean decorative plastic spider over the finished spiderweb.", "name": "For a Halloween presentation, place a clean decorative plastic spider over the finished spiderweb.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-11"}, {"@type": "HowToStep", "text": "Serve the dip with tortilla chips. It may be served immediately or refrigerated for approximately 30 minutes beforehand so the layers can firm slightly and the flavors can blend.", "name": "Serve the dip with tortilla chips. It may be served immediately or refrigerated for approximately 30 minutes beforehand so the layers can firm slightly and the flavors can blend.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spider-web-taco-dip/#wprm-recipe-39215-step-0-12"}], "recipeCategory": ["Appetizer", "Dip"], "recipeCuisine": ["American", "Tex-Mex"], "keywords": "Spider Web Taco Dip"}</script>
