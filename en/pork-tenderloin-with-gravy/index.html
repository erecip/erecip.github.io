    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pork Tenderloin with Gravy", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender pork tenderloins are coated with a savory blend of dried herbs and seasonings, seared until golden, then oven-roasted to a juicy finish. The flavorful skillet drippings are transformed into a smooth, creamy pan gravy for serving.", "datePublished": "2021-10-08T19:47:05+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/pork-tenderloin-with-gravy.png", "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/pork-tenderloin-with-gravy.png", "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/pork-tenderloin-with-gravy.png", "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/pork-tenderloin-with-gravy.png"], "prepTime": "PT15M", "cookTime": "PT30M", "totalTime": "PT50M", "recipeIngredient": ["2.5 lb pork tenderloin (divided into 2 pieces)", "1 teaspoon dried oregano", "2 tablespoons olive oil (for coating the tenderloins)", "1/2 teaspoon ground black pepper", "2 teaspoons dried thyme leaves", "1 tablespoon salt", "1 teaspoon dried rosemary (lightly crushed to release its aroma)", "1 tablespoon garlic powder", "2 tablespoons all-purpose flour", "1 tablespoon finely chopped fresh parsley (for finishing)", "1 cup 2% milk (plus additional milk if needed)", "1 tablespoon olive oil (for searing)", "1 tablespoon unsalted butter"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F.", "name": "Preheat the oven to 400°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-0"}, {"@type": "HowToStep", "text": "Combine the garlic powder, dried thyme, lightly crushed rosemary, oregano, salt, and black pepper in a small bowl. Stir until the seasonings are evenly distributed to create the dry rub.", "name": "Combine the garlic powder, dried thyme, lightly crushed rosemary, oregano, salt, and black pepper in a small bowl. Stir until the seasonings are evenly distributed to create the dry rub.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-1"}, {"@type": "HowToStep", "text": "Blot both pork tenderloins thoroughly with paper towels to remove excess surface moisture.", "name": "Blot both pork tenderloins thoroughly with paper towels to remove excess surface moisture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-2"}, {"@type": "HowToStep", "text": "Coat the pork evenly with 2 tablespoons of olive oil. Sprinkle the prepared seasoning mixture over every side of the tenderloins, gently pressing the herbs and spices against the meat so they adhere well.", "name": "Coat the pork evenly with 2 tablespoons of olive oil. Sprinkle the prepared seasoning mixture over every side of the tenderloins, gently pressing the herbs and spices against the meat so they adhere well.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-3"}, {"@type": "HowToStep", "text": "Place a cast-iron skillet over medium-high heat and add 1 tablespoon of olive oil.", "name": "Place a cast-iron skillet over medium-high heat and add 1 tablespoon of olive oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-4"}, {"@type": "HowToStep", "text": "When the oil is hot, place the seasoned pork tenderloins in the skillet. Sear the first side for approximately 1 minute, or until a golden-brown crust develops.", "name": "When the oil is hot, place the seasoned pork tenderloins in the skillet. Sear the first side for approximately 1 minute, or until a golden-brown crust develops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-5"}, {"@type": "HowToStep", "text": "Turn the pork and continue searing each remaining side until the exterior is evenly browned. This should require only a few additional minutes.", "name": "Turn the pork and continue searing each remaining side until the exterior is evenly browned. This should require only a few additional minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the skillet containing the seared tenderloins directly into the preheated oven.", "name": "Transfer the skillet containing the seared tenderloins directly into the preheated oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-7"}, {"@type": "HowToStep", "text": "Roast for approximately 20 minutes, turning the pork over halfway through the cooking period.", "name": "Roast for approximately 20 minutes, turning the pork over halfway through the cooking period.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-8"}, {"@type": "HowToStep", "text": "Insert a meat thermometer into the thickest section of the tenderloin. The internal temperature should reach 145°F. If necessary, continue roasting and check the temperature again every few minutes.", "name": "Insert a meat thermometer into the thickest section of the tenderloin. The internal temperature should reach 145°F. If necessary, continue roasting and check the temperature again every few minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-9"}, {"@type": "HowToStep", "text": "Once the pork reaches the proper temperature, remove the skillet from the oven and transfer the tenderloins to a plate.", "name": "Once the pork reaches the proper temperature, remove the skillet from the oven and transfer the tenderloins to a plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-10"}, {"@type": "HowToStep", "text": "Loosely cover the meat with aluminum foil and allow it to rest for 5 minutes before slicing. Resting helps preserve the pork's moisture and tenderness.", "name": "Loosely cover the meat with aluminum foil and allow it to rest for 5 minutes before slicing. Resting helps preserve the pork's moisture and tenderness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-11"}, {"@type": "HowToStep", "text": "Return the skillet containing the pork drippings to the stovetop and set it over medium heat.", "name": "Return the skillet containing the pork drippings to the stovetop and set it over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-12"}, {"@type": "HowToStep", "text": "Add the unsalted butter and allow it to melt. As it melts, scrape the browned bits from the bottom of the skillet and incorporate them into the mixture.", "name": "Add the unsalted butter and allow it to melt. As it melts, scrape the browned bits from the bottom of the skillet and incorporate them into the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-13"}, {"@type": "HowToStep", "text": "Stir in the all-purpose flour until it is thoroughly combined with the butter, drippings, and remaining herbs.", "name": "Stir in the all-purpose flour until it is thoroughly combined with the butter, drippings, and remaining herbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-14"}, {"@type": "HowToStep", "text": "Gradually add the 2% milk while whisking continuously to maintain a smooth consistency and prevent lumps.", "name": "Gradually add the 2% milk while whisking continuously to maintain a smooth consistency and prevent lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-15"}, {"@type": "HowToStep", "text": "Bring the mixture to a boil, then allow it to simmer until the gravy becomes smooth and thickened. Add a little additional milk when necessary to achieve the preferred consistency.", "name": "Bring the mixture to a boil, then allow it to simmer until the gravy becomes smooth and thickened. Add a little additional milk when necessary to achieve the preferred consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-16"}, {"@type": "HowToStep", "text": "Remove the finished gravy from the heat.", "name": "Remove the finished gravy from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-17"}, {"@type": "HowToStep", "text": "Cut the rested pork tenderloins into slices and arrange them on serving plates.", "name": "Cut the rested pork tenderloins into slices and arrange them on serving plates.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-18"}, {"@type": "HowToStep", "text": "Spoon the warm pan gravy generously over the pork, then finish with finely chopped fresh parsley for fresh flavor and color.", "name": "Spoon the warm pan gravy generously over the pork, then finish with finely chopped fresh parsley for fresh flavor and color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-with-gravy/#wprm-recipe-45415-step-0-19"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Pork Tenderloin with Gravy"}</script>
