    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Slow Cooker Beef Stew", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty slow-cooked beef stew featuring tender beef, Yukon Gold potatoes, carrots, onions, and peas in a savory red wine and beef broth base. Browning the beef and deglazing the skillet build additional depth, while a final addition of cold butter gives the broth a smooth, velvety finish.", "datePublished": "2019-05-06T07:31:26+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/slow-cooker-beef-stew.png", "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/slow-cooker-beef-stew.png", "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/slow-cooker-beef-stew.png", "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/slow-cooker-beef-stew.png"], "cookTime": "PT210M", "totalTime": "PT225M", "recipeIngredient": ["¼ cup all-purpose flour", "½ teaspoon freshly ground black pepper", "2½ pounds beef stew meat (trimmed of large pieces of excess fat and cut into 1-inch chunks)", "½ teaspoon celery salt", "3  –6 tablespoons olive oil (as required for browning)", "½ teaspoon garlic salt", "3 tablespoons tomato paste", "1 cup Cabernet Sauvignon or Merlot", "5  medium carrots (cut into 1-inch sections)", "2  beef bouillon cubes", "4  garlic cloves (finely minced)", "1 pound baby Yukon Gold potatoes (halved or quartered)", "2 tablespoons Worcestershire sauce", "2  bay leaves", "4 cups beef stock", "1  fresh rosemary sprig", "2 cups yellow onion (diced)", "3 tablespoons chilled butter (divided)", "1 cup frozen green peas", "2  –3 drops Gravy Master (optional for deeper color)", "¼ cup cold water combined with 3 tablespoons cornstarch (optional for thickening)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Trim away any large pieces of fat from the stew meat while retaining the natural marbling. Cut the beef into approximately 1-inch pieces if it is not already prepared to this size.", "name": "Trim away any large pieces of fat from the stew meat while retaining the natural marbling. Cut the beef into approximately 1-inch pieces if it is not already prepared to this size.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-0"}, {"@type": "HowToStep", "text": "Season the meat evenly with the garlic salt, celery salt, and black pepper, tossing thoroughly so the seasoning coats every piece.", "name": "Season the meat evenly with the garlic salt, celery salt, and black pepper, tossing thoroughly so the seasoning coats every piece.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-1"}, {"@type": "HowToStep", "text": "Scatter the flour over the seasoned beef and toss again until the pieces have an even, light flour coating. This coating assists with browning and contributes to thickening the stew during cooking.", "name": "Scatter the flour over the seasoned beef and toss again until the pieces have an even, light flour coating. This coating assists with browning and contributes to thickening the stew during cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-2"}, {"@type": "HowToStep", "text": "Heat 3 tablespoons of the olive oil in a large skillet over medium-high heat. Brown the beef in batches, keeping enough space between the pieces to prevent overcrowding. Sear each side for approximately 45 seconds.", "name": "Heat 3 tablespoons of the olive oil in a large skillet over medium-high heat. Brown the beef in batches, keeping enough space between the pieces to prevent overcrowding. Sear each side for approximately 45 seconds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-3"}, {"@type": "HowToStep", "text": "Transfer each batch of browned beef directly to the slow cooker. Add additional olive oil as necessary while cooking the remaining meat.", "name": "Transfer each batch of browned beef directly to the slow cooker. Add additional olive oil as necessary while cooking the remaining meat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-4"}, {"@type": "HowToStep", "text": "Lower the skillet heat to medium and melt 1 tablespoon of the chilled butter. Add the diced yellow onions and sauté for approximately 5 minutes, or until softened.", "name": "Lower the skillet heat to medium and melt 1 tablespoon of the chilled butter. Add the diced yellow onions and sauté for approximately 5 minutes, or until softened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-5"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and continue cooking for another minute.", "name": "Stir in the minced garlic and continue cooking for another minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-6"}, {"@type": "HowToStep", "text": "Pour a splash of the measured red wine into the skillet. Scrape the bottom of the pan with a spatula to release the browned bits, incorporating them into the liquid.", "name": "Pour a splash of the measured red wine into the skillet. Scrape the bottom of the pan with a spatula to release the browned bits, incorporating them into the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the onion and garlic mixture, together with all of the skillet juices, into the slow cooker with the browned beef.", "name": "Transfer the onion and garlic mixture, together with all of the skillet juices, into the slow cooker with the browned beef.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-8"}, {"@type": "HowToStep", "text": "Add the carrots, Yukon Gold potatoes, beef stock, bouillon cubes, Worcestershire sauce, tomato paste, bay leaves, fresh rosemary, and the remainder of the measured wine to the slow cooker.", "name": "Add the carrots, Yukon Gold potatoes, beef stock, bouillon cubes, Worcestershire sauce, tomato paste, bay leaves, fresh rosemary, and the remainder of the measured wine to the slow cooker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-9"}, {"@type": "HowToStep", "text": "Gently stir the contents until the ingredients are evenly distributed.", "name": "Gently stir the contents until the ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-10"}, {"@type": "HowToStep", "text": "Cover and cook on Low for 7½–8 hours or on High for 3½–4 hours, continuing until the vegetables are tender and the potatoes can be easily pierced with a fork.", "name": "Cover and cook on Low for 7½–8 hours or on High for 3½–4 hours, continuing until the vegetables are tender and the potatoes can be easily pierced with a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-11"}, {"@type": "HowToStep", "text": "Approximately 15 minutes before the cooking time is complete, stir the frozen peas into the stew.", "name": "Approximately 15 minutes before the cooking time is complete, stir the frozen peas into the stew.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-12"}, {"@type": "HowToStep", "text": "Once the stew has finished cooking, remove and discard the bay leaves and the rosemary stem.", "name": "Once the stew has finished cooking, remove and discard the bay leaves and the rosemary stem.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-13"}, {"@type": "HowToStep", "text": "For a thicker consistency, whisk the ¼ cup of cold water together with the 3 tablespoons of cornstarch until completely smooth. Gradually stir the slurry into the hot stew. The broth will continue to thicken as the stew rests.", "name": "For a thicker consistency, whisk the ¼ cup of cold water together with the 3 tablespoons of cornstarch until completely smooth. Gradually stir the slurry into the hot stew. The broth will continue to thicken as the stew rests.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-14"}, {"@type": "HowToStep", "text": "If a deeper brown color is preferred, stir in 2–3 drops of Gravy Master.", "name": "If a deeper brown color is preferred, stir in 2–3 drops of Gravy Master.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-15"}, {"@type": "HowToStep", "text": "Turn off the slow cooker. Add the remaining 2 tablespoons of cold butter and gently swirl or stir until completely melted into the broth. This finishing technique, known as monter au beurre, gives the stew a smoother and more velvety texture.", "name": "Turn off the slow cooker. Add the remaining 2 tablespoons of cold butter and gently swirl or stir until completely melted into the broth. This finishing technique, known as monter au beurre, gives the stew a smoother and more velvety texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-16"}, {"@type": "HowToStep", "text": "Serve the beef stew hot.", "name": "Serve the beef stew hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooker-beef-stew/#wprm-recipe-45317-step-0-17"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Slow Cooker Beef Stew"}</script>
