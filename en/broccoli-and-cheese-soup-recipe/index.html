    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Crockpot Broccoli Cheese Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "This easy and nutritious Broccoli and Cheese Soup is packed with fresh vegetables and sharp cheddar, prepared effortlessly in a slow cooker. A hearty and comforting dish perfect for any meal.", "datePublished": "2024-04-13T10:53:54+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Broccoli-and-Cheese-Soup-recipe-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Broccoli-and-Cheese-Soup-recipe-1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Broccoli-and-Cheese-Soup-recipe-1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Broccoli-and-Cheese-Soup-recipe-1-480x270.jpg"], "prepTime": "PT15M", "cookTime": "PT270M", "totalTime": "PT285M", "recipeIngredient": ["5 cups broccoli florets (chopped (approximately 16 ounces))", "1  medium yellow onion (finely diced)", "1 teaspoon dried oregano", "2 ounces reduced-fat cream cheese (avoid fat-free)", "¼ teaspoon freshly grated nutmeg", "8 ounces sharp cheddar cheese (grated)", "2 ½ cups reduced sodium chicken broth or vegetable broth", "3 cloves garlic (minced)", "1 cup grated carrots (either freshly grated or pre-cut julienne)", "1  can (12 ounces 2% evaporated milk)", "½ teaspoon kosher salt", "¼ teaspoon black pepper"], "recipeInstructions": [{"@type": "HowToStep", "text": "In the bottom of a 5-to-6-quart slow cooker, place the chopped broccoli, diced onion, minced garlic, and grated carrots. Add the cream cheese, oregano, nutmeg, and chicken broth, stirring to combine.", "name": "In the bottom of a 5-to-6-quart slow cooker, place the chopped broccoli, diced onion, minced garlic, and grated carrots. Add the cream cheese, oregano, nutmeg, and chicken broth, stirring to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cheese-soup-recipe/#wprm-recipe-2120-step-0-0"}, {"@type": "HowToStep", "text": "Cover and cook on high for 2 hours or low for 4 to 6 hours, until the broccoli is tender and cooked through.", "name": "Cover and cook on high for 2 hours or low for 4 to 6 hours, until the broccoli is tender and cooked through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cheese-soup-recipe/#wprm-recipe-2120-step-0-1"}, {"@type": "HowToStep", "text": "After cooking, remove the lid and pour in the evaporated milk. Using an immersion blender, puree roughly three-quarters of the soup, leaving some broccoli chunks for texture. If you prefer, blend the soup in small batches in a food processor or blender, being cautious with the hot liquid.", "name": "After cooking, remove the lid and pour in the evaporated milk. Using an immersion blender, puree roughly three-quarters of the soup, leaving some broccoli chunks for texture. If you prefer, blend the soup in small batches in a food processor or blender, being cautious with the hot liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cheese-soup-recipe/#wprm-recipe-2120-step-0-2"}, {"@type": "HowToStep", "text": "Cover again and cook on low for an additional 10 minutes until thoroughly warmed.", "name": "Cover again and cook on low for an additional 10 minutes until thoroughly warmed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cheese-soup-recipe/#wprm-recipe-2120-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the salt, black pepper, and grated cheddar cheese. Taste the soup and adjust the seasoning with more salt or pepper as needed. Cover once more and cook on high for about 5 more minutes until the cheese is fully melted and the soup is heated through.", "name": "Stir in the salt, black pepper, and grated cheddar cheese. Taste the soup and adjust the seasoning with more salt or pepper as needed. Cover once more and cook on high for about 5 more minutes until the cheese is fully melted and the soup is heated through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cheese-soup-recipe/#wprm-recipe-2120-step-0-4"}, {"@type": "HowToStep", "text": "Serve hot and enjoy!", "name": "Serve hot and enjoy!", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-and-cheese-soup-recipe/#wprm-recipe-2120-step-0-5"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Crockpot Broccoli Cheese Soup Recipe"}</script>
