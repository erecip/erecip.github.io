    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender almond-and-coconut-flour lemon cake flavored with fresh lemon juice, citrus zest, and lemon extract. The layers are finished with a smooth lemon cream cheese frosting and garnished with fresh lemon slices.", "datePublished": "2023-07-10T17:12:14+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/lemon-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/lemon-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/lemon-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/lemon-cake2.png"], "cookTime": "PT19M", "totalTime": "PT49M", "recipeIngredient": ["4  large eggs (brought to room temperature for improved aeration)", "3 tablespoons fresh lemon juice", "1 teaspoon vanilla extract", "2 cups finely ground blanched almond flour", "2/3 cup granulated monk fruit sweetener", "1/2 tablespoon finely grated lemon peel (approximately the peel from 1 medium lemon)", "1 teaspoon baking soda", "2/3 cup coconut oil (melted and allowed to cool so it does not heat the eggs)", "1/8 teaspoon sea salt", "1/3 cup coconut flour", "1 teaspoon lemon extract", "1/2 cup unsweetened almond milk (at room temperature, ideally around 70°F)", "1 teaspoon baking powder", "1/2 tablespoon vinegar", "1 teaspoon finely grated lemon zest", "1/3 cup unsalted butter (softened but not melted)", "1/2 teaspoon lemon extract", "2 teaspoons almond milk", "8 ounces cream cheese (softened)", "1 teaspoon vanilla extract", "2 to 2 1/2 cups powdered monk fruit sweetener", "Fresh lemon slices"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 350°F (175°C). Lightly grease three 6-inch round cake pans or two 8-inch round cake pans with nonstick baking spray. Place a parchment-paper round in the bottom of each pan, then set the prepared pans aside.", "name": "Heat the oven to 350°F (175°C). Lightly grease three 6-inch round cake pans or two 8-inch round cake pans with nonstick baking spray. Place a parchment-paper round in the bottom of each pan, then set the prepared pans aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-0"}, {"@type": "HowToStep", "text": "In a medium bowl, whisk together the blanched almond flour, coconut flour, baking powder, baking soda, and sea salt until evenly distributed.", "name": "In a medium bowl, whisk together the blanched almond flour, coconut flour, baking powder, baking soda, and sea salt until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-1"}, {"@type": "HowToStep", "text": "Stir the room-temperature almond milk together with the vinegar in a separate measuring cup. Allow the mixture to stand for approximately 5 minutes, giving it time to curdle slightly and form a quick dairy-free buttermilk-style mixture.", "name": "Stir the room-temperature almond milk together with the vinegar in a separate measuring cup. Allow the mixture to stand for approximately 5 minutes, giving it time to curdle slightly and form a quick dairy-free buttermilk-style mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-2"}, {"@type": "HowToStep", "text": "In a large bowl, whisk the room-temperature eggs with the granulated monk fruit sweetener, cooled melted coconut oil, vanilla extract, lemon extract, lemon juice, and grated lemon peel. Add the curdled almond milk mixture and stir until thoroughly incorporated.", "name": "In a large bowl, whisk the room-temperature eggs with the granulated monk fruit sweetener, cooled melted coconut oil, vanilla extract, lemon extract, lemon juice, and grated lemon peel. Add the curdled almond milk mixture and stir until thoroughly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-3"}, {"@type": "HowToStep", "text": "Gradually add the dry mixture to the wet ingredients. Stir only until the ingredients are combined and the batter becomes smooth, taking care not to overmix.", "name": "Gradually add the dry mixture to the wet ingredients. Stir only until the ingredients are combined and the batter becomes smooth, taking care not to overmix.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-4"}, {"@type": "HowToStep", "text": "Distribute the batter evenly among the prepared cake pans and level the surfaces with a spatula. Bake for 19–24 minutes, or until a toothpick inserted into the center of a cake layer comes out clean.", "name": "Distribute the batter evenly among the prepared cake pans and level the surfaces with a spatula. Bake for 19–24 minutes, or until a toothpick inserted into the center of a cake layer comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-5"}, {"@type": "HowToStep", "text": "Leave the baked cakes in their pans for at least 30 minutes. Carefully release them from the pans afterward and place them on wire cooling racks. Allow the layers to cool completely to room temperature before frosting.", "name": "Leave the baked cakes in their pans for at least 30 minutes. Carefully release them from the pans afterward and place them on wire cooling racks. Allow the layers to cool completely to room temperature before frosting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-6"}, {"@type": "HowToStep", "text": "Add the softened cream cheese to the whipped butter and continue beating for another 3 minutes, until the two are fully blended.", "name": "Add the softened cream cheese to the whipped butter and continue beating for another 3 minutes, until the two are fully blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-7"}, {"@type": "HowToStep", "text": "Gradually incorporate the powdered monk fruit sweetener, vanilla extract, lemon extract, finely grated lemon zest, and almond milk. Beat for another 2–3 minutes, until the frosting has a creamy, smooth consistency. Cover and refrigerate until needed.", "name": "Gradually incorporate the powdered monk fruit sweetener, vanilla extract, lemon extract, finely grated lemon zest, and almond milk. Beat for another 2–3 minutes, until the frosting has a creamy, smooth consistency. Cover and refrigerate until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-8"}, {"@type": "HowToStep", "text": "Set one completely cooled cake layer on a serving platter or cake stand. Spread an even layer of lemon cream cheese frosting over the top. Add the next cake layer and repeat the process until all layers have been stacked with frosting between them.", "name": "Set one completely cooled cake layer on a serving platter or cake stand. Spread an even layer of lemon cream cheese frosting over the top. Add the next cake layer and repeat the process until all layers have been stacked with frosting between them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-9"}, {"@type": "HowToStep", "text": "Use the remaining frosting to cover the sides of the cake if a fully frosted finish is desired. Arrange fresh lemon slices over the top for decoration.", "name": "Use the remaining frosting to cover the sides of the cake if a fully frosted finish is desired. Arrange fresh lemon slices over the top for decoration.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-10"}, {"@type": "HowToStep", "text": "Refrigerate the assembled cake for 1–2 hours before cutting. This resting period allows the frosting to firm slightly and helps the cake slice more neatly.", "name": "Refrigerate the assembled cake for 1–2 hours before cutting. This resting period allows the frosting to firm slightly and helps the cake slice more neatly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cake/#wprm-recipe-45516-step-0-11"}], "recipeCategory": ["cake", "Dessert"], "keywords": "Lemon Cake"}</script>
