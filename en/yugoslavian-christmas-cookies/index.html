    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Yugoslavian Christmas Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Rich, buttery Yugoslavian Christmas cookies layered with seedless blackberry jam and a walnut-lemon meringue. The crisp, golden meringue contrasts with the tender pastry base and fruity filling, while chopped walnuts provide a delicate finishing crunch.", "datePublished": "2021-02-16T07:07:16+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/yugoslavian-christmas-cookies/yugoslavian-christmas-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/yugoslavian-christmas-cookies/yugoslavian-christmas-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/yugoslavian-christmas-cookies/yugoslavian-christmas-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/yugoslavian-christmas-cookies/yugoslavian-christmas-cookies2.png"], "cookTime": "PT40M", "totalTime": "PT40M", "recipeIngredient": ["1 cup unsalted butter (softened to room temperature, approximately 70°F)", "1  large egg yolk", "1/2 teaspoon salt", "2 1/2 cups all-purpose flour (such as King Arthur)", "1/2 cup granulated white sugar", "1 teaspoon lemon extract", "3/4 cup walnuts (finely ground for a smoother-textured meringue)", "4  large egg whites", "1 cup granulated white sugar", "1 cup seedless blackberry jam (such as Polaner)", "1/4 cup walnuts (chopped)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the dough. Preheat the oven to 350°F (175°C). Have an 11 × 16-inch jelly roll pan or a 9 × 13-inch baking pan ready.", "name": "Prepare the dough. Preheat the oven to 350°F (175°C). Have an 11 × 16-inch jelly roll pan or a 9 × 13-inch baking pan ready.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yugoslavian-christmas-cookies/#wprm-recipe-44826-step-0-0"}, {"@type": "HowToStep", "text": "Using a hand mixer or stand mixer, beat the softened butter with 1/2 cup sugar until the mixture becomes pale, light, and fluffy.", "name": "Using a hand mixer or stand mixer, beat the softened butter with 1/2 cup sugar until the mixture becomes pale, light, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yugoslavian-christmas-cookies/#wprm-recipe-44826-step-0-1"}, {"@type": "HowToStep", "text": "Mix in the egg yolk and salt until thoroughly incorporated.", "name": "Mix in the egg yolk and salt until thoroughly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yugoslavian-christmas-cookies/#wprm-recipe-44826-step-0-2"}, {"@type": "HowToStep", "text": "Add the flour gradually, continuing to mix until a crumbly dough forms.", "name": "Add the flour gradually, continuing to mix until a crumbly dough forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yugoslavian-christmas-cookies/#wprm-recipe-44826-step-0-3"}, {"@type": "HowToStep", "text": "Press the dough evenly across the bottom of the prepared pan. Lightly flour your hands as needed to keep the dough from sticking while pressing it into place.", "name": "Press the dough evenly across the bottom of the prepared pan. Lightly flour your hands as needed to keep the dough from sticking while pressing it into place.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yugoslavian-christmas-cookies/#wprm-recipe-44826-step-0-4"}, {"@type": "HowToStep", "text": "Prepare the meringue. Using a mixer fitted with a whisk attachment, whip the egg whites until stiff peaks develop.", "name": "Prepare the meringue. Using a mixer fitted with a whisk attachment, whip the egg whites until stiff peaks develop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yugoslavian-christmas-cookies/#wprm-recipe-44826-step-0-5"}, {"@type": "HowToStep", "text": "Slowly incorporate 1 cup sugar while continuing to beat the whites. Whip until the meringue is firm and glossy.", "name": " ipe-44826-step-0-15"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["Yugoslavian"], "keywords": "Yugoslavian Christmas Cookies"}</script>
