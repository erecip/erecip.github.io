    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Rustic Old Fashioned Beef Stew", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty, traditional beef stew featuring tender chuck, red potatoes, pearl onions, carrots, and celery in a deeply savory broth enriched with tomato paste, Worcestershire sauce, herbs, and warming spices. A cornstarch slurry provides a rich, substantial finish.", "datePublished": "2023-01-10T00:38:55+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/rustic-old-fashioned-beef-stew2.png", "https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/rustic-old-fashioned-beef-stew2.png", "https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/rustic-old-fashioned-beef-stew2.png", "https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/rustic-old-fashioned-beef-stew2.png"], "totalTime": "PT90M", "recipeIngredient": ["4 cups beef broth", "2  garlic cloves (finely minced)", "¼ cup Worcestershire sauce", "2 lb beef chuck (cut into cubes)", "2 tablespoons olive oil", "¼ teaspoon ground black pepper", "2 tablespoons tomato paste", "1 teaspoon salt", "2 tablespoons cornstarch", "4  celery ribs (sliced)", "½ teaspoon dried oregano", "10 oz pearl onions", "¼ teaspoon ground allspice", "4  medium carrots (cut into slices)", "½ teaspoon paprika", "1½ lb red potatoes (diced)", "½ teaspoon dried parsley", "1 teaspoon granulated sugar", "½ teaspoon dried basil", "¼ cup cold water", "2 tablespoons cornstarch"], "recipeInstructions": [{"@type": "HowToStep", "text": "Coat and season the beef. Place the cubed beef chuck in a bowl with 2 tablespoons cornstarch, 1 teaspoon salt, and ¼ teaspoon black pepper. Toss thoroughly until every piece of beef is evenly covered with the seasoned cornstarch mixture.", "name": "Coat and season the beef. Place the cubed beef chuck in a bowl with 2 tablespoons cornstarch, 1 teaspoon salt, and ¼ teaspoon black pepper. Toss thoroughly until every piece of beef is evenly covered with the seasoned cornstarch mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/#wprm-recipe-44176-step-0-0"}, {"@type": "HowToStep", "text": "Brown the meat. Warm 2 tablespoons olive oil in a large pot or Dutch oven over medium-high heat. Add the coated beef and cook for approximately 5 minutes, stirring frequently so the pieces develop an even brown crust on all sides.", "name": "Brown the meat. Warm 2 tablespoons olive oil in a large pot or Dutch oven over medium-high heat. Add the coated beef and cook for approximately 5 minutes, stirring frequently so the pieces develop an even brown crust on all sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/#wprm-recipe-44176-step-0-1"}, {"@type": "HowToStep", "text": "Develop the savory base. Add the minced garlic and tomato paste directly to the browned beef. Cook for 1–2 minutes while stirring, allowing the garlic to become aromatic and the tomato paste to deepen slightly in color.", "name": "Develop the savory base. Add the minced garlic and tomato paste directly to the browned beef. Cook for 1–2 minutes while stirring, allowing the garlic to become aromatic and the tomato paste to deepen slightly in color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/#wprm-recipe-44176-step-0-2"}, {"@type": "HowToStep", "text": "Add the broth, vegetables, and seasonings. Pour the beef broth and Worcestershire sauce into the pot. Scrape across the bottom to release the browned, caramelized bits. Add the diced red potatoes, pearl onions, sliced carrots, and celery. Season with the granulated sugar, basil, oregano, parsley, paprika, and ground allspice, then stir until everything is evenly distributed.", "name": "Add the broth, vegetables, and seasonings. Pour the beef broth and Worcestershire sauce into the pot. Scrape across the bottom to release the browned, caramelized bits. Add the diced red potatoes, pearl onions, sliced carrots, and celery. Season with the granulated sugar, basil, oregano, parsley, paprika, and ground allspice, then stir until everything is evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/#wprm-recipe-44176-step-0-3"}, {"@type": "HowToStep", "text": "Simmer until tender. Increase the heat and bring the stew to a boil. Once boiling, reduce the heat to low and cover the pot. Maintain a gentle simmer for 90–120 minutes, stirring occasionally to keep the ingredients from sticking and to promote even cooking. The beef should become tender as the stew develops a fuller flavor.", "name": "Simmer until tender. Increase the heat and bring the stew to a boil. Once boiling, reduce the heat to low and cover the pot. Maintain a gentle simmer for 90–120 minutes, stirring occasionally to keep the ingredients from sticking and to promote even cooking. The beef should become tender as the stew develops a fuller flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/#wprm-recipe-44176-step-0-4"}, {"@type": "HowToStep", "text": "Thicken the broth. Combine the remaining 2 tablespoons cornstarch with ¼ cup cold water in a small bowl, stirring until smooth and completely dissolved. Slowly add the slurry to the simmering stew while stirring continuously. Leave the pot uncovered and continue cooking over low heat for a few additional minutes, until the broth reaches the preferred thickness.", "name": "Thicken the broth. Combine the remaining 2 tablespoons cornstarch with ¼ cup cold water in a small bowl, stirring until smooth and completely dissolved. Slowly add the slurry to the simmering stew while stirring continuously. Leave the pot uncovered and continue cooking over low heat for a few additional minutes, until the broth reaches the preferred thickness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/#wprm-recipe-44176-step-0-5"}, {"@type": "HowToStep", "text": "Finish and serve. Taste the finished stew and add additional salt or black pepper if necessary. Ladle into bowls and serve while hot.", "name": "Finish and serve. Taste the finished stew and add additional salt or black pepper if necessary. Ladle into bowls and serve while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rustic-old-fashioned-beef-stew/#wprm-recipe-44176-step-0-6"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Rustic Old Fashioned Beef Stew"}</script>
