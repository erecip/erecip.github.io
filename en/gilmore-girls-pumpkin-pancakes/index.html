    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gilmore Girls Pumpkin Pancakes", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warmly spiced pumpkin pancake recipe featuring a decorative cinnamon-sugar spiral and a light, whipped cinnamon-honey butter. The pancakes are gently steam-finished rather than flipped, helping the distinctive swirl remain intact while the centers cook through.", "datePublished": "2018-06-07T11:14:23+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/gilmore-girls-pumpkin-pancakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/gilmore-girls-pumpkin-pancakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/gilmore-girls-pumpkin-pancakes2.png", "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/gilmore-girls-pumpkin-pancakes2.png"], "recipeIngredient": ["1 cup 8.54 oz pumpkin purée", "1 teaspoon vanilla bean paste", "2 teaspoons baking powder", "3 tablespoons 1.41 oz vegetable oil", "1  large egg", "1 teaspoon ground cinnamon", "1 1/2 cups 12.88 oz milk", "1 tablespoon granulated sugar", "1/2 teaspoon pumpkin spice blend", "2 cups 8.82 oz all-purpose flour", "1 teaspoon baking soda", "2 teaspoons ground cinnamon", "1 tablespoon prepared pancake batter", "4 tablespoons 2 oz unsalted butter, softened", "1/4 cup 2 oz granulated sugar", "2 tablespoons 1.41 oz honey", "1/16 teaspoon sea salt", "1/3 cup 2.12 oz powdered sugar", "1/2 teaspoon vanilla bean paste", "1 1/2 teaspoons ground cinnamon", "1/2 cup 4 oz unsalted butter, softened", "Unsalted butter (as needed for greasing the pan)", "Water (approximately 1 small teaspoon per batch for steaming)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the all-purpose flour, baking powder, baking soda, granulated sugar, ground cinnamon, and pumpkin spice blend in a large mixing bowl. Whisk until the dry ingredients are evenly distributed.", "name": "Place the all-purpose flour, baking powder, baking soda, granulated sugar, ground cinnamon, and pumpkin spice blend in a large mixing bowl. Whisk until the dry ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-0"}, {"@type": "HowToStep", "text": "Create a well in the middle of the flour mixture. Add the egg, milk, pumpkin purée, vegetable oil, and vanilla bean paste.", "name": "Create a well in the middle of the flour mixture. Add the egg, milk, pumpkin purée, vegetable oil, and vanilla bean paste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-1"}, {"@type": "HowToStep", "text": "Stir only until the wet and dry ingredients come together. Avoid excessive mixing, as a lightly mixed batter helps produce tender, fluffy pancakes.", "name": "Stir only until the wet and dry ingredients come together. Avoid excessive mixing, as a lightly mixed batter helps produce tender, fluffy pancakes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-2"}, {"@type": "HowToStep", "text": "Set the finished batter aside while preparing the cinnamon mixture.", "name": "Set the finished batter aside while preparing the cinnamon mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-3"}, {"@type": "HowToStep", "text": "Combine the softened unsalted butter, granulated sugar, and ground cinnamon in a medium bowl.", "name": "Combine the softened unsalted butter, granulated sugar, and ground cinnamon in a medium bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-4"}, {"@type": "HowToStep", "text": "Stir 1 tablespoon of the prepared pumpkin pancake batter into the cinnamon mixture, blending until the consistency is smooth and uniform.", "name": "Stir 1 tablespoon of the prepared pumpkin pancake batter into the cinnamon mixture, blending until the consistency is smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-5"}, {"@type": "HowToStep", "text": "Spoon the mixture into a piping bag, then trim a small opening from the tip. Reserve until the pancakes are ready to cook.", "name": "Spoon the mixture into a piping bag, then trim a small opening from the tip. Reserve until the pancakes are ready to cook.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-6"}, {"@type": "HowToStep", "text": "Place a pancake pan over medium heat and allow it to warm for approximately 5 minutes. Lightly coat the cooking surface with unsalted butter.", "name": "Place a pancake pan over medium heat and allow it to warm for approximately 5 minutes. Lightly coat the cooking surface with unsalted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-7"}, {"@type": "HowToStep", "text": "After the butter has melted, portion approximately 1/4 cup of pumpkin batter onto the heated pan for each pancake.", "name": "After the butter has melted, portion approximately 1/4 cup of pumpkin batter onto the heated pan for each pancake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-8"}, {"@type": "HowToStep", "text": "Immediately pipe the cinnamon-sugar mixture in a spiral pattern across the top of each portion of batter.", "name": "Immediately pipe the cinnamon-sugar mixture in a spiral pattern across the top of each portion of batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-9"}, {"@type": "HowToStep", "text": "Allow the pancakes to cook for roughly 1–2 minutes, or until small bubbles begin appearing on the surface.", "name": "Allow the pancakes to cook for roughly 1–2 minutes, or until small bubbles begin appearing on the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-10"}, {"@type": "HowToStep", "text": "Pour approximately 1 small teaspoon of water along the edge of the pan and promptly cover it with a lid. Steam the pancakes for an additional 1–2 minutes. This technique cooks the pancakes through without requiring them to be flipped, helping preserve the cinnamon swirl pattern.", "name": "Pour approximately 1 small teaspoon of water along the edge of the pan and promptly cover it with a lid. Steam the pancakes for an additional 1–2 minutes. This technique cooks the pancakes through without requiring them to be flipped, helping preserve the cinnamon swirl pattern.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-11"}, {"@type": "HowToStep", "text": "Continue with the remaining batter and cinnamon mixture, lightly buttering the cooking surface between batches as necessary.", "name": "Continue with the remaining batter and cinnamon mixture, lightly buttering the cooking surface between batches as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the finished pancakes to a wire rack briefly after cooking to prevent excess moisture from making the bottoms soggy.", "name": "Transfer the finished pancakes to a wire rack briefly after cooking to prevent excess moisture from making the bottoms soggy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-13"}, {"@type": "HowToStep", "text": "Add the softened unsalted butter, powdered sugar, ground cinnamon, honey, vanilla bean paste, and sea salt to a mixing bowl.", "name": "Add the softened unsalted butter, powdered sugar, ground cinnamon, honey, vanilla bean paste, and sea salt to a mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-14"}, {"@type": "HowToStep", "text": "Beat the ingredients together until the butter becomes smooth, airy, and thoroughly combined.", "name": "Beat the ingredients together until the butter becomes smooth, airy, and thoroughly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-15"}, {"@type": "HowToStep", "text": "Transfer the cinnamon butter to a piping bag fitted with a star-shaped decorating tip.", "name": "Transfer the cinnamon butter to a piping bag fitted with a star-shaped decorating tip.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-16"}, {"@type": "HowToStep", "text": "If desired, incorporate a small additional drizzle of honey for greater gloss and sweetness.", "name": "If desired, incorporate a small additional drizzle of honey for greater gloss and sweetness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-17"}, {"@type": "HowToStep", "text": "Arrange the warm pumpkin pancakes for serving.", "name": "Arrange the warm pumpkin pancakes for serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-18"}, {"@type": "HowToStep", "text": "Pipe the prepared cinnamon butter over the top of the pancakes while they are still warm.", "name": "Pipe the prepared cinnamon butter over the top of the pancakes while they are still warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-19"}, {"@type": "HowToStep", "text": "Serve immediately for the best texture and presentation.", "name": "Serve immediately for the best texture and presentation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gilmore-girls-pumpkin-pancakes/#wprm-recipe-45897-step-0-20"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Gilmore Girls Pumpkin Pancakes"}</script>
