    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Butter Cookies with Yellow Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, rich cookies made with yellow cake mix, cream cheese, butter, and vanilla, then coated with festive sprinkles and powdered sugar. Chilling the dough before shaping helps create easy-to-handle cookie balls that bake into tender treats with lightly golden edges.", "datePublished": "2020-01-02T23:04:08+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/butter-cookies-with-yellow-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/butter-cookies-with-yellow-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/butter-cookies-with-yellow-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/butter-cookies-with-yellow-cake2.png"], "cookTime": "PT10M", "totalTime": "PT40M", "recipeIngredient": ["8 oz cream cheese (brought to room temperature and softened)", "1  large egg", "1  package yellow cake mix", "½ cup unsalted butter (softened at room temperature)", "1 teaspoon vanilla extract", "Powdered sugar (as needed for coating)", "Festive sprinkles (optional, for decorating)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the softened butter, cream cheese, egg, and vanilla extract in a large mixing bowl. Beat the ingredients together until the mixture becomes fluffy, smooth, and thoroughly combined. Use either a hand mixer or stand mixer set to medium speed.", "name": "Place the softened butter, cream cheese, egg, and vanilla extract in a large mixing bowl. Beat the ingredients together until the mixture becomes fluffy, smooth, and thoroughly combined. Use either a hand mixer or stand mixer set to medium speed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/#wprm-recipe-43348-step-0-0"}, {"@type": "HowToStep", "text": "Gradually add the yellow cake mix to the prepared wet mixture. Continue blending until all of the dry mix has been incorporated and a smooth, uniform dough forms. The dough may become quite thick, so continue mixing until no dry portions remain.", "name": "Gradually add the yellow cake mix to the prepared wet mixture. Continue blending until all of the dry mix has been incorporated and a smooth, uniform dough forms. The dough may become quite thick, so continue mixing until no dry portions remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/#wprm-recipe-43348-step-0-1"}, {"@type": "HowToStep", "text": "Cover the mixing bowl with plastic wrap or a clean kitchen towel. Transfer the dough to the refrigerator and chill for 30 minutes to 1 hour. Refrigerating firms the mixture and makes it easier to shape.", "name": "Cover the mixing bowl with plastic wrap or a clean kitchen towel. Transfer the dough to the refrigerator and chill for 30 minutes to 1 hour. Refrigerating firms the mixture and makes it easier to shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/#wprm-recipe-43348-step-0-2"}, {"@type": "HowToStep", "text": "Remove the chilled dough from the refrigerator and shape it into balls measuring approximately 1 inch in diameter. Roll each dough ball in festive sprinkles first, if using, until evenly decorated. Next, place each ball in powdered sugar and roll until the surface is completely coated.", "name": "Remove the chilled dough from the refrigerator and shape it into balls measuring approximately 1 inch in diameter. Roll each dough ball in festive sprinkles first, if using, until evenly decorated. Next, place each ball in powdered sugar and roll until the surface is completely coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/#wprm-recipe-43348-step-0-3"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Arrange the coated dough balls on a parchment-lined baking sheet, leaving approximately 2 inches of space between each cookie.", "name": "Preheat the oven to 350°F (175°C). Arrange the coated dough balls on a parchment-lined baking sheet, leaving approximately 2 inches of space between each cookie.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/#wprm-recipe-43348-step-0-4"}, {"@type": "HowToStep", "text": "Bake for 10–12 minutes, or until the edges are lightly browned. Avoid baking beyond this point.", "name": "Bake for 10–12 minutes, or until the edges are lightly browned. Avoid baking beyond this point.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/#wprm-recipe-43348-step-0-5"}, {"@type": "HowToStep", "text": "Remove the baking sheet from the oven and allow the cookies to rest on the pan for approximately 5 minutes so they can firm slightly. Carefully transfer them to a wire cooling rack and leave them there until completely cooled.", "name": "Remove the baking sheet from the oven and allow the cookies to rest on the pan for approximately 5 minutes so they can firm slightly. Carefully transfer them to a wire cooling rack and leave them there until completely cooled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-cookies-with-yellow-cake/#wprm-recipe-43348-step-0-6"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Butter Cookies with Yellow Cake"}</script>
