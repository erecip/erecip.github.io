    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mashed Potato Bombs Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Perfect as a holiday appetizer, these Mashed Potato Bombs are indulgent bites of creamy, cheesy, and flavorful mashed potatoes. Using instant mashed potatoes, these little morsels come together easily with a velvety texture.", "datePublished": "2024-04-16T22:40:35+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Mashed-Potato-Bombs-recipe-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Mashed-Potato-Bombs-recipe-1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Mashed-Potato-Bombs-recipe-1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Mashed-Potato-Bombs-recipe-1-480x270.jpg"], "recipeYield": ["24", "24 bites"], "cookTime": "PT30M", "totalTime": "PT45M", "recipeIngredient": ["1  box instant mashed potato flakes", "1 cup sharp cheddar cheese (shredded)", "3/4 cup sour cream", "1 teaspoon paprika", "1 teaspoon black pepper", "2 tablespoons melted butter (plus a small pinch of salt)", "1  whole egg", "1  egg yolk"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the instant mashed potatoes according to package instructions for a six-serving size, using only water, butter, and salt. Omit any directions to add milk. Once prepared, let the potatoes cool slightly.", "name": "Prepare the instant mashed potatoes according to package instructions for a six-serving size, using only water, butter, and salt. Omit any directions to add milk. Once prepared, let the potatoes cool slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potato-bombs-recipe/#wprm-recipe-5306-step-0-0"}, {"@type": "HowToStep", "text": "Once cooled, mix the shredded cheddar cheese, sour cream, and black pepper into the mashed potatoes, stirring well until all ingredients are evenly combined. Allow the mixture to cool to room temperature, then adjust the salt to taste. Optional: add a dash of garlic or onion powder for extra flavor.", "name": "Once cooled, mix the shredded cheddar cheese, sour cream, and black pepper into the mashed potatoes, stirring well until all ingredients are evenly combined. Allow the mixture to cool to room temperature, then adjust the salt to taste. Optional: add a dash of garlic or onion powder for extra flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potato-bombs-recipe/#wprm-recipe-5306-step-0-1"}, {"@type": "HowToStep", "text": "In a small bowl, whisk together the whole egg and the extra egg yolk. Once the potato mixture has fully cooled, gently fold in the whisked eggs.", "name": "In a small bowl, whisk together the whole egg and the extra egg yolk. Once the potato mixture has fully cooled, gently fold in the whisked eggs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potato-bombs-recipe/#wprm-recipe-5306-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the potato mixture to a zip-top bag, pressing it into one corner.", "name": "Transfer the potato mixture to a zip-top bag, pressing it into one corner.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potato-bombs-recipe/#wprm-recipe-5306-step-0-3"}, {"@type": "HowToStep", "text": "Lightly grease mini muffin tins with cooking spray. Snip a small corner off the zip-top bag to create a makeshift piping bag. Pipe the potato mixture into each mini muffin cup in a layered, up-and-down motion.", "name": "Lightly grease mini muffin tins with cooking spray. Snip a small corner off the zip-top bag to create a makeshift piping bag. Pipe the potato mixture into each mini muffin cup in a layered, up-and-down motion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potato-bombs-recipe/#wprm-recipe-5306-step-0-4"}, {"@type": "HowToStep", "text": "In a separate bowl, mix the melted butter with the paprika until well combined. Using a pastry brush, lightly brush the top of each potato puff with the butter mixture.", "name": "In a separate bowl, mix the melted butter with the paprika until well combined. Using a pastry brush, lightly brush the top of each potato puff with the butter mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potato-bombs-recipe/#wprm-recipe-5306-step-0-5"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Place the muffin tins in the center of the oven and bake for 30 minutes. For an extra golden top, broil for an additional 2 minutes, watching closely to prevent burning.", "name": "Preheat the oven to 350°F (175°C). Place the muffin tins in the center of the oven and bake for 30 minutes. For an extra golden top, broil for an additional 2 minutes, watching closely to prevent burning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potato-bombs-recipe/#wprm-recipe-5306-step-0-6"}, {"@type": "HowToStep", "text": "Remove the pans from the oven and let the potato bombs cool in the tins for 15 to 20 minutes before carefully lifting each one out. Serve warm.", "name": "Remove the pans from the oven and let the potato bombs cool in the tins for 15 to 20 minutes before carefully lifting each one out. Serve warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potato-bombs-recipe/#wprm-recipe-5306-step-0-7"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["American"], "keywords": "Mashed Potato Bombs Recipe"}</script>
