y covered.", "name": "Coat the cooked chicken. Transfer the finished chicken to a bowl and pour the blended cottage cheese buffalo sauce over the top. Toss or shake thoroughly until every piece of chicken is evenly covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-buffalo-chicken-wrap/#wprm-recipe-42202-step-0-4"}, {"@type": "HowToStep", "text": "Assemble the wrap. Portion approximately 5 ounces of the coated chicken mixture for one serving. Add shredded mozzarella cheese if desired, then place the mixture inside a low-carb Mission tortilla and serve.", "name": "Assemble the wrap. Portion approximately 5 ounces of the coated chicken mixture for one serving. Add shredded mozzarella cheese if desired, then place the mixture inside a low-carb Mission tortilla and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-buffalo-chicken-wrap/#wprm-recipe-42202-step-0-5"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Cottage Cheese Buffalo Chicken Wrap"}</script>
