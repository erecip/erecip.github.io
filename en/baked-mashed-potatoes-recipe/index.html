ipe-4543-step-0-3"}, {"@type": "HowToStep", "text": "Adjust seasoning with additional salt if needed. Spread the mashed potatoes evenly into the prepared baking dish. Dot the top with the reserved butter cubes.", "name": "Adjust seasoning with additional salt if needed. Spread the mashed potatoes evenly into the prepared baking dish. Dot the top with the reserved butter cubes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-mashed-potatoes-recipe/#wprm-recipe-4543-step-0-4"}, {"@type": "HowToStep", "text": "Bake for 45 minutes, or until the top is golden and slightly crisp. Garnish with chives if desired, and serve hot.", "name": "Bake for 45 minutes, or until the top is golden and slightly crisp. Garnish with chives if desired, and serve hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-mashed-potatoes-recipe/#wprm-recipe-4543-step-0-5"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Baked Mashed Potatoes Recipe"}</script>
