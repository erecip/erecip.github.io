    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic batch of soft, buttery Christmas sugar cookies featuring vanilla flavor and a festive sprinkle coating. The dough is mixed until smooth, shaped into rounds, gently flattened, and baked just until the edges develop a light golden color.", "datePublished": "2020-09-01T15:04:39+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/christmas-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/christmas-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/christmas-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/christmas-cookies2.png"], "cookTime": "PT10M", "totalTime": "PT13M", "recipeIngredient": ["1  large egg", "1 cup unsalted butter (softened (Miyoko’s Kitchen Cultured Vegan Butter may be used))", "½ teaspoon baking powder", "1 teaspoon vanilla extract (recommended for the fullest flavor)", "1½ cups granulated sugar", "Sprinkles (as desired (optional, for decorating))", "1 teaspoon baking soda", "2¾ cups all-purpose flour"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C). In a medium-sized mixing bowl, thoroughly stir together the all-purpose flour, baking soda, and baking powder. Set the dry mixture aside.", "name": "Preheat the oven to 375°F (190°C). In a medium-sized mixing bowl, thoroughly stir together the all-purpose flour, baking soda, and baking powder. Set the dry mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened butter and granulated sugar in a large mixing bowl. Using either a hand mixer or stand mixer, beat them together until the consistency becomes creamy and smooth.", "name": "Place the softened butter and granulated sugar in a large mixing bowl. Using either a hand mixer or stand mixer, beat them together until the consistency becomes creamy and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-1"}, {"@type": "HowToStep", "text": "Add the egg and vanilla extract, then continue beating until both are completely incorporated into the butter mixture.", "name": "Add the egg and vanilla extract, then continue beating until both are completely incorporated into the butter mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-2"}, {"@type": "HowToStep", "text": "Gradually add the reserved flour mixture to the butter and sugar mixture, beating as you go until a dough develops.", "name": "Gradually add the reserved flour mixture to the butter and sugar mixture, beating as you go until a dough develops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-3"}, {"@type": "HowToStep", "text": "The mixture may initially look somewhat crumbly. Continue mixing until the dough holds together and forms a cohesive mass.", "name": "The mixture may initially look somewhat crumbly. Continue mixing until the dough holds together and forms a cohesive mass.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-4"}, {"@type": "HowToStep", "text": "Portion the dough with a 1-inch cookie scoop, then roll each portion between your hands to create a round ball.", "name": "Portion the dough with a 1-inch cookie scoop, then roll each portion between your hands to create a round ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-5"}, {"@type": "HowToStep", "text": "Arrange the dough balls on a greased baking sheet. Press each one with the smooth bottom of a drinking glass until the dough is approximately ½ inch thick.", "name": "Arrange the dough balls on a greased baking sheet. Press each one with the smooth bottom of a drinking glass until the dough is approximately ½ inch thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-6"}, {"@type": "HowToStep", "text": "Pour the sprinkles into a small bowl. Gently press the top of each flattened dough round into the sprinkles so the surface is evenly covered.", "name": "Pour the sprinkles into a small bowl. Gently press the top of each flattened dough round into the sprinkles so the surface is evenly covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-7"}, {"@type": "HowToStep", "text": "Place the decorated dough back onto the baking sheet with the sprinkle-coated side facing upward.", "name": "Place the decorated dough back onto the baking sheet with the sprinkle-coated side facing upward.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-8"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 8–10 minutes, or until the cookie edges are lightly golden.", "name": "Bake in the preheated oven for 8–10 minutes, or until the cookie edges are lightly golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-9"}, {"@type": "HowToStep", "text": "Leave the freshly baked cookies on the baking sheet for approximately 3 minutes.", "name": "Leave the freshly baked cookies on the baking sheet for approximately 3 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-10"}, {"@type": "HowToStep", "text": "Transfer them to a wire cooling rack and allow them to cool completely before serving.", "name": "Transfer them to a wire cooling rack and allow them to cool completely before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies/#wprm-recipe-45437-step-0-11"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Christmas Cookies"}</script>
