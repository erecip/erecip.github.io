le the tortillas are in the oven, place a medium to large saucepan over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-tostadas/#wprm-recipe-38411-step-0-6"}, {"@type": "HowToStep", "text": "Add the shredded chicken, salsa, taco seasoning, drained corn, and rinsed black beans to the saucepan.", "name": "Add the shredded chicken, salsa, taco seasoning, drained corn, and rinsed black beans to the saucepan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-tostadas/#wprm-recipe-38411-step-0-7"}, {"@type": "HowToStep", "text": "Warm the mixture for about 5 minutes, stirring from time to time, until everything is heated through.", "name": "Warm the mixture for about 5 minutes, stirring from time to time, until everything is heated through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-tostadas/#wprm-recipe-38411-step-0-8"}, {"@type": "HowToStep", "text": "Remove the baked tortillas from the oven once they are crisp.", "name": "Remove the baked tortillas from the oven once they are crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-tostadas/#wprm-recipe-38411-step-0-9"}, {"@type": "HowToStep", "text": "Spoon 1/2 cup of the hot chicken mixture onto each tortilla.", "name": "Spoon 1/2 cup of the hot chicken mixture onto each tortilla.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-tostadas/#wprm-recipe-38411-step-0-10"}, {"@type": "HowToStep", "text": "Sprinkle 1/4 cup of shredded Colby Jack cheese over the top of each assembled tostada.", "name": "Sprinkle 1/4 cup of shredded Colby Jack cheese over the top of each assembled tostada.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-tostadas/#wprm-recipe-38411-step-0-11"}, {"@type": "HowToStep", "text": "Return the topped tortillas to the oven and bake for 5 more minutes, or until the cheese is fully melted and bubbling.", "name": "Return the topped tortillas to the oven and bake for 5 more minutes, or until the cheese is fully melted and bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-tostadas/#wprm-recipe-38411-step-0-12"}, {"@type": "HowToStep", "text": "Take the tostadas out of the oven.", "name": "Take the tostadas out of the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-tostadas/#wprm-recipe-38411-step-0-13"}, {"@type": "HowToStep", "text": "Finish each tostada with diced tomatoes and fresh cilantro.", "name": "Finish each tostada with diced tomatoes and fresh cilantro.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-tostadas/#wprm-recipe-38411-step-0-14"}, {"@type": "HowToStep", "text": "Serve immediately while the tortillas are crisp and the cheese is hot.", "name": "Serve immediately while the tortillas are crisp and the cheese is hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-tostadas/#wprm-recipe-38411-step-0-15"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Mexican-Inspired"], "keywords": "Rotisserie Chicken Tostadas"}</script>
