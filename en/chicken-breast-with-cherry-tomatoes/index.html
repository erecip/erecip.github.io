    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Breast with Cherry Tomatoes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, golden-seared chicken breasts are finished in a rich Parmesan cream sauce with juicy cherry tomatoes, wilted baby spinach, and fragrant garlic. Fresh lemon and parsley provide a bright finishing touch that balances the creamy sauce.", "datePublished": "2020-08-25T07:15:34+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/chicken-breast-with-cherry-tomatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/chicken-breast-with-cherry-tomatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/chicken-breast-with-cherry-tomatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/chicken-breast-with-cherry-tomatoes.png"], "prepTime": "PT10M", "cookTime": "PT25M", "totalTime": "PT35M", "recipeIngredient": ["1 tablespoon olive oil", "3  boneless (skinless chicken breasts)", "Oregano (as needed for seasoning)", "Kosher salt (to taste)", "Freshly ground black pepper (to taste)", "3 cups tender baby spinach leaves", "3  garlic cloves (freshly minced)", "1 cup heavy cream", "1 tablespoon unsalted butter", "1/3 cup freshly grated Parmesan cheese", "1 1/2 cups cherry tomatoes (cut into halves)", "Fresh parsley (as needed)", "1  fresh lemon (for juice and zest)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Season both surfaces of the chicken breasts evenly with kosher salt, freshly ground black pepper, and oregano.", "name": "Season both surfaces of the chicken breasts evenly with kosher salt, freshly ground black pepper, and oregano.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/#wprm-recipe-45616-step-0-0"}, {"@type": "HowToStep", "text": "Warm the olive oil in a large pan over medium-high heat. Once the oil is hot, place the seasoned chicken breasts in the pan and cook for approximately 5 minutes per side, or until nicely browned and fully cooked. Transfer the chicken to a plate and set it aside.", "name": "Warm the olive oil in a large pan over medium-high heat. Once the oil is hot, place the seasoned chicken breasts in the pan and cook for approximately 5 minutes per side, or until nicely browned and fully cooked. Transfer the chicken to a plate and set it aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/#wprm-recipe-45616-step-0-1"}, {"@type": "HowToStep", "text": "Add the unsalted butter to the same pan and allow it to melt. Stir in the freshly minced garlic and sauté for approximately 30 seconds to 1 minute, just until aromatic. Keep the garlic moving so that it does not scorch.", "name": "Add the unsalted butter to the same pan and allow it to melt. Stir in the freshly minced garlic and sauté for approximately 30 seconds to 1 minute, just until aromatic. Keep the garlic moving so that it does not scorch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/#wprm-recipe-45616-step-0-2"}, {"@type": "HowToStep", "text": "Place the halved cherry tomatoes into the pan and cook until they soften and begin to burst.", "name": "Place the halved cherry tomatoes into the pan and cook until they soften and begin to burst.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/#wprm-recipe-45616-step-0-3"}, {"@type": "HowToStep", "text": "Add the baby spinach and stir it through the tomatoes. Continue cooking for a couple of minutes, stopping once the leaves have just started to wilt.", "name": "Add the baby spinach and stir it through the tomatoes. Continue cooking for a couple of minutes, stopping once the leaves have just started to wilt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/#wprm-recipe-45616-step-0-4"}, {"@type": "HowToStep", "text": "Pour the cream into the pan, then stir in the grated Parmesan. Season the sauce lightly with additional salt and black pepper. Mix thoroughly, reduce the heat, and bring the sauce to a gentle simmer.", "name": "Pour the cream into the pan, then stir in the grated Parmesan. Season the sauce lightly with additional salt and black pepper. Mix thoroughly, reduce the heat, and bring the sauce to a gentle simmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/#wprm-recipe-45616-step-0-5"}, {"@type": "HowToStep", "text": "Return the cooked chicken breasts to the pan. Simmer them in the creamy tomato and spinach sauce for 5 to 7 minutes, occasionally spooning the sauce over the chicken so each piece remains thoroughly coated.", "name": "Return the cooked chicken breasts to the pan. Simmer them in the creamy tomato and spinach sauce for 5 to 7 minutes, occasionally spooning the sauce over the chicken so each piece remains thoroughly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/#wprm-recipe-45616-step-0-6"}, {"@type": "HowToStep", "text": "Finish the dish with a squeeze of fresh lemon juice and a scattering of chopped fresh parsley. Serve the chicken hot, topped generously with the creamy sauce, cherry tomatoes, and spinach.", "name": "Finish the dish with a squeeze of fresh lemon juice and a scattering of chopped fresh parsley. Serve the chicken hot, topped generously with the creamy sauce, cherry tomatoes, and spinach.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-cherry-tomatoes/#wprm-recipe-45616-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Chicken Breast with Cherry Tomatoes"}</script>
