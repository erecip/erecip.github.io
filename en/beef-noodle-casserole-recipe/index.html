-recipe-45973-step-0-5"}, {"@type": "HowToStep", "text": "Increase the heat to medium-high and bring the mixture to a gentle boil. Reduce the heat afterward and simmer for 5–7 minutes, allowing the ingredients and seasonings to blend.", "name": "Increase the heat to medium-high and bring the mixture to a gentle boil. Reduce the heat afterward and simmer for 5–7 minutes, allowing the ingredients and seasonings to blend.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-noodle-casserole-recipe/#wprm-recipe-45973-step-0-6"}, {"@type": "HowToStep", "text": "Add the drained egg noodles to the skillet with the beef and tomato mixture.", "name": "Add the drained egg noodles to the skillet with the beef and tomato mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-noodle-casserole-recipe/#wprm-recipe-45973-step-0-7"}, {"@type": "HowToStep", "text": "Stir in the grated Parmesan cheese, mixing thoroughly until the noodles are evenly coated with the sauce and all ingredients are well distributed.", "name": "Stir in the grated Parmesan cheese, mixing thoroughly until the noodles are evenly coated with the sauce and all ingredients are well distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-noodle-casserole-recipe/#wprm-recipe-45973-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the beef-and-noodle mixture into the prepared casserole dish and spread it into an even layer.", "name": "Transfer the beef-and-noodle mixture into the prepared casserole dish and spread it into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-noodle-casserole-recipe/#wprm-recipe-45973-step-0-9"}, {"@type": "HowToStep", "text": "Sprinkle the shredded mozzarella evenly over the surface. Cover the baking dish with foil and bake for 15 minutes.", "name": "Sprinkle the shredded mozzarella evenly over the surface. Cover the baking dish with foil and bake for 15 minutes.", "url": "https://easy-reci
