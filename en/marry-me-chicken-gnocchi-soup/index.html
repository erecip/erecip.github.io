ps of shredded chicken aside until it is needed for the soup.", "name": "Shred the cooked chicken breast into small, bite-sized pieces. Once prepared, place the 2 cups of shredded chicken aside until it is needed for the soup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-0"}, {"@type": "HowToStep", "text": "Place a medium Dutch oven over medium-high heat. Add the unsalted butter and extra-virgin olive oil, allowing the butter to melt and the oil to become hot.", "name": "Place a medium Dutch oven over medium-high heat. Add the unsalted butter and extra-virgin olive oil, allowing the butter to melt and the oil to become hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-1"}, {"@type": "HowToStep", "text": "Add the freshly minced garlic and sauté for 1–2 minutes, just until it becomes fragrant.", "name": "Add the freshly minced garlic and sauté for 1–2 minutes, just until it becomes fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-2"}, {"@type": "HowToStep", "text": "Stir in the finely chopped sun-dried tomatoes and tomato paste, mixing until they are evenly incorporated.", "name": "Stir in the finely chopped sun-dried tomatoes and tomato paste, mixing until they are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-3"}, {"@type": "HowToStep", "text": "Add the all-purpose flour, Tuscan Marry Me seasoning blend, and sea salt. Whisk continuously until the ingredients combine into a thick, well-seasoned paste.", "name": "Add the all-purpose flour, Tuscan Marry Me seasoning blend, and sea salt. Whisk continuously until the ingredients combine into a thick, well-seasoned paste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-4"}, {"@type": "HowToStep", "text": "Add the potato gnocchi to the Dutch oven and sauté for 1–2 minutes, allowing the exterior of the gnocchi to develop a light sear and slight crispness.", "name": "Add the potato gnocchi to the Dutch oven and sauté for 1–2 minutes, allowing the exterior of the gnocchi to develop a light sear and slight crispness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-5"}, {"@type": "HowToStep", "text": "Reduce the heat to medium-low.", "name": "Reduce the heat to medium-low.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-6"}, {"@type": "HowToStep", "text": "Slowly stir in the heavy cream, chicken stock, freshly squeezed lemon juice, and cooking wine. If preferred, replace the cooking wine with an equal amount of additional chicken stock. Continue stirring until the liquid is smooth and free of flour lumps.", "name": "Slowly stir in the heavy cream, chicken stock, freshly squeezed lemon juice, and cooking wine. If preferred, replace the cooking wine with an equal amount of additional chicken stock. Continue stirring until the liquid is smooth and free of flour lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-7"}, {"@type": "HowToStep", "text": "Add the reserved shredded chicken and chopped kale, stirring thoroughly to distribute them throughout the soup.", "name": "Add the reserved shredded chicken and chopped kale, stirring thoroughly to distribute them throughout the soup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-8"}, {"@type": "HowToStep", "text": "If using the optional tomatoes, stir in 1–2 cups at this point.", "name": "If using the optional tomatoes, stir in 1–2 cups at this point.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-9"}, {"@type": "HowToStep", "text": "Allow the soup to simmer for approximately 10–12 minutes, or until the potato gnocchi are tender and begin floating to the surface.", "name": "Allow the soup to simmer for approximately 10–12 minutes, or until the potato gnocchi are tender and begin floating to the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-10"}, {"@type": "HowToStep", "text": "Stir the freshly shredded Parmesan into the simmering soup.", "name": "Stir the freshly shredded Parmesan into the simmering soup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-11"}, {"@type": "HowToStep", "text": "Continue cooking for another 1–2 minutes, giving the cheese enough time to melt completely and further thicken the creamy broth.", "name": "Continue cooking for another 1–2 minutes, giving the cheese enough time to melt completely and further thicken the creamy broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-12"}, {"@type": "HowToStep", "text": "Remove the Dutch oven from the heat and ladle the soup into serving bowls.", "name": "Remove the Dutch oven from the heat and ladle the soup into serving bowls.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-13"}, {"@type": "HowToStep", "text": "Serve immediately with homemade Texas toast garlic bread on the side, if desired.", "name": "Serve immediately with homemade Texas toast garlic bread on the side, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-gnocchi-soup/#wprm-recipe-45907-step-0-14"}], "recipeCategory": ["Soup"], "recipeCuisine": ["Tuscan"], "keywords": "Marry Me Chicken Gnocchi Soup"}</script>
