    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Banana Bread Mini Loaves", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender, warmly spiced quick bread that combines naturally sweet, overripe bananas with smooth pumpkin purée. This gluten-free recipe produces moist mini loaves with subtle caramel notes from brown sugar and a fragrant blend of cinnamon, ginger, nutmeg, and pumpkin pie spice.", "datePublished": "2023-11-06T14:58:31+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/pumpkin-banana-bread-mini-loaves.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/pumpkin-banana-bread-mini-loaves.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/pumpkin-banana-bread-mini-loaves.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/pumpkin-banana-bread-mini-loaves.png"], "prepTime": "PT15M", "cookTime": "PT40M", "totalTime": "PT65M", "recipeIngredient": ["1 cup pure canned pumpkin purée", "3  large eggs (brought to room temperature)", "½ cup firmly packed light brown sugar", "¼ teaspoon pure vanilla extract", "3  heavily spotted (very ripe bananas, mashed)", "⅔ cup vegetable oil or another neutral-flavored oil (such as canola)", "½ teaspoon pumpkin pie spice", "1 cup granulated white sugar", "2 teaspoons baking soda", "½ teaspoon ground ginger", "3 cups gluten-free 1-to-1 baking flour blend", "¼ teaspoon ground nutmeg", "1 teaspoon ground cinnamon", "½ teaspoon baking powder"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Coat four mini loaf pans or two standard loaf pans with nonstick cooking spray, then set them aside.", "name": "Preheat the oven to 350°F (175°C). Coat four mini loaf pans or two standard loaf pans with nonstick cooking spray, then set them aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/#wprm-recipe-39610-step-0-0"}, {"@type": "HowToStep", "text": "Place the ripe bananas in a large mixing bowl. Mash them until mostly creamy while retaining a small amount of texture.", "name": "Place the ripe bananas in a large mixing bowl. Mash them until mostly creamy while retaining a small amount of texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/#wprm-recipe-39610-step-0-1"}, {"@type": "HowToStep", "text": "Add the granulated sugar, packed brown sugar, vegetable oil, eggs, pumpkin purée, vanilla extract, and pumpkin pie spice to the mashed bananas. Stir thoroughly until the ingredients are evenly combined. A slightly lumpy consistency is expected because of the bananas.", "name": "Add the granulated sugar, packed brown sugar, vegetable oil, eggs, pumpkin purée, vanilla extract, and pumpkin pie spice to the mashed bananas. Stir thoroughly until the ingredients are evenly combined. A slightly lumpy consistency is expected because of the bananas.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/#wprm-recipe-39610-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, combine the gluten-free flour blend, cinnamon, baking powder, baking soda, ginger, and nutmeg. Stir well to distribute the leavening agents and spices uniformly.", "name": "In a separate bowl, combine the gluten-free flour blend, cinnamon, baking powder, baking soda, ginger, and nutmeg. Stir well to distribute the leavening agents and spices uniformly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/#wprm-recipe-39610-step-0-3"}, {"@type": "HowToStep", "text": "Add approximately half of the dry mixture to the wet ingredients. Blend gently with a large spoon or a mixer set to low speed until just incorporated.", "name": "Add approximately half of the dry mixture to the wet ingredients. Blend gently with a large spoon or a mixer set to low speed until just incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/#wprm-recipe-39610-step-0-4"}, {"@type": "HowToStep", "text": "Add the remaining dry ingredients and continue mixing only until no visible pockets of flour remain. Avoid excessive mixing to preserve the bread’s tender texture.", "name": "Add the remaining dry ingredients and continue mixing only until no visible pockets of flour remain. Avoid excessive mixing to preserve the bread’s tender texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/#wprm-recipe-39610-step-0-5"}, {"@type": "HowToStep", "text": "Distribute the batter evenly among the prepared loaf pans, filling each pan approximately three-quarters full. Keep the portions as equal as possible to encourage consistent baking.", "name": "Distribute the batter evenly among the prepared loaf pans, filling each pan approximately three-quarters full. Keep the portions as equal as possible to encourage consistent baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/#wprm-recipe-39610-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the pans to the preheated oven. Bake for 40–45 minutes, or until a toothpick inserted into the center of a loaf emerges clean. Begin checking mini loaves at the 30-minute mark to prevent overbaking.", "name": "Transfer the pans to the preheated oven. Bake for 40–45 minutes, or until a toothpick inserted into the center of a loaf emerges clean. Begin checking mini loaves at the 30-minute mark to prevent overbaking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/#wprm-recipe-39610-step-0-7"}, {"@type": "HowToStep", "text": "Remove the finished loaves from the oven and allow them to rest in their pans for approximately 10 minutes.", "name": "Remove the finished loaves from the oven and allow them to rest in their pans for approximately 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/#wprm-recipe-39610-step-0-8"}, {"@type": "HowToStep", "text": "Carefully release the loaves from the pans and transfer them to a wire cooling rack. Let them cool completely before slicing and serving.", "name": "Carefully release the loaves from the pans and transfer them to a wire cooling rack. Let them cool completely before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-banana-bread-mini-loaves/#wprm-recipe-39610-step-0-9"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Pumpkin Banana Bread Mini Loaves"}</script>
