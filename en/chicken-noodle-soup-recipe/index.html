d in the rotisserie chicken. Conduct a final taste test and make seasoning adjustments if necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-noodle-soup-recipe/#wprm-recipe-12049-step-0-3"}, {"@type": "HowToStep", "text": "Store any leftovers in an airtight container in the refrigerator for up to 4–5 days, contingent on the initial freshness of the chicken used.", "name": "Store any leftovers in an airtight container in the refrigerator for up to 4–5 days, contingent on the initial freshness of the chicken used.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-noodle-soup-recipe/#wprm-recipe-12049-step-0-4"}], "recipeCategory": ["Main Course", "Soup"], "recipeCuisine": ["American"], "keywords": "Chicken Noodle Soup Recipe"}</script>
