all drizzle of olive oil may be tossed with it to help prevent sticking.", "url": "https://erecip.github.io/en/pasta-e-fagioli-soup/#wprm-recipe-41642-step-0-8"}, {"@type": "HowToStep", "text": "Stir the cooked ditalini into the simmering soup. Add the drained and rinsed dark red kidney beans and Great Northern beans, mixing gently to distribute them throughout the pot.", "name": "Stir the cooked ditalini into the simmering soup. Add the drained and rinsed dark red kidney beans and Great Northern beans, mixing gently to distribute them throughout the pot.", "url": "https://erecip.github.io/en/pasta-e-fagioli-soup/#wprm-recipe-41642-step-0-9"}, {"@type": "HowToStep", "text": "If the consistency is thicker than desired, add a small quantity of extra chicken broth or water until the preferred texture is reached.", "name": "If the consistency is thicker than desired, add a small quantity of extra chicken broth or water until the preferred texture is reached.", "url": "https://erecip.github.io/en/pasta-e-fagioli-soup/#wprm-recipe-41642-step-0-10"}, {"@type": "HowToStep", "text": "Continue simmering for approximately 1 additional minute, or until the pasta and beans are fully heated.", "name": "Continue simmering for approximately 1 additional minute, or until the pasta and beans are fully heated.", "url": "https://erecip.github.io/en/pasta-e-fagioli-soup/#wprm-recipe-41642-step-0-11"}, {"@type": "HowToStep", "text": "Ladle the pasta e fagioli into individual bowls while warm. Finish each serving with finely shredded Parmesan or Romano cheese.", "name": "Ladle the pasta e fagioli into individual bowls while warm. Finish each serving with finely shredded Parmesan or Romano cheese.", "url": "https://erecip.github.io/en/pasta-e-fagioli-soup/#wprm-recipe-41642-step-0-12"}], "recipeCategory": ["Soup"], "recipeCuisine": ["Italian"], "keywords": "Pasta e Fagioli Soup"}</script>
