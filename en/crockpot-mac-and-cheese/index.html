    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Crockpot Mac and Cheese", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, creamy slow-cooker macaroni and cheese made with extra-sharp cheddar, American cheese, whole milk, evaporated milk, butter, and a lightly seasoned blend of mustard, garlic, black pepper, and cayenne.", "datePublished": "2023-03-22T07:07:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/crockpot-mac-and-cheese2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/crockpot-mac-and-cheese2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/crockpot-mac-and-cheese2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/crockpot-mac-and-cheese2.png"], "totalTime": "PT60M", "recipeIngredient": ["12 fluid ounces evaporated milk", "1/2 teaspoon dry mustard powder", "1 cup American cheese (freshly shredded from a block)", "1/4 cup butter (cut into small cubes)", "1 teaspoon salt", "2 1/2 cups whole milk", "A dash of cayenne pepper (adjusted to taste)", "1 pound dry elbow macaroni", "1/4 teaspoon garlic powder", "3 cups extra-sharp cheddar cheese (freshly grated from a block)", "1/2 teaspoon freshly ground black pepper"], "recipeInstructions": [{"@type": "HowToStep", "text": "Coat the inside of a 6-quart slow cooker with nonstick cooking spray. Place the uncooked elbow macaroni in a colander and rinse it thoroughly beneath cold running water. Drain well before proceeding. Rinsing away some of the surface starch helps reduce gumminess as the pasta cooks.", "name": "Coat the inside of a 6-quart slow cooker with nonstick cooking spray. Place the uncooked elbow macaroni in a colander and rinse it thoroughly beneath cold running water. Drain well before proceeding. Rinsing away some of the surface starch helps reduce gumminess as the pasta cooks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/#wprm-recipe-45405-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the rinsed and thoroughly drained macaroni to the prepared slow cooker. Pour in the whole milk and evaporated milk.", "name": "Transfer the rinsed and thoroughly drained macaroni to the prepared slow cooker. Pour in the whole milk and evaporated milk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/#wprm-recipe-45405-step-0-1"}, {"@type": "HowToStep", "text": "Add the freshly shredded extra-sharp cheddar and American cheese. Season the mixture with salt, black pepper, dry mustard, garlic powder, and a dash of cayenne pepper according to taste.", "name": "Add the freshly shredded extra-sharp cheddar and American cheese. Season the mixture with salt, black pepper, dry mustard, garlic powder, and a dash of cayenne pepper according to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/#wprm-recipe-45405-step-0-2"}, {"@type": "HowToStep", "text": "Stir everything thoroughly so the cheese, seasonings, and liquids are evenly distributed. Arrange the macaroni so that as much of the pasta as possible remains beneath the liquid for more consistent cooking.", "name": "Stir everything thoroughly so the cheese, seasonings, and liquids are evenly distributed. Arrange the macaroni so that as much of the pasta as possible remains beneath the liquid for more consistent cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/#wprm-recipe-45405-step-0-3"}, {"@type": "HowToStep", "text": "Distribute the cubed butter evenly across the surface of the macaroni mixture. Cover the slow cooker securely with its lid and cook on the low setting for 1 hour.", "name": "Distribute the cubed butter evenly across the surface of the macaroni mixture. Cover the slow cooker securely with its lid and cook on the low setting for 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/#wprm-recipe-45405-step-0-4"}, {"@type": "HowToStep", "text": "After the first hour, briefly uncover the slow cooker and stir the macaroni well, bringing the melted cheese and sauce together while redistributing the pasta. Replace the lid promptly to minimize heat loss.", "name": "After the first hour, briefly uncover the slow cooker and stir the macaroni well, bringing the melted cheese and sauce together while redistributing the pasta. Replace the lid promptly to minimize heat loss.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/#wprm-recipe-45405-step-0-5"}, {"@type": "HowToStep", "text": "Test the macaroni for tenderness. Some slow cookers may cook the pasta sufficiently within the first hour. If the noodles are still too firm, cover the cooker again and continue cooking on low.", "name": "Test the macaroni for tenderness. Some slow cookers may cook the pasta sufficiently within the first hour. If the noodles are still too firm, cover the cooker again and continue cooking on low.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/#wprm-recipe-45405-step-0-6"}, {"@type": "HowToStep", "text": "Check and stir the macaroni every 30 minutes until the pasta reaches the desired tenderness. Tasting a piece during each check can help prevent the noodles from becoming overcooked.", "name": "Check and stir the macaroni every 30 minutes until the pasta reaches the desired tenderness. Tasting a piece during each check can help prevent the noodles from becoming overcooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-mac-and-cheese/#wprm-recipe-45405-step-0-7"}, {"@type": "HowToStep", "text": "When the macaroni is tender and the cheese sauce has developed a thick, creamy consistency, remove the lid. Allow the finished mac and cheese to stand for a few minutes so the sauce can
