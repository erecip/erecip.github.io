    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Graveyard Dirt Cake Cups", "author": {"@type": "Person", "name": "BenDes"}, "description": "A festive individual Halloween dessert featuring layers of finely crushed chocolate sandwich cookies and creamy chocolate pudding, finished with moist “fresh dirt” crumbs, cookie gravestones, marshmallow ghosts, pumpkin candies, and seasonal sprinkles.", "datePublished": "2019-09-21T05:17:13+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/graveyard-dirt-cake-cups.png", "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/graveyard-dirt-cake-cups.png", "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/graveyard-dirt-cake-cups.png", "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/graveyard-dirt-cake-cups.png"], "recipeIngredient": ["4 cups cold whole milk", "16 ounces whipped topping (thawed)", "2  packages instant chocolate pudding mix (3.9 ounces each; Jell-O or a comparable brand)", "1 cup good-quality chocolate syrup (divided into two 1/2-cup portions)", "2  family-size packages Oreo cookies (19.1 ounces each)", "Ghost-shaped marshmallow treats (such as Peeps)", "Milano cookies", "Assorted Halloween sprinkles", "Mini pumpkin-shaped candies", "Black decorating icing for cookies (such as Betty Crocker)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the Oreo crumbs. Working in batches, place the two packages of Oreo cookies in a food processor and pulse until they are reduced to fine crumbs. Transfer all of the crumbs to a large bowl and reserve them for assembling the desserts.", "name": "Prepare the Oreo crumbs. Working in batches, place the two packages of Oreo cookies in a food processor and pulse until they are reduced to fine crumbs. Transfer all of the crumbs to a large bowl and reserve them for assembling the desserts.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-0"}, {"@type": "HowToStep", "text": "Prepare the chocolate pudding filling. Pour the 4 cups of cold whole milk into a large mixing bowl and add both packages of instant chocolate pudding mix. Whisk for approximately 2 minutes, or until the pudding begins to thicken.", "name": "Prepare the chocolate pudding filling. Pour the 4 cups of cold whole milk into a large mixing bowl and add both packages of instant chocolate pudding mix. Whisk for approximately 2 minutes, or until the pudding begins to thicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-1"}, {"@type": "HowToStep", "text": "Incorporate the whipped topping. Carefully fold the 16 ounces of thawed whipped topping into the thickened pudding until evenly blended and no visible streaks remain.", "name": "Incorporate the whipped topping. Carefully fold the 16 ounces of thawed whipped topping into the thickened pudding until evenly blended and no visible streaks remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-2"}, {"@type": "HowToStep", "text": "Add the first portion of chocolate syrup. Drizzle 1/2 cup of the chocolate syrup over the pudding mixture. Fold or swirl it gently only a few times, leaving visible ribbons of syrup throughout the filling rather than blending it completely. Refrigerate the mixture until assembly.", "name": "Add the first portion of chocolate syrup. Drizzle 1/2 cup of the chocolate syrup over the pudding mixture. Fold or swirl it gently only a few times, leaving visible ribbons of syrup throughout the filling rather than blending it completely. Refrigerate the mixture until assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-3"}, {"@type": "HowToStep", "text": "Begin assembling the cups. Arrange 18 serving cups, each with a capacity of approximately 9 ounces. Spoon 2 tablespoons of the Oreo crumbs into the bottom of every cup.", "name": "Begin assembling the cups. Arrange 18 serving cups, each with a capacity of approximately 9 ounces. Spoon 2 tablespoons of the Oreo crumbs into the bottom of every cup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-4"}, {"@type": "HowToStep", "text": "Add the pudding layer. Place slightly less than 1/4 cup of the prepared chocolate pudding mixture over the first crumb layer in each serving cup.", "name": "Add the pudding layer. Place slightly less than 1/4 cup of the prepared chocolate pudding mixture over the first crumb layer in each serving cup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-5"}, {"@type": "HowToStep", "text": "Repeat the layers. Add another 2 tablespoons of Oreo crumbs to each cup, followed by the remaining pudding mixture. Finish each portion with 1 tablespoon of fine Oreo crumbs on top.", "name": "Repeat the layers. Add another 2 tablespoons of Oreo crumbs to each cup, followed by the remaining pudding mixture. Finish each portion with 1 tablespoon of fine Oreo crumbs on top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-6"}, {"@type": "HowToStep", "text": "Prepare the moist “fresh dirt” crumbs. Transfer the remaining Oreo crumbs to a small bowl and stir in the reserved 1/2 cup of chocolate syrup. Mix until the crumbs become moist, irregular, and slightly clumped. Set them aside for the final decoration.", "name": "Prepare the moist “fresh dirt” crumbs. Transfer the remaining Oreo crumbs to a small bowl and stir in the reserved 1/2 cup of chocolate syrup. Mix until the crumbs become moist, irregular, and slightly clumped. Set them aside for the final decoration.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-7"}, {"@type": "HowToStep", "text": "Create the gravestones. Using the black decorating icing, write “RIP” or other Halloween-themed wording on the Milano cookies. Carefully insert the decorated cookies into the tops of the dessert cups so they stand upright like grave markers.", "name": "Create the gravestones. Using the black decorating icing, write “RIP” or other Halloween-themed wording on the Milano cookies. Carefully insert the decorated cookies into the tops of the dessert cups so they stand upright like grave markers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-8"}, {"@type": "HowToStep", "text": "Add the Halloween decorations. Position the ghost-shaped marshmallow treats and mini pumpkin candies on top of the cups, pressing them gently into the surface so they remain upright.", "name": "Add the Halloween decorations. Position the ghost-shaped marshmallow treats and mini pumpkin candies on top of the cups, pressing them gently into the surface so they remain upright.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-9"}, {"@type": "HowToStep", "text": "Finish the graveyard effect. Scatter assorted Halloween sprinkles over the desserts, then distribute some of the clumpy chocolate-cookie mixture around the decorations to resemble freshly disturbed soil.", "name": "Finish the graveyard effect. Scatter assorted Halloween sprinkles over the desserts, then distribute some of the clumpy chocolate-cookie mixture around the decorations to resemble freshly disturbed soil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-10"}, {"@type": "HowToStep", "text": "Chill and serve. Refrigerate the completed Graveyard Dirt Cake Cups until serving time, or serve them immediately after decorating.", "name": "Chill and serve. Refrigerate the completed Graveyard Dirt Cake Cups until serving time, or serve them immediately after decorating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/graveyard-dirt-cake-cups/#wprm-recipe-43875-step-0-11"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Graveyard Dirt Cake Cups"}</script>
