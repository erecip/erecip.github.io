    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Caramelized Pumpkin Pie", "author": {"@type": "Person", "name": "BenDes"}, "description": "Caramelized Pumpkin Pie combines a crisp cocoa pastry shell with roasted and gently smoked pumpkin, warming spices, bourbon, sour cream, and a maple-enriched custard. A decorative twisted crust frames the pie, while a final layer of torched granulated sugar creates a brittle, deeply caramelized brûlée surface.", "datePublished": "2022-06-19T00:01:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/caramelized-pumpkin-pie.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/caramelized-pumpkin-pie.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/caramelized-pumpkin-pie.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/caramelized-pumpkin-pie.png"], "cookTime": "PT50M", "totalTime": "PT80M", "recipeIngredient": ["½ cup cold unsalted butter (divided into 1-tablespoon-size pieces)", "¼ cup unsweetened cocoa powder", "1  large egg yolk", "1¼ cups plus 1 tablespoon all-purpose flour (sifted for a more delicate pastry)", "2 tablespoons ice-cold water", "¼ teaspoon fine salt", "1 tablespoon vinegar", "¼ cup granulated sugar", "¼ cup chilled coconut oil (kept solid)", "Olive oil (enough to lightly coat the pumpkin)", "Wood-smoking chips (preferably applewood or pecan)", "2 cups peeled pumpkin wedges (cut into approximately 1-inch pieces)", "3  large eggs", "¼ teaspoon ground nutmeg", "½ cup full-fat sour cream", "⅛ teaspoon cayenne pepper", "1 teaspoon ground cinnamon", "2 tablespoons bourbon", "¼ teaspoon ground allspice", "1 cup prepared pumpkin purée", "½ teaspoon ground ginger", "½ teaspoon salt", "¼ cup heavy cream", "Granulated sugar (as needed for the caramelized surface)", "½ cup pure maple syrup (preferably Grade A)", "1  large egg (beaten for brushing the pastry)", "All-purpose flour (as needed for dusting the work surface)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the sifted all-purpose flour, cocoa powder, granulated sugar, and salt in a food processor. Pulse briefly until the dry ingredients are evenly blended.", "name": "Place the sifted all-purpose flour, cocoa powder, granulated sugar, and salt in a food processor. Pulse briefly until the dry ingredients are evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-0"}, {"@type": "HowToStep", "text": "Add the chilled butter pieces and solid coconut oil. Pulse only until the mixture develops a coarse, crumbly texture while retaining a few small, pea-sized pieces of fat.", "name": "Add the chilled butter pieces and solid coconut oil. Pulse only until the mixture develops a coarse, crumbly texture while retaining a few small, pea-sized pieces of fat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-1"}, {"@type": "HowToStep", "text": "Add the egg yolk and pulse again just until incorporated.", "name": "Add the egg yolk and pulse again just until incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-2"}, {"@type": "HowToStep", "text": "Combine the vinegar with the ice water. With the processor pulsing, gradually drizzle the liquid into the mixture. Stop as soon as the dough begins to come together. It should remain relatively dry but hold its shape when pressed between your fingers.", "name": "Combine the vinegar with the ice water. With the processor pulsing, gradually drizzle the liquid into the mixture. Stop as soon as the dough begins to come together. It should remain relatively dry but hold its shape when pressed between your fingers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the pastry mixture to a lightly floured work surface. Press it down gently, then divide it into four sections.", "name": "Transfer the pastry mixture to a lightly floured work surface. Press it down gently, then divide it into four sections.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-4"}, {"@type": "HowToStep", "text": "Stack the four portions, placing any loose or crumbly pieces between the layers, and press the stack together.", "name": "Stack the four portions, placing any loose or crumbly pieces between the layers, and press the stack together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-5"}, {"@type": "HowToStep", "text": "Repeat the stacking and pressing process twice more so the pastry becomes cohesive and evenly layered.", "name": "Repeat the stacking and pressing process twice more so the pastry becomes cohesive and evenly layered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-6"}, {"@type": "HowToStep", "text": "Form the dough into a disk approximately 1 inch thick. Wrap it securely in plastic wrap and refrigerate for at least 1 hour.", "name": "Form the dough into a disk approximately 1 inch thick. Wrap it securely in plastic wrap and refrigerate for at least 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-7"}, {"@type": "HowToStep", "text": "Heat the oven to 425°F (220°C). Coat the peeled pumpkin pieces lightly with olive oil and arrange them across a rimmed baking sheet.", "name": "Heat the oven to 425°F (220°C). Coat the peeled pumpkin pieces lightly with olive oil and arrange them across a rimmed baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-8"}, {"@type": "HowToStep", "text": "Roast for approximately 20 minutes, stopping when the pumpkin has become only slightly tender.", "name": "Roast for approximately 20 minutes, stopping when the pumpkin has become only slightly tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-9"}, {"@type": "HowToStep", "text": "Reduce the oven temperature to 250°F (120°C). Move the roasted pumpkin to a smoker, or place it in a foil-sealed roasting arrangement with the wood chips.", "name": "Reduce the oven temperature to 250°F (120°C). Move the roasted pumpkin to a smoker, or place it in a foil-sealed roasting arrangement with the wood chips.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-10"}, {"@type": "HowToStep", "text": "Smoke the pumpkin for 30–45 minutes. Check the wood after approximately 20 minutes to make certain it does not ignite, adding soaked chips or liquid when necessary.", "name": "Smoke the pumpkin for 30–45 minutes. Check the wood after approximately 20 minutes to make certain it does not ignite, adding soaked chips or liquid when necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-11"}, {"@type": "HowToStep", "text": "Cool the smoked pumpkin completely. Remove any remaining flesh from the skins, then blend the flesh with a hand blender until completely smooth. Measure 1 cup of the resulting purée for the filling.", "name": "Cool the smoked pumpkin completely. Remove any remaining flesh from the skins, then blend the flesh with a hand blender until completely smooth. Measure 1 cup of the resulting purée for the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-12"}, {"@type": "HowToStep", "text": "Increase or adjust the oven temperature to 350°F (175°C). Remove one-quarter of the chilled chocolate dough and reserve it for the decorative edge.", "name": "Increase or adjust the oven temperature to 350°F (175°C). Remove one-quarter of the chilled chocolate dough and reserve it for the decorative edge.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-13"}, {"@type": "HowToStep", "text": "On a floured work surface, roll the remaining dough into a round approximately 12 inches in diameter. Carefully transfer it to a 9-inch pie dish, easing the pastry into the base and sides without stretching it. Trim away the excess dough and combine those trimmings with the reserved portion.", "name": "On a floured work surface, roll the remaining dough into a round approximately 12 inches in diameter. Carefully transfer it to a 9-inch pie dish, easing the pastry into the base and sides without stretching it. Trim away the excess dough and combine those trimmings with the reserved portion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-14"}, {"@type": "HowToStep", "text": "Divide the reserved pastry into four equal pieces. Roll each piece into a rope approximately 12 inches long. Twist the ropes together in pairs and arrange the two twists around the rim of the pie to create a decorative border. Press gently to secure them.", "name": "Divide the reserved pastry into four equal pieces. Roll each piece into a rope approximately 12 inches long. Twist the ropes together in pairs and arrange the two twists around the rim of the pie to create a decorative border. Press gently to secure them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-15"}, {"@type": "HowToStep", "text": "Refrigerate the assembled crust for 1 hour, or place it in the freezer for 15 minutes.", "name": "Refrigerate the assembled crust for 1 hour, or place it in the freezer for 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-16"}, {"@type": "HowToStep", "text": "Cover the chilled pastry with parchment paper and fill it with pie weights. Bake for about 20 minutes, until the exposed edges appear dry.", "name": "Cover the chilled pastry with parchment paper and fill it with pie weights. Bake for about 20 minutes, until the exposed edges appear dry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-17"}, {"@type": "HowToStep", "text": "Remove the parchment and pie weights, then continue baking for another 7 minutes, or until the base of the pastry also looks dry.", "name": "Remove the parchment and pie weights, then continue baking for another 7 minutes, or until the base of the pastry also looks dry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-18"}, {"@type": "HowToStep", "text": "Brush the bottom and sides of the crust with the beaten egg. Sprinkle granulated sugar over the decorative border, then bake for an additional 3 minutes to set the egg coating.", "name": "Brush the bottom and sides of the crust with the beaten egg. Sprinkle granulated sugar over the decorative border, then bake for an additional 3 minutes to set the egg coating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-19"}, {"@type": "HowToStep", "text": "Briefly chill the baked crust again before filling if a firmer, crisper shell is desired.", "name": "Briefly chill the baked crust again before filling if a firmer, crisper shell is desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-20"}, {"@type": "HowToStep", "text": "In a large mixing bowl, whisk together 1 cup of the smoked pumpkin purée, sour cream, bourbon, cinnamon, ginger, nutmeg, allspice, salt, cayenne pepper, and the 3 large eggs. Continue whisking until the mixture is uniformly smooth.", "name": "In a large mixing bowl, whisk together 1 cup of the smoked pumpkin purée, sour cream, bourbon, cinnamon, ginger, nutmeg, allspice, salt, cayenne pepper, and the 3 large eggs. Continue whisking until the mixture is uniformly smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-21"}, {"@type": "HowToStep", "text": "Pour the maple syrup into a small saucepan and bring it to a boil. Lower the heat and simmer for approximately 3 minutes, until it thickens slightly and small wisps or puffs of steam become visible.", "name": "Pour the maple syrup into a small saucepan and bring it to a boil. Lower the heat and simmer for approximately 3 minutes, until it thickens slightly and small wisps or puffs of steam become visible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-22"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Add the heavy cream in three separate portions, stirring thoroughly after each addition until smooth.", "name": "Remove the saucepan from the heat. Add the heavy cream in three separate portions, stirring thoroughly after each addition until smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-23"}, {"@type": "HowToStep", "text": "Slowly pour the hot maple-cream mixture into the pumpkin mixture while whisking continuously. Continue until the custard is smooth and silky.", "name": "Slowly pour the hot maple-cream mixture into the pumpkin mixture while whisking continuously. Continue until the custard is smooth and silky.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-24"}, {"@type": "HowToStep", "text": "Set the blind-baked chocolate crust on a rimmed baking sheet. Pour the prepared pumpkin-maple filling evenly into the pastry shell.", "name": "Set the blind-baked chocolate crust on a rimmed baking sheet. Pour the prepared pumpkin-maple filling evenly into the pastry shell.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-25"}, {"@type": "HowToStep", "text": "Bake at 350°F (175°C) for approximately 50 minutes, rotating the pie halfway through the baking period. The outer portion of the filling should be set, while the center should retain a slight jiggle.", "name": "Bake at 350°F (175°C) for approximately 50 minutes, rotating the pie halfway through the baking period. The outer portion of the filling should be set, while the center should retain a slight jiggle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-26"}, {"@type": "HowToStep", "text": "Transfer the finished pie to a wire cooling rack and allow it to cool completely. Full cooling is important for the custard to develop its properly set, creamy consistency.", "name": "Transfer the finished pie to a wire cooling rack and allow it to cool completely. Full cooling is important for the custard to develop its properly set, creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-27"}, {"@type": "HowToStep", "text": "Immediately before serving, cover the cooled filling with an even, generous coating of granulated sugar.", "name": "Immediately before serving, cover the cooled filling with an even, generous coating of granulated sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-28"}, {"@type": "HowToStep", "text": "Pass a kitchen torch steadily over the sugar, keeping the flame moving across the entire surface until the crystals melt and transform into a dark golden-brown, glass-like caramel crust.", "name": "Pass a kitchen torch steadily over the sugar, keeping the flame moving across the entire surface until the crystals melt and transform into a dark golden-brown, glass-like caramel crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-29"}, {"@type": "HowToStep", "text": "Allow the brûléed topping to stand for several minutes so the caramel can cool and harden before the pie is sliced.", "name": "Allow the brûléed topping to stand for several minutes so the caramel can cool and harden before the pie is sliced.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-pumpkin-pie/#wprm-recipe-46087-step-0-30"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Caramelized Pumpkin Pie"}</script>
