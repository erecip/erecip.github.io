sed in volume, not doubled. Press gently with a finger—if the indentation springs back slightly, it’s ready to bake; if it returns quickly, bake immediately to avoid over-proofing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-challah-recipe/#wprm-recipe-11433-step-0-2"}, {"@type": "HowToStep", "text": "Toward the end of the final rise, preheat the oven to 350°F. Brush the challah with egg wash and apply any preferred toppings.", "name": "Toward the end of the final rise, preheat the oven to 350°F. Brush the challah with egg wash and apply any preferred toppings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-challah-recipe/#wprm-recipe-11433-step-0-3"}, {"@type": "HowToStep", "text": "Bake for 30 to 35 minutes until deeply golden on both top and sides.", "name": "Bake for 30 to 35 minutes until deeply golden on both top and sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-challah-recipe/#wprm-recipe-11433-step-0-4"}], "recipeCategory": ["Bread"], "recipeCuisine": ["Jewish"], "keywords": "Sourdough Challah Recipe"}</script>
