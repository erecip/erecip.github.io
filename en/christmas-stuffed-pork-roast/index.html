, "text": "When the cut reaches the opposite side, turn the loin and continue slicing back in the other direction until the pork can be opened and laid flat.", "name": "When the cut reaches the opposite side, turn the loin and continue slicing back in the other direction until the pork can be opened and laid flat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-10"}, {"@type": "HowToStep", "text": "Pound the butterflied loin with a meat mallet to tenderize it and create a more even thickness.", "name": "Pound the butterflied loin with a meat mallet to tenderize it and create a more even thickness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-11"}, {"@type": "HowToStep", "text": "Turn the pork so the fat side faces upward and season lightly with salt. Flip it back over before adding the filling.", "name": "Turn the pork so the fat side faces upward and season lightly with salt. Flip it back over before adding the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-12"}, {"@type": "HowToStep", "text": "Distribute the prepared filling evenly over the pork, leaving an uncovered border of approximately 1 1/2 to 2 inches along the upper edge.", "name": "Distribute the prepared filling evenly over the pork, leaving an uncovered border of approximately 1 1/2 to 2 inches along the upper edge.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-13"}, {"@type": "HowToStep", "text": "Press the filling gently against the meat to help keep it in place.", "name": "Press the filling gently against the meat to help keep it in place.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-14"}, {"@type": "HowToStep", "text": "Beginning at the short end, carefully roll the loin into a compact roast, finishing with the fat layer positioned on top.", "name": "Beginning at the short end, carefully roll the loin into a compact roast, finishing with the fat layer positioned on top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-15"}, {"@type": "HowToStep", "text": "Secure the rolled pork loin with kitchen twine. Begin at one end and form loops around the roast, tightening them sufficiently to hold the filling without compressing the pork excessively.", "name": "Secure the rolled pork loin with kitchen twine. Begin at one end and form loops around the roast, tightening them sufficiently to hold the filling without compressing the pork excessively.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-16"}, {"@type": "HowToStep", "text": "Heat a large pan over medium-high heat and add a drizzle of avocado oil.", "name": "Heat a large pan over medium-high heat and add a drizzle of avocado oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-17"}, {"@type": "HowToStep", "text": "Set the pork in the hot pan with the fat side facing downward. Sear until the exterior develops a deep golden-brown color.", "name": "Set the pork in the hot pan with the fat side facing downward. Sear until the exterior develops a deep golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-18"}, {"@type": "HowToStep", "text": "Rotate the loin and continue searing until each side has been evenly browned.", "name": "Rotate the loin and continue searing until each side has been evenly browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-19"}, {"@type": "HowToStep", "text": "Add the whole garlic cloves, fresh thyme and rosemary sprigs, and 1 cup of chicken stock.", "name": "Add the whole garlic cloves, fresh thyme and rosemary sprigs, and 1 cup of chicken stock.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-20"}, {"@type": "HowToStep", "text": "Bring the stock to a gentle simmer, then cover the pan with a lid or tightly fitted foil.", "name": "Bring the stock to a gentle simmer, then cover the pan with a lid or tightly fitted foil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-21"}, {"@type": "HowToStep", "text": "Transfer the covered pork loin to an oven heated to 425°F (218°C).", "name": "Transfer the covered pork loin to an oven heated to 425°F (218°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-22"}, {"@type": "HowToStep", "text": "Roast for approximately 1 hour 15 minutes, or until the center reaches an internal temperature of 160°F (71°C).", "name": "Roast for approximately 1 hour 15 minutes, or until the center reaches an internal temperature of 160°F (71°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-23"}, {"@type": "HowToStep", "text": "Begin checking the internal temperature after approximately 55 minutes. Remove the lid or foil halfway through roasting to encourage additional browning.", "name": "Begin checking the internal temperature after approximately 55 minutes. Remove the lid or foil halfway through roasting to encourage additional browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pork-roast/#wprm-recipe-43379-step-0-24"}, {"@type": "HowToStep", "text": "After cooking, remove the roast from the oven and spoon the hot pan broth over the pork for several minutes.", "name": "After cooking, remove the roast
