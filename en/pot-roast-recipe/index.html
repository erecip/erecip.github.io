    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pot Roast Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A quintessential comfort food classic, this Dutch oven pot roast yields incredibly tender beef and hearty vegetables, slow-cooked in a rich, savory broth. With baby carrots and potatoes in one pot, this dish is both satisfying and effortless to serve.", "datePublished": "2024-08-31T12:41:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/Pot-Roast-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/Pot-Roast-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/Pot-Roast-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/Pot-Roast-Recipe.png"], "recipeYield": ["6"], "prepTime": "PT30M", "cookTime": "PT210M", "totalTime": "PT240M", "recipeIngredient": ["1 ½ pounds baby yellow potatoes", "2  bay leaves (dried)", "2 tablespoons tomato paste", "1 pound baby carrots", "2  large yellow onions (peeled and sliced)", "2 teaspoons Worcestershire sauce", "1 ½ teaspoons Kosher salt (plus more as needed)", "Olive oil", "6 cloves garlic (minced)", "3 pounds boneless beef chuck roast", "4  sprigs fresh thyme", "2 to 3 cups beef broth (with extra if necessary)", "2  sprigs fresh rosemary", "1 teaspoon ground black pepper", "1 cup red wine (or substitute with beef broth)", "Chopped Italian parsley (for garnish (optional))"], "recipeInstructions": [{"@type": "HowToStep", "text": "Set oven to preheat at 300°F.", "name": "Set oven to preheat at 300°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/#wprm-recipe-13744-step-0-0"}, {"@type": "HowToStep", "text": "Season the chuck roast liberally with Kosher salt and black pepper on all surfaces.", "name": "Season the chuck roast liberally with Kosher salt and black pepper on all surfaces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/#wprm-recipe-13744-step-0-1"}, {"@type": "HowToStep", "text": "In a 7 to 8 quart Dutch oven over medium-high heat, warm 2 tablespoons of olive oil. Sear the meat undisturbed on each side for 5 to 6 minutes until a golden crust forms. Remove the roast and set aside, keeping the flavorful bits in the pot.", "name": "In a 7 to 8 quart Dutch oven over medium-high heat, warm 2 tablespoons of olive oil. Sear the meat undisturbed on each side for 5 to 6 minutes until a golden crust forms. Remove the roast and set aside, keeping the flavorful bits in the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/#wprm-recipe-13744-step-0-2"}, {"@type": "HowToStep", "text": "Lower the heat to medium. Add sliced onions and sauté for about 3 minutes until they begin to brown, stirring and scraping the pot to release browned bits. If necessary, add a splash of broth to aid deglazing. Stir in the minced garlic and cook for another minute.", "name": "Lower the heat to medium. Add sliced onions and sauté for about 3 minutes until they begin to brown, stirring and scraping the pot to release browned bits. If necessary, add a splash of broth to aid deglazing. Stir in the minced garlic and cook for another minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/#wprm-recipe-13744-step-0-3"}, {"@type": "HowToStep", "text": "Pour in the red wine (or beef broth) and deglaze the pot thoroughly. Add 2 cups of beef broth, tomato paste, Worcestershire sauce, thyme, rosemary, and bay leaves. Mix well and bring the mixture to a low boil.", "name": "Pour in the red wine (or beef broth) and deglaze the pot thoroughly. Add 2 cups of beef broth, tomato paste, Worcestershire sauce, thyme, rosemary, and bay leaves. Mix well and bring the mixture to a low boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/#wprm-recipe-13744-step-0-4"}, {"@type": "HowToStep", "text": "Return the roast to the pot, along with any accumulated juices. Ensure the liquid rises to halfway up the meat; supplement with more broth if needed. Cover tightly with the lid and place in the oven. Bake for 1 hour and 30 minutes.", "name": "Return the roast to the pot, along with any accumulated juices. Ensure the liquid rises to halfway up the meat; supplement with more broth if needed. Cover tightly with the lid and place in the oven. Bake for 1 hour and 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/#wprm-recipe-13744-step-0-5"}, {"@type": "HowToStep", "text": "Remove from the oven, then nestle in the baby carrots and potatoes. Adjust seasoning with salt and pepper if desired. Re-cover and continue baking for an additional 2 hours, or until the meat is fork-tender and vegetables are cooked through. Extend by 15–30 minutes for extra tenderness if preferred.", "name": "Remove from the oven, then nestle in the baby carrots and potatoes. Adjust seasoning with salt and pepper if desired. Re-cover and continue baking for an additional 2 hours, or until the meat is fork-tender and vegetables are cooked through. Extend by 15–30 minutes for extra tenderness if preferred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/#wprm-recipe-13744-step-0-6"}, {"@type": "HowToStep", "text": "Garnish with chopped parsley if using, and serve directly from the Dutch oven or transfer to a serving platter.", "name": "Garnish with chopped parsley if using, and serve directly from the Dutch oven or transfer to a serving platter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pot-roast-recipe/#wprm-recipe-13744-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Pot Roast Recipe"}</script>
