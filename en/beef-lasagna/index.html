    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Beef Lasagna", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty layered lasagna prepared with a slow-simmered beef and Italian sausage tomato sauce, a parsley-speckled ricotta filling, oven-ready pasta sheets, mozzarella, and Parmesan. The lasagna is baked first under foil for tenderness, then uncovered to create a lightly golden, bubbling cheese topping.", "datePublished": "2022-05-11T22:45:16+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/beef-lasagna2.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/beef-lasagna2.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/beef-lasagna2.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/beef-lasagna2.png"], "cookTime": "PT50M", "totalTime": "PT65M", "recipeIngredient": ["3/4 lb extra-lean ground beef", "4  fresh basil leaves (finely chopped)", "8 oz tomato sauce", "3  fresh garlic cloves (minced)", "1 tbsp Italian seasoning", "1  small onion (finely diced, approximately 1/2 cup)", "1/2 tsp fennel seeds", "1  can crushed tomatoes (preferably San Marzano)", "1/4 cup finely chopped fresh parsley", "1 lb mild or spicy Italian sausage (casings removed)", "1 tbsp granulated sugar", "1/2 tsp freshly ground black pepper (with additional as desired)", "1  can tomato paste", "1/2 cup water (used only as necessary to loosen the sauce)", "1/2 tsp salt (plus more according to taste)", "1  large egg (brought to room temperature)", "2 tbsp fresh parsley (finely minced)", "16 oz ricotta cheese", "12  oven-ready lasagna noodles", "1 cup freshly grated Parmesan cheese", "1 lb mozzarella cheese (freshly shredded)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Finely dice the onion and mince the garlic. Chop the basil and the 1/4 cup parsley reserved for the meat sauce, keeping this parsley separate from the amount needed for the ricotta filling. Remove the sausage casings and divide the sausage meat into small pieces.", "name": "Finely dice the onion and mince the garlic. Chop the basil and the 1/4 cup parsley reserved for the meat sauce, keeping this parsley separate from the amount needed for the ricotta filling. Remove the sausage casings and divide the sausage meat into small pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-0"}, {"@type": "HowToStep", "text": "Place a large heavy-bottomed pot or Dutch oven over medium-high heat. Add the Italian sausage and ground beef, then cook for 8–10 minutes, breaking the meat into smaller pieces with a wooden spoon as it browns. Continue cooking until no pink remains and the sausage has released its fat.", "name": "Place a large heavy-bottomed pot or Dutch oven over medium-high heat. Add the Italian sausage and ground beef, then cook for 8–10 minutes, breaking the meat into smaller pieces with a wooden spoon as it browns. Continue cooking until no pink remains and the sausage has released its fat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-1"}, {"@type": "HowToStep", "text": "Add the prepared onion and garlic to the browned meat. Stir continuously for approximately 2 minutes, until the garlic becomes aromatic and the onion begins to soften.", "name": "Add the prepared onion and garlic to the browned meat. Stir continuously for approximately 2 minutes, until the garlic becomes aromatic and the onion begins to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-2"}, {"@type": "HowToStep", "text": "Stir the crushed tomatoes, tomato paste, and tomato sauce into the browned meat mixture. Work the tomato paste thoroughly into the sauce so no concentrated lumps remain.", "name": "Stir the crushed tomatoes, tomato paste, and tomato sauce into the browned meat mixture. Work the tomato paste thoroughly into the sauce so no concentrated lumps remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-3"}, {"@type": "HowToStep", "text": "Add the sugar, fennel seeds, Italian seasoning, 1/2 teaspoon salt, and 1/2 teaspoon black pepper. Mix thoroughly, reduce the heat to low, and cover the pot.", "name": "Add the sugar, fennel seeds, Italian seasoning, 1/2 teaspoon salt, and 1/2 teaspoon black pepper. Mix thoroughly, reduce the heat to low, and cover the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-4"}, {"@type": "HowToStep", "text": "Allow the sauce to simmer gently for 1 1/2 hours. Stir from time to time to prevent the mixture from catching on the bottom and to promote even cooking.", "name": "Allow the sauce to simmer gently for 1 1/2 hours. Stir from time to time to prevent the mixture from catching on the bottom and to promote even cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-5"}, {"@type": "HowToStep", "text": "If the sauce becomes excessively thick, incorporate the water gradually until the mixture is thick yet still easy to pour. Taste toward the end of the simmering period and adjust the salt or pepper as needed.", "name": "If the sauce becomes excessively thick, incorporate the water gradually until the mixture is thick yet still easy to pour. Taste toward the end of the simmering period and adjust the salt or pepper as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-6"}, {"@type": "HowToStep", "text": "Approximately 30 minutes after the sauce begins simmering, place the ricotta, room-temperature egg, and 2 tablespoons finely chopped parsley in a medium bowl.", "name": "Approximately 30 minutes after the sauce begins simmering, place the ricotta, room-temperature egg, and 2 tablespoons finely chopped parsley in a medium bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-7"}, {"@type": "HowToStep", "text": "Gently combine the ingredients with a fork just until evenly mixed. Avoid excessive stirring so the ricotta retains a light texture. Season the mixture lightly with a pinch of salt and pepper, then leave it at room temperature until assembly.", "name": "Gently combine the ingredients with a fork just until evenly mixed. Avoid excessive stirring so the ricotta retains a light texture. Season the mixture lightly with a pinch of salt and pepper, then leave it at room temperature until assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-8"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C). Keep the freshly shredded mozzarella and freshly grated Parmesan ready for layering.", "name": "Preheat the oven to 375°F (190°C). Keep the freshly shredded mozzarella and freshly grated Parmesan ready for layering.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-9"}, {"@type": "HowToStep", "text": "Once the meat sauce has completed its simmer and the oven is fully heated, spread 1 1/2 cups of meat sauce evenly across the base of a 9 × 13-inch baking dish.", "name": "Once the meat sauce has completed its simmer and the oven is fully heated, spread 1 1/2 cups of meat sauce evenly across the base of a 9 × 13-inch baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-10"}, {"@type": "HowToStep", "text": "Arrange 4 oven-ready lasagna noodles over the sauce. Spread one-half of the ricotta filling evenly across the noodles, then scatter one-third of the mozzarella over the ricotta.", "name": "Arrange 4 oven-ready lasagna noodles over the sauce. Spread one-half of the ricotta filling evenly across the noodles, then scatter one-third of the mozzarella over the ricotta.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-11"}, {"@type": "HowToStep", "text": "Spoon another 1 1/2 cups of meat sauce over the mozzarella and finish this layer with 1/4 cup Parmesan cheese.", "name": "Spoon another 1 1/2 cups of meat sauce over the mozzarella and finish this layer with 1/4 cup Parmesan cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-12"}, {"@type": "HowToStep", "text": "Repeat the layering process with another 4 noodles, the remaining ricotta filling, another one-third of the mozzarella, 1 1/2 cups meat sauce, and 1/4 cup Parmesan.", "name": "Repeat the layering process with another 4 noodles, the remaining ricotta filling, another one-third of the mozzarella, 1 1/2 cups meat sauce, and 1/4 cup Parmesan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-13"}, {"@type": "HowToStep", "text": "Complete the lasagna with the final 4 noodles. Cover them with the remaining meat sauce, approximately 1 1/2 cups, followed by the remaining mozzarella and the final 1/4 cup Parmesan cheese.", "name": "Complete the lasagna with the final 4 noodles. Cover them with the remaining meat sauce, approximately 1 1/2 cups, followed by the remaining mozzarella and the final 1/4 cup Parmesan cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-14"}, {"@type": "HowToStep", "text": "Cover the baking dish securely with aluminum foil, sealing the edges well so the trapped steam can soften and cook the oven-ready noodles.", "name": "Cover the baking dish securely with aluminum foil, sealing the edges well so the trapped steam can soften and cook the oven-ready noodles.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-15"}, {"@type": "HowToStep", "text": "Bake the covered lasagna for 25 minutes.", "name": "Bake the covered lasagna for 25 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-16"}, {"@type": "HowToStep", "text": "Carefully remove the foil, taking care around the escaping steam. Return the dish to the oven and continue baking uncovered for another 25 minutes.", "name": "Carefully remove the foil, taking care around the escaping steam. Return the dish to the oven and continue baking uncovered for another 25 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-17"}, {"@type": "HowToStep", "text": "The lasagna is ready when the cheese is bubbling around the edges and the surface has developed a lightly browned, golden finish.", "name": "The lasagna is ready when the cheese is bubbling around the edges and the surface has developed a lightly browned, golden finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-18"}, {"@type": "HowToStep", "text": "Remove the finished lasagna from the oven and allow it to stand undisturbed for 15 minutes before slicing. This resting period gives the layers time to firm sufficiently for cleaner portions.", "name": "Remove the finished lasagna from the oven and allow it to stand undisturbed for 15 minutes before slicing. This resting period gives the layers time to firm sufficiently for cleaner portions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-19"}, {"@type": "HowToStep", "text": "Cut the lasagna with a sharp knife and serve while warm.", "name": "Cut the lasagna with a sharp knife and serve while warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lasagna/#wprm-recipe-45199-step-0-20"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian-Inspired"], "keywords": "Beef Lasagna"}</script>
