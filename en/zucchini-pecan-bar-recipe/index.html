en/zucchini-pecan-bar-recipe/#wprm-recipe-34810-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, add the eggs, melted unsalted butter, granulated sugar, brown sugar, salt, cinnamon, nutmeg, and vanilla extract. Whisk thoroughly until the mixture is evenly combined.", "name": "In a large mixing bowl, add the eggs, melted unsalted butter, granulated sugar, brown sugar, salt, cinnamon, nutmeg, and vanilla extract. Whisk thoroughly until the mixture is evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-pecan-bar-recipe/#wprm-recipe-34810-step-0-1"}, {"@type": "HowToStep", "text": "Add the baking soda and whisk it into the wet mixture. Fold in the all-purpose flour until the batter is fully blended and no visible dry streaks remain.", "name": "Add the baking soda and whisk it into the wet mixture. Fold in the all-purpose flour until the batter is fully blended and no visible dry streaks remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-pecan-bar-recipe/#wprm-recipe-34810-step-0-2"}, {"@type": "HowToStep", "text": "Gently incorporate the shredded zucchini and chopped pecans, folding just until they are distributed throughout the batter.", "name": "Gently incorporate the shredded zucchini and chopped pecans, folding just until they are distributed throughout the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-pecan-bar-recipe/#wprm-recipe-34810-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared baking pan and spread it into an even layer. Bake for approximately 35 to 45 minutes, or until the bars have risen and are baked through.", "name": "Transfer the batter to the prepared baking pan and spread it into an even layer. Bake for approximately 35 to 45 minutes, or until the bars have risen and are baked through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-pecan-bar-recipe/#wprm-recipe-34810-step-0-4"}, {"@type": "HowToStep", "text": "Let the baked bars cool slightly while preparing the frosting. The frosting is easier to spread when poured over the bars while they are still somewhat warm.", "name": "Let the baked bars cool slightly while preparing the frosting. The frosting is easier to spread when poured over the bars while they are still somewhat warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-pecan-bar-recipe/#wprm-recipe-34810-step-0-5"}, {"@type": "HowToStep", "text": "For the frosting, place the butter, brown sugar, milk or cream, and salt in a small saucepan. Warm the mixture over medium heat and bring it to a boil. As soon as it begins boiling, remove the pan from the heat.", "name": "For the frosting, place the butter, brown sugar, milk or cream, and salt in a small saucepan. Warm the mixture over medium heat and bring it to a boil. As soon as it begins boiling, remove the pan from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-pecan-bar-recipe/#wprm-recipe-34810-step-0-6"}, {"@type": "HowToStep", "text": "Whisk in the powdered sugar until the frosting becomes smooth. Pour it over the warm bars and spread it promptly, as the frosting starts to firm up very quickly.", "name": "Whisk in the powdered sugar until the frosting becomes smooth. Pour it over the warm bars and spread it promptly, as the frosting starts to firm up very quickly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-pecan-bar-recipe/#wprm-recipe-34810-step-0-7"}, {"@type": "HowToStep", "text": "Allow the frosted bars to cool before cutting them into squares.", "name": "Allow the frosted bars to cool before cutting them into squares.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-pecan-bar-recipe/#wprm-recipe-34810-step-0-8"}]}</script>
