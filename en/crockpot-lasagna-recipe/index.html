    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Crockpot Lasagna Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty, oven-free lasagna crafted entirely within your slow cooker. Layers of savory meat sauce, tender pasta, and rich cheeses meld together into a comforting classic that's both effortless and deeply satisfying.", "datePublished": "2024-07-11T19:34:07+00:00", "image": ["https://erecip.github.io/wp-content/uploads/Crockpot-Lasagna-Recipe1.png", "https://erecip.github.io/wp-content/uploads/Crockpot-Lasagna-Recipe1-500x500.png", "https://erecip.github.io/wp-content/uploads/Crockpot-Lasagna-Recipe1-500x375.png", "https://erecip.github.io/wp-content/uploads/Crockpot-Lasagna-Recipe1-480x270.png"], "recipeYield": ["6"], "prepTime": "PT10M", "cookTime": "PT255M", "totalTime": "PT265M", "recipeIngredient": ["2 tablespoons chopped fresh parsley (optional)", "1 pound ground beef", "1  large egg", "1  small finely diced onion", "2 tablespoons grated parmesan cheese", "26 ounces spaghetti sauce (use a 32-ounce jar if needed)", "½ cup shredded mozzarella cheese (for topping)", "1 tablespoon minced garlic", "1⅓ cup grated parmesan cheese (⅓ cup for topping)", "1 cup water", "1½ cups shredded mozzarella cheese", "8  –10 uncooked lasagna noodles", "15 ounces small curd cottage cheese"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a large skillet, brown the ground beef together with the finely diced onion until meat is no longer pink. If using a crock pot with a sauté function, this can be done directly in the insert. Once browned, stir in the minced garlic and continue to cook for 1 to 2 minutes until fragrant. Drain any excess fat and return the meat mixture to the skillet.", "name": "In a large skillet, brown the ground beef together with the finely diced onion until meat is no longer pink. If using a crock pot with a sauté function, this can be done directly in the insert. Once browned, stir in the minced garlic and continue to cook for 1 to 2 minutes until fragrant. Drain any excess fat and return the meat mixture to the skillet.", "url": "https://erecip.github.io/en/crockpot-lasagna-recipe/#wprm-recipe-11648-step-0-0"}, {"@type": "HowToStep", "text": "Add the spaghetti sauce and water to the beef mixture, stirring to combine thoroughly.", "name": "Add the spaghetti sauce and water to the beef mixture, stirring to combine thoroughly.", "url": "https://erecip.github.io/en/crockpot-lasagna-recipe/#wprm-recipe-11648-step-0-1"}, {"@type": "HowToStep", "text": "In a separate mixing bowl, blend the cottage cheese, shredded mozzarella, grated parmesan, egg, and fresh parsley until evenly mixed.", "name": "In a separate mixing bowl, blend the cottage cheese, shredded mozzarella, grated parmesan, egg, and fresh parsley until evenly mixed.", "url": "https://erecip.github.io/en/crockpot-lasagna-recipe/#wprm-recipe-11648-step-0-2"}, {"@type": "HowToStep", "text": "Generously coat a 5-quart (or larger) oval slow cooker with non-stick spray. Spread about one cup of the meat sauce mixture across the base.", "name": "Generously coat a 5-quart (or larger) oval slow cooker with non-stick spray. Spread about one cup of the meat sauce mixture across the base.", "url": "https://erecip.github.io/en/crockpot-lasagna-recipe/#wprm-recipe-11648-step-0-3"}, {"@type": "HowToStep", "text": "Layer with broken pieces of uncooked lasagna noodles to fit the shape of the cooker. Add a portion of the cheese mixture on top of the noodles, then repeat the process: meat sauce, noodles, cheese mixture. Reserve enough meat sauce for a final top layer. Typically, three layers can be achieved in a 5-quart unit.", "name": "Layer with broken pieces of uncooked lasagna noodles to fit the shape of the cooker. Add a portion of the cheese mixture on top of the noodles, then repeat the process: meat sauce, noodles, cheese mixture. Reserve enough meat sauce for a final top layer. Typically, three layers can be achieved in a 5-quart unit.", "url": "https://erecip.github.io/en/crockpot-lasagna-recipe/#wprm-recipe-11648-step-0-4"}, {"@type": "HowToStep", "text": "Secure the lid and cook on low for 3 to 5 hours, or until most of the liquid has been absorbed and the noodles are tender. Monitor progress depending on your slow cooker model.", "name": "Secure the lid and cook on low for 3 to 5 hours, or until most of the liquid has been absorbed and the noodles are tender. Monitor progress depending on your slow cooker model.", "url": "https://erecip.github.io/en/crockpot-lasagna-recipe/#wprm-recipe-11648-step-0-5"}, {"@type": "HowToStep", "text": "Once cooking is complete, evenly sprinkle the remaining shredded mozzarella and grated parmesan over the top. Re-cover and allow to melt for 10 to 15 minutes. Optionally, garnish with additional parsley before serving.", "name": "Once cooking is complete, evenly sprinkle the remaining shredded mozzarella and grated parmesan over the top. Re-cover and allow to melt for 10 to 15 minutes. Optionally, garnish with additional parsley before serving.", "url": "https://erecip.github.io/en/crockpot-lasagna-recipe/#wprm-recipe-11648-step-0-6"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Crockpot Lasagna Recipe"}</script>
