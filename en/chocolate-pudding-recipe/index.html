    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chocolate Pudding Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Indulge in a velvety, homemade chocolate pudding that delivers a luscious, creamy texture far superior to any store-bought alternative. This timeless dessert comes together with ease, rewarding you with a decadent treat perfect for any occasion.", "datePublished": "2024-10-25T10:44:40+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pudding-recipe/Chocolate-Pudding-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pudding-recipe/Chocolate-Pudding-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pudding-recipe/Chocolate-Pudding-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pudding-recipe/Chocolate-Pudding-Recipe.png"], "recipeYield": ["4"], "prepTime": "PT10M", "cookTime": "PT10M", "totalTime": "PT20M", "recipeIngredient": ["¼ cup semi-sweet chocolate chips (melted)", "2 teaspoons pure vanilla extract", "½ cup granulated sugar", "⅓ cup good-quality cocoa powder", "4 teaspoons cornstarch", "1 tablespoon unsalted butter (softened)", "¼ teaspoon salt", "3  egg yolks", "2 cups whole milk (divided)", "Fresh whipped cream & chocolate shavings (for garnish (optional))"], "recipeInstructions": [{"@type": "HowToStep", "text": "Sift cocoa powder into a medium saucepan and blend in the sugar. Gradually whisk in 1½ cups of the milk until fully combined and smooth. Place the saucepan over medium-high heat and stir continuously until the mixture reaches a gentle simmer, then remove from heat. In a separate large bowl, vigorously whisk the remaining ½ cup milk with the cornstarch, egg yolks, and salt until silky. While whisking steadily, slowly pour the hot cocoa mixture into the egg yolk blend to temper. Return the combined mixture to the saucepan over medium-high heat and whisk without pause until it reaches a rolling boil. Immediately decrease the heat to maintain a gentle simmer and continue whisking until the pudding thickens, about 2 to 3 minutes longer. Remove from heat and incorporate the melted chocolate chips, softened butter, and vanilla, stirring thoroughly until glossy and uniform. Pass the pudding through a fine mesh sieve to ensure a smooth finish, then distribute evenly into four (4-ounce) cups or bowls. Press plastic wrap directly onto the surface of each pudding to prevent a skin from forming. Refrigerate for a minimum of 4 hours or overnight until set. Before serving, crown each pudding with freshly whipped cream and chocolate shavings, if desired. Store any remaining pudding in the refrigerator, tightly covered, for up to four days.", "name": "Sift cocoa powder into a medium saucepan and blend in the sugar. Gradually whisk in 1½ cups of the milk until fully combined and smooth. Place the saucepan over medium-high heat and stir continuously until the mixture reaches a gentle simmer, then remove from heat. In a separate large bowl, vigorously whisk the remaining ½ cup milk with the cornstarch, egg yolks, and salt until silky. While whisking steadily, slowly pour the hot cocoa mixture into the egg yolk blend to temper. Return the combined mixture to the saucepan over medium-high heat and whisk without pause until it reaches a rolling boil. Immediately decrease the heat to maintain a gentle simmer and continue whisking until the pudding thickens, about 2 to 3 minutes longer. Remove from heat and incorporate the melted chocolate chips, softened butter, and vanilla, stirring thoroughly until glossy and uniform. Pass the pudding through a fine mesh sieve to ensure a smooth finish, then distribute evenly into four (4-ounce) cups or bowls. Press plastic wrap directly onto the surface of each pudding to prevent a skin from forming. Refrigerate for a minimum of 4 hours or overnight until set. Before serving, crown each pudding with freshly whipped cream and chocolate shavings, if desired. Store any remaining pudding in the refrigerator, tightly covered, for up to four days.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pudding-recipe/#wprm-recipe-51519-step-0-0"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Chocolate Pudding Recipe"}</script>
