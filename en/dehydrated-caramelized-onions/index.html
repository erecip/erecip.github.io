ation appears inside the jar, place the onions back into the dehydrator and continue drying.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dehydrated-caramelized-onions/#wprm-recipe-41855-step-0-3"}, {"@type": "HowToStep", "text": "Once the conditioned onions are confirmed to be thoroughly dry, they may be sealed in an airtight container for storage. To prepare onion powder, place the dried onions in a grinder or blender. Pulse several times to break up the pieces, then blend continuously until a fine powder develops. For a smoother consistency, sift the powder and grind any remaining coarse particles again.", "name": "Once the conditioned onions are confirmed to be thoroughly dry, they may be sealed in an airtight container for storage. To prepare onion powder, place the dried onions in a grinder or blender. Pulse several times to break up the pieces, then blend continuously until a fine powder develops. For a smoother consistency, sift the powder and grind any remaining coarse particles again.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dehydrated-caramelized-onions/#wprm-recipe-41855-step-0-4"}, {"@type": "HowToStep", "text": "Spread the freshly ground powder in a thin layer on a suitable dehydrator tray. Return it to the dehydrator and dry again until any remaining moisture has been removed completely.", "name": "Spread the freshly ground powder in a thin layer on a suitable dehydrator tray. Return it to the dehydrator and dry again until any remaining moisture has been removed completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dehydrated-caramelized-onions/#wprm-recipe-41855-step-0-5"}, {"@type": "HowToStep", "text": "After the onion powder has finished redrying, transfer it to an airtight container. Mix in a small quantity of arrowroot powder before sealing to help minimize clumping during storage.", "name": "After the onion powder has finished redrying, transfer it to an airtight container. Mix in a
