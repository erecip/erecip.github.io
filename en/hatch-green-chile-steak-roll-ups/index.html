    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Hatch Green Chile Steak Roll Ups", "author": {"@type": "Person", "name": "BenDes"}, "description": "Thin slices of seasoned sirloin are filled with roasted Hatch green chiles, baby spinach, and queso fresco, then rolled and oven-roasted until browned. The finished steak rolls are sliced and served with a fresh cilantro-lime Greek yogurt sauce and an additional sprinkling of queso fresco.", "datePublished": "2023-03-17T07:33:41+00:00", "image": ["https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/hatch-green-chile-steak-roll-ups2.png", "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/hatch-green-chile-steak-roll-ups2.png", "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/hatch-green-chile-steak-roll-ups2.png", "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/hatch-green-chile-steak-roll-ups2.png"], "cookTime": "PT35M", "totalTime": "PT40M", "recipeIngredient": ["1 cup tender baby spinach leaves", "2 oz queso fresco (crumbled for the interior)", "1 teaspoon steak seasoning blend", "4  Hatch green chiles (roasted, skinned, and seeded; approximately 1/3 lb roasted chiles may be used if already prepared)", "Salt and finely ground white pepper (as needed)", "1.5 lb sirloin steak (sliced very thin into approximately 4 Milanese-style pieces)", "1 tablespoon freshly grated lime zest", "2 oz queso fresco (crumbled for finishing)", "1/4 cup fresh cilantro (finely chopped)", "1 tablespoon fresh lime juice", "1/2 cup unsweetened plain Greek yogurt (with 0% fat Greek yogurt such as Fage suitable for this recipe)", "Salt and ground white pepper (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F. If starting with fresh Hatch green chiles rather than already roasted peppers, arrange the 4 chiles on a baking sheet. Roast for approximately 20 minutes, turning once or twice during cooking, until the skins are blistered and blackened in spots. The chiles may also be prepared on a grill using the same visual cues for doneness.", "name": "Preheat the oven to 400°F. If starting with fresh Hatch green chiles rather than already roasted peppers, arrange the 4 chiles on a baking sheet. Roast for approximately 20 minutes, turning once or twice during cooking, until the skins are blistered and blackened in spots. The chiles may also be prepared on a grill using the same visual cues for doneness.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the hot roasted chiles immediately to a sealable plastic zip-top bag. Close the bag and allow the peppers to steam for 20 minutes to loosen their skins.", "name": "Transfer the hot roasted chiles immediately to a sealable plastic zip-top bag. Close the bag and allow the peppers to steam for 20 minutes to loosen their skins.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-1"}, {"@type": "HowToStep", "text": "When the chiles are cool enough to handle, remove the blistered skins and stems. Open each chile and rinse away the seeds. Set the prepared peppers aside for filling the steaks.", "name": "When the chiles are cool enough to handle, remove the blistered skins and stems. Open each chile and rinse away the seeds. Set the prepared peppers aside for filling the steaks.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-2"}, {"@type": "HowToStep", "text": "Arrange the thinly sliced sirloin pieces in a single layer on a rimmed pan.", "name": "Arrange the thinly sliced sirloin pieces in a single layer on a rimmed pan.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-3"}, {"@type": "HowToStep", "text": "Distribute the steak seasoning evenly over the meat, then season lightly with salt and ground white pepper.", "name": "Distribute the steak seasoning evenly over the meat, then season lightly with salt and ground white pepper.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-4"}, {"@type": "HowToStep", "text": "Cover each steak with a portion of baby spinach and strips of the roasted Hatch green chiles.", "name": "Cover each steak with a portion of baby spinach and strips of the roasted Hatch green chiles.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-5"}, {"@type": "HowToStep", "text": "Add a piece of queso fresco near the center of each steak, dividing the 2 oz filling portion among the rollups.", "name": "Add a piece of queso fresco near the center of each steak, dividing the 2 oz filling portion among the rollups.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-6"}, {"@type": "HowToStep", "text": "Beginning at one end of each steak, roll the meat firmly around the spinach, chile, and cheese filling, keeping the ingredients contained as tightly as possible.", "name": "Beginning at one end of each steak, roll the meat firmly around the spinach, chile, and cheese filling, keeping the ingredients contained as tightly as possible.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-7"}, {"@type": "HowToStep", "text": "Secure each steak roll with toothpicks wherever necessary to prevent the filling from slipping out while the meat cooks.", "name": "Secure each steak roll with toothpicks wherever necessary to prevent the filling from slipping out while the meat cooks.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-8"}, {"@type": "HowToStep", "text": "Arrange the secured steak rollups on a rimmed baking sheet. Place the pan on the center rack of the 400°F oven.", "name": "Arrange the secured steak rollups on a rimmed baking sheet. Place the pan on the center rack of the 400°F oven.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-9"}, {"@type": "HowToStep", "text": "Roast for approximately 15 minutes, or until the exterior of the steak begins to brown and the queso fresco inside starts to soften.", "name": "Roast for approximately 15 minutes, or until the exterior of the steak begins to brown and the queso fresco inside starts to soften.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-10"}, {"@type": "HowToStep", "text": "Step 5: Prepare the Cilantro-Lime Yogurt Sauce", "name": "Step 5: Prepare the Cilantro-Lime Yogurt Sauce", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-11"}, {"@type": "HowToStep", "text": "While the steak rollups are in the oven, place the Greek yogurt, fresh cilantro, lime juice, and lime zest in a small blender.", "name": "While the steak rollups are in the oven, place the Greek yogurt, fresh cilantro, lime juice, and lime zest in a small blender.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-12"}, {"@type": "HowToStep", "text": "Pulse the mixture several times, stopping when the cilantro is evenly dispersed but remains visible in small pieces rather than being completely puréed.", "name": "Pulse the mixture several times, stopping when the cilantro is evenly dispersed but remains visible in small pieces rather than being completely puréed.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-13"}, {"@type": "HowToStep", "text": "Season the sauce with salt and ground white pepper according to taste.", "name": "Season the sauce with salt and ground white pepper according to taste.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-14"}, {"@type": "HowToStep", "text": "Take the roasted steak rollups out of the oven and leave them to rest for 5–10 minutes before slicing.", "name": "Take the roasted steak rollups out of the oven and leave them to rest for 5–10 minutes before slicing.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-15"}, {"@type": "HowToStep", "text": "Cut the rested rolls crosswise into portions and serve them with a generous drizzle of the cilantro-lime yogurt sauce.", "name": "Cut the rested rolls crosswise into portions and serve them with a generous drizzle of the cilantro-lime yogurt sauce.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-16"}, {"@type": "HowToStep", "text": "Finish each serving with the remaining 2 oz of crumbled queso fresco.", "name": "Finish each serving with the remaining 2 oz of crumbled queso fresco.", "url": "https://erecip.github.io/en/hatch-green-chile-steak-roll-ups/#wprm-recipe-42126-step-0-17"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Southwestern"], "keywords": "Hatch Green Chile Steak Roll Ups"}</script>
