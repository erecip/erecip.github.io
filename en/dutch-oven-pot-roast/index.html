    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Dutch Oven Pot Roast", "author": {"@type": "Person", "name": "BenDes"}, "description": "A slow-braised beef chuck roast cooked in a Dutch oven with red wine, savory herbs, onions, garlic, potatoes, and carrots. Long, gentle oven cooking produces fork-tender beef while allowing the vegetables to absorb the rich, deeply flavored braising liquid.", "datePublished": "2021-04-19T03:03:56+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/dutch-oven-pot-roast2.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/dutch-oven-pot-roast2-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/dutch-oven-pot-roast2-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/dutch-oven-pot-roast2-480x270.png"], "totalTime": "PT240M", "recipeIngredient": ["3 lb boneless beef chuck roast", "1½ lb small yellow potatoes (halved when larger than 1½ inches)", "2  dried bay leaves", "1 cup red wine (or an equal amount of beef broth)", "6  fresh garlic cloves (finely minced)", "2  sprigs fresh rosemary", "1½ teaspoons kosher salt", "2 tablespoons tomato purée", "1 lb small carrots (peeled and kept whole)", "2 teaspoons Worcestershire sauce", "4  sprigs fresh thyme", "2  –3 tablespoons olive oil (for searing)", "1 teaspoon ground black pepper (preferably freshly ground)", "2  large yellow onions (chopped into 1-inch pieces)", "2  –3 cups beef broth (as needed)", "Fresh Italian parsley (finely chopped)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 300°F. Season every side of the chuck roast generously with the 1½ teaspoons kosher salt and 1 teaspoon black pepper.", "name": "Preheat the oven to 300°F. Season every side of the chuck roast generously with the 1½ teaspoons kosher salt and 1 teaspoon black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-0"}, {"@type": "HowToStep", "text": "Warm approximately 2 tablespoons olive oil in a large 7- to 8-quart Dutch oven over medium-high heat. Add the roast and sear for approximately 5–6 minutes per side, allowing a deep golden-brown crust to develop.", "name": "Warm approximately 2 tablespoons olive oil in a large 7- to 8-quart Dutch oven over medium-high heat. Add the roast and sear for approximately 5–6 minutes per side, allowing a deep golden-brown crust to develop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the browned beef from the Dutch oven and set it aside. Leave the browned residue and rendered juices in the pot, as these will contribute flavor to the braising liquid.", "name": "Transfer the browned beef from the Dutch oven and set it aside. Leave the browned residue and rendered juices in the pot, as these will contribute flavor to the braising liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-2"}, {"@type": "HowToStep", "text": "Lower the heat to medium and place the chopped onions in the Dutch oven. Cook for approximately 3 minutes, or until they begin to brown.", "name": "Lower the heat to medium and place the chopped onions in the Dutch oven. Cook for approximately 3 minutes, or until they begin to brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-3"}, {"@type": "HowToStep", "text": "As the onions release moisture, scrape the browned bits from the bottom and sides of the pot. If the fond begins to darken or burn too quickly, pour in a few small splashes of beef broth to loosen it.", "name": "As the onions release moisture, scrape the browned bits from the bottom and sides of the pot. If the fond begins to darken or burn too quickly, pour in a few small splashes of beef broth to loosen it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-4"}, {"@type": "HowToStep", "text": "Add the minced garlic and cook for approximately 1 minute, stirring until aromatic. A wooden spoon may be used to scrape the Dutch oven without damaging its surface.", "name": "Add the minced garlic and cook for approximately 1 minute, stirring until aromatic. A wooden spoon may be used to scrape the Dutch oven without damaging its surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-5"}, {"@type": "HowToStep", "text": "Pour the red wine, or beef broth if using it as a substitute, into the Dutch oven. Immediately scrape the bottom and sides of the pot to release the remaining browned bits.", "name": "Pour the red wine, or beef broth if using it as a substitute, into the Dutch oven. Immediately scrape the bottom and sides of the pot to release the remaining browned bits.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-6"}, {"@type": "HowToStep", "text": "Stir in 2 cups beef broth, Worcestershire sauce, tomato purée, thyme sprigs, rosemary sprigs, and bay leaves. Mix thoroughly and bring the liquid to a gentle boil.", "name": "Stir in 2 cups beef broth, Worcestershire sauce, tomato purée, thyme sprigs, rosemary sprigs, and bay leaves. Mix thoroughly and bring the liquid to a gentle boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-7"}, {"@type": "HowToStep", "text": "Return the seared chuck roast to the Dutch oven together with any juices that accumulated while it rested.", "name": "Return the seared chuck roast to the Dutch oven together with any juices that accumulated while it rested.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-8"}, {"@type": "HowToStep", "text": "The braising liquid should reach approximately halfway up the sides of the meat. Add additional beef broth when necessary to achieve this level.", "name": "The braising liquid should reach approximately halfway up the sides of the meat. Add additional beef broth when necessary to achieve this level.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-9"}, {"@type": "HowToStep", "text": "Cover the Dutch oven securely and place it in the preheated oven. Cook at 300°F for 1½ hours.", "name": "Cover the Dutch oven securely and place it in the preheated oven. Cook at 300°F for 1½ hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-10"}, {"@type": "HowToStep", "text": "Remove the Dutch oven from the oven and arrange the whole peeled carrots and prepared yellow potatoes around the beef. Taste the braising liquid and add more salt or pepper at this stage if required.", "name": "Remove the Dutch oven from the oven and arrange the whole peeled carrots and prepared yellow potatoes around the beef. Taste the braising liquid and add more salt or pepper at this stage if required.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-11"}, {"@type": "HowToStep", "text": "Replace the lid and return the Dutch oven to the oven. Continue cooking for another 2 hours, or until the beef separates easily with a fork and the vegetables are tender.", "name": "Replace the lid and return the Dutch oven to the oven. Continue cooking for another 2 hours, or until the beef separates easily with a fork and the vegetables are tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-12"}, {"@type": "HowToStep", "text": "For an even softer roast, continue cooking for an additional 15–30 minutes.", "name": "For an even softer roast, continue cooking for an additional 15–30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-13"}, {"@type": "HowToStep", "text": "Sprinkle the finished pot roast with finely chopped fresh Italian parsley, if desired.", "name": "Sprinkle the finished pot roast with finely chopped fresh Italian parsley, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-14"}, {"@type": "HowToStep", "text": "Transfer the beef and vegetables to a large serving platter, or serve the meal directly from the Dutch oven with the flavorful braising liquid.", "name": "Transfer the beef and vegetables to a large serving platter, or serve the meal directly from the Dutch oven with the flavorful braising liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-pot-roast/#wprm-recipe-43669-step-0-15"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Dutch Oven Pot Roast"}</script>
