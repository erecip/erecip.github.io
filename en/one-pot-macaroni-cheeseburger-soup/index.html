    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "One Pot Macaroni Cheeseburger Soup Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This hearty cheeseburger soup is a one-pot wonder that comes together in just 30 minutes! It’s rich, creamy, and packed with comforting flavors your family will adore, all without using VELVEETA.", "datePublished": "2024-12-10T15:54:14+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/one-pot-macaroni-cheeseburger-soup/One-Pot-Macaroni-Cheeseburger-Soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-macaroni-cheeseburger-soup/One-Pot-Macaroni-Cheeseburger-Soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-macaroni-cheeseburger-soup/One-Pot-Macaroni-Cheeseburger-Soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-macaroni-cheeseburger-soup/One-Pot-Macaroni-Cheeseburger-Soup.png"], "prepTime": "PT10M", "cookTime": "PT20M", "totalTime": "PT30M", "recipeIngredient": ["1 pound ground beef", "6 tablespoons butter", "1 cup diced yellow onion", "1 cup sliced celery", "1 cup sliced carrots", "5 cloves garlic (minced)", "8 ounces sharp cheddar cheese (shredded)", "8 ounces uncooked elbow macaroni", "8 cups chicken broth", "1 cup heavy cream", "1 teaspoon white balsamic vinegar", "2 teaspoons dried oregano (divided)", "2 teaspoons dried thyme (divided)", "Kosher salt (to taste)", "Fresh cracked pepper (to taste)", "4  sesame seed buns (diced into 1-inch cubes)", "2 tablespoons olive oil", "Sliced green onions", "Shredded cheddar cheese"], "recipeInstructions": [{"@type": "HowToSection", "name": "Prepare Croutons:", "itemListElement": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F. Arrange sesame seed bun cubes in a single layer on a parchment-lined baking sheet. Drizzle with olive oil and toss until evenly coated. Bake for 10 minutes or until golden and crispy.", "name": "P ", "name": "Reduce heat to medium and stir in minced garlic, the remaining teaspoon of oregano, and thyme. Cook for 1 minute until fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-macaroni-cheeseburger-soup/#wprm-recipe-48468-step-3-0"}]}, {"@type": "HowToSection", "name": "Incorporate Flour:", "itemListElement": [{"@type": "HowToStep", "text": "Sprinkle flour over the vegetables and stir to coat. Cook for an additional minute, stirring constantly.", "name": "Sprinkle flour over the vegetables and stir to coat. Cook for an additional minute, stirring constantly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-macaroni-cheeseburger-soup/#wprm-recipe-48468-step-4-0"}]}, {"@type": "HowToSection", "name": "Deglaze and Simmer:", "itemListElement": [{"@type": "HowToStep", "text": "Pour a small amount of chicken broth into the pot to deglaze, scraping up browned bits from the bottom. Stir in the remaining chicken broth and uncooked macaroni. Add a pinch of salt and pepper. Increase the heat to medium-high and bring the soup to a simmer.", "name": "Pour a small amount of chicken broth into the pot to deglaze, scraping up browned bits from the bottom. Stir in the remaining chicken broth and uncooked macaroni. Add a pinch of salt and pepper. Increase the heat to medium-high and bring the soup to a simmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-macaroni-cheeseburger-soup/#wprm-recipe-48468-step-5-0"}]}, {"@type": "HowToSection", "name": "Cook Pasta:", "itemListElement": [{"@type": "HowToStep", "text": "Lower the heat to maintain a gentle simmer and cook for 5-7 minutes, stirring occasionally, until the pasta is al dente.", "name": "Lower the heat to maintain a gentle simmer and cook for 5-7 minutes, stirring occasionally, until the pasta is al dente.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-macaroni-cheeseburger-soup/#wprm-recipe-48468-step-6-0"}]}, {"@type": "HowToSection", "name": "Finish the Soup:", "itemListElement": [{"@type": "HowToStep", "text": "Remove the pot from heat and stir in heavy cream, shredded cheese, and white balsamic vinegar. Add the cooked ground beef back to the pot and return to medium heat for a few minutes until heated through. Adjust seasoning with salt and pepper as needed.", "name": "Remove the pot from heat and stir in heavy cream, shredded cheese, and white balsamic vinegar. Add the cooked ground beef back to the pot and return to medium heat for a few minutes until heated through. Adjust seasoning with salt and pepper as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-macaroni-cheeseburger-soup/#wprm-recipe-48468-step-7-0"}]}, {"@type": "HowToSection", "name": "Serve and Garnish:", "itemListElement": [{"@type": "HowToStep", "text": "Ladle soup into bowls, top with crispy sesame seed bun croutons, and garnish with sliced green onions and shredded cheddar cheese. Serve immediately and enjoy!", "name": "Ladle soup into bowls, top with crispy sesame seed bun croutons, and garnish with sliced green onions and shredded cheddar cheese. Serve immediately and enjoy!", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-macaroni-cheeseburger-soup/#wprm-recipe-48468-step-8-0"}]}], "recipeCategory": ["Soup"], "recipeCuisine": ["American"], "keywords": "One Pot Macaroni Cheeseburger Soup Recipe"}</script>
