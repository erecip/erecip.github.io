ayer of bread in the prepared baking dish, trimming individual pieces when needed so that the brown sugar-butter base is fully covered.", "name": "Arrange one layer of bread in the prepared baking dish, trimming individual pieces when needed so that the brown sugar-butter base is fully covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-texas-french-toast/#wprm-recipe-44947-step-0-6"}, {"@type": "HowToStep", "text": "Evenly spoon 1 cup of the prepared egg custard over this first bread layer.", "name": "Evenly spoon 1 cup of the prepared egg custard over this first bread layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-texas-french-toast/#wprm-recipe-44947-step-0-7"}, {"@type": "HowToStep", "text": "In a small bowl, combine the 2 tablespoons of light brown sugar with the ground cinnamon.", "name": "In a small bowl, combine the 2 tablespoons of light brown sugar with the ground cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-texas-french-toast/#wprm-recipe-44947-step-0-8"}, {"@type": "HowToStep", "text": "Scatter half of the cinnamon-brown sugar mixture evenly over the custard-soaked bread.", "name": "Scatter half of the cinnamon-brown sugar mixture evenly over the custard-soaked bread.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-texas-french-toast/#wprm-recipe-44947-step-0-9"}, {"@type": "HowToStep", "text": "Arrange a second layer of Texas toast over the first layer. Pour or spoon the remaining egg custard evenly across the bread.", "name": "Arrange a second layer of Texas toast over the first layer. Pour or spoon the remaining egg custard evenly across the bread.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-texas-french-toast/#wprm-recipe-44947-step-0-10"}, {"@type": "HowToStep", "text": "Finish by sprinkling the remaining cinnamon and brown sugar mixture over the surface. Gently press the bread downward so it absorbs t 323/en/cinnamon-texas-french-toast/#wprm-recipe-44947-step-0-15"}, {"@type": "HowToStep", "text": "Remove the baked French toast casserole from the oven and allow it to cool for several minutes.", "name": "Remove the baked French toast casserole from the oven and allow it to cool for several minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-texas-french-toast/#wprm-recipe-44947-step-0-16"}, {"@type": "HowToStep", "text": "Dust the surface generously with powdered sugar.", "name": "Dust the surface generously with powdered sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-texas-french-toast/#wprm-recipe-44947-step-0-17"}, {"@type": "HowToStep", "text": "Cut into portions and serve, making certain to spoon some of the sticky caramelized brown sugar sauce from the bottom of the baking dish over each serving.", "name": "Cut into portions and serve, making certain to spoon some of the sticky caramelized brown sugar sauce from the bottom of the baking dish over each serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-texas-french-toast/#wprm-recipe-44947-step-0-18"}, {"@type": "HowToStep", "text": "Drizzle with pure maple syrup, if desired.", "name": "Drizzle with pure maple syrup, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-texas-french-toast/#wprm-recipe-44947-step-0-19"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Cinnamon Texas French Toast"}</script>
