    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Slow Cooked Beef Bourguignon", "author": {"@type": "Person", "name": "BenDes"}, "description": "A deeply savory French-style beef stew featuring browned chuck roast, smoky bacon, red wine, aromatic vegetables, mushrooms, and pearl onions. A long oven braise transforms the beef into exceptionally tender pieces while producing a rich, full-bodied sauce.", "datePublished": "2022-03-24T23:10:08+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/slow-cooked-beef-bourguignon2.png", "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/slow-cooked-beef-bourguignon2.png", "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/slow-cooked-beef-bourguignon2.png", "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/slow-cooked-beef-bourguignon2.png"], "totalTime": "PT270M", "recipeIngredient": ["2 cups full-bodied red wine or Burgundy wine", "5  garlic cloves (finely minced)", "3  large carrots (peeled and cut into 1-inch pieces)", "2  fresh thyme sprigs", "3 1/2 pounds beef chuck (divided into 2-inch cubes)", "1 tablespoon beef bouillon base", "2 tablespoons unsalted butter", "2  bay leaves (preferably fresh)", "5  strips bacon (sliced into 1-inch sections)", "2 cups beef broth", "3 tablespoons all-purpose flour", "1  yellow onion (diced into approximately 1/2-inch pieces)", "2 tablespoons tomato paste", "Kosher salt (as needed)", "Freshly ground black pepper (as needed)", "10 ounces pearl onions (thawed and thoroughly drained)", "2 tablespoons unsalted butter", "16 ounces cremini mushrooms (quartered into roughly 1-inch pieces)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F.", "name": "Preheat the oven to 350°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/ stage; the purpose is to establish a deeply caramelized exterior.", "name": "Transfer each browned portion of beef to a plate. The meat does not need to cook through at this stage; the purpose is to establish a deeply caramelized exterior.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-5"}, {"@type": "HowToStep", "text": "Add 2 tablespoons unsalted butter to the same pot and allow it to melt and begin foaming.", "name": "Add 2 tablespoons unsalted butter to the same pot and allow it to melt and begin foaming.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-6"}, {"@type": "HowToStep", "text": "Stir in the diced yellow onion and chopped carrots. Cook for 2–3 minutes, stirring periodically, until the vegetables soften slightly and begin developing color.", "name": "Stir in the diced yellow onion and chopped carrots. Cook for 2–3 minutes, stirring periodically, until the vegetables soften slightly and begin developing color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-7"}, {"@type": "HowToStep", "text": "Add the minced garlic and continue cooking for approximately 1 minute, just until aromatic.", "name": "Add the minced garlic and continue cooking for approximately 1 minute, just until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-8"}, {"@type": "HowToStep", "text": "Mix in the tomato paste and cook for another 2–3 minutes, stirring as it lightly caramelizes against the bottom of the pot.", "name": "Mix in the tomato paste and cook for another 2–3 minutes, stirring as it lightly caramelizes against the bottom of the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-9"}, {"@type": "HowToStep", "text": "Sprinkle the flour evenly over the vegetables. Stir continuously for 2–3 minutes to remove the raw flour flavor and form the thickening base for the sauce.", "name": "Sprinkle the flour evenly over the vegetables. Stir continuously for 2–3 minutes to remove the raw flour flavor and form the thickening base for the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-10"}, {"@type": "HowToStep", "text": "Pour the Burgundy or other full-bodied red wine into the pot. Use a wooden spoon to scrape the browned caramelized residue from the bottom, incorporating it thoroughly into the liquid.", "name": "Pour the Burgundy or other full-bodied red wine into the pot. Use a wooden spoon to scrape the browned caramelized residue from the bottom, incorporating it thoroughly into the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-11"}, {"@type": "HowToStep", "text": "Add the beef broth and beef bouillon base, stirring until combined.", "name": "Add the beef broth and beef bouillon base, stirring until combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-12"}, {"@type": "HowToStep", "text": "Return the seared beef and reserved crisp bacon to the pot. Add the fresh thyme sprigs and bay leaves.", "name": "Return the seared beef and reserved crisp bacon to the pot. Add the fresh thyme sprigs and bay leaves.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-13"}, {"@type": "HowToStep", "text": "Bring the mixture to a gentle simmer over medium heat. Cover securely with a tight-fitting lid and transfer the pot to the preheated 350°F oven.", "name": "Bring the mixture to a gentle simmer over medium heat. Cover securely with a tight-fitting lid and transfer the pot to the preheated 350°F oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-14"}, {"@type": "HowToStep", "text": "Keep the beef covered and braise it in the oven for 2 1/2 hours.", "name": "Keep the beef covered and braise it in the oven for 2 1/2 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-15"}, {"@type": "HowToStep", "text": "During the braising period, melt the remaining 2 tablespoons unsalted butter in a large skillet over medium-high heat.", "name": "During the braising period, melt the remaining 2 tablespoons unsalted butter in a large skillet over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-16"}, {"@type": "HowToStep", "text": "Once the butter is foaming, arrange the quartered cremini mushrooms in the skillet. Leave them undisturbed for 3–4 minutes so that a golden crust develops.", "name": "Once the butter is foaming, arrange the quartered cremini mushrooms in the skillet. Leave them undisturbed for 3–4 minutes so that a golden crust develops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-17"}, {"@type": "HowToStep", "text": "Stir the mushrooms and continue sautéing until browned on all sides, for approximately 5–7 minutes total cooking time.", "name": "Stir the mushrooms and continue sautéing until browned on all sides, for approximately 5–7 minutes total cooking time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-18"}, {"@type": "HowToStep", "text": "Add the thawed and drained pearl onions. Cook the mushrooms and onions together for another 5 minutes, then lightly season with kosher salt and freshly ground black pepper.", "name": "Add the thawed and drained pearl onions. Cook the mushrooms and onions together for another 5 minutes, then lightly season with kosher salt and freshly ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-19"}, {"@type": "HowToStep", "text": "Remove the skillet from the heat and reserve the mushroom and onion mixture.", "name": "Remove the skillet from the heat and reserve the mushroom and onion mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-20"}, {"@type": "HowToStep", "text": "After the beef has braised for 2 1/2 hours, carefully remove the Dutch oven from the oven.", "name": "After the beef has braised for 2 1/2 hours, carefully remove the Dutch oven from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-21"}, {"@type": "HowToStep", "text": "Gently fold the sautéed cremini mushrooms and pearl onions into the stew, distributing them evenly throughout the braising liquid.", "name": "Gently fold the sautéed cremini mushrooms and pearl onions into the stew, distributing them evenly throughout the braising liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-22"}, {"@type": "HowToStep", "text": "Cover the pot again and return it to the 350°F oven for an additional 45–60 minutes. Continue cooking until the beef is exceptionally tender when tested with a fork and the mushrooms and onions have absorbed the flavors of the sauce.", "name": "Cover the pot again and return it to the 350°F oven for an additional 45–60 minutes. Continue cooking until the beef is exceptionally tender when tested with a fork and the mushrooms and onions have absorbed the flavors of the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-23"}, {"@type": "HowToStep", "text": "Remove the finished beef bourguignon from the oven and leave it covered at room temperature for 30 minutes.", "name": "Remove the finished beef bourguignon from the oven and leave it covered at room temperature for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-24"}, {"@type": "HowToStep", "text": "During this resting period, the sauce will settle and excess fat may rise to the surface. Skim away any unwanted surface fat if desired.", "name": "During this resting period, the sauce will settle and excess fat may rise to the surface. Skim away any unwanted surface fat if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-25"}, {"@type": "HowToStep", "text": "Taste the braising liquid and adjust the seasoning with additional kosher salt and freshly ground black pepper as necessary.", "name": "Taste the braising liquid and adjust the seasoning with additional kosher salt and freshly ground black pepper as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-26"}, {"@type": "HowToStep", "text": "Serve the beef bourguignon with generous portions of tender beef, carrots, mushrooms, pearl onions, bacon, and the rich red wine sauce.", "name": "Serve the beef bourguignon with generous portions of tender beef, carrots, mushrooms, pearl onions, bacon, and the rich red wine sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/slow-cooked-beef-bourguignon/#wprm-recipe-44703-step-0-27"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["French"], "keywords": "Slow Cooked Beef Bourguignon"}</script>
