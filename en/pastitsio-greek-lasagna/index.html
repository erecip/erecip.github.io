": "HowToStep", "text": "Before beginning the final assembly, allow the chilled meat sauce to come to room temperature or warm it gently.", "name": "Before beginning the final assembly, allow the chilled meat sauce to come to room temperature or warm it gently.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-6"}, {"@type": "HowToStep", "text": "Shred enough kasseri, Asiago, or Italian cheese blend to provide at least 4 cups. Set the cheese aside for layering.", "name": "Shred enough kasseri, Asiago, or Italian cheese blend to provide at least 4 cups. Set the cheese aside for layering.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-7"}, {"@type": "HowToStep", "text": "Bring a large pot of generously salted water to a full boil.", "name": "Bring a large pot of generously salted water to a full boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-8"}, {"@type": "HowToStep", "text": "Add the pastitsio noodles or mostaccioli and cook until al dente. For the proper texture, remove the pasta approximately 1–2 minutes before the cooking time specified on the package.", "name": "Add the pastitsio noodles or mostaccioli and cook until al dente. For the proper texture, remove the pasta approximately 1–2 minutes before the cooking time specified on the package.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-9"}, {"@type": "HowToStep", "text": "Drain thoroughly. Once the pasta has cooled sufficiently to handle, transfer it to a large bowl.", "name": "Drain thoroughly. Once the pasta has cooled sufficiently to handle, transfer it to a large bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-10"}, {"@type": "HowToStep", "text": "Beat 1 egg, pour it over the noodles, and use your hands to distribute the egg thoroughly throughout the pasta.", "name": "Beat 1 egg, pour it over the noodles, and use your hands to distribute the egg thoroughly throughout the pasta.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-11"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F.", "name": "Preheat the oven to 350°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-12"}, {"@type": "HowToStep", "text": "Lightly grease a lasagna pan or other large baking dish with a drizzle of olive oil or a coating of nonstick cooking spray.", "name": "Lightly grease a lasagna pan or other large baking dish with a drizzle of olive oil or a coating of nonstick cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-13"}, {"@type": "HowToStep", "text": "Arrange all of the egg-coated pasta evenly across the bottom of the prepared baking dish.", "name": "Arrange all of the egg-coated pasta evenly across the bottom of the prepared baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-14"}, {"@type": "HowToStep", "text": "Scatter approximately one-third of the shredded cheese evenly over the pasta.", "name": "Scatter approximately one-third of the shredded cheese evenly over the pasta.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-15"}, {"@type": "HowToStep", "text": "Using a slotted spoon, distribute all or most of the prepared meat sauce over the cheese. Leave sufficient room at the top of the dish for the béchamel.", "name": "Using a slotted spoon, distribute all or most of the prepared meat sauce over the cheese. Leave sufficient room at the top of the dish for the béchamel.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-16"}, {"@type": "HowToStep", "text": "Cover the meat layer with another one-third of the shredded cheese. At this stage, the casserole should consist of pasta, cheese, meat sauce, and a second cheese layer.", "name": "Cover the meat layer with another one-third of the shredded cheese. At this stage, the casserole should consist of pasta, cheese, meat sauce, and a second cheese layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-17"}, {"@type": "HowToStep", "text": "Melt 8 tablespoons of unsalted butter in a large, heavy-bottomed pot over medium heat.", "name": "Melt 8 tablespoons of unsalted butter in a large, heavy-bottomed pot over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-18"}, {"@type": "HowToStep", "text": "Add the all-purpose flour and whisk continuously for approximately 1–2 minutes, until the butter and flour are completely incorporated.", "name": "Add the all-purpose flour and whisk continuously for approximately 1–2 minutes, until the butter and flour are completely incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-19"}, {"@type": "HowToStep", "text": "Gradually pour in 5 cups of whole milk while whisking constantly to maintain a smooth, lump-free consistency.", "name": "Gradually pour in 5 cups of whole milk while whisking constantly to maintain a smooth, lump-free consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-20"}, {"@type": "HowToStep", "text": "Continue cooking and whisking until the mixture just begins to boil and bubble. Remove the pot from the heat.", "name": "Continue cooking and whisking until the mixture just begins to boil and bubble. Remove the pot from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-21"}, {"@type": "HowToStep", "text": "In a separate bowl, use a hand mixer to beat 3 eggs together with the additional 1/2 cup of whole milk.", "name": "In a separate bowl, use a hand mixer to beat 3 eggs together with the additional 1/2 cup of whole milk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-22"}, {"@type": "HowToStep", "text": "Slowly add the egg-and-milk mixture to the hot sauce while whisking continuously.", "name": "Slowly add the egg-and-milk mixture to the hot sauce while whisking continuously.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-23"}, {"@type": "HowToStep", "text": "Return the pot to medium-high heat. Continue whisking until the béchamel becomes thick and bubbly.", "name": "Return the pot to medium-high heat. Continue whisking until the béchamel becomes thick and bubbly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-24"}, {"@type": "HowToStep", "text": "Remove it from the heat once the proper consistency has developed, then allow it to stand for several minutes.", "name": "Remove it from the heat once the proper consistency has developed, then allow it to stand for several minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-25"}, {"@type": "HowToStep", "text": "In a small saucepan, melt the remaining 4 tablespoons of unsalted butter.", "name": "In a small saucepan, melt the remaining 4 tablespoons of unsalted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-26"}, {"@type": "HowToStep", "text": "After the béchamel has rested briefly, pour it evenly over the assembled meat and cheese layers. Spread it across the entire surface.", "name": "After the béchamel has rested briefly, pour it evenly over the assembled meat and cheese layers. Spread it across the entire surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-27"}, {"@type": "HowToStep", "text": "Sprinkle the remaining one-third of the shredded cheese over the béchamel.", "name": "Sprinkle the remaining one-third of the shredded cheese over the béchamel.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-28"}, {"@type": "HowToStep", "text": "Drizzle or spoon the melted butter over the cheese. Less than the full amount may be used if a lighter topping is preferred.", "name": "Drizzle or spoon the melted butter over the cheese. Less than the full amount may be used if a lighter topping is preferred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-29"}, {"@type": "HowToStep", "text": "Set the baking dish on a baking sheet and transfer it to the preheated 350°F oven.", "name": "Set the baking dish on a baking sheet and transfer it to the preheated 350°F oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-30"}, {"@type": "HowToStep", "text": "Bake for 1 hour, or until the center is bubbling and the surface is attractively browned.", "name": "Bake for 1 hour, or until the center is bubbling and the surface is attractively browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-31"}, {"@type": "HowToStep", "text": "For deeper browning, switch the oven to broil and continue cooking for another 3–5 minutes, monitoring the pastitsio closely to prevent burning.", "name": "For deeper browning, switch the oven to broil and continue cooking for another 3–5 minutes, monitoring the pastitsio closely to prevent burning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-32"}, {"@type": "HowToStep", "text": "Remove the finished pastitsio from the oven and allow it to stand for 10 minutes before cutting.", "name": "Remove the finished pastitsio from the oven and allow it to stand for 10 minutes before cutting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-33"}, {"@type": "HowToStep", "text": "This brief resting period helps the layered casserole firm sufficiently for cleaner slices while preserving its moist interior.", "name": "This brief resting period helps the layered casserole firm sufficiently for cleaner slices while preserving its moist interior.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pastitsio-greek-lasagna/#wprm-recipe-44251-step-0-34"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["greek"], "keywords": "Pastitsio Greek Lasagna"}</script>
