    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Vegan Angel Food Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "This vegan angel food cake delivers a soft, airy crumb without eggs or dairy. Oat milk combined with vinegar forms a plant-based buttermilk, while cornstarch and carefully creamed vegan butter help create a light, tender texture. Once completely cooled, the cake may be served plain or finished with vegan whipped cream, berries, or a light dusting of powdered sugar.", "datePublished": "2018-04-09T06:06:49+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/vegan-angel-food-cake/vegan-angel-food-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/vegan-angel-food-cake/vegan-angel-food-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/vegan-angel-food-cake/vegan-angel-food-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/vegan-angel-food-cake/vegan-angel-food-cake2.png"], "cookTime": "PT35M", "totalTime": "PT95M", "recipeIngredient": ["1 cup oat milk", "1/4 cup cornstarch", "2 teaspoons pure vanilla extract", "1/3 cup plant-based butter (brought to room temperature until softened)", "1/2 teaspoon fine salt", "2 tablespoons olive oil (or an equivalent mild-flavored oil such as canola)", "2 cups all-purpose flour", "2 teaspoons vinegar", "1 cup granulated sugar", "1/2 teaspoon baking soda", "2 teaspoons baking powder"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-angel-food-cake/#wprm-recipe-41599-step-0-0"}, {"@type": "HowToStep", "text": "Combine the oat milk and vinegar in a small bowl. Allow the mixture to stand for several minutes, giving it time to curdle slightly and develop the consistency of a dairy-free buttermilk.", "name": "Combine the oat milk and vinegar in a small bowl. Allow the mixture to stand for several minutes, giving it time to curdle slightly and develop the consistency of a dairy-free buttermilk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-angel-food-cake/#wprm-recipe-41599-step-0-1"}, {"@type": "HowToStep", "text": "In a large separate bowl, thoroughly whisk together the all-purpose flour, cornstarch, baking powder, baking soda, and salt. Set the dry mixture aside.", "name": "In a large separate bowl, thoroughly whisk together the all-purpose flour, cornstarch, baking powder, baking soda, and salt. Set the dry mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-angel-food-cake/#wprm-recipe-41599-step-0-2"}, {"@type": "HowToStep", "text": "Place the softened plant-based butter, granulated sugar, olive oil, and vanilla extract in another mixing bowl. Beat with an electric mixer for several minutes, continuing until the mixture becomes notably pale, creamy, light, and fluffy.", "name": "Place the softened plant-based butter, granulated sugar, olive oil, and vanilla extract in another mixing bowl. Beat with an electric mixer for several minutes, continuing until the mixture becomes notably pale, creamy, light, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-angel-food-cake/#wprm-recipe-41599-step-0-3"}, {"@type": "HowToStep", "text": "Add the prepared dry ingredients and the oat milk mixture to the creamed butter mixture in alternating portions. Work in approximately two to three batches, mixing well after each addition.", "name": "Add the prepared dry ingredients and the oat milk mixture to the creamed butter mixture in alternating portions. Work in approximately two to three batches, mixing well after each addition.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-angel-food-cake/#wprm-recipe-41599-step-0-4"}, {"@type": "HowToStep", "text": "Continue mixing only until the batter is smooth,  cake as desired with vegan whipped cream and mixed berries.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-angel-food-cake/#wprm-recipe-41599-step-0-10"}], "recipeCategory": ["cake", "Dessert"], "recipeCuisine": ["American"], "keywords": "Vegan Angel Food Cake"}</script>
