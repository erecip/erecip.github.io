    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Nutella Stuffed Christmas Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Rich brown-butter Christmas cookies filled with a soft Nutella center, studded with finely chopped semisweet chocolate, and finished with a light scattering of flaky sea salt.", "datePublished": "2019-10-07T14:09:34+00:00", "image": ["https://erecip.github.io/en/nutella-stuffed-christmas-cookies/nutella-stuffed-christmas-cookies1.png", "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/nutella-stuffed-christmas-cookies1.png", "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/nutella-stuffed-christmas-cookies1.png", "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/nutella-stuffed-christmas-cookies1.png"], "prepTime": "PT55M", "cookTime": "PT13M", "totalTime": "PT68M", "recipeIngredient": ["4 oz semisweet chocolate bar (chopped very finely for consistent distribution)", "3/4 tsp salt", "1 cup packed brown sugar", "2 tsp cornstarch", "1 1/2 tsp vanilla extract", "2  large eggs (brought to room temperature, approximately 70°F)", "1 tsp baking soda", "2/3 cup granulated white sugar", "1 cup unsalted butter (softened to room temperature)", "2 3/4 cups all-purpose flour", "1 tsp baking powder", "2 tbsp all-purpose flour (reserved for dusting)", "1 cup Nutella (gently warmed if needed for easier handling)", "Flaky sea salt (as needed for sprinkling)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Slice the unsalted butter into tablespoon-sized portions and transfer the pieces to a medium saucepan.", "name": "Slice the unsalted butter into tablespoon-sized portions and transfer the pieces to a medium saucepan.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-0"}, {"@type": "HowToStep", "text": "Melt the butter over medium-low heat. After it has completely liquefied, raise the heat to slightly above medium.", "name": "Melt the butter over medium-low heat. After it has completely liquefied, raise the heat to slightly above medium.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-1"}, {"@type": "HowToStep", "text": "Frequently swirl the saucepan while scraping along the sides with a wooden spoon or heat-resistant spatula.", "name": "Frequently swirl the saucepan while scraping along the sides with a wooden spoon or heat-resistant spatula.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-2"}, {"@type": "HowToStep", "text": "Continue cooking and stirring until the butter develops a golden-brown color and gives off a distinct nutty fragrance.", "name": "Continue cooking and stirring until the butter develops a golden-brown color and gives off a distinct nutty fragrance.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-3"}, {"@type": "HowToStep", "text": "Immediately remove the saucepan from the heat and transfer the browned butter to a large heatproof mixing bowl. Leave it to cool for 25–30 minutes.", "name": "Immediately remove the saucepan from the heat and transfer the browned butter to a large heatproof mixing bowl. Leave it to cool for 25–30 minutes.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C). Cover the cookie sheets with parchment paper.", "name": "Preheat the oven to 375°F (190°C). Cover the cookie sheets with parchment paper.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-5"}, {"@type": "HowToStep", "text": "Spoon the Nutella into 2-teaspoon portions on a cookie sheet lined with wax paper. Transfer the tray to the freezer and allow the portions to firm.", "name": "Spoon the Nutella into 2-teaspoon portions on a cookie sheet lined with wax paper. Transfer the tray to the freezer and allow the portions to firm.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-6"}, {"@type": "HowToStep", "text": "In a medium bowl, thoroughly whisk together the 2 3/4 cups plus 2 tablespoons all-purpose flour, cornstarch, baking powder, baking soda, and salt. Set this mixture aside.", "name": "In a medium bowl, thoroughly whisk together the 2 3/4 cups plus 2 tablespoons all-purpose flour, cornstarch, baking powder, baking soda, and salt. Set this mixture aside.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-7"}, {"@type": "HowToStep", "text": "When the browned butter has sufficiently cooled, add the brown sugar and granulated white sugar. Stir until the ingredients are evenly blended.", "name": "When the browned butter has sufficiently cooled, add the brown sugar and granulated white sugar. Stir until the ingredients are evenly blended.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-8"}, {"@type": "HowToStep", "text": "Incorporate the eggs individually, mixing thoroughly after adding each one.", "name": "Incorporate the eggs individually, mixing thoroughly after adding each one.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-9"}, {"@type": "HowToStep", "text": "Pour in the vanilla extract and continue stirring until it is completely distributed throughout the mixture.", "name": "Pour in the vanilla extract and continue stirring until it is completely distributed throughout the mixture.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-10"}, {"@type": "HowToStep", "text": "Add the prepared dry ingredients gradually to the butter mixture, stirring until a cohesive cookie dough forms and no dry flour remains.", "name": "Add the prepared dry ingredients gradually to the butter mixture, stirring until a cohesive cookie dough forms and no dry flour remains.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-11"}, {"@type": "HowToStep", "text": "Finely chop the semisweet chocolate bar, then fold the chocolate pieces evenly into the dough.", "name": "Finely chop the semisweet chocolate bar, then fold the chocolate pieces evenly into the dough.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-12"}, {"@type": "HowToStep", "text": "Refrigerate the completed dough for 15–20 minutes so it becomes firmer and easier to shape.", "name": "Refrigerate the completed dough for 15–20 minutes so it becomes firmer and easier to shape.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-13"}, {"@type": "HowToStep", "text": "Take the firm Nutella portions from the freezer and remove the chilled cookie dough from the refrigerator.", "name": "Take the firm Nutella portions from the freezer and remove the chilled cookie dough from the refrigerator.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-14"}, {"@type": "HowToStep", "text": "Scoop out heaping 1 1/2-tablespoon portions of dough. Press one frozen Nutella portion into the center of each piece.", "name": "Scoop out heaping 1 1/2-tablespoon portions of dough. Press one frozen Nutella portion into the center of each piece.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-15"}, {"@type": "HowToStep", "text": "Carefully bring the cookie dough around the filling until the Nutella is completely enclosed, then gently roll the dough into a uniform ball.", "name": "Carefully bring the cookie dough around the filling until the Nutella is completely enclosed, then gently roll the dough into a uniform ball.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-16"}, {"@type": "HowToStep", "text": "Continue the process until every Nutella portion has been fully wrapped in cookie dough.", "name": "Continue the process until every Nutella portion has been fully wrapped in cookie dough.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-17"}, {"@type": "HowToStep", "text": "Place the assembled dough balls in the freezer for 15 minutes so they remain firm enough to retain their shape during baking.", "name": "Place the assembled dough balls in the freezer for 15 minutes so they remain firm enough to retain their shape during baking.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-18"}, {"@type": "HowToStep", "text": "Arrange the chilled cookie dough balls on the parchment-lined baking sheets, leaving a minimum of 2 inches between each cookie.", "name": "Arrange the chilled cookie dough balls on the parchment-lined baking sheets, leaving a minimum of 2 inches between each cookie.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-19"}, {"@type": "HowToStep", "text": "Bake for 12–13 minutes, stopping when the outer edges are just beginning to become golden brown.", "name": "Bake for 12–13 minutes, stopping when the outer edges are just beginning to become golden brown.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-20"}, {"@type": "HowToStep", "text": "As soon as the cookies come out of the oven, lightly scatter sea salt over their tops.", "name": "As soon as the cookies come out of the oven, lightly scatter sea salt over their tops.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-21"}, {"@type": "HowToStep", "text": "Leave the cookies on the baking sheet until they have cooled completely before removing them.", "name": "Leave the cookies on the baking sheet until they have cooled completely before removing them.", "url": "https://erecip.github.io/en/nutella-stuffed-christmas-cookies/#wprm-recipe-46482-step-0-22"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Nutella Stuffed Christmas Cookies"}</script>
