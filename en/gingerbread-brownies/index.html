e pan. Set the lined dish aside while preparing the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-brownies/#wprm-recipe-42350-step-0-0"}, {"@type": "HowToStep", "text": "Place the melted and cooled unsalted butter and firmly packed light brown sugar in a large mixing bowl. Stir until the mixture is smooth and thoroughly blended.", "name": "Place the melted and cooled unsalted butter and firmly packed light brown sugar in a large mixing bowl. Stir until the mixture is smooth and thoroughly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-brownies/#wprm-recipe-42350-step-0-1"}, {"@type": "HowToStep", "text": "Add the room-temperature eggs, molasses, and vanilla extract. Continue mixing until all of the wet ingredients are evenly incorporated. Using eggs at approximately 70°F helps the ingredients combine more uniformly.", "name": "Add the room-temperature eggs, molasses, and vanilla extract. Continue mixing until all of the wet ingredients are evenly incorporated. Using eggs at approximately 70°F helps the ingredients combine more uniformly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-brownies/#wprm-recipe-42350-step-0-2"}, {"@type": "HowToStep", "text": "In a separate medium bowl, whisk together the all-purpose flour, ground ginger, ground cinnamon, baking powder, and kosher salt. Continue whisking until the spices, salt, and leavening are evenly dispersed throughout the flour.", "name": "In a separate medium bowl, whisk together the all-purpose flour, ground ginger, ground cinnamon, baking powder, and kosher salt. Continue whisking until the spices, salt, and leavening are evenly dispersed throughout the flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-brownies/#wprm-recipe-42350-step-0-3"}, {"@type": "HowToStep", "text": "Gradually incorporate the dry mixture into the bowl containing the wet ingredients. Stir just until the batter -42350-step-0-8"}, {"@type": "HowToStep", "text": "Slice into squares before serving.", "name": "Slice into squares before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-brownies/#wprm-recipe-42350-step-0-9"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Gingerbread Brownies"}</script>
