 the ingredients together until smooth and creamy.", "name": "Combine the wet ingredients. Place the room-temperature softened butter and sweetened condensed milk in a large mixing bowl. Using either a hand mixer or stand mixer, beat the ingredients together until smooth and creamy.", "url": "https://erecip.github.io/en/christmas-cookies-with-condensed-milk/#wprm-recipe-44652-step-0-1"}, {"@type": "HowToStep", "text": "Add the remaining flavoring ingredients. Mix in the vanilla extract, salt, and confectioners’ sugar. Continue beating until the mixture is evenly blended.", "name": "Add the remaining flavoring ingredients. Mix in the vanilla extract, salt, and confectioners’ sugar. Continue beating until the mixture is evenly blended.", "url": "https://erecip.github.io/en/christmas-cookies-with-condensed-milk/#wprm-recipe-44652-step-0-2"}, {"@type": "HowToStep", "text": "Incorporate the flour. Add the all-purpose flour approximately 1 cup at a time, mixing until each addition is incorporated before adding more. Avoid excessive mixing, as overworking the dough may result in firmer cookies.", "name": "Incorporate the flour. Add the all-purpose flour approximately 1 cup at a time, mixing until each addition is incorporated before adding more. Avoid excessive mixing, as overworking the dough may result in firmer cookies.", "url": "https://erecip.github.io/en/christmas-cookies-with-condensed-milk/#wprm-recipe-44652-step-0-3"}, {"@type": "HowToStep", "text": "Fold in the sprinkles. Once all of the flour has been incorporated, gently mix the rainbow sprinkles into the dough just until they are distributed throughout.", "name": "Fold in the sprinkles. Once all of the flour has been incorporated, gently mix the rainbow sprinkles into the dough just until they are distributed throughout.", "url": "https://erecip.github.io/en/christmas-cookies-with-condensed-milk/#wprm-recipe-44652-step-0-4"}, {"@type": "HowToStep", "text": "Shape the cookies. Portion the dough with a cookie scoop and roll or shape it into balls. Arrange the portions evenly across the prepared baking sheet. If desired, gently press each dough ball with your fingertips or a spatula to flatten it slightly.", "name": "Shape the cookies. Portion the dough with a cookie scoop and roll or shape it into balls. Arrange the portions evenly across the prepared baking sheet. If desired, gently press each dough ball with your fingertips or a spatula to flatten it slightly.", "url": "https://erecip.github.io/en/christmas-cookies-with-condensed-milk/#wprm-recipe-44652-step-0-5"}, {"@type": "HowToStep", "text": "Bake. Transfer the baking sheet to the preheated oven and bake for 8–10 minutes, until the cookie edges develop a light golden color.", "name": "Bake. Transfer the baking sheet to the preheated oven and bake for 8–10 minutes, until the cookie edges develop a light golden color.", "url": "https://erecip.github.io/en/christmas-cookies-with-condensed-milk/#wprm-recipe-44652-step-0-6"}, {"@type": "HowToStep", "text": "Cool completely. Remove the cookies from the oven and transfer them to a wire cooling rack. Allow them to cool completely before decorating.", "name": "Cool completely. Remove the cookies from the oven and transfer them to a wire cooling rack. Allow them to cool completely before decorating.", "url": "https://erecip.github.io/en/christmas-cookies-with-condensed-milk/#wprm-recipe-44652-step-0-7"}, {"@type": "HowToStep", "text": "Finish with frosting. Once cooled, drizzle the cookies with vanilla frosting for an additional sweet and decorative finish. Allow the frosting to set before serving.", "name": "Finish with frosting. Once cooled, drizzle the cookies with vanilla frosting for an additional sweet and decorative finish. Allow the frosting to set before serving.", "url": "https://erecip.github.io/en/christmas-cookies-with-condensed-milk/#wprm-recipe-44652-step-0-8"}], "recipeCategory": ["Cookies", "Dessert"], "keywords": "Christmas Cookies with Condensed Milk"}</scri
