    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Crock Pot Pork Loin Roast", "author": {"@type": "Person", "name": "BenDes"}, "description": "A slow-cooked pork roast coated with a savory paprika-thyme seasoning and finished in a rich honey, garlic, and butter sauce. Browning the seasoned pork before slow cooking develops a deeply golden exterior, while the cooking juices are reduced into a glossy sauce for serving.", "datePublished": "2021-02-19T01:43:02+00:00", "image": ["https://erecip.github.io/en/crock-pot-pork-loin-roast/crock-pot-pork-loin-roast1.png", "https://erecip.github.io/en/crock-pot-pork-loin-roast/crock-pot-pork-loin-roast1.png", "https://erecip.github.io/en/crock-pot-pork-loin-roast/crock-pot-pork-loin-roast1.png", "https://erecip.github.io/en/crock-pot-pork-loin-roast/crock-pot-pork-loin-roast1.png"], "cookTime": "PT240M", "totalTime": "PT250M", "recipeIngredient": ["3.5  –5 lb (1.75–2.5 kg pork loin or boneless pork shoulder/Boston butt (scotch fillet), with skin removed)", "2 teaspoons dried thyme", "1 teaspoon garlic powder", "2 teaspoons fine salt", "½ teaspoon ground cayenne pepper (optional)", "2 teaspoons paprika", "½ teaspoon ground black pepper", "1 teaspoon onion powder", "1 teaspoon olive oil (for coating the pork)", "1 tablespoon olive oil (for searing)", "5  fresh garlic cloves (finely minced)", "¼ cup apple cider vinegar", "½ cup 125 g unsalted butter", "½ teaspoon ground black pepper", "¾ cup honey", "½ teaspoon salt", "3 teaspoons cornstarch (combined with an equal quantity of cold water)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Season the pork. Lightly coat the entire pork roast with 1 teaspoon of olive oil.", "name": "Season the pork. Lightly coat the entire pork roast with 1 teaspoon of olive oil.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-0"}, {"@type": "HowToStep", "text": "Combine the paprika, thyme, garlic powder, onion powder, cayenne pepper, black pepper, and salt in a small bowl. Distribute the seasoning blend evenly over the pork, pressing it firmly onto all sides so the spices adhere to the surface.", "name": "Combine the paprika, thyme, garlic powder, onion powder, cayenne pepper, black pepper, and salt in a small bowl. Distribute the seasoning blend evenly over the pork, pressing it firmly onto all sides so the spices adhere to the surface.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-1"}, {"@type": "HowToStep", "text": "Sear the roast. Warm 1 tablespoon of olive oil in a large skillet over medium heat.", "name": "Sear the roast. Warm 1 tablespoon of olive oil in a large skillet over medium heat.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-2"}, {"@type": "HowToStep", "text": "Place the seasoned pork in the hot skillet and brown it thoroughly on every side until the exterior develops a deep golden color. Monitor the heat carefully to prevent the spice coating from scorching.", "name": "Place the seasoned pork in the hot skillet and brown it thoroughly on every side until the exterior develops a deep golden color. Monitor the heat carefully to prevent the spice coating from scorching.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the browned pork directly to the slow cooker.", "name": "Transfer the browned pork directly to the slow cooker.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-4"}, {"@type": "HowToStep", "text": "Make the honey butter sauce. Carefully wipe the skillet clean with a paper towel, then return it to medium heat.", "name": "Make the honey butter sauce. Carefully wipe the skillet clean with a paper towel, then return it to medium heat.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-5"}, {"@type": "HowToStep", "text": "Add the unsalted butter and allow it to melt. Stir in the freshly minced garlic and cook for approximately 1 minute, just until the garlic becomes lightly golden.", "name": "Add the unsalted butter and allow it to melt. Stir in the freshly minced garlic and cook for approximately 1 minute, just until the garlic becomes lightly golden.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-6"}, {"@type": "HowToStep", "text": "Add the honey, apple cider vinegar, salt, and black pepper. Stir thoroughly and allow the sauce to simmer vigorously for about 30 seconds.", "name": "Add the honey, apple cider vinegar, salt, and black pepper. Stir thoroughly and allow the sauce to simmer vigorously for about 30 seconds.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-7"}, {"@type": "HowToStep", "text": "Slow-cook the pork. Pour the prepared honey butter mixture over the pork in the slow cooker, then cover with the lid.", "name": "Slow-cook the pork. Pour the prepared honey butter mixture over the pork in the slow cooker, then cover with the lid.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-8"}, {"@type": "HowToStep", "text": "For pork loin, cook on LOW for 4–5 hours. For pork shoulder, cook on LOW for approximately 10 hours. Cooking time may require adjustment according to the exact size of the roast.", "name": "For pork loin, cook on LOW for 4–5 hours. For pork shoulder, cook on LOW for approximately 10 hours. Cooking time may require adjustment according to the exact size of the roast.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-9"}, {"@type": "HowToStep", "text": "Rest the cooked pork. Remove the pork from the slow cooker and transfer it to a serving platter.", "name": "Rest the cooked pork. Remove the pork from the slow cooker and transfer it to a serving platter.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-10"}, {"@type": "HowToStep", "text": "Loosely tent the roast with foil and allow it to rest for 10–20 minutes before slicing.", "name": "Loosely tent the roast with foil and allow it to rest for 10–20 minutes before slicing.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-11"}, {"@type": "HowToStep", "text": "Prepare the finishing sauce. While the pork rests, transfer all of the liquid and cooking juices from the slow cooker to a large saucepan.", "name": "Prepare the finishing sauce. While the pork rests, transfer all of the liquid and cooking juices from the slow cooker to a large saucepan.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-12"}, {"@type": "HowToStep", "text": "Stir the cornstarch together with an equal amount of cold water until smooth, then whisk this slurry into the cooking liquid.", "name": "Stir the cornstarch together with an equal amount of cold water until smooth, then whisk this slurry into the cooking liquid.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-13"}, {"@type": "HowToStep", "text": "Reduce and serve. Bring the sauce to a simmer over medium-high heat and cook for approximately 5 minutes, or until it reduces and develops a thick, syrup-like consistency.", "name": "Reduce and serve. Bring the sauce to a simmer over medium-high heat and cook for approximately 5 minutes, or until it reduces and develops a thick, syrup-like consistency.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-14"}, {"@type": "HowToStep", "text": "Cut the rested pork into substantial slices measuring roughly 1.5–2 cm (⅗–⅘ inch) thick. Arrange on a serving platter and generously spoon the warm honey butter sauce over the pork.", "name": "Cut the rested pork into substantial slices measuring roughly 1.5–2 cm (⅗–⅘ inch) thick. Arrange on a serving platter and generously spoon the warm honey butter sauce over the pork.", "url": "https://erecip.github.io/en/crock-pot-pork-loin-roast/#wprm-recipe-43691-step-0-15"}], "recipeCategory": ["Main Course"], "keywords": "Crock Pot Pork Loin Roast"}</script>
