m bars and spread it gently using the back of a spoon.", "name": "Whisk the powdered sugar, vanilla extract, and 1 tablespoon of milk into the browned butter until smooth. Adjust consistency by adding more powdered sugar or milk if needed. Pour the warm frosting over the warm bars and spread it gently using the back of a spoon.", "url": "https://erecip.github.io/en/banana-bread-brownies-recipe/#wprm-recipe-1011-step-0-5"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"]}</script>
