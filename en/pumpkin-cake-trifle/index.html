    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Cake Trifle", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender pumpkin-spiced cake is layered with whipped cream in individual serving glasses to create a simple, festive dessert. Chilling the assembled trifles before serving allows the cake and cream to develop a refreshing, cohesive texture.", "datePublished": "2018-08-09T04:29:59+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/pumpkin-cake-trifle2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/pumpkin-cake-trifle2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/pumpkin-cake-trifle2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/pumpkin-cake-trifle2.png"], "prepTime": "PT15M", "cookTime": "PT6M", "totalTime": "PT21M", "recipeIngredient": ["15 ounces pumpkin purée", "3  large eggs", "¼ teaspoon ground ginger", "Nonstick cooking spray (as required for coating the baking sheet)", "1 tablespoon ground nutmeg", "1  box yellow cake mix (such as Duncan Hines)", "1 teaspoon ground cinnamon (preferably fresh and aromatic)", "Whipped cream (homemade or prepared, in the desired quantity)", "Individual serving glasses"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Thoroughly coat a cookie sheet with nonstick cooking spray so the baked cake can be removed without sticking.", "name": "Preheat the oven to 350°F (175°C). Thoroughly coat a cookie sheet with nonstick cooking spray so the baked cake can be removed without sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/#wprm-recipe-40691-step-0-0"}, {"@type": "HowToStep", "text": "Place the yellow cake mix, nutmeg, cinnamon, and ginger in a large mixing bowl. Whisk until the spices are evenly dispersed and any visible lumps have been broken apart.", "name": "Place the yellow cake mix, nutmeg, cinnamon, and ginger in a large mixing bowl. Whisk until the spices are evenly dispersed and any visible lumps have been broken apart.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/#wprm-recipe-40691-step-0-1"}, {"@type": "HowToStep", "text": "Add the eggs and pumpkin purée to the seasoned cake mixture. Stir briefly by hand, then blend with a hand mixer on low speed until the batter becomes smooth and uniform. Avoid excessive mixing, which may introduce too much air.", "name": "Add the eggs and pumpkin purée to the seasoned cake mixture. Stir briefly by hand, then blend with a hand mixer on low speed until the batter becomes smooth and uniform. Avoid excessive mixing, which may introduce too much air.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/#wprm-recipe-40691-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared cookie sheet and spread it into an even layer. Bake for 6–10 minutes, checking at the earliest suggested time. The cake is finished when a toothpick inserted into the center comes out clean.", "name": "Transfer the batter to the prepared cookie sheet and spread it into an even layer. Bake for 6–10 minutes, checking at the earliest suggested time. The cake is finished when a toothpick inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/#wprm-recipe-40691-step-0-3"}, {"@type": "HowToStep", "text": "Remove the baking sheet from the oven and allow the cake to cool completely without taking it off the sheet. Once cooled, cut it with a knife or cookie cutters into pieces sized to fit the serving glasses.", "name": "Remove the baking sheet from the oven and allow the cake to cool completely without taking it off the sheet. Once cooled, cut it with a knife or cookie cutters into pieces sized to fit the serving glasses.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/#wprm-recipe-40691-step-0-4"}, {"@type": "HowToStep", "text": "Arrange alternating layers of pumpkin cake pieces and whipped cream inside each glass. Continue layering until the glasses reach the preferred level. For a polished presentation, apply the whipped cream with a piping bag and finish each trifle with a decorative swirl.", "name": "Arrange alternating layers of pumpkin cake pieces and whipped cream inside each glass. Continue layering until the glasses reach the preferred level. For a polished presentation, apply the whipped cream with a piping bag and finish each trifle with a decorative swirl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/#wprm-recipe-40691-step-0-5"}, {"@type": "HowToStep", "text": "Refrigerate the completed trifles until serving time. Present them well chilled.", "name": "Refrigerate the completed trifles until serving time. Present them well chilled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cake-trifle/#wprm-recipe-40691-step-0-6"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Cake Trifle"}</script>
