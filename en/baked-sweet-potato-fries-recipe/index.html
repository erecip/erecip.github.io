    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "THE BEST BAKED SWEET POTATO FRIES RECIPE", "author": {"@type": "Person", "name": "BenDes"}, "description": "Discover how to create deliciously crispy, oven-baked sweet potato fries at home! With a light coating of olive oil and a touch of sea salt, these sweet potato fries make a nutritious and flavorful side dish or snack. Perfect for any occasion, this recipe yields four servings.", "datePublished": "2024-03-21T12:31:23+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-10T202830.722.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-10T202830.722-500x380.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-10T202830.722-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-10T202830.722-480x270.png"], "prepTime": "PT10M", "cookTime": "PT35M", "totalTime": "PT45M", "recipeIngredient": ["2 pounds sweet potatoes (approximately 2 medium-large or 3 medium)", "2 tablespoons extra-virgin olive oil", "1 tablespoon cornstarch", "½ teaspoon fine sea salt", "Optional seasonings: freshly ground black pepper (cayenne pepper, garlic powder)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat your oven to 425°F (220°C) and position racks in the lower and upper thirds of the oven. Ensure the top rack is no closer than 6 inches from the heat source. Line two large, rimmed baking sheets with parchment paper to prevent the fries from sticking.", "name": "Preheat your oven to 425°F (220°C) and position racks in the lower and upper thirds of the oven. Ensure the top rack is no closer than 6 inches from the heat source. Line two large, rimmed baking sheets with parchment paper to prevent the fries from sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-sweet-potato-fries-recipe/#wprm-recipe-1569-step-0-0"}, {"@type": "HowToStep", "text": "Peel the sweet potatoes and slice them into fry-shaped pieces, each roughly ¼ inch wide and thick. Ensure the fries are similar in size for even baking. Distribute half of the cut fries onto each prepared baking sheet.", "name": "Peel the sweet potatoes and slice them into fry-shaped pieces, each roughly ¼ inch wide and thick. Ensure the fries are similar in size for even baking. Distribute half of the cut fries onto each prepared baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-sweet-potato-fries-recipe/#wprm-recipe-1569-step-0-1"}, {"@type": "HowToStep", "text": "Evenly sprinkle cornstarch over the sweet potato fries (about 1 ½ teaspoons per baking sheet) and add sea salt (¼ teaspoon per sheet). Toss the fries until they are uniformly coated in the cornstarch. Drizzle with olive oil (1 tablespoon per sheet) and toss again, ensuring no powdery spots remain. Use your fingers to rub in any visible cornstarch, if needed.", "name": "Evenly sprinkle cornstarch over the sweet potato fries (about 1 ½ teaspoons per baking sheet) and add sea salt (¼ teaspoon per sheet). Toss the fries until they are uniformly coated in the cornstarch. Drizzle with olive oil (1 tablespoon per sheet) and toss again, ensuring no powdery spots remain. Use your fingers to rub in any visible cornstarch, if needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-sweet-potato-fries-recipe/#wprm-recipe-1569-step-0-2"}, {"@type": "HowToStep", "text": "Arrange the fries in a single, even layer, making sure they are not overcrowded to promote crispiness. Bake for 20 minutes, then flip the fries to ensure they cook evenly on all sides. Use a metal spatula to flip them in sections, turning about ten fries at a time with a swift flick of the wrist.", "name": "Arrange the fries in a single, even layer, making sure they are not overcrowded to promote crispiness. Bake for 20 minutes, then flip the fries to ensure they cook evenly on all sides. Use a metal spatula to flip them in sections, turning about ten fries at a time with a swift flick of the wrist.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-sweet-potato-fries-recipe/#wprm-recipe-1569-step-0-3"}, {"@type": "HowToStep", "text": "Reorganize the fries into even layers on the baking sheets, shifting any overly browned fries toward the middle of the pan to prevent overcooking. Return the sheets to the oven, swapping their positions so the former top pan is now on the lower rack, and vice versa.", "name": "Reorganize the fries into even layers on the baking sheets, shifting any overly browned fries toward the middle of the pan to prevent overcooking. Return the sheets to the oven, swapping their positions so the former top pan is now on the lower rack, and vice versa.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-sweet-potato-fries-recipe/#wprm-recipe-1569-step-0-4"}, {"@type": "HowToStep", "text": "Continue baking for an additional 10 to 18 minutes, or until the fries achieve a crispy texture. Look for a change from a shiny orange to a more matte finish with puffed-up surfaces. Monitor closely, as fries can quickly go from crisp to burnt. The batch on the lower rack may finish a few minutes before the one on top. Slight browning at the edges is fine—it will add a caramelized flavor rather than a burnt taste.", "name": "Continue baking for an additional 10 to 18 minutes, or until the fries achieve a crispy texture. Look for a change from a shiny orange to a more matte finish with puffed-up surfaces. Monitor closely, as fries can quickly go from crisp to burnt. The batch on the lower rack may finish a few minutes before the one on top. Slight browning at the edges is fine—it will add a caramelized flavor rather than a burnt taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-sweet-potato-fries-recipe/#wprm-recipe-1569-step-0-5"}, {"@type": "HowToStep", "text": "Once baked, season the fries with additional spices to your preference. Consider adding freshly ground black pepper, a scant ¼ teaspoon of cayenne pepper, or a dash of garlic powder. Serve the fries warm.", "name": "Once baked, season the fries with additional spices to your preference. Consider adding freshly ground black pepper, a scant ¼ teaspoon of cayenne pepper, or a dash of garlic powder. Serve the fries warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-sweet-potato-fries-recipe/#wprm-recipe-1569-step-0-6"}], "recipeCategory": ["Side Dish", "Snack"], "recipeCuisine": ["American"]}</script>
