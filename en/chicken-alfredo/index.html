. Season the sauce with salt and black pepper, adjusting to taste. Set aside over low heat.", "name": "Lower the heat slightly and pour in the heavy cream. Let the cream warm through for 2 to 3 minutes without boiling. Then, gradually stir in the Parmigiano-Reggiano until it melts completely and the sauce thickens, about 3 to 4 minutes. Season the sauce with salt and black pepper, adjusting to taste. Set aside over low heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-alfredo/#wprm-recipe-32317-step-0-5"}, {"@type": "HowToStep", "text": "Meanwhile, in a separate large pot of vigorously boiling salted water, cook the fettuccine following the package guidelines until al dente, stirring occasionally to prevent sticking.", "name": "Meanwhile, in a separate large pot of vigorously boiling salted water, cook the fettuccine following the package guidelines until al dente, stirring occasionally to prevent sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-alfredo/#wprm-recipe-32317-step-0-6"}, {"@type": "HowToStep", "text": "Once cooked, drain the pasta but reserve about a cup of the starchy water. Add the drained fettuccine to the pan with the Alfredo sauce, tossing gently to coat all strands evenly. If the sauce appears too thick, mix in a ladle or two of the reserved pasta water to loosen it to the desired consistency.", "name": "Once cooked, drain the pasta but reserve about a cup of the starchy water. Add the drained fettuccine to the pan with the Alfredo sauce, tossing gently to coat all strands evenly. If the sauce appears too thick, mix in a ladle or two of the reserved pasta water to loosen it to the desired consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-alfredo/#wprm-recipe-32317-step-0-7"}, {"@type": "HowToStep", "text": "Slice the reserved chicken and serve it over the sauced fettuccine.", "name": "Slice the reserved chicken and serve it over the sauced fettuccine.", "u
