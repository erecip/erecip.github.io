le bag or large bowl, and pour in the marinade. Seal the bag, removing excess air, and turn it a few times to evenly coat the steak. Let it marinate for at least 1 hour and up to 4 hours in the refrigerator, turning occasionally.", "name": "Place the steak pieces in a gallon-size resealable bag or large bowl, and pour in the marinade. Seal the bag, removing excess air, and turn it a few times to evenly coat the steak. Let it marinate for at least 1 hour and up to 4 hours in the refrigerator, turning occasionally.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carne-asada-street-tacos-recipe/#wprm-recipe-4768-step-0-1"}, {"@type": "HowToStep", "text": "Heat the remaining tablespoon of canola oil in a large skillet over medium-high heat. Add the marinated steak along with any excess marinade, cooking while stirring frequently until the steak browns and the marinade reduces, about 5-6 minutes, or until your preferred level of doneness is reached.", "name": "Heat the remaining tablespoon of canola oil in a large skillet over medium-high heat. Add the marinated steak along with any excess marinade, cooking while stirring frequently until the steak browns and the marinade reduces, about 5-6 minutes, or until your preferred level of doneness is reached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carne-asada-street-tacos-recipe/#wprm-recipe-4768-step-0-2"}, {"@type": "HowToStep", "text": "Arrange the cooked steak onto warmed tortillas, and top with diced onion, chopped cilantro, and a squeeze of fresh lime", "name": "Arrange the cooked steak onto warmed tortillas, and top with diced onion, chopped cilantro, and a squeeze of fresh lime", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carne-asada-street-tacos-recipe/#wprm-recipe-4768-step-0-3"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Mexican"], "keywords": "Carne Asada Street Tacos Recipe"}</script>
