edium mixing bowl. Add the ricotta, pecorino, grated garlic, dried oregano, lemon zest, red pepper flakes, sea salt, and several turns of freshly ground black pepper.", "name": "Make the spinach-ricotta filling. Place the prepared spinach in a medium mixing bowl. Add the ricotta, pecorino, grated garlic, dried oregano, lemon zest, red pepper flakes, sea salt, and several turns of freshly ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-shells-recipe/#wprm-recipe-43506-step-0-4"}, {"@type": "HowToStep", "text": "Stir until all of the ingredients are evenly incorporated and the filling is thoroughly combined.", "name": "Stir until all of the ingredients are evenly incorporated and the filling is thoroughly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-shells-recipe/#wprm-recipe-43506-step-0-5"}, {"@type": "HowToStep", "text": "Fill and arrange the shells. Spread the marinara sauce in an even layer across the bottom of a 9 × 13-inch baking dish.", "name": "Fill and arrange the shells. Spread the marinara sauce in an even layer across the bottom of a 9 × 13-inch baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-shells-recipe/#wprm-recipe-43506-step-0-6"}, {"@type": "HowToStep", "text": "Spoon the spinach and cheese mixture into each cooked pasta shell. Arrange the filled shells over the marinara sauce in the prepared baking dish.", "name": "Spoon the spinach and cheese mixture into each cooked pasta shell. Arrange the filled shells over the marinara sauce in the prepared baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-shells-recipe/#wprm-recipe-43506-step-0-7"}, {"@type": "HowToStep", "text": "Bake and serve. Cover the baking dish with foil and transfer it to the preheated oven. Bake for 20 minutes.", "name": "Bake and serve. Cover the baking dish with foil and transfer it to the preheated oven. Bake for 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-shells-recipe/#wprm-recipe-43506-step-0-8"}, {"@type": "HowToStep", "text": "Remove the dish from the oven and serve the stuffed shells while hot. Garnish with chopped fresh parsley and accompany with additional marinara sauce on the side, if desired.", "name": "Remove the dish from the oven and serve the stuffed shells while hot. Garnish with chopped fresh parsley and accompany with additional marinara sauce on the side, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-shells-recipe/#wprm-recipe-43506-step-0-9"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Christmas Stuffed Shells Recipe"}</script>
