arm the olive oil in a large pot set over medium-high heat. Introduce the diced onion and sauté for about 4 minutes until softened. Incorporate the garlic and cook for an additional 30 seconds, stirring continuously.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chicken-chili-recipe/#wprm-recipe-12283-step-0-0"}, {"@type": "HowToStep", "text": "Pour in the chicken broth and stir in the green chilies, cumin, paprika, oregano, coriander, cayenne pepper, and a pinch of salt and black pepper. Bring the mixture to a gentle boil, then lower the heat and allow it to simmer for 15 minutes.", "name": "Pour in the chicken broth and stir in the green chilies, cumin, paprika, oregano, coriander, cayenne pepper, and a pinch of salt and black pepper. Bring the mixture to a gentle boil, then lower the heat and allow it to simmer for 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chicken-chili-recipe/#wprm-recipe-12283-step-0-1"}, {"@type": "HowToStep", "text": "Meanwhile, rinse and drain the cannellini beans. Measure out 1 cup of the beans and set the remainder aside. Transfer the measured beans to a food processor with 1/4 cup of the hot broth; blend until nearly smooth.", "name": "Meanwhile, rinse and drain the cannellini beans. Measure out 1 cup of the beans and set the remainder aside. Transfer the measured beans to a food processor with 1/4 cup of the hot broth; blend until nearly smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chicken-chili-recipe/#wprm-recipe-12283-step-0-2"}, {"@type": "HowToStep", "text": "Add the Neufchatel cheese to the simmering pot, stirring until it melts. Incorporate the corn, the reserved whole beans, and the pureed beans, blending everything well. Let the mixture continue to simmer for an additional 5 to 10 minutes.", "name": "Add the Neufchatel cheese to the simmering pot, stirring until it melts. Incorporate the corn, the reserved whole beans, and the pureed beans, blending everything well. Let the mixture continue to simmer for an additional 5 to 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chicken-chili-recipe/#wprm-recipe-12283-step-0-3"}, {"@type": "HowToStep", "text": "Finally, mix in the shredded chicken, fresh lime juice, and chopped cilantro. Serve hot, garnished with extra cilantro, Monterey Jack cheese, avocado slices, and tortilla chips if desired.", "name": "Finally, mix in the shredded chicken, fresh lime juice, and chopped cilantro. Serve hot, garnished with extra cilantro, Monterey Jack cheese, avocado slices, and tortilla chips if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chicken-chili-recipe/#wprm-recipe-12283-step-0-4"}], "recipeCategory": ["Dinner", "Soup"], "recipeCuisine": ["American"], "keywords": "White Chicken Chili Recipe"}</script>
