    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Braised Short Ribs", "author": {"@type": "Person", "name": "BenDes"}, "description": "Succulent beef short ribs are slow-braised in a luxurious wine-infused sauce until melt-in-your-mouth tender, then served atop velvety mashed potatoes. This one-pot masterpiece is a quintessential comfort dish perfect for a hearty meal.", "datePublished": "2024-08-21T07:41:55+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/08/braised-short-ribs-recipe-1.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/08/braised-short-ribs-recipe-1-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/08/braised-short-ribs-recipe-1-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/08/braised-short-ribs-recipe-1-480x270.png"], "prepTime": "PT20M", "cookTime": "PT160M", "totalTime": "PT180M", "recipeIngredient": ["2  sprigs fresh rosemary", "1  yellow onion (finely diced)", "1/4 cup all-purpose flour", "2 1/2 cups low-sodium beef broth", "3 Tablespoons olive oil", "2  sprigs fresh thyme", "3  carrots (chopped)", "8  bone-in beef short ribs", "Salt and black pepper (to taste)", "1 cup dry red wine (e.g., Pinot Noir or Cote du Rhone)", "2 Tablespoons tomato paste"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. In a Dutch oven or another heavy, oven-safe pot with a lid, heat one tablespoon of olive oil over medium-high heat. Add the diced onion and chopped carrots, sautéing until softened while stirring frequently. Transfer the vegetables to a plate once cooked.", "name": "Preheat the oven to 350°F. In a Dutch oven or another heavy, oven-safe pot with a lid, heat one tablespoon of olive oil over medium-high heat. Add the diced onion and chopped carrots, sautéing until softened while stirring frequently. Transfer the vegetables to a plate once cooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/braised-short-ribs-recipe/#wprm-recipe-25614-step-0-0"}, {"@type": "HowToStep", "text": "Generously season the short ribs with salt and pepper, then dredge them evenly in the flour. Increase the heat to high, add the remaining two tablespoons of olive oil to the pot, and sear the ribs until browned on all sides—approximately 45 seconds per side. Remove and set aside.", "name": "Generously season the short ribs with salt and pepper, then dredge them evenly in the flour. Increase the heat to high, add the remaining two tablespoons of olive oil to the pot, and sear the ribs until browned on all sides—approximately 45 seconds per side. Remove and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/braised-short-ribs-recipe/#wprm-recipe-25614-step-0-1"}, {"@type": "HowToStep", "text": "Pour in the red wine to deglaze the pot, scraping up any caramelized bits from the bottom. Allow the liquid to reach a boil and simmer for 2 minutes.", "name": "Pour in the red wine to deglaze the pot, scraping up any caramelized bits from the bottom. Allow the liquid to reach a boil and simmer for 2 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/braised-short-ribs-recipe/#wprm-recipe-25614-step-0-2"}, {"@type": "HowToStep", "text": "Introduce the beef broth to the pan, followed by the tomato paste. Season again with salt and freshly ground black pepper, tasting to adjust as needed. Return the ribs, cooked vegetables, and whole sprigs of rosemary and thyme to the pot.", "name": "Introduce the beef broth to the pan, followed by the tomato paste. Season again with salt and freshly ground black pepper, tasting to adjust as needed. Return the ribs, cooked vegetables, and whole sprigs of rosemary and thyme to the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/braised-short-ribs-recipe/#wprm-recipe-25614-step-0-3"}, {"@type": "HowToStep", "text": "Secure the lid and transfer the pot to the oven. Braise at 350°F for 2 hours, then lower the temperature to 325°F and continue cooking for an additional 30 to 45 minutes, or until the meat is exceedingly tender and nearly falling off the bone.", "name": "Secure the lid and transfer the pot to the oven. Braise at 350°F for 2 hours, then lower the temperature to 325°F and continue cooking for an additional 30 to 45 minutes, or until the meat is exceedingly tender and nearly falling off the bone.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/braised-short-ribs-recipe/#wprm-recipe-25614-step-0-4"}, {"@type": "HowToStep", "text": "Carefully remove the pot from the oven and let it rest, covered, for 20 minutes. Skim any fat from the surface of the sauce prior to serving.", "name": "Carefully remove the pot from the oven and let it rest, covered, for 20 minutes. Skim any fat from the surface of the sauce prior to serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/braised-short-ribs-recipe/#wprm-recipe-25614-step-0-5"}, {"@type": "HowToStep", "text": "Spoon the short ribs over a bed of creamy mashed potatoes, ladling over some of the braising liquid as a savory gravy.", "name": "Spoon the short ribs over a bed of creamy mashed potatoes, ladling over some of the braising liquid as a savory gravy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/braised-short-ribs-recipe/#wprm-recipe-25614-step-0-6"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Braised Short Ribs Recipe"}</script>
