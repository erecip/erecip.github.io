    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cinnamon Apple Bread Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This delightful Cinnamon Apple Bread features a tender, moist crumb with a flavorful swirl of cinnamon and brown sugar apples at its heart. Finished with a delicate cinnamon glaze, it’s the perfect autumn treat that will quickly become a household favorite.", "datePublished": "2024-01-09T21:45:21+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Cinnamon-Apple-Bread-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Cinnamon-Apple-Bread-1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Cinnamon-Apple-Bread-1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Cinnamon-Apple-Bread-1-480x270.jpg"], "recipeYield": ["10", "10 servings"], "prepTime": "PT15M", "cookTime": "PT50M", "totalTime": "PT65M", "recipeIngredient": ["1/2 cup granulated sugar", "1/2 teaspoon salt", "1-1/2 teaspoons baking powder", "2  large eggs", "1/2 cup unsalted butter (softened (1 stick))", "1-1/2 cups all-purpose flour", "2 teaspoons vanilla extract", "1/2 cup milk", "1  large apple (peeled, cored, and diced)", "1-1/2 teaspoons ground cinnamon", "1/2 cup light brown sugar (packed)", "2 tablespoons brown sugar", "1/4 teaspoon ground cinnamon", "2 tablespoons water", "3/4 cups confectioners’ sugar", "1/4 teaspoon ground cinnamon"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat your oven to 350°F (175°C). Grease and flour an 8.5 x 4.5-inch loaf pan thoroughly.", "name": "Preheat your oven to 350°F (175°C). Grease and flour an 8.5 x 4.5-inch loaf pan thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-0"}, {"@type": "HowToStep", "text": "In a medium bowl, whisk together the all-purpose flour, baking powder, and salt. Set the dry mixture aside.", "name": "In a medium bowl, whisk together the all-purpose flour, baking powder, and salt. Set the dry mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-1"}, {"@type": "HowToStep", "text": "In a separate large mixing bowl, use an electric mixer to beat the softened butter, granulated sugar, and vanilla extract on medium-high speed. Continue beating until the mixture becomes light and fluffy, around 3 to 4 minutes, occasionally scraping down the sides of the bowl.", "name": "In a separate large mixing bowl, use an electric mixer to beat the softened butter, granulated sugar, and vanilla extract on medium-high speed. Continue beating until the mixture becomes light and fluffy, around 3 to 4 minutes, occasionally scraping down the sides of the bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-2"}, {"@type": "HowToStep", "text": "Incorporate the eggs one at a time, mixing well after each addition until fully blended.", "name": "Incorporate the eggs one at a time, mixing well after each addition until fully blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-3"}, {"@type": "HowToStep", "text": "With the mixer on low, gradually add half of the dry flour mixture, followed by half of the milk. Continue alternating with the remaining flour mixture and milk, ensuring all ingredients are well combined.", "name": "With the mixer on low, gradually add half of the dry flour mixture, followed by half of the milk. Continue alternating with the remaining flour mixture and milk, ensuring all ingredients are well combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-4"}, {"@type": "HowToStep", "text": "For the apple mixture, combine the chopped apple pieces, ground cinnamon, and brown sugar in a separate bowl. Stir until the apples are well coated, then set aside.", "name": "For the apple mixture, combine the chopped apple pieces, ground cinnamon, and brown sugar in a separate bowl. Stir until the apples are well coated, then set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-5"}, {"@type": "HowToStep", "text": "To prepare the topping, mix together the brown sugar and ground cinnamon in a small bowl. Set this mixture aside for later use.", "name": "To prepare the topping, mix together the brown sugar and ground cinnamon in a small bowl. Set this mixture aside for later use.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-6"}, {"@type": "HowToStep", "text": "Pour half of the batter into the prepared loaf pan. Evenly spread half of the apple mixture over the batter. Using a knife or skewer, gently swirl through the batter without over-mixing to create a marbled effect.", "name": "Pour half of the batter into the prepared loaf pan. Evenly spread half of the apple mixture over the batter. Using a knife or skewer, gently swirl through the batter without over-mixing to create a marbled effect.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-7"}, {"@type": "HowToStep", "text": "Add the remaining batter on top, followed by the rest of the apple mixture. Swirl again lightly with a knife. Sprinkle the prepared cinnamon-sugar topping over the surface.", "name": "Add the remaining batter on top, followed by the rest of the apple mixture. Swirl again lightly with a knife. Sprinkle the prepared cinnamon-sugar topping over the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-8"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 45 to 55 minutes. The bread is done when a toothpick or cake tester inserted in the center comes out mostly clean, with a few moist crumbs attached.", "name": "Bake in the preheated oven for 45 to 55 minutes. The bread is done when a toothpick or cake tester inserted in the center comes out mostly clean, with a few moist crumbs attached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-9"}, {"@type": "HowToStep", "text": "Allow the bread to cool in the pan for 15 to 20 minutes. In the meantime, prepare the glaze by whisking together the confectioners' sugar, water, and cinnamon.", "name": "Allow the bread to cool in the pan for 15 to 20 minutes. In the meantime, prepare the glaze by whisking together the confectioners' sugar, water, and cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-10"}, {"@type": "HowToStep", "text": "Remove the bread from the pan and transfer it to a cooling rack. Drizzle the cinnamon glaze over the warm bread. Let it cool completely before slicing.", "name": "Remove the bread from the pan and transfer it to a cooling rack. Drizzle the cinnamon glaze over the warm bread. Let it cool completely before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cinnamon-apple-bread-recipe/#wprm-recipe-2067-step-0-11"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Cinnamon Apple Bread Recipe"}</script>
