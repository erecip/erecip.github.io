    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Crockpot Tuna Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy slow-cooker tuna casserole featuring tender egg noodles, savory tuna, mushrooms, peas, and cheddar cheese. Condensed mushroom soup and seasoned chicken broth create a rich sauce, while an optional breadcrumb finish provides a light contrasting texture.", "datePublished": "2020-03-19T20:35:27+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/crockpot-tuna-casserole/crockpot-tuna-casserole2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-tuna-casserole/crockpot-tuna-casserole2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-tuna-casserole/crockpot-tuna-casserole2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-tuna-casserole/crockpot-tuna-casserole2.png"], "cookTime": "PT180M", "totalTime": "PT180M", "recipeIngredient": ["3  cans tuna (5 oz each, thoroughly drained)", "1½ cups frozen green peas", "½ teaspoon freshly ground black pepper", "1 cup onion (diced)", "8 oz canned sliced mushrooms (drained)", "12 oz dry egg noodles", "2 tablespoons Italian seasoning blend", "1  can condensed cream of mushroom soup (10.5 oz)", "½ teaspoon salt", "2 cups chicken broth for the slow-cooker preparation", "1 cup cheddar cheese (shredded)", "¼ cup dry breadcrumbs (optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of salted water to a rolling boil. Add the 12 ounces of egg noodles and cook according to the package directions, stopping when they are slightly underdone and still pleasantly firm. Drain the noodles thoroughly and reserve them. Avoid cooking them completely at this stage, as they will continue softening in the casserole.", "name": "Bring a large pot of salted water to a rolling boil. Add the 12 ounces of egg noodles and cook according to the package directions, stopping when they are slightly underdone and still pleasantly firm. Drain the noodles thoroughly and reserve them. Avoid cooking them completely at this stage, as they will continue softening in the casserole.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-tuna-casserole/#wprm-recipe-41205-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, whisk the condensed cream of mushroom soup with 2 cups of chicken broth until the mixture becomes smooth and evenly blended. Add the drained tuna, diced onion, Italian seasoning, salt, and black pepper, stirring until the ingredients are distributed throughout the sauce. Carefully fold in the partially cooked egg noodles until they are uniformly coated.", "name": "In a large mixing bowl, whisk the condensed cream of mushroom soup with 2 cups of chicken broth until the mixture becomes smooth and evenly blended. Add the drained tuna, diced onion, Italian seasoning, salt, and black pepper, stirring until the ingredients are distributed throughout the sauce. Carefully fold in the partially cooked egg noodles until they are uniformly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-tuna-casserole/#wprm-recipe-41205-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the prepared noodle mixture to the slow cooker and cover with the lid. Cook on LOW for 3 to 4 hours or on HIGH for 1½ to 2 hours, stirring occasionally when practical, until the casserole is thoroughly heated and the flavors have combined.", "name": "Transfer the prepared noodle mixture to the slow cooker and cover with the lid. Cook on LOW for 3 to 4 hours or on HIGH for 1½ to 2 hours, stirring occasionally when practical, until the casserole is thoroughly heated and the flavors have combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-tuna-casserole/#wprm-recipe-41205-step-0-2"}, {"@type": "HowToStep", "text": "Approximately 15 minutes before the cooking period is complete, remove the lid and gently stir in the drained sliced mushrooms and frozen peas. Add ½ cup of the shredded cheddar cheese and fold it evenly through the casserole. Scatter the remaining ½ cup of cheddar over the surface, replace the lid, and continue cooking for the final 15 minutes, allowing the cheese to melt.", "name": "Approximately 15 minutes before the cooking period is complete, remove the lid and gently stir in the drained sliced mushrooms and frozen peas. Add ½ cup of the shredded cheddar cheese and fold it evenly through the casserole. Scatter the remaining ½ cup of cheddar over the surface, replace the lid, and continue cooking for the final 15 minutes, allowing the cheese to melt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-tuna-casserole/#wprm-recipe-41205-step-0-3"}, {"@type": "HowToStep", "text": "Once the cheese has melted and the casserole is piping hot, sprinkle up to ¼ cup of dry breadcrumbs over the surface, if using. Serve the casserole hot.", "name": "Once the cheese has melted and the casserole is piping hot, sprinkle up to ¼ cup of dry breadcrumbs over the surface, if using. Serve the casserole hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-tuna-casserole/#wprm-recipe-41205-step-0-4"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["American"], "keywords": "Crockpot Tuna Casserole"}</script>
