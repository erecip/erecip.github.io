    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Aglio Olio Pasta Salad with Kale", "author": {"@type": "Person", "name": "BenDes"}, "description": "A bright, garlicky spaghetti dish inspired by classic aglio e olio, finished with tender lacinato kale, briny capers, lemon, parsley, crisp garlic breadcrumbs, and Parmesan or vegan Parmesan.", "datePublished": "2024-03-20T01:37:00+00:00", "image": ["https://erecip.github.io/wp-content/uploads/Aglio-olio-pasta-salad-with-kale-edited.png", "https://erecip.github.io/wp-content/uploads/Aglio-olio-pasta-salad-with-kale-edited-500x500.png", "https://erecip.github.io/wp-content/uploads/Aglio-olio-pasta-salad-with-kale-edited-500x375.png", "https://erecip.github.io/wp-content/uploads/Aglio-olio-pasta-salad-with-kale-edited-480x270.png"], "recipeYield": ["4"], "prepTime": "PT10M", "cookTime": "PT15M", "totalTime": "PT25M", "recipeIngredient": ["0.3 cups panko breadcrumbs", "0.5 teaspoons sea salt", "1  lacinato kale (stems removed and leaves roughly chopped)", "0.3 cups freshly chopped parsley", "12 ounces spaghetti", "1 teaspoons finely grated lemon zest", "0.3 teaspoons freshly cracked black pepper", "0.3 cups extra-virgin olive oil", "1 tablespoons olive oil (reserved for toasting the breadcrumbs)", "0.3 cups Parmesan or vegan Parmesan (for finishing)", "4  garlic cloves (cut into thin slices)", "1 cups reserved pasta cooking water", "2 tablespoons capers (rinsed well and drained)", "0.4 teaspoons crushed red pepper flakes", "1 teaspoons fresh lemon juice", "1  garlic clove (thinly sliced, for the breadcrumb topping)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of well-salted water to a rolling boil. Add the spaghetti and cook according to the package instructions until al dente. Before draining, remove and reserve at least 1 cup of the starchy cooking water, as it will help form the sauce.", "name": "Bring a large pot of well-salted water to a rolling boil. Add the spaghetti and cook according to the package instructions until al dente. Before draining, remove and reserve at least 1 cup of the starchy cooking water, as it will help form the sauce.", "url": "https://erecip.github.io/en/aglio-olio-pasta-salad-with-kale/#wprm-recipe-34753-step-0-0"}, {"@type": "HowToStep", "text": "While the pasta is cooking, place 1 tablespoon olive oil in a small skillet over medium heat. Add the thinly sliced garlic clove for the topping along with the panko breadcrumbs. Stir often until the crumbs turn a deep golden color and develop a toasted, nutty aroma, about 3 to 3 minutes 30 seconds. Transfer the mixture to a small plate and set it aside. Remove the garlic slice if it has become overly dark.", "name": "While the pasta is cooking, place 1 tablespoon olive oil in a small skillet over medium heat. Add the thinly sliced garlic clove for the topping along with the panko breadcrumbs. Stir often until the crumbs turn a deep golden color and develop a toasted, nutty aroma, about 3 to 3 minutes 30 seconds. Transfer the mixture to a small plate and set it aside. Remove the garlic slice if it has become overly dark.", "url": "https://erecip.github.io/en/aglio-olio-pasta-salad-with-kale/#wprm-recipe-34753-step-0-1"}, {"@type": "HowToStep", "text": "In a large skillet set over medium heat, warm the extra-virgin olive oil. Add the 4 thinly sliced garlic cloves and the crushed red pepper flakes. Cook for 30 seconds to 1 minute, stirring now and then, until the garlic is lightly golden at the edges. Keep the heat controlled so the garlic gently flavors the oil without scorching.", "name": "In a large skillet set over medium heat, warm the extra-virgin olive oil. Add the 4 thinly sliced garlic cloves and the crushed red pepper flakes. Cook for 30 seconds to 1 minute, stirring now and then, until the garlic is lightly golden at the edges. Keep the heat controlled so the garlic gently flavors the oil without scorching.", "url": "https://erecip.github.io/en/aglio-olio-pasta-salad-with-kale/#wprm-recipe-34753-step-0-2"}, {"@type": "HowToStep", "text": "Add the chopped lacinato kale, sea salt, and freshly cracked black pepper to the skillet. Toss with tongs and cook for about 1 minute, just until the kale softens slightly and turns vivid green.", "name": "Add the chopped lacinato kale, sea salt, and freshly cracked black pepper to the skillet. Toss with tongs and cook for about 1 minute, just until the kale softens slightly and turns vivid green.", "url": "https://erecip.github.io/en/aglio-olio-pasta-salad-with-kale/#wprm-recipe-34753-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the drained spaghetti to the skillet. Add the capers, fresh lemon juice, lemon zest, and ½ cup of the reserved pasta water. Toss everything together over medium heat for 1 to 1 minute 30 seconds, adding more pasta water in small splashes as needed until the strands are evenly coated in a light, glossy sauce. Taste and adjust the salt only if necessary, remembering that the capers contribute saltiness.", "name": "Transfer the drained spaghetti to the skillet. Add the capers, fresh lemon juice, lemon zest, and ½ cup of the reserved pasta water. Toss everything together over medium heat for 1 to 1 minute 30 seconds, adding more pasta water in small splashes as needed until the strands are evenly coated in a light, glossy sauce. Taste and adjust the salt only if necessary, remembering that the capers contribute saltiness.", "url": "https://erecip.github.io/en/aglio-olio-pasta-salad-with-kale/#wprm-recipe-34753-step-0-4"}, {"@type": "HowToStep", "text": "Divide the pasta among serving bowls. Garnish each portion with chopped parsley, the crisp garlic breadcrumbs, and Parmesan or vegan Parmesan. Serve immediately while the breadcrumb topping remains crunchy.", "name": "Divide the pasta among serving bowls. Garnish each portion with chopped parsley, the crisp garlic breadcrumbs, and Parmesan or vegan Parmesan. Serve immediately while the breadcrumb topping remains crunchy.", "url": "https://erecip.github.io/en/aglio-olio-pasta-salad-with-kale/#wprm-recipe-34753-step-0-5"}], "recipeCategory": ["Pasta"], "recipeCuisine": ["Italian"], "keywords": "aglio olio pasta salad"}</script>
