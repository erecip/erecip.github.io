    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cranberry Pineapple Pecan Cheese Ball", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, savory-sweet cheese ball combining creamy cheese, sharp cheddar, crisp bacon, ranch seasoning, pineapple, and green onion. The exterior is finished with a textured coating of tart dried cranberries and crunchy pecans.", "datePublished": "2023-02-23T21:23:34+00:00", "image": ["https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/cranberry-pineapple-pecan-cheese-ball.png", "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/cranberry-pineapple-pecan-cheese-ball.png", "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/cranberry-pineapple-pecan-cheese-ball.png", "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/cranberry-pineapple-pecan-cheese-ball.png"], "totalTime": "PT65M", "recipeIngredient": ["20 oz canned crushed pineapple (thoroughly drained)", "1 oz ranch seasoning mix", "6 slices bacon", "2  packages cream cheese (8 oz each, softened to room temperature)", "1/4 cup thinly sliced green onions (optional)", "1 cup finely shredded sharp cheddar cheese", "3/4 cup dried cranberries", "3/4 cup pecans (roughly chopped)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Arrange the 6 bacon slices in a large skillet over medium-low heat. Cook gradually, turning the slices with tongs whenever the edges begin to curl so that they brown evenly.", "name": "Arrange the 6 bacon slices in a large skillet over medium-low heat. Cook gradually, turning the slices with tongs whenever the edges begin to curl so that they brown evenly.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-0"}, {"@type": "HowToStep", "text": "Continue cooking until the bacon is crisp. Transfer it to a paper towel-lined plate to drain away the excess grease. Once cool enough to handle, chop the bacon into coarse pieces.", "name": "Continue cooking until the bacon is crisp. Transfer it to a paper towel-lined plate to drain away the excess grease. Once cool enough to handle, chop the bacon into coarse pieces.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-1"}, {"@type": "HowToStep", "text": "While the bacon cooks, place the 20 ounces of crushed pineapple in a strainer. Firmly press the fruit with the back of a spoon to extract as much liquid as possible.", "name": "While the bacon cooks, place the 20 ounces of crushed pineapple in a strainer. Firmly press the fruit with the back of a spoon to extract as much liquid as possible.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the drained pineapple to paper towels and squeeze out any remaining moisture. The pineapple should be very dry, leaving slightly more than 1/2 cup after draining. Removing the excess juice is essential for preventing the cheese mixture from becoming watery.", "name": "Transfer the drained pineapple to paper towels and squeeze out any remaining moisture. The pineapple should be very dry, leaving slightly more than 1/2 cup after draining. Removing the excess juice is essential for preventing the cheese mixture from becoming watery.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-3"}, {"@type": "HowToStep", "text": "Place the chopped bacon, drained pineapple, softened cream cheese, shredded sharp cheddar, ranch seasoning, and optional sliced green onions in a large mixing bowl.", "name": "Place the chopped bacon, drained pineapple, softened cream cheese, shredded sharp cheddar, ranch seasoning, and optional sliced green onions in a large mixing bowl.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-4"}, {"@type": "HowToStep", "text": "Using a silicone spatula, thoroughly combine the ingredients until they are evenly distributed and the mixture forms a uniform, cohesive base.", "name": "Using a silicone spatula, thoroughly combine the ingredients until they are evenly distributed and the mixture forms a uniform, cohesive base.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-5"}, {"@type": "HowToStep", "text": "Using your hands, shape the prepared cheese mixture into a compact ball.", "name": "Using your hands, shape the prepared cheese mixture into a compact ball.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-6"}, {"@type": "HowToStep", "text": "Wrap the ball securely in plastic wrap and transfer it to the freezer for 5 minutes. This brief chilling period firms the exterior and makes the coating process easier.", "name": "Wrap the ball securely in plastic wrap and transfer it to the freezer for 5 minutes. This brief chilling period firms the exterior and makes the coating process easier.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-7"}, {"@type": "HowToStep", "text": "Spread the coarsely chopped pecans and dried cranberries together over a plate or cutting board.", "name": "Spread the coarsely chopped pecans and dried cranberries together over a plate or cutting board.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-8"}, {"@type": "HowToStep", "text": "Unwrap the chilled cheese ball and roll it through the cranberry and pecan mixture. Gently press the coating against the surface as needed so that it adheres evenly on all sides.", "name": "Unwrap the chilled cheese ball and roll it through the cranberry and pecan mixture. Gently press the coating against the surface as needed so that it adheres evenly on all sides.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-9"}, {"@type": "HowToStep", "text": "Wrap the coated cheese ball again in plastic wrap and refrigerate it for at least 1 hour. This chilling period allows the flavors to blend while also giving the cheese ball a firmer texture for serving.", "name": "Wrap the coated cheese ball again in plastic wrap and refrigerate it for at least 1 hour. This chilling period allows the flavors to blend while also giving the cheese ball a firmer texture for serving.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-10"}, {"@type": "HowToStep", "text": "Serve chilled with crackers, pretzels, pita chips, or fresh vegetables.", "name": "Serve chilled with crackers, pretzels, pita chips, or fresh vegetables.", "url": "https://erecip.github.io/en/cranberry-pineapple-pecan-cheese-ball/#wprm-recipe-46139-step-0-11"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["American"], "keywords": "Cranberry Pineapple Pecan Cheese Ball"}</script>
