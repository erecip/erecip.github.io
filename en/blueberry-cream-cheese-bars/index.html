    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Blueberry Cream Cheese Bars", "author": {"@type": "Person", "name": "BenDes"}, "description": "These blueberry cream cheese bars combine a buttery oatmeal crust with a smooth, vanilla-scented cream cheese filling, fresh berries, and a golden crumble topping. Chilling the finished dessert allows the creamy center to firm properly and produces clean, evenly shaped slices.", "datePublished": "2018-06-17T21:36:15+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/blueberry-cream-cheese-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/blueberry-cream-cheese-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/blueberry-cream-cheese-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/blueberry-cream-cheese-bars.png"], "cookTime": "PT33M", "totalTime": "PT33M", "recipeIngredient": ["1⅓ cups uncooked quick-cooking oats", "⅔ cup firmly packed brown sugar", "¾ cup butter (softened)", "½ teaspoon salt", "1⅓ cups all-purpose flour", "½ teaspoon baking soda", "⅔ cup granulated sugar", "1 cup blueberries or raspberries", "One 14-ounce can sweetened condensed milk", "1  large egg yolk", "1 teaspoon vanilla extract", "8 ounces cream cheese (preferably at room temperature)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Line a 9 × 13-inch baking pan with parchment paper or coat it evenly with nonstick cooking spray. Properly preparing the pan will prevent sticking and simplify removal after baking.", "name": "Preheat the oven to 350°F (175°C). Line a 9 × 13-inch baking pan with parchment paper or coat it evenly with nonstick cooking spray. Properly preparing the pan will prevent sticking and simplify removal after baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened butter, granulated sugar, and packed brown sugar in a large mixing bowl. Blend until the ingredients are evenly combined.", "name": "Place the softened butter, granulated sugar, and packed brown sugar in a large mixing bowl. Blend until the ingredients are evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-1"}, {"@type": "HowToStep", "text": "Add the quick oats, all-purpose flour, baking soda, and salt. Stir only until a cohesive, crumbly mixture forms.", "name": "Add the quick oats, all-purpose flour, baking soda, and salt. Stir only until a cohesive, crumbly mixture forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-2"}, {"@type": "HowToStep", "text": "Transfer half of the oatmeal mixture to the prepared pan. Press it firmly and evenly across the bottom to form the crust.", "name": "Transfer half of the oatmeal mixture to the prepared pan. Press it firmly and evenly across the bottom to form the crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-3"}, {"@type": "HowToStep", "text": "Bake the crust for 13 minutes.", "name": "Bake the crust for 13 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-4"}, {"@type": "HowToStep", "text": "While the crust is baking, place the cream cheese in a separate large bowl. Beat or stir with a spatula until completely smooth.", "name": "While the crust is baking, place the cream cheese in a separate large bowl. Beat or stir with a spatula until completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-5"}, {"@type": "HowToStep", "text": "Gradually incorporate the sweetened condensed milk, mixing continuously to maintain an even, creamy consistency.", "name": "Gradually incorporate the sweetened condensed milk, mixing continuously to maintain an even, creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-6"}, {"@type": "HowToStep", "text": "Add the vanilla extract and egg yolk. Mix thoroughly until the filling is smooth and fully blended.", "name": "Add the vanilla extract and egg yolk. Mix thoroughly until the filling is smooth and fully blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-7"}, {"@type": "HowToStep", "text": "Remove the partially baked crust from the oven. Pour the cream cheese filling over the hot base and spread it into an even layer.", "name": "Remove the partially baked crust from the oven. Pour the cream cheese filling over the hot base and spread it into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-8"}, {"@type": "HowToStep", "text": "Distribute the blueberries or raspberries uniformly over the filling.", "name": "Distribute the blueberries or raspberries uniformly over the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-9"}, {"@type": "HowToStep", "text": "Scatter the reserved oatmeal crumble across the fruit. Press the topping down gently so it adheres without compressing the filling.", "name": "Scatter the reserved oatmeal crumble across the fruit. Press the topping down gently so it adheres without compressing the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-10"}, {"@type": "HowToStep", "text": "Return the assembled pan to the oven and bake for an additional 20–25 minutes, or until the outer edges are golden brown.", "name": "Return the assembled pan to the oven and bake for an additional 20–25 minutes, or until the outer edges are golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-11"}, {"@type": "HowToStep", "text": "The center should appear set while retaining a slight jiggle. Avoid overbaking, as this may cause the cream cheese layer to become dry rather than creamy.", "name": "The center should appear set while retaining a slight jiggle. Avoid overbaking, as this may cause the cream cheese layer to become dry rather than creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-12"}, {"@type": "HowToStep", "text": "Allow the bars to cool completely in the pan. Once cooled, refrigerate them for a few hours so the filling can become firm.", "name": "Allow the bars to cool completely in the pan. Once cooled, refrigerate them for a few hours so the filling can become firm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-13"}, {"@type": "HowToStep", "text": "Cut the chilled dessert into squares and serve cold or lightly chilled.", "name": "Cut the chilled dessert into squares and serve cold or lightly chilled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blueberry-cream-cheese-bars/#wprm-recipe-40794-step-0-14"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Blueberry Cream Cheese Bars"}</script>
