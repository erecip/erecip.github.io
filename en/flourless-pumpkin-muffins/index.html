umpkin-muffins/#wprm-recipe-40754-step-0-0"}, {"@type": "HowToStep", "text": "Place the almond flour, sugar or sugar-free substitute, baking powder, salt, and cinnamon or pumpkin pie spice in a large mixing bowl. Stir until the ingredients are evenly distributed.", "name": "Place the almond flour, sugar or sugar-free substitute, baking powder, salt, and cinnamon or pumpkin pie spice in a large mixing bowl. Stir until the ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flourless-pumpkin-muffins/#wprm-recipe-40754-step-0-1"}, {"@type": "HowToStep", "text": "Incorporate the pumpkin purée and the egg or prepared flaxseed egg into the dry mixture. Whisk until a smooth, uniform batter forms.", "name": "Incorporate the pumpkin purée and the egg or prepared flaxseed egg into the dry mixture. Whisk until a smooth, uniform batter forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flourless-pumpkin-muffins/#wprm-recipe-40754-step-0-2"}, {"@type": "HowToStep", "text": "Fold a handful of miniature chocolate chips gently into the batter, if using.", "name": "Fold a handful of miniature chocolate chips gently into the batter, if using.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flourless-pumpkin-muffins/#wprm-recipe-40754-step-0-3"}, {"@type": "HowToStep", "text": "Distribute the mixture evenly among the prepared muffin cups.", "name": "Distribute the mixture evenly among the prepared muffin cups.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flourless-pumpkin-muffins/#wprm-recipe-40754-step-0-4"}, {"@type": "HowToStep", "text": "Set the pan on the center oven rack. Bake mini muffins for 10 minutes. When using a standard-size muffin tin, bake for approximately 15 minutes. The muffins should appear set and lightly golden when finished.", "name": "Set the pan on the center oven rack. Bake mini muffins for 10 minutes. When using a standard-size muffin tin, bake for approximately 15 minutes. The muffins should appear set and lightly golden when finished.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flourless-pumpkin-muffins/#wprm-recipe-40754-step-0-5"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and leave the muffins in the tin while they cool. They will continue to become firmer as their temperature decreases.", "name": "Remove the pan from the oven and leave the muffins in the tin while they cool. They will continue to become firmer as their temperature decreases.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flourless-pumpkin-muffins/#wprm-recipe-40754-step-0-6"}, {"@type": "HowToStep", "text": "Once fully cooled, carefully run a knife around the edge of each muffin. Gently lift the muffins from the tin and serve.", "name": "Once fully cooled, carefully run a knife around the edge of each muffin. Gently lift the muffins from the tin and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flourless-pumpkin-muffins/#wprm-recipe-40754-step-0-7"}], "recipeCategory": ["Breakfast", "Snack"], "recipeCuisine": ["American"], "keywords": "Flourless Pumpkin Muffins"}</script>
