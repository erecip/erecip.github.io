oon of olive oil in a large Dutch oven or heavy-bottomed pot over medium heat. Add the ground turkey, breaking it apart with a utensil as it cooks. Sauté until browned and cooked through. Remove from the pot and set aside.", "name": "Warm 1 tablespoon of olive oil in a large Dutch oven or heavy-bottomed pot over medium heat. Add the ground turkey, breaking it apart with a utensil as it cooks. Sauté until browned and cooked through. Remove from the pot and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/turkey-chili-recipe/#wprm-recipe-32557-step-0-0"}, {"@type": "HowToStep", "text": "Pour the remaining 2 tablespoons of olive oil into the same pot. Once heated, incorporate the onion, celery, poblano pepper, shredded carrot, and garlic. Sauté for about 5 minutes, stirring now and then until the vegetables begin to soften and release their aromas.", "name": "Pour the remaining 2 tablespoons of olive oil into the same pot. Once heated, incorporate the onion, celery, poblano pepper, shredded carrot, and garlic. Sauté for about 5 minutes, stirring now and then until the vegetables begin to soften and release their aromas.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/turkey-chili-recipe/#wprm-recipe-32557-step-0-1"}, {"@type": "HowToStep", "text": "In a separate bowl, thoroughly blend together the masa harina, cumin, garlic powder, kosher salt, chili powders, paprika, cinnamon, and coriander.", "name": "In a separate bowl, thoroughly blend together the masa harina, cumin, garlic powder, kosher salt, chili powders, paprika, cinnamon, and coriander.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/turkey-chili-recipe/#wprm-recipe-32557-step-0-2"}, {"@type": "HowToStep", "text": "Return the cooked turkey to the pot. Evenly sprinkle the prepared seasoning mixture over the contents and stir until the spices are well integrated.", "name": "Return the cooked turkey to the pot. Evenly sprinkle the prepared seasoning mixture over the contents and stir until the spices are well integrated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/turkey-chili-recipe/#wprm-recipe-32557-step-0-3"}, {"@type": "HowToStep", "text": "Pour in the chicken broth, then add the diced tomatoes with green chilies, kidney beans, black beans, and creamed corn. Stir thoroughly to combine.", "name": "Pour in the chicken broth, then add the diced tomatoes with green chilies, kidney beans, black beans, and creamed corn. Stir thoroughly to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/turkey-chili-recipe/#wprm-recipe-32557-step-0-4"}, {"@type": "HowToStep", "text": "Bring the chili to a gentle boil, then reduce the heat and allow it to simmer uncovered for 20 to 30 minutes, stirring occasionally to prevent sticking on the bottom.", "name": "Bring the chili to a gentle boil, then reduce the heat and allow it to simmer uncovered for 20 to 30 minutes, stirring occasionally to prevent sticking on the bottom.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/turkey-chili-recipe/#wprm-recipe-32557-step-0-5"}, {"@type": "HowToStep", "text": "Serve warm with optional garnishes such as sour cream, shredded cheddar, chopped scallions, or a dash of hot sauce.", "name": "Serve warm with optional garnishes such as sour cream, shredded cheddar, chopped scallions, or a dash of hot sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/turkey-chili-recipe/#wprm-recipe-32557-step-0-6"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "turkey chili recipe"}</script>
