h and uniform.", "name": "In a separate bowl, blend 1 cup pumpkin purée, 2 large eggs, 1/4 cup melted salted butter, 1/3 cup milk, 1/4 cup vegetable oil, and 2 teaspoons vanilla extract until the wet mixture is smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dunkin-pumpkin-muffins/#wprm-recipe-41092-step-0-4"}, {"@type": "HowToStep", "text": "Add the dry mixture to the pumpkin mixture in two additions, stirring gently after each addition. Mix only until no visible streaks of dry flour remain. The finished batter should be thick and may retain a slightly lumpy texture; avoid excessive mixing.", "name": "Add the dry mixture to the pumpkin mixture in two additions, stirring gently after each addition. Mix only until no visible streaks of dry flour remain. The finished batter should be thick and may retain a slightly lumpy texture; avoid excessive mixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dunkin-pumpkin-muffins/#wprm-recipe-41092-step-0-5"}, {"@type": "HowToStep", "text": "Distribute the batter evenly among the 12 prepared muffin cups, filling each cup approximately three-quarters full.", "name": "Distribute the batter evenly among the 12 prepared muffin cups, filling each cup approximately three-quarters full.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dunkin-pumpkin-muffins/#wprm-recipe-41092-step-0-6"}, {"@type": "HowToStep", "text": "Generously scatter the prepared streusel over the surface of each muffin, dividing it as evenly as possible among the cups.", "name": "Generously scatter the prepared streusel over the surface of each muffin, dividing it as evenly as possible among the cups.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dunkin-pumpkin-muffins/#wprm-recipe-41092-step-0-7"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 22–25 minutes, or until a toothpick or skewer inserted into the center of a muffin emerges mostly clean.", "name": "Bake in the preheated oven for 22–25 minutes, or until a toothpick or skewer inserted into the center of a muffin emerges mostly clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dunkin-pumpkin-muffins/#wprm-recipe-41092-step-0-8"}, {"@type": "HowToStep", "text": "Allow the baked muffins to rest in the pan for several minutes. Transfer them carefully to a wire cooling rack and leave them to cool until they are still slightly warm but comfortable to handle.", "name": "Allow the baked muffins to rest in the pan for several minutes. Transfer them carefully to a wire cooling rack and leave them to cool until they are still slightly warm but comfortable to handle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dunkin-pumpkin-muffins/#wprm-recipe-41092-step-0-9"}, {"@type": "HowToStep", "text": "To prepare the glaze, whisk together 1 cup sifted powdered sugar, 2–3 tablespoons milk, and 1/2 teaspoon vanilla extract in a small bowl. Continue whisking until the mixture becomes smooth and reaches a consistency suitable for drizzling.", "name": "To prepare the glaze, whisk together 1 cup sifted powdered sugar, 2–3 tablespoons milk, and 1/2 teaspoon vanilla extract in a small bowl. Continue whisking until the mixture becomes smooth and reaches a consistency suitable for drizzling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dunkin-pumpkin-muffins/#wprm-recipe-41092-step-0-10"}, {"@type": "HowToStep", "text": "Spoon or drizzle the vanilla glaze over the slightly cooled muffins, allowing some of it to run naturally down the sides. Let the muffins cool a little further before serving.", "name": "Spoon or drizzle the vanilla glaze over the slightly cooled muffins, allowing some of it to run naturally down the sides. Let the muffins cool a little further before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dunkin-pumpkin-muffins/#wprm-recipe-41092-step-0-11"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Dunkin Pumpkin Muffins"}</script>
