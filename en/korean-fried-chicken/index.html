    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Korean Fried Chicken", "author": {"@type": "Person", "name": "BenDes"}, "description": "A beloved Korean appetizer, this fried chicken features an irresistible contrast of extra-crispy texture and a rich coating of sweet, spicy, and sticky sauce. The double-frying technique ensures exceptional crunch, while the signature glaze delivers deep umami flavor with a kick of heat.", "datePublished": "2024-09-01T17:42:17+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/korean-fried-chicken.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/korean-fried-chicken.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/korean-fried-chicken.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/korean-fried-chicken.jpg"], "prepTime": "PT10M", "cookTime": "PT30M", "totalTime": "PT40M", "recipeIngredient": ["2 tsp minced ginger", "1/2 tsp ground black pepper", "1.4 kg 3 lbs whole chicken, cut into pieces or use wings, drumsticks, or boneless thigh; rinsed", "Some cooking oil for deep frying (e.g., rice bran oil)", "2 Tbsp rice wine", "1 tsp fine sea salt", "1 cup potato starch or corn starch", "2 Tbsp minced garlic", "1/4 cup honey", "2 Tbsp soy sauce", "3 Tbsp tomato ketchup", "1 Tbsp sesame oil", "1/4 cup brown sugar", "2 Tbsp gochujang (Korean chili paste, add 1/2 Tbsp more for extra heat)", "Toasted sesame seeds", "Finely chopped or shredded green onion"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a large bowl, combine the chicken with rice wine, minced ginger, sea salt, and black pepper. Mix thoroughly until the pieces are evenly seasoned.", "name": "In a large bowl, combine the chicken with rice wine, minced ginger, sea salt, and black pepper. Mix thoroughly until the pieces are evenly seasoned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/#wprm-recipe-31218-step-0-0"}, {"@type": "HowToStep", "text": "Dredge the seasoned chicken in the starch, ensuring each piece is well-coated. For best results, dip each piece individually into the starch, roll it around, then set aside.", "name": "Dredge the seasoned chicken in the starch, ensuring each piece is well-coated. For best results, dip each piece individually into the starch, roll it around, then set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/#wprm-recipe-31218-step-0-1"}, {"@type": "HowToStep", "text": "Heat a deep pan or fryer with a generous quantity of oil to 175°C / 347°F. Once the oil reaches the correct temperature, begin frying the chicken in batches. Cook each batch for approximately 3–5 minutes, depending on the size of the pieces. Avoid overcrowding the pan to maintain oil temperature.", "name": "Heat a deep pan or fryer with a generous quantity of oil to 175°C / 347°F. Once the oil reaches the correct temperature, begin frying the chicken in batches. Cook each batch for approximately 3–5 minutes, depending on the size of the pieces. Avoid overcrowding the pan to maintain oil temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/#wprm-recipe-31218-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the first-fried chicken pieces onto a paper towel-lined tray. Skim off any residue from the oil with a strainer or skimmer.", "name": "Transfer the first-fried chicken pieces onto a paper towel-lined tray. Skim off any residue from the oil with a strainer or skimmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/#wprm-recipe-31218-step-0-3"}, {"@type": "HowToStep", "text": "Reheat the oil back to 175°C / 347°F. Fry the chicken a second time for 2–3 minutes, or until the coating becomes a deep golden brown and crisp. Set aside once done.", "name": "Reheat the oil back to 175°C / 347°F. Fry the chicken a second time for 2–3 minutes, or until the coating becomes a deep golden brown and crisp. Set aside once done.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/#wprm-recipe-31218-step-0-4"}, {"@type": "HowToStep", "text": "In a separate saucepan over medium-low heat, combine all sauce ingredients: ketchup, gochujang, honey, brown sugar, soy sauce, garlic, and sesame oil. Stir continuously until the sauce comes to a gentle boil, then remove it from the heat.", "name": "In a separate saucepan over medium-low heat, combine all sauce ingredients: ketchup, gochujang, honey, brown sugar, soy sauce, garlic, and sesame oil. Stir continuously until the sauce comes to a gentle boil, then remove it from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/#wprm-recipe-31218-step-0-5"}, {"@type": "HowToStep", "text": "Place the double-fried chicken in a large mixing bowl. Pour the sauce over the chicken and gently toss until evenly coated. Alternatively, serve the sauce on the side for dipping.", "name": "Place the double-fried chicken in a large mixing bowl. Pour the sauce over the chicken and gently toss until evenly coated. Alternatively, serve the sauce on the side for dipping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/#wprm-recipe-31218-step-0-6"}, {"@type": "HowToStep", "text": "Garnish with sesame seeds and green onion if desired. Serve immediately for optimal texture. Refrigerated leftovers may be consumed cold within one to two days, though they will lose their crunch.", "name": "Garnish with sesame seeds and green onion if desired. Serve immediately for optimal texture. Refrigerated leftovers may be consumed cold within one to two days, though they will lose their crunch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/korean-fried-chicken/#wprm-recipe-31218-step-0-7"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["korean"], "keywords": "korean fried chicken"}</script>
