e diced bacon and cook until it is golden and crisp, with most of the fat rendered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-beans/#wprm-recipe-31979-step-0-1"}, {"@type": "HowToStep", "text": "Add the onion, bell pepper, and garlic to the pan. Sauté the vegetables, stirring frequently, until softened—about 5 minutes.", "name": "Add the onion, bell pepper, and garlic to the pan. Sauté the vegetables, stirring frequently, until softened—about 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-beans/#wprm-recipe-31979-step-0-2"}, {"@type": "HowToStep", "text": "Incorporate the smoked paprika, chipotle chili powder, salt, and black pepper. Cook the mixture for an additional 1 to 2 minutes until aromatic.", "name": "Incorporate the smoked paprika, chipotle chili powder, salt, and black pepper. Cook the mixture for an additional 1 to 2 minutes until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-beans/#wprm-recipe-31979-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the apple cider vinegar, BBQ sauce, ketchup, Dijon mustard, and brown sugar. Mix thoroughly until all ingredients are fully combined.", "name": "Stir in the apple cider vinegar, BBQ sauce, ketchup, Dijon mustard, and brown sugar. Mix thoroughly until all ingredients are fully combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-beans/#wprm-recipe-31979-step-0-4"}, {"@type": "HowToStep", "text": "Fold in the baked beans directly from the cans, stirring gently. Allow the mixture to come to a light boil, then remove from heat. Taste at this point and adjust seasoning if needed. For added richness, optionally lay the remaining slices of bacon across the top.", "name": "Fold in the baked beans directly from the cans, stirring gently. Allow the mixture to come to a light boil, then remove from heat. Taste at this point and adjust seasoning if needed. For added richness, optionally lay the remainin
