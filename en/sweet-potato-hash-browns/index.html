    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sweet Potato Hash Browns", "author": {"@type": "Person", "name": "BenDes"}, "description": "Crisp, golden sweet potato hash browns made with grated onion, eggs, a small amount of flour, and simple seasoning. These patties are pan-fried until browned, then finished in the oven for a tender interior and a lightly crisp exterior.", "datePublished": "2023-03-14T16:17:45+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/Sweet-Potato-Hash-Browns2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/Sweet-Potato-Hash-Browns2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/Sweet-Potato-Hash-Browns2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/Sweet-Potato-Hash-Browns2.png"], "prepTime": "PT15M", "cookTime": "PT22M", "totalTime": "PT37M", "recipeIngredient": ["2  large eggs (ideally free-range for deeper-colored yolks)", "1  large sweet potato (skin removed)", "1/4 teaspoon kosher salt", "2 tablespoons finely grated onion", "1 tablespoon all-purpose flour", "2 tablespoons vegetable oil (or another mild neutral oil such as canola)", "Black pepper (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-0"}, {"@type": "HowToStep", "text": "Coarsely shred the peeled sweet potato using a grater.", "name": "Coarsely shred the peeled sweet potato using a grater.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the grated sweet potato to a bowl filled with cold water. Stir it gently several times, then pour off the water.", "name": "Transfer the grated sweet potato to a bowl filled with cold water. Stir it gently several times, then pour off the water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-2"}, {"@type": "HowToStep", "text": "Press the shredded sweet potato firmly in a clean kitchen towel or paper towels to remove as much moisture as possible.", "name": "Press the shredded sweet potato firmly in a clean kitchen towel or paper towels to remove as much moisture as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-3"}, {"@type": "HowToStep", "text": "In a medium mixing bowl, combine the drained sweet potato with the grated onion, eggs, flour, kosher salt, and black pepper to taste.", "name": "In a medium mixing bowl, combine the drained sweet potato with the grated onion, eggs, flour, kosher salt, and black pepper to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-4"}, {"@type": "HowToStep", "text": "Stir until the mixture is evenly blended and holds together as a uniform hash brown batter.", "name": "Stir until the mixture is evenly blended and holds together as a uniform hash brown batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-5"}, {"@type": "HowToStep", "text": "Warm the oil in a large skillet set over medium heat.", "name": "Warm the oil in a large skillet set over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-6"}, {"@type": "HowToStep", "text": "Drop heaping tablespoons of the sweet potato mixture into the hot oil.", "name": "Drop heaping tablespoons of the sweet potato mixture into the hot oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-7"}, {"@type": "HowToStep", "text": "Use a spatula to lightly press each portion into an even patty shape.", "name": "Use a spatula to lightly press each portion into an even patty shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-8"}, {"@type": "HowToStep", "text": "Cook the patties for 3–4 minutes, or until the underside becomes lightly browned.", "name": "Cook the patties for 3–4 minutes, or until the underside becomes lightly browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-9"}, {"@type": "HowToStep", "text": "Turn each hash brown over and cook for another 3–4 minutes, allowing the second side to brown as well.", "name": "Turn each hash brown over and cook for another 3–4 minutes, allowing the second side to brown as well.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-10"}, {"@type": "HowToStep", "text": "As each batch finishes browning, transfer the patties to a baking sheet.", "name": "As each batch finishes browning, transfer the patties to a baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-11"}, {"@type": "HowToStep", "text": "Place the filled baking sheet in the preheated oven.", "name": "Place the filled baking sheet in the preheated oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-12"}, {"@type": "HowToStep", "text": "Bake for 10–12 minutes, or until the hash browns are fully cooked and crisp.", "name": "Bake for 10–12 minutes, or until the hash browns are fully cooked and crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-hash-browns/#wprm-recipe-38707-step-0-13"}, {"@type": "HowToStep", "text": "Remove the hash browns from the oven once baking is complete.", "n
