    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Crockpot Lasagna", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty slow-cooker lasagna prepared with layers of uncooked pasta, seasoned beef marinara, creamy ricotta, and melted mozzarella. The lasagna cooks directly in the crockpot until the noodles become tender and the cheese is hot and bubbly.", "datePublished": "2022-01-27T22:36:22+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/crockpot-lasagna2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/crockpot-lasagna2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/crockpot-lasagna2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/crockpot-lasagna2.png"], "totalTime": "PT180M", "recipeIngredient": ["2  garlic cloves (finely minced)", "2  jars tomato sauce (22 fl oz each, such as Classico Sweet Basil Marinara)", "1/2 teaspoon freshly ground black pepper", "1  yellow onion (chopped)", "1 pound extra-lean ground beef", "1/2 cup water", "1/2 teaspoon salt", "Nonstick cooking spray (as needed)", "2 cups mozzarella cheese (shredded)", "1 pound dry (uncooked lasagna noodles)", "1  container ricotta cheese (16.8 ounces)", "Chopped fresh basil or parsley (as desired)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the ground beef in a large frying pan over medium-high heat. Cook while breaking the meat into smaller pieces with a spoon.", "name": "Place the ground beef in a large frying pan over medium-high heat. Cook while breaking the meat into smaller pieces with a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-0"}, {"@type": "HowToStep", "text": "When the beef is almost completely cooked, add the chopped onion and minced garlic. Season the mixture with the salt and black pepper, then stir thoroughly.", "name": "When the beef is almost completely cooked, add the chopped onion and minced garlic. Season the mixture with the salt and black pepper, then stir thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-1"}, {"@type": "HowToStep", "text": "Pour one 22-fluid-ounce jar of tomato sauce into the skillet. Stir until evenly combined and allow the mixture to cook for another couple of minutes so the flavors come together. Remove the pan from the heat.", "name": "Pour one 22-fluid-ounce jar of tomato sauce into the skillet. Stir until evenly combined and allow the mixture to cook for another couple of minutes so the flavors come together. Remove the pan from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-2"}, {"@type": "HowToStep", "text": "Coat the interior of the crockpot generously with nonstick cooking spray.", "name": "Coat the interior of the crockpot generously with nonstick cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-3"}, {"@type": "HowToStep", "text": "Spread a small portion of the prepared meat sauce across the bottom, forming a thin and even base.", "name": "Spread a small portion of the prepared meat sauce across the bottom, forming a thin and even base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-4"}, {"@type": "HowToStep", "text": "Arrange a layer of uncooked lasagna noodles over the sauce, snapping the noodles into smaller pieces wherever necessary so they fit inside the slow cooker.", "name": "Arrange a layer of uncooked lasagna noodles over the sauce, snapping the noodles into smaller pieces wherever necessary so they fit inside the slow cooker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-5"}, {"@type": "HowToStep", "text": "Distribute spoonfuls of ricotta over the pasta, followed by a portion of the shredded mozzarella. Cover the cheeses with another layer of the meat sauce.", "name": "Distribute spoonfuls of ricotta over the pasta, followed by a portion of the shredded mozzarella. Cover the cheeses with another layer of the meat sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-6"}, {"@type": "HowToStep", "text": "Continue layering in the same order—lasagna noodles, ricotta, mozzarella, and meat sauce—until the ingredients have been used or the crockpot is filled. This generally produces approximately three layers.", "name": "Continue layering in the same order—lasagna noodles, ricotta, mozzarella, and meat sauce—until the ingredients have been used or the crockpot is filled. This generally produces approximately three layers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-7"}, {"@type": "HowToStep", "text": "Pour the second 22-fluid-ounce jar of tomato sauce evenly across the uppermost layer.", "name": "Pour the second 22-fluid-ounce jar of tomato sauce evenly across the uppermost layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-8"}, {"@type": "HowToStep", "text": "Scatter any remaining mozzarella over the surface.", "name": "Scatter any remaining mozzarella over the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-9"}, {"@type": "HowToStep", "text": "Carefully pour the 1/2 cup of water around the outer edges of the lasagna. This additional moisture helps the uncooked noodles soften evenly while preventing the dish from becoming dry.", "name": "Carefully pour the 1/2 cup of water around the outer edges of the lasagna. This additional moisture helps the uncooked noodles soften evenly while preventing the dish from becoming dry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-10"}, {"@type": "HowToStep", "text": "Cover the crockpot securely. Cook on HIGH for 3 hours or on LOW for 6 hours, continuing until the lasagna noodles are tender and the cheese is thoroughly melted and bubbling.", "name": "Cover the crockpot securely. Cook on HIGH for 3 hours or on LOW for 6 hours, continuing until the lasagna noodles are tender and the cheese is thoroughly melted and bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-11"}, {"@type": "HowToStep", "text": "Allow the finished lasagna to stand for several minutes after cooking.", "name": "Allow the finished lasagna to stand for several minutes after cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-12"}, {"@type": "HowToStep", "text": "Finish with a generous sprinkling of freshly chopped parsley or basil before serving.", "name": "Finish with a generous sprinkling of freshly chopped parsley or basil before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-lasagna/#wprm-recipe-41133-step-0-13"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Crockpot Lasagna"}</script>
