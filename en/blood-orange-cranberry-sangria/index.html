    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Blood Orange Cranberry Sangria", "author": {"@type": "Person", "name": "BenDes"}, "description": "A festive white wine sangria featuring a rich cranberry reduction, freshly squeezed blood orange juice, warming cinnamon, aromatic rosemary, ginger beer, and brandy. Fresh cranberries and thin rounds of blood orange provide a vibrant seasonal presentation, while a cinnamon-coconut sugar rim adds a gently spiced finish.", "datePublished": "2019-01-12T14:11:47+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/blood-orange-cranberry-sangria2.png", "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/blood-orange-cranberry-sangria2.png", "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/blood-orange-cranberry-sangria2.png", "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/blood-orange-cranberry-sangria2.png"], "prepTime": "PT20M", "recipeIngredient": ["2 cups whole cranberries", "1/2 cup water", "3 tablespoons agave syrup; maple syrup (honey, or sugar may also be used)", "3 fluid ounces brandy (or cognac)", "3  blood oranges (skin left on and cut into thin rounds)", "3  cinnamon sticks", "2/3 cup freshly squeezed blood orange juice", "Fresh rosemary sprigs (as needed)", "2 cups fresh or frozen cranberries", "1  standard bottle white wine (preferably Pinot Grigio or Sauvignon Blanc; Chardonnay may also be used)", "2 cups ginger beer", "2 teaspoons ground cinnamon", "Fresh rosemary sprigs", "3 tablespoons coconut sugar", "Cinnamon sticks", "Star anise pods", "Reserved blood orange rind (for moistening the glass rims)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place 2 cups cranberries, 3 tablespoons agave syrup, and 1/2 cup water in a small saucepan. Set the pan over medium heat and bring the contents to a gentle simmer.", "name": "Place 2 cups cranberries, 3 tablespoons agave syrup, and 1/2 cup water in a small saucepan. Set the pan over medium heat and bring the contents to a gentle simmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-0"}, {"@type": "HowToStep", "text": "Allow the mixture to simmer as the cranberries soften and begin to burst. Continue cooking for approximately 2 minutes, then remove the saucepan from the heat.", "name": "Allow the mixture to simmer as the cranberries soften and begin to burst. Continue cooking for approximately 2 minutes, then remove the saucepan from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-1"}, {"@type": "HowToStep", "text": "Leave the cranberry mixture to cool. It will naturally become thicker as it rests.", "name": "Leave the cranberry mixture to cool. It will naturally become thicker as it rests.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-2"}, {"@type": "HowToStep", "text": "While the cranberry reduction is cooling, squeeze enough blood oranges to obtain 2/3 cup fresh juice, which will generally require about 2 large oranges.", "name": "While the cranberry reduction is cooling, squeeze enough blood oranges to obtain 2/3 cup fresh juice, which will generally require about 2 large oranges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-3"}, {"@type": "HowToStep", "text": "Cut the remaining 3 blood oranges into small, thin rounds, keeping the peel intact.", "name": "Cut the remaining 3 blood oranges into small, thin rounds, keeping the peel intact.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-4"}, {"@type": "HowToStep", "text": "Once the cranberry reduction has cooled, transfer it to the bottom of a large pitcher.", "name": "Once the cranberry reduction has cooled, transfer it to the bottom of a large pitcher.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-5"}, {"@type": "HowToStep", "text": "Add the 2/3 cup blood orange juice, the sliced blood oranges, 2 cups cranberries, 3 cinnamon sticks, and several fresh rosemary sprigs.", "name": "Add the 2/3 cup blood orange juice, the sliced blood oranges, 2 cups cranberries, 3 cinnamon sticks, and several fresh rosemary sprigs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-6"}, {"@type": "HowToStep", "text": "Pour 1 bottle of white wine into the pitcher over the prepared cranberry and fruit mixture.", "name": "Pour 1 bottle of white wine into the pitcher over the prepared cranberry and fruit mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-7"}, {"@type": "HowToStep", "text": "Add 2 cups ginger beer followed by 3 fluid ounces brandy or cognac.", "name": "Add 2 cups ginger beer followed by 3 fluid ounces brandy or cognac.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-8"}, {"@type": "HowToStep", "text": "Using a long cocktail stirrer, mix thoroughly until the cranberry reduction has dispersed throughout the sangria and the liquid develops a deep red color.", "name": "Using a long cocktail stirrer, mix thoroughly until the cranberry reduction has dispersed throughout the sangria and the liquid develops a deep red color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-9"}, {"@type": "HowToStep", "text": "Cover the pitcher and refrigerate for a minimum of 2 hours to allow the flavors to combine. For a more developed flavor, the sangria may be chilled overnight.", "name": "Cover the pitcher and refrigerate for a minimum of 2 hours to allow the flavors to combine. For a more developed flavor, the sangria may be chilled overnight.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-10"}, {"@type": "HowToStep", "text": "Combine 3 tablespoons coconut sugar with 2 teaspoons ground cinnamon on a small plate.", "name": "Combine 3 tablespoons coconut sugar with 2 teaspoons ground cinnamon on a small plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-11"}, {"@type": "HowToStep", "text": "Rub a reserved piece of blood orange rind around the rim of each serving glass to lightly moisten it. Keep the glass inverted while doing this so the juice does not run down the exterior.", "name": "Rub a reserved piece of blood orange rind around the rim of each serving glass to lightly moisten it. Keep the glass inverted while doing this so the juice does not run down the exterior.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-12"}, {"@type": "HowToStep", "text": "Dip the moistened edge of each glass into the cinnamon and coconut sugar mixture until evenly coated.", "name": "Dip the moistened edge of each glass into the cinnamon and coconut sugar mixture until evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-13"}, {"@type": "HowToStep", "text": "Ladle the chilled sangria into the prepared glasses, distributing some of the soaked fruit into each serving.", "name": "Ladle the chilled sangria into the prepared glasses, distributing some of the soaked fruit into each serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-14"}, {"@type": "HowToStep", "text": "Finish each glass as desired with a cinnamon stick, a sprig of fresh rosemary, or a star anise pod.", "name": "Finish each glass as desired with a cinnamon stick, a sprig of fresh rosemary, or a star anise pod.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/blood-orange-cranberry-sangria/#wprm-recipe-42691-step-0-15"}], "recipeCategory": ["Cocktail"], "recipeCuisine": ["American"], "keywords": "Blood Orange Cranberry Sangria"}</script>
