xt": "Heat a 10-inch cast-iron or nonstick skillet over medium heat. When the skillet is hot but not smoking, add 1 tablespoon of oil or bacon fat, followed by 1 tablespoon of butter, swirling them together.", "name": "Heat a 10-inch cast-iron or nonstick skillet over medium heat. When the skillet is hot but not smoking, add 1 tablespoon of oil or bacon fat, followed by 1 tablespoon of butter, swirling them together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hash-browns-recipe/#wprm-recipe-11876-step-0-1"}, {"@type": "HowToStep", "text": "Spread the grated potatoes in a uniform layer about 1/3-inch thick. Let them cook undisturbed for 6 minutes, allowing the bottom to develop a crisp, golden crust. If browning too rapidly, reduce the heat.", "name": "Spread the grated potatoes in a uniform layer about 1/3-inch thick. Let them cook undisturbed for 6 minutes, allowing the bottom to develop a crisp, golden crust. If browning too rapidly, reduce the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hash-browns-recipe/#wprm-recipe-11876-step-0-2"}, {"@type": "HowToStep", "text": "Season the top with sea salt and freshly ground pepper.", "name": "Season the top with sea salt and freshly ground pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hash-browns-recipe/#wprm-recipe-11876-step-0-3"}, {"@type": "HowToStep", "text": "Carefully flip the hash browns. If a single flip is difficult, divide them into halves or quarters using a pizza cutter and turn the sections individually.", "name": "Carefully flip the hash browns. If a single flip is difficult, divide them into halves or quarters using a pizza cutter and turn the sections individually.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hash-browns-recipe/#wprm-recipe-11876-step-0-4"}, {"@type": "HowToStep", "text": "Add the remaining tablespoon of oil or bacon fat around the edges and place small dots of the remaining butter near the edges so it
