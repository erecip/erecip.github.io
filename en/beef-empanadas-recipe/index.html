    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Beef Empanadas", "author": {"@type": "Person", "name": "BenDes"}, "description": "Succulent beef and chorizo encased in a buttery, tender shortcrust pastry shell make these empanadas a rich and satisfying offering, ideal for appetizers or mains. Serve with your favorite dipping sauce for a complete indulgence.", "datePublished": "2024-10-18T13:53:15+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/beef-empanadas-recipe/beef-empanadas-recipe2.webp", "https://easy-recipes322.github.io/easy-recipes323/en/beef-empanadas-recipe/beef-empanadas-recipe2.webp", "https://easy-recipes322.github.io/easy-recipes323/en/beef-empanadas-recipe/beef-empanadas-recipe2.webp", "https://easy-recipes322.github.io/easy-recipes323/en/beef-empanadas-recipe/beef-empanadas-recipe2.webp"], "recipeYield": ["10"], "prepTime": "PT45M", "cookTime": "PT50M", "totalTime": "PT275M", "recipeIngredient": ["1 tsp kosher or cooking salt", "1  egg yolk", "2 1/2 cups all-purpose/plain flour", "175 g 12 tbsp unsalted butter, cold and diced into 1 cm cubes", "1/2 cup whole milk (warmed slightly)", "2 tsp tomato paste", "300 g 10 oz ground beef", "3/4 cup low-sodium chicken broth", "1  garlic clove (finely minced)", "120 g 4 oz chorizo", "1/2  onion (finely diced)", "1/3 cup finely sliced green onions", "150 g 5 oz potato, peeled and cubed (approx. 8mm pieces)", "1/2 tsp each of ground cumin (dried oregano, and paprika)", "1/4 tsp cayenne pepper", "1/4 tsp kosher or cooking salt", "1 tbsp olive oil", "1 tsp fresh thyme (finely chopped)", "1/2 cup tomato passata (or substitute with crushed tomatoes or tomato sauce)", "1/4 cup chopped green olives", "2  hard-boiled eggs (peeled and chopped)", "2  eggs (separated; yolks whisked for brushing, whites for sealing)", "Empanada sauce", "Optional: ketchup (spicy ketchup (ketchup + sriracha), pink sauce, taco sauce, or salsa)"], "recipeInstructions": [{"@type": "HowToSection", "name": "Empanada Filling:", "itemListElement": [{"@type": "HowToStep", "text": "Roughly chop the chorizo and process it into a paste using a stick blender. In a large non-stick skillet over high heat, warm the olive oil and sauté the onion and garlic for two minutes. Add the chorizo and cook for another two minutes. Stir in the ground beef and continue cooking until no pink remains. Incorporate the tomato paste and cook for one minute before adding the broth, passata, potato, thyme, oregano, cumin, paprika, cayenne, and salt. Simmer gently for 15 minutes until the potatoes are cooked and the mixture is juicy but not overly liquid. Stir in green onions, then transfer to a bowl and cool completely (approximately two hours).", "name": "Roughly chop the chorizo and process it into a paste using a stick blender. In a large non-stick skillet over high heat, warm the olive oil and sauté the onion and garlic for two minutes. Add the chorizo and cook for another two minutes. Stir in the ground beef and continue cooking until no pink remains. Incorporate the tomato paste and cook for one minute before adding the broth, passata, potato, thyme, oregano, cumin, paprika, cayenne, and salt. Simmer gently for 15 minutes until the potatoes are cooked and the mixture is juicy but not overly liquid. Stir in green onions, then transfer to a bowl and cool completely (approximately two hours).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-empanadas-recipe/#wprm-recipe-25654-step-0-0"}]}, {"@type": "HowToSection", "name": "Empanada Shortcrust Pastry:", "itemListElement": [{"@type": "HowToStep", "text": "Whisk the warm milk and egg yolk in a jug. In a food processor, pulse the flour, salt, and butter until the mixture resembles coarse crumbs, with no pieces larger than a pea. Add the milk-egg mixture and process briefly until a dough forms. Transfer to a floured surface and shape into a 20 cm log. Divide in half, form each into a 2 cm thick disc, wrap in cling film, and chill for 30 minutes or overnight. On a floured surface, roll out one disc to 3 mm thickness and cut out 15 cm circles, storing them layered with paper and covered in the refrigerator.", "name": "Whisk the warm milk and egg yolk in a jug. In a food processor, pulse the flour, salt, and butter until the mixture resembles coarse crumbs, with no pieces larger than a pea. Add the milk-egg mixture and process briefly until a dough forms. Transfer to a floured surface and shape into a 20 cm log. Divide in half, form each into a 2 cm thick disc, wrap in cling film, and chill for 30 minutes or overnight. On a floured surface, roll out one disc to 3 mm thickness and cut out 15 cm circles, storing them layered with paper and covered in the refrigerator.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-empanadas-recipe/#wprm-recipe-25654-step-1-0"}]}, {"@type": "HowToSection", "name": "Assembly and Baking:", "itemListElement": [{"@type": "HowToStep", "text": "Preheat the oven to 220°C (425°F) or 200°C fan-forced. Spoon about 3 tablespoons (55g) of cold, pliable filling onto the upper half of a pastry circle. Flatten slightly into a half-moon shape, maintaining a 1.5 cm border. Add chopped olives and egg pieces. Brush the border with egg white, fold over, press to seal, and remove any trapped air. Crimp edges as desired or leave plain. Arrange on two baking trays, brush with egg yolk, and bake for 20 minutes or until golden and crisp.", "name": "Preheat the oven to 220°C (425°F) or 200°C fan-forced. Spoon about 3 tablespoons (55g) of cold, pliable filling onto the upper half of a pastry circle. Flatten slightly into a half-moon shape, maintaining a 1.5 cm border. Add chopped olives and egg pieces. Brush the border with egg white, fold over, press to seal, and remove any trapped air. Crimp edges as desired or leave plain. Arrange on two baking trays, brush with egg yolk, and bake for 20 minutes or until golden and crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-empanadas-recipe/#wprm-recipe-25654-step-2-0"}, {"@type": "HowToStep", "text": "Serve hot with your choice of dipping sauce.", "name": "Serve hot with your choice of dipping sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-empanadas-recipe/#wprm-recipe-25654-step-2-1"}]}], "recipeCategory": ["Appetizer", "Main Course"], "recipeCuisine": ["brazilian", "south american"], "keywords": "beef empanadas recipe"}</script>
