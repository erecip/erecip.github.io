    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cucumber Pasta Salad", "author": {"@type": "Person", "name": "BenDes"}, "description": "A cool and creamy cucumber pasta salad made with tender penne, crisp English cucumber, mild onion, and a tangy dill dressing. This chilled salad benefits from resting before serving so the flavors can settle into the pasta and vegetables.", "datePublished": "2023-04-03T20:39:58+00:00", "image": ["https://erecip.github.io/wp-content/uploads/Creamy-Cucumber-Pasta-Salad.png", "https://erecip.github.io/wp-content/uploads/Creamy-Cucumber-Pasta-Salad-500x500.png", "https://erecip.github.io/wp-content/uploads/Creamy-Cucumber-Pasta-Salad-500x375.png", "https://erecip.github.io/wp-content/uploads/Creamy-Cucumber-Pasta-Salad-480x270.png"], "totalTime": "PT40M", "recipeIngredient": ["1  English cucumber (cut into ¼-inch pieces)", "8 oz penne pasta", "1/2  white onion (finely minced)", "2 tbsp finely chopped fresh dill", "1/2 cup full-fat sour cream", "Freshly ground black pepper (added to taste)", "1/2 tsp salt", "2 tbsp vinegar", "1 tsp sugar", "1/2 cup mayonnaise (Hellmann’s preferred)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the mayonnaise, sour cream, vinegar, sugar, fresh dill, salt, and black pepper in a small mixing bowl. Stir thoroughly until the dressing is smooth and evenly blended.", "name": "Combine the mayonnaise, sour cream, vinegar, sugar, fresh dill, salt, and black pepper in a small mixing bowl. Stir thoroughly until the dressing is smooth and evenly blended.", "url": "https://erecip.github.io/en/cucumber-pasta-salad/#wprm-recipe-38664-step-0-0"}, {"@type": "HowToStep", "text": "Set the prepared dressing aside so the ingredients have time to meld while the remaining components are prepared.", "name": "Set the prepared dressing aside so the ingredients have time to meld while the remaining components are prepared.", "url": "https://erecip.github.io/en/cucumber-pasta-salad/#wprm-recipe-38664-step-0-1"}, {"@type": "HowToStep", "text": "Thinly slice the white onion and place it in a bowl filled with cold water. Letting the onion rest in the water helps soften its sharper flavor.", "name": "Thinly slice the white onion and place it in a bowl filled with cold water. Letting the onion rest in the water helps soften its sharper flavor.", "url": "https://erecip.github.io/en/cucumber-pasta-salad/#wprm-recipe-38664-step-0-2"}, {"@type": "HowToStep", "text": "Cook the penne until al dente, following the directions on the package. After cooking, rinse the pasta under cold running water to stop the cooking process and cool it completely.", "name": "Cook the penne until al dente, following the directions on the package. After cooking, rinse the pasta under cold running water to stop the cooking process and cool it completely.", "url": "https://erecip.github.io/en/cucumber-pasta-salad/#wprm-recipe-38664-step-0-3"}, {"@type": "HowToStep", "text": "Drain the pasta well, then set it aside until ready to assemble the salad.", "name": "Drain the pasta well, then set it aside until ready to assemble the salad.", "url": "https://erecip.github.io/en/cucumber-pasta-salad/#wprm-recipe-38664-step-0-4"}, {"@type": "HowToStep", "text": "Cut the cucumber in half lengthwise. Scoop out the seeds with a spoon, then slice the cucumber thinly for a crisp, refreshing texture.", "name": "Cut the cucumber in half lengthwise. Scoop out the seeds with a spoon, then slice the cucumber thinly for a crisp, refreshing texture.", "url": "https://erecip.github.io/en/cucumber-pasta-salad/#wprm-recipe-38664-step-0-5"}, {"@type": "HowToStep", "text": "Place the cooled pasta, prepared onion, cucumber, and any additional desired ingredients into a large bowl.", "name": "Place the cooled pasta, prepared onion, cucumber, and any additional desired ingredients into a large bowl.", "url": "https://erecip.github.io/en/cucumber-pasta-salad/#wprm-recipe-38664-step-0-6"}, {"@type": "HowToStep", "text": "Pour the dressing over the salad mixture and toss until the pasta and vegetables are evenly coated.", "name": "Pour the dressing over the salad mixture and toss until the pasta and vegetables are evenly coated.", "url": "https://erecip.github.io/en/cucumber-pasta-salad/#wprm-recipe-38664-step-0-7"}, {"@type": "HowToStep", "text": "Let the salad rest for at least 40 minutes before serving so the dressing can fully season the pasta and vegetables.", "name": "Let the salad rest for at least 40 minutes before serving so the dressing can fully season the pasta and vegetables.", "url": "https://erecip.github.io/en/cucumber-pasta-salad/#wprm-recipe-38664-step-0-8"}], "recipeCategory": ["Salad"], "recipeCuisine": ["American"], "keywords": "Cucumber Pasta Salad"}</script>
