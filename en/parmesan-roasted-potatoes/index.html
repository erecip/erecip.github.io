    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Parmesan Roasted Potatoes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender baby red potatoes are briefly parboiled, coated with garlic, Parmesan, herbs, and olive oil, then roasted until the edges become crisp and deeply golden. A warm parsley-butter finish and optional bacon add extra richness and savory flavor.", "datePublished": "2019-08-08T09:17:25+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/parmesan-roasted-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/parmesan-roasted-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/parmesan-roasted-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/parmesan-roasted-potatoes.png"], "totalTime": "PT45M", "recipeIngredient": ["3/4 cup finely grated Parmesan cheese (approximately 3 oz)", "6  large fresh garlic cloves (finely minced)", "3 lb baby red potatoes (cut into bite-size quarters)", "1 tbsp Italian herb seasoning blend", "Freshly ground black pepper (according to taste)", "1/4 cup olive oil (or an equivalent neutral-flavored oil such as canola)", "Salt (according to taste)", "About 2 tbsp fresh parsley (finely chopped)", "1/2 cup bacon bits (optional)", "1/2 cup unsalted butter"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F. Quarter the baby red potatoes into evenly sized, bite-size pieces so they roast at a consistent rate. Leave the skins intact to retain their texture and flavor.", "name": "Preheat the oven to 400°F. Quarter the baby red potatoes into evenly sized, bite-size pieces so they roast at a consistent rate. Leave the skins intact to retain their texture and flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-0"}, {"@type": "HowToStep", "text": "Bring a large pot of generously salted water to a boil. Add the quartered potatoes and cook for 5–8 minutes, or until they are only slightly tender when pierced with a fork. They should remain firm enough to resist the fork rather than becoming fully soft.", "name": "Bring a large pot of generously salted water to a boil. Add the quartered potatoes and cook for 5–8 minutes, or until they are only slightly tender when pierced with a fork. They should remain firm enough to resist the fork rather than becoming fully soft.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-1"}, {"@type": "HowToStep", "text": "Drain the potatoes thoroughly and set them aside. This brief parboiling stage helps create tender centers while allowing the surfaces to become crisp during roasting.", "name": "Drain the potatoes thoroughly and set them aside. This brief parboiling stage helps create tender centers while allowing the surfaces to become crisp during roasting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-2"}, {"@type": "HowToStep", "text": "While the potatoes are parboiling, place the olive oil and freshly minced garlic in a large mixing bowl. Allow the garlic to rest briefly in the oil, then add the grated Parmesan, Italian herb blend, salt, and freshly ground black pepper.", "name": "While the potatoes are parboiling, place the olive oil and freshly minced garlic in a large mixing bowl. Allow the garlic to rest briefly in the oil, then add the grated Parmesan, Italian herb blend, salt, and freshly ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-3"}, {"@type": "HowToStep", "text": "Whisk or stir the mixture until the seasonings and cheese are evenly distributed.", "name": "Whisk or stir the mixture until the seasonings and cheese are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the well-drained potatoes to the bowl containing the Parmesan mixture. Toss carefully but thoroughly until each potato piece is coated on all sides.", "name": "Transfer the well-drained potatoes to the bowl containing the Parmesan mixture. Toss carefully but thoroughly until each potato piece is coated on all sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-5"}, {"@type": "HowToStep", "text": "Arrange the potatoes in a single layer on a greased baking sheet or a parchment-lined baking pan. Leave sufficient room between the pieces so moisture can escape during roasting; overcrowding can cause the potatoes to steam rather than crisp.", "name": "Arrange the potatoes in a single layer on a greased baking sheet or a parchment-lined baking pan. Leave sufficient room between the pieces so moisture can escape during roasting; overcrowding can cause the potatoes to steam rather than crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-6"}, {"@type": "HowToStep", "text": "Place the baking sheet in the preheated oven and roast the potatoes for 25 minutes. At approximately the 15-minute point, stir and turn the pieces to encourage even browning.", "name": "Place the baking sheet in the preheated oven and roast the potatoes for 25 minutes. At approximately the 15-minute point, stir and turn the pieces to encourage even browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-7"}, {"@type": "HowToStep", "text": "Continue roasting until the potatoes have tender interiors, crisp edges, and a golden Parmesan crust.", "name": "Continue roasting until the potatoes have tender interiors, crisp edges, and a golden Parmesan crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-8"}, {"@type": "HowToStep", "text": "As the potatoes complete their roasting time, melt the unsalted butter gently in a small saucepan over low heat. Stir the chopped fresh parsley into the melted butter.", "name": "As the potatoes complete their roasting time, melt the unsalted butter gently in a small saucepan over low heat. Stir the chopped fresh parsley into the melted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-9"}, {"@type": "HowToStep", "text": "Remove the roasted potatoes from the oven and drizzle the parsley-infused butter over them. Toss gently until evenly coated, then scatter the bacon bits over the top, if using.", "name": "Remove the roasted potatoes from the oven and drizzle the parsley-infused butter over them. Toss gently until evenly coated, then scatter the bacon bits over the top, if using.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-10"}, {"@type": "HowToStep", "text": "Transfer the finished Parmesan roasted potatoes to a serving dish and serve immediately while the exterior remains crisp and the butter coating is still warm.", "name": "Transfer the finished Parmesan roasted potatoes to a serving dish and serve immediately while the exterior remains crisp and the butter coating is still warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/parmesan-roasted-potatoes/#wprm-recipe-45703-step-0-11"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Parmesan Roasted Potatoes"}</script>
