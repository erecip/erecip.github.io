    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Garlic Udon Noodles", "author": {"@type": "Person", "name": "BenDes"}, "description": "A savory stir-fried udon dish featuring crisp crumbled tofu, tender shiitake mushrooms, fragrant garlic, and a mildly spicy sesame sauce. The thick noodles absorb the rich seasonings while retaining their signature soft, chewy texture.", "datePublished": "2020-09-06T12:29:58+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/garlic-udon-noodles.png", "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/garlic-udon-noodles.png", "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/garlic-udon-noodles.png", "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/garlic-udon-noodles.png"], "prepTime": "PT15M", "cookTime": "PT15M", "totalTime": "PT30M", "recipeIngredient": ["1 tablespoon vegetarian oyster-style sauce", "1 tablespoon water", "1 teaspoon sesame seeds", "1 tablespoon Korean gochugaru chili flakes", "1 tablespoon sesame oil", "1 tablespoon granulated sugar", "1 tablespoon low-sodium soy sauce", "½ pound extra-firm tofu (crumbled into approximately ¼-inch pieces)", "1 teaspoon dark soy sauce", "2 tablespoons neutral cooking oil (such as canola or grapeseed oil, divided)", "14 ounces fresh udon noodles", "3.5 ounces shiitake mushrooms (thinly sliced)", "2  green onions (finely sliced with the white and green portions separated)", "1 tablespoon freshly minced garlic", "2 to 4 tablespoons water (added as necessary)", "Additional sliced green onions (for garnish)", "Extra sesame seeds (optional)", "Salt and ground black pepper (optional)", "Additional sesame oil (optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the fresh udon noodle packets in hot water for several minutes, or rinse them under hot running water, until the strands begin to loosen.", "name": "Place the fresh udon noodle packets in hot water for several minutes, or rinse them under hot running water, until the strands begin to loosen.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-0"}, {"@type": "HowToStep", "text": "Gently separate the noodles without pulling or forcing apart any compacted sections, as fresh udon can break easily.", "name": "Gently separate the noodles without pulling or forcing apart any compacted sections, as fresh udon can break easily.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-1"}, {"@type": "HowToStep", "text": "Drain thoroughly and reserve for later.", "name": "Drain thoroughly and reserve for later.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-2"}, {"@type": "HowToStep", "text": "Add the gochugaru, vegetarian oyster-style sauce, low-sodium soy sauce, sugar, sesame seeds, sesame oil, and 1 tablespoon of water to a small bowl.", "name": "Add the gochugaru, vegetarian oyster-style sauce, low-sodium soy sauce, sugar, sesame seeds, sesame oil, and 1 tablespoon of water to a small bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-3"}, {"@type": "HowToStep", "text": "Stir thoroughly until the sugar has dissolved and the mixture has a smooth, even consistency.", "name": "Stir thoroughly until the sugar has dissolved and the mixture has a smooth, even consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-4"}, {"@type": "HowToStep", "text": "Taste the sauce and adjust the amount of chili powder according to the preferred level of heat. Set aside.", "name": "Taste the sauce and adjust the amount of chili powder according to the preferred level of heat. Set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-5"}, {"@type": "HowToStep", "text": "Warm a large wok or nonstick skillet over medium-high heat, then add 1 tablespoon of the neutral oil.", "name": "Warm a large wok or nonstick skillet over medium-high heat, then add 1 tablespoon of the neutral oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-6"}, {"@type": "HowToStep", "text": "Once the oil is hot, place the crumbled tofu in the pan. Break apart any remaining large pieces while it cooks.", "name": "Once the oil is hot, place the crumbled tofu in the pan. Break apart any remaining large pieces while it cooks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-7"}, {"@type": "HowToStep", "text": "Leave the tofu undisturbed for 3 to 4 minutes, allowing the underside to become golden and crisp. As moisture evaporates, the tofu should develop a dry, finely crumbled texture.", "name": "Leave the tofu undisturbed for 3 to 4 minutes, allowing the underside to become golden and crisp. As moisture evaporates, the tofu should develop a dry, finely crumbled texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-8"}, {"@type": "HowToStep", "text": "Pour in the dark soy sauce and stir until the tofu is evenly seasoned.", "name": "Pour in the dark soy sauce and stir until the tofu is evenly seasoned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-9"}, {"@type": "HowToStep", "text": "Continue cooking for another 3 to 4 minutes, or until the tofu is thoroughly browned and dry. Move it to one side of the pan.", "name": "Continue cooking for another 3 to 4 minutes, or until the tofu is thoroughly browned and dry. Move it to one side of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-10"}, {"@type": "HowToStep", "text": "Pour the remaining tablespoon of neutral oil onto the vacant side of the pan.", "name": "Pour the remaining tablespoon of neutral oil onto the vacant side of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-11"}, {"@type": "HowToStep", "text": "Add the minced garlic and sauté over medium heat for approximately 30 seconds, just until aromatic.", "name": "Add the minced garlic and sauté over medium heat for approximately 30 seconds, just until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-12"}, {"@type": "HowToStep", "text": "Stir in half of the sliced green onions and cook for 1 minute.", "name": "Stir in half of the sliced green onions and cook for 1 minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-13"}, {"@type": "HowToStep", "text": "Add the sliced shiitake mushrooms and stir-fry for 2 to 3 minutes, until tender and lightly browned.", "name": "Add the sliced shiitake mushrooms and stir-fry for 2 to 3 minutes, until tender and lightly browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-14"}, {"@type": "HowToStep", "text": "Transfer the drained udon noodles to the pan containing the tofu, mushrooms, garlic, and green onions.", "name": "Transfer the drained udon noodles to the pan containing the tofu, mushrooms, garlic, and green onions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-15"}, {"@type": "HowToStep", "text": "Pour the prepared sauce over the noodles, then toss carefully until every strand is evenly coated and the ingredients are well distributed.", "name": "Pour the prepared sauce over the noodles, then toss carefully until every strand is evenly coated and the ingredients are well distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-16"}, {"@type": "HowToStep", "text": "Cook over medium-high heat for 2 to 3 minutes.", "name": "Cook over medium-high heat for 2 to 3 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-17"}, {"@type": "HowToStep", "text": "When the noodles appear dry or require additional softening, gradually incorporate 2 to 4 tablespoons of water, mixing well after each addition.", "name": "When the noodles appear dry or require additional softening, gradually incorporate 2 to 4 tablespoons of water, mixing well after each addition.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-18"}, {"@type": "HowToStep", "text": "Taste and add a small amount of salt and black pepper when desired. A light drizzle of additional sesame oil may also be added for a fuller finish.", "name": "Taste and add a small amount of salt and black pepper when desired. A light drizzle of additional sesame oil may also be added for a fuller finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-19"}, {"@type": "HowToStep", "text": "Remove the pan from the heat.", "name": "Remove the pan from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-20"}, {"@type": "HowToStep", "text": "Scatter the reserved green onion slices over the noodles and add an optional sprinkling of sesame seeds.", "name": "Scatter the reserved green onion slices over the noodles and add an optional sprinkling of sesame seeds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-21"}, {"@type": "HowToStep", "text": "Serve immediately while hot.", "name": "Serve immediately while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-udon-noodles/#wprm-recipe-41020-step-0-22"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["korean"], "keywords": "Garlic Udon Noodles"}</script>
