amon-toast/#wprm-recipe-40149-step-0-1"}, {"@type": "HowToStep", "text": "Spread 1½ tablespoons of unsalted butter over each side of every brioche slice. Coat both buttered surfaces generously with the prepared cinnamon-sugar mixture.", "name": "Spread 1½ tablespoons of unsalted butter over each side of every brioche slice. Coat both buttered surfaces generously with the prepared cinnamon-sugar mixture.", "url": "https://erecip.github.io/en/cottage-cheese-cinnamon-toast/#wprm-recipe-40149-step-0-2"}, {"@type": "HowToStep", "text": "Arrange the coated bread slices in a single layer on the lined baking sheet, leaving space between them for consistent heat circulation.", "name": "Arrange the coated bread slices in a single layer on the lined baking sheet, leaving space between them for consistent heat circulation.", "url": "https://erecip.github.io/en/cottage-cheese-cinnamon-toast/#wprm-recipe-40149-step-0-3"}, {"@type": "HowToStep", "text": "Bake for 5–8 minutes, or until the edges begin to develop a golden-brown color. Carefully turn each slice over, then continue baking for another 3–5 minutes, until both sides are crisp and evenly toasted.", "name": "Bake for 5–8 minutes, or until the edges begin to develop a golden-brown color. Carefully turn each slice over, then continue baking for another 3–5 minutes, until both sides are crisp and evenly toasted.", "url": "https://erecip.github.io/en/cottage-cheese-cinnamon-toast/#wprm-recipe-40149-step-0-4"}, {"@type": "HowToStep", "text": "Remove the cinnamon toast from the oven and allow it to cool briefly. Spoon ¼ cup of cottage cheese over the top of each slice and spread it into an even layer.", "name": "Remove the cinnamon toast from the oven and allow it to cool briefly. Spoon ¼ cup of cottage cheese over the top of each slice and spread it into an even layer.", "url": "https://erecip.github.io/en/cottage-cheese-cinnamon-toast/#wprm-recipe-40149-step-0-5"}, {"@type": "HowToStep", "text": "Serve the toast immediately on
