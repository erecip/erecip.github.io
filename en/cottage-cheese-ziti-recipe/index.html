le retaining a slight firmness. Drain thoroughly and set aside.", "name": "Cook the dry ziti according to the package directions, removing it from the heat approximately 1–2 minutes earlier than instructed. The pasta should be tender while retaining a slight firmness. Drain thoroughly and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-ziti-recipe/#wprm-recipe-45078-step-0-1"}, {"@type": "HowToStep", "text": "In a large bowl, combine 1 1/2 cups pasta sauce, cottage cheese, cooked lean ground beef, 1 cup mozzarella, the egg, Italian seasoning, minced garlic, and black pepper. Stir until the ingredients are evenly incorporated.", "name": "In a large bowl, combine 1 1/2 cups pasta sauce, cottage cheese, cooked lean ground beef, 1 cup mozzarella, the egg, Italian seasoning, minced garlic, and black pepper. Stir until the ingredients are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-ziti-recipe/#wprm-recipe-45078-step-0-2"}, {"@type": "HowToStep", "text": "Add the drained ziti to the cottage cheese and meat mixture. Fold everything together gently until the pasta is thoroughly and evenly coated.", "name": "Add the drained ziti to the cottage cheese and meat mixture. Fold everything together gently until the pasta is thoroughly and evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-ziti-recipe/#wprm-recipe-45078-step-0-3"}, {"@type": "HowToStep", "text": "Lightly grease a 2-quart casserole dish with olive oil. Spread 1/2 cup pasta sauce across the bottom of the prepared dish.", "name": "Lightly grease a 2-quart casserole dish with olive oil. Spread 1/2 cup pasta sauce across the bottom of the prepared dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-ziti-recipe/#wprm-recipe-45078-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the coated ziti mixture into the casserole dish and distribute it in an even layer. Spoon the remaining 1/2 cup pasta sauce over the pasta, then finish with 1/2 cup mozzarella cheese and 3 tablespoons Parmesan cheese.", "name": "Transfer the coated ziti mixture into the casserole dish and distribute it in an even layer. Spoon the remaining 1/2 cup pasta sauce over the pasta, then finish with 1/2 cup mozzarella cheese and 3 tablespoons Parmesan cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-ziti-recipe/#wprm-recipe-45078-step-0-5"}, {"@type": "HowToStep", "text": "Cover the casserole dish with aluminum foil and bake in the preheated oven for 45–50 minutes.", "name": "Cover the casserole dish with aluminum foil and bake in the preheated oven for 45–50 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-ziti-recipe/#wprm-recipe-45078-step-0-6"}, {"@type": "HowToStep", "text": "Remove the foil and continue baking for another 10 minutes, or until the cheese is melted, bubbling, and attractively browned.", "name": "Remove the foil and continue baking for another 10 minutes, or until the cheese is melted, bubbling, and attractively browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-ziti-recipe/#wprm-recipe-45078-step-0-7"}, {"@type": "HowToStep", "text": "Take the cottage cheese ziti out of the oven and allow it to rest for a few minutes before serving.", "name": "Take the cottage cheese ziti out of the oven and allow it to rest for a few minutes before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-ziti-recipe/#wprm-recipe-45078-step-0-8"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["Italian"], "keywords": "Cottage Cheese Ziti Recipe"}</script>
