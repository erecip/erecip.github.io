    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gluten-Free Butterscotch Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These gluten-free oatmeal cookies combine warm cinnamon, rich brown sugar, and creamy butterscotch morsels. Melted salted butter creates a tender center, while rolled oats give each cookie a pleasantly chewy texture with lightly crisp edges.", "datePublished": "2019-03-29T20:14:07+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-butterscotch-cookies/gluten-free-butterscotch-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-butterscotch-cookies/gluten-free-butterscotch-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-butterscotch-cookies/gluten-free-butterscotch-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-butterscotch-cookies/gluten-free-butterscotch-cookies.png"], "cookTime": "PT9M", "totalTime": "PT12M", "recipeIngredient": ["1  large egg (brought to room temperature)", "1¼ cups butterscotch morsels", "½ cup white granulated sugar", "2 cups certified gluten-free old-fashioned rolled oats (not instant oats)", "1 teaspoon pure vanilla extract", "12 tablespoons salted butter (melted and slightly cooled)", "¼ teaspoon baking soda", "1 cup firmly packed brown sugar", "½ teaspoon ground cinnamon (preferably freshly ground)", "1½ cups gluten-free all-purpose flour blend", "1 teaspoon baking powder"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 375°F. Cover the baking sheets with parchment paper to encourage even baking and prevent the cookies from sticking.", "name": "Preheat the oven to 375°F. Cover the baking sheets with parchment paper to encourage even baking and prevent the cookies from sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-butterscotch-cookies/#wprm-recipe-40342-step-0-0"}, {"@type": "HowToStep", "text": "Melt the butter. Place the salted butter in a microwave-safe bowl and heat it in 20-second intervals, stirring after each interval, until completely melted. Allow it to cool for 2–3 minutes before combining it with the egg.", "name": "Melt the butter. Place the salted butter in a microwave-safe bowl and heat it in 20-second intervals, stirring after each interval, until completely melted. Allow it to cool for 2–3 minutes before combining it with the egg.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-butterscotch-cookies/#wprm-recipe-40342-step-0-1"}, {"@type": "HowToStep", "text": "In a medium bowl, combine the slightly cooled melted butter, packed brown sugar, granulated sugar, room-temperature egg, and vanilla extract. Mix vigorously for approximately 1 minute, or until the mixture is smooth, thoroughly blended, and somewhat lighter in appearance.", "name": "In a medium bowl, combine the slightly cooled melted butter, packed brown sugar, granulated sugar, room-temperature egg, and vanilla extract. Mix vigorously for approximately 1 minute, or until the mixture is smooth, thoroughly blended, and somewhat lighter in appearance.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-butterscotch-cookies/#wprm-recipe-40342-step-0-2"}, {"@type": "HowToStep", "text": "In a separate small bowl, thoroughly whisk the gluten-free flour blend with the baking powder, cinnamon, and baking soda. Continue until the mixture is uniform and free of visible lumps.", "name": "In a separate small bowl, thoroughly whisk the gluten-free flour blend with the baking powder, cinnamon, and baking soda. Continue until the mixture is uniform and free of visible lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-butterscotch-cookies/#wprm-recipe-40342-step-0-3"}, {"@type": "HowToStep", "text": "Add the dry mixture to the wet ingredients. Fold gently only until the flour t": "Leave the cookies on the hot baking sheet for 2–3 minutes. This brief resting period allows residual heat to finish setting their structure.", "name": "Leave the cookies on the hot baking sheet for 2–3 minutes. This brief resting period allows residual heat to finish setting their structure.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-butterscotch-cookies/#wprm-recipe-40342-step-0-8"}, {"@type": "HowToStep", "text": "Carefully transfer the cookies to a wire rack and allow them to cool completely. Their chewy centers, lightly crisp edges, and butterscotch flavor will become more pronounced as they set.", "name": "Carefully transfer the cookies to a wire rack and allow them to cool completely. Their chewy centers, lightly crisp edges, and butterscotch flavor will become more pronounced as they set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-butterscotch-cookies/#wprm-recipe-40342-step-0-9"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Gluten-Free Butterscotch Cookies"}</script>
