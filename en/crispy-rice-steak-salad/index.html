 soy sauce, and extra virgin olive oil. Stir thoroughly until the seasonings evenly coat the grains.", "name": "Preheat the oven to 400°F (200°C). Place the completely cooled jasmine rice in a large mixing bowl and add the red curry paste, soy sauce, and extra virgin olive oil. Stir thoroughly until the seasonings evenly coat the grains.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crispy-rice-steak-salad/#wprm-recipe-41835-step-0-0"}, {"@type": "HowToStep", "text": "Spread the seasoned rice in an even layer over a parchment-lined baking sheet. Bake for 30–40 minutes, turning or stirring the rice halfway through the cooking period. Continue baking until the grains are crisp and golden, monitoring them closely near the end so they do not become excessively dark.", "name": "Spread the seasoned rice in an even layer over a parchment-lined baking sheet. Bake for 30–40 minutes, turning or stirring the rice halfway through the cooking period. Continue baking until the grains are crisp and golden, monitoring them closely near the end so they do not become excessively dark.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crispy-rice-steak-salad/#wprm-recipe-41835-step-0-1"}, {"@type": "HowToStep", "text": "Remove the baking sheet from the oven and allow the rice to cool. Once cool enough to handle, break the crisped rice into small, crunchy pieces and set aside.", "name": "Remove the baking sheet from the oven and allow the rice to cool. Once cool enough to handle, break the crisped rice into small, crunchy pieces and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crispy-rice-steak-salad/#wprm-recipe-41835-step-0-2"}, {"@type": "HowToStep", "text": "Remove the beef sirloin from refrigeration approximately 30 minutes before cooking so it can lose its chill. Blot the surface thoroughly with paper towels, then season every side with salt and freshly ground black pepper.", "name": "Remove the beef sirloin from refrigeration approximately 30 minutes before cooking so it can lose its chill. Blot the surface thoroughly with paper towels, then season every side with salt and freshly ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crispy-rice-steak-salad/#wprm-recipe-41835-step-0-3"}, {"@type": "HowToStep", "text": "Place an oven-safe skillet over medium-high heat and coat it with a small quantity of extra virgin olive oil. Add the sirloin and sear each side for approximately 2–3 minutes, allowing a deep golden-brown exterior to develop.", "name": "Place an oven-safe skillet over medium-high heat and coat it with a small quantity of extra virgin olive oil. Add the sirloin and sear each side for approximately 2–3 minutes, allowing a deep golden-brown exterior to develop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crispy-rice-steak-salad/#wprm-recipe-41835-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the skillet to the 400°F (200°C) oven. Roast the beef for 6–8 minutes, or until its internal temperature registers between 130°F and 140°F (54–60°C) for medium-rare through medium.", "name": "Transfer the skillet to the 400°F (200°C) oven. Roast the beef for 6–8 minutes, or until its internal temperature registers between 130°F and 140°F (54–60°C) for medium-rare through medium.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crispy-rice-steak-salad/#wprm-recipe-41835-step-0-5"}, {"@type": "HowToStep", "text": "Take the sirloin out of the oven and leave it undisturbed for 10–15 minutes before slicing. This resting period allows the juices to redistribute through the meat.", "name": "Take the sirloin out of the oven and leave it undisturbed for 10–15 minutes before slicing. This resting period allows the juices to redistribute through the meat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crispy-rice-steak-salad/#wprm-recipe-41835-step-0-6"}, {"@type": "HowToStep", "text": "While the beef rests, ering of crispy fried onions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crispy-rice-steak-salad/#wprm-recipe-41835-step-0-11"}, {"@type": "HowToStep", "text": "Pour approximately half of the prepared chili-tahini dressing over the salad. Toss gently until the ingredients receive a light, even coating.", "name": "Pour approximately half of the prepared chili-tahini dressing over the salad. Toss gently until the ingredients receive a light, even coating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crispy-rice-steak-salad/#wprm-recipe-41835-step-0-12"}, {"@type": "HowToStep", "text": "Add additional dressing according to preference and serve the salad immediately while the rice and fried onions remain crisp.", "name": "Add additional dressing according to preference and serve the salad immediately while the rice and fried onions remain crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crispy-rice-steak-salad/#wprm-recipe-41835-step-0-13"}], "recipeCategory": ["Main Course", "Salad"], "recipeCuisine": ["Asian-inspired"], "keywords": "Crispy Rice Steak Salad"}</script>
