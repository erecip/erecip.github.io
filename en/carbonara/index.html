    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Carbonara", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich spaghetti carbonara featuring crisp bacon, gently cooked garlic, Parmigiano Reggiano, egg yolks, heavy cream, and freshly ground black pepper. Reserved pasta water helps transform the egg-and-cheese mixture into a smooth, glossy sauce that coats the hot spaghetti.", "datePublished": "2021-12-17T11:04:19+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/carbonara/carbonara.png", "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/carbonara.png", "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/carbonara.png", "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/carbonara.png"], "recipeIngredient": ["5 oz finely grated Parmigiano Reggiano (divided for the sauce and finishing)", "5  –6 garlic cloves (finely minced)", "2  large eggs (brought to room temperature and separated)", "Freshly ground black pepper (according to taste)", "1 lb bacon (sliced into 1/4-inch pieces)", "2 tbsp heavy cream", "1 lb spaghetti (such as Barilla)", "Salted water (for cooking the pasta)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of generously salted water to a full rolling boil.", "name": "Bring a large pot of generously salted water to a full rolling boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-0"}, {"@type": "HowToStep", "text": "As the water heats, finely mince the garlic, slice the bacon into 1/4-inch pieces, grate the Parmigiano Reggiano, and separate the eggs. Place the yolks and whites in different small bowls.", "name": "As the water heats, finely mince the garlic, slice the bacon into 1/4-inch pieces, grate the Parmigiano Reggiano, and separate the eggs. Place the yolks and whites in different small bowls.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-1"}, {"@type": "HowToStep", "text": "Add the spaghetti to the boiling water and cook until al dente according to the instructions on the package, stirring from time to time.", "name": "Add the spaghetti to the boiling water and cook until al dente according to the instructions on the package, stirring from time to time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-2"}, {"@type": "HowToStep", "text": "Before draining the spaghetti, scoop out and reserve 1 cup of the starchy cooking water. Drain the pasta and keep it ready for the final assembly.", "name": "Before draining the spaghetti, scoop out and reserve 1 cup of the starchy cooking water. Drain the pasta and keep it ready for the final assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-3"}, {"@type": "HowToStep", "text": "Place the bacon pieces in a large skillet or broad pan over medium heat. Cook for approximately 8–10 minutes, or until the bacon becomes crisp and golden.", "name": "Place the bacon pieces in a large skillet or broad pan over medium heat. Cook for approximately 8–10 minutes, or until the bacon becomes crisp and golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-4"}, {"@type": "HowToStep", "text": "Using a slotted spoon, transfer the cooked bacon to a paper towel-lined surface. Leave approximately 3–4 tablespoons of the rendered bacon fat in the skillet.", "name": "Using a slotted spoon, transfer the cooked bacon to a paper towel-lined surface. Leave approximately 3–4 tablespoons of the rendered bacon fat in the skillet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-5"}, {"@type": "HowToStep", "text": "Lower the heat and add the minced garlic to the warm bacon fat. Stir continuously for about 1 minute, until the garlic is aromatic and lightly golden. Avoid allowing it to brown excessively, as burnt garlic can become bitter.", "name": "Lower the heat and add the minced garlic to the warm bacon fat. Stir continuously for about 1 minute, until the garlic is aromatic and lightly golden. Avoid allowing it to brown excessively, as burnt garlic can become bitter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-6"}, {"@type": "HowToStep", "text": "Place the egg yolks in a medium bowl, reserving the whites for another purpose.", "name": "Place the egg yolks in a medium bowl, reserving the whites for another purpose.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-7"}, {"@type": "HowToStep", "text": "Whisk the yolks together with the heavy cream, a generous amount of freshly ground black pepper, and half of the finely grated Parmigiano Reggiano.", "name": "Whisk the yolks together with the heavy cream, a generous amount of freshly ground black pepper, and half of the finely grated Parmigiano Reggiano.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-8"}, {"@type": "HowToStep", "text": "While whisking continuously, gradually pour in approximately 1/2 cup of the reserved hot pasta water. Adding the water slowly tempers the yolks and helps prevent them from scrambling.", "name": "While whisking continuously, gradually pour in approximately 1/2 cup of the reserved hot pasta water. Adding the water slowly tempers the yolks and helps prevent them from scrambling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-9"}, {"@type": "HowToStep", "text": "Continue whisking until the mixture has a smooth, thin, custard-like consistency that can be poured easily.", "name": "Continue whisking until the mixture has a smooth, thin, custard-like consistency that can be poured easily.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-10"}, {"@type": "HowToStep", "text": "Transfer the drained spaghetti directly to the skillet containing the garlic and reserved bacon fat. Toss gently until the strands are evenly coated.", "name": "Transfer the drained spaghetti directly to the skillet containing the garlic and reserved bacon fat. Toss gently until the strands are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-11"}, {"@type": "HowToStep", "text": "Remove the skillet from the heat. Pour the prepared egg-and-cheese mixture over the spaghetti while continuously tossing the pasta with tongs or two forks.", "name": "Remove the skillet from the heat. Pour the prepared egg-and-cheese mixture over the spaghetti while continuously tossing the pasta with tongs or two forks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-12"}, {"@type": "HowToStep", "text": "Continue moving the pasta so the residual heat gently cooks the yolks and produces a creamy coating rather than scrambled eggs.", "name": "Continue moving the pasta so the residual heat gently cooks the yolks and produces a creamy coating rather than scrambled eggs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-13"}, {"@type": "HowToStep", "text": "Return the crisp bacon to the skillet and toss until it is distributed throughout the spaghetti.", "name": "Return the crisp bacon to the skillet and toss until it is distributed throughout the spaghetti.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-14"}, {"@type": "HowToStep", "text": "If the sauce becomes too thick or appears dry, incorporate additional reserved pasta water 1 tablespoon at a time. Toss after each addition until the sauce reaches a silky, fluid consistency.", "name": "If the sauce becomes too thick or appears dry, incorporate additional reserved pasta water 1 tablespoon at a time. Toss after each addition until the sauce reaches a silky, fluid consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-15"}, {"@type": "HowToStep", "text": "Immediately divide the finished carbonara among warm serving bowls or plates.", "name": "Immediately divide the finished carbonara among warm serving bowls or plates.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-16"}, {"@type": "HowToStep", "text": "Sprinkle each portion with the remaining grated Parmigiano Reggiano and finish with additional freshly ground black pepper.", "name": "Sprinkle each portion with the remaining grated Parmigiano Reggiano and finish with additional freshly ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-17"}, {"@type": "HowToStep", "text": "Serve at once while the spaghetti is hot and the sauce remains smooth, creamy, and flowing.", "name": "Serve at once while the spaghetti is hot and the sauce remains smooth, creamy, and flowing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara/#wprm-recipe-44693-step-0-18"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Carbonara"}</script>
