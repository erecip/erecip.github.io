": "Top with the seasoned turkey and Swiss chard mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-butternut-squash-with-ground-turkey/#wprm-recipe-38697-step-0-17"}, {"@type": "HowToStep", "text": "Arrange the roasted butternut squash around the edges or over the top.", "name": "Arrange the roasted butternut squash around the edges or over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-butternut-squash-with-ground-turkey/#wprm-recipe-38697-step-0-18"}, {"@type": "HowToStep", "text": "Drizzle the fresh lemon juice over the finished dish just before serving.", "name": "Drizzle the fresh lemon juice over the finished dish just before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-butternut-squash-with-ground-turkey/#wprm-recipe-38697-step-0-19"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Roasted Butternut Squash with Ground Turkey"}</script>
