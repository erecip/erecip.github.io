    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Philly Cheese Steak Sandwich Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Savor the quintessential taste of a classic Philly Cheesesteak—perfect for game day or a hearty dinner. This sandwich brings together finely chopped sirloin, tender sautéed bell peppers and onions, and gooey provolone cheese, all nestled within buttery, toasted hoagie rolls. A true comfort food favorite made easily in one skillet.", "datePublished": "2024-04-07T07:18:47+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/philly-cheese-steak-sandwich-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/philly-cheese-steak-sandwich-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/philly-cheese-steak-sandwich-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/philly-cheese-steak-sandwich-recipe.png"], "recipeYield": ["8"], "prepTime": "PT20M", "cookTime": "PT25M", "totalTime": "PT45M", "recipeIngredient": ["1 teaspoon garlic pepper (divided)", "6 tablespoons unsalted butter (softened)", "1  sweet yellow onion (halved and thinly sliced (about 2-inch slices))", "8  hoagie rolls", "7 ounces provolone cheese (sliced (7 slices, preferably thick cut))", "1 ½ teaspoons seasoned salt (such as Lawry’s, divided)", "4 tablespoons vegetable oil (divided (more if needed))", "2½ to 3 pounds petite sirloin (thinly sliced across the grain)", "1  green bell pepper (thinly sliced)", "1  red bell pepper (thinly sliced)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the sirloin in the freezer for 20 to 30 minutes prior to slicing to make it easier to achieve very thin cuts.", "name": "Place the sirloin in the freezer for 20 to 30 minutes prior to slicing to make it easier to achieve very thin cuts.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/#wprm-recipe-31034-step-0-0"}, {"@type": "HowToStep", "text": "In a large 14-inch sauté pan, heat 2 tablespoons of vegetable oil over medium-low heat. Add the sliced onion, red bell pepper, and green bell pepper. Sauté gently, stirring occasionally, until the vegetables are extremely tender. Lower the heat slightly if browning occurs. While the vegetables cook, begin preparing the beef.", "name": "In a large 14-inch sauté pan, heat 2 tablespoons of vegetable oil over medium-low heat. Add the sliced onion, red bell pepper, and green bell pepper. Sauté gently, stirring occasionally, until the vegetables are extremely tender. Lower the heat slightly if browning occurs. While the vegetables cook, begin preparing the beef.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/#wprm-recipe-31034-step-0-1"}, {"@type": "HowToStep", "text": "Remove the partially frozen steak and trim any excess fat. Slice it as thinly as possible against the grain, then chop the slices finely into approximately ¼-inch pieces. Continue chopping until the pieces are uniformly small. Stir the vegetables intermittently as you work.", "name": "Remove the partially frozen steak and trim any excess fat. Slice it as thinly as possible against the grain, then chop the slices finely into approximately ¼-inch pieces. Continue chopping until the pieces are uniformly small. Stir the vegetables intermittently as you work.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/#wprm-recipe-31034-step-0-2"}, {"@type": "HowToStep", "text": "Once the vegetables are fully softened, transfer them to a separate dish. Return the pan to medium-high heat, add a bit more oil if needed, and cook half of the chopped steak, stirring frequently, for 4 to 5 minutes or until no pink remains. While cooking, season the beef with ¾ teaspoon of the seasoned salt and ½ teaspoon of the garlic pepper. Once done, remove the steak with a slotted spoon and place it with the sautéed vegetables.", "name": "Once the vegetables are fully softened, transfer them to a separate dish. Return the pan to medium-high heat, add a bit more oil if needed, and cook half of the chopped steak, stirring frequently, for 4 to 5 minutes or until no pink remains. While cooking, season the beef with ¾ teaspoon of the seasoned salt and ½ teaspoon of the garlic pepper. Once done, remove the steak with a slotted spoon and place it with the sautéed vegetables.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/#wprm-recipe-31034-step-0-3"}, {"@type": "HowToStep", "text": "Add more oil if necessary, and repeat the cooking process with the remaining steak, seasoning it with the remaining seasoned salt and garlic pepper. Transfer the second batch to the vegetable mixture when fully cooked.", "name": "Add more oil if necessary, and repeat the cooking process with the remaining steak, seasoning it with the remaining seasoned salt and garlic pepper. Transfer the second batch to the vegetable mixture when fully cooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/#wprm-recipe-31034-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 400°F. Carefully split open each hoagie roll without separating the halves. Generously spread the interior with softened butter and arrange them cut side up on a baking sheet. Toast in the oven for 3 to 5 minutes until golden and crisp.", "name": "Preheat the oven to 400°F. Carefully split open each hoagie roll without separating the halves. Generously spread the interior with softened butter and arrange them cut side up on a baking sheet. Toast in the oven for 3 to 5 minutes until golden and crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/#wprm-recipe-31034-step-0-5"}, {"@type": "HowToStep", "text": "Drain all excess juices from the sauté pan and return it to the stove over medium heat. Return all the cooked steak, onions, and peppers to the pan. Layer the provolone cheese slices evenly over the mixture in a circular pattern. Cover the pan and heat for 4 to 5 minutes, or until the cheese has fully melted. Stir the mixture to combine.", "name": "Drain all excess juices from the sauté pan and return it to the stove over medium heat. Return all the cooked steak, onions, and peppers to the pan. Layer the provolone cheese slices evenly over the mixture in a circular pattern. Cover the pan and heat for 4 to 5 minutes, or until the cheese has fully melted. Stir the mixture to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/#wprm-recipe-31034-step-0-6"}, {"@type": "HowToStep", "text": "Using tongs, distribute the hot steak and vegetable filling evenly into the toasted hoagie rolls. Serve immediately.", "name": "Using tongs, distribute the hot steak and vegetable filling evenly into the toasted hoagie rolls. Serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/philly-cheese-steak-sandwich-recipe/#wprm-recipe-31034-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "philly cheese steak sandwich recipe"}</script>
