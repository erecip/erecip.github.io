    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Roasted Turkey in Oven Bag", "author": {"@type": "Person", "name": "BenDes"}, "description": "A whole turkey is seasoned with garlic-thyme butter beneath the skin, arranged over a bed of aromatic vegetables, and roasted inside an oven bag. This method helps retain moisture while producing tender, flavorful meat with a streamlined roasting process.", "datePublished": "2020-01-26T02:20:15+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/roasted-turkey-in-oven-bag.png", "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/roasted-turkey-in-oven-bag.png", "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/roasted-turkey-in-oven-bag.png", "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/roasted-turkey-in-oven-bag.png"], "cookTime": "PT120M", "totalTime": "PT140M", "recipeIngredient": ["3  garlic cloves (finely minced)", "1/4 cup unsalted butter (softened to room temperature)", "Salt and freshly ground black pepper (as needed)", "1 teaspoon dried thyme (or 1 tablespoon fresh thyme)", "Salt and ground black pepper (for seasoning the cavity and exterior)", "1  whole turkey (12–24 pounds, fresh or fully thawed)", "2  carrots (peeled and sliced into 2-inch sections)", "1 tablespoon all-purpose flour", "1  large yellow onion (peeled and cut into chunks)", "4  celery stalks (chopped into 2-inch lengths)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Position an oven rack one level below the center of the oven, then preheat the oven to 350°F (175°C).", "name": "Position an oven rack one level below the center of the oven, then preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-0"}, {"@type": "HowToStep", "text": "Combine the room-temperature butter, minced garlic, thyme, a small amount of salt, and ground black pepper in a small bowl. Stir until the seasonings are evenly incorporated into the softened butter.", "name": "Combine the room-temperature butter, minced garlic, thyme, a small amount of salt, and ground black pepper in a small bowl. Stir until the seasonings are evenly incorporated into the softened butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-1"}, {"@type": "HowToStep", "text": "Remove the neck and giblets from the turkey cavities. Inspect the skin and remove any remaining pin feathers.", "name": "Remove the neck and giblets from the turkey cavities. Inspect the skin and remove any remaining pin feathers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-2"}, {"@type": "HowToStep", "text": "Fold the wing tips beneath the turkey so they are less likely to become overly browned during roasting.", "name": "Fold the wing tips beneath the turkey so they are less likely to become overly browned during roasting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-3"}, {"@type": "HowToStep", "text": "Season the interior cavity with salt and ground black pepper.", "name": "Season the interior cavity with salt and ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-4"}, {"@type": "HowToStep", "text": "Using the handle end of a wooden spoon, carefully loosen the skin covering the breast without tearing it. Spread the garlic-thyme butter beneath the loosened skin, distributing it evenly over the breast meat.", "name": "Using the handle end of a wooden spoon, carefully loosen the skin covering the breast without tearing it. Spread the garlic-thyme butter beneath the loosened skin, distributing it evenly over the breast meat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-5"}, {"@type": "HowToStep", "text": "Season the outside of the turkey generously with additional salt and ground black pepper.", "name": "Season the outside of the turkey generously with additional salt and ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-6"}, {"@type": "HowToStep", "text": "Place 1 tablespoon of all-purpose flour inside a turkey-size oven roasting bag. Shake the bag thoroughly so the flour is dispersed over its interior.", "name": "Place 1 tablespoon of all-purpose flour inside a turkey-size oven roasting bag. Shake the bag thoroughly so the flour is dispersed over its interior.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-7"}, {"@type": "HowToStep", "text": "Set the prepared oven bag inside a roasting pan.", "name": "Set the prepared oven bag inside a roasting pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-8"}, {"@type": "HowToStep", "text": "Arrange the celery pieces, onion chunks, and carrot sections along the bottom of the bag, forming a vegetable bed.", "name": "Arrange the celery pieces, onion chunks, and carrot sections along the bottom of the bag, forming a vegetable bed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-9"}, {"@type": "HowToStep", "text": "Position the seasoned turkey directly on top of the vegetables inside the oven bag.", "name": "Position the seasoned turkey directly on top of the vegetables inside the oven bag.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-10"}, {"@type": "HowToStep", "text": "Secure the oven bag using the supplied oven-safe tie. Make six small openings across the upper surface of the bag to allow steam to vent during roasting.", "name": "Secure the oven bag using the supplied oven-safe tie. Make six small openings across the upper surface of the bag to allow steam to vent during roasting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-11"}, {"@type": "HowToStep", "text": "Keep the loose ends of the bag tucked securely within the roasting pan.", "name": "Keep the loose ends of the bag tucked securely within the roasting pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-12"}, {"@type": "HowToStep", "text": "Roast a 12–16 pound turkey for approximately 2–2 1/4 hours. For a 16–20 pound turkey, roast for about 2 1/4–2 1/2 hours. A 20–24 pound turkey will generally require 2 1/2–3 hours.", "name": "Roast a 12–16 pound turkey for approximately 2–2 1/4 hours. For a 16–20 pound turkey, roast for about 2 1/4–2 1/2 hours. A 20–24 pound turkey will generally require 2 1/2–3 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-13"}, {"@type": "HowToStep", "text": "Check the internal temperature in several areas before removing the turkey from the oven. The thickest portion of the breast should register 165°F, while the thigh should reach 175°F.", "name": "Check the internal temperature in several areas before removing the turkey from the oven. The thickest portion of the breast should register 165°F, while the thigh should reach 175°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-in-oven-bag/#wprm-recipe-45626-step-0-14"}, {"@type": "HowToStep", "text": "After roasting, allow the turkey to rest for 20 minutes. This resting period permits the juices to redistribute through the meat before carving.", "name": "After roasting, allow the turkey to
