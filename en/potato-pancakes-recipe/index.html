    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Potato Pancakes Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Delightfully crisp and golden, these shredded potato pancakes are a simple pleasure, ideal served alongside applesauce or creamy Greek yogurt, whether for breakfast or a cozy supper.", "datePublished": "2024-09-21T17:36:46+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/potato-pancakes-recipe/Potato-Pancakes-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/potato-pancakes-recipe/Potato-Pancakes-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/potato-pancakes-recipe/Potato-Pancakes-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/potato-pancakes-recipe/Potato-Pancakes-Recipe.png"], "recipeYield": ["12", "12 Pancakes"], "prepTime": "PT20M", "cookTime": "PT15M", "totalTime": "PT35M", "recipeIngredient": ["2 teaspoons kosher salt (plus extra for sprinkling)", "1 teaspoon onion powder", "3 tablespoons canola oil (with more as needed)", "4 tablespoons white whole wheat flour", "¼ teaspoon ground black pepper", "4 cups peeled and grated russet potatoes (approximately 4 medium or 3 large)", "2  large eggs", "Applesauce (for serving)", "Plain Greek yogurt or sour cream (for serving)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 300°F and position an oven-safe wire rack atop a large baking sheet. Arrange the grated potatoes on a clean kitchen towel and firmly wring out as much moisture as possible over the sink. In a sizable mixing bowl, beat the eggs lightly with a fork, then incorporate the flour, 2 teaspoons of salt, onion powder, and pepper, stirring until no dry flour remains visible and the mixture appears slightly lumpy. Fold in the grated potatoes, mixing gently until fully coated; if the mixture seems overly wet, add additional flour by the teaspoon until thick and cohesive. In a deep, large skillet, warm the oil over medium-high heat, ensuring the pan’s surface is coated evenly; add more oil if needed. When the oil is sufficiently hot—test by dropping in a small amount of batter to check for a sizzle—scoop ¼ cup portions of the potato mixture into the pan, flattening each gently with the back of the measuring cup. Cook the pancakes in batches, ensuring at least an inch of space between each; fry until richly golden on the first side, about 3 minutes. Flip carefully and continue cooking until golden and cooked through, roughly 2 minutes more. If the oil begins to smoke, lower the heat immediately. Transfer finished pancakes to the prepared wire rack, sprinkle lightly with salt, and keep warm in the oven while cooking remaining batches. Stir the batter between batches as needed. Serve the pancakes hot, accompanied by Greek yogurt or sour cream and a side of applesauce.", "name": "Preheat the oven to 300°F and position an oven-safe wire rack atop a large baking sheet. Arrange the grated potatoes on a clean kitchen towel and firmly wring out as much moisture as possible over the sink. In a sizable mixing bowl, beat the eggs lightly with a fork, then incorporate the flour, 2 teaspoons of salt, onion powder, and pepper, stirring until no dry flour remains visible and the mixture appears slightly lumpy. Fold in the grated potatoes, mixing gently until fully coated; if the mixture seems overly wet, add additional flour by the teaspoon until thick and cohesive. In a deep, large skillet, warm the oil over medium-high heat, ensuring the pan’s surface is coated evenly; add more oil if needed. When the oil is sufficiently hot—test by dropping in a small amount of batter to check for a sizzle—scoop ¼ cup portions of the potato mixture into the pan, flattening each gently with the back of the measuring cup. Cook the pancakes in batches, ensuring at least an inch of space between each; fry until richly golden on the first side, about 3 minutes. Flip carefully and continue cooking until golden and cooked through, roughly 2 minutes more. If the oil begins to smoke, lower the heat immediately. Transfer finished pancakes to the prepared wire rack, sprinkle lightly with salt, and keep warm in the oven while cooking remaining batches. Stir the batter between batches as needed. Serve the pancakes hot, accompanied by Greek yogurt or sour cream and a side of applesauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-pancakes-recipe/#wprm-recipe-14402-step-0-0"}], "recipeCategory": ["Breakfast", "Side Dish"], "recipeCuisine": ["American"], "keywords": "Potato Pancakes Recipe"}</script>
