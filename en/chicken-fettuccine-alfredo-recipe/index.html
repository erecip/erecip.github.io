    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Fettuccine Alfredo Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Succulent slices of pan-seared chicken breast rest atop a rich and velvety Alfredo-coated fettuccine. This dish features a luscious garlic cream sauce, accented with Parmesan and a touch of nutmeg, offering an indulgent yet straightforward Italian classic.", "datePublished": "2024-08-29T12:52:33+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-fettuccine-alfredo-recipe/Chicken-Fettuccine-Alfredo-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fettuccine-alfredo-recipe/Chicken-Fettuccine-Alfredo-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fettuccine-alfredo-recipe/Chicken-Fettuccine-Alfredo-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fettuccine-alfredo-recipe/Chicken-Fettuccine-Alfredo-Recipe1.png"], "recipeYield": ["6"], "prepTime": "PT15M", "cookTime": "PT30M", "totalTime": "PT45M", "recipeIngredient": ["2 tablespoons unsalted butter", "1 pound boneless (skinless chicken breasts)", "1 teaspoon kosher salt", "1 tablespoon extra-virgin olive oil", "1 teaspoon Italian seasoning", "¼ teaspoon freshly cracked black pepper", "¼ teaspoon freshly cracked black pepper (plus more for garnish)", "¾ teaspoon garlic powder", "½ cup unsalted butter (cut into pieces)", "1 ½ cups heavy whipping cream (at room temperature)", "¼ teaspoon ground nutmeg", "5 ounces Parmesan cheese (finely grated (approximately 2 cups))", "½ teaspoon kosher salt", "2  garlic cloves (minced)", "12 ounces fettuccine pasta", "Minced flat-leaf parsley (for garnish)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of generously salted water to a boil and cook the fettuccine according to the package directions until al dente. Drain and set aside.", "name": "Brin ed pepper. Sauté for about 1 minute until aromatic.", "name": "Wipe the skillet clean and return it to medium heat. Add the butter and once nearly melted, stir in minced garlic, garlic powder, nutmeg, kosher salt, and freshly cracked pepper. Sauté for about 1 minute until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fettuccine-alfredo-recipe/#wprm-recipe-13680-step-0-3"}, {"@type": "HowToStep", "text": "Raise the heat to medium-high and gradually incorporate the heavy cream. Allow the mixture to come to a gentle simmer, then blend in the grated Parmesan. Stir continuously until the cheese is fully integrated, around 2 minutes. Lower the heat to medium-low and continue stirring until the sauce thickens, about 5 minutes more. Fold in the cooked pasta, ensuring it is thoroughly coated.", "name": "Raise the heat to medium-high and gradually incorporate the heavy cream. Allow the mixture to come to a gentle simmer, then blend in the grated Parmesan. Stir continuously until the cheese is fully integrated, around 2 minutes. Lower the heat to medium-low and continue stirring until the sauce thickens, about 5 minutes more. Fold in the cooked pasta, ensuring it is thoroughly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fettuccine-alfredo-recipe/#wprm-recipe-13680-step-0-4"}, {"@type": "HowToStep", "text": "Plate the pasta into serving bowls and top with the sliced chicken. Garnish with freshly chopped parsley and additional cracked pepper as desired.", "name": "Plate the pasta into serving bowls and top with the sliced chicken. Garnish with freshly chopped parsley and additional cracked pepper as desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fettuccine-alfredo-recipe/#wprm-recipe-13680-step-0-5"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Chicken Fettuccine Alfredo Recipe"}</script>
