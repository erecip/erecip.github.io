 or olive oil. Arrange the salmon in a single layer inside the air fryer basket. Cook for 7 minutes, checking once halfway through to ensure the fish does not overcook; the salmon should flake easily with a fork. In a separate small bowl, whisk together the mayonnaise, sriracha, soy sauce, minced garlic, minced ginger, and sesame oil until smooth. To assemble, spoon cooked rice into serving bowls, arrange cucumber, carrot, snap peas, and avocado on top, then add the cooked salmon. Drizzle generously with spicy mayo and sprinkle with scallions and furikake or sesame seeds as desired. Serve immediately.", "name": "Remove the skin from the salmon and cut it into 1-inch pieces. Place the salmon in a medium bowl, season with kosher salt and pepper, and drizzle with sesame oil; toss gently to coat. Prepare all vegetables and set aside. Preheat the air fryer to 400°F and lightly coat the basket with cooking spray or olive oil. Arrange the salmon in a single layer inside the air fryer basket. Cook for 7 minutes, checking once halfway through to ensure the fish does not overcook; the salmon should flake easily with a fork. In a separate small bowl, whisk together the mayonnaise, sriracha, soy sauce, minced garlic, minced ginger, and sesame oil until smooth. To assemble, spoon cooked rice into serving bowls, arrange cucumber, carrot, snap peas, and avocado on top, then add the cooked salmon. Drizzle generously with spicy mayo and sprinkle with scallions and furikake or sesame seeds as desired. Serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-salmon-bowl-recipe/#wprm-recipe-14659-step-0-0"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Asian-inspired"], "keywords": "Air Fryer Salmon Bowl Recipe"}</script>
