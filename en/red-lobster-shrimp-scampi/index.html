rimp-scampi/#wprm-recipe-23240-step-0-0"}, {"@type": "HowToStep", "text": "Warm the olive oil in a large skillet over medium-high heat. Add the shrimp, cooking them for 2 to 3 minutes on each side until they are opaque and lightly browned. Remove the shrimp and set them aside on a plate.", "name": "Warm the olive oil in a large skillet over medium-high heat. Add the shrimp, cooking them for 2 to 3 minutes on each side until they are opaque and lightly browned. Remove the shrimp and set them aside on a plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/red-lobster-shrimp-scampi/#wprm-recipe-23240-step-0-1"}, {"@type": "HowToStep", "text": "To the same skillet, add minced garlic and sauté for about 1 minute, until fragrant.", "name": "To the same skillet, add minced garlic and sauté for about 1 minute, until fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/red-lobster-shrimp-scampi/#wprm-recipe-23240-step-0-2"}, {"@type": "HowToStep", "text": "Deglaze the pan by pouring in the white wine and lemon juice, scraping any browned bits from the bottom of the pan with a wooden or silicone spoon. Bring the mixture to a boil, then reduce to a simmer and let cook for 5 minutes.", "name": "Deglaze the pan by pouring in the white wine and lemon juice, scraping any browned bits from the bottom of the pan with a wooden or silicone spoon. Bring the mixture to a boil, then reduce to a simmer and let cook for 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/red-lobster-shrimp-scampi/#wprm-recipe-23240-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the unsalted butter and the remaining 1 teaspoon of Old Bay Seasoning, allowing the butter to melt completely and blend into the sauce.", "name": "Stir in the unsalted butter and the remaining 1 teaspoon of Old Bay Seasoning, allowing the butter to melt completely and blend into the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/red-lobster-shrimp-scampi/#wprm-recipe-23240-step-0-4"}, {"@type": "HowToStep", "text": "Return the shrimp to the skillet, stirring gently to coat them in the sauce. Taste and adjust the seasoning with more salt and black pepper, if needed.", "name": "Return the shrimp to the skillet, stirring gently to coat them in the sauce. Taste and adjust the seasoning with more salt and black pepper, if needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/red-lobster-shrimp-scampi/#wprm-recipe-23240-step-0-5"}, {"@type": "HowToStep", "text": "Garnish with chopped fresh parsley and grated Parmesan cheese. Serve immediately.", "name": "Garnish with chopped fresh parsley and grated Parmesan cheese. Serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/red-lobster-shrimp-scampi/#wprm-recipe-23240-step-0-6"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"]}</script>
