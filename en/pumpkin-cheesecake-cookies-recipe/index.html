    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Cheesecake Cookies Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Deliciously soft pumpkin cookies filled with a creamy cheesecake center and dusted in spiced cinnamon sugar. These delightful cookies are sure to satisfy any sweet tooth!", "datePublished": "2024-02-18T17:57:10+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/8b4fa2bb13-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/8b4fa2bb13-1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/8b4fa2bb13-1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/8b4fa2bb13-1-480x270.jpg"], "recipeYield": ["12", "12 cookies"], "prepTime": "PT15M", "cookTime": "PT16M", "totalTime": "PT91M", "recipeIngredient": ["1/2 cup 1 stick unsalted butter, softened (113g)", "2/3 cup packed light brown sugar (133g)", "1/4 cup granulated sugar (50g)", "1 1/2 cups all-purpose flour (195g)", "1/2 tsp baking soda (3g)", "1/2 tsp ground cinnamon (2g)", "1/4 tsp ground ginger (1g)", "1/4 tsp ground nutmeg (1g)", "1/4 tsp fine salt (1g)", "1/3 cup pumpkin puree (75g)", "Orange gel food coloring (optional)", "3/4 cup cream cheese (softened (170g or 6 oz.))", "1/4 cup granulated sugar (50g)", "1 tsp vanilla extract (4g)", "1/3 cup granulated sugar (66g)", "1/2 tsp ground cinnamon (2g)", "1/4 tsp ground ginger (1g)"], "recipeInstructions": [{"@type": "HowToSection", "name": "Pumpkin Cookies", "itemListElement": [{"@type": "HowToStep", "text": "In a medium bowl, whisk together the flour, baking soda, ground cinnamon, ground ginger, ground nutmeg, and salt. Set aside.", "name": "In a medium bowl, whisk together the flour, baking soda, ground cinnamon, ground ginger, ground nutmeg, and salt. Set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-0-0"}, {"@type": "HowToStep", "text": "In a separate large bowl, cream the butter, brown sugar, and granulated sugar using a hand or stand mixer until the mixture is light and fluffy (about 1 minute).", "name": "In a separate large bowl, cream the butter, brown sugar, and granulated sugar using a hand or stand mixer until the mixture is light and fluffy (about 1 minute).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-0-1"}, {"@type": "HowToStep", "text": "Place the pumpkin puree on a paper towel and gently press to remove excess moisture, then add it to the butter mixture. Mix until fully combined, adding a drop of orange gel food coloring if you’d like a brighter color.", "name": "Place the pumpkin puree on a paper towel and gently press to remove excess moisture, then add it to the butter mixture. Mix until fully combined, adding a drop of orange gel food coloring if you’d like a brighter color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-0-2"}, {"@type": "HowToStep", "text": "Add the dry ingredients to the wet ingredients and mix on low until just incorporated. Scrape down the sides of the bowl with a spatula as needed.", "name": "Add the dry ingredients to the wet ingredients and mix on low until just incorporated. Scrape down the sides of the bowl with a spatula as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-0-3"}, {"@type": "HowToStep", "text": "Use a cookie scoop or spoon to form 12 balls of dough, each about 2 1/2 tablespoons. Place the dough balls on a parchment-lined baking sheet and refrigerate for 1 hour, or until firm.", "name": "Use a cookie scoop or spoon to form 12 balls of dough, each about 2 1/2 tablespoons. Place the dough balls on a parchment-lined baking sheet and refrigerate for 1 hour, or until firm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-0-4"}]}, {"@type": "HowToSection", "name": "Cheesecake Filling", "itemListElement": [{"@type": "HowToStep", "text": "While the dough chills, prepare the cheesecake filling by beating the cream cheese, sugar, and vanilla extract together until smooth and well-mixed.", "name": "While the dough chills, prepare the cheesecake filling by beating the cream cheese, sugar, and vanilla extract together until smooth and well-mixed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-1-0"}, {"@type": "HowToStep", "text": "Using a spoon, portion 12 small dollops of the filling (about 1 1/2 tablespoons each) onto a parchment-lined tray. Place in the freezer for 45 minutes, until slightly firm.", "name": "Using a spoon, portion 12 small dollops of the filling (about 1 1/2 tablespoons each) onto a parchment-lined tray. Place in the freezer for 45 minutes, until slightly firm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-1-1"}]}, {"@type": "HowToSection", "name": "Cinnamon Sugar Coating", "itemListElement": [{"@type": "HowToStep", "text": "In a small bowl, mix the granulated sugar, cinnamon, and ground ginger. Set aside.", "name": "In a small bowl, mix the granulated sugar, cinnamon, and ground ginger. Set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-2-0"}]}, {"@type": "HowToSection", "name": "Assembling the Pumpkin Cheesecake Cookies", "itemListElement": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C) and line two baking sheets with parchment paper.", "name": "Preheat the oven to 350°F (175°C) and line two baking sheets with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-3-0"}, {"@type": "HowToStep", "text": "Remove the cookie dough and cheesecake filling from the fridge and freezer. Flatten each ball of dough in your hand, place a dollop of cheesecake filling in the center, and carefully wrap the dough around the filling to seal it. If needed, chill the dough again if it becomes too soft to handle.", "name": "Remove the cookie dough and cheesecake filling from the fridge and freezer. Flatten each ball of dough in your hand, place a dollop of cheesecake filling in the center, and carefully wrap the dough around the filling to seal it. If needed, chill the dough again if it becomes too soft to handle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-3-1"}, {"@type": "HowToStep", "text": "Roll each filled cookie in the cinnamon sugar mixture until fully coated, then place them on the prepared baking sheets, spacing them about 3 inches apart.", "name": "Roll each filled cookie in the cinnamon sugar mixture until fully coated, then place them on the prepared baking sheets, spacing them about 3 inches apart.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-3-2"}, {"@type": "HowToStep", "text": "Lightly press each cookie down and bake for 16-19 minutes, until set around the edges. Allow cookies to cool on a wire rack before serving.", "name": "Lightly press each cookie down and bake for 16-19 minutes, until set around the edges. Allow cookies to cool on a wire rack before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake-cookies-recipe/#wprm-recipe-4748-step-3-3"}]}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Cheesecake Cookies Recipe"}</script>
