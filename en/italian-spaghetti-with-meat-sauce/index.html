    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Italian Spaghetti with Meat Sauce", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty Italian-style spaghetti dish featuring ground beef simmered slowly with tomatoes, mushrooms, aromatic vegetables, red wine, beef broth, herbs, and warm spices. The extended simmer develops a deep, robust sauce that coats the pasta thoroughly before serving with Parmesan and fresh parsley.", "datePublished": "2022-05-29T14:34:19+00:00", "image": ["https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/italian-spaghetti-with-meat-sauce.png", "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/italian-spaghetti-with-meat-sauce.png", "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/italian-spaghetti-with-meat-sauce.png", "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/italian-spaghetti-with-meat-sauce.png"], "totalTime": "PT220M", "recipeIngredient": ["1  can (6 oz tomato paste)", "4  celery stalks (cut into approximately 1/4-inch pieces)", "1 cup dry red wine (preferably one suitable for drinking)", "2  bay leaves", "1 lb ground beef (85% lean, browned and drained)", "1 teaspoon dried basil", "1  can (15 oz beef broth)", "4  –6 whole cloves", "2 tablespoons granulated sugar", "1  yellow onion (diced into roughly 1/4-inch pieces)", "1 teaspoon freshly ground black pepper", "2  cans sliced mushrooms (drained, or 8 oz fresh mushrooms, sliced)", "1 teaspoon dried oregano", "4  fresh garlic cloves (finely minced)", "1  can diced tomatoes (preferably San Marzano)", "1/4 cup fresh parsley (finely chopped into approximately 1/8-inch pieces)", "1 teaspoon kosher salt", "1  can tomato sauce", "1 lb dry spaghetti", "Freshly grated Parmesan cheese", "Fresh parsley (for garnish)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Dice the onion and celery into approximately 1/4-inch pieces. Finely mince the garlic and chop the fresh parsley.", "name": "Dice the onion and celery into approximately 1/4-inch pieces. Finely mince the garlic and chop the fresh parsley.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-0"}, {"@type": "HowToStep", "text": "Meanwhile, place the ground beef in a large, heavy-bottomed pot over medium-high heat. Cook for approximately 5–7 minutes, breaking the meat into smaller pieces as it browns, until no pink remains.", "name": "Meanwhile, place the ground beef in a large, heavy-bottomed pot over medium-high heat. Cook for approximately 5–7 minutes, breaking the meat into smaller pieces as it browns, until no pink remains.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-1"}, {"@type": "HowToStep", "text": "Carefully drain away the excess fat while keeping the browned beef in the pot.", "name": "Carefully drain away the excess fat while keeping the browned beef in the pot.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-2"}, {"@type": "HowToStep", "text": "Add the chopped onion and celery to the browned beef. Cook over medium heat for 5–7 minutes, stirring from time to time, until the vegetables become tender and aromatic.", "name": "Add the chopped onion and celery to the browned beef. Cook over medium heat for 5–7 minutes, stirring from time to time, until the vegetables become tender and aromatic.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and continue cooking for another 30 seconds to 1 minute, just until fragrant. Avoid allowing the garlic to burn.", "name": "Stir in the minced garlic and continue cooking for another 30 seconds to 1 minute, just until fragrant. Avoid allowing the garlic to burn.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-4"}, {"@type": "HowToStep", "text": "Pour the diced tomatoes, tomato sauce, tomato paste, drained mushrooms, dry red wine, and beef broth into the pot.", "name": "Pour the diced tomatoes, tomato sauce, tomato paste, drained mushrooms, dry red wine, and beef broth into the pot.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-5"}, {"@type": "HowToStep", "text": "Stir thoroughly until the ingredients are evenly combined and the tomato paste has completely blended into the liquid.", "name": "Stir thoroughly until the ingredients are evenly combined and the tomato paste has completely blended into the liquid.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-6"}, {"@type": "HowToStep", "text": "Increase the heat to medium-high and bring the sauce mixture to a boil.", "name": "Increase the heat to medium-high and bring the sauce mixture to a boil.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-7"}, {"@type": "HowToStep", "text": "Once boiling, add the whole cloves, bay leaves, sugar, dried basil, dried oregano, kosher salt, and black pepper.", "name": "Once boiling, add the whole cloves, bay leaves, sugar, dried basil, dried oregano, kosher salt, and black pepper.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-8"}, {"@type": "HowToStep", "text": "Stir well, reduce the heat to low, and partially cover the pot. Allow the sauce to simmer gently for 3 hours, stirring approximately every 30 minutes.", "name": "Stir well, reduce the heat to low, and partially cover the pot. Allow the sauce to simmer gently for 3 hours, stirring approximately every 30 minutes.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-9"}, {"@type": "HowToStep", "text": "Approximately 15–20 minutes before the sauce has finished simmering, bring a large pot of salted water to a rolling boil.", "name": "Approximately 15–20 minutes before the sauce has finished simmering, bring a large pot of salted water to a rolling boil.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-10"}, {"@type": "HowToStep", "text": "Add the dry spaghetti and cook according to the package directions until al dente, leaving the pasta slightly firm when bitten.", "name": "Add the dry spaghetti and cook according to the package directions until al dente, leaving the pasta slightly firm when bitten.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-11"}, {"@type": "HowToStep", "text": "Before draining, reserve approximately 1 cup of the starchy pasta cooking water. Drain the spaghetti in a colander.", "name": "Before draining, reserve approximately 1 cup of the starchy pasta cooking water. Drain the spaghetti in a colander.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-12"}, {"@type": "HowToStep", "text": "Remove the finished sauce from the heat. Using a slotted spoon or small strainer, carefully remove and discard the bay leaves and whole cloves.", "name": "Remove the finished sauce from the heat. Using a slotted spoon or small strainer, carefully remove and discard the bay leaves and whole cloves.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-13"}, {"@type": "HowToStep", "text": "Transfer the drained spaghetti directly into the sauce and stir until every strand is evenly coated.", "name": "Transfer the drained spaghetti directly into the sauce and stir until every strand is evenly coated.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-14"}, {"@type": "HowToStep", "text": "If the sauce is thicker than desired, incorporate a small amount of the reserved pasta water until the preferred consistency is reached.", "name": "If the sauce is thicker than desired, incorporate a small amount of the reserved pasta water until the preferred consistency is reached.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-15"}, {"@type": "HowToStep", "text": "Divide the spaghetti and meat sauce among individual bowls or plates.", "name": "Divide the spaghetti and meat sauce among individual bowls or plates.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-16"}, {"@type": "HowToStep", "text": "Finish each serving generously with freshly grated Parmesan cheese and a light scattering of fresh parsley.", "name": "Finish each serving generously with freshly grated Parmesan cheese and a light scattering of fresh parsley.", "url": "https://erecip.github.io/en/italian-spaghetti-with-meat-sauce/#wprm-recipe-46119-step-0-17"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Italian Spaghetti with Meat Sauce"}</script>
