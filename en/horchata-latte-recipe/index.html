nder. Process the mixture until the rice has been finely pulverized.", "name": "Transfer the soaked rice and its water to a blender. Process the mixture until the rice has been finely pulverized.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-latte-recipe/#wprm-recipe-39511-step-0-1"}, {"@type": "HowToStep", "text": "Pour the blended mixture through a fine-mesh sieve into a spacious bowl or pitcher. Discard the remaining rice solids and retain the strained rice-infused liquid.", "name": "Pour the blended mixture through a fine-mesh sieve into a spacious bowl or pitcher. Discard the remaining rice solids and retain the strained rice-infused liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-latte-recipe/#wprm-recipe-39511-step-0-2"}, {"@type": "HowToStep", "text": "Add the evaporated milk, sweetened condensed milk, ground cinnamon, and vanilla extract to the strained rice water. Stir thoroughly until the dairy ingredients and flavorings are evenly incorporated.", "name": "Add the evaporated milk, sweetened condensed milk, ground cinnamon, and vanilla extract to the strained rice water. Stir thoroughly until the dairy ingredients and flavorings are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-latte-recipe/#wprm-recipe-39511-step-0-3"}, {"@type": "HowToStep", "text": "Pour the prepared horchata into a saucepan and place it over medium heat. Warm it gently, stirring at regular intervals, until it reaches the desired serving temperature. Do not allow the mixture to boil.", "name": "Pour the prepared horchata into a saucepan and place it over medium heat. Warm it gently, stirring at regular intervals, until it reaches the desired serving temperature. Do not allow the mixture to boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-latte-recipe/#wprm-recipe-39511-step-0-4"}, {"@type": "HowToStep", "text": "Pour 6 ounces of warm horchata into a mug a
