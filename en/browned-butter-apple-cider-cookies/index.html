    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Browned Butter Apple Cider Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, chewy apple cider cookies enriched with nutty browned butter, dark brown sugar, apple butter, warm autumn spices, and white chocolate. Concentrated cider deepens the apple flavor, while a maple cream drizzle—or an apple cider glaze—provides a sweet finishing layer.", "datePublished": "2019-07-07T11:26:34+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/browned-butter-apple-cider-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/browned-butter-apple-cider-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/browned-butter-apple-cider-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/browned-butter-apple-cider-cookies.png"], "cookTime": "PT11M", "totalTime": "PT11M", "recipeIngredient": ["2 1/2 tablespoons apple butter", "140 g plain all-purpose flour", "1/2 cup unsalted butter (browned and chilled until it reaches a soft paste consistency)", "3/8 teaspoon ground cinnamon", "1 tablespoon concentrated apple cider (reduced to one-quarter of its starting volume and fully cooled)", "1/3 cup coarsely chopped white chocolate or white chocolate chips", "1/2 tablespoon pure maple syrup", "1/4 teaspoon baking powder", "2/3 cup firmly packed dark brown sugar", "1/8 teaspoon ground ginger", "1/2  of a large egg yolk (brought to room temperature, approximately 70°F)", "3/8 teaspoon baking soda", "1/8 teaspoon ground allspice", "1/2 teaspoon vanilla bean paste or vanilla extract", "1/4 teaspoon fine sea salt", "1/8 teaspoon ground nutmeg", "2  –3 tablespoons maple cream", "1/2 cup confectioners' sugar", "1 tablespoon reduced apple cider"], "recipeInstructions": [{"@type": "HowToStep", "text": "Pour apple cider into a saucepan and bring it to a boil over medium-high heat. Continue simmering until the liquid has reduced to one-quarter of its original volume. Measure 1 tablespoon for the recipe and allow it to cool completely before use. If prepared in advance, keep the reduction refrigerated.", "name": "Pour apple cider into a saucepan and bring it to a boil over medium-high heat. Continue simmering until the liquid has reduced to one-quarter of its original volume. Measure 1 tablespoon for the recipe and allow it to cool completely before use. If prepared in advance, keep the reduction refrigerated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-0"}, {"@type": "HowToStep", "text": "Place the unsalted butter in a saucepan over medium heat and allow it to melt. Continue cooking while occasionally swirling the pan until toasted brown milk solids develop on the bottom and the butter gives off a distinctly nutty aroma. Immediately transfer the browned butter to a heatproof container. Refrigerate until it becomes semi-firm and resembles a loose, spreadable paste rather than solid butter.", "name": "Place the unsalted butter in a saucepan over medium heat and allow it to melt. Continue cooking while occasionally swirling the pan until toasted brown milk solids develop on the bottom and the butter gives off a distinctly nutty aroma. Immediately transfer the browned butter to a heatproof container. Refrigerate until it becomes semi-firm and resembles a loose, spreadable paste rather than solid butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-1"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Place the cooled browned butter and packed dark brown sugar in a large mixing bowl. Beat with an electric mixer at medium-high speed for approximately 1 minute, until thoroughly blended.", "name": "Preheat the oven to 350°F (175°C). Place the cooled browned butter and packed dark brown sugar in a large mixing bowl. Beat with an electric mixer at medium-high speed for approximately 1 minute, until thoroughly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-2"}, {"@type": "HowToStep", "text": "Add the maple syrup, apple butter, 1 tablespoon of cooled reduced cider, room-temperature egg yolk, and vanilla bean paste or extract. Continue mixing until the ingredients form a smooth, cohesive base.", "name": "Add the maple syrup, apple butter, 1 tablespoon of cooled reduced cider, room-temperature egg yolk, and vanilla bean paste or extract. Continue mixing until the ingredients form a smooth, cohesive base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-3"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk together the all-purpose flour, fine sea salt, baking soda, baking powder, cinnamon, nutmeg, allspice, and ginger until evenly distributed.", "name": "In a separate bowl, whisk together the all-purpose flour, fine sea salt, baking soda, baking powder, cinnamon, nutmeg, allspice, and ginger until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-4"}, {"@type": "HowToStep", "text": "Gradually mix the dry ingredients into the wet mixture at low speed, stopping as soon as the flour mixture has been incorporated. Using a wooden spoon or similar utensil, gently fold in the chopped white chocolate until it is dispersed throughout the dough.", "name": "Gradually mix the dry ingredients into the wet mixture at low speed, stopping as soon as the flour mixture has been incorporated. Using a wooden spoon or similar utensil, gently fold in the chopped white chocolate until it is dispersed throughout the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-5"}, {"@type": "HowToStep", "text": "Line two baking sheets with parchment paper. Divide the cookie dough into 16–18 portions and roll or scoop them into balls. Arrange the portions approximately 2 inches apart on the prepared baking sheets.", "name": "Line two baking sheets with parchment paper. Divide the cookie dough into 16–18 portions and roll or scoop them into balls. Arrange the portions approximately 2 inches apart on the prepared baking sheets.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-6"}, {"@type": "HowToStep", "text": "Bake for 9–11 minutes. The cookies should appear puffed and soft, with centers that still look slightly underdone when removed from the oven.", "name": "Bake for 9–11 minutes. The cookies should appear puffed and soft, with centers that still look slightly underdone when removed from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-7"}, {"@type": "HowToStep", "text": "Leave the cookies on the baking sheets for several minutes so they can continue setting from the residual heat. Transfer them afterward to a wire cooling rack and allow them to cool completely.", "name": "Leave the cookies on the baking sheets for several minutes so they can continue setting from the residual heat. Transfer them afterward to a wire cooling rack and allow them to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-8"}, {"@type": "HowToStep", "text": "Once the cookies have fully cooled, drizzle 2–3 tablespoons of maple cream across their tops.", "name": "Once the cookies have fully cooled, drizzle 2–3 tablespoons of maple cream across their tops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-9"}, {"@type": "HowToStep", "text": "For the alternate topping, whisk 1/2 cup confectioners' sugar with 1 tablespoon of the reduced apple cider until a smooth glaze forms. Drizzle the glaze over the cooled cookies using a fork or piping bag.", "name": "For the alternate topping, whisk 1/2 cup confectioners' sugar with 1 tablespoon of the reduced apple cider until a smooth glaze forms. Drizzle the glaze over the cooled cookies using a fork or piping bag.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/browned-butter-apple-cider-cookies/#wprm-recipe-44601-step-0-10"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Browned Butter Apple Cider Cookies"}</script>
