    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "30 Minute Puff Pastry Pecan Pie Bites", "author": {"@type": "Person", "name": "BenDes"}, "description": "Flaky puff pastry surrounds a rich pecan filling made with dark brown sugar, butter, cream, and vanilla in these compact pecan pie-inspired bites. A brief chilling period helps the pastry hold its shape and develop crisp, well-defined layers during baking.", "datePublished": "2020-06-25T08:17:12+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/30-minute-puff-pastry-pecan-pie-bites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/30-minute-puff-pastry-pecan-pie-bites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/30-minute-puff-pastry-pecan-pie-bites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/30-minute-puff-pastry-pecan-pie-bites2.png"], "cookTime": "PT15M", "totalTime": "PT30M", "recipeIngredient": ["1 1/2 cups pecans (roughly chopped to retain texture)", "1/4 cup heavy cream", "Pinch of salt", "5 tablespoons unsalted butter", "1 teaspoon vanilla extract", "1/2 cup dark brown sugar (packed)", "1  large egg (beaten for brushing)", "1  frozen puff pastry sheet (thawed as directed on the package)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 400°F (200°C). Cover a baking sheet with parchment paper and set it aside until the assembled pastries are ready.", "name": "Heat the oven to 400°F (200°C). Cover a baking sheet with parchment paper and set it aside until the assembled pastries are ready.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-0"}, {"@type": "HowToStep", "text": "Place the unsalted butter in a medium saucepan over medium heat and allow it to melt completely.", "name": "Place the unsalted butter in a medium saucepan over medium heat and allow it to melt completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-1"}, {"@type": "HowToStep", "text": "Stir the packed dark brown sugar, coarsely chopped pecans, and a pinch of salt into the melted butter. Cook for several minutes, stirring from time to time, until the mixture becomes slightly thicker.", "name": "Stir the packed dark brown sugar, coarsely chopped pecans, and a pinch of salt into the melted butter. Cook for several minutes, stirring from time to time, until the mixture becomes slightly thicker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-2"}, {"@type": "HowToStep", "text": "Pour in the heavy cream and add the vanilla extract. Continue cooking for 1 additional minute, stirring continuously.", "name": "Pour in the heavy cream and add the vanilla extract. Continue cooking for 1 additional minute, stirring continuously.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-3"}, {"@type": "HowToStep", "text": "Take the saucepan off the heat and allow the pecan mixture to cool for a few minutes before filling the pastry. Slight cooling prevents the warm mixture from prematurely softening or melting the puff pastry.", "name": "Take the saucepan off the heat and allow the pecan mixture to cool for a few minutes before filling the pastry. Slight cooling prevents the warm mixture from prematurely softening or melting the puff pastry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-4"}, {"@type": "HowToStep", "text": "While the filling cools, lightly dust the work surface with flour and gently roll out the thawed puff pastry sheet.", "name": "While the filling cools, lightly dust the work surface with flour and gently roll out the thawed puff pastry sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-5"}, {"@type": "HowToStep", "text": "Divide the pastry into 6 evenly sized rectangles.", "name": "Divide the pastry into 6 evenly sized rectangles.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-6"}, {"@type": "HowToStep", "text": "Spoon approximately 1 tablespoon of the cooled pecan mixture into the middle of each pastry rectangle.", "name": "Spoon approximately 1 tablespoon of the cooled pecan mixture into the middle of each pastry rectangle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-7"}, {"@type": "HowToStep", "text": "Bring the corners of each rectangle inward toward the center, crossing them over one another to create a closed pocket resembling a dumpling.", "name": "Bring the corners of each rectangle inward toward the center, crossing them over one another to create a closed pocket resembling a dumpling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-8"}, {"@type": "HowToStep", "text": "Beat the large egg in a small bowl until evenly combined.", "name": "Beat the large egg in a small bowl until evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-9"}, {"@type": "HowToStep", "text": "Brush the beaten egg over the tops of the shaped pastries. This coating encourages an evenly golden finish while also helping the pastry edges remain secured.", "name": "Brush the beaten egg over the tops of the shaped pastries. This coating encourages an evenly golden finish while also helping the pastry edges remain secured.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-10"}, {"@type": "HowToStep", "text": "Transfer the filled pastries to the parchment-lined baking sheet and place them in the freezer for 10–15 minutes. This short chilling period helps limit spreading and supports a more pronounced puff during baking.", "name": "Transfer the filled pastries to the parchment-lined baking sheet and place them in the freezer for 10–15 minutes. This short chilling period helps limit spreading and supports a more pronounced puff during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-11"}, {"@type": "HowToStep", "text": "Place the chilled pastries in the preheated 400°F (200°C) oven and bake for approximately 15 minutes, or until the pastry has risen and developed a deep golden color.", "name": "Place the chilled pastries in the preheated 400°F (200°C) oven and bake for approximately 15 minutes, or until the pastry has risen and developed a deep golden color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-12"}, {"@type": "HowToStep", "text": "Remove the pecan pie bites from the oven and allow them to cool briefly before serving. Serve warm for the best combination of crisp pastry and rich pecan filling.", "name": "Remove the pecan pie bites from the oven and allow them to cool briefly before serving. Serve warm for the best combination of crisp pastry and rich pecan filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-puff-pastry-pecan-pie-bites/#wprm-recipe-44987-step-0-13"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "30 Minute Puff Pastry Pecan Pie Bites"}</script>
