ffles-recipe/#wprm-recipe-32901-step-0-5"}, {"@type": "HowToStep", "text": "If the mixture begins to soften excessively while forming, briefly return it to the refrigerator to firm up before continuing.", "name": "If the mixture begins to soften excessively while forming, briefly return it to the refrigerator to firm up before continuing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-truffles-recipe/#wprm-recipe-32901-step-0-6"}, {"@type": "HowToStep", "text": "Roll the shaped truffles in your preferred toppings—cocoa powder, ground nuts, or sprinkles—then arrange them on a parchment-lined tray.", "name": "Roll the shaped truffles in your preferred toppings—cocoa powder, ground nuts, or sprinkles—then arrange them on a parchment-lined tray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-truffles-recipe/#wprm-recipe-32901-step-0-7"}, {"@type": "HowToStep", "text": "Chill the coated truffles again until fully set. Once firm, transfer them to a sealed container.", "name": "Chill the coated truffles again until fully set. Once firm, transfer them to a sealed container.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-truffles-recipe/#wprm-recipe-32901-step-0-8"}, {"@type": "HowToStep", "text": "Keep the truffles refrigerated and allow them to sit at room temperature for approximately 20 minutes before serving to enhance texture and flavor.", "name": "Keep the truffles refrigerated and allow them to sit at room temperature for approximately 20 minutes before serving to enhance texture and flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-truffles-recipe/#wprm-recipe-32901-step-0-9"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "chocolate truffles recipe"}</script>
