    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Sourdough Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "This cottage cheese sourdough bread combines a naturally leavened dough with blended cottage cheese and egg whites, producing a protein-rich loaf with a tender interior and a beautifully browned crust. A series of kneading, stretching, folding, and slow proofing stages develops the dough before it is baked with steam for an improved finish.", "datePublished": "2021-01-20T23:14:47+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/cottage-cheese-sourdough-bread2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/cottage-cheese-sourdough-bread2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/cottage-cheese-sourdough-bread2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/cottage-cheese-sourdough-bread2.png"], "prepTime": "PT25M", "cookTime": "PT45M", "totalTime": "PT100M", "recipeIngredient": ["3/4 cup cottage cheese", "2 1/4 cups bread flour", "1  large egg (for the egg wash)", "1 1/2 teaspoons salt", "3/4 cup egg whites", "Hot water (as needed to create steam during baking)", "3 tablespoons neutral-flavored oil (such as canola or grapeseed oil)", "1/4 cup active (bubbly sourdough starter)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Blend the cottage cheese mixture. Place 185 grams of cottage cheese and 185 grams of egg whites in a small blender. Process until completely smooth and uniform.", "name": "Blend the cottage cheese mixture. Place 185 grams of cottage cheese and 185 grams of egg whites in a small blender. Process until completely smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-0"}, {"@type": "HowToStep", "text": "Combine the wet ingredients. Transfer the blended cottage cheese mixture to a mixing bowl. Add 150 grams of active sourdough starter and 30 grams of neutral oil, then mix thoroughly until evenly incorporated.", "name": "Combine the wet ingredients. Transfer the blended cottage cheese mixture to a mixing bowl. Add 150 grams of active sourdough starter and 30 grams of neutral oil, then mix thoroughly until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-1"}, {"@type": "HowToStep", "text": "Form the dough. Add 325 grams of bread flour and 10 grams of salt. Stir until the ingredients come together into a rough, shaggy dough. Cover the bowl and allow the dough to rest for 30 minutes.", "name": "Form the dough. Add 325 grams of bread flour and 10 grams of salt. Stir until the ingredients come together into a rough, shaggy dough. Cover the bowl and allow the dough to rest for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-2"}, {"@type": "HowToStep", "text": "Begin kneading. After the first rest, knead the dough for 2–3 minutes using a pulling and slapping technique. Cover the bowl again and leave the dough undisturbed for another 30 minutes.", "name": "Begin kneading. After the first rest, knead the dough for 2–3 minutes using a pulling and slapping technique. Cover the bowl again and leave the dough undisturbed for another 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-3"}, {"@type": "HowToStep", "text": "Repeat the kneading stage. Knead for an additional 2–3 minutes in the same manner. Cover and rest for another 30 minutes.", "name": "Repeat the kneading stage. Knead for an additional 2–3 minutes in the same manner. Cover and rest for another 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-4"}, {"@type": "HowToStep", "text": "Complete the first stretch and fold. Lift and stretch the dough before folding it back over itself, working from each cardinal direction. Complete approximately 6–8 folds in total. Cover and rest for 30 minutes.", "name": "Complete the first stretch and fold. Lift and stretch the dough before folding it back over itself, working from each cardinal direction. Complete approximately 6–8 folds in total. Cover and rest for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-5"}, {"@type": "HowToStep", "text": "Perform the second stretch and fold. Repeat the folding process, this time completing 4–6 folds. Cover the dough and allow it to rest for another 30 minutes.", "name": "Perform the second stretch and fold. Repeat the folding process, this time completing 4–6 folds. Cover the dough and allow it to rest for another 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-6"}, {"@type": "HowToStep", "text": "Add an optional third fold. If desired, perform one additional stretch-and-fold session using 4 folds. Cover and rest the dough for another 30 minutes.", "name": "Add an optional third fold. If desired, perform one additional stretch-and-fold session using 4 folds. Cover and rest the dough for another 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-7"}, {"@type": "HowToStep", "text": "Shape the loaf. Lightly dust a work surface with flour and turn the dough onto it. Gently pat it into a rectangular shape.", "name": "Shape the loaf. Lightly dust a work surface with flour and turn the dough onto it. Gently pat it into a rectangular shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-8"}, {"@type": "HowToStep", "text": "Form a log. Fold the left and right sides toward the center, then roll the dough into a log. Pinch the seams firmly closed.", "name": "Form a log. Fold the left and right sides toward the center, then roll the dough into a log. Pinch the seams firmly closed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-9"}, {"@type": "HowToStep", "text": "Transfer to the loaf pan. Place the shaped dough seam-side down in a greased 9 × 5-inch loaf pan. Lightly coat the surface with oil to help prevent the covering from sticking.", "name": "Transfer to the loaf pan. Place the shaped dough seam-side down in a greased 9 × 5-inch loaf pan. Lightly coat the surface with oil to help prevent the covering from sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-10"}, {"@type": "HowToStep", "text": "Proof the dough. Cover the loaf and leave it to ferment until the dough fills the pan and reaches the rim or rises slightly above it. This stage generally requires approximately 8–12 hours.", "name": "Proof the dough. Cover the loaf and leave it to ferment until the dough fills the pan and reaches the rim or rises slightly above it. This stage generally requires approximately 8–12 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-11"}, {"@type": "HowToStep", "text": "Prepare for baking. Preheat the oven to 350°F (175°C). At the same time, bring water to a boil in a kettle or saucepan.", "name": "Prepare for baking. Preheat the oven to 350°F (175°C). At the same time, bring water to a boil in a kettle or saucepan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-12"}, {"@type": "HowToStep", "text": "Apply the egg wash. Uncover the proofed loaf and brush its surface with an egg wash prepared from one whole egg or one egg yolk.", "name": "Apply the egg wash. Uncover the proofed loaf and brush its surface with an egg wash prepared from one whole egg or one egg yolk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-13"}, {"@type": "HowToStep", "text": "Create steam and bake. Position an oven-safe pan beside the loaf and carefully pour the boiling water into it. Bake the bread for 45–50 minutes, or until the center of the loaf reaches an internal temperature of 190°F (88°C).", "name": "Create steam and bake. Position an oven-safe pan beside the loaf and carefully pour the boiling water into it. Bake the bread for 45–50 minutes, or until the center of the loaf reaches an internal temperature of 190°F (88°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-14"}, {"@type": "HowToStep", "text": "Cool the loaf. Leave the baked bread in its pan for 5–10 minutes. Remove it from the pan and transfer it to a wire cooling rack.", "name": "Cool the loaf. Leave the baked bread in its pan for 5–10 minutes. Remove it from the pan and transfer it to a wire cooling rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-15"}, {"@type": "HowToStep", "text": "Allow the crumb to set. Cool for at least 30 minutes before slicing.", "name": "Allow the crumb to set. Cool for at least 30 minutes before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-sourdough-bread/#wprm-recipe-43998-step-0-16"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Cottage Cheese Sourdough Bread"}</script>
