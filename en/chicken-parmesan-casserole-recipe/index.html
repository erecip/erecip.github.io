    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Parmesan Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic comfort food favorite turned into a hearty baked dish, this Chicken Parmesan Casserole features tender chicken, pasta enveloped in marinara, and a generous blanket of gooey mozzarella and savory Parmesan. Ideal for using fresh, frozen, or pre-cooked chicken, this casserole delivers crisp textures and rich Italian flavor in every bite.", "datePublished": "2024-04-30T18:06:31+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/Chicken-Parmesan-Casserole3.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/Chicken-Parmesan-Casserole3.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/Chicken-Parmesan-Casserole3.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/Chicken-Parmesan-Casserole3.png"], "prepTime": "PT40M", "cookTime": "PT40M", "totalTime": "PT80M", "recipeIngredient": ["2 tablespoons unsalted butter", "¾ cup of all-purpose flour", "1 ½ cups seasoned Italian-style breadcrumbs", "2  large eggs (beaten)", "¾ pound of rigatoni pasta", "1/3 cup grated Parmesan (split for layering)", "¾ cup neutral cooking oil (such as vegetable oil)", "3 cups shredded mozzarella (divided use)", "2  boneless (skinless chicken breasts, small in size)", "2 teaspoons seasoned salt blend", "1/4 teaspoon ground black pepper", "32 oz. of marinara sauce (with up to 48 oz. for extra sauciness)", "Fresh chopped parsley (for garnish)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of salted water to a boil. Cook rigatoni until just shy of al dente—about one minute less than the package instructions. Drain and return the pasta to the pot. Stir in 32 ounces of marinara, 2 tablespoons of Parmesan, and 1 cup of mozzarella. Set aside.", "name": "Bring a large pot of salted water to a boil. Cook rigatoni until just shy of al dente—about one minute less than the package instructions. Drain and return the pasta to the pot. Stir in 32 ounces of marinara, 2 tablespoons of Parmesan, and 1 cup of mozzarella. Set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-0-0"}, {"@type": "HowToStep", "text": "While waiting for the pasta to cook, prepare the chicken. Pat the chicken breasts dry and slice them into half-inch thick strips.", "name": "While waiting for the pasta to cook, prepare the chicken. Pat the chicken breasts dry and slice them into half-inch thick strips.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-0-1"}, {"@type": "HowToSection", "name": "Set up a breading station using three bowls:", "itemListElement": [{"@type": "HowToStep", "text": "Bowl one: combine the flour with seasoned salt and pepper.", "name": "Bowl one: combine the flour with seasoned salt and pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-1-0"}, {"@type": "HowToStep", "text": "Bowl two: add the whisked eggs.", "name": "Bowl two: add the whisked eggs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-1-1"}, {"@type": "HowToStep", "text": "Bowl three: fill with Italian breadcrumbs.", "name": "Bowl three: fill with Italian breadcrumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-1-2"}, {"@type": "HowToStep", "text": "Coat each chicken strip in the flour mixture, then dip into the eggs, followed by a full coating in breadcrumbs. Gently press the crumbs onto the chicken to adhere thoroughly.", "name": "Coat each chicken strip in the flour mixture, then dip into the eggs, followed by a full coating in breadcrumbs. Gently press the crumbs onto the chicken to adhere thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-1-3"}, {"@type": "HowToStep", "text": "Heat a layer of oil about ¼ inch deep in a skillet over medium-high, adding the butter to enhance browning. Once the oil is hot, use tongs to place the chicken into the pan in batches. Fry each side for roughly 4 minutes or until golden and cooked through. Transfer finished strips to a paper towel-lined plate to drain excess oil. After cooling slightly, slice into bite-sized pieces.", "name": "Heat a layer of oil about ¼ inch deep in a skillet over medium-high, adding the butter to enhance browning. Once the oil is hot, use tongs to place the chicken into the pan in batches. Fry each side for roughly 4 minutes or until golden and cooked through. Transfer finished strips to a paper towel-lined plate to drain excess oil. After cooling slightly, slice into bite-sized pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-1-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C). Lightly grease a 9x13-inch baking dish. Spread half of the pasta mixture into the bottom. Layer with half of the fried chicken pieces, 2 tablespoons of Parmesan, and 1 cup of mozzarella.", "name": "Preheat the oven to 375°F (190°C). Lightly grease a 9x13-inch baking dish. Spread half of the pasta mixture into the bottom. Layer with half of the fried chicken pieces, 2 tablespoons of Parmesan, and 1 cup of mozzarella.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-1-5"}, {"@type": "HowToStep", "text": "Add the rest of the pasta mixture, followed by the remaining chicken. Top evenly with the last of the Parmesan and mozzarella cheese.", "name": "Add the rest of the pasta mixture, followed by the remaining chicken. Top evenly with the last of the Parmesan and mozzarella cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-1-6"}, {"@type": "HowToStep", "text": "Bake uncovered for 25 minutes. For a crispier, golden top, increase oven temperature to 425°F and bake for an additional 5 minutes.", "name": "Bake uncovered for 25 minutes. For a crispier, golden top, increase oven temperature to 425°F and bake for an additional 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-1-7"}, {"@type": "HowToStep", "text": "Finish with a garnish of freshly chopped parsley and serve hot.", "name": "Finish with a garnish of freshly chopped parsley and serve hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-casserole-recipe/#wprm-recipe-32896-step-1-8"}]}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American", "Italian"], "keywords": "chicken parmesan casserole"}</script>
