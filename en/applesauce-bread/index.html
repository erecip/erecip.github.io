    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Applesauce Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warmly spiced quick bread made with unsweetened applesauce, rolled oats, and a blend of all-purpose and whole wheat flours. The loaf bakes to a moist, tender consistency and may be finished with a delicate powdered sugar icing.", "datePublished": "2018-04-26T11:23:03+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/applesauce-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/applesauce-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/applesauce-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/applesauce-bread.png"], "prepTime": "PT15M", "cookTime": "PT55M", "totalTime": "PT145M", "recipeIngredient": ["1 cup unsweetened applesauce", "1 tablespoon pure vanilla extract", "½ cup firmly packed brown sugar", "1 teaspoon ground allspice", "1½ cups all-purpose flour", "½ cup neutral-flavored oil (such as canola or vegetable oil)", "¼ teaspoon ground cloves", "2  large eggs (brought to room temperature)", "1 teaspoon baking soda", "½ cup old-fashioned rolled oats", "1 tablespoon ground cinnamon", "½ cup granulated white sugar", "½ teaspoon kosher salt", "½ cup whole wheat flour", "1 teaspoon baking powder", "½  batch powdered sugar icing"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Thoroughly coat an 8- or 9-inch loaf pan with oil or nonstick cooking spray.", "name": "Preheat the oven to 350°F. Thoroughly coat an 8- or 9-inch loaf pan with oil or nonstick cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/#wprm-recipe-39598-step-0-0"}, {"@type": "HowToStep", "text": "In a medium mixing bowl, combine the all-purpose flour, whole wheat flour, rolled oats, brown sugar, granulated sugar, baking soda, baking powder, kosher salt, cinnamon, allspice, and cloves. Stir until the ingredients are evenly dispersed.", "name": "In a medium mixing bowl, combine the all-purpose flour, whole wheat flour, rolled oats, brown sugar, granulated sugar, baking soda, baking powder, kosher salt, cinnamon, allspice, and cloves. Stir until the ingredients are evenly dispersed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/#wprm-recipe-39598-step-0-1"}, {"@type": "HowToStep", "text": "In a separate large bowl, whisk the eggs, applesauce, neutral oil, and vanilla extract until smooth and fully blended.", "name": "In a separate large bowl, whisk the eggs, applesauce, neutral oil, and vanilla extract until smooth and fully blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/#wprm-recipe-39598-step-0-2"}, {"@type": "HowToStep", "text": "Add the dry mixture to the wet ingredients. Stir only until a thick, uniform batter forms and no visible flour remains. Scrape along the bottom and sides of the bowl to incorporate any unmixed ingredients, taking care not to overwork the batter.", "name": "Add the dry mixture to the wet ingredients. Stir only until a thick, uniform batter forms and no visible flour remains. Scrape along the bottom and sides of the bowl to incorporate any unmixed ingredients, taking care not to overwork the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/#wprm-recipe-39598-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared loaf pan and level the surface with a spatula.", "name": "Transfer the batter to the prepared loaf pan and level the surface with a spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/#wprm-recipe-39598-step-0-4"}, {"@type": "HowToStep", "text": "Bake for 55 to 65 minutes. Begin checking the loaf at approximately 50 minutes to prevent overbaking. The bread is ready when the center feels firm and a toothpick inserted into the middle emerges mostly clean with only a few moist crumbs. Alternatively, the internal temperature should register 200°F.", "name": "Bake for 55 to 65 minutes. Begin checking the loaf at approximately 50 minutes to prevent overbaking. The bread is ready when the center feels firm and a toothpick inserted into the middle emerges mostly clean with only a few moist crumbs. Alternatively, the internal temperature should register 200°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/#wprm-recipe-39598-step-0-5"}, {"@type": "HowToStep", "text": "Allow the bread to rest in the pan for 15 minutes. Run a knife carefully around the perimeter, then turn the loaf onto a wire rack.", "name": "Allow the bread to rest in the pan for 15 minutes. Run a knife carefully around the perimeter, then turn the loaf onto a wire rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/#wprm-recipe-39598-step-0-6"}, {"@type": "HowToStep", "text": "Cool completely to room temperature for approximately 1 hour before applying the icing. The bread may also be served warm or at room temperature without the glaze.", "name": "Cool completely to room temperature for approximately 1 hour before applying the icing. The bread may also be served warm or at room temperature without the glaze.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/#wprm-recipe-39598-step-0-7"}, {"@type": "HowToStep", "text": "Once the loaf has fully cooled, use a fork to drizzle the powdered sugar icing across the top. Apply the icing in alternating stripes for a more defined presentation.", "name": "Once the loaf has fully cooled, use a fork to drizzle the powdered sugar icing across the top. Apply the icing in alternating stripes for a more defined presentation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/applesauce-bread/#wprm-recipe-39598-step-0-8"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Applesauce Bread"}</script>
