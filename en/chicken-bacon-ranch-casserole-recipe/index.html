ilicone spatula.", "name": "In the same skillet, melt butter over medium heat. Add garlic and sauté for 1 minute. Stir in flour and cook for another minute, stirring continuously with a silicone spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-bacon-ranch-casserole-recipe/#wprm-recipe-12034-step-0-4"}, {"@type": "HowToStep", "text": "Warm the half and half slightly in the microwave (about 40 seconds), then gradually pour it into the skillet while stirring. Let it come to a gentle simmer, then reduce the heat.", "name": "Warm the half and half slightly in the microwave (about 40 seconds), then gradually pour it into the skillet while stirring. Let it come to a gentle simmer, then reduce the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-bacon-ranch-casserole-recipe/#wprm-recipe-12034-step-0-5"}, {"@type": "HowToStep", "text": "Incorporate the ranch seasoning and slowly blend in the shredded cheddar cheese until the sauce becomes smooth and thickened.", "name": "Incorporate the ranch seasoning and slowly blend in the shredded cheddar cheese until the sauce becomes smooth and thickened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-bacon-ranch-casserole-recipe/#wprm-recipe-12034-step-0-6"}, {"@type": "HowToStep", "text": "Combine the cooked pasta with the sauce in the skillet, mixing gently to coat evenly. Return the chicken to the pan and allow it to warm through. Fold in the bacon or sprinkle it on top just before serving.", "name": "Combine the cooked pasta with the sauce in the skillet, mixing gently to coat evenly. Return the chicken to the pan and allow it to warm through. Fold in the bacon or sprinkle it on top just before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-bacon-ranch-casserole-recipe/#wprm-recipe-12034-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Chicken Bacon Ranch Casserole Recipe"}<
