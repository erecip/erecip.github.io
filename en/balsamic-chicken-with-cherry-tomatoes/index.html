 surface moisture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-1"}, {"@type": "HowToStep", "text": "Set each chicken breast between two pieces of plastic wrap. Using a meat mallet or rolling pin, gently pound the chicken until each piece has a relatively uniform thickness.", "name": "Set each chicken breast between two pieces of plastic wrap. Using a meat mallet or rolling pin, gently pound the chicken until each piece has a relatively uniform thickness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-2"}, {"@type": "HowToStep", "text": "Place the prepared chicken breasts in a single layer inside a 9 × 13-inch oven-safe baking dish.", "name": "Place the prepared chicken breasts in a single layer inside a 9 × 13-inch oven-safe baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-3"}, {"@type": "HowToStep", "text": "In a small mixing bowl, thoroughly whisk together the balsamic vinegar, honey, olive oil, Dijon mustard, dried basil, salt, black pepper, and finely minced garlic.", "name": "In a small mixing bowl, thoroughly whisk together the balsamic vinegar, honey, olive oil, Dijon mustard, dried basil, salt, black pepper, and finely minced garlic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-4"}, {"@type": "HowToStep", "text": "Pour the balsamic mixture evenly over the chicken breasts. Turn each piece so that both sides are completely coated with the marinade.", "name": "Pour the balsamic mixture evenly over the chicken breasts. Turn each piece so that both sides are completely coated with the marinade.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-5"}, {"@type": "HowToStep", "text": "Allow the chicken to marinate for at least 10 minutes before baking.", "name": "Allow the chicken to marinate for at least 10 minutes before baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-6"}, {"@type": "HowToStep", "text": "Cut the cherry or grape tomatoes in half, then distribute them evenly around the marinated chicken breasts in the baking dish.", "name": "Cut the cherry or grape tomatoes in half, then distribute them evenly around the marinated chicken breasts in the baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the baking dish to the preheated oven and bake for 20–25 minutes, or until the thickest portion of each chicken breast reaches an internal temperature of 165°F.", "name": "Transfer the baking dish to the preheated oven and bake for 20–25 minutes, or until the thickest portion of each chicken breast reaches an internal temperature of 165°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-8"}, {"@type": "HowToStep", "text": "The tomatoes should become tender and lightly blistered during roasting. Remove the chicken from the oven once it reaches the proper internal temperature to help preserve its moisture.", "name": "The tomatoes should become tender and lightly blistered during roasting. Remove the chicken from the oven once it reaches the proper internal temperature to help preserve its moisture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-9"}, {"@type": "HowToStep", "text": "Remove the baking dish from the oven and allow the chicken to rest for several minutes.", "name": "Remove the baking dish from the oven and allow the chicken to rest for several minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-10"}, {"@type": "HowToStep", "text": "Finish with freshly chopped parsley, then serve the balsamic chicken with the roasted tomatoes and preferred side dishes.", "name": "Finish with freshly chopped parsley, then serve the balsamic chicken with the roasted tomatoes and preferred side dishes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/balsamic-chicken-with-cherry-tomatoes/#wprm-recipe-39258-step-0-11"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Balsamic Chicken with Cherry Tomatoes"}</script>
