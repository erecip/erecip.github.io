    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Baked Churro Bites", "author": {"@type": "Person", "name": "BenDes"}, "description": "These oven-baked churro bites feature a tender, sticky dough that puffs in the oven before being finished with melted butter and a fragrant cinnamon-sugar coating.", "datePublished": "2019-12-28T22:51:54+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/Golden-Baked-Churro-Bites.png", "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/Golden-Baked-Churro-Bites.png", "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/Golden-Baked-Churro-Bites.png", "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/Golden-Baked-Churro-Bites.png"], "cookTime": "PT20M", "totalTime": "PT30M", "recipeIngredient": ["1 tablespoon finely ground cinnamon", "1/4 teaspoon salt (preferably fine sea salt)", "1/3 cup white granulated sugar", "Water (butter, brown sugar, flour, vanilla extract, and eggs, as required for the dough)", "Vegetable oil spray (for misting the shaped churros)", "Melted butter (for brushing before coating)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a saucepan set over medium heat, place the water, butter, brown sugar, and salt. Warm the mixture until it reaches a gentle simmer.", "name": "In a saucepan set over medium heat, place the water, butter, brown sugar, and salt. Warm the mixture until it reaches a gentle simmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-0"}, {"@type": "HowToStep", "text": "Add the flour in a single addition once the liquid begins to simmer. Stir continuously as the mixture cooks, allowing it to gather into a soft, tacky dough ball. A pale starchy layer should begin to appear on the base of the pan after approximately 5 minutes.", "name": "Add the flour in a single addition once the liquid begins to simmer. Stir continuously as the mixture cooks, allowing it to gather into a soft, tacky dough ball. A pale starchy layer should begin to appear on the base of the pan after approximately 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-1"}, {"@type": "HowToStep", "text": "Continue cooking the dough for 1 additional minute, using the spoon to loosen and work some of the starchy film back into the mixture. The bottom of the pan will not become fully clean, but the dough should absorb part of the residue.", "name": "Continue cooking the dough for 1 additional minute, using the spoon to loosen and work some of the starchy film back into the mixture. The bottom of the pan will not become fully clean, but the dough should absorb part of the residue.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-2"}, {"@type": "HowToStep", "text": "Move the dough into a mixing bowl and allow it to cool for about 10 minutes.", "name": "Move the dough into a mixing bowl and allow it to cool for about 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-3"}, {"@type": "HowToStep", "text": "Add the vanilla extract once the dough has cooled slightly.", "name": "Add the vanilla extract once the dough has cooled slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-4"}, {"@type": "HowToStep", "text": "Incorporate the eggs one at a time, stirring thoroughly with a spatula after each addition. The dough may appear broken at first, but continued mixing will bring it together into a glossy, sticky consistency.", "name": "Incorporate the eggs one at a time, stirring thoroughly with a spatula after each addition. The dough may appear broken at first, but continued mixing will bring it together into a glossy, sticky consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-5"}, {"@type": "HowToStep", "text": "Preheat the oven to 425°F / 220°C. Line two baking sheets with silicone baking mats or parchment paper.", "name": "Preheat the oven to 425°F / 220°C. Line two baking sheets with silicone baking mats or parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-6"}, {"@type": "HowToStep", "text": "Spoon the prepared dough into a pastry bag fitted with a star tip, ideally a number 356 tip.", "name": "Spoon the prepared dough into a pastry bag fitted with a star tip, ideally a number 356 tip.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-7"}, {"@type": "HowToStep", "text": "Pipe 3- to 4-inch lengths of dough onto the lined baking sheets, leaving several inches of space between each piece. Use the back of a knife to cleanly separate the dough at the end of each piped strip.", "name": "Pipe 3- to 4-inch lengths of dough onto the lined baking sheets, leaving several inches of space between each piece. Use the back of a knife to cleanly separate the dough at the end of each piped strip.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-8"}, {"@type": "HowToStep", "text": "Lightly coat the tops of the piped churros with vegetable oil spray.", "name": "Lightly coat the tops of the piped churros with vegetable oil spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-9"}, {"@type": "HowToStep", "text": "Mist the entire baking sheet generously with water.", "name": "Mist the entire baking sheet generously with water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-10"}, {"@type": "HowToStep", "text": "Bake the churros in the preheated oven for 20 to 25 minutes, or until they are puffed and the edges have turned golden brown.", "name": "Bake the churros in the preheated oven for 20 to 25 minutes, or until they are puffed and the edges have turned golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-11"}, {"@type": "HowToStep", "text": "Turn off the oven, briefly open the door to let some heat escape, then close it again while leaving it slightly open, about 8 to 12 inches. Let the churros remain in the warm oven for 10 minutes.", "name": "Turn off the oven, briefly open the door to let some heat escape, then close it again while leaving it slightly open, about 8 to 12 inches. Let the churros remain in the warm oven for 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-12"}, {"@type": "HowToStep", "text": "Remove the churros from the oven.", "name": "Remove the churros from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-13"}, {"@type": "HowToStep", "text": "Working in batches of 6, brush the churros lightly with melted butter.", "name": "Working in batches of 6, brush the churros lightly with melted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-14"}, {"@type": "HowToStep", "text": "Place the buttered churros in a bag containing the cinnamon-sugar mixture, then toss gently until evenly coated.", "name": "Place the buttered churros in a bag containing the cinnamon-sugar mixture, then toss gently until evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-15"}, {"@type": "HowToStep", "text": "Repeat the buttering and coating process until every churro is covered in cinnamon sugar.", "name": "Repeat the buttering and coating process until every churro is covered in cinnamon sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-16"}, {"@type": "HowToStep", "text": "Serve immediately while fresh.", "name": "Serve immediately while fresh.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-churro-bites/#wprm-recipe-38915-step-0-17"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["Mexican-Inspired"], "keywords": "Baked Churro Bites"}</script>
