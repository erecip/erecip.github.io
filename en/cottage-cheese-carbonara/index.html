    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Carbonara", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy carbonara-style pasta featuring a smooth cottage cheese and egg sauce, crisp pancetta, tender button mushrooms, and a finishing layer of Pecorino Romano and freshly ground black pepper.", "datePublished": "2018-11-23T02:15:46+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/cottage-cheese-carbonara.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/cottage-cheese-carbonara.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/cottage-cheese-carbonara.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/cottage-cheese-carbonara.png"], "recipeIngredient": ["10 oz button mushrooms (finely sliced)", "4  large eggs", "12 oz gluten-free pasta", "1/2 lb pancetta (cut into approximately 1/2-inch pieces)", "1/2 cup full-fat cottage cheese (preferably for a richer texture)", "Freshly grated Pecorino Romano cheese (for serving)", "Freshly ground black pepper (as needed)", "Salt (as needed)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the gluten-free pasta according to the package directions in a pot of salted water.", "name": "Prepare the gluten-free pasta according to the package directions in a pot of salted water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-0"}, {"@type": "HowToStep", "text": "Before draining, set aside 1/2 cup of the pasta cooking water. Drain the pasta and reserve it for the following steps.", "name": "Before draining, set aside 1/2 cup of the pasta cooking water. Drain the pasta and reserve it for the following steps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-1"}, {"@type": "HowToStep", "text": "While the pasta cooks, place a frying pan over medium heat and add the diced pancetta.", "name": "While the pasta cooks, place a frying pan over medium heat and add the diced pancetta.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-2"}, {"@type": "HowToStep", "text": "Cook for approximately 5 minutes, or until the pancetta becomes crisp. Add the thinly sliced mushrooms, then reduce the heat to low and continue cooking until the mushrooms soften without burning.", "name": "Cook for approximately 5 minutes, or until the pancetta becomes crisp. Add the thinly sliced mushrooms, then reduce the heat to low and continue cooking until the mushrooms soften without burning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-3"}, {"@type": "HowToStep", "text": "Place the eggs and cottage cheese in a separate bowl or blender container.", "name": "Place the eggs and cottage cheese in a separate bowl or blender container.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-4"}, {"@type": "HowToStep", "text": "Blend until the mixture becomes completely smooth and no visible cottage cheese lumps remain. Season with freshly ground black pepper to taste.", "name": "Blend until the mixture becomes completely smooth and no visible cottage cheese lumps remain. Season with freshly ground black pepper to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-5"}, {"@type": "HowToStep", "text": "When the pasta is cooked, transfer it directly into the frying pan containing the pancetta and mushrooms, using tongs if convenient.", "name": "When the pasta is cooked, transfer it directly into the frying pan containing the pancetta and mushrooms, using tongs if convenient.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-6"}, {"@type": "HowToStep", "text": "Toss thoroughly so the pasta, mushrooms, and pancetta are evenly distributed.", "name": "Toss thoroughly so the pasta, mushrooms, and pancetta are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-7"}, {"@type": "HowToStep", "text": "Remove the frying pan from the heat. Immediately pour the blended egg and cottage cheese mixture over the hot pasta.", "name": "Remove the frying pan from the heat. Immediately pour the blended egg and cottage cheese mixture over the hot pasta.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-8"}, {"@type": "HowToStep", "text": "Toss promptly and thoroughly until every strand or piece of pasta is coated in the creamy sauce.", "name": "Toss promptly and thoroughly until every strand or piece of pasta is coated in the creamy sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-9"}, {"@type": "HowToStep", "text": "If the mixture is thicker than desired, incorporate a couple of tablespoons of the reserved pasta water until the sauce reaches a smooth, saucy consistency.", "name": "If the mixture is thicker than desired, incorporate a couple of tablespoons of the reserved pasta water until the sauce reaches a smooth, saucy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-10"}, {"@type": "HowToStep", "text": "Serve the carbonara immediately. Finish each portion with a generous amount of freshly grated Pecorino Romano cheese and additional freshly ground black pepper.", "name": "Serve the carbonara immediately. Finish each portion with a generous amount of freshly grated Pecorino Romano cheese and additional freshly ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-carbonara/#wprm-recipe-41682-step-0-11"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Cottage Cheese Carbonara"}</script>
