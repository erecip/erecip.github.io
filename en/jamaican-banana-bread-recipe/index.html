read-recipe/#wprm-recipe-227-step-0-4"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for approximately 1 hour, or until a wooden toothpick inserted into the center comes out clean. Allow the bread to cool in the pan on a wire rack for 10 minutes before removing it from the pan.", "name": "Bake in the preheated oven for approximately 1 hour, or until a wooden toothpick inserted into the center comes out clean. Allow the bread to cool in the pan on a wire rack for 10 minutes before removing it from the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-banana-bread-recipe/#wprm-recipe-227-step-0-5"}, {"@type": "HowToStep", "text": "In a small bowl, mix the powdered sugar with the lime or lemon juice, whisking until smooth. Drizzle this glaze over the warm bread. Let it cool completely on the wire rack before serving.", "name": "In a small bowl, mix the powdered sugar with the lime or lemon juice, whisking until smooth. Drizzle this glaze over the warm bread. Let it cool completely on the wire rack before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-banana-bread-recipe/#wprm-recipe-227-step-0-6"}], "keywords": "Jamaican Banana Bread Recipe"}</script>
