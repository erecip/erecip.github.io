evenly over the sweetened water. Leave the mixture undisturbed for 5 minutes so the yeast can bloom and become active.", "name": "Scatter the active dry yeast evenly over the sweetened water. Leave the mixture undisturbed for 5 minutes so the yeast can bloom and become active.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-1"}, {"@type": "HowToStep", "text": "While the yeast is resting, cut the softened salted butter into small pieces.", "name": "While the yeast is resting, cut the softened salted butter into small pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-2"}, {"@type": "HowToStep", "text": "After the 5-minute activation period, add the butter pieces, room-temperature eggs, and salt to the yeast mixture. Gradually incorporate the all-purpose flour while stirring until a cohesive dough forms.", "name": "After the 5-minute activation period, add the butter pieces, room-temperature eggs, and salt to the yeast mixture. Gradually incorporate the all-purpose flour while stirring until a cohesive dough forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-3"}, {"@type": "HowToStep", "text": "Knead the dough by hand for 7–10 minutes. Alternatively, knead it in a stand mixer at medium speed for 5–7 minutes. Continue until the dough is smooth and elastic. The finished dough should feel slightly tacky without being excessively sticky.", "name": "Knead the dough by hand for 7–10 minutes. Alternatively, knead it in a stand mixer at medium speed for 5–7 minutes. Continue until the dough is smooth and elastic. The finished dough should feel slightly tacky without being excessively sticky.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-4"}, {"@type": "HowToStep", "text": "Lightly oil a large bowl , smooth ball. Cup your hand around the dough and roll it gently toward yourself to create surface tension. This technique produces evenly shaped rolls with a tidy, traditional appearance.", "name": "Shape each portion into a compact, smooth ball. Cup your hand around the dough and roll it gently toward yourself to create surface tension. This technique produces evenly shaped rolls with a tidy, traditional appearance.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-9"}, {"@type": "HowToStep", "text": "Grease a 9 × 13-inch baking pan or another similarly sized baking dish. Arrange the 30 shaped dough balls inside, leaving only a small amount of space between them so they can expand as they rise.", "name": "Grease a 9 × 13-inch baking pan or another similarly sized baking dish. Arrange the 30 shaped dough balls inside, leaving only a small amount of space between them so they can expand as they rise.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-10"}, {"@type": "HowToStep", "text": "Cover the pan loosely with plastic wrap or a damp kitchen towel. Let the rolls rise in a warm place for approximately 1 hour, until noticeably puffy and touching one another.", "name": "Cover the pan loosely with plastic wrap or a damp kitchen towel. Let the rolls rise in a warm place for approximately 1 hour, until noticeably puffy and touching one another.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-11"}, {"@type": "HowToStep", "text": "Approximately 10–15 minutes before the second rise is complete, preheat the oven to 375°F.", "name": "Approximately 10–15 minutes before the second rise is complete, preheat the oven to 375°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-12"}, {"@type": "HowToStep", "text": "Place the fully risen rolls in the preheated oven and bake at 375°F for 15–16 minutes, until the tops have developed a golden-brown color and the rolls are cooked through while remaining tender. When tapped on the bottom, they should produce a slightly hollow sound.", "name": "Place the fully risen rolls in the preheated oven and bake at 375°F for 15–16 minutes, until the tops have developed a golden-brown color and the rolls are cooked through while remaining tender. When tapped on the bottom, they should produce a slightly hollow sound.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-13"}, {"@type": "HowToStep", "text": "Remove the pan from the oven. While the rolls are still hot, generously brush their tops with the melted butter.", "name": "Remove the pan from the oven. While the rolls are still hot, generously brush their tops with the melted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-14"}, {"@type": "HowToStep", "text": "Serve the rolls warm for their softest texture and fullest flavor.", "name": "Serve the rolls warm for their softest texture and fullest flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/old-fashioned-dinner-rolls/#wprm-recipe-44324-step-0-15"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Old Fashioned Dinner Rolls"}</script>
