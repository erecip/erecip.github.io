/en/spiced-pear-cake/#wprm-recipe-42227-step-0-0"}, {"@type": "HowToStep", "text": "Place the melted butter, vegetable oil, packed brown sugar, room-temperature eggs, water, and vanilla extract in a large mixing bowl. Whisk until the ingredients are thoroughly incorporated and the mixture appears smooth.", "name": "Place the melted butter, vegetable oil, packed brown sugar, room-temperature eggs, water, and vanilla extract in a large mixing bowl. Whisk until the ingredients are thoroughly incorporated and the mixture appears smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-cake/#wprm-recipe-42227-step-0-1"}, {"@type": "HowToStep", "text": "In a separate medium bowl, whisk together the all-purpose flour, baking soda, salt, cinnamon, ginger, nutmeg, and cloves. Continue whisking until the spices and leavening are evenly dispersed throughout the flour.", "name": "In a separate medium bowl, whisk together the all-purpose flour, baking soda, salt, cinnamon, ginger, nutmeg, and cloves. Continue whisking until the spices and leavening are evenly dispersed throughout the flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-cake/#wprm-recipe-42227-step-0-2"}, {"@type": "HowToStep", "text": "Add the dry mixture to the wet mixture gradually, working in approximately three additions. Whisk gently after each portion and stop as soon as the ingredients are incorporated to avoid overmixing. The completed batter should have a smooth, thick consistency.", "name": "Add the dry mixture to the wet mixture gradually, working in approximately three additions. Whisk gently after each portion and stop as soon as the ingredients are incorporated to avoid overmixing. The completed batter should have a smooth, thick consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-cake/#wprm-recipe-42227-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared loaf pan and spread it evenly. Peel the ripe pears and cut them into slices. Position the pear slices upright across the surface of the batter in an alternating arrangement. Scatter the rolled oats evenly over the top.", "name": "Transfer the batter to the prepared loaf pan and spread it evenly. Peel the ripe pears and cut them into slices. Position the pear slices upright across the surface of the batter in an alternating arrangement. Scatter the rolled oats evenly over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-cake/#wprm-recipe-42227-step-0-4"}, {"@type": "HowToStep", "text": "Place the loaf pan in the preheated oven and bake for 40–45 minutes. The cake is ready when the surface is golden brown and a toothpick inserted into the center comes out clean. Check the loaf toward the end of the baking period to prevent overbaking.", "name": "Place the loaf pan in the preheated oven and bake for 40–45 minutes. The cake is ready when the surface is golden brown and a toothpick inserted into the center comes out clean. Check the loaf toward the end of the baking period to prevent overbaking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-cake/#wprm-recipe-42227-step-0-5"}, {"@type": "HowToStep", "text": "Remove the spiced pear cake from the oven and leave it in the pan for at least 10 minutes. Carefully transfer the loaf to a wire cooling rack and allow it to cool completely. Once cooled, lightly dust the surface with powdered sugar if desired, then slice and serve.", "name": "Remove the spiced pear cake from the oven and leave it in the pan for at least 10 minutes. Carefully transfer the loaf to a wire cooling rack and allow it to cool completely. Once cooled, lightly dust the surface with powdered sugar if desired, then slice and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-cake/#wprm-recipe-42227-step-0-6"}], "recipeCategory": ["cake"], "keywords": "Spiced Pear Cake"}</script>
