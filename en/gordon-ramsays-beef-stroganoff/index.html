    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gordon Ramsay’s Beef Stroganoff", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender strips of rib-eye are quickly seared, then combined with golden cremini mushrooms and onions in a smooth Dijon and sour cream sauce. Serve the finished stroganoff over egg noodles or tagliatelle and garnish with fresh chives.", "datePublished": "2021-05-17T17:44:13+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/gordon-ramsays-beef-stroganoff.png", "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/gordon-ramsays-beef-stroganoff.png", "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/gordon-ramsays-beef-stroganoff.png", "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/gordon-ramsays-beef-stroganoff.png"], "totalTime": "PT35M", "recipeIngredient": ["1 lb 5 oz rib-eye steak (trimmed and flattened to approximately 1/3-inch thickness)", "Kosher salt (as needed for seasoning)", "2 tablespoons neutral high-heat cooking oil (such as grapeseed oil)", "Freshly ground black pepper (to taste)", "10 oz cremini mushrooms (cut into slices about 1/8 inch thick)", "2 cups low-sodium beef broth", "2 tablespoons unsalted butter", "2/3 cup full-fat sour cream (brought to room temperature)", "1  medium onion (thinly sliced)", "1 tablespoon Dijon mustard", "1 tablespoon all-purpose flour", "Fresh chives (finely chopped, for garnish)", "Egg noodles or tagliatelle (cooked for serving)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the beef. Trim the rib-eye as necessary and pound it to an even thickness of roughly 1/3 inch. Cut the steak into strips and season the pieces generously on both sides with kosher salt and freshly ground black pepper.", "name": "Prepare the beef. Trim the rib-eye as necessary and pound it to an even thickness of roughly 1/3 inch. Cut the steak into strips and season the pieces generously on both sides with kosher salt and freshly ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/#wprm-recipe-45467-step-0-0"}, {"@type": "HowToStep", "text": "Sear the first batch. Place a large skillet over high heat and add 1 tablespoon of the neutral oil. Once the pan is hot, arrange half of the seasoned steak strips in the skillet without crowding them. Sear for approximately 30 seconds on each side, allowing the exterior to brown while leaving the center undercooked. Transfer the beef to a plate.", "name": "Sear the first batch. Place a large skillet over high heat and add 1 tablespoon of the neutral oil. Once the pan is hot, arrange half of the seasoned steak strips in the skillet without crowding them. Sear for approximately 30 seconds on each side, allowing the exterior to brown while leaving the center undercooked. Transfer the beef to a plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/#wprm-recipe-45467-step-0-1"}, {"@type": "HowToStep", "text": "Sear the remaining beef. Pour the remaining 1 tablespoon of oil into the skillet and repeat the searing process with the second batch of steak. Transfer the browned strips to the same plate, retaining any juices that collect there.", "name": "Sear the remaining beef. Pour the remaining 1 tablespoon of oil into the skillet and repeat the searing process with the second batch of steak. Transfer the browned strips to the same plate, retaining any juices that collect there.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/#wprm-recipe-45467-step-0-2"}, {"@type": "HowToStep", "text": "Cook the onion and mushrooms. Reduce the heat to medium and melt the unsalted butter in the same skillet. Add the sliced onion and cook for approximately 1 minute, until it begins to soften. Stir in the cremini mushrooms and continue cooking for about 4 minutes, stirring occasionally. The mushrooms should become golden as their released liquid cooks away and is reabsorbed.", "name": "Cook the onion and mushrooms. Reduce the heat to medium and melt the unsalted butter in the same skillet. Add the sliced onion and cook for approximately 1 minute, until it begins to soften. Stir in the cremini mushrooms and continue cooking for about 4 minutes, stirring occasionally. The mushrooms should become golden as their released liquid cooks away and is reabsorbed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/#wprm-recipe-45467-step-0-3"}, {"@type": "HowToStep", "text": "Form the sauce base. Scatter the all-purpose flour evenly over the mushroom and onion mixture. Stir thoroughly and cook for approximately 1 minute so the flour loses its raw flavor.", "name": "Form the sauce base. Scatter the all-purpose flour evenly over the mushroom and onion mixture. Stir thoroughly and cook for approximately 1 minute so the flour loses its raw flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/#wprm-recipe-45467-step-0-4"}, {"@type": "HowToStep", "text": "Add the broth and mustard. Pour 1/2 cup of the beef broth into the skillet while scraping the browned residue from the bottom of the pan. Stir until a smooth, lightly thickened mixture forms. Add the remaining 1 1/2 cups beef broth along with the Dijon mustard.", "name": "Add the broth and mustard. Pour 1/2 cup of the beef broth into the skillet while scraping the browned residue from the bottom of the pan. Stir until a smooth, lightly thickened mixture forms. Add the remaining 1 1/2 cups beef broth along with the Dijon mustard.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/#wprm-recipe-45467-step-0-5"}, {"@type": "HowToStep", "text": "Reduce the sauce. Bring the mixture to a gentle simmer and allow it to cook for approximately 5 minutes, or until the sauce has reduced slightly.", "name": "Reduce the sauce. Bring the mixture to a gentle simmer and allow it to cook for approximately 5 minutes, or until the sauce has reduced slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/#wprm-recipe-45467-step-0-6"}, {"@type": "HowToStep", "text": "Incorporate the sour cream. Remove the skillet from the heat. Stir in the room-temperature sour cream until completely blended and the sauce has a smooth, creamy consistency. Keep the pan off direct heat during this stage to help prevent the sour cream from curdling.", "name": "Incorporate the sour cream. Remove the skillet from the heat. Stir in the room-temperature sour cream until completely blended and the sauce has a smooth, creamy consistency. Keep the pan off direct heat during this stage to help prevent the sour cream from curdling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/#wprm-recipe-45467-step-0-7"}, {"@type": "HowToStep", "text": "Return the beef to the skillet. Add the seared steak strips and all accumulated juices back to the finished sauce. Place the skillet over low heat and stir gently for approximately 1 minute, heating the beef only until warmed through.", "name": "Return the beef to the skillet. Add the seared steak strips and all accumulated juices back to the finished sauce. Place the skillet over low heat and stir gently for approximately 1 minute, heating the beef only until warmed through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/#wprm-recipe-45467-step-0-8"}, {"@type": "HowToStep", "text": "Serve. Spoon the beef stroganoff over cooked egg noodles or tagliatelle. Finish each portion with a scattering of freshly chopped chives.", "name": "Serve. Spoon the beef stroganoff over cooked egg noodles or tagliatelle. Finish each portion with a scattering of freshly chopped chives.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-beef-stroganoff/#wprm-recipe-45467-step-0-9"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["European"], "keywords": "Gordon Ramsay’s Beef Stroganoff"}</script>
