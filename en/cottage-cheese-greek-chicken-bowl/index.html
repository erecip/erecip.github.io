 it to rest undisturbed for 10 minutes before cutting.", "name": "Remove the cooked chicken from the grill and allow it to rest undisturbed for 10 minutes before cutting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-greek-chicken-bowl/#wprm-recipe-41485-step-0-6"}, {"@type": "HowToStep", "text": "While the chicken cooks, prepare all of the salad components.", "name": "While the chicken cooks, prepare all of the salad components.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-greek-chicken-bowl/#wprm-recipe-41485-step-0-7"}, {"@type": "HowToStep", "text": "Add the baby spinach, diced cucumbers, Roma tomatoes, crumbled feta, chopped marinated artichoke hearts, halved Kalamata olives, mini pepperoni, sliced pepperoncini, red wine vinegar, and Greek seasoning to a large mixing bowl.", "name": "Add the baby spinach, diced cucumbers, Roma tomatoes, crumbled feta, chopped marinated artichoke hearts, halved Kalamata olives, mini pepperoni, sliced pepperoncini, red wine vinegar, and Greek seasoning to a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-greek-chicken-bowl/#wprm-recipe-41485-step-0-8"}, {"@type": "HowToStep", "text": "Gently toss the mixture until the vegetables, cheese, and seasonings are evenly dispersed.", "name": "Gently toss the mixture until the vegetables, cheese, and seasonings are evenly dispersed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-greek-chicken-bowl/#wprm-recipe-41485-step-0-9"}, {"@type": "HowToStep", "text": "After the grilled chicken has rested, cut it into bite-sized cubes and transfer the pieces to the prepared salad.", "name": "After the grilled chicken has rested, cut it into bite-sized cubes and transfer the pieces to the prepared salad.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-greek-chicken-bowl/#wprm-recipe-41485-step-0-10"}, {"@type": "HowToStep", "text": "Drizzle the additional Greek vinaigrette over the mixture, then toss gently until the chicken and salad ingredients are evenly coated.", "name": "Drizzle the additional Greek vinaigrette over the mixture, then toss gently until the chicken and salad ingredients are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-greek-chicken-bowl/#wprm-recipe-41485-step-0-11"}, {"@type": "HowToStep", "text": "Divide the cottage cheese among serving plates or bowls, creating a generous base for each portion.", "name": "Divide the cottage cheese among serving plates or bowls, creating a generous base for each portion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-greek-chicken-bowl/#wprm-recipe-41485-step-0-12"}, {"@type": "HowToStep", "text": "Spoon the Greek chicken and salad mixture over the cottage cheese and serve immediately.", "name": "Spoon the Greek chicken and salad mixture over the cottage cheese and serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-greek-chicken-bowl/#wprm-recipe-41485-step-0-13"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["greek", "Mediterranean-inspired"], "keywords": "Cottage Cheese Greek Chicken Bowl"}</script>
