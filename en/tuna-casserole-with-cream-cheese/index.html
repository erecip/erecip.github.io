    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Tuna Casserole with Cream Cheese", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy baked tuna and noodle casserole featuring cream cheese, tender vegetables, peas, mushrooms, and a crisp topping of sharp cheddar, Parmesan, and fried onions.", "datePublished": "2022-08-17T16:31:57+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/tuna-casserole-with-cream-cheese1.png", "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/tuna-casserole-with-cream-cheese1.png", "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/tuna-casserole-with-cream-cheese1.png", "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/tuna-casserole-with-cream-cheese1.png"], "cookTime": "PT20M", "totalTime": "PT25M", "recipeIngredient": ["1  package (8 oz cream cheese)", "1  medium green bell pepper (cut into small dice)", "1  can (15 oz peas, thoroughly drained)", "2 1/2 cups milk", "1 teaspoon freshly ground black pepper", "1  package (12 oz wide yolk-free egg noodles)", "1/4 cup unsalted or regular butter", "1  can (12 oz water-packed tuna, including the liquid)", "1  medium yellow onion (finely diced)", "1/4 cup all-purpose flour", "1 teaspoon salt", "1  can (6.5 oz sliced mushrooms, drained)", "1 teaspoon minced garlic (approximately 2 cloves)", "1/4 cup finely grated Parmesan cheese", "2 cups crisp fried onions (such as French’s)", "1 cup grated sharp cheddar cheese"], "recipeInstructions": [{"@type": "HowToStep", "text": "Sauté the vegetables. Place a large frying pan over medium heat. Add the drained mushrooms, minced garlic, diced yellow onion, and diced green bell pepper. Sauté until the vegetables become tender and aromatic. Remove the mixture from the heat and reserve it for later.", "name": "Sauté the vegetables. Place a large frying pan over medium heat. Add the drained mushrooms, minced garlic, diced yellow onion, and diced green bell pepper. Sauté until the vegetables become tender and aromatic. Remove the mixture from the heat and reserve it for later.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/#wprm-recipe-44120-step-0-0"}, {"@type": "HowToStep", "text": "Cook the noodles. Bring a large pot of salted water to a rolling boil. Add the wide yolk-free egg noodles and prepare them according to the package instructions until they reach an al dente texture. Drain well and set aside.", "name": "Cook the noodles. Bring a large pot of salted water to a rolling boil. Add the wide yolk-free egg noodles and prepare them according to the package instructions until they reach an al dente texture. Drain well and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/#wprm-recipe-44120-step-0-1"}, {"@type": "HowToStep", "text": "Prepare the cream cheese sauce. Melt the butter in a large frying pan or saucepan over medium-low heat. Whisk in the flour and continue stirring constantly for 1–2 minutes to form a smooth roux.", "name": "Prepare the cream cheese sauce. Melt the butter in a large frying pan or saucepan over medium-low heat. Whisk in the flour and continue stirring constantly for 1–2 minutes to form a smooth roux.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/#wprm-recipe-44120-step-0-2"}, {"@type": "HowToStep", "text": "Thicken the sauce. Slowly pour the milk into the roux while whisking continuously to prevent lumps. Continue cooking until the mixture develops a thick, smooth consistency. Add the cream cheese and stir until it has completely melted and blended into the sauce.", "name": "Thicken the sauce. Slowly pour the milk into the roux while whisking continuously to prevent lumps. Continue cooking until the mixture develops a thick, smooth consistency. Add the cream cheese and stir until it has completely melted and blended into the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/#wprm-recipe-44120-step-0-3"}, {"@type": "HowToStep", "text": "Combine the casserole filling. Add the cooked noodles to the prepared sauce. Stir in the undrained tuna, drained peas, and reserved sautéed vegetables. Season with 1 teaspoon salt and 1 teaspoon black pepper. Fold the ingredients together gently until evenly incorporated.", "name": "Combine the casserole filling. Add the cooked noodles to the prepared sauce. Stir in the undrained tuna, drained peas, and reserved sautéed vegetables. Season with 1 teaspoon salt and 1 teaspoon black pepper. Fold the ingredients together gently until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/#wprm-recipe-44120-step-0-4"}, {"@type": "HowToStep", "text": "Assemble the casserole. Lightly grease a large 9 x 12-inch baking dish. Transfer the creamy tuna and noodle mixture to the dish and spread it into an even layer.", "name": "Assemble the casserole. Lightly grease a large 9 x 12-inch baking dish. Transfer the creamy tuna and noodle mixture to the dish and spread it into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/#wprm-recipe-44120-step-0-5"}, {"@type": "HowToStep", "text": "Add the topping. Scatter the grated sharp cheddar evenly across the casserole. Follow with the crispy fried onions, then finish with an even layer of grated Parmesan cheese.", "name": "Add the topping. Scatter the grated sharp cheddar evenly across the casserole. Follow with the crispy fried onions, then finish with an even layer of grated Parmesan cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/#wprm-recipe-44120-step-0-6"}, {"@type": "HowToStep", "text": "Bake. Place the casserole in an oven preheated to 375°F (190°C). Bake for 20 minutes, or until the filling is bubbling and the surface has developed a golden-brown finish.", "name": "Bake. Place the casserole in an oven preheated to 375°F (190°C). Bake for 20 minutes, or until the filling is bubbling and the surface has developed a golden-brown finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/#wprm-recipe-44120-step-0-7"}, {"@type": "HowToStep", "text": "Rest before serving. Allow the baked casserole to stand for 5–10 minutes before slicing and serving.", "name": "Rest before serving. Allow the baked casserole to stand for 5–10 minutes before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-casserole-with-cream-cheese/#wprm-recipe-44120-step-0-8"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["American"], "keywords": "Tuna Casserole with Cream Cheese"}</script>
