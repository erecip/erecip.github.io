 off. Push the rice to one side of the wok or skillet, pour 1/2 tablespoon of oil into the cleared space, then tilt the wok so the heat centres beneath it. Pour in the whisked eggs and scramble until fully set and cooked through. Add the sliced green onions and fold the cooked egg into the rice mixture. Remove from the heat and serve immediately.", "name": "Warm approximately 1 1/2 tablespoons of oil in a wok, or 2 tablespoons if using a skillet, over high heat until it begins to smoke. Introduce the finely chopped onion, minced garlic, and bacon, cooking until the bacon reaches a light golden hue, about one and a half minutes. Add the vegetables directly, even if still frozen, and sauté for roughly two minutes until defrosted and any excess moisture evaporates. Incorporate the rice along with all the Sauce ingredients, stirring and cooking for about one and a half minutes until the liquid cooks off. Push the rice to one side of the wok or skillet, pour 1/2 tablespoon of oil into the cleared space, then tilt the wok so the heat centres beneath it. Pour in the whisked eggs and scramble until fully set and cooked through. Add the sliced green onions and fold the cooked egg into the rice mixture. Remove from the heat and serve immediately.", "url": "https://erecip.github.io/en/fried-rice-recipe/#wprm-recipe-51531-step-0-0"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["Asian", "Chinese"], "keywords": "Fried Rice Recipe"}</script>
