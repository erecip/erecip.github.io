    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Coconut Rice Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "An exquisite method for crafting restaurant-style coconut rice that is remarkably light, separate, and free of unwanted coconut scum. By baking instead of boiling, each grain emerges perfectly tender and distinct. Aromatics like pandan or kaffir lime leaves impart an authentic Asian nuance, while toasted coconut lends an elegant finishing touch. Pair with dishes inspired by tropical, Caribbean, Indian, or broader Asian cuisines.", "datePublished": "2024-10-02T08:37:08+00:00", "image": ["https://erecip.github.io/en/coconut-rice-recipe/Coconut-Rice-Recipe.png", "https://erecip.github.io/en/coconut-rice-recipe/Coconut-Rice-Recipe.png", "https://erecip.github.io/en/coconut-rice-recipe/Coconut-Rice-Recipe.png", "https://erecip.github.io/en/coconut-rice-recipe/Coconut-Rice-Recipe.png"], "prepTime": "PT5M", "cookTime": "PT40M", "totalTime": "PT60M", "recipeIngredient": ["5 tsp white sugar", "2  kaffir lime leaves (lightly crushed (or 1 pandan leaf, knotted))", "2 cups jasmine rice", "1 tbsp desiccated coconut (toasted (optional garnish))", "1/2 tsp kosher or cooking salt", "1 cup water", "400 ml 14 oz coconut milk, full-fat or light"], "recipeInstructions": [{"@type": "HowToStep", "text": "Rinse the jasmine rice thoroughly under running water until it runs mostly clear to remove excess starch. Drain well and soak the rice in water for 1 hour, then drain through a colander and allow it to stand for an additional 5 minutes. Preheat the oven to 200°C / 400°F (or 180°C for fan-assisted ovens). Transfer the drained rice into a metal or ceramic baking pan, approximately 20 cm (8 inches) square, adding the pandan or kaffir lime leaves if using. In a saucepan over high heat, bring the coconut milk, water, sugar, and salt to a vigorous boil, stirring until the sugar dissolves completely. Working swiftly to retain the heat, pour the hot liquid over the rice in the pan and stir gently to distribute the grains evenly. Cover tightly with foil and bake for 40 minutes. Remove the pan from the oven, carefully lift a corner of the foil to ensure all liquid is absorbed (a layer of coconut cream on top is normal), then reseal and let the rice rest for 15 minutes undisturbed. Finally, fluff the rice delicately using a rubber spatula. Sprinkle with toasted desiccated coconut, if desired, and serve immediately.", "name": "Rinse the jasmine rice thoroughly under running water until it runs mostly clear to remove excess starch. Drain well and soak the rice in water for 1 hour, then drain through a colander and allow it to stand for an additional 5 minutes. Preheat the oven to 200°C / 400°F (or 180°C for fan-assisted ovens). Transfer the drained rice into a metal or ceramic baking pan, approximately 20 cm (8 inches) square, adding the pandan or kaffir lime leaves if using. In a saucepan over high heat, bring the coconut milk, water, sugar, and salt to a vigorous boil, stirring until the sugar dissolves completely. Working swiftly to retain the heat, pour the hot liquid over the rice in the pan and stir gently to distribute the grains evenly. Cover tightly with foil and bake for 40 minutes. Remove the pan from the oven, carefully lift a corner of the foil to ensure all liquid is absorbed (a layer of coconut cream on top is normal), then reseal and let the rice rest for 15 minutes undisturbed. Finally, fluff the rice delicately using a rubber spatula. Sprinkle with toasted desiccated coconut, if desired, and serve immediately.", "url": "https://erecip.github.io/en/coconut-rice-recipe/#wprm-recipe-14840-step-0-0"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["Asian"], "keywords": "Coconut Rice Recipe"}</script>
