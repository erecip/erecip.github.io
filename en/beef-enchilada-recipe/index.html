    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Beef Enchilada Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Hearty and irresistibly savory, these beef enchiladas are layered with rich flavor from a homemade spice blend, succulent beef filling, and a velvety enchilada sauce. The inclusion of refried beans adds both moisture and depth, making this dish particularly satisfying.", "datePublished": "2024-08-19T10:45:59+00:00", "image": ["https://erecip.github.io/en/beef-enchilada-recipe/Beef-Enchilada-Recipe.png", "https://erecip.github.io/en/beef-enchilada-recipe/Beef-Enchilada-Recipe.png", "https://erecip.github.io/en/beef-enchilada-recipe/Beef-Enchilada-Recipe.png", "https://erecip.github.io/en/beef-enchilada-recipe/Beef-Enchilada-Recipe.png"], "recipeYield": ["4"], "prepTime": "PT10M", "cookTime": "PT35M", "totalTime": "PT45M", "recipeIngredient": ["1 tablespoon paprika", "1 tablespoon cumin powder", "1/2  –1 teaspoon cayenne pepper (adjust for heat preference)", "1 teaspoon garlic powder", "1 tablespoon dried oregano", "1 teaspoon onion powder", "2 cups 500ml low sodium chicken broth", "3 tablespoons plain flour (all-purpose)", "2 tablespoons olive oil", "1/4 teaspoon pepper", "1/4 teaspoon salt", "1 1/2 cups 375 ml tomato passata or one 8 oz can of tomato sauce", "400 g / 14oz canned refried beans", "1  onion (finely diced (approximately 1 cup))", "400 g / 14oz canned black beans (drained)", "2  garlic cloves (minced)", "1 lb / 500g ground beef", "1 tablespoon olive oil", "1.5 cups 150g shredded cheese (Monterey Jack, cheddar, or similar melting cheese)", "8  tortillas or burrito wraps", "Roughly chopped cilantro or coriander leaves (optional, for garnish)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the listed spice mix components in a bowl and set aside.", "name": "Combine the listed spice mix components in a bowl and set aside.", "url": "https://erecip.github.io/en/beef-enchilada-recipe/#wprm-recipe-51073-step-0-0"}, {"@type": "HowToSection", "name": "For the Enchilada Sauce", "itemListElement": [{"@type": "HowToStep", "text": "Warm olive oil in a large saucepan over medium heat. Stir in the flour, blending until a paste forms. Cook, stirring constantly, for one minute.", "name": "Warm olive oil in a large saucepan over medium heat. Stir in the flour, blending until a paste forms. Cook, stirring constantly, for one minute.", "url": "https://erecip.github.io/en/beef-enchilada-recipe/#wprm-recipe-51073-step-1-0"}, {"@type": "HowToStep", "text": "Incorporate 1/2 cup of the chicken broth, whisking swiftly to create a smooth paste. Gradually add the remaining broth, tomato passata, salt, pepper, and 2 tablespoons of the prepared spice mix. Whisk thoroughly.", "name": "Incorporate 1/2 cup of the chicken broth, whisking swiftly to create a smooth paste. Gradually add the remaining broth, tomato passata, salt, pepper, and 2 tablespoons of the prepared spice mix. Whisk thoroughly.", "url": "https://erecip.github.io/en/beef-enchilada-recipe/#wprm-recipe-51073-step-1-1"}, {"@type": "HowToStep", "text": "Raise the heat slightly and cook for 3 to 5 minutes, stirring frequently until the sauce thickens to a syrupy consistency. Remove from heat.", "name": "Raise the heat slightly and cook for 3 to 5 minutes, stirring frequently until the sauce thickens to a syrupy consistency. Remove from heat.", "url": "https://erecip.github.io/en/beef-enchilada-recipe/#wprm-recipe-51073-step-1-2"}]}, {"@type": "HowToSection", "name": "For the Filling", "itemListElement": [{"@type": "HowToStep", "text": "Preheat oven to 180°C/350°F. In a skillet over high heat, heat the olive oil and sauté the garlic and onion for two minutes.", "name": "Preheat oven to 180°C/350°F. In a skillet over high heat, heat the olive oil and sauté the garlic and onion for two minutes.", "url": "https://erecip.github.io/en/beef-enchilada-recipe/#wprm-recipe-51073-step-2-0"}, {"@type": "HowToStep", "text": "Add ground beef and cook for two minutes, breaking it up as it browns. Mix in the rest of the spice blend and cook until the beef is fully browned, approximately two more minutes.", "name": "Add ground beef and cook for two minutes, breaking it up as it browns. Mix in the rest of the spice blend and cook until the beef is fully browned, approximately two more minutes.", "url": "https://erecip.github.io/en/beef-enchilada-recipe/#wprm-recipe-51073-step-2-1"}, {"@type": "HowToStep", "text": "Stir in the refried beans, black beans, about 1/4 cup of the prepared enchilada sauce, and season lightly with salt and pepper. Continue cooking for two minutes, then take off the heat.", "name": "Stir in the refried beans, black beans, about 1/4 cup of the prepared enchilada sauce, and season lightly with salt and pepper. Continue cooking for two minutes, then take off the heat.", "url": "https://erecip.github.io/en/beef-enchilada-recipe/#wprm-recipe-51073-step-2-2"}]}, {"@type": "HowToSection", "name": "Assembling the Enchiladas", "itemListElement": [{"@type": "HowToStep", "text": "Spread a small quantity of sauce on the base of a baking dish to prevent sticking.", "name": "Spread a small quantity of sauce on the base of a baking dish to prevent sticking.", "url": "https://erecip.github.io/en/beef-enchilada-recipe/#wprm-recipe-51073-step-3-0"}, {"@type": "HowToStep", "text": "Place some filling along the lower third of each tortilla, roll tightly, and arrange seam-side down in the dish. Repeat until all are used.", "name": "Place some filling along the lower third of each tortilla, roll tightly, and arrange seam-side down in the dish. Repeat until all are used.", "url": "https://erecip.github.io/en/beef-enchilada-recipe/#wprm-recipe-51073-step-3-1"}, {"@type": "HowToStep", "text": "Pour the remaining sauce generously over the rolled tortillas and sprinkle with cheese. Cover and bake for 10 minutes, then uncover and bake for another 10 minutes. Serve while hot, garnished with chopped cilantro if desired.", "name": "Pour the remaining sauce generously over the rolled tortillas and sprinkle with cheese. Cover and bake for 10 minutes, then uncover and bake for another 10 minutes. Serve while hot, garnished with chopped cilantro if desired.", "url": "https://erecip.github.io/en/beef-enchilada-recipe/#wprm-recipe-51073-step-3-2"}]}], "recipeCategory": ["Dinner"], "recipeCuisine": ["Mexican"], "keywords": "Beef Enchilada Recipe"}</script>
