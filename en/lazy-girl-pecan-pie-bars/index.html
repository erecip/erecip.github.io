    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lazy Girl Pecan Pie Bars", "author": {"@type": "Person", "name": "BenDes"}, "description": "These easy pecan pie bars feature a tender, buttery shortbread-style base topped with a rich pecan filling made from brown sugar, corn syrup, eggs, and vanilla. Baked until golden and fully set, they deliver the familiar flavor of pecan pie in a convenient bar format.", "datePublished": "2018-06-21T18:17:34+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/lazy-girl-pecan-pie-bars1.png", "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/lazy-girl-pecan-pie-bars1.png", "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/lazy-girl-pecan-pie-bars1.png", "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/lazy-girl-pecan-pie-bars1.png"], "prepTime": "PT15M", "cookTime": "PT45M", "totalTime": "PT60M", "recipeIngredient": ["1 cup unsalted butter (melted and allowed to cool slightly)", "1/4 teaspoon salt", "1/2 cup granulated white sugar", "2 cups all-purpose flour", "1 cup firmly packed light brown sugar", "1 teaspoon pure vanilla extract", "1 1/2 cups pecans (finely chopped)", "3  large eggs (brought to room temperature)", "1 cup light corn syrup"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 350°F (175°C). Line a 9 × 13-inch baking pan with parchment paper, leaving enough excess paper along the sides to assist with lifting the finished bars from the pan. Alternatively, grease the pan thoroughly to prevent sticking.", "name": "Heat the oven to 350°F (175°C). Line a 9 × 13-inch baking pan with parchment paper, leaving enough excess paper along the sides to assist with lifting the finished bars from the pan. Alternatively, grease the pan thoroughly to prevent sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-0"}, {"@type": "HowToStep", "text": "Place the melted and slightly cooled unsalted butter, all-purpose flour, granulated sugar, and salt in a large mixing bowl. Stir until the ingredients come together into a uniform, cohesive dough.", "name": "Place the melted and slightly cooled unsalted butter, all-purpose flour, granulated sugar, and salt in a large mixing bowl. Stir until the ingredients come together into a uniform, cohesive dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-1"}, {"@type": "HowToStep", "text": "Press the dough firmly and evenly across the bottom of the prepared baking pan, extending it completely into the corners. The flat bottom of a measuring cup may be used to create a level surface.", "name": "Press the dough firmly and evenly across the bottom of the prepared baking pan, extending it completely into the corners. The flat bottom of a measuring cup may be used to create a level surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-2"}, {"@type": "HowToStep", "text": "Place the pan in the preheated oven and bake the crust for 15–18 minutes, or until the surface develops a pale golden color.", "name": "Place the pan in the preheated oven and bake the crust for 15–18 minutes, or until the surface develops a pale golden color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-3"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and allow the crust to cool slightly while the pecan topping is prepared.", "name": "Remove the pan from the oven and allow the crust to cool slightly while the pecan topping is prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-4"}, {"@type": "HowToStep", "text": "In a separate large bowl, combine the finely chopped pecans, packed light brown sugar, light corn syrup, room-temperature eggs, and vanilla extract.", "name": "In a separate large bowl, combine the finely chopped pecans, packed light brown sugar, light corn syrup, room-temperature eggs, and vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-5"}, {"@type": "HowToStep", "text": "Whisk thoroughly until the eggs are completely blended into the mixture and the filling appears evenly combined.", "name": "Whisk thoroughly until the eggs are completely blended into the mixture and the filling appears evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-6"}, {"@type": "HowToStep", "text": "Pour the prepared pecan mixture evenly over the partially cooled, pre-baked crust. Carefully spread the topping toward the edges so the entire base is covered.", "name": "Pour the prepared pecan mixture evenly over the partially cooled, pre-baked crust. Carefully spread the topping toward the edges so the entire base is covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-7"}, {"@type": "HowToStep", "text": "Return the pan to the oven and bake for 30–35 minutes, or until the pecan layer is golden and the filling has set.", "name": "Return the pan to the oven and bake for 30–35 minutes, or until the pecan layer is golden and the filling has set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-8"}, {"@type": "HowToStep", "text": "If the surface begins browning too rapidly during baking, loosely place a sheet of aluminum foil over the pan for the remaining baking time.", "name": "If the surface begins browning too rapidly during baking, loosely place a sheet of aluminum foil over the pan for the remaining baking time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-9"}, {"@type": "HowToStep", "text": "Allow the pecan pie bars to cool completely while still in the baking pan. Full cooling is important because it gives the filling sufficient time to firm, resulting in cleaner slices.", "name": "Allow the pecan pie bars to cool completely while still in the baking pan. Full cooling is important because it gives the filling sufficient time to firm, resulting in cleaner slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-10"}, {"@type": "HowToStep", "text": "Once completely cooled, use the parchment-paper overhang, if applicable, to lift the slab from the pan. Cut into individual squares before serving.", "name": "Once completely cooled, use the parchment-paper overhang, if applicable, to lift the slab from the pan. Cut into individual squares before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lazy-girl-pecan-pie-bars/#wprm-recipe-46273-step-0-11"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Lazy Girl Pecan Pie Bars"}</script>
