er.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/enchilada-casserole/#wprm-recipe-32158-step-0-7"}, {"@type": "HowToStep", "text": "Distribute half of the beef and bean mixture over the tortillas. Sprinkle with 1 cup of shredded cheese.", "name": "Distribute half of the beef and bean mixture over the tortillas. Sprinkle with 1 cup of shredded cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/enchilada-casserole/#wprm-recipe-32158-step-0-8"}, {"@type": "HowToStep", "text": "Repeat the process with the final 6 tortillas, dipping them in sauce before layering. Spread the remaining beef mixture over them, then top generously with the remaining 2 cups of Colby Jack cheese.", "name": "Repeat the process with the final 6 tortillas, dipping them in sauce before layering. Spread the remaining beef mixture over them, then top generously with the remaining 2 cups of Colby Jack cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/enchilada-casserole/#wprm-recipe-32158-step-0-9"}, {"@type": "HowToStep", "text": "Bake uncovered for 20 minutes, or until the cheese has melted completely and is bubbling at the edges.", "name": "Bake uncovered for 20 minutes, or until the cheese has melted completely and is bubbling at the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/enchilada-casserole/#wprm-recipe-32158-step-0-10"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Mexican-Inspired"], "keywords": "enchilada casserole"}</script>
