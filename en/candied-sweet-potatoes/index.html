    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Candied Sweet Potatoes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender slices of sweet potato are slowly simmered in a buttery brown sugar caramel infused with cinnamon, nutmeg, and vanilla. The gentle cooking process creates a rich, glossy glaze while allowing the potatoes to become soft without losing their shape.", "datePublished": "2020-10-30T09:29:06+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/candied-sweet-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/candied-sweet-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/candied-sweet-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/candied-sweet-potatoes.png"], "prepTime": "PT15M", "cookTime": "PT45M", "totalTime": "PT60M", "recipeIngredient": ["6  large sweet potatoes (peeled and cut into uniform 1/4-inch-thick rounds)", "1 tablespoon vanilla extract (for additional depth in the caramel)", "1 cup firmly packed brown sugar", "1/2 teaspoon ground nutmeg", "1/2 cup unsalted butter (preferably a rich variety such as Kerrygold)", "Small pinch of salt", "1 teaspoon ground cinnamon (preferably freshly ground)", "1 cup granulated sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Peel the sweet potatoes, then slice them into rounds approximately 1/4 inch thick. Keep the slices as even as possible so that they soften at a consistent rate during cooking.", "name": "Peel the sweet potatoes, then slice them into rounds approximately 1/4 inch thick. Keep the slices as even as possible so that they soften at a consistent rate during cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-0"}, {"@type": "HowToStep", "text": "Combine the cinnamon, nutmeg, and a small pinch of salt in a separate bowl. Freshly ground cinnamon and nutmeg may be used for a brighter aroma and more pronounced spice flavor.", "name": "Combine the cinnamon, nutmeg, and a small pinch of salt in a separate bowl. Freshly ground cinnamon and nutmeg may be used for a brighter aroma and more pronounced spice flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-1"}, {"@type": "HowToStep", "text": "Place the unsalted butter in a large skillet or Dutch oven and melt it over medium heat.", "name": "Place the unsalted butter in a large skillet or Dutch oven and melt it over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-2"}, {"@type": "HowToStep", "text": "When the butter has fully melted and begins to foam, add the granulated sugar and packed brown sugar.", "name": "When the butter has fully melted and begins to foam, add the granulated sugar and packed brown sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-3"}, {"@type": "HowToStep", "text": "Stir continuously for 2 to 3 minutes, allowing the sugars to begin dissolving into the butter. Continue until the mixture becomes fragrant and develops a light golden color. This short caramelization period intensifies the sweetness before moisture is released from the potatoes.", "name": "Stir continuously for 2 to 3 minutes, allowing the sugars to begin dissolving into the butter. Continue until the mixture becomes fragrant and develops a light golden color. This short caramelization period intensifies the sweetness before moisture is released from the potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the sliced sweet potatoes to the prepared butter-and-sugar mixture.", "name": "Transfer the sliced sweet potatoes to the prepared butter-and-sugar mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-5"}, {"@type": "HowToStep", "text": "Scatter the cinnamon, nutmeg, and salt mixture evenly over the potatoes. Stir carefully until the slices are thoroughly coated with the caramel and spices.", "name": "Scatter the cinnamon, nutmeg, and salt mixture evenly over the potatoes. Stir carefully until the slices are thoroughly coated with the caramel and spices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-6"}, {"@type": "HowToStep", "text": "Lower the heat to medium-low and cover the pan. Simmer for approximately 40 minutes, gently stirring 2 to 3 times during cooking to minimize sticking and distribute the glaze evenly.", "name": "Lower the heat to medium-low and cover the pan. Simmer for approximately 40 minutes, gently stirring 2 to 3 times during cooking to minimize sticking and distribute the glaze evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-7"}, {"@type": "HowToStep", "text": "As the potatoes approach the end of the cooking time, stir less often—approximately once every 15 minutes—to encourage slight caramelization along the bottom without allowing the sugars to burn.", "name": "As the potatoes approach the end of the cooking time, stir less often—approximately once every 15 minutes—to encourage slight caramelization along the bottom without allowing the sugars to burn.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-8"}, {"@type": "HowToStep", "text": "Continue cooking until the sweet potato slices are fork-tender and the cooking liquid has reduced to a thick, glossy syrup.", "name": "Continue cooking until the sweet potato slices are fork-tender and the cooking liquid has reduced to a thick, glossy syrup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-9"}, {"@type": "HowToStep", "text": "Remove the pan from the heat and pour in the vanilla extract.", "name": "Remove the pan from the heat and pour in the vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-10"}, {"@type": "HowToStep", "text": "Fold the potatoes gently through the glaze so the vanilla is evenly incorporated without breaking the tender slices.", "name": "Fold the potatoes gently through the glaze so the vanilla is evenly incorporated without breaking the tender slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-11"}, {"@type": "HowToStep", "text": "Transfer the candied sweet potatoes to a serving dish while still warm. The remaining heat will help the caramel glaze thicken slightly as the dish rests.", "name": "Transfer the candied sweet potatoes to a serving dish while still warm. The remaining heat will help the caramel glaze thicken slightly as the dish rests.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-sweet-potatoes/#wprm-recipe-45660-step-0-12"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Candied Sweet Potatoes"}</script>
