    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Butternut Squash Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warm, savory-sweet casserole featuring roasted butternut squash and Honeycrisp apples, browned Italian sausage, caramelized fennel and onion, maple syrup, fragrant herbs, and a golden layer of melted Gruyère. Fresh or crisp-fried sage provides the finishing touch.", "datePublished": "2021-10-18T19:47:49+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/butternut-squash-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/butternut-squash-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/butternut-squash-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/butternut-squash-casserole.png"], "cookTime": "PT35M", "totalTime": "PT35M", "recipeIngredient": ["1 tablespoon pure maple syrup", "½ teaspoon dried ground sage", "2 pounds butternut squash (peeled and chopped into 1-inch cubes)", "Black pepper (according to taste)", "1½ teaspoons herbes de Provence", "2 tablespoons extra-virgin olive oil", "2  Honeycrisp apples (peeled, cored, and cut into pieces approximately the same size as the squash)", "Salt (to taste)", "2  small fennel bulbs (halved, cored, and finely sliced)", "Olive oil (as required for cooking)", "½ pound sweet Italian sausage (removed from the casings and crumbled)", "1  onion (quartered and sliced into thin strips)", "Fresh sage leaves (for serving)", "1 cup shredded Gruyère cheese", "Salt and freshly ground black pepper (as needed)", "1 tablespoon maple syrup", "¼ cup oil (for frying the sage leaves, optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 425°F. Cover a baking sheet with foil and lightly coat it with cooking spray.", "name": "Preheat the oven to 425°F. Cover a baking sheet with foil and lightly coat it with cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-0"}, {"@type": "HowToStep", "text": "Place the cubed butternut squash and prepared Honeycrisp apples in a large mixing bowl.", "name": "Place the cubed butternut squash and prepared Honeycrisp apples in a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-1"}, {"@type": "HowToStep", "text": "Pour approximately 2 tablespoons of olive oil over the squash and apples. Season generously with salt and black pepper.", "name": "Pour approximately 2 tablespoons of olive oil over the squash and apples. Season generously with salt and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-2"}, {"@type": "HowToStep", "text": "Add 1 tablespoon of maple syrup, the dried sage, and herbes de Provence.", "name": "Add 1 tablespoon of maple syrup, the dried sage, and herbes de Provence.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-3"}, {"@type": "HowToStep", "text": "Toss thoroughly until the squash and apple pieces are evenly coated with the oil, syrup, herbs, and seasonings.", "name": "Toss thoroughly until the squash and apple pieces are evenly coated with the oil, syrup, herbs, and seasonings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-4"}, {"@type": "HowToStep", "text": "Arrange the mixture across the prepared baking sheet in an even layer. Roast for approximately 35 minutes, stirring occasionally to encourage even browning. Continue roasting until the butternut squash is tender.", "name": "Arrange the mixture across the prepared baking sheet in an even layer. Roast for approximately 35 minutes, stirring occasionally to encourage even browning. Continue roasting until the butternut squash is tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-5"}, {"@type": "HowToStep", "text": "While the squash and apples are roasting, place a large skillet over medium-high heat. A cast-iron skillet may be used.", "name": "While the squash and apples are roasting, place a large skillet over medium-high heat. A cast-iron skillet may be used.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-6"}, {"@type": "HowToStep", "text": "Add a small amount of olive oil to the heated pan.", "name": "Add a small amount of olive oil to the heated pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-7"}, {"@type": "HowToStep", "text": "Once the skillet is hot, add the crumbled sweet Italian sausage.", "name": "Once the skillet is hot, add the crumbled sweet Italian sausage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-8"}, {"@type": "HowToStep", "text": "Cook for several minutes, stirring periodically, until the sausage is thoroughly cooked and nicely browned.", "name": "Cook for several minutes, stirring periodically, until the sausage is thoroughly cooked and nicely browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the cooked sausage to a bowl and reserve it for assembly.", "name": "Transfer the cooked sausage to a bowl and reserve it for assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-10"}, {"@type": "HowToStep", "text": "Place the thinly sliced fennel and onion in the pan. Cook over medium heat for approximately 10 to 12 minutes, stirring from time to time.", "name": "Place the thinly sliced fennel and onion in the pan. Cook over medium heat for approximately 10 to 12 minutes, stirring from time to time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-11"}, {"@type": "HowToStep", "text": "Continue cooking until the vegetables develop a deep golden color and a soft, jam-like consistency.", "name": "Continue cooking until the vegetables develop a deep golden color and a soft, jam-like consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the caramelized fennel and onion to the bowl containing the cooked sausage.", "name": "Transfer the caramelized fennel and onion to the bowl containing the cooked sausage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-13"}, {"@type": "HowToStep", "text": "Add a little additional olive oil to the skillet if the surface appears dry.", "name": "Add a little additional olive oil to the skillet if the surface appears dry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-14"}, {"@type": "HowToStep", "text": "For additional sweetness and deeper caramelization, the vegetables may remain over low heat for an extra minute before being removed from the skillet.", "name": "For additional sweetness and deeper caramelization, the vegetables may remain over low heat for an extra minute before being removed from the skillet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-15"}, {"@type": "HowToStep", "text": "Change the oven setting from roasting to broil.", "name": "Change the oven setting from roasting to broil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-16"}, {"@type": "HowToStep", "text": "Combine the roasted squash and apples with the cooked sausage, fennel, and onion in a large bowl.", "name": "Combine the roasted squash and apples with the cooked sausage, fennel, and onion in a large bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-17"}, {"@type": "HowToStep", "text": "Drizzle the remaining 1 tablespoon of maple syrup over the mixture and toss until the ingredients are evenly distributed.", "name": "Drizzle the remaining 1 tablespoon of maple syrup over the mixture and toss until the ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-18"}, {"@type": "HowToStep", "text": "Taste and season with additional salt and black pepper as desired.", "name": "Taste and season with additional salt and black pepper as desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-19"}, {"@type": "HowToStep", "text": "Transfer the combined mixture to a medium baking dish measuring approximately 9 × 13 inches.", "name": "Transfer the combined mixture to a medium baking dish measuring approximately 9 × 13 inches.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-20"}, {"@type": "HowToStep", "text": "For a crisp sage garnish, heat ¼ cup oil in a small saucepan over medium-high heat.", "name": "For a crisp sage garnish, heat ¼ cup oil in a small saucepan over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-21"}, {"@type": "HowToStep", "text": "When the oil begins to shimmer, carefully add the fresh sage leaves.", "name": "When the oil begins to shimmer, carefully add the fresh sage leaves.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-22"}, {"@type": "HowToStep", "text": "Fry the leaves for approximately 20 seconds, or until crisp.", "name": "Fry the leaves for approximately 20 seconds, or until crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-23"}, {"@type": "HowToStep", "text": "Immediately transfer them to a paper towel-lined surface to drain. Season lightly with salt and reserve for garnishing.", "name": "Immediately transfer them to a paper towel-lined surface to drain. Season lightly with salt and reserve for garnishing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-24"}, {"@type": "HowToStep", "text": "Scatter the shredded Gruyère evenly over the assembled casserole.", "name": "Scatter the shredded Gruyère evenly over the assembled casserole.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-25"}, {"@type": "HowToStep", "text": "Place the baking dish beneath the broiler for a few minutes, watching carefully, until the cheese has melted and developed a golden-brown surface.", "name": "Place the baking dish beneath the broiler for a few minutes, watching carefully, until the cheese has melted and developed a golden-brown surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-26"}, {"@type": "HowToStep", "text": "Remove the casserole promptly once the cheese is browned, as broilers can color the topping very quickly.", "name": "Remove the casserole promptly once the cheese is browned, as broilers can color the topping very quickly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-27"}, {"@type": "HowToStep", "text": "Allow the casserole to cool slightly after removing it from the oven.", "name": "Allow the casserole to cool slightly after removing it from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-28"}, {"@type": "HowToStep", "text": "Finish with either the fried sage leaves or fresh sage leaves.", "name": "Finish with either the fried sage leaves or fresh sage leaves.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-29"}, {"@type": "HowToStep", "text": "Serve the casserole warm.", "name": "Serve the casserole warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butternut-squash-casserole/#wprm-recipe-44059-step-0-30"}], "recipeCategory": ["Casserole"], "recipeCuisine": ["American"], "keywords": "Butternut Squash Casserole"}</script>
