    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Zucchini Boats Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A wholesome and satisfying dish, these zucchini boats are generously filled with a savory blend of Italian sausage and aromatic vegetables, enveloped in rich marinara, and crowned with melted mozzarella. A simple, low-carb main course ideal for any occasion.", "datePublished": "2024-09-05T16:47:54+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/zucchini-boats-recipe/Zucchini-Boats-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-boats-recipe/Zucchini-Boats-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-boats-recipe/Zucchini-Boats-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-boats-recipe/Zucchini-Boats-Recipe.png"], "recipeYield": ["4"], "prepTime": "PT10M", "cookTime": "PT40M", "totalTime": "PT50M", "recipeIngredient": ["1 pound mild Italian sausage (casings removed)", "1/2 teaspoon dried Italian seasoning", "2 teaspoons olive oil", "3/4 cup shredded mozzarella cheese", "1 tablespoon chopped parsley", "1/2 cup onion (finely diced)", "1 teaspoon minced garlic", "4  medium zucchini", "Salt and pepper (to taste)", "2 cups marinara sauce", "Cooking spray"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F and lightly grease a large rectangular baking dish with cooking spray. Halve the zucchinis lengthwise and remove the stem ends, then gently scoop out the inner flesh with a spoon to form hollow shells. Sprinkle the zucchini with Italian seasoning, salt, and pepper, and arrange them in the prepared dish. In a large skillet set over medium-high heat, warm the olive oil and sauté the sausage, breaking it apart as it cooks for about 4-5 minutes. Stir in the diced onion and continue to cook until softened, approximately 4 minutes more. Add the minced garlic and sauté for 30 seconds, then season the mixture with additional salt and pepper. Incorporate the marinara sauce, bring to a gentle simmer, and cook for 5 minutes. Distribute the sausage mixture evenly among the zucchini shells and sprinkle with mozzarella cheese. Bake in the oven for 25 minutes or until the zucchinis are fork-tender and the cheese is melted and golden. Finish with a sprinkle of chopped parsley before serving.", "name": "Preheat the oven to 400°F and lightly grease a large rectangular baking dish with cooking spray. Halve the zucchinis lengthwise and remove the stem ends, then gently scoop out the inner flesh with a spoon to form hollow shells. Sprinkle the zucchini with Italian seasoning, salt, and pepper, and arrange them in the prepared dish. In a large skillet set over medium-high heat, warm the olive oil and sauté the sausage, breaking it apart as it cooks for about 4-5 minutes. Stir in the diced onion and continue to cook until softened, approximately 4 minutes more. Add the minced garlic and sauté for 30 seconds, then season the mixture with additional salt and pepper. Incorporate the marinara sauce, bring to a gentle simmer, and cook for 5 minutes. Distribute the sausage mixture evenly among the zucchini shells and sprinkle with mozzarella cheese. Bake in the oven for 25 minutes or until the zucchinis are fork-tender and the cheese is melted and golden. Finish with a sprinkle of chopped parsley before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-boats-recipe/#wprm-recipe-50099-step-0-0"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Zucchini Boats Recipe"}</script>
