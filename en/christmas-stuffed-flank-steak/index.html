    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Stuffed Flank Steak", "author": {"@type": "Person", "name": "BenDes"}, "description": "A festive rolled flank steak filled with a creamy blend of blue cheese, cranberries, walnuts, shallot, and rosemary. The beef is first marinated with cranberry sauce, balsamic vinegar, aromatics, and herbs, then filled, rolled, coated with cracked peppercorns, seared, and oven-finished until tender.", "datePublished": "2023-02-25T18:42:00+00:00", "image": ["https://erecip.github.io/en/christmas-stuffed-flank-steak/christmas-stuffed-flank-steak.png", "https://erecip.github.io/en/christmas-stuffed-flank-steak/christmas-stuffed-flank-steak.png", "https://erecip.github.io/en/christmas-stuffed-flank-steak/christmas-stuffed-flank-steak.png", "https://erecip.github.io/en/christmas-stuffed-flank-steak/christmas-stuffed-flank-steak.png"], "cookTime": "PT20M", "totalTime": "PT200M", "recipeIngredient": ["4 pounds flank steak", "1 cup cranberry sauce (either canned or homemade)", "1  white onion (cut into thin slices for even flavor distribution)", "¼ cup balsamic vinegar", "1 tablespoon freshly minced garlic", "2  sprigs fresh rosemary", "1 cup crumbled blue cheese (such as Gorgonzola or Roquefort)", "¼ cup walnuts (chopped)", "4 ounces cream cheese (softened to room temperature)", "1 tablespoon fresh rosemary (chopped)", "1  small shallot (finely minced)", "½ cup dried cranberries (sweetened or unsweetened)", "1 teaspoon black pepper", "1 teaspoon sea salt", "½ to 1 tablespoon freshly cracked peppercorns"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the flank steak inside a large resealable plastic bag. Add the cranberry sauce and balsamic vinegar, followed by the sliced white onion, minced garlic, and fresh rosemary sprigs.", "name": "Place the flank steak inside a large resealable plastic bag. Add the cranberry sauce and balsamic vinegar, followed by the sliced white onion, minced garlic, and fresh rosemary sprigs.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-0"}, {"@type": "HowToStep", "text": "Seal the bag securely and refrigerate the steak for at least 3 hours. For deeper flavor penetration, allow it to marinate for as long as 8 hours.", "name": "Seal the bag securely and refrigerate the steak for at least 3 hours. For deeper flavor penetration, allow it to marinate for as long as 8 hours.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-1"}, {"@type": "HowToStep", "text": "While the beef marinates, place the softened cream cheese, dried cranberries, minced shallot, chopped walnuts, chopped rosemary, and crumbled blue cheese in a food processor or blender.", "name": "While the beef marinates, place the softened cream cheese, dried cranberries, minced shallot, chopped walnuts, chopped rosemary, and crumbled blue cheese in a food processor or blender.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-2"}, {"@type": "HowToStep", "text": "Pulse the mixture for approximately 30 seconds, just long enough to combine the ingredients and break them down slightly. Set the prepared filling aside until needed.", "name": "Pulse the mixture for approximately 30 seconds, just long enough to combine the ingredients and break them down slightly. Set the prepared filling aside until needed.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-3"}, {"@type": "HowToStep", "text": "Remove the steak from the marinade and season it with the sea salt and black pepper. Allow the meat to come to room temperature.", "name": "Remove the steak from the marinade and season it with the sea salt and black pepper. Allow the meat to come to room temperature.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-4"}, {"@type": "HowToStep", "text": "Butterfly the flank steak by carefully slicing it through the middle widthwise without cutting completely through the opposite side. Open the steak and gently pound it with a meat mallet until the thickness is relatively even.", "name": "Butterfly the flank steak by carefully slicing it through the middle widthwise without cutting completely through the opposite side. Open the steak and gently pound it with a meat mallet until the thickness is relatively even.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-5"}, {"@type": "HowToStep", "text": "Distribute the prepared cheese and cranberry filling evenly across the opened steak.", "name": "Distribute the prepared cheese and cranberry filling evenly across the opened steak.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-6"}, {"@type": "HowToStep", "text": "Roll the filled steak firmly into a compact log, then secure it at intervals with kitchen twine.", "name": "Roll the filled steak firmly into a compact log, then secure it at intervals with kitchen twine.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-7"}, {"@type": "HowToStep", "text": "Enclose the rolled steak tightly in plastic wrap and refrigerate it for 10 to 15 minutes so it can firm up and retain its shape.", "name": "Enclose the rolled steak tightly in plastic wrap and refrigerate it for 10 to 15 minutes so it can firm up and retain its shape.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-8"}, {"@type": "HowToStep", "text": "Heat a frying pan over medium-high heat.", "name": "Heat a frying pan over medium-high heat.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-9"}, {"@type": "HowToStep", "text": "Scatter the freshly cracked peppercorns over a plate. Unwrap the chilled steak roll and turn it in the cracked pepper until the exterior is coated.", "name": "Scatter the freshly cracked peppercorns over a plate. Unwrap the chilled steak roll and turn it in the cracked pepper until the exterior is coated.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-10"}, {"@type": "HowToStep", "text": "Place the rolled steak in the heated pan and sear for approximately 2 minutes per side, developing a well-browned, flavorful crust around the exterior.", "name": "Place the rolled steak in the heated pan and sear for approximately 2 minutes per side, developing a well-browned, flavorful crust around the exterior.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-11"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the seared steak roll to an oven-safe baking dish and place it in the preheated oven.", "name": "Transfer the seared steak roll to an oven-safe baking dish and place it in the preheated oven.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-13"}, {"@type": "HowToStep", "text": "Bake for approximately 20 minutes for medium-rare doneness. Adjust the baking duration slightly according to the desired level of doneness.", "name": "Bake for approximately 20 minutes for medium-rare doneness. Adjust the baking duration slightly according to the desired level of doneness.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-14"}, {"@type": "HowToStep", "text": "Remove the stuffed flank steak from the oven and allow it to rest undisturbed for 10 minutes so the juices can redistribute throughout the meat.", "name": "Remove the stuffed flank steak from the oven and allow it to rest undisturbed for 10 minutes so the juices can redistribute throughout the meat.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-15"}, {"@type": "HowToStep", "text": "After resting, cut the rolled steak into individual rounds and serve.", "name": "After resting, cut the rolled steak into individual rounds and serve.", "url": "https://erecip.github.io/en/christmas-stuffed-flank-steak/#wprm-recipe-46109-step-0-16"}], "recipeCategory": ["Main Course"], "keywords": "Christmas Stuffed Flank Steak"}</script>
