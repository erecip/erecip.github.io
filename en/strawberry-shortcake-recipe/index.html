    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Strawberry Shortcake Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A quintessential summer indulgence, this homemade strawberry shortcake pairs tender biscuits with juicy, sweetened berries and freshly whipped cream for a dessert that is both refreshing and luxurious.", "datePublished": "2024-08-06T07:28:52+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/strawberry-shortcake-recipe/Strawberry-Shortcake-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/strawberry-shortcake-recipe/Strawberry-Shortcake-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/strawberry-shortcake-recipe/Strawberry-Shortcake-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/strawberry-shortcake-recipe/Strawberry-Shortcake-Recipe.png"], "recipeYield": ["8"], "prepTime": "PT40M", "cookTime": "PT15M", "totalTime": "PT55M", "recipeIngredient": ["¾ cup buttermilk", "1 tablespoon baking powder", "2 cups all-purpose flour (spooned and leveled)", "10 tablespoons cold unsalted butter (cut into ½-inch cubes)", "¼ teaspoon baking soda", "2 tablespoons turbinado sugar", "1 teaspoon salt", "3 tablespoons cornstarch", "2 tablespoons granulated sugar", "3 tablespoons seedless raspberry jam", "½ cup granulated sugar", "2 pounds strawberries (hulled and sliced ¼-inch thick)", "3 tablespoons granulated sugar", "1½ cups heavy cream"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 425°F, positioning a rack in the center. Line a baking sheet (13x18-inch) with parchment paper.", "name": "Preheat the oven to 425°F, positioning a rack in the center. Line a baking sheet (13x18-inch) with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/strawberry-shortcake-recipe/#wprm-recipe-12351-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, whisk together the flour, cornstarch, baking powder, baking soda, sugar, and salt. Integrate the cold butter by rubbing it into the flour mixture with your fingertips until the texture resembles coarse crumbs with visible pea-sized butter bits. Pour in the buttermilk and stir gently with a rubber spatula just until a sticky, uneven dough forms—avoid overmixing.", "name": "In a large mixing bowl, whisk together the flour, cornstarch, baking powder, baking soda, sugar, and salt. Integrate the cold butter by rubbing it into the flour mixture with your fingertips until the texture resembles coarse crumbs with visible pea-sized butter bits. Pour in the buttermilk and stir gently with a rubber spatula just until a sticky, uneven dough forms—avoid overmixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/strawberry-shortcake-recipe/#wprm-recipe-12351-step-0-1"}, {"@type": "HowToStep", "text": "With lightly floured hands, shape the dough into 8 uneven balls, each slightly larger than a golf ball but smaller than a tennis ball. Arrange them on the prepared sheet, and sprinkle the tops with turbinado sugar. Bake for 13–15 minutes, or until golden brown.", "name": "With lightly floured hands, shape the dough into 8 uneven balls, each slightly larger than a golf ball but smaller than a tennis ball. Arrange them on the prepared sheet, and sprinkle the tops with turbinado sugar. Bake for 13–15 minutes, or until golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/strawberry-shortcake-recipe/#wprm-recipe-12351-step-0-2"}, {"@type": "HowToStep", "text": "Place one-third of the strawberries in a medium bowl and mash them with a fork or potato masher into a chunky purée. Stir in the remaining sliced strawberries, raspberry jam, and sugar. Allow to sit at room temperature for about 10 minutes to become saucy.", "name": "Place one-third of the strawberries in a medium bowl and mash them with a fork or potato masher into a chunky purée. Stir in the remaining sliced strawberries, raspberry jam, and sugar. Allow to sit at room temperature for about 10 minutes to become saucy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/strawberry-shortcake-recipe/#wprm-recipe-12351-step-0-3"}, {"@type": "HowToStep", "text": "In the bowl of a stand mixer fitted with a whisk attachment—or using hand beaters—whip the cream until soft peaks begin to form. Add the sugar and continue beating just until soft peaks return, being cautious not to overwhip. If preparing by hand, use a deep mixing bowl and a whisk.", "name": "In the bowl of a stand mixer fitted with a whisk attachment—or using hand beaters—whip the cream until soft peaks begin to form. Add the sugar and continue beating just until soft peaks return, being cautious not to overwhip. If preparing by hand, use a deep mixing bowl and a whisk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/strawberry-shortcake-recipe/#wprm-recipe-12351-step-0-4"}, {"@type": "HowToStep", "text": "To serve, halve each biscuit horizontally using a serrated knife and place the bottom halves onto dessert plates. Distribute about three-quarters of the berry mixture and its juice across the biscuit bases, allowing some to spill over naturally. Add a substantial spoonful of whipped cream, then cap with the biscuit tops. Garnish with remaining berries and a final flourish of cream. Serve without delay.", "name": "To serve, halve each biscuit horizontally using a serrated knife and place the bottom halves onto dessert plates. Distribute about three-quarters of the berry mixture and its juice across the biscuit bases, allowing some to spill over naturally. Add a substantial spoonful of whipped cream, then cap with the biscuit tops. Garnish with remaining berries and a final flourish of cream. Serve without delay.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/strawberry-shortcake-recipe/#wprm-recipe-12351-step-0-5"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Strawberry Shortcake Recipe"}</script>
