    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Spiced Pear Upside Down Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warmly spiced whole wheat pastry cake baked over a layer of tender pears, melted butter, and caramelized sugar. Whipped egg whites are folded into the batter to create a lighter texture, while cinnamon, ginger, nutmeg, and cloves provide a fragrant finish.", "datePublished": "2022-09-05T21:38:48+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/spiced-pear-upside-down-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/spiced-pear-upside-down-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/spiced-pear-upside-down-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/spiced-pear-upside-down-cake.png"], "cookTime": "PT35M", "totalTime": "PT45M", "recipeIngredient": ["3 tablespoons salted butter (melted and allowed to cool slightly)", "2  ripe pears (peeled, cores removed, and cut into slices approximately 1/4 inch thick)", "1/3 cup brown sugar or maple sugar", "2  large eggs (separated into yolks and whites)", "1 teaspoon ground cinnamon", "6 tablespoons salted butter (softened to approximately 70°F)", "1 cup plus 2 tablespoons whole wheat pastry flour", "2 tablespoons vanilla extract", "1/4 cup whole milk", "1/2 teaspoon ground ginger", "3/4 cup maple sugar", "1/4 teaspoon cream of tartar", "1 1/2 teaspoons fresh baking powder", "1/8 teaspoon ground cloves", "1/2 teaspoon salt", "1/4 teaspoon freshly grated nutmeg", "Vanilla custard (vanilla ice cream, or whipped cream)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Thoroughly grease a 9-inch round cake pan.", "name": "Preheat the oven to 350°F (175°C). Thoroughly grease a 9-inch round cake pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-0"}, {"@type": "HowToStep", "text": "Distribute the 1/3 cup brown sugar or maple sugar evenly across the bottom of the prepared pan. Pour the 3 tablespoons melted salted butter over the sugar.", "name": "Distribute the 1/3 cup brown sugar or maple sugar evenly across the bottom of the prepared pan. Pour the 3 tablespoons melted salted butter over the sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-1"}, {"@type": "HowToStep", "text": "Arrange the prepared pear slices over the butter and sugar layer, positioning them decoratively and allowing the slices to overlap slightly if desired.", "name": "Arrange the prepared pear slices over the butter and sugar layer, positioning them decoratively and allowing the slices to overlap slightly if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, thoroughly whisk together the whole wheat pastry flour, baking powder, salt, cinnamon, ginger, freshly grated nutmeg, and ground cloves. Set the dry mixture aside.", "name": "In a separate bowl, thoroughly whisk together the whole wheat pastry flour, baking powder, salt, cinnamon, ginger, freshly grated nutmeg, and ground cloves. Set the dry mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-3"}, {"@type": "HowToStep", "text": "Place the 6 tablespoons softened salted butter and 3/4 cup maple sugar in a large mixing bowl. Beat them together until the mixture becomes pale, light, and fluffy.", "name": "Place the 6 tablespoons softened salted butter and 3/4 cup maple sugar in a large mixing bowl. Beat them together until the mixture becomes pale, light, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-4"}, {"@type": "HowToStep", "text": "Add the egg yolks individually, mixing thoroughly after each addition. Blend in the vanilla extract.", "name": "Add the egg yolks individually, mixing thoroughly after each addition. Blend in the vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-5"}, {"@type": "HowToStep", "text": "Add approximately half of the prepared flour mixture to the butter mixture and stir until incorporated. Mix in the whole milk, followed by the remaining dry ingredients. Stir only until the batter is evenly combined.", "name": "Add approximately half of the prepared flour mixture to the butter mixture and stir until incorporated. Mix in the whole milk, followed by the remaining dry ingredients. Stir only until the batter is evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-6"}, {"@type": "HowToStep", "text": "In a completely clean and dry bowl, beat the reserved egg whites together with the cream of tartar until firm, stiff peaks develop.", "name": "In a completely clean and dry bowl, beat the reserved egg whites together with the cream of tartar until firm, stiff peaks develop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-7"}, {"@type": "HowToStep", "text": "Carefully fold the beaten egg whites into the cake batter, working gently so the incorporated air is retained.", "name": "Carefully fold the beaten egg whites into the cake batter, working gently so the incorporated air is retained.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the completed batter to the cake pan, spreading it carefully over the arranged pears. Level the surface evenly.", "name": "Transfer the completed batter to the cake pan, spreading it carefully over the arranged pears. Level the surface evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-9"}, {"@type": "HowToStep", "text": "Bake for 35–40 minutes, until the cake is golden and a toothpick inserted into the center comes out clean.", "name": "Bake for 35–40 minutes, until the cake is golden and a toothpick inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-10"}, {"@type": "HowToStep", "text": "Remove the cake from the oven and leave it in the pan for 10 minutes. Run a knife carefully around the perimeter to loosen the edges, then invert the cake onto a serving plate so the pear layer is facing upward.", "name": "Remove the cake from the oven and leave it in the pan for 10 minutes. Run a knife carefully around the perimeter to loosen the edges, then invert the cake onto a serving plate so the pear layer is facing upward.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-11"}, {"@type": "HowToStep", "text": "Serve warm or at room temperature, either plain or accompanied by whipped cream, vanilla ice cream, or vanilla custard.", "name": "Serve warm or at room temperature, either plain or accompanied by whipped cream, vanilla ice cream, or vanilla custard.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-pear-upside-down-cake/#wprm-recipe-42083-step-0-12"}], "recipeCategory": ["cake", "Dessert"], "keywords": "Spiced Pear Upside Down Cake"}</script>
