et the mixture simmer, partially covered, for 20 to 30 minutes. Stir occasionally until the sauce thickens to your desired consistency. Taste and adjust the seasoning if needed.", "name": "Lower the heat and let the mixture simmer, partially covered, for 20 to 30 minutes. Stir occasionally until the sauce thickens to your desired consistency. Taste and adjust the seasoning if needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-garlic-bread/#wprm-recipe-32074-step-0-5"}, {"@type": "HowToStep", "text": "Spoon the hot sloppy joe filling evenly across both halves of the buttered ciabatta. Sprinkle mozzarella and cheddar cheeses over the top of the meat.", "name": "Spoon the hot sloppy joe filling evenly across both halves of the buttered ciabatta. Sprinkle mozzarella and cheddar cheeses over the top of the meat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-garlic-bread/#wprm-recipe-32074-step-0-6"}, {"@type": "HowToStep", "text": "Place the assembled bread into the preheated oven and bake for about 10 minutes, or until the cheese is melted and the bread edges are lightly browned and crisp.", "name": "Place the assembled bread into the preheated oven and bake for about 10 minutes, or until the cheese is melted and the bread edges are lightly browned and crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-garlic-bread/#wprm-recipe-32074-step-0-7"}, {"@type": "HowToStep", "text": "Once baked, remove from the oven, slice into portions, and optionally garnish with freshly chopped parsley. Serve immediately.", "name": "Once baked, remove from the oven, slice into portions, and optionally garnish with freshly chopped parsley. Serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-garlic-bread/#wprm-recipe-32074-step-0-8"}], "recipeCuisine": ["American"]}</script>
