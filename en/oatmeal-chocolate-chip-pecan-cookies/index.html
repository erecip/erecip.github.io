    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Oatmeal Chocolate Chip Pecan Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These oatmeal cookies combine hearty old-fashioned oats with rich chocolate chips and crisp pecan pieces. Cinnamon adds gentle warmth, while brown sugar and softened butter create a tender, chewy texture with lightly browned edges.", "datePublished": "2019-03-12T23:20:29+00:00", "image": ["https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/oatmeal-chocolate-chip-pecan-cookies2.png", "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/oatmeal-chocolate-chip-pecan-cookies2.png", "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/oatmeal-chocolate-chip-pecan-cookies2.png", "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/oatmeal-chocolate-chip-pecan-cookies2.png"], "cookTime": "PT10M", "totalTime": "PT10M", "recipeIngredient": ["2  large eggs (brought to room temperature)", "1 teaspoon pure vanilla extract", "1 cup firmly packed brown sugar", "1 cup unsalted or salted butter (softened at room temperature)", "½ cup granulated white sugar", "1 teaspoon ground cinnamon", "1½ cups all-purpose flour", "½ teaspoon fine salt", "1 teaspoon baking soda", "1 cup pecans (chopped into small pieces)", "3 cups old-fashioned rolled oats (not quick-cooking oats)", "1½ cups chocolate chips"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C) so it reaches the correct temperature before the cookies are baked.", "name": "Preheat the oven to 350°F (175°C) so it reaches the correct temperature before the cookies are baked.", "url": "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/#wprm-recipe-39925-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened butter, packed brown sugar, and granulated sugar in a large mixing bowl. Beat the ingredients together until the mixture becomes pale, smooth, and fluffy.", "name": "Place the softened butter, packed brown sugar, and granulated sugar in a large mixing bowl. Beat the ingredients together until the mixture becomes pale, smooth, and fluffy.", "url": "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/#wprm-recipe-39925-step-0-1"}, {"@type": "HowToStep", "text": "Add the room-temperature eggs and vanilla extract to the creamed butter mixture. Continue beating until fully incorporated and slightly glossy.", "name": "Add the room-temperature eggs and vanilla extract to the creamed butter mixture. Continue beating until fully incorporated and slightly glossy.", "url": "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/#wprm-recipe-39925-step-0-2"}, {"@type": "HowToStep", "text": "In a separate medium bowl, whisk together the all-purpose flour, baking soda, cinnamon, and salt until evenly blended.", "name": "In a separate medium bowl, whisk together the all-purpose flour, baking soda, cinnamon, and salt until evenly blended.", "url": "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/#wprm-recipe-39925-step-0-3"}, {"@type": "HowToStep", "text": "Gradually add the dry mixture to the wet ingredients. Stir until the flour is incorporated and a cohesive cookie dough develops.", "name": "Gradually add the dry mixture to the wet ingredients. Stir until the flour is incorporated and a cohesive cookie dough develops.", "url": "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/#wprm-recipe-39925-step-0-4"}, {"@type": "HowToStep", "text": "Fold the old-fashioned oats into the dough, distributing them evenly throughout. Add the chocolate chips and pecan pieces, then mix only until the additions are uniformly combined.", "name": "Fold the old-fashioned oats into the dough, distributing them evenly throughout. Add the chocolate chips and pecan pieces, then mix only until the additions are uniformly combined.", "url": "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/#wprm-recipe-39925-step-0-5"}, {"@type": "HowToStep", "text": "Using a 1½-tablespoon cookie scoop, portion equal mounds of dough onto an ungreased cookie sheet. Leave approximately 2 inches of space between each portion.", "name": "Using a 1½-tablespoon cookie scoop, portion equal mounds of dough onto an ungreased cookie sheet. Leave approximately 2 inches of space between each portion.", "url": "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/#wprm-recipe-39925-step-0-6"}, {"@type": "HowToStep", "text": "Bake for 10–12 minutes, or until the outer edges are beginning to turn golden brown.", "name": "Bake for 10–12 minutes, or until the outer edges are beginning to turn golden brown.", "url": "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/#wprm-recipe-39925-step-0-7"}, {"@type": "HowToStep", "text": "Remove the cookies from the oven and carefully transfer them to a wire cooling rack. Let them cool completely before serving or placing them in storage.", "name": "Remove the cookies from the oven and carefully transfer them to a wire cooling rack. Let them cool completely before serving or placing them in storage.", "url": "https://erecip.github.io/en/oatmeal-chocolate-chip-pecan-cookies/#wprm-recipe-39925-step-0-8"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Oatmeal Chocolate Chip Pecan Cookies"}</script>
