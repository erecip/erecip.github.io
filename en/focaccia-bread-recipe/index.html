    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Focaccia Bread Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A superbly simple yet exquisite focaccia, made extraordinary through an overnight cold fermentation. This technique enriches the dough’s texture, yielding an airy, tender crumb with a golden, crisp crust. A perfect candidate for both sandwiches and standalone enjoyment.", "datePublished": "2024-03-29T19:44:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/focaccia-bread-recipe/Focaccia-Bread-Recipe3.webp", "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-bread-recipe/Focaccia-Bread-Recipe3.webp", "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-bread-recipe/Focaccia-Bread-Recipe3.webp", "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-bread-recipe/Focaccia-Bread-Recipe3.webp"], "prepTime": "PT1080M", "cookTime": "PT30M", "totalTime": "PT1110M", "recipeIngredient": ["2 teaspoons 10 g kosher salt", "4 tablespoons olive oil (divided)", "1 to 2 teaspoons whole rosemary leaves (optional)", "butter (for greasing)", "2 cups 455 g lukewarm water (combine ½ cup boiling water with 1½ cups cold water)", "2 teaspoons 8 g instant yeast (see notes for active dry yeast usage)", "flaky sea salt (such as Maldon, for finishing)", "4 cups 512 g all-purpose or bread flour (refer to flour notes)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a large mixing bowl, combine the flour, salt, and yeast. Add the lukewarm water and stir using a rubber spatula until a sticky dough is formed and the liquid fully absorbed. Coat the dough surface with a light layer of olive oil, cover the bowl using a damp towel, cloth cover, or plastic wrap, and refrigerate immediately for a minimum of 12 hours or up to three days.", "name": "In a large mixing bowl, combine the flour, salt, and yeast. Add the lukewarm water and stir using a rubber spatula until a sticky dough is formed and the liquid fully absorbed. Coat the dough surface with a light layer of olive oil, cover the bowl using a damp towel, cloth cover, or plastic wrap, and refrigerate immediately for a minimum of 12 hours or up to three days.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-bread-recipe/#wprm-recipe-25629-step-0-0"}, {"@type": "HowToStep", "text": "Prepare two 8- or 9-inch pie plates or a single 9×13-inch baking pan by lining with parchment paper or generously greasing with butter or nonstick spray. Pour 1 tablespoon of oil into the center of each smaller pan, or 2 tablespoons if using the larger one.", "name": "Prepare two 8- or 9-inch pie plates or a single 9×13-inch baking pan by lining with parchment paper or generously greasing with butter or nonstick spray. Pour 1 tablespoon of oil into the center of each smaller pan, or 2 tablespoons if using the larger one.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-bread-recipe/#wprm-recipe-25629-step-0-1"}, {"@type": "HowToStep", "text": "Using two forks, deflate the cold dough by pulling it inwards from the edges, rotating the bowl in quarters to form a rough ball. Split the dough evenly using the forks unless using the 9×13-inch pan, in which case the dough remains whole. Place the dough into the prepared pan(s), rolling it gently in the oil to coat all sides, and allow it to rest at room temperature, uncovered, for 3 to 4 hours.", "name": "Using two forks, deflate the cold dough by pulling it inwards from the edges, rotating the bowl in quarters to form a rough ball. Split the dough evenly using the forks unless using the 9×13-inch pan, in which case the dough remains whole. Place the dough into the prepared pan(s), rolling it gently in the oil to coat all sides, and allow it to rest at room temperature, uncovered, for 3 to 4 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-bread-recipe/#wprm-recipe-25629-step-0-2"}, {"@type": "HowToStep", "text": "Preheat the oven to 425°F with a rack positioned in the center. Drizzle 1 tablespoon of olive oil over each dough round (2 tablespoons for the larger pan), optionally sprinkle rosemary, and using oiled hands, press deeply with all fingers to create signature dimples across the dough. If needed, stretch gently to ensure the dough fills the pan.", "name": "Preheat the oven to 425°F with a rack positioned in the center. Drizzle 1 tablespoon of olive oil over each dough round (2 tablespoons for the larger pan), optionally sprinkle rosemary, and using oiled hands, press deeply with all fingers to create signature dimples across the dough. If needed, stretch gently to ensure the dough fills the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-bread-recipe/#wprm-recipe-25629-step-0-3"}, {"@type": "HowToStep", "text": "Finish with a scattering of flaky sea salt and bake for 25 to 30 minutes, until the bottom turns golden and crisp. Remove from the oven and transfer to a wire rack. Allow to cool at least 10 minutes before slicing, or fully if planning to halve for sandwiches.", "name": "Finish with a scattering of flaky sea salt and bake for 25 to 30 minutes, until the bottom turns golden and crisp. Remove from the oven and transfer to a wire rack. Allow to cool at least 10 minutes before slicing, or fully if planning to halve for sandwiches.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-bread-recipe/#wprm-recipe-25629-step-0-4"}], "recipeCategory": ["Bread"], "recipeCuisine": ["Italian"], "keywords": "focaccia bread recipe"}</script>
