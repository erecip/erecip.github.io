    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies with Vanilla Pudding", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft and chewy Christmas cookies made with vanilla instant pudding for a tender texture, then generously studded with white chocolate chips and festive sprinkles. Chilling the dough helps it become firm while allowing the flavors to blend before baking.", "datePublished": "2019-11-09T15:02:13+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/christmas-cookies-with-vanilla-pudding2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/christmas-cookies-with-vanilla-pudding2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/christmas-cookies-with-vanilla-pudding2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/christmas-cookies-with-vanilla-pudding2.png"], "cookTime": "PT10M", "totalTime": "PT70M", "recipeIngredient": ["2  large eggs (brought to room temperature for improved emulsification)", "3/4 cup unsalted butter (softened)", "2 1/4 cups all-purpose flour", "3.4 oz package instant vanilla pudding mix", "1 teaspoon pure vanilla extract", "3/4 cup firmly packed light brown sugar", "1 teaspoon baking soda", "1/4 cup white granulated sugar", "2 tablespoons festive holiday sprinkles", "2 cups good-quality white chocolate chips"], "recipeInstructions": [{"@type": "HowToStep", "text": "Cream the butter and sugars. Place the softened unsalted butter, granulated sugar, and packed light brown sugar in the bowl of a stand mixer. Beat on medium speed for approximately 2–3 minutes, or until the mixture is fluffy and thoroughly blended.", "name": "Cream the butter and sugars. Place the softened unsalted butter, granulated sugar, and packed light brown sugar in the bowl of a stand mixer. Beat on medium speed for approximately 2–3 minutes, or until the mixture is fluffy and thoroughly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/#wprm-recipe-45120-step-0-0"}, {"@type": "HowToStep", "text": "Incorporate the remaining wet ingredients. Add the instant vanilla pudding mix, room-temperature eggs, and vanilla extract to the creamed mixture. Continue beating on medium speed until the ingredients are fully incorporated and the mixture appears smooth.", "name": "Incorporate the remaining wet ingredients. Add the instant vanilla pudding mix, room-temperature eggs, and vanilla extract to the creamed mixture. Continue beating on medium speed until the ingredients are fully incorporated and the mixture appears smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/#wprm-recipe-45120-step-0-1"}, {"@type": "HowToStep", "text": "Prepare the dough. In a separate small bowl, whisk the all-purpose flour with the baking soda. Reduce the mixer to low speed and gradually add the dry mixture to the butter mixture. Continue mixing just until a thick, cohesive cookie dough forms.", "name": "Prepare the dough. In a separate small bowl, whisk the all-purpose flour with the baking soda. Reduce the mixer to low speed and gradually add the dry mixture to the butter mixture. Continue mixing just until a thick, cohesive cookie dough forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/#wprm-recipe-45120-step-0-2"}, {"@type": "HowToStep", "text": "Add the mix-ins. Fold the white chocolate chips and festive sprinkles into the dough, distributing them as evenly as possible throughout the mixture.", "name": "Add the mix-ins. Fold the white chocolate chips and festive sprinkles into the dough, distributing them as evenly as possible throughout the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/#wprm-recipe-45120-step-0-3"}, {"@type": "HowToStep", "text": "Chill the dough. Remove the dough from the mixer and shape it into a ball. Enclose it securely in plastic wrap and refrigerate for a minimum of 1 hour. A longer chilling period may further firm the dough and allow the flavors to meld more fully.", "name": "Chill the dough. Remove the dough from the mixer and shape it into a ball. Enclose it securely in plastic wrap and refrigerate for a minimum of 1 hour. A longer chilling period may further firm the dough and allow the flavors to meld more fully.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/#wprm-recipe-45120-step-0-4"}, {"@type": "HowToStep", "text": "Prepare the cookies for baking. Once the chilled dough feels firm, preheat the oven to 350°F (175°C). Line a baking sheet with parchment paper. Using a 2-tablespoon cookie scoop, portion the dough into balls and arrange them approximately 2 inches apart on the prepared baking sheet. These cookies will spread only slightly during baking.", "name": "Prepare the cookies for baking. Once the chilled dough feels firm, preheat the oven to 350°F (175°C). Line a baking sheet with parchment paper. Using a 2-tablespoon cookie scoop, portion the dough into balls and arrange them approximately 2 inches apart on the prepared baking sheet. These cookies will spread only slightly during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/#wprm-recipe-45120-step-0-5"}, {"@type": "HowToStep", "text": "Bake. Place the baking sheet in the preheated oven and bake the cookies for 10 minutes, or until the lower edges become lightly golden. The centers will continue to set and firm as the cookies cool.", "name": "Bake. Place the baking sheet in the preheated oven and bake the cookies for 10 minutes, or until the lower edges become lightly golden. The centers will continue to set and firm as the cookies cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/#wprm-recipe-45120-step-0-6"}, {"@type": "HowToStep", "text": "Cool and finish the remaining batches. Transfer the baked cookies to a wire cooling rack and allow them to cool completely. Continue portioning and baking the remaining dough in the same manner until all of it has been used.", "name": "Cool and finish the remaining batches. Transfer the baked cookies to a wire cooling rack and allow them to cool completely. Continue portioning and baking the remaining dough in the same manner until all of it has been used.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-vanilla-pudding/#wprm-recipe-45120-step-0-7"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Christmas Cookies with Vanilla Pudding"}</script>
