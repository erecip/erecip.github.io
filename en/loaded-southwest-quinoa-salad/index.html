    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Loaded Southwest Quinoa Salad with Avocado", "author": {"@type": "Person", "name": "BenDes"}, "description": "This vibrant Southwest-inspired quinoa salad delivers a nourishing blend of plant-based protein, crisp vegetables, creamy avocado, toasted pepitas, and a citrusy lime dressing. Subtle smoked paprika, cumin, and garlic notes give the salad warm depth while preserving its fresh, bright character.", "datePublished": "2025-03-24T01:33:00+00:00", "image": ["https://erecip.github.io/en/loaded-southwest-quinoa-salad/Loaded-Southwest-Quinoa-Salad-with-Avocado.webp", "https://erecip.github.io/en/loaded-southwest-quinoa-salad/Loaded-Southwest-Quinoa-Salad-with-Avocado.webp", "https://erecip.github.io/en/loaded-southwest-quinoa-salad/Loaded-Southwest-Quinoa-Salad-with-Avocado.webp", "https://erecip.github.io/en/loaded-southwest-quinoa-salad/Loaded-Southwest-Quinoa-Salad-with-Avocado.webp"], "recipeYield": ["4"], "prepTime": "PT15M", "cookTime": "PT20M", "totalTime": "PT35M", "recipeIngredient": ["1  large ripe avocado (cut into cubes)", "½  bunch fresh cilantro leaves (chopped)", "1 cup quinoa (thoroughly rinsed)", "15 ounces black beans (drained and rinsed)", "¼ teaspoon smoked paprika", "10 ounces cherry or grape tomatoes (sliced in half)", "½ teaspoon fine salt", "1  red bell pepper (finely diced)", "1 ¾ cups water", "¼ teaspoon ground cumin", "⅓ cup pepitas (toasted)", "1 cup frozen corn kernels (thawed)", "¼  red onion (finely diced)", "½ teaspoon garlic powder", "1  jalapeño (seeds removed and finely diced)", "½ teaspoon kosher salt", "¼ cup avocado oil or olive oil", "1 teaspoon agave nectar or maple syrup", "¼ teaspoon smoked paprika", "2 to 3 tablespoons freshly squeezed lime juice (from about 2 limes)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place a small ungreased skillet over medium heat. Add the pepitas and cook for 3 to 4 minutes, stirring frequently, until they become fragrant, lightly browned, and begin to pop. Transfer them to a plate and allow them to cool so they remain crisp.", "name": "Place a small ungreased skillet over medium heat. Add the pepitas and cook for 3 to 4 minutes, stirring frequently, until they become fragrant, lightly browned, and begin to pop. Transfer them to a plate and allow them to cool so they remain crisp.", "url": "https://erecip.github.io/en/loaded-southwest-quinoa-salad/#wprm-recipe-34795-step-0-0"}, {"@type": "HowToStep", "text": "Combine the rinsed quinoa, water, garlic powder, cumin, smoked paprika, and salt in a medium saucepan. Bring the mixture to a boil over medium-high heat, then lower the heat, cover the pan, and simmer for 15 minutes. Take the saucepan off the heat and let the quinoa stand, still covered, for an additional 5 minutes. Fluff it with a fork, then spread it across a plate or sheet pan until it reaches room temperature.", "name": "Combine the rinsed quinoa, water, garlic powder, cumin, smoked paprika, and salt in a medium saucepan. Bring the mixture to a boil over medium-high heat, then lower the heat, cover the pan, and simmer for 15 minutes. Take the saucepan off the heat and let the quinoa stand, still covered, for an additional 5 minutes. Fluff it with a fork, then spread it across a plate or sheet pan until it reaches room temperature.", "url": "https://erecip.github.io/en/loaded-southwest-quinoa-salad/#wprm-recipe-34795-step-0-1"}, {"@type": "HowToStep", "text": "While the quinoa is cooking, prepare the produce. Halve the tomatoes, finely dice the red bell pepper, red onion, and jalapeño, thaw the corn, and chop the cilantro. Drain and rinse the black beans thoroughly.", "name": "While the quinoa is cooking, prepare the produce. Halve the tomatoes, finely dice the red bell pepper, red onion, and jalapeño, thaw the corn, and chop the cilantro. Drain and rinse the black beans thoroughly.", "url": "https://erecip.github.io/en/loaded-southwes
