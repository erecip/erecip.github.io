    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chocolate Chip Pumpkin Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender, warmly spiced pumpkin loaf filled with semisweet and miniature chocolate chips. Pumpkin purée provides rich seasonal flavor and moisture, while applesauce or canola oil helps produce a soft crumb. This recipe yields two generously sized loaves.", "datePublished": "2020-10-19T17:13:30+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/chocolate-chip-pumpkin-bread2.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/chocolate-chip-pumpkin-bread2.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/chocolate-chip-pumpkin-bread2.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/chocolate-chip-pumpkin-bread2.png"], "cookTime": "PT50M", "totalTime": "PT60M", "recipeIngredient": ["4 teaspoons pumpkin pie spice", "1 teaspoon baking soda", "3 cups plain all-purpose flour", "1 teaspoon baking powder", "1 teaspoon fine salt", "1 tablespoon pure vanilla extract", "2/3 cup firmly packed brown sugar", "3  large eggs (brought to room temperature)", "2 cups pure canned pumpkin purée (not pumpkin pie filling)", "1 cup unsweetened applesauce or canola oil", "2/3 cup granulated white sugar", "1/2 cup mini chocolate chips (with a few tablespoons set aside for the tops if desired)", "1 1/2 cups semisweet chocolate chips"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the pans and oven. Preheat the oven to 350°F (175°C). Thoroughly grease two 8 × 4-inch loaf pans, then line them with parchment paper to make removal easier after baking. Place the prepared pans aside.", "name": "Prepare the pans and oven. Preheat the oven to 350°F (175°C). Thoroughly grease two 8 × 4-inch loaf pans, then line them with parchment paper to make removal easier after baking. Place the prepared pans aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/#wprm-recipe-42266-step-0-0"}, {"@type": "HowToStep", "text": "Blend the dry ingredients. Add the flour, pumpkin pie spice, baking soda, baking powder, and salt to a large mixing bowl. Whisk until the leavening agents, seasoning, and salt are evenly dispersed throughout the flour. Set aside.", "name": "Blend the dry ingredients. Add the flour, pumpkin pie spice, baking soda, baking powder, and salt to a large mixing bowl. Whisk until the leavening agents, seasoning, and salt are evenly dispersed throughout the flour. Set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/#wprm-recipe-42266-step-0-1"}, {"@type": "HowToStep", "text": "Prepare the wet mixture. In a medium bowl, combine the pumpkin purée, brown sugar, granulated sugar, applesauce or canola oil, room-temperature eggs, and vanilla extract. Whisk thoroughly until the mixture becomes smooth and uniform.", "name": "Prepare the wet mixture. In a medium bowl, combine the pumpkin purée, brown sugar, granulated sugar, applesauce or canola oil, room-temperature eggs, and vanilla extract. Whisk thoroughly until the mixture becomes smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/#wprm-recipe-42266-step-0-2"}, {"@type": "HowToStep", "text": "Combine the mixtures. Pour the pumpkin mixture into the bowl containing the dry ingredients. Stir gently only until the flour mixture is moistened and the batter comes together. Avoid excessive mixing, which can result in a denser finished loaf.", "name": "Combine the mixtures. Pour the pumpkin mixture into the bowl containing the dry ingredients. Stir gently only until the flour mixture is moistened and the batter comes together. Avoid excessive mixing, which can result in a denser finished loaf.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/#wprm-recipe-42266-step-0-3"}, {"@type": "HowToStep", "text": "Add the chocolate chips. Carefully fold the semisweet chocolate chips and most of the miniature chocolate chips into the batter. If desired, retain a couple of tablespoons of the mini chips for garnishing the tops before baking.", "name": "Add the chocolate chips. Carefully fold the semisweet chocolate chips and most of the miniature chocolate chips into the batter. If desired, retain a couple of tablespoons of the mini chips for garnishing the tops before baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/#wprm-recipe-42266-step-0-4"}, {"@type": "HowToStep", "text": "Fill the pans and bake. Distribute the batter evenly between the two prepared loaf pans. Scatter the reserved miniature chocolate chips over the surface of each loaf, if using. Bake for 50–55 minutes, or until a toothpick inserted into the center of a loaf comes out clean.", "name": "Fill the pans and bake. Distribute the batter evenly between the two prepared loaf pans. Scatter the reserved miniature chocolate chips over the surface of each loaf, if using. Bake for 50–55 minutes, or until a toothpick inserted into the center of a loaf comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/#wprm-recipe-42266-step-0-5"}, {"@type": "HowToStep", "text": "Cool the loaves. Leave the pumpkin bread in the pans for 10 minutes after removing it from the oven. Then carefully transfer each loaf to a wire cooling rack and allow it to cool completely before slicing.", "name": "Cool the loaves. Leave the pumpkin bread in the pans for 10 minutes after removing it from the oven. Then carefully transfer each loaf to a wire cooling rack and allow it to cool completely before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-chip-pumpkin-bread/#wprm-recipe-42266-step-0-6"}], "recipeCategory": ["Bread", "Dessert"], "recipeCuisine": ["American"], "keywords": "Chocolate Chip Pumpkin Bread"}</script>
