    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "BEST HOMEMADE CARROT CAKE RECIPE", "author": {"@type": "Person", "name": "BenDes"}, "description": "Enjoy a delightful carrot cake made with finely grated carrots for a tender crumb and a unique blend of sugars that enhance its flavor.", "datePublished": "2024-02-11T11:10:08+00:00", "image": ["https://erecip.github.io/wp-content/uploads/2024/11/codifyformatter-35-1.png", "https://erecip.github.io/wp-content/uploads/2024/11/codifyformatter-35-1-500x400.png", "https://erecip.github.io/wp-content/uploads/2024/11/codifyformatter-35-1-500x375.png", "https://erecip.github.io/wp-content/uploads/2024/11/codifyformatter-35-1-480x270.png"], "prepTime": "PT20M", "cookTime": "PT45M", "totalTime": "PT65M", "recipeIngredient": ["1 cup 190g lightly packed brown sugar", "2 cups 260g all-purpose flour, spooned and leveled", "1 cup 200g granulated sugar", "3 cups 300g grated peeled carrots (approximately 5 to 6 medium carrots)", "1 teaspoon vanilla extract", "1 ¼ cups 295ml vegetable oil", "4  large eggs (at room temperature)", "1 ½ teaspoons ground cinnamon", "2 teaspoons baking soda", "½ cup 70g raisins", "½ teaspoon fine sea salt", "1 cup 120g coarsely chopped pecans", "8 ounces 225g cream cheese, softened", "1 ¼ cups 140g powdered sugar", "2 teaspoons cornstarch (optional)", "⅓ cup 80ml cold heavy cream", "½ cup 50g coarsely chopped pecans (for topping)"], "recipeInstructions": [{"@type": "HowToSection", "name": "To Prepare the Cake:", "itemListElement": [{"@type": "HowToStep", "text": "Place an oven rack in the center position and preheat the oven to 350°F (176°C).", "name": "Place an oven rack in the center position and preheat the oven to 350°F (176°C).", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-0-0"}, {"@type": "HowToStep", "text": "Prepare two 9-inch round cake pans by greasing them, lining the bottoms with parchment paper, and greasing the top again. Alternatively, grease and flour both the sides and bottom of the pans.", "name": "Prepare two 9-inch round cake pans by greasing them, lining the bottoms with parchment paper, and greasing the top again. Alternatively, grease and flour both the sides and bottom of the pans.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-0-1"}, {"@type": "HowToStep", "text": "In a medium-sized bowl, combine the flour, baking soda, salt, and cinnamon. Whisk until thoroughly mixed.", "name": "In a medium-sized bowl, combine the flour, baking soda, salt, and cinnamon. Whisk until thoroughly mixed.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-0-2"}, {"@type": "HowToStep", "text": "In a separate large bowl, blend the vegetable oil, granulated sugar, brown sugar, and vanilla extract until well mixed.", "name": "In a separate large bowl, blend the vegetable oil, granulated sugar, brown sugar, and vanilla extract until well mixed.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-0-3"}, {"@type": "HowToStep", "text": "Add the eggs one at a time, whisking thoroughly after each addition.", "name": "Add the eggs one at a time, whisking thoroughly after each addition.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-0-4"}, {"@type": "HowToStep", "text": "Using a large rubber spatula, scrape the sides and bottom of the bowl, then gradually incorporate the dry ingredients in three parts, stirring gently until the mixture is smooth.", "name": "Using a large rubber spatula, scrape the sides and bottom of the bowl, then gradually incorporate the dry ingredients in three parts, stirring gently until the mixture is smooth.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-0-5"}, {"@type": "HowToStep", "text": "Fold in the grated carrots, chopped pecans, and raisins until evenly distributed.", "name": "Fold in the grated carrots, chopped pecans, and raisins until evenly distributed.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-0-6"}, {"@type": "HowToStep", "text": "Divide the batter evenly between the prepared cake pans. Bake for 35 to 45 minutes, or until the tops of the cakes are springy to the touch and a toothpick inserted in the center comes out clean.", "name": "Divide the batter evenly between the prepared cake pans. Bake for 35 to 45 minutes, or until the tops of the cakes are springy to the touch and a toothpick inserted in the center comes out clean.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-0-7"}, {"@type": "HowToStep", "text": "Allow the cakes to cool in the pans for 15 minutes. Then, carefully transfer the cakes to cooling racks, remove the parchment paper, and cool completely.", "name": "Allow the cakes to cool in the pans for 15 minutes. Then, carefully transfer the cakes to cooling racks, remove the parchment paper, and cool completely.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-0-8"}]}, {"@type": "HowToSection", "name": "To Frost the Cake:", "itemListElement": [{"@type": "HowToStep", "text": "In a large mixing bowl, beat the cream cheese with a handheld mixer on medium speed until smooth, about 1 minute.", "name": "In a large mixing bowl, beat the cream cheese with a handheld mixer on medium speed until smooth, about 1 minute.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-1-0"}, {"@type": "HowToStep", "text": "Gradually add the powdered sugar and cornstarch (if using), sifting them over the cream cheese to avoid lumps. If sifting isn't possible, add in increments of ¼ cup at a time, mixing until smooth.", "name": "Gradually add the powdered sugar and cornstarch (if using), sifting them over the cream cheese to avoid lumps. If sifting isn't possible, add in increments of ¼ cup at a time, mixing until smooth.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-1-1"}, {"@type": "HowToStep", "text": "Pour in the cold heavy cream and beat on medium speed for 2 to 3 minutes, until the frosting achieves a light, fluffy consistency similar to whipped cream. Cover and refrigerate until ready to use.", "name": "Pour in the cold heavy cream and beat on medium speed for 2 to 3 minutes, until the frosting achieves a light, fluffy consistency similar to whipped cream. Cover and refrigerate until ready to use.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-1-2"}, {"@type": "HowToStep", "text": "Once the cake layers have cooled completely, spread a layer of frosting on the top of one cake. Place the second layer on top.", "name": "Once the cake layers have cooled completely, spread a layer of frosting on the top of one cake. Place the second layer on top.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-1-3"}, {"@type": "HowToStep", "text": "Spread the remaining frosting on top, using a spatula or butter knife to create decorative swirls. Leave the sides unfrosted for a rustic appearance. Garnish with chopped pecans.", "name": "Spread the remaining frosting on top, using a spatula or butter knife to create decorative swirls. Leave the sides unfrosted for a rustic appearance. Garnish with chopped pecans.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-1-4"}]}, {"@type": "HowToSection", "name": "Storing the Cake:", "itemListElement": [{"@type": "HowToStep", "text": "The frosted carrot cake can be stored in the refrigerator for up to one week, covered with plastic wrap or in a cake keeper. Avoid freezing the frosted cake, as the frosting may not thaw well.", "name": "The frosted carrot cake can be stored in the refrigerator for up to one week, covered with plastic wrap or in a cake keeper. Avoid freezing the frosted cake, as the frosting may not thaw well.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-2-0"}, {"@type": "HowToStep", "text": "Unfrosted cake layers can be refrigerated for up to five days or frozen for up to three months. If frozen, thaw in the refrigerator overnight before frosting.", "name": "Unfrosted cake layers can be refrigerated for up to five days or frozen for up to three months. If frozen, thaw in the refrigerator overnight before frosting.", "url": "https://erecip.github.io/en/carrot-cake-recipe/#wprm-recipe-549-step-2-1"}]}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "BEST HOMEMADE CARROT CAKE RECIPE"}</script>
