    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Baked Mac and Cheese", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, creamy vegan baked macaroni and cheese made with gluten-free elbow pasta, a smooth dairy-free cheese sauce, and a generous layer of vegan cheddar. The dish may also be served directly from the stovetop before baking.", "datePublished": "2019-06-02T17:23:14+00:00", "image": ["https://erecip.github.io/en/baked-mac-and-cheese/baked-mac-and-cheese1.png", "https://erecip.github.io/en/baked-mac-and-cheese/baked-mac-and-cheese1.png", "https://erecip.github.io/en/baked-mac-and-cheese/baked-mac-and-cheese1.png"], "cookTime": "PT25M", "totalTime": "PT25M", "recipeIngredient": ["12  –16 oz gluten-free elbow macaroni", "A small pinch of salt", "6  –8 cups water", "1 tsp garlic powder", "2 tbsp plant-based butter", "1/4 tsp salt", "12 oz soft silken tofu", "1 tsp onion powder", "3 cups almond milk", "1/4 tsp ground black pepper", "6 tbsp chickpea flour (or another preferred flour)", "4 cups shredded vegan cheese", "1/2 cup dairy-free cream cheese spread", "1/4 tsp turmeric (optional, for color)", "2  vegetable bouillon cubes (or 1 tbsp vegetable base)", "1/2 cup vegan butter", "1 tsp garlic powder", "1/2 tsp sea salt", "1  14 oz can unsweetened coconut milk, preferably full-fat for added richness", "1/4 tsp liquid smoke (optional, or 1/2 tsp smoked paprika)", "1 tsp vegan butter (for greasing the baking dish)", "2 cups shredded vegan cheddar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Cook the gluten-free macaroni. Bring 6–8 cups of water to a rolling boil over high heat with a small pinch of salt. Add the gluten-free elbow macaroni and prepare it according to the package directions until al dente.", "name": "Cook the gluten-free macaroni. Bring 6–8 cups of water to a rolling boil over high heat with a small pinch of salt. Add the gluten-free elbow macaroni and prepare it according to the package directions until al dente.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-0"}, {"@type": "HowToStep", "text": "Drain the cooked macaroni thoroughly, then place it in a large mixing bowl.", "name": "Drain the cooked macaroni thoroughly, then place it in a large mixing bowl.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-1"}, {"@type": "HowToStep", "text": "Season the pasta. While the drained macaroni is still warm, add 2 tablespoons plant-based butter, 1 teaspoon garlic powder, and 1/4 teaspoon salt.", "name": "Season the pasta. While the drained macaroni is still warm, add 2 tablespoons plant-based butter, 1 teaspoon garlic powder, and 1/4 teaspoon salt.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-2"}, {"@type": "HowToStep", "text": "Toss until the butter and seasonings are distributed evenly over the pasta. Taste a piece and adjust only if necessary, then set the seasoned macaroni aside.", "name": "Toss until the butter and seasonings are distributed evenly over the pasta. Taste a piece and adjust only if necessary, then set the seasoned macaroni aside.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-3"}, {"@type": "HowToStep", "text": "Prepare the oven and baking dish. For the baked version, preheat the oven to 400°F (200°C).", "name": "Prepare the oven and baking dish. For the baked version, preheat the oven to 400°F (200°C).", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-4"}, {"@type": "HowToStep", "text": "Coat a 9 × 13-inch baking dish lightly with 1 teaspoon vegan butter and reserve it for assembly. This step may be omitted when serving the macaroni and cheese directly from the stovetop.", "name": "Coat a 9 × 13-inch baking dish lightly with 1 teaspoon vegan butter and reserve it for assembly. This step may be omitted when serving the macaroni and cheese directly from the stovetop.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-5"}, {"@type": "HowToStep", "text": "Prepare the creamy vegan cheese sauce. Using the same pot in which the pasta was cooked, melt 1/2 cup vegan butter completely over medium heat.", "name": "Prepare the creamy vegan cheese sauce. Using the same pot in which the pasta was cooked, melt 1/2 cup vegan butter completely over medium heat.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-6"}, {"@type": "HowToStep", "text": "Stir in the 6 tablespoons chickpea flour and mix vigorously until a smooth roux forms.", "name": "Stir in the 6 tablespoons chickpea flour and mix vigorously until a smooth roux forms.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-7"}, {"@type": "HowToStep", "text": "Slowly add the coconut milk and almond milk while whisking continuously to eliminate lumps.", "name": "Slowly add the coconut milk and almond milk while whisking continuously to eliminate lumps.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-8"}, {"@type": "HowToStep", "text": "Continue whisking over medium heat for approximately 7–10 minutes, until the mixture begins to thicken.", "name": "Continue whisking over medium heat for approximately 7–10 minutes, until the mixture begins to thicken.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-9"}, {"@type": "HowToStep", "text": "Add the vegetable bouillon, dairy-free cream cheese, silken tofu, 1 teaspoon garlic powder, onion powder, sea salt, black pepper, optional turmeric, optional liquid smoke or smoked paprika, and 4 cups shredded vegan cheese.", "name": "Add the vegetable bouillon, dairy-free cream cheese, silken tofu, 1 teaspoon garlic powder, onion powder, sea salt, black pepper, optional turmeric, optional liquid smoke or smoked paprika, and 4 cups shredded vegan cheese.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-10"}, {"@type": "HowToStep", "text": "Stir continuously over medium heat for approximately 5 minutes, or until the cheese has melted and the sauce is smooth, creamy, and thickened. Taste and adjust the seasoning if required.", "name": "Stir continuously over medium heat for approximately 5 minutes, or until the cheese has melted and the sauce is smooth, creamy, and thickened. Taste and adjust the seasoning if required.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-11"}, {"@type": "HowToStep", "text": "Combine the pasta and sauce. Remove the finished cheese sauce from the heat.", "name": "Combine the pasta and sauce. Remove the finished cheese sauce from the heat.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the seasoned macaroni into the pot of cheese sauce and fold gently until every piece is thoroughly coated.", "name": "Transfer the seasoned macaroni into the pot of cheese sauce and fold gently until every piece is thoroughly coated.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-13"}, {"@type": "HowToStep", "text": "The macaroni and cheese may be served at this stage as a stovetop dish, or it may be baked as directed below.", "name": "The macaroni and cheese may be served at this stage as a stovetop dish, or it may be baked as directed below.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-14"}, {"@type": "HowToStep", "text": "Assemble and bake. Spoon the macaroni and cheese mixture evenly into the prepared 9 × 13-inch baking dish.", "name": "Assemble and bake. Spoon the macaroni and cheese mixture evenly into the prepared 9 × 13-inch baking dish.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-15"}, {"@type": "HowToStep", "text": "Distribute 2 cups of shredded vegan cheddar evenly across the surface. Cover the baking dish with aluminum foil and bake for 10 minutes.", "name": "Distribute 2 cups of shredded vegan cheddar evenly across the surface. Cover the baking dish with aluminum foil and bake for 10 minutes.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-16"}, {"@type": "HowToStep", "text": "Remove the foil and continue baking for another 15 minutes, until the top is bubbling and golden brown. If desired, a small amount of additional smoked paprika may be sprinkled over the surface before baking.", "name": "Remove the foil and continue baking for another 15 minutes, until the top is bubbling and golden brown. If desired, a small amount of additional smoked paprika may be sprinkled over the surface before baking.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-17"}, {"@type": "HowToStep", "text": "Cool and serve. Remove the baked macaroni and cheese from the oven and allow it to stand for several minutes. This brief resting period allows the cheese to settle and the baked topping to set.", "name": "Cool and serve. Remove the baked macaroni and cheese from the oven and allow it to stand for several minutes. This brief resting period allows the cheese to settle and the baked topping to set.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-18"}, {"@type": "HowToStep", "text": "Serve warm as either a main course or a side dish.", "name": "Serve warm as either a main course or a side dish.", "url": "https://erecip.github.io/en/baked-mac-and-cheese/#wprm-recipe-44837-step-0-19"}], "recipeCategory": ["Main Course", "Side Dish"], "keywords": "Baked Mac and Cheese"}</script>
