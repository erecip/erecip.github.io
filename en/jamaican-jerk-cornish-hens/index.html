    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Jamaican Jerk Cornish Hens", "author": {"@type": "Person", "name": "BenDes"}, "description": "Jamaican Jerk Cornish Hens are coated with robust Jamaican jerk seasoning, filled with fresh herbs, garlic, and lemon, then roasted until richly browned and tender. A warm lemon-herb butter sauce is brushed over the hens during the final stage of roasting and again before resting, adding brightness and a savory finish.", "datePublished": "2023-08-06T19:47:56+00:00", "image": ["https://erecip.github.io/en/jamaican-jerk-cornish-hens/jamaican-jerk-cornish-hens2.png", "https://erecip.github.io/en/jamaican-jerk-cornish-hens/jamaican-jerk-cornish-hens2.png", "https://erecip.github.io/en/jamaican-jerk-cornish-hens/jamaican-jerk-cornish-hens2.png", "https://erecip.github.io/en/jamaican-jerk-cornish-hens/jamaican-jerk-cornish-hens2.png"], "cookTime": "PT80M", "totalTime": "PT90M", "recipeIngredient": ["6  fresh thyme sprigs", "2  whole Cornish hens (approximately 2 to 2 1/2 pounds each, cavities cleaned)", "4  garlic cloves (gently smashed)", "Olive oil (as needed for drizzling)", "1 tablespoon herbes de Provence", "4  slender slices of fresh lemon", "Kosher salt and freshly ground black pepper (according to taste)", "10 ounces Walkerswood Jamaican jerk seasoning (medium or hot according to preference)", "6  fresh sage leaves", "2  garlic cloves (finely minced)", "6 tablespoons unsalted butter", "1 tablespoon dried parsley", "1  small shallot (finely chopped)", "Kosher salt and freshly ground black pepper (to taste)", "1  small lemon (both zest and juice)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Position an oven rack in the center and preheat the oven to 400°F (200°C).", "name": "Position an oven rack in the center and preheat the oven to 400°F (200°C).", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-0"}, {"@type": "HowToStep", "text": "Place a wire rack inside a quarter-sheet pan or another suitable roasting pan. Lightly coat the rack with cooking spray to reduce sticking and allow heat to circulate beneath the hens during roasting.", "name": "Place a wire rack inside a quarter-sheet pan or another suitable roasting pan. Lightly coat the rack with cooking spray to reduce sticking and allow heat to circulate beneath the hens during roasting.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-1"}, {"@type": "HowToStep", "text": "Blot the Cornish hens thoroughly with paper towels until the exterior surfaces are dry.", "name": "Blot the Cornish hens thoroughly with paper towels until the exterior surfaces are dry.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-2"}, {"@type": "HowToStep", "text": "Combine the herbes de Provence with kosher salt and freshly ground black pepper in a small bowl. Stir until the seasonings are evenly blended.", "name": "Combine the herbes de Provence with kosher salt and freshly ground black pepper in a small bowl. Stir until the seasonings are evenly blended.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-3"}, {"@type": "HowToStep", "text": "Sprinkle a portion of the herb mixture inside the cavity of each hen.", "name": "Sprinkle a portion of the herb mixture inside the cavity of each hen.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-4"}, {"@type": "HowToStep", "text": "Fill each hen with 3 thyme sprigs, 3 sage leaves, 2 smashed garlic cloves, and 2 thin lemon slices.", "name": "Fill each hen with 3 thyme sprigs, 3 sage leaves, 2 smashed garlic cloves, and 2 thin lemon slices.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-5"}, {"@type": "HowToStep", "text": "Drizzle olive oil generously over the exterior of both hens.", "name": "Drizzle olive oil generously over the exterior of both hens.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-6"}, {"@type": "HowToStep", "text": "Distribute the remaining herbes de Provence mixture over the outside, seasoning the birds evenly.", "name": "Distribute the remaining herbes de Provence mixture over the outside, seasoning the birds evenly.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-7"}, {"@type": "HowToStep", "text": "Rub approximately 1/2 cup of the Walkerswood Jamaican jerk seasoning thoroughly over both hens, working it across the entire surface and into the creases. Additional jerk seasoning may be used for a stronger coating.", "name": "Rub approximately 1/2 cup of the Walkerswood Jamaican jerk seasoning thoroughly over both hens, working it across the entire surface and into the creases. Additional jerk seasoning may be used for a stronger coating.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-8"}, {"@type": "HowToStep", "text": "Tie the legs together with kitchen twine and tuck the wing tips into the area beside the legs.", "name": "Tie the legs together with kitchen twine and tuck the wing tips into the area beside the legs.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the seasoned hens to the prepared wire rack.", "name": "Transfer the seasoned hens to the prepared wire rack.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-10"}, {"@type": "HowToStep", "text": "Place the hens in the preheated oven and roast them uncovered for 1 hour.", "name": "Place the hens in the preheated oven and roast them uncovered for 1 hour.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-11"}, {"@type": "HowToStep", "text": "Approximately 10 minutes before the first hour of roasting is complete, begin preparing the lemon-herb basting sauce.", "name": "Approximately 10 minutes before the first hour of roasting is complete, begin preparing the lemon-herb basting sauce.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-12"}, {"@type": "HowToStep", "text": "Melt the unsalted butter in a small saucepan over medium heat.", "name": "Melt the unsalted butter in a small saucepan over medium heat.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-13"}, {"@type": "HowToStep", "text": "Add the lemon zest, lemon juice, finely chopped shallot, dried parsley, minced garlic, kosher salt, and freshly ground black pepper.", "name": "Add the lemon zest, lemon juice, finely chopped shallot, dried parsley, minced garlic, kosher salt, and freshly ground black pepper.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-14"}, {"@type": "HowToStep", "text": "Allow the mixture to simmer gently for 2 to 3 minutes, giving the ingredients time to combine and release their flavors.", "name": "Allow the mixture to simmer gently for 2 to 3 minutes, giving the ingredients time to combine and release their flavors.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-15"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat and keep the sauce nearby for basting.", "name": "Remove the saucepan from the heat and keep the sauce nearby for basting.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-16"}, {"@type": "HowToStep", "text": "After the hens have roasted for 1 hour, remove the pan from the oven while leaving the oven switched on.", "name": "After the hens have roasted for 1 hour, remove the pan from the oven while leaving the oven switched on.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-17"}, {"@type": "HowToStep", "text": "Brush approximately half of the warm lemon-herb butter sauce generously over the hens.", "name": "Brush approximately half of the warm lemon-herb butter sauce generously over the hens.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-18"}, {"@type": "HowToStep", "text": "Return them to the oven and continue roasting for another 20 minutes, or until an instant-read thermometer inserted into the thickest portion of a thigh registers at least 165°F (74°C).", "name": "Return them to the oven and continue roasting for another 20 minutes, or until an instant-read thermometer inserted into the thickest portion of a thigh registers at least 165°F (74°C).", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-19"}, {"@type": "HowToStep", "text": "Remove the fully cooked hens from the oven and brush them thoroughly with the remaining lemon-herb sauce.", "name": "Remove the fully cooked hens from the oven and brush them thoroughly with the remaining lemon-herb sauce.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-20"}, {"@type": "HowToStep", "text": "Allow the hens to rest for a minimum of 10 minutes before carving.", "name": "Allow the hens to rest for a minimum of 10 minutes before carving.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-21"}, {"@type": "HowToStep", "text": "Using a sharp knife or sturdy kitchen shears, cut each rested Cornish hen in half.", "name": "Using a sharp knife or sturdy kitchen shears, cut each rested Cornish hen in half.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-22"}, {"@type": "HowToStep", "text": "Serve the hens while warm.", "name": "Serve the hens while warm.", "url": "https://erecip.github.io/en/jamaican-jerk-cornish-hens/#wprm-recipe-42383-step-0-23"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Jamaican"], "keywords": "Jamaican Jerk Cornish Hens"}</script>
