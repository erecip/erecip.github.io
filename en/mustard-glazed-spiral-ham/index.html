    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mustard Glazed Spiral Ham", "author": {"@type": "Person", "name": "BenDes"}, "description": "This oven-warmed spiral ham is finished with a rich honey-Dijon glaze made with brown sugar, butter, and freshly ground black pepper. Gentle covered roasting keeps the meat moist, while a brief burst of high heat caramelizes the glaze into a glossy, sweet-and-tangy coating.", "datePublished": "2018-04-19T19:28:46+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/mustard-glazed-spiral-ham.png", "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/mustard-glazed-spiral-ham.png", "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/mustard-glazed-spiral-ham.png", "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/mustard-glazed-spiral-ham.png"], "prepTime": "PT15M", "cookTime": "PT85M", "totalTime": "PT105M", "recipeIngredient": ["1 cup water", "1  fully cooked (bone-in spiral-cut ham, weighing 8–10 lb)", "1/2 cup honey", "2  –3 tablespoons Dijon mustard", "4 tablespoons unsalted butter", "1/2 teaspoon freshly ground black pepper", "1/2 cup firmly packed brown sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Take the fully cooked spiral ham out of the refrigerator approximately 1 hour before it goes into the oven, but do not leave it at room temperature for more than 2 hours. Allowing some of the chill to dissipate promotes more even heating.", "name": "Take the fully cooked spiral ham out of the refrigerator approximately 1 hour before it goes into the oven, but do not leave it at room temperature for more than 2 hours. Allowing some of the chill to dissipate promotes more even heating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-0"}, {"@type": "HowToStep", "text": "If desired, lightly score the exterior of the ham with a sharp knife in a diamond-shaped pattern.", "name": "If desired, lightly score the exterior of the ham with a sharp knife in a diamond-shaped pattern.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-1"}, {"@type": "HowToStep", "text": "Position an oven rack in the lower third of the oven so the ham will sit near the center while roasting. Preheat the oven to 325°F (163°C).", "name": "Position an oven rack in the lower third of the oven so the ham will sit near the center while roasting. Preheat the oven to 325°F (163°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-2"}, {"@type": "HowToStep", "text": "Remove all wrapping and packaging from the ham. Set it cut-side down in a large roasting pan, or use a 9×13-inch baking pan if the ham fits comfortably.", "name": "Remove all wrapping and packaging from the ham. Set it cut-side down in a large roasting pan, or use a 9×13-inch baking pan if the ham fits comfortably.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-3"}, {"@type": "HowToStep", "text": "Add 1 cup of water to the bottom of the pan. Seal the pan securely with aluminum foil, overlapping two sheets when necessary to create a tight covering.", "name": "Add 1 cup of water to the bottom of the pan. Seal the pan securely with aluminum foil, overlapping two sheets when necessary to create a tight covering.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-4"}, {"@type": "HowToStep", "text": "Bake the covered ham at 325°F for approximately 10–12 minutes per pound, stopping when roughly 30 minutes of the calculated baking time remain.", "name": "Bake the covered ham at 325°F for approximately 10–12 minutes per pound, stopping when roughly 30 minutes of the calculated baking time remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-5"}, {"@type": "HowToStep", "text": "For an 8-pound ham, bake for about 50 minutes before proceeding to the glazing stage. A 9-pound ham will require approximately 1 hour, while a 10-pound ham will need about 1 hour and 10 minutes at this stage.", "name": "For an 8-pound ham, bake for about 50 minutes before proceeding to the glazing stage. A 9-pound ham will require approximately 1 hour, while a 10-pound ham will need about 1 hour and 10 minutes at this stage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-6"}, {"@type": "HowToStep", "text": "Keeping the ham covered during this gradual heating period helps retain moisture and reduces the likelihood of drying.", "name": "Keeping the ham covered during this gradual heating period helps retain moisture and reduces the likelihood of drying.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-7"}, {"@type": "HowToStep", "text": "While the ham is warming, melt the butter in a small saucepan over medium heat.", "name": "While the ham is warming, melt the butter in a small saucepan over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-8"}, {"@type": "HowToStep", "text": "Stir in the firmly packed brown sugar, honey, Dijon mustard, and freshly ground black pepper. Continue stirring only until the brown sugar has completely dissolved.", "name": "Stir in the firmly packed brown sugar, honey, Dijon mustard, and freshly ground black pepper. Continue stirring only until the brown sugar has completely dissolved.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-9"}, {"@type": "HowToStep", "text": "Do not allow the mixture to simmer or boil, as excessive heating can cause the glaze to become overly firm as it cools.", "name": "Do not allow the mixture to simmer or boil, as excessive heating can cause the glaze to become overly firm as it cools.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-10"}, {"@type": "HowToStep", "text": "Remove the prepared glaze from the heat and set it aside, or hold it over very low warmth until needed.", "name": "Remove the prepared glaze from the heat and set it aside, or hold it over very low warmth until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-11"}, {"@type": "HowToStep", "text": "When approximately 30 minutes of baking time remain, carefully take the ham from the oven and remove the foil.", "name": "When approximately 30 minutes of baking time remain, carefully take the ham from the oven and remove the foil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-12"}, {"@type": "HowToStep", "text": "Brush about one-third of the honey-mustard glaze generously over the ham, working some of it between the individual spiral-cut slices.", "name": "Brush about one-third of the honey-mustard glaze generously over the ham, working some of it between the individual spiral-cut slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-13"}, {"@type": "HowToStep", "text": "Cover the roasting pan again with foil and return the ham to the 325°F oven for another 30 minutes.", "name": "Cover the roasting pan again with foil and return the ham to the 325°F oven for another 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-14"}, {"@type": "HowToStep", "text": "After this period, check the internal temperature in the center of the ham without allowing the thermometer to touch the bone. The ham should register 145°F.", "name": "After this period, check the internal temperature in the center of the ham without allowing the thermometer to touch the bone. The ham should register 145°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-15"}, {"@type": "HowToStep", "text": "If it has not yet reached the required temperature, keep it covered and continue heating in additional 10–15-minute intervals, checking again after each interval.", "name": "If it has not yet reached the required temperature, keep it covered and continue heating in additional 10–15-minute intervals, checking again after each interval.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-16"}, {"@type": "HowToStep", "text": "Once the ham has reached 145°F internally, remove it from the oven and uncover it.", "name": "Once the ham has reached 145°F internally, remove it from the oven and uncover it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-17"}, {"@type": "HowToStep", "text": "Brush another one-third of the glaze generously over the surface, again allowing some of the mixture to settle between the spiral slices.", "name": "Brush another one-third of the glaze generously over the surface, again allowing some of the mixture to settle between the spiral slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-18"}, {"@type": "HowToStep", "text": "Raise the oven temperature to 425°F (218°C). Return the ham to the oven without the foil and bake for 5–10 minutes, just until the exterior becomes glossy and the glaze caramelizes.", "name": "Raise the oven temperature to 425°F (218°C). Return the ham to the oven without the foil and bake for 5–10 minutes, just until the exterior becomes glossy and the glaze caramelizes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-19"}, {"@type": "HowToStep", "text": "Remove the caramelized ham from the oven. Using a pastry brush, collect a few tablespoons of the flavorful liquid from the roasting pan and stir it into the remaining glaze to loosen its consistency.", "name": "Remove the caramelized ham from the oven. Using a pastry brush, collect a few tablespoons of the flavorful liquid from the roasting pan and stir it into the remaining glaze to loosen its consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-20"}, {"@type": "HowToStep", "text": "Brush the sides of the ham with this thinned glaze if desired, or reserve it for serving alongside the sliced meat.", "name": "Brush the sides of the ham with this thinned glaze if desired, or reserve it for serving alongside the sliced meat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-21"}, {"@type": "HowToStep", "text": "Allow the ham to rest for approximately 5 minutes before slicing and serving warm.", "name": "Allow the ham to rest for approximately 5 minutes before slicing and serving warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mustard-glazed-spiral-ham/#wprm-recipe-45723-step-0-22"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Mustard Glazed Spiral Ham"}</script>
