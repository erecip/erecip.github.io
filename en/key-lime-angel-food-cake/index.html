.io/easy-recipes323/en/key-lime-angel-food-cake/#wprm-recipe-43369-step-0-9"}, {"@type": "HowToStep", "text": "Place the chilled heavy cream, 1 tablespoon sugar, and ½ teaspoon grated lime zest in a large mixing bowl.", "name": "Place the chilled heavy cream, 1 tablespoon sugar, and ½ teaspoon grated lime zest in a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/key-lime-angel-food-cake/#wprm-recipe-43369-step-0-10"}, {"@type": "HowToStep", "text": "Beat with an electric mixer on high speed for 3–4 minutes, or until the cream becomes thick and forms stiff peaks.", "name": "Beat with an electric mixer on high speed for 3–4 minutes, or until the cream becomes thick and forms stiff peaks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/key-lime-angel-food-cake/#wprm-recipe-43369-step-0-11"}], "recipeCategory": ["cake", "Dessert"], "recipeCuisine": ["American"], "keywords": "Key Lime Angel Food Cake"}</script>
