    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chocolate Pumpkin Patch Dirt Cups", "author": {"@type": "Person", "name": "BenDes"}, "description": "Chocolate Pumpkin Patch Dirt Cups are a festive layered dessert featuring rich chocolate pudding, airy whipped topping, and finely crushed chocolate sandwich cookies. Green-tinted coconut creates a playful grassy effect, while candy pumpkins complete the autumn-inspired presentation.", "datePublished": "2019-01-21T21:02:29+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/chocolate-pumpkin-patch-dirt-cups1.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/chocolate-pumpkin-patch-dirt-cups1.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/chocolate-pumpkin-patch-dirt-cups1.png", "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/chocolate-pumpkin-patch-dirt-cups1.png"], "totalTime": "PT5M", "recipeIngredient": ["1  package (3.9 oz instant chocolate pudding mix)", "8 oz frozen whipped topping (fully thawed)", "1  standard package chocolate sandwich cookies (finely reduced to crumbs)", "2 cups milk (preferably whole milk for a fuller, creamier texture)", "Green food coloring (as needed)", "Shredded or flaked coconut (as needed)", "Candy pumpkins (for decorating)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Process the chocolate sandwich cookies in a food processor until they become fine crumbs. Alternatively, place the cookies inside a sealed gallon-size zip-top bag and crush them thoroughly with a rolling pin. Reserve the crumbs for assembling the dessert layers.", "name": "Process the chocolate sandwich cookies in a food processor until they become fine crumbs. Alternatively, place the cookies inside a sealed gallon-size zip-top bag and crush them thoroughly with a rolling pin. Reserve the crumbs for assembling the dessert layers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/#wprm-recipe-45130-step-0-0"}, {"@type": "HowToStep", "text": "Pour the milk into a medium mixing bowl and add the instant chocolate pudding mix. Whisk vigorously for 2 minutes, following the preparation directions on the pudding package. Leave the mixture undisturbed for 5 minutes so it can thicken and set.", "name": "Pour the milk into a medium mixing bowl and add the instant chocolate pudding mix. Whisk vigorously for 2 minutes, following the preparation directions on the pudding package. Leave the mixture undisturbed for 5 minutes so it can thicken and set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/#wprm-recipe-45130-step-0-1"}, {"@type": "HowToStep", "text": "Add the thawed whipped topping to the prepared chocolate pudding. Fold the two together gently until evenly incorporated and light in texture, taking care not to overmix so the filling remains fluffy and creamy.", "name": "Add the thawed whipped topping to the prepared chocolate pudding. Fold the two together gently until evenly incorporated and light in texture, taking care not to overmix so the filling remains fluffy and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/#wprm-recipe-45130-step-0-2"}, {"@type": "HowToStep", "text": "Spoon approximately 1 tablespoon of the crushed chocolate cookies into the bottom of each serving cup. Add a layer of the chocolate pudding mixture over the crumbs.", "name": "Spoon approximately 1 tablespoon of the crushed chocolate cookies into the bottom of each serving cup. Add a layer of the chocolate pudding mixture over the crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/#wprm-recipe-45130-step-0-3"}, {"@type": "HowToStep", "text": "Continue alternating layers of cookie crumbs and pudding filling in each cup. Finish every serving with a final covering of finely crushed cookies to create the appearance of dark garden soil.", "name": "Continue alternating layers of cookie crumbs and pudding filling in each cup. Finish every serving with a final covering of finely crushed cookies to create the appearance of dark garden soil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/#wprm-recipe-45130-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the assembled dessert cups to the refrigerator and chill them for at least 1 hour. This resting period allows the layers to firm slightly and the flavors to blend while making the cups easier to serve.", "name": "Transfer the assembled dessert cups to the refrigerator and chill them for at least 1 hour. This resting period allows the layers to firm slightly and the flavors to blend while making the cups easier to serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/#wprm-recipe-45130-step-0-5"}, {"@type": "HowToStep", "text": "Place the shredded coconut in a container fitted with a lid. Add several drops of green food coloring along with a small amount of water. Secure the lid and shake the container until the coconut is evenly tinted green and resembles grass.", "name": "Place the shredded coconut in a container fitted with a lid. Add several drops of green food coloring along with a small amount of water. Secure the lid and shake the container until the coconut is evenly tinted green and resembles grass.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/#wprm-recipe-45130-step-0-6"}, {"@type": "HowToStep", "text": "Immediately before serving, scatter some of the green-colored coconut over the chilled cookie-crumb surface of each cup. Finish each dessert with a candy pumpkin to create the pumpkin-patch appearance.", "name": "Immediately before serving, scatter some of the green-colored coconut over the chilled cookie-crumb surface of each cup. Finish each dessert with a candy pumpkin to create the pumpkin-patch appearance.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chocolate-pumpkin-patch-dirt-cups/#wprm-recipe-45130-step-0-7"}], "recipeCategory": ["Dessert"], "keywords": "Chocolate Pumpkin Patch Dirt Cups"}</script>
