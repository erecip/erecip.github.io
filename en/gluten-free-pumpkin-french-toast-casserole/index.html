"name": "Stir until the ingredients come together into a coarse, crumbly mixture. Distribute the pecan topping gently and evenly over the surface of the casserole.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-pumpkin-french-toast-casserole/#wprm-recipe-41622-step-0-8"}, {"@type": "HowToStep", "text": "Place the baking dish on the center rack of the preheated 350°F oven.", "name": "Place the baking dish on the center rack of the preheated 350°F oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-pumpkin-french-toast-casserole/#wprm-recipe-41622-step-0-9"}, {"@type": "HowToStep", "text": "Bake for approximately 1 hour. The casserole is finished when it is firm, begins to pull slightly away from the sides of the baking dish, and a toothpick inserted into the center comes out clean. Because oven temperatures can vary, monitor the casserole as it approaches the end of the baking period.", "name": "Bake for approximately 1 hour. The casserole is finished when it is firm, begins to pull slightly away from the sides of the baking dish, and a toothpick inserted into the center comes out clean. Because oven temperatures can vary, monitor the casserole as it approaches the end of the baking period.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-pumpkin-french-toast-casserole/#wprm-recipe-41622-step-0-10"}, {"@type": "HowToStep", "text": "Allow the baked casserole to cool for a few minutes.", "name": "Allow the baked casserole to cool for a few minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-pumpkin-french-toast-casserole/#wprm-recipe-41622-step-0-11"}, {"@type": "HowToStep", "text": "Meanwhile, combine the powdered sugar, vanilla extract, milk, and maple syrup in a small bowl. Stir until the glaze is smooth and has a pourable consistency.", "name": "Meanwhile, combine the powdered sugar, vanilla extract, milk, and maple syrup in a small bowl. Stir until the glaze is smooth and has a pourable consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-pumpkin-french-toast-casserole/#wprm-recipe-41622-step-0-12"}, {"@type": "HowToStep", "text": "Drizzle the maple glaze evenly over the slightly cooled casserole before serving.", "name": "Drizzle the maple glaze evenly over the slightly cooled casserole before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-pumpkin-french-toast-casserole/#wprm-recipe-41622-step-0-13"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Gluten-Free Pumpkin French Toast Casserole"}</script>
