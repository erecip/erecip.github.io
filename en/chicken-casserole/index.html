    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty chicken and broccoli casserole featuring tender roasted chicken, crisp-tender broccoli, cauliflower rice, and a savory herb-infused coconut milk sauce. A layer of crisp bacon finishes the dish with rich, smoky flavor.", "datePublished": "2020-04-15T03:39:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/chicken-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/chicken-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/chicken-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/chicken-casserole.png"], "totalTime": "PT60M", "recipeIngredient": ["1 lb boneless (skinless chicken breast, cut into roughly 1-inch pieces)", "1 lb fresh broccoli florets", "3 tbsp avocado oil", "Salt and black pepper (as needed for seasoning)", "12 oz cauliflower rice", "1¾ cups chicken broth", "4  fresh garlic cloves (finely minced)", "3 tbsp ghee (melted)", "1  medium onion (finely chopped)", "½ cup unsweetened full-fat coconut milk", "2 tbsp tapioca flour", "2 tbsp nutritional yeast", "1 tbsp spicy brown mustard", "1 tbsp finely minced fresh rosemary", "1 tsp finely minced fresh sage", "¼ tsp sea salt", "⅛ tsp freshly ground black pepper", "½ lb nitrate-free bacon (cooked until crisp and crumbled)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 425°F.", "name": "Preheat the oven to 425°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-0"}, {"@type": "HowToStep", "text": "Arrange the chicken pieces on a baking sheet. Coat them with 1½ tablespoons of oil, then season with salt and pepper.", "name": "Arrange the chicken pieces on a baking sheet. Coat them with 1½ tablespoons of oil, then season with salt and pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-1"}, {"@type": "HowToStep", "text": "Line a separate baking sheet with parchment paper and spread the broccoli florets over it. Toss the broccoli with 1½ tablespoons of avocado oil, then season with salt and pepper.", "name": "Line a separate baking sheet with parchment paper and spread the broccoli florets over it. Toss the broccoli with 1½ tablespoons of avocado oil, then season with salt and pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-2"}, {"@type": "HowToStep", "text": "Roast the chicken for 20–25 minutes, turning the pieces halfway through so they cook evenly and are fully done.", "name": "Roast the chicken for 20–25 minutes, turning the pieces halfway through so they cook evenly and are fully done.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-3"}, {"@type": "HowToStep", "text": "At the same time, roast the broccoli for 15–20 minutes, stirring midway through cooking, until the florets are tender when pierced with a fork.", "name": "At the same time, roast the broccoli for 15–20 minutes, stirring midway through cooking, until the florets are tender when pierced with a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-4"}, {"@type": "HowToStep", "text": "After roasting, reduce the oven temperature to 400°F.", "name": "After roasting, reduce the oven temperature to 400°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-5"}, {"@type": "HowToStep", "text": "While the chicken and broccoli cook, place the bacon in a large skillet and cook until crisp. Transfer it to paper towels to drain, then reserve it for the topping.", "name": "While the chicken and broccoli cook, place the bacon in a large skillet and cook until crisp. Transfer it to paper towels to drain, then reserve it for the topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-6"}, {"@type": "HowToStep", "text": "To prepare the sauce, warm a medium saucepan over medium heat and add the 3 tablespoons of ghee.", "name": "To prepare the sauce, warm a medium saucepan over medium heat and add the 3 tablespoons of ghee.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-7"}, {"@type": "HowToStep", "text": "Add the finely diced onion and cook until translucent and aromatic. Stir in the minced garlic and continue cooking until softened, lowering the heat when necessary to prevent scorching.", "name": "Add the finely diced onion and cook until translucent and aromatic. Stir in the minced garlic and continue cooking until softened, lowering the heat when necessary to prevent scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-8"}, {"@type": "HowToStep", "text": "Whisk the tapioca flour thoroughly into the chicken broth. Pour this mixture into the saucepan.", "name": "Whisk the tapioca flour thoroughly into the chicken broth. Pour this mixture into the saucepan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-9"}, {"@type": "HowToStep", "text": "Immediately whisk in the coconut milk, spicy brown mustard, and nutritional yeast.", "name": "Immediately whisk in the coconut milk, spicy brown mustard, and nutritional yeast.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-10"}, {"@type": "HowToStep", "text": "Increase the heat and bring the sauce to a boil while stirring continuously.", "name": "Increase the heat and bring the sauce to a boil while stirring continuously.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-11"}, {"@type": "HowToStep", "text": "Once boiling, reduce the heat to a gentle simmer. Continue stirring and cooking for approximately 1 minute, or until the sauce noticeably thickens.", "name": "Once boiling, reduce the heat to a gentle simmer. Continue stirring and cooking for approximately 1 minute, or until the sauce noticeably thickens.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-12"}, {"@type": "HowToStep", "text": "Season with the sea salt and black pepper, then mix in the rosemary and sage.", "name": "Season with the sea salt and black pepper, then mix in the rosemary and sage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-13"}, {"@type": "HowToStep", "text": "Stir the cauliflower rice into the sauce and allow it to begin softening. Remove the saucepan from the heat.", "name": "Stir the cauliflower rice into the sauce and allow it to begin softening. Remove the saucepan from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-14"}, {"@type": "HowToStep", "text": "Cut the roasted chicken into smaller bite-size portions if necessary, or shred it.", "name": "Cut the roasted chicken into smaller bite-size portions if necessary, or shred it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-15"}, {"@type": "HowToStep", "text": "Transfer the cooked chicken to a casserole dish. Add the roasted broccoli followed by the cauliflower rice and sauce mixture. Stir carefully until all ingredients are evenly coated and distributed.", "name": "Transfer the cooked chicken to a casserole dish. Add the roasted broccoli followed by the cauliflower rice and sauce mixture. Stir carefully until all ingredients are evenly coated and distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-16"}, {"@type": "HowToStep", "text": "Crumble the crisp bacon over the surface of the casserole.", "name": "Crumble the crisp bacon over the surface of the casserole.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-17"}, {"@type": "HowToStep", "text": "Bake uncovered at 400°F for approximately 20 minutes, until the casserole is thoroughly heated and the cauliflower rice has become tender.", "name": "Bake uncovered at 400°F for approximately 20 minutes, until the casserole is thoroughly heated and the cauliflower rice has become tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-18"}, {"@type": "HowToStep", "text": "Serve the chicken casserole hot.", "name": "Serve the chicken casserole hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-casserole/#wprm-recipe-45242-step-0-19"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["American"], "keywords": "Chicken Casserole"}</script>
