"Cream the shortening mixture. Fit a stand mixer with the paddle attachment. Add the butter-flavored shortening, granulated sugar, and vanilla extract, then beat at medium speed for a full 2 minutes, or until the mixture becomes light and fluffy.", "name": "Cream the shortening mixture. Fit a stand mixer with the paddle attachment. Add the butter-flavored shortening, granulated sugar, and vanilla extract, then beat at medium speed for a full 2 minutes, or until the mixture becomes light and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-1"}, {"@type": "HowToStep", "text": "Incorporate the eggs. Add the eggs individually, beating the mixture well after each one is added.", "name": "Incorporate the eggs. Add the eggs individually, beating the mixture well after each one is added.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-2"}, {"@type": "HowToStep", "text": "Add the flour mixture. Reduce the mixer to low speed. Gradually incorporate the prepared dry ingredients, approximately 1 cup at a time, continuing until the cookie dough is completely combined.", "name": "Add the flour mixture. Reduce the mixer to low speed. Gradually incorporate the prepared dry ingredients, approximately 1 cup at a time, continuing until the cookie dough is completely combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-3"}, {"@type": "HowToStep", "text": "Color the dough. Separate the dough into as many portions as desired according to the number of colors being used. Add gel food coloring to each portion and work it through the dough by hand or with the stand mixer until the color is evenly distributed.", "name": "Color the dough. Separate the dough into as many portions as desired according to the number of colors being used. Add gel food coloring to each portion and work it through the dough by hand or with the stand mixer until the color is evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-4"}, {"@type": "HowToStep", "text": "Chill the dough. Wrap each colored portion securely in plastic wrap and refrigerate for 1 hour.", "name": "Chill the dough. Wrap each colored portion securely in plastic wrap and refrigerate for 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-5"}, {"@type": "HowToStep", "text": "Prepare the oven and pans. While the dough chills, preheat the oven to 350°F. Line two or more baking sheets with parchment paper.", "name": "Prepare the oven and pans. While the dough chills, preheat the oven to 350°F. Line two or more baking sheets with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-6"}, {"@type": "HowToStep", "text": "Form the cookies. Once chilled, portion the dough into approximately ¼-cup-sized balls using a standard ice cream scoop or a comparable utensil. Roll each portion between your hands until smooth.", "name": "Form the cookies. Once chilled, portion the dough into approximately ¼-cup-sized balls using a standard ice cream scoop or a comparable utensil. Roll each portion between your hands until smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-7"}, {"@type": "HowToStep", "text": "Coat with sugar. Roll every dough ball in the cane sugar, then arrange 5 cookies per prepared baking sheet. Gently press each ball with the back of a measuring cup to flatten it slightly. Scatter a small additional amount of sugar over the tops.", "name": "Coat with sugar. Roll every dough ball in the cane sugar, then arrange 5 cookies per prepared baking sheet. Gently press each ball with the back of a measuring cup to flatten it slightly. Scatter a small additional amount of sugar over the tops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-8"}, {"@type": "HowToStep", "text": "Bake one sheet at a time. Place a single baking sheet in the preheated oven and bake for 12–14 minutes. The cookies are ready when they have spread and developed cracks across their surfaces but have not begun to brown.", "name": "Bake one sheet at a time. Place a single baking sheet in the preheated oven and bake for 12–14 minutes. The cookies are ready when they have spread and developed cracks across their surfaces but have not begun to brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-9"}, {"@type": "HowToStep", "text": "Cool the cookies. Leave the freshly baked cookies on the baking sheet for 5 minutes. Transfer them to a wire cooling rack and allow them to cool completely.", "name": "Cool the cookies. Leave the freshly baked cookies on the baking sheet for 5 minutes. Transfer them to a wire cooling rack and allow them to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-10"}, {"@type": "HowToStep", "text": "Finish the remaining batches. Continue shaping, coating, baking, and cooling the remaining dough in the same manner until all of the cookies are finished.", "name": "Finish the remaining batches. Continue shaping, coating, baking, and cooling the remaining dough in the same manner until all of the cookies are finished.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mexican-christmas-cookies-recipe/#wprm-recipe-43937-step-0-11"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["Mexican"], "keywords": "Mexican Christmas Cookies Recipe"}</script>
