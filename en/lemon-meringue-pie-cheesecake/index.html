    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Meringue Pie Cheesecake", "author": {"@type": "Person", "name": "BenDes"}, "description": "This layered dessert combines a buttery graham cracker base, a rich lemon-scented cheesecake, ribbons of homemade lemon curd, and a billowy vanilla meringue topping. A water-bath baking method and gradual cooling process produce a smooth, creamy texture, while the toasted meringue provides the classic finish of lemon meringue pie.", "datePublished": "2022-04-10T17:54:28+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/lemon-meringue-pie-cheesecake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/lemon-meringue-pie-cheesecake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/lemon-meringue-pie-cheesecake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/lemon-meringue-pie-cheesecake2.png"], "prepTime": "PT45M", "cookTime": "PT110M", "totalTime": "PT575M", "recipeIngredient": ["6 tablespoons salted butter (divided into small cubes)", "4  large eggs (brought to room temperature)", "Finely grated zest of 2 large lemons", "¾ cup plus 1 tablespoon freshly squeezed lemon juice (preferably from 4–5 lemons)", "½ teaspoon vanilla extract", "¾ cup plus 2 tablespoons granulated sugar", "Small pinch of salt", "½ cup plus 2 tablespoons salted butter (melted and allowed to cool slightly)", "3 cups finely ground graham cracker crumbs", "32 ounces full-fat cream cheese (softened to room temperature)", "⅓ cup plus 1 tablespoon lemon juice", "2 teaspoons vanilla extract", "Finely grated zest of 2 large lemons", "4  large eggs (at room temperature)", "¾ cup full-fat sour cream (at room temperature)", "1½ cups granulated sugar", "1 cup prepared and chilled lemon curd", "4  large egg whites (at room temperature, approximately 70°F)", "½ teaspoon cream of tartar", "2 teaspoons vanilla bean paste or vanilla extract", "⅛ teaspoon salt", "1 cup granulated sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the finely grated lemon zest and granulated sugar in a non-metal saucepan. Rub the zest into the sugar with your fingertips until the mixture becomes fragrant and the citrus oils have been released.", "name": "Place the finely grated lemon zest and granulated sugar in a non-metal saucepan. Rub the zest into the sugar with your fingertips until the mixture becomes fragrant and the citrus oils have been released.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-0"}, {"@type": "HowToStep", "text": "Beat the eggs in a separate small bowl, then set them aside. Position a fine-mesh strainer over a clean medium bowl.", "name": "Beat the eggs in a separate small bowl, then set them aside. Position a fine-mesh strainer over a clean medium bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-1"}, {"@type": "HowToStep", "text": "Add the lemon juice, beaten eggs, and salt to the zest-infused sugar. Whisk until the ingredients are thoroughly blended.", "name": "Add the lemon juice, beaten eggs, and salt to the zest-infused sugar. Whisk until the ingredients are thoroughly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-2"}, {"@type": "HowToStep", "text": "Set the saucepan over low heat and cook for approximately 10–14 minutes, whisking continuously. Continue until the curd reaches 175°F and is thick enough to leave a coating on the back of a spoon.", "name": "Set the saucepan over low heat and cook for approximately 10–14 minutes, whisking continuously. Continue until the curd reaches 175°F and is thick enough to leave a coating on the back of a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-3"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Pour the curd through the prepared strainer to eliminate any cooked egg particles or lumps.", "name": "Remove the saucepan from the heat. Pour the curd through the prepared strainer to eliminate any cooked egg particles or lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-4"}, {"@type": "HowToStep", "text": "Immediately add the vanilla extract and cubed salted butter. Whisk until the butter has melted completely and the curd is smooth.", "name": "Immediately add the vanilla extract and cubed salted butter. Whisk until the butter has melted completely and the curd is smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-5"}, {"@type": "HowToStep", "text": "Press plastic wrap directly against the surface to prevent a skin from forming. Refrigerate for at least 3 hours before using. The curd may be prepared up to 4 days in advance.", "name": "Press plastic wrap directly against the surface to prevent a skin from forming. Refrigerate for at least 3 hours before using. The curd may be prepared up to 4 days in advance.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-6"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F. Coat a 9-inch springform pan with nonstick cooking spray and confirm that the removable base is securely locked in place.", "name": "Preheat the oven to 350°F. Coat a 9-inch springform pan with nonstick cooking spray and confirm that the removable base is securely locked in place.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-7"}, {"@type": "HowToStep", "text": "Combine the graham cracker crumbs with the melted salted butter. Stir until the crumbs are evenly moistened and resemble damp sand.", "name": "Combine the graham cracker crumbs with the melted salted butter. Stir until the crumbs are evenly moistened and resemble damp sand.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the mixture to the prepared pan. Compress it firmly across the base and extend it slightly up the sides.", "name": "Transfer the mixture to the prepared pan. Compress it firmly across the base and extend it slightly up the sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-9"}, {"@type": "HowToStep", "text": "Bake for 10 minutes. Remove the crust from the oven and allow it to cool.", "name": "Bake for 10 minutes. Remove the crust from the oven and allow it to cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-10"}, {"@type": "HowToStep", "text": "After the pan has cooled, wrap the exterior base with foil in preparation for the water bath.", "name": "After the pan has cooled, wrap the exterior base with foil in preparation for the water bath.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-11"}, {"@type": "HowToStep", "text": "Ensure that the cream cheese, eggs, and sour cream have reached room temperature before mixing.", "name": "Ensure that the cream cheese, eggs, and sour cream have reached room temperature before mixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-12"}, {"@type": "HowToStep", "text": "Combine the lemon zest and granulated sugar in a small bowl. Massage the zest into the sugar until the mixture becomes aromatic and slightly sandy in texture.", "name": "Combine the lemon zest and granulated sugar in a small bowl. Massage the zest into the sugar until the mixture becomes aromatic and slightly sandy in texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-13"}, {"@type": "HowToStep", "text": "Beat the softened cream cheese in a large mixing bowl for 1–2 minutes, or until creamy and uniform.", "name": "Beat the softened cream cheese in a large mixing bowl for 1–2 minutes, or until creamy and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-14"}, {"@type": "HowToStep", "text": "Add the lemon-sugar mixture and continue beating for another 1–2 minutes. Stop periodically to scrape the bottom and sides of the bowl.", "name": "Add the lemon-sugar mixture and continue beating for another 1–2 minutes. Stop periodically to scrape the bottom and sides of the bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-15"}, {"@type": "HowToStep", "text": "Incorporate the eggs one at a time at medium speed. Scrape the bowl after each addition and avoid excessive mixing.", "name": "Incorporate the eggs one at a time at medium speed. Scrape the bowl after each addition and avoid excessive mixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-16"}, {"@type": "HowToStep", "text": "Add the vanilla extract, sour cream, and lemon juice. Mix only until the filling is evenly combined.", "name": "Add the vanilla extract, sour cream, and lemon juice. Mix only until the filling is evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-17"}, {"@type": "HowToStep", "text": "Transfer 2½ cups of the plain cheesecake batter to a medium bowl. Gently fold 1 cup of chilled lemon curd into this portion.", "name": "Transfer 2½ cups of the plain cheesecake batter to a medium bowl. Gently fold 1 cup of chilled lemon curd into this portion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-18"}, {"@type": "HowToStep", "text": "Alternate spoonfuls of the plain batter and lemon-curd batter over the baked crust. Draw a butter knife through the two mixtures to create a marbled pattern without fully blending them.", "name": "Alternate spoonfuls of the plain batter and lemon-curd batter over the baked crust. Draw a butter knife through the two mixtures to create a marbled pattern without fully blending them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-19"}, {"@type": "HowToStep", "text": "Bring a large pot of water to a boil.", "name": "Bring a large pot of water to a boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-20"}, {"@type": "HowToStep", "text": "Place the filled springform pan inside a 10-inch cake pan. Position both pans inside a large roasting pan.", "name": "Place the filled springform pan inside a 10-inch cake pan. Position both pans inside a large roasting pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-21"}, {"@type": "HowToStep", "text": "Set the roasting pan on the oven rack. Carefully pour boiling water into the roasting pan so that it surrounds the outer cake pan without entering it.", "name": "Set the roasting pan on the oven rack. Carefully pour boiling water into the roasting pan so that it surrounds the outer cake pan without entering it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-22"}, {"@type": "HowToStep", "text": "Bake at 350°F for 1 hour 40 minutes to 2 hours 12 minutes. The outer portion should appear set, while the center should retain a gentle wobble.", "name": "Bake at 350°F for 1 hour 40 minutes to 2 hours 12 minutes. The outer portion should appear set, while the center should retain a gentle wobble.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-23"}, {"@type": "HowToStep", "text": "Turn off the oven and leave the cheesecake inside. Prop the oven door slightly open and allow the cheesecake to cool gradually for 1 hour.", "name": "Turn off the oven and leave the cheesecake inside. Prop the oven door slightly open and allow the cheesecake to cool gradually for 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-24"}, {"@type": "HowToStep", "text": "Carefully remove the pans from the oven. Lift out the springform pan and discard any exterior foil.", "name": "Carefully remove the pans from the oven. Lift out the springform pan and discard any exterior foil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-25"}, {"@type": "HowToStep", "text": "Set the cheesecake on a wire rack and allow it to cool completely at room temperature.", "name": "Set the cheesecake on a wire rack and allow it to cool completely at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-26"}, {"@type": "HowToStep", "text": "Cover the cooled pan with foil and refrigerate overnight. The chilled cheesecake may be stored in the pan for up to 2 days before adding the topping.", "name": "Cover the cooled pan with foil and refrigerate overnight. The chilled cheesecake may be stored in the pan for up to 2 days before adding the topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-27"}, {"@type": "HowToStep", "text": "Before preparing the meringue, wipe the mixing bowl and utensils with vinegar to remove any traces of grease.", "name": "Before preparing the meringue, wipe the mixing bowl and utensils with vinegar to remove any traces of grease.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-28"}, {"@type": "HowToStep", "text": "Release the chilled cheesecake from the springform pan and transfer it to a serving plate. Spread a thin layer of lemon curd evenly across the surface.", "name": "Release the chilled cheesecake from the springform pan and transfer it to a serving plate. Spread a thin layer of lemon curd evenly across the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-29"}, {"@type": "HowToStep", "text": "Combine the egg whites, granulated sugar, cream of tartar, and salt in a clean glass or metal bowl.", "name": "Combine the egg whites, granulated sugar, cream of tartar, and salt in a clean glass or metal bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-30"}, {"@type": "HowToStep", "text": "Set the bowl over a saucepan containing approximately 1 inch of gently simmering water. Make certain that the base of the bowl does not touch the water.", "name": "Set the bowl over a saucepan containing approximately 1 inch of gently simmering water. Make certain that the base of the bowl does not touch the water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-cheesecake/#wprm-recipe-40980-step-0-31"}, {"@type": "HowToStep", "text": "Whisk continuously for approximately 8 minutes, or until the mixture registers 175°F. The sugar should be fully dissolved and the egg whites gently heated.", "name": "Whisk continuously for approximately 8 minutes, or until the mixture registers 175°F. The s
