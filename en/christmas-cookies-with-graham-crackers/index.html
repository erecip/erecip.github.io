    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies with Graham Crackers", "author": {"@type": "Person", "name": "BenDes"}, "description": "A crisp graham cracker base is coated with a buttery brown sugar caramel, baked until bubbling, then finished with melted chocolate, toffee pieces, and colorful M&M’s. Once fully set, the layered confection is broken or cut into bite-sized pieces for a festive sweet-and-crunchy holiday treat.", "datePublished": "2023-04-13T18:33:40+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/christmas-cookies-with-graham-crackers1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/christmas-cookies-with-graham-crackers1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/christmas-cookies-with-graham-crackers1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/christmas-cookies-with-graham-crackers1.png"], "cookTime": "PT8M", "totalTime": "PT8M", "recipeIngredient": ["Approximately 18 whole graham crackers (equal to 2 packages)", "2  sticks unsalted butter (with Kerrygold suggested if desired)", "Pinch of salt", "1 cup firmly packed brown sugar (preferably dark brown sugar for a deeper flavor)", "1/2  bag M&M’s", "2 cups chocolate chips (either semi-sweet or milk chocolate)", "1/2  bag toffee bits (such as Heath)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Lightly coat the bottoms of the baking pans with nonstick cooking spray, then line them with parchment paper so the finished candy can be removed easily.", "name": "Preheat the oven to 350°F (175°C). Lightly coat the bottoms of the baking pans with nonstick cooking spray, then line them with parchment paper so the finished candy can be removed easily.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-0"}, {"@type": "HowToStep", "text": "Arrange the graham crackers over the parchment in one even layer. Position them closely enough to cover the entire surface of each pan without overlapping.", "name": "Arrange the graham crackers over the parchment in one even layer. Position them closely enough to cover the entire surface of each pan without overlapping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-1"}, {"@type": "HowToStep", "text": "Place the unsalted butter in a saucepan over medium heat. Melt it while stirring continuously until the butter begins to bubble.", "name": "Place the unsalted butter in a saucepan over medium heat. Melt it while stirring continuously until the butter begins to bubble.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-2"}, {"@type": "HowToStep", "text": "Add the packed brown sugar along with a pinch of salt. Continue stirring without stopping until the ingredients are thoroughly incorporated and the mixture becomes smooth, bubbly, and caramel-like.", "name": "Add the packed brown sugar along with a pinch of salt. Continue stirring without stopping until the ingredients are thoroughly incorporated and the mixture becomes smooth, bubbly, and caramel-like.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-3"}, {"@type": "HowToStep", "text": "Carefully pour the hot butter-and-sugar mixture across the graham crackers. Use a spatula to distribute it evenly so that all of the crackers are covered.", "name": "Carefully pour the hot butter-and-sugar mixture across the graham crackers. Use a spatula to distribute it evenly so that all of the crackers are covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the pan to the preheated oven and bake for 8 minutes, or until the caramel mixture is bubbling and has developed a golden color. This baking period allows the graham crackers to absorb the caramel.", "name": "Transfer the pan to the preheated oven and bake for 8 minutes, or until the caramel mixture is bubbling and has developed a golden color. This baking period allows the graham crackers to absorb the caramel.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-5"}, {"@type": "HowToStep", "text": "Take the pan out of the oven and immediately scatter the chocolate chips evenly over the hot caramel layer.", "name": "Take the pan out of the oven and immediately scatter the chocolate chips evenly over the hot caramel layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-6"}, {"@type": "HowToStep", "text": "Switch off the oven and keep its door closed, allowing the retained heat to melt the chocolate without scorching it. Once the chocolate chips have softened and melted, spread the chocolate into an even layer with a spatula.", "name": "Switch off the oven and keep its door closed, allowing the retained heat to melt the chocolate without scorching it. Once the chocolate chips have softened and melted, spread the chocolate into an even layer with a spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-7"}, {"@type": "HowToStep", "text": "While the chocolate remains warm and soft, distribute the toffee bits and M&M’s over the surface. Chopped nuts or other desired mix-ins may also be used, as noted in the original preparation.", "name": "While the chocolate remains warm and soft, distribute the toffee bits and M&M’s over the surface. Chopped nuts or other desired mix-ins may also be used, as noted in the original preparation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-8"}, {"@type": "HowToStep", "text": "Gently press the toppings into the melted chocolate so they remain securely attached. Leave the dessert until completely cooled and set, either at room temperature or in the refrigerator for quicker firming.", "name": "Gently press the toppings into the melted chocolate so they remain securely attached. Leave the dessert until completely cooled and set, either at room temperature or in the refrigerator for quicker firming.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-9"}, {"@type": "HowToStep", "text": "After the chocolate has fully hardened and the dessert is completely cool, cut or break it into bite-sized portions. Serve as a crisp, caramel-coated holiday confection.", "name": "After the chocolate has fully hardened and the dessert is completely cool, cut or break it into bite-sized portions. Serve as a crisp, caramel-coated holiday confection.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-graham-crackers/#wprm-recipe-45983-step-0-10"}], "recipeCategory": ["Dessert"], "keywords": "Christmas Cookies with Graham Crackers"}</script>
