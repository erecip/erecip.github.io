-recipe-39231-step-0-1"}, {"@type": "HowToStep", "text": "Gently melt the unsalted butter, keeping it ready for an even coating on the bread.", "name": "Gently melt the unsalted butter, keeping it ready for an even coating on the bread.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-cheese-croutons/#wprm-recipe-39231-step-0-2"}, {"@type": "HowToStep", "text": "Brush the melted butter uniformly over one side of each bread slice.", "name": "Brush the melted butter uniformly over one side of each bread slice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-cheese-croutons/#wprm-recipe-39231-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the thin cheddar slices over one piece of bread, then place the second slice on top with its buttered surface facing outward.", "name": "Arrange the thin cheddar slices over one piece of bread, then place the second slice on top with its buttered surface facing outward.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-cheese-croutons/#wprm-recipe-39231-step-0-4"}, {"@type": "HowToStep", "text": "Heat a skillet over medium-high heat. The pan is ready when a small drop of water immediately sizzles upon contact.", "name": "Heat a skillet over medium-high heat. The pan is ready when a small drop of water immediately sizzles upon contact.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-cheese-croutons/#wprm-recipe-39231-step-0-5"}, {"@type": "HowToStep", "text": "Set the assembled sandwich in the hot skillet with one buttered side against the cooking surface. Toast for 2–4 minutes, or until the underside becomes crisp and evenly golden brown.", "name": "Set the assembled sandwich in the hot skillet with one buttered side against the cooking surface. Toast for 2–4 minutes, or until the underside becomes crisp and evenly golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-cheese-croutons/#wprm-recipe-39231-step-0-6"}, {"@type": "HowToStep", "text": "Carefully turn the sandwich over and cook for an additional 2–4 minutes, allowing the second side to develop the same golden, crisp finish. Keep the sandwich intact while cooking so the melted cheese remains contained and the structure stays firm.", "name": "Carefully turn the sandwich over and cook for an additional 2–4 minutes, allowing the second side to develop the same golden, crisp finish. Keep the sandwich intact while cooking so the melted cheese remains contained and the structure stays firm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-cheese-croutons/#wprm-recipe-39231-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the finished grilled cheese to a cutting board and allow it to rest for 1–2 minutes. This brief cooling period lets the melted cheese settle slightly, helping the croutons hold together when sliced.", "name": "Transfer the finished grilled cheese to a cutting board and allow it to rest for 1–2 minutes. This brief cooling period lets the melted cheese settle slightly, helping the croutons hold together when sliced.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-cheese-croutons/#wprm-recipe-39231-step-0-8"}, {"@type": "HowToStep", "text": "Using a sharp knife, cut the sandwich into approximately 1-inch squares.", "name": "Using a sharp knife, cut the sandwich into approximately 1-inch squares.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-cheese-croutons/#wprm-recipe-39231-step-0-9"}, {"@type": "HowToStep", "text": "Serve the grilled cheese croutons immediately while the bread remains crisp and the cheddar is still warm and creamy.", "name": "Serve the grilled cheese croutons immediately while the bread remains crisp and the cheddar is still warm and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grilled-cheese-croutons/#wprm-recipe-39231-step-0-10"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["Ameri
