    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Beef Stroganoff with Noodles", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender strips of sirloin are quickly browned and finished in a savory mushroom and onion sauce enriched with Dijon mustard, Worcestershire sauce, thyme, and sour cream. Serve the creamy beef stroganoff over egg noodles for a hearty main course.", "datePublished": "2019-08-22T19:16:05+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/beef-stroganoff-with-noodles2-1.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/beef-stroganoff-with-noodles2-1.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/beef-stroganoff-with-noodles2-1.png"], "recipeIngredient": ["1 1/2 lb sirloin steak", "1 tbsp all-purpose flour", "2 tbsp extra-virgin olive oil", "1/2 tsp freshly ground black pepper", "1/2 tsp seasoned salt", "14.5 oz beef broth", "1  small yellow onion (finely diced)", "1/2 tsp dried thyme", "2 tbsp salted butter", "1  garlic clove (freshly minced)", "1/2 tbsp Dijon mustard", "8 oz mushrooms (sliced)", "2 tbsp all-purpose flour", "2 tsp Worcestershire sauce", "1/2 cup full-fat sour cream", "Egg noodles (cooked as desired)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the beef. Pat the sirloin steak dry with paper towels. Slice it into strips approximately 1/2 inch thick, or cut it into 1-inch cubes if preferred. Season evenly with the seasoned salt and black pepper.", "name": "Prepare the beef. Pat the sirloin steak dry with paper towels. Slice it into strips approximately 1/2 inch thick, or cut it into 1-inch cubes if preferred. Season evenly with the seasoned salt and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-0"}, {"@type": "HowToStep", "text": "Coat the steak. Sprinkle 1 tablespoon of all-purpose flour over the seasoned beef and toss until the pieces have a light, even coating. Shake away any loose excess flour.", "name": "Coat the steak. Sprinkle 1 tablespoon of all-purpose flour over the seasoned beef and toss until the pieces have a light, even coating. Shake away any loose excess flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-1"}, {"@type": "HowToStep", "text": "Brown the beef. Warm the olive oil in a large skillet or Dutch oven over medium-high heat. Working in small batches, sear the beef for approximately 1 minute per side. The exterior should be lightly browned while the center remains undercooked. Transfer each finished batch to a plate and reserve.", "name": "Brown the beef. Warm the olive oil in a large skillet or Dutch oven over medium-high heat. Working in small batches, sear the beef for approximately 1 minute per side. The exterior should be lightly browned while the center remains undercooked. Transfer each finished batch to a plate and reserve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-2"}, {"@type": "HowToStep", "text": "Sauté the onion. Lower the heat to medium and melt the salted butter in the same skillet. Add the diced yellow onion and cook for about 4–5 minutes, or until softened.", "name": "Sauté the onion. Lower the heat to medium and melt the salted butter in the same skillet. Add the diced yellow onion and cook for about 4–5 minutes, or until softened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-3"}, {"@type": "HowToStep", "text": "Cook the mushrooms and garlic. Add the sliced mushrooms and minced garlic to the softened onion. Continue cooking for approximately 4 minutes, stirring occasionally, until the mushrooms become tender.", "name": "Cook the mushrooms and garlic. Add the sliced mushrooms and minced garlic to the softened onion. Continue cooking for approximately 4 minutes, stirring occasionally, until the mushrooms become tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-4"}, {"@type": "HowToStep", "text": "Form the sauce base. Sprinkle the remaining 2 tablespoons of all-purpose flour over the mushroom mixture. Stir thoroughly and cook for 1 minute to remove the raw flour flavor.", "name": "Form the sauce base. Sprinkle the remaining 2 tablespoons of all-purpose flour over the mushroom mixture. Stir thoroughly and cook for 1 minute to remove the raw flour flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-5"}, {"@type": "HowToStep", "text": "Add the liquids and seasonings. Gradually pour in the beef broth, then stir in the Worcestershire sauce, Dijon mustard, and dried thyme. Bring the mixture to a boil while stirring to keep the sauce smooth and free of lumps.", "name": "Add the liquids and seasonings. Gradually pour in the beef broth, then stir in the Worcestershire sauce, Dijon mustard, and dried thyme. Bring the mixture to a boil while stirring to keep the sauce smooth and free of lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-6"}, {"@type": "HowToStep", "text": "Thicken the sauce. Reduce the heat and simmer the sauce uncovered for 5 minutes, allowing it to thicken.", "name": "Thicken the sauce. Reduce the heat and simmer the sauce uncovered for 5 minutes, allowing it to thicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-7"}, {"@type": "HowToStep", "text": "Return the beef to the skillet. Add the browned steak along with any juices that accumulated on the plate. Cook for another 2 minutes, only until the beef is heated through.", "name": "Return the beef to the skillet. Add the browned steak along with any juices that accumulated on the plate. Cook for another 2 minutes, only until the beef is heated through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-8"}, {"@type": "HowToStep", "text": "Finish with sour cream. Remove the skillet from the heat. Immediately stir in the sour cream until fully incorporated and the sauce is smooth and creamy. Taste and add additional salt or pepper if desired.", "name": "Finish with sour cream. Remove the skillet from the heat. Immediately stir in the sour cream until fully incorporated and the sauce is smooth and creamy. Taste and add additional salt or pepper if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-9"}, {"@type": "HowToStep", "text": "Serve. Spoon the finished beef stroganoff over cooked egg noodles. Pasta or mashed potatoes may also be used as the base.", "name": "Serve. Spoon the finished beef stroganoff over cooked egg noodles. Pasta or mashed potatoes may also be used as the base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff-with-noodles/#wprm-recipe-44718-step-0-10"}], "recipeCategory": ["Main Course"], "keywords": "Beef Stroganoff with Noodles"}</script>
