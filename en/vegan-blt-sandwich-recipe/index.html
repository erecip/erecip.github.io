o 4 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-blt-sandwich-recipe/#wprm-recipe-13781-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the cooked cheese to a paper towel-lined plate to absorb excess oil. Sprinkle generously with freshly ground black pepper and let cool slightly.", "name": "Transfer the cooked cheese to a paper towel-lined plate to absorb excess oil. Sprinkle generously with freshly ground black pepper and let cool slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-blt-sandwich-recipe/#wprm-recipe-13781-step-0-4"}, {"@type": "HowToStep", "text": "To assemble, generously spread mayonnaise on half the toasted bread slices. On the remaining slices, layer with lettuce leaves, followed by tomato slices arranged to fully cover the surface. Add a layer of halloumi slices, overlapping as needed. Top with the mayo-coated slices of bread, facing down.", "name": "To assemble, generously spread mayonnaise on half the toasted bread slices. On the remaining slices, layer with lettuce leaves, followed by tomato slices arranged to fully cover the surface. Add a layer of halloumi slices, overlapping as needed. Top with the mayo-coated slices of bread, facing down.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-blt-sandwich-recipe/#wprm-recipe-13781-step-0-5"}, {"@type": "HowToStep", "text": "Serve the sandwiches whole, or cut them in half using a sharp chef’s knife. For optimal texture and flavor, enjoy fresh. Refrigerate leftovers in an airtight container for up to 24 hours.", "name": "Serve the sandwiches whole, or cut them in half using a sharp chef’s knife. For optimal texture and flavor, enjoy fresh. Refrigerate leftovers in an airtight container for up to 24 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-blt-sandwich-recipe/#wprm-recipe-13781-step-0-6"}], "recipeCategory": ["Sandwich"], "recipeCuisine": ["American"], "keywords": "Vegan BLT Sandw
