    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Apple Zucchini Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "A moist quick bread combining grated zucchini, diced apple, warm cinnamon, brown and white sugars, and chopped walnuts. The zucchini is thoroughly drained before mixing to prevent excess moisture, while the apple adds tender pieces of fruit throughout the loaf.", "datePublished": "2022-01-13T20:21:33+00:00", "image": ["https://erecip.github.io/en/apple-zucchini-bread/apple-zucchini-bread2.png", "https://erecip.github.io/en/apple-zucchini-bread/apple-zucchini-bread2.png", "https://erecip.github.io/en/apple-zucchini-bread/apple-zucchini-bread2.png", "https://erecip.github.io/en/apple-zucchini-bread/apple-zucchini-bread2.png"], "cookTime": "PT40M", "totalTime": "PT60M", "recipeIngredient": ["1 teaspoon baking soda", "3 cups all-purpose flour", "1 teaspoon fine salt", "3 teaspoons ground cinnamon (preferably freshly ground for a stronger flavor)", "1 teaspoon baking powder", "1 cup packed light brown sugar", "3  large eggs (brought to room temperature)", "3 teaspoons vanilla extract", "1 cup granulated white sugar", "1 cup vegetable oil (with the option to replace half of the oil with applesauce for added moisture)", "2 cups grated zucchini (firmly squeezed to remove excess liquid)", "1 cup chopped walnuts", "1  medium apple (peeled and cut into ½-inch cubes, yielding approximately 1 cup)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 325°F. Generously coat the loaf pans with butter or cooking spray.", "name": "Preheat the oven to 325°F. Generously coat the loaf pans with butter or cooking spray.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-0"}, {"@type": "HowToStep", "text": "Grate the zucchini, then wrap it in a clean kitchen towel or cheesecloth. Squeeze firmly to extract as much excess moisture as possible. Measure 2 cups of the drained zucchini.", "name": "Grate the zucchini, then wrap it in a clean kitchen towel or cheesecloth. Squeeze firmly to extract as much excess moisture as possible. Measure 2 cups of the drained zucchini.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-1"}, {"@type": "HowToStep", "text": "Peel the apple and dice it into approximately ½-inch pieces, measuring about 1 cup in total.", "name": "Peel the apple and dice it into approximately ½-inch pieces, measuring about 1 cup in total.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-2"}, {"@type": "HowToStep", "text": "In a medium mixing bowl, whisk together the all-purpose flour, ground cinnamon, baking powder, baking soda, and salt until evenly distributed and free of visible lumps.", "name": "In a medium mixing bowl, whisk together the all-purpose flour, ground cinnamon, baking powder, baking soda, and salt until evenly distributed and free of visible lumps.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-3"}, {"@type": "HowToStep", "text": "Place the room-temperature eggs in a large bowl and whisk vigorously for approximately 1 minute, until thoroughly combined and slightly frothy.", "name": "Place the room-temperature eggs in a large bowl and whisk vigorously for approximately 1 minute, until thoroughly combined and slightly frothy.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-4"}, {"@type": "HowToStep", "text": "Add the vegetable oil, vanilla extract, granulated sugar, and packed brown sugar. Mix vigorously until the ingredients form a smooth, pale mixture and the sugars have mostly dissolved.", "name": "Add the vegetable oil, vanilla extract, granulated sugar, and packed brown sugar. Mix vigorously until the ingredients form a smooth, pale mixture and the sugars have mostly dissolved.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-5"}, {"@type": "HowToStep", "text": "Pour the wet mixture into the bowl containing the dry ingredients. Stir only until the ingredients are incorporated. Avoid excessive mixing; the finished batter may remain slightly lumpy.", "name": "Pour the wet mixture into the bowl containing the dry ingredients. Stir only until the ingredients are incorporated. Avoid excessive mixing; the finished batter may remain slightly lumpy.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-6"}, {"@type": "HowToStep", "text": "Using a spatula, gently fold in the drained grated zucchini, diced apple, and chopped walnuts, taking care not to crush the apple pieces.", "name": "Using a spatula, gently fold in the drained grated zucchini, diced apple, and chopped walnuts, taking care not to crush the apple pieces.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-7"}, {"@type": "HowToStep", "text": "Allow the completed batter to stand for 5 minutes so the flour can hydrate before baking.", "name": "Allow the completed batter to stand for 5 minutes so the flour can hydrate before baking.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-8"}, {"@type": "HowToStep", "text": "Divide the batter evenly among the prepared loaf pans and level the surfaces with a spatula.", "name": "Divide the batter evenly among the prepared loaf pans and level the surfaces with a spatula.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-9"}, {"@type": "HowToStep", "text": "Bake at 325°F for 35–40 minutes for mini loaves or 40–60 minutes for full-size loaves. The bread is ready when a toothpick inserted into the center emerges clean or with only a few moist crumbs attached.", "name": "Bake at 325°F for 35–40 minutes for mini loaves or 40–60 minutes for full-size loaves. The bread is ready when a toothpick inserted into the center emerges clean or with only a few moist crumbs attached.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-10"}, {"@type": "HowToStep", "text": "The tops should appear golden brown and should spring back gently when lightly touched.", "name": "The tops should appear golden brown and should spring back gently when lightly touched.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-11"}, {"@type": "HowToStep", "text": "Leave the baked bread in the pans for 20 minutes. After this initial cooling period, carefully remove the loaves and transfer them to a wire rack.", "name": "Leave the baked bread in the pans for 20 minutes. After this initial cooling period, carefully remove the loaves and transfer them to a wire rack.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-12"}, {"@type": "HowToStep", "text": "Allow the bread to cool completely at room temperature before cutting. This final cooling period permits the crumb to set fully and prevents a gummy texture.", "name": "Allow the bread to cool completely at room temperature before cutting. This final cooling period permits the crumb to set fully and prevents a gummy texture.", "url": "https://erecip.github.io/en/apple-zucchini-bread/#wprm-recipe-43453-step-0-13"}], "recipeCategory": ["Bread"], "keywords": "Apple Zucchini Bread"}</script>
