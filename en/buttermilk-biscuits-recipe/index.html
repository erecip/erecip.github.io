e spatula until loosely combined—the dough should remain crumbly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buttermilk-biscuits-recipe/#wprm-recipe-13141-step-0-0"}, {"@type": "HowToStep", "text": "Turn the mixture onto a floured surface and pat into a 9-inch rectangle. Fold the left third over the center, then fold the right third over the top. Rotate the dough horizontally, press into a rectangle, and repeat this folding process two more times to build layers.", "name": "Turn the mixture onto a floured surface and pat into a 9-inch rectangle. Fold the left third over the center, then fold the right third over the top. Rotate the dough horizontally, press into a rectangle, and repeat this folding process two more times to build layers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buttermilk-biscuits-recipe/#wprm-recipe-13141-step-0-1"}, {"@type": "HowToStep", "text": "Shape the dough into a 10-by-7-inch slab approximately 1 inch thick. Using a 3-inch round cutter, press out 6 biscuits without twisting. Lightly flour the cutter between uses and chill cut biscuits to keep them cool. Gather the remaining dough, re-roll, and cut 2 additional biscuits to yield a total of 8.", "name": "Shape the dough into a 10-by-7-inch slab approximately 1 inch thick. Using a 3-inch round cutter, press out 6 biscuits without twisting. Lightly flour the cutter between uses and chill cut biscuits to keep them cool. Gather the remaining dough, re-roll, and cut 2 additional biscuits to yield a total of 8.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buttermilk-biscuits-recipe/#wprm-recipe-13141-step-0-2"}, {"@type": "HowToStep", "text": "Butter a 10-inch cast iron skillet and arrange the biscuits inside with sides almost touching for optimal rise. Alternatively, place them close together on a parchment-lined baking sheet. Bake for 15 minutes or until golden on top.", "name": "Butter a 10-inch cast iron skillet and arrange the biscuits inside with sides almost touching for optimal rise. Alternatively, place them close together on a parchment-lined baking sheet. Bake for 15 minutes or until golden on top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buttermilk-biscuits-recipe/#wprm-recipe-13141-step-0-3"}, {"@type": "HowToStep", "text": "Melt the topping butter and mix with honey, then brush over the warm biscuits. For deeper browning, optionally bake for 5 additional minutes at 450°F.", "name": "Melt the topping butter and mix with honey, then brush over the warm biscuits. For deeper browning, optionally bake for 5 additional minutes at 450°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buttermilk-biscuits-recipe/#wprm-recipe-13141-step-0-4"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Buttermilk Biscuits Recipe"}</script>
