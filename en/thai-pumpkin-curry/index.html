    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Thai Pumpkin Curry", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy Thai-inspired pumpkin curry combining tender pumpkin, colorful peppers, chickpeas, spinach, coconut milk, aromatic spices, and red curry paste. A small portion of the pumpkin is blended and returned to the pot, giving the curry a smooth, velvety body while preserving plenty of hearty vegetable pieces.", "datePublished": "2018-11-14T22:08:51+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/thai-pumpkin-curry.png", "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/thai-pumpkin-curry.png", "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/thai-pumpkin-curry.png", "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/thai-pumpkin-curry.png"], "cookTime": "PT25M", "totalTime": "PT25M", "recipeIngredient": ["1  small orange or yellow sweet pepper (seeded and cut into slices)", "1 tablespoon cooking oil", "1  red serrano or jalapeño pepper (seeds removed and finely chopped)", "1  red bell pepper (deseeded and sliced)", "1 tablespoon palm sugar or brown sugar", "4 1/2 cups pumpkin (cut into cubes)", "2  garlic cloves (finely minced)", "1 teaspoon ground cumin", "1  can (14 ounces full-fat coconut milk)", "3  thin slices fresh ginger", "2 to 4 tablespoons Thai red curry paste", "2 tablespoons cooking oil", "1 tablespoon fish sauce (or a vegetarian/soy-based alternative)", "Juice from 1 lime", "2  makrut lime leaves or bay leaves", "1 teaspoon ground turmeric", "2 cups vegetable or chicken broth", "1  onion (thinly sliced)", "Kosher salt (as needed)", "Freshly ground black pepper (as needed)", "3 1/2 cups fresh spinach leaves", "1/4 cup freshly chopped cilantro", "1  can (15 ounces chickpeas, drained)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat 1 tablespoon of the cooking oil in a medium skillet over medium-high heat.", "name": "Heat 1 tablespoon of the cooking oil in a medium skillet over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-0"}, {"@type": "HowToStep", "text": "Add the sliced red bell pepper and orange or yellow bell pepper. Cook for approximately 5 minutes, stirring from time to time, until the peppers begin to soften.", "name": "Add the sliced red bell pepper and orange or yellow bell pepper. Cook for approximately 5 minutes, stirring from time to time, until the peppers begin to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-1"}, {"@type": "HowToStep", "text": "Add the chopped serrano or jalapeño and continue cooking for 1 additional minute.", "name": "Add the chopped serrano or jalapeño and continue cooking for 1 additional minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-2"}, {"@type": "HowToStep", "text": "Take the skillet off the heat and reserve the sautéed peppers and chile for later.", "name": "Take the skillet off the heat and reserve the sautéed peppers and chile for later.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-3"}, {"@type": "HowToStep", "text": "Warm the remaining 2 tablespoons of cooking oil in a heavy-bottomed pot or Dutch oven over medium heat.", "name": "Warm the remaining 2 tablespoons of cooking oil in a heavy-bottomed pot or Dutch oven over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-4"}, {"@type": "HowToStep", "text": "Once the oil begins to shimmer, add the sliced onion. Cook for about 5 minutes, stirring occasionally, until softened.", "name": "Once the oil begins to shimmer, add the sliced onion. Cook for about 5 minutes, stirring occasionally, until softened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-5"}, {"@type": "HowToStep", "text": "Add the minced garlic, 2 to 4 tablespoons Thai red curry paste, turmeric, and cumin. Stir continuously for approximately 1 minute so the aromatics and spices become fragrant.", "name": "Add the minced garlic, 2 to 4 tablespoons Thai red curry paste, turmeric, and cumin. Stir continuously for approximately 1 minute so the aromatics and spices become fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-6"}, {"@type": "HowToStep", "text": "Place the diced pumpkin into the curry base and season with kosher salt and freshly ground black pepper according to taste.", "name": "Place the diced pumpkin into the curry base and season with kosher salt and freshly ground black pepper according to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-7"}, {"@type": "HowToStep", "text": "Stir thoroughly and cook for roughly 5 minutes to allow the pumpkin to start softening.", "name": "Stir thoroughly and cook for roughly 5 minutes to allow the pumpkin to start softening.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-8"}, {"@type": "HowToStep", "text": "Return the reserved bell peppers and chile to the pot. Add the ginger slices, makrut lime leaves or bay leaves, fish sauce or vegetarian alternative, fresh lime juice, and palm or brown sugar.", "name": "Return the reserved bell peppers and chile to the pot. Add the ginger slices, makrut lime leaves or bay leaves, fish sauce or vegetarian alternative, fresh lime juice, and palm or brown sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-9"}, {"@type": "HowToStep", "text": "Pour in the broth and coconut milk, stirring to combine. Bring the curry to a gentle simmer.", "name": "Pour in the broth and coconut milk, stirring to combine. Bring the curry to a gentle simmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-10"}, {"@type": "HowToStep", "text": "Reduce the heat and leave the pot uncovered. Simmer for approximately 5 minutes, or until the pumpkin has become tender.", "name": "Reduce the heat and leave the pot uncovered. Simmer for approximately 5 minutes, or until the pumpkin has become tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-11"}, {"@type": "HowToStep", "text": "Taste the curry and adjust the seasoning as necessary with additional salt or lime juice.", "name": "Taste the curry and adjust the seasoning as necessary with additional salt or lime juice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-12"}, {"@type": "HowToStep", "text": "Transfer approximately 1 cup of the cooked pumpkin along with some of the surrounding broth to a blender.", "name": "Transfer approximately 1 cup of the cooked pumpkin along with some of the surrounding broth to a blender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-13"}, {"@type": "HowToStep", "text": "Blend until completely smooth, then pour the puréed mixture back into the pot. Stir well to incorporate it into the curry while leaving the remaining pumpkin pieces intact.", "name": "Blend until completely smooth, then pour the puréed mixture back into the pot. Stir well to incorporate it into the curry while leaving the remaining pumpkin pieces intact.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-14"}, {"@type": "HowToStep", "text": "Stir the drained chickpeas into the pot and return the curry to a gentle simmer over medium heat. Cook briefly, just until the chickpeas are thoroughly warmed.", "name": "Stir the drained chickpeas into the pot and return the curry to a gentle simmer over medium heat. Cook briefly, just until the chickpeas are thoroughly warmed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-15"}, {"@type": "HowToStep", "text": "Add the spinach and chopped cilantro. Continue cooking for 1 to 2 minutes, until the spinach has just wilted.", "name": "Add the spinach and chopped cilantro. Continue cooking for 1 to 2 minutes, until the spinach has just wilted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-16"}, {"@type": "HowToStep", "text": "Remove the curry from the heat and serve while hot.", "name": "Remove the curry from the heat and serve while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thai-pumpkin-curry/#wprm-recipe-42146-step-0-17"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Thai-Inspired"], "keywords": "Thai Pumpkin Curry"}</script>
