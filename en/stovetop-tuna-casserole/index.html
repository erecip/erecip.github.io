ent.", "name": "Add the diced white onion and minced garlic. Sauté for 3–4 minutes, stirring as needed, until the onion becomes lightly translucent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/stovetop-tuna-casserole/#wprm-recipe-46614-step-0-1"}, {"@type": "HowToStep", "text": "Stir in the chopped broccoli and continue cooking for another 3–4 minutes, or until the florets turn vivid green and soften slightly. Season the vegetables with the salt and ground black pepper.", "name": "Stir in the chopped broccoli and continue cooking for another 3–4 minutes, or until the florets turn vivid green and soften slightly. Season the vegetables with the salt and ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/stovetop-tuna-casserole/#wprm-recipe-46614-step-0-2"}, {"@type": "HowToStep", "text": "Add the drained tuna to the pot. Using a wooden spoon, gently break the tuna into smaller pieces while thoroughly combining it with the broccoli and aromatics.", "name": "Add the drained tuna to the pot. Using a wooden spoon, gently break the tuna into smaller pieces while thoroughly combining it with the broccoli and aromatics.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/stovetop-tuna-casserole/#wprm-recipe-46614-step-0-3"}, {"@type": "HowToStep", "text": "Pour in the chicken broth and full-fat coconut milk. Stir until the ingredients are evenly distributed, then raise the heat to medium-high and bring the liquid to a gentle boil.", "name": "Pour in the chicken broth and full-fat coconut milk. Stir until the ingredients are evenly distributed, then raise the heat to medium-high and bring the liquid to a gentle boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/stovetop-tuna-casserole/#wprm-recipe-46614-step-0-4"}, {"@type": "HowToStep", "text": "Add the gluten-free shell noodles once the mixture begins boiling. Reduce to a steady simmer and cook for approximately 10–12 minutes, stirring frequently, until the pasta reaches the desired tenderness.", "name": "Add the gluten-free shell noodles once the mixture begins boiling. Reduce to a steady simmer and cook for approximately 10–12 minutes, stirring frequently, until the pasta reaches the desired tenderness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/stovetop-tuna-casserole/#wprm-recipe-46614-step-0-5"}, {"@type": "HowToStep", "text": "During the final minute of cooking, stir continuously to encourage the liquid to reduce and develop a thicker, creamier consistency. For softer noodles, continue simmering for an additional 1–2 minutes.", "name": "During the final minute of cooking, stir continuously to encourage the liquid to reduce and develop a thicker, creamier consistency. For softer noodles, continue simmering for an additional 1–2 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/stovetop-tuna-casserole/#wprm-recipe-46614-step-0-6"}, {"@type": "HowToStep", "text": "Stir in 1–2 tablespoons of nutritional yeast, using the amount that best suits your preferred level of savory, cheese-like flavor.", "name": "Stir in 1–2 tablespoons of nutritional yeast, using the amount that best suits your preferred level of savory, cheese-like flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/stovetop-tuna-casserole/#wprm-recipe-46614-step-0-7"}, {"@type": "HowToStep", "text": "Serve the casserole while hot and finish each portion with freshly chopped parsley.", "name": "Serve the casserole while hot and finish each portion with freshly chopped parsley.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/stovetop-tuna-casserole/#wprm-recipe-46614-step-0-8"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Stovetop Tuna Casserole"}</script>
