    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Peach Pie", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic fruit pie filled with ripe yellow peaches, bright citrus juice, vanilla, and a gently spiced sweetness, all enclosed in a flaky double crust. A woven lattice top, egg wash, sugar, and small pieces of butter give the finished pie a golden, rich finish.", "datePublished": "2023-10-01T23:45:19+00:00", "image": ["https://erecip.github.io/en/peach-pie/peach-pie2.png", "https://erecip.github.io/en/peach-pie/peach-pie2.png", "https://erecip.github.io/en/peach-pie/peach-pie2.png", "https://erecip.github.io/en/peach-pie/peach-pie2.png"], "cookTime": "PT40M", "totalTime": "PT160M", "recipeIngredient": ["2  rounds pie pastry (either homemade or purchased)", "1 teaspoon pure vanilla extract", "2 pounds ripe yellow peaches (approximately 6–7 peaches)", "1/4 cup plus 1 tablespoon tapioca starch", "2 tablespoons freshly squeezed lemon or lime juice", "1 teaspoon smoked paprika or regular paprika; cinnamon may be substituted if preferred", "3/4 cup white granulated sugar", "1 tablespoon unsalted butter", "1  egg yolk combined with 1 tablespoon milk (for the egg wash)", "1 tablespoon granulated sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare two rounds of pie dough using a preferred homemade recipe, or use two ready-made pie dough rounds.", "name": "Prepare two rounds of pie dough using a preferred homemade recipe, or use two ready-made pie dough rounds.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-0"}, {"@type": "HowToStep", "text": "Refrigerate the prepared dough until thoroughly chilled. The dough may be prepared up to one day ahead and kept refrigerated until needed.", "name": "Refrigerate the prepared dough until thoroughly chilled. The dough may be prepared up to one day ahead and kept refrigerated until needed.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-1"}, {"@type": "HowToStep", "text": "Peel the ripe yellow peaches, then cut the fruit into approximately 1-inch cubes. Cubing helps the tender, juicy peaches retain more structure than thin slicing.", "name": "Peel the ripe yellow peaches, then cut the fruit into approximately 1-inch cubes. Cubing helps the tender, juicy peaches retain more structure than thin slicing.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-2"}, {"@type": "HowToStep", "text": "Place the cubed peaches in a large mixing bowl. Add the freshly squeezed lemon or lime juice, granulated sugar, tapioca starch, vanilla extract, and smoked or regular paprika. Cinnamon may be used in place of the paprika if desired.", "name": "Place the cubed peaches in a large mixing bowl. Add the freshly squeezed lemon or lime juice, granulated sugar, tapioca starch, vanilla extract, and smoked or regular paprika. Cinnamon may be used in place of the paprika if desired.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-3"}, {"@type": "HowToStep", "text": "Fold the ingredients together gently until the peach pieces are uniformly coated and all components are thoroughly incorporated.", "name": "Fold the ingredients together gently until the peach pieces are uniformly coated and all components are thoroughly incorporated.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-4"}, {"@type": "HowToStep", "text": "Allow the mixture to stand for a couple of minutes so the flavors can mingle.", "name": "Allow the mixture to stand for a couple of minutes so the flavors can mingle.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-5"}, {"@type": "HowToStep", "text": "Preheat the oven to 400°F (200°C).", "name": "Preheat the oven to 400°F (200°C).", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-6"}, {"@type": "HowToStep", "text": "Lightly flour the work surface, then roll one chilled round of pie dough into a circle approximately 12 inches (30 cm) in diameter.", "name": "Lightly flour the work surface, then roll one chilled round of pie dough into a circle approximately 12 inches (30 cm) in diameter.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the pastry to a 9-inch pie dish and carefully press it against the base and sides of the dish.", "name": "Transfer the pastry to a 9-inch pie dish and carefully press it against the base and sides of the dish.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-8"}, {"@type": "HowToStep", "text": "Spoon the prepared peach mixture into the crust, including all of the accumulated juices remaining in the mixing bowl.", "name": "Spoon the prepared peach mixture into the crust, including all of the accumulated juices remaining in the mixing bowl.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-9"}, {"@type": "HowToStep", "text": "Remove the remaining pie dough round from the refrigerator and roll it into another 12-inch circle.", "name": "Remove the remaining pie dough round from the refrigerator and roll it into another 12-inch circle.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-10"}, {"@type": "HowToStep", "text": "Using a sharp knife, divide the pastry into 6 strips, with each strip measuring approximately 2 inches wide.", "name": "Using a sharp knife, divide the pastry into 6 strips, with each strip measuring approximately 2 inches wide.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-11"}, {"@type": "HowToStep", "text": "Arrange the strips across the filled pie, weaving them over and under one another to create a lattice pattern.", "name": "Arrange the strips across the filled pie, weaving them over and under one another to create a lattice pattern.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-12"}, {"@type": "HowToStep", "text": "Trim away excess pastry around the perimeter. Press the lattice ends into the lower crust, then flute or crimp the edge to seal the two crusts together.", "name": "Trim away excess pastry around the perimeter. Press the lattice ends into the lower crust, then flute or crimp the edge to seal the two crusts together.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-13"}, {"@type": "HowToStep", "text": "Stir the egg yolk together with 1 tablespoon of milk to prepare the egg wash.", "name": "Stir the egg yolk together with 1 tablespoon of milk to prepare the egg wash.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-14"}, {"@type": "HowToStep", "text": "Brush the exposed pastry evenly with the egg wash, then scatter 1 tablespoon of granulated sugar across the crust.", "name": "Brush the exposed pastry evenly with the egg wash, then scatter 1 tablespoon of granulated sugar across the crust.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-15"}, {"@type": "HowToStep", "text": "Cut the unsalted butter into small cubes and distribute the pieces over the exposed peach filling between the lattice strips.", "name": "Cut the unsalted butter into small cubes and distribute the pieces over the exposed peach filling between the lattice strips.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-16"}, {"@type": "HowToStep", "text": "Set the assembled pie on the center rack of the preheated oven. Bake for 40–50 minutes, until the crust is golden brown and the peach filling is visibly bubbling.", "name": "Set the assembled pie on the center rack of the preheated oven. Bake for 40–50 minutes, until the crust is golden brown and the peach filling is visibly bubbling.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-17"}, {"@type": "HowToStep", "text": "If the pastry begins to brown excessively before the filling is ready, loosely shield the pie with aluminum foil.", "name": "If the pastry begins to brown excessively before the filling is ready, loosely shield the pie with aluminum foil.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-18"}, {"@type": "HowToStep", "text": "Once the filling begins bubbling, continue baking for an additional 3–5 minutes.", "name": "Once the filling begins bubbling, continue baking for an additional 3–5 minutes.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-19"}, {"@type": "HowToStep", "text": "Remove the pie from the oven and leave it at room temperature for 2–3 hours before slicing. This cooling period allows the peach filling to set properly while the flavors develop.", "name": "Remove the pie from the oven and leave it at room temperature for 2–3 hours before slicing. This cooling period allows the peach filling to set properly while the flavors develop.", "url": "https://erecip.github.io/en/peach-pie/#wprm-recipe-41589-step-0-20"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Peach Pie"}</script>
