    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Curd Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A swift, straightforward preparation yielding a velvety, vibrant lemon curd with a perfect balance of rich butteriness and sharp citrus tang.", "datePublished": "2024-09-22T15:02:56+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-recipe/Lemon-Curd-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-recipe/Lemon-Curd-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-recipe/Lemon-Curd-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-recipe/Lemon-Curd-Recipe.png"], "prepTime": "PT15M", "cookTime": "PT10M", "totalTime": "PT25M", "recipeIngredient": ["¼ tsp fine sea salt", "200 g 1 cup granulated sugar", "Zest of 6–8 lemons", "113 g ½ cup unsalted butter", "6  large eggs", "240 g 1 cup freshly squeezed lemon juice"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the sugar in a medium saucepan, then zest the lemons directly over it. Using your fingertips, rub the zest thoroughly into the sugar to draw out the fragrant oils. Pour the freshly squeezed lemon juice into the pot and blend gently until the sugar is moistened. In a separate bowl, crack the eggs and add the salt, beating vigorously with a fork to break down as much of the egg white as possible. Incorporate the beaten eggs into the sugar mixture and whisk until smooth. Place the pot over low heat and cook, stirring continuously, until the curd thickens and reaches 170°F on an instant-read thermometer or coats the back of a spatula. Cut the butter into slices and set them in a clean bowl, then position a fine mesh sieve over the bowl. Strain the hot curd through the sieve onto the butter, discarding any zest or cooked egg bits. Stir patiently until all the butter has melted completely into the curd. Transfer the finished lemon curd into an airtight container and refrigerate. It will keep well for up to two weeks, or longer if frozen.", "name": "Combine the sugar in a medium saucepan, then zest the lemons directly over it. Using your fingertips, rub the zest thoroughly into the sugar to draw out the fragrant oils. Pour the freshly squeezed lemon juice into the pot and blend gently until the sugar is moistened. In a separate bowl, crack the eggs and add the salt, beating vigorously with a fork to break down as much of the egg white as possible. Incorporate the beaten eggs into the sugar mixture and whisk until smooth. Place the pot over low heat and cook, stirring continuously, until the curd thickens and reaches 170°F on an instant-read thermometer or coats the back of a spatula. Cut the butter into slices and set them in a clean bowl, then position a fine mesh sieve over the bowl. Strain the hot curd through the sieve onto the butter, discarding any zest or cooked egg bits. Stir patiently until all the butter has melted completely into the curd. Transfer the finished lemon curd into an airtight container and refrigerate. It will keep well for up to two weeks, or longer if frozen.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-curd-recipe/#wprm-recipe-14460-step-0-0"}]}</script>
