    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sugar Free Angel Food Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "This sugar-free angel food cake is made with airy whipped egg whites, whole wheat pastry flour, and granulated monk fruit sweetener. Careful sifting and gentle folding preserve the delicate structure of the batter, while cooling the finished cake upside down helps maintain its characteristic light, lofty texture.", "datePublished": "2018-06-11T04:50:48+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/sugar-free-angel-food-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/sugar-free-angel-food-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/sugar-free-angel-food-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/sugar-free-angel-food-cake2.png"], "prepTime": "PT15M", "cookTime": "PT35M", "totalTime": "PT110M", "recipeIngredient": ["12  large egg whites (brought to room temperature; use fresh separated whites rather than carton egg whites for optimal volume)", "1 cup whole wheat pastry flour (approximately 124 g)", "1 teaspoon vanilla extract", "1 1/2 teaspoons cream of tartar", "2 tablespoons cornstarch", "1/4 teaspoon salt", "1 cup plus 1 tablespoon granulated monk fruit sweetener", "A very small amount of coconut oil (for lightly coating the base of the pan)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Step 1: Prepare the Pan and Process the Sweetener", "name": "Step 1: Prepare the Pan and Process the Sweetener", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-0"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F.", "name": "Preheat the oven to 350°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-1"}, {"@type": "HowToStep", "text": "Apply an extremely thin layer of coconut oil to the bottom only of a removable-bottom tube pan. Leave the sides completely ungreased, since coating them may prevent the batter from gripping the pan properly and can contribute to deflation.", "name": "Apply an extremely thin layer of coconut oil to the bottom only of a removable-bottom tube pan. Leave the sides completely ungreased, since coating them may prevent the batter from gripping the pan properly and can contribute to deflation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the monk fruit sweetener to a large food processor. Process for approximately 2 minutes, or until its texture becomes very fine and powder-like.", "name": "Transfer the monk fruit sweetener to a large food processor. Process for approximately 2 minutes, or until its texture becomes very fine and powder-like.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-3"}, {"@type": "HowToStep", "text": "Step 2: Prepare the Dry Mixture", "name": "Step 2: Prepare the Dry Mixture", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-4"}, {"@type": "HowToStep", "text": "Combine the whole wheat pastry flour, cornstarch, and salt in a sifter.", "name": "Combine the whole wheat pastry flour, cornstarch, and salt in a sifter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-5"}, {"@type": "HowToStep", "text": "Sift the ingredients three times to thoroughly aerate the mixture.", "name": "Sift the ingredients three times to thoroughly aerate the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-6"}, {"@type": "HowToStep", "text": "After the third sifting, incorporate one-third of the finely processed monk fruit sweetener and sift the mixture once more.", "name": "After the third sifting, incorporate one-third of the finely processed monk fruit sweetener and sift the mixture once more.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-7"}, {"@type": "HowToStep", "text": "Set the prepared dry ingredients aside until needed.", "name": "Set the prepared dry ingredients aside until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-8"}, {"@type": "HowToStep", "text": "Step 3: Whip the Egg Whites", "name": "Step 3: Whip the Egg Whites", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-9"}, {"@type": "HowToStep", "text": "Place the room-temperature egg whites, cream of tartar, and vanilla extract into the bowl of a stand mixer fitted with the whisk attachment.", "name": "Place the room-temperature egg whites, cream of tartar, and vanilla extract into the bowl of a stand mixer fitted with the whisk attachment.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-10"}, {"@type": "HowToStep", "text": "Whip on medium speed for approximately 30 seconds, just until the egg whites begin to look lightly foamy.", "name": "Whip on medium speed for approximately 30 seconds, just until the egg whites begin to look lightly foamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-11"}, {"@type": "HowToStep", "text": "With the mixer continuing to run, slowly add the remaining processed monk fruit sweetener in small portions.", "name": "With the mixer continuing to run, slowly add the remaining processed monk fruit sweetener in small portions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-12"}, {"@type": "HowToStep", "text": "Raise the mixer speed to medium-high and continue whipping for approximately 2 1/2 to 3 1/2 minutes, until soft peaks develop.", "name": "Raise the mixer speed to medium-high and continue whipping for approximately 2 1/2 to 3 1/2 minutes, until soft peaks develop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-13"}, {"@type": "HowToStep", "text": "The peaks should bend gently at their tips and gradually settle back into the whipped whites after several seconds. Avoid overwhipping, as maintaining the air within the egg whites is essential for the cake's light structure.", "name": "The peaks should bend gently at their tips and gradually settle back into the whipped whites after several seconds. Avoid overwhipping, as maintaining the air within the egg whites is essential for the cake's light structure.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-14"}, {"@type": "HowToStep", "text": "Step 4: Fold in the Dry Ingredients", "name": "Step 4: Fold in the Dry Ingredients", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-15"}, {"@type": "HowToStep", "text": "Sift one-third of the prepared flour mixture over the whipped egg whites.", "name": "Sift one-third of the prepared flour mixture over the whipped egg whites.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-16"}, {"@type": "HowToStep", "text": "Using a large spatula or balloon whisk, carefully fold the dry ingredients into the whites without crushing out the incorporated air.", "name": "Using a large spatula or balloon whisk, carefully fold the dry ingredients into the whites without crushing out the incorporated air.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-17"}, {"@type": "HowToStep", "text": "Repeat with the second third of the flour mixture, then fold in the final portion in the same gentle manner.", "name": "Repeat with the second third of the flour mixture, then fold in the final portion in the same gentle manner.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-18"}, {"@type": "HowToStep", "text": "Continue only until no visible streaks of flour remain. Do not overmix; the batter should retain as much volume as possible.", "name": "Continue only until no visible streaks of flour remain. Do not overmix; the batter should retain as much volume as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-19"}, {"@type": "HowToStep", "text": "Step 5: Bake the Cake", "name": "Step 5: Bake the Cake", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-20"}, {"@type": "HowToStep", "text": "Carefully spoon the finished batter into the prepared tube pan.", "name": "Carefully spoon the finished batter into the prepared tube pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-21"}, {"@type": "HowToStep", "text": "Gently level the surface with a spatula without pressing or compacting the mixture.", "name": "Gently level the surface with a spatula without pressing or compacting the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-22"}, {"@type": "HowToStep", "text": "Bake at 350°F for 35 to 40 minutes, until the surface is golden brown and a skewer inserted into the center comes out clean.", "name": "Bake at 350°F for 35 to 40 minutes, until the surface is golden brown and a skewer inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-23"}, {"@type": "HowToStep", "text": "Step 6: Cool and Release", "name": "Step 6: Cool and Release", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-24"}, {"@type": "HowToStep", "text": "As soon as the cake leaves the oven, invert the tube pan onto a cooling rack.", "name": "As soon as the cake leaves the oven, invert the tube pan onto a cooling rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-25"}, {"@type": "HowToStep", "text": "Allow the cake to remain upside down for 1 hour. Cooling in this position helps prevent the delicate cake from collapsing as its structure sets.", "name": "Allow the cake to remain upside down for 1 hour. Cooling in this position helps prevent the delicate cake from collapsing as its structure sets.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-26"}, {"@type": "HowToStep", "text": "Once cooled, carefully slide a butter knife around both the outside edge and the center tube to loosen the cake, then remove the sides of the pan.", "name": "Once cooled, carefully slide a butter knife around both the outside edge and the center tube to loosen the cake, then remove the sides of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-27"}, {"@type": "HowToStep", "text": "Run the knife gently beneath the cake to separate it from the removable base, taking care not to tear or break the crumb.", "name": "Run the knife gently beneath the cake to separate it from the removable base, taking care not to tear or break the crumb.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-28"}, {"@type": "HowToStep", "text": "Allow the cake to cool completely before serving.", "name": "Allow the cake to cool completely before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-angel-food-cake/#wprm-recipe-41579-step-0-29"}], "recipeCategory": ["cake", "Dessert"], "recipeCuisine": ["American"], "keywords": "Sugar Free Angel Food Cake"}</script>
