    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pavlova Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A refined pavlova featuring a delicately crisp exterior encasing a pillowy, marshmallow-like core, crowned with luscious whipped cream and an array of fresh fruits. An iconic dessert from Australasia, celebrated for its elegant texture and vibrant presentation.", "datePublished": "2024-10-03T05:05:57+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/Pavlova-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/Pavlova-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/Pavlova-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/Pavlova-Recipe.png"], "prepTime": "PT120M", "cookTime": "PT90M", "totalTime": "PT690M", "recipeIngredient": ["1½ tbsp cornstarch (15–17 g)", "225 g egg whites (at room temperature (approx. 7 large eggs))", "2 tsp white vinegar (10 mL or 1 tsp cream of tartar (5 g))", "370 g caster sugar (or granulated sugar finely pulsed (1¾ cups))", "1 tsp grated lemon zest (optional)", "1 cup halved strawberries (or more, as preferred)", "2 tsp vanilla extract", "1½ cup whipping cream (35% fat)", "2  kiwi fruits (peeled and diced or sliced)", "50 g caster sugar (¼ cup or 50 g confectioner’s sugar (½ cup))", "1 cup diced mangoes (or other fruits such as blueberries, raspberries, red currants)", "¼ cup passion fruit pulp or syrup or lemon curd"], "recipeInstructions": [{"@type": "HowToStep", "text": "Ensure all utensils and bowls are impeccably clean and dry. Preheat the oven to 275°F (135°C). Line a half-sheet tray with parchment paper and mark a 7.5–8 inch circle on the underside as a guide.", "name": "Ensure all utensils and bowls are impeccably clean and dry. Preheat the oven to 275°F (135°C). Line a half-sheet tray with parchment paper and mark a 7.5–8 inch circle on the underside as a guide.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-0"}, {"@type": "HowToStep", "text": "Separate each egg individually, collecting egg whites in a clean bowl before transferring them to the mixer bowl set on a kitchen scale until reaching approximately 220–225 g. Should any yolk contaminate the whites, discard and start over with a fresh egg. Reserve yolks for another use.", "name": "Separate each egg individually, collecting egg whites in a clean bowl before transferring them to the mixer bowl set on a kitchen scale until reaching approximately 220–225 g. Should any yolk contaminate the whites, discard and start over with a fresh egg. Reserve yolks for another use.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-1"}, {"@type": "HowToStep", "text": "Confirm that egg whites are at room temperature, ideally around 75°F (24°C). If necessary, gently warm them by setting the bowl over a larger bowl of hot tap water for 1–2 minutes while stirring until they reach 85–90°F (29–32°C).", "name": "Confirm that egg whites are at room temperature, ideally around 75°F (24°C). If necessary, gently warm them by setting the bowl over a larger bowl of hot tap water for 1–2 minutes while stirring until they reach 85–90°F (29–32°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-2"}, {"@type": "HowToStep", "text": "Attach the whisk to the stand mixer and begin whipping the egg whites on medium-low speed (speed 2–3) until soft peaks form—this typically requires 5–10 minutes. Gradually introduce the sugar, adding one spoonful at a time every 20–30 seconds. Whip for 10–15 seconds between additions, ensuring the sugar integrates thoroughly, and scrape down the sides midway.", "name": "Attach the whisk to the stand mixer and begin whipping the egg whites on medium-low speed (speed 2–3) until soft peaks form—this typically requires 5–10 minutes. Gradually introduce the sugar, adding one spoonful at a time every 20–30 seconds. Whip for 10–15 seconds between additions, ensuring the sugar integrates thoroughly, and scrape down the sides midway.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-3"}, {"@type": "HowToStep", "text": "Once all sugar is incorporated, continue whisking at medium speed (speed 4) until the meringue becomes thick, glossy, and free of undissolved sugar—check by rubbing a small sample between fingertips. This stage may take 12–30 minutes.", "name": "Once all sugar is incorporated, continue whisking at medium speed (speed 4) until the meringue becomes thick, glossy, and free of undissolved sugar—check by rubbing a small sample between fingertips. This stage may take 12–30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-4"}, {"@type": "HowToStep", "text": "Prepare the cornstarch and vinegar (or cream of tartar). When the meringue reaches stiff peaks and the sugar is dissolved, reduce the speed to low to gently mix in the cornstarch and vinegar, then increase slightly for 2–5 minutes to fully combine. If using, fold in the lemon zest by hand.", "name": "Prepare the cornstarch and vinegar (or cream of tartar). When the meringue reaches stiff peaks and the sugar is dissolved, reduce the speed to low to gently mix in the cornstarch and vinegar, then increase slightly for 2–5 minutes to fully combine. If using, fold in the lemon zest by hand.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-5"}, {"@type": "HowToStep", "text": "Dab a small amount of meringue onto each corner of the tray to secure the parchment paper. Spoon the meringue into the marked circle, piling it high. Smooth and shape with an offset spatula, creating a mound about 2.5–3 inches tall with gently furrowed sides and a shallow depression at the center.", "name": "Dab a small amount of meringue onto each corner of the tray to secure the parchment paper. Spoon the meringue into the marked circle, piling it high. Smooth and shape with an offset spatula, creating a mound about 2.5–3 inches tall with gently furrowed sides and a shallow depression at the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-6"}, {"@type": "HowToStep", "text": "Place the tray in the oven and immediately lower the temperature to 212°F (100°C). Bake for 80–90 minutes without opening the oven door. After 80 minutes, briefly open the door to check for a dry exterior; extend baking by 10 minutes if necessary. Once done, switch off the oven and allow the pavlova to cool completely inside, ideally overnight.", "name": "Place the tray in the oven and immediately lower the temperature to 212°F (100°C). Bake for 80–90 minutes without opening the oven door. After 80 minutes, briefly open the door to check for a dry exterior; extend baking by 10 minutes if necessary. Once done, switch off the oven and allow the pavlova to cool completely inside, ideally overnight.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-7"}, {"@type": "HowToStep", "text": "Before serving, chill a mixing bowl and whisk the cold whipping cream on medium-low speed until soft peaks form. Incorporate the sugar and vanilla, then continue whisking to semi-stiff peaks. Finish by gently whisking by hand to achieve stiff peaks without over-beating.", "name": "Before serving, chill a mixing bowl and whisk the cold whipping cream on medium-low speed until soft peaks form. Incorporate the sugar and vanilla, then continue whisking to semi-stiff peaks. Finish by gently whisking by hand to achieve stiff peaks without over-beating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-8"}, {"@type": "HowToStep", "text": "Using a spoon, delicately crack the pavlova’s surface to create room for the cream without collapsing the structure. Spread the whipped cream evenly over the top. Adorn with strawberries, kiwi, mangoes, and any other fruits of choice. Drizzle with passion fruit pulp or lemon curd for an added burst of tang.", "name": "Using a spoon, delicately crack the pavlova’s surface to create room for the cream without collapsing the structure. Spread the whipped cream evenly over the top. Adorn with strawberries, kiwi, mangoes, and any other fruits of choice. Drizzle with passion fruit pulp or lemon curd for an added burst of tang.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-9"}, {"@type": "HowToStep", "text": "Serve immediately for the most delightful texture contrast.", "name": "Serve immediately for the most delightful texture contrast.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pavlova-recipe/#wprm-recipe-14879-step-0-10"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["Australian"], "keywords": "Pavlova Recipe"}</script>
