    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Stuffed Pasta Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A festive baked pasta dish featuring jumbo shells filled with creamy ricotta, provolone, and spinach, then layered with a herb-infused cheese sauce and golden thyme mushrooms. The finished casserole is rich, comforting, and well suited to a holiday meal.", "datePublished": "2023-09-21T10:33:14+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/christmas-stuffed-pasta-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/christmas-stuffed-pasta-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/christmas-stuffed-pasta-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/christmas-stuffed-pasta-recipe2.png"], "prepTime": "PT30M", "cookTime": "PT50M", "totalTime": "PT80M", "recipeIngredient": ["3 cups cremini or shiitake mushrooms (sliced)", "2 tablespoons salted butter", "2 teaspoons dried thyme", "Kosher salt (as needed)", "Freshly ground black pepper (as needed)", "2 cups whole milk", "6 tablespoons salted butter", "2 teaspoons dried basil", "1/2 cup freshly grated Parmesan cheese", "2  garlic cloves (finely chopped)", "1/4 cup all-purpose flour", "2 cups white wine (or chicken broth for a gentler flavor)", "1/2 cup shredded mozzarella cheese", "2 teaspoons dried oregano", "2 cups shredded provolone cheese", "20 ounces frozen spinach (thawed and thoroughly squeezed dry)", "2 cups whole-milk ricotta cheese", "1 pound jumbo pasta shells", "1/2 cup shredded mozzarella cheese", "1/4 cup grated Parmesan cheese"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F and lightly grease a 9 × 13-inch baking dish.", "name": "Preheat the oven to 350°F and lightly grease a 9 × 13-inch baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-0"}, {"@type": "HowToStep", "text": "Melt 2 tablespoons salted butter in a medium skillet or pot. Add the sliced mushrooms and allow them to cook without stirring for approximately 5 minutes, or until they develop a golden surface.", "name": "Melt 2 tablespoons salted butter in a medium skillet or pot. Add the sliced mushrooms and allow them to cook without stirring for approximately 5 minutes, or until they develop a golden surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-1"}, {"@type": "HowToStep", "text": "Season the mushrooms with the dried thyme and a pinch each of kosher salt and black pepper. Continue cooking for another 4–5 minutes, until fragrant and tender. Transfer the mushrooms from the pan and reserve them for later.", "name": "Season the mushrooms with the dried thyme and a pinch each of kosher salt and black pepper. Continue cooking for another 4–5 minutes, until fragrant and tender. Transfer the mushrooms from the pan and reserve them for later.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-2"}, {"@type": "HowToStep", "text": "Using the same skillet, melt the remaining 6 tablespoons of butter. Stir in the chopped garlic, dried basil, and dried oregano, then cook for approximately 30 seconds, just until aromatic.", "name": "Using the same skillet, melt the remaining 6 tablespoons of butter. Stir in the chopped garlic, dried basil, and dried oregano, then cook for approximately 30 seconds, just until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-3"}, {"@type": "HowToStep", "text": "Whisk in the all-purpose flour and continue cooking for about 1 minute.", "name": "Whisk in the all-purpose flour and continue cooking for about 1 minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-4"}, {"@type": "HowToStep", "text": "Gradually pour in the white wine, followed by the milk, whisking continuously. Bring the sauce to a boil and stir for approximately 1 minute.", "name": "Gradually pour in the white wine, followed by the milk, whisking continuously. Bring the sauce to a boil and stir for approximately 1 minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-5"}, {"@type": "HowToStep", "text": "Remove the skillet from the heat. Add 1/2 cup shredded mozzarella and 1/2 cup grated Parmesan, stirring until both cheeses have completely melted and the sauce is smooth. Set aside.", "name": "Remove the skillet from the heat. Add 1/2 cup shredded mozzarella and 1/2 cup grated Parmesan, stirring until both cheeses have completely melted and the sauce is smooth. Set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-6"}, {"@type": "HowToStep", "text": "Bring a large pot of generously salted water to a boil over high heat.", "name": "Bring a large pot of generously salted water to a boil over high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-7"}, {"@type": "HowToStep", "text": "Add the jumbo pasta shells and cook according to the package directions until al dente.", "name": "Add the jumbo pasta shells and cook according to the package directions until al dente.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-8"}, {"@type": "HowToStep", "text": "Drain the shells thoroughly and allow them to cool until they can be comfortably handled.", "name": "Drain the shells thoroughly and allow them to cool until they can be comfortably handled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-9"}, {"@type": "HowToStep", "text": "Combine the ricotta, shredded provolone, and well-drained spinach in a mixing bowl until evenly incorporated.", "name": "Combine the ricotta, shredded provolone, and well-drained spinach in a mixing bowl until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-10"}, {"@type": "HowToStep", "text": "Spread approximately one-third of the prepared cheese sauce across the bottom of the greased baking dish.", "name": "Spread approximately one-third of the prepared cheese sauce across the bottom of the greased baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-11"}, {"@type": "HowToStep", "text": "Working with one shell at a time, place approximately 1 tablespoon of the ricotta-spinach filling inside each pasta shell. Arrange the stuffed shells in the prepared baking dish and repeat until all of the shells have been filled.", "name": "Working with one shell at a time, place approximately 1 tablespoon of the ricotta-spinach filling inside each pasta shell. Arrange the stuffed shells in the prepared baking dish and repeat until all of the shells have been filled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-12"}, {"@type": "HowToStep", "text": "Scatter 1/2 cup shredded mozzarella evenly over the stuffed shells.", "name": "Scatter 1/2 cup shredded mozzarella evenly over the stuffed shells.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-13"}, {"@type": "HowToStep", "text": "Pour the remaining cheese sauce over the pasta, then distribute 1/4 cup grated Parmesan across the surface. Finish by arranging the cooked mushroom-thyme mixture over the top.", "name": "Pour the remaining cheese sauce over the pasta, then distribute 1/4 cup grated Parmesan across the surface. Finish by arranging the cooked mushroom-thyme mixture over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-14"}, {"@type": "HowToStep", "text": "Cover the baking dish with foil and bake for 25 minutes, or until the sauce is hot and bubbling.", "name": "Cover the baking dish with foil and bake for 25 minutes, or until the sauce is hot and bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-15"}, {"@type": "HowToStep", "text": "Remove the foil and return the dish to the oven for another 15–20 minutes, allowing the surface to become golden and bubbly.", "name": "Remove the foil and return the dish to the oven for another 15–20 minutes, allowing the surface to become golden and bubbly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-16"}, {"@type": "HowToStep", "text": "Serve the Christmas stuffed pasta warm. Garnish with fresh thyme, if desired.", "name": "Serve the Christmas stuffed pasta warm. Garnish with fresh thyme, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-pasta-recipe/#wprm-recipe-44221-step-0-17"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Christmas Stuffed Pasta Recipe"}</script>
