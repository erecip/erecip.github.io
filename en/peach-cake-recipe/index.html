    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Peach Cake Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft and airy with a tender crumb, this Peach Cake bursts with juicy fruit flavor and suits every moment from morning coffee to evening dessert.", "datePublished": "2024-07-27T15:03:33+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/peach-cake-recipe/Peach-Cake-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/peach-cake-recipe/Peach-Cake-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/peach-cake-recipe/Peach-Cake-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/peach-cake-recipe/Peach-Cake-Recipe.png"], "recipeYield": ["8"], "prepTime": "PT10M", "cookTime": "PT45M", "totalTime": "PT85M", "recipeIngredient": ["2 cups ripe peaches (peeled, pitted, and sliced or chopped (400g; about 2 to 3 peaches))", "1 tablespoon vanilla extract", "¾ cup unsalted butter (softened (170g))", "¼ cup sour cream (room temperature (60g))", "1 cup granulated sugar (200g)", "½ teaspoon salt", "1½ teaspoons baking powder", "1½ cups all-purpose flour (180g)", "2  large eggs"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat your oven to 350°F (175°C) and grease a 9-inch round cake pan thoroughly with butter or baking spray. In a separate bowl, combine the all-purpose flour, baking powder, and salt by whisking them together. Using a stand mixer fitted with a paddle attachment or a large mixing bowl with an electric mixer, beat the softened butter on medium speed until it becomes creamy. Incorporate the sugar and continue to beat until the mixture turns pale and fluffy, which should take approximately 3 minutes. Add the eggs individually, ensuring you scrape down the sides and mix thoroughly after each addition. Mix in the sour cream and vanilla extract until evenly distributed. With the mixer running on low, slowly integrate the dry ingredients until just combined. Gently fold in about three-quarters of the prepared peaches. Transfer the batter to the greased pan, smoothing the top. Scatter the remaining peaches over the surface, and if desired, sprinkle with extra sugar for a crisp topping. Bake for 45 minutes or until a wooden skewer inserted into the center emerges clean. Allow the cake to cool in the pan for at least 30 minutes before serving. Store any leftovers at room temperature, covered, for up to three days.", "name": "Preheat your oven to 350°F (175°C) and grease a 9-inch round cake pan thoroughly with butter or baking spray. In a separate bowl, combine the all-purpose flour, baking powder, and salt by whisking them together. Using a stand mixer fitted with a paddle attachment or a large mixing bowl with an electric mixer, beat the softened butter on medium speed until it becomes creamy. Incorporate the sugar and continue to beat until the mixture turns pale and fluffy, which should take approximately 3 minutes. Add the eggs individually, ensuring you scrape down the sides and mix thoroughly after each addition. Mix in the sour cream and vanilla extract until evenly distributed. With the mixer running on low, slowly integrate the dry ingredients until just combined. Gently fold in about three-quarters of the prepared peaches. Transfer the batter to the greased pan, smoothing the top. Scatter the remaining peaches over the surface, and if desired, sprinkle with extra sugar for a crisp topping. Bake for 45 minutes or until a wooden skewer inserted into the center emerges clean. Allow the cake to cool in the pan for at least 30 minutes before serving. Store any leftovers at room temperature, covered, for up to three days.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/peach-cake-recipe/#wprm-recipe-12023-step-0-0"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Peach Cake Recipe"}</script>
