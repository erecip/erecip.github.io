    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Condensed Milk Pecan Pie", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich pecan pie featuring a smooth, custard-like filling made with sweetened condensed milk, brown sugar, eggs, and vanilla. Pecans provide a crisp, nutty contrast, while an optional light toasting step enhances their flavor. Chilling the finished pie, particularly overnight, allows the filling to become fully set.", "datePublished": "2022-04-17T12:53:10+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/condensed-milk-pecan-pie2.png", "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/condensed-milk-pecan-pie2.png", "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/condensed-milk-pecan-pie2.png", "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/condensed-milk-pecan-pie2.png"], "cookTime": "PT35M", "totalTime": "PT35M", "recipeIngredient": ["1  can (14 ounces sweetened condensed milk)", "Pastry dough sufficient for one deep-dish pie shell (such as refrigerated Pillsbury pie crust)", "2 teaspoons vanilla extract", "2 cups pecans (either halves or pieces; freshly chopped if desired for optimal flavor)", "1/3 cup firmly packed light brown sugar", "3  large eggs (brought to room temperature, approximately 70°F for effective emulsification)", "2 tablespoons all-purpose flour"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the crust and heat the oven. Arrange the pie pastry evenly inside a 9-inch deep-dish pie plate, ensuring that the dough covers both the base and sides of the pan. Transfer the prepared shell to the refrigerator and keep it chilled until the filling is ready.", "name": "Prepare the crust and heat the oven. Arrange the pie pastry evenly inside a 9-inch deep-dish pie plate, ensuring that the dough covers both the base and sides of the pan. Transfer the prepared shell to the refrigerator and keep it chilled until the filling is ready.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/#wprm-recipe-44386-step-0-0"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Place a rimmed baking sheet on the lowest oven rack while the oven heats. The hot baking sheet will help encourage even baking while also catching any filling that may drip from the pie.", "name": "Preheat the oven to 350°F (175°C). Place a rimmed baking sheet on the lowest oven rack while the oven heats. The hot baking sheet will help encourage even baking while also catching any filling that may drip from the pie.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/#wprm-recipe-44386-step-0-1"}, {"@type": "HowToStep", "text": "Toast the pecans, if desired. For a more pronounced nutty flavor, place the pecans in a skillet over medium heat. Toast them lightly, stirring often to prevent scorching.", "name": "Toast the pecans, if desired. For a more pronounced nutty flavor, place the pecans in a skillet over medium heat. Toast them lightly, stirring often to prevent scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/#wprm-recipe-44386-step-0-2"}, {"@type": "HowToStep", "text": "Remove the pecans from the heat as soon as they become aromatic and develop a slightly deeper color. Set them aside until completely cooled before incorporating them into the filling.", "name": "Remove the pecans from the heat as soon as they become aromatic and develop a slightly deeper color. Set them aside until completely cooled before incorporating them into the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/#wprm-recipe-44386-step-0-3"}, {"@type": "HowToStep", "text": "Prepare the filling. Combine the light brown sugar with the all-purpose flour in a large en/condensed-milk-pecan-pie/#wprm-recipe-44386-step-0-8"}, {"@type": "HowToStep", "text": "Bake. Set the filled pie onto the preheated rimmed baking sheet and bake for 25 minutes.", "name": "Bake. Set the filled pie onto the preheated rimmed baking sheet and bake for 25 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/#wprm-recipe-44386-step-0-9"}, {"@type": "HowToStep", "text": "After the initial baking period, carefully protect the outer crust with a pie shield or narrow strips of aluminum foil to keep the edges from becoming excessively browned. Return the pie to the oven and continue baking for approximately 10 minutes.", "name": "After the initial baking period, carefully protect the outer crust with a pie shield or narrow strips of aluminum foil to keep the edges from becoming excessively browned. Return the pie to the oven and continue baking for approximately 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/#wprm-recipe-44386-step-0-10"}, {"@type": "HowToStep", "text": "The pie is ready when the outer portion of the filling appears set while the center retains a gentle jiggle when the pan is lightly moved.", "name": "The pie is ready when the outer portion of the filling appears set while the center retains a gentle jiggle when the pan is lightly moved.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/#wprm-recipe-44386-step-0-11"}, {"@type": "HowToStep", "text": "Cool and refrigerate. Remove the baked pie from the oven and allow it to cool fully to room temperature.", "name": "Cool and refrigerate. Remove the baked pie from the oven and allow it to cool fully to room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/#wprm-recipe-44386-step-0-12"}, {"@type": "HowToStep", "text": "Once cooled, loosely cover the pie and transfer it to the refrigerator. Allowing it to rest overnight is recommended for a firmer, fully set filling.", "name": "Once cooled, loosely cover the pie and transfer it to the refrigerator. Allowing it to rest overnight is recommended for a firmer, fully set filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/condensed-milk-pecan-pie/#wprm-recipe-44386-step-0-13"}], "recipeCategory": ["Dessert"], "keywords": "Condensed Milk Pecan Pie"}</script>
