    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Fried Chicken Ice Cream", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, custard-style frozen dessert that pairs smooth vanilla cream with deeply browned, crisp chicken skin. The savory crackling adds saltiness, texture, and a distinctive contrast to the sweet ice cream base.", "datePublished": "2022-05-07T21:31:51+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/fried-chicken-ice-cream.png", "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/fried-chicken-ice-cream.png", "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/fried-chicken-ice-cream.png", "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/fried-chicken-ice-cream.png"], "totalTime": "PT240M", "recipeIngredient": ["2 cups full-fat heavy cream (preferably Horizon Organic for added richness)", "1 teaspoon pure vanilla extract", "¾ cup granulated white sugar", "1 cup whole milk", "A small pinch of kosher salt", "4  large egg yolks (separated while the eggs are cold for easier handling)", "2 cups finely crushed"], "recipeInstructions": [{"@type": "HowToStep", "text": "Fry or render the chicken skin in a skillet or deep fryer until it develops a dark golden color and a crisp, crackling texture.", "name": "Fry or render the chicken skin in a skillet or deep fryer until it develops a dark golden color and a crisp, crackling texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the cooked skin to a plate lined with paper towels. Allow it to cool completely so that excess fat drains away and the texture becomes firm.", "name": "Transfer the cooked skin to a plate lined with paper towels. Allow it to cool completely so that excess fat drains away and the texture becomes firm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-1"}, {"@type": "HowToStep", "text": "Break or crush the cooled chicken skin into small, bite-sized fragments. Reserve the pieces until needed.", "name": "Break or crush the cooled chicken skin into small, bite-sized fragments. Reserve the pieces until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-2"}, {"@type": "HowToStep", "text": "Pour the heavy cream and whole milk into a medium saucepan.", "name": "Pour the heavy cream and whole milk into a medium saucepan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-3"}, {"@type": "HowToStep", "text": "Set the pan over medium heat and warm the dairy mixture, stirring occasionally, until it approaches a gentle simmer. Remove it from the heat before it begins to boil.", "name": "Set the pan over medium heat and warm the dairy mixture, stirring occasionally, until it approaches a gentle simmer. Remove it from the heat before it begins to boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-4"}, {"@type": "HowToStep", "text": "Place the egg yolks and granulated sugar in a separate mixing bowl.", "name": "Place the egg yolks and granulated sugar in a separate mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-5"}, {"@type": "HowToStep", "text": "Whisk until the mixture becomes lighter in color, smooth, and slightly thickened.", "name": "Whisk until the mixture becomes lighter in color, smooth, and slightly thickened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-6"}, {"@type": "HowToStep", "text": "While whisking continuously, slowly pour a small portion of the hot cream mixture into the sweetened egg yolks. This gradual process gently raises the temperature of the eggs without scrambling them.", "name": "While whisking continuously, slowly pour a small portion of the hot cream mixture into the sweetened egg yolks. This gradual process gently raises the temperature of the eggs without scrambling them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-7"}, {"@type": "HowToStep", "text": "Continue adding the warm dairy in small amounts until the yolk mixture has been tempered.", "name": "Continue adding the warm dairy in small amounts until the yolk mixture has been tempered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-8"}, {"@type": "HowToStep", "text": "Return the tempered mixture to the saucepan containing the remaining cream and milk. Cook over low to medium-low heat, stirring constantly with a wooden spoon or heat-resistant spatula.", "name": "Return the tempered mixture to the saucepan containing the remaining cream and milk. Cook over low to medium-low heat, stirring constantly with a wooden spoon or heat-resistant spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-9"}, {"@type": "HowToStep", "text": "Continue cooking until the custard reaches approximately 170–175°F, or 77–80°C, and is thick enough to leave a clear coating on the back of the spoon. Do not allow the custard to overheat or curdle.", "name": "Continue cooking until the custard reaches approximately 170–175°F, or 77–80°C, and is thick enough to leave a clear coating on the back of the spoon. Do not allow the custard to overheat or curdle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-10"}, {"@type": "HowToStep", "text": "Pass the cooked custard through a fine-mesh sieve into a clean bowl to remove any small pieces of cooked egg.", "name": "Pass the cooked custard through a fine-mesh sieve into a clean bowl to remove any small pieces of cooked egg.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-11"}, {"@type": "HowToStep", "text": "Stir in the vanilla extract and kosher salt until evenly incorporated.", "name": "Stir in the vanilla extract and kosher salt until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-12"}, {"@type": "HowToStep", "text": "Cover the bowl and refrigerate the custard for several hours, or preferably overnight, until completely cold.", "name": "Cover the bowl and refrigerate the custard for several hours, or preferably overnight, until completely cold.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-13"}, {"@type": "HowToStep", "text": "Pour the thoroughly chilled custard into an ice cream maker.", "name": "Pour the thoroughly chilled custard into an ice cream maker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-14"}, {"@type": "HowToStep", "text": "Churn according to the appliance manufacturer’s directions until the mixture reaches a soft-serve consistency.", "name": "Churn according to the appliance manufacturer’s directions until the mixture reaches a soft-serve consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-15"}, {"@type": "HowToStep", "text": "During the final few minutes of churning, gradually add most of the crushed chicken skin, allowing the pieces to disperse evenly throughout the ice cream.", "name": "During the final few minutes of churning, gradually add most of the crushed chicken skin, allowing the pieces to disperse evenly throughout the ice cream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-16"}, {"@type": "HowToStep", "text": "Spoon the churned ice cream into a freezer-safe container with a secure lid.", "name": "Spoon the churned ice cream into a freezer-safe container with a secure lid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-17"}, {"@type": "HowToStep", "text": "As the container is filled, scatter the remaining crushed chicken skin between the layers.", "name": "As the container is filled, scatter the remaining crushed chicken skin between the layers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-18"}, {"@type": "HowToStep", "text": "Cover tightly and freeze for no less than 4 hours, or until the ice cream is firm enough to scoop.", "name": "Cover tightly and freeze for no less than 4 hours, or until the ice cream is firm enough to scoop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-ice-cream/#wprm-recipe-40680-step-0-19"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Fried Chicken Ice Cream"}</script>
