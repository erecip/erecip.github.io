    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Candied Yams Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A comforting and traditional side dish, these candied yams require minimal preparation and yield irresistibly tender, syrup-coated sweet potatoes. Perfect for festive gatherings or family dinners, they bring warmth and sweetness to any table.", "datePublished": "2024-08-10T06:19:03+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/Candied-Yams-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/Candied-Yams-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/Candied-Yams-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/Candied-Yams-Recipe.png"], "recipeYield": ["6"], "prepTime": "PT10M", "cookTime": "PT45M", "totalTime": "PT55M", "recipeIngredient": ["½ teaspoon grated nutmeg", "¾ cup packed light brown sugar", "½ teaspoon ground cinnamon", "3 pounds sweet potatoes", "2 tablespoons heavy cream", "¼ teaspoon salt", "½ cup unsalted butter"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat your oven to 350°F and lightly grease a 9×13-inch casserole dish with butter.", "name": "Preheat your oven to 350°F and lightly grease a 9×13-inch casserole dish with butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/#wprm-recipe-51029-step-0-0"}, {"@type": "HowToStep", "text": "Peel the sweet potatoes and cut them into ½-inch thick slices. Layer the slices evenly in the prepared baking dish.", "name": "Peel the sweet potatoes and cut them into ½-inch thick slices. Layer the slices evenly in the prepared baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/#wprm-recipe-51029-step-0-1"}, {"@type": "HowToStep", "text": "Melt the butter with the heavy cream in a medium saucepan over medium heat until hot and fully liquified.", "name": "Melt the butter with the heavy cream in a medium saucepan over medium heat until hot and fully liquified.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/#wprm-recipe-51029-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, combine the brown sugar, cinnamon, nutmeg, and salt. Pour the warm butter mixture into the sugar blend and stir until homogeneous.", "name": "In a separate bowl, combine the brown sugar, cinnamon, nutmeg, and salt. Pour the warm butter mixture into the sugar blend and stir until homogeneous.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/#wprm-recipe-51029-step-0-3"}, {"@type": "HowToStep", "text": "Evenly distribute the sweetened mixture over the sweet potatoes, ensuring thorough coating. Cover the baking dish with foil.", "name": "Evenly distribute the sweetened mixture over the sweet potatoes, ensuring thorough coating. Cover the baking dish with foil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/#wprm-recipe-51029-step-0-4"}, {"@type": "HowToStep", "text": "Place in the oven and bake for 25 minutes. Uncover and gently toss the potatoes to coat with the syrup that has formed.", "name": "Place in the oven and bake for 25 minutes. Uncover and gently toss the potatoes to coat with the syrup that has formed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/#wprm-recipe-51029-step-0-5"}, {"@type": "HowToStep", "text": "Continue baking, uncovered, for an additional 20 to 30 minutes, or until the yams are tender and richly glazed. Serve immediately while warm.", "name": "Continue baking, uncovered, for an additional 20 to 30 minutes, or until the yams are tender and richly glazed. Serve immediately while warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/candied-yams-recipe/#wprm-recipe-51029-step-0-6"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Candied Yams Recipe"}</script>
