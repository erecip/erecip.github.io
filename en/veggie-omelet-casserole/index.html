    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Veggie Omelet Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty baked egg casserole filled with spinach, tomatoes, onion, and bell pepper, then finished with a generous layer of cheddar cheese. This vegetable-packed omelet casserole offers a satisfying option for breakfast or brunch.", "datePublished": "2020-05-04T14:20:26+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/veggie-omelet-casserole1.png", "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/veggie-omelet-casserole1.png", "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/veggie-omelet-casserole1.png", "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/veggie-omelet-casserole1.png"], "cookTime": "PT35M", "totalTime": "PT35M", "recipeIngredient": ["10  large eggs (preferably organic)", "1 cup bell pepper of any color (sliced into thin pieces)", "1 teaspoon salt", "2  tomatoes (cut into approximately 1/2-inch cubes)", "3 tablespoons whole milk (for added richness)", "1  small onion (finely chopped)", "1 1/2 cups grated sharp cheddar cheese (divided)", "1 cup fresh spinach (coarsely chopped)", "1/2 teaspoon freshly ground black pepper"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 375°F. Lightly coat a casserole dish with butter or olive oil to prevent the egg mixture from adhering during baking.", "name": "Preheat the oven to 375°F. Lightly coat a casserole dish with butter or olive oil to prevent the egg mixture from adhering during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/#wprm-recipe-45176-step-0-0"}, {"@type": "HowToStep", "text": "Prepare the vegetables by chopping the onion, bell pepper, tomatoes, and spinach into small, bite-sized pieces. Keep the pieces relatively uniform so the vegetables cook consistently throughout the casserole.", "name": "Prepare the vegetables by chopping the onion, bell pepper, tomatoes, and spinach into small, bite-sized pieces. Keep the pieces relatively uniform so the vegetables cook consistently throughout the casserole.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/#wprm-recipe-45176-step-0-1"}, {"@type": "HowToStep", "text": "Place the prepared bell pepper, onion, tomatoes, and spinach in a large mixing bowl. Add the eggs, salt, black pepper, milk, and 1 cup of the shredded cheddar cheese.", "name": "Place the prepared bell pepper, onion, tomatoes, and spinach in a large mixing bowl. Add the eggs, salt, black pepper, milk, and 1 cup of the shredded cheddar cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/#wprm-recipe-45176-step-0-2"}, {"@type": "HowToStep", "text": "Stir the mixture thoroughly until the vegetables, seasonings, cheese, and eggs are evenly incorporated.", "name": "Stir the mixture thoroughly until the vegetables, seasonings, cheese, and eggs are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/#wprm-recipe-45176-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the egg and vegetable mixture to the prepared casserole dish, spreading it evenly across the pan.", "name": "Transfer the egg and vegetable mixture to the prepared casserole dish, spreading it evenly across the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/#wprm-recipe-45176-step-0-4"}, {"@type": "HowToStep", "text": "Scatter the remaining 1/2 cup of cheddar cheese over the surface to create a cheesy topping.", "name": "Scatter the remaining 1/2 cup of cheddar cheese over the surface to create a cheesy topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/#wprm-recipe-45176-step-0-5"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 35 minutes, or until the center of the casserole is completely set and firm.", "name": "Bake in the preheated oven for 35 minutes, or until the center of the casserole is completely set and firm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/#wprm-recipe-45176-step-0-6"}, {"@type": "HowToStep", "text": "Test for doneness by inserting a clean knife or toothpick into the middle. It should emerge clean when the casserole has finished baking.", "name": "Test for doneness by inserting a clean knife or toothpick into the middle. It should emerge clean when the casserole has finished baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/#wprm-recipe-45176-step-0-7"}, {"@type": "HowToStep", "text": "Allow the casserole to cool briefly before slicing and serving.", "name": "Allow the casserole to cool briefly before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/veggie-omelet-casserole/#wprm-recipe-45176-step-0-8"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Veggie Omelet Casserole"}</script>
