e pot. Break the meat into small pieces with a wooden spoon as it cooks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-3"}, {"@type": "HowToStep", "text": "Increase the heat to medium-high and cook for 5–7 minutes, stirring frequently, until no pink remains and the meat develops light browning.", "name": "Increase the heat to medium-high and cook for 5–7 minutes, stirring frequently, until no pink remains and the meat develops light browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-4"}, {"@type": "HowToStep", "text": "Carefully tilt the pot so that excess rendered fat collects on one side. Spoon away and discard the surplus fat.", "name": "Carefully tilt the pot so that excess rendered fat collects on one side. Spoon away and discard the surplus fat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-5"}, {"@type": "HowToStep", "text": "Sprinkle in the salt, black pepper, smoked paprika, cumin, chili powder, and dried oregano. Stir continuously for approximately 1 minute so the spices warm in the residual fat and release their aroma.", "name": "Sprinkle in the salt, black pepper, smoked paprika, cumin, chili powder, and dried oregano. Stir continuously for approximately 1 minute so the spices warm in the residual fat and release their aroma.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-6"}, {"@type": "HowToStep", "text": "Add the tomato paste and Worcestershire sauce to the seasoned meat. Stir continuously for about 1 minute, allowing the tomato paste to cook briefly against the hot surface of the pot and develop a richer flavor.", "name": "Add the tomato paste and Worcestershire sauce to the seasoned meat. Stir continuously for about 1 minute, allowing the tomato paste to cook briefly against the hot surface of the pot and develop a richer flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-7"}, {"@type": "HowToStep", "text": "Pour in the crushed tomatoes and beef broth. Stir thoroughly until the meat, vegetables, and liquid ingredients are evenly incorporated.", "name": "Pour in the crushed tomatoes and beef broth. Stir thoroughly until the meat, vegetables, and liquid ingredients are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-8"}, {"@type": "HowToStep", "text": "Stir in the rinsed and drained kidney beans. Add the optional sugar at this stage if using it.", "name": "Stir in the rinsed and drained kidney beans. Add the optional sugar at this stage if using it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-9"}, {"@type": "HowToStep", "text": "Bring the chili to a gentle simmer over medium heat. Reduce the heat to low and leave the pot uncovered. Cook for 30 minutes, stirring from time to time as the sauce reduces and the seasonings meld together.", "name": "Bring the chili to a gentle simmer over medium heat. Reduce the heat to low and leave the pot uncovered. Cook for 30 minutes, stirring from time to time as the sauce reduces and the seasonings meld together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-10"}, {"@type": "HowToStep", "text": "After the 30-minute simmer, stir in the dark chocolate if using. Continue stirring for about 1 minute, or until the chocolate has completely melted into the sauce.", "name": "After the 30-minute simmer, stir in the dark chocolate if using. Continue stirring for about 1 minute, or until the chocolate has completely melted into the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-11"}, {"@type": "HowToStep", "text": "Remove the pot from the heat and taste the chili. Adjust with additional salt, black pepper, or the existing spices as necessary, keeping the overall seasoning balanced.", "name": "Remove the pot from the heat and taste the chili. Adjust with additional salt, black pepper, or the existing spices as necessary, keeping the overall seasoning balanced.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-12"}, {"@type": "HowToStep", "text": "Spoon the hot chili into serving bowls. Finish each portion with chopped cilantro or flat-leaf parsley, a spoonful of sour cream or plain Greek yogurt, and shredded cheddar cheese.", "name": "Spoon the hot chili into serving bowls. Finish each portion with chopped cilantro or flat-leaf parsley, a spoonful of sour cream or plain Greek yogurt, and shredded cheddar cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-13"}, {"@type": "HowToStep", "text": "Serve with steamed white rice or tortilla chips, either alongside the chili or added as a topping for extra texture.", "name": "Serve with steamed white rice or tortilla chips, either alongside the chili or added as a topping for extra texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gordon-ramsays-chili-con-carne/#wprm-recipe-41865-step-0-14"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["British"], "keywords": "gordon ramsays chili con carne"}</script>
