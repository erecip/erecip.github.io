htly.", "name": "Cook the cauliflower florets by steaming or boiling them until tender, approximately 5–7 minutes. Drain thoroughly and allow the cauliflower to cool slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/two-ingredient-cottage-cheese-tots/#wprm-recipe-43326-step-0-1"}, {"@type": "HowToStep", "text": "Mash and combine. Transfer the cooled cauliflower to a mixing bowl and mash it until smooth.", "name": "Mash and combine. Transfer the cooled cauliflower to a mixing bowl and mash it until smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/two-ingredient-cottage-cheese-tots/#wprm-recipe-43326-step-0-2"}, {"@type": "HowToStep", "text": "Add the cottage cheese, egg, garlic powder, onion powder, salt, and black pepper. Stir thoroughly until the ingredients are evenly incorporated.", "name": "Add the cottage cheese, egg, garlic powder, onion powder, salt, and black pepper. Stir thoroughly until the ingredients are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/two-ingredient-cottage-cheese-tots/#wprm-recipe-43326-step-0-3"}, {"@type": "HowToStep", "text": "Shape the tots. Gradually work the breadcrumbs into the cauliflower mixture. The finished mixture should hold together firmly enough to shape without becoming excessively dry.", "name": "Shape the tots. Gradually work the breadcrumbs into the cauliflower mixture. The finished mixture should hold together firmly enough to shape without becoming excessively dry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/two-ingredient-cottage-cheese-tots/#wprm-recipe-43326-step-0-4"}, {"@type": "HowToStep", "text": "Scoop out small portions and form each one into a tot shape. Keep the pieces approximately equal in size to promote consistent baking.", "name": "Scoop out small portions and form each one into a tot shape. Keep the pieces approximately equal in size to promote consistent baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/two-ingredient-cottage-cheese-tots/#wprm-recipe-43326-step-0-5"}, {"@type": "HowToStep", "text": "Bake. Arrange the shaped tots on a parchment-lined baking sheet.", "name": "Bake. Arrange the shaped tots on a parchment-lined baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/two-ingredient-cottage-cheese-tots/#wprm-recipe-43326-step-0-6"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 20–25 minutes, or until the tots develop a crisp texture and an evenly golden-brown exterior.", "name": "Bake in the preheated oven for 20–25 minutes, or until the tots develop a crisp texture and an evenly golden-brown exterior.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/two-ingredient-cottage-cheese-tots/#wprm-recipe-43326-step-0-7"}, {"@type": "HowToStep", "text": "Serve. Remove the baked tots from the oven and allow them to cool briefly before serving.", "name": "Serve. Remove the baked tots from the oven and allow them to cool briefly before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/two-ingredient-cottage-cheese-tots/#wprm-recipe-43326-step-0-8"}], "recipeCategory": ["Appetizer"], "keywords": "Two Ingredient Cottage Cheese Tots"}</script>
