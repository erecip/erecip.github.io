s. Do not incorporate the baking soda or baking powder at this stage.", "name": "The night before: Grate the cold butter into a bowl using a cheese grater. Add the flour and use a bench scraper or pastry cutter to blend the butter into the flour until crumbly. Mix in the sourdough discard, buttermilk, honey, and salt using a spatula until the dough forms. Cover and leave the dough at room temperature for 10–12 hours. Do not incorporate the baking soda or baking powder at this stage.", "url": "https://erecip.github.io/en/sourdough-cinnamon-rolls-recipe/#wprm-recipe-12013-step-0-0"}, {"@type": "HowToStep", "text": "The next morning: Prepare the filling by combining brown sugar and cinnamon in a small bowl. In a separate dish, mix the glaze components and set aside. Preheat your oven to 375°F (190°C) and grease a 12\" cast iron skillet with butter.", "name": "The next morning: Prepare the filling by combining brown sugar and cinnamon in a small bowl. In a separate dish, mix the glaze components and set aside. Preheat your oven to 375°F (190°C) and grease a 12\" cast iron skillet with butter.", "url": "https://erecip.github.io/en/sourdough-cinnamon-rolls-recipe/#wprm-recipe-12013-step-0-1"}, {"@type": "HowToStep", "text": "Combine baking soda and baking powder in a small bowl, then sprinkle over the dough and integrate with your hands. On a floured surface, roll the dough into a 12\"x24\" rectangle, dusting the top as needed.", "name": "Combine baking soda and baking powder in a small bowl, then sprinkle over the dough and integrate with your hands. On a floured surface, roll the dough into a 12\"x24\" rectangle, dusting the top as needed.", "url": "https://erecip.github.io/en/sourdough-cinnamon-rolls-recipe/#wprm-recipe-12013-step-0-2"}, {"@type": "HowToStep", "text": "Brush the dough with melted butter, then evenly distribute the cinnamon-sugar mixture across the surface, leaving a ½-inch margin along the edges. Roll the dough from the long side into a log and slice i
