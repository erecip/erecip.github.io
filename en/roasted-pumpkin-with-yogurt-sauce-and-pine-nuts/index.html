    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Roasted Pumpkin with Yogurt Sauce and Pine Nuts", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, deeply roasted pumpkin is paired with a smooth garlic-lemon yogurt sauce and finished with toasted pine nuts, fresh herbs, and a light dusting of sumac. The dish may be served warm or allowed to cool to room temperature.", "datePublished": "2023-03-26T11:07:33+00:00", "image": ["https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts2.png", "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts2.png", "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts2.png", "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts2.png"], "totalTime": "PT27M", "recipeIngredient": ["1  garlic clove (very finely chopped)", "1/2 teaspoon freshly ground black pepper", "2 tablespoons extra-virgin olive oil", "2.4 lb pumpkin (butternut squash, or sweet potato, weighed before removing the skin and seeds)", "1/2 teaspoon salt", "1 tablespoon fresh lemon juice", "1/4 teaspoon black pepper", "3/4 cup Greek yogurt or unflavored (unsweetened plain yogurt)", "1 tablespoon extra-virgin olive oil", "1/2  small garlic clove (finely minced)", "1/4 teaspoon salt", "1/8 teaspoon sumac (or an equivalent amount of paprika or a similar spice)", "2 tablespoons fresh cilantro or parsley (chopped)", "2 tablespoons pine nuts (or another suitable nut substitute)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 220°C (430°F), or 200°C if using a fan-assisted oven. Cover a baking tray with parchment paper.", "name": "Preheat the oven to 220°C (430°F), or 200°C if using a fan-assisted oven. Cover a baking tray with parchment paper.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-0"}, {"@type": "HowToStep", "text": "Peel the pumpkin, remove the seeds, and cut the flesh into approximately 3 cm (1.2-inch) cubes. After trimming and cleaning, there should be roughly 1 kg of prepared pumpkin.", "name": "Peel the pumpkin, remove the seeds, and cut the flesh into approximately 3 cm (1.2-inch) cubes. After trimming and cleaning, there should be roughly 1 kg of prepared pumpkin.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-1"}, {"@type": "HowToStep", "text": "Place the pumpkin pieces in a large bowl. Add the extra-virgin olive oil, minced garlic, salt, and black pepper, then toss thoroughly until the cubes are evenly coated.", "name": "Place the pumpkin pieces in a large bowl. Add the extra-virgin olive oil, minced garlic, salt, and black pepper, then toss thoroughly until the cubes are evenly coated.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-2"}, {"@type": "HowToStep", "text": "Arrange the seasoned pumpkin over the lined baking tray in a single, uncrowded layer.", "name": "Arrange the seasoned pumpkin over the lined baking tray in a single, uncrowded layer.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-3"}, {"@type": "HowToStep", "text": "Roast for 20 minutes. Turn the pumpkin pieces over, then return them to the oven for another 7–10 minutes. The pumpkin should develop an appetizing golden color and become tender throughout while still retaining its shape rather than turning mushy.", "name": "Roast for 20 minutes. Turn the pumpkin pieces over, then return them to the oven for another 7–10 minutes. The pumpkin should develop an appetizing golden color and become tender throughout while still retaining its shape rather than turning mushy.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-4"}, {"@type": "HowToStep", "text": "While the pumpkin cooks, combine the Greek or plain yogurt with the minced garlic, lemon juice, extra-virgin olive oil, salt, and black pepper.", "name": "While the pumpkin cooks, combine the Greek or plain yogurt with the minced garlic, lemon juice, extra-virgin olive oil, salt, and black pepper.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-5"}, {"@type": "HowToStep", "text": "Mix until the sauce is completely smooth and evenly blended.", "name": "Mix until the sauce is completely smooth and evenly blended.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-6"}, {"@type": "HowToStep", "text": "Leave the yogurt mixture to rest for a minimum of 10 minutes so the garlic, lemon, and seasonings have time to develop throughout the sauce.", "name": "Leave the yogurt mixture to rest for a minimum of 10 minutes so the garlic, lemon, and seasonings have time to develop throughout the sauce.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-7"}, {"@type": "HowToStep", "text": "While the pumpkin finishes roasting, place a dry skillet over medium-high heat. Do not add oil.", "name": "While the pumpkin finishes roasting, place a dry skillet over medium-high heat. Do not add oil.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-8"}, {"@type": "HowToStep", "text": "Add the pine nuts, or the chosen substitute nuts, and toast them while stirring frequently. Continue until they are aromatic and lightly browned on both sides.", "name": "Add the pine nuts, or the chosen substitute nuts, and toast them while stirring frequently. Continue until they are aromatic and lightly browned on both sides.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the toasted nuts out of the hot skillet immediately to prevent residual heat from scorching them.", "name": "Transfer the toasted nuts out of the hot skillet immediately to prevent residual heat from scorching them.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-10"}, {"@type": "HowToStep", "text": "Arrange the hot or warm roasted pumpkin in a generous mound on a serving plate.", "name": "Arrange the hot or warm roasted pumpkin in a generous mound on a serving plate.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-11"}, {"@type": "HowToStep", "text": "Spoon or drizzle the prepared yogurt sauce liberally over the roasted pumpkin. A small additional drizzle of olive oil may be added if desired.", "name": "Spoon or drizzle the prepared yogurt sauce liberally over the roasted pumpkin. A small additional drizzle of olive oil may be added if desired.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-12"}, {"@type": "HowToStep", "text": "Finish with the toasted pine nuts, chopped cilantro or parsley, and a light sprinkling of sumac, paprika, or the selected alternative spice.", "name": "Finish with the toasted pine nuts, chopped cilantro or parsley, and a light sprinkling of sumac, paprika, or the selected alternative spice.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-13"}, {"@type": "HowToStep", "text": "Serve immediately while warm, or allow the roasted pumpkin to cool before assembling if the dish is intended to be enjoyed at room temperature.", "name": "Serve immediately while warm, or allow the roasted pumpkin to cool before assembling if the dish is intended to be enjoyed at room temperature.", "url": "https://erecip.github.io/en/roasted-pumpkin-with-yogurt-sauce-and-pine-nuts/#wprm-recipe-42426-step-0-14"}], "recipeCategory": ["Side Dish"], "keywords": "Roasted Pumpkin with Yogurt Sauce and Pine Nuts"}</script>
