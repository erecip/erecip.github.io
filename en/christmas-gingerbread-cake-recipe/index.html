dable consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-gingerbread-cake-recipe/#wprm-recipe-43423-step-0-7"}, {"@type": "HowToStep", "text": "After the cake layers have cooled completely, position the first layer on a serving platter or cake stand. Spread frosting over the layer, then continue stacking and frosting between the remaining layers.", "name": "After the cake layers have cooled completely, position the first layer on a serving platter or cake stand. Spread frosting over the layer, then continue stacking and frosting between the remaining layers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-gingerbread-cake-recipe/#wprm-recipe-43423-step-0-8"}, {"@type": "HowToStep", "text": "Cover the top and exterior sides of the assembled cake with the remaining cream cheese frosting. Finish with sprinkles or other desired decorations.", "name": "Cover the top and exterior sides of the assembled cake with the remaining cream cheese frosting. Finish with sprinkles or other desired decorations.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-gingerbread-cake-recipe/#wprm-recipe-43423-step-0-9"}, {"@type": "HowToStep", "text": "Keep the finished gingerbread cake refrigerated because the frosting contains cream cheese. The cake may remain at room temperature for up to 2 hours.", "name": "Keep the finished gingerbread cake refrigerated because the frosting contains cream cheese. The cake may remain at room temperature for up to 2 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-gingerbread-cake-recipe/#wprm-recipe-43423-step-0-10"}, {"@type": "HowToStep", "text": "Slice the cake when ready to serve and enjoy.", "name": "Slice the cake when ready to serve and enjoy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-gingerbread-cake-recipe/#wprm-recipe-43423-step-0-11"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "k
