    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Inas Apple Pie Bars", "author": {"@type": "Person", "name": "BenDes"}, "description": "These apple pie bars feature a buttery cinnamon-walnut crust, a warmly spiced apple center, and a rustic crumb topping. The apples are gently cooked with lemon, cinnamon, nutmeg, and butter before being layered over the pre-baked crust and finished with the reserved dough.", "datePublished": "2021-09-30T12:07:58+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/inas-apple-pie-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/inas-apple-pie-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/inas-apple-pie-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/inas-apple-pie-bars.png"], "prepTime": "PT25M", "cookTime": "PT50M", "totalTime": "PT95M", "recipeIngredient": ["2 cups plain all-purpose flour", "1 teaspoon pure vanilla extract", "1/4 cup lightly packed light brown sugar", "1/3 cup walnuts (finely chopped)", "3/4 teaspoon kosher salt", "1 cup unsalted butter (softened to room temperature)", "1 teaspoon ground cinnamon", "1/3 cup granulated white sugar", "3 pounds apples (peeled, cored, and cut into 1/4-inch slices; a combination of Granny Smith and Honeycrisp works especially well)", "1 1/2 teaspoons ground cinnamon", "2 tablespoons unsalted butter", "1 teaspoon cornstarch", "1/2 teaspoon freshly grated nutmeg", "3 tablespoons granulated white sugar", "1 tablespoon fresh lemon juice"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the Oven and Baking Pan", "name": "Prepare the Oven and Baking Pan", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-0"}, {"@type": "HowToStep", "text": "Heat the oven to 375°F (190°C).", "name": "Heat the oven to 375°F (190°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-1"}, {"@type": "HowToStep", "text": "Line an 8×8-inch square baking pan with an 8-inch-wide strip of parchment paper, leaving enough excess paper extending over two opposite sides of the pan. The overhang will serve as handles for removing the cooled bars.", "name": "Line an 8×8-inch square baking pan with an 8-inch-wide strip of parchment paper, leaving enough excess paper extending over two opposite sides of the pan. The overhang will serve as handles for removing the cooled bars.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-2"}, {"@type": "HowToStep", "text": "Prepare and Bake the Crust", "name": "Prepare and Bake the Crust", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-3"}, {"@type": "HowToStep", "text": "Place the softened butter, granulated sugar, light brown sugar, and vanilla extract in a large mixing bowl. Using a stand mixer or handheld electric mixer, beat on medium speed for approximately 2 minutes, or until creamy and slightly lighter in appearance.", "name": "Place the softened butter, granulated sugar, light brown sugar, and vanilla extract in a large mixing bowl. Using a stand mixer or handheld electric mixer, beat on medium speed for approximately 2 minutes, or until creamy and slightly lighter in appearance.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-4"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk together the flour, kosher salt, ground cinnamon, and finely chopped walnuts.", "name": "In a separate bowl, whisk together the flour, kosher salt, ground cinnamon, and finely chopped walnuts.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-5"}, {"@type": "HowToStep", "text": "With the mixer running on low speed, gradually incorporate the dry ingredients into the butter mixture. Mix only until the ingredients come together into a dough.", "name": "With the mixer running on low speed, gradually incorporate the dry ingredients into the butter mixture. Mix only until the ingredients come together into a dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-6"}, {"@type": "HowToStep", "text": "Transfer approximately two-thirds of the dough to the prepared baking pan. Press it gently and evenly across the base, extending the dough about 1/2 inch up the sides of the pan. Pay particular attention to pressing the mixture into the corners so the finished bars have firm edges.", "name": "Transfer approximately two-thirds of the dough to the prepared baking pan. Press it gently and evenly across the base, extending the dough about 1/2 inch up the sides of the pan. Pay particular attention to pressing the mixture into the corners so the finished bars have firm edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-7"}, {"@type": "HowToStep", "text": "Set aside the remaining one-third of the dough for the topping.", "name": "Set aside the remaining one-third of the dough for the topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-8"}, {"@type": "HowToStep", "text": "Refrigerate the prepared crust for 20 minutes.", "name": "Refrigerate the prepared crust for 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-9"}, {"@type": "HowToStep", "text": "Bake the chilled crust for 18–20 minutes, or until it develops a golden-brown color. Remove it from the oven and set it aside to cool while preparing the filling.", "name": "Bake the chilled crust for 18–20 minutes, or until it develops a golden-brown color. Remove it from the oven and set it aside to cool while preparing the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-10"}, {"@type": "HowToStep", "text": "Cook the Apple Filling", "name": "Cook the Apple Filling", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-11"}, {"@type": "HowToStep", "text": "While the crust is chilling and baking, melt the 2 tablespoons of unsalted butter in a large, heavy pot over medium-low heat.", "name": "While the crust is chilling and baking, melt the 2 tablespoons of unsalted butter in a large, heavy pot over medium-low heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-12"}, {"@type": "HowToStep", "text": "Add the sliced apples, lemon juice, granulated sugar, 1 1/2 teaspoons cinnamon, and freshly grated nutmeg.", "name": "Add the sliced apples, lemon juice, granulated sugar, 1 1/2 teaspoons cinnamon, and freshly grated nutmeg.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-13"}, {"@type": "HowToStep", "text": "Cook the apple mixture for approximately 15 minutes, stirring regularly, until the fruit becomes tender and most of the released liquid has evaporated.", "name": "Cook the apple mixture for approximately 15 minutes, stirring regularly, until the fruit becomes tender and most of the released liquid has evaporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-14"}, {"@type": "HowToStep", "text": "During the final minute of cooking, stir in the cornstarch. Continue cooking until the juices thicken, then remove the pot from the heat.", "name": "During the final minute of cooking, stir in the cornstarch. Continue cooking until the juices thicken, then remove the pot from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-15"}, {"@type": "HowToStep", "text": "Assemble and Bake", "name": "Assemble and Bake", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-16"}, {"@type": "HowToStep", "text": "Spoon the cooked apple mixture evenly over the baked crust, keeping approximately a 1/2-inch border around the perimeter.", "name": "Spoon the cooked apple mixture evenly over the baked crust, keeping approximately a 1/2-inch border around the perimeter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-17"}, {"@type": "HowToStep", "text": "Use your fingers to break or press the reserved crust dough into irregular pieces, then distribute them evenly across the apple layer. The topping does not need to completely conceal the filling.", "name": "Use your fingers to break or press the reserved crust dough into irregular pieces, then distribute them evenly across the apple layer. The topping does not need to completely conceal the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-18"}, {"@type": "HowToStep", "text": "Return the pan to the 375°F (190°C) oven and bake for 25–30 minutes, or until the crumb topping is attractively browned.", "name": "Return the pan to the 375°F (190°C) oven and bake for 25–30 minutes, or until the crumb topping is attractively browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-19"}, {"@type": "HowToStep", "text": "Cool and Portion", "name": "Cool and Portion", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-20"}, {"@type": "HowToStep", "text": "Allow the apple pie bars to cool completely in the baking pan.", "name": "Allow the apple pie bars to cool completely in the baking pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-21"}, {"@type": "HowToStep", "text": "Once cooled, grasp the parchment-paper overhang and carefully lift the entire slab from the pan. Transfer it to a cutting board and divide it into individual bars.", "name": "Once cooled, grasp the parchment-paper overhang and carefully lift the entire slab from the pan. Transfer it to a cutting board and divide it into individual bars.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/inas-apple-pie-bars/#wprm-recipe-44397-step-0-22"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Inas Apple Pie Bars"}</script>
