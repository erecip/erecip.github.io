 remaining dressing on the side for extra drizzling just before serving, or invite guests to add it to their taste.", "name": "Combine the broccoli slaw in a large mixing bowl. Break the ramen noodles into bite-sized pieces and add them to the bowl along with the sliced green onions and sunflower seeds. Scatter the toasted sesame seeds over the mixture. In a separate vessel or blender, combine the avocado oil, rice wine vinegar, toasted sesame oil, honey, and fresh lime juice with a generous pinch of kosher salt and pepper. Blend or whisk thoroughly until emulsified. Drizzle half of the dressing over the slaw and toss until every strand is evenly coated. Allow the slaw to chill in the refrigerator for 30 minutes. Present with the remaining dressing on the side for extra drizzling just before serving, or invite guests to add it to their taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/broccoli-slaw-recipe/#wprm-recipe-15370-step-0-0"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Broccoli Slaw Recipe"}</script>
