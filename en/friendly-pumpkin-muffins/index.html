    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Friendly Pumpkin Muffins", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft pumpkin muffins made with almond flour, pumpkin purée, warm pumpkin pie spice, and Truvia Brown Sugar Blend. Each muffin is finished with a buttery almond-flour crumble that firms as it cools.", "datePublished": "2019-09-03T04:50:29+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/friendly-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/friendly-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/friendly-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/friendly-pumpkin-muffins2.png"], "cookTime": "PT25M", "totalTime": "PT25M", "recipeIngredient": ["15 ounces pumpkin purée", "4  large eggs (brought to approximately 70°F room temperature)", "1 tablespoon baking powder", "½ cup unsalted butter (softened to room temperature)", "1 teaspoon pumpkin pie spice", "1½ cups almond flour", "½ teaspoon salt", "1 teaspoon pure vanilla extract", "½ cup Truvia Brown Sugar Blend", "1 teaspoon pumpkin pie spice", "¼ cup butter (melted)", "¼ cup Truvia Brown Sugar Blend", "½ cup almond flour"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 350°F (175°C). Place paper liners into the wells of a muffin pan so they are ready for the batter.", "name": "Heat the oven to 350°F (175°C). Place paper liners into the wells of a muffin pan so they are ready for the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened unsalted butter and Truvia Brown Sugar Blend in a large mixing bowl. Beat at medium speed until the two ingredients are thoroughly incorporated.", "name": "Place the softened unsalted butter and Truvia Brown Sugar Blend in a large mixing bowl. Beat at medium speed until the two ingredients are thoroughly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-1"}, {"@type": "HowToStep", "text": "Add the eggs individually, beating after each addition until incorporated before adding the next egg. At this point, the mixture may look somewhat thin and lumpy.", "name": "Add the eggs individually, beating after each addition until incorporated before adding the next egg. At this point, the mixture may look somewhat thin and lumpy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-2"}, {"@type": "HowToStep", "text": "Pour in the vanilla extract and add the pumpkin purée. Continue mixing at medium speed until evenly combined.", "name": "Pour in the vanilla extract and add the pumpkin purée. Continue mixing at medium speed until evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-3"}, {"@type": "HowToStep", "text": "Add the almond flour, baking powder, pumpkin pie spice, and salt. Beat for approximately 2 minutes, or until the mixture develops a thick, smooth consistency without visible lumps.", "name": "Add the almond flour, baking powder, pumpkin pie spice, and salt. Beat for approximately 2 minutes, or until the mixture develops a thick, smooth consistency without visible lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-4"}, {"@type": "HowToStep", "text": "Place the butter in a microwave-safe, heat-resistant bowl and microwave for 20–30 seconds, or until completely melted.", "name": "Place the butter in a microwave-safe, heat-resistant bowl and microwave for 20–30 seconds, or until completely melted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-5"}, {"@type": "HowToStep", "text": "Stir in the almond flour, Truvia Brown Sugar Blend, and pumpkin pie spice. Whisk until the ingredients combine into an evenly blended, paste-like mixture.", "name": "Stir in the almond flour, Truvia Brown Sugar Blend, and pumpkin pie spice. Whisk until the ingredients combine into an evenly blended, paste-like mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-6"}, {"@type": "HowToStep", "text": "Divide the prepared pumpkin batter among the lined muffin cups, filling each liner to the top. Use approximately ⅓ cup of batter per muffin, as these muffins do not rise substantially during baking.", "name": "Divide the prepared pumpkin batter among the lined muffin cups, filling each liner to the top. Use approximately ⅓ cup of batter per muffin, as these muffins do not rise substantially during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-7"}, {"@type": "HowToStep", "text": "Spoon roughly 2 heaping teaspoons of crumble mixture over each portion of batter. Press the topping down gently so it adheres to the surface.", "name": "Spoon roughly 2 heaping teaspoons of crumble mixture over each portion of batter. Press the topping down gently so it adheres to the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-8"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 25–30 minutes. The muffins are finished when a knife inserted into the center comes out clean.", "name": "Bake in the preheated oven for 25–30 minutes. The muffins are finished when a knife inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-9"}, {"@type": "HowToStep", "text": "If the muffin tops begin browning before the centers are fully baked, loosely cover the pan with aluminum foil to limit additional browning.", "name": "If the muffin tops begin browning before the centers are fully baked, loosely cover the pan with aluminum foil to limit additional browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-10"}, {"@type": "HowToStep", "text": "Allow the muffins to cool completely to room temperature before handling or serving. Cooling gives the crumble topping time to firm and develop its intended texture.", "name": "Allow the muffins to cool completely to room temperature before handling or serving. Cooling gives the crumble topping time to firm and develop its intended texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-11"}, {"@type": "HowToStep", "text": "After the muffins have cooled, the topping should have hardened. If desired for the intended crumbly finish, carefully lift the firm topping from the muffins, break it into crumbs with your fingers, and scatter the pieces back over the tops.", "name": "After the muffins have cooled, the topping should have hardened. If desired for the intended crumbly finish, carefully lift the firm topping from the muffins, break it into crumbs with your fingers, and scatter the pieces back over the tops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/friendly-pumpkin-muffins/#wprm-recipe-42620-step-0-12"}], "recipeCategory": ["Muffins"], "keywords": "Friendly Pumpkin Muffins"}</script>
