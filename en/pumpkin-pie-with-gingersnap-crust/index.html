    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Pie with Gingersnap Crust", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warmly spiced pumpkin pie paired with a crisp, buttery gingersnap cookie crust. Fresh ginger, cinnamon, cloves, brown sugar, and vanilla give the creamy pumpkin filling a rich autumn flavor, while the crunchy cookie base provides a pleasant contrast in texture.", "datePublished": "2023-03-04T00:58:39+00:00", "image": ["https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/pumpkin-pie-with-gingersnap-crust.png", "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/pumpkin-pie-with-gingersnap-crust.png", "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/pumpkin-pie-with-gingersnap-crust.png", "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/pumpkin-pie-with-gingersnap-crust.png"], "prepTime": "PT25M", "cookTime": "PT60M", "totalTime": "PT205M", "recipeIngredient": ["2 cups finely ground gingersnap cookie crumbs", "1 teaspoon ground cinnamon", "½ cup unsalted butter (melted and allowed to cool slightly)", "2 tablespoons firmly packed light brown sugar", "1 teaspoon ground ginger", "1  can pumpkin purée", "2 teaspoons finely grated fresh ginger", "2  large eggs", "½ teaspoon pure vanilla extract", "2 tablespoons packed light brown sugar", "¼ teaspoon ground cloves", "1  can sweetened condensed milk", "1 teaspoon ground cinnamon", "1  large egg yolk", "⅔ cup granulated white sugar", "½ teaspoon fine sea salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F.", "name": "Preheat the oven to 350°F.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-0"}, {"@type": "HowToStep", "text": "Place the gingersnap cookies and brown sugar in a food processor. Pulse until the cookies are reduced to coarse crumbs.", "name": "Place the gingersnap cookies and brown sugar in a food processor. Pulse until the cookies are reduced to coarse crumbs.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-1"}, {"@type": "HowToStep", "text": "Add the ground ginger and cinnamon, then pulse once or twice more to distribute the spices evenly.", "name": "Add the ground ginger and cinnamon, then pulse once or twice more to distribute the spices evenly.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-2"}, {"@type": "HowToStep", "text": "Pour in the melted, slightly cooled butter and process briefly until the crumbs are thoroughly moistened.", "name": "Pour in the melted, slightly cooled butter and process briefly until the crumbs are thoroughly moistened.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the crust mixture to an ungreased 9-inch pie plate or divide it between two 7½-inch tart pans fitted with removable bottoms.", "name": "Transfer the crust mixture to an ungreased 9-inch pie plate or divide it between two 7½-inch tart pans fitted with removable bottoms.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-4"}, {"@type": "HowToStep", "text": "Using your fingertips, spread and gently press the crumbs evenly across the base and up the sides of the pan.", "name": "Using your fingertips, spread and gently press the crumbs evenly across the base and up the sides of the pan.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-5"}, {"@type": "HowToStep", "text": "Compact the crust firmly with the flat bottom of a measuring cup or drinking glass.", "name": "Compact the crust firmly with the flat bottom of a measuring cup or drinking glass.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-6"}, {"@type": "HowToStep", "text": "Bake for 5–8 minutes. Remove the crust from the oven and allow it to cool for at least 10 minutes before adding the filling.", "name": "Bake for 5–8 minutes. Remove the crust from the oven and allow it to cool for at least 10 minutes before adding the filling.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-7"}, {"@type": "HowToStep", "text": "Combine the pumpkin purée, granulated sugar, brown sugar, fresh ginger, cinnamon, cloves, and sea salt in a large, heavy-bottomed saucepan.", "name": "Combine the pumpkin purée, granulated sugar, brown sugar, fresh ginger, cinnamon, cloves, and sea salt in a large, heavy-bottomed saucepan.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-8"}, {"@type": "HowToStep", "text": "Cook over medium heat until the pumpkin mixture begins to sputter.", "name": "Cook over medium heat until the pumpkin mixture begins to sputter.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-9"}, {"@type": "HowToStep", "text": "Continue cooking for 5 minutes, stirring frequently, until the mixture develops a smooth, glossy consistency.", "name": "Continue cooking for 5 minutes, stirring frequently, until the mixture develops a smooth, glossy consistency.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-10"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Gradually add the sweetened condensed milk while whisking continuously until completely incorporated.", "name": "Remove the saucepan from the heat. Gradually add the sweetened condensed milk while whisking continuously until completely incorporated.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-11"}, {"@type": "HowToStep", "text": "Whisk in the whole eggs and egg yolk individually, making certain each addition is fully blended before adding the next.", "name": "Whisk in the whole eggs and egg yolk individually, making certain each addition is fully blended before adding the next.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-12"}, {"@type": "HowToStep", "text": "Add the vanilla extract and stir until evenly combined.", "name": "Add the vanilla extract and stir until evenly combined.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-13"}, {"@type": "HowToStep", "text": "Bake at 350°F for 30 minutes, or until the outer edges of the filling are beginning to set.", "name": "Bake at 350°F for 30 minutes, or until the outer edges of the filling are beginning to set.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-14"}, {"@type": "HowToStep", "text": "Lower the oven temperature to 325°F and continue baking for another 25–35 minutes. The filling should be largely set while retaining a slight jiggle in the center.", "name": "Lower the oven temperature to 325°F and continue baking for another 25–35 minutes. The filling should be largely set while retaining a slight jiggle in the center.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-15"}, {"@type": "HowToStep", "text": "If the crust becomes too dark before the filling has finished baking, protect its edges with aluminum foil or a pie-crust shield.", "name": "If the crust becomes too dark before the filling has finished baking, protect its edges with aluminum foil or a pie-crust shield.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-16"}, {"@type": "HowToStep", "text": "The pumpkin filling may puff or develop small bubbles while it bakes. This is normal and will subside as the pie cools.", "name": "The pumpkin filling may puff or develop small bubbles while it bakes. This is normal and will subside as the pie cools.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-17"}, {"@type": "HowToStep", "text": "Transfer the finished pie to a wire cooling rack and leave it undisturbed for 2–3 hours, allowing the filling to cool completely and become fully set.", "name": "Transfer the finished pie to a wire cooling rack and leave it undisturbed for 2–3 hours, allowing the filling to cool completely and become fully set.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-18"}, {"@type": "HowToStep", "text": "The residual heat will continue to cook and firm the center during the cooling period.", "name": "The residual heat will continue to cook and firm the center during the cooling period.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-19"}, {"@type": "HowToStep", "text": "Serve the pie at room temperature or chilled, garnished with freshly whipped cream if desired.", "name": "Serve the pie at room temperature or chilled, garnished with freshly whipped cream if desired.", "url": "https://erecip.github.io/en/pumpkin-pie-with-gingersnap-crust/#wprm-recipe-45877-step-0-20"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Pie with Gingersnap Crust"}</script>
