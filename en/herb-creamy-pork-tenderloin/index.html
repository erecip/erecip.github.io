rtOf": {"@id": "https://easy-recipes322.github.io/easy-recipes323/#website"}, "breadcrumb": {"@id": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#breadcrumblist"}, "author": {"@id": "https://easy-recipes322.github.io/easy-recipes323/en/author/bendes/#author"}, "creator": {"@id": "https://easy-recipes322.github.io/easy-recipes323/en/author/bendes/#author"}, "image": {"@type": "ImageObject", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/herb-creamy-pork-tenderloin2.png", "@id": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#mainImage", "width": 1024, "height": 1024}, "primaryImageOfPage": {"@id": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#mainImage"}, "datePublished": "2023-06-14T17:21:14+02:00", "dateModified": "2026-08-22T10:34:52+02:00"}, {"@type": "WebSite", "@id": "https://easy-recipes322.github.io/easy-recipes323/#website", "url": "https://easy-recipes322.github.io/easy-recipes323/", "name": "Quick Recipes", "description": "Everyday Recipes", "inLanguage": "en-US", "publisher": {"@id": "https://easy-recipes322.github.io/easy-recipes323/#organization"}}]}</script>

black pepper.", "name": "Cut the pork tenderloin crosswise into rounds about 1/2 inch thick. Blot the medallions thoroughly with paper towels, then season both surfaces with salt and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-0"}, {"@type": "HowToStep", "text": "Place the flour in a shallow dish and season it with a small amount of salt and pepper. Coat each pork medallion lightly on both sides, then shake away the excess flour. This thin coating encourages an evenly browned exterior during searing.", "name": "Place the flour in a shallow dish and season it with a small amount of salt and pepper. Coat each pork medallion lightly on both sides, then shake away the excess flour. This thin coating encourages an evenly browned exterior during searing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-1"}, {"@type": "HowToStep", "text": "Finely mince the garlic and parsley. Keep them separate and set both aside until needed.", "name": "Finely mince the garlic and parsley. Keep them separate and set both aside until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-2"}, {"@type": "HowToStep", "text": "Place a large skillet over medium-high heat. Add the olive oil along with 1 tablespoon of the butter, heating until the butter begins to foam and the skillet is thoroughly hot.", "name": "Place a large skillet over medium-high heat. Add the olive oil along with 1 tablespoon of the butter, heating until the butter begins to foam and the skillet is thoroughly hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the flour-coated pork medallions in the skillet without crowding them, cooking in batches when necessary. Sear for approximately 3 minutes on each side, leaving the pieces relatively undisturbed so that a deep golden crust can develop.", "name": "Arrange the flour-coated pork medallions in the skillet without crowding them, cooking in batches when necessary. Sear for approximately 3 minutes on each side, leaving the pieces relatively undisturbed so that a deep golden crust can develop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the browned pork to a clean plate. The medallions do not need to be completely cooked at this stage because they will finish cooking in the sauce.", "name": "Transfer the browned pork to a clean plate. The medallions do not need to be completely cooked at this stage because they will finish cooking in the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-5"}, {"@type": "HowToStep", "text": "Keep the same skillet on the heat without cleaning it, preserving the browned bits left behind from the pork. Add the minced garlic and cook for approximately 30 seconds, stirring continuously, just until fragrant. Do not allow the garlic to brown.", "name": "Keep the same skillet on the heat without cleaning it, preserving the browned bits left behind from the pork. Add the minced garlic and cook for approximately 30 seconds, stirring continuously, just until fragrant. Do not allow the garlic to brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-6"}, {"@type": "HowToStep", "text": "Stir in the Dijon mustard, chicken broth or dry white wine, and herbes de Provence. Allow the mixture to simmer for about 1 minute, giving the liquid time to reduce slightly while the flavors combine.", "name": "Stir in the Dijon mustard, chicken broth or dry white wine, and herbes de Provence. Allow the mixture to simmer for about 1 minute, giving the liquid time to reduce slightly while the flavors combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-7"}, {"@type": "HowToStep", "text": "Reduce the heat to medium. Gradually pour the heavy cream into the skillet while stirring continuously to produce a smooth sauce.", "name": "Reduce the heat to medium. Gradually pour the heavy cream into the skillet while stirring continuously to produce a smooth sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-8"}, {"@type": "HowToStep", "text": "Maintain a gentle simmer for approximately 2 minutes, stirring from time to time, until the sauce thickens slightly and is able to coat the back of a spoon.", "name": "Maintain a gentle simmer for approximately 2 minutes, stirring from time to time, until the sauce thickens slightly and is able to coat the back of a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-9"}, {"@type": "HowToStep", "text": "Return the seared pork medallions to the skillet and arrange them in a single layer. Turn each piece gently so that it becomes coated with the creamy herb sauce.", "name": "Return the seared pork medallions to the skillet and arrange them in a single layer. Turn each piece gently so that it becomes coated with the creamy herb sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-10"}, {"@type": "HowToStep", "text": "Simmer the pork in the sauce for approximately 5 minutes, turning the medallions once midway through cooking. Continue until the pork is cooked through, tender, and firm without becoming tough.", "name": "Simmer the pork in the sauce for approximately 5 minutes, turning the medallions once midway through cooking. Continue until the pork is cooked through, tender, and firm without becoming tough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-11"}, {"@type": "HowToStep", "text": "Arrange the finished pork medallions on individual plates or a serving platter, either in one layer or with the pieces slightly overlapping.", "name": "Arrange the finished pork medallions on individual plates or a serving platter, either in one layer or with the pieces slightly overlapping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-12"}, {"@type": "HowToStep", "text": "Spoon the warm creamy herb sauce generously over and around the pork so that every medallion is well coated.", "name": "Spoon the warm creamy herb sauce generously over and around the pork so that every medallion is well coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-13"}, {"@type": "HowToStep", "text": "Scatter the freshly minced parsley over the finished dish immediately before serving, adding fresh herbal flavor and color to the rich cream sauce.", "name": "Scatter the freshly minced parsley over the finished dish immediately before serving, adding fresh herbal flavor and color to the rich cream sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/herb-creamy-pork-tenderloin/#wprm-recipe-43854-step-0-14"}], "recipeCategory": ["Main Course"], "keywords": "Herb Creamy Pork Tenderloin"}</script>
