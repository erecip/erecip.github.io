tter, packed brown sugar, and granulated sugar in a separate medium bowl. Using a mixer or spoon, cream the ingredients together until smooth and evenly blended.", "name": "Place the softened unsalted butter, packed brown sugar, and granulated sugar in a separate medium bowl. Using a mixer or spoon, cream the ingredients together until smooth and evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-christmas-cookies-recipe/#wprm-recipe-43741-step-0-1"}, {"@type": "HowToStep", "text": "Add the room-temperature egg and vanilla to the creamed butter mixture. Beat until the mixture becomes light and fluffy.", "name": "Add the room-temperature egg and vanilla to the creamed butter mixture. Beat until the mixture becomes light and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-christmas-cookies-recipe/#wprm-recipe-43741-step-0-2"}, {"@type": "HowToStep", "text": "Gradually incorporate the prepared flour mixture into the wet ingredients, mixing until a cohesive cookie dough forms. Fold in the shredded coconut until it is evenly dispersed throughout the dough.", "name": "Gradually incorporate the prepared flour mixture into the wet ingredients, mixing until a cohesive cookie dough forms. Fold in the shredded coconut until it is evenly dispersed throughout the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-christmas-cookies-recipe/#wprm-recipe-43741-step-0-3"}, {"@type": "HowToStep", "text": "Drop spoonfuls of dough onto an ungreased cookie sheet, leaving approximately 3 inches of space between each portion to accommodate spreading. Parchment paper may also be used to line the baking sheet.", "name": "Drop spoonfuls of dough onto an ungreased cookie sheet, leaving approximately 3 inches of space between each portion to accommodate spreading. Parchment paper may also be used to line the baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-christmas-cookies-recipe/#wprm-recipe-43741-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the cookie sheet to the preheated oven and bake for 8–12 minutes, or until the cookies are lightly toasted with golden edges.", "name": "Transfer the cookie sheet to the preheated oven and bake for 8–12 minutes, or until the cookies are lightly toasted with golden edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-christmas-cookies-recipe/#wprm-recipe-43741-step-0-5"}, {"@type": "HowToStep", "text": "Carefully transfer the baked cookies to a wire cooling rack and allow them to cool completely. They may be served warm or at room temperature.", "name": "Carefully transfer the baked cookies to a wire cooling rack and allow them to cool completely. They may be served warm or at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-christmas-cookies-recipe/#wprm-recipe-43741-step-0-6"}], "recipeCategory": ["Brownies &amp; Bars", "Cookies"], "keywords": "Coconut Christmas Cookies Recipe"}</script>
