    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Italian Lasagna Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty Italian-inspired soup featuring browned sausage, tender pieces of lasagna pasta, crushed tomatoes, beef broth, aromatic garlic and onion, fresh basil, and a rich trio of cheeses added at serving.", "datePublished": "2023-02-01T04:56:19+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/italian-lasagna-soup1.png", "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/italian-lasagna-soup1.png", "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/italian-lasagna-soup1.png", "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/italian-lasagna-soup1.png"], "totalTime": "PT25M", "recipeIngredient": ["4 cups beef stock", "10  dry lasagna sheets (broken into pieces approximately 1–2 inches in size)", "4  fresh garlic cloves (finely minced)", "1  can crushed tomatoes (preferably San Marzano)", "1 pound Italian sausage (casings removed)", "1 cup water", "1  –2 tablespoons fresh basil leaves (torn immediately before serving for optimal flavor)", "1/4 teaspoon Italian seasoning", "1/2  medium yellow onion (chopped into roughly 1/4-inch pieces)", "Salt and freshly ground pepper (adjusted to taste)", "Ricotta cheese (brought to room temperature)", "Whole-milk mozzarella cheese (shredded)", "Parmigiano-Reggiano (preferably freshly grated)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place a large pot or Dutch oven over medium-high heat. Add the Italian sausage and cook until fully done and lightly browned, breaking the meat into smaller pieces with a spoon as it cooks. Drain away any excess rendered fat.", "name": "Place a large pot or Dutch oven over medium-high heat. Add the Italian sausage and cook until fully done and lightly browned, breaking the meat into smaller pieces with a spoon as it cooks. Drain away any excess rendered fat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/#wprm-recipe-44079-step-0-0"}, {"@type": "HowToStep", "text": "Add the chopped yellow onion to the sausage and continue cooking for approximately 4–5 minutes, or until the onion has softened. Stir in the freshly minced garlic and cook for 1 additional minute, just until aromatic.", "name": "Add the chopped yellow onion to the sausage and continue cooking for approximately 4–5 minutes, or until the onion has softened. Stir in the freshly minced garlic and cook for 1 additional minute, just until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/#wprm-recipe-44079-step-0-1"}, {"@type": "HowToStep", "text": "Pour the crushed tomatoes, beef stock, and water into the pot. Stir thoroughly so the liquids combine evenly with the sausage, onion, and garlic.", "name": "Pour the crushed tomatoes, beef stock, and water into the pot. Stir thoroughly so the liquids combine evenly with the sausage, onion, and garlic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/#wprm-recipe-44079-step-0-2"}, {"@type": "HowToStep", "text": "Mix in the Italian seasoning and bring the soup to a rolling boil. Add the broken lasagna sheets, stirring from time to time to keep the pasta pieces from sticking together.", "name": "Mix in the Italian seasoning and bring the soup to a rolling boil. Add the broken lasagna sheets, stirring from time to time to keep the pasta pieces from sticking together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/#wprm-recipe-44079-step-0-3"}, {"@type": "HowToStep", "text": "Lower the heat and maintain a gentle simmer for about 15 minutes, or until the lasagna pieces are tender and completely cooked.", "name": "Lower the heat and maintain a gentle simmer for about 15 minutes, or until the lasagna pieces are tender and completely cooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/#wprm-recipe-44079-step-0-4"}, {"@type": "HowToStep", "text": "Once the pasta has reached the desired tenderness, stir the freshly torn basil into the soup. Taste and season with salt and pepper as necessary.", "name": "Once the pasta has reached the desired tenderness, stir the freshly torn basil into the soup. Taste and season with salt and pepper as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/#wprm-recipe-44079-step-0-5"}, {"@type": "HowToStep", "text": "Keep the soup warm until serving so the ingredients remain well combined and heated throughout.", "name": "Keep the soup warm until serving so the ingredients remain well combined and heated throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/#wprm-recipe-44079-step-0-6"}, {"@type": "HowToStep", "text": "Prepare the ricotta, grated Parmigiano-Reggiano, and shredded mozzarella immediately before serving.", "name": "Prepare the ricotta, grated Parmigiano-Reggiano, and shredded mozzarella immediately before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/#wprm-recipe-44079-step-0-7"}, {"@type": "HowToStep", "text": "Ladle the hot lasagna soup into individual bowls. Top each portion with dollops of room-temperature ricotta, a generous scattering of Parmigiano-Reggiano, and shredded mozzarella. Allow the heat of the soup to gently soften the cheeses before serving.", "name": "Ladle the hot lasagna soup into individual bowls. Top each portion with dollops of room-temperature ricotta, a generous scattering of Parmigiano-Reggiano, and shredded mozzarella. Allow the heat of the soup to gently soften the cheeses before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-lasagna-soup/#wprm-recipe-44079-step-0-8"}], "recipeCategory": ["Soup"
