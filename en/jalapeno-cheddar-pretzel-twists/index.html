    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Jalapeño Cheddar Pretzel Twists", "author": {"@type": "Person", "name": "BenDes"}, "description": "These savory pretzel twists combine tender, golden-brown dough with sharp cheddar cheese and finely minced jalapeños. A brief baking-soda bath creates the characteristic pretzel color and flavor, while an egg wash, coarse salt, and melted butter provide a glossy, flavorful finish.", "datePublished": "2018-12-25T12:27:16+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/jalapeno-cheddar-pretzel-twists.png", "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/jalapeno-cheddar-pretzel-twists.png", "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/jalapeno-cheddar-pretzel-twists.png", "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/jalapeno-cheddar-pretzel-twists.png"], "cookTime": "PT10M", "totalTime": "PT15M", "recipeIngredient": ["2 cups shredded cheddar cheese", "½ teaspoon salt", "2  medium jalapeños (seeded and finely minced)", "1 tablespoon granulated sugar", "3  –4 cups all-purpose flour (added as needed)", "2½ teaspoons active dry yeast", "1¼ cups warm water", "¼ cup baking soda", "4 cups very hot water", "2 tablespoons unsalted butter (melted)", "Coarse salt (as needed for sprinkling)", "1  large egg", "2 tablespoons water"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 450°F (232°C). Cover a large baking sheet with parchment paper to prevent sticking and promote even baking.", "name": "Preheat the oven to 450°F (232°C). Cover a large baking sheet with parchment paper to prevent sticking and promote even baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-0"}, {"@type": "HowToStep", "text": "Pour the warm water into the bowl of a stand mixer fitted with a dough hook. Add the active dry yeast and granulated sugar, then leave the mixture undisturbed for 5–10 minutes, or until a foamy layer develops.", "name": "Pour the warm water into the bowl of a stand mixer fitted with a dough hook. Add the active dry yeast and granulated sugar, then leave the mixture undisturbed for 5–10 minutes, or until a foamy layer develops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-1"}, {"@type": "HowToStep", "text": "Mix in the salt, followed by 3 cups of the all-purpose flour. Continue mixing until the ingredients begin to form a dough.", "name": "Mix in the salt, followed by 3 cups of the all-purpose flour. Continue mixing until the ingredients begin to form a dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-2"}, {"@type": "HowToStep", "text": "Add the minced jalapeños and shredded cheddar cheese, mixing until they are evenly distributed.", "name": "Add the minced jalapeños and shredded cheddar cheese, mixing until they are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-3"}, {"@type": "HowToStep", "text": "Gradually incorporate additional flour in small amounts until the dough gathers into a cohesive ball. The finished dough should feel slightly tacky without clinging heavily to the hands or bowl. The full 4 cups of flour may not be required.", "name": "Gradually incorporate additional flour in small amounts until the dough gathers into a cohesive ball. The finished dough should feel slightly tacky without clinging heavily to the hands or bowl. The full 4 cups of flour may not be required.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-4"}, {"@type": "HowToStep", he parchment-lined baking sheet.", "name": "Pinch the ends together and tuck them underneath to secure the twist. Arrange each shaped pretzel on the parchment-lined baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-10"}, {"@type": "HowToStep", "text": "Carefully lower each shaped pretzel into the hot baking-soda bath for approximately 30 seconds.", "name": "Carefully lower each shaped pretzel into the hot baking-soda bath for approximately 30 seconds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-11"}, {"@type": "HowToStep", "text": "Lift it from the bath with a slotted spoon and return it to the prepared baking sheet. Adjust the twist as necessary to restore its shape.", "name": "Lift it from the bath with a slotted spoon and return it to the prepared baking sheet. Adjust the twist as necessary to restore its shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-12"}, {"@type": "HowToStep", "text": "Brush the surface of each pretzel with the prepared egg wash, then scatter coarse salt over the top.", "name": "Brush the surface of each pretzel with the prepared egg wash, then scatter coarse salt over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-13"}, {"@type": "HowToStep", "text": "Bake the pretzel twists for 8–10 minutes, or until their surfaces are evenly golden brown.", "name": "Bake the pretzel twists for 8–10 minutes, or until their surfaces are evenly golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-14"}, {"@type": "HowToStep", "text": "Allow the baked twists to rest on the baking sheet for a few minutes. While they are still warm, brush them with the melted unsalted butter.", "name": "Allow the baked twists to rest on the baking sheet for a few minutes. While they are still warm, brush them with the melted unsalted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jalapeno-cheddar-pretzel-twists/#wprm-recipe-40053-step-0-15"}], "recipeCategory": ["Appetizer", "Bread", "Snack"], "recipeCuisine": ["American"], "keywords": "Jalapeño Cheddar Pretzel Twists"}</script>
