h and cohesive. Set aside until needed.", "name": "Melt the butter gently in a small saucepan over low heat. Add the hot sauce, vinegar, Worcestershire, Tabasco, paprika, garlic, and a pinch each of salt and pepper. Whisk the mixture thoroughly until it becomes smooth and cohesive. Set aside until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buffalo-chicken/#wprm-recipe-31177-step-0-0"}]}, {"@type": "HowToSection", "name": "For the Chicken – Grill Method", "itemListElement": [{"@type": "HowToStep", "text": "In a small bowl, combine the paprika, garlic powder, cayenne powder, salt, and pepper. Rub this seasoning blend evenly over the chicken breasts.", "name": "In a small bowl, combine the paprika, garlic powder, cayenne powder, salt, and pepper. Rub this seasoning blend evenly over the chicken breasts.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buffalo-chicken/#wprm-recipe-31177-step-1-0"}, {"@type": "HowToStep", "text": "Preheat your grill to medium-high heat and lightly oil the grates. Grill the chicken for approximately 5 minutes per side, ensuring a firm sear develops.", "name": "Preheat your grill to medium-high heat and lightly oil the grates. Grill the chicken for approximately 5 minutes per side, ensuring a firm sear develops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buffalo-chicken/#wprm-recipe-31177-step-1-1"}, {"@type": "HowToStep", "text": "During the final grilling phase, brush Buffalo sauce onto the chicken and continue to grill until the internal temperature reaches 165°F. Baste with sauce intermittently while cooking.", "name": "During the final grilling phase, brush Buffalo sauce onto the chicken and continue to grill until the internal temperature reaches 165°F. Baste with sauce intermittently while cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buffalo-chicken/#wprm-recipe-31177-step-1-2"}]}, {"@type": "HowToSection", "name": "For the Chicken – Stove Top Method", "itemListElement": [{"@type": "HowToStep", "text": "Warm the olive oil in a large skillet over medium heat. Sear the seasoned chicken for 5 minutes per side.", "name": "Warm the olive oil in a large skillet over medium heat. Sear the seasoned chicken for 5 minutes per side.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buffalo-chicken/#wprm-recipe-31177-step-2-0"}, {"@type": "HowToStep", "text": "Lower the heat, drizzle 2 tablespoons of the Buffalo sauce over the chicken, cover the skillet, and continue cooking for an additional 5 minutes, or until the internal temperature registers at 165°F.", "name": "Lower the heat, drizzle 2 tablespoons of the Buffalo sauce over the chicken, cover the skillet, and continue cooking for an additional 5 minutes, or until the internal temperature registers at 165°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buffalo-chicken/#wprm-recipe-31177-step-2-1"}]}, {"@type": "HowToSection", "name": "Final Steps", "itemListElement": [{"@type": "HowToStep", "text": "Transfer the cooked chicken from the heat and allow it to rest for a couple of minutes. Liberally coat with the remaining Buffalo sauce.", "name": "Transfer the cooked chicken from the heat and allow it to rest for a couple of minutes. Liberally coat with the remaining Buffalo sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buffalo-chicken/#wprm-recipe-31177-step-3-0"}, {"@type": "HowToStep", "text": "Serve alongside blue cheese dip and crumbles for added richness and contrast.", "name": "Serve alongside blue cheese dip and crumbles for added richness and contrast.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buffalo-chicken/#wprm-recipe-31177-step-3-1"}]}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "buffalo chicken"}</script>
