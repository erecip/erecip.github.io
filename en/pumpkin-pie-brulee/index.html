    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Pie Brulee", "author": {"@type": "Person", "name": "BenDes"}, "description": "A richly spiced pumpkin pie finished with an elegant brûléed sugar crust, decorative cinnamon-sugar pastry leaves, and bourbon-vanilla whipped cream. Orange zest brightens the creamy pumpkin filling, while freshly grated nutmeg, mint, and additional citrus zest provide a refined finishing touch.", "datePublished": "2023-10-19T08:22:27+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/pumpkin-pie-brulee1.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/pumpkin-pie-brulee1.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/pumpkin-pie-brulee1.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/pumpkin-pie-brulee1.png"], "cookTime": "PT50M", "totalTime": "PT170M", "recipeIngredient": ["1  package prepared pie dough (containing 2 round pastry sheets)", "1  large egg", "1/2 teaspoon ground cinnamon", "1 tablespoon water", "1/4 cup granulated sugar", "2  large eggs", "1/2 teaspoon finely grated orange zest", "1  can (14 ounces sweetened condensed milk)", "1 tablespoon pumpkin spice blend (preferably freshly ground)", "1/2 teaspoon salt", "1  can (15 ounces pumpkin purée, such as Libby’s)", "1/2 cup granulated sugar", "1/2 teaspoon bourbon", "2 teaspoons powdered sugar", "1/2 cup cold heavy cream", "1/2 teaspoon vanilla bean paste", "Small fresh mint leaves", "Freshly grated nutmeg", "Additional orange zest"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 425°F (220°C).", "name": "Preheat the oven to 425°F (220°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-0"}, {"@type": "HowToStep", "text": "Unroll one round of pie dough and carefully fit it into a pie plate. Shape or flute the rim decoratively.", "name": "Unroll one round of pie dough and carefully fit it into a pie plate. Shape or flute the rim decoratively.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-1"}, {"@type": "HowToStep", "text": "Cut at least 35 small leaf shapes from the second sheet of pie dough using decorative pastry cutters.", "name": "Cut at least 35 small leaf shapes from the second sheet of pie dough using decorative pastry cutters.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-2"}, {"@type": "HowToStep", "text": "Combine the granulated sugar with the ground cinnamon in a small bowl until evenly blended.", "name": "Combine the granulated sugar with the ground cinnamon in a small bowl until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-3"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the egg together with 1 tablespoon of water to create an egg wash.", "name": "In a separate bowl, whisk the egg together with 1 tablespoon of water to create an egg wash.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-4"}, {"@type": "HowToStep", "text": "Lightly brush the pastry leaves with the egg wash, then dust their surfaces with the cinnamon-sugar mixture.", "name": "Lightly brush the pastry leaves with the egg wash, then dust their surfaces with the cinnamon-sugar mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-5"}, {"@type": "HowToStep", "text": "Brush a small amount of egg wash onto the reverse side of each leaf and arrange the leaves decoratively around the perimeter of the pie shell.", "name": "Brush a small amount of egg wash onto the reverse side of each leaf and arrange the leaves decoratively around the perimeter of the pie shell.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-6"}, {"@type": "HowToStep", "text": "Position small balls of aluminum foil underneath selected leaves to support them, creating dimension while helping prevent the pastry decorations from drooping during baking.", "name": "Position small balls of aluminum foil underneath selected leaves to support them, creating dimension while helping prevent the pastry decorations from drooping during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-7"}, {"@type": "HowToStep", "text": "Prick the bottom of the pastry shell several times with a fork. Transfer the prepared crust to the freezer while the pumpkin filling is made.", "name": "Prick the bottom of the pastry shell several times with a fork. Transfer the prepared crust to the freezer while the pumpkin filling is made.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-8"}, {"@type": "HowToStep", "text": "Place the pumpkin purée, pumpkin spice, finely grated orange zest, and salt in a large microwave-safe bowl and stir to combine.", "name": "Place the pumpkin purée, pumpkin spice, finely grated orange zest, and salt in a large microwave-safe bowl and stir to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-9"}, {"@type": "HowToStep", "text": "Microwave the pumpkin mixture for 1 minute. This brief heating period helps integrate the spices and lessen the characteristic canned flavor of the purée. Allow the mixture to cool afterward.", "name": "Microwave the pumpkin mixture for 1 minute. This brief heating period helps integrate the spices and lessen the characteristic canned flavor of the purée. Allow the mixture to cool afterward.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-10"}, {"@type": "HowToStep", "text": "Whisk the sweetened condensed milk and 2 eggs into the cooled pumpkin mixture until the filling is completely combined and smooth.", "name": "Whisk the sweetened condensed milk and 2 eggs into the cooled pumpkin mixture until the filling is completely combined and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-11"}, {"@type": "HowToStep", "text": "Pour the prepared pumpkin filling into the chilled pastry shell.", "name": "Pour the prepared pumpkin filling into the chilled pastry shell.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-12"}, {"@type": "HowToStep", "text": "Allow the filled pie to stand briefly so that trapped air bubbles can rise to the surface, helping produce a smoother finished top.", "name": "Allow the filled pie to stand briefly so that trapped air bubbles can rise to the surface, helping produce a smoother finished top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-13"}, {"@type": "HowToStep", "text": "Place the filled pie in the preheated 425°F (220°C) oven and bake for 15 minutes.", "name": "Place the filled pie in the preheated 425°F (220°C) oven and bake for 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-14"}, {"@type": "HowToStep", "text": "Reduce the oven temperature to 350°F (175°C) and continue baking for an additional 35–40 minutes. The filling should appear set around the edges while retaining a slight jiggle at the center.", "name": "Reduce the oven temperature to 350°F (175°C) and continue baking for an additional 35–40 minutes. The filling should appear set around the edges while retaining a slight jiggle at the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-15"}, {"@type": "HowToStep", "text": "If the cinnamon-sugar pastry leaves become overly browned, loosely protect the crust with aluminum foil or a silicone pie shield during approximately the final 10 minutes of baking.", "name": "If the cinnamon-sugar pastry leaves become overly browned, loosely protect the crust with aluminum foil or a silicone pie shield during approximately the final 10 minutes of baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-16"}, {"@type": "HowToStep", "text": "Remove the pie from the oven and leave it at room temperature for about 20 minutes.", "name": "Remove the pie from the oven and leave it at room temperature for about 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-17"}, {"@type": "HowToStep", "text": "Transfer the cooled pie to the refrigerator and chill for a minimum of 2 hours.", "name": "Transfer the cooled pie to the refrigerator and chill for a minimum of 2 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-18"}, {"@type": "HowToStep", "text": "Preheat the oven to 400°F (200°C). Line a baking sheet with parchment paper or a silicone baking mat.", "name": "Preheat the oven to 400°F (200°C). Line a baking sheet with parchment paper or a silicone baking mat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-19"}, {"@type": "HowToStep", "text": "Distribute the 1/2 cup granulated sugar across the prepared baking sheet in a thin, uniform layer.", "name": "Distribute the 1/2 cup granulated sugar across the prepared baking sheet in a thin, uniform layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-20"}, {"@type": "HowToStep", "text": "Bake for 12–15 minutes, or until the sugar has melted and developed a pale golden caramel color. Monitor it particularly closely after the 12-minute mark to prevent scorching.", "name": "Bake for 12–15 minutes, or until the sugar has melted and developed a pale golden caramel color. Monitor it particularly closely after the 12-minute mark to prevent scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-21"}, {"@type": "HowToStep", "text": "Let the caramelized sugar cool completely until firm and brittle.", "name": "Let the caramelized sugar cool completely until firm and brittle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-22"}, {"@type": "HowToStep", "text": "Break the hardened caramel into smaller shards, then process them in a food processor until finely ground.", "name": "Break the hardened caramel into smaller shards, then process them in a food processor until finely ground.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-23"}, {"@type": "HowToStep", "text": "Pour the cold heavy cream into a chilled mixing bowl and whisk until the cream begins to gain body.", "name": "Pour the cold heavy cream into a chilled mixing bowl and whisk until the cream begins to gain body.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-24"}, {"@type": "HowToStep", "text": "Add the powdered sugar and continue whisking until soft peaks develop.", "name": "Add the powdered sugar and continue whisking until soft peaks develop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-25"}, {"@type": "HowToStep", "text": "Gently fold in the vanilla bean paste and bourbon, mixing only until they are evenly incorporated.", "name": "Gently fold in the vanilla bean paste and bourbon, mixing only until they are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-26"}, {"@type": "HowToStep", "text": "Immediately before serving, scatter a thin and consistent coating of the finely ground caramelized sugar over the surface of the thoroughly chilled pumpkin pie.", "name": "Immediately before serving, scatter a thin and consistent coating of the finely ground caramelized sugar over the surface of the thoroughly chilled pumpkin pie.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-27"}, {"@type": "HowToStep", "text": "Use a kitchen torch to melt and caramelize the sugar until a crisp brûléed layer forms. Alternatively, place the pie beneath the broiler until the topping has melted and caramelized.", "name": "Use a kitchen torch to melt and caramelize the sugar until a crisp brûléed layer forms. Alternatively, place the pie beneath the broiler until the topping has melted and caramelized.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-28"}, {"@type": "HowToStep", "text": "When using the broiler, shield the pastry edges with aluminum foil to reduce the risk of scorching.", "name": "When using the broiler, shield the pastry edges with aluminum foil to reduce the risk of scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-29"}, {"@type": "HowToStep", "text": "Before slicing completely through the pie, lightly score or pre-cut the hardened brûlée surface. This helps minimize uncontrolled cracking of the caramel layer.", "name": "Before slicing completely through the pie, lightly score or pre-cut the hardened brûlée surface. This helps minimize uncontrolled cracking of the caramel layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-30"}, {"@type": "HowToStep", "text": "Serve each portion with a generous spoonful of bourbon-vanilla whipped cream.", "name": "Serve each portion with a generous spoonful of bourbon-vanilla whipped cream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-31"}, {"@type": "HowToStep", "text": "Finish the individual slices with freshly grated nutmeg, a small amount of additional orange zest, and fresh mint leaves.", "name": "Finish the individual slices with freshly grated nutmeg, a small amount of additional orange zest, and fresh mint leaves.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-32"}, {"@type": "HowToStep", "text": "Serve immediately so the cool, creamy pumpkin filling can be enjoyed against the freshly caramelized, crisp sugar topping.", "name": "Serve immediately so the cool, creamy pumpkin filling can be enjoyed against the freshly caramelized, crisp sugar topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-brulee/#wprm-recipe-45744-step-0-33"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Pie Brulee"}</script>
