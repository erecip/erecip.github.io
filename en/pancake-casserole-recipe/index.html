    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pancake Casserole Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A soft, oven-baked pancake casserole filled with fresh blueberries and finished with an optional dusting of powdered sugar. This simple breakfast bake delivers classic pancake flavor in an easy-to-slice casserole format.", "datePublished": "2020-12-10T08:05:54+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/pancake-casserole-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/pancake-casserole-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/pancake-casserole-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/pancake-casserole-recipe2.png"], "cookTime": "PT30M", "totalTime": "PT30M", "recipeIngredient": ["4 teaspoons baking powder", "1  large egg", "2 cups whole milk (preferably for a richer flavor and softer texture)", "¼ teaspoon fine salt", "2 tablespoons white granulated sugar", "¼ cup unsalted butter (melted and allowed to cool slightly)", "2 teaspoons pure vanilla extract", "¼ teaspoon baking soda", "2 cups all-purpose flour (with King Arthur all-purpose flour preferred for consistent results)", "2 tablespoons unsalted butter (reserved for coating the baking dish)", "2 cups fresh blueberries (rinsed and thoroughly patted dry)", "1 tablespoon confectioners' sugar (for optional finishing)", "1 teaspoon all-purpose flour"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F.", "name": "Preheat the oven to 350°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-0"}, {"@type": "HowToStep", "text": "Place the 2 tablespoons of unsalted butter in a 9 × 13-inch casserole dish. Transfer the dish to the warming oven and allow the butter to melt, which should require only a few minutes. Watch it carefully so the butter does not burn.", "name": "Place the 2 tablespoons of unsalted butter in a 9 × 13-inch casserole dish. Transfer the dish to the warming oven and allow the butter to melt, which should require only a few minutes. Watch it carefully so the butter does not burn.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-1"}, {"@type": "HowToStep", "text": "Meanwhile, melt the remaining ¼ cup of unsalted butter in the microwave without overheating it. Set it aside briefly so it can cool slightly before being incorporated into the batter.", "name": "Meanwhile, melt the remaining ¼ cup of unsalted butter in the microwave without overheating it. Set it aside briefly so it can cool slightly before being incorporated into the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-2"}, {"@type": "HowToStep", "text": "Add the 2 cups of all-purpose flour, baking powder, baking soda, salt, and granulated sugar to a large mixing bowl.", "name": "Add the 2 cups of all-purpose flour, baking powder, baking soda, salt, and granulated sugar to a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-3"}, {"@type": "HowToStep", "text": "Whisk thoroughly until the dry ingredients are evenly distributed.", "name": "Whisk thoroughly until the dry ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-4"}, {"@type": "HowToStep", "text": "Pour the slightly cooled melted butter, milk, egg, and vanilla extract into the center.", "name": "Pour the slightly cooled melted butter, milk, egg, and vanilla extract into the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-5"}, {"@type": "HowToStep", "text": "Whisk the ingredients together until a smooth batter forms and no visible lumps remain.", "name": "Whisk the ingredients together until a smooth batter forms and no visible lumps remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-6"}, {"@type": "HowToStep", "text": "While the butter in the casserole dish is melting, gently toss the blueberries with 1 teaspoon of all-purpose flour until the fruit is lightly and evenly coated. This coating helps the berries remain more evenly dispersed in the batter.", "name": "While the butter in the casserole dish is melting, gently toss the blueberries with 1 teaspoon of all-purpose flour until the fruit is lightly and evenly coated. This coating helps the berries remain more evenly dispersed in the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-7"}, {"@type": "HowToStep", "text": "Carefully take the casserole dish out of the oven once the butter has melted.", "name": "Carefully take the casserole dish out of the oven once the butter has melted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-8"}, {"@type": "HowToStep", "text": "Using a pastry brush, distribute the melted butter across the entire bottom and along the sides of the dish to reduce sticking.", "name": "Using a pastry brush, distribute the melted butter across the entire bottom and along the sides of the dish to reduce sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-9"}, {"@type": "HowToStep", "text": "Pour the prepared pancake batter into the buttered casserole dish.", "name": "Pour the prepared pancake batter into the buttered casserole dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-10"}, {"@type": "HowToStep", "text": "Scatter the flour-coated blueberries evenly across the surface of the batter.", "name": "Scatter the flour-coated blueberries evenly across the surface of the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-11"}, {"@type": "HowToStep", "text": "Return the casserole to the preheated oven and bake for 30 minutes, or until the surface is golden brown and a toothpick inserted into the center comes out clean.", "name": "Return the casserole to the preheated oven and bake for 30 minutes, or until the surface is golden brown and a toothpick inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-12"}, {"@type": "HowToStep", "text": "Remove the baked pancake casserole from the oven.", "name": "Remove the baked pancake casserole from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-13"}, {"@type": "HowToStep", "text": "If desired, lightly dust the surface with powdered sugar for additional sweetness.", "name": "If desired, lightly dust the surface with powdered sugar for additional sweetness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-14"}, {"@type": "HowToStep", "text": "Slice the casserole into smaller portions and serve with your preferred syrup.", "name": "Slice the casserole into smaller portions and serve with your preferred syrup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pancake-casserole-recipe/#wprm-recipe-43618-step-0-15"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Pancake Casserole Recipe"}</script>
