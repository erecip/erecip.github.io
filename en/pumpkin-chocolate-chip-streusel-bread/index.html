    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Chocolate Chip Streusel Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender pumpkin loaf warmly seasoned with pumpkin pie spice, sweetened with brown sugar and maple syrup, and studded with semi-sweet chocolate. A cinnamon-brown sugar streusel creates a crisp, buttery crumb topping that contrasts with the soft interior.", "datePublished": "2018-05-24T14:24:05+00:00", "image": ["https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/pumpkin-chocolate-chip-streusel-bread.png", "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/pumpkin-chocolate-chip-streusel-bread.png", "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/pumpkin-chocolate-chip-streusel-bread.png", "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/pumpkin-chocolate-chip-streusel-bread.png"], "cookTime": "PT55M", "totalTime": "PT70M", "recipeIngredient": ["1 teaspoon ground cinnamon", "2 tablespoons granulated white sugar", "3/4 cup all-purpose flour", "1/2 cup packed brown sugar", "1/2 cup softened plant-based butter", "3/4 cup semi-sweet chocolate chips or chopped semi-sweet chocolate", "2 tablespoons maple syrup", "1 teaspoon baking soda", "1 1/2 cups pumpkin purée", "2 teaspoons pumpkin pie spice", "1/2 teaspoon salt", "1/2 cup vegetable oil", "2 cups all-purpose flour", "1 teaspoon baking powder", "1/2 cup brown sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the oven and pan. Preheat the oven to 350°F (175°C). Lightly grease a 9 × 5-inch loaf pan, then line it with parchment paper, allowing approximately 2 inches of paper to extend beyond the edges for easier removal after baking.", "name": "Prepare the oven and pan. Preheat the oven to 350°F (175°C). Lightly grease a 9 × 5-inch loaf pan, then line it with parchment paper, allowing approximately 2 inches of paper to extend beyond the edges for easier removal after baking.", "url": "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/#wprm-recipe-44611-step-0-0"}, {"@type": "HowToStep", "text": "Prepare the streusel. Place the softened plant-based butter, flour, brown sugar, granulated sugar, and cinnamon in a small bowl. Work the ingredients together with a fork until a coarse, crumbly mixture forms. Refrigerate the streusel while preparing the pumpkin batter.", "name": "Prepare the streusel. Place the softened plant-based butter, flour, brown sugar, granulated sugar, and cinnamon in a small bowl. Work the ingredients together with a fork until a coarse, crumbly mixture forms. Refrigerate the streusel while preparing the pumpkin batter.", "url": "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/#wprm-recipe-44611-step-0-1"}, {"@type": "HowToStep", "text": "Mix the pumpkin base. In a large mixing bowl, beat the pumpkin purée with the vegetable oil, brown sugar, and maple syrup until the mixture is smooth and thoroughly combined.", "name": "Mix the pumpkin base. In a large mixing bowl, beat the pumpkin purée with the vegetable oil, brown sugar, and maple syrup until the mixture is smooth and thoroughly combined.", "url": "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/#wprm-recipe-44611-step-0-2"}, {"@type": "HowToStep", "text": "Add the dry ingredients. Sift the all-purpose flour, pumpkin pie spice, baking powder, baking soda, and salt directly into the pumpkin mixture. Stir only until the dry ingredients are incorporated, taking care not to overmix the batter.", "name": "Add the dry ingredients. Sift the all-purpose flour, pumpkin pie spice, baking powder, baking soda, and salt directly into the pumpkin mixture. Stir only until the dry ingredients are incorporated, taking care not to overmix the batter.", "url": "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/#wprm-recipe-44611-step-0-3"}, {"@type": "HowToStep", "text": "Fold in the chocolate. Gently incorporate the semi-sweet chocolate chips or pieces, distributing them evenly throughout the batter.", "name": "Fold in the chocolate. Gently incorporate the semi-sweet chocolate chips or pieces, distributing them evenly throughout the batter.", "url": "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/#wprm-recipe-44611-step-0-4"}, {"@type": "HowToStep", "text": "Assemble the loaf. Spoon the finished batter into the prepared 9 × 5-inch pan and level the surface with a spatula. Remove the chilled streusel from the refrigerator and scatter it evenly over the top. Press the crumbs down very lightly so they adhere to the batter.", "name": "Assemble the loaf. Spoon the finished batter into the prepared 9 × 5-inch pan and level the surface with a spatula. Remove the chilled streusel from the refrigerator and scatter it evenly over the top. Press the crumbs down very lightly so they adhere to the batter.", "url": "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/#wprm-recipe-44611-step-0-5"}, {"@type": "HowToStep", "text": "Bake. Place the loaf in the preheated oven and bake for 55–60 minutes. The bread is ready when the streusel is golden brown and a toothpick inserted into the center comes out clean.", "name": "Bake. Place the loaf in the preheated oven and bake for 55–60 minutes. The bread is ready when the streusel is golden brown and a toothpick inserted into the center comes out clean.", "url": "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/#wprm-recipe-44611-step-0-6"}, {"@type": "HowToStep", "text": "Cool. Remove the loaf from the oven and allow it to rest in the pan for 15 minutes. Using the parchment-paper overhang, carefully lift the bread from the pan and transfer it to a wire cooling rack. Allow it to finish cooling before slicing, or serve it slightly warm.", "name": "Cool. Remove the loaf from the oven and allow it to rest in the pan for 15 minutes. Using the parchment-paper overhang, carefully lift the bread from the pan and transfer it to a wire cooling rack. Allow it to finish cooling before slicing, or serve it slightly warm.", "url": "https://erecip.github.io/en/pumpkin-chocolate-chip-streusel-bread/#wprm-recipe-44611-step-0-7"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Pumpkin Chocolate Chip Streusel Bread"}</script>
