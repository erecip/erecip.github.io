    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Classic Meat Pie Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A homemade rendition of the classic Australian meat pie, featuring a buttery shortcrust base filled with tender, slow-cooked chunks of beef immersed in a savory gravy and topped with puff pastry. This recipe creates an authentic meat pie experience, perfect for a main meal or a special gathering.", "datePublished": "2024-04-17T11:19:27+00:00", "image": ["https://erecip.github.io/wp-content/uploads/2024/11/codifyformatter-70-1.png", "https://erecip.github.io/wp-content/uploads/2024/11/codifyformatter-70-1-500x400.png", "https://erecip.github.io/wp-content/uploads/2024/11/codifyformatter-70-1-500x375.png", "https://erecip.github.io/wp-content/uploads/2024/11/codifyformatter-70-1-480x270.png"], "prepTime": "PT40M", "cookTime": "PT220M", "totalTime": "PT500M", "recipeIngredient": ["1 1/2  batches homemade shortcrust pastry", "3  frozen shortcrust pastry sheets (thawed (300g/10oz))", "2  refrigerated pie crusts (US/Can)", "3  frozen puff pastry sheets (just thawed (300g/10oz) (Note 2))", "1  egg (lightly whisked)", "1.25 kg / 2.5 lbs beef chuck (cut into 2.5cm/1\" cubes (Note 3))", "1/2 tsp salt", "1/2 tsp pepper", "2-3 tbsp olive oil", "1  onion (diced)", "4  garlic cloves (minced)", "5 tbsp plain/all-purpose flour", "1 1/4 cups 315 ml low-sodium beef stock (Note 4)", "3 cups 750 ml dry, full-bodied red wine (Note 5)", "2 tbsp tomato paste", "1 tsp Worcestershire sauce", "2 tsp coarsely ground black pepper", "2  bay leaves"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the Filling: Season the beef chunks with 1/2 tsp of salt and pepper. In a large heavy-based pot, heat 1 tbsp of olive oil over high heat. Brown 1/3 of the beef until well caramelized on all sides, then remove from the pot. Repeat this process with the remaining beef, adding more oil if necessary.", "name": "Prepare the Filling: Season the beef chunks with 1/2 tsp of salt and pepper. In a large heavy-based pot, heat 1 tbsp of olive oil over high heat. Brown 1/3 of the beef until well caramelized on all sides, then remove from the pot. Repeat this process with the remaining beef, adding more oil if necessary.", "url": "https://erecip.github.io/en/classic-meat-pie-recipe/#wprm-recipe-23180-step-0-0"}, {"@type": "HowToStep", "text": "Reduce heat to medium-high, add the minced garlic and diced onion, and cook for 3 minutes until softened. Stir in the flour, then gradually pour in the beef stock, stirring constantly until the flour is dissolved. Add the red wine, tomato paste, Worcestershire sauce, black pepper, and bay leaves.", "name": "Reduce heat to medium-high, add the minced garlic and diced onion, and cook for 3 minutes until softened. Stir in the flour, then gradually pour in the beef stock, stirring constantly until the flour is dissolved. Add the red wine, tomato paste, Worcestershire sauce, black pepper, and bay leaves.", "url": "https://erecip.github.io/en/classic-meat-pie-recipe/#wprm-recipe-23180-step-0-1"}, {"@type": "HowToStep", "text": "Return the beef to the pot, cover, and adjust the heat to maintain a gentle simmer. Cook for 1 hour and 45 minutes. Remove the lid and continue to simmer for an additional 30 to 45 minutes, stirring occasionally, until the beef is tender and the liquid has reduced to a thick gravy that just covers the meat. Remove from heat, cover, and allow to cool. For best results, cool overnight.", "name": "Return the beef to the pot, cover, and adjust the heat to maintain a gentle simmer. Cook for 1 hour and 45 minutes. Remove the lid and continue to simmer for an additional 30 to 45 minutes, stirring occasionally, until the beef is tender and the liquid has reduced to a thick gravy that just covers the meat. Remove from heat, cover, and allow to cool. For best results, cool overnight.", "url": "https://erecip.github.io/en/classic-meat-pie-recipe/#wprm-recipe-23180-step-0-2"}, {"@type": "HowToStep", "text": "Prepare the Pastry: Preheat the oven to 180°C/350°F. Cut out 6 rounds from the shortcrust pastry and carefully drape them into pie tins without stretching the dough to avoid shrinkage (See Notes 1 &amp; 6). Place the pies on a baking tray, top each with large sheets of parchment paper, and fill with pie weights (Note 7). Bake for 20 minutes, then remove the weights using the overhanging paper and return the crusts to the oven for an additional 5 minutes, or until they are light golden and dry. You may skip this step if desired (Note 8).", "name": "Prepare the Pastry: Preheat the oven to 180°C/350°F. Cut out 6 rounds from the shortcrust pastry and carefully drape them into pie tins without stretching the dough to avoid shrinkage (See Notes 1 &amp; 6). Place the pies on a baking tray, top each with large sheets of parchment paper, and fill with pie weights (Note 7). Bake for 20 minutes, then remove the weights using the overhanging paper and return the crusts to the oven for an additional 5 minutes, or until they are light golden and dry. You may skip this step if desired (Note 8).", "url": "https://erecip.github.io/en/classic-meat-pie-recipe/#wprm-recipe-23180-step-0-3"}, {"@type": "HowToStep", "text": "Assemble the Pies: Fill each pie crust with the cooled filling, pressing down slightly to ensure they are filled generously. Cut rounds from the partially thawed puff pastry, slightly larger than the edges of the pie bases. Brush the edges of the pie crusts with the whisked egg, then place the puff pastry lids on top, pressing the edges to seal them together. Brush the tops with the remaining egg wash, and make a small 1 cm/0.5&quot; incision in the center of each pie lid.", "name": "Assemble the Pies: Fill each pie crust with the cooled filling, pressing down slightly to ensure they are filled generously. Cut rounds from the partially thawed puff pastry, slightly larger than the edges of the pie bases. Brush the edges of the pie crusts with the whisked egg, then place the puff pastry lids on top, pressing the edges to seal them together. Brush the tops with the remaining egg wash, and make a small 1 cm/0.5&quot; incision in the center of each pie lid.", "url": "https://erecip.github.io/en/classic-meat-pie-recipe/#wprm-recipe-23180-step-0-4"}, {"@type": "HowToStep", "text": "Bake for 30 minutes or until the tops are deeply golden and puffed. Serve hot, with tomato sauce or ketchup if desired.", "name": "Bake for 30 minutes or until the tops are deeply golden and puffed. Serve hot, with tomato sauce or ketchup if desired.", "url": "https://erecip.github.io/en/classic-meat-pie-recipe/#wprm-recipe-23180-step-0-5"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Australian"]}</script>
