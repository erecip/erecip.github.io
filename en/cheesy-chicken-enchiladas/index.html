 a roux.", "name": "In a medium saucepan over medium heat, melt the butter until it begins to turn a light golden hue. Add the flour and whisk continuously for 1 minute to form a roux.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-chicken-enchiladas/#wprm-recipe-31584-step-0-1"}, {"@type": "HowToStep", "text": "Gradually whisk in the chicken broth, followed by the sour cream and green chiles. Bring to a gentle simmer and cook until the mixture thickens slightly. Remove from heat.", "name": "Gradually whisk in the chicken broth, followed by the sour cream and green chiles. Bring to a gentle simmer and cook until the mixture thickens slightly. Remove from heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-chicken-enchiladas/#wprm-recipe-31584-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, combine the shredded rotisserie chicken with 1 cup of Monterey Jack cheese, ½ cup of the Mexican cheese blend, taco seasoning, and salt and pepper to taste. Stir well to blend.", "name": "In a separate bowl, combine the shredded rotisserie chicken with 1 cup of Monterey Jack cheese, ½ cup of the Mexican cheese blend, taco seasoning, and salt and pepper to taste. Stir well to blend.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-chicken-enchiladas/#wprm-recipe-31584-step-0-3"}, {"@type": "HowToStep", "text": "Wrap the tortillas in a clean kitchen towel and warm them in the microwave until pliable.", "name": "Wrap the tortillas in a clean kitchen towel and warm them in the microwave until pliable.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-chicken-enchiladas/#wprm-recipe-31584-step-0-4"}, {"@type": "HowToStep", "text": "Spread a thin layer of the prepared sauce over the bottom of the baking dish.", "name": "Spread a thin layer of the prepared sauce over the bottom of the baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-chicken-enchiladas/#wprm-recipe-31584-step-0-5"}, {"@type": "HowToStep", "text": "Distribute the chicken mixture evenly among the tortillas. Roll each one tightly and arrange seam-side down in the dish.", "name": "Distribute the chicken mixture evenly among the tortillas. Roll each one tightly and arrange seam-side down in the dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-chicken-enchiladas/#wprm-recipe-31584-step-0-6"}, {"@type": "HowToStep", "text": "Pour the remaining sauce evenly over the rolled enchiladas. Sprinkle with the remaining Monterey Jack and Mexican cheese blend.", "name": "Pour the remaining sauce evenly over the rolled enchiladas. Sprinkle with the remaining Monterey Jack and Mexican cheese blend.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-chicken-enchiladas/#wprm-recipe-31584-step-0-7"}, {"@type": "HowToStep", "text": "Bake uncovered for 20 to 25 minutes, or until the cheese is melted and the sauce is bubbly.", "name": "Bake uncovered for 20 to 25 minutes, or until the cheese is melted and the sauce is bubbly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-chicken-enchiladas/#wprm-recipe-31584-step-0-8"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Mexican-Inspired"], "keywords": "cheesy chicken enchiladas"}</script>
