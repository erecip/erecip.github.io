rtOf": {"@id": "https://easy-recipes322.github.io/easy-recipes323/#website"}, "breadcrumb": {"@id": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#breadcrumblist"}, "author": {"@id": "https://easy-recipes322.github.io/easy-recipes323/en/author/bendes/#author"}, "creator": {"@id": "https://easy-recipes322.github.io/easy-recipes323/en/author/bendes/#author"}, "image": {"@type": "ImageObject", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/julia-childs-eggs-benedict1.png", "@id": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#mainImage", "width": 1024, "height": 1024}, "primaryImageOfPage": {"@id": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#mainImage"}, "datePublished": "2018-09-15T00:06:38+02:00", "dateModified": "2026-08-30T03:41:56+02:00"}, {"@type": "WebSite", "@id": "https://easy-recipes322.github.io/easy-recipes323/#website", "url": "https://easy-recipes322.github.io/easy-recipes323/", "name": "Quick Recipes", "description": "Everyday Recipes", "inLanguage": "en-US", "publisher": {"@id": "https://easy-recipes322.github.io/easy-recipes323/#organization"}}]}</script>
    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Julia Childs Eggs Benedict", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic Eggs Benedict preparation featuring crisp, buttered brioche or thick-cut white bread layered with warmed Canadian bacon and delicately poached eggs, then finished with a rich homemade hollandaise sauce. The sauce is gently thickened over low heat and emulsified with soft butter for a smooth, luxurious texture.", "datePublished": "2018-09-15T00:06:38+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/julia-childs-eggs-benedict1.png", "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/julia-childs-eggs-benedict1.png", "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/julia-childs-eggs-benedict1.png", "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/julia-childs-eggs-benedict1.png"], "recipeIngredient": ["12  –16 tablespoons unsalted butter (softened thoroughly)", "1 tablespoon water", "Fine salt (as needed)", "3  large egg yolks", "Freshly ground white pepper (to taste)", "Cayenne pepper (optional, for a gentle touch of heat)", "1 tablespoon freshly squeezed lemon juice (plus a little extra if desired)", "2 tablespoons distilled white vinegar", "4  large (very fresh eggs, preferably about 3–5 days old)", "Enough water to reach a depth of 2–3 inches in a saucepan", "1 cup prepared hollandaise sauce", "Butter (as needed for spreading and warming the meat)", "4 slices brioche or thick-cut white bread", "Freshly ground black pepper (for finishing)", "4  warm poached eggs", "4  –8 slices Canadian bacon (or an equal amount of prosciutto, boiled ham, or cooked bacon)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Away from the heat, combine the 3 egg yolks, 1 tablespoon water, and 1 tablespoon fresh lemon juice in a saucepan. Whisk thoroughly until the mixture turns pale and develops a noticeably thick consistency.", "name": "Away from the heat, combine the 3 egg yolks, 1 tablespoon water, and 1 tablespoon fresh lemon juice in a saucepan. Whisk thoroughly until the mixture turns pale and develops a noticeably thick consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-0"}, {"@type": "HowToStep", "text": "Set the saucepan over moderately low heat. Whisk without stopping, carefully sweeping across the base and around the sides of the pan so the yolks cook evenly without setting too quickly.", "name": "Set the saucepan over moderately low heat. Whisk without stopping, carefully sweeping across the base and around the sides of the pan so the yolks cook evenly without setting too quickly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-1"}, {"@type": "HowToStep", "text": "Periodically lift the saucepan away from the heat when necessary to keep the eggs from scrambling. Continue whisking until the mixture becomes foamy and thick enough that the bottom of the saucepan briefly appears between the trails made by the whisk.", "name": "Periodically lift the saucepan away from the heat when necessary to keep the eggs from scrambling. Continue whisking until the mixture becomes foamy and thick enough that the bottom of the saucepan briefly appears between the trails made by the whisk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-2"}, {"@type": "HowToStep", "text": "Remove the pan from the heat. Begin incorporating the very soft unsalted butter one spoonful at a time, whisking continuously to establish a stable emulsion.", "name": "Remove the pan from the heat. Begin incorporating the very soft unsalted butter one spoonful at a time, whisking continuously to establish a stable emulsion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-3"}, {"@type": "HowToStep", "text": "Once the sauce begins to thicken successfully, gradually increase the amount of butter added with each addition. Continue until 12–16 tablespoons have been incorporated, stopping when the hollandaise reaches the preferred consistency.", "name": "Once the sauce begins to thicken successfully, gradually increase the amount of butter added with each addition. Continue until 12–16 tablespoons have been incorporated, stopping when the hollandaise reaches the preferred consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-4"}, {"@type": "HowToStep", "text": "Lightly season the finished sauce with salt and, if using, a small amount of cayenne pepper. Whisk until completely smooth.", "name": "Lightly season the finished sauce with salt and, if using, a small amount of cayenne pepper. Whisk until completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-5"}, {"@type": "HowToStep", "text": "Taste the hollandaise and adjust with freshly ground white pepper and additional lemon juice as desired. Keep the sauce lukewarm until assembly.", "name": "Taste the hollandaise and adjust with freshly ground white pepper and additional lemon juice as desired. Keep the sauce lukewarm until assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-6"}, {"@type": "HowToStep", "text": "Pour enough water into a saucepan to create a depth of 2–3 inches, then stir in the 2 tablespoons distilled white vinegar. Bring the water to a slow boil.", "name": "Pour enough water into a saucepan to create a depth of 2–3 inches, then stir in the 2 tablespoons distilled white vinegar. Bring the water to a slow boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-7"}, {"@type": "HowToStep", "text": "Crack each egg individually and carefully slip it into the water while holding the shell close to the surface. Because the eggs will lower the water temperature, adjust the heat as required to maintain a gentle simmer.", "name": "Crack each egg individually and carefully slip it into the water while holding the shell close to the surface. Because the eggs will lower the water temperature, adjust the heat as required to maintain a gentle simmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-8"}, {"@type": "HowToStep", "text": "After approximately 1 minute, use a slotted spoon to carefully loosen any eggs that have settled against the bottom of the saucepan.", "name": "After approximately 1 minute, use a slotted spoon to carefully loosen any eggs that have settled against the bottom of the saucepan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-9"}, {"@type": "HowToStep", "text": "Continue poaching for about 4 minutes. Leave the eggs in slightly longer when a firmer yolk is preferred.", "name": "Continue poaching for about 4 minutes. Leave the eggs in slightly longer when a firmer yolk is preferred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-10"}, {"@type": "HowToStep", "text": "Lift the eggs from the saucepan and briefly place them in a bowl of warm water to remove the vinegar residue. Transfer them to a clean towel and allow excess moisture to drain. Doneness may be checked by gently pressing the set whites and the yolk.", "name": "Lift the eggs from the saucepan and briefly place them in a bowl of warm water to remove the vinegar residue. Transfer them to a clean towel and allow excess moisture to drain. Doneness may be checked by gently pressing the set whites and the yolk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-11"}, {"@type": "HowToStep", "text": "Place the Canadian bacon, prosciutto, boiled ham, or cooked bacon in a frying pan over medium heat. Add a small amount of butter and warm the meat until heated through.", "name": "Place the Canadian bacon, prosciutto, boiled ham, or cooked bacon in a frying pan over medium heat. Add a small amount of butter and warm the meat until heated through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-12"}, {"@type": "HowToStep", "text": "Arrange one slice of toasted, buttered bread on each serving plate. Layer the warmed meat over the bread, then position one warm poached egg on top.", "name": "Arrange one slice of toasted, buttered bread on each serving plate. Layer the warmed meat over the bread, then position one warm poached egg on top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-13"}, {"@type": "HowToStep", "text": "Spoon a generous portion of hollandaise sauce over each egg. Finish with freshly ground black pepper and serve immediately while the bread, meat, eggs, and sauce are warm.", "name": "Spoon a generous portion of hollandaise sauce over each egg. Finish with freshly ground black pepper and serve immediately while the bread, meat, eggs, and sauce are warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/julia-childs-eggs-benedict/#wprm-recipe-45189-step-0-14"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Julia Childs Eggs Benedict"}</script>
