    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chilli Chicken", "author": {"@type": "Person", "name": "BenDes"}, "description": "A popular Indo-Chinese delicacy featuring golden, crispy pieces of chicken coated in a bold, tangy-sweet, and spicy sauce. This dish serves beautifully as a starter or as a side with noodles or fried rice.", "datePublished": "2023-07-08T23:25:04+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/chicken-chili.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/chicken-chili.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/chicken-chili.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/chicken-chili.png"], "prepTime": "PT20M", "cookTime": "PT30M", "totalTime": "PT50M", "recipeIngredient": ["Around ¼ cup cooking oil (or more, as needed, for frying)", "2 to 3 tablespoons cornstarch (white corn flour, preferably organic)", "1  egg white or approximately 2 tablespoons water (as required for binding)", "1½ tablespoons all-purpose flour (optional; preferably organic)", "250 grams ½ pound chicken breast, boneless and diced into bite-sized cubes", "⅛ teaspoon fine salt (or to preference)", "¼ teaspoon coarsely ground black pepper", "1½ teaspoons red chili sauce (choose a mild sweet-spicy version)", "¼ teaspoon Kashmiri red chili powder or red chili paste (optional)", "1½ teaspoons naturally fermented soy sauce", "½ teaspoon red chili powder or paprika (optional, for hue and heat)", "1 tablespoon naturally brewed soy sauce", "2 to 3 tablespoons water (adjust for sauce consistency)", "2 tablespoons tangy tomato ketchup (adjust according to brand and taste)", "¾ to 1 teaspoon apple cider vinegar or rice vinegar", "2 tablespoons sweet and spicy red chili sauce (adjust to desired heat)", "¼ teaspoon black pepper (freshly ground)", "½ to 1 teaspoon white sugar", "¼ to ½ cup bell pepper (capsicum, cubed)", "1  medium onion (cut into petals or cubes)", "1 tablespoon finely minced garlic", "1½ tablespoons neutral oil", "1 to 2  green chilies (slit and deseeded (optional))", "1  stalk spring onion (scallion, chopped (optional))", "1 to 3 tablespoons spring onion greens (for garnish)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Cut the chicken into small, uniform pieces, approximately 1 inch by ½ inch. Place them in a mixing bowl.", "name": "Cut the chicken into small, uniform pieces, approximately 1 inch by ½ inch. Place them in a mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-0"}, {"@type": "HowToStep", "text": "Add the soy sauce, chili sauce, black pepper, chili powder (if using), salt, cornstarch, and all-purpose flour. Mix thoroughly.", "name": "Add the soy sauce, chili sauce, black pepper, chili powder (if using), salt, cornstarch, and all-purpose flour. Mix thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-1"}, {"@type": "HowToStep", "text": "Incorporate the egg white or a few spoonfuls of water gradually, just enough to bind the dry ingredients with the chicken. Mix until evenly coated. Set aside to marinate while preparing the remaining components. Refrigeration overnight is optional.", "name": "Incorporate the egg white or a few spoonfuls of water gradually, just enough to bind the dry ingredients with the chicken. Mix until evenly coated. Set aside to marinate while preparing the remaining components. Refrigeration overnight is optional.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-2"}, {"@type": "HowToStep", "text": "Prepare the vegetables by cubing the onion and bell pepper. Separate the onion layers. Slit the green chilies lengthwise and set aside.", "name": "Prepare the vegetables by cubing the onion and bell pepper. Separate the onion layers. Slit the green chilies lengthwise and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-3"}, {"@type": "HowToStep", "text": "In a small bowl, combine soy sauce, chili sauce, ketchup, red chili powder (if using), vinegar, sugar, and water to form the sauce base. Stir until smooth and set aside.", "name": "In a small bowl, combine soy sauce, chili sauce, ketchup, red chili powder (if using), vinegar, sugar, and water to form the sauce base. Stir until smooth and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-4"}, {"@type": "HowToStep", "text": "Heat approximately one inch of oil in a frying pan over medium heat. To check readiness, drop a small amount of batter into the oil—it should sizzle and rise steadily without excessive browning.", "name": "Heat approximately one inch of oil in a frying pan over medium heat. To check readiness, drop a small amount of batter into the oil—it should sizzle and rise steadily without excessive browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-5"}, {"@type": "HowToStep", "text": "Gently slide in the chicken pieces one by one, taking care not to overcrowd the pan.", "name": "Gently slide in the chicken pieces one by one, taking care not to overcrowd the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-6"}, {"@type": "HowToStep", "text": "Fry over medium-high heat, turning occasionally, until the chicken becomes golden, crisp, and cooked through. Avoid overcooking to retain juiciness.", "name": "Fry over medium-high heat, turning occasionally, until the chicken becomes golden, crisp, and cooked through. Avoid overcooking to retain juiciness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-7"}, {"@type": "HowToStep", "text": "Once cooked, remove the chicken and let excess oil drain on a paper towel or wire rack. For added crispness, you may re-fry briefly over medium heat.", "name": "Once cooked, remove the chicken and let excess oil drain on a paper towel or wire rack. For added crispness, you may re-fry briefly over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-8"}, {"@type": "HowToStep", "text": "In a separate wok or pan, heat the oil on high flame. Add the chopped garlic and sauté for about one minute until fragrant.", "name": "In a separate wok or pan, heat the oil on high flame. Add the chopped garlic and sauté for about one minute until fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-9"}, {"@type": "HowToStep", "text": "Add the onions, capsicum, green chilies, and white parts of the spring onions. Stir-fry for about a minute until slightly softened but still crunchy.", "name": "Add the onions, capsicum, green chilies, and white parts of the spring onions. Stir-fry for about a minute until slightly softened but still crunchy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-10"}, {"@type": "HowToStep", "text": "Pour the prepared sauce mixture into the wok. Let it bubble and slightly thicken. Taste and adjust seasoning or spice levels as desired.", "name": "Pour the prepared sauce mixture into the wok. Let it bubble and slightly thicken. Taste and adjust seasoning or spice levels as desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-11"}, {"@type": "HowToStep", "text": "Toss in the fried chicken and stir well to coat every piece thoroughly with the sauce. Continue to stir-fry over high heat for one minute.", "name": "Toss in the fried chicken and stir well to coat every piece thoroughly with the sauce. Continue to stir-fry over high heat for one minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-12"}, {"@type": "HowToStep", "text": "Finish by sprinkling a pinch of black pepper and garnishing with chopped spring onion greens. Serve hot as a standalone appetizer or as an accompaniment to fried rice or stir-fried noodles.", "name": "Finish by sprinkling a pinch of black pepper and garnishing with chopped spring onion greens. Serve hot as a standalone appetizer or as an accompaniment to fried rice or stir-fried noodles.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-chili/#wprm-recipe-32677-step-0-13"}], "recipeCategory": ["Appetizer", "Main Course"], "recipeCuisine": ["Chinese"], "keywords": "chicken chili"}</script>
