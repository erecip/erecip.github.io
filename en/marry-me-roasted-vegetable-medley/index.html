    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Marry Me Roasted Vegetable Medley", "author": {"@type": "Person", "name": "BenDes"}, "description": "Marry Me Roasted Vegetable Medley combines caramelized oven-roasted vegetables with a rich, velvety sauce made from sun-dried tomatoes, garlic, cream, Parmesan, herbs, and a touch of balsamic vinegar. Fresh basil added at the end provides a fragrant contrast to the creamy, savory finish.", "datePublished": "2021-04-30T18:40:36+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/marry-me-roasted-vegetable-medley2.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/marry-me-roasted-vegetable-medley2-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/marry-me-roasted-vegetable-medley2-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/marry-me-roasted-vegetable-medley2-480x270.png"], "prepTime": "PT10M", "cookTime": "PT30M", "totalTime": "PT40M", "recipeIngredient": ["1/2  medium red onion (cut roughly into 1-inch chunks)", "2 cups cauliflower (separated into bite-size pieces)", "1/2 teaspoon fine salt", "1  bell pepper of any color (cut into slices)", "2 tablespoons olive oil (preferably extra-virgin)", "1/2 teaspoon ground black pepper", "1 cup carrots (sliced into 1/2-inch-thick rounds)", "1/2 cup chopped sun-dried tomatoes", "3  garlic cloves (finely minced)", "1/3 cup freshly chopped basil", "1 teaspoon Italian seasoning blend", "1 cup heavy cream", "1/4 teaspoon ground black pepper", "2 tablespoons unsalted butter", "1/3 cup shredded Parmesan cheese", "1 teaspoon balsamic vinegar", "1/2 teaspoon crushed red pepper flakes (or adjusted to the preferred heat level)", "1/2 cup vegetable broth"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F (200°C).", "name": "Preheat the oven to 400°F (200°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-0"}, {"@type": "HowToStep", "text": "Place the cauliflower, carrot rounds, bell pepper slices, and red onion pieces on a large baking sheet. Drizzle with the olive oil, then season with 1/2 teaspoon salt and 1/2 teaspoon black pepper. Toss thoroughly so the vegetables are evenly coated.", "name": "Place the cauliflower, carrot rounds, bell pepper slices, and red onion pieces on a large baking sheet. Drizzle with the olive oil, then season with 1/2 teaspoon salt and 1/2 teaspoon black pepper. Toss thoroughly so the vegetables are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-1"}, {"@type": "HowToStep", "text": "Arrange the vegetables in an even layer and roast for 25 minutes, stirring them once halfway through the cooking time. Continue roasting until they are tender and lightly golden around the edges.", "name": "Arrange the vegetables in an even layer and roast for 25 minutes, stirring them once halfway through the cooking time. Continue roasting until they are tender and lightly golden around the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-2"}, {"@type": "HowToStep", "text": "While the vegetables roast, melt the butter in a large skillet or pan over medium heat.", "name": "While the vegetables roast, melt the butter in a large skillet or pan over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-3"}, {"@type": "HowToStep", "text": "Add the finely minced garlic and crushed red pepper flakes. Cook for approximately 1 minute, stirring frequently, until aromatic. Avoid allowing the garlic to brown.", "name": "Add the finely minced garlic and crushed red pepper flakes. Cook for approximately 1 minute, stirring frequently, until aromatic. Avoid allowing the garlic to brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-4"}, {"@type": "HowToStep", "text": "Stir in the chopped sun-dried tomatoes. Pour in the heavy cream and vegetable broth, mixing until evenly incorporated.", "name": "Stir in the chopped sun-dried tomatoes. Pour in the heavy cream and vegetable broth, mixing until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-5"}, {"@type": "HowToStep", "text": "Bring the sauce to a gentle simmer and cook for approximately 3 minutes, allowing the ingredients and flavors to combine.", "name": "Bring the sauce to a gentle simmer and cook for approximately 3 minutes, allowing the ingredients and flavors to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-6"}, {"@type": "HowToStep", "text": "Add the shredded Parmesan, Italian seasoning, and remaining 1/4 teaspoon black pepper to the simmering cream mixture.", "name": "Add the shredded Parmesan, Italian seasoning, and remaining 1/4 teaspoon black pepper to the simmering cream mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-7"}, {"@type": "HowToStep", "text": "Stir in the balsamic vinegar and continue cooking for about 1 minute, or until the Parmesan has melted completely and the sauce is smooth and slightly thickened.", "name": "Stir in the balsamic vinegar and continue cooking for about 1 minute, or until the Parmesan has melted completely and the sauce is smooth and slightly thickened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the roasted vegetables directly into the prepared creamy sun-dried tomato sauce.", "name": "Transfer the roasted vegetables directly into the prepared creamy sun-dried tomato sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-9"}, {"@type": "HowToStep", "text": "Gently toss until every piece is thoroughly coated. Allow the mixture to simmer together for approximately 2 minutes, giving the roasted vegetables time to absorb some of the sauce's flavor.", "name": "Gently toss until every piece is thoroughly coated. Allow the mixture to simmer together for approximately 2 minutes, giving the roasted vegetables time to absorb some of the sauce's flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-10"}, {"@type": "HowToStep", "text": "Immediately before serving, fold the 1/3 cup chopped fresh basil into the creamy vegetable mixture.", "name": "Immediately before serving, fold the 1/3 cup chopped fresh basil into the creamy vegetable mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-11"}, {"@type": "HowToStep", "text": "Serve the roasted vegetable medley while hot.", "name": "Serve the roasted vegetable medley while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-roasted-vegetable-medley/#wprm-recipe-41757-step-0-12"}], "recipeCuisine": ["American"], "keywords": "Marry Me Roasted Vegetable Medley"}</script>
