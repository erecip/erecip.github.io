n cooking.", "url": "https://erecip.github.io/en/baked-chicken-breasts-recipe/#wprm-recipe-25644-step-0-1"}, {"@type": "HowToStep", "text": "Combine all the seasoning ingredients in a small bowl.", "name": "Combine all the seasoning ingredients in a small bowl.", "url": "https://erecip.github.io/en/baked-chicken-breasts-recipe/#wprm-recipe-25644-step-0-2"}, {"@type": "HowToStep", "text": "Line a baking tray with foil and a sheet of parchment paper. Position the chicken breasts smooth side down on the tray. Drizzle with 1 teaspoon of olive oil, then use your fingers to coat the surface evenly. Distribute half of the seasoning blend across the exposed side.", "name": "Line a baking tray with foil and a sheet of parchment paper. Position the chicken breasts smooth side down on the tray. Drizzle with 1 teaspoon of olive oil, then use your fingers to coat the surface evenly. Distribute half of the seasoning blend across the exposed side.", "url": "https://erecip.github.io/en/baked-chicken-breasts-recipe/#wprm-recipe-25644-step-0-3"}, {"@type": "HowToStep", "text": "Turn the chicken over. Drizzle the remaining olive oil and again use your fingers to rub it in. Apply the rest of the seasoning, ensuring complete coverage.", "name": "Turn the chicken over. Drizzle the remaining olive oil and again use your fingers to rub it in. Apply the rest of the seasoning, ensuring complete coverage.", "url": "https://erecip.github.io/en/baked-chicken-breasts-recipe/#wprm-recipe-25644-step-0-4"}, {"@type": "HowToStep", "text": "Place the tray in the oven and bake for 18 minutes, or until the surface is golden and a thermometer inserted into the thickest part reads 165°F (75°C).", "name": "Place the tray in the oven and bake for 18 minutes, or until the surface is golden and a thermometer inserted into the thickest part reads 165°F (75°C).", "url": "https://erecip.github.io/en/baked-chicken-breasts-recipe/#wprm-recipe-25644-step-0-5"}, {"@type": "HowToStep", "text": "Once done, remove the
