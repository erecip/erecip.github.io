    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Pie Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender, spiced cream cheese cookie surrounds a smooth pumpkin custard center, creating a dessert that combines the flavor of pumpkin pie with the convenience of an individual cookie. A coating of coarse sugar adds a crisp, sparkling finish, while whipped cream may be added after cooling for a festive presentation.", "datePublished": "2019-05-06T01:10:29+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/pumpkin-pie-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/pumpkin-pie-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/pumpkin-pie-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/pumpkin-pie-cookies2.png"], "cookTime": "PT14M", "totalTime": "PT14M", "recipeIngredient": ["6 ounces unsalted butter (softened to room temperature, ideally around 70°F)", "2 2/3 cups all-purpose flour", "1/3 cup coarse-grain sugar (reserved for coating the dough balls)", "1  large egg yolk (brought to room temperature)", "1 tablespoon pumpkin pie spice", "3 ounces cream cheese (softened to room temperature)", "1/2 cup firmly packed brown sugar", "1 teaspoon pure vanilla extract", "1/2 teaspoon salt", "1/2 cup white granulated sugar", "1/4 cup whole milk", "1/2 teaspoon pumpkin pie spice", "1  large egg (preferably at room temperature)", "1/2 cup pure pumpkin purée (not prepared pumpkin pie filling)", "A small pinch of table salt", "1/4 teaspoon vanilla extract", "1/4 cup brown sugar", "Whipped cream (as desired)", "Pumpkin pie spice or cinnamon (for a light finishing sprinkle if desired)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 350°F (175°C). Cover a cookie sheet with parchment paper.", "name": "Heat the oven to 350°F (175°C). Cover a cookie sheet with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-0"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk together the 2 2/3 cups all-purpose flour, 1 tablespoon pumpkin pie spice, and 1/2 teaspoon salt until evenly distributed. Place the mixture aside.", "name": "In a separate bowl, whisk together the 2 2/3 cups all-purpose flour, 1 tablespoon pumpkin pie spice, and 1/2 teaspoon salt until evenly distributed. Place the mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-1"}, {"@type": "HowToStep", "text": "Place the softened cream cheese, unsalted butter, granulated sugar, and packed brown sugar in a large mixing bowl. Beat at medium-high speed for approximately 3 minutes, or until the mixture becomes light and fluffy.", "name": "Place the softened cream cheese, unsalted butter, granulated sugar, and packed brown sugar in a large mixing bowl. Beat at medium-high speed for approximately 3 minutes, or until the mixture becomes light and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-2"}, {"@type": "HowToStep", "text": "Scrape along the sides and bottom of the bowl, then mix again briefly so the ingredients are evenly blended.", "name": "Scrape along the sides and bottom of the bowl, then mix again briefly so the ingredients are evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-3"}, {"@type": "HowToStep", "text": "Add the egg yolk and vanilla extract, beating until fully incorporated.", "name": "Add the egg yolk and vanilla extract, beating until fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-4"}, {"@type": "HowToStep", "text": "Add the reserved flour mixture in three separate additions, scraping the bowl between additions when necessary. Once combined, fold the dough several times with a spatula to eliminate any remaining pockets of dry flour. The finished dough should be thick.", "name": "Add the reserved flour mixture in three separate additions, scraping the bowl between additions when necessary. Once combined, fold the dough several times with a spatula to eliminate any remaining pockets of dry flour. The finished dough should be thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-5"}, {"@type": "HowToStep", "text": "In a medium bowl, combine the whole egg, brown sugar, table salt, pumpkin pie spice, whole milk, pumpkin purée, and vanilla extract.", "name": "In a medium bowl, combine the whole egg, brown sugar, table salt, pumpkin pie spice, whole milk, pumpkin purée, and vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-6"}, {"@type": "HowToStep", "text": "Whisk thoroughly until the mixture is uniform and smooth. Set the pumpkin filling aside while shaping the cookies.", "name": "Whisk thoroughly until the mixture is uniform and smooth. Set the pumpkin filling aside while shaping the cookies.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-7"}, {"@type": "HowToStep", "text": "Portion the cookie dough into 2-tablespoon amounts, approximately 36 grams each, and roll every portion into a ball.", "name": "Portion the cookie dough into 2-tablespoon amounts, approximately 36 grams each, and roll every portion into a ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-8"}, {"@type": "HowToStep", "text": "Coat each dough ball evenly in the coarse sugar, then place the balls on the parchment-lined cookie sheet with approximately 2 inches of space between them.", "name": "Coat each dough ball evenly in the coarse sugar, then place the balls on the parchment-lined cookie sheet with approximately 2 inches of space between them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-9"}, {"@type": "HowToStep", "text": "Use a 1-tablespoon measuring spoon to carefully press an indentation into the center of each dough ball.", "name": "Use a 1-tablespoon measuring spoon to carefully press an indentation into the center of each dough ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-10"}, {"@type": "HowToStep", "text": "Spoon 1 tablespoon of pumpkin filling into each prepared well.", "name": "Spoon 1 tablespoon of pumpkin filling into each prepared well.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-11"}, {"@type": "HowToStep", "text": "Bake the filled cookies for 14–17 minutes, until they are set and their bottoms have developed a pale golden-brown color.", "name": "Bake the filled cookies for 14–17 minutes, until they are set and their bottoms have developed a pale golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-12"}, {"@type": "HowToStep", "text": "Remove the cookies from the oven and transfer them to a wire cooling rack. Allow them to cool completely.", "name": "Remove the cookies from the oven and transfer them to a wire cooling rack. Allow them to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-13"}, {"@type": "HowToStep", "text": "If additional dough remains, repeat the shaping, coating, filling, and baking procedure. Allow the cookie sheet to cool before preparing each subsequent batch.", "name": "If additional dough remains, repeat the shaping, coating, filling, and baking procedure. Allow the cookie sheet to cool before preparing each subsequent batch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-14"}, {"@type": "HowToStep", "text": "After the cookies have cooled completely, add a piped swirl or small dollop of whipped cream, if desired.", "name": "After the cookies have cooled completely, add a piped swirl or small dollop of whipped cream, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-15"}, {"@type": "HowToStep", "text": "For an optional finishing touch, lightly dust the whipped cream with pumpkin pie spice or cinnamon before serving.", "name": "For an optional finishing touch, lightly dust the whipped cream with pumpkin pie spice or cinnamon before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-cookies/#wprm-recipe-43916-step-0-16"}], "recipeCategory": ["Cookies", "Dessert"], "keywords": "Pumpkin Pie Cookies"}</script>
