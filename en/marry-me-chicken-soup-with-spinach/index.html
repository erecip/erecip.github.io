 into the broth. Allow the soup to continue simmering gently until it develops a slightly thicker, creamy consistency.", "name": "Turn the heat to low. Add the softened cream cheese and half-and-half, stirring gently until the cream cheese has completely dissolved into the broth. Allow the soup to continue simmering gently until it develops a slightly thicker, creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup-with-spinach/#wprm-recipe-45272-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the pulled rotisserie chicken, grated Parmesan, and baby spinach. Cover the pot and cook for another 1 to 2 minutes, or just until the spinach has wilted and the chicken is thoroughly warmed.", "name": "Stir in the pulled rotisserie chicken, grated Parmesan, and baby spinach. Cover the pot and cook for another 1 to 2 minutes, or just until the spinach has wilted and the chicken is thoroughly warmed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup-with-spinach/#wprm-recipe-45272-step-0-4"}, {"@type": "HowToStep", "text": "Taste the finished soup and season with salt and freshly ground black pepper as needed. Ladle into bowls and serve while hot, adding extra grated Parmesan on top if desired.", "name": "Taste the finished soup and season with salt and freshly ground black pepper as needed. Ladle into bowls and serve while hot, adding extra grated Parmesan on top if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup-with-spinach/#wprm-recipe-45272-step-0-5"}], "recipeCategory": ["Soup"], "recipeCuisine": ["American"], "keywords": "Marry Me Chicken Soup with Spinach"}</script>
