    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Fig Bars", "author": {"@type": "Person", "name": "BenDes"}, "description": "These fig bars feature a rich filling made from simmered fresh figs, layered between a buttery oat crust and a golden crumble topping. The soft, fruit-forward center contrasts with the pleasantly crisp base for a rustic dessert that slices neatly once fully cooled.", "datePublished": "2019-12-27T20:45:41+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/fig-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/fig-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/fig-bars.png", "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/fig-bars.png"], "cookTime": "PT30M", "totalTime": "PT75M", "recipeIngredient": ["1 tablespoon finely grated lemon peel", "1 teaspoon pure vanilla extract", "24  small or medium fresh figs (approximately 720 grams, quartered)", "1/4 teaspoon kosher salt", "1/3 cup firmly packed brown sugar", "3/4 teaspoon baking powder", "2 teaspoons pure vanilla extract", "2 cups old-fashioned rolled oats (approximately 178 grams)", "1 cup unsalted butter (melted, approximately 226 grams)", "1/2 teaspoon salt", "1 cup packed brown sugar (approximately 213 grams)", "2 cups all-purpose flour (approximately 240 grams)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the quartered figs in a medium, heavy-bottomed saucepan. Add the packed brown sugar, grated lemon peel, kosher salt, and vanilla extract, then stir to combine.", "name": "Place the quartered figs in a medium, heavy-bottomed saucepan. Add the packed brown sugar, grated lemon peel, kosher salt, and vanilla extract, then stir to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-0"}, {"@type": "HowToStep", "text": "Set the saucepan over medium heat. Cook until the figs begin releasing their liquid and the mixture reaches a gentle boil.", "name": "Set the saucepan over medium heat. Cook until the figs begin releasing their liquid and the mixture reaches a gentle boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-1"}, {"@type": "HowToStep", "text": "Lower the heat and allow the fruit mixture to simmer for 45 minutes. Stir periodically, using the back of a wooden spoon to crush any particularly large pieces of fig.", "name": "Lower the heat and allow the fruit mixture to simmer for 45 minutes. Stir periodically, using the back of a wooden spoon to crush any particularly large pieces of fig.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-2"}, {"@type": "HowToStep", "text": "When the filling has thickened and the figs are tender, remove the saucepan from the heat and leave the mixture to cool.", "name": "When the filling has thickened and the figs are tender, remove the saucepan from the heat and leave the mixture to cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-3"}, {"@type": "HowToStep", "text": "For a more uniform filling, process the cooled mixture with an immersion blender, countertop blender, or food processor. Alternatively, retain a few pieces of fruit for a chunkier, rustic consistency.", "name": "For a more uniform filling, process the cooled mixture with an immersion blender, countertop blender, or food processor. Alternatively, retain a few pieces of fruit for a chunkier, rustic consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-5"}, {"@type": "HowToStep", "text": "Line a 9 × 13-inch baking pan with aluminum foil, leaving enough excess foil over the sides to serve as handles when removing the baked bars. Lightly coat the foil with cooking spray.", "name": "Line a 9 × 13-inch baking pan with aluminum foil, leaving enough excess foil over the sides to serve as handles when removing the baked bars. Lightly coat the foil with cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-6"}, {"@type": "HowToStep", "text": "Place the unsalted butter in a large microwave-safe mixing bowl and melt it completely.", "name": "Place the unsalted butter in a large microwave-safe mixing bowl and melt it completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-7"}, {"@type": "HowToStep", "text": "Add the rolled oats, all-purpose flour, packed brown sugar, baking powder, salt, and vanilla extract to the melted butter.", "name": "Add the rolled oats, all-purpose flour, packed brown sugar, baking powder, salt, and vanilla extract to the melted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-8"}, {"@type": "HowToStep", "text": "Mix until the ingredients are thoroughly incorporated and no visible patches of dry flour remain. The finished mixture should have a dense, crumbly consistency. Use clean hands to complete the mixing process when necessary.", "name": "Mix until the ingredients are thoroughly incorporated and no visible patches of dry flour remain. The finished mixture should have a dense, crumbly consistency. Use clean hands to complete the mixing process when necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-9"}, {"@type": "HowToStep", "text": "For a deeper oat flavor, the rolled oats may be lightly toasted in a dry skillet before they are incorporated into the crust mixture.", "name": "For a deeper oat flavor, the rolled oats may be lightly toasted in a dry skillet before they are incorporated into the crust mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-10"}, {"@type": "HowToStep", "text": "Transfer the remaining oat mixture to the prepared baking pan. Press it firmly and evenly across the bottom, using your hands or the flat base of a drinking glass to create a compact crust.", "name": "Transfer the remaining oat mixture to the prepared baking pan. Press it firmly and evenly across the bottom, using your hands or the flat base of a drinking glass to create a compact crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-11"}, {"@type": "HowToStep", "text": "Spoon the cooled fig filling over the crust and spread it into an even layer that reaches the edges.", "name": "Spoon the cooled fig filling over the crust and spread it into an even layer that reaches the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-12"}, {"@type": "HowToStep", "text": "Scatter the reserved oat mixture across the fig filling. Distribute the crumbs evenly while allowing small portions of the fruit layer to remain visible.", "name": "Scatter the reserved oat mixture across the fig filling. Distribute the crumbs evenly while allowing small portions of the fruit layer to remain visible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-13"}, {"@type": "HowToStep", "text": "Bake the assembled bars at 350°F (175°C) for 30–35 minutes. The bars are ready when the fig filling is bubbling and the oat topping has developed a golden-brown color.", "name": "Bake the assembled bars at 350°F (175°C) for 30–35 minutes. The bars are ready when the fig filling is bubbling and the oat topping has developed a golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-14"}, {"@type": "HowToStep", "text": "Allow the bars to cool completely in the baking pan.", "name": "Allow the bars to cool completely in the baking pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-15"}, {"@type": "HowToStep", "text": "After cooling, grasp the overhanging foil and carefully lift the entire slab from the pan.", "name": "After cooling, grasp the overhanging foil and carefully lift the entire slab from the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-16"}, {"@type": "HowToStep", "text": "Cut into individual bars and serve.", "name": "Cut into individual bars and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fig-bars/#wprm-recipe-40332-step-0-17"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Fig Bars"}</script>
