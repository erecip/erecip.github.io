    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Cheesecake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A richly spiced pumpkin cheesecake featuring a crisp gingersnap base and a smooth pumpkin-and-cream-cheese filling. A gentle water-bath bake, extended oven rest, and overnight refrigeration help create a creamy, evenly set texture.", "datePublished": "2020-09-10T19:09:31+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/pumpkin-cheesecake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/pumpkin-cheesecake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/pumpkin-cheesecake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/pumpkin-cheesecake2.png"], "cookTime": "PT65M", "totalTime": "PT365M", "recipeIngredient": ["6 tablespoons salted butter (melted)", "1 tablespoon granulated sugar", "1 1/2 cups gingersnap cookies (finely crushed into crumbs)", "15 ounces pumpkin purée", "1/4 teaspoon ground nutmeg", "22 ounces cream cheese (softened to room temperature, approximately 70°F)", "2/3 cup packed light brown sugar", "3  large eggs (brought to room temperature and whisked)", "1 teaspoon vanilla extract", "10 ounces sour cream (at room temperature)", "1 teaspoon ground cinnamon", "2/3 cup granulated sugar", "1/4 teaspoon ground cloves", "4 quarts steaming-hot water"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the crust. Preheat the oven to 325°F. Lightly grease a 9-inch springform pan with butter or cooking spray.", "name": "Prepare the crust. Preheat the oven to 325°F. Lightly grease a 9-inch springform pan with butter or cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-0"}, {"@type": "HowToStep", "text": "Combine the finely ground gingersnap crumbs, melted salted butter, and 1 tablespoon granulated sugar. Stir until the mixture has the consistency of damp sand.", "name": "Combine the finely ground gingersnap crumbs, melted salted butter, and 1 tablespoon granulated sugar. Stir until the mixture has the consistency of damp sand.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-1"}, {"@type": "HowToStep", "text": "Firmly press the crumb mixture into an even, compact layer across the bottom of the prepared springform pan.", "name": "Firmly press the crumb mixture into an even, compact layer across the bottom of the prepared springform pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-2"}, {"@type": "HowToStep", "text": "Bake for 6 minutes, or until the crust is set and lightly golden. Remove it from the oven and allow it to cool while preparing the cheesecake mixture.", "name": "Bake for 6 minutes, or until the crust is set and lightly golden. Remove it from the oven and allow it to cool while preparing the cheesecake mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-3"}, {"@type": "HowToStep", "text": "Make the cheesecake base. Place the room-temperature cream cheese in a large mixing bowl. Using an electric mixer on medium speed, beat for 2–3 minutes until completely smooth and creamy, scraping the sides and bottom of the bowl as necessary.", "name": "Make the cheesecake base. Place the room-temperature cream cheese in a large mixing bowl. Using an electric mixer on medium speed, beat for 2–3 minutes until completely smooth and creamy, scraping the sides and bottom of the bowl as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-4"}, {"@type": "HowToStep", "text": "Add the granulated sugar and packed light brown sugar. Continue mixing for approximately 1 minute, until evenly blended.", "name": "Add the granulated sugar and packed light brown sugar. Continue mixing for approximately 1 minute, until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-5"}, {"@type": "HowToStep", "text": "Add the vanilla extract and pumpkin purée. Mix on low speed only until the pumpkin is thoroughly incorporated and the filling has a consistent orange color.", "name": "Add the vanilla extract and pumpkin purée. Mix on low speed only until the pumpkin is thoroughly incorporated and the filling has a consistent orange color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-6"}, {"@type": "HowToStep", "text": "Incorporate the spices and sour cream. Add the cinnamon, nutmeg, and cloves to the pumpkin mixture. Blend gently on low speed until the spices are evenly dispersed.", "name": "Incorporate the spices and sour cream. Add the cinnamon, nutmeg, and cloves to the pumpkin mixture. Blend gently on low speed until the spices are evenly dispersed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-7"}, {"@type": "HowToStep", "text": "Add the room-temperature sour cream and carefully fold or mix it into the filling just until combined. Avoid excessive mixing, which can introduce unnecessary air into the batter.", "name": "Add the room-temperature sour cream and carefully fold or mix it into the filling just until combined. Avoid excessive mixing, which can introduce unnecessary air into the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-8"}, {"@type": "HowToStep", "text": "Add the eggs. In a separate bowl, whisk the three room-temperature eggs until uniformly combined and no visible streaks of egg white remain.", "name": "Add the eggs. In a separate bowl, whisk the three room-temperature eggs until uniformly combined and no visible streaks of egg white remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-9"}, {"@type": "HowToStep", "text": "Pour the whisked eggs into the cheesecake filling. Using a rubber spatula, gently fold them into the mixture only until fully incorporated. Stop as soon as no egg streaks are visible to limit the formation of air bubbles.", "name": "Pour the whisked eggs into the cheesecake filling. Using a rubber spatula, gently fold them into the mixture only until fully incorporated. Stop as soon as no egg streaks are visible to limit the formation of air bubbles.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-10"}, {"@type": "HowToStep", "text": "Pour the completed filling over the cooled gingersnap crust. Gently tap the springform pan against the countertop several times to help release trapped air.", "name": "Pour the completed filling over the cooled gingersnap crust. Gently tap the springform pan against the countertop several times to help release trapped air.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-11"}, {"@type": "HowToStep", "text": "Assemble the water bath. Completely wrap the exterior of the springform pan with aluminum foil to protect the cheesecake from water seepage.", "name": "Assemble the water bath. Completely wrap the exterior of the springform pan with aluminum foil to protect the cheesecake from water seepage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-12"}, {"@type": "HowToStep", "text": "Heat 4 quarts of water until steaming hot. Set the foil-wrapped springform pan inside a larger roasting pan.", "name": "Heat 4 quarts of water until steaming hot. Set the foil-wrapped springform pan inside a larger roasting pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-13"}, {"@type": "HowToStep", "text": "Carefully pour the hot water into the roasting pan until the water reaches approximately halfway up the outside of the springform pan.", "name": "Carefully pour the hot water into the roasting pan until the water reaches approximately halfway up the outside of the springform pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-14"}, {"@type": "HowToStep", "text": "Transfer the entire water-bath arrangement to the preheated 325°F oven.", "name": "Transfer the entire water-bath arrangement to the preheated 325°F oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-15"}, {"@type": "HowToStep", "text": "Bake and cool gradually. Bake the cheesecake for 65 minutes. It is ready when the outer portion appears set while the center retains a very slight jiggle when the pan is gently moved.", "name": "Bake and cool gradually. Bake the cheesecake for 65 minutes. It is ready when the outer portion appears set while the center retains a very slight jiggle when the pan is gently moved.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-16"}, {"@type": "HowToStep", "text": "Turn off the oven without opening the door. Leave the cheesecake undisturbed inside the warm oven for 5 hours.", "name": "Turn off the oven without opening the door. Leave the cheesecake undisturbed inside the warm oven for 5 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-17"}, {"@type": "HowToStep", "text": "After the 5-hour resting period, carefully remove the roasting pan and cheesecake from the oven. Allow the cheesecake to continue cooling until it reaches room temperature.", "name": "After the 5-hour resting period, carefully remove the roasting pan and cheesecake from the oven. Allow the cheesecake to continue cooling until it reaches room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-18"}, {"@type": "HowToStep", "text": "Refrigerate and serve. Remove the aluminum foil from the springform pan and place the cheesecake in the refrigerator. Chill overnight for a minimum of 8 hours, with approximately 12 hours preferred for a fully set texture.", "name": "Refrigerate and serve. Remove the aluminum foil from the springform pan and place the cheesecake in the refrigerator. Chill overnight for a minimum of 8 hours, with approximately 12 hours preferred for a fully set texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-19"}, {"@type": "HowToStep", "text": "Before releasing the springform pan, carefully run a thin knife around the outer edge of the cheesecake to separate it cleanly from the sides.", "name": "Before releasing the springform pan, carefully run a thin knife around the outer edge of the cheesecake to separate it cleanly from the sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-20"}, {"@type": "HowToStep", "text": "Serve thoroughly chilled. Whipped cream or a drizzle of caramel sauce may be added when serving.", "name": "Serve thoroughly chilled. Whipped cream or a drizzle of caramel sauce may be added when serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cheesecake/#wprm-recipe-44008-step-0-21"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Cheesecake"}</script>
