 into cylinders approximately 6 cm (2\") in diameter and 7 cm in height, then halve to produce eight shorter cylinders, each about 3.5 cm (1.4\") tall. Thoroughly pat the potatoes dry, then place in a large mixing bowl and coat evenly with half the olive oil, salt, and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fondant-potatoes-recipe/#wprm-recipe-13560-step-0-0"}, {"@type": "HowToStep", "text": "In an oven-safe, heavy-based skillet, heat the remaining tablespoon of olive oil over medium-high heat. Arrange the potatoes cut-side down and sear each face for 6 to 8 minutes, or until a golden crust forms.", "name": "In an oven-safe, heavy-based skillet, heat the remaining tablespoon of olive oil over medium-high heat. Arrange the potatoes cut-side down and sear each face for 6 to 8 minutes, or until a golden crust forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fondant-potatoes-recipe/#wprm-recipe-13560-step-0-1"}, {"@type": "HowToStep", "text": "Add the diced butter and thyme to the skillet. As the butter melts, continuously spoon it over the potatoes to baste. Pour in the stock and bring the mixture to a gentle boil. Transfer the skillet to the oven and bake for 30 minutes, basting the potatoes again halfway through. The stock should be mostly absorbed, leaving behind the enriched butter.", "name": "Add the diced butter and thyme to the skillet. As the butter melts, continuously spoon it over the potatoes to baste. Pour in the stock and bring the mixture to a gentle boil. Transfer the skillet to the oven and bake for 30 minutes, basting the potatoes again halfway through. The stock should be mostly absorbed, leaving behind the enriched butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fondant-potatoes-recipe/#wprm-recipe-13560-step-0-2"}, {"@type": "HowToStep", "text": "Once removed from the oven, baste the potatoes a final time and serve immediately. For a sophisticated presentation, accompany with steak, béarnaise sauce, and buttered peas.", "name": "Once removed from the oven, baste the potatoes a final time and serve immediately. For a sophisticated presentation, accompany with steak, béarnaise sauce, and buttered peas.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fondant-potatoes-recipe/#wprm-recipe-13560-step-0-3"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["Western"], "keywords": "Fondant Potatoes Recipe"}</script>
