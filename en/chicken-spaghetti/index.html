    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Spaghetti", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich and indulgent casserole featuring tender strands of spaghetti folded into a velvety blend of cream cheese, sharp cheddar, and melted mozzarella. Accented with zesty tomatoes and green chilies, this dish delivers a balance of creaminess and spice, perfect for a hearty family dinner.", "datePublished": "2024-03-13T18:40:37+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-spaghetti/chicken-spaghetti.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-spaghetti/chicken-spaghetti.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-spaghetti/chicken-spaghetti.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-spaghetti/chicken-spaghetti.png"], "recipeYield": ["6"], "prepTime": "PT15M", "cookTime": "PT40M", "totalTime": "PT55M", "recipeIngredient": ["1 cup shredded mozzarella cheese", "1 cup sharp cheddar (freshly grated)", "4 tablespoons all-purpose flour", "¾ cup whole milk", "4 ounces full-fat cream cheese (brought to room temperature)", "2 teaspoons dried Italian herb blend", "8 ounces thin spaghetti noodles", "1½ cups low-sodium chicken broth", "10 ounces canned diced tomatoes with green chilies (drained (juice reserved if needed))", "2  boneless (skinless chicken breasts (small-sized))", "3 cloves of garlic (finely minced)", "1  small yellow onion (finely chopped)", "2 tablespoons extra virgin olive oil", "4 tablespoons unsalted butter", "Salt and ground black pepper (to taste)", "Optional: Crushed red chili flakes and chopped fresh parsley for garnish"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F (200°C).", "name": "Preheat the oven to 400°F (200°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-spaghetti/#wprm-recipe-32164-step-0-0"},  achieve a golden, bubbly topping, broil for an additional 1–2 minutes at 475°F, monitoring closely to prevent burning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-spaghetti/#wprm-recipe-32164-step-4-1"}, {"@type": "HowToStep", "text": "Remove from the oven and finish with a sprinkle of red pepper flakes and fresh parsley, if desired.", "name": "Remove from the oven and finish with a sprinkle of red pepper flakes and fresh parsley, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-spaghetti/#wprm-recipe-32164-step-4-2"}]}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "chicken spaghetti"}</script>
