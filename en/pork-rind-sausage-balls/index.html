 onion into a large mixing bowl.", "name": "Place the ground pork sausage, shredded cheddar, room-temperature cream cheese, crushed hot-and-spicy pork rinds, baking powder, and chopped green onion into a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-rind-sausage-balls/#wprm-recipe-42845-step-0-1"}, {"@type": "HowToStep", "text": "Using clean hands or a firm spatula, thoroughly combine the ingredients until the mixture is uniform and holds together well. Continue mixing until the cream cheese is evenly incorporated and no visible streaks remain.", "name": "Using clean hands or a firm spatula, thoroughly combine the ingredients until the mixture is uniform and holds together well. Continue mixing until the cream cheese is evenly incorporated and no visible streaks remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-rind-sausage-balls/#wprm-recipe-42845-step-0-2"}, {"@type": "HowToStep", "text": "Portion the sausage mixture and roll each portion between your palms into balls approximately 1 inch in diameter. Arrange them at even intervals on the parchment-lined baking sheet. A small ice cream scoop may be used to create consistently sized portions.", "name": "Portion the sausage mixture and roll each portion between your palms into balls approximately 1 inch in diameter. Arrange them at even intervals on the parchment-lined baking sheet. A small ice cream scoop may be used to create consistently sized portions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-rind-sausage-balls/#wprm-recipe-42845-step-0-3"}, {"@type": "HowToStep", "text": "Place the baking sheet in the preheated oven and bake the sausage balls for 20–25 minutes, until their surfaces are golden brown and the centers are fully cooked.", "name": "Place the baking sheet in the preheated oven and bake the sausage balls for 20–25 minutes, until their surfaces are golden brown and the centers are fully cooked.", "url": "https:
