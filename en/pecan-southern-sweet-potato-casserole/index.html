rained sweet potatoes to a large mixing bowl while they are still warm. Add the softened unsalted butter, packed light brown sugar, room-temperature whole milk, eggs, vanilla extract, and salt.", "name": "Make the sweet potato filling. Transfer the drained sweet potatoes to a large mixing bowl while they are still warm. Add the softened unsalted butter, packed light brown sugar, room-temperature whole milk, eggs, vanilla extract, and salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pecan-southern-sweet-potato-casserole/#wprm-recipe-44354-step-0-4"}, {"@type": "HowToStep", "text": "Beat the mixture with an electric mixer at medium speed for approximately 2–3 minutes, continuing until the sweet potatoes are smooth, creamy, and evenly blended.", "name": "Beat the mixture with an electric mixer at medium speed for approximately 2–3 minutes, continuing until the sweet potatoes are smooth, creamy, and evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pecan-southern-sweet-potato-casserole/#wprm-recipe-44354-step-0-5"}, {"@type": "HowToStep", "text": "Using a spoon or spatula, carefully fold in the finely chopped 1/4 cup pecans until they are evenly distributed throughout the sweet potato mixture.", "name": "Using a spoon or spatula, carefully fold in the finely chopped 1/4 cup pecans until they are evenly distributed throughout the sweet potato mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pecan-southern-sweet-potato-casserole/#wprm-recipe-44354-step-0-6"}, {"@type": "HowToStep", "text": "Assemble the casserole. Spoon the prepared sweet potato filling into the greased casserole dish. Spread it evenly with a spatula, smoothing the surface into a level layer.", "name": "Assemble the casserole. Spoon the prepared sweet potato filling into the greased casserole dish. Spread it evenly with a spatula, smoothing the surface into a level layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pecan-southern-sweet-potato-casserole/#wprm-recipe-44354-step-0-7"}, {"@type": "HowToStep", "text": "Distribute the miniature marshmallows evenly over the sweet potato mixture, leaving small spaces between some of them so they can expand and melt as the casserole bakes.", "name": "Distribute the miniature marshmallows evenly over the sweet potato mixture, leaving small spaces between some of them so they can expand and melt as the casserole bakes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pecan-southern-sweet-potato-casserole/#wprm-recipe-44354-step-0-8"}, {"@type": "HowToStep", "text": "Sprinkle the remaining 1/4 cup chopped pecans over the marshmallows, if using. The nuts will toast during baking and add a crisp, nutty finish.", "name": "Sprinkle the remaining 1/4 cup chopped pecans over the marshmallows, if using. The nuts will toast during baking and add a crisp, nutty finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pecan-southern-sweet-potato-casserole/#wprm-recipe-44354-step-0-9"}, {"@type": "HowToStep", "text": "Bake the casserole. Place the assembled dish in the preheated 375°F oven and bake for 25–30 minutes.", "name": "Bake the casserole. Place the assembled dish in the preheated 375°F oven and bake for 25–30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pecan-southern-sweet-potato-casserole/#wprm-recipe-44354-step-0-10"}, {"@type": "HowToStep", "text": "Begin checking the casserole at approximately 25 minutes. It is ready when the marshmallows have puffed and developed a light golden-brown color, the edges are gently bubbling, and the sweet potato filling is thoroughly heated.", "name": "Begin checking the casserole at approximately 25 minutes. It is ready when the marshmallows have puffed and developed a light golden-brown color, the edges are gently bubbling, and the sweet potato filling is thoroughly heated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pecan-southern-sweet-potato-casserole/#wprm-recipe-44354-step-0-11"}, {"@type": "HowToStep", "text": "Rest and serve. Remove the casserole from the oven and allow it to stand for 5 minutes. This brief resting period helps the filling settle slightly while keeping the marshmallow topping soft and gooey.", "name": "Rest and serve. Remove the casserole from the oven and allow it to stand for 5 minutes. This brief resting period helps the filling settle slightly while keeping the marshmallow topping soft and gooey.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pecan-southern-sweet-potato-casserole/#wprm-recipe-44354-step-0-12"}, {"@type": "HowToStep", "text": "Serve the casserole warm directly from the baking dish.", "name": "Serve the casserole warm directly from the baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pecan-southern-sweet-potato-casserole/#wprm-recipe-44354-step-0-13"}], "recipeCategory": ["Casserole", "Side Dish"], "recipeCuisine": ["Southern American"], "keywords": "Pecan Southern Sweet Potato Casserole"}</script>
