    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gluten Free Scalloped Potatoes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender slices of Yukon Gold potatoes are gently simmered in a seasoned milk-and-cream mixture, layered with freshly shredded Gruyère, and baked until soft beneath a richly browned, creamy cheese topping.", "datePublished": "2023-03-08T02:19:19+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/gluten-free-scalloped-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/gluten-free-scalloped-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/gluten-free-scalloped-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/gluten-free-scalloped-potatoes.png"], "cookTime": "PT60M", "totalTime": "PT70M", "recipeIngredient": ["4 lb Yukon Gold potatoes (peeled and evenly sliced to 1/8-inch thickness)", "1 tsp dried thyme", "8 oz Gruyère cheese (freshly grated for smooth melting)", "2 cups heavy whipping cream", "1/2 tsp ground black pepper", "2 cups whole milk", "1 tbsp garlic salt", "Nonstick cooking spray (for preparing the baking dish and foil)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 375°F (190°C). Coat a 9 × 13-inch baking dish with nonstick cooking spray and set it aside.", "name": "Heat the oven to 375°F (190°C). Coat a 9 × 13-inch baking dish with nonstick cooking spray and set it aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-0"}, {"@type": "HowToStep", "text": "Pour the whole milk and heavy whipping cream into a large pot or Dutch oven. Add the garlic salt, dried thyme, and black pepper. Stir thoroughly so the seasonings are distributed throughout the liquid.", "name": "Pour the whole milk and heavy whipping cream into a large pot or Dutch oven. Add the garlic salt, dried thyme, and black pepper. Stir thoroughly so the seasonings are distributed throughout the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-1"}, {"@type": "HowToStep", "text": "Peel the Yukon Gold potatoes and cut them into uniform 1/8-inch slices. As each portion is sliced, place the potatoes directly into the prepared cream mixture to help prevent discoloration. Keep the slices as submerged in the liquid as possible.", "name": "Peel the Yukon Gold potatoes and cut them into uniform 1/8-inch slices. As each portion is sliced, place the potatoes directly into the prepared cream mixture to help prevent discoloration. Keep the slices as submerged in the liquid as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-2"}, {"@type": "HowToStep", "text": "Set the pot over high heat and bring the cream mixture to a simmer, stirring frequently so the potatoes heat evenly and do not adhere to the bottom of the pot. Once simmering begins, continue cooking for 1 minute.", "name": "Set the pot over high heat and bring the cream mixture to a simmer, stirring frequently so the potatoes heat evenly and do not adhere to the bottom of the pot. Once simmering begins, continue cooking for 1 minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-3"}, {"@type": "HowToStep", "text": "Remove the pot from the heat and allow the potato-and-cream mixture to cool for 10 minutes.", "name": "Remove the pot from the heat and allow the potato-and-cream mixture to cool for 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-4"}, {"@type": "HowToStep", "text": "Using a slotted spoon, arrange one-third of the simmered potato slices in an even layer across the prepared baking dish. Scatter one-third of the shredded Gruyère over the potatoes.", "name": "Using a slotted spoon, arrange one-third of the simmered potato slices in an even layer across the prepared baking dish. Scatter one-third of the shredded Gruyère over the potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-5"}, {"@type": "HowToStep", "text": "Add a second layer using another one-third of the potatoes, followed by another one-third of the Gruyère.", "name": "Add a second layer using another one-third of the potatoes, followed by another one-third of the Gruyère.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-6"}, {"@type": "HowToStep", "text": "Finish with the remaining potato slices. Pour the cream mixture left in the pot evenly over the assembled potatoes, then distribute the remaining Gruyère across the surface.", "name": "Finish with the remaining potato slices. Pour the cream mixture left in the pot evenly over the assembled potatoes, then distribute the remaining Gruyère across the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-7"}, {"@type": "HowToStep", "text": "Spray a sheet of foil with nonstick cooking spray and use it to cover the baking dish. Bake for 40 minutes.", "name": "Spray a sheet of foil with nonstick cooking spray and use it to cover the baking dish. Bake for 40 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-8"}, {"@type": "HowToStep", "text": "Carefully remove the foil and return the dish to the oven for another 20–30 minutes, or until a knife slides easily through the potato slices.", "name": "Carefully remove the foil and return the dish to the oven for another 20–30 minutes, or until a knife slides easily through the potato slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-9"}, {"@type": "HowToStep", "text": "For a more deeply browned surface, broil the scalloped potatoes for 1–2 minutes, if desired.", "name": "For a more deeply browned surface, broil the scalloped potatoes for 1–2 minutes, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-10"}, {"@type": "HowToStep", "text": "Allow the finished dish to rest for 20–30 minutes before serving. This resting period helps the creamy layers settle and makes the potatoes easier to portion into neat servings.", "name": "Allow the finished dish to rest for 20–30 minutes before serving. This resting period helps the creamy layers settle and makes the potatoes easier to portion into neat servings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-scalloped-potatoes/#wprm-recipe-41609-step-0-11"}], "recipeCategory": ["Bread", "Side Dish"], "recipeCuisine": ["American"], "keywords": "Gluten Free Scalloped Potatoes"}</script>
