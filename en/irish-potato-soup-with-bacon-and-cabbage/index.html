    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Irish Potato Soup with Bacon and Cabbage", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty Irish-style potato dish featuring smooth, buttery potatoes folded together with tender cabbage and crisp bacon. The combination delivers a creamy texture, savory depth, and satisfying contrast from the bacon.", "datePublished": "2023-07-10T21:41:32+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/irish-potato-soup-with-bacon-and-cabbage2.png", "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/irish-potato-soup-with-bacon-and-cabbage2.png", "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/irish-potato-soup-with-bacon-and-cabbage2.png", "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/irish-potato-soup-with-bacon-and-cabbage2.png"], "prepTime": "PT10M", "cookTime": "PT20M", "totalTime": "PT30M", "recipeIngredient": ["1/2 cup milk (with a little extra if needed for consistency)", "1/2 teaspoon ground black pepper", "2 pounds potatoes (peeled and roughly chunked)", "2 tablespoons unsalted butter", "1 teaspoon kosher salt (with additional salt as needed)", "6  bacon slices", "2 tablespoons water", "3 cups cabbage (chopped)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Peel the potatoes and divide them into evenly sized chunks.", "name": "Peel the potatoes and divide them into evenly sized chunks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the potato pieces to a large pot, cover them with salted water, and bring the water to a boil over medium-high heat. Lower the heat to maintain a simmer and cook for approximately 15–20 minutes, or until the potatoes are easily pierced with a fork.", "name": "Transfer the potato pieces to a large pot, cover them with salted water, and bring the water to a boil over medium-high heat. Lower the heat to maintain a simmer and cook for approximately 15–20 minutes, or until the potatoes are easily pierced with a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-1"}, {"@type": "HowToStep", "text": "Drain the cooked potatoes thoroughly and set them aside.", "name": "Drain the cooked potatoes thoroughly and set them aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-2"}, {"@type": "HowToStep", "text": "While the potatoes cook, prepare the cabbage by chopping it if necessary.", "name": "While the potatoes cook, prepare the cabbage by chopping it if necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-3"}, {"@type": "HowToStep", "text": "Place the chopped cabbage in a separate pot with 2 tablespoons of water. Cover the pot and cook over medium heat for about 8–10 minutes, until the cabbage becomes soft and wilted.", "name": "Place the chopped cabbage in a separate pot with 2 tablespoons of water. Cover the pot and cook over medium heat for about 8–10 minutes, until the cabbage becomes soft and wilted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-4"}, {"@type": "HowToStep", "text": "Drain away any water remaining in the pot.", "name": "Drain away any water remaining in the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-5"}, {"@type": "HowToStep", "text": "Arrange the bacon slices in a skillet over medium heat. Cook for approximately 7–10 minutes, turning occasionally, until the bacon is crisp.", "name": "Arrange the bacon slices in a skillet over medium heat. Cook for approximately 7–10 minutes, turning occasionally, until the bacon is crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the cooked bacon to a plate lined with paper towels and allow the excess fat to drain. Once cool enough to handle, crumble or finely chop the bacon into small pieces.", "name": "Transfer the cooked bacon to a plate lined with paper towels and allow the excess fat to drain. Once cool enough to handle, crumble or finely chop the bacon into small pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-7"}, {"@type": "HowToStep", "text": "Reserve a small portion of the bacon for garnishing the finished dish.", "name": "Reserve a small portion of the bacon for garnishing the finished dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-8"}, {"@type": "HowToStep", "text": "Return the drained potatoes to their cooking pot.", "name": "Return the drained potatoes to their cooking pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-9"}, {"@type": "HowToStep", "text": "Add the unsalted butter and milk, then mash the ingredients together until the potatoes develop a smooth, creamy consistency.", "name": "Add the unsalted butter and milk, then mash the ingredients together until the potatoes develop a smooth, creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-10"}, {"@type": "HowToStep", "text": "If a softer texture is preferred, incorporate an additional small splash of milk.", "name": "If a softer texture is preferred, incorporate an additional small splash of milk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-11"}, {"@type": "HowToStep", "text": "Fold the cooked cabbage and most of the crumbled bacon into the mashed potato mixture.", "name": "Fold the cooked cabbage and most of the crumbled bacon into the mashed potato mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-12"}, {"@type": "HowToStep", "text": "Stir thoroughly until the cabbage and bacon are distributed evenly throughout the potatoes.", "name": "Stir thoroughly until the cabbage and bacon are distributed evenly throughout the potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-13"}, {"@type": "HowToStep", "text": "Season with the black pepper and kosher salt, adjusting the amount of salt to taste. A final small pinch of black pepper may be added for a more pronounced peppery finish.", "name": "Season with the black pepper and kosher salt, adjusting the amount of salt to taste. A final small pinch of black pepper may be added for a more pronounced peppery finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-14"}, {"@type": "HowToStep", "text": "Spoon the finished potato, cabbage, and bacon mixture into a serving bowl or divide it among individual plates.", "name": "Spoon the finished potato, cabbage, and bacon mixture into a serving bowl or divide it among individual plates.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-15"}, {"@type": "HowToStep", "text": "Serve while warm as a substantial side dish or as a satisfying main course. Finish by scattering the reserved bacon pieces over the top.", "name": "Serve while warm as a substantial side dish or as a satisfying main course. Finish by scattering the reserved bacon pieces over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/irish-potato-soup-with-bacon-and-cabbage/#wprm-recipe-45045-step-0-16"}], "recipeCategory": ["Main Course", "Side Dish"], "recipeCuisine": ["Irish"], "keywords": "Irish Potato Soup with Bacon and Cabbage"}</script>
