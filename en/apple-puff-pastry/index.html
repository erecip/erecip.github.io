apples, then cut them into approximately 1/2-inch pieces. Set the diced fruit aside.", "name": "Peel and core the Granny Smith apples, then cut them into approximately 1/2-inch pieces. Set the diced fruit aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-1"}, {"@type": "HowToStep", "text": "Measure the water, sugar, cornstarch, cinnamon, and lemon juice before beginning the stovetop filling.", "name": "Measure the water, sugar, cornstarch, cinnamon, and lemon juice before beginning the stovetop filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-2"}, {"@type": "HowToStep", "text": "Add the water, cornstarch, sugar, ground cinnamon, and 1 1/2 teaspoons lemon juice to a medium saucepan. Place over medium-high heat and bring the mixture to a boil, stirring continuously for 3–4 minutes. Continue until the liquid becomes thick and glossy.", "name": "Add the water, cornstarch, sugar, ground cinnamon, and 1 1/2 teaspoons lemon juice to a medium saucepan. Place over medium-high heat and bring the mixture to a boil, stirring continuously for 3–4 minutes. Continue until the liquid becomes thick and glossy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the diced apples, making sure the pieces are evenly covered with the thickened mixture. Reduce the heat to medium and simmer for 8–10 minutes, stirring from time to time.", "name": "Stir in the diced apples, making sure the pieces are evenly covered with the thickened mixture. Reduce the heat to medium and simmer for 8–10 minutes, stirring from time to time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-4"}, {"@type": "HowToStep", "text": "Cook until the apples can be pierced with a fork while still retaining their shape. Remove the saucepan from the heat and allow the filling to cool slightly while preparing the cream cheese mixture.", "name": "Cook until the apples can be pierced with a fork while still retaining their shape. Remove the saucepan from the heat and allow the filling to cool slightly while preparing the cream cheese mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-5"}, {"@type": "HowToStep", "text": "Place the softened cream cheese in a large mixing bowl. Beat at medium speed for 2–3 minutes, or until completely creamy and smooth.", "name": "Place the softened cream cheese in a large mixing bowl. Beat at medium speed for 2–3 minutes, or until completely creamy and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-6"}, {"@type": "HowToStep", "text": "Add the 1/2 cup sugar and beat for an additional minute.", "name": "Add the 1/2 cup sugar and beat for an additional minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-7"}, {"@type": "HowToStep", "text": "Mix in the egg yolk, 1 teaspoon lemon juice, and vanilla extract. Continue beating until the filling is light, uniform, and free of lumps. Set it aside while the cooked apples finish cooling.", "name": "Mix in the egg yolk, 1 teaspoon lemon juice, and vanilla extract. Continue beating until the filling is light, uniform, and free of lumps. Set it aside while the cooked apples finish cooling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-8"}, {"@type": "HowToStep", "text": "Place the thawed puff pastry sheets on a clean work surface.", "name": "Place the thawed puff pastry sheets on a clean work surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-9"}, {"@type": "HowToStep", "text": "Divide the cream cheese mixture equally between the two pastry sheets. Spread it along the center of each sheet, keeping approximately 2 inches clear at both ends.", "name": "Divide the cream cheese mixture equally between the two pastry sheets. Spread it along the center of each sheet, keeping approximately 2 inches clear at both ends.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-10"}, {"@type": "HowToStep", "text": "Spoon the cooled apple mixture evenly over the cream cheese layer.", "name": "Spoon the cooled apple mixture evenly over the cream cheese layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-11"}, {"@type": "HowToStep", "text": "At both ends of each pastry sheet, make two 1-inch cuts directed toward the filling without slicing into the filling itself. Fold these end sections inward to help enclose the filling.", "name": "At both ends of each pastry sheet, make two 1-inch cuts directed toward the filling without slicing into the filling itself. Fold these end sections inward to help enclose the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-12"}, {"@type": "HowToStep", "text": "Cut narrow diagonal strips along both long sides of each pastry at approximately a 45-degree angle. Alternately fold the strips over the center to form a braided pattern across the filling.", "name": "Cut narrow diagonal strips along both long sides of each pastry at approximately a 45-degree angle. Alternately fold the strips over the center to form a braided pattern across the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-13"}, {"@type": "HowToStep", "text": "Whisk the large egg with 1 tablespoon water until evenly combined.", "name": "Whisk the large egg with 1 tablespoon water until evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-14"}, {"@type": "HowToStep", "text": "Using a pastry brush, apply a thin, uniform layer of egg wash over the exposed puff pastry. Avoid soaking the dough; a light coating is sufficient for an even golden finish.", "name": "Using a pastry brush, apply a thin, uniform layer of egg wash over the exposed puff pastry. Avoid soaking the dough; a light coating is sufficient for an even golden finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-15"}, {"@type": "HowToStep", "text": "Sprinkle coarse sugar over the pastries, including the braided sections.", "name": "Sprinkle coarse sugar over the pastries, including the braided sections.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-16"}, {"@type": "HowToStep", "text": "Transfer the assembled pastries to the parchment-lined baking sheet.", "name": "Transfer the assembled pastries to the parchment-lined baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-17"}, {"@type": "HowToStep", "text": "Bake at 375°F for 25–30 minutes, or until the puff pastry has risen and developed a deep golden-brown color. If the oven heats unevenly, rotate the baking sheet halfway through the baking period.", "name": "Bake at 375°F for 25–30 minutes, or until the puff pastry has risen and developed a deep golden-brown color. If the oven heats unevenly, rotate the baking sheet halfway through the baking period.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-18"}, {"@type": "HowToStep", "text": "Check that the undersides of the pastries are also golden and that the cream cheese filling is set while remaining slightly soft.", "name": "Check that the undersides of the pastries are also golden and that the cream cheese filling is set while remaining slightly soft.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-19"}, {"@type": "HowToStep", "text": "Allow the baked pastries to cool on the baking sheet for 5 minutes before serving.", "name": "Allow the baked pastries to cool on the baking sheet for 5 minutes before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-puff-pastry/#wprm-recipe-43399-step-0-20"}], "recipeCategory": ["Dessert"], "keywords": "Apple Puff Pastry"}</script>
