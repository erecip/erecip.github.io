    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cheesy Spinach Dip Christmas Tree Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A delightful holiday appetizer crafted from crispy puff pastry shaped into a festive Christmas tree, generously filled with a creamy spinach and artichoke blend with an abundance of cheese. This recipe yields either two puff pastry Christmas trees or one tree accompanied by a batch of roll ups.", "datePublished": "2024-10-10T04:04:25+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cheesy-spinach-dip-christmas-tree-recipe/Cheesy-Spinach-Dip-Christmas-Tree-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-spinach-dip-christmas-tree-recipe/Cheesy-Spinach-Dip-Christmas-Tree-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-spinach-dip-christmas-tree-recipe/Cheesy-Spinach-Dip-Christmas-Tree-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-spinach-dip-christmas-tree-recipe/Cheesy-Spinach-Dip-Christmas-Tree-Recipe.png"], "recipeYield": ["6"], "prepTime": "PT10M", "cookTime": "PT20M", "totalTime": "PT30M", "recipeIngredient": ["1 cup mozzarella cheese (grated)", "5  –7 artichoke hearts (chopped)", "1  pkg puff pastry (thawed for approximately 40 minutes)", "1  jalapeño (finely chopped)", "Salt and pepper (to taste)", "1  egg", "10 oz frozen spinach (thawed and drained)", "1 tablespoon water", "4 oz cream cheese", "1 clove garlic (finely chopped)", "⅓ cup Parmesan cheese"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F and prepare a baking sheet lined with parchment paper, lightly greased with oil such as olive or avocado. Finely dice the artichoke hearts, garlic clove, and jalapeño, placing them in a mixing bowl. Combine the chopped vegetables with the thawed and thoroughly drained spinach, cream cheese, grated mozzarella, Parmesan, and season with salt and pepper. Stir until fully integrated. Arrange the puff pastry on the prepared baking sheet and slice it into a large triangle, reserving two smaller triangles for the top layer. Spread half of the spinach filling over the base triangle, then layer the reserved triangles atop the filling, pinching the center to seal into one large tree shape. With a pizza cutter, create strips along the sides of the triangle and gently twist each strip twice. Whisk the egg with water and brush this egg wash over the entire pastry. Bake for 20–22 minutes or until golden brown; if browning occurs too rapidly, tent with foil to prevent burning while allowing the pastry to finish baking.", "name": "Preheat the oven to 400°F and prepare a baking sheet lined with parchment paper, lightly greased with oil such as olive or avocado. Finely dice the artichoke hearts, garlic clove, and jalapeño, placing them in a mixing bowl. Combine the chopped vegetables with the thawed and thoroughly drained spinach, cream cheese, grated mozzarella, Parmesan, and season with salt and pepper. Stir until fully integrated. Arrange the puff pastry on the prepared baking sheet and slice it into a large triangle, reserving two smaller triangles for the top layer. Spread half of the spinach filling over the base triangle, then layer the reserved triangles atop the filling, pinching the center to seal into one large tree shape. With a pizza cutter, create strips along the sides of the triangle and gently twist each strip twice. Whisk the egg with water and brush this egg wash over the entire pastry. Bake for 20–22 minutes or until golden brown; if browning occurs too rapidly, tent with foil to prevent burning while allowing the pastry to finish baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-spinach-dip-christmas-tree-recipe/#wprm-recipe-51385-step-0-0"}, {"@type": "HowToStep", "text": "Spinach Dip Roll Up Variation", "name": "Spinach Dip Roll Up Variation", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-spinach-dip-christmas-tree-recipe/#wprm-recipe-51385-step-0-1"}, {"@type": "HowToStep", "text": "Place the second sheet of puff pastry onto another parchment-lined and greased baking sheet. Evenly distribute the remaining spinach mixture over the dough, roll it tightly, then slice into ½-inch rounds. Arrange the rolls on the baking sheet, brush with the egg wash, and bake for 20–22 minutes until golden. Optionally, garnish with finely chopped parsley before serving.", "name": "Place the second sheet of puff pastry onto another parchment-lined and greased baking sheet. Evenly distribute the remaining spinach mixture over the dough, roll it tightly, then slice into ½-inch rounds. Arrange the rolls on the baking sheet, brush with the egg wash, and bake for 20–22 minutes until golden. Optionally, garnish with finely chopped parsley before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-spinach-dip-christmas-tree-recipe/#wprm-recipe-51385-step-0-2"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["American"], "keywords": "Cheesy Spinach Dip Christmas Tree Recipe"}</script>
