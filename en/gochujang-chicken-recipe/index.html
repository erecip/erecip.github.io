    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gochujang Chicken Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A bold, Korean-inspired chicken dish featuring tender thigh pieces enveloped in a fiery, slightly sweet gochujang sauce. Ready in just half an hour, this recipe brings the vibrant flavors of Korean takeout straight to your kitchen.", "datePublished": "2024-10-28T05:01:34+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/gochujang-chicken-recipe/Gochujang-Chicken-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/gochujang-chicken-recipe/Gochujang-Chicken-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/gochujang-chicken-recipe/Gochujang-Chicken-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/gochujang-chicken-recipe/Gochujang-Chicken-Recipe.png"], "recipeYield": ["4"], "prepTime": "PT5M", "cookTime": "PT10M", "totalTime": "PT30M", "recipeIngredient": ["1 tablespoon avocado oil", "2 tablespoons honey", "1 tablespoon minced fresh ginger", "4 tablespoons tamari (or soy sauce or coconut aminos)", "1 pound boneless (skinless chicken thighs, cut into chunks)", "2 tablespoons brown sugar", "toasted sesame seeds (for garnish (optional))", "1 cup chopped green onions", "2 tablespoons gochujang paste", "1 tablespoon minced fresh garlic"], "recipeInstructions": [{"@type": "HowToStep", "text": "Slice the chicken thighs into bite-sized portions and place them in a large mixing bowl. In a separate bowl, whisk together gochujang paste, honey, brown sugar, tamari, garlic, and ginger until smooth to form the marinade. Pour half of this marinade over the chicken, stirring to coat thoroughly; if the mixture appears overly thick, stir in a splash of water to loosen it. Allow the chicken to marinate for 15 minutes. Warm the avocado oil in a skillet set over medium heat. Transfer the marinated chicken into the skillet and sauté for roughly 8 minutes until the meat is entirely cooked through. Pour in the remaining marinade along with the chopped green onions, stirring gently. Continue cooking for an additional 1–2 minutes, just until the onions have softened slightly and the sauce has thickened and begun to bubble. Remove from the heat and serve immediately over steamed white rice, finishing with a sprinkle of toasted sesame seeds if desired.", "name": "Slice the chicken thighs into bite-sized portions and place them in a large mixing bowl. In a separate bowl, whisk together gochujang paste, honey, brown sugar, tamari, garlic, and ginger until smooth to form the marinade. Pour half of this marinade over the chicken, stirring to coat thoroughly; if the mixture appears overly thick, stir in a splash of water to loosen it. Allow the chicken to marinate for 15 minutes. Warm the avocado oil in a skillet set over medium heat. Transfer the marinated chicken into the skillet and sauté for roughly 8 minutes until the meat is entirely cooked through. Pour in the remaining marinade along with the chopped green onions, stirring gently. Continue cooking for an additional 1–2 minutes, just until the onions have softened slightly and the sauce has thickened and begun to bubble. Remove from the heat and serve immediately over steamed white rice, finishing with a sprinkle of toasted sesame seeds if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gochujang-chicken-recipe/#wprm-recipe-49851-step-0-0"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["korean"], "keywords": "Gochujang Chicken Recipe"}</script>
