 portion the soup into serving bowls. Place a slice of dry French bread atop each portion and generously sprinkle with Gruyere, Emmental, and Parmesan cheeses. Broil the bowls for 2 to 3 minutes until the cheese is fully melted and beautifully golden.", "name": "In a spacious non-stick skillet, gently sauté the sliced onions with butter and brown sugar over medium-low heat until the onions reach a deep golden hue and are thoroughly caramelized, which should take approximately 20 minutes. Transfer the caramelized onions to a 6-quart slow cooker and incorporate the beef broth, Worcestershire sauce, minced garlic, dry sherry, thyme, and bay leaf. Allow the soup to cook on a low setting for 6 to 8 hours to develop robust flavors. Discard the bay leaf, then portion the soup into serving bowls. Place a slice of dry French bread atop each portion and generously sprinkle with Gruyere, Emmental, and Parmesan cheeses. Broil the bowls for 2 to 3 minutes until the cheese is fully melted and beautifully golden.", "url": "https://erecip.github.io/en/crock-pot-french-onion-soup-recipe/#wprm-recipe-51317-step-0-0"}], "recipeCategory": ["Soup"], "recipeCuisine": ["French"], "keywords": "Crock Pot French Onion Soup Recipe"}</script>
