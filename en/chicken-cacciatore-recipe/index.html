    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Cacciatore Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic Italian dish, this stovetop Chicken Cacciatore combines tender boneless chicken thighs, earthy mushrooms, and vibrant vegetables in a wine-infused tomato sauce, ready to serve in under an hour.", "datePublished": "2024-03-03T21:14:33+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/45df661cac-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/45df661cac-1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/45df661cac-1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/45df661cac-1-480x270.jpg"], "recipeYield": ["6"], "prepTime": "PT5M", "cookTime": "PT45M", "totalTime": "PT50M", "recipeIngredient": ["2 pounds boneless (skinless chicken thighs)", "1  medium yellow onion (chopped)", "3 tablespoons extra-virgin olive oil (divided)", "¾ cup dry white wine (or low-sodium chicken broth)", "1  medium green bell pepper (chopped)", "1 teaspoon kosher salt", "½ teaspoon black pepper", "2 teaspoons Italian seasoning", "8 ounces baby bella (cremini mushrooms, sliced)", "3 cloves garlic (minced)", "1 28- ounce can crushed tomatoes", "½ tablespoon balsamic vinegar", "Whole wheat pasta (brown rice, polenta, or zucchini noodles)", "Freshly grated Parmesan cheese", "Chopped fresh parsley or basil"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm 2 tablespoons of olive oil in a Dutch oven or a sturdy, deep pot over medium-high heat. Season the chicken thighs on both sides with kosher salt and black pepper.", "name": "Warm 2 tablespoons of olive oil in a Dutch oven or a sturdy, deep pot over medium-high heat. Season the chicken thighs on both sides with kosher salt and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cacciatore-recipe/#wprm-recipe-4753-step-0-0"}, {"@type": "HowToStep", "text": "Once the oil is shimmering, add the chicken in a single layer. Sear the chicken for 3 to 4 minutes without moving to achieve a golden crust. Flip and cook for an additional 2 minutes on the other side, then transfer the chicken to a plate. It doesn’t need to be fully cooked at this stage.", "name": "Once the oil is shimmering, add the chicken in a single layer. Sear the chicken for 3 to 4 minutes without moving to achieve a golden crust. Flip and cook for an additional 2 minutes on the other side, then transfer the chicken to a plate. It doesn’t need to be fully cooked at this stage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cacciatore-recipe/#wprm-recipe-4753-step-0-1"}, {"@type": "HowToStep", "text": "Lower the heat to medium, adding the remaining tablespoon of olive oil. Introduce the chopped onion and bell pepper to the pot, cooking until they start to soften, about 4 minutes.", "name": "Lower the heat to medium, adding the remaining tablespoon of olive oil. Introduce the chopped onion and bell pepper to the pot, cooking until they start to soften, about 4 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cacciatore-recipe/#wprm-recipe-4753-step-0-2"}, {"@type": "HowToStep", "text": "Add the minced garlic, stirring for 1 minute until aromatic.", "name": "Add the minced garlic, stirring for 1 minute until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cacciatore-recipe/#wprm-recipe-4753-step-0-3"}, {"@type": "HowToStep", "text": "Pour in the white wine, stirring to loosen any browned bits from the bottom of the pot. Allow the wine to simmer and reduce by half, approximately 3 minutes.", "name": "Pour in the white wine, stirring to loosen any browned bits from the bottom of the pot. Allow the wine to simmer and reduce by half, approximately 3 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cacciatore-recipe/#wprm-recipe-4753-step-0-4"}, {"@type": "HowToStep", "text": "Stir in the crushed tomatoes with juices, sliced mushrooms, Italian seasoning, and balsamic vinegar. Bring the mixture to a gentle simmer, allowing the sauce to cook uncovered for 10 minutes to thicken.", "name": "Stir in the crushed tomatoes with juices, sliced mushrooms, Italian seasoning, and balsamic vinegar. Bring the mixture to a gentle simmer, allowing the sauce to cook uncovered for 10 minutes to thicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cacciatore-recipe/#wprm-recipe-4753-step-0-5"}, {"@type": "HowToStep", "text": "Nestle the partially cooked chicken thighs into the simmering tomato sauce, adding any accumulated juices from the plate. Ensure the chicken is mostly submerged.", "name": "Nestle the partially cooked chicken thighs into the simmering tomato sauce, adding any accumulated juices from the plate. Ensure the chicken is mostly submerged.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cacciatore-recipe/#wprm-recipe-4753-step-0-6"}, {"@type": "HowToStep", "text": "Partially cover the pot and let simmer for 15 to 20 minutes, until the chicken is cooked through, the sauce thickens, and mushrooms are tender.", "name": "Partially cover the pot and let simmer for 15 to 20 minutes, until the chicken is cooked through, the sauce thickens, and mushrooms are tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cacciatore-recipe/#wprm-recipe-4753-step-0-7"}, {"@type": "HowToStep", "text": "For serving, either shred or dice the chicken if desired. Return it to the sauce to warm through, or leave the thighs whole. Adjust seasoning with additional salt and pepper as preferred.", "name": "For serving, either shred or dice the chicken if desired. Return it to the sauce to warm through, or leave the thighs whole. Adjust seasoning with additional salt and pepper as preferred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cacciatore-recipe/#wprm-recipe-4753-step-0-8"}, {"@type": "HowToStep", "text": "Serve hot over pasta, rice, or vegetables, topped generously with sauce, fresh parsley or basil, and grated Parmesan.", "name": "Serve hot over pasta, rice, or vegetables, topped generously with sauce, fresh parsley or basil, and grated Parmesan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cacciatore-recipe/#wprm-recipe-4753-step-0-9"}], "aggregateRating": {"@type": "AggregateRating", "ratingValue": "5", "ratingCount": "1", "reviewCount": "1"}, "review": [{"@type": "Review", "reviewRating": {"@type": "Rating", "ratingValue": "5"}, "reviewBody": "Delicious :) I didn't have the mushrooms, but it was still good! Added olives like I thought I saw in the picture.", "author": {"@type": "Person", "name": "Rebecca"}, "datePublished": "2025-12-30"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Chicken Cacciatore Recipe"}</script>
