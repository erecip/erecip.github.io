    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Candy Corn Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These soft, thick cookies combine a buttery brown sugar dough with small pieces of colorful candy corn. Chilling the mixture before baking limits spreading, while cornstarch helps create a tender texture.", "datePublished": "2021-04-16T16:24:30+00:00", "image": ["https://erecip.github.io/en/candy-corn-cookies/candy-corn-cookies2.png", "https://erecip.github.io/en/candy-corn-cookies/candy-corn-cookies2.png", "https://erecip.github.io/en/candy-corn-cookies/candy-corn-cookies2.png", "https://erecip.github.io/en/candy-corn-cookies/candy-corn-cookies2.png"], "cookTime": "PT8M", "totalTime": "PT68M", "recipeIngredient": ["1 cup candy corn (approximately 6 ounces, chopped into small pieces)", "2 teaspoons cornstarch", "½ cup firmly packed brown sugar (preferably dark brown sugar for a richer flavor)", "1  large egg", "¼ teaspoon salt", "¾ cup unsalted butter (softened at room temperature)", "1 tablespoon vanilla extract", "2 cups all-purpose flour", "½ cup granulated sugar", "1 teaspoon baking soda", "Nonstick cooking spray (for preparing the baking sheet)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the softened unsalted butter, granulated sugar, and packed brown sugar in a large mixing bowl. Beat with a hand mixer until the mixture becomes pale, airy, and fluffy.", "name": "Place the softened unsalted butter, granulated sugar, and packed brown sugar in a large mixing bowl. Beat with a hand mixer until the mixture becomes pale, airy, and fluffy.", "url": "https://erecip.github.io/en/candy-corn-cookies/#wprm-recipe-39831-step-0-0"}, {"@type": "HowToStep", "text": "Pour in the vanilla extract and add the egg. Continue mixing until both ingredients are fully incorporated. Scrape the sides and bottom of the bowl as necessary to ensure the mixture is uniform.", "name": "Pour in the vanilla extract and add the egg. Continue mixing until both ingredients are fully incorporated. Scrape the sides and bottom of the bowl as necessary to ensure the mixture is uniform.", "url": "https://erecip.github.io/en/candy-corn-cookies/#wprm-recipe-39831-step-0-1"}, {"@type": "HowToStep", "text": "Gradually add the all-purpose flour, cornstarch, baking soda, and salt to the wet mixture. Blend on low speed just until a soft, dense dough develops.", "name": "Gradually add the all-purpose flour, cornstarch, baking soda, and salt to the wet mixture. Blend on low speed just until a soft, dense dough develops.", "url": "https://erecip.github.io/en/candy-corn-cookies/#wprm-recipe-39831-step-0-2"}, {"@type": "HowToStep", "text": "Carefully fold the chopped candy corn into the dough until the pieces are evenly dispersed. Cover the bowl securely with plastic wrap and refrigerate the dough for no less than 1 hour.", "name": "Carefully fold the chopped candy corn into the dough until the pieces are evenly dispersed. Cover the bowl securely with plastic wrap and refrigerate the dough for no less than 1 hour.", "url": "https://erecip.github.io/en/candy-corn-cookies/#wprm-recipe-39831-step-0-3"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F. Lightly coat a cookie sheet with nonstick cooking spray.", "name": "Preheat the oven to 350°F. Lightly coat a cookie sheet with nonstick cooking spray.", "url": "https://erecip.github.io/en/candy-corn-cookies/#wprm-recipe-39831-step-0-4"}, {"@type": "HowToStep", "text": "Scoop out heaping tablespoons of chilled dough and roll each portion into a ball. Arrange the dough balls approximately 1 inch apart on the prepared baking sheet.", "name": "Scoop out heaping tablespoons of chilled dough and roll each portion into a ball. Arrange the dough balls approximately 1 inch apart on the prepared baking sheet.", "url": "https://erecip.github.io/en/candy-corn-cookies/#wprm-recipe-39831-step-0-5"}, {"@type": "HowToStep", "text": "Inspect each portion before baking. No candy corn should remain exposed along the bottom or sides of the dough balls. Cover any visible pieces with a small amount of dough to reduce the chance of melted candy escaping onto the pan.", "name": "Inspect each portion before baking. No candy corn should remain exposed along the bottom or sides of the dough balls. Cover any visible pieces with a small amount of dough to reduce the chance of melted candy escaping onto the pan.", "url": "https://erecip.github.io/en/candy-corn-cookies/#wprm-recipe-39831-step-0-6"}, {"@type": "HowToStep", "text": "Bake the cookies for 8–10 minutes. Remove them from the oven while the centers still appear slightly underdone. Avoid extending the baking time, as the cookies will continue to firm on the hot baking sheet.", "name": "Bake the cookies for 8–10 minutes. Remove them from the oven while the centers still appear slightly underdone. Avoid extending the baking time, as the cookies will continue to firm on the hot baking sheet.", "url": "https://erecip.github.io/en/candy-corn-cookies/#wprm-recipe-39831-step-0-7"}, {"@type": "HowToStep", "text": "Leave the cookies on the baking sheet for at least 10 minutes. This resting period allows them to set properly and makes them easier to lift from the pan.", "name": "Leave the cookies on the baking sheet for at least 10 minutes. This resting period allows them to set properly and makes them easier to lift from the pan.", "url": "https://erecip.github.io/en/candy-corn-cookies/#wprm-recipe-39831-step-0-8"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Candy Corn Cookies"}</script>
