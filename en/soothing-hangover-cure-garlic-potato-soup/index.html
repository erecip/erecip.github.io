    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Soothing Hangover Cure Garlic Potato Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warm, savory potato soup featuring both fresh and roasted garlic, tender potatoes, vegetable broth, and parsley. The potatoes can be partially mashed for a rustic, naturally creamy consistency or fully blended for a smooth finish.", "datePublished": "2019-05-15T18:48:37+00:00", "image": ["https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/soothing-hangover-cure-garlic-potato-soup2-1.png", "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/soothing-hangover-cure-garlic-potato-soup2-1.png", "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/soothing-hangover-cure-garlic-potato-soup2-1.png", "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/soothing-hangover-cure-garlic-potato-soup2-1.png"], "totalTime": "PT29M", "recipeIngredient": ["4  large potatoes (peeled and chopped into approximately 1-inch pieces)", "1  large head of roasted garlic (homemade or store-bought)", "1 tablespoon freshly chopped parsley", "4 cups vegetable broth", "4  fresh garlic cloves (finely minced)", "¼ teaspoon freshly ground black pepper", "2 tablespoons extra-virgin olive oil", "1 teaspoon salt (divided into two ½-teaspoon portions)", "1  small onion (cut into roughly ½-inch dice)", "Fresh parsley (chopped)", "Grated cheese (for added richness)", "Croutons (for a crisp finishing texture)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Peel the potatoes and cut them into 1-inch chunks. Dice the onion into approximately ½-inch pieces, then finely mince the fresh garlic cloves.", "name": "Peel the potatoes and cut them into 1-inch chunks. Dice the onion into approximately ½-inch pieces, then finely mince the fresh garlic cloves.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-0"}, {"@type": "HowToStep", "text": "Warm the extra-virgin olive oil in a large pot over medium heat until the oil begins to shimmer.", "name": "Warm the extra-virgin olive oil in a large pot over medium heat until the oil begins to shimmer.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-1"}, {"@type": "HowToStep", "text": "Add the diced onion and cook for approximately 8 minutes, stirring from time to time, until the pieces become tender and translucent. Allowing the onion to soften gradually brings out its natural sweetness and establishes the soup's aromatic foundation.", "name": "Add the diced onion and cook for approximately 8 minutes, stirring from time to time, until the pieces become tender and translucent. Allowing the onion to soften gradually brings out its natural sweetness and establishes the soup's aromatic foundation.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-2"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and ½ teaspoon of the salt. Cook for about 1 minute while stirring continuously, just until fragrant. Do not allow the garlic to brown, as excessive browning can produce a bitter flavor.", "name": "Stir in the minced garlic and ½ teaspoon of the salt. Cook for about 1 minute while stirring continuously, just until fragrant. Do not allow the garlic to brown, as excessive browning can produce a bitter flavor.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-3"}, {"@type": "HowToStep", "text": "Pour the vegetable broth into the pot and increase the heat to high. Bring the liquid to a boil.", "name": "Pour the vegetable broth into the pot and increase the heat to high. Bring the liquid to a boil.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-4"}, {"@type": "HowToStep", "text": "Add the potato chunks, the remaining ½ teaspoon salt, and 1 tablespoon of chopped fresh parsley.", "name": "Add the potato chunks, the remaining ½ teaspoon salt, and 1 tablespoon of chopped fresh parsley.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-5"}, {"@type": "HowToStep", "text": "When the soup returns to a gentle simmer, lower the heat to medium-low. Simmer uncovered for 15–20 minutes, or until the potatoes are thoroughly tender and can be pierced easily with a fork.", "name": "When the soup returns to a gentle simmer, lower the heat to medium-low. Simmer uncovered for 15–20 minutes, or until the potatoes are thoroughly tender and can be pierced easily with a fork.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-6"}, {"@type": "HowToStep", "text": "This cooking period allows the potatoes to soften sufficiently for mashing or blending while absorbing the flavors of the broth and aromatics.", "name": "This cooking period allows the potatoes to soften sufficiently for mashing or blending while absorbing the flavors of the broth and aromatics.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-7"}, {"@type": "HowToStep", "text": "Separate the softened cloves from the roasted garlic head and add them directly to the cooked potato mixture. Stir gently so the roasted garlic is distributed throughout the soup.", "name": "Separate the softened cloves from the roasted garlic head and add them directly to the cooked potato mixture. Stir gently so the roasted garlic is distributed throughout the soup.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-8"}, {"@type": "HowToStep", "text": "For a chunky, rustic consistency, remove approximately 1 cup of the cooked potatoes with a slotted spoon. Roughly mash them in a separate bowl, then return them to the pot and stir them into the soup. This thickens the broth naturally without adding cream.", "name": "For a chunky, rustic consistency, remove approximately 1 cup of the cooked potatoes with a slotted spoon. Roughly mash them in a separate bowl, then return them to the pot and stir them into the soup. This thickens the broth naturally without adding cream.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-9"}, {"@type": "HowToStep", "text": "For a completely smooth consistency, use an immersion blender to carefully purée the entire soup until it reaches the desired texture.", "name": "For a completely smooth consistency, use an immersion blender to carefully purée the entire soup until it reaches the desired texture.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-10"}, {"@type": "HowToStep", "text": "Stir in the freshly ground black pepper, then taste the soup and add additional salt only if needed.", "name": "Stir in the freshly ground black pepper, then taste the soup and add additional salt only if needed.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-11"}, {"@type": "HowToStep", "text": "Ladle the soup into serving bowls while hot. If desired, finish each portion with croutons for crunch and grated cheese for additional richness.", "name": "Ladle the soup into serving bowls while hot. If desired, finish each portion with croutons for crunch and grated cheese for additional richness.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-12"}, {"@type": "HowToStep", "text": "Sprinkle chopped fresh parsley over the top immediately before serving for freshness and color.", "name": "Sprinkle chopped fresh parsley over the top immediately before serving for freshness and color.", "url": "https://erecip.github.io/en/soothing-hangover-cure-garlic-potato-soup/#wprm-recipe-43285-step-0-13"}], "recipeCategory": ["Soup"], "keywords": "Soothing Hangover Cure Garlic Potato Soup"}</script>
