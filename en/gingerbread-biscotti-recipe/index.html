ti-recipe/#wprm-recipe-42277-step-0-3"}, {"@type": "HowToStep", "text": "Gradually add the prepared dry mixture to the wet ingredients. Stir just until everything is combined and a firm, stiff dough develops. Ensure no dry flour remains, but avoid excessive mixing.", "name": "Gradually add the prepared dry mixture to the wet ingredients. Stir just until everything is combined and a firm, stiff dough develops. Ensure no dry flour remains, but avoid excessive mixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-biscotti-recipe/#wprm-recipe-42277-step-0-4"}, {"@type": "HowToStep", "text": "Divide the dough into two equal portions. With well-floured hands, form each portion directly on the prepared baking sheet into a slightly flattened log measuring approximately 12 inches long and 2 inches wide. Flour your hands and the working surface generously as needed to prevent the sticky dough from adhering.", "name": "Divide the dough into two equal portions. With well-floured hands, form each portion directly on the prepared baking sheet into a slightly flattened log measuring approximately 12 inches long and 2 inches wide. Flour your hands and the working surface generously as needed to prevent the sticky dough from adhering.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-biscotti-recipe/#wprm-recipe-42277-step-0-5"}, {"@type": "HowToStep", "text": "Sprinkle the tops of both shaped logs with 1–2 tablespoons of powdered sugar.", "name": "Sprinkle the tops of both shaped logs with 1–2 tablespoons of powdered sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-biscotti-recipe/#wprm-recipe-42277-step-0-6"}, {"@type": "HowToStep", "text": "Place the baking sheet in the preheated oven and bake the logs for about 30 minutes, or until they feel slightly firm when gently touched.", "name": "Place the baking sheet in the preheated oven and bake the logs for about 30 minutes, or until they feel slightly firm when gently touched.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-biscotti-recipe/#wprm-recipe-42277-step-0-7"}, {"@type": "HowToStep", "text": "Remove the baking sheet from the oven and allow the logs to rest for 5–10 minutes before slicing.", "name": "Remove the baking sheet from the oven and allow the logs to rest for 5–10 minutes before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-biscotti-recipe/#wprm-recipe-42277-step-0-8"}, {"@type": "HowToStep", "text": "Carefully transfer the partially cooled logs to a cutting board. Using a sharp serrated knife, cut each log crosswise into slices approximately 3/4 inch thick.", "name": "Carefully transfer the partially cooled logs to a cutting board. Using a sharp serrated knife, cut each log crosswise into slices approximately 3/4 inch thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-biscotti-recipe/#wprm-recipe-42277-step-0-9"}, {"@type": "HowToStep", "text": "Arrange the sliced biscotti on the baking sheet with their cut surfaces facing downward. Return them to the oven and bake for approximately 10 minutes, or until they become crisp.", "name": "Arrange the sliced biscotti on the baking sheet with their cut surfaces facing downward. Return them to the oven and bake for approximately 10 minutes, or until they become crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-biscotti-recipe/#wprm-recipe-42277-step-0-10"}, {"@type": "HowToStep", "text": "Transfer the finished biscotti to a wire rack and allow them to cool completely before serving or storing.", "name": "Transfer the finished biscotti to a wire rack and allow them to cool completely before serving or storing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gingerbread-biscotti-recipe/#wprm-recipe-42277-step-0-11"}], "recipeCategory": ["Cookies"], "recipeCuisine": ["American"], "keywords": "Gingerbread Biscott
