-0-1"}, {"@type": "HowToStep", "text": "Arrange the fries in the air fryer basket in batches to prevent overcrowding and ensure even cooking. Air fry for about 12 minutes, turning halfway through, until the fries are golden and crisp.", "name": "Arrange the fries in the air fryer basket in batches to prevent overcrowding and ensure even cooking. Air fry for about 12 minutes, turning halfway through, until the fries are golden and crisp.", "url": "https://erecip.github.io/en/air-fryer-sweet-potato-fries-recipe/#wprm-recipe-12132-step-0-2"}, {"@type": "HowToStep", "text": "Serve promptly, accompanied by your preferred dipping sauce.", "name": "Serve promptly, accompanied by your preferred dipping sauce.", "url": "https://erecip.github.io/en/air-fryer-sweet-potato-fries-recipe/#wprm-recipe-12132-step-0-3"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Air Fryer Sweet Potato Fries Recipe"}</script>
