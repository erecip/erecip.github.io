    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Meringue Pie Shooters", "author": {"@type": "Person", "name": "BenDes"}, "description": "These elegant dessert shooters feature layers of buttery vanilla wafer crumbs, smooth homemade lemon curd, and glossy Italian meringue. A lightly torched finish and fresh lemon zest provide the familiar flavor and appearance of classic lemon meringue pie in an individual serving.", "datePublished": "2019-08-21T17:00:17+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/lemon-meringue-pie-shooters.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/lemon-meringue-pie-shooters-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/lemon-meringue-pie-shooters-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/lemon-meringue-pie-shooters-480x270.png"], "cookTime": "PT10M", "totalTime": "PT10M", "recipeIngredient": ["1/2 cup freshly squeezed lemon juice", "4  egg yolks", "1/2 cup unsalted butter (divided into cubes)", "1/2 cup white granulated sugar", "2 tablespoons water", "2  egg whites (brought to room temperature)", "1/2 cup white granulated sugar", "Freshly grated lemon zest (as needed for finishing)", "1 cup vanilla wafer cookies (crushed into fine, sand-like crumbs)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Whisk the lemon juice, granulated sugar, and egg yolks together in a medium saucepan until the mixture is uniform and smooth.", "name": "Whisk the lemon juice, granulated sugar, and egg yolks together in a medium saucepan until the mixture is uniform and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-0"}, {"@type": "HowToStep", "text": "Set the saucepan over medium heat, then add the cubed unsalted butter.", "name": "Set the saucepan over medium heat, then add the cubed unsalted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-1"}, {"@type": "HowToStep", "text": "Cook while stirring continuously, allowing the butter to melt completely as the lemon mixture gradually thickens.", "name": "Cook while stirring continuously, allowing the butter to melt completely as the lemon mixture gradually thickens.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-2"}, {"@type": "HowToStep", "text": "Continue stirring for approximately 10–12 minutes, or until the curd is thick enough to coat the back of a spoon.", "name": "Continue stirring for approximately 10–12 minutes, or until the curd is thick enough to coat the back of a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-3"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Pour the lemon curd through a fine-mesh sieve into a clean bowl, pressing it through as necessary to eliminate any lumps.", "name": "Remove the saucepan from the heat. Pour the lemon curd through a fine-mesh sieve into a clean bowl, pressing it through as necessary to eliminate any lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-4"}, {"@type": "HowToStep", "text": "Place plastic wrap directly against the surface of the curd to prevent a skin from developing.", "name": "Place plastic wrap directly against the surface of the curd to prevent a skin from developing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the covered bowl to the refrigerator and chill until the curd is completely cold.", "name": "Transfer the covered bowl to the refrigerator and chill until the curd is completely cold.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-6"}, {"@type": "HowToStep", "text": "Combine the granulated sugar and water in a small saucepan.", "name": "Combine the granulated sugar and water in a small saucepan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-7"}, {"@type": "HowToStep", "text": "Heat over medium-high heat until the sugar has dissolved and the syrup registers 240°F (115°C) on a candy thermometer.", "name": "Heat over medium-high heat until the sugar has dissolved and the syrup registers 240°F (115°C) on a candy thermometer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-8"}, {"@type": "HowToStep", "text": "While the syrup is heating, place the room-temperature egg whites in a clean mixing bowl. Beat with an electric mixer until soft peaks form.", "name": "While the syrup is heating, place the room-temperature egg whites in a clean mixing bowl. Beat with an electric mixer until soft peaks form.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-9"}, {"@type": "HowToStep", "text": "With the mixer running at high speed, gradually pour the hot sugar syrup into the beaten egg whites in a slow, steady stream.", "name": "With the mixer running at high speed, gradually pour the hot sugar syrup into the beaten egg whites in a slow, steady stream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-10"}, {"@type": "HowToStep", "text": "Continue beating until the meringue becomes thick, stiff, glossy, and cool when touched.", "name": "Continue beating until the meringue becomes thick, stiff, glossy, and cool when touched.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-11"}, {"@type": "HowToStep", "text": "Beat for one additional minute when a firmer consistency is desired for piping.", "name": "Beat for one additional minute when a firmer consistency is desired for piping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-12"}, {"@type": "HowToStep", "text": "Arrange small shooter glasses or individual dessert cups on a work surface.", "name": "Arrange small shooter glasses or individual dessert cups on a work surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-13"}, {"@type": "HowToStep", "text": "Place a spoonful of finely crushed vanilla wafer cookies in the base of each glass.", "name": "Place a spoonful of finely crushed vanilla wafer cookies in the base of each glass.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-14"}, {"@type": "HowToStep", "text": "Spoon or pipe a layer of the chilled lemon curd over the cookie crumbs.", "name": "Spoon or pipe a layer of the chilled lemon curd over the cookie crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-15"}, {"@type": "HowToStep", "text": "Top the lemon curd with a spoonful or piped layer of Italian meringue.", "name": "Top the lemon curd with a spoonful or piped layer of Italian meringue.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-16"}, {"@type": "HowToStep", "text": "Pass a kitchen torch lightly over the surface of each meringue topping until delicately browned.", "name": "Pass a kitchen torch lightly over the surface of each meringue topping until delicately browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-17"}, {"@type": "HowToStep", "text": "Complete each shooter with a small amount of freshly grated lemon zest for fragrance, color, and fresh citrus flavor.", "name": "Complete each shooter with a small amount of freshly grated lemon zest for fragrance, color, and fresh citrus flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-18"}, {"@type": "HowToStep", "text": "Serve the lemon meringue pie shooters immediately for the best contrast of textures, or refrigerate them until serving time.", "name": "Serve the lemon meringue pie shooters immediately for the best contrast of textures, or refrigerate them until serving time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-meringue-pie-shooters/#wprm-recipe-40774-step-0-19"}], "recipeCategory": ["Dessert"], "keywords": "Lemon Meringue Pie Shooters"}</script>
