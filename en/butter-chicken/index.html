    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Butter Chicken (Murgh Makhani)", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic North Indian dish, Butter Chicken is known for its rich, velvety tomato-based sauce, infused with warming spices and tender pieces of marinated chicken. This version delivers a balanced combination of depth, creaminess, and gentle heat, perfect for enjoying with warm naan or steamed basmati rice.", "datePublished": "2024-09-12T19:26:21+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/butter-chicken.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/butter-chicken.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/butter-chicken.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/butter-chicken.jpg"], "recipeYield": ["6"], "prepTime": "PT15M", "cookTime": "PT35M", "totalTime": "PT50M", "recipeIngredient": ["Juice from 1½ medium lemons (approx. 3 tablespoons)", "1 tablespoon of freshly grated garlic", "1 tablespoon of ground garam masala spice mix", "2¼ pounds of boneless (skinless chicken breasts, chopped into 1–2 inch cubes)", "1½ teaspoons coarse kosher salt", "2 tablespoons unsalted butter", "1 tablespoon finely chopped cilantro (for optional garnish)", "2 tablespoons of minced fresh ginger root", "2½ cups of finely diced yellow onions (from about 2 large)", "2 tablespoons of minced garlic", "1 teaspoon ground cumin", "¼ cup neutral cooking oil or traditional ghee", "2 teaspoons kosher salt (or more to adjust seasoning)", "¼ teaspoon cayenne pepper", "¾ cup of full-fat whipping cream (also referred to as heavy cream or 35% milk fat cream)", "1 tablespoon sweet paprika", "3 tablespoons garam masala spice blend", "¼ teaspoon ground cinnamon", "1¼ cups of chopped tomatoes (preferably no-salt-added if using canned)"], "recipeInstructions": [{"@type": "HowToSection", "name": "Marinating the Chicken:", "itemListElement": [{"@type": "HowToStep", "text": "In a resealable plastic bag or shallow dish, combine the chicken with lemon juice, garlic, garam masala, and salt. Mix thoroughly to coat the chicken evenly. Leave at room temperature to marinate while preparing the sauce, or refrigerate for up to 24 hours.", "name": "In a resealable plastic bag or shallow dish, combine the chicken with lemon juice, garlic, garam masala, and salt. Mix thoroughly to coat the chicken evenly. Leave at room temperature to marinate while preparing the sauce, or refrigerate for up to 24 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/#wprm-recipe-32453-step-0-0"}]}, {"@type": "HowToSection", "name": "Preparing the Sauce:", "itemListElement": [{"@type": "HowToStep", "text": "In a large Dutch oven or heavy-bottomed saucepan, warm the oil or ghee over medium heat. Add the chopped onions and cook slowly, stirring occasionally, until deep golden in color—this should take around 20 minutes. Lower the heat if the onions start to brown too rapidly.", "name": "In a large Dutch oven or heavy-bottomed saucepan, warm the oil or ghee over medium heat. Add the chopped onions and cook slowly, stirring occasionally, until deep golden in color—this should take around 20 minutes. Lower the heat if the onions start to brown too rapidly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/#wprm-recipe-32453-step-1-0"}, {"@type": "HowToStep", "text": "Introduce the garlic and ginger to the pan, sautéing for approximately 1 minute until aromatic.", "name": "Introduce the garlic and ginger to the pan, sautéing for approximately 1 minute until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/#wprm-recipe-32453-step-1-1"}, {"@type": "HowToStep", "text": "Add the garam masala, paprika, cumin, cinnamon, cayenne, and salt to the mixture. Let the spices bloom and toast for another minute.", "name": "Add the garam masala, paprika, cumin, cinnamon, cayenne, and salt to the mixture. Let the spices bloom and toast for another minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/#wprm-recipe-32453-step-1-2"}, {"@type": "HowToStep", "text": "Pour in the diced tomatoes, cooking them down for 2 minutes to meld the flavors. Stir in the heavy cream and allow the sauce to heat through. If desired, blend the sauce using an immersion blender (or transfer to a blender) for a smooth consistency. The mixture may appear thick, which is expected.", "name": "Pour in the diced tomatoes, cooking them down for 2 minutes to meld the flavors. Stir in the heavy cream and allow the sauce to heat through. If desired, blend the sauce using an immersion blender (or transfer to a blender) for a smooth consistency. The mixture may appear thick, which is expected.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/#wprm-recipe-32453-step-1-3"}]}, {"@type": "HowToSection", "name": "Bringing the Dish Together:", "itemListElement": [{"@type": "HowToStep", "text": "Add the marinated chicken and all of its juices directly into the sauce. Cover and allow the curry to simmer gently over medium-low heat for roughly 12 minutes, or until the chicken pieces are fully cooked through with no pink centers. Avoid vigorous boiling to maintain tender texture.", "name": "Add the marinated chicken and all of its juices directly into the sauce. Cover and allow the curry to simmer gently over medium-low heat for roughly 12 minutes, or until the chicken pieces are fully cooked through with no pink centers. Avoid vigorous boiling to maintain tender texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/#wprm-recipe-32453-step-2-0"}, {"@type": "HowToStep", "text": "Incorporate the butter at the end, stirring until fully melted. Taste and adjust salt as needed. Sprinkle with fresh cilantro before serving, if desired.", "name": "Incorporate the butter at the end, stirring until fully melted. Taste and adjust salt as needed. Sprinkle with fresh cilantro before serving, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-chicken/#wprm-recipe-32453-step-2-1"}]}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Indian"], "keywords": "butter chicken"}</script>
