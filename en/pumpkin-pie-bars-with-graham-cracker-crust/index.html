    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Pie Bars with Graham Cracker Crust", "author": {"@type": "Person", "name": "BenDes"}, "description": "These pumpkin pie bars pair a crisp, buttery graham cracker base with a smooth, warmly spiced pumpkin custard. After baking, the bars are thoroughly chilled to create a firm texture that slices neatly and can be finished with whipped cream before serving.", "datePublished": "2023-08-05T06:14:25+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/pumpkin-pie-bars-with-graham-cracker-crust.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/pumpkin-pie-bars-with-graham-cracker-crust.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/pumpkin-pie-bars-with-graham-cracker-crust.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/pumpkin-pie-bars-with-graham-cracker-crust.png"], "cookTime": "PT32M", "totalTime": "PT37M", "recipeIngredient": ["6 tablespoons unsalted butter (melted and allowed to cool slightly)", "1/8 teaspoon salt", "3 tablespoons granulated sugar", "1 1/4 cups finely crushed graham crackers (approximately 8 full sheets)", "1 1/2 cups pure pumpkin purée (not pumpkin pie filling)", "1/4 teaspoon ground nutmeg", "1 cup heavy cream", "1/2 teaspoon fine salt", "3  large eggs (brought to room temperature)", "1/2 teaspoon ground ginger", "1/2 cup granulated sugar", "1/4 teaspoon ground cloves", "1 teaspoon ground cinnamon", "1/2 teaspoon vanilla extract", "Whipped cream"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 325°F (163°C). Lightly coat a 9-inch square baking pan with cooking spray. Line the pan with foil, allowing several inches to extend beyond the edges so the chilled bars can be lifted out easily. Lightly spray the foil with additional cooking spray, then set the prepared pan aside.", "name": "Preheat the oven to 325°F (163°C). Lightly coat a 9-inch square baking pan with cooking spray. Line the pan with foil, allowing several inches to extend beyond the edges so the chilled bars can be lifted out easily. Lightly spray the foil with additional cooking spray, then set the prepared pan aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-0"}, {"@type": "HowToStep", "text": "Place the graham cracker crumbs, melted unsalted butter, granulated sugar, and salt in a mixing bowl. Stir thoroughly until all of the crumbs are evenly coated and moistened.", "name": "Place the graham cracker crumbs, melted unsalted butter, granulated sugar, and salt in a mixing bowl. Stir thoroughly until all of the crumbs are evenly coated and moistened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the crumb mixture to the prepared baking pan. Press it firmly and evenly across the bottom to form a uniform crust.", "name": "Transfer the crumb mixture to the prepared baking pan. Press it firmly and evenly across the bottom to form a uniform crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-2"}, {"@type": "HowToStep", "text": "Bake the crust at 325°F (163°C) for 5 minutes. Remove the pan from the oven and place it on a wire rack to cool while the pumpkin filling is prepared.", "name": "Bake the crust at 325°F (163°C) for 5 minutes. Remove the pan from the oven and place it on a wire rack to cool while the pumpkin filling is prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-3"}, {"@type": "HowToStep", "text": "Increase the oven temperature to 375°F (190°C).", "name": "Increase the oven temperature to 375°F (190°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-4"}, {"@type": "HowToStep", "text": "Combine the room-temperature eggs and granulated sugar in a large mixing bowl. Using an electric mixer on medium speed, beat for approximately 1–2 minutes, until the mixture becomes pale and noticeably thickened.", "name": "Combine the room-temperature eggs and granulated sugar in a large mixing bowl. Using an electric mixer on medium speed, beat for approximately 1–2 minutes, until the mixture becomes pale and noticeably thickened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-5"}, {"@type": "HowToStep", "text": "Add the vanilla extract, cinnamon, ginger, nutmeg, cloves, and salt. Beat until the spices and flavorings are evenly distributed.", "name": "Add the vanilla extract, cinnamon, ginger, nutmeg, cloves, and salt. Beat until the spices and flavorings are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-6"}, {"@type": "HowToStep", "text": "Add the pure pumpkin purée and heavy cream. Continue beating until the filling is completely blended and smooth.", "name": "Add the pure pumpkin purée and heavy cream. Continue beating until the filling is completely blended and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-7"}, {"@type": "HowToStep", "text": "Pour the prepared pumpkin mixture evenly over the cooled graham cracker crust.", "name": "Pour the prepared pumpkin mixture evenly over the cooled graham cracker crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-8"}, {"@type": "HowToStep", "text": "Bake at 375°F (190°C) for 32–40 minutes. The filling is ready when the center has set and no longer jiggles when the pan is gently shaken.", "name": "Bake at 375°F (190°C) for 32–40 minutes. The filling is ready when the center has set and no longer jiggles when the pan is gently shaken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the pan to a wire rack and allow the bars to cool completely to room temperature.", "name": "Transfer the pan to a wire rack and allow the bars to cool completely to room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-10"}, {"@type": "HowToStep", "text": "Once cooled, refrigerate the bars for a minimum of 6 hours or leave them refrigerated overnight so the filling becomes sufficiently firm for clean slicing.", "name": "Once cooled, refrigerate the bars for a minimum of 6 hours or leave them refrigerated overnight so the filling becomes sufficiently firm for clean slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-11"}, {"@type": "HowToStep", "text": "After the bars are thoroughly chilled, grasp the foil overhang and carefully lift the entire dessert from the pan. If any edges adhere to the sides, loosen them gently with a knife before lifting.", "name": "After the bars are thoroughly chilled, grasp the foil overhang and carefully lift the entire dessert from the pan. If any edges adhere to the sides, loosen them gently with a knife before lifting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-12"}, {"@type": "HowToStep", "text": "Place the slab on a cutting board and cut it into individual bars. Serve chilled, adding whipped cream to each portion if desired.", "name": "Place the slab on a cutting board and cut it into individual bars. Serve chilled, adding whipped cream to each portion if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-bars-with-graham-cracker-crust/#wprm-recipe-46305-step-0-13"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Pie Bars with Graham Cracker Crust"}</script>
