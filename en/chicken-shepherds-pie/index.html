    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Shepherds Pie", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty chicken shepherds pie featuring tender pieces of poached chicken, mixed vegetables, and a savory cream-enriched gravy beneath a generous layer of buttery mashed potatoes. A brief broil gives the potato topping an appetizing golden finish.", "datePublished": "2021-03-16T10:52:35+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/chicken-shepherds-pie.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/chicken-shepherds-pie.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/chicken-shepherds-pie.png"], "cookTime": "PT46M", "totalTime": "PT51M", "recipeIngredient": ["2 cups frozen mixed vegetables (such as peas, carrots, and corn)", "3  garlic cloves (finely minced)", "1 teaspoon Worcestershire sauce", "4 tablespoons unsalted butter", "¼ teaspoon ground sage", "2 pounds boneless (skinless chicken breasts or thighs, cut into 1-inch pieces)", "½ teaspoon dried rosemary", "⅓ cup all-purpose flour", "½  small yellow onion (minced into roughly ¼-inch pieces)", "½ cup half-and-half", "¼ teaspoon ground black pepper", "1  chicken bouillon cube", "½ teaspoon mustard powder", "3 cups chicken broth (divided as needed)", "½ teaspoon dried thyme", "½ teaspoon onion powder", "Salt and additional black pepper (to taste)", "5 cups warm (creamy mashed potatoes)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 450°F. Cut the boneless chicken into approximately 1-inch chunks. Finely chop the yellow onion into roughly ¼-inch pieces and mince the garlic.", "name": "Preheat the oven to 450°F. Cut the boneless chicken into approximately 1-inch chunks. Finely chop the yellow onion into roughly ¼-inch pieces and mince the garlic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-0"}, {"@type": "HowToStep", "text": "Combine the onion powder, mustard powder, dried thyme, dried rosemary, ground sage, and ¼ teaspoon black pepper in a small bowl. Set the seasoning mixture aside so it is ready when needed.", "name": "Combine the onion powder, mustard powder, dried thyme, dried rosemary, ground sage, and ¼ teaspoon black pepper in a small bowl. Set the seasoning mixture aside so it is ready when needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-1"}, {"@type": "HowToStep", "text": "Pour the 3 cups chicken broth into a large pot or skillet and bring it to a gentle simmer over medium-high heat.", "name": "Pour the 3 cups chicken broth into a large pot or skillet and bring it to a gentle simmer over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-2"}, {"@type": "HowToStep", "text": "Add the chicken pieces and season them with salt and black pepper to taste. Simmer for approximately 15 minutes, or until the chicken is completely cooked and no pink remains in the center.", "name": "Add the chicken pieces and season them with salt and black pepper to taste. Simmer for approximately 15 minutes, or until the chicken is completely cooked and no pink remains in the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-3"}, {"@type": "HowToStep", "text": "Lift the chicken from the broth with a slotted spoon and transfer it to a bowl. Keep the cooking broth in the pot; approximately 2½ to 3 cups should remain for preparing the sauce.", "name": "Lift the chicken from the broth with a slotted spoon and transfer it to a bowl. Keep the cooking broth in the pot; approximately 2½ to 3 cups should remain for preparing the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-4"}, {"@type": "HowToStep", "text": "Melt the butter in a large skillet over medium heat. Add the minced yellow onion and cook for about 4 minutes, stirring from time to time, until softened and translucent.", "name": "Melt the butter in a large skillet over medium heat. Add the minced yellow onion and cook for about 4 minutes, stirring from time to time, until softened and translucent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-5"}, {"@type": "HowToStep", "text": "Stir in the minced garlic along with the prepared seasoning mixture. Cook for 1 minute, just until the garlic and herbs become fragrant.", "name": "Stir in the minced garlic along with the prepared seasoning mixture. Cook for 1 minute, just until the garlic and herbs become fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-6"}, {"@type": "HowToStep", "text": "Scatter the flour evenly over the mixture. Stir continuously for approximately 2 minutes to form a light roux that will provide the thickening base for the filling.", "name": "Scatter the flour evenly over the mixture. Stir continuously for approximately 2 minutes to form a light roux that will provide the thickening base for the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-7"}, {"@type": "HowToStep", "text": "Slowly add 2 cups of the reserved chicken broth to the roux, stirring continuously to keep the sauce smooth and free of lumps. Pour in the half-and-half and mix thoroughly.", "name": "Slowly add 2 cups of the reserved chicken broth to the roux, stirring continuously to keep the sauce smooth and free of lumps. Pour in the half-and-half and mix thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-8"}, {"@type": "HowToStep", "text": "Crumble the chicken bouillon cube into the skillet, then stir in the Worcestershire sauce until evenly incorporated.", "name": "Crumble the chicken bouillon cube into the skillet, then stir in the Worcestershire sauce until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-9"}, {"@type": "HowToStep", "text": "Return the cooked chicken to the skillet. If a looser, saucier consistency is desired, gradually incorporate up to 1 additional cup of the reserved broth.", "name": "Return the cooked chicken to the skillet. If a looser, saucier consistency is desired, gradually incorporate up to 1 additional cup of the reserved broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-10"}, {"@type": "HowToStep", "text": "Maintain a gentle simmer for 10–15 minutes, stirring occasionally, until the sauce thickens sufficiently to coat the back of a spoon.", "name": "Maintain a gentle simmer for 10–15 minutes, stirring occasionally, until the sauce thickens sufficiently to coat the back of a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-11"}, {"@type": "HowToStep", "text": "Stir the frozen mixed vegetables directly into the hot chicken filling, then remove the skillet from the heat. The remaining heat will begin warming the vegetables without cooking them excessively.", "name": "Stir the frozen mixed vegetables directly into the hot chicken filling, then remove the skillet from the heat. The remaining heat will begin warming the vegetables without cooking them excessively.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the chicken and vegetable mixture to a 9 × 13-inch baking dish, spreading the filling into an even layer.", "name": "Transfer the chicken and vegetable mixture to a 9 × 13-inch baking dish, spreading the filling into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-13"}, {"@type": "HowToStep", "text": "Spoon the 5 cups of warm mashed potatoes over the filling. Using a spatula or the back of a spoon, carefully spread the potatoes into an even layer across the entire surface.", "name": "Spoon the 5 cups of warm mashed potatoes over the filling. Using a spatula or the back of a spoon, carefully spread the potatoes into an even layer across the entire surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-14"}, {"@type": "HowToStep", "text": "Place the assembled shepherds pie into the preheated 450°F oven. Bake for 10 minutes, or until the filling is visibly bubbling around the edges.", "name": "Place the assembled shepherds pie into the preheated 450°F oven. Bake for 10 minutes, or until the filling is visibly bubbling around the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-15"}, {"@type": "HowToStep", "text": "Change the oven setting to broil and continue cooking for approximately 4 minutes, monitoring closely until the mashed potato surface develops a golden-brown color.", "name": "Change the oven setting to broil and continue cooking for approximately 4 minutes, monitoring closely until the mashed potato surface develops a golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-16"}, {"@type": "HowToStep", "text": "Remove the dish from the oven and allow the shepherds pie to rest for 5 minutes before portioning and serving.", "name": "Remove the dish from the oven and allow the shepherds pie to rest for 5 minutes before portioning and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-shepherds-pie/#wprm-recipe-44683-step-0-17"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Chicken Shepherds Pie"}</script>
