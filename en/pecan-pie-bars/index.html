e": "en-US", "publisher": {"@id": "https://erecip.github.io/#organization"}}]}</script>
    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pecan Pie Bars", "author": {"@type": "Person", "name": "BenDes"}, "description": "These pecan pie bars feature a buttery shortbread-style base topped with a rich filling of brown sugar, corn syrup, eggs, and chopped pecans. Optional chocolate chips add extra richness, while bourbon and a small amount of sea salt deepen and enhance the nutty flavor.", "datePublished": "2018-07-07T09:59:39+00:00", "image": ["https://erecip.github.io/en/pecan-pie-bars/pecan-pie-bars.png", "https://erecip.github.io/en/pecan-pie-bars/pecan-pie-bars.png", "https://erecip.github.io/en/pecan-pie-bars/pecan-pie-bars.png", "https://erecip.github.io/en/pecan-pie-bars/pecan-pie-bars.png"], "cookTime": "PT40M", "totalTime": "PT160M", "recipeIngredient": ["1 cup unsalted butter (softened to room temperature)", "½ cup granulated sugar", "2 cups all-purpose flour", "1½ cups pecans (roughly chopped into approximately ¼-inch pieces)", "1 cup firmly packed brown sugar", "1 teaspoon vanilla extract", "3  large eggs (brought to room temperature)", "2 tablespoons unsalted butter (melted and allowed to cool slightly)", "1 cup light corn syrup", "A pinch of sea salt", "Bourbon (according to taste)", "½ cup chocolate chips"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Line a 9 × 13-inch baking pan with parchment paper, leaving enough excess paper along the sides to serve as handles when removing the finished bars.", "name": "Preheat the oven to 350°F. Line a 9 × 13-inch baking pan with parchment paper, leaving enough excess paper along the sides to serve as handles when removing the finished bars.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-0"}, {"@type": "HowToStep", "text": "Combine the all-purpose flour and granulated sugar in a medium mixing bowl. Add the softened unsalted butter and work it into the dry ingredients with a fork or your fingertips until the mixture develops a coarse, breadcrumb-like consistency.", "name": "Combine the all-purpose flour and granulated sugar in a medium mixing bowl. Add the softened unsalted butter and work it into the dry ingredients with a fork or your fingertips until the mixture develops a coarse, breadcrumb-like consistency.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the crust mixture to the lined baking pan. Press it firmly into an even layer, extending it carefully into the corners and slightly upward along the edges of the pan.", "name": "Transfer the crust mixture to the lined baking pan. Press it firmly into an even layer, extending it carefully into the corners and slightly upward along the edges of the pan.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-2"}, {"@type": "HowToStep", "text": "Bake the crust for 15 minutes, or until it is set and lightly golden without becoming deeply browned.", "name": "Bake the crust for 15 minutes, or until it is set and lightly golden without becoming deeply browned.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-3"}, {"@type": "HowToStep", "text": "While the crust is baking, whisk the eggs, light corn syrup, packed brown sugar, melted and slightly cooled butter, and vanilla extract together in a large bowl until the mixture is smooth and thoroughly blended.", "name": "While the crust is baking, whisk the eggs, light corn syrup, packed brown sugar, melted and slightly cooled butter, and vanilla extract together in a large bowl until the mixture is smooth and thoroughly blended.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-4"}, {"@type": "HowToStep", "text": "If using bourbon, stir it into the filling at this stage according to taste. Approximately 1 tablespoon may be used for added depth while keeping the bourbon flavor subtle.", "name": "If using bourbon, stir it into the filling at this stage according to taste. Approximately 1 tablespoon may be used for added depth while keeping the bourbon flavor subtle.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-5"}, {"@type": "HowToStep", "text": "Fold the chopped pecans gently into the mixture until they are distributed evenly. Add a small pinch of sea salt, if desired.", "name": "Fold the chopped pecans gently into the mixture until they are distributed evenly. Add a small pinch of sea salt, if desired.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-6"}, {"@type": "HowToStep", "text": "As soon as the partially baked crust is removed from the oven, pour the prepared pecan filling evenly over its surface. Carefully spread the mixture toward all edges of the pan.", "name": "As soon as the partially baked crust is removed from the oven, pour the prepared pecan filling evenly over its surface. Carefully spread the mixture toward all edges of the pan.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-7"}, {"@type": "HowToStep", "text": "If using chocolate chips, scatter the ½ cup evenly across the top of the filling.", "name": "If using chocolate chips, scatter the ½ cup evenly across the top of the filling.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-8"}, {"@type": "HowToStep", "text": "Return the pan to the 350°F oven and continue baking for 25–30 minutes. The filling should appear set around the edges while retaining a slight movement in the very center when the pan is gently shaken.", "name": "Return the pan to the 350°F oven and continue baking for 25–30 minutes. The filling should appear set around the edges while retaining a slight movement in the very center when the pan is gently shaken.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-9"}, {"@type": "HowToStep", "text": "The surface should become golden brown, and the outer edges of the filling may begin to pull away slightly from the sides of the pan.", "name": "The surface should become golden brown, and the outer edges of the filling may begin to pull away slightly from the sides of the pan.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-10"}, {"@type": "HowToStep", "text": "Place the pan on a wire cooling rack and allow the pecan pie bars to cool completely. This generally requires about 2 hours and allows the filling to firm sufficiently for clean slicing.", "name": "Place the pan on a wire cooling rack and allow the pecan pie bars to cool completely. This generally requires about 2 hours and allows the filling to firm sufficiently for clean slicing.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-11"}, {"@type": "HowToStep", "text": "Once fully cooled, grasp the parchment paper overhang and carefully lift the entire slab from the pan. Transfer it to a cutting board.", "name": "Once fully cooled, grasp the parchment paper overhang and carefully lift the entire slab from the pan. Transfer it to a cutting board.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-12"}, {"@type": "HowToStep", "text": "Slice the slab into squares. For generous portions, cut approximately 2-inch squares. Wipe the knife with a damp cloth between cuts to maintain neat, defined edges.", "name": "Slice the slab into squares. For generous portions, cut approximately 2-inch squares. Wipe the knife with a damp cloth between cuts to maintain neat, defined edges.", "url": "https://erecip.github.io/en/pecan-pie-bars/#wprm-recipe-45230-step-0-13"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pecan Pie Bars"}</script>
