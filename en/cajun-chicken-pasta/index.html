a/#wprm-recipe-32174-step-0-0"}, {"@type": "HowToStep", "text": "Pound the chicken breasts to ensure even thickness. Generously coat both sides with 1½ tablespoons of Cajun seasoning.", "name": "Pound the chicken breasts to ensure even thickness. Generously coat both sides with 1½ tablespoons of Cajun seasoning.", "url": "https://erecip.github.io/en/cajun-chicken-pasta/#wprm-recipe-32174-step-0-1"}, {"@type": "HowToStep", "text": "Warm the olive oil in a wide, non-reactive skillet over medium-high heat. Add the chicken and sear each side until golden brown. Reduce heat and continue cooking until the internal temperature reaches 165°F. Transfer the chicken to a board, slice into thin strips, and cover to keep warm.", "name": "Warm the olive oil in a wide, non-reactive skillet over medium-high heat. Add the chicken and sear each side until golden brown. Reduce heat and continue cooking until the internal temperature reaches 165°F. Transfer the chicken to a board, slice into thin strips, and cover to keep warm.", "url": "https://erecip.github.io/en/cajun-chicken-pasta/#wprm-recipe-32174-step-0-2"}, {"@type": "HowToStep", "text": "In the same skillet over medium heat, melt the butter and sauté the garlic for about 30 to 60 seconds, or until aromatic. Stir in the diced tomatoes and cook for an additional 2 minutes.", "name": "In the same skillet over medium heat, melt the butter and sauté the garlic for about 30 to 60 seconds, or until aromatic. Stir in the diced tomatoes and cook for an additional 2 minutes.", "url": "https://erecip.github.io/en/cajun-chicken-pasta/#wprm-recipe-32174-step-0-3"}, {"@type": "HowToStep", "text": "Pour in the heavy cream, sprinkle in the remaining Cajun seasoning to preference, and stir in the Parmesan cheese. Simmer gently, tasting and adjusting seasoning as needed.", "name": "Pour in the heavy cream, sprinkle in the remaining Cajun seasoning to preference, and stir in the Parmesan cheese. Simmer gently, tasting and adjusting seasoning as
