    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Apple Cider Donut Cake with Apples", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender Bundt cake flavored with apple cider, freshly grated apples, warm spices, sour cream, and brown sugar. Once cooled, the cake is brushed with melted butter and coated in cinnamon sugar to recreate the familiar flavor and texture of an apple cider donut.", "datePublished": "2020-05-18T12:06:17+00:00", "image": ["https://erecip.github.io/en/apple-cider-donut-cake-with-apples/apple-cider-donut-cake-with-apples.png", "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/apple-cider-donut-cake-with-apples.png", "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/apple-cider-donut-cake-with-apples.png", "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/apple-cider-donut-cake-with-apples.png"], "cookTime": "PT55M", "totalTime": "PT65M", "recipeIngredient": ["1/3 cup apple cider (brought to room temperature)", "1 cup firmly packed dark brown sugar", "1/2 teaspoon ground ginger", "4  large eggs (at room temperature)", "2 teaspoons baking powder", "1 1/4 cups granulated sugar", "1 cup finely grated apple (approximately 2 medium Honeycrisp apples)", "1 1/2 teaspoons ground cinnamon (preferably Saigon cinnamon)", "2/3 cup sour cream", "1 tablespoon vanilla extract", "2 1/2 cups sifted cake flour", "1/2 teaspoon ground nutmeg", "1 1/4 cups salted butter (softened to approximately 67°F)", "Flour-containing baking spray (for coating the Bundt pan)", "1/4 cup salted butter (melted and allowed to cool slightly)", "A small pinch freshly grated nutmeg (optional)", "1 teaspoon ground cinnamon", "2/3 cup granulated sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Set the oven to 350°F and arrange an oven rack in the center position. Thoroughly coat a 10–12 cup Bundt pan with baking spray containing flour, taking care to cover every groove and recessed area of the pan.", "name": "Set the oven to 350°F and arrange an oven rack in the center position. Thoroughly coat a 10–12 cup Bundt pan with baking spray containing flour, taking care to cover every groove and recessed area of the pan.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-0"}, {"@type": "HowToStep", "text": "Sift the cake flour, baking powder, cinnamon, nutmeg, and ginger together into a medium mixing bowl. Set this mixture aside until needed.", "name": "Sift the cake flour, baking powder, cinnamon, nutmeg, and ginger together into a medium mixing bowl. Set this mixture aside until needed.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-1"}, {"@type": "HowToStep", "text": "Using an electric mixer at medium speed, beat the softened salted butter for approximately 2 minutes, or until fluffy.", "name": "Using an electric mixer at medium speed, beat the softened salted butter for approximately 2 minutes, or until fluffy.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-2"}, {"@type": "HowToStep", "text": "Add the granulated sugar and packed dark brown sugar. Continue beating at medium speed for another 3–4 minutes, until the mixture becomes noticeably pale, light, and airy.", "name": "Add the granulated sugar and packed dark brown sugar. Continue beating at medium speed for another 3–4 minutes, until the mixture becomes noticeably pale, light, and airy.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-3"}, {"@type": "HowToStep", "text": "With the mixer running, incorporate the eggs individually, allowing each egg to blend into the mixture before adding the next. Mix in the vanilla extract after all four eggs have been incorporated.", "name": "With the mixer running, incorporate the eggs individually, allowing each egg to blend into the mixture before adding the next. Mix in the vanilla extract after all four eggs have been incorporated.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-4"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the room-temperature sour cream together with the apple cider until the mixture is smooth and uniform.", "name": "In a separate bowl, whisk the room-temperature sour cream together with the apple cider until the mixture is smooth and uniform.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-5"}, {"@type": "HowToStep", "text": "Using a rubber spatula, gently fold approximately one-third of the prepared dry mixture into the creamed butter mixture. Stir only until the ingredients are nearly combined.", "name": "Using a rubber spatula, gently fold approximately one-third of the prepared dry mixture into the creamed butter mixture. Stir only until the ingredients are nearly combined.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-6"}, {"@type": "HowToStep", "text": "Fold in half of the sour cream and apple cider mixture. Follow with another third of the dry ingredients, then incorporate the remaining sour cream mixture.", "name": "Fold in half of the sour cream and apple cider mixture. Follow with another third of the dry ingredients, then incorporate the remaining sour cream mixture.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-7"}, {"@type": "HowToStep", "text": "Add the final portion of the dry ingredients and fold gently just until a cohesive batter forms. Avoid excessive mixing to preserve the cake's delicate texture.", "name": "Add the final portion of the dry ingredients and fold gently just until a cohesive batter forms. Avoid excessive mixing to preserve the cake's delicate texture.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-8"}, {"@type": "HowToStep", "text": "Carefully fold the grated apples into the completed batter until they are evenly distributed.", "name": "Carefully fold the grated apples into the completed batter until they are evenly distributed.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared Bundt pan and level the surface.", "name": "Transfer the batter to the prepared Bundt pan and level the surface.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-10"}, {"@type": "HowToStep", "text": "Bake at 350°F for 55–65 minutes. The cake is finished when a toothpick inserted near the center comes out clean.", "name": "Bake at 350°F for 55–65 minutes. The cake is finished when a toothpick inserted near the center comes out clean.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-11"}, {"@type": "HowToStep", "text": "Leave the baked cake in its pan for 10 minutes. Carefully invert it onto a wire cooling rack, remove the pan, and allow the cake to cool completely before applying the topping.", "name": "Leave the baked cake in its pan for 10 minutes. Carefully invert it onto a wire cooling rack, remove the pan, and allow the cake to cool completely before applying the topping.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-12"}, {"@type": "HowToStep", "text": "Combine the granulated sugar and ground cinnamon in a small bowl. If desired, mix in a pinch of freshly grated nutmeg.", "name": "Combine the granulated sugar and ground cinnamon in a small bowl. If desired, mix in a pinch of freshly grated nutmeg.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-13"}, {"@type": "HowToStep", "text": "Brush the slightly cooled melted salted butter over the entire exterior of the cooled cake, working it into the ridges and crevices of the Bundt shape.", "name": "Brush the slightly cooled melted salted butter over the entire exterior of the cooled cake, working it into the ridges and crevices of the Bundt shape.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-14"}, {"@type": "HowToStep", "text": "Distribute the cinnamon-sugar mixture generously over the butter-coated cake. Press the coating very lightly against the surface where necessary so that it adheres evenly.", "name": "Distribute the cinnamon-sugar mixture generously over the butter-coated cake. Press the coating very lightly against the surface where necessary so that it adheres evenly.", "url": "https://erecip.github.io/en/apple-cider-donut-cake-with-apples/#wprm-recipe-46594-step-0-15"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Apple Cider Donut Cake with Apples"}</script>
