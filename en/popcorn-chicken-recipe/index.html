    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Popcorn Chicken Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Crisp, succulent, and intensely flavorful, this popcorn chicken rivals any fast-food counterpart, delivering a delightful bite every time. Quick to prepare, this version is easily adjustable to your preferred seasonings.", "datePublished": "2024-10-05T18:47:51+00:00", "image": ["https://erecip.github.io/en/popcorn-chicken-recipe/Popcorn-Chicken-Recipe.png", "https://erecip.github.io/en/popcorn-chicken-recipe/Popcorn-Chicken-Recipe.png", "https://erecip.github.io/en/popcorn-chicken-recipe/Popcorn-Chicken-Recipe.png", "https://erecip.github.io/en/popcorn-chicken-recipe/Popcorn-Chicken-Recipe.png"], "recipeYield": ["4"], "prepTime": "PT25M", "cookTime": "PT25M", "totalTime": "PT50M", "recipeIngredient": ["1 lb 450–500 g boneless chicken breast", "2  egg whites (or ½ cup buttermilk or yogurt)", "¼ cup cornstarch or all-purpose flour", "Oil for deep frying", "2 cups panko crumbs or bread crumbs", "½ to 1½ teaspoon paprika (cayenne pepper, or red chili powder)", "¾ to 1 teaspoon salt (to taste)", "¼ teaspoon allspice or 2 teaspoons garam masala", "2 tablespoons buttermilk or yogurt (optional)", "½ teaspoon ground black pepper", "1 teaspoon onion powder (optional)", "1½ teaspoons garlic powder or 1 tablespoon ginger garlic paste", "Optional: 2 teaspoons wasabi or sriracha powder for serving"], "recipeInstructions": [{"@type": "HowToStep", "text": "Cut the chicken into small, even-sized pieces for uniform cooking. Combine the chicken with the seasoning mix and, if desired, blend in 2 tablespoons of buttermilk or yogurt. Cover and refrigerate for at least 30 minutes or up to 8 hours. Add the egg whites or buttermilk to the marinated chicken and mix thoroughly. Dust in cornstarch gradually, ensuring each piece is well-coated and the mixture remains moist. Spread the panko crumbs on a plate. Working piece by piece, dredge the chicken in the crumbs, pressing gently so the coating adheres firmly, resembling a double-breaded texture. Arrange the breaded pieces on a tray, then allow them to rest for 10–15 minutes or refrigerate in an airtight container for up to 48 hours.", "name": "Cut the chicken into small, even-sized pieces for uniform cooking. Combine the chicken with the seasoning mix and, if desired, blend in 2 tablespoons of buttermilk or yogurt. Cover and refrigerate for at least 30 minutes or up to 8 hours. Add the egg whites or buttermilk to the marinated chicken and mix thoroughly. Dust in cornstarch gradually, ensuring each piece is well-coated and the mixture remains moist. Spread the panko crumbs on a plate. Working piece by piece, dredge the chicken in the crumbs, pressing gently so the coating adheres firmly, resembling a double-breaded texture. Arrange the breaded pieces on a tray, then allow them to rest for 10–15 minutes or refrigerate in an airtight container for up to 48 hours.", "url": "https://erecip.github.io/en/popcorn-chicken-recipe/#wprm-recipe-14926-step-0-0"}, {"@type": "HowToStep", "text": "Heat oil in a deep pan over medium heat until it reaches about 350–375°F (175–190°C). Test by dropping a breadcrumb—if it sizzles and rises without burning, the oil is ready. Carefully lower each breaded chicken piece into the oil without stirring immediately to prevent the coating from separating. Avoid overcrowding; fry in batches to maintain the oil’s temperature. After 2 minutes, stir gently and fry until each piece turns golden and crisp, ensuring the internal temperature reaches 165°F (74°C). Transfer the cooked chicken to a wire rack set over paper towels or to a colander. Between batches, lower the heat, skim out loose crumbs with a mesh skimmer, and bring the oil back to frying temperature before proceeding.", "name": "Heat oil in a deep pan over medium heat until it reaches about 350–375°F (175–190°C). Test by dropping a breadcrumb—if it sizzles and rises without burning, the oil is ready. Carefully lower each breaded chicken piece into the oil without stirring immediately to prevent the coating from separating. Avoid overcrowding; fry in batches to maintain the oil’s temperature. After 2 minutes, stir gently and fry until each piece turns golden and crisp, ensuring the internal temperature reaches 165°F (74°C). Transfer the cooked chicken to a wire rack set over paper towels or to a colander. Between batches, lower the heat, skim out loose crumbs with a mesh skimmer, and bring the oil back to frying temperature before proceeding.", "url": "https://erecip.github.io/en/popcorn-chicken-recipe/#wprm-recipe-14926-step-0-1"}, {"@type": "HowToStep", "text": "Baking Option: Preheat the oven to 375°F (190°C). Arrange the prepared chicken on a tray and bake on the center rack for about 14 minutes, turning halfway through, until fully cooked.", "name": "Baking Option: Preheat the oven to 375°F (190°C). Arrange the prepared chicken on a tray and bake on the center rack for about 14 minutes, turning halfway through, until fully cooked.", "url": "https://erecip.github.io/en/popcorn-chicken-recipe/#wprm-recipe-14926-step-0-2"}, {"@type": "HowToStep", "text": "Air Fryer Option: Place the coated chicken in the air fryer basket and cook at 400°F (200°C) for approximately 10 minutes, flipping at the 5-minute mark. Ensure the internal temperature reaches 165°F (74°C) before serving.", "name": "Air Fryer Option: Place the coated chicken in the air fryer basket and cook at 400°F (200°C) for approximately 10 minutes, flipping at the 5-minute mark. Ensure the internal temperature reaches 165°F (74°C) before serving.", "url": "https://erecip.github.io/en/popcorn-chicken-recipe/#wprm-recipe-14926-step-0-3"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["American"], "keywords": "Popcorn Chicken Recipe"}</script>
