    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Dinner Rolls", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, tender homemade dinner rolls with golden tops and a light, fluffy interior. The dough is mixed and kneaded directly in the bowl, shaped into 15 rolls, proofed in a gently warmed oven, and baked until beautifully browned.", "datePublished": "2019-10-06T08:01:28+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/dinner-rolls2.png", "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/dinner-rolls2.png", "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/dinner-rolls2.png", "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/dinner-rolls2.png"], "cookTime": "PT20M", "totalTime": "PT23M", "recipeIngredient": ["3 3/4 cups plain all-purpose flour", "1/4 cup granulated sugar", "1  large egg (brought to room temperature)", "1 teaspoon salt", "1 1/4 cups warm water (approximately 110°F)", "1/3 cup vegetable oil (or another mild-flavored neutral oil such as canola)", "2 tablespoons active dry yeast", "Additional vegetable oil or cooking spray (for greasing the pan and hands)", "Melted butter (optional, for brushing the baked rolls)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Pour the warm water into a large mixing bowl and stir in the sugar and active dry yeast. The water should be approximately 110°F. Allow the mixture to stand for 2–5 minutes, or until a noticeable layer of foam develops and the yeast becomes fragrant.", "name": "Pour the warm water into a large mixing bowl and stir in the sugar and active dry yeast. The water should be approximately 110°F. Allow the mixture to stand for 2–5 minutes, or until a noticeable layer of foam develops and the yeast becomes fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-0"}, {"@type": "HowToStep", "text": "While the yeast activates, thoroughly grease the bottom and sides of a 9 × 13-inch baking pan with oil or butter to prevent the rolls from adhering during baking.", "name": "While the yeast activates, thoroughly grease the bottom and sides of a 9 × 13-inch baking pan with oil or butter to prevent the rolls from adhering during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-1"}, {"@type": "HowToStep", "text": "Add the vegetable oil, salt, and room-temperature egg to the foamy yeast mixture. Stir until the wet ingredients are generally combined.", "name": "Add the vegetable oil, salt, and room-temperature egg to the foamy yeast mixture. Stir until the wet ingredients are generally combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-2"}, {"@type": "HowToStep", "text": "Gradually work the all-purpose flour into the liquid mixture, stirring after each addition. Continue until all the flour has been absorbed and a rough, shaggy dough develops.", "name": "Gradually work the all-purpose flour into the liquid mixture, stirring after each addition. Continue until all the flour has been absorbed and a rough, shaggy dough develops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-3"}, {"@type": "HowToStep", "text": "Knead directly in the mixing bowl for approximately 4 minutes. Continue working the dough until it becomes smooth, soft, and slightly tacky without being excessively sticky.", "name": "Knead directly in the mixing bowl for approximately 4 minutes. Continue working the dough until it becomes smooth, soft, and slightly tacky without being excessively sticky.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-4"}, {"@type": "HowToStep", "text": "Lightly coat your hands with vegetable oil or cooking spray. Divide the prepared dough into 15 evenly sized portions, then roll each piece between your palms to form a smooth, firmly shaped ball.", "name": "Lightly coat your hands with vegetable oil or cooking spray. Divide the prepared dough into 15 evenly sized portions, then roll each piece between your palms to form a smooth, firmly shaped ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-5"}, {"@type": "HowToStep", "text": "Position the dough balls seam-side down in the prepared 9 × 13-inch pan, arranging them in three rows of five. Leave approximately 1/2 inch of space between the rolls to provide room for expansion.", "name": "Position the dough balls seam-side down in the prepared 9 × 13-inch pan, arranging them in three rows of five. Leave approximately 1/2 inch of space between the rolls to provide room for expansion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-6"}, {"@type": "HowToStep", "text": "Loosely cover the pan with plastic wrap or a damp kitchen towel. Preheat the oven to 375°F. Once it reaches the proper temperature, switch the oven off.", "name": "Loosely cover the pan with plastic wrap or a damp kitchen towel. Preheat the oven to 375°F. Once it reaches the proper temperature, switch the oven off.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-7"}, {"@type": "HowToStep", "text": "Place the covered pan inside the warm, turned-off oven. Let the dough proof for 30–45 minutes, until the rolls appear noticeably puffy and have nearly doubled in volume. They should feel soft and should have expanded to occupy most of the pan.", "name": "Place the covered pan inside the warm, turned-off oven. Let the dough proof for 30–45 minutes, until the rolls appear noticeably puffy and have nearly doubled in volume. They should feel soft and should have expanded to occupy most of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-8"}, {"@type": "HowToStep", "text": "Remove the risen rolls from the oven, then preheat the oven once again to 375°F.", "name": "Remove the risen rolls from the oven, then preheat the oven once again to 375°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-9"}, {"@type": "HowToStep", "text": "Return the pan to the fully preheated oven and bake the rolls for 18–20 minutes. They are ready when the tops are richly golden, the upper surfaces feel set, and the sides where the rolls meet are lightly golden. If the oven tends to bake hot, begin checking them at the 18-minute mark.", "name": "Return the pan to the fully preheated oven and bake the rolls for 18–20 minutes. They are ready when the tops are richly golden, the upper surfaces feel set, and the sides where the rolls meet are lightly golden. If the oven tends to bake hot, begin checking them at the 18-minute mark.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-10"}, {"@type": "HowToStep", "text": "Remove the baked rolls from the oven and leave them in the pan for 2–3 minutes. If desired, generously brush the warm tops with melted butter for additional richness and a glossy finish. Serve while still warm.", "name": "Remove the baked rolls from the oven and leave them in the pan for 2–3 minutes. If desired, generously brush the warm tops with melted butter for additional richness and a glossy finish. Serve while still warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dinner-rolls/#wprm-recipe-44261-step-0-11"}], "recipeCategory": ["Bread", "Dinner"], "keywords": "Dinner Rolls"}</script>
