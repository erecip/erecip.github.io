ile leaving fine marbling intact.", "name": "Cut the beef into uniform 1-inch pieces, removing any large deposits of fat while leaving fine marbling intact.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-beef-stew/#wprm-recipe-38905-step-0-0"}, {"@type": "HowToStep", "text": "Season the beef evenly with black pepper, garlic salt, and celery salt. Toss thoroughly so the seasoning reaches all sides of the meat.", "name": "Season the beef evenly with black pepper, garlic salt, and celery salt. Toss thoroughly so the seasoning reaches all sides of the meat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-beef-stew/#wprm-recipe-38905-step-0-1"}, {"@type": "HowToStep", "text": "Dust the seasoned beef with flour and turn the pieces until they are lightly and evenly coated.", "name": "Dust the seasoned beef with flour and turn the pieces until they are lightly and evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-beef-stew/#wprm-recipe-38905-step-0-2"}, {"@type": "HowToStep", "text": "Warm 3 tablespoons of olive oil in a large skillet set over medium-high heat.", "name": "Warm 3 tablespoons of olive oil in a large skillet set over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-beef-stew/#wprm-recipe-38905-step-0-3"}, {"@type": "HowToStep", "text": "Place the beef in the skillet in batches, keeping the pieces spaced apart to prevent crowding.", "name": "Place the beef in the skillet in batches, keeping the pieces spaced apart to prevent crowding.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-beef-stew/#wprm-recipe-38905-step-0-4"}, {"@type": "HowToStep", "text": "Sear the beef for about 45 seconds on each side, adding additional oil as needed. Once browned, transfer the meat to the crockpot.", "name": "Sear the beef for about 45 seconds on each side, adding additional oil as needed. Once browned, transfer the meat to the c wToStep", "text": "Gradually pour the slurry into the stew while stirring, then allow the stew to stand briefly so it can thicken.", "name": "Gradually pour the slurry into the stew while stirring, then allow the stew to stand briefly so it can thicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-beef-stew/#wprm-recipe-38905-step-0-17"}, {"@type": "HowToStep", "text": "Turn off the heat once the stew reaches the desired texture.", "name": "Turn off the heat once the stew reaches the desired texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-beef-stew/#wprm-recipe-38905-step-0-18"}, {"@type": "HowToStep", "text": "Stir in the remaining 2 tablespoons of cold butter to create a smooth, glossy finish. Add the optional Gravy Master for a richer color.", "name": "Stir in the remaining 2 tablespoons of cold butter to create a smooth, glossy finish. Add the optional Gravy Master for a richer color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-beef-stew/#wprm-recipe-38905-step-0-19"}, {"@type": "HowToStep", "text": "Serve the crockpot beef stew hot.", "name": "Serve the crockpot beef stew hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-beef-stew/#wprm-recipe-38905-step-0-20"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Crockpot Beef Stew"}</script>
