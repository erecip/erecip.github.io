    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Morning Breakfast Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty make-ahead breakfast casserole prepared with savory pork sausage, toasted bread, sharp cheddar, eggs, and half-and-half. The assembled dish rests in the refrigerator before baking, making it especially convenient for Christmas morning.", "datePublished": "2022-01-06T06:23:35+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/christmas-morning-breakfast-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/christmas-morning-breakfast-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/christmas-morning-breakfast-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/christmas-morning-breakfast-casserole.png"], "cookTime": "PT70M", "totalTime": "PT190M", "recipeIngredient": ["6  large eggs (beaten)", "2 cups sharp cheddar cheese (freshly shredded for optimal melting)", "1 pound ground pork sausage (such as Jimmy Dean’s)", "½ teaspoon salt", "1½ cups half-and-half (for added moisture and a tender texture)", "6 slices white bread (toasted and cut into 1-inch cubes)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Grease a 9×13-inch baking dish thoroughly, then set it aside.", "name": "Grease a 9×13-inch baking dish thoroughly, then set it aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-0"}, {"@type": "HowToStep", "text": "Place the ground pork sausage in a skillet over medium heat. Cook until completely browned, breaking it apart as needed during cooking.", "name": "Place the ground pork sausage in a skillet over medium heat. Cook until completely browned, breaking it apart as needed during cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-1"}, {"@type": "HowToStep", "text": "Drain away the excess grease once the sausage is fully cooked, then set the meat aside.", "name": "Drain away the excess grease once the sausage is fully cooked, then set the meat aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-2"}, {"@type": "HowToStep", "text": "Add the beaten eggs, half-and-half, and salt to a medium mixing bowl. Whisk until the mixture is evenly blended.", "name": "Add the beaten eggs, half-and-half, and salt to a medium mixing bowl. Whisk until the mixture is evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-3"}, {"@type": "HowToStep", "text": "Add the cooked sausage, toasted bread cubes, and shredded sharp cheddar cheese.", "name": "Add the cooked sausage, toasted bread cubes, and shredded sharp cheddar cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-4"}, {"@type": "HowToStep", "text": "Stir gently until the bread, sausage, and cheese are distributed throughout and evenly coated with the egg mixture.", "name": "Stir gently until the bread, sausage, and cheese are distributed throughout and evenly coated with the egg mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the combined mixture to the prepared 9×13-inch baking dish, spreading it evenly.", "name": "Transfer the combined mixture to the prepared 9×13-inch baking dish, spreading it evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-6"}, {"@type": "HowToStep", "text": "Cover the baking dish securely with foil and refrigerate for a minimum of 2 hours. For best results, allow the casserole to rest in the refrigerator overnight.", "name": "Cover the baking dish securely with foil and refrigerate for a minimum of 2 hours. For best results, allow the casserole to rest in the refrigerator overnight.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-7"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F.", "name": "Preheat the oven to 350°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-8"}, {"@type": "HowToStep", "text": "Keeping the casserole covered with foil, place it in the preheated oven and bake for 50–60 minutes.", "name": "Keeping the casserole covered with foil, place it in the preheated oven and bake for 50–60 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-9"}, {"@type": "HowToStep", "text": "Lower the oven temperature to 325°F and carefully remove the foil.", "name": "Lower the oven temperature to 325°F and carefully remove the foil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-10"}, {"@type": "HowToStep", "text": "Continue baking uncovered for another 20–30 minutes, or until the casserole is fully set and the center feels firm.", "name": "Continue baking uncovered for another 20–30 minutes, or until the casserole is fully set and the center feels firm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-11"}, {"@type": "HowToStep", "text": "Remove the finished casserole from the oven and allow it to cool slightly before serving.", "name": "Remove the finished casserole from the oven and allow it to cool slightly before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-morning-breakfast-casserole/#wprm-recipe-46003-step-0-12"}], "recipeCategory": ["Breakfast and Brunch"], "keywords": "Christmas Morning Breakfast Casserole"}</script>
