essive mixing.", "name": "Pour the liquid mixture into the dry ingredients. Whisk only until the batter becomes smooth and no visible flour streaks remain. Avoid excessive mixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-upside-down-cake/#wprm-recipe-45329-step-0-6"}, {"@type": "HowToStep", "text": "Scrape around the sides and bottom of the bowl as needed so the batter is uniformly combined.", "name": "Scrape around the sides and bottom of the bowl as needed so the batter is uniformly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-upside-down-cake/#wprm-recipe-45329-step-0-7"}, {"@type": "HowToStep", "text": "Carefully spread the finished cake batter over the prepared apple layer. Use a spatula to level the surface from one edge of the pan to the other.", "name": "Carefully spread the finished cake batter over the prepared apple layer. Use a spatula to level the surface from one edge of the pan to the other.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-upside-down-cake/#wprm-recipe-45329-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the pan to the preheated oven and bake for 30–35 minutes. The cake is ready when the surface appears golden and set and a toothpick inserted into the center comes out clean.", "name": "Transfer the pan to the preheated oven and bake for 30–35 minutes. The cake is ready when the surface appears golden and set and a toothpick inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-upside-down-cake/#wprm-recipe-45329-step-0-9"}, {"@type": "HowToStep", "text": "After removing the cake from the oven, gently run a knife around the inside edge of the pan to release the sides.", "name": "After removing the cake from the oven, gently run a knife around the inside edge of the pan to release the sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-upside-down-cake/#wprm-recipe-45329-step-0-10"}, {"@type": "HowToStep", "text": "Let the cake cool completely to room temperature. Position a serving plate over the pan, then carefully invert the cake so the caramelized apple layer becomes the top.", "name": "Let the cake cool completely to room temperature. Position a serving plate over the pan, then carefully invert the cake so the caramelized apple layer becomes the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-upside-down-cake/#wprm-recipe-45329-step-0-11"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Apple Upside Down Cake"}</script>
