o cubes in a large pot and cover them with water. Bring to a boil, then reduce to a simmer. Cook for 10-15 minutes, or until the potatoes are fork-tender. Drain using a colander and return the potatoes to the hot pot, allowing them to rest for 1 minute to remove excess moisture. Mash the potatoes with butter, half & half, garlic powder, salt, and pepper until smooth. Stir in the parmesan cheese until fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/ground-beef-shepherds-pie-recipe/#wprm-recipe-6496-step-1-0"}]}, {"@type": "HowToSection", "name": "Assemble and Bake:", "itemListElement": [{"@type": "HowToStep", "text": "Transfer the meat filling into a 9x9-inch or 7x11-inch baking dish, spreading it evenly. Top with the mashed potatoes, smoothing them into an even layer. If the dish is very full, place it on a rimmed baking sheet to catch any overflow. Bake, uncovered, for 25-30 minutes at 400°F. Let the Shepherd's Pie cool for 15 minutes before serving.", "name": "Transfer the meat filling into a 9x9-inch or 7x11-inch baking dish, spreading it evenly. Top with the mashed potatoes, smoothing them into an even layer. If the dish is very full, place it on a rimmed baking sheet to catch any overflow. Bake, uncovered, for 25-30 minutes at 400°F. Let the Shepherd's Pie cool for 15 minutes before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/ground-beef-shepherds-pie-recipe/#wprm-recipe-6496-step-2-0"}]}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"]}</script>
