    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "No Bake Pumpkin Cheesecake Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This luscious, no-bake pumpkin cheesecake features a silky, creamy filling with a delightful pumpkin spice essence atop a cinnamon-infused graham cracker crust. Its airy texture and warm fall flavors make it an excellent choice for autumn gatherings or Thanksgiving celebrations.", "datePublished": "2024-01-25T22:16:43+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/no-bake-pumpkin-cheesecake-recipe-1.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/no-bake-pumpkin-cheesecake-recipe-1-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/no-bake-pumpkin-cheesecake-recipe-1-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/no-bake-pumpkin-cheesecake-recipe-1-480x270.png"], "recipeYield": ["12"], "prepTime": "PT20M", "totalTime": "PT380M", "recipeIngredient": ["2 cups graham cracker crumbs (approximately 240 grams)", "½ cup unsalted butter (112 grams, melted)", "½ teaspoon ground cinnamon", "3 tablespoons brown sugar", "15- ounce can pumpkin puree (just under 2 cups)", "24 ounces brick-style (full-fat cream cheese (680 grams))", "1 cup powdered sugar (110 grams)", "⅔ cup heavy cream (120 ml, at least 33% milk fat)", "½ cup brown sugar (105 grams)", "1 tablespoon pumpkin pie spice (or substitute – see Notes)", "2 teaspoons vanilla extract"], "recipeInstructions": [{"@type": "HowToSection", "name": "Graham Cracker Crust", "itemListElement": [{"@type": "HowToStep", "text": "In a medium mixing bowl, blend the graham cracker crumbs with brown sugar and cinnamon until evenly combined. Stir in the melted butter thoroughly until the mixture resembles wet sand.", "name": "In a medium mixing bowl, blend the graham cracker crumbs with brown sugar and cinnamon until evenly combined. Stir in the melted butter thoroughly until the mixture resembles wet sand.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-0-0"}, {"@type": "HowToStep", "text": "Firmly press the crust mixture into the bottom and up the sides (about halfway to two-thirds) of a 9-inch springform pan.", "name": "Firmly press the crust mixture into the bottom and up the sides (about halfway to two-thirds) of a 9-inch springform pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-0-1"}, {"@type": "HowToStep", "text": "Place the pan in the freezer to set while preparing the cheesecake filling.", "name": "Place the pan in the freezer to set while preparing the cheesecake filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-0-2"}]}, {"@type": "HowToSection", "name": "Pumpkin Cheesecake Filling", "itemListElement": [{"@type": "HowToStep", "text": "Using paper towels, blot the pumpkin puree to remove as much excess moisture as possible. Repeat as needed until the pumpkin is relatively dry. Set aside.", "name": "Using paper towels, blot the pumpkin puree to remove as much excess moisture as possible. Repeat as needed until the pumpkin is relatively dry. Set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-1-0"}, {"@type": "HowToStep", "text": "In a large bowl, whip the heavy cream until stiff peaks form, then set aside.", "name": "In a large bowl, whip the heavy cream until stiff peaks form, then set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-1-1"}, {"@type": "HowToStep", "text": "In another large mixing bowl, beat together the cream cheese, powdered sugar, brown sugar, pumpkin pie spice, and vanilla extract until the mixture is smooth and creamy. Pause occasionally to scrape down the sides and bottom of the bowl for a uniform texture.", "name": "In another large mixing bowl, beat together the cream cheese, powdered sugar, brown sugar, pumpkin pie spice, and vanilla extract until the mixture is smooth and creamy. Pause occasionally to scrape down the sides and bottom of the bowl for a uniform texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-1-2"}, {"@type": "HowToStep", "text": "Add the blotted pumpkin puree to the cream cheese mixture, beating until fully combined.", "name": "Add the blotted pumpkin puree to the cream cheese mixture, beating until fully combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-1-3"}, {"@type": "HowToStep", "text": "Gently fold the whipped cream into the pumpkin and cream cheese mixture with a spatula. Incorporate it carefully to maintain an airy texture, stirring until no streaks remain.", "name": "Gently fold the whipped cream into the pumpkin and cream cheese mixture with a spatula. Incorporate it carefully to maintain an airy texture, stirring until no streaks remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-1-4"}, {"@type": "HowToStep", "text": "Retrieve the crust from the freezer and spoon the cheesecake filling over it, smoothing the top evenly.", "name": "Retrieve the crust from the freezer and spoon the cheesecake filling over it, smoothing the top evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-1-5"}, {"@type": "HowToStep", "text": "Cover the cheesecake and refrigerate for at least 6 hours, or preferably overnight, to set fully.", "name": "Cover the cheesecake and refrigerate for at least 6 hours, or preferably overnight, to set fully.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-1-6"}]}, {"@type": "HowToSection", "name": "To Serve", "itemListElement": [{"@type": "HowToStep", "text": "Run a thin, sharp knife around the edge of the pan before unlocking and removing the springform ring.", "name": "Run a thin, sharp knife around the edge of the pan before unlocking and removing the springform ring.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-2-0"}, {"@type": "HowToStep", "text": "Optionally, decorate with whipped cream using a piping bag with a decorative tip. For clean slices, use a sharp knife, slicing entirely through the crust each time.", "name": "Optionally, decorate with whipped cream using a piping bag with a decorative tip. For clean slices, use a sharp knife, slicing entirely through the crust each time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/no-bake-pumpkin-cheesecake-recipe/#wprm-recipe-23815-step-2-1"}]}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "No Bake Pumpkin Cheesecake Recipe"}</script>
