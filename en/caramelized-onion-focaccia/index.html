    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Caramelized Onion Focaccia", "author": {"@type": "Person", "name": "BenDes"}, "description": "A golden, Parmesan-enriched focaccia topped with deeply caramelized yellow onions, aromatic thyme, and garlic-infused olive oil. The bread develops a tender, airy interior beneath a crisp, richly flavored crust.", "datePublished": "2022-08-14T05:38:13+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/caramelized-onion-focaccia2.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/caramelized-onion-focaccia2.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/caramelized-onion-focaccia2.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/caramelized-onion-focaccia2.png"], "prepTime": "PT25M", "cookTime": "PT85M", "totalTime": "PT230M", "recipeIngredient": ["4 cups yellow onions (chopped, from approximately 2 large onions)", "2 tablespoons finely chopped fresh thyme", "1 tablespoon salted butter", "¼ cup water", "2 tablespoons flavorful (good-quality olive oil)", "1¼ cups warm water (between 105°F and 115°F)", "¼ cup Parmesan cheese (finely shredded)", "2 teaspoons instant yeast", "2 tablespoons olive oil", "¾ teaspoon salt", "1 tablespoon granulated sugar", "2½ cups all-purpose flour", "Additional olive oil (as needed for greasing)", "3  fresh garlic cloves (crushed)", "1 to 2 tablespoons fresh thyme leaves", "¼ cup olive oil", "Flaky sea salt (optional)", "Additional fresh thyme (optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Melt the salted butter with 2 tablespoons of olive oil in a large skillet over medium heat. Add the chopped onions, pour in ¼ cup water, and cover the skillet. Cook for approximately 5 minutes, or until the onions begin to soften.", "name": "Melt the salted butter with 2 tablespoons of olive oil in a large skillet over medium heat. Add the chopped onions, pour in ¼ cup water, and cover the skillet. Cook for approximately 5 minutes, or until the onions begin to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-0"}, {"@type": "HowToStep", "text": "Remove the lid and lower the heat to medium-low. Continue cooking the onions for about 1 hour, stirring frequently to prevent scorching, until they become deeply browned, soft, and richly caramelized. Transfer them to a bowl and fold in 2 tablespoons of chopped fresh thyme.", "name": "Remove the lid and lower the heat to medium-low. Continue cooking the onions for about 1 hour, stirring frequently to prevent scorching, until they become deeply browned, soft, and richly caramelized. Transfer them to a bowl and fold in 2 tablespoons of chopped fresh thyme.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-1"}, {"@type": "HowToStep", "text": "Place the all-purpose flour, warm water, shredded Parmesan, 2 tablespoons of olive oil, sugar, instant yeast, and salt in a large mixing bowl. Stir thoroughly with a wooden spoon until no dry flour remains and a cohesive, sticky dough forms.", "name": "Place the all-purpose flour, warm water, shredded Parmesan, 2 tablespoons of olive oil, sugar, instant yeast, and salt in a large mixing bowl. Stir thoroughly with a wooden spoon until no dry flour remains and a cohesive, sticky dough forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-2"}, {"@type": "HowToStep", "text": "Lightly coat a clean large bowl and your hands with olive oil. Transfer the dough to the prepared bowl, cover it securely with plastic wrap, and leave it in a warm location for approximately 1 hour, or until it has doubled in volume.", "name": "Lightly coat a clean large bowl and your hands with olive oil. Transfer the dough to the prepared bowl, cover it securely with plastic wrap, and leave it in a warm location for approximately 1 hour, or until it has doubled in volume.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-3"}, {"@type": "HowToStep", "text": "While the dough rises, warm ¼ cup olive oil in a skillet and add the crushed garlic cloves. Cook gently for about 5 minutes, just until the garlic becomes fragrant and begins to brown. Remove and discard the cloves before they darken further, then allow the infused oil to cool.", "name": "While the dough rises, warm ¼ cup olive oil in a skillet and add the crushed garlic cloves. Cook gently for about 5 minutes, just until the garlic becomes fragrant and begins to brown. Remove and discard the cloves before they darken further, then allow the infused oil to cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 425°F (220°C). Pour half of the cooled garlic oil into an unlined 9 × 9-inch metal baking pan, spreading it across the base.", "name": "Preheat the oven to 425°F (220°C). Pour half of the cooled garlic oil into an unlined 9 × 9-inch metal baking pan, spreading it across the base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-5"}, {"@type": "HowToStep", "text": "Once the dough has doubled, lightly oil your hands. Lift the upper edge of the dough, stretch it upward, and fold it back over the center. Repeat this stretching and folding action with the remaining three sides.", "name": "Once the dough has doubled, lightly oil your hands. Lift the upper edge of the dough, stretch it upward, and fold it back over the center. Repeat this stretching and folding action with the remaining three sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-6"}, {"@type": "HowToStep", "text": "Place the folded dough seam-side down in the prepared pan. Cover the pan with plastic wrap and let the dough rise in a warm area for approximately 1 hour, until doubled, visibly airy, and nearly expanded to the edges of the pan.", "name": "Place the folded dough seam-side down in the prepared pan. Cover the pan with plastic wrap and let the dough rise in a warm area for approximately 1 hour, until doubled, visibly airy, and nearly expanded to the edges of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-7"}, {"@type": "HowToStep", "text": "Dimple, season, and bake. After the second rise, pour the remaining garlic-infused oil evenly over the bubbly dough. Press your fingertips vertically and firmly into the surface to form pronounced dimples. Scatter 1 to 2 tablespoons of fresh thyme over the top.", "name": "Dimple, season, and bake. After the second rise, pour the remaining garlic-infused oil evenly over the bubbly dough. Press your fingertips vertically and firmly into the surface to form pronounced dimples. Scatter 1 to 2 tablespoons of fresh thyme over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-8"}, {"@type": "HowToStep", "text": "Bake for 12 to 18 minutes, until the focaccia is evenly golden brown and its internal temperature reaches at least 190°F (88°C).", "name": "Bake for 12 to 18 minutes, until the focaccia is evenly golden brown and its internal temperature reaches at least 190°F (88°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-9"}, {"@type": "HowToStep", "text": "Immediately after removing the bread from the oven, distribute the prepared caramelized onions across the surface. Place the pan on a wire rack and allow the focaccia to cool.", "name": "Immediately after removing the bread from the oven, distribute the prepared caramelized onions across the surface. Place the pan on a wire rack and allow the focaccia to cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-10"}, {"@type": "HowToStep", "text": "Once cooled sufficiently for slicing, garnish with flaky sea salt and additional fresh thyme, if desired. Cut into portions and serve.", "name": "Once cooled sufficiently for slicing, garnish with flaky sea salt and additional fresh thyme, if desired. Cut into portions and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-focaccia/#wprm-recipe-39521-step-0-11"}], "recipeCategory": ["Bread"], "recipeCuisine": ["Italian"], "keywords": "Caramelized Onion Focaccia"}</script>
