    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mashed Potatoes with Red Potatoes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Creamy mashed red potatoes prepared with sour cream, garlic, butter, Parmesan, and aged cheddar. The red potatoes may be mashed until silky or left slightly chunky, depending on the preferred texture.", "datePublished": "2020-06-25T18:09:04+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/mashed-potatoes-with-red-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/mashed-potatoes-with-red-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/mashed-potatoes-with-red-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/mashed-potatoes-with-red-potatoes.png"], "totalTime": "PT20M", "recipeIngredient": ["2 lb red potatoes (thoroughly scrubbed and cut into quarters or roughly 1-inch pieces)", "1/2 cup full-fat sour cream (for a richer and creamier texture)", "1/2 cup finely grated Parmesan cheese", "1 tsp garlic powder", "2 tbsp unsalted butter (preferably Kerrygold, for added richness)", "1/2 cup shredded aged cheddar cheese (preferably sharp)", "1 tsp salt", "About 2 tsp additional salt (for seasoning the boiling water)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare and boil the potatoes. Fill a saucepan with water and season it with approximately 2 teaspoons of salt. Bring the water to a rolling boil.", "name": "Prepare and boil the potatoes. Fill a saucepan with water and season it with approximately 2 teaspoons of salt. Bring the water to a rolling boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/#wprm-recipe-44916-step-0-0"}, {"@type": "HowToStep", "text": "While the water heats, cut the cleaned red potatoes into pieces measuring approximately 1 inch so they cook at an even rate.", "name": "While the water heats, cut the cleaned red potatoes into pieces measuring approximately 1 inch so they cook at an even rate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/#wprm-recipe-44916-step-0-1"}, {"@type": "HowToStep", "text": "Carefully lower the potatoes into the boiling water and allow the water to return to a boil. Cook for approximately 15–20 minutes, or until the potatoes are tender enough to pierce easily with a fork.", "name": "Carefully lower the potatoes into the boiling water and allow the water to return to a boil. Cook for approximately 15–20 minutes, or until the potatoes are tender enough to pierce easily with a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/#wprm-recipe-44916-step-0-2"}, {"@type": "HowToStep", "text": "Drain and season. Drain the cooked potatoes thoroughly, then transfer them to a mixing bowl.", "name": "Drain and season. Drain the cooked potatoes thoroughly, then transfer them to a mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/#wprm-recipe-44916-step-0-3"}, {"@type": "HowToStep", "text": "Add the sour cream, garlic powder, and 1 teaspoon of salt. Stir the ingredients together so the seasonings and sour cream begin to coat the warm potatoes evenly.", "name": "Add the sour cream, garlic powder, and 1 teaspoon of salt. Stir the ingredients together so the seasonings and sour cream begin to coat the warm potatoes evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/#wprm-recipe-44916-step-0-4"}, {"@type": "HowToStep", "text": "Mash the potatoes. Using a potato masher, crush the potatoes until they reach the desired consistency. Mash thoroughly for a smoother texture or leave some pieces intact for a more rustic result.", "name": "Mash the potatoes. Using a potato masher, crush the potatoes until they reach the desired consistency. Mash thoroughly for a smoother texture or leave some pieces intact for a more rustic result.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/#wprm-recipe-44916-step-0-5"}, {"@type": "HowToStep", "text": "Mix in the grated Parmesan and shredded aged cheddar for additional savory flavor.", "name": "Mix in the grated Parmesan and shredded aged cheddar for additional savory flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/#wprm-recipe-44916-step-0-6"}, {"@type": "HowToStep", "text": "Finish and serve. Spoon the mashed red potatoes into a serving dish. Place the butter over the hot potatoes and allow it to melt across the surface.", "name": "Finish and serve. Spoon the mashed red potatoes into a serving dish. Place the butter over the hot potatoes and allow it to melt across the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/#wprm-recipe-44916-step-0-7"}, {"@type": "HowToStep", "text": "Serve the mashed potatoes while hot.", "name": "Serve the mashed potatoes while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-red-potatoes/#wprm-recipe-44916-step-0-8"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Mashed Potatoes with Red Potatoes"}</script>
