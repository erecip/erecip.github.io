thub.io/en/pumpkin-greek-yogurt-pancakes/#mainImage"}, "datePublished": "2020-01-20T13:19:10+01:00", "dateModified": "2026-08-11T15:03:00+02:00"}, {"@type": "WebSite", "@id": "https://erecip.github.io/#website", "url": "https://erecip.github.io/", "name": "Quick Recipes", "description": "Everyday Recipes", "inLanguage": "en-US", "publisher": {"@id": "https://erecip.github.io/#organization"}}]}</script>
    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Greek Yogurt Pancakes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, warmly spiced pumpkin pancakes prepared with Greek yogurt, pumpkin purée, eggs, and unsweetened milk. The batter is mixed gently to preserve a tender texture, then cooked until lightly golden on both sides.", "datePublished": "2020-01-20T13:19:10+00:00", "recipeIngredient": ["1 teaspoon pumpkin pie spice (preferably freshly ground for a more pronounced flavor)", "1 1/2 teaspoons baking powder", "1 cup all-purpose flour", "1/2 teaspoon salt", "1/4 cup pumpkin purée", "1 teaspoon vanilla extract", "1/2 cup unsweetened milk (such as almond or oat milk)", "2  eggs (brought to room temperature)", "3/4 cup nonfat Greek yogurt (at room temperature for easier blending)", "Cooking spray (as needed)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the all-purpose flour, pumpkin pie spice, baking powder, and salt in a medium mixing bowl. Whisk thoroughly until the ingredients are evenly distributed. Freshly ground pumpkin pie spice may be used for a stronger, more aromatic flavor. Set the dry mixture aside.", "name": "Place the all-purpose flour, pumpkin pie spice, baking powder, and salt in a medium mixing bowl. Whisk thoroughly until the ingredients are evenly distributed. Freshly ground pumpkin pie spice may be used for a stronger, more aromatic flavor. Set the dry mixture aside.", "url": "https://erecip.github.io/en/pumpkin-greek-yogurt-pancakes/#wprm-recipe-42237-step-0-0"}, {"@type": "HowToStep", "text": "In a separate bowl, combine the nonfat Greek yogurt, pumpkin purée, room-temperature eggs, vanilla extract, and unsweetened milk. Whisk until the mixture is smooth and uniform, ensuring that no noticeable clumps of yogurt or pumpkin remain.", "name": "In a separate bowl, combine the nonfat Greek yogurt, pumpkin purée, room-temperature eggs, vanilla extract, and unsweetened milk. Whisk until the mixture is smooth and uniform, ensuring that no noticeable clumps of yogurt or pumpkin remain.", "url": "https://erecip.github.io/en/pumpkin-greek-yogurt-pancakes/#wprm-recipe-42237-step-0-1"}, {"@type": "HowToStep", "text": "Pour the blended wet ingredients into the bowl containing the dry mixture. Stir gently only until the two mixtures come together. The finished batter should retain a few small lumps rather than becoming completely smooth.", "name": "Pour the blended wet ingredients into the bowl containing the dry mixture. Stir gently only until the two mixtures come together. The finished batter should retain a few small lumps rather than becoming completely smooth.", "url": "https://erecip.github.io/en/pumpkin-greek-yogurt-pancakes/#wprm-recipe-42237-step-0-2"}, {"@type": "HowToStep", "text": "Avoid excessive stirring, as overmixing can encourage gluten development and produce pancakes with a dense or tough texture. Allow the batter to stand for 2–3 minutes while the cooking surface heats.", "name": "Avoid excessive stirring, as overmixing can encourage gluten development and produce pancakes with a dense or tough texture. Allow the batter to stand for 2–3 minutes while the cooking surface heats.", "url": "https://erecip.github.io/en/pumpkin-greek-yogurt-pancakes/#wprm-recipe-42237-step-0-3"}, {"@type": "HowToStep", "text": "Warm a nonstick skillet or griddle over medium-high heat, then apply a light coating of cooking spray. Once the surface is properly heated, spoon approximately 2 tablespoons of batter onto the pan for each pancake, leaving enough room between portions.", "name": "Warm a nonstick skillet or griddle over medium-high heat, then apply a light coating of cooking spray. Once the surface is properly heated, spoon approximately 2 tablespoons of batter onto the pan for each pancake, leaving enough room between portions.", "url": "https://erecip.github.io/en/pumpkin-greek-yogurt-pancakes/#wprm-recipe-42237-step-0-4"}, {"@type": "HowToStep", "text": "Cook for 2–3 minutes, or until the outer edges appear set and small bubbles begin forming across the tops. The appearance of these bubbles indicates that the pancakes are ready to turn.", "name": "Cook for 2–3 minutes, or until the outer edges appear set and small bubbles begin forming across the tops. The appearance of these bubbles indicates that the pancakes are ready to turn.", "url": "https://erecip.github.io/en/pumpkin-greek-yogurt-pancakes/#wprm-recipe-42237-step-0-5"}, {"@type": "HowToStep", "text": "Carefully turn each pancake and continue cooking for an additional 1–2 minutes, until the underside becomes golden brown. Because the second side cooks more quickly, monitor the pancakes closely to prevent overbrowning.", "name": "Carefully turn each pancake and continue cooking for an additional 1–2 minutes, until the underside becomes golden brown. Because the second side cooks more quickly, monitor the pancakes closely to prevent overbrowning.", "url": "https://erecip.github.io/en/pumpkin-greek-yogurt-pancakes/#wprm-recipe-42237-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the finished pancakes to a serving plate and serve while warm. Suitable accompaniments include maple syrup, fresh whipped cream, berries, or a light drizzle of honey.", "name": "Transfer the finished pancakes to a serving plate and serve while warm. Suitable accompaniments include maple syrup, fresh whipped cream, berries, or a light drizzle of honey.", "url": "https://erecip.github.io/en/pumpkin-greek-yogurt-pancakes/#wprm-recipe-42237-step-0-7"}], "recipeCategory": ["Breakfast"], "keywords": "Pumpkin Greek Yogurt Pancakes"}</script>
