    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Fried Chicken Egg Rolls", "author": {"@type": "Person", "name": "BenDes"}, "description": "These fried chicken egg rolls feature finely shredded cooked chicken combined with tender tri-color cabbage, wrapped securely in egg roll skins, and deep-fried until crisp and evenly golden. Serving them immediately after frying preserves their crunchy exterior and warm, savory center.", "datePublished": "2022-02-20T09:06:43+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/fried-chicken-egg-rolls2.png", "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/fried-chicken-egg-rolls2.png", "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/fried-chicken-egg-rolls2.png", "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/fried-chicken-egg-rolls2.png"], "cookTime": "PT10M", "totalTime": "PT10M", "recipeIngredient": ["3  cooked chicken breasts (finely pulled or shredded, approximately 3 cups)", "Fine salt (added according to taste)", "3 tablespoons extra-virgin olive oil", "Ground pepper (to personal preference)", "1  package tri-color shredded cabbage blend (approximately 16 ounces)", "1  package egg roll wrappers (16 ounces, kept beneath a damp towel while assembling)", "Vegetable oil (as required for deep-frying, or peanut oil for its higher smoke point)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Finely shred the cooked chicken breasts so the meat can be distributed consistently throughout the cabbage mixture.", "name": "Finely shred the cooked chicken breasts so the meat can be distributed consistently throughout the cabbage mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-0"}, {"@type": "HowToStep", "text": "Keep the unused egg roll wrappers covered with a damp towel during preparation to prevent them from becoming dry or brittle.", "name": "Keep the unused egg roll wrappers covered with a damp towel during preparation to prevent them from becoming dry or brittle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-1"}, {"@type": "HowToStep", "text": "Warm 3 tablespoons of olive oil in a large skillet over medium-high heat until the oil begins to shimmer.", "name": "Warm 3 tablespoons of olive oil in a large skillet over medium-high heat until the oil begins to shimmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-2"}, {"@type": "HowToStep", "text": "Add the entire package of shredded tri-color cabbage and cook for 3–4 minutes, stirring periodically, until the cabbage starts to soften and release some of its moisture.", "name": "Add the entire package of shredded tri-color cabbage and cook for 3–4 minutes, stirring periodically, until the cabbage starts to soften and release some of its moisture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the shredded chicken and continue cooking for another 2–3 minutes, mixing thoroughly so the chicken is evenly incorporated and heated through.", "name": "Stir in the shredded chicken and continue cooking for another 2–3 minutes, mixing thoroughly so the chicken is evenly incorporated and heated through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-4"}, {"@type": "HowToStep", "text": "Season the mixture with salt and pepper according to taste. Transfer the cooked filling to a plate and allow it to cool slightly before wrapping so the heat does not soften or tear the egg roll skins.", "name": "Season the mixture with salt and pepper according to taste. Transfer the cooked filling to a plate and allow it to cool slightly before wrapping so the heat does not soften or tear the egg roll skins.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-5"}, {"@type": "HowToStep", "text": "Set one egg roll wrapper on a clean, dry work surface in a diamond position, with one corner directed toward you.", "name": "Set one egg roll wrapper on a clean, dry work surface in a diamond position, with one corner directed toward you.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-6"}, {"@type": "HowToStep", "text": "Place approximately 2–3 tablespoons of the cooled chicken and cabbage mixture in the center of the wrapper, keeping the filling compact and clear of the edges.", "name": "Place approximately 2–3 tablespoons of the cooled chicken and cabbage mixture in the center of the wrapper, keeping the filling compact and clear of the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-7"}, {"@type": "HowToStep", "text": "Bring the bottom corner upward over the filling, then fold both side corners inward snugly.", "name": "Bring the bottom corner upward over the filling, then fold both side corners inward snugly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-8"}, {"@type": "HowToStep", "text": "Roll the wrapper firmly away from you toward the remaining top corner. Before completing the roll, lightly moisten the top corner with water and press it firmly into place to create a secure seal.", "name": "Roll the wrapper firmly away from you toward the remaining top corner. Before completing the roll, lightly moisten the top corner with water and press it firmly into place to create a secure seal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-9"}, {"@type": "HowToStep", "text": "Work efficiently so the wrappers remain flexible. Keep any wrappers that are not being used beneath the damp towel.", "name": "Work efficiently so the wrappers remain flexible. Keep any wrappers that are not being used beneath the damp towel.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-10"}, {"@type": "HowToStep", "text": "Repeat the process until all of the filling has been enclosed. Arrange the completed egg rolls seam-side down on a clean surface.", "name": "Repeat the process until all of the filling has been enclosed. Arrange the completed egg rolls seam-side down on a clean surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-11"}, {"@type": "HowToStep", "text": "Pour enough vegetable or peanut oil into a deep skillet or wok to reach a depth of approximately 2 inches.", "name": "Pour enough vegetable or peanut oil into a deep skillet or wok to reach a depth of approximately 2 inches.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-12"}, {"@type": "HowToStep", "text": "Heat the oil until it registers between 350°F and 375°F. Monitor the temperature with a thermometer to maintain consistent frying conditions; insufficiently heated oil can produce greasy egg rolls, while excessively hot oil may brown the wrappers before the centers are fully warmed.", "name": "Heat the oil until it registers between 350°F and 375°F. Monitor the temperature with a thermometer to maintain consistent frying conditions; insufficiently heated oil can produce greasy egg rolls, while excessively hot oil may brown the wrappers before the centers are fully warmed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-13"}, {"@type": "HowToStep", "text": "Fry the egg rolls in batches without crowding the cooking vessel. Carefully lower each roll into the hot oil with the sealed side facing downward.", "name": "Fry the egg rolls in batches without crowding the cooking vessel. Carefully lower each roll into the hot oil with the sealed side facing downward.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-14"}, {"@type": "HowToStep", "text": "Cook for approximately 2–3 minutes, turning the egg rolls halfway through with tongs or a slotted spoon, until every side develops an even golden-brown color.", "name": "Cook for approximately 2–3 minutes, turning the egg rolls halfway through with tongs or a slotted spoon, until every side develops an even golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-15"}, {"@type": "HowToStep", "text": "Lift the fried egg rolls from the oil with tongs or a slotted spoon and immediately place them on a paper towel-lined plate to absorb excess oil.", "name": "Lift the fried egg rolls from the oil with tongs or a slotted spoon and immediately place them on a paper towel-lined plate to absorb excess oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-16"}, {"@type": "HowToStep", "text": "Serve while warm and freshly fried for the crispest texture. Sweet-and-sour sauce, hot mustard, or sriracha mayonnaise may be served alongside as dipping sauces.", "name": "Serve while warm and freshly fried for the crispest texture. Sweet-and-sour sauce, hot mustard, or sriracha mayonnaise may be served alongside as dipping sauces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fried-chicken-egg-rolls/#wprm-recipe-42187-step-0-17"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["Asian-inspired"], "keywords": "Fried Chicken Egg Rolls"}</script>
