over the pan. Cook the pork for 6 to 12 minutes or until the internal temperature reaches 145°F. Check at 5 minutes, and continue monitoring every 2 minutes until done.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/skillet-pork-chops/#wprm-recipe-25021-step-0-5"}, {"@type": "HowToStep", "text": "Remove the chops from the skillet, cover loosely with foil, and let them rest for 5 minutes.", "name": "Remove the chops from the skillet, cover loosely with foil, and let them rest for 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/skillet-pork-chops/#wprm-recipe-25021-step-0-6"}, {"@type": "HowToStep", "text": "Raise the heat to medium-high and deglaze the pan with chicken stock, vinegar, and honey. Let the mixture simmer and reduce by half, scraping the pan bottom to incorporate flavorful browned bits.", "name": "Raise the heat to medium-high and deglaze the pan with chicken stock, vinegar, and honey. Let the mixture simmer and reduce by half, scraping the pan bottom to incorporate flavorful browned bits.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/skillet-pork-chops/#wprm-recipe-25021-step-0-7"}, {"@type": "HowToStep", "text": "Once the sauce thickens slightly and stops simmering, remove from heat and stir in the butter.", "name": "Once the sauce thickens slightly and stops simmering, remove from heat and stir in the butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/skillet-pork-chops/#wprm-recipe-25021-step-0-8"}, {"@type": "HowToStep", "text": "Return the pork to the pan, spoon the sauce over, garnish with parsley if desired, and serve hot.", "name": "Return the pork to the pan, spoon the sauce over, garnish with parsley if desired, and serve hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/skillet-pork-chops/#wprm-recipe-25021-step-0-9"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Skillet Pork Chops Recipe"}</script>
