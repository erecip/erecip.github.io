    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Caesar Salad", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic Caesar salad featuring chilled, crisp romaine lettuce coated in a rich, savory dressing made with Parmesan, anchovies, garlic, Dijon mustard, Worcestershire sauce, and fresh lemon juice. Golden homemade croutons and shredded Parmesan provide a crisp finish and additional depth of flavor.", "datePublished": "2022-06-24T08:53:01+00:00", "image": ["https://erecip.github.io/en/caesar-salad/caesar-salad-1.png", "https://erecip.github.io/en/caesar-salad/caesar-salad-1.png", "https://erecip.github.io/en/caesar-salad/caesar-salad-1.png", "https://erecip.github.io/en/caesar-salad/caesar-salad-1.png"], "cookTime": "PT15M", "totalTime": "PT15M", "recipeIngredient": ["4 cups rustic-style bread (preferably one day old, torn into approximately 3/4-inch pieces)", "2 tablespoons olive oil (preferably extra-virgin)", "4  oil-packed anchovy fillets (drained and very finely chopped)", "1/4 cup Parmesan cheese (finely and freshly grated)", "1 teaspoon Worcestershire sauce", "2  garlic cloves (freshly minced, approximately 2 teaspoons)", "3/4 cup mayonnaise (preferably Hellmann’s)", "1 1/2 tablespoons freshly squeezed lemon juice", "Fine salt and freshly cracked black pepper (according to taste)", "1 teaspoon Dijon mustard", "2  large hearts of romaine lettuce (chilled until crisp and chopped)", "1/4 cup shredded Parmesan cheese"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 375°F.", "name": "Preheat the oven to 375°F.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-0"}, {"@type": "HowToStep", "text": "Tear the rustic bread into pieces measuring approximately 3/4 inch. Day-old bread is preferable because its drier texture allows it to become crisp more effectively during baking.", "name": "Tear the rustic bread into pieces measuring approximately 3/4 inch. Day-old bread is preferable because its drier texture allows it to become crisp more effectively during baking.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-1"}, {"@type": "HowToStep", "text": "Place the bread pieces in a bowl and toss them with 2 tablespoons of olive oil until each piece is lightly coated.", "name": "Place the bread pieces in a bowl and toss them with 2 tablespoons of olive oil until each piece is lightly coated.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-2"}, {"@type": "HowToStep", "text": "Arrange the coated bread in one even layer on a baking sheet. Bake for 15 to 20 minutes, stirring the pieces halfway through the baking period, until the croutons are crisp and evenly golden.", "name": "Arrange the coated bread in one even layer on a baking sheet. Bake for 15 to 20 minutes, stirring the pieces halfway through the baking period, until the croutons are crisp and evenly golden.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-3"}, {"@type": "HowToStep", "text": "Remove the baking sheet from the oven and allow the croutons to cool slightly.", "name": "Remove the baking sheet from the oven and allow the croutons to cool slightly.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-4"}, {"@type": "HowToStep", "text": "While the croutons are baking, combine the mayonnaise, freshly squeezed lemon juice, Dijon mustard, Worcestershire sauce, finely minced anchovy fillets, and minced garlic in a medium mixing bowl.", "name": "While the croutons are baking, combine the mayonnaise, freshly squeezed lemon juice, Dijon mustard, Worcestershire sauce, finely minced anchovy fillets, and minced garlic in a medium mixing bowl.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-5"}, {"@type": "HowToStep", "text": "Stir thoroughly until the mixture is smooth and evenly blended. The finely chopped anchovies will incorporate into the dressing and provide the characteristic savory depth associated with Caesar dressing.", "name": "Stir thoroughly until the mixture is smooth and evenly blended. The finely chopped anchovies will incorporate into the dressing and provide the characteristic savory depth associated with Caesar dressing.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-6"}, {"@type": "HowToStep", "text": "Add the finely grated Parmesan and stir once more until fully incorporated.", "name": "Add the finely grated Parmesan and stir once more until fully incorporated.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-7"}, {"@type": "HowToStep", "text": "Taste the dressing, then season with salt and freshly ground black pepper as desired. Add the salt carefully, since both the anchovies and Worcestershire sauce already contribute saltiness.", "name": "Taste the dressing, then season with salt and freshly ground black pepper as desired. Add the salt carefully, since both the anchovies and Worcestershire sauce already contribute saltiness.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the chopped, chilled romaine hearts to a large serving bowl or divide them among individual salad bowls.", "name": "Transfer the chopped, chilled romaine hearts to a large serving bowl or divide them among individual salad bowls.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-9"}, {"@type": "HowToStep", "text": "Pour the prepared Caesar dressing over the lettuce and toss gently until the leaves are evenly coated. Use enough dressing to cover the romaine without adding so much that the lettuce becomes soggy.", "name": "Pour the prepared Caesar dressing over the lettuce and toss gently until the leaves are evenly coated. Use enough dressing to cover the romaine without adding so much that the lettuce becomes soggy.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-10"}, {"@type": "HowToStep", "text": "Add the cooled croutons and toss again just until evenly distributed.", "name": "Add the cooled croutons and toss again just until evenly distributed.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-11"}, {"@type": "HowToStep", "text": "Finish the salad with 1/4 cup of shredded Parmesan cheese.", "name": "Finish the salad with 1/4 cup of shredded Parmesan cheese.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-12"}, {"@type": "HowToStep", "text": "Dress and toss the salad immediately before serving so the romaine remains crisp and the croutons retain their crunchy texture.", "name": "Dress and toss the salad immediately before serving so the romaine remains crisp and the croutons retain their crunchy texture.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-13"}, {"@type": "HowToStep", "text": "Serve at once while the lettuce is cold and the croutons are still crisp.", "name": "Serve at once while the lettuce is cold and the croutons are still crisp.", "url": "https://erecip.github.io/en/caesar-salad/#wprm-recipe-45918-step-0-14"}], "recipeCategory": ["Salad"], "keywords": "Caesar Salad"}</script>
