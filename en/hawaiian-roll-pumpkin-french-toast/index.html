ft each piece from the bowl and gently shake away the surplus custard.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-pumpkin-french-toast/#wprm-recipe-39671-step-0-5"}, {"@type": "HowToStep", "text": "Warm a large skillet or griddle over medium heat. Coat the cooking surface lightly with butter.", "name": "Warm a large skillet or griddle over medium heat. Coat the cooking surface lightly with butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-pumpkin-french-toast/#wprm-recipe-39671-step-0-6"}, {"@type": "HowToStep", "text": "Arrange the soaked roll pieces on the heated surface without overcrowding them. Cook for 2–3 minutes, or until the undersides are evenly browned.", "name": "Arrange the soaked roll pieces on the heated surface without overcrowding them. Cook for 2–3 minutes, or until the undersides are evenly browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-pumpkin-french-toast/#wprm-recipe-39671-step-0-7"}, {"@type": "HowToStep", "text": "Turn each piece and continue cooking for another 2–3 minutes, until the second side is golden and the edges are lightly crisp. Apply additional butter between batches when necessary.", "name": "Turn each piece and continue cooking for another 2–3 minutes, until the second side is golden and the edges are lightly crisp. Apply additional butter between batches when necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-pumpkin-french-toast/#wprm-recipe-39671-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the finished French toast to a plate and keep it warm while the remaining pieces cook.", "name": "Transfer the finished French toast to a plate and keep it warm while the remaining pieces cook.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-pumpkin-french-toast/#wprm-recipe-39671-step-0-9"}, {"@type": "HowToStep", "text": "Serve immediately with a dusting of powdered sugar and a drizzle of warm maple syrup.", "name": "Serve immediately with a dusting of powdered sugar and a drizzle of warm maple syrup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-pumpkin-french-toast/#wprm-recipe-39671-step-0-10"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American", "Hawaiian-Inspired"], "keywords": "Hawaiian Roll Pumpkin French Toast"}</script>
