d crumble the ground beef over medium-high heat for 2 minutes. Add the diced onions and continue cooking for an additional 5 minutes, until the beef is browned and the onions are softened. Drain any excess grease.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-casserole-recipe/#wprm-recipe-319-step-0-1"}, {"@type": "HowToStep", "text": "Stir in the Manwich sauce, chicken broth, and the undrained diced tomatoes. Bring the mixture to a gentle boil.", "name": "Stir in the Manwich sauce, chicken broth, and the undrained diced tomatoes. Bring the mixture to a gentle boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-casserole-recipe/#wprm-recipe-319-step-0-2"}, {"@type": "HowToStep", "text": "Add the uncooked pasta and stir well to ensure it is fully combined. Cover the skillet and allow it to boil gently until the pasta is al dente, stirring occasionally to prevent sticking. Be prepared to cook a few minutes longer than the time specified on the pasta package. Test a noodle to check for doneness before proceeding.", "name": "Add the uncooked pasta and stir well to ensure it is fully combined. Cover the skillet and allow it to boil gently until the pasta is al dente, stirring occasionally to prevent sticking. Be prepared to cook a few minutes longer than the time specified on the pasta package. Test a noodle to check for doneness before proceeding.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-casserole-recipe/#wprm-recipe-319-step-0-3"}, {"@type": "HowToStep", "text": "Lower the heat to a simmer. Stir in the corn, then add the cubed Velveeta cheese. Cover the pot and allow the cheese to melt, lifting the cover occasionally to stir until smooth.", "name": "Lower the heat to a simmer. Stir in the corn, then add the cubed Velveeta cheese. Cover the pot and allow the cheese to melt, lifting the cover occasionally to stir until smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-casserole-recipe/#wprm-recipe-319-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the mixture into a lightly greased 9x13 inch casserole dish.", "name": "Transfer the mixture into a lightly greased 9x13 inch casserole dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-casserole-recipe/#wprm-recipe-319-step-0-5"}, {"@type": "HowToStep", "text": "Sprinkle the shredded cheddar cheese over the top. Cover with foil and bake in the preheated oven for 15 minutes.", "name": "Sprinkle the shredded cheddar cheese over the top. Cover with foil and bake in the preheated oven for 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-casserole-recipe/#wprm-recipe-319-step-0-6"}, {"@type": "HowToStep", "text": "Remove the cover and serve hot, ideally with a side of cornbread.", "name": "Remove the cover and serve hot, ideally with a side of cornbread.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sloppy-joe-casserole-recipe/#wprm-recipe-319-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Sloppy Joe Casserole Recipe"}</script>
