    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Vanilla Custard Fruit Tart", "author": {"@type": "Person", "name": "BenDes"}, "description": "A crisp, buttery graham cracker shell filled with smooth vanilla pastry cream and finished with fresh berries for a colorful, elegant dessert. The custard is thoroughly chilled before assembly to give the tart a firm yet creamy texture that slices neatly.", "datePublished": "2019-01-28T00:30:19+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/vanilla-custard-fruit-tart.png", "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/vanilla-custard-fruit-tart.png", "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/vanilla-custard-fruit-tart.png", "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/vanilla-custard-fruit-tart.png"], "prepTime": "PT30M", "cookTime": "PT10M", "totalTime": "PT220M", "recipeIngredient": ["6 tablespoons unsalted butter (melted)", "1/4 teaspoon fine sea salt", "12  whole graham crackers (approximately 7 ounces or 1 1/2 cups when finely crushed)", "3 tablespoons packed light brown sugar", "3 tablespoons cornstarch", "4 tablespoons unsalted butter", "5  large egg yolks (preferably brought to room temperature)", "1/4 cup granulated sugar", "Pinch of kosher salt", "2 cups whole milk (or half-and-half for a richer result)", "1  vanilla bean (split and scraped, or 2 1/2 teaspoons vanilla extract)", "1/3 cup granulated sugar", "Fresh berries", "Fresh mint sprigs", "Jam diluted with a small amount of hot water (for glazing the berries)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Set the oven to 350°F and arrange an oven rack in the center position.", "name": "Set the oven to 350°F and arrange an oven rack in the center position.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-0"}, {"@type": "HowToStep", "text": "Add the graham crackers to a food processor and pulse until they are reduced to fine, even crumbs.", "name": "Add the graham crackers to a food processor and pulse until they are reduced to fine, even crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-1"}, {"@type": "HowToStep", "text": "Place the light brown sugar, fine sea salt, and melted butter into the processor with the crumbs. Process again until everything is evenly incorporated and the mixture has the consistency of damp sand.", "name": "Place the light brown sugar, fine sea salt, and melted butter into the processor with the crumbs. Process again until everything is evenly incorporated and the mixture has the consistency of damp sand.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the crumb mixture to a tart pan. Distribute it evenly across the base and along the sides.", "name": "Transfer the crumb mixture to a tart pan. Distribute it evenly across the base and along the sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-3"}, {"@type": "HowToStep", "text": "Press the crumbs down firmly over the bottom and against the sides, forming a tightly packed shell with a rim approximately 1/4 inch thick.", "name": "Press the crumbs down firmly over the bottom and against the sides, forming a tightly packed shell with a rim approximately 1/4 inch thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-4"}, {"@type": "HowToStep", "text": "Bake for about 10 minutes, or until the crust becomes golden and aromatic.", "name": "Bake for about 10 minutes, or until the crust becomes golden and aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-5"}, {"@type": "HowToStep", "text": "Remove the tart shell from the oven and allow it to cool completely on a wire rack.", "name": "Remove the tart shell from the oven and allow it to cool completely on a wire rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-6"}, {"@type": "HowToStep", "text": "The baked crust may also be prepared one day in advance and kept tightly covered with plastic wrap at room temperature.", "name": "The baked crust may also be prepared one day in advance and kept tightly covered with plastic wrap at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-7"}, {"@type": "HowToStep", "text": "Combine the milk or half-and-half, 1/3 cup granulated sugar, kosher salt, and the scraped vanilla seeds and pod in a medium saucepan.", "name": "Combine the milk or half-and-half, 1/3 cup granulated sugar, kosher salt, and the scraped vanilla seeds and pod in a medium saucepan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-8"}, {"@type": "HowToStep", "text": "Warm over medium-high heat until the mixture just reaches a simmer. Do not allow it to come to a full boil.", "name": "Warm over medium-high heat until the mixture just reaches a simmer. Do not allow it to come to a full boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-9"}, {"@type": "HowToStep", "text": "When using a vanilla bean, remove the saucepan from the heat and leave the mixture undisturbed for 15 minutes so the vanilla can infuse into the milk.", "name": "When using a vanilla bean, remove the saucepan from the heat and leave the mixture undisturbed for 15 minutes so the vanilla can infuse into the milk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-10"}, {"@type": "HowToStep", "text": "When using vanilla extract instead, omit the 15-minute infusion period and reserve the extract for incorporation later.", "name": "When using vanilla extract instead, omit the 15-minute infusion period and reserve the extract for incorporation later.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-11"}, {"@type": "HowToStep", "text": "While the vanilla milk is infusing, place the egg yolks, cornstarch, and remaining 1/4 cup granulated sugar in a medium bowl.", "name": "While the vanilla milk is infusing, place the egg yolks, cornstarch, and remaining 1/4 cup granulated sugar in a medium bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-12"}, {"@type": "HowToStep", "text": "Whisk thoroughly until the ingredients are completely blended and the mixture has thickened slightly.", "name": "Whisk thoroughly until the ingredients are completely blended and the mixture has thickened slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-13"}, {"@type": "HowToStep", "text": "If a vanilla bean was used, remove and discard the pod. Return the infused milk mixture to the heat and bring it back to a gentle simmer.", "name": "If a vanilla bean was used, remove and discard the pod. Return the infused milk mixture to the heat and bring it back to a gentle simmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-14"}, {"@type": "HowToStep", "text": "While whisking continuously, gradually pour approximately half of the hot milk into the egg yolk mixture. Adding the milk slowly tempers the yolks without scrambling them.", "name": "While whisking continuously, gradually pour approximately half of the hot milk into the egg yolk mixture. Adding the milk slowly tempers the yolks without scrambling them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-15"}, {"@type": "HowToStep", "text": "Pour the warmed egg mixture back into the saucepan containing the remaining milk, continuing to whisk as you combine them.", "name": "Pour the warmed egg mixture back into the saucepan containing the remaining milk, continuing to whisk as you combine them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-16"}, {"@type": "HowToStep", "text": "Reduce the heat to low and cook the custard while stirring steadily with a wooden spoon. Continue for approximately 5 to 7 minutes, or until the mixture noticeably thickens.", "name": "Reduce the heat to low and cook the custard while stirring steadily with a wooden spoon. Continue for approximately 5 to 7 minutes, or until the mixture noticeably thickens.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-17"}, {"@type": "HowToStep", "text": "Should the custard begin to appear curdled or uneven, change to a whisk and beat it vigorously until smoother.", "name": "Should the custard begin to appear curdled or uneven, change to a whisk and beat it vigorously until smoother.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-18"}, {"@type": "HowToStep", "text": "Continue cooking and whisking constantly for an additional 2 minutes. The finished pastry cream should be very thick, with a pudding-like consistency.", "name": "Continue cooking and whisking constantly for an additional 2 minutes. The finished pastry cream should be very thick, with a pudding-like consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-19"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Immediately whisk in the 4 tablespoons of unsalted butter. If vanilla extract is being used in place of the vanilla bean, whisk in the 2 1/2 teaspoons of extract at this stage.", "name": "Remove the saucepan from the heat. Immediately whisk in the 4 tablespoons of unsalted butter. If vanilla extract is being used in place of the vanilla bean, whisk in the 2 1/2 teaspoons of extract at this stage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-20"}, {"@type": "HowToStep", "text": "If any lumps remain, pass the warm pastry cream through a fine-mesh sieve.", "name": "If any lumps remain, pass the warm pastry cream through a fine-mesh sieve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-21"}, {"@type": "HowToStep", "text": "Press plastic wrap directly against the surface of the custard to prevent a skin from developing. Refrigerate for at least 3 hours, or for as long as 2 days, until completely cold and firmly set.", "name": "Press plastic wrap directly against the surface of the custard to prevent a skin from developing. Refrigerate for at least 3 hours, or for as long as 2 days, until completely cold and firmly set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-22"}, {"@type": "HowToStep", "text": "Once thoroughly chilled, measure 3 cups of the cold pastry cream. Using a hand whisk or a stand mixer fitted with the paddle attachment, mix the custard for approximately 1 to 2 minutes, until it becomes smooth and lighter in texture.", "name": "Once thoroughly chilled, measure 3 cups of the cold pastry cream. Using a hand whisk or a stand mixer fitted with the paddle attachment, mix the custard for approximately 1 to 2 minutes, until it becomes smooth and lighter in texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-23"}, {"@type": "HowToStep", "text": "Spoon or pour the loosened pastry cream into the completely cooled graham cracker crust. Spread the filling evenly and smooth the surface.", "name": "Spoon or pour the loosened pastry cream into the completely cooled graham cracker crust. Spread the filling evenly and smooth the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-24"}, {"@type": "HowToStep", "text": "The assembled tart may be refrigerated for up to one day before serving. For the freshest appearance and texture, wait until shortly before serving to add the fruit and decorative garnishes.", "name": "The assembled tart may be refrigerated for up to one day before serving. For the freshest appearance and texture, wait until shortly before serving to add the fruit and decorative garnishes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-25"}, {"@type": "HowToStep", "text": "Arrange fresh berries over the custard and add mint sprigs as desired. For a polished, glossy finish, lightly brush the berries with jam that has been thinned with a little hot water.", "name": "Arrange fresh berries over the custard and add mint sprigs as desired. For a polished, glossy finish, lightly brush the berries with jam that has been thinned with a little hot water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vanilla-custard-fruit-tart/#wprm-recipe-41425-step-0-26"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Vanilla Custard Fruit Tart"}</script>
