    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "High Altitude Pumpkin Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warmly spiced pumpkin quick bread enriched with orange juice and studded with miniature chocolate chips. The batter produces two tender loaves with a moist crumb, a lightly golden exterior, and a balanced blend of pumpkin, cinnamon, and chocolate.", "datePublished": "2022-12-02T07:42:52+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/high-altitude-pumpkin-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/high-altitude-pumpkin-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/high-altitude-pumpkin-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/high-altitude-pumpkin-bread.png"], "prepTime": "PT20M", "cookTime": "PT45M", "totalTime": "PT80M", "recipeIngredient": ["2 teaspoons pumpkin pie spice", "¾ teaspoon baking soda", "3 cups all-purpose flour (preferably King Arthur)", "½ teaspoon salt", "1 teaspoon baking powder", "1 teaspoon ground cinnamon (freshly ground when available)", "½ cup neutral-flavored oil (such as vegetable, canola, or avocado oil)", "1  can (15 ounces pure pumpkin purée, such as Libby’s)", "4  large eggs (brought to approximately 70°F)", "½ cup granulated white sugar", "½ cup orange juice", "1 cup firmly packed brown sugar", "1 cup miniature chocolate chips (with additional chips reserved for the tops)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Coat two standard 9 x 5-inch loaf pans with butter, dust them lightly with flour, and set them aside.", "name": "Preheat the oven to 350°F (175°C). Coat two standard 9 x 5-inch loaf pans with butter, dust them lightly with flour, and set them aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-0"}, {"@type": "HowToStep", "text": "Place the all-purpose flour, pumpkin pie spice, cinnamon, baking powder, baking soda, and salt in a small mixing bowl. Whisk until the ingredients are evenly distributed, then reserve the mixture.", "name": "Place the all-purpose flour, pumpkin pie spice, cinnamon, baking powder, baking soda, and salt in a small mixing bowl. Whisk until the ingredients are evenly distributed, then reserve the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-1"}, {"@type": "HowToStep", "text": "In a large bowl, combine the packed brown sugar, granulated sugar, and neutral oil. Stir until the sugars and oil are thoroughly blended.", "name": "In a large bowl, combine the packed brown sugar, granulated sugar, and neutral oil. Stir until the sugars and oil are thoroughly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-2"}, {"@type": "HowToStep", "text": "Add the eggs to the sugar mixture. Whisk until they are completely incorporated and the mixture appears smooth.", "name": "Add the eggs to the sugar mixture. Whisk until they are completely incorporated and the mixture appears smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the pumpkin purée and orange juice, continuing until the wet mixture is uniform.", "name": "Stir in the pumpkin purée and orange juice, continuing until the wet mixture is uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-4"}, {"@type": "HowToStep", "text": "Gradually add the prepared dry ingredients to the pumpkin mixture. Stir gently only until no prominent streaks of dry flour remain. A slightly lumpy batter is acceptable and will help preserve a tender texture.", "name": "Gradually add the prepared dry ingredients to the pumpkin mixture. Stir gently only until no prominent streaks of dry flour remain. A slightly lumpy batter is acceptable and will help preserve a tender texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-5"}, {"@type": "HowToStep", "text": "Fold 1 cup of miniature chocolate chips evenly into the batter.", "name": "Fold 1 cup of miniature chocolate chips evenly into the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-6"}, {"@type": "HowToStep", "text": "Divide the batter between the prepared loaf pans, filling each pan approximately two-thirds full. Scatter the reserved chocolate chips over the surface of each loaf.", "name": "Divide the batter between the prepared loaf pans, filling each pan approximately two-thirds full. Scatter the reserved chocolate chips over the surface of each loaf.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-7"}, {"@type": "HowToStep", "text": "Bake for 45–55 minutes, or until the edges are golden and a toothpick inserted into the center of each loaf emerges clean.", "name": "Bake for 45–55 minutes, or until the edges are golden and a toothpick inserted into the center of each loaf emerges clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the pans to a wire cooling rack. Allow the loaves to rest in their pans for 15 minutes before carefully removing them.", "name": "Transfer the pans to a wire cooling rack. Allow the loaves to rest in their pans for 15 minutes before carefully removing them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-9"}, {"@type": "HowToStep", "text": "Place the unmolded loaves directly on the rack and leave them to cool completely. Slice and serve warm or at room temperature.", "name": "Place the unmolded loaves directly on the rack and leave them to cool completely. Slice and serve warm or at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-altitude-pumpkin-bread/#wprm-recipe-39768-step-0-10"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "High Altitude Pumpkin Bread"}</script>
