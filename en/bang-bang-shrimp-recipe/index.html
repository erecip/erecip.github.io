ly until evenly coated. Arrange on a bed of lettuce if desired and garnish with sliced green onions before serving.", "name": "Place the shrimp into a large bowl and pour the buttermilk over them, ensuring each piece is well coated. In a separate mixing bowl, combine cornstarch, garlic powder, salt, and pepper thoroughly. Warm the vegetable oil in a deep pan until it reaches 375°F. Remove each shrimp from the buttermilk, dredge generously in the cornstarch blend, and ensure a complete coating. Fry the shrimp in small batches for about 3–4 minutes, until each piece turns crisp and golden. Transfer the fried shrimp to a paper towel-lined plate to drain excess oil. For the sauce, whisk together the mayonnaise and sweet chili sauce until smooth. Add the fried shrimp to a clean bowl, drizzle the sauce over them, and toss gently until evenly coated. Arrange on a bed of lettuce if desired and garnish with sliced green onions before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bang-bang-shrimp-recipe/#wprm-recipe-15152-step-0-0"}], "recipeCategory": ["Dinner"], "recipeCuisine": ["Asian", "Thai"], "keywords": "Bang Bang Shrimp Recipe"}</script>
