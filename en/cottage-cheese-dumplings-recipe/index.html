    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Dumplings Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "These tender cottage cheese dumplings are prepared with semolina, egg yolks, and sugar, then gently cooked in hot water. Once cooked, they are coated in golden fried breadcrumbs and served warm with powdered sugar and sour cream.", "datePublished": "2018-01-27T02:07:50+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/cottage-cheese-dumplings-recipe2-2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/cottage-cheese-dumplings-recipe2-2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/cottage-cheese-dumplings-recipe2-2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/cottage-cheese-dumplings-recipe2-2.png"], "cookTime": "PT3M", "totalTime": "PT5M", "recipeIngredient": ["1.1 lb 500 g cottage cheese", "Pinch of salt", "3.5 oz 100 g semolina", "2 tablespoons white granulated sugar", "3  egg yolks", "3  egg whites (beaten until foamy)", "Baking powder (as called for in the original preparation; quantity not specified)", "Sour cream (for serving)", "Oil (for frying)", "Powdered sugar (for dusting)", "Breadcrumbs (for coating)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the three egg whites in a bowl and beat them until they become foamy.", "name": "Place the three egg whites in a bowl and beat them until they become foamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-0"}, {"@type": "HowToStep", "text": "In a separate mixing bowl, combine the cottage cheese with the egg yolks, granulated sugar, semolina, salt, and baking powder. Mix thoroughly until the ingredients form a smooth, creamy mixture.", "name": "In a separate mixing bowl, combine the cottage cheese with the egg yolks, granulated sugar, semolina, salt, and baking powder. Mix thoroughly until the ingredients form a smooth, creamy mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-1"}, {"@type": "HowToStep", "text": "Gently incorporate the beaten egg whites into the cottage cheese mixture, mixing carefully until they are evenly distributed.", "name": "Gently incorporate the beaten egg whites into the cottage cheese mixture, mixing carefully until they are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the prepared mixture to the refrigerator and chill it for at least 1–2 hours. Refrigeration allows the mixture to become firmer and easier to shape.", "name": "Transfer the prepared mixture to the refrigerator and chill it for at least 1–2 hours. Refrigeration allows the mixture to become firmer and easier to shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-3"}, {"@type": "HowToStep", "text": "Once the mixture has chilled sufficiently, moisten your hands with water to reduce sticking.", "name": "Once the mixture has chilled sufficiently, moisten your hands with water to reduce sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-4"}, {"@type": "HowToStep", "text": "Shape the cottage cheese mixture into small, evenly sized balls so they cook at approximately the same rate. Set the formed dumplings aside.", "name": "Shape the cottage cheese mixture into small, evenly sized balls so they cook at approximately the same rate. Set the formed dumplings aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-5"}, {"@type": "HowToStep", "text": "Heat a pot of water over medium heat until the water is hot but not boiling.", "name": "Heat a pot of water over medium heat until the water is hot but not boiling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-6"}, {"@type": "HowToStep", "text": "Carefully lower the shaped dumplings into the hot water. Cook them until they float to the surface, which generally takes about 3–5 minutes.", "name": "Carefully lower the shaped dumplings into the hot water. Cook them until they float to the surface, which generally takes about 3–5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-7"}, {"@type": "HowToStep", "text": "Add the breadcrumbs and cook them while stirring frequently until they develop an even golden-brown color. Remove the pan from the heat once the breadcrumbs are properly toasted.", "name": "Add the breadcrumbs and cook them while stirring frequently until they develop an even golden-brown color. Remove the pan from the heat once the breadcrumbs are properly toasted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-8"}, {"@type": "HowToStep", "text": "Carefully lift the cooked dumplings from the water and immediately roll each one in the fried breadcrumbs until completely coated.", "name": "Carefully lift the cooked dumplings from the water and immediately roll each one in the fried breadcrumbs until completely coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-9"}, {"@type": "HowToStep", "text": "Serve the cottage cheese dumplings while warm. Finish with a light dusting of powdered sugar and serve sour cream alongside.", "name": "Serve the cottage cheese dumplings while warm. Finish with a light dusting of powdered sugar and serve sour cream alongside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dumplings-recipe/#wprm-recipe-41200-step-0-10"}]}</script>
