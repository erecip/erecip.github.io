    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Texas Cowboy Stew Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty and flavorful stew featuring a trio of meats, beans, and a variety of vegetables, this Cowboy Stew is a delicious one-pot dish that is sure to satisfy everyone at the table.", "datePublished": "2024-01-19T00:46:27+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-11T084514.131-1-1.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-11T084514.131-1-1-500x400.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-11T084514.131-1-1-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-11T084514.131-1-1-480x270.png"], "recipeYield": ["8"], "prepTime": "PT15M", "cookTime": "PT90M", "totalTime": "PT105M", "recipeIngredient": ["1 1/2 pounds ground beef (80/20)", "4 slices bacon (chopped)", "2  medium russet potatoes (peeled and cut into 1/2-inch cubes)", "2  12-ounce packages kielbasa sausage, sliced into 1/2-inch pieces", "3 cloves garlic (minced)", "1  medium onion (diced)", "1  14.5-ounce can petite diced tomatoes, with liquid", "2  16-ounce cans baked beans, with liquid", "1  7-ounce can chopped green chilies, with liquid", "1  15-ounce can sweet corn, with liquid", "1 cup water", "3 tablespoons all-purpose flour", "1/2 teaspoon black pepper", "1 1/2 teaspoons salt", "1 teaspoon chili powder", "2 tablespoons parsley (chopped)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a large pot over medium heat, cook the chopped bacon until it is browned and crispy. Remove with a slotted spoon and place on a paper towel-lined plate to drain.", "name": "In a large pot over medium heat, cook the chopped bacon until it is browned and crispy. Remove with a slotted spoon and place on a paper towel-lined plate to drain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/texas-cowboy-stew-recipe/#wprm-recipe-1601-step-0-0"}, {"@type": "HowToStep", "text": "Add the sliced kielbasa sausage to the bacon drippings in the pot. Brown the sausage on both sides, adjusting the heat as necessary to prevent burning the fond (the browned bits at the bottom of the pot). Transfer the sausage to the plate with the bacon and set aside.", "name": "Add the sliced kielbasa sausage to the bacon drippings in the pot. Brown the sausage on both sides, adjusting the heat as necessary to prevent burning the fond (the browned bits at the bottom of the pot). Transfer the sausage to the plate with the bacon and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/texas-cowboy-stew-recipe/#wprm-recipe-1601-step-0-1"}, {"@type": "HowToStep", "text": "In the same pot, add the ground beef, diced onion, and minced garlic. Cook until the beef is no longer pink, breaking it up with a spoon as it cooks. Sprinkle the flour, salt, black pepper, and chili powder over the beef mixture. Stir well and continue to cook for about 1 minute.", "name": "In the same pot, add the ground beef, diced onion, and minced garlic. Cook until the beef is no longer pink, breaking it up with a spoon as it cooks. Sprinkle the flour, salt, black pepper, and chili powder over the beef mixture. Stir well and continue to cook for about 1 minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/texas-cowboy-stew-recipe/#wprm-recipe-1601-step-0-2"}, {"@type": "HowToStep", "text": "Add the petite diced tomatoes, baked beans, chopped green chilies, sweet corn, cubed potatoes, cooked bacon, browned sausage, and water to the pot. Stir to combine. Bring the mixture to a boil, then reduce the heat and let it simmer, covered, for about 1 hour. Stir occasionally to ensure even cooking and prevent sticking.", "name": "Add the petite diced tomatoes, baked beans, chopped green chilies, sweet corn, cubed potatoes, cooked bacon, browned sausage, and water to the pot. Stir to combine. Bring the mixture to a boil, then reduce the heat and let it simmer, covered, for about 1 hour. Stir occasionally to ensure even cooking and prevent sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/texas-cowboy-stew-recipe/#wprm-recipe-1601-step-0-3"}, {"@type": "HowToStep", "text": "Taste the stew and adjust the seasoning if needed. Garnish with chopped parsley before serving.", "name": "Taste the stew and adjust the seasoning if needed. Garnish with chopped parsley before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/texas-cowboy-stew-recipe/#wprm-recipe-1601-step-0-4"}, {"@type": "HowToStep", "text": "If the stew is too thick, add additional water to achieve the desired consistency.", "name": "If the stew is too thick, add additional water to achieve the desired consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/texas-cowboy-stew-recipe/#wprm-recipe-1601-step-0-5"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"]}</script>
