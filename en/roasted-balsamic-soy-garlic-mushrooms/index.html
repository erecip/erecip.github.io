    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Roasted Balsamic Soy Garlic Mushrooms", "author": {"@type": "Person", "name": "BenDes"}, "description": "Whole mushrooms are oven-roasted in a savory mixture of balsamic vinegar, soy sauce, garlic, thyme, and neutral oil. As they cook, the seasoning mixture reduces into a glossy glaze while the mushrooms become tender and deeply browned. This versatile dish works well as either a warm appetizer or a flavorful side.", "datePublished": "2020-04-19T18:09:46+00:00", "image": ["https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/roasted-balsamic-soy-garlic-mushrooms.png", "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/roasted-balsamic-soy-garlic-mushrooms.png", "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/roasted-balsamic-soy-garlic-mushrooms.png", "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/roasted-balsamic-soy-garlic-mushrooms.png"], "cookTime": "PT20M", "totalTime": "PT20M", "recipeIngredient": ["3 tablespoons aged or regular balsamic vinegar", "2 pounds whole baby bella or cremini mushrooms", "½ teaspoon finely chopped fresh thyme", "Freshly ground black pepper (as needed)", "1 tablespoon vegetable oil (or another neutral oil such as canola)", "3  fresh garlic cloves (finely minced, approximately 1 tablespoon)", "Salt (according to taste)", "2 tablespoons soy sauce"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F. Gently remove any visible dirt from the mushrooms with a damp paper towel rather than rinsing them with water. Trim away any dark or dried portions from the stem ends. Keep the mushrooms whole, cutting only especially large ones in half so they roast at a similar rate.", "name": "Preheat the oven to 400°F. Gently remove any visible dirt from the mushrooms with a damp paper towel rather than rinsing them with water. Trim away any dark or dried portions from the stem ends. Keep the mushrooms whole, cutting only especially large ones in half so they roast at a similar rate.", "url": "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/#wprm-recipe-43977-step-0-0"}, {"@type": "HowToStep", "text": "Arrange the prepared mushrooms across a baking sheet in a single, even layer.", "name": "Arrange the prepared mushrooms across a baking sheet in a single, even layer.", "url": "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/#wprm-recipe-43977-step-0-1"}, {"@type": "HowToStep", "text": "In a small bowl, whisk together the vegetable oil, balsamic vinegar, and soy sauce until thoroughly blended.", "name": "In a small bowl, whisk together the vegetable oil, balsamic vinegar, and soy sauce until thoroughly blended.", "url": "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/#wprm-recipe-43977-step-0-2"}, {"@type": "HowToStep", "text": "Add the finely minced garlic and chopped fresh thyme to the liquid mixture. Season with salt to taste and several grinds of fresh black pepper, then stir until the seasonings are evenly incorporated.", "name": "Add the finely minced garlic and chopped fresh thyme to the liquid mixture. Season with salt to taste and several grinds of fresh black pepper, then stir until the seasonings are evenly incorporated.", "url": "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/#wprm-recipe-43977-step-0-3"}, {"@type": "HowToStep", "text": "Pour the balsamic-soy mixture over the mushrooms. Gently toss until each mushroom is thoroughly coated, then redistribute them into a single layer so they can brown and caramelize rather than steam.", "name": "Pour the balsamic-soy mixture over the mushrooms. Gently toss until each mushroom is thoroughly coated, then redistribute them into a single layer so they can brown and caramelize rather than steam.", "url": "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/#wprm-recipe-43977-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the baking sheet to the preheated oven and roast the mushrooms for 10 minutes.", "name": "Transfer the baking sheet to the preheated oven and roast the mushrooms for 10 minutes.", "url": "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/#wprm-recipe-43977-step-0-5"}, {"@type": "HowToStep", "text": "Carefully remove the pan from the oven. Stir the mushrooms thoroughly, scraping up any caramelized portions from the bottom of the baking sheet and redistributing the glaze over the mushrooms.", "name": "Carefully remove the pan from the oven. Stir the mushrooms thoroughly, scraping up any caramelized portions from the bottom of the baking sheet and redistributing the glaze over the mushrooms.", "url": "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/#wprm-recipe-43977-step-0-6"}, {"@type": "HowToStep", "text": "Return the mushrooms to the oven and roast for an additional 10 minutes, or until they are tender and golden brown and the cooking liquid has reduced to a shiny glaze.", "name": "Return the mushrooms to the oven and roast for an additional 10 minutes, or until they are tender and golden brown and the cooking liquid has reduced to a shiny glaze.", "url": "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/#wprm-recipe-43977-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the roasted mushrooms to a serving dish while they are still warm. Serve immediately as an appetizer or side dish.", "name": "Transfer the roasted mushrooms to a serving dish while they are still warm. Serve immediately as an appetizer or side dish.", "url": "https://erecip.github.io/en/roasted-balsamic-soy-garlic-mushrooms/#wprm-recipe-43977-step-0-8"}], "recipeCategory": ["Appetizer", "Side Dish"], "recipeCuisine": ["Fusion"], "keywords": "Roasted Balsamic Soy Garlic Mushrooms"}</script>
