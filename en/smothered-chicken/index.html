    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Smothered Chicken", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, golden-fried chicken breasts are simmered in a richly seasoned, savory gravy, topped with crisp bacon for a deeply comforting and indulgent dish. This homemade smothered chicken delivers restaurant-level flavor with every bite.", "datePublished": "2023-05-05T14:53:30+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/smothered-chicken-1.png", "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/smothered-chicken-1.png", "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/smothered-chicken-1.png", "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/smothered-chicken-1.png"], "recipeYield": ["4"], "prepTime": "PT15M", "cookTime": "PT50M", "totalTime": "PT65M", "recipeIngredient": ["1 teaspoon garlic powder", "2  large boneless (skinless chicken breasts)", "¼ teaspoon dried rosemary", "¼ cup plain or Italian breadcrumbs", "¼ teaspoon ground sage", "4 tablespoons butter", "5  strips thick-cut bacon", "¾ teaspoon black pepper", "½ cup vegetable oil (for frying)", "1 teaspoon seasoned salt", "¼ teaspoon dried thyme", "1 teaspoon onion powder", "1  beef bouillon cube or 1 teaspoon beef base (such as Better Than Bouillon)", "1 teaspoon low-sodium soy sauce (or Worcestershire sauce)", "2.5 cups chicken broth (preferably low sodium)", "½ cup all-purpose flour (for dredging)", "2  –3 drops Kitchen Bouquet (optional)", "1/3 cup half and half", "4 tablespoons flour (for gravy)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the dredging mixture by combining flour, breadcrumbs, seasoned salt, and black pepper on a large plate. Mix well and set aside. Measure out all gravy components in advance.", "name": "Prepare the dredging mixture by combining flour, breadcrumbs, seasoned salt, and black pepper on a large plate. Mix well and set aside. Measure out all gravy components in advance.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-0"}, {"@type": "HowToStep", "text": "In a large skillet over medium-low heat, cook the bacon until it’s crisp. Transfer to a paper-lined plate and pour the rendered grease into a heat-safe bowl. Reserve 2 to 4 tablespoons of the clear drippings. Wipe out any blackened bits from the pan to prevent bitterness.", "name": "In a large skillet over medium-low heat, cook the bacon until it’s crisp. Transfer to a paper-lined plate and pour the rendered grease into a heat-safe bowl. Reserve 2 to 4 tablespoons of the clear drippings. Wipe out any blackened bits from the pan to prevent bitterness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-1"}, {"@type": "HowToStep", "text": "Meanwhile, slice each chicken breast horizontally to yield two thinner cutlets. Cover with plastic wrap and use a meat mallet to pound them to about ¾-inch thickness, creating surface texture for the breading to adhere.", "name": "Meanwhile, slice each chicken breast horizontally to yield two thinner cutlets. Cover with plastic wrap and use a meat mallet to pound them to about ¾-inch thickness, creating surface texture for the breading to adhere.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-2"}, {"@type": "HowToStep", "text": "Pat the chicken dry thoroughly and dredge each piece in the seasoned flour mixture, ensuring full and even coating in every crevice.", "name": "Pat the chicken dry thoroughly and dredge each piece in the seasoned flour mixture, ensuring full and even coating in every crevice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-3"}, {"@type": "HowToStep", "text": "Add the reserved bacon drippings and enough vegetable oil to the skillet to reach halfway up the sides of the chicken. Heat over medium-high until shimmering. Fry the chicken in batches, about 4–5 minutes per side, until golden and crisp. Adjust the heat as necessary to prevent burning. Remove and set aside.", "name": "Add the reserved bacon drippings and enough vegetable oil to the skillet to reach halfway up the sides of the chicken. Heat over medium-high until shimmering. Fry the chicken in batches, about 4–5 minutes per side, until golden and crisp. Adjust the heat as necessary to prevent burning. Remove and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-4"}, {"@type": "HowToStep", "text": "Drain the cooking oil from the skillet, leaving behind any browned bits. Wipe away any black spots with a paper towel but retain the fond, which contributes flavor to the gravy.", "name": "Drain the cooking oil from the skillet, leaving behind any browned bits. Wipe away any black spots with a paper towel but retain the fond, which contributes flavor to the gravy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-5"}, {"@type": "HowToStep", "text": "Reduce heat to medium and melt the butter in the pan. Using a silicone spatula, deglaze the base of the skillet. Gradually add the flour, whisking continuously to form a smooth roux.", "name": "Reduce heat to medium and melt the butter in the pan. Using a silicone spatula, deglaze the base of the skillet. Gradually add the flour, whisking continuously to form a smooth roux.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-6"}, {"@type": "HowToStep", "text": "Slowly incorporate the chicken broth and half and half in small increments, whisking thoroughly between each addition to maintain a smooth, thick texture. Avoid adding the liquids all at once to prevent breaking the roux.", "name": "Slowly incorporate the chicken broth and half and half in small increments, whisking thoroughly between each addition to maintain a smooth, thick texture. Avoid adding the liquids all at once to prevent breaking the roux.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-7"}, {"@type": "HowToStep", "text": "Stir in the bouillon, soy sauce (or Worcestershire), and all remaining gravy seasonings. Bring the mixture to a gentle boil, then lower the heat and let it simmer. Add Kitchen Bouquet if a richer color is desired.", "name": "Stir in the bouillon, soy sauce (or Worcestershire), and all remaining gravy seasonings. Bring the mixture to a gentle boil, then lower the heat and let it simmer. Add Kitchen Bouquet if a richer color is desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-8"}, {"@type": "HowToStep", "text": "Return the fried chicken to the skillet, along with any accumulated juices from the resting plate. Chop the cooked bacon and scatter it over the top.", "name": "Return the fried chicken to the skillet, along with any accumulated juices from the resting plate. Chop the cooked bacon and scatter it over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-9"}, {"@type": "HowToStep", "text": "Cover the pan partially and allow the dish to simmer over low heat for 10 to 15 minutes, or until the chicken reaches an internal temperature of 165°F.", "name": "Cover the pan partially and allow the dish to simmer over low heat for 10 to 15 minutes, or until the chicken reaches an internal temperature of 165°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-10"}, {"@type": "HowToStep", "text": "Garnish with chopped parsley and serve warm, ideally accompanied by mashed potatoes to soak up the gravy.", "name": "Garnish with chopped parsley and serve warm, ideally accompanied by mashed potatoes to soak up the gravy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/smothered-chicken/#wprm-recipe-31162-step-0-11"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "smothered chicken"}</script>
