"}, {"@type": "HowToStep", "text": "Whisk the melted coconut oil with 1 tablespoon of the maple syrup and the ground cinnamon until the mixture is evenly blended.", "name": "Whisk the melted coconut oil with 1 tablespoon of the maple syrup and the ground cinnamon until the mixture is evenly blended.", "url": "https://erecip.github.io/en/air-fryer-apples/#wprm-recipe-45846-step-0-2"}, {"@type": "HowToStep", "text": "Place the prepared apple halves in the mixture and toss thoroughly, ensuring both the cut surfaces and skins receive an even coating.", "name": "Place the prepared apple halves in the mixture and toss thoroughly, ensuring both the cut surfaces and skins receive an even coating.", "url": "https://erecip.github.io/en/air-fryer-apples/#wprm-recipe-45846-step-0-3"}, {"@type": "HowToStep", "text": "Position the coated apple halves in the preheated air fryer basket with their cut sides facing upward.", "name": "Position the coated apple halves in the preheated air fryer basket with their cut sides facing upward.", "url": "https://erecip.github.io/en/air-fryer-apples/#wprm-recipe-45846-step-0-4"}, {"@type": "HowToStep", "text": "Air fry at 380°F (193°C) for 10–14 minutes, shaking the basket halfway through the cooking period to promote consistent browning.", "name": "Air fry at 380°F (193°C) for 10–14 minutes, shaking the basket halfway through the cooking period to promote consistent browning.", "url": "https://erecip.github.io/en/air-fryer-apples/#wprm-recipe-45846-step-0-5"}, {"@type": "HowToStep", "text": "Begin checking the apples at approximately 10 minutes. They are ready when the flesh has become very tender and the outer edges show light caramelization. Cooking time may vary slightly according to apple size.", "name": "Begin checking the apples at approximately 10 minutes. They are ready when the flesh has become very tender and the outer edges show light caramelization. Cooking time may vary slightly according to apple size.", "url": "https://erecip.gi
