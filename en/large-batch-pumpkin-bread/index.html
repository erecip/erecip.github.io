    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Large-Batch Pumpkin Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "A generously sized pumpkin quick bread recipe that produces three moist, warmly spiced loaves. Olive oil or melted butter provides richness, while optional golden raisins and walnuts contribute sweetness, texture, and a pleasant nutty finish.", "datePublished": "2023-01-28T10:18:38+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/large-batch-pumpkin-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/large-batch-pumpkin-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/large-batch-pumpkin-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/large-batch-pumpkin-bread.png"], "cookTime": "PT60M", "totalTime": "PT70M", "recipeIngredient": ["⅔ cup canned pumpkin purée (such as Libby’s)", "4  large eggs (brought to room temperature)", "1 cup olive oil or unsalted butter (melted)", "⅔ cup water", "2 teaspoons baking soda", "1½ cups chopped walnuts (optional)", "3⅓ cups all-purpose flour (sifted)", "½ teaspoon ground allspice", "3 cups granulated sugar", "1 teaspoon ground nutmeg", "1½ cups golden raisins (optional)", "1½ teaspoons salt", "2 teaspoons ground cinnamon"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (177°C). Thoroughly grease and flour three loaf pans, or line each pan with parchment paper to help the finished loaves release cleanly.", "name": "Preheat the oven to 350°F (177°C). Thoroughly grease and flour three loaf pans, or line each pan with parchment paper to help the finished loaves release cleanly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/#wprm-recipe-39428-step-0-0"}, {"@type": "HowToStep", "text": "Place the pumpkin purée, room-temperature eggs, olive oil or melted unsalted butter, and water in a large mixing bowl. Whisk vigorously until the ingredients form a smooth, uniform mixture.", "name": "Place the pumpkin purée, room-temperature eggs, olive oil or melted unsalted butter, and water in a large mixing bowl. Whisk vigorously until the ingredients form a smooth, uniform mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/#wprm-recipe-39428-step-0-1"}, {"@type": "HowToStep", "text": "In a separate bowl, combine the sifted flour, baking soda, granulated sugar, salt, cinnamon, nutmeg, and allspice. Stir until the spices and leavening are evenly dispersed.", "name": "In a separate bowl, combine the sifted flour, baking soda, granulated sugar, salt, cinnamon, nutmeg, and allspice. Stir until the spices and leavening are evenly dispersed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/#wprm-recipe-39428-step-0-2"}, {"@type": "HowToStep", "text": "Add the golden raisins and chopped walnuts to the dry ingredients, when using. Toss gently so they are distributed throughout the flour mixture.", "name": "Add the golden raisins and chopped walnuts to the dry ingredients, when using. Toss gently so they are distributed throughout the flour mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/#wprm-recipe-39428-step-0-3"}, {"@type": "HowToStep", "text": "Gradually add the dry mixture to the bowl containing the pumpkin mixture. Stir only until the batter is evenly blended and no visible pockets of dry flour remain.", "name": "Gradually add the dry mixture to the bowl containing the pumpkin mixture. Stir only until the batter is evenly blended and no visible pockets of dry flour remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/#wprm-recipe-39428-step-0-4"}, {"@type": "HowToStep", "text": "Distribute the batter evenly among the three prepared loaf pans. If desired, scatter roasted pumpkin seeds or old-fashioned oats over the surface of each loaf for added texture.", "name": "Distribute the batter evenly among the three prepared loaf pans. If desired, scatter roasted pumpkin seeds or old-fashioned oats over the surface of each loaf for added texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/#wprm-recipe-39428-step-0-5"}, {"@type": "HowToStep", "text": "Place the pans in the preheated oven and bake for approximately 1 hour. The bread is ready when a toothpick inserted into the center of a loaf comes out clean. Baking time may vary slightly according to the oven and the dimensions of the pans.", "name": "Place the pans in the preheated oven and bake for approximately 1 hour. The bread is ready when a toothpick inserted into the center of a loaf comes out clean. Baking time may vary slightly according to the oven and the dimensions of the pans.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/#wprm-recipe-39428-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the baked loaves to a wire cooling rack. Allow them to rest in their pans for 10–30 minutes, then carefully remove them and return them to the rack.", "name": "Transfer the baked loaves to a wire cooling rack. Allow them to rest in their pans for 10–30 minutes, then carefully remove them and return them to the rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/#wprm-recipe-39428-step-0-7"}, {"@type": "HowToStep", "text": "Cool the pumpkin bread completely before slicing. Full cooling allows the interior crumb to set properly and helps produce cleaner, more even slices.", "name": "Cool the pumpkin bread completely before slicing. Full cooling allows the interior crumb to set properly and helps produce cleaner, more even slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/large-batch-pumpkin-bread/#wprm-recipe-39428-step-0-8"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Large-Batch Pumpkin Bread"}</script>
