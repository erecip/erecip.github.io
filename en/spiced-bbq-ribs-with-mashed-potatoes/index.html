    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Spiced BBQ Ribs with Mashed Potatoes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender pork ribs are coated with a warmly spiced brown sugar rub, pressure-cooked in a savory broth and red wine vinegar mixture, then finished beneath the broiler with a glossy honey barbecue coating. Creamy garlic mashed potatoes provide a rich, comforting accompaniment to the caramelized ribs.", "datePublished": "2021-03-28T06:04:11+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/spiced-bbq-ribs-with-mashed-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/spiced-bbq-ribs-with-mashed-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/spiced-bbq-ribs-with-mashed-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/spiced-bbq-ribs-with-mashed-potatoes.png"], "cookTime": "PT25M", "totalTime": "PT30M", "recipeIngredient": ["1 tablespoon onion powder", "2 tablespoons packed brown sugar", "1 teaspoon ground cumin", "1 tablespoon Italian herb seasoning", "1 teaspoon chili powder", "1 tablespoon ground mustard", "1 tablespoon paprika", "1 teaspoon seasoned pepper", "1 tablespoon garlic salt", "1 tablespoon seasoned salt", "½ cup red wine vinegar", "2  racks pork ribs (approximately 4 pounds altogether)", "2 cups chicken broth (such as Swanson)", "2 cups honey-style barbecue sauce (such as Sweet Baby Ray’s)", "1 tablespoon minced fresh garlic", "½ cup heavy cream", "1 teaspoon coarsely ground black pepper", "3  –4 pounds white potatoes (such as Idaho or Russet potatoes, peeled and quartered)", "1  stick unsalted butter (such as Kerrygold)", "1 tablespoon coarse garlic salt", "2 tablespoons salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the brown sugar, garlic salt, seasoned salt, seasoned pepper, onion powder, chili powder, ground mustard, paprika, Italian seasoning, and cumin in a small bowl. Stir thoroughly until the seasonings are evenly blended. Reserve this mixture for coating the ribs.", "name": "Place the brown sugar, garlic salt, seasoned salt, seasoned pepper, onion powder, chili powder, ground mustard, paprika, Italian seasoning, and cumin in a small bowl. Stir thoroughly until the seasonings are evenly blended. Reserve this mixture for coating the ribs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-0"}, {"@type": "HowToStep", "text": "Inspect the underside of each rack and confirm that the membrane has been removed. If it remains attached, loosen one corner, grip it securely, and carefully peel it away.", "name": "Inspect the underside of each rack and confirm that the membrane has been removed. If it remains attached, loosen one corner, grip it securely, and carefully peel it away.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-1"}, {"@type": "HowToStep", "text": "Coat both surfaces of the ribs generously with the prepared spice mixture. Press the seasoning firmly against the meat so it adheres well.", "name": "Coat both surfaces of the ribs generously with the prepared spice mixture. Press the seasoning firmly against the meat so it adheres well.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-2"}, {"@type": "HowToStep", "text": "Pour the chicken broth and red wine vinegar into the Instant Pot. Position the metal trivet inside the pot, then arrange the seasoned rib racks over the trivet. Curve the racks around the interior of the pot if necessary to make them fit.", "name": "Pour the chicken broth and red wine vinegar into the Instant Pot. Position the metal trivet inside the pot, then arrange the seasoned rib racks over the trivet. Curve the racks around the interior of the pot if necessary to make them fit.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-3"}, {"@type": "HowToStep", "text": "Lock the lid into position and turn the pressure valve to SEALING. Select the MANUAL setting and pressure-cook the ribs for 25 minutes.", "name": "Lock the lid into position and turn the pressure valve to SEALING. Select the MANUAL setting and pressure-cook the ribs for 25 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-4"}, {"@type": "HowToStep", "text": "When the cooking cycle finishes, allow the pressure to release naturally until the pot has completely depressurized. This gradual release helps maintain the ribs' tenderness.", "name": "When the cooking cycle finishes, allow the pressure to release naturally until the pot has completely depressurized. This gradual release helps maintain the ribs' tenderness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-5"}, {"@type": "HowToStep", "text": "After the pressure has fully released and the lid can be opened safely, carefully transfer the cooked ribs to a baking dish lined with foil.", "name": "After the pressure has fully released and the lid can be opened safely, carefully transfer the cooked ribs to a baking dish lined with foil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-6"}, {"@type": "HowToStep", "text": "Brush the ribs liberally with the honey barbecue sauce, coating all exposed surfaces.", "name": "Brush the ribs liberally with the honey barbecue sauce, coating all exposed surfaces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-7"}, {"@type": "HowToStep", "text": "Place the glazed ribs beneath the oven broiler for 5–6 minutes, or until the barbecue sauce is bubbling and develops a caramelized finish.", "name": "Place the glazed ribs beneath the oven broiler for 5–6 minutes, or until the barbecue sauce is bubbling and develops a caramelized finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-8"}, {"@type": "HowToStep", "text": "Remove the ribs from the oven. If preferred, brush on another layer of barbecue sauce immediately after broiling for a richer and stickier coating.", "name": "Remove the ribs from the oven. If preferred, brush on another layer of barbecue sauce immediately after broiling for a richer and stickier coating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-9"}, {"@type": "HowToStep", "text": "While the ribs are pressure-cooking, peel the potatoes and cut them into chunks. Transfer them to a large pot or roaster and add enough cold water to cover them.", "name": "While the ribs are pressure-cooking, peel the potatoes and cut them into chunks. Transfer them to a large pot or roaster and add enough cold water to cover them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-10"}, {"@type": "HowToStep", "text": "Stir 2 tablespoons of salt into the water and bring it to a boil over high heat. Cook the potatoes for approximately 15–20 minutes, or until they are easily pierced with a fork.", "name": "Stir 2 tablespoons of salt into the water and bring it to a boil over high heat. Cook the potatoes for approximately 15–20 minutes, or until they are easily pierced with a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-11"}, {"@type": "HowToStep", "text": "Drain away most of the cooking water, retaining roughly one-quarter of the water in the pot with the potatoes to assist with mashing.", "name": "Drain away most of the cooking water, retaining roughly one-quarter of the water in the pot with the potatoes to assist with mashing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-12"}, {"@type": "HowToStep", "text": "Mash the hot potatoes with a potato masher. Add the butter, minced garlic, heavy cream or half-and-half, coarse garlic salt, and coarsely ground black pepper.", "name": "Mash the hot potatoes with a potato masher. Add the butter, minced garlic, heavy cream or half-and-half, coarse garlic salt, and coarsely ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-13"}, {"@type": "HowToStep", "text": "Mix thoroughly until the butter has melted, the seasonings are evenly incorporated, and the potatoes have developed a creamy consistency.", "name": "Mix thoroughly until the butter has melted, the seasonings are evenly incorporated, and the potatoes have developed a creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-14"}, {"@type": "HowToStep", "text": "Cover the potatoes and keep them warm over the lowest stove setting until ready to serve.", "name": "Cover the potatoes and keep them warm over the lowest stove setting until ready to serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-15"}, {"@type": "HowToStep", "text": "Spoon the creamy mashed potatoes onto serving plates and arrange portions of the caramelized barbecue ribs over or alongside them.", "name": "Spoon the creamy mashed potatoes onto serving plates and arrange portions of the caramelized barbecue ribs over or alongside them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-16"}, {"@type": "HowToStep", "text": "Serve additional barbecue sauce on the side if desired. Garlic toast may also be served as an accompaniment.", "name": "Serve additional barbecue sauce on the side if desired. Garlic toast may also be served as an accompaniment.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/spiced-bbq-ribs-with-mashed-potatoes/#wprm-recipe-46658-step-0-17"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Spiced BBQ Ribs with Mashed Potatoes"}</script>
