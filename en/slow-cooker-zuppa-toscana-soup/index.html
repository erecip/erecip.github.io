ppa-toscana-soup/#wprm-recipe-43537-step-0-0"}, {"@type": "HowToStep", "text": "Stir the minced garlic into the sausage mixture and continue cooking for 1 additional minute, just until aromatic.", "name": "Stir the minced garlic into the sausage mixture and continue cooking for 1 additional minute, just until aromatic.", "url": "https://erecip.github.io/en/slow-cooker-zuppa-toscana-soup/#wprm-recipe-43537-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the cooked sausage, onion, and garlic mixture to a 4–6-quart slow cooker. Add the chicken broth, potato chunks, salt, black pepper, and a pinch of red pepper flakes. Stir until the ingredients are evenly distributed.", "name": "Transfer the cooked sausage, onion, and garlic mixture to a 4–6-quart slow cooker. Add the chicken broth, potato chunks, salt, black pepper, and a pinch of red pepper flakes. Stir until the ingredients are evenly distributed.", "url": "https://erecip.github.io/en/slow-cooker-zuppa-toscana-soup/#wprm-recipe-43537-step-0-2"}, {"@type": "HowToStep", "text": "Cover and cook on Low for 4–5 hours or on High for approximately 2 hours. Slow cooker temperatures can vary by model, so continue cooking as necessary until the potatoes are tender.", "name": "Cover and cook on Low for 4–5 hours or on High for approximately 2 hours. Slow cooker temperatures can vary by model, so continue cooking as necessary until the potatoes are tender.", "url": "https://erecip.github.io/en/slow-cooker-zuppa-toscana-soup/#wprm-recipe-43537-step-0-3"}, {"@type": "HowToStep", "text": "Once the potatoes have softened, stir in the chopped kale, heavy cream, and some of the grated Parmesan. Mix thoroughly, allowing the residual heat to gently wilt the kale.", "name": "Once the potatoes have softened, stir in the chopped kale, heavy cream, and some of the grated Parmesan. Mix thoroughly, allowing the residual heat to gently wilt the kale.", "url": "https://erecip.github.io/en/slow-cooker-zuppa-toscana-soup/#wprm-recipe-43537-step-0-4"}, {"@type": "HowToStep", "text": "Taste the soup and adjust the seasoning as needed. Serve warm with the remaining freshly grated Parmesan as desired.", "name": "Taste the soup and adjust the seasoning as needed. Serve warm with the remaining freshly grated Parmesan as desired.", "url": "https://erecip.github.io/en/slow-cooker-zuppa-toscana-soup/#wprm-recipe-43537-step-0-5"}], "recipeCategory": ["Soup"], "recipeCuisine": ["Italian"], "keywords": "Slow Cooker Zuppa Toscana Soup"}</script>
