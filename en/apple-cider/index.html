e evenly incorporated throughout the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cider/#wprm-recipe-46505-step-0-1"}, {"@type": "HowToStep", "text": "Set the uncovered stockpot over high heat and bring the apple mixture to a vigorous boil. Continue boiling for approximately 1 hour, stirring occasionally so the sugar dissolves thoroughly and the ingredients do not adhere to the bottom of the pot.", "name": "Set the uncovered stockpot over high heat and bring the apple mixture to a vigorous boil. Continue boiling for approximately 1 hour, stirring occasionally so the sugar dissolves thoroughly and the ingredients do not adhere to the bottom of the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cider/#wprm-recipe-46505-step-0-2"}, {"@type": "HowToStep", "text": "After the 1-hour boiling period, cover the stockpot with a lid and reduce the heat to low. Allow the mixture to simmer gently for 2 hours, checking periodically to ensure it maintains a quiet simmer without boiling over. During this stage, the apples should become very soft and the flavors will fully infuse the liquid.", "name": "After the 1-hour boiling period, cover the stockpot with a lid and reduce the heat to low. Allow the mixture to simmer gently for 2 hours, checking periodically to ensure it maintains a quiet simmer without boiling over. During this stage, the apples should become very soft and the flavors will fully infuse the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cider/#wprm-recipe-46505-step-0-3"}, {"@type": "HowToStep", "text": "Remove the pot from the heat and allow the cooked apple mixture to cool slightly so it is easier to handle.", "name": "Remove the pot from the heat and allow the cooked apple mixture to cool slightly so it is easier to handle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cider/#wprm-recipe-46505-step-0-4"}, {"@type": "HowToStep", "text": "Position a ch
