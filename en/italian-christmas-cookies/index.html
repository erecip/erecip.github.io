    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Italian Christmas Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, almond-scented Italian Christmas cookies with a soft texture, finished with a thick almond glaze and colorful nonpareil sprinkles. Chilling the dough before shaping makes the sticky mixture easier to handle.", "datePublished": "2023-01-04T17:45:31+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/italian-christmas-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/italian-christmas-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/italian-christmas-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/italian-christmas-cookies.png"], "cookTime": "PT10M", "totalTime": "PT70M", "recipeIngredient": ["3  large eggs (brought to room temperature for smoother mixing)", "1 1/2 teaspoons almond extract", "1/2 cup granulated sugar", "2 teaspoons baking powder", "2 1/4 cups all-purpose flour (preferably King Arthur all-purpose flour)", "1/2 cup salted butter (melted and allowed to cool)", "Nonpareil sprinkles (for decorating)", "2  –3 tablespoons milk", "1 teaspoon almond extract (for pronounced almond flavor and fragrance)", "2 cups powdered sugar (sifted for a smooth, lump-free glaze)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the dry mixture. In a small bowl, thoroughly combine the all-purpose flour with the baking powder. Set the mixture aside while preparing the remaining ingredients.", "name": "Prepare the dry mixture. In a small bowl, thoroughly combine the all-purpose flour with the baking powder. Set the mixture aside while preparing the remaining ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/#wprm-recipe-43338-step-0-0"}, {"@type": "HowToStep", "text": "Mix the butter and wet ingredients. Using an electric mixer, beat the cooled melted butter until light and fluffy. Add the eggs, granulated sugar, and almond extract, then continue mixing until thoroughly incorporated. The mixture may have a somewhat chunky appearance at this point.", "name": "Mix the butter and wet ingredients. Using an electric mixer, beat the cooled melted butter until light and fluffy. Add the eggs, granulated sugar, and almond extract, then continue mixing until thoroughly incorporated. The mixture may have a somewhat chunky appearance at this point.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/#wprm-recipe-43338-step-0-1"}, {"@type": "HowToStep", "text": "Form and chill the dough. Gradually incorporate the flour and baking powder mixture into the butter mixture. Mix only until everything is combined, taking care not to overwork the dough. Refrigerate the finished dough for at least 1 hour so that it becomes easier to handle.", "name": "Form and chill the dough. Gradually incorporate the flour and baking powder mixture into the butter mixture. Mix only until everything is combined, taking care not to overwork the dough. Refrigerate the finished dough for at least 1 hour so that it becomes easier to handle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/#wprm-recipe-43338-step-0-2"}, {"@type": "HowToStep", "text": "Shape and bake the cookies. Preheat the oven to 350°F (175°C) and line a baking sheet with parchment paper. Using a small cookie scoop or tablespoon, portion the chilled dough and roll it into balls. The dough will remain fairly sticky. Arrange the dough balls approximately 1 inch apart on the prepared baking sheet.", "name": "Shape and bake the cookies. Preheat the oven to 350°F (175°C) and line a baking sheet with parchment paper. Using a small cookie scoop or tablespoon, portion the chilled dough and roll it into balls. The dough will remain fairly sticky. Arrange the dough balls approximately 1 inch apart on the prepared baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/#wprm-recipe-43338-step-0-3"}, {"@type": "HowToStep", "text": "Bake for 8–10 minutes, or just until the cookies are set. Avoid baking them for too long, as this can cause them to become dry. Transfer the cookies to cool completely before applying the icing.", "name": "Bake for 8–10 minutes, or just until the cookies are set. Avoid baking them for too long, as this can cause them to become dry. Transfer the cookies to cool completely before applying the icing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/#wprm-recipe-43338-step-0-4"}, {"@type": "HowToStep", "text": "Make the almond icing. Place the sifted powdered sugar in a bowl. Add the milk 1 tablespoon at a time, stirring after each addition until a thick glaze develops. Mix in the almond extract until evenly distributed.", "name": "Make the almond icing. Place the sifted powdered sugar in a bowl. Add the milk 1 tablespoon at a time, stirring after each addition until a thick glaze develops. Mix in the almond extract until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/#wprm-recipe-43338-step-0-5"}, {"@type": "HowToStep", "text": "Glaze and decorate. Position a cooling rack inside a baking sheet so the pan can collect any dripping icing. Once the cookies are completely cool, hold each cookie upside down and dip the top into the prepared glaze.", "name": "Glaze and decorate. Position a cooling rack inside a baking sheet so the pan can collect any dripping icing. Once the cookies are completely cool, hold each cookie upside down and dip the top into the prepared glaze.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/#wprm-recipe-43338-step-0-6"}, {"@type": "HowToStep", "text": "Turn each glazed cookie upright and place it on the cooling rack, allowing the excess icing to drip onto the baking sheet below. Immediately scatter nonpareil sprinkles over the wet glaze before the icing begins to set.", "name": "Turn each glazed cookie upright and place it on the cooling rack, allowing the excess icing to drip onto the baking sheet below. Immediately scatter nonpareil sprinkles over the wet glaze before the icing begins to set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/italian-christmas-cookies/#wprm-recipe-43338-step-0-7"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["Italian"], "keywords": "Italian Christmas Cookies"}</script>
