ese/#wprm-recipe-42448-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the caramelized onion to a small plate and allow it to cool slightly while preparing the bagel.", "name": "Transfer the caramelized onion to a small plate and allow it to cool slightly while preparing the bagel.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/everything-bagel-grilled-cheese/#wprm-recipe-42448-step-0-1"}, {"@type": "HowToStep", "text": "Cut the everything bagel horizontally into two equal halves. Spread the softened tablespoon of butter evenly over the cut surface of each half. Set both prepared pieces aside.", "name": "Cut the everything bagel horizontally into two equal halves. Spread the softened tablespoon of butter evenly over the cut surface of each half. Set both prepared pieces aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/everything-bagel-grilled-cheese/#wprm-recipe-42448-step-0-2"}, {"@type": "HowToStep", "text": "Keep the skillet over medium heat. Place one bagel half in the pan with its buttered surface facing downward. Press gently with a spatula so the surface makes even contact with the skillet.", "name": "Keep the skillet over medium heat. Place one bagel half in the pan with its buttered surface facing downward. Press gently with a spatula so the surface makes even contact with the skillet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/everything-bagel-grilled-cheese/#wprm-recipe-42448-step-0-3"}, {"@type": "HowToStep", "text": "Place one slice of marbled cheese over the bagel, distribute the caramelized onion on top, and cover the onion with the remaining cheese slice.", "name": "Place one slice of marbled cheese over the bagel, distribute the caramelized onion on top, and cover the onion with the remaining cheese slice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/everything-bagel-grilled-cheese/#wprm-recipe-42448-step-0-4"}, {"@type": "HowToStep", "text": "Position the second bagel half on top with its buttered side facing upward. Press the assembled sandwich lightly with the spatula so the layers settle together.", "name": "Position the second bagel half on top with its buttered side facing upward. Press the assembled sandwich lightly with the spatula so the layers settle together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/everything-bagel-grilled-cheese/#wprm-recipe-42448-step-0-5"}, {"@type": "HowToStep", "text": "Cook the first side for another 2–3 minutes, or until the underside is crisp and deeply golden. Carefully turn the sandwich over with a wide spatula.", "name": "Cook the first side for another 2–3 minutes, or until the underside is crisp and deeply golden. Carefully turn the sandwich over with a wide spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/everything-bagel-grilled-cheese/#wprm-recipe-42448-step-0-6"}, {"@type": "HowToStep", "text": "Cook the opposite side for an additional 2–3 minutes, until it is similarly golden and crisp and the cheese has melted completely. The finished cheese should be creamy, with a small amount beginning to escape around the edges.", "name": "Cook the opposite side for an additional 2–3 minutes, until it is similarly golden and crisp and the cheese has melted completely. The finished cheese should be creamy, with a small amount beginning to escape around the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/everything-bagel-grilled-cheese/#wprm-recipe-42448-step-0-7"}, {"@type": "HowToStep", "text": "Serve the Everything Bagel Grilled Cheese immediately while the bagel remains crisp and the cheese is hot and melted.", "name": "Serve the Everything Bagel Grilled Cheese immediately while the bagel remains crisp and the cheese is hot and melted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/everything-bagel-grilled-cheese/#wprm-recipe-42448-step-0-8"}], "recipeCategory": ["Sandwiches"], "recipeCuisine": ["American"], "keyw
