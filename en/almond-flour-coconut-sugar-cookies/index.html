ookie scoop, then drop each portion onto the prepared baking sheet, leaving space between the cookies so they can spread while baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/almond-flour-coconut-sugar-cookies/#wprm-recipe-38730-step-0-4"}, {"@type": "HowToStep", "text": "Bake at 350ºF for 9 to 12 minutes, or until the cookies have spread and the edges appear lightly golden. Allow the cookies to rest on the baking sheet for 10 to 15 minutes before serving warm, giving them time to set.", "name": "Bake at 350ºF for 9 to 12 minutes, or until the cookies have spread and the edges appear lightly golden. Allow the cookies to rest on the baking sheet for 10 to 15 minutes before serving warm, giving them time to set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/almond-flour-coconut-sugar-cookies/#wprm-recipe-38730-step-0-5"}, {"@type": "HowToStep", "text": "For the crispest texture, let the cookies cool to room temperature and enjoy them the same day they are baked.", "name": "For the crispest texture, let the cookies cool to room temperature and enjoy them the same day they are baked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/almond-flour-coconut-sugar-cookies/#wprm-recipe-38730-step-0-6"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Almond Flour Coconut Sugar Cookies"}</script>
