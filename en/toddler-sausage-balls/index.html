    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Toddler Sausage Balls", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, savory pork-and-cheese sausage balls made with ranch seasoning and served alongside a creamy, lightly sweet mustard dipping sauce. They may be prepared in the oven or air fryer and portioned into smaller pieces when serving young children.", "datePublished": "2018-11-13T04:42:46+00:00", "image": ["https://erecip.github.io/en/toddler-sausage-balls/toddler-sausage-balls2.png", "https://erecip.github.io/en/toddler-sausage-balls/toddler-sausage-balls2.png", "https://erecip.github.io/en/toddler-sausage-balls/toddler-sausage-balls2.png", "https://erecip.github.io/en/toddler-sausage-balls/toddler-sausage-balls2.png"], "cookTime": "PT15M", "totalTime": "PT25M", "recipeIngredient": ["4 oz cheddar or Colby Jack cheese (freshly shredded)", "1 tsp baking powder", "8 oz ground pork", "Approximately 1 tbsp ranch seasoning (or an amount adjusted to taste)", "4 tbsp butter (melted and allowed to cool slightly)", "3/4 cup all-purpose flour", "Plain Greek yogurt for a thicker consistency (or mayonnaise)", "Maple syrup (preferably Grade A Amber Rich, or honey)", "Dijon or yellow mustard"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 375°F. If using an air fryer instead, prepare it according to the air-frying directions in Step 5.", "name": "Preheat the oven to 375°F. If using an air fryer instead, prepare it according to the air-frying directions in Step 5.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-0"}, {"@type": "HowToStep", "text": "Cover a shallow, rimmed baking pan with parchment paper. If parchment is unavailable, lightly grease the pan with oil or cooking spray to minimize sticking.", "name": "Cover a shallow, rimmed baking pan with parchment paper. If parchment is unavailable, lightly grease the pan with oil or cooking spray to minimize sticking.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-1"}, {"@type": "HowToStep", "text": "Take the 8 oz of ground pork from the refrigerator and leave it at room temperature for 10–15 minutes. Allowing it to soften slightly makes it easier to incorporate into the other ingredients.", "name": "Take the 8 oz of ground pork from the refrigerator and leave it at room temperature for 10–15 minutes. Allowing it to soften slightly makes it easier to incorporate into the other ingredients.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-2"}, {"@type": "HowToStep", "text": "Place the 3/4 cup all-purpose flour, 1 tsp baking powder, ranch seasoning, and 4 oz shredded cheese in a large mixing bowl.", "name": "Place the 3/4 cup all-purpose flour, 1 tsp baking powder, ranch seasoning, and 4 oz shredded cheese in a large mixing bowl.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-3"}, {"@type": "HowToStep", "text": "Stir or sift the ingredients together until the baking powder and seasoning are evenly distributed throughout the flour and cheese.", "name": "Stir or sift the ingredients together until the baking powder and seasoning are evenly distributed throughout the flour and cheese.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-4"}, {"@type": "HowToStep", "text": "Melt the 4 tbsp butter and allow it to cool slightly. Add the butter and the rested ground pork to the bowl containing the flour-and-cheese mixture.", "name": "Melt the 4 tbsp butter and allow it to cool slightly. Add the butter and the rested ground pork to the bowl containing the flour-and-cheese mixture.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-5"}, {"@type": "HowToStep", "text": "Using your hands, firmly mix and knead everything together until the ingredients form a unified, cohesive dough. This process can require several minutes.", "name": "Using your hands, firmly mix and knead everything together until the ingredients form a unified, cohesive dough. This process can require several minutes.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-6"}, {"@type": "HowToStep", "text": "Continue pressing, squeezing, and working the mixture until no loose portions remain and it can be gathered into one large dough ball. Thorough mixing is important so the individual sausage balls remain intact while cooking.", "name": "Continue pressing, squeezing, and working the mixture until no loose portions remain and it can be gathered into one large dough ball. Thorough mixing is important so the individual sausage balls remain intact while cooking.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-7"}, {"@type": "HowToStep", "text": "Pinch off small portions of the prepared sausage mixture and roll each portion between your palms to create small, evenly shaped balls.", "name": "Pinch off small portions of the prepared sausage mixture and roll each portion between your palms to create small, evenly shaped balls.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-8"}, {"@type": "HowToStep", "text": "Arrange the formed balls on the prepared baking pan, leaving a small amount of space between each one.", "name": "Arrange the formed balls on the prepared baking pan, leaving a small amount of space between each one.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-9"}, {"@type": "HowToStep", "text": "For oven preparation, bake the sausage balls at 375°F for approximately 15 minutes, or until their surfaces are golden brown and the pork is fully cooked.", "name": "For oven preparation, bake the sausage balls at 375°F for approximately 15 minutes, or until their surfaces are golden brown and the pork is fully cooked.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-10"}, {"@type": "HowToStep", "text": "If additional cooking is required, return them to the oven for another 3 minutes as needed.", "name": "If additional cooking is required, return them to the oven for another 3 minutes as needed.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-11"}, {"@type": "HowToStep", "text": "For air-fryer preparation, lightly coat the bottom of the air-fryer basket with cooking spray. Position the sausage balls in a single layer without allowing them to touch, then cook at 350°F for 6–8 minutes.", "name": "For air-fryer preparation, lightly coat the bottom of the air-fryer basket with cooking spray. Position the sausage balls in a single layer without allowing them to touch, then cook at 350°F for 6–8 minutes.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-12"}, {"@type": "HowToStep", "text": "Cooking performance varies among air fryers, so adjust the cooking duration slightly when necessary. Allow the finished sausage balls to cool a little before serving.", "name": "Cooking performance varies among air fryers, so adjust the cooking duration slightly when necessary. Allow the finished sausage balls to cool a little before serving.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-13"}, {"@type": "HowToStep", "text": "While the sausage balls cook, place a generous spoonful of plain yogurt or mayonnaise in a small bowl.", "name": "While the sausage balls cook, place a generous spoonful of plain yogurt or mayonnaise in a small bowl.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-14"}, {"@type": "HowToStep", "text": "Add two or three squirts of mustard along with a splash of maple syrup or honey. Stir until smooth, then taste and adjust the mustard or sweetener until the desired balance of tanginess and sweetness is achieved.", "name": "Add two or three squirts of mustard along with a splash of maple syrup or honey. Stir until smooth, then taste and adjust the mustard or sweetener until the desired balance of tanginess and sweetness is achieved.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-15"}, {"@type": "HowToStep", "text": "If the sauce is thicker than preferred, mix in a small amount of water until it reaches the desired dipping consistency.", "name": "If the sauce is thicker than preferred, mix in a small amount of water until it reaches the desired dipping consistency.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-16"}, {"@type": "HowToStep", "text": "Transfer the cooked sausage balls to a serving platter and offer the dipping sauce alongside them.", "name": "Transfer the cooked sausage balls to a serving platter and offer the dipping sauce alongside them.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-17"}, {"@type": "HowToStep", "text": "For children, serve the sausage balls whole only when developmentally appropriate, or cut them into halves or quarters to create smaller portions.", "name": "For children, serve the sausage balls whole only when developmentally appropriate, or cut them into halves or quarters to create smaller portions.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-18"}, {"@type": "HowToStep", "text": "Pair them with fresh, mild sides such as carrot coins or broccoli florets to complement the richer flavor of the pork and cheese.", "name": "Pair them with fresh, mild sides such as carrot coins or broccoli florets to complement the richer flavor of the pork and cheese.", "url": "https://erecip.github.io/en/toddler-sausage-balls/#wprm-recipe-42093-step-0-19"}], "recipeCategory": ["Appetizer", "Snack"], "recipeCuisine": ["American"], "keywords": "toddler sausage balls"}</script>
