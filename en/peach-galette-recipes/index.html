    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Peach Galette Recipes", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rustic Peach Galette featuring a crisp, buttery crust encasing luscious peaches infused with cinnamon and vanilla. Delightful when accompanied by a generous scoop of vanilla ice cream.", "datePublished": "2024-09-23T08:17:41+00:00", "image": ["https://erecip.github.io/en/peach-galette-recipes/Peach-Galette-Recipes1.png", "https://erecip.github.io/en/peach-galette-recipes/Peach-Galette-Recipes1.png", "https://erecip.github.io/en/peach-galette-recipes/Peach-Galette-Recipes1.png", "https://erecip.github.io/en/peach-galette-recipes/Peach-Galette-Recipes1.png"], "prepTime": "PT80M", "cookTime": "PT30M", "totalTime": "PT110M", "recipeIngredient": ["1 Tbsp coarse sugar", "1  egg (beaten for egg wash)", "1/2 tsp fine sea salt", "8 Tbsp unsalted butter (chilled and cubed)", "1 Tbsp granulated sugar", "6 Tbsp ice water (or as needed)", "1 1/3 cups all-purpose flour (spooned and leveled)", "1/2 Tbsp unsalted butter (diced into small pieces)", "1/2 tsp pure vanilla extract", "1/4 cup granulated sugar", "1 Tbsp all-purpose flour", "1 lb peaches (3–4 medium, sliced into 1/2\" wedges)", "1/2 tsp ground cinnamon"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the flour, granulated sugar, and fine sea salt in a food processor fitted with a blade attachment. Pulse briefly to blend. Add the cold butter, cut into 1/2-inch cubes, and pulse 8–10 times until the mixture resembles coarse crumbs with pea-sized butter pieces. Gradually drizzle in ice water, 1 tablespoon at a time, pulsing after each addition until the dough just starts to come together.", "name": "Combine the flour, granulated sugar, and fine sea salt in a food processor fitted with a blade attachment. Pulse briefly to blend. Add the cold butter, cut into 1/2-inch cubes, and pulse 8–10 times until the mixture resembles coarse crumbs with pea-sized butter pieces. Gradually drizzle in ice water, 1 tablespoon at a time, pulsing after each addition until the dough just starts to come together.", "url": "https://erecip.github.io/en/peach-galette-recipes/#wprm-recipe-14479-step-0-0"}, {"@type": "HowToStep", "text": "Shape the dough gently into a disk, lightly flour all sides, wrap it in plastic wrap, and refrigerate for at least 1 hour or up to 3 days.", "name": "Shape the dough gently into a disk, lightly flour all sides, wrap it in plastic wrap, and refrigerate for at least 1 hour or up to 3 days.", "url": "https://erecip.github.io/en/peach-galette-recipes/#wprm-recipe-14479-step-0-1"}, {"@type": "HowToStep", "text": "Preheat the oven to 425°F. Roll the chilled dough on a floured piece of parchment paper into a rough 12-inch circle. Transfer the parchment with the dough to a rimmed baking sheet and refrigerate while preparing the peaches.", "name": "Preheat the oven to 425°F. Roll the chilled dough on a floured piece of parchment paper into a rough 12-inch circle. Transfer the parchment with the dough to a rimmed baking sheet and refrigerate while preparing the peaches.", "url": "https://erecip.github.io/en/peach-galette-recipes/#wprm-recipe-14479-step-0-2"}, {"@type": "HowToStep", "text": "In a small bowl, blend together the granulated sugar, all-purpose flour, and ground cinnamon. Place the sliced peaches in a separate bowl, sprinkle with the sugar-flour mixture, drizzle in the vanilla extract, and fold gently with a spatula until evenly coated.", "name": "In a small bowl, blend together the granulated sugar, all-purpose flour, and ground cinnamon. Place the sliced peaches in a separate bowl, sprinkle with the sugar-flour mixture, drizzle in the vanilla extract, and fold gently with a spatula until evenly coated.", "url": "https://erecip.github.io/en/peach-galette-recipes/#wprm-recipe-14479-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the peaches in overlapping concentric circles on the dough, leaving a 2-inch border around the edges. Discard any excess liquid to prevent overflow. Scatter the diced butter pieces over the peaches.", "name": "Arrange the peaches in overlapping concentric circles on the dough, leaving a 2-inch border around the edges. Discard any excess liquid to prevent overflow. Scatter the diced butter pieces over the peaches.", "url": "https://erecip.github.io/en/peach-galette-recipes/#wprm-recipe-14479-step-0-4"}, {"@type": "HowToStep", "text": "Fold the dough edges inward over the fruit, pleating and pressing gently to seal any cracks. Brush the folded crust with beaten egg and sprinkle with coarse sugar for added crunch.", "name": "Fold the dough edges inward over the fruit, pleating and pressing gently to seal any cracks. Brush the folded crust with beaten egg and sprinkle with coarse sugar for added crunch.", "url": "https://erecip.github.io/en/peach-galette-recipes/#wprm-recipe-14479-step-0-5"}, {"@type": "HowToStep", "text": "Bake for 25–30 minutes, or until the crust turns golden and the peach filling bubbles thickly. Allow the galette to rest for about 15 minutes before slicing and serving.", "name": "Bake for 25–30 minutes, or until the crust turns golden and the peach filling bubbles thickly. Allow the galette to rest for about 15 minutes before slicing and serving.", "url": "https://erecip.github.io/en/peach-galette-recipes/#wprm-recipe-14479-step-0-6"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Peach Galette Recipes"}</script>
