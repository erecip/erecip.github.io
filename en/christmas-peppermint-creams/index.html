    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Peppermint Creams", "author": {"@type": "Person", "name": "BenDes"}, "description": "Christmas Peppermint Creams are delicate, festive confections made from a firm peppermint sugar paste and finished with a decorative drizzle of dark chocolate. Their cool mint flavor and smooth texture make them a classic holiday sweet suitable for serving, gifting, or preparing ahead.", "datePublished": "2018-02-15T07:31:04+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/Christmas-Peppermint-Creams-Candy1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/Christmas-Peppermint-Creams-Candy1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/Christmas-Peppermint-Creams-Candy1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/Christmas-Peppermint-Creams-Candy1.png"], "prepTime": "PT25M", "totalTime": "PT35M", "recipeIngredient": ["3.5 oz dark chocolate pieces (preferably a 70% cacao variety such as Ghirardelli)", "14 oz powdered sugar (sifted to create a fine, lump-free texture)", "1 to 2 tsp peppermint extract (adjusted to taste)", "1 tbsp full-fat condensed milk for a richer cream base", "2 tbsp water (plus additional small amounts if needed)", "Extra powdered sugar (for dusting the work surface, rolling pin, and cutter)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the sifted powdered sugar, condensed milk, peppermint extract, and 2 tablespoons of water into a large mixing bowl.", "name": "Place the sifted powdered sugar, condensed milk, peppermint extract, and 2 tablespoons of water into a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-0"}, {"@type": "HowToStep", "text": "Stir the mixture thoroughly until it comes together as a firm, stiff paste.", "name": "Stir the mixture thoroughly until it comes together as a firm, stiff paste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-1"}, {"@type": "HowToStep", "text": "If the paste appears overly dry or crumbly, incorporate more water 1 teaspoon at a time until the mixture holds together.", "name": "If the paste appears overly dry or crumbly, incorporate more water 1 teaspoon at a time until the mixture holds together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-2"}, {"@type": "HowToStep", "text": "If the mixture becomes too loose, blend in a little more powdered sugar until a firm working consistency is restored.", "name": "If the mixture becomes too loose, blend in a little more powdered sugar until a firm working consistency is restored.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-3"}, {"@type": "HowToStep", "text": "Lightly coat a clean work surface and rolling pin with powdered sugar to keep the paste from sticking.", "name": "Lightly coat a clean work surface and rolling pin with powdered sugar to keep the paste from sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-4"}, {"@type": "HowToStep", "text": "Roll the peppermint mixture out evenly to approximately 0.5 cm, or about 1/4 inch, in thickness.", "name": "Roll the peppermint mixture out evenly to approximately 0.5 cm, or about 1/4 inch, in thickness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-5"}, {"@type": "HowToStep", "text": "Dust a 4 cm, or roughly 1.5 inch, round cutter with powdered sugar, then press out 24 circles from the rolled peppermint paste.", "name": "Dust a 4 cm, or roughly 1.5 inch, round cutter with powdered sugar, then press out 24 circles from the rolled peppermint paste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-6"}, {"@type": "HowToStep", "text": "Arrange the rounds on a tray lined with parchment paper and leave them to dry slightly before adding the chocolate decoration.", "name": "Arrange the rounds on a tray lined with parchment paper and leave them to dry slightly before adding the chocolate decoration.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-7"}, {"@type": "HowToStep", "text": "Place the dark chocolate in a heatproof bowl set over a pan of barely simmering water.", "name": "Place the dark chocolate in a heatproof bowl set over a pan of barely simmering water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-8"}, {"@type": "HowToStep", "text": "Allow the chocolate to melt gently, stirring from time to time, until smooth and glossy.", "name": "Allow the chocolate to melt gently, stirring from time to time, until smooth and glossy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-9"}, {"@type": "HowToStep", "text": "Remove the bowl from the heat once the chocolate has melted, then let it cool slightly.", "name": "Remove the bowl from the heat once the chocolate has melted, then let it cool slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-10"}, {"@type": "HowToStep", "text": "Transfer the melted chocolate into a piping bag fitted with a small plain nozzle.", "name": "Transfer the melted chocolate into a piping bag fitted with a small plain nozzle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-11"}, {"@type": "HowToStep", "text": "Pipe the chocolate over the peppermint rounds in a zig-zag design, decorating each piece evenly.", "name": "Pipe the chocolate over the peppermint rounds in a zig-zag design, decorating each piece evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-12"}, {"@type": "HowToStep", "text": "Move the decorated peppermint creams to the refrigerator for about 10 minutes, or until the chocolate has fully set.", "name": "Move the decorated peppermint creams to the refrigerator for about 10 minutes, or until the chocolate has fully set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-13"}, {"@type": "HowToStep", "text": "Serve once set, or store the peppermint creams for later enjoyment.", "name": "Serve once set, or store the peppermint creams for later enjoyment.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-creams/#wprm-recipe-38813-step-0-14"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["British"], "keywords": "Christmas Peppermint Creams"}</script>
