    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Salad Sandwich Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A timeless rendition of the beloved chicken salad sandwich, this recipe offers tender, flavorful chicken enveloped in a creamy, herb-laced dressing, ideal for a satisfying lunch or light dinner.", "datePublished": "2024-08-07T05:44:18+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-salad-sandwich-recipe/Chicken-Salad-Sandwich-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-salad-sandwich-recipe/Chicken-Salad-Sandwich-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-salad-sandwich-recipe/Chicken-Salad-Sandwich-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-salad-sandwich-recipe/Chicken-Salad-Sandwich-Recipe.png"], "prepTime": "PT15M", "cookTime": "PT60M", "totalTime": "PT90M", "recipeIngredient": ["1/2 cup finely diced celery (from 1 to 2 stalks)", "1 tablespoon minced chives", "1 tablespoon Dijon mustard (plus additional to taste)", "1/4 cup mayonnaise (preferably homemade, plus more to taste)", "1/2 cup finely diced red onion (about 1/2 medium onion)", "1 tablespoon minced flat-leaf parsley leaves and tender stems", "2  whole lemons", "1  medium clove garlic (minced (approximately 1 teaspoon))", "1 tablespoon minced fresh tarragon leaves (plus 4 whole sprigs, divided)", "1 3/4 pounds 800 g whole bone-in, skin-on split chicken breast halves (2 to 3 halves)", "Kosher salt and freshly ground black pepper"], "recipeInstructions": [{"@type": "HowToStep", "text": "If using sous-vide: Generously season the chicken with salt and pepper. Thinly slice one lemon and arrange with whole tarragon sprigs alongside the chicken in zipper-lock or vacuum-seal bags. For zipper bags, expel the air using the water displacement method by sealing most of the bag, submerging it slowly into water, and sealing just before it fully submerges. For vacuum bags, seal as per the manufacturer’s guidance.", "name": "If using sous-vide: Generously season the chicken with salt and pepper. Thinly slice one lemon and arrange with whole tarragon sprigs alongside the chicken in zipper-lock or vacuum-seal bags. For zipper bags, expel the air using the water displacement method by sealing most of the bag, submerging it slowly into water, and sealing just before it fully submerges. For vacuum bags, seal as per the manufacturer’s guidance.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-salad-sandwich-recipe/#wprm-recipe-51007-step-0-0"}, {"@type": "HowToStep", "text": "Preheat the sous-vide immersion circulator to 155°F (68°C). Submerge the sealed bags in the water bath and cook for a minimum of 1 hour and up to 4 hours. Once done, immediately transfer the chicken to an ice bath for 15 minutes to cool thoroughly.", "name": "Preheat the sous-vide immersion circulator to 155°F (68°C). Submerge the sealed bags in the water bath and cook for a minimum of 1 hour and up to 4 hours. Once done, immediately transfer the chicken to an ice bath for 15 minutes to cool thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-salad-sandwich-recipe/#wprm-recipe-51007-step-0-1"}, {"@type": "HowToStep", "text": "While the chicken chills, extract 1 tablespoon of juice and 1 teaspoon of zest from the second lemon and combine in a large mixing bowl. Incorporate mayonnaise, mustard, minced tarragon, parsley, chives, red onion, celery, and garlic, mixing thoroughly with a rubber spatula. Taste and adjust with additional lemon juice if needed. Keep this mixture chilled until use.", "name": "While the chicken chills, extract 1 tablespoon of juice and 1 teaspoon of zest from the second lemon and combine in a large mixing bowl. Incorporate mayonnaise, mustard, minced tarragon, parsley, chives, red onion, celery, and garlic, mixing thoroughly with a rubber spatula. Taste and adjust with additional lemon juice if needed. Keep this mixture chilled until use.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-salad-sandwich-recipe/#wprm-recipe-51007-step-0-2"}, {"@type": "HowToStep", "text": "Remove chicken from the bags, discarding the tarragon stems and lemon slices. Separate and discard the skin and bones. Dice the meat into 1/2-inch cubes and fold gently into the mayonnaise mixture until evenly combined. Taste and adjust seasoning with salt, pepper, and, if desired, additional mayonnaise, mustard, or lemon juice. Serve on a bed of lettuce or within a sandwich roll.", "name": "Remove chicken from the bags, discarding the tarragon stems and lemon slices. Separate and discard the skin and bones. Dice the meat into 1/2-inch cubes and fold gently into the mayonnaise mixture until evenly combined. Taste and adjust seasoning with salt, pepper, and, if desired, additional mayonnaise, mustard, or lemon juice. Serve on a bed of lettuce or within a sandwich roll.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-salad-sandwich-recipe/#wprm-recipe-51007-step-0-3"}], "recipeCategory": ["Sandwich"], "recipeCuisine": ["American"], "keywords": "Chicken Salad Sandwich Recipe"}</script>
