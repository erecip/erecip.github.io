es323/en/carbonara-pasta/#wprm-recipe-32928-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, combine the whole eggs and additional yolks. Whisk until fully blended, then incorporate the finely shredded cheese and ground black pepper. Set this mixture aside.", "name": "In a large mixing bowl, combine the whole eggs and additional yolks. Whisk until fully blended, then incorporate the finely shredded cheese and ground black pepper. Set this mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara-pasta/#wprm-recipe-32928-step-0-1"}, {"@type": "HowToStep", "text": "In a large pot, bring approximately 4 liters (4 quarts) of water to a rolling boil. Season generously with the coarse salt. Add the spaghetti and cook according to the package instructions until al dente.", "name": "In a large pot, bring approximately 4 liters (4 quarts) of water to a rolling boil. Season generously with the coarse salt. Add the spaghetti and cook according to the package instructions until al dente.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara-pasta/#wprm-recipe-32928-step-0-2"}, {"@type": "HowToStep", "text": "Before draining the pasta, reserve approximately 1 cup of the starchy cooking water. Drain the pasta promptly.", "name": "Before draining the pasta, reserve approximately 1 cup of the starchy cooking water. Drain the pasta promptly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/carbonara-pasta/#wprm-recipe-32928-step-0-3"}, {"@type": "HowToStep", "text": "While the pasta cooks, heat a non-stick skillet over medium-high heat. Add the guanciale and cook for 4–5 minutes until golden and crisp, allowing the rendered fat to accumulate in the pan. If using garlic, stir it in during the final minute of cooking.", "name": "While the pasta cooks, heat a non-stick skillet over medium-high heat. Add the guanciale and cook for 4–5 minutes until golden and crisp, allowing the rendered fat to accumulate
