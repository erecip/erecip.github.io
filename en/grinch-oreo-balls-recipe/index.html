    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Grinch Oreo Balls Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "These whimsical Grinch Oreo Balls combine the richness of cream cheese and Red Velvet Oreo cookies, enveloped in a festive green candy coating with a bright red candy heart on top. Ideal for holiday gatherings, these treats add a playful touch to your dessert table.", "datePublished": "2024-05-29T00:18:08+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Grinch-Oreo-Balls-RECIPE-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Grinch-Oreo-Balls-RECIPE-1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Grinch-Oreo-Balls-RECIPE-1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Grinch-Oreo-Balls-RECIPE-1-480x270.jpg"], "recipeYield": ["24", "24 Oreo balls"], "prepTime": "PT60M", "totalTime": "PT180M", "recipeIngredient": ["24.4 ounces Red Velvet Oreos (two 12.2-ounce packages, 44 cookies)", "8 ounces cream cheese (softened to room temperature)", "15 ounces light green candy melts", "Red candy hearts (for decoration)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare a large baking sheet by lining it with parchment paper.", "name": "Prepare a large baking sheet by lining it with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grinch-oreo-balls-recipe/#wprm-recipe-5408-step-0-0"}, {"@type": "HowToStep", "text": "In a food processor, blend the Oreo cookies into fine crumbs. Alternatively, place them in a plastic bag and crush them with a rolling pin until they form a crumbly texture.", "name": "In a food processor, blend the Oreo cookies into fine crumbs. Alternatively, place them in a plastic bag and crush them with a rolling pin until they form a crumbly texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grinch-oreo-balls-recipe/#wprm-recipe-5408-step-0-1"}, {"@type": "HowToStep", "text": "In a large bowl, use an electric hand mixer to blend the softened cream cheese until smooth. Add the Oreo crumbs to the cream cheese, mixing until well combined.", "name": "In a large bowl, use an electric hand mixer to blend the softened cream cheese until smooth. Add the Oreo crumbs to the cream cheese, mixing until well combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grinch-oreo-balls-recipe/#wprm-recipe-5408-step-0-2"}, {"@type": "HowToStep", "text": "Using a 1.5-inch cookie scoop, portion the mixture and roll each portion into a smooth ball between your hands. Place each ball on the prepared baking sheet. Refrigerate for at least 2 hours to help the balls hold their shape before dipping.", "name": "Using a 1.5-inch cookie scoop, portion the mixture and roll each portion into a smooth ball between your hands. Place each ball on the prepared baking sheet. Refrigerate for at least 2 hours to help the balls hold their shape before dipping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grinch-oreo-balls-recipe/#wprm-recipe-5408-step-0-3"}, {"@type": "HowToStep", "text": "Set aside ½ cup of the candy melts if you'd like to add a decorative drizzle later.", "name": "Set aside ½ cup of the candy melts if you'd like to add a decorative drizzle later.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grinch-oreo-balls-recipe/#wprm-recipe-5408-step-0-4"}, {"@type": "HowToStep", "text": "In a double boiler over low heat, melt the remaining green candy melts, stirring regularly until smooth. Avoid overheating or introducing water into the candy, as it can cause it to seize.", "name": "In a double boiler over low heat, melt the remaining green candy melts, stirring regularly until smooth. Avoid overheating or introducing water into the candy, as it can cause it to seize.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grinch-oreo-balls-recipe/#wprm-recipe-5408-step-0-5"}, {"@type": "HowToStep", "text": "Dip each chilled ball into the melted candy using a fork or toothpick. Gently tap the fork on the edge of the bowl to remove any excess candy, then place each coated ball back on the parchment-lined baking sheet.", "name": "Dip each chilled ball into the melted candy using a fork or toothpick. Gently tap the fork on the edge of the bowl to remove any excess candy, then place each coated ball back on the parchment-lined baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grinch-oreo-balls-recipe/#wprm-recipe-5408-step-0-6"}, {"@type": "HowToStep", "text": "If adding a drizzle, melt the reserved ½ cup of candy melts in a microwave-safe piping bag. Microwave on a low setting (such as the defrost setting) for 30-second intervals, kneading the bag between each interval until fully melted. Cut a small tip off the piping bag and drizzle over the coated balls.", "name": "If adding a drizzle, melt the reserved ½ cup of candy melts in a microwave-safe piping bag. Microwave on a low setting (such as the defrost setting) for 30-second intervals, kneading the bag between each interval until fully melted. Cut a small tip off the piping bag and drizzle over the coated balls.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grinch-oreo-balls-recipe/#wprm-recipe-5408-step-0-7"}, {"@type": "HowToStep", "text": "While the drizzle is still wet, top each Oreo ball with a red candy heart. Return the balls to the refrigerator until the candy coating has completely set.", "name": "While the drizzle is still wet, top each Oreo ball with a red candy heart. Return the balls to the refrigerator until the candy coating has completely set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/grinch-oreo-balls-recipe/#wprm-recipe-5408-step-0-8"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Grinch Oreo Balls Recipe"}</script>
