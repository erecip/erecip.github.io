    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Tomato Soup and Rice", "author": {"@type": "Person", "name": "BenDes"}, "description": "A comforting tomato-based soup with tender basmati rice, aromatic garlic, green onions, and dried basil. Tomato paste deepens the savory flavor, while a small amount of sugar balances the natural acidity of the tomatoes.", "datePublished": "2023-04-07T11:35:23+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/tomato-soup-and-rice.png", "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/tomato-soup-and-rice.png", "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/tomato-soup-and-rice.png", "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/tomato-soup-and-rice.png"], "totalTime": "PT30M", "recipeIngredient": ["1 cup basmati rice (rinsed)", "1 tablespoon dried basil (preferably McCormick)", "4½ cups low-sodium broth (plus additional broth if required)", "2  –3 tablespoons freshly minced garlic", "1 teaspoon kosher salt (with extra as needed)", "½ tablespoon granulated sugar", "2  –3 stalks green onion (finely chopped)", "1½ tablespoons olive oil", "1 teaspoon garlic powder", "One 28-ounce can diced tomatoes with their juices (such as Muir Glen)", "2 tablespoons tomato paste", "Freshly cracked black pepper (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm the olive oil in a Dutch oven or other large, heavy-bottomed pot over medium heat. Add the finely chopped green onions and cook for approximately 1 minute.", "name": "Warm the olive oil in a Dutch oven or other large, heavy-bottomed pot over medium heat. Add the finely chopped green onions and cook for approximately 1 minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/#wprm-recipe-44792-step-0-0"}, {"@type": "HowToStep", "text": "Stir in the freshly minced garlic and continue sautéing for another minute. Add the kosher salt, garlic powder, and dried basil, stirring thoroughly until the seasonings are evenly distributed and aromatic.", "name": "Stir in the freshly minced garlic and continue sautéing for another minute. Add the kosher salt, garlic powder, and dried basil, stirring thoroughly until the seasonings are evenly distributed and aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/#wprm-recipe-44792-step-0-1"}, {"@type": "HowToStep", "text": "Add the rinsed basmati rice to the pot. Cook for about 1 minute while stirring so the rice becomes evenly coated with the seasoned mixture. If ingredients begin to adhere to the bottom, loosen them with a small splash of broth.", "name": "Add the rinsed basmati rice to the pot. Cook for about 1 minute while stirring so the rice becomes evenly coated with the seasoned mixture. If ingredients begin to adhere to the bottom, loosen them with a small splash of broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/#wprm-recipe-44792-step-0-2"}, {"@type": "HowToStep", "text": "Mix in the tomato paste and sugar. Continue cooking for approximately 1 minute, stirring until both ingredients are fully incorporated.", "name": "Mix in the tomato paste and sugar. Continue cooking for approximately 1 minute, stirring until both ingredients are fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/#wprm-recipe-44792-step-0-3"}, {"@type": "HowToStep", "text": "Pour the diced tomatoes, including all of their liquid, into the pot, followed by the low-sodium broth. Stir thoroughly and bring the soup to a gentle simmer, periodically scraping the bottom of the pot to prevent sticking.", "name": "Pour the diced tomatoes, including all of their liquid, into the pot, followed by the low-sodium broth. Stir thoroughly and bring the soup to a gentle simmer, periodically scraping the bottom of the pot to prevent sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/#wprm-recipe-44792-step-0-4"}, {"@type": "HowToStep", "text": "Once simmering, cover the pot with a lid and cook for 15–20 minutes. Stir from time to time until the basmati rice is completely cooked and tender.", "name": "Once simmering, cover the pot with a lid and cook for 15–20 minutes. Stir from time to time until the basmati rice is completely cooked and tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/#wprm-recipe-44792-step-0-5"}, {"@type": "HowToStep", "text": "Check the soup during cooking and add a little additional broth if necessary to maintain the preferred consistency.", "name": "Check the soup during cooking and add a little additional broth if necessary to maintain the preferred consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/#wprm-recipe-44792-step-0-6"}, {"@type": "HowToStep", "text": "Taste before serving and adjust with additional kosher salt and freshly cracked black pepper as desired. Ladle the hot tomato and rice soup into bowls and serve immediately.", "name": "Taste before serving and adjust with additional kosher salt and freshly cracked black pepper as desired. Ladle the hot tomato and rice soup into bowls and serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-and-rice/#wprm-recipe-44792-step-0-7"}], "recipeCategory": ["Soup"], "keywords": "Tomato Soup and Rice"}</script>
