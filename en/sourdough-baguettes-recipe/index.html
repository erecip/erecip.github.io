    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sourdough Baguette Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Delight in the artisanal charm of these sourdough baguettes, which feature an airy, chewy interior enclosed within a shatteringly crisp crust. Ideal for novice and seasoned bakers alike, this recipe promises approachable steps with professional results.", "datePublished": "2024-10-11T18:26:14+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/10/sourdough-baguettes-recipe3.webp", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/10/sourdough-baguettes-recipe3-500x500.webp", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/10/sourdough-baguettes-recipe3-500x375.webp", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/10/sourdough-baguettes-recipe3-480x270.webp"], "recipeYield": ["4", "4 baguettes"], "prepTime": "PT15M", "cookTime": "PT30M", "totalTime": "PT960M", "recipeIngredient": ["15 g 3 tsp fine sea salt", "100 g 0.4 cups mature, active sourdough starter", "450 g 3.6 cups white bread flour", "280 g 1.1 cups water, divided", "80 g 0.5 cups semolina", "80 g 0.5 cups white bread flour or rice flour"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine 250 g of the water with the sourdough starter in a large mixing bowl and stir thoroughly. Incorporate the flour, mixing until no dry bits remain. Cover the bowl and let it rest for one hour. Meanwhile, dissolve the salt in the remaining 30 g of water.", "name": "Combine 250 g of the water with the sourdough starter in a large mixing bowl and stir thoroughly. Incorporate the flour, mixing until no dry bits remain. Cover the bowl and let it rest for one hour. Meanwhile, dissolve the salt in the remaining 30 g of water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-baguettes-recipe/#wprm-recipe-25778-step-0-0"}, {"@type": "HowToStep", "text": "Introduce the salted water to the dough and knead gently until the mixture becomes smooth and elastic. Perform a stretch and fold by lifting one edge of the dough and folding it over itself, rotating the bowl as you continue around. After this process, shape the dough into a ball and transfer it to a lightly greased bowl, covering with a damp cloth. Let it rest for another hour.", "name": "Introduce the salted water to the dough and knead gently until the mixture becomes smooth and elastic. Perform a stretch and fold by lifting one edge of the dough and folding it over itself, rotating the bowl as you continue around. After this process, shape the dough into a ball and transfer it to a lightly greased bowl, covering with a damp cloth. Let it rest for another hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-baguettes-recipe/#wprm-recipe-25778-step-0-1"}, {"@type": "HowToStep", "text": "Repeat the stretch-and-fold process two additional times, each followed by a one-hour rest. Following the third set, allow the dough to undergo bulk fermentation for two hours, remaining covered throughout.", "name": "Repeat the stretch-and-fold process two additional times, each followed by a one-hour rest. Following the third set, allow the dough to undergo bulk fermentation for two hours, remaining covered throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-baguettes-recipe/#wprm-recipe-25778-step-0-2"}, {"@type": "HowToStep", "text": "Turn the dough out onto a lightly floured surface and divide into four portions for smaller baguettes or two if you prefer longer loaves. Lightly flatten each piece, expelling excess air, and shape into rectangles. Fold the top edge down, applying downward tension with your thumbs. Continue rolling to form a tight cylinder. Seal the seam by pressing with your palm and pinching with your fingers. Roll the dough from the center outward to taper the ends.", "name": "Turn the dough out onto a lightly floured surface and divide into four portions for smaller baguettes or two if you prefer longer loaves. Lightly flatten each piece, expelling excess air, and shape into rectangles. Fold the top edge down, applying downward tension with your thumbs. Continue rolling to form a tight cylinder. Seal the seam by pressing with your palm and pinching with your fingers. Roll the dough from the center outward to taper the ends.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-baguettes-recipe/#wprm-recipe-25778-step-0-3"}, {"@type": "HowToStep", "text": "Prepare a baking sheet with a couche or thick linen cloth floured generously with a blend of semolina and bread or rice flour. Nestle the baguettes seam-side up between the folds. Sprinkle with additional flour mixture and cover with plastic wrap or an inverted tray. Refrigerate to proof for at least 18 hours and up to 36.", "name": "Prepare a baking sheet with a couche or thick linen cloth floured generously with a blend of semolina and bread or rice flour. Nestle the baguettes seam-side up between the folds. Sprinkle with additional flour mixture and cover with plastic wrap or an inverted tray. Refrigerate to proof for at least 18 hours and up to 36.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-baguettes-recipe/#wprm-recipe-25778-step-0-4"}, {"@type": "HowToStep", "text": "If necessary, allow baguettes to come to room temperature to finish proofing. Preheat the oven to 250°C (480°F), placing a container of boiling water at the base to generate steam. Heat a baking stone or tray in the oven. Dust the hot surface with semolina. Invert the baguettes seam-side down onto it. Score each with a blade at a 30–45° angle to a depth of about 1.5 cm.", "name": "If necessary, allow baguettes to come to room temperature to finish proofing. Preheat the oven to 250°C (480°F), placing a container of boiling water at the base to generate steam. Heat a baking stone or tray in the oven. Dust the hot surface with semolina. Invert the baguettes seam-side down onto it. Score each with a blade at a 30–45° angle to a depth of about 1.5 cm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-baguettes-recipe/#wprm-recipe-25778-step-0-5"}, {"@type": "HowToStep", "text": "Bake for 30 minutes, rotating the tray and reducing the heat to 220°C (428°F) at the 15-minute mark. Once golden and crusty, remove the loaves and cool before slicing. Serve warm with butter or your preferred accompaniment.", "name": "Bake for 30 minutes, rotating the tray and reducing the heat to 220°C (428°F) at the 15-minute mark. Once golden and crusty, remove the loaves and cool before slicing. Serve warm with butter or your preferred accompaniment.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-baguettes-recipe/#wprm-recipe-25778-step-0-6"}], "recipeCategory": ["Bread"], "recipeCuisine": ["French"], "keywords": "sourdough baguettes recipe"}</script>
