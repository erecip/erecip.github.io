    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Beef Lo Mein Stir Fry", "author": {"@type": "Person", "name": "BenDes"}, "description": "A savory beef lo mein stir-fry featuring tender strips of seared beef, cooked noodles, crisp-tender broccoli, carrots, onion, and garlic. A brown sugar and soy sauce mixture enriched with beef bouillon coats the ingredients, while sesame oil provides the characteristic toasted aroma associated with lo mein.", "datePublished": "2021-07-24T18:23:46+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/beef-lo-mein-stir-fry.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/beef-lo-mein-stir-fry.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/beef-lo-mein-stir-fry.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/beef-lo-mein-stir-fry.png"], "cookTime": "PT15M", "totalTime": "PT15M", "recipeIngredient": ["2 cups broccoli florets (divided into roughly 1-inch pieces)", "4  garlic cloves (finely minced)", "8 oz cooked lo mein noodles", "1  large onion (diced into approximately 1/2-inch pieces)", "1 lb beef (thinly sliced across the grain)", "2  large carrots (sliced into 1/4-inch-thick matchsticks)", "Sesame oil (as needed for stir-frying)", "2 tbsp brown sugar", "1/4 cup boiling water", "3 tbsp soy sauce", "1 tsp sesame oil", "1 tbsp beef bouillon (such as Better Than Bouillon)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Pour the boiling water into a small bowl and add the beef bouillon. Stir thoroughly until the bouillon has completely dissolved.", "name": "Pour the boiling water into a small bowl and add the beef bouillon. Stir thoroughly until the bouillon has completely dissolved.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-0"}, {"@type": "HowToStep", "text": "Add the soy sauce and brown sugar. Continue stirring until the sugar is fully incorporated, then place the prepared sauce aside.", "name": "Add the soy sauce and brown sugar. Continue stirring until the sugar is fully incorporated, then place the prepared sauce aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-1"}, {"@type": "HowToStep", "text": "Slice the beef thinly against the grain. Cut the carrots into 1/4-inch matchsticks, divide the broccoli into approximately 1-inch florets, dice the onion into 1/2-inch pieces, and finely mince the garlic. Keep all ingredients nearby before beginning the stir-fry, since the cooking process proceeds rapidly.", "name": "Slice the beef thinly against the grain. Cut the carrots into 1/4-inch matchsticks, divide the broccoli into approximately 1-inch florets, dice the onion into 1/2-inch pieces, and finely mince the garlic. Keep all ingredients nearby before beginning the stir-fry, since the cooking process proceeds rapidly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-2"}, {"@type": "HowToStep", "text": "Place a large skillet or wok over high heat and allow it to become very hot, nearly to the smoking point.", "name": "Place a large skillet or wok over high heat and allow it to become very hot, nearly to the smoking point.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-3"}, {"@type": "HowToStep", "text": "Add 2 tablespoons of sesame oil and heat it for approximately 30 seconds, or until the oil begins to shimmer.", "name": "Add 2 tablespoons of sesame oil and heat it for approximately 30 seconds, or until the oil begins to shimmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-4"}, {"@type": "HowToStep", "text": "Add the thinly sliced beef, working in batches when necessary to prevent overcrowding. Cook for 2–3 minutes, stirring intermittently, until the meat develops browned edges. Allowing the beef to remain undisturbed briefly between turns encourages browning rather than steaming.", "name": "Add the thinly sliced beef, working in batches when necessary to prevent overcrowding. Cook for 2–3 minutes, stirring intermittently, until the meat develops browned edges. Allowing the beef to remain undisturbed briefly between turns encourages browning rather than steaming.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the browned beef to a clean plate and reserve it for later.", "name": "Transfer the browned beef to a clean plate and reserve it for later.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-6"}, {"@type": "HowToStep", "text": "Pour an additional tablespoon of sesame oil into the same hot skillet.", "name": "Pour an additional tablespoon of sesame oil into the same hot skillet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-7"}, {"@type": "HowToStep", "text": "Add the diced onion and cook for 2–3 minutes, stirring frequently, until it becomes translucent and lightly golden.", "name": "Add the diced onion and cook for 2–3 minutes, stirring frequently, until it becomes translucent and lightly golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-8"}, {"@type": "HowToStep", "text": "Add the carrot matchsticks and stir-fry for 3–4 minutes, or until they begin to soften.", "name": "Add the carrot matchsticks and stir-fry for 3–4 minutes, or until they begin to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-9"}, {"@type": "HowToStep", "text": "Add the broccoli florets and continue cooking for another 3 minutes.", "name": "Add the broccoli florets and continue cooking for another 3 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-10"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and cook for approximately 30 seconds, stirring continuously until fragrant. Keep this stage brief to prevent the garlic from scorching and developing a bitter flavor.", "name": "Stir in the minced garlic and cook for approximately 30 seconds, stirring continuously until fragrant. Keep this stage brief to prevent the garlic from scorching and developing a bitter flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-11"}, {"@type": "HowToStep", "text": "Return the cooked beef to the skillet with the onion and vegetables.", "name": "Return the cooked beef to the skillet with the onion and vegetables.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-12"}, {"@type": "HowToStep", "text": "Pour the prepared sauce over the mixture and gently stir until the beef and vegetables are evenly coated.", "name": "Pour the prepared sauce over the mixture and gently stir until the beef and vegetables are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-13"}, {"@type": "HowToStep", "text": "Allow everything to simmer together for approximately 2 minutes, giving the sauce time to coat the ingredients and the flavors time to combine.", "name": "Allow everything to simmer together for approximately 2 minutes, giving the sauce time to coat the ingredients and the flavors time to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-14"}, {"@type": "HowToStep", "text": "Add the cooked lo mein noodles to the skillet along with the remaining 1 teaspoon of sesame oil.", "name": "Add the cooked lo mein noodles to the skillet along with the remaining 1 teaspoon of sesame oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-15"}, {"@type": "HowToStep", "text": "Gently toss the mixture for 1–2 minutes, until the noodles are thoroughly heated and evenly covered with the sauce. Avoid excessive stirring so the noodles remain intact rather than becoming overly soft.", "name": "Gently toss the mixture for 1–2 minutes, until the noodles are thoroughly heated and evenly covered with the sauce. Avoid excessive stirring so the noodles remain intact rather than becoming overly soft.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-16"}, {"@type": "HowToStep", "text": "Transfer the finished beef lo mein stir-fry to serving bowls or plates while piping hot. Serve immediately while the noodles, beef, and vegetables are freshly heated.", "name": "Transfer the finished beef lo mein stir-fry to serving bowls or plates while piping hot. Serve immediately while the noodles, beef, and vegetables are freshly heated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-lo-mein-stir-fry/#wprm-recipe-42775-step-0-17"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Chinese"], "keywords": "Beef Lo Mein Stir Fry"}</script>
