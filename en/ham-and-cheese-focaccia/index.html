    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Ham and Cheese Focaccia", "author": {"@type": "Person", "name": "BenDes"}, "description": "A soft, golden focaccia topped with savory ham, melted mozzarella, and aromatic herb butter. The dough is allowed to rise twice, producing a light interior beneath a richly flavored, bubbling cheese topping.", "datePublished": "2021-10-25T06:58:00+00:00", "image": ["https://erecip.github.io/en/ham-and-cheese-focaccia/Ham-and-Cheese-Focaccia.png", "https://erecip.github.io/en/ham-and-cheese-focaccia/Ham-and-Cheese-Focaccia.png", "https://erecip.github.io/en/ham-and-cheese-focaccia/Ham-and-Cheese-Focaccia.png", "https://erecip.github.io/en/ham-and-cheese-focaccia/Ham-and-Cheese-Focaccia.png"], "prepTime": "PT20M", "cookTime": "PT20M", "totalTime": "PT90M", "recipeIngredient": ["1 cup plus 2 tablespoons water (warmed to approximately 105–115°F)", "4 tablespoons olive oil", "1 teaspoon fine sea salt", "4 cups wheat flour", "1  packet active dry or instant yeast", "3.5 ounces herb butter (softened to room temperature)", "2.5 ounces ham (finely chopped)", "5 ounces mozzarella cheese (shredded or diced)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Mix the dough. Place the wheat flour, yeast, and fine sea salt in a large mixing bowl and stir until evenly combined.", "name": "Mix the dough. Place the wheat flour, yeast, and fine sea salt in a large mixing bowl and stir until evenly combined.", "url": "https://erecip.github.io/en/ham-and-cheese-focaccia/#wprm-recipe-39406-step-0-0"}, {"@type": "HowToStep", "text": "Knead the mixture. Pour in the lukewarm water and olive oil. Knead thoroughly until the ingredients form a smooth, supple, and elastic dough.", "name": "Knead the mixture. Pour in the lukewarm water and olive oil. Knead thoroughly until the ingredients form a smooth, supple, and elastic dough.", "url": "https://erecip.github.io/en/ham-and-cheese-focaccia/#wprm-recipe-39406-step-0-1"}, {"@type": "HowToStep", "text": "Complete the first rise. Cover the bowl and leave the dough in a warm location for approximately 30 minutes, or until it has doubled in volume.", "name": "Complete the first rise. Cover the bowl and leave the dough in a warm location for approximately 30 minutes, or until it has doubled in volume.", "url": "https://erecip.github.io/en/ham-and-cheese-focaccia/#wprm-recipe-39406-step-0-2"}, {"@type": "HowToStep", "text": "Shape the focaccia. Briefly knead the risen dough to release excess air. Transfer it to a baking sheet lined with parchment paper, then roll or press it into a flat, round shape measuring approximately 28 cm, or 11 inches, across.", "name": "Shape the focaccia. Briefly knead the risen dough to release excess air. Transfer it to a baking sheet lined with parchment paper, then roll or press it into a flat, round shape measuring approximately 28 cm, or 11 inches, across.", "url": "https://erecip.github.io/en/ham-and-cheese-focaccia/#wprm-recipe-39406-step-0-3"}, {"@type": "HowToStep", "text": "Form the characteristic indentations. Lightly flour your fingertips and press them deeply across the entire surface of the dough to create evenly distributed hollows.", "name": "Form the characteristic indentations. Lightly flour your fingertips and press them deeply across the entire surface of the dough to create evenly distributed hollows.", "url": "https://erecip.github.io/en/ham-and-cheese-focaccia/#wprm-recipe-39406-step-0-4"}, {"@type": "HowToStep", "text": "Allow a second rise. Leave the shaped dough to rise for an additional 20 minutes.", "name": "Allow a second rise. Leave the shaped dough to rise for an additional 20 minutes.", "url": "https://erecip.github.io/en/ham-and-cheese-focaccia/#wprm-recipe-39406-step-0-5"}, {"@type": "HowToStep", "text": "Prepare the topping. While the dough completes its second rise, coarsely grate the mozzarella if it has not already been shredded.", "name": "Prepare the topping. While the dough completes its second rise, coarsely grate the mozzarella if it has not already been shredded.", "url": "https://erecip.github.io/en/ham-and-cheese-focaccia/#wprm-recipe-39406-step-0-6"}, {"@type": "HowToStep", "text": "Add the cheese, ham, and butter. Distribute the mozzarella evenly over the risen dough. Scatter the finely chopped ham across the cheese, then place small pieces of softened herb butter over the surface.", "name": "Add the cheese, ham, and butter. Distribute the mozzarella evenly over the risen dough. Scatter the finely chopped ham across the cheese, then place small pieces of softened herb butter over the surface.", "url": "https://erecip.github.io/en/ham-and-cheese-focaccia/#wprm-recipe-39406-step-0-7"}, {"@type": "HowToStep", "text": "Bake the focaccia. Preheat the oven to 437°F (225°C) using a conventional electric oven setting. Bake for approximately 20 minutes, or until the crust is golden and the cheese is melted and bubbling.", "name": "Bake the focaccia. Preheat the oven to 437°F (225°C) using a conventional electric oven setting. Bake for approximately 20 minutes, or until the crust is golden and the cheese is melted and bubbling.", "url": "https://erecip.github.io/en/ham-and-cheese-focaccia/#wprm-recipe-39406-step-0-8"}, {"@type": "HowToStep", "text": "Cool briefly before serving. Remove the focaccia from the oven and allow it to rest for several minutes before slicing.", "name": "Cool briefly before serving. Remove the focaccia from the oven and allow it to rest for several minutes before slicing.", "url": "https://erecip.github.io/en/ham-and-cheese-focaccia/#wprm-recipe-39406-step-0-9"}], "recipeCategory": ["Bread"], "recipeCuisine": ["Italian"], "keywords": "Ham and Cheese Focaccia"}</script>
