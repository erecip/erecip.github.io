    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Wonton Noodle Soup Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A comforting Chinese wonton noodle soup featuring plump shrimp and pork dumplings in a delicately flavored seafood broth, complete with instructions for folding traditional wontons.", "datePublished": "2024-11-04T15:08:04+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/wonton-noodle-soup-recipe/Wonton-Noodle-Soup-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/wonton-noodle-soup-recipe/Wonton-Noodle-Soup-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/wonton-noodle-soup-recipe/Wonton-Noodle-Soup-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/wonton-noodle-soup-recipe/Wonton-Noodle-Soup-Recipe1.png"], "recipeYield": ["3", "3 bowls"], "prepTime": "PT35M", "cookTime": "PT10M", "totalTime": "PT45M", "recipeIngredient": ["1  package wonton wrappers", "2  stalks green onions (finely chopped (approx. ¼ cup))", "1 teaspoon shaoxing cooking wine", "½ teaspoon corn starch", "3 teaspoons oyster sauce", "1 teaspoon fish sauce (or 1½ teaspoons soy sauce)", "200 g shrimp (21/25 size, about 10 pieces)", "½ teaspoon sesame oil", "¼ teaspoon white pepper (optional)", "100 g ground pork (approx. ½ cup)", "1 liter chicken broth (low or no sodium)", "1 slice ginger", "½ teaspoon white pepper (optional)", "½ tablespoon soy sauce", "2 cloves garlic (smashed)", "1 tablespoon fish sauce", "Shrimp skins (from peeled shrimp)", "1½ teaspoons sesame oil (to finish)", "Fried garlic", "Green onions (finely chopped)", "Crispy fried onions", "Garlic chili oil", "Yellow chives"], "recipeInstructions": [{"@type": "HowToStep", "text": "If using frozen shrimp, submerge in a bowl of cold water for 10–15 minutes to thaw. Peel the shrimp, reserving the shells for the broth. Trim and finely chop the green onions, setting aside a tablespoon of the green parts for garnish.", "name": "If using frozen shrimp, submerge in a bowl of cold water for 10–15 minutes to thaw. Peel the shrimp, reserving the shells for the broth. Trim and finely chop the green onions, setting aside a tablespoon of the green parts for garnish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/wonton-noodle-soup-recipe/#wprm-recipe-15926-step-0-0"}, {"@type": "HowToStep", "text": "For the broth, add the ginger slice to a large pot, smash the garlic cloves lightly and add them along with the shrimp shells, chicken broth, fish sauce, soy sauce, and white pepper. Cover with a lid and let it gently simmer on medium-low for 30–60 minutes. Reserve the sesame oil to stir in at the end.", "name": "For the broth, add the ginger slice to a large pot, smash the garlic cloves lightly and add them along with the shrimp shells, chicken broth, fish sauce, soy sauce, and white pepper. Cover with a lid and let it gently simmer on medium-low for 30–60 minutes. Reserve the sesame oil to stir in at the end.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/wonton-noodle-soup-recipe/#wprm-recipe-15926-step-0-1"}, {"@type": "HowToStep", "text": "For the filling, combine ground pork, corn starch, fish sauce, oyster sauce, shaoxing wine, sesame oil, and white pepper in a large bowl. Stir vigorously in one direction for 10 minutes until the mixture becomes sticky and cohesive—use a stand mixer if preferred. Chop the peeled shrimp to desired size—chunkier pieces offer a more satisfying bite—and blend thoroughly with the pork mixture for 5 minutes. Fold in the green onions and mix for another minute. Test for seasoning by cooking a small spoonful, adjusting saltiness as needed.", "name": "For the filling, combine ground pork, corn starch, fish sauce, oyster sauce, shaoxing wine, sesame oil, and white pepper in a large bowl. Stir vigorously in one direction for 10 minutes until the mixture becomes sticky and cohesive—use a stand mixer if preferred. Chop the peeled shrimp to desired size—chunkier pieces offer a more satisfying bite—and blend thoroughly with the pork mixture for 5 minutes. Fold in the green onions and mix for another minute. Test for seasoning by cooking a small spoonful, adjusting saltiness as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/wonton-noodle-soup-recipe/#wprm-recipe-15926-step-0-2"}, {"@type": "HowToStep", "text": "To fold the dumplings, keep the wonton wrappers under a damp cloth. Place one wrapper in your palm, diamond-shaped, and spoon about 1 teaspoon of filling into the center. Moisten the wrapper’s edges with water, fold the bottom corner to meet the top, pinch the tip, then pleat and press the sides toward the top to seal. Cover finished dumplings with a damp cloth to prevent drying. Continue until all are folded.", "name": "To fold the dumplings, keep the wonton wrappers under a damp cloth. Place one wrapper in your palm, diamond-shaped, and spoon about 1 teaspoon of filling into the center. Moisten the wrapper’s edges with water, fold the bottom corner to meet the top, pinch the tip, then pleat and press the sides toward the top to seal. Cover finished dumplings with a damp cloth to prevent drying. Continue until all are folded.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/wonton-noodle-soup-recipe/#wprm-recipe-15926-step-0-3"}, {"@type": "HowToStep", "text": "Bring a separate pot of water to a rolling boil. Cook the wontons in batches, stirring gently until they float, about 5 minutes. Remove and set aside. Reboil the same water and cook the wonton noodles for just 20–25 seconds, stirring constantly to prevent overcooking.", "name": "Bring a separate pot of water to a rolling boil. Cook the wontons in batches, stirring gently until they float, about 5 minutes. Remove and set aside. Reboil the same water and cook the wonton noodles for just 20–25 seconds, stirring constantly to prevent overcooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/wonton-noodle-soup-recipe/#wprm-recipe-15926-step-0-4"}, {"@type": "HowToStep", "text": "Strain the broth to discard the ginger, garlic, and shrimp shells. Stir in the sesame oil and remove from heat. Portion the cooked noodles and wontons into bowls. Ladle the hot broth over them and garnish with your choice of toppings.", "name": "Strain the broth to discard the ginger, garlic, and shrimp shells. Stir in the sesame oil and remove from heat. Portion the cooked noodles and wontons into bowls. Ladle the hot broth over them and garnish with your choice of toppings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/wonton-noodle-soup-recipe/#wprm-recipe-15926-step-0-5"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["Chinese"], "keywords": "Wonton Noodle Soup Recipe"}</script>
