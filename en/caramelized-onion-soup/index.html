    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Caramelized Onion Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "This deeply savory soup combines slowly caramelized white and yellow onions with fresh garlic, thyme, dry sherry, and beef broth. Toasted baguette rounds and melted Gruyère provide a rich, satisfying finish, while fresh parsley adds color and brightness.", "datePublished": "2018-05-01T15:36:51+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/caramelized-onion-soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/caramelized-onion-soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/caramelized-onion-soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/caramelized-onion-soup.png"], "prepTime": "PT20M", "cookTime": "PT85M", "totalTime": "PT105M", "recipeIngredient": ["4 cups beef broth", "2  large white onions (quartered and cut into thin slices)", "1  fresh thyme sprig", "1 tablespoon unsalted butter", "8  garlic cloves (freshly minced)", "1 teaspoon granulated sugar", "⅓ cup dry sherry", "2 tablespoons all-purpose flour", "1 teaspoon freshly ground black pepper", "2  large yellow onions (quartered and thinly sliced)", "¼ cup extra-virgin olive oil", "1½ teaspoons kosher salt", "⅔ cup grated Gruyère cheese", "Finely chopped fresh flat-leaf parsley (for garnishing)", "8  small baguette rounds (toasted until golden)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm the olive oil in a large Dutch oven over medium heat. Add the sliced white onions, yellow onions, minced garlic, thyme sprig, kosher salt, black pepper, and granulated sugar.", "name": "Warm the olive oil in a large Dutch oven over medium heat. Add the sliced white onions, yellow onions, minced garlic, thyme sprig, kosher salt, black pepper, and granulated sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/#wprm-recipe-40613-step-0-0"}, {"@type": "HowToStep", "text": "Lower the heat to medium-low. Cook the mixture for 50 to 60 minutes, stirring frequently and scraping any browned residue from the bottom of the pot. Continue until the onions become deeply golden, soft, and thoroughly caramelized. Reduce the heat further if the onions begin sticking.", "name": "Lower the heat to medium-low. Cook the mixture for 50 to 60 minutes, stirring frequently and scraping any browned residue from the bottom of the pot. Continue until the onions become deeply golden, soft, and thoroughly caramelized. Reduce the heat further if the onions begin sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/#wprm-recipe-40613-step-0-1"}, {"@type": "HowToStep", "text": "Raise the heat to medium and pour in the sherry. Stir thoroughly while loosening the flavorful browned bits from the base of the Dutch oven.", "name": "Raise the heat to medium and pour in the sherry. Stir thoroughly while loosening the flavorful browned bits from the base of the Dutch oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/#wprm-recipe-40613-step-0-2"}, {"@type": "HowToStep", "text": "Cook for approximately 4 minutes, or until nearly all the sherry has evaporated. Remove and discard the thyme sprig.", "name": "Cook for approximately 4 minutes, or until nearly all the sherry has evaporated. Remove and discard the thyme sprig.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/#wprm-recipe-40613-step-0-3"}, {"@type": "HowToStep", "text": "Reduce the heat to low. Add the unsalted butter and stir until it has completely melted into the onion mixture.", "name": "Reduce the heat to low. Add the unsalted butter and stir until it has completely melted into the onion mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/#wprm-recipe-40613-step-0-4"}, {"@type": "HowToStep", "text": "Scatter the flour evenly over the onions, then stir until fully incorporated. Cook for 1 minute to eliminate the flour’s raw flavor and create a lightly thickened base.", "name": "Scatter the flour evenly over the onions, then stir until fully incorporated. Cook for 1 minute to eliminate the flour’s raw flavor and create a lightly thickened base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/#wprm-recipe-40613-step-0-5"}, {"@type": "HowToStep", "text": "Slowly pour in the beef broth, stirring continuously to prevent the flour from forming lumps.", "name": "Slowly pour in the beef broth, stirring continuously to prevent the flour from forming lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/#wprm-recipe-40613-step-0-6"}, {"@type": "HowToStep", "text": "Increase the heat to medium and bring the soup to a gentle simmer. Cook for about 20 minutes, allowing the flavors to blend and the broth to thicken slightly. Taste and adjust the seasoning as necessary.", "name": "Increase the heat to medium and bring the soup to a gentle simmer. Cook for about 20 minutes, allowing the flavors to blend and the broth to thicken slightly. Taste and adjust the seasoning as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/#wprm-recipe-40613-step-0-7"}, {"@type": "HowToStep", "text": "Divide the hot soup among four bowls. Place two toasted baguette slices over each serving and cover them generously with shredded Gruyère.", "name": "Divide the hot soup among four bowls. Place two toasted baguette slices over each serving and cover them generously with shredded Gruyère.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/#wprm-recipe-40613-step-0-8"}, {"@type": "HowToStep", "text": "For a softer, richer topping, spoon a small amount of additional hot soup over the bread and cheese. Garnish each bowl with finely chopped fresh parsley before serving.", "name": "For a softer, richer topping, spoon a small amount of additional hot soup over the bread and cheese. Garnish each bowl with finely chopped fresh parsley before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-soup/#wprm-recipe-40613-step-0-9"}], "recipeCategory": ["Soup"], "recipeCuisine": ["French"], "keywords": "Caramelized Onion Soup"}</script>
