ithout overcrowding. Sear each side for 3–4 minutes until golden and crisp. The chicken does not need to be fully cooked at this stage.", "name": "Heat a non-stick skillet over medium heat and drizzle just enough olive oil to lightly cover the pan’s surface. Once the oil is shimmering, place the cutlets in batches without overcrowding. Sear each side for 3–4 minutes until golden and crisp. The chicken does not need to be fully cooked at this stage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-recipe/#wprm-recipe-32312-step-0-3"}, {"@type": "HowToStep", "text": "Preheat your oven to 425°F. Pour half of the marinara sauce into a 9x13-inch baking dish, spreading it evenly across the bottom. Arrange the sautéed chicken cutlets in a single layer over the sauce. Spoon the remaining marinara down the center of each piece and generously sprinkle shredded mozzarella over the top.", "name": "Preheat your oven to 425°F. Pour half of the marinara sauce into a 9x13-inch baking dish, spreading it evenly across the bottom. Arrange the sautéed chicken cutlets in a single layer over the sauce. Spoon the remaining marinara down the center of each piece and generously sprinkle shredded mozzarella over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-parmesan-recipe/#wprm-recipe-32312-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the dish to the oven and bake uncovered for 15 minutes. The chicken should reach an internal temperature of 165°F, the cheese should be fully melted, and the sauce should bubble at the edges. If desired, finish with a sprinkle of freshly chopped basil or parsley before serving.", "name": "Transfer the dish to the oven and bake uncovered for 15 minutes. The chicken should reach an internal temperature of 165°F, the cheese should be fully melted, and the sauce should bubble at the edges. If desired, finish with a sprinkle of freshly chopped basil or parsley before serving.", "url": "https:/
