    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Cream Cheese Cupcakes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Moist pumpkin cupcakes warmly seasoned with cinnamon, ginger, nutmeg, and cloves, then finished with a smooth cream cheese frosting. This recipe produces 12 tender cupcakes with a balanced pumpkin-spice flavor.", "datePublished": "2018-01-27T06:20:28+00:00", "image": ["https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/pumpkin-cream-cheese-cupcakes2.png", "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/pumpkin-cream-cheese-cupcakes2.png", "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/pumpkin-cream-cheese-cupcakes2.png", "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/pumpkin-cream-cheese-cupcakes2.png"], "prepTime": "PT20M", "cookTime": "PT17M", "recipeIngredient": ["1 cup pumpkin purée (such as Libby’s, not pumpkin pie filling)", "2  large eggs (brought to room temperature)", "¼ teaspoon ground ginger", "½ cup firmly packed light brown sugar", "1 teaspoon pure vanilla extract", "1 cup all-purpose flour", "⅛ teaspoon ground cloves", "½ cup vegetable or canola oil", "1 teaspoon baking powder", "¼ teaspoon fine salt", "¼ cup granulated sugar", "½ teaspoon baking soda", "¼ teaspoon ground nutmeg (preferably freshly grated)", "1 teaspoon ground cinnamon", "1  package (8 ounces brick-style cream cheese, softened, such as Philadelphia)", "1 teaspoon pure vanilla extract", "2 cups confectioners’ sugar (sifted)", "½ cup unsalted butter (softened)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (177°C). Place paper liners in each cavity of a 12-cup muffin pan and set the prepared pan aside.", "name": "Preheat the oven to 350°F (177°C). Place paper liners in each cavity of a 12-cup muffin pan and set the prepared pan aside.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/#wprm-recipe-40201-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, thoroughly whisk together the flour, cinnamon, baking powder, baking soda, ginger, nutmeg, cloves, and salt. Mixing these ingredients well helps distribute the spices and leavening agents evenly.", "name": "In a large mixing bowl, thoroughly whisk together the flour, cinnamon, baking powder, baking soda, ginger, nutmeg, cloves, and salt. Mixing these ingredients well helps distribute the spices and leavening agents evenly.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/#wprm-recipe-40201-step-0-1"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the pumpkin purée, oil, brown sugar, granulated sugar, eggs, and vanilla extract until the mixture appears smooth and evenly combined.", "name": "In a separate bowl, whisk the pumpkin purée, oil, brown sugar, granulated sugar, eggs, and vanilla extract until the mixture appears smooth and evenly combined.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/#wprm-recipe-40201-step-0-2"}, {"@type": "HowToStep", "text": "Pour the pumpkin mixture into the bowl containing the dry ingredients. Stir gently only until no dry streaks remain. Avoid excessive mixing, which may produce dense cupcakes.", "name": "Pour the pumpkin mixture into the bowl containing the dry ingredients. Stir gently only until no dry streaks remain. Avoid excessive mixing, which may produce dense cupcakes.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/#wprm-recipe-40201-step-0-3"}, {"@type": "HowToStep", "text": "Distribute the batter evenly among the 12 prepared cupcake liners, then lightly smooth the surfaces. Gently tap the muffin pan against the countertop to help release trapped air bubbles.", "name": "Distribute the batter evenly among the 12 prepared cupcake liners, then lightly smooth the surfaces. Gently tap the muffin pan against the countertop to help release trapped air bubbles.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/#wprm-recipe-40201-step-0-4"}, {"@type": "HowToStep", "text": "Bake the cupcakes for 17–22 minutes. They are ready when a toothpick inserted into the center emerges clean.", "name": "Bake the cupcakes for 17–22 minutes. They are ready when a toothpick inserted into the center emerges clean.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/#wprm-recipe-40201-step-0-5"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and allow the cupcakes to rest in the pan for 5 minutes. Transfer them to a wire cooling rack and let them cool completely before applying the frosting.", "name": "Remove the pan from the oven and allow the cupcakes to rest in the pan for 5 minutes. Transfer them to a wire cooling rack and let them cool completely before applying the frosting.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/#wprm-recipe-40201-step-0-6"}, {"@type": "HowToStep", "text": "Using a large bowl and an electric mixer, or a stand mixer fitted with the paddle attachment, beat the softened cream cheese with the softened butter until completely smooth and creamy.", "name": "Using a large bowl and an electric mixer, or a stand mixer fitted with the paddle attachment, beat the softened cream cheese with the softened butter until completely smooth and creamy.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/#wprm-recipe-40201-step-0-7"}, {"@type": "HowToStep", "text": "Add the sifted confectioners’ sugar and vanilla extract. Continue mixing until the frosting is fully incorporated and fluffy. For a silkier texture, beat the frosting at medium-high speed for an additional two minutes.", "name": "Add the sifted confectioners’ sugar and vanilla extract. Continue mixing until the frosting is fully incorporated and fluffy. For a silkier texture, beat the frosting at medium-high speed for an additional two minutes.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/#wprm-recipe-40201-step-0-8"}, {"@type": "HowToStep", "text": "Once the cupcakes are entirely cool, spread or pipe the cream cheese frosting over each one using a spatula or piping bag.", "name": "Once the cupcakes are entirely cool, spread or pipe the cream cheese frosting over each one using a spatula or piping bag.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-cupcakes/#wprm-recipe-40201-step-0-9"}], "recipeCategory": ["Dessert"], "keywords": "Pumpkin Cream Cheese Cupcakes"}</script>
