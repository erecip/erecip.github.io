    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "hatch chile tamales", "author": {"@type": "Person", "name": "BenDes"}, "description": "These hatch chile tamales feature soft homemade tamale masa wrapped around a savory filling of roasted green chiles, melted Mexican cheese, tomato, onion, garlic, and chicken broth. The filled corn husks are steamed until the masa becomes firm and releases cleanly from the wrapper.", "datePublished": "2022-02-09T14:13:52+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/hatch-chile-tamales2.png", "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/hatch-chile-tamales2.png", "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/hatch-chile-tamales2.png", "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/hatch-chile-tamales2.png"], "cookTime": "PT45M", "totalTime": "PT75M", "recipeIngredient": ["1/2  batch prepared homemade tamale masa", "10  roasted Hatch green chiles (peeled and diced)", "1 1/2 cups shredded Mexican melting cheese (preferably Oaxaca; asadero, Chihuahua, or Muenster may also be used)", "1 tablespoon vegetable oil", "1  small tomato (chopped)", "1/8 cup chicken broth", "1  garlic clove (freshly minced)", "1/4  medium white onion (finely cut into approximately 1/4-inch pieces)", "1/4 teaspoon kosher salt (plus more if needed)", "1/4 teaspoon ground black pepper (with additional seasoning as desired)", "1  bag dried corn husks (softened in warm water)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare one-half batch of homemade tamale masa according to your preferred recipe or nixtamalization method, reducing the original quantities by half where necessary.", "name": "Prepare one-half batch of homemade tamale masa according to your preferred recipe or nixtamalization method, reducing the original quantities by half where necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-0"}, {"@type": "HowToStep", "text": "Place the dried corn husks in a large bowl or pot and completely cover them with hot water. Allow them to soak for 30–45 minutes, or until sufficiently soft and flexible for folding.", "name": "Place the dried corn husks in a large bowl or pot and completely cover them with hot water. Allow them to soak for 30–45 minutes, or until sufficiently soft and flexible for folding.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the softened husks to a colander and allow the excess water to drain. Soak several additional husks if possible, as these can be used to line the steaming rack.", "name": "Transfer the softened husks to a colander and allow the excess water to drain. Soak several additional husks if possible, as these can be used to line the steaming rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-2"}, {"@type": "HowToStep", "text": "Warm the vegetable oil in a medium saucepan over medium heat.", "name": "Warm the vegetable oil in a medium saucepan over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-3"}, {"@type": "HowToStep", "text": "Add the finely diced white onion, chopped tomato, and minced garlic. Sauté for approximately 1 minute, just until the mixture becomes aromatic.", "name": "Add the finely diced white onion, chopped tomato, and minced garlic. Sauté for approximately 1 minute, just until the mixture becomes aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-4"}, {"@type": "HowToStep", "text": "Add the roasted, peeled, and diced green chiles and stir until evenly distributed throughout the vegetable mixture.", "name": "Add the roasted, peeled, and diced green chiles and stir until evenly distributed throughout the vegetable mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-5"}, {"@type": "HowToStep", "text": "Season with the kosher salt and black pepper, then pour in the chicken broth.", "name": "Season with the kosher salt and black pepper, then pour in the chicken broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-6"}, {"@type": "HowToStep", "text": "Allow the filling to gently simmer for 3–5 minutes so the ingredients and seasonings can combine thoroughly.", "name": "Allow the filling to gently simmer for 3–5 minutes so the ingredients and seasonings can combine thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-7"}, {"@type": "HowToStep", "text": "Taste the mixture and adjust the salt or pepper as necessary.", "name": "Taste the mixture and adjust the salt or pepper as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-8"}, {"@type": "HowToStep", "text": "Reduce the heat to low. Add the shredded cheese and stir until completely melted and evenly incorporated. Remove the saucepan from the heat and reserve the filling for assembly.", "name": "Reduce the heat to low. Add the shredded cheese and stir until completely melted and evenly incorporated. Remove the saucepan from the heat and reserve the filling for assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-9"}, {"@type": "HowToStep", "text": "Place one softened corn husk on the work surface with its smooth side facing upward.", "name": "Place one softened corn husk on the work surface with its smooth side facing upward.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-10"}, {"@type": "HowToStep", "text": "Spoon approximately 1–2 generous tablespoons of prepared masa onto the center of the husk.", "name": "Spoon approximately 1–2 generous tablespoons of prepared masa onto the center of the husk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-11"}, {"@type": "HowToStep", "text": "Using the back of a spoon, spread the masa into an oval layer while keeping a clear border around the edges of the husk.", "name": "Using the back of a spoon, spread the masa into an oval layer while keeping a clear border around the edges of the husk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-12"}, {"@type": "HowToStep", "text": "Arrange approximately 1–2 generous teaspoons of the green chile and cheese mixture in a narrow line through the center of the masa.", "name": "Arrange approximately 1–2 generous teaspoons of the green chile and cheese mixture in a narrow line through the center of the masa.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-13"}, {"@type": "HowToStep", "text": "Fold the two long sides of the corn husk inward so they overlap around the filling, then bring the narrow bottom end of the husk upward to close the tamal.", "name": "Fold the two long sides of the corn husk inward so they overlap around the filling, then bring the narrow bottom end of the husk upward to close the tamal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-14"}, {"@type": "HowToStep", "text": "Place the completed tamal seam-side down. Repeat the process with the remaining masa, filling, and corn husks until all of the ingredients have been used.", "name": "Place the completed tamal seam-side down. Repeat the process with the remaining masa, filling, and corn husks until all of the ingredients have been used.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-15"}, {"@type": "HowToStep", "text": "Pour water into the bottom of a tamale steamer or a large pot fitted with a steaming rack. Keep the water level below the rack so the tamales do not sit directly in the liquid.", "name": "Pour water into the bottom of a tamale steamer or a large pot fitted with a steaming rack. Keep the water level below the rack so the tamales do not sit directly in the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-16"}, {"@type": "HowToStep", "text": "Place two clean pennies in the water if using this method to monitor the liquid level. They will rattle while sufficient water remains in the pot.", "name": "Place two clean pennies in the water if using this method to monitor the liquid level. They will rattle while sufficient water remains in the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-17"}, {"@type": "HowToStep", "text": "Cover the steaming rack with several of the extra soaked corn husks to help prevent the tamales from sticking.", "name": "Cover the steaming rack with several of the extra soaked corn husks to help prevent the tamales from sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-18"}, {"@type": "HowToStep", "text": "Position the assembled tamales vertically in the steamer with their open ends facing upward.", "name": "Position the assembled tamales vertically in the steamer with their open ends facing upward.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-19"}, {"@type": "HowToStep", "text": "Cover the pot and bring the water to a boil. Once boiling, reduce the heat to medium and steam the tamales for 45–60 minutes.", "name": "Cover the pot and bring the water to a boil. Once boiling, reduce the heat to medium and steam the tamales for 45–60 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-20"}, {"@type": "HowToStep", "text": "Check the water periodically during steaming and add additional hot water whenever necessary. If using the pennies as a water-level indicator, replenish the water if the rattling stops.", "name": "Check the water periodically during steaming and add additional hot water whenever necessary. If using the pennies as a water-level indicator, replenish the water if the rattling stops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-21"}, {"@type": "HowToStep", "text": "Test one tamal near the end of the cooking period by carefully removing and unwrapping it. The masa is ready when it holds its form and separates easily from the corn husk.", "name": "Test one tamal near the end of the cooking period by carefully removing and unwrapping it. The masa is ready when it holds its form and separates easily from the corn husk.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-22"}, {"@type": "HowToStep", "text": "Carefully lift the cooked tamales from the steamer using tongs.", "name": "Carefully lift the cooked tamales from the steamer using tongs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-23"}, {"@type": "HowToStep", "text": "Allow them to stand for approximately 10 minutes before serving. This brief resting period gives the masa time to firm further, helping the tamales retain their shape and unwrap more cleanly.", "name": "Allow them to stand for approximately 10 minutes before serving. This brief resting period gives the masa time to firm further, helping the tamales retain their shape and unwrap more cleanly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hatch-chile-tamales/#wprm-recipe-41725-step-0-24"}], "recipeCuisine": ["Mexican"], "keywords": "Corn Husk Soaking"}</script>
