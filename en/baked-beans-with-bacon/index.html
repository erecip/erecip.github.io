    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Baked Beans with Bacon", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich Southern-style dish featuring tender beans in a deeply savory and slightly sweet sauce, generously enriched with smoky bacon. This versatile side pairs perfectly with grilled meats, breakfast plates, or simply enjoyed on its own with crusty bread.", "datePublished": "2024-10-02T06:52:26+00:00", "image": ["https://erecip.github.io/en/baked-beans-with-bacon/baked-beans-with-bacon.jpg", "https://erecip.github.io/en/baked-beans-with-bacon/baked-beans-with-bacon.jpg", "https://erecip.github.io/en/baked-beans-with-bacon/baked-beans-with-bacon.jpg", "https://erecip.github.io/en/baked-beans-with-bacon/baked-beans-with-bacon.jpg"], "prepTime": "PT10M", "cookTime": "PT75M", "totalTime": "PT85M", "recipeIngredient": ["1  medium onion (finely chopped)", "2 tablespoons cider vinegar", "3/4 teaspoon each of salt and pepper (plus more to taste)", "3/4 cup water", "3/4 cup ketchup", "3 cloves garlic (minced (or 1 1/2 teaspoons garlic paste))", "1 tablespoon oil", "3/4 cup tomato passata or U.S. tomato puree", "150 g 5 oz bacon, chopped", "2 teaspoons mustard powder (or 1 tablespoon Dijon or American mustard)", "3  x 400g (14 oz cans red kidney or other beans, drained and rinsed)", "1 1/2 teaspoons Worcestershire sauce", "1/4 cup molasses", "1/2 teaspoon cayenne pepper"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oil in a large pot over high heat. If the bacon is particularly fatty, the oil may be omitted. Add the chopped bacon and cook for approximately 2 minutes until it begins to render and brown.", "name": "Heat the oil in a large pot over high heat. If the bacon is particularly fatty, the oil may be omitted. Add the chopped bacon and cook for approximately 2 minutes until it begins to render and brown.", "url": "https://erecip.github.io/en/baked-beans-with-bacon/#wprm-recipe-31991-step-0-0"}, {"@type": "HowToStep", "text": "Incorporate the onion and garlic into the pan, cooking for a further 3 minutes or until both the onion and bacon have developed a golden hue.", "name": "Incorporate the onion and garlic into the pan, cooking for a further 3 minutes or until both the onion and bacon have developed a golden hue.", "url": "https://erecip.github.io/en/baked-beans-with-bacon/#wprm-recipe-31991-step-0-1"}, {"@type": "HowToStep", "text": "Introduce the beans, ketchup, tomato passata, molasses, vinegar, water, mustard powder, Worcestershire sauce, cayenne pepper, salt, and black pepper to the pot. Stir thoroughly to combine.", "name": "Introduce the beans, ketchup, tomato passata, molasses, vinegar, water, mustard powder, Worcestershire sauce, cayenne pepper, salt, and black pepper to the pot. Stir thoroughly to combine.", "url": "https://erecip.github.io/en/baked-beans-with-bacon/#wprm-recipe-31991-step-0-2"}, {"@type": "HowToStep", "text": "Bring the mixture to a gentle simmer, then cover with a lid. Continue to cook either on the stovetop at a reduced medium-low heat for 1 hour, stirring occasionally to prevent sticking, or transfer to an oven preheated to 160°C (325°F) and bake for 60 minutes.", "name": "Bring the mixture to a gentle simmer, then cover with a lid. Continue to cook either on the stovetop at a reduced medium-low heat for 1 hour, stirring occasionally to prevent sticking, or transfer to an oven preheated to 160°C (325°F) and bake for 60 minutes.", "url": "https://erecip.github.io/en/baked-beans-with-bacon/#wprm-recipe-31991-step-0-3"}, {"@type": "HowToStep", "text": "For a slow cooker version, reduce the water to 1/4 cup, transfer the contents to the slow cooker, and cook on low for 6 hours.", "name": "For a slow cooker version, reduce the water to 1/4 cup, transfer the contents to the slow cooker, and cook on low for 6 hours.", "url": "https://erecip.github.io/en/baked-beans-with-bacon/#wprm-recipe-31991-ste
