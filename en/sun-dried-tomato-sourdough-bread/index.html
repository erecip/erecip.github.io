    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sun-Dried Tomato Sourdough Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "This naturally leavened artisan loaf combines a tender, airy crumb with savory sun-dried tomatoes, briny capers, oregano, and crushed red pepper. An extended cold proof deepens the flavor while making the dough easier to score and bake.", "datePublished": "2018-01-02T17:19:33+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/sun-dried-tomato-sourdough-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/sun-dried-tomato-sourdough-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/sun-dried-tomato-sourdough-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/sun-dried-tomato-sourdough-bread.png"], "prepTime": "PT300M", "cookTime": "PT35M", "totalTime": "PT395M", "recipeIngredient": ["30 g bread flour", "30 g water", "30 g active sourdough starter", "60 g whole-wheat flour", "307 g water (plus as much as 10 g additional water if required)", "8 g fine sea salt", "340 g bread flour", "Entire prepared levain (or 90 g vigorous sourdough starter)", "1 teaspoon crushed red pepper flakes", "56 g dry-packed sun-dried tomatoes (chopped)", "1½ teaspoons dried oregano (or 1 tablespoon fresh oregano leaves)", "70 g capers (rinsed thoroughly, dried, and chopped)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Loosely cover the jar and keep it in a warm area maintained between 75°F and 80°F. Allow the levain to ferment for approximately 5 hours, or until it is bubbly and has doubled in volume.", "name": "Loosely cover the jar and keep it in a warm area maintained between 75°F and 80°F. Allow the levain to ferment for approximately 5 hours, or until it is bubbly and has doubled in volume.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-0"}, {"@type": "HowToStep", "text": "Alternatively, omit the levain preparation and add 90 g of lively sourdough starter directly to the dough in Step 3.", "name": "Alternatively, omit the levain preparation and add 90 g of lively sourdough starter directly to the dough in Step 3.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-1"}, {"@type": "HowToStep", "text": "Once the levain is mature, place the bread flour and whole-wheat flour in a large mixing bowl. Form a hollow in the center and pour in 307 g of water.", "name": "Once the levain is mature, place the bread flour and whole-wheat flour in a large mixing bowl. Form a hollow in the center and pour in 307 g of water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-2"}, {"@type": "HowToStep", "text": "Combine the ingredients with your hands or a dough whisk just until all the flour is moistened and a rough, shaggy dough develops.", "name": "Combine the ingredients with your hands or a dough whisk just until all the flour is moistened and a rough, shaggy dough develops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-3"}, {"@type": "HowToStep", "text": "Cover the bowl and leave the dough in a warm place for 30 minutes. This resting period encourages extensibility and supports flavor development.", "name": "Cover the bowl and leave the dough in a warm place for 30 minutes. This resting period encourages extensibility and supports flavor development.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-4"}, {"@type": "HowToStep", "text": "Add the entire prepared levain, or 90 g of active sourdough starter, to the rested dough.", "name": "Add the entire prepared levain, or 90 g of active sourdough starter, to the rested dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-5"}, {"@type": "HowToStep", "text": "Moisten your hands and press the levain gently into the dough with your fingertips. Continue incorporating it with stretching and folding motions until it is roughly distributed.", "name": "Moisten your hands and press the levain gently into the dough with your fingertips. Continue incorporating it with stretching and folding motions until it is roughly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-6"}, {"@type": "HowToStep", "text": "Cover the bowl and allow the dough to rest for 30 minutes.", "name": "Cover the bowl and allow the dough to rest for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-7"}, {"@type": "HowToStep", "text": "Scatter the sea salt evenly over the dough. Press the salt into the surface, then stretch and fold the dough for approximately 5 minutes, continuing until the salt has dissolved and the mixture feels cohesive.", "name": "Scatter the sea salt evenly over the dough. Press the salt into the surface, then stretch and fold the dough for approximately 5 minutes, continuing until the salt has dissolved and the mixture feels cohesive.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-8"}, {"@type": "HowToStep", "text": "When the dough appears overly firm, gradually work in up to 10 g of additional water. Add only a small amount at a time, stopping once the dough feels soft without becoming excessively sticky.", "name": "When the dough appears overly firm, gradually work in up to 10 g of additional water. Add only a small amount at a time, stopping once the dough feels soft without becoming excessively sticky.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-9"}, {"@type": "HowToStep", "text": "Cover the bowl and rest the dough in a warm location for another 30 minutes.", "name": "Cover the bowl and rest the dough in a warm location for another 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-10"}, {"@type": "HowToStep", "text": "Maintain the dough at approximately 78°F or 26°C during bulk fermentation. The complete bulk-rise stage should take about 5 hours.", "name": "Maintain the dough at approximately 78°F or 26°C during bulk fermentation. The complete bulk-rise stage should take about 5 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-11"}, {"@type": "HowToStep", "text": "After the first 30 minutes, complete one set of stretch-and-folds. Lift one side of the dough gently and fold it over the center, repeating from each side.", "name": "After the first 30 minutes, complete one set of stretch-and-folds. Lift one side of the dough gently and fold it over the center, repeating from each side.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-12"}, {"@type": "HowToStep", "text": "Let the dough rest for another 30 minutes.", "name": "Let the dough rest for another 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-13"}, {"@type": "HowToStep", "text": "Lightly moisten the work surface and your hands. Carefully extend the dough into a broad, thin sheet without tearing it.", "name": "Lightly moisten the work surface and your hands. Carefully extend the dough into a broad, thin sheet without tearing it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-14"}, {"@type": "HowToStep", "text": "Distribute the chopped sun-dried tomatoes, prepared capers, oregano, and crushed red pepper flakes evenly over the stretched dough.", "name": "Distribute the chopped sun-dried tomatoes, prepared capers, oregano, and crushed red pepper flakes evenly over the stretched dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-15"}, {"@type": "HowToStep", "text": "Fold the dough over itself to create a compact packet, enclosing the additions through lamination.", "name": "Fold the dough over itself to create a compact packet, enclosing the additions through lamination.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-16"}, {"@type": "HowToStep", "text": "Allow the dough to rest for 45 minutes.", "name": "Allow the dough to rest for 45 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-17"}, {"@type": "HowToStep", "text": "Complete another two or three sets of stretch-and-folds, leaving approximately 45 minutes between each set.", "name": "Complete another two or three sets of stretch-and-folds, leaving approximately 45 minutes between each set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-18"}, {"@type": "HowToStep", "text": "After the final fold, leave the dough undisturbed for the remainder of bulk fermentation. It is ready when it has nearly doubled, looks aerated, feels light, and moves with a gentle jiggle when the bowl is shaken.", "name": "After the final fold, leave the dough undisturbed for the remainder of bulk fermentation. It is ready when it has nearly doubled, looks aerated, feels light, and moves with a gentle jiggle when the bowl is shaken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-19"}, {"@type": "HowToStep", "text": "Lightly dust both the dough and the work surface with flour.", "name": "Lightly dust both the dough and the work surface with flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-20"}, {"@type": "HowToStep", "text": "Ease the fermented dough away from the bowl and carefully turn it onto the counter.", "name": "Ease the fermented dough away from the bowl and carefully turn it onto the counter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-21"}, {"@type": "HowToStep", "text": "Using a bench scraper, form the dough into either an oval bâtard or a round boule.", "name": "Using a bench scraper, form the dough into either an oval bâtard or a round boule.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-22"}, {"@type": "HowToStep", "text": "Gently tuck any exposed pieces of tomato or caper beneath the dough’s surface to reduce the chance of scorching during baking.", "name": "Gently tuck any exposed pieces of tomato or caper beneath the dough’s surface to reduce the chance of scorching during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-23"}, {"@type": "HowToStep", "text": "Transfer the shaped loaf to a thoroughly floured banneton. When the dough feels loose, strengthen the underside by pinching or stitching the edges together.", "name": "Transfer the shaped loaf to a thoroughly floured banneton. When the dough feels loose, strengthen the underside by pinching or stitching the edges together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-24"}, {"@type": "HowToStep", "text": "Cover and leave it at room temperature for 15 to 30 minutes. For a slightly firmer surface and improved crust formation, leave the banneton uncovered during the final 10 minutes.", "name": "Cover and leave it at room temperature for 15 to 30 minutes. For a slightly firmer surface and improved crust formation, leave the banneton uncovered during the final 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-25"}, {"@type": "HowToStep", "text": "Cover the banneton and refrigerate the shaped loaf overnight. It may remain under cold proof for as long as 2 days.", "name": "Cover the banneton and refrigerate the shaped loaf overnight. It may remain under cold proof for as long as 2 days.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-26"}, {"@type": "HowToStep", "text": "This slow fermentation develops a more complex flavor and firms the dough, making it easier to score and transfer for baking.", "name": "This slow fermentation develops a more complex flavor and firms the dough, making it easier to score and transfer for baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-27"}, {"@type": "HowToStep", "text": "Place a Dutch oven and its lid inside the oven. Preheat both at 500°F or 260°C for 1 hour.", "name": "Place a Dutch oven and its lid inside the oven. Preheat both at 500°F or 260°C for 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-28"}, {"@type": "HowToStep", "text": "Remove the banneton from the refrigerator and immediately turn the cold dough onto a sheet of parchment paper.", "name": "Remove the banneton from the refrigerator and immediately turn the cold dough onto a sheet of parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-29"}, {"@type": "HowToStep", "text": "Using a bread lame, score the surface approximately ¼ to ½ inch deep.", "name": "Using a bread lame, score the surface approximately ¼ to ½ inch deep.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-30"}, {"@type": "HowToStep", "text": "Lift the loaf with the parchment paper and lower it carefully into the heated Dutch oven. Cover with the lid and bake at 500°F or 260°C for 20 minutes.", "name": "Lift the loaf with the parchment paper and lower it carefully into the heated Dutch oven. Cover with the lid and bake at 500°F or 260°C for 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-31"}, {"@type": "HowToStep", "text": "Remove the lid, lower the oven temperature to 450°F or 232°C, and continue baking for approximately 15 minutes, or until the crust becomes deeply golden brown.", "name": "Remove the lid, lower the oven temperature to 450°F or 232°C, and continue baking for approximately 15 minutes, or until the crust becomes deeply golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-32"}, {"@type": "HowToStep", "text": "Transfer the loaf from the Dutch oven to a wire rack. Cool for no less than 1 hour before cutting.", "name": "Transfer the loaf from the Dutch oven to a wire rack. Cool for no less than 1 hour before cutting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sun-dried-tomato-sourdough-bread/#wprm-recipe-39490-step-0-33"}], "recipeCategory": ["Sourdough Bread"], "recipeCuisine": ["Artisan Bread"], "keywords": "Sun-Dried Tomato Sourdough Bread"}</script>
