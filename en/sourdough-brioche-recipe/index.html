    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sourdough Brioche Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "This rich and airy sourdough brioche delivers an irresistible balance of buttery softness and tangy flavor. Developed through a combination of time-honored techniques and patient fermentation, this bread is ideal for celebratory mornings or luxurious afternoon indulgences.", "datePublished": "2024-09-19T10:08:08+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/sourdough-brioche-recipe3.webp", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/sourdough-brioche-recipe3.webp", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/sourdough-brioche-recipe3.webp", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/sourdough-brioche-recipe3.webp"], "cookTime": "PT45M", "totalTime": "PT1665M", "recipeIngredient": ["30 g warm water", "30 g bread flour", "30 g sourdough starter", "58 g boiling water", "58 g bread flour", "5 g sea salt", "59 g whole milk (room temperature)", "2  eggs", "113 g unsalted butter (softened)", "27 g granulated sugar", "212 g bread flour", "Levain (prepared as above or substitute 90g of active sourdough starter)", "Yudane (prepared as above)", "1 tsp water", "1  egg"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the levain by combining sourdough starter, bread flour, and warm water in a sanitized jar. Seal and place in a warm area for approximately five hours until bubbly and expanded. Alternatively, use 90 grams of an active sourdough starter directly in the dough.", "name": "Prepare the levain by combining sourdough starter, bread flour, and warm water in a sanitized jar. Seal and place in a warm area for approximately five hours until bubbly and expanded. Alternatively, use 90 grams of an active sourdough starter directly in the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/#wprm-recipe-25832-step-0-0"}, {"@type": "HowToStep", "text": "Simultaneously, create the yudane. In a small heatproof bowl, mix the bread flour with boiling water. Stir vigorously until a gelatinous paste forms. Allow to cool completely before use.", "name": "Simultaneously, create the yudane. In a small heatproof bowl, mix the bread flour with boiling water. Stir vigorously until a gelatinous paste forms. Allow to cool completely before use.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/#wprm-recipe-25832-step-0-1"}, {"@type": "HowToStep", "text": "When the levain has matured, assemble the dough. In a stand mixer fitted with a dough hook, combine all dough components except butter. Begin mixing at a low speed until a rough mass forms. Increase to medium speed and knead for roughly five minutes until the dough becomes more cohesive and detaches from the bowl's edges.", "name": "When the levain has matured, assemble the dough. In a stand mixer fitted with a dough hook, combine all dough components except butter. Begin mixing at a low speed until a rough mass forms. Increase to medium speed and knead for roughly five minutes until the dough becomes more cohesive and detaches from the bowl's edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/#wprm-recipe-25832-step-0-2"}, {"@type": "HowToStep", "text": "Gradually incorporate the butter, adding one piece at a time while mixing on medium speed. Wait at least a minute or two between additions, ensuring each piece is fully blended. Continue mixing for an additional five minutes post incorporation until the dough is smooth, elastic, and passes the windowpane test.", "name": "Gradually incorporate the butter, adding one piece at a time while mixing on medium speed. Wait at least a minute or two between additions, ensuring each piece is fully blended. Continue mixing for an additional five minutes post incorporation until the dough is smooth, elastic, and passes the windowpane test.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/#wprm-recipe-25832-step-0-3"}, {"@type": "HowToStep", "text": "Transfer dough to a clean bowl, shape into a round, cover, and let it ferment for about five hours at 78°F. After one hour, perform a set of stretch and folds. Repeat after the second hour if needed to build strength.", "name": "Transfer dough to a clean bowl, shape into a round, cover, and let it ferment for about five hours at 78°F. After one hour, perform a set of stretch and folds. Repeat after the second hour if needed to build strength.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/#wprm-recipe-25832-step-0-4"}, {"@type": "HowToStep", "text": "Refrigerate the dough for a slow fermentation overnight, lasting a minimum of eight and up to 48 hours.", "name": "Refrigerate the dough for a slow fermentation overnight, lasting a minimum of eight and up to 48 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/#wprm-recipe-25832-step-0-5"}, {"@type": "HowToStep", "text": "Next day, grease a loaf pan. Punch down the chilled dough, transfer to a lightly floured surface, and divide into four equal portions (approximately 170–175g each). Flatten each into a rectangle, roll tightly from the short end, and place seam-side down in the pan.", "name": "Next day, grease a loaf pan. Punch down the chilled dough, transfer to a lightly floured surface, and divide into four equal portions (approximately 170–175g each). Flatten each into a rectangle, roll tightly from the short end, and place seam-side down in the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/#wprm-recipe-25832-step-0-6"}, {"@type": "HowToStep", "text": "Allow the shaped dough to proof a final time in a warm spot for about five hours at 78°F. The dough should double in size and respond to a gentle poke with a slight indentation.", "name": "Allow the shaped dough to proof a final time in a warm spot for about five hours at 78°F. The dough should double in size and respond to a gentle poke with a slight indentation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/#wprm-recipe-25832-step-0-7"}, {"@type": "HowToStep", "text": "Preheat oven to 400°F. Prepare an egg wash by beating an egg with water and brush it lightly over the risen dough. Insert the loaf into the oven, then immediately reduce the temperature to 350°F. Bake for 45 minutes, or until the top is golden and the internal temperature reads between 195°F and 205°F.", "name": "Preheat oven to 400°F. Prepare an egg wash by beating an egg with water and brush it lightly over the risen dough. Insert the loaf into the oven, then immediately reduce the temperature to 350°F. Bake for 45 minutes, or until the top is golden and the internal temperature reads between 195°F and 205°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/#wprm-recipe-25832-step-0-8"}, {"@type": "HowToStep", "text": "Let the bread rest in the pan for five minutes post-baking, then remove and cool completely on a wire rack for at least an hour before slicing or pulling apart.", "name": "Let the bread rest in the pan for five minutes post-baking, then remove and cool completely on a wire rack for at least an hour before slicing or pulling apart.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-brioche-recipe/#wprm-recipe-25832-step-0-9"}], "recipeCategory": ["Bread"], "recipeCuisine": ["French"], "keywords": "sourdough brioche recipe"}</script>
