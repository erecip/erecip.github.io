    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Hawaiian Roll Sliders", "author": {"@type": "Person", "name": "BenDes"}, "description": "These Hawaiian roll sliders are a quick and satisfying solution for feeding a group, particularly ideal for using leftover holiday ham. With only 10 minutes of preparation time, the combination of savory ham, melty cheese, and a tangy-sweet buttery glaze delivers a well-balanced and indulgent flavor in every bite.", "datePublished": "2023-07-19T05:55:48+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders/hawaiian-roll-sliders.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders/hawaiian-roll-sliders.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders/hawaiian-roll-sliders.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders/hawaiian-roll-sliders.jpg"], "recipeYield": ["12", "12 sliders"], "prepTime": "PT10M", "cookTime": "PT25M", "totalTime": "PT35M", "recipeIngredient": ["2 tablespoons mayonnaise (optional)", "1/3 cup unsalted butter", "1 tablespoon poppy seeds", "1 tablespoon brown sugar", "1 tablespoon Dijon mustard", "2 teaspoons Worcestershire sauce", "1 teaspoon onion powder", "Kosher salt (to taste)", "Freshly cracked black pepper (to taste)", "7  –8 oz sliced Swiss cheese", "16 oz thinly sliced deli ham", "12 oz package King’s Hawaiian rolls (12-count)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Lightly coat a 9×9 or 9×13-inch baking dish with nonstick spray or a thin layer of butter.", "name": "Preheat the oven to 350°F. Lightly coat a 9×9 or 9×13-inch baking dish with nonstick spray or a thin layer of butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders/#wprm-recipe-31019-step-0-0"}, {"@type": "HowToStep", "text": "Slice the loaf of Hawaiian rolls horizontally t easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders/#wprm-recipe-31019-step-0-5"}, {"@type": "HowToStep", "text": "Pour the seasoned butter mixture evenly over the top of the assembled buns, ensuring all surfaces are well coated.", "name": "Pour the seasoned butter mixture evenly over the top of the assembled buns, ensuring all surfaces are well coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders/#wprm-recipe-31019-step-0-6"}, {"@type": "HowToStep", "text": "Place the sliders in the oven and bake for 10 minutes. Then, cover with a piece of foil sprayed on one side (sprayed side facing down) and continue baking for another 10 minutes.", "name": "Place the sliders in the oven and bake for 10 minutes. Then, cover with a piece of foil sprayed on one side (sprayed side facing down) and continue baking for another 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders/#wprm-recipe-31019-step-0-7"}, {"@type": "HowToStep", "text": "Remove the dish from the oven and allow the sliders to rest briefly before slicing.", "name": "Remove the dish from the oven and allow the sliders to rest briefly before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders/#wprm-recipe-31019-step-0-8"}, {"@type": "HowToStep", "text": "Cut into individual portions, serve warm, and enjoy.", "name": "Cut into individual portions, serve warm, and enjoy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders/#wprm-recipe-31019-step-0-9"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "hawaiian roll sliders"}</script>
