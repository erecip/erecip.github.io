    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mini Pumpkin Bread Loaves", "author": {"@type": "Person", "name": "BenDes"}, "description": "These tender miniature pumpkin loaves combine warm autumn spices with semisweet chocolate chips. Pumpkin purée keeps the crumb moist, while properly softened butter and a room-temperature egg help create a smooth, evenly blended batter.", "datePublished": "2018-04-16T16:32:27+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/Mini-Pumpkin-Bread-Loaves.png", "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/Mini-Pumpkin-Bread-Loaves.png", "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/Mini-Pumpkin-Bread-Loaves.png", "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/Mini-Pumpkin-Bread-Loaves.png"], "prepTime": "PT15M", "cookTime": "PT35M", "totalTime": "PT65M", "recipeIngredient": ["1 teaspoon finely ground cinnamon", "¼ teaspoon fine table salt", "⅛ teaspoon ground cloves", "¾ teaspoon baking soda", "1 cup plain all-purpose flour", "½ teaspoon ground nutmeg", "⅛ teaspoon powdered ginger", "¾ cup white granulated sugar", "¾ cup canned pumpkin purée (not pumpkin pie filling)", "1  large egg (brought to approximately 70°F)", "6 tablespoons unsalted butter (softened to approximately 68–70°F)", "½ teaspoon pure vanilla extract", "½ cup semisweet chocolate morsels"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the oven and pans. Preheat the oven to 350°F (175°C). Apply a light coating of softened butter or nonstick cooking spray to two 5.75-by-3-inch miniature loaf pans or four sections of an eight-cavity mini loaf pan.", "name": "Prepare the oven and pans. Preheat the oven to 350°F (175°C). Apply a light coating of softened butter or nonstick cooking spray to two 5.75-by-3-inch miniature loaf pans or four sections of an eight-cavity mini loaf pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/#wprm-recipe-39418-step-0-0"}, {"@type": "HowToStep", "text": "Blend the dry mixture. Place the flour, cinnamon, baking soda, nutmeg, salt, cloves, and ginger in a medium bowl. Stir thoroughly until the leavening and spices are distributed evenly and no concentrated streaks remain.", "name": "Blend the dry mixture. Place the flour, cinnamon, baking soda, nutmeg, salt, cloves, and ginger in a medium bowl. Stir thoroughly until the leavening and spices are distributed evenly and no concentrated streaks remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/#wprm-recipe-39418-step-0-1"}, {"@type": "HowToStep", "text": "Cream the butter and sugar. Add the softened butter and granulated sugar to a large mixing bowl. Using a hand mixer or a stand mixer fitted with the paddle attachment, beat on high speed for approximately 1 minute, or until the mixture becomes smooth and creamy. Scrape the sides and bottom of the bowl as necessary.", "name": "Cream the butter and sugar. Add the softened butter and granulated sugar to a large mixing bowl. Using a hand mixer or a stand mixer fitted with the paddle attachment, beat on high speed for approximately 1 minute, or until the mixture becomes smooth and creamy. Scrape the sides and bottom of the bowl as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/#wprm-recipe-39418-step-0-2"}, {"@type": "HowToStep", "text": "Incorporate the remaining wet ingredients. Scrape down the mixing bowl, then add the room-temperature egg, pumpkin purée, and vanilla extract. Beat until fully combined and the mixture appears smooth and lightly aerated.", "name": "Incorporate the remaining wet ingredients. Scrape down the mixing bowl, then add the room-temperature egg, pumpkin purée, and vanilla extract. Beat until fully combined and the mixture appears smooth and lightly aerated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/#wprm-recipe-39418-step-0-3"}, {"@type": "HowToStep", "text": "Form the batter. Reduce the mixer to low speed and gradually add the prepared dry mixture to the pumpkin mixture. Mix only until the flour is incorporated; excessive mixing may produce a firmer texture.", "name": "Form the batter. Reduce the mixer to low speed and gradually add the prepared dry mixture to the pumpkin mixture. Mix only until the flour is incorporated; excessive mixing may produce a firmer texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/#wprm-recipe-39418-step-0-4"}, {"@type": "HowToStep", "text": "Add the chocolate. Scrape the sides and bottom of the bowl with a rubber spatula to remove any hidden flour pockets. Gently fold in the semisweet chocolate chips until they are dispersed throughout the batter. A small portion may be retained for scattering over the tops.", "name": "Add the chocolate. Scrape the sides and bottom of the bowl with a rubber spatula to remove any hidden flour pockets. Gently fold in the semisweet chocolate chips until they are dispersed throughout the batter. A small portion may be retained for scattering over the tops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/#wprm-recipe-39418-step-0-5"}, {"@type": "HowToStep", "text": "Fill the pans. Divide the batter evenly among the prepared loaf pans or cavities. Smooth the surfaces and, when reserved, distribute the remaining chocolate chips over the batter.", "name": "Fill the pans. Divide the batter evenly among the prepared loaf pans or cavities. Smooth the surfaces and, when reserved, distribute the remaining chocolate chips over the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/#wprm-recipe-39418-step-0-6"}, {"@type": "HowToStep", "text": "Bake the loaves. Place the pans in the preheated oven and bake for 35–40 minutes. The breads are ready when a toothpick inserted into the center emerges clean. Should the tops darken too rapidly, loosely shield them with aluminum foil during the final 10 minutes.", "name": "Bake the loaves. Place the pans in the preheated oven and bake for 35–40 minutes. The breads are ready when a toothpick inserted into the center emerges clean. Should the tops darken too rapidly, loosely shield them with aluminum foil during the final 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/#wprm-recipe-39418-step-0-7"}, {"@type": "HowToStep", "text": "Cool completely. Allow the loaves to rest in their pans for 15 minutes. Carefully invert them onto a wire cooling rack and leave them there until fully cooled.", "name": "Cool completely. Allow the loaves to rest in their pans for 15 minutes. Carefully invert them onto a wire cooling rack and leave them there until fully cooled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pumpkin-bread-loaves/#wprm-recipe-39418-step-0-8"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Mini Pumpkin Bread Loaves"}</script>
