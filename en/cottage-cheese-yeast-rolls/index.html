    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Yeast Rolls", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, tender yeast rolls enriched with small-curd cottage cheese for a pleasantly light texture. The dough is gently kneaded, allowed to rise twice, and baked until beautifully golden.", "datePublished": "2022-09-14T16:29:57+00:00", "image": ["https://erecip.github.io/en/cottage-cheese-yeast-rolls/cottage-cheese-yeast-rolls.png", "https://erecip.github.io/en/cottage-cheese-yeast-rolls/cottage-cheese-yeast-rolls.png", "https://erecip.github.io/en/cottage-cheese-yeast-rolls/cottage-cheese-yeast-rolls.png", "https://erecip.github.io/en/cottage-cheese-yeast-rolls/cottage-cheese-yeast-rolls.png"], "prepTime": "PT25M", "cookTime": "PT15M", "totalTime": "PT40M", "recipeIngredient": ["1/4 cup white granulated sugar", "2 teaspoons salt", "1/2 cup water (warmed to 115°F)", "2 cups small-curd cottage cheese (warmed to 115°F for optimal dough texture)", "1/2 teaspoon baking soda", "4 1/2 teaspoons active dry yeast", "4 1/2 cups all-purpose flour (divided)", "2  large eggs (brought to room temperature for easier blending)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Stir the active dry yeast into the 1/2 cup of warm water measured at 115°F. Allow the yeast mixture to stand while the remaining ingredients are prepared.", "name": "Stir the active dry yeast into the 1/2 cup of warm water measured at 115°F. Allow the yeast mixture to stand while the remaining ingredients are prepared.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-0"}, {"@type": "HowToStep", "text": "Gently heat the small-curd cottage cheese until it reaches 115°F. Maintain this temperature so the cottage cheese incorporates properly into the yeast dough.", "name": "Gently heat the small-curd cottage cheese until it reaches 115°F. Maintain this temperature so the cottage cheese incorporates properly into the yeast dough.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-1"}, {"@type": "HowToStep", "text": "In the bowl of a stand mixer, combine the activated yeast mixture, warmed cottage cheese, eggs, granulated sugar, salt, baking soda, and 2 cups of the all-purpose flour.", "name": "In the bowl of a stand mixer, combine the activated yeast mixture, warmed cottage cheese, eggs, granulated sugar, salt, baking soda, and 2 cups of the all-purpose flour.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-2"}, {"@type": "HowToStep", "text": "Beat until the mixture becomes smooth and evenly combined.", "name": "Beat until the mixture becomes smooth and evenly combined.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-3"}, {"@type": "HowToStep", "text": "Add the remaining 2 1/2 cups of flour gradually, mixing until the dough gathers into a ball. The finished dough should remain slightly sticky.", "name": "Add the remaining 2 1/2 cups of flour gradually, mixing until the dough gathers into a ball. The finished dough should remain slightly sticky.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the dough to a lightly floured work surface. Knead for 6–8 minutes, continuing until the dough becomes smooth and elastic.", "name": "Transfer the dough to a lightly floured work surface. Knead for 6–8 minutes, continuing until the dough becomes smooth and elastic.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-5"}, {"@type": "HowToStep", "text": "Shape the kneaded dough into a ball and place it in a greased bowl. Turn the dough over once so the upper surface is lightly coated with grease.", "name": "Shape the kneaded dough into a ball and place it in a greased bowl. Turn the dough over once so the upper surface is lightly coated with grease.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-6"}, {"@type": "HowToStep", "text": "Cover the bowl with a clean cloth and leave the dough in a warm location for approximately 1 hour, or until it has doubled in volume.", "name": "Cover the bowl with a clean cloth and leave the dough in a warm location for approximately 1 hour, or until it has doubled in volume.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-7"}, {"@type": "HowToStep", "text": "Press down the risen dough to release the accumulated air.", "name": "Press down the risen dough to release the accumulated air.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-8"}, {"@type": "HowToStep", "text": "Portion the dough into 30 evenly sized pieces and shape each portion into a ball.", "name": "Portion the dough into 30 evenly sized pieces and shape each portion into a ball.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-9"}, {"@type": "HowToStep", "text": "Arrange the dough balls approximately 2 inches apart on a greased baking sheet.", "name": "Arrange the dough balls approximately 2 inches apart on a greased baking sheet.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-10"}, {"@type": "HowToStep", "text": "Cover the shaped rolls and allow them to rise for an additional 30 minutes, or until they have doubled in size once more.", "name": "Cover the shaped rolls and allow them to rise for an additional 30 minutes, or until they have doubled in size once more.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-11"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C).", "name": "Preheat the oven to 375°F (190°C).", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-12"}, {"@type": "HowToStep", "text": "Position the baking sheet on the center oven rack and bake the rolls for 12–15 minutes, or until their surfaces are golden brown.", "name": "Position the baking sheet on the center oven rack and bake the rolls for 12–15 minutes, or until their surfaces are golden brown.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-13"}, {"@type": "HowToStep", "text": "Remove the finished rolls from the oven and transfer them to a wire rack to cool before serving.", "name": "Remove the finished rolls from the oven and transfer them to a wire rack to cool before serving.", "url": "https://erecip.github.io/en/cottage-cheese-yeast-rolls/#wprm-recipe-46520-step-0-14"}], "recipeCategory": ["Bread"], "keywords": "Cottage Cheese Yeast Rolls"}</script>
