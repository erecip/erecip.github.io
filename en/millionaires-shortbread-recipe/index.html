    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Millionaires Shortbread Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A decadent layered treat featuring a buttery shortbread base, rich caramel center, and smooth chocolate topping with a delicate swirl.", "datePublished": "2024-08-25T08:43:24+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/millionaires-shortbread-recipe/Millionaires-Shortbread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/millionaires-shortbread-recipe/Millionaires-Shortbread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/millionaires-shortbread-recipe/Millionaires-Shortbread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/millionaires-shortbread-recipe/Millionaires-Shortbread-Recipe.png"], "prepTime": "PT40M", "cookTime": "PT40M", "totalTime": "PT200M", "recipeIngredient": ["200 g unsalted butter (softened)", "100 g icing sugar", "240 g plain flour", "2 teaspoons vanilla extract", "40 g corn flour", "1/4 teaspoon salt", "100 g unsalted butter", "1  tin condensed milk (approximately 397g)", "50 g granulated sugar", "50 g golden syrup", "1/4 teaspoon salt", "180 g dark chocolate (or milk chocolate, if preferred)", "80 g white chocolate"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat your oven to 180°C (350°F), grease an 8-inch square baking tin, and line it with parchment paper. In a mixing bowl, cream together the softened butter, icing sugar, and vanilla extract for about 5 minutes until light and fluffy. In another bowl, whisk together the plain flour, corn flour, and salt. Gradually incorporate the dry ingredients into the butter mixture and stir until a dough is formed. Press this dough evenly into the prepared tin, using damp hands to smooth the surface. Bake for 35 to 40 minutes, until the top turns a light golden shade, then remove from the oven and allow to cool completely.", "name": "Preheat your oven to 180°C (350°F), grease an 8-inch square baking tin, and line it with parchment paper. In a mixing bowl, cream together the softened butter, icing sugar, and vanilla extract for about 5 minutes until light and fluffy. In another bowl, whisk together the plain flour, corn flour, and salt. Gradually incorporate the dry ingredients into the butter mixture and stir until a dough is formed. Press this dough evenly into the prepared tin, using damp hands to smooth the surface. Bake for 35 to 40 minutes, until the top turns a light golden shade, then remove from the oven and allow to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/millionaires-shortbread-recipe/#wprm-recipe-13551-step-0-0"}, {"@type": "HowToStep", "text": "To prepare the caramel, combine the butter, condensed milk, sugar, and golden syrup in a large saucepan over low heat. Stir continuously until the butter has melted and the sugar is fully dissolved, with no visible granules remaining. Increase the heat slightly to medium, and while stirring constantly, cook until the mixture thickens and adopts a pale golden hue with a fudge-like consistency. Stir in the salt once it reaches the desired texture. Pour the caramel evenly over the cooled shortbread layer and let it sit for about 30 minutes to firm up.", "name": "To prepare the caramel, combine the butter, condensed milk, sugar, and golden syrup in a large saucepan over low heat. Stir continuously until the butter has melted and the sugar is fully dissolved, with no visible granules remaining. Increase the heat slightly to medium, and while stirring constantly, cook until the mixture thickens and adopts a pale golden hue with a fudge-like consistency. Stir in the salt once it reaches the desired texture. Pour the caramel evenly over the cooled shortbread layer and let it sit for about 30 minutes to firm up.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/millionaires-shortbread-recipe/#wprm-recipe-13551-step-0-1"}, {"@type": "HowToStep", "text": "Once the caramel is set, melt the dark and white chocolates separately using a microwave. Spread the melted dark chocolate over the caramel layer. Drizzle the white chocolate over the dark layer and use a skewer or knife to create a marbled effect. Allow the entire dessert to set either in the refrigerator for an hour or at room temperature overnight. Once firm, slice into squares and serve.", "name": "Once the caramel is set, melt the dark and white chocolates separately using a microwave. Spread the melted dark chocolate over the caramel layer. Drizzle the white chocolate over the dark layer and use a skewer or knife to create a marbled effect. Allow the entire dessert to set either in the refrigerator for an hour or at room temperature overnight. Once firm, slice into squares and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/millionaires-shortbread-recipe/#wprm-recipe-13551-step-0-2"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["British"], "keywords": "Millionaires Shortbread Recipe"}</script>
