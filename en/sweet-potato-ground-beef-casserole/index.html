ately 3–5 minutes, or until it begins to soften.", "name": "Warm the avocado oil in a large Dutch oven or heavy-bottomed skillet over medium-high heat. Add the chopped yellow onion and cook for approximately 3–5 minutes, or until it begins to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-1"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and ground beef. Break the meat into small pieces with a wooden spoon or spatula and continue cooking for several minutes, until the beef starts to brown thoroughly.", "name": "Stir in the minced garlic and ground beef. Break the meat into small pieces with a wooden spoon or spatula and continue cooking for several minutes, until the beef starts to brown thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-2"}, {"@type": "HowToStep", "text": "Add the diced sweet potatoes to the browned beef mixture. Season with the Italian seasoning, sea salt, and ground black pepper, then stir until the ingredients and seasonings are evenly distributed.", "name": "Add the diced sweet potatoes to the browned beef mixture. Season with the Italian seasoning, sea salt, and ground black pepper, then stir until the ingredients and seasonings are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-3"}, {"@type": "HowToStep", "text": "Cover the cooking vessel and continue cooking for 5–10 minutes, stirring periodically, until the sweet potato pieces begin to become tender.", "name": "Cover the cooking vessel and continue cooking for 5–10 minutes, stirring periodically, until the sweet potato pieces begin to become tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-4"}, {"@type": "HowToStep", "text": "Remove the lid and add the baby spinach to the beef and sweet potato mixture.", "name": "Remove the lid and add the baby spinach to the beef and sweet potato mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-5"}, {"@type": "HowToStep", "text": "Cover once more and cook for approximately 1–2 minutes, just long enough for the spinach leaves to wilt and blend into the filling.", "name": "Cover once more and cook for approximately 1–2 minutes, just long enough for the spinach leaves to wilt and blend into the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the cooked beef, sweet potato, and spinach mixture to a large casserole dish. Arrange the filling in an even layer to promote uniform baking.", "name": "Transfer the cooked beef, sweet potato, and spinach mixture to a large casserole dish. Arrange the filling in an even layer to promote uniform baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-7"}, {"@type": "HowToStep", "text": "Scatter 1½–2 cups of shredded cheese evenly across the surface.", "name": "Scatter 1½–2 cups of shredded cheese evenly across the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-8"}, {"@type": "HowToStep", "text": "Place the casserole on the center rack of the preheated oven. Bake for 15–25 minutes, or until the cheese has fully melted and reached the desired degree of browning.", "name": "Place the casserole on the center rack of the preheated oven. Bake for 15–25 minutes, or until the cheese has fully melted and reached the desired degree of browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-9"}, {"@type": "HowToStep", "text": "For a deeper golden finish, the casserole may be placed briefly under the broiler during the final couple of minutes. Watch it closely to prevent the cheese from burning.", "name": "For a deeper golden finish, the casserole may be placed briefly under the broiler during the final couple of minutes. Watch it closely to prevent the cheese from burning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-10"}, {"@type": "HowToStep", "text": "Remove the finished casserole from the oven and allow it to rest for several minutes before portioning into bowls and serving warm.", "name": "Remove the finished casserole from the oven and allow it to rest for several minutes before portioning into bowls and serving warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-ground-beef-casserole/#wprm-recipe-45993-step-0-11"}], "recipeCategory": ["Casserole", "Main Course"], "keywords": "Sweet Potato Ground Beef Casserole"}</script>
