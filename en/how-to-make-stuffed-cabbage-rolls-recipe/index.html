    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "How to make stuffed cabbage rolls recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A traditional dish that evokes memories of home-cooked meals, these cabbage rolls are baked in a rich tomato sauce and served with your choice of sides. For a more tender cabbage leaf, consider freezing the whole head overnight and allowing it to thaw before use, making the leaves pliable and easy to stuff without pre-cooking.", "datePublished": "2024-05-02T11:51:35+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-06T194831.218-1-1.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-06T194831.218-1-1-500x338.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/codifyformatter-2024-09-06T194831.218-1-1-480x270.png"], "recipeYield": ["6"], "prepTime": "PT37M", "cookTime": "PT65M", "totalTime": "PT102M", "recipeIngredient": ["1  head of green cabbage (approximately 12 large leaves)", "1 1/2 teaspoons salt (plus more for boiling water)", "1/2 cup finely chopped onion", "1 pound ground beef (lean (85% or less))", "1  large egg", "1/4 cup milk", "3/4 cup cooked rice", "1 teaspoon freshly ground black pepper", "1  can (14 1/2 ounces diced tomatoes, undrained)", "1  can (8 ounces tomato sauce)", "2 tablespoons cornstarch", "2 tablespoons white wine vinegar", "3 tablespoons sugar", "3/4 cup water (divided)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (180°C), setting the rack in the center position. Prepare a large pot of salted water and bring it to a boil.", "name": "Preheat the oven to 350°F (180°C), setting the rack in the center position. Prepare a large pot of salted water and bring it to a boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/how-to-make-stuffed-cabbage-rolls-recipe/#wprm-recipe-220-step-0-0"}, {"@type": "HowToStep", "text": "Separate 12 to 15 large leaves from the cabbage head and blanch them in the boiling water for about 3 minutes. Drain thoroughly and set aside.", "name": "Separate 12 to 15 large leaves from the cabbage head and blanch them in the boiling water for about 3 minutes. Drain thoroughly and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/how-to-make-stuffed-cabbage-rolls-recipe/#wprm-recipe-220-step-0-1"}, {"@type": "HowToStep", "text": "In a medium mixing bowl, combine the ground beef, cooked rice, chopped onion, egg, milk, 1 1/2 teaspoons of salt, and black pepper. Mix thoroughly and divide into 12 equal portions.", "name": "In a medium mixing bowl, combine the ground beef, cooked rice, chopped onion, egg, milk, 1 1/2 teaspoons of salt, and black pepper. Mix thoroughly and divide into 12 equal portions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/how-to-make-stuffed-cabbage-rolls-recipe/#wprm-recipe-220-step-0-2"}, {"@type": "HowToStep", "text": "Lay a cabbage leaf flat and place approximately 2 1/4 ounces of the beef mixture at the center. Roll the leaf around the filling, folding the edges in to secure it.", "name": "Lay a cabbage leaf flat and place approximately 2 1/4 ounces of the beef mixture at the center. Roll the leaf around the filling, folding the edges in to secure it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/how-to-make-stuffed-cabbage-rolls-recipe/#wprm-recipe-220-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the cabbage rolls seam-side down in a large baking dish or an oven-safe Dutch oven, securing each roll with toothpicks if needed.", "name": "Arrange the cabbage rolls seam-side down in a large baking dish or an oven-safe Dutch oven, securing each roll with toothpicks if needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/how-to-make-stuffed-cabbage-rolls-recipe/#wprm-recipe-220-step-0-4"}, {"@type": "HowToStep", "text": "To prepare the sauce, mix the diced tomatoes (with juice), tomato sauce, sugar, vinegar, and 1/2 cup of water in a bowl. Pour the sauce over the cabbage rolls.", "name": "To prepare the sauce, mix the diced tomatoes (with juice), tomato sauce, sugar, vinegar, and 1/2 cup of water in a bowl. Pour the sauce over the cabbage rolls.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/how-to-make-stuffed-cabbage-rolls-recipe/#wprm-recipe-220-step-0-5"}, {"@type": "HowToStep", "text": "Cover the baking dish with a lid or aluminum foil and bake in the preheated oven for about 1 hour, or until the cabbage is tender and the sauce is bubbling.", "name": "Cover the baking dish with a lid or aluminum foil and bake in the preheated oven for about 1 hour, or until the cabbage is tender and the sauce is bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/how-to-make-stuffed-cabbage-rolls-recipe/#wprm-recipe-220-step-0-6"}, {"@type": "HowToStep", "text": "Remove the toothpicks from the rolls and transfer them to a serving platter.", "name": "Remove the toothpicks from the rolls and transfer them to a serving platter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/how-to-make-stuffed-cabbage-rolls-recipe/#wprm-recipe-220-step-0-7"}, {"@type": "HowToStep", "text": "Pour the cooking juices from the baking dish into a saucepan and place it over medium heat. Dissolve the cornstarch in 1/4 cup of cold water, then gradually add the slurry to the saucepan, stirring constantly. Bring to a boil, reduce to a simmer, and continue to stir until the sauce reaches the desired thickness.", "name": "Pour the cooking juices from the baking dish into a saucepan and place it over medium heat. Dissolve the cornstarch in 1/4 cup of cold water, then gradually add the slurry to the saucepan, stirring constantly. Bring to a boil, reduce to a simmer, and continue to stir until the sauce reaches the desired thickness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/how-to-make-stuffed-cabbage-rolls-recipe/#wprm-recipe-220-step-0-8"}, {"@type": "HowToStep", "text": "Serve the cabbage rolls hot, topped with the thickened tomato sauce.", "name": "Serve the cabbage rolls hot, topped with the thickened tomato sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/how-to-make-stuffed-cabbage-rolls-recipe/#wprm-recipe-220-step-0-9"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Eastern European"], "keywords": "How to make stuffed cabbage rolls recipe"}</script>
