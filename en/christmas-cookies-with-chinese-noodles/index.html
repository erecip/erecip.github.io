    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies with Chinese Noodles", "author": {"@type": "Person", "name": "BenDes"}, "description": "These festive no-bake Christmas cookies combine crisp chow mein noodles, salted peanuts, creamy peanut butter, and sweet butterscotch chips. Shaped into rustic haystack-style clusters and finished with optional holiday sprinkles, they make a simple seasonal treat with plenty of crunch.", "datePublished": "2021-06-09T19:22:54+00:00", "image": ["https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/christmas-cookies-with-chinese-noodles1.png", "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/christmas-cookies-with-chinese-noodles1.png", "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/christmas-cookies-with-chinese-noodles1.png", "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/christmas-cookies-with-chinese-noodles1.png"], "prepTime": "PT15M", "totalTime": "PT75M", "recipeIngredient": ["2 cups crisp fried chow mein noodles (such as La Choy Crisp Chow Mein Noodles)", "1/2 cup smooth (creamy peanut butter, preferably Skippy or Jif)", "Festive sprinkles (as desired for decorating (optional))", "1 cup roasted salted peanuts", "1 cup butterscotch baking chips"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the crisp chow mein noodles and salted peanuts in a large mixing bowl. Gently toss them together until the peanuts are evenly dispersed throughout the noodles, then set the bowl aside.", "name": "Place the crisp chow mein noodles and salted peanuts in a large mixing bowl. Gently toss them together until the peanuts are evenly dispersed throughout the noodles, then set the bowl aside.", "url": "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/#wprm-recipe-46399-step-0-0"}, {"@type": "HowToStep", "text": "Add the butterscotch chips and creamy peanut butter to a separate heat-safe bowl. Melt the two ingredients together in the microwave or over a double boiler, using gentle heat only until fully melted. Avoid overheating the mixture.", "name": "Add the butterscotch chips and creamy peanut butter to a separate heat-safe bowl. Melt the two ingredients together in the microwave or over a double boiler, using gentle heat only until fully melted. Avoid overheating the mixture.", "url": "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/#wprm-recipe-46399-step-0-1"}, {"@type": "HowToStep", "text": "Whisk the melted butterscotch and peanut butter until the mixture becomes smooth and evenly blended. Pour it over the prepared noodles and peanuts.", "name": "Whisk the melted butterscotch and peanut butter until the mixture becomes smooth and evenly blended. Pour it over the prepared noodles and peanuts.", "url": "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/#wprm-recipe-46399-step-0-2"}, {"@type": "HowToStep", "text": "Using a silicone spatula, carefully fold and stir the ingredients until the chow mein noodles and peanuts are uniformly coated. Work gently so the noodles remain as intact as possible.", "name": "Using a silicone spatula, carefully fold and stir the ingredients until the chow mein noodles and peanuts are uniformly coated. Work gently so the noodles remain as intact as possible.", "url": "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/#wprm-recipe-46399-step-0-3"}, {"@type": "HowToStep", "text": "Line a baking tray with parchment paper or wax paper. Portion the mixture onto the prepared tray using a 2-tablespoon scoop. If using an ice cream scoop, handle the mixture carefully to prevent crushing the noodles. Two spoons—one larger and one smaller—may also be used to form the characteristic haystack shape.", "name": "Line a baking tray with parchment paper or wax paper. Portion the mixture onto the prepared tray using a 2-tablespoon scoop. If using an ice cream scoop, handle the mixture carefully to prevent crushing the noodles. Two spoons—one larger and one smaller—may also be used to form the characteristic haystack shape.", "url": "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/#wprm-recipe-46399-step-0-4"}, {"@type": "HowToStep", "text": "Immediately scatter optional festive sprinkles over each cookie cluster before the coating begins to firm.", "name": "Immediately scatter optional festive sprinkles over each cookie cluster before the coating begins to firm.", "url": "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/#wprm-recipe-46399-step-0-5"}, {"@type": "HowToStep", "text": "Leave the cookies undisturbed at room temperature for approximately 3–6 hours, or refrigerate them for about 1 hour, until completely firm and set.", "name": "Leave the cookies undisturbed at room temperature for approximately 3–6 hours, or refrigerate them for about 1 hour, until completely firm and set.", "url": "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/#wprm-recipe-46399-step-0-6"}, {"@type": "HowToStep", "text": "Once fully hardened, serve the Christmas noodle cookies.", "name": "Once fully hardened, serve the Christmas noodle cookies.", "url": "https://erecip.github.io/en/christmas-cookies-with-chinese-noodles/#wprm-recipe-46399-step-0-7"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Christmas Cookies with Chinese Noodles"}</script>
