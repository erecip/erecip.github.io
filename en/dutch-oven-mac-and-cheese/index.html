    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Dutch Oven Mac and Cheese", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, oven-baked macaroni and cheese featuring tender pasta coated in a creamy cheddar sauce and finished with a generous layer of mozzarella. The casserole is baked until bubbling, with a lightly golden cheese topping.", "datePublished": "2018-06-08T07:32:11+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/dutch-oven-mac-and-cheese1.png", "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/dutch-oven-mac-and-cheese1.png", "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/dutch-oven-mac-and-cheese1.png", "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/dutch-oven-mac-and-cheese1.png"], "cookTime": "PT25M", "totalTime": "PT25M", "recipeIngredient": ["4 cups freshly grated sharp cheddar cheese", "2 cups heavy cream", "2  garlic cloves (finely chopped, optional)", "½ cup all-purpose flour", "2 teaspoons salt (plus a small additional pinch if desired)", "2 cups whole milk", "½ cup unsalted butter (preferably a rich-flavored variety such as Kerrygold)", "Fresh herbs of choice (optional, such as thyme or chives)", "2  –3 cups mozzarella cheese (either cubed or shredded)", "1 pound dried pasta (such as elbow macaroni or cavatappi)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of water to a full boil. Add the dried pasta and cook it for 1 minute less than the package directions specify for al dente pasta.", "name": "Bring a large pot of water to a full boil. Add the dried pasta and cook it for 1 minute less than the package directions specify for al dente pasta.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-0"}, {"@type": "HowToStep", "text": "Drain the cooked pasta thoroughly in a strainer and reserve it for later.", "name": "Drain the cooked pasta thoroughly in a strainer and reserve it for later.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-1"}, {"@type": "HowToStep", "text": "While the pasta cooks, grate the cheddar and mozzarella cheeses and finely chop the garlic, if using.", "name": "While the pasta cooks, grate the cheddar and mozzarella cheeses and finely chop the garlic, if using.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-2"}, {"@type": "HowToStep", "text": "If using blocks of cheese, grate the cheddar and shred or cube the mozzarella. Finely chop the garlic cloves if they are being included in the recipe.", "name": "If using blocks of cheese, grate the cheddar and shred or cube the mozzarella. Finely chop the garlic cloves if they are being included in the recipe.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-3"}, {"@type": "HowToStep", "text": "Keep the prepared cheeses and garlic set aside until required.", "name": "Keep the prepared cheeses and garlic set aside until required.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-4"}, {"@type": "HowToStep", "text": "Using the same Dutch oven or large pot in which the pasta was cooked, melt the butter over medium heat.", "name": "Using the same Dutch oven or large pot in which the pasta was cooked, melt the butter over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-5"}, {"@type": "HowToStep", "text": "Add the chopped garlic, if using, and sauté it for approximately 1 minute, or just until fragrant.", "name": "Add the chopped garlic, if using, and sauté it for approximately 1 minute, or just until fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-6"}, {"@type": "HowToStep", "text": "Add the flour to the melted butter and whisk continuously. Cook for approximately 1–2 minutes, until the roux develops a wet-sand consistency and becomes lightly golden.", "name": "Add the flour to the melted butter and whisk continuously. Cook for approximately 1–2 minutes, until the roux develops a wet-sand consistency and becomes lightly golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-7"}, {"@type": "HowToStep", "text": "Gradually pour the heavy cream and whole milk into the roux while whisking continuously to keep the sauce smooth and free of lumps.", "name": "Gradually pour the heavy cream and whole milk into the roux while whisking continuously to keep the sauce smooth and free of lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-8"}, {"@type": "HowToStep", "text": "Continue cooking over medium heat, stirring frequently, until the liquid thickens into a smooth, creamy sauce.", "name": "Continue cooking over medium heat, stirring frequently, until the liquid thickens into a smooth, creamy sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-9"}, {"@type": "HowToStep", "text": "Stir in the salt along with any optional herbs being used.", "name": "Stir in the salt along with any optional herbs being used.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-10"}, {"@type": "HowToStep", "text": "Add the grated cheddar gradually, approximately one handful at a time. Stir thoroughly after each addition and allow the cheese to melt completely before adding the next portion.", "name": "Add the grated cheddar gradually, approximately one handful at a time. Stir thoroughly after each addition and allow the cheese to melt completely before adding the next portion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-11"}, {"@type": "HowToStep", "text": "If desired, incorporate a small additional pinch of salt once the cheddar has melted to enhance the cheese flavor.", "name": "If desired, incorporate a small additional pinch of salt once the cheddar has melted to enhance the cheese flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-12"}, {"@type": "HowToStep", "text": "Add the drained pasta directly to the hot cheese sauce. Stir gently until every piece of pasta is evenly coated.", "name": "Add the drained pasta directly to the hot cheese sauce. Stir gently until every piece of pasta is evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-13"}, {"@type": "HowToStep", "text": "If the Dutch oven is not being used for baking, transfer the macaroni and cheese mixture to a suitable baking dish.", "name": "If the Dutch oven is not being used for baking, transfer the macaroni and cheese mixture to a suitable baking dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-14"}, {"@type": "HowToStep", "text": "Distribute the cubed or shredded mozzarella evenly over the surface.", "name": "Distribute the cubed or shredded mozzarella evenly over the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-15"}, {"@type": "HowToStep", "text": "Bake at 350°F (175°C) for 25–30 minutes, or until the macaroni and cheese is bubbling and the mozzarella topping has begun to develop a light golden-brown color.", "name": "Bake at 350°F (175°C) for 25–30 minutes, or until the macaroni and cheese is bubbling and the mozzarella topping has begun to develop a light golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-16"}, {"@type": "HowToStep", "text": "For a more pronounced cheesy crust, allow the surface to become golden before removing the dish from the oven.", "name": "For a more pronounced cheesy crust, allow the surface to become golden before removing the dish from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-17"}, {"@type": "HowToStep", "text": "Let the macaroni and cheese cool for a few minutes before serving.", "name": "Let the macaroni and cheese cool for a few minutes before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-oven-mac-and-cheese/#wprm-recipe-45007-step-0-18"}], "recipeCategory": ["Casserole"], "recipeCuisine": ["American"], "keywords": "Dutch Oven Mac and Cheese"}</script>
