    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Teriyaki", "author": {"@type": "Person", "name": "BenDes"}, "description": "A savory and slightly sweet Japanese-inspired dish featuring tender chicken thighs simmered in a glossy, umami-rich glaze. Perfectly paired with fluffy steamed rice and crisp-tender broccoli for a well-balanced meal.", "datePublished": "2024-01-20T11:11:34+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/chicken-teriyaki-recipe.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/chicken-teriyaki-recipe.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/chicken-teriyaki-recipe.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/chicken-teriyaki-recipe.jpg"], "recipeYield": ["4"], "prepTime": "PT5M", "cookTime": "PT15M", "totalTime": "PT20M", "recipeIngredient": ["1 tablespoon neutral-flavored oil (such as vegetable or canola)", "1½ pounds of boneless chicken thighs (skin removed)", "1 teaspoon coarse kosher salt", "⅓ cup sweet rice wine (mirin)", "⅓ cup Japanese rice wine (sake)", "¼ cup soy sauce or gluten-free tamari", "¼ cup plain water", "2 tablespoons packed brown sugar (either light or dark)", "1 tablespoon cornstarch", "1  medium green onion (finely sliced (optional))", "Toasted white sesame seeds (for topping (optional))", "Steamed white rice and lightly cooked broccoli (to serve alongside)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm 1 tablespoon of neutral oil in a wide skillet (about 12 inches across) over medium-high heat until it begins to shimmer.", "name": "Warm 1 tablespoon of neutral oil in a wide skillet (about 12 inches across) over medium-high heat until it begins to shimmer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/#wprm-recipe-32302-step-0-0"}, {"@type": "HowToStep", "text": "While the oil heats, pat dry 1½ pounds of boneless, skinless chicken thighs using paper towels. Evenly sprinkle with 1 teaspoon of kosher salt.", "name": "While the oil heats, pat dry 1½ pounds of boneless, skinless chicken thighs using paper towels. Evenly sprinkle with 1 teaspoon of kosher salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/#wprm-recipe-32302-step-0-1"}, {"@type": "HowToStep", "text": "Arrange the chicken thighs in the skillet in one layer. Allow them to sear without moving until the underside is deeply golden brown, about 4 to 6 minutes.", "name": "Arrange the chicken thighs in the skillet in one layer. Allow them to sear without moving until the underside is deeply golden brown, about 4 to 6 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/#wprm-recipe-32302-step-0-2"}, {"@type": "HowToStep", "text": "As the chicken cooks, combine ⅓ cup mirin, ⅓ cup sake, ¼ cup soy sauce or tamari, ¼ cup water, and 2 tablespoons of packed brown sugar in a medium mixing bowl. Stir thoroughly until the sugar dissolves completely.", "name": "As the chicken cooks, combine ⅓ cup mirin, ⅓ cup sake, ¼ cup soy sauce or tamari, ¼ cup water, and 2 tablespoons of packed brown sugar in a medium mixing bowl. Stir thoroughly until the sugar dissolves completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/#wprm-recipe-32302-step-0-3"}, {"@type": "HowToStep", "text": "Scoop out 2 tablespoons of this sauce into a separate small bowl. Stir in 1 tablespoon of cornstarch until fully blended and no lumps remain.", "name": "Scoop out 2 tablespoons of this sauce into a separate small bowl. Stir in 1 tablespoon of cornstarch until fully blended and no lumps remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/#wprm-recipe-32302-step-0-4"}, {"@type": "HowToStep", "text": "Turn the chicken pieces over. Pour the remaining unsupplemented sauce into the pan. Let the liquid come to a boil, then reduce the heat to maintain an energetic simmer. Cook uncovered for another 5 to 10 minutes until the chicken is fully cooked through.", "name": "Turn the chicken pieces over. Pour the remaining unsupplemented sauce into the pan. Let the liquid come to a boil, then reduce the heat to maintain an energetic simmer. Cook uncovered for another 5 to 10 minutes until the chicken is fully cooked through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/#wprm-recipe-32302-step-0-5"}, {"@type": "HowToStep", "text": "Lower the heat to medium. Using tongs, remove the chicken and transfer it to a clean cutting board. Re-stir the cornstarch mixture briefly to recombine. While whisking the pan sauce constantly, drizzle in the cornstarch blend. Continue whisking as the sauce thickens, about 30 seconds. Remove from heat.", "name": "Lower the heat to medium. Using tongs, remove the chicken and transfer it to a clean cutting board. Re-stir the cornstarch mixture briefly to recombine. While whisking the pan sauce constantly, drizzle in the cornstarch blend. Continue whisking as the sauce thickens, about 30 seconds. Remove from heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/#wprm-recipe-32302-step-0-6"}, {"@type": "HowToStep", "text": "Slice the chicken into ½-inch-wide strips and place them in a shallow dish or serving bowl. Pour the thickened glaze over the sliced meat. Top with finely sliced scallion and a sprinkle of sesame seeds if using.", "name": "Slice the chicken into ½-inch-wide strips and place them in a shallow dish or serving bowl. Pour the thickened glaze over the sliced meat. Top with finely sliced scallion and a sprinkle of sesame seeds if using.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/#wprm-recipe-32302-step-0-7"}, {"@type": "HowToStep", "text": "Serve promptly with hot steamed rice and tender broccoli florets on the side.", "name": "Serve promptly with hot steamed rice and tender broccoli florets on the side.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-teriyaki-recipe/#wprm-recipe-32302-step-0-8"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Japanese"], "keywords": "chicken teriyaki recipe"}</script>
