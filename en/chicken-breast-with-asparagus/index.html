on juice into the skillet with the vegetables.", "name": "Pour the heavy cream and lemon juice into the skillet with the vegetables.", "url": "https://erecip.github.io/en/chicken-breast-with-asparagus/#wprm-recipe-46315-step-0-7"}, {"@type": "HowToStep", "text": "Stir in the grated Parmesan cheese until evenly incorporated.", "name": "Stir in the grated Parmesan cheese until evenly incorporated.", "url": "https://erecip.github.io/en/chicken-breast-with-asparagus/#wprm-recipe-46315-step-0-8"}, {"@type": "HowToStep", "text": "Continue stirring as the sauce heats, allowing the ingredients to blend thoroughly and the mixture to begin thickening.", "name": "Continue stirring as the sauce heats, allowing the ingredients to blend thoroughly and the mixture to begin thickening.", "url": "https://erecip.github.io/en/chicken-breast-with-asparagus/#wprm-recipe-46315-step-0-9"}, {"@type": "HowToStep", "text": "Return the cooked chicken breasts to the skillet and position them within the creamy sauce.", "name": "Return the cooked chicken breasts to the skillet and position them within the creamy sauce.", "url": "https://erecip.github.io/en/chicken-breast-with-asparagus/#wprm-recipe-46315-step-0-10"}, {"@type": "HowToStep", "text": "Allow everything to simmer gently for 3–4 minutes, until the sauce reaches a thicker consistency and the chicken is thoroughly reheated.", "name": "Allow everything to simmer gently for 3–4 minutes, until the sauce reaches a thicker consistency and the chicken is thoroughly reheated.", "url": "https://erecip.github.io/en/chicken-breast-with-asparagus/#wprm-recipe-46315-step-0-11"}, {"@type": "HowToStep", "text": "Taste the sauce and add additional salt or black pepper as necessary.", "name": "Taste the sauce and add additional salt or black pepper as necessary.", "url": "https://erecip.github.io/en/chicken-breast-with-asparagus/#wprm-recipe-46315-step-0-12"}, {"@type": "HowToStep", "text": "If the sauce becomes thicker than desired, stir in 1/4 cup water, chicken stock, or chicken broth until the preferred consistency is reached.", "name": "If the sauce becomes thicker than desired, stir in 1/4 cup water, chicken stock, or chicken broth until the preferred consistency is reached.", "url": "https://erecip.github.io/en/chicken-breast-with-asparagus/#wprm-recipe-46315-step-0-13"}, {"@type": "HowToStep", "text": "Once the chicken is hot and the sauce has thickened to the desired texture, remove the skillet from the heat.", "name": "Once the chicken is hot and the sauce has thickened to the desired texture, remove the skillet from the heat.", "url": "https://erecip.github.io/en/chicken-breast-with-asparagus/#wprm-recipe-46315-step-0-14"}, {"@type": "HowToStep", "text": "Serve the chicken breasts alongside the asparagus, spooning the warm lemon cream sauce generously over the top.", "name": "Serve the chicken breasts alongside the asparagus, spooning the warm lemon cream sauce generously over the top.", "url": "https://erecip.github.io/en/chicken-breast-with-asparagus/#wprm-recipe-46315-step-0-15"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian-Inspired"], "keywords": "Chicken Breast with Asparagus"}</script>
