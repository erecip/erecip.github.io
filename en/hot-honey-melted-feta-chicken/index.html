 set aside to cool. Alternatively, warm the mixture in a small saucepan until it just reaches a simmer, then remove it from the heat and allow it to cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hot-honey-melted-feta-chicken/#wprm-recipe-39105-step-0-0"}, {"@type": "HowToStep", "text": "Slice each chicken breast horizontally through the middle to produce four evenly sized cutlets.", "name": "Slice each chicken breast horizontally through the middle to produce four evenly sized cutlets.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hot-honey-melted-feta-chicken/#wprm-recipe-39105-step-0-1"}, {"@type": "HowToStep", "text": "Combine the paprika, salt, onion powder, garlic powder, dried oregano, cayenne pepper, and black pepper in a small bowl.", "name": "Combine the paprika, salt, onion powder, garlic powder, dried oregano, cayenne pepper, and black pepper in a small bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hot-honey-melted-feta-chicken/#wprm-recipe-39105-step-0-2"}, {"@type": "HowToStep", "text": "Arrange three wide, shallow dishes in a row and position a large tray at the end. Add the flour and half of the spice blend to the first dish. Pour the beaten eggs into the second dish. Place the panko breadcrumbs and the remaining spice mixture in the third dish.", "name": "Arrange three wide, shallow dishes in a row and position a large tray at the end. Add the flour and half of the spice blend to the first dish. Pour the beaten eggs into the second dish. Place the panko breadcrumbs and the remaining spice mixture in the third dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hot-honey-melted-feta-chicken/#wprm-recipe-39105-step-0-3"}, {"@type": "HowToStep", "text": "Working with one piece at a time, coat the chicken first in the seasoned flour, then dip it into the beaten egg. Press it firmly into the seasoned panko until every surface is generously covered. Transfer the breaded chicken to the prepared tray and repeat with the remaining pieces.", "name": "Working with one piece at a time, coat the chicken first in the seasoned flour, then dip it into the beaten egg. Press it firmly into the seasoned panko until every surface is generously covered. Transfer the breaded chicken to the prepared tray and repeat with the remaining pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hot-honey-melted-feta-chicken/#wprm-recipe-39105-step-0-4"}, {"@type": "HowToStep", "text": "Pour enough vegetable oil into a large frying pan to cover the base, then set the pan over medium-high heat. The oil is ready when a breadcrumb dropped into it immediately sizzles.", "name": "Pour enough vegetable oil into a large frying pan to cover the base, then set the pan over medium-high heat. The oil is ready when a breadcrumb dropped into it immediately sizzles.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hot-honey-melted-feta-chicken/#wprm-recipe-39105-step-0-5"}, {"@type": "HowToStep", "text": "Carefully add the chicken to the hot pan. Cook in two batches when necessary, adding more oil between batches as required. Fry each cutlet for 3–4 minutes per side, or until the coating is deeply golden and crisp and the chicken is white, piping hot, and fully cooked in the centre.", "name": "Carefully add the chicken to the hot pan. Cook in two batches when necessary, adding more oil between batches as required. Fry each cutlet for 3–4 minutes per side, or until the coating is deeply golden and crisp and the chicken is white, piping hot, and fully cooked in the centre.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hot-honey-melted-feta-chicken/#wprm-recipe-39105-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the fried chicken to a wire rack positioned over the tray.", "name": "Transfer the fried chicken to a wire rack positioned over the tray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hot-honey-melted-feta-chicken/#wprm-recipe-39105-step-0-7"}, {"@type": "HowToStep", "text": "Distribute the crumbled feta over the chicken, covering as much of each cutlet as possible. Place the chicken beneath a grill set to high and cook until the feta becomes buttery-soft and begins to develop a lightly golden, crisp surface.", "name": "Distribute the crumbled feta over the chicken, covering as much of each cutlet as possible. Place the chicken beneath a grill set to high and cook until the feta becomes buttery-soft and begins to develop a lightly golden, crisp surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hot-honey-melted-feta-chicken/#wprm-recipe-39105-step-0-8"}, {"@type": "HowToStep", "text": "Drizzle each portion with the desired amount of cooled hot honey before serving.", "name": "Drizzle each portion with the desired amount of cooled hot honey before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hot-honey-melted-feta-chicken/#wprm-recipe-39105-step-0-9"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"]}</script>
