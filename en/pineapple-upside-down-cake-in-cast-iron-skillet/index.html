    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pineapple Upside-Down Cake in a Cast-Iron Skillet", "author": {"@type": "Person", "name": "BenDes"}, "description": "This traditional pineapple upside-down cake is baked directly in an 8-inch cast-iron skillet. Pineapple rings and optional maraschino cherries rest in a buttery dark brown sugar syrup, while the tender buttermilk cake develops a rich caramelized finish during baking.", "datePublished": "2022-01-01T00:05:48+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/pineapple-upside-down-cake-in-cast-iron-skillet.png", "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/pineapple-upside-down-cake-in-cast-iron-skillet.png", "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/pineapple-upside-down-cake-in-cast-iron-skillet.png", "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/pineapple-upside-down-cake-in-cast-iron-skillet.png"], "cookTime": "PT45M", "totalTime": "PT55M", "recipeIngredient": ["½ cup firmly packed dark brown sugar (preferably Golden Barrel)", "4 tablespoons butter", "Maraschino cherries (optional)", "1  can pineapple rings (18–20 ounces, with the juice reserved)", "1 cup buttermilk", "2  large eggs (brought to room temperature)", "1½ teaspoons baking powder", "4 tablespoons cold butter", "½ teaspoon salt", "1 teaspoon pure vanilla extract", "1½ cups all-purpose flour", "1 cup packed light brown sugar (preferably Golden Barrel)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Place an 8-inch cast-iron skillet over medium-high heat.", "name": "Preheat the oven to 350°F (175°C). Place an 8-inch cast-iron skillet over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-0"}, {"@type": "HowToStep", "text": "Add 4 tablespoons of butter to the heated skillet. Pour in the reserved pineapple juice, then stir in the dark brown sugar. Cook while stirring continuously until the mixture reaches a boil and begins to thicken, approximately 5–7 minutes.", "name": "Add 4 tablespoons of butter to the heated skillet. Pour in the reserved pineapple juice, then stir in the dark brown sugar. Cook while stirring continuously until the mixture reaches a boil and begins to thicken, approximately 5–7 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-1"}, {"@type": "HowToStep", "text": "Remove the skillet from the heat. Carefully position the pineapple rings in the thickened syrup, beginning around the outside edge and working toward the center. Place a maraschino cherry inside each ring, if using.", "name": "Remove the skillet from the heat. Carefully position the pineapple rings in the thickened syrup, beginning around the outside edge and working toward the center. Place a maraschino cherry inside each ring, if using.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the skillet to the preheated oven while the cake batter is being prepared.", "name": "Transfer the skillet to the preheated oven while the cake batter is being prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-3"}, {"@type": "HowToStep", "text": "Place the cold butter in the bowl of a stand mixer or a large mixing bowl. Beat for approximately 1 minute, then add the light brown sugar. Continue mixing until the combination becomes pale, smooth, and creamy.", "name": "Place the cold butter in the bowl of a stand mixer or a large mixing bowl. Beat for approximately 1 minute, then add the light brown sugar. Continue mixing until the combination becomes pale, smooth, and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-4"}, {"@type": "HowToStep", "text": "Beat in the eggs individually, allowing each one to blend fully before adding the next. Add the vanilla extract and mix until evenly incorporated.", "name": "Beat in the eggs individually, allowing each one to blend fully before adding the next. Add the vanilla extract and mix until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-5"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk together the all-purpose flour, baking powder, and salt until uniformly distributed.", "name": "In a separate bowl, whisk together the all-purpose flour, baking powder, and salt until uniformly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-6"}, {"@type": "HowToStep", "text": "With the mixer operating on low speed, alternately add the flour mixture and buttermilk to the creamed butter mixture. Begin and finish with the dry ingredients. Mix only until the batter comes together to prevent the cake from becoming dense.", "name": "With the mixer operating on low speed, alternately add the flour mixture and buttermilk to the creamed butter mixture. Begin and finish with the dry ingredients. Mix only until the batter comes together to prevent the cake from becoming dense.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-7"}, {"@type": "HowToStep", "text": "Carefully remove the hot skillet from the oven. Spoon or pour the prepared batter evenly over the pineapple rings and syrup. Gently spread the surface so the fruit is fully covered.", "name": "Carefully remove the hot skillet from the oven. Spoon or pour the prepared batter evenly over the pineapple rings and syrup. Gently spread the surface so the fruit is fully covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-8"}, {"@type": "HowToStep", "text": "Return the skillet to the oven and bake for approximately 45 minutes. The cake is ready when the surface is golden and a toothpick inserted near the center comes out clean.", "name": "Return the skillet to the oven and bake for approximately 45 minutes. The cake is ready when the surface is golden and a toothpick inserted near the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-9"}, {"@type": "HowToStep", "text": "Remove the skillet from the oven and allow the cake to rest for 10 minutes.", "name": "Remove the skillet from the oven and allow the cake to rest for 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-10"}, {"@type": "HowToStep", "text": "Position a serving plate or platter wider than the skillet over its opening. Using oven protection, firmly hold the plate and skillet together, then turn them over in one swift, careful motion. Lift away the skillet.", "name": "Position a serving plate or platter wider than the skillet over its opening. Using oven protection, firmly hold the plate and skillet together, then turn them over in one swift, careful motion. Lift away the skillet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-11"}, {"@type": "HowToStep", "text": "Should any pineapple rings or caramelized syrup remain in the skillet, carefully transfer them back onto the surface of the cake.", "name": "Should any pineapple rings or caramelized syrup remain in the skillet, carefully transfer them back onto the surface of the cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-upside-down-cake-in-cast-iron-skillet/#wprm-recipe-40623-step-0-12"}], "recipeCategory": ["cake", "Dessert"], "recipeCuisine": ["American"], "keywords": "Pineapple Upside-Down Cake in a Cast-Iron Skillet"}</script>
