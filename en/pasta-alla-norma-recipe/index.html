    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pasta Alla Norma Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic Sicilian pasta delight, Pasta alla Norma harmonizes tender roasted eggplant with vibrant marinara and aromatic basil. This version highlights roasted, rather than fried, eggplant for a lighter yet deeply flavorful dish. Yields four hearty servings.", "datePublished": "2024-10-14T06:28:13+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pasta-alla-norma-recipe/Pasta-Alla-Norma-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pasta-alla-norma-recipe/Pasta-Alla-Norma-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pasta-alla-norma-recipe/Pasta-Alla-Norma-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/pasta-alla-norma-recipe/Pasta-Alla-Norma-Recipe.png"], "prepTime": "PT20M", "cookTime": "PT50M", "totalTime": "PT70M", "recipeIngredient": ["½ teaspoon dried oregano", "½ cup chopped fresh basil (plus extra small or torn leaves for garnish)", "½ to 1 teaspoon red pepper flakes (to taste (optional))", "2  medium eggplants (approximately 2 ¼ pounds total)", "8 ounces rigatoni (ziti, or spaghetti)", "¼ teaspoon fine salt (more as needed)", "1  batch Super Simple Marinara Sauce (or 2 cups (16 ounces) high-quality store-bought marinara)", "¼ cup plus 1 teaspoon extra-virgin olive oil", "¾ cup 1.5 ounces finely grated ricotta salata and/or Parmesan cheese"], "recipeInstructions": [{"@type": "HowToStep", "text": "If preparing homemade marinara, cook it according to its instructions, keeping it warm over low heat if done early. For store-bought sauce, warm it gently over medium-low heat as the pasta cooks. Preheat the oven to 425°F, positioning racks in the upper and lower thirds. Line two large, rimmed baking sheets with parchment paper for easy cleanup. Using a vegetable peeler, remove long alternating strips of the eggplant skin to create a striped effect, then cut the eggplants into ½-inch thick rounds, discarding the ends. Arrange the slices on the prepared baking sheets, brushing both sides with olive oil and seasoning with the salt and plenty of black pepper. Roast the eggplant until deeply golden and tender, about 35–45 minutes, turning after 20 minutes, then set aside. Meanwhile, bring a large pot of salted water to a boil and cook the pasta until al dente according to package instructions. Reserve about ½ cup of the pasta water before draining, then return the pasta to the pot. Combine the roasted eggplant with the marinara sauce, adding the remaining teaspoon of olive oil, fresh basil, and red pepper flakes if using. Crush the dried oregano between your fingers as you sprinkle it in. Fold the cooked pasta into the sauce along with a few tablespoons of the reserved pasta water. Incorporate about two-thirds of the grated cheese, reserving the rest for garnish, and adjust seasoning with more salt and pepper as needed. If the sauce appears too thick, loosen it with a bit more pasta water. Portion the pasta into four bowls, topping each with the remaining cheese and extra basil leaves. For additional richness, drizzle with a touch of olive oil. Store leftovers covered in the refrigerator for 4 to 5 days.", "name": "If preparing homemade marinara, cook it according to its instructions, keeping it warm over low heat if done early. For store-bought sauce, warm it gently over medium-low heat as the pasta cooks. Preheat the oven to 425°F, positioning racks in the upper and lower thirds. Line two large, rimmed baking sheets with parchment paper for easy cleanup. Using a vegetable peeler, remove long alternating strips of the eggplant skin to create a striped effect, then cut the eggplants into ½-inch thick rounds, discarding the ends. Arrange the slices on the prepared baking sheets, brushing both sides with olive oil and seasoning with the salt and plenty of black pepper. Roast the eggplant until deeply golden and tender, about 35–45 minutes, turning after 20 minutes, then set aside. Meanwhile, bring a large pot of salted water to a boil and cook the pasta until al dente according to package instructions. Reserve about ½ cup of the pasta water before draining, then return the pasta to the pot. Combine the roasted eggplant with the marinara sauce, adding the remaining teaspoon of olive oil, fresh basil, and red pepper flakes if using. Crush the dried oregano between your fingers as you sprinkle it in. Fold the cooked pasta into the sauce along with a few tablespoons of the reserved pasta water. Incorporate about two-thirds of the grated cheese, reserving the rest for garnish, and adjust seasoning with more salt and pepper as needed. If the sauce appears too thick, loosen it with a bit more pasta water. Portion the pasta into four bowls, topping each with the remaining cheese and extra basil leaves. For additional richness, drizzle with a touch of olive oil. Store leftovers covered in the refrigerator for 4 to 5 days.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pasta-alla-norma-recipe/#wprm-recipe-15232-step-0-0"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Pasta Alla Norma Recipe"}</script>
