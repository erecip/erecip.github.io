    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Spanakopita Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Delectably crisp and flavorful, these spinach and feta-filled spanakopita triangles are an elegant appetizer crafted with straightforward ingredients, ideal for home entertaining.", "datePublished": "2024-07-23T19:11:20+00:00", "image": ["https://erecip.github.io/en/spanakopita-recipe/Spanakopita-Recipe.png", "https://erecip.github.io/en/spanakopita-recipe/Spanakopita-Recipe.png", "https://erecip.github.io/en/spanakopita-recipe/Spanakopita-Recipe.png", "https://erecip.github.io/en/spanakopita-recipe/Spanakopita-Recipe.png"], "recipeYield": ["40", "40 triangles"], "prepTime": "PT30M", "cookTime": "PT25M", "totalTime": "PT55M", "recipeIngredient": ["½ teaspoon ground black pepper", "1 tablespoon olive oil", "6 tablespoons unsalted butter (melted)", "2 teaspoons dried dill", "5  garlic cloves (finely minced)", "1  medium red onion (diced)", "¼ cup finely chopped green onions (white and light green parts from approximately 5 stalks)", "1 ½ cups crumbled feta cheese (approximately 6 ounces)", "½ cup chopped fresh parsley (loosely packed)", "20  sheets phyllo pastry (approximately one sleeve, thawed)", "2 teaspoons freshly grated lemon zest", "16 ounces frozen spinach (thawed and thoroughly drained)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm the olive oil in a large skillet over medium heat and sauté the diced red onion until softened, about 5 minutes. Incorporate the minced garlic and dried dill, cooking for an additional 5 minutes until the mixture is tender and fragrant. Set aside to cool.", "name": "Warm the olive oil in a large skillet over medium heat and sauté the diced red onion until softened, about 5 minutes. Incorporate the minced garlic and dried dill, cooking for an additional 5 minutes until the mixture is tender and fragrant. Set aside to cool.", "url": "https://erecip.github.io/en/spanakopita-recipe/#wprm-recipe-11871-step-0-0"}, {"@type": "HowToStep", "text": "Extract as much moisture as possible from the thawed spinach until reduced to roughly one cup, then add it to the skillet with the onion mixture. Stir in the parsley, green onions, lemon zest, black pepper, and crumbled feta, mixing until evenly combined.", "name": "Extract as much moisture as possible from the thawed spinach until reduced to roughly one cup, then add it to the skillet with the onion mixture. Stir in the parsley, green onions, lemon zest, black pepper, and crumbled feta, mixing until evenly combined.", "url": "https://erecip.github.io/en/spanakopita-recipe/#wprm-recipe-11871-step-0-1"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F and prepare a baking sheet by lining it with parchment paper. On a clean work surface, unroll the phyllo pastry and slice into long strips measuring 2½ to 3 inches in width. Keep the unused pastry covered with a lightly damp towel to prevent drying.", "name": "Preheat the oven to 375°F and prepare a baking sheet by lining it with parchment paper. On a clean work surface, unroll the phyllo pastry and slice into long strips measuring 2½ to 3 inches in width. Keep the unused pastry covered with a lightly damp towel to prevent drying.", "url": "https://erecip.github.io/en/spanakopita-recipe/#wprm-recipe-11871-step-0-2"}, {"@type": "HowToStep", "text": "Place a single phyllo strip on the surface and lightly brush it with melted butter. Layer a second strip directly on top and repeat the brushing. Position a heaping tablespoon of filling in one corner of the strip, shaping it gently into a triangle. Fold this corner across to the opposing edge, then continue folding in a triangular motion until the end of the strip is reached.", "name": "Place a single phyllo strip on the surface and lightly brush it with melted butter. Layer a second strip directly on top and repeat the brushing. Position a heaping tablespoon of filling in one corner of the strip, shaping it gently into a triangle. Fold this corner across to the opposing edge, then continue folding in a triangular motion until the end of the strip is reached.", "url": "https://erecip.github.io/en/spanakopita-recipe/#wprm-recipe-11871-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the formed triangle onto the baking sheet and keep covered with a damp cloth while assembling the rest. Arrange triangles close together, leaving about half an inch of space between each.", "name": "Transfer the formed triangle onto the baking sheet and keep covered with a damp cloth while assembling the rest. Arrange triangles close together, leaving about half an inch of space between each.", "url": "https://erecip.github.io/en/spanakopita-recipe/#wprm-recipe-11871-step-0-4"}, {"@type": "HowToStep", "text": "Bake for 20 to 25 minutes until golden and crisp. Remove and let cool for 10 minutes before serving.", "name": "Bake for 20 to 25 minutes until golden and crisp. Remove and let cool for 10 minutes before serving.", "url": "https://erecip.github.io/en/spanakopita-recipe/#wprm-recipe-11871-step-0-5"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["Mediterranean"], "keywords": "Spanakopita Recipe"}</script>
