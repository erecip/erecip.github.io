ipes323/en/chicken-broccoli/#wprm-recipe-31243-step-0-4"}, {"@type": "HowToStep", "text": "Return the cooked chicken to the pan and toss to coat evenly with the sauce. Stir until everything is well combined and heated through.", "name": "Return the cooked chicken to the pan and toss to coat evenly with the sauce. Stir until everything is well combined and heated through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-broccoli/#wprm-recipe-31243-step-0-5"}, {"@type": "HowToStep", "text": "Finish with a sprinkle of sesame seeds, if using, and serve immediately.", "name": "Finish with a sprinkle of sesame seeds, if using, and serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-broccoli/#wprm-recipe-31243-step-0-6"}], "recipeCategory": ["Dinner"], "recipeCuisine": ["Chinese"], "keywords": "chicken broccoli"}</script>
