    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Tacos", "author": {"@type": "Person", "name": "BenDes"}, "description": "Succulent chicken thighs are marinated with bold spices and seared to perfection before being chopped and layered into warm corn tortillas. Finished with a refreshing blend of cilantro, onions, and jalapeños, and served with fresh lime, these tacos capture the flavor of authentic street food in every bite.", "datePublished": "2024-06-29T19:55:10+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-tacos/chicken-tacos1.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-tacos/chicken-tacos1.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-tacos/chicken-tacos1.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-tacos/chicken-tacos1.jpg"], "recipeYield": ["4"], "recipeIngredient": ["1 tablespoon extra virgin olive oil", "½ teaspoon ground cumin", "½ teaspoon chili powder", "Juice from 2 fresh limes", "1 pound of boneless (skinless chicken thighs)", "½ teaspoon smoked paprika", "½ teaspoon onion granules", "½ teaspoon sea salt", "1 teaspoon garlic powder", "Freshly ground black pepper (about ½ teaspoon)", "⅓ cup diced red or sweet onion", "Juice of 1 lime", "⅓ cup fresh cilantro (finely chopped)", "1  jalapeño pepper (minced)", "Salt and pepper to preference", "1  lime (sliced into 8 wedges)", "16  mini corn tortillas"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the chicken thighs in a large resealable plastic bag or a shallow bowl. Add the garlic powder, onion granules, cumin, paprika, chili powder, salt, pepper, lime juice, and olive oil. Seal the bag and massage to coat, or use tongs to mix if using a bowl. Let the mixture sit for up to 30 minutes to allow the flavors to infuse, or proceed immediately if pressed for time.", "name": "Place the chicken thighs in a large resealable plastic bag or a shallow bowl. Add the garlic powder, onion granules, cumin, paprika, chili powder, salt, pepper, lime juice, and olive oil. Seal the bag and massage to coat, or use tongs to mix if using a bowl. Let the mixture sit for up to 30 minutes to allow the flavors to infuse, or proceed immediately if pressed for time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-tacos/#wprm-recipe-32458-step-0-0"}, {"@type": "HowToStep", "text": "Warm a large skillet over medium to medium-high heat. Once heated, pour in a tablespoon of oil and arrange the chicken in the pan. Sear for approximately 12 to 14 minutes, flipping once halfway through, until the chicken is fully cooked. If using especially thick pieces, lower the heat to medium and extend cooking time up to 25 minutes, ensuring no pink remains.", "name": "Warm a large skillet over medium to medium-high heat. Once heated, pour in a tablespoon of oil and arrange the chicken in the pan. Sear for approximately 12 to 14 minutes, flipping once halfway through, until the chicken is fully cooked. If using especially thick pieces, lower the heat to medium and extend cooking time up to 25 minutes, ensuring no pink remains.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-tacos/#wprm-recipe-32458-step-0-1"}, {"@type": "HowToStep", "text": "As the chicken cooks, prepare the topping by combining the diced onion, chopped cilantro, minced jalapeño, and juice of one lime in a small mixing bowl. Add salt and pepper to taste and stir until evenly blended.", "name": "As the chicken cooks, prepare the topping by combining the diced onion, chopped cilantro, minced jalapeño, and juice of one lime in a small mixing bowl. Add salt and pepper to taste and stir until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-tacos/#wprm-recipe-32458-step-0-2"}, {"@type": "HowToStep", "text": "Once cooked, remove the chicken from the pan and allow it to rest for 10 minutes. Meanwhile, wipe the skillet clean with a damp cloth or paper towel and return it to medium-high or high heat. Place two tortillas stacked together in the skillet and heat until slight charring appears on the bottom. Flip and toast the other side. Continue this process with the remaining tortillas.", "name": "Once cooked, remove the chicken from the pan and allow it to rest for 10 minutes. Meanwhile, wipe the skillet clean with a damp cloth or paper towel and return it to medium-high or high heat. Place two tortillas stacked together in the skillet and heat until slight charring appears on the bottom. Flip and toast the other side. Continue this process with the remaining tortillas.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-tacos/#wprm-recipe-32458-step-0-3"}, {"@type": "HowToStep", "text": "Dice the rested chicken into bite-sized chunks.", "name": "Dice the rested chicken into bite-sized chunks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-tacos/#wprm-recipe-32458-step-0-4"}, {"@type": "HowToStep", "text": "To assemble, place one portion (approximately 1/8) of the chopped chicken onto each double-stacked tortilla. Spoon over a generous helping of the onion-cilantro topping and finish with a lime wedge on the side for squeezing just before eating.", "name": "To assemble, place one portion (approximately 1/8) of the chopped chicken onto each double-stacked tortilla. Spoon over a generous helping of the onion-cilantro topping and finish with a lime wedge on the side for squeezing just before eating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-tacos/#wprm-recipe-32458-step-0-5"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Mexican"], "keywords": "chicken tacos"}</script>
