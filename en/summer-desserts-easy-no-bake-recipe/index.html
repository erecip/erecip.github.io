e in the refrigerator for at least 2 hours, or let chill overnight for best results.", "name": "Transfer the mixture into a heat-safe bowl, cover it, and place in the refrigerator for at least 2 hours, or let chill overnight for best results.", "url": "https://erecip.github.io/en/summer-desserts-easy-no-bake-recipe/#wprm-recipe-12976-step-0-1"}, {"@type": "HowToStep", "text": "Once chilled, take the mixture from the fridge and whisk it again to ensure uniform consistency. Pour it into an ice cream maker and churn according to the machine’s specific instructions, typically taking 20 to 30 minutes. The resulting ice cream will have a soft, smooth texture.", "name": "Once chilled, take the mixture from the fridge and whisk it again to ensure uniform consistency. Pour it into an ice cream maker and churn according to the machine’s specific instructions, typically taking 20 to 30 minutes. The resulting ice cream will have a soft, smooth texture.", "url": "https://erecip.github.io/en/summer-desserts-easy-no-bake-recipe/#wprm-recipe-12976-step-0-2"}, {"@type": "HowToStep", "text": "For a firmer finish, move the churned ice cream into an airtight container and place it in the freezer for 2 to 4 hours.", "name": "For a firmer finish, move the churned ice cream into an airtight container and place it in the freezer for 2 to 4 hours.", "url": "https://erecip.github.io/en/summer-desserts-easy-no-bake-recipe/#wprm-recipe-12976-step-0-3"}, {"@type": "HowToStep", "text": "Store any remaining ice cream in the freezer, sealed in an airtight container, for up to one month. Allow the ice cream to rest at room temperature for a few minutes if it becomes too hard to scoop.", "name": "Store any remaining ice cream in the freezer, sealed in an airtight container, for up to one month. Allow the ice cream to rest at room temperature for a few minutes if it becomes too hard to scoop.", "url": "https://erecip.github.io/en/summer-desserts-easy-no-bake-recipe/#wprm-recipe-12976-step-0-4"}], "re
