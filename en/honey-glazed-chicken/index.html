    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Honey Glazed Chicken", "author": {"@type": "Person", "name": "BenDes"}, "description": "Succulent and richly flavored, these oven-baked chicken drumsticks are marinated in a savory-sweet glaze of honey, soy, and citrus. Finished with a luscious reduction and optional garnishes, they deliver bold flavor in every bite.", "datePublished": "2023-04-28T07:12:59+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/honey-glazed-chicken2.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/honey-glazed-chicken2.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/honey-glazed-chicken2.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/honey-glazed-chicken2.jpg"], "recipeYield": ["14", "14 drumsticks"], "prepTime": "PT360M", "cookTime": "PT50M", "totalTime": "PT410M", "recipeIngredient": ["2 tablespoons Dijon mustard", "¾ cup honey", "1 tablespoon fresh ginger (peeled and finely grated)", "4  large garlic cloves (minced or finely grated)", "5 pounds chicken drumsticks", "¼ cup orange juice", "½ cup soy sauce*", "Chives (chopped, for garnish (optional))", "Sesame seeds (for garnish (optional))"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a mixing bowl, combine the honey, soy sauce, orange juice, Dijon mustard, garlic, and ginger. Whisk until the marinade is smooth and homogeneous. Measure out and set aside ⅔ cup of this marinade; cover and refrigerate.", "name": "In a mixing bowl, combine the honey, soy sauce, orange juice, Dijon mustard, garlic, and ginger. Whisk until the marinade is smooth and homogeneous. Measure out and set aside ⅔ cup of this marinade; cover and refrigerate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/#wprm-recipe-31428-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the chicken drumsticks into a large resealable plastic bag or vacuum-seal bag. Pour in the remaining marinade, ensuring the drumsticks are well-coated. Remove excess air and seal tightly. Refrigerate for at least 6 hours or overnight, rotating the bag occasionally to redistribute the marinade.", "name": "Transfer the chicken drumsticks into a large resealable plastic bag or vacuum-seal bag. Pour in the remaining marinade, ensuring the drumsticks are well-coated. Remove excess air and seal tightly. Refrigerate for at least 6 hours or overnight, rotating the bag occasionally to redistribute the marinade.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/#wprm-recipe-31428-step-0-1"}, {"@type": "HowToStep", "text": "Preheat the oven to 400°F. Position the oven rack in the center. Line a rimmed baking sheet or a large roasting pan with parchment paper, trimmed to fit the pan without overhanging the edges.", "name": "Preheat the oven to 400°F. Position the oven rack in the center. Line a rimmed baking sheet or a large roasting pan with parchment paper, trimmed to fit the pan without overhanging the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/#wprm-recipe-31428-step-0-2"}, {"@type": "HowToStep", "text": "Arrange the marinated drumsticks on the prepared baking pan, placing them skin-side up and spaced apart to allow even cooking. Spoon enough marinade from the bag to coat the bottom of the pan, then discard any residual marinade.", "name": "Arrange the marinated drumsticks on the prepared baking pan, placing them skin-side up and spaced apart to allow even cooking. Spoon enough marinade from the bag to coat the bottom of the pan, then discard any residual marinade.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/#wprm-recipe-31428-step-0-3"}, {"@type": "HowToStep", "text": "Bake for 25 minutes. Turn the drumsticks over to skin-side down and continue baking for another 20 minutes. For a caramelized finish, flip the drumsticks skin-side up once more and broil on high for 3 to 4 minutes, or until the skins are deeply browned.", "name": "Bake for 25 minutes. Turn the drumsticks over to skin-side down and continue baking for another 20 minutes. For a caramelized finish, flip the drumsticks skin-side up once more and broil on high for 3 to 4 minutes, or until the skins are deeply browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/#wprm-recipe-31428-step-0-4"}, {"@type": "HowToStep", "text": "Meanwhile, pour the reserved marinade into a small saucepan. Bring it to a boil over medium heat, then lower the heat and let it simmer for approximately 7 minutes, or until the sauce becomes thickened and syrup-like. Remove from heat.", "name": "Meanwhile, pour the reserved marinade into a small saucepan. Bring it to a boil over medium heat, then lower the heat and let it simmer for approximately 7 minutes, or until the sauce becomes thickened and syrup-like. Remove from heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/#wprm-recipe-31428-step-0-5"}, {"@type": "HowToStep", "text": "Brush the baked chicken with the reduced glaze. Garnish with sesame seeds and chopped chives, if desired.", "name": "Brush the baked chicken with the reduced glaze. Garnish with sesame seeds and chopped chives, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/honey-glazed-chicken/#wprm-recipe-31428-step-0-6"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "honey glazed chicken"}</script>
