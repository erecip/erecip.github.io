p-0-4"}, {"@type": "HowToStep", "text": "Distribute the peach mixture evenly across the rolled dough. Beginning at one long edge, carefully roll the dough into a firm log.", "name": "Distribute the peach mixture evenly across the rolled dough. Beginning at one long edge, carefully roll the dough into a firm log.", "url": "https://erecip.github.io/en/peach-cobbler-rolls/#wprm-recipe-39681-step-0-5"}, {"@type": "HowToStep", "text": "Cut the log into 12 equal portions and arrange them in a greased baking dish. Cover the dish and allow the rolls to rise for another 30 minutes, or until visibly puffed.", "name": "Cut the log into 12 equal portions and arrange them in a greased baking dish. Cover the dish and allow the rolls to rise for another 30 minutes, or until visibly puffed.", "url": "https://erecip.github.io/en/peach-cobbler-rolls/#wprm-recipe-39681-step-0-6"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Bake the fully proofed rolls for approximately 25 minutes, until golden on top and completely baked through. Let them cool briefly before applying the frosting.", "name": "Preheat the oven to 350°F (175°C). Bake the fully proofed rolls for approximately 25 minutes, until golden on top and completely baked through. Let them cool briefly before applying the frosting.", "url": "https://erecip.github.io/en/peach-cobbler-rolls/#wprm-recipe-39681-step-0-7"}, {"@type": "HowToStep", "text": "Beat the softened cream cheese and butter together until creamy and uniform. Add the confectioners’ sugar and vanilla extract, then continue beating until the frosting is light, smooth, and easy to spread.", "name": "Beat the softened cream cheese and butter together until creamy and uniform. Add the confectioners’ sugar and vanilla extract, then continue beating until the frosting is light, smooth, and easy to spread.", "url": "https://erecip.github.io/en/peach-cobbler-rolls/#wprm-recipe-39681-step-0-8"}, {"@type": "HowToStep", "text": "Spread or drizzle the cream cheese frosting over the rolls while they are still warm for a softer, partially melted coating. For a thicker finish, allow the rolls to cool slightly longer before frosting. Serve warm.", "name": "Spread or drizzle the cream cheese frosting over the rolls while they are still warm for a softer, partially melted coating. For a thicker finish, allow the rolls to cool slightly longer before frosting. Serve warm.", "url": "https://erecip.github.io/en/peach-cobbler-rolls/#wprm-recipe-39681-step-0-9"}], "recipeCategory": ["Breakfast and Brunch", "Dessert"], "recipeCuisine": ["American"], "keywords": "Peach Cobbler Rolls"}</script>
