    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Oat Flour Pumpkin Muffins", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender pumpkin muffins made with finely ground rolled oats, naturally sweetened with honey, warmly spiced with cinnamon, ginger, nutmeg, and allspice, then finished with a smooth honey–cream cheese topping.", "datePublished": "2023-12-07T18:24:55+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/oat-flour-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/oat-flour-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/oat-flour-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/oat-flour-pumpkin-muffins2.png"], "prepTime": "PT15M", "cookTime": "PT20M", "totalTime": "PT40M", "recipeIngredient": ["1 cup canned pumpkin purée (such as Libby’s)", "1/4 teaspoon ground allspice", "2  medium eggs (brought to room temperature)", "1/2 teaspoon fine salt", "1/4 cup coconut oil (melted and allowed to cool)", "1 teaspoon baking powder", "1/2 cup honey (for natural sweetness and moisture)", "1/4 teaspoon ground nutmeg", "1 teaspoon vanilla extract", "2 cups rolled oats (finely blended into oat flour, or 1 3/4 cups prepared oat flour)", "1/2 teaspoon baking soda", "1/4 cup milk", "1/2 teaspoon ground ginger", "1 teaspoon ground cinnamon (preferably freshly ground)", "Water (as needed, for the two unused muffin-tin wells)", "1/2 teaspoon vanilla extract", "1/2 cup softened cream cheese", "2 tablespoons honey", "2  –3 tablespoons plain yogurt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-0"}, {"@type": "HowToStep", "text": "Place the 2 cups of rolled oats in a blender and process for approximately 1–2 minutes, or until they resemble flour while retaining a faintly textured consistency. Transfer the freshly prepared oat flour to a bowl and set it aside.", "name": "Place the 2 cups of rolled oats in a blender and process for approximately 1–2 minutes, or until they resemble flour while retaining a faintly textured consistency. Transfer the freshly prepared oat flour to a bowl and set it aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-1"}, {"@type": "HowToStep", "text": "Arrange 10 paper liners in a standard muffin pan. Pour water into the remaining two empty wells to encourage even baking and help prevent the outer muffins from becoming overly dry.", "name": "Arrange 10 paper liners in a standard muffin pan. Pour water into the remaining two empty wells to encourage even baking and help prevent the outer muffins from becoming overly dry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-2"}, {"@type": "HowToStep", "text": "In a large mixing bowl, thoroughly whisk together the pumpkin purée, cooled melted coconut oil, milk, honey, eggs, and vanilla extract.", "name": "In a large mixing bowl, thoroughly whisk together the pumpkin purée, cooled melted coconut oil, milk, honey, eggs, and vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-3"}, {"@type": "HowToStep", "text": "Continue whisking until the mixture appears smooth and uniform, with the eggs completely incorporated and the honey evenly dispersed throughout.", "name": "Continue whisking until the mixture appears smooth and uniform, with the eggs completely incorporated and the honey evenly dispersed throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-4"}, {"@type": "HowToStep", "text": "In a separate bowl, combine the oat flour with the baking powder, baking soda, cinnamon, ginger, nutmeg, allspice, and salt.", "name": "In a separate bowl, combine the oat flour with the baking powder, baking soda, cinnamon, ginger, nutmeg, allspice, and salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-5"}, {"@type": "HowToStep", "text": "Whisk the dry ingredients carefully so the spices and leavening agents are distributed evenly throughout the flour mixture.", "name": "Whisk the dry ingredients carefully so the spices and leavening agents are distributed evenly throughout the flour mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-6"}, {"@type": "HowToStep", "text": "Add the dry mixture to the bowl containing the wet ingredients. Using a spatula, fold the two mixtures together gently until they are nearly combined.", "name": "Add the dry mixture to the bowl containing the wet ingredients. Using a spatula, fold the two mixtures together gently until they are nearly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-7"}, {"@type": "HowToStep", "text": "Avoid excessive mixing, which can create a firmer muffin texture. Stop folding when only a few small traces of dry ingredients remain visible.", "name": "Avoid excessive mixing, which can create a firmer muffin texture. Stop folding when only a few small traces of dry ingredients remain visible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-8"}, {"@type": "HowToStep", "text": "Portion the batter equally between the 10 prepared muffin cups, filling each approximately three-quarters full.", "name": "Portion the batter equally between the 10 prepared muffin cups, filling each approximately three-quarters full.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the muffin pan to the preheated oven and bake for 18–20 minutes.", "name": "Transfer the muffin pan to the preheated oven and bake for 18–20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-10"}, {"@type": "HowToStep", "text": "The muffins are ready when their tops are golden and a toothpick inserted into the center comes out clean or carries only a few moist crumbs.", "name": "The muffins are ready when their tops are golden and a toothpick inserted into the center comes out clean or carries only a few moist crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-11"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and leave the muffins in the tin for 5 minutes. Transfer them to a wire cooling rack and allow them to cool completely before adding the topping.", "name": "Remove the pan from the oven and leave the muffins in the tin for 5 minutes. Transfer them to a wire cooling rack and allow them to cool completely before adding the topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-12"}, {"@type": "HowToStep", "text": "While the muffins are cooling, place the softened cream cheese, plain yogurt, honey, and vanilla extract in a bowl.", "name": "While the muffins are cooling, place the softened cream cheese, plain yogurt, honey, and vanilla extract in a bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-13"}, {"@type": "HowToStep", "text": "Whisk until the mixture becomes creamy, smooth, and free of lumps. Properly softened cream cheese will blend more evenly, while the yogurt contributes a light tang that complements the sweetness of the muffins.", "name": "Whisk until the mixture becomes creamy, smooth, and free of lumps. Properly softened cream cheese will blend more evenly, while the yogurt contributes a light tang that complements the sweetness of the muffins.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-14"}, {"@type": "HowToStep", "text": "After the muffins have cooled completely, spread or pipe the cream cheese mixture over the top of each one using a small spatula, knife, or piping bag.", "name": "After the muffins have cooled completely, spread or pipe the cream cheese mixture over the top of each one using a small spatula, knife, or piping bag.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-15"}, {"@type": "HowToStep", "text": "Serve the frosted muffins immediately, or place them in an airtight container and refrigerate for up to 3 days.", "name": "Serve the frosted muffins immediately, or place them in an airtight container and refrigerate for up to 3 days.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oat-flour-pumpkin-muffins/#wprm-recipe-41437-step-0-16"}], "recipeCategory": ["Breakfast", "Snack"], "recipeCuisine": ["American"], "keywords": "Oat Flour Pumpkin Muffins"}</script>
