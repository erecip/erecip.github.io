°F and prepare a baking sheet with parchment paper. Scatter the diced potatoes onto the tray, coat lightly with olive oil, and season generously with salt, pepper, smoked paprika, and red pepper flakes. Mix well to ensure even coating, then distribute evenly. Roast for 30 minutes until golden and crisp at the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/breakfast-burritos-recipe/#wprm-recipe-13578-step-0-0"}, {"@type": "HowToStep", "text": "Warm a grill pan over medium heat. Grill the red bell pepper for about 4 to 5 minutes per side until it becomes tender and blackened with grill marks. Alternatively, roast it in the oven until soft. Once cooked, remove the stem and seeds, then slice into thin strips.", "name": "Warm a grill pan over medium heat. Grill the red bell pepper for about 4 to 5 minutes per side until it becomes tender and blackened with grill marks. Alternatively, roast it in the oven until soft. Once cooked, remove the stem and seeds, then slice into thin strips.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/breakfast-burritos-recipe/#wprm-recipe-13578-step-0-1"}, {"@type": "HowToStep", "text": "To assemble the burritos, lay out the tortillas and layer each with fresh spinach and, if desired, shredded red cabbage. Add a portion of scrambled eggs, red pepper strips, black beans, pico de gallo, roasted potatoes, avocado slices, and cilantro. Season with salt and pepper and finish with a squeeze of lime juice. Fold the sides inward over the filling, then roll tightly from the bottom, tucking in the edges. Wrap in foil, cut, and serve with Cilantro Lime Dressing.", "name": "To assemble the burritos, lay out the tortillas and layer each with fresh spinach and, if desired, shredded red cabbage. Add a portion of scrambled eggs, red pepper strips, black beans, pico de gallo, roasted potatoes, avocado slices, and cilantro. Season with salt and pepper and finish with a squeeze of lime juice. Fold the sides inward over the filling, then roll tightly from the bottom, tucking in the edges. Wrap in foil, cut, and serve with Cilantro Lime Dressing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/breakfast-burritos-recipe/#wprm-recipe-13578-step-0-2"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Breakfast Burritos Recipe"}</script>
