    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Scones with Heavy Cream", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender pumpkin scones made with cold butter, pumpkin purée, warming spices, and heavy cream. Chilling the shaped dough before baking encourages a flaky texture and helps the wedges retain their form. A simple maple glaze adds a smooth, lightly sweet finish.", "datePublished": "2023-09-17T10:26:36+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/pumpkin-scones-with-heavy-cream1.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/pumpkin-scones-with-heavy-cream1-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/pumpkin-scones-with-heavy-cream1-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/pumpkin-scones-with-heavy-cream1-480x270.png"], "prepTime": "PT20M", "cookTime": "PT25M", "totalTime": "PT75M", "recipeIngredient": ["1/2 cup unsalted butter (thoroughly chilled and sliced into 1/2-inch cubes)", "3 tablespoons heavy whipping cream", "1/2 cup pumpkin purée (canned or homemade, such as Libby’s)", "2 teaspoons baking powder", "1  large egg (brought to room temperature)", "1/2 teaspoon fine salt", "1 1/2 teaspoons pure vanilla extract", "1 teaspoon pumpkin pie spice blend", "1/3 cup firmly packed light brown sugar", "2 cups all-purpose flour (plus a small amount for handling the dough)", "1 teaspoon ground cinnamon", "Additional heavy cream (for brushing the tops)", "Turbinado sugar (optional, for sprinkling)", "1 tablespoon maple syrup", "Small pinch of salt", "1 cup confectioners’ sugar", "1 1/2 tablespoons milk"], "recipeInstructions": [{"@type": "HowToStep", "text": "Cover a sheet tray with parchment paper and place it aside. The parchment will keep the scones from adhering to the pan and simplify cleanup.", "name": "Cover a sheet tray with parchment paper and place it aside. The parchment will keep the scones from adhering to the pan and simplify cleanup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, whisk the all-purpose flour with the brown sugar, baking powder, cinnamon, pumpkin pie spice, and salt until evenly distributed.", "name": "In a large mixing bowl, whisk the all-purpose flour with the brown sugar, baking powder, cinnamon, pumpkin pie spice, and salt until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-1"}, {"@type": "HowToStep", "text": "Add the chilled butter cubes to the flour mixture. Using a pastry blender or fork, work the butter into the dry ingredients until the pieces are approximately lentil-sized. Leave visible bits of butter throughout the mixture, as these help create a flaky finished texture.", "name": "Add the chilled butter cubes to the flour mixture. Using a pastry blender or fork, work the butter into the dry ingredients until the pieces are approximately lentil-sized. Leave visible bits of butter throughout the mixture, as these help create a flaky finished texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the pumpkin purée, room-temperature egg, vanilla extract, and 3 tablespoons of heavy cream until well blended.", "name": "In a separate bowl, whisk the pumpkin purée, room-temperature egg, vanilla extract, and 3 tablespoons of heavy cream until well blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-3"}, {"@type": "HowToStep", "text": "Pour the pumpkin mixture into the bowl containing the dry ingredients. Mix gently only until the ingredients come together. Avoid excessive stirring or kneading, which can make the scones less tender.", "name": "Pour the pumpkin mixture into the bowl containing the dry ingredients. Mix gently only until the ingredients come together. Avoid excessive stirring or kneading, which can make the scones less tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the soft dough directly to the parchment-lined tray. Pat it into a roughly 8-inch round. If the dough clings to your hands, lightly dust the surface and your hands with additional all-purpose flour.", "name": "Transfer the soft dough directly to the parchment-lined tray. Pat it into a roughly 8-inch round. If the dough clings to your hands, lightly dust the surface and your hands with additional all-purpose flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-5"}, {"@type": "HowToStep", "text": "Using a sharp knife or bench scraper, divide the round into 8 equal wedges. Carefully separate the pieces so there is space around each wedge on the baking tray.", "name": "Using a sharp knife or bench scraper, divide the round into 8 equal wedges. Carefully separate the pieces so there is space around each wedge on the baking tray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the entire tray to the freezer and chill the scone wedges for no less than 30 minutes. This resting period allows the dough to firm up, helping the scones maintain their shape and develop a flakier consistency during baking.", "name": "Transfer the entire tray to the freezer and chill the scone wedges for no less than 30 minutes. This resting period allows the dough to firm up, helping the scones maintain their shape and develop a flakier consistency during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-7"}, {"@type": "HowToStep", "text": "While the scones are chilling, heat the oven to 400°F (200°C).", "name": "While the scones are chilling, heat the oven to 400°F (200°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-8"}, {"@type": "HowToStep", "text": "Once the 30-minute chilling period is complete, remove the tray from the freezer. Lightly coat the top of each wedge with additional heavy cream.", "name": "Once the 30-minute chilling period is complete, remove the tray from the freezer. Lightly coat the top of each wedge with additional heavy cream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-9"}, {"@type": "HowToStep", "text": "If desired, scatter turbinado sugar over the cream-brushed surfaces to create a crisp, sparkling topping.", "name": "If desired, scatter turbinado sugar over the cream-brushed surfaces to create a crisp, sparkling topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-10"}, {"@type": "HowToStep", "text": "Place the tray in the preheated oven and bake for 25–28 minutes, or until the scones have developed a golden exterior and a toothpick inserted into the center comes out clean.", "name": "Place the tray in the preheated oven and bake for 25–28 minutes, or until the scones have developed a golden exterior and a toothpick inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-11"}, {"@type": "HowToStep", "text": "While the scones bake, whisk together the confectioners’ sugar, maple syrup, milk, and a small pinch of salt. Continue mixing until the glaze becomes smooth and fluid enough to drizzle.", "name": "While the scones bake, whisk together the confectioners’ sugar, maple syrup, milk, and a small pinch of salt. Continue mixing until the glaze becomes smooth and fluid enough to drizzle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-12"}, {"@type": "HowToStep", "text": "The glaze may be refrigerated while the scones finish baking.", "name": "The glaze may be refrigerated while the scones finish baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-13"}, {"@type": "HowToStep", "text": "Allow the baked scones to rest on the tray for 5–10 minutes. Drizzle the maple glaze over the still-warm scones before serving.", "name": "Allow the baked scones to rest on the tray for 5–10 minutes. Drizzle the maple glaze over the still-warm scones before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-scones-with-heavy-cream/#wprm-recipe-42326-step-0-14"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Pumpkin Scones with Heavy Cream"}</script>
