    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pork Tenderloin Fried Rice", "author": {"@type": "Person", "name": "BenDes"}, "description": "A savory fried rice dish made with chilled short-grain rice, browned pork tenderloin, tender vegetables, softly scrambled eggs, soy sauce, toasted sesame oil, butter, and sesame seeds.", "datePublished": "2023-05-16T09:36:55+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/pork-tenderloin-fried-rice.png", "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/pork-tenderloin-fried-rice.png", "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/pork-tenderloin-fried-rice.png", "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/pork-tenderloin-fried-rice.png"], "recipeIngredient": ["2 cups water", "1 tablespoon avocado (grapeseed, or similar cooking oil, optional)", "2 cups short-grain white rice", "1 pound pork tenderloin (cut into 1/2-inch pieces)", "1/4 cup green onions (sliced thinly, using mostly the white portions with some green)", "2  large eggs (lightly whisked)", "1/2 cup green peas (fresh or thawed if previously frozen)", "1  small yellow onion (cut into a fine dice)", "3  fresh garlic cloves (finely minced)", "5 tablespoons butter (divided)", "2  carrots (peeled and finely diced)", "1 teaspoon sesame seeds (or to taste)", "Salt and freshly ground pepper (as needed)", "3 tablespoons low-sodium soy sauce (plus additional to taste if desired)", "1 teaspoon toasted sesame oil (with more if preferred)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the short-grain white rice with 2 cups of water in an Instant Pot, rice cooker, or covered saucepan. Add the tablespoon of cooking oil if using.", "name": "Combine the short-grain white rice with 2 cups of water in an Instant Pot, rice cooker, or covered saucepan. Add the tablespoon of cooking oil if using.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-0"}, {"@type": "HowToStep", "text": "Cook according to the directions for the appliance being used, or prepare on the stovetop until the rice is tender.", "name": "Cook according to the directions for the appliance being used, or prepare on the stovetop until the rice is tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-1"}, {"@type": "HowToStep", "text": "Line a baking sheet with parchment paper and distribute the cooked rice across the surface in an even layer.", "name": "Line a baking sheet with parchment paper and distribute the cooked rice across the surface in an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-2"}, {"@type": "HowToStep", "text": "Refrigerate the rice for at least 1 hour. For a faster option, place it in the freezer for approximately 20 minutes. Cooling the rice before frying helps keep the grains separate and reduces clumping.", "name": "Refrigerate the rice for at least 1 hour. For a faster option, place it in the freezer for approximately 20 minutes. Cooling the rice before frying helps keep the grains separate and reduces clumping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-3"}, {"@type": "HowToStep", "text": "Cut the pork tenderloin into small, approximately 1/2-inch pieces.", "name": "Cut the pork tenderloin into small, approximately 1/2-inch pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-4"}, {"@type": "HowToStep", "text": "Finely mince the garlic. Peel the carrots and cut them into a small dice, then finely dice the yellow onion.", "name": "Finely mince the garlic. Peel the carrots and cut them into a small dice, then finely dice the yellow onion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-5"}, {"@type": "HowToStep", "text": "If frozen peas are being used, thaw them before cooking. Thinly slice the green onions, retaining primarily the white portions along with some of the green tops.", "name": "If frozen peas are being used, thaw them before cooking. Thinly slice the green onions, retaining primarily the white portions along with some of the green tops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-6"}, {"@type": "HowToStep", "text": "Have all prepared ingredients ready before beginning the stir-fry so they can be added quickly during cooking.", "name": "Have all prepared ingredients ready before beginning the stir-fry so they can be added quickly during cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-7"}, {"@type": "HowToStep", "text": "Place a very large skillet, wok, or griddle over medium heat and melt 1 tablespoon of the butter.", "name": "Place a very large skillet, wok, or griddle over medium heat and melt 1 tablespoon of the butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-8"}, {"@type": "HowToStep", "text": "Pour in the lightly beaten eggs and cook while stirring gently. Remove them from the heat while they are still slightly soft and just underdone, since they will finish cooking when returned to the fried rice.", "name": "Pour in the lightly beaten eggs and cook while stirring gently. Remove them from the heat while they are still slightly soft and just underdone, since they will finish cooking when returned to the fried rice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the eggs to a separate plate and reserve.", "name": "Transfer the eggs to a separate plate and reserve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-10"}, {"@type": "HowToStep", "text": "Raise the heat to medium-high and melt 1 tablespoon of butter in the same cooking vessel.", "name": "Raise the heat to medium-high and melt 1 tablespoon of butter in the same cooking vessel.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-11"}, {"@type": "HowToStep", "text": "Add the diced pork tenderloin. Cook while avoiding excessive stirring so the pork has an opportunity to develop browned surfaces.", "name": "Add the diced pork tenderloin. Cook while avoiding excessive stirring so the pork has an opportunity to develop browned surfaces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-12"}, {"@type": "HowToStep", "text": "When the pork is nearly cooked through, add the minced garlic and continue cooking for another couple of minutes.", "name": "When the pork is nearly cooked through, add the minced garlic and continue cooking for another couple of minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-13"}, {"@type": "HowToStep", "text": "Transfer the cooked pork and garlic to a plate.", "name": "Transfer the cooked pork and garlic to a plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-14"}, {"@type": "HowToStep", "text": "Melt another 1 tablespoon of butter in the pan. Add the diced carrots, yellow onion, and peas.", "name": "Melt another 1 tablespoon of butter in the pan. Add the diced carrots, yellow onion, and peas.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-15"}, {"@type": "HowToStep", "text": "Sauté the vegetables, stirring only from time to time, until they become tender and develop a light golden color.", "name": "Sauté the vegetables, stirring only from time to time, until they become tender and develop a light golden color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-16"}, {"@type": "HowToStep", "text": "Transfer the vegetables to the plate containing the pork.", "name": "Transfer the vegetables to the plate containing the pork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-17"}, {"@type": "HowToStep", "text": "Melt the final 2 tablespoons of butter in the pan.", "name": "Melt the final 2 tablespoons of butter in the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-18"}, {"@type": "HowToStep", "text": "Add the thoroughly chilled rice and arrange it in a uniform layer. Leave it undisturbed for a couple of minutes so that some of the rice along the bottom can become lightly crisp.", "name": "Add the thoroughly chilled rice and arrange it in a uniform layer. Leave it undisturbed for a couple of minutes so that some of the rice along the bottom can become lightly crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-19"}, {"@type": "HowToStep", "text": "Stir the rice and continue cooking until it is heated throughout.", "name": "Stir the rice and continue cooking until it is heated throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-20"}, {"@type": "HowToStep", "text": "Return the browned pork, garlic, cooked vegetables, and any accumulated juices from the plate to the pan. Stir thoroughly to distribute them through the rice.", "name": "Return the browned pork, garlic, cooked vegetables, and any accumulated juices from the plate to the pan. Stir thoroughly to distribute them through the rice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-21"}, {"@type": "HowToStep", "text": "Add the reserved scrambled eggs, sliced green onions, 3 tablespoons of soy sauce, 1 teaspoon of toasted sesame oil, and 1 teaspoon of sesame seeds.", "name": "Add the reserved scrambled eggs, sliced green onions, 3 tablespoons of soy sauce, 1 teaspoon of toasted sesame oil, and 1 teaspoon of sesame seeds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-22"}, {"@type": "HowToStep", "text": "Stir until all ingredients are evenly incorporated and completely heated through.", "name": "Stir until all ingredients are evenly incorporated and completely heated through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-23"}, {"@type": "HowToStep", "text": "Taste and season with salt and pepper as necessary. Add additional soy sauce or toasted sesame oil according to preference.", "name": "Taste and season with salt and pepper as necessary. Add additional soy sauce or toasted sesame oil according to preference.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-24"}, {"@type": "HowToStep", "text": "Serve the pork tenderloin fried rice warm.", "name": "Serve the pork tenderloin fried rice warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-fried-rice/#wprm-recipe-42755-step-0-25"}], "keywords": "Pork Tenderloin Fried Rice"}</script>
