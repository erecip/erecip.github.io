    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Fried Chicken", "author": {"@type": "Person", "name": "BenDes"}, "description": "A straightforward approach to achieving golden, crispy fried chicken with a juicy interior. This recipe relies on a time-saving wet batter and a strategic seasoning mix for maximum crunch and flavor.", "datePublished": "2023-06-04T17:49:50+00:00", "image": ["https://erecip.github.io/en/fried-chicken/fried-chicken2.jpg", "https://erecip.github.io/en/fried-chicken/fried-chicken2.jpg", "https://erecip.github.io/en/fried-chicken/fried-chicken2.jpg", "https://erecip.github.io/en/fried-chicken/fried-chicken2.jpg"], "recipeYield": ["6"], "prepTime": "PT180M", "cookTime": "PT15M", "totalTime": "PT195M", "recipeIngredient": ["3  bay leaves", "8  garlic cloves", "4 cups whole milk (or substitute with water)", "1/4 cup salt", "2 tablespoons black peppercorns", "3 pounds chicken drumsticks or thighs", "1 tablespoon garlic powder", "1/2 tablespoon cayenne pepper", "1 tablespoon baking powder", "2 cups cornstarch", "1 tablespoon black pepper", "1/2 tablespoon white pepper", "2 cups all-purpose flour (or gluten-free flour as an alternative)", "1 tablespoon onion powder", "1 tablespoon kosher salt", "1 cup seasoning mix (from above)", "1 cup cold water", "Neutral oil (for frying)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Using a sharp knife, carefully pierce the chicken pieces. Submerge the chicken in a brine made from milk (or water), salt, garlic, peppercorns, and bay leaves. Let it soak for 2–3 hours, or preferably overnight for optimal tenderness and flavor penetration.", "name": "Using a sharp knife, carefully pierce the chicken pieces. Submerge the chicken in a brine made from milk (or water), salt, garlic, peppercorns, and bay leaves. Let it soak for 2–3 hours, or preferably overnight for optimal tenderness and flavor penetration.", "url": "https://erecip.github.io/en/fried-chicken/#wprm-recipe-31013-step-0-0"}, {"@type": "HowToStep", "text": "In a large bowl, whisk together the flour, cornstarch, kosher salt, white pepper, black pepper, garlic powder, onion powder, cayenne pepper, and baking powder until thoroughly combined.", "name": "In a large bowl, whisk together the flour, cornstarch, kosher salt, white pepper, black pepper, garlic powder, onion powder, cayenne pepper, and baking powder until thoroughly combined.", "url": "https://erecip.github.io/en/fried-chicken/#wprm-recipe-31013-step-0-1"}, {"@type": "HowToStep", "text": "Take 1 cup from the prepared seasoning mix and combine it in a separate bowl with cold water. Stir until a smooth, lump-free batter forms.", "name": "Take 1 cup from the prepared seasoning mix and combine it in a separate bowl with cold water. Stir until a smooth, lump-free batter forms.", "url": "https://erecip.github.io/en/fried-chicken/#wprm-recipe-31013-step-0-2"}, {"@type": "HowToStep", "text": "After removing the chicken from the brine, spoon a few tablespoons of the brine into the dry seasoning mix. Use your hands to incorporate the liquid, forming small clumps and rough bits—these will enhance the texture of the crust.", "name": "After removing the chicken from the brine, spoon a few tablespoons of the brine into the dry seasoning mix. Use your hands to incorporate the liquid, forming small clumps and rough bits—these will enhance the texture of the crust.", "url": "https://erecip.github.io/en/fried-chicken/#wprm-recipe-31013-step-0-3"}, {"@type": "HowToStep", "text": "Dip each piece of chicken into the wet batter, allowing excess to drip off. Immediately coat the chicken in the dry seasoning mixture, pressing the mix firmly onto the surface to ensure full coverage. Set the coated chicken aside on a baking tray while preparing the oil.", "name": "Dip each piece of chicken into the wet batter, allowing excess to drip off. Immediately coat the chicken in the dry seasoning mixture, pressing the mix firmly onto the surface to ensure full coverage. Set the coated chicken aside on a baking tray while preparing the oil.", "url": "https://erecip.github.io/en/fried-chicken/#wprm-recipe-31013-step-0-4"}, {"@type": "HowToStep", "text": "In a heavy-bottomed pot, cast iron skillet, or Dutch oven, heat neutral oil to 350°F. Fry the chicken in batches for approximately 8–12 minutes, depending on the size of each piece, until the internal temperature registers at least 165°F.", "name": "In a heavy-bottomed pot, cast iron skillet, or Dutch oven, heat neutral oil to 350°F. Fry the chicken in batches for approximately 8–12 minutes, depending on the size of each piece, until the internal temperature registers at least 165°F.", "url": "https://erecip.github.io/en/fried-chicken/#wprm-recipe-31013-step-0-5"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "fried chicken"}</script>
