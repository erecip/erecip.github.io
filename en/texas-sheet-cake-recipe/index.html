    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Texas Sheet Cake Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "An exceptionally moist, decadently chocolate sheet cake crowned with a glossy, fudge-like frosting. This beloved classic is elevated with a few careful tweaks to ensure every bite is rich, tender, and utterly irresistible.", "datePublished": "2024-10-30T13:43:33+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/texas-sheet-cake-recipe/Texas-Sheet-Cake-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/texas-sheet-cake-recipe/Texas-Sheet-Cake-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/texas-sheet-cake-recipe/Texas-Sheet-Cake-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/texas-sheet-cake-recipe/Texas-Sheet-Cake-Recipe1.png"], "recipeYield": ["15", "15 slices"], "prepTime": "PT30M", "cookTime": "PT20M", "totalTime": "PT50M", "recipeIngredient": ["1 ½ cups 300 g granulated sugar", "1 teaspoon baking soda", "½ cup 125 g sour cream", "2 cups 250 g all-purpose flour", "¾ teaspoon salt", "½ teaspoon instant coffee (optional)", "1 teaspoon vanilla extract", "½ cup 100 g light brown sugar, firmly packed", "2  large eggs (room temperature)", "1 cup 226 g unsalted butter, cut into 8 pieces", "⅓ cup 33 g cocoa powder", "1 cup 235 ml water", "4 cups 500 g powdered sugar, sifted after measuring", "¾ teaspoon vanilla extract", "½ cup 113 g salted butter, cut into pieces", "1 cup toasted pecans (optional)", "6 Tablespoons natural cocoa powder", "6 Tablespoons whole milk"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat oven to 350°F (175°C) and generously grease and flour a 10x15 jelly roll pan or coat with baking spray. In a medium saucepan over low heat, combine butter, water, and cocoa powder, stirring occasionally until the butter is completely melted. Increase heat to medium and bring the mixture to a gentle boil, then remove from heat and let cool for 15–20 minutes. While the chocolate mixture cools, whisk together flour, granulated sugar, light brown sugar, baking soda, salt, and instant coffee in a large bowl. In a separate bowl, whisk together sour cream, eggs, and vanilla extract, then incorporate this into the dry ingredients until just blended. Stir the cooled chocolate mixture into the batter and mix until smooth and cohesive. Spread the batter evenly in the prepared pan and bake for 18–22 minutes or until a toothpick inserted in the center emerges clean or with a few moist crumbs. As the cake bakes, prepare the frosting by warming milk and butter in a medium saucepan over medium-low heat until the butter melts. Remove from heat, whisk in cocoa powder until fully incorporated, then add powdered sugar and vanilla, whisking until smooth and pourable. Immediately pour the warm frosting over the hot cake, then sprinkle with toasted pecans if desired. Allow the frosting to set for about an hour before slicing and serving.", "name": "Preheat oven to 350°F (175°C) and generously grease and flour a 10x15 jelly roll pan or coat with baking spray. In a medium saucepan over low heat, combine butter, water, and cocoa powder, stirring occasionally until the butter is completely melted. Increase heat to medium and bring the mixture to a gentle boil, then remove from heat and let cool for 15–20 minutes. While the chocolate mixture cools, whisk together flour, granulated sugar, light brown sugar, baking soda, salt, and instant coffee in a large bowl. In a separate bowl, whisk together sour cream, eggs, and vanilla extract, then incorporate this into the dry ingredients until just blended. Stir the cooled chocolate mixture into the batter and mix until smooth and cohesive. Spread the batter evenly in the prepared pan and bake for 18–22 minutes or until a toothpick inserted in the center emerges clean or with a few moist crumbs. As the cake bakes, prepare the frosting by warming milk and butter in a medium saucepan over medium-low heat until the butter melts. Remove from heat, whisk in cocoa powder until fully incorporated, then add powdered sugar and vanilla, whisking until smooth and pourable. Immediately pour the warm frosting over the hot cake, then sprinkle with toasted pecans if desired. Allow the frosting to set for about an hour before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/texas-sheet-cake-recipe/#wprm-recipe-50168-step-0-0"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Texas Sheet Cake Recipe"}</script>
