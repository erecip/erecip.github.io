n breasts on every side with salt, black pepper, garlic powder, dried oregano, and dried basil, making sure the seasonings are distributed evenly over the meat.", "name": "Season the chicken breasts on every side with salt, black pepper, garlic powder, dried oregano, and dried basil, making sure the seasonings are distributed evenly over the meat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-dill-recipe/#wprm-recipe-46472-step-0-1"}, {"@type": "HowToStep", "text": "Place a large oven-safe skillet over the heat and add the 2 tablespoons of butter together with the olive oil.", "name": "Place a large oven-safe skillet over the heat and add the 2 tablespoons of butter together with the olive oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-dill-recipe/#wprm-recipe-46472-step-0-2"}, {"@type": "HowToStep", "text": "After the butter has melted, stir in the honey until incorporated.", "name": "After the butter has melted, stir in the honey until incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-dill-recipe/#wprm-recipe-46472-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the seasoned chicken breasts in the skillet and sear for 2–3 minutes per side, allowing the exterior to brown. The chicken should remain partially uncooked at this point.", "name": "Arrange the seasoned chicken breasts in the skillet and sear for 2–3 minutes per side, allowing the exterior to brown. The chicken should remain partially uncooked at this point.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-dill-recipe/#wprm-recipe-46472-step-0-4"}, {"@type": "HowToStep", "text": "Remove the browned chicken from the skillet and transfer it to a plate.", "name": "Remove the browned chicken from the skillet and transfer it to a plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-dill-recipe/#wprm-recipe-46472-st
