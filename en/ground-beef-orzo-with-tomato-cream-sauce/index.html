rshire sauce. Bring the mixture to a gentle bubble, then cook uncovered for 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/ground-beef-orzo-with-tomato-cream-sauce/#wprm-recipe-43516-step-0-3"}, {"@type": "HowToStep", "text": "Stir during simmering. Mix the orzo frequently while it cooks to prevent the pasta from adhering to the bottom of the pot. Adjust the burner to medium or medium-low as necessary to maintain a steady, gentle simmer rather than a rapid boil. This allows the orzo to become tender without reducing the sauce too quickly.", "name": "Stir during simmering. Mix the orzo frequently while it cooks to prevent the pasta from adhering to the bottom of the pot. Adjust the burner to medium or medium-low as necessary to maintain a steady, gentle simmer rather than a rapid boil. This allows the orzo to become tender without reducing the sauce too quickly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/ground-beef-orzo-with-tomato-cream-sauce/#wprm-recipe-43516-step-0-4"}, {"@type": "HowToStep", "text": "Add the Parmesan and spinach. Remove the pot from the heat. Stir in the grated Parmesan and fresh spinach until evenly incorporated.", "name": "Add the Parmesan and spinach. Remove the pot from the heat. Stir in the grated Parmesan and fresh spinach until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/ground-beef-orzo-with-tomato-cream-sauce/#wprm-recipe-43516-step-0-5"}, {"@type": "HowToStep", "text": "Rest and season. Cover the pot and leave it undisturbed for 3–5 minutes. During this time, the sauce will thicken and the spinach will wilt. Taste and adjust with salt and black pepper as needed.", "name": "Rest and season. Cover the pot and leave it undisturbed for 3–5 minutes. During this time, the sauce will thicken and the spinach will wilt. Taste and adjust with salt and black pepper as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/ground-beef-orzo-with
