 then remove from the heat and set aside to cool.", "name": "In a large sauté pan, heat a drizzle of olive oil over medium-high heat. Add the chopped baby spinach and cook until wilted. Stir in the minced garlic, mix well, then remove from the heat and set aside to cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bundt-cake-breakfast-recipe/#wprm-recipe-668-step-0-1"}, {"@type": "HowToStep", "text": "In a separate skillet, add a little olive oil and cook the frozen shredded hash browns until they are lightly browned. Remove from heat and allow them to cool.", "name": "In a separate skillet, add a little olive oil and cook the frozen shredded hash browns until they are lightly browned. Remove from heat and allow them to cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bundt-cake-breakfast-recipe/#wprm-recipe-668-step-0-2"}, {"@type": "HowToStep", "text": "Begin layering your bundt cake. Place half of the diced sweet Hawaiian bread cubes in the bottom of the prepared bundt pan. Next, layer on the diced ham, green onions, sautéed spinach, browned hash browns, and 1 cup of the shredded cheese. Top with the remaining bread cubes.", "name": "Begin layering your bundt cake. Place half of the diced sweet Hawaiian bread cubes in the bottom of the prepared bundt pan. Next, layer on the diced ham, green onions, sautéed spinach, browned hash browns, and 1 cup of the shredded cheese. Top with the remaining bread cubes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bundt-cake-breakfast-recipe/#wprm-recipe-668-step-0-3"}, {"@type": "HowToStep", "text": "In a medium bowl, whisk together the eggs, low-fat milk, heavy cream, cumin, cayenne pepper, salt, and pepper until fully combined. Pour this egg mixture evenly over the layered bread and fillings in the bundt pan.", "name": "In a medium bowl, whisk together the eggs, low-fat milk, heavy cream, cumin, cayenne pepper, salt, and pepper until fully combined. Pour this egg mixture evenly over the layered bread and fillings in the bundt pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bundt-cake-breakfast-recipe/#wprm-recipe-668-step-0-4"}, {"@type": "HowToStep", "text": "Cover the bundt pan with aluminum foil and allow it to rest for 30 minutes to let the bread absorb the egg mixture.", "name": "Cover the bundt pan with aluminum foil and allow it to rest for 30 minutes to let the bread absorb the egg mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bundt-cake-breakfast-recipe/#wprm-recipe-668-step-0-5"}, {"@type": "HowToStep", "text": "Remove the foil and sprinkle the remaining shredded cheese over the top.", "name": "Remove the foil and sprinkle the remaining shredded cheese over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bundt-cake-breakfast-recipe/#wprm-recipe-668-step-0-6"}, {"@type": "HowToStep", "text": "Place in the preheated oven and bake for 40 minutes, or until the top is golden and the egg is set.", "name": "Place in the preheated oven and bake for 40 minutes, or until the top is golden and the egg is set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bundt-cake-breakfast-recipe/#wprm-recipe-668-step-0-7"}, {"@type": "HowToStep", "text": "Once baked, allow the bundt cake to cool slightly before slicing and serving.", "name": "Once baked, allow the bundt cake to cool slightly before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bundt-cake-breakfast-recipe/#wprm-recipe-668-step-0-8"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Bundt Cake Breakfast Recipe"}</script>
