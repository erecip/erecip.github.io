ep-0-0"}, {"@type": "HowToStep", "text": "Warm a non-stick griddle or a broad skillet over medium-high heat. Once thoroughly heated, lightly grease or butter the surface. If employing an electric griddle, maintain a temperature between 300°F and 350°F.", "name": "Warm a non-stick griddle or a broad skillet over medium-high heat. Once thoroughly heated, lightly grease or butter the surface. If employing an electric griddle, maintain a temperature between 300°F and 350°F.", "url": "https://erecip.github.io/en/pancake-mix-recipe/#wprm-recipe-26646-step-0-1"}, {"@type": "HowToStep", "text": "Without delay, ladle about ¼ cup of batter per pancake onto the prepared cooking surface. Let them cook undisturbed for approximately 2 minutes until bubbles emerge and the edges appear set. Gently flip and allow the other side to cook for an additional minute. Refrain from pressing the pancakes post-flip, as this compresses their airy texture and may cause raw batter to seep out. Transfer the cooked pancakes to a warm plate and repeat until all batter is used.", "name": "Without delay, ladle about ¼ cup of batter per pancake onto the prepared cooking surface. Let them cook undisturbed for approximately 2 minutes until bubbles emerge and the edges appear set. Gently flip and allow the other side to cook for an additional minute. Refrain from pressing the pancakes post-flip, as this compresses their airy texture and may cause raw batter to seep out. Transfer the cooked pancakes to a warm plate and repeat until all batter is used.", "url": "https://erecip.github.io/en/pancake-mix-recipe/#wprm-recipe-26646-step-0-2"}, {"@type": "HowToStep", "text": "Arrange a generous stack on a plate, finish with your preferred syrups, fruits, or toppings, and serve immediately.", "name": "Arrange a generous stack on a plate, finish with your preferred syrups, fruits, or toppings, and serve immediately.", "url": "https://erecip.github.io/en/pancake-mix-recipe/#wprm-recipe-26646-step-0-3"}], "recipeCat
