    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sourdough Milk Bread Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender, enriched loaf combining the richness of milk and egg with the tangzhong method for unparalleled softness.", "datePublished": "2024-09-12T06:42:57+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/Sourdough-Milk-Bread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/Sourdough-Milk-Bread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/Sourdough-Milk-Bread-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/Sourdough-Milk-Bread-Recipe.png"], "recipeYield": ["1", "1 loaf"], "prepTime": "PT25M", "cookTime": "PT35M", "totalTime": "PT1500M", "recipeIngredient": ["35 g water", "15 g sourdough starter", "35 g flour", "120 g whole milk", "24 g all-purpose or bread flour", "6 g salt", "1  large egg", "40 g granulated sugar", "55 g unsalted butter (room temperature)", "300 g strong all-purpose or bread flour", "12 g milk powder", "100 g whole milk", "All of the ripe sourdough starter (approx. 70g)"], "recipeInstructions": [{"@type": "HowToStep", "text": "The evening prior, combine the flour, water, and sourdough starter in a small bowl, stirring until no dry bits remain. Transfer this to a clean jar, loosely cover, and leave it to ferment in a warm place overnight until doubled in volume.", "name": "The evening prior, combine the flour, water, and sourdough starter in a small bowl, stirring until no dry bits remain. Transfer this to a clean jar, loosely cover, and leave it to ferment in a warm place overnight until doubled in volume.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-0"}, {"@type": "HowToStep", "text": "For the tangzhong, whisk together the flour and milk in a medium saucepan set over medium heat. Continue stirring constantly until the mixture thickens into a smooth paste. Remove from the heat and scrape the paste into the bowl of a stand mixer.", "name": "For the tangzhong, whisk together the flour and milk in a medium saucepan set over medium heat. Continue stirring constantly until the mixture thickens into a smooth paste. Remove from the heat and scrape the paste into the bowl of a stand mixer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-1"}, {"@type": "HowToStep", "text": "Pour the cold milk over the tangzhong to bring down its temperature. Add the granulated sugar, main dough flour, milk powder, egg, salt, and the fully ripe sourdough starter. Begin mixing on low speed until a rough dough forms.", "name": "Pour the cold milk over the tangzhong to bring down its temperature. Add the granulated sugar, main dough flour, milk powder, egg, salt, and the fully ripe sourdough starter. Begin mixing on low speed until a rough dough forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-2"}, {"@type": "HowToStep", "text": "Increase to medium speed and knead the dough for about 5 minutes until it starts to strengthen. Gradually incorporate the softened butter, adding a few pieces at a time, and continue kneading for an additional 10–12 minutes until the dough is elastic and pulls away cleanly from the sides of the bowl.", "name": "Increase to medium speed and knead the dough for about 5 minutes until it starts to strengthen. Gradually incorporate the softened butter, adding a few pieces at a time, and continue kneading for an additional 10–12 minutes until the dough is elastic and pulls away cleanly from the sides of the bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-3"}, {"@type": "HowToStep", "text": "Allow the dough to rest for 5 minutes, then perform a windowpane test by gently stretching a small portion; it should stretch thin without tearing, indicating proper gluten development.", "name": "Allow the dough to rest for 5 minutes, then perform a windowpane test by gently stretching a small portion; it should stretch thin without tearing, indicating proper gluten development.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-4"}, {"@type": "HowToStep", "text": "Place the dough in a lightly oiled bowl, cover, and allow it to rise in a warm area (around 77°F/25°C) for about 4 hours, or until it has expanded by roughly 50%. In cooler environments, create a warm, moist space by placing the dough in a switched-off oven with a bowl of hot water, refreshing the water as needed.", "name": "Place the dough in a lightly oiled bowl, cover, and allow it to rise in a warm area (around 77°F/25°C) for about 4 hours, or until it has expanded by roughly 50%. In cooler environments, create a warm, moist space by placing the dough in a switched-off oven with a bowl of hot water, refreshing the water as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-5"}, {"@type": "HowToStep", "text": "Once bulk fermentation is complete, refrigerate the dough for at least 30 minutes to firm it slightly, easing the shaping process.", "name": "Once bulk fermentation is complete, refrigerate the dough for at least 30 minutes to firm it slightly, easing the shaping process.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-6"}, {"@type": "HowToStep", "text": "Turn the dough out onto a lightly floured surface and gently deflate it. Weigh the dough and divide it into three equal portions, shaping each piece into a tight ball.", "name": "Turn the dough out onto a lightly floured surface and gently deflate it. Weigh the dough and divide it into three equal portions, shaping each piece into a tight ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-7"}, {"@type": "HowToStep", "text": "Using a rolling pin, flatten each ball into an elongated oval roughly 20cm (8 inches) long. Roll each oval up tightly, like a Swiss roll, then position the rolls seam side down into a greased or parchment-lined 9x5 inch loaf pan.", "name": "Using a rolling pin, flatten each ball into an elongated oval roughly 20cm (8 inches) long. Roll each oval up tightly, like a Swiss roll, then position the rolls seam side down into a greased or parchment-lined 9x5 inch loaf pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-8"}, {"@type": "HowToStep", "text": "Allow the shaped dough to rise once more in a warm spot (around 77°F/25°C) until doubled in size, which typically takes 3–4 hours depending on ambient temperature.", "name": "Allow the shaped dough to rise once more in a warm spot (around 77°F/25°C) until doubled in size, which typically takes 3–4 hours depending on ambient temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-9"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (180°C). Beat an egg with a tablespoon of water and gently brush this egg wash over the surface of the dough.", "name": "Preheat the oven to 350°F (180°C). Beat an egg with a tablespoon of water and gently brush this egg wash over the surface of the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-10"}, {"@type": "HowToStep", "text": "Bake for approximately 30–35 minutes, or until the loaf is deeply golden brown on top. If the bread darkens too quickly, tent it loosely with foil. When fully baked, the loaf should sound hollow when tapped underneath.", "name": "Bake for approximately 30–35 minutes, or until the loaf is deeply golden brown on top. If the bread darkens too quickly, tent it loosely with foil. When fully baked, the loaf should sound hollow when tapped underneath.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-11"}, {"@type": "HowToStep", "text": "Remove the bread from the pan and cool it completely on a wire rack before slicing.", "name": "Remove the bread from the pan and cool it completely on a wire rack before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sourdough-milk-bread-recipe/#wprm-recipe-49538-step-0-12"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Sourdough Milk Bread Recipe"}</script>
