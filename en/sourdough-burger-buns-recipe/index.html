    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sourdough Burger Buns Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, flavorful, and delightfully chewy, these sourdough hamburger buns are crafted using a vibrant sourdough starter and a handful of pantry staples. Prepare the dough in the morning and enjoy fresh, homemade buns by dinner.", "datePublished": "2024-09-09T12:47:29+00:00", "image": ["https://erecip.github.io/en/sourdough-burger-buns-recipe/Sourdough-Burger-Buns-Recipe.png", "https://erecip.github.io/en/sourdough-burger-buns-recipe/Sourdough-Burger-Buns-Recipe.png", "https://erecip.github.io/en/sourdough-burger-buns-recipe/Sourdough-Burger-Buns-Recipe.png", "https://erecip.github.io/en/sourdough-burger-buns-recipe/Sourdough-Burger-Buns-Recipe.png"], "recipeYield": ["6"], "prepTime": "PT10M", "cookTime": "PT30M", "totalTime": "PT400M", "recipeIngredient": ["5 teaspoons 25 g water", "3 tablespoons 25 g all-purpose flour", "2 teaspoons 10 g unfed sourdough starter", "1 ½ tablespoons 30 g honey", "¼ cup 50 g active sourdough starter", "1 ½ teaspoons 10 g salt", "3 cups 360 g all-purpose flour", "1 cup 240 g water", "1 tablespoon water", "1  egg", "sesame seeds (optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Feed the sourdough starter approximately 12 hours before dough preparation. In a clean jar, combine flour, water, and unfed starter. Mix thoroughly, loosely cover, and allow it to ferment at room temperature until doubled in size and bubbly. This mix yields a little more than needed to account for any transfer loss.", "name": "Feed the sourdough starter approximately 12 hours before dough preparation. In a clean jar, combine flour, water, and unfed starter. Mix thoroughly, loosely cover, and allow it to ferment at room temperature until doubled in size and bubbly. This mix yields a little more than needed to account for any transfer loss.", "url": "https://erecip.github.io/en/sourdough-burger-buns-recipe/#wprm-recipe-14028-step-0-0"}, {"@type": "HowToStep", "text": "To prepare the dough, combine flour, water, honey, salt, and the active sourdough starter in a large bowl. Stir with a spatula or by hand until all dry elements are incorporated. Cover and rest at room temperature for 30 minutes.", "name": "To prepare the dough, combine flour, water, honey, salt, and the active sourdough starter in a large bowl. Stir with a spatula or by hand until all dry elements are incorporated. Cover and rest at room temperature for 30 minutes.", "url": "https://erecip.github.io/en/sourdough-burger-buns-recipe/#wprm-recipe-14028-step-0-1"}, {"@type": "HowToStep", "text": "Perform three sets of stretch and folds at 30-minute intervals. Moisten your hand, lift one side of the dough, and fold it over itself. Rotate the bowl a quarter turn and repeat until a full rotation is complete, forming a taut dough ball. Cover after each round of folds. Alternatively, a stand mixer fitted with a dough hook can be used; knead on speed 3 for 8–10 minutes.", "name": "Perform three sets of stretch and folds at 30-minute intervals. Moisten your hand, lift one side of the dough, and fold it over itself. Rotate the bowl a quarter turn and repeat until a full rotation is complete, forming a taut dough ball. Cover after each round of folds. Alternatively, a stand mixer fitted with a dough hook can be used; knead on speed 3 for 8–10 minutes.", "url": "https://erecip.github.io/en/sourdough-burger-buns-recipe/#wprm-recipe-14028-step-0-2"}, {"@type": "HowToStep", "text": "Cover and allow the dough to rise until doubled in volume, typically around 6 hours at 72°F (22°C). Once risen, refrigerate for up to 2 days if deferring baking. If baking the same day, proceed directly to shaping.", "name": "Cover and allow the dough to rise until doubled in volume, typically around 6 hours at 72°F (22°C). Once risen, refrigerate for up to 2 days if deferring baking. If baking the same day, proceed directly to shaping.", "url": "https://erecip.github.io/en/sourdough-burger-buns-recipe/#wprm-recipe-14028-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the dough onto a lightly floured surface and divide into six equal pieces (112–115 g each). Shape each portion into a round ball, flour the tops lightly, and place onto a parchment-lined baking sheet. Cover with a kitchen towel and allow to rise for 1–2 hours until visibly puffy.", "name": "Transfer the dough onto a lightly floured surface and divide into six equal pieces (112–115 g each). Shape each portion into a round ball, flour the tops lightly, and place onto a parchment-lined baking sheet. Cover with a kitchen towel and allow to rise for 1–2 hours until visibly puffy.", "url": "https://erecip.github.io/en/sourdough-burger-buns-recipe/#wprm-recipe-14028-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C). Whisk together the egg and water, then brush the tops of the buns. Add sesame seeds if desired. Bake for approximately 25 minutes or until golden brown. Allow to cool before slicing.", "name": "Preheat the oven to 375°F (190°C). Whisk together the egg and water, then brush the tops of the buns. Add sesame seeds if desired. Bake for approximately 25 minutes or until golden brown. Allow to cool before slicing.", "url": "https://erecip.github.io/en/sourdough-burger-buns-recipe/#wprm-recipe-14028-step-0-5"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Sourdough Burger Buns Recipe"}</script>
