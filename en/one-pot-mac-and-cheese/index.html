rehand helps disperse them uniformly through the pasta and reduces the chance of clumping once they meet the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-mac-and-cheese/#wprm-recipe-45573-step-0-0"}, {"@type": "HowToStep", "text": "Add the 4 cups of water, elbow macaroni, and fine sea salt to a large pressure cooker or suitable pot. Stir in the prepared seasoning blend until it is distributed throughout the pasta.", "name": "Add the 4 cups of water, elbow macaroni, and fine sea salt to a large pressure cooker or suitable pot. Stir in the prepared seasoning blend until it is distributed throughout the pasta.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-mac-and-cheese/#wprm-recipe-45573-step-0-1"}, {"@type": "HowToStep", "text": "Add the unsalted butter, secure the lid, and bring the cooker to high pressure. Cook for 4 minutes.", "name": "Add the unsalted butter, secure the lid, and bring the cooker to high pressure. Cook for 4 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-mac-and-cheese/#wprm-recipe-45573-step-0-2"}, {"@type": "HowToStep", "text": "When the cooking time is complete, carefully release the pressure following the instructions provided for your pressure cooker.", "name": "When the cooking time is complete, carefully release the pressure following the instructions provided for your pressure cooker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-mac-and-cheese/#wprm-recipe-45573-step-0-3"}, {"@type": "HowToStep", "text": "Pour the evaporated milk directly into the cooked macaroni and stir thoroughly. The heat remaining in the pasta will warm the milk and begin forming the creamy sauce base.", "name": "Pour the evaporated milk directly into the cooked macaroni and stir thoroughly. The heat remaining in the pasta will warm the milk and begin forming the creamy sauce base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-mac-and-cheese/#wprm-recipe-45573-step-0-4"}, {"@type": "HowToStep", "text": "Add the freshly shredded mild cheddar gradually, about 1 cup at a time, stirring continuously after each addition until the cheese is fully melted before adding more.", "name": "Add the freshly shredded mild cheddar gradually, about 1 cup at a time, stirring continuously after each addition until the cheese is fully melted before adding more.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-mac-and-cheese/#wprm-recipe-45573-step-0-5"}, {"@type": "HowToStep", "text": "Add the shredded Monterey Jack and continue stirring until it has completely melted into the mixture and the sauce becomes smooth, silky, and evenly combined.", "name": "Add the shredded Monterey Jack and continue stirring until it has completely melted into the mixture and the sauce becomes smooth, silky, and evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-mac-and-cheese/#wprm-recipe-45573-step-0-6"}, {"@type": "HowToStep", "text": "Taste the macaroni and cheese and adjust the seasoning if necessary. Add additional salt if desired, along with freshly cracked black pepper to taste.", "name": "Taste the macaroni and cheese and adjust the seasoning if necessary. Add additional salt if desired, along with freshly cracked black pepper to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-mac-and-cheese/#wprm-recipe-45573-step-0-7"}, {"@type": "HowToStep", "text": "Serve immediately while the cheese sauce is warm and at its creamiest consistency.", "name": "Serve immediately while the cheese sauce is warm and at its creamiest consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/one-pot-mac-and-cheese/#wprm-recipe-45573-step-0-8"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "One Pot Mac and Cheese"}</script>
