    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Ham and Potato Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "This hearty ham and potato casserole combines partially cooked potatoes, savory diced ham, sharp cheddar cheese, and a creamy, seasoned sauce. Baked until bubbling and finished with an additional layer of melted cheddar, it makes a substantial and comforting oven-baked meal.", "datePublished": "2020-04-20T23:45:05+00:00", "image": ["https://erecip.github.io/en/ham-and-potato-casserole/ham-and-potato-casserole2.png", "https://erecip.github.io/en/ham-and-potato-casserole/ham-and-potato-casserole2.png", "https://erecip.github.io/en/ham-and-potato-casserole/ham-and-potato-casserole2.png", "https://erecip.github.io/en/ham-and-potato-casserole/ham-and-potato-casserole2.png"], "prepTime": "PT25M", "cookTime": "PT35M", "totalTime": "PT60M", "recipeIngredient": ["2 pounds potatoes (peeled and cut into cubes)", "1 cup sharp cheddar cheese (freshly grated, preferably a robust variety such as Cabot)", "2 cups lean ham (diced, approximately 12 ounces)", "3  garlic cloves (finely minced)", "½ teaspoon smoked paprika", "2 cups whole milk (gently warmed to help produce a smooth sauce)", "¾ teaspoon salt", "3 tablespoons unsalted butter (such as Kerrygold)", "1 teaspoon dried parsley", "¾ cup yellow onion (finely chopped for uniform cooking)", "½ teaspoon ground mustard", "3 tablespoons all-purpose flour", "½ teaspoon ground black pepper (preferably freshly ground)", "½ cup sharp cheddar cheese (grated)", "Fresh parsley (finely chopped, for finishing)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Peel the potatoes and cut them into pieces approximately ¾ inch in size. The prepared potatoes should measure a little more than 6 cups.", "name": "Peel the potatoes and cut them into pieces approximately ¾ inch in size. The prepared potatoes should measure a little more than 6 cups.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the potatoes to a medium saucepan and add enough water to cover them completely. Bring the water to a boil.", "name": "Transfer the potatoes to a medium saucepan and add enough water to cover them completely. Bring the water to a boil.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-1"}, {"@type": "HowToStep", "text": "Once boiling, cook the potatoes for only 5–6 minutes. They should begin to soften but should not become fully tender.", "name": "Once boiling, cook the potatoes for only 5–6 minutes. They should begin to soften but should not become fully tender.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-2"}, {"@type": "HowToStep", "text": "Drain the potatoes thoroughly and set them aside.", "name": "Drain the potatoes thoroughly and set them aside.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-3"}, {"@type": "HowToStep", "text": "Lightly grease a 9 × 13-inch baking dish or another oven-safe casserole dish with a 3–4-quart capacity.", "name": "Lightly grease a 9 × 13-inch baking dish or another oven-safe casserole dish with a 3–4-quart capacity.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-4"}, {"@type": "HowToStep", "text": "Place the warm, drained potatoes in the prepared dish. Add the diced ham and 1 cup, or approximately 100 grams, of grated sharp cheddar cheese.", "name": "Place the warm, drained potatoes in the prepared dish. Add the diced ham and 1 cup, or approximately 100 grams, of grated sharp cheddar cheese.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-5"}, {"@type": "HowToStep", "text": "Gently toss the ingredients until evenly distributed, then set the baking dish aside while preparing the sauce.", "name": "Gently toss the ingredients until evenly distributed, then set the baking dish aside while preparing the sauce.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-6"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F (191°C).", "name": "Preheat the oven to 375°F (191°C).", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-7"}, {"@type": "HowToStep", "text": "Melt the unsalted butter in a large skillet or saucepan over medium heat.", "name": "Melt the unsalted butter in a large skillet or saucepan over medium heat.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-8"}, {"@type": "HowToStep", "text": "Add the finely chopped onion and minced garlic. Cook for approximately 3 minutes, stirring occasionally, until the onion has softened.", "name": "Add the finely chopped onion and minced garlic. Cook for approximately 3 minutes, stirring occasionally, until the onion has softened.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-9"}, {"@type": "HowToStep", "text": "Add the salt, black pepper, smoked paprika, ground mustard, dried parsley, and all-purpose flour. Stir thoroughly until the seasonings are evenly incorporated and the flour has absorbed the available moisture.", "name": "Add the salt, black pepper, smoked paprika, ground mustard, dried parsley, and all-purpose flour. Stir thoroughly until the seasonings are evenly incorporated and the flour has absorbed the available moisture.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-10"}, {"@type": "HowToStep", "text": "Lower the heat, then gradually pour in the warmed whole milk while stirring continuously.", "name": "Lower the heat, then gradually pour in the warmed whole milk while stirring continuously.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-11"}, {"@type": "HowToStep", "text": "Allow the mixture to simmer for 3–5 minutes, or until it thickens to a gravy-like consistency.", "name": "Allow the mixture to simmer for 3–5 minutes, or until it thickens to a gravy-like consistency.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-12"}, {"@type": "HowToStep", "text": "Remove the sauce from the heat. Taste and, if necessary, adjust the salt, pepper, paprika, mustard, or parsley according to preference.", "name": "Remove the sauce from the heat. Taste and, if necessary, adjust the salt, pepper, paprika, mustard, or parsley according to preference.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-13"}, {"@type": "HowToStep", "text": "Pour the warm sauce evenly over the potato, ham, and cheese mixture in the baking dish.", "name": "Pour the warm sauce evenly over the potato, ham, and cheese mixture in the baking dish.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-14"}, {"@type": "HowToStep", "text": "Carefully toss the contents until the potatoes and ham are evenly coated with the sauce.", "name": "Carefully toss the contents until the potatoes and ham are evenly coated with the sauce.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-15"}, {"@type": "HowToStep", "text": "Cover the baking dish with aluminum foil and bake in the preheated oven for 30 minutes.", "name": "Cover the baking dish with aluminum foil and bake in the preheated oven for 30 minutes.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-16"}, {"@type": "HowToStep", "text": "Remove the foil after 30 minutes. Scatter the remaining ½ cup of grated cheddar cheese evenly over the casserole.", "name": "Remove the foil after 30 minutes. Scatter the remaining ½ cup of grated cheddar cheese evenly over the casserole.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-17"}, {"@type": "HowToStep", "text": "Return the uncovered dish to the oven and continue baking for another 5–10 minutes, until the cheese has fully melted and the sauce is bubbling around the edges.", "name": "Return the uncovered dish to the oven and continue baking for another 5–10 minutes, until the cheese has fully melted and the sauce is bubbling around the edges.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-18"}, {"@type": "HowToStep", "text": "Remove the finished casserole from the oven and garnish with freshly chopped parsley. Green onion, chives, or a drizzle of hot sauce may also be used as finishing garnishes.", "name": "Remove the finished casserole from the oven and garnish with freshly chopped parsley. Green onion, chives, or a drizzle of hot sauce may also be used as finishing garnishes.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-19"}, {"@type": "HowToStep", "text": "Serve the casserole while hot.", "name": "Serve the casserole while hot.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-20"}, {"@type": "HowToStep", "text": "Transfer leftovers to the refrigerator and store them for up to 1 week.", "name": "Transfer leftovers to the refrigerator and store them for up to 1 week.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-21"}, {"@type": "HowToStep", "text": "Reheat individual portions as desired. To warm the entire casserole, cover the baking dish with aluminum foil and place it in a 350°F (177°C) oven for approximately 20 minutes.", "name": "Reheat individual portions as desired. To warm the entire casserole, cover the baking dish with aluminum foil and place it in a 350°F (177°C) oven for approximately 20 minutes.", "url": "https://erecip.github.io/en/ham-and-potato-casserole/#wprm-recipe-43813-step-0-22"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["American"], "keywords": "Ham and Potato Casserole"}</script>
