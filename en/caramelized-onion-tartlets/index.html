    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Caramelized Onion Tartlets", "author": {"@type": "Person", "name": "BenDes"}, "description": "These savory caramelized onion tartlets combine a crisp, buttery pastry shell with a creamy filling of slow-cooked yellow onions, fresh thyme, garlic, eggs, cream, and nutty Gruyère cheese. The onions are cooked gradually until deeply golden, creating a rich sweetness that complements the flaky crust and melted cheese.", "datePublished": "2020-09-26T09:26:05+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/caramelized-onion-tartlets.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/caramelized-onion-tartlets-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/caramelized-onion-tartlets-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/caramelized-onion-tartlets-480x270.png"], "cookTime": "PT25M", "totalTime": "PT55M", "recipeIngredient": ["1 cup chilled unsalted butter (cut into small cubes)", "1/4 cup cornstarch", "3/4 cup ice-cold water (with additional water available if required)", "2 1/4 cups all-purpose flour (plus extra for dusting the work surface)", "3/4 teaspoon salt", "4 ounces Gruyère cheese (shredded)", "1  garlic clove (crushed)", "2  large eggs", "3  medium yellow onions (sliced thinly and evenly)", "1/4 cup heavy cream", "1 teaspoon fresh thyme (finely chopped)", "2 tablespoons unsalted butter", "4 teaspoons cornstarch (blended with 1/4 cup cold water)", "1/2 teaspoon freshly ground black pepper", "1/2 teaspoon salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the all-purpose flour, 1/4 cup cornstarch, and 3/4 teaspoon salt in a large mixing bowl, whisking until the dry ingredients are evenly distributed.", "name": "Combine the all-purpose flour, 1/4 cup cornstarch, and 3/4 teaspoon salt in a large mixing bowl, whisking until the dry ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-0"}, {"@type": "HowToStep", "text": "Add the cold, cubed unsalted butter. Work it into the flour mixture with a pastry cutter or fork until the texture resembles coarse crumbs.", "name": "Add the cold, cubed unsalted butter. Work it into the flour mixture with a pastry cutter or fork until the texture resembles coarse crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-1"}, {"@type": "HowToStep", "text": "Pour in the ice water gradually, approximately 2 tablespoons at a time, mixing gently after each addition. Continue only until the dough holds together when pressed and can be formed into a ball. Add a little additional ice water only when necessary.", "name": "Pour in the ice water gradually, approximately 2 tablespoons at a time, mixing gently after each addition. Continue only until the dough holds together when pressed and can be formed into a ball. Add a little additional ice water only when necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-2"}, {"@type": "HowToStep", "text": "Shape the dough into a flat disk and wrap it securely in plastic wrap. Refrigerate for at least 30 minutes and up to 1 hour. The wrapped dough may also be refrigerated for as long as 3 days.", "name": "Shape the dough into a flat disk and wrap it securely in plastic wrap. Refrigerate for at least 30 minutes and up to 1 hour. The wrapped dough may also be refrigerated for as long as 3 days.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-3"}, {"@type": "HowToStep", "text": "Before rolling, allow the refrigerated dough to rest at room temperature for approximately 15 minutes so it becomes easier to handle.", "name": "Before rolling, allow the refrigerated dough to rest at room temperature for approximately 15 minutes so it becomes easier to handle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-4"}, {"@type": "HowToStep", "text": "Melt 2 tablespoons of unsalted butter in a large, heavy-bottomed skillet over medium heat.", "name": "Melt 2 tablespoons of unsalted butter in a large, heavy-bottomed skillet over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-5"}, {"@type": "HowToStep", "text": "Add the thinly sliced yellow onions and cook for approximately 35–45 minutes, stirring frequently, until they become deeply golden and thoroughly caramelized.", "name": "Add the thinly sliced yellow onions and cook for approximately 35–45 minutes, stirring frequently, until they become deeply golden and thoroughly caramelized.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-6"}, {"@type": "HowToStep", "text": "If the onions begin browning too rapidly or appear likely to burn, lower the heat or add a small splash of water to the skillet.", "name": "If the onions begin browning too rapidly or appear likely to burn, lower the heat or add a small splash of water to the skillet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-7"}, {"@type": "HowToStep", "text": "Once the onions are fully caramelized, stir in 1/2 teaspoon salt, 1/2 teaspoon black pepper, the crushed garlic, and finely chopped fresh thyme.", "name": "Once the onions are fully caramelized, stir in 1/2 teaspoon salt, 1/2 teaspoon black pepper, the crushed garlic, and finely chopped fresh thyme.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-8"}, {"@type": "HowToStep", "text": "Continue cooking for 1 additional minute, stirring to distribute the seasonings evenly. Remove the skillet from the heat and allow the onion mixture to cool.", "name": "Continue cooking for 1 additional minute, stirring to distribute the seasonings evenly. Remove the skillet from the heat and allow the onion mixture to cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-9"}, {"@type": "HowToStep", "text": "In a large bowl, whisk together the eggs and heavy cream.", "name": "In a large bowl, whisk together the eggs and heavy cream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-10"}, {"@type": "HowToStep", "text": "In a separate small container, combine 4 teaspoons cornstarch with 1/4 cup cold water, stirring until completely smooth. Whisk this slurry into the egg and cream mixture.", "name": "In a separate small container, combine 4 teaspoons cornstarch with 1/4 cup cold water, stirring until completely smooth. Whisk this slurry into the egg and cream mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-11"}, {"@type": "HowToStep", "text": "Add the cooled caramelized onion mixture and whisk or stir until evenly incorporated.", "name": "Add the cooled caramelized onion mixture and whisk or stir until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-12"}, {"@type": "HowToStep", "text": "Fold in the shredded Gruyère cheese and mix thoroughly.", "name": "Fold in the shredded Gruyère cheese and mix thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-13"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F.", "name": "Preheat the oven to 375°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-14"}, {"@type": "HowToStep", "text": "Lightly coat a clean work surface with all-purpose flour. Place the chilled pastry dough on the prepared surface and roll it into an approximately 14-inch circle.", "name": "Lightly coat a clean work surface with all-purpose flour. Place the chilled pastry dough on the prepared surface and roll it into an approximately 14-inch circle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-15"}, {"@type": "HowToStep", "text": "Cut rounds from the pastry with a 3-inch circular cookie cutter or a glass of comparable diameter.", "name": "Cut rounds from the pastry with a 3-inch circular cookie cutter or a glass of comparable diameter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-16"}, {"@type": "HowToStep", "text": "Collect the remaining pastry scraps, gently roll them out again, and cut additional rounds as necessary.", "name": "Collect the remaining pastry scraps, gently roll them out again, and cut additional rounds as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-17"}, {"@type": "HowToStep", "text": "Carefully press each pastry circle into an individual well of a mini muffin pan, forming small tartlet shells.", "name": "Carefully press each pastry circle into an individual well of a mini muffin pan, forming small tartlet shells.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-18"}, {"@type": "HowToStep", "text": "Spoon approximately 1 tablespoon of the caramelized onion filling into each pastry shell.", "name": "Spoon approximately 1 tablespoon of the caramelized onion filling into each pastry shell.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-19"}, {"@type": "HowToStep", "text": "Transfer the filled tartlets to the preheated oven and bake for 25–30 minutes, or until the pastry has developed a golden color and the centers are completely set.", "name": "Transfer the filled tartlets to the preheated oven and bake for 25–30 minutes, or until the pastry has developed a golden color and the centers are completely set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-20"}, {"@type": "HowToStep", "text": "Allow the tartlets to cool in the pan until they are comfortable to handle. Carefully remove each tartlet from the mini muffin tray.", "name": "Allow the tartlets to cool in the pan until they are comfortable to handle. Carefully remove each tartlet from the mini muffin tray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-21"}, {"@type": "HowToStep", "text": "Serve the caramelized onion tartlets warm or at room temperature.", "name": "Serve the caramelized onion tartlets warm or at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onion-tartlets/#wprm-recipe-39235-step-0-22"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["European"], "keywords": "Dough Chilling Time"}</script>
