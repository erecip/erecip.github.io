    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Apple Turnovers with Phyllo Dough", "author": {"@type": "Person", "name": "BenDes"}, "description": "Delicate layers of buttery phyllo pastry surround a warmly spiced apple filling made with sweet and tart apples, brown sugar, cinnamon, nutmeg, and vanilla. Once baked, the turnovers become crisp and golden while the interior remains tender and lightly caramelized. Powdered sugar, caramel sauce, and vanilla ice cream may be added for serving.", "datePublished": "2019-12-29T14:50:14+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/apple-turnovers-with-phyllo-dough.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/apple-turnovers-with-phyllo-dough.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/apple-turnovers-with-phyllo-dough.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/apple-turnovers-with-phyllo-dough.png"], "cookTime": "PT15M", "totalTime": "PT20M", "recipeIngredient": ["3  medium apples (preferably 2 sweet varieties such as Honeycrisp or Pink Lady and 1 tart Granny Smith)", "1/4 cup packed light brown sugar", "2 teaspoons ground cinnamon", "1 teaspoon pure vanilla extract", "4 tablespoons salted butter (melted and divided)", "1 teaspoon freshly squeezed lemon juice", "1/2 teaspoon ground nutmeg (preferably freshly grated)", "2 tablespoons granulated sugar", "1 teaspoon cornstarch", "1 tablespoon water", "12  thawed sheets phyllo dough", "Parchment paper or a silicone baking mat", "Vanilla ice cream", "1/3 cup powdered sugar (sifted)", "Caramel sauce"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Melt the 4 tablespoons of salted butter in a large skillet over medium-low heat. Once fully melted, remove the skillet from the heat and transfer 3 tablespoons of the butter to a separate bowl. Keep the remaining 1 tablespoon of melted butter in the skillet for cooking the apples.", "name": "Preheat the oven to 350°F (175°C). Melt the 4 tablespoons of salted butter in a large skillet over medium-low heat. Once fully melted, remove the skillet from the heat and transfer 3 tablespoons of the butter to a separate bowl. Keep the remaining 1 tablespoon of melted butter in the skillet for cooking the apples.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-0"}, {"@type": "HowToStep", "text": "Peel the 3 apples and cut them into approximately 1/2-inch cubes. Place the diced fruit in a bowl and toss thoroughly with 1 teaspoon lemon juice until evenly coated.", "name": "Peel the 3 apples and cut them into approximately 1/2-inch cubes. Place the diced fruit in a bowl and toss thoroughly with 1 teaspoon lemon juice until evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-1"}, {"@type": "HowToStep", "text": "Return the skillet containing the reserved tablespoon of butter to medium-low heat. Add the lemon-coated apples, followed by the packed light brown sugar, granulated sugar, vanilla extract, cinnamon, and nutmeg.", "name": "Return the skillet containing the reserved tablespoon of butter to medium-low heat. Add the lemon-coated apples, followed by the packed light brown sugar, granulated sugar, vanilla extract, cinnamon, and nutmeg.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-2"}, {"@type": "HowToStep", "text": "Cook for 5–6 minutes, stirring occasionally, until the apples have softened slightly and the mixture is fragrant. Allowing the apples to remain undisturbed for an additional minute can encourage a little more caramelization without altering the remaining preparation.", "name": "Cook for 5–6 minutes, stirring occasionally, until the apples have softened slightly and the mixture is fragrant. Allowing the apples to remain undisturbed for an additional minute can encourage a little more caramelization without altering the remaining preparation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-3"}, {"@type": "HowToStep", "text": "Whisk together 1 teaspoon cornstarch and 1 tablespoon water in a small bowl until completely smooth.", "name": "Whisk together 1 teaspoon cornstarch and 1 tablespoon water in a small bowl until completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-4"}, {"@type": "HowToStep", "text": "Pour the cornstarch mixture into the cooked apples and stir thoroughly. Continue cooking for approximately 2 minutes, until the released juices form a thick, sauce-like coating around the fruit.", "name": "Pour the cornstarch mixture into the cooked apples and stir thoroughly. Continue cooking for approximately 2 minutes, until the released juices form a thick, sauce-like coating around the fruit.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-5"}, {"@type": "HowToStep", "text": "Remove the skillet from the heat and allow the apple mixture to cool slightly before assembling the turnovers.", "name": "Remove the skillet from the heat and allow the apple mixture to cool slightly before assembling the turnovers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-6"}, {"@type": "HowToStep", "text": "Place one thawed phyllo sheet on a clean work surface and lightly brush it with some of the 3 tablespoons of reserved melted butter. Position another sheet on top and brush again. Continue until four phyllo sheets have been stacked and buttered.", "name": "Place one thawed phyllo sheet on a clean work surface and lightly brush it with some of the 3 tablespoons of reserved melted butter. Position another sheet on top and brush again. Continue until four phyllo sheets have been stacked and buttered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-7"}, {"@type": "HowToStep", "text": "Repeat the same procedure with the remaining phyllo until three separate stacks of four layers each have been prepared.", "name": "Repeat the same procedure with the remaining phyllo until three separate stacks of four layers each have been prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-8"}, {"@type": "HowToStep", "text": "Using a sharp knife or pizza cutter, divide each four-layer stack in half to create two rectangles, producing six portions in total.", "name": "Using a sharp knife or pizza cutter, divide each four-layer stack in half to create two rectangles, producing six portions in total.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-9"}, {"@type": "HowToStep", "text": "Spoon several tablespoons of the cooled apple filling near the upper-left area of each phyllo rectangle.", "name": "Spoon several tablespoons of the cooled apple filling near the upper-left area of each phyllo rectangle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-10"}, {"@type": "HowToStep", "text": "Fold the remaining pastry over the filling. Bring the top edge toward you, then fold the ends over and underneath so the turnover is enclosed and sealed.", "name": "Fold the remaining pastry over the filling. Bring the top edge toward you, then fold the ends over and underneath so the turnover is enclosed and sealed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-11"}, {"@type": "HowToStep", "text": "Arrange each turnover seam-side down on the prepared baking sheet. Brush the surfaces with the remaining melted butter.", "name": "Arrange each turnover seam-side down on the prepared baking sheet. Brush the surfaces with the remaining melted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-12"}, {"@type": "HowToStep", "text": "Bake at 350°F (175°C) for approximately 15 minutes, or until the phyllo is crisp and evenly golden. Monitor the pastries carefully during the final few minutes because the thin phyllo layers can brown rapidly.", "name": "Bake at 350°F (175°C) for approximately 15 minutes, or until the phyllo is crisp and evenly golden. Monitor the pastries carefully during the final few minutes because the thin phyllo layers can brown rapidly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-13"}, {"@type": "HowToStep", "text": "Allow the baked turnovers to rest on the baking sheet for 5–10 minutes.", "name": "Allow the baked turnovers to rest on the baking sheet for 5–10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-14"}, {"@type": "HowToStep", "text": "Serve while still warm. If desired, finish with a light coating of sifted powdered sugar and a drizzle of caramel sauce. Vanilla ice cream may also be served alongside each turnover.", "name": "Serve while still warm. If desired, finish with a light coating of sifted powdered sugar and a drizzle of caramel sauce. Vanilla ice cream may also be served alongside each turnover.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-with-phyllo-dough/#wprm-recipe-42070-step-0-15"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Apple Turnovers with Phyllo Dough"}</script>
