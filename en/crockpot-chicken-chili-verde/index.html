    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Crockpot Chicken Chili Verde", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender shredded chicken is slow-cooked in salsa verde and chicken stock until exceptionally soft and flavorful. Tapioca starch or cornstarch gently thickens the cooking liquid, creating a rich green sauce that coats every piece of chicken.", "datePublished": "2020-07-25T04:27:42+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/crockpot-chicken-chili-verde2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/crockpot-chicken-chili-verde2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/crockpot-chicken-chili-verde2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/crockpot-chicken-chili-verde2.png"], "prepTime": "PT5M", "cookTime": "PT180M", "totalTime": "PT185M", "recipeIngredient": ["2 cups low-sodium chicken stock (preferably used to better manage the final salt level)", "1 pound boneless and skinless chicken thighs", "1  jar (15 ounces salsa verde, such as Herdez for a traditional-style flavor)", "2 tablespoons tapioca starch (or an equal amount of cornstarch for thickening)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the chicken. Arrange the boneless, skinless chicken thighs across the bottom of the slow cooker in an even layer.", "name": "Prepare the chicken. Arrange the boneless, skinless chicken thighs across the bottom of the slow cooker in an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/#wprm-recipe-42340-step-0-0"}, {"@type": "HowToStep", "text": "Coat with starch. Sprinkle the tapioca starch or cornstarch uniformly over the chicken, lightly covering each thigh. The starch will help give the sauce a thicker consistency during cooking.", "name": "Coat with starch. Sprinkle the tapioca starch or cornstarch uniformly over the chicken, lightly covering each thigh. The starch will help give the sauce a thicker consistency during cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/#wprm-recipe-42340-step-0-1"}, {"@type": "HowToStep", "text": "Add the liquids. Pour the salsa verde and chicken stock over the coated chicken. Position the chicken so that it is mostly covered by the liquid.", "name": "Add the liquids. Pour the salsa verde and chicken stock over the coated chicken. Position the chicken so that it is mostly covered by the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/#wprm-recipe-42340-step-0-2"}, {"@type": "HowToStep", "text": "Slow-cook until tender. Place the lid securely on the slow cooker. Cook on high for 3–4 hours or on low for 6–8 hours, until the chicken is fully cooked, tender, and easy to pull apart.", "name": "Slow-cook until tender. Place the lid securely on the slow cooker. Cook on high for 3–4 hours or on low for 6–8 hours, until the chicken is fully cooked, tender, and easy to pull apart.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/#wprm-recipe-42340-step-0-3"}, {"@type": "HowToStep", "text": "Shred the chicken. Carefully transfer the cooked chicken from the slow cooker to a cutting board or large plate. Using two forks, pull the meat apart into bite-sized shreds.", "name": "Shred the chicken. Carefully transfer the cooked chicken from the slow cooker to a cutting board or large plate. Using two forks, pull the meat apart into bite-sized shreds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/#wprm-recipe-42340-step-0-4"}, {"@type": "HowToStep", "text": "Return to the sauce. Place the shredded chicken back into the slow cooker and stir thoroughly so the meat is evenly coated with the salsa verde sauce.", "name": "Return to the sauce. Place the shredded chicken back into the slow cooker and stir thoroughly so the meat is evenly coated with the salsa verde sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/#wprm-recipe-42340-step-0-5"}, {"@type": "HowToStep", "text": "Allow the flavors to absorb. Leave the shredded chicken in the sauce on the warm setting for several additional minutes, allowing it to soak up more of the cooking liquid and flavor.", "name": "Allow the flavors to absorb. Leave the shredded chicken in the sauce on the warm setting for several additional minutes, allowing it to soak up more of the cooking liquid and flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/#wprm-recipe-42340-step-0-6"}, {"@type": "HowToStep", "text": "Serve. Spoon the salsa verde chicken onto plates while hot. Serve with rice, crushed tortilla chips, shredded cheese, sour cream, or other preferred toppings.", "name": "Serve. Spoon the salsa verde chicken onto plates while hot. Serve with rice, crushed tortilla chips, shredded cheese, sour cream, or other preferred toppings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-chicken-chili-verde/#wprm-recipe-42340-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Mexican-Inspired"], "keywords": "Pumpkin Scones with Heavy Cream"}</script>
