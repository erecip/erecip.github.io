    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Bars Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Bright, citrusy lemon bars that deliver a delightful balance of tartness and sweetness in every bite.", "datePublished": "2024-09-13T12:15:25+00:00", "image": ["https://erecip.github.io/wp-content/uploads/Lemon-Bars-Recipe.png", "https://erecip.github.io/wp-content/uploads/Lemon-Bars-Recipe-500x500.png", "https://erecip.github.io/wp-content/uploads/Lemon-Bars-Recipe-500x375.png", "https://erecip.github.io/wp-content/uploads/Lemon-Bars-Recipe-480x270.png"], "recipeYield": ["15", "15 bars"], "prepTime": "PT20M", "cookTime": "PT55M", "totalTime": "PT255M", "recipeIngredient": ["1 cup fresh lemon juice (240mL)", "3 tbsp finely grated lemon zest (zest of three lemons)", "3 cups granulated sugar (600g)", "1/2 tsp salt", "8  large eggs (room temperature)", "2/3 cup powdered sugar (66g, plus extra for dusting)", "12 tbsp unsalted butter (melted (170g))", "3 cups all-purpose flour (360g, divided (2 1/2 cups for crust, 1/2 cup for filling))"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C) and prepare a 9x13-inch baking dish by lining it with parchment paper. Combine 2 1/2 cups of the flour with the powdered sugar and salt in a bowl, then stir in the melted butter until the mixture is fully incorporated; a stand mixer with paddle attachment may also be used. If desired, a splash of vanilla can be mixed in with the butter at this stage. Scatter the dough evenly into the lined pan and press firmly into a flat layer. Bake for about 20 minutes or until the crust takes on a pale golden hue. Meanwhile, place the granulated sugar and lemon zest in a food processor and pulse until the zest is thoroughly blended into the sugar, creating a fragrant, pale yellow mixture; alternatively, finely mince the zest and stir into the sugar by hand. Transfer the zested sugar to a large bowl, add the remaining 1/2 cup of flour, and mix to combine. Pour in the fresh lemon juice and crack in the eggs, whisking diligently until the filling is completely smooth and uniform. Once the crust is ready, pour the lemon mixture over the warm base and return to the oven, baking for approximately 25 minutes while rotating the pan halfway through. Remove from the oven and allow to cool at room temperature for one hour before chilling in the refrigerator for an additional two hours. Once set, dust generously with powdered sugar and slice into bars using a clean, sharp knife, wiping the blade after each cut for neat edges.", "name": "Preheat the oven to 350°F (175°C) and prepare a 9x13-inch baking dish by lining it with parchment paper. Combine 2 1/2 cups of the flour with the powdered sugar and salt in a bowl, then stir in the melted butter until the mixture is fully incorporated; a stand mixer with paddle attachment may also be used. If desired, a splash of vanilla can be mixed in with the butter at this stage. Scatter the dough evenly into the lined pan and press firmly into a flat layer. Bake for about 20 minutes or until the crust takes on a pale golden hue. Meanwhile, place the granulated sugar and lemon zest in a food processor and pulse until the zest is thoroughly blended into the sugar, creating a fragrant, pale yellow mixture; alternatively, finely mince the zest and stir into the sugar by hand. Transfer the zested sugar to a large bowl, add the remaining 1/2 cup of flour, and mix to combine. Pour in the fresh lemon juice and crack in the eggs, whisking diligently until the filling is completely smooth and uniform. Once the crust is ready, pour the lemon mixture over the warm base and return to the oven, baking for approximately 25 minutes while rotating the pan halfway through. Remove from the oven and allow to cool at room temperature for one hour before chilling in the refrigerator for an additional two hours. Once set, dust generously with powdered sugar and slice into bars using a clean, sharp knife, wiping the blade after each cut for neat edges.", "url": "https://erecip.github.io/en/lemon-bars-recipe/#wprm-recipe-14172-step-0-0"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Lemon Bars Recipe"}</script>
