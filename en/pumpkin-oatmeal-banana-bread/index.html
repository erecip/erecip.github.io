    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Oatmeal Banana Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "This moist, naturally sweetened quick bread combines ripe banana, pure pumpkin, warming spices, and homemade oat flour. Dairy-free chocolate chips may be added for pockets of rich sweetness throughout the loaf.", "datePublished": "2022-06-18T19:36:35+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/pumpkin-oatmeal-banana-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/pumpkin-oatmeal-banana-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/pumpkin-oatmeal-banana-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/pumpkin-oatmeal-banana-bread.png"], "prepTime": "PT15M", "cookTime": "PT35M", "totalTime": "PT80M", "recipeIngredient": ["⅔ cup mashed very ripe banana (equal to approximately 2 small bananas or 1½ large bananas)", "1 teaspoon pure vanilla extract", "½ teaspoon fine salt", "¼ cup unsweetened vanilla almond milk (or another preferred milk)", "2  large eggs (brought to room temperature)", "1 teaspoon ground cinnamon", "½ cup dairy-free chocolate chips (optional)", "⅔ cup pure pumpkin purée (not pumpkin pie filling)", "1 teaspoon gluten-free baking soda", "⅓ cup honey or pure maple syrup", "2 cups certified gluten-free old-fashioned rolled oats", "1 teaspoon pumpkin pie spice"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 325°F (163°C). Line a 9 × 5-inch loaf pan with parchment paper, or thoroughly coat it with coconut oil or coconut oil cooking spray.", "name": "Preheat the oven to 325°F (163°C). Line a 9 × 5-inch loaf pan with parchment paper, or thoroughly coat it with coconut oil or coconut oil cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/#wprm-recipe-39577-step-0-0"}, {"@type": "HowToStep", "text": "Place the gluten-free rolled oats in a blender or food processor. Process until the oats develop a fine, flour-like consistency. Measure 2 cups of the freshly ground oat flour, reserving any excess for another purpose.", "name": "Place the gluten-free rolled oats in a blender or food processor. Process until the oats develop a fine, flour-like consistency. Measure 2 cups of the freshly ground oat flour, reserving any excess for another purpose.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/#wprm-recipe-39577-step-0-1"}, {"@type": "HowToStep", "text": "In a large mixing bowl, whisk the honey or maple syrup with the vanilla extract and pumpkin purée until evenly blended.", "name": "In a large mixing bowl, whisk the honey or maple syrup with the vanilla extract and pumpkin purée until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/#wprm-recipe-39577-step-0-2"}, {"@type": "HowToStep", "text": "Add the room-temperature eggs and whisk thoroughly. Incorporate the mashed banana and almond milk, continuing to whisk until the wet mixture appears smooth and uniform.", "name": "Add the room-temperature eggs and whisk thoroughly. Incorporate the mashed banana and almond milk, continuing to whisk until the wet mixture appears smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/#wprm-recipe-39577-step-0-3"}, {"@type": "HowToStep", "text": "In a separate smaller bowl, combine the prepared oat flour, baking soda, salt, cinnamon, and pumpkin pie spice. Stir until the leavening and seasonings are evenly distributed.", "name": "In a separate smaller bowl, combine the prepared oat flour, baking soda, salt, cinnamon, and pumpkin pie spice. Stir until the leavening and seasonings are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/#wprm-recipe-39577-step-0-4"}, {"@type": "HowToStep", "text": "Add the wet mixture to the dry ingredients. Fold gently until the batter is fully combined and no visible pockets of dry flour remain. Do not overmix.", "name": "Add the wet mixture to the dry ingredients. Fold gently until the batter is fully combined and no visible pockets of dry flour remain. Do not overmix.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/#wprm-recipe-39577-step-0-5"}, {"@type": "HowToStep", "text": "Fold in the dairy-free chocolate chips, when using, taking care to distribute them evenly without excessively stirring the batter.", "name": "Fold in the dairy-free chocolate chips, when using, taking care to distribute them evenly without excessively stirring the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/#wprm-recipe-39577-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared loaf pan. Use a spatula to spread it evenly and smooth the surface.", "name": "Transfer the batter to the prepared loaf pan. Use a spatula to spread it evenly and smooth the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/#wprm-recipe-39577-step-0-7"}, {"@type": "HowToStep", "text": "Bake for 35–45 minutes, or until a toothpick inserted into the center of the loaf comes out clean.", "name": "Bake for 35–45 minutes, or until a toothpick inserted into the center of the loaf comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/#wprm-recipe-39577-step-0-8"}, {"@type": "HowToStep", "text": "Allow the bread to rest in the pan for 10 minutes. Carefully remove it from the pan, place it on a wire cooling rack, and let it cool for an additional 20 minutes before slicing.", "name": "Allow the bread to rest in the pan for 10 minutes. Carefully remove it from the pan, place it on a wire cooling rack, and let it cool for an additional 20 minutes before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-oatmeal-banana-bread/#wprm-recipe-39577-step-0-9"}], "recipeCategory": ["Bread", "Breakfast", "Snack"], "recipeCuisine": ["American"], "keywords": "Pumpkin Oatmeal Banana Bread"}</script>
