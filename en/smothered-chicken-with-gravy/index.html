    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Smothered Chicken with Gravy", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty, one-skillet classic, this smothered chicken with herb-infused gravy is a comforting dish perfect for weeknights. It's rich in flavor while accommodating a variety of dietary preferences, including gluten-free, paleo, low-carb, keto, and Whole30. Tender chicken cutlets are pan-seared and enveloped in a creamy, savory sauce loaded with fresh herbs, mushrooms, and onions. Excellent for dinner and just as satisfying as leftovers the next day.", "datePublished": "2024-09-26T21:35:58+00:00", "image": ["https://erecip.github.io/en/smothered-chicken-with-gravy/smothered-chicken-with-gravy1.jpg", "https://erecip.github.io/en/smothered-chicken-with-gravy/smothered-chicken-with-gravy1.jpg", "https://erecip.github.io/en/smothered-chicken-with-gravy/smothered-chicken-with-gravy1.jpg", "https://erecip.github.io/en/smothered-chicken-with-gravy/smothered-chicken-with-gravy1.jpg"], "recipeYield": ["6"], "prepTime": "PT10M", "cookTime": "PT20M", "totalTime": "PT30M", "recipeIngredient": ["2 teaspoons lemon juice", "4 tablespoons ghee (divided)", "2 teaspoons fresh rosemary (finely chopped)", "2 teaspoons sage leaves (minced)", "8 oz mushrooms (sliced)", "2 teaspoons fresh thyme (minced)", "2 teaspoons tapioca flour or arrowroot (for gravy)", "Sea salt and black pepper (to taste)", "3/4 cup dairy-free milk or creamer (such as plain Nutpods)", "1 teaspoon Dijon mustard", "3 tablespoons blanched almond flour", "3/4 cup chicken broth or bone broth", "2 tablespoons tapioca flour or arrowroot (for dredging)", "4 cloves garlic (minced)", "1.5 pounds boneless (skinless chicken breasts, pounded to 1/2” thickness or thin-sliced)", "Fresh chopped parsley and other fresh herbs (for garnish)", "1  medium onion (thinly sliced)", "2 teaspoons fresh parsley (minced)"], "recipeInstructions": [{"@ uce the mushrooms and sliced onion, cooking for 4–6 minutes until softened and lightly browned.", "name": "Reduce the heat to medium-low. Add the remaining 2 tablespoons of ghee to the skillet. Introduce the mushrooms and sliced onion, cooking for 4–6 minutes until softened and lightly browned.", "url": "https://erecip.github.io/en/smothered-chicken-with-gravy/#wprm-recipe-31439-step-0-4"}, {"@type": "HowToStep", "text": "Stir in the minced garlic, rosemary, thyme, sage, and parsley. Sauté for an additional 2–3 minutes until fragrant.", "name": "Stir in the minced garlic, rosemary, thyme, sage, and parsley. Sauté for an additional 2–3 minutes until fragrant.", "url": "https://erecip.github.io/en/smothered-chicken-with-gravy/#wprm-recipe-31439-step-0-5"}, {"@type": "HowToStep", "text": "Sprinkle the remaining tapioca flour over the vegetables and stir to evenly coat. Pour in the chicken broth and dairy-free milk, mixing thoroughly.", "name": "Sprinkle the remaining tapioca flour over the vegetables and stir to evenly coat. Pour in the chicken broth and dairy-free milk, mixing thoroughly.", "url": "https://erecip.github.io/en/smothered-chicken-with-gravy/#wprm-recipe-31439-step-0-6"}, {"@type": "HowToStep", "text": "Incorporate the Dijon mustard and lemon juice. Bring the mixture to a boil to thicken, then lower to a simmer. Taste and adjust seasoning with additional salt and pepper as needed.", "name": "Incorporate the Dijon mustard and lemon juice. Bring the mixture to a boil to thicken, then lower to a simmer. Taste and adjust seasoning with additional salt and pepper as needed.", "url": "https://erecip.github.io/en/smothered-chicken-with-gravy/#wprm-recipe-31439-step-0-7"}, {"@type": "HowToStep", "text": "Return the chicken cutlets to the skillet, nestling them into the gravy. Remove from heat.", "name": "Return the chicken cutlets to the skillet, nestling them into the gravy. Remove from heat.", "url": "https://erecip.github.io/en/smothered-chicken-with-gravy/#wprm-recipe-31439-step-0-8"}, {"@type": "HowToStep", "text": "Spoon the savory gravy over the chicken and garnish with freshly chopped herbs before serving.", "name": "Spoon the savory gravy over the chicken and garnish with freshly chopped herbs before serving.", "url": "https://erecip.github.io/en/smothered-chicken-with-gravy/#wprm-recipe-31439-step-0-9"}], "recipeCategory": ["Dinner"], "recipeCuisine": ["American"], "keywords": "smothered chicken with gravy"}</script>
