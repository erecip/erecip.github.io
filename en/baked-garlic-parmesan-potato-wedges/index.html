    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Baked Garlic Parmesan Potato Wedges", "author": {"@type": "Person", "name": "BenDes"}, "description": "Crispy on the outside and tender within, these oven-baked garlic parmesan potato wedges are seasoned with a bold blend of smoky paprika, garlic, and onion, then topped with a generous layer of freshly grated Parmesan and bright parsley. A satisfying side dish or snack perfect for any occasion.", "datePublished": "2023-04-09T20:43:06+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/baked-garlic-parmesan-potato-wedges1.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/baked-garlic-parmesan-potato-wedges1.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/baked-garlic-parmesan-potato-wedges1.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/baked-garlic-parmesan-potato-wedges1.jpg"], "recipeYield": ["4"], "prepTime": "PT10M", "cookTime": "PT35M", "totalTime": "PT45M", "recipeIngredient": ["4  large Russet potatoes (thoroughly washed and scrubbed)", "1 teaspoon smoked paprika for a deep (smoky undertone)", "½ teaspoon ground black pepper (adjust to taste)", "2 tablespoons freshly chopped flat-leaf parsley", "⅓ cup finely shredded Parmesan cheese (divided for use)", "1 teaspoon garlic powder to infuse bold flavor", "½ teaspoon kosher salt (or as preferred)", "½ teaspoon onion powder for a savory edge", "3 tablespoons extra virgin olive oil or avocado oil (as desired)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F (200°C). Line two large rimmed baking trays with parchment paper and set aside.", "name": "Preheat the oven to 400°F (200°C). Line two large rimmed baking trays with parchment paper and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/#wprm-recipe-33016-step-0-0"}, {"@type": "HowToStep", "text": "Rinse and thoroughly scrub the Russet potatoes to remove all surface dirt. Dry them well using paper towels.", "name": "Rinse and thoroughly scrub the Russet potatoes to remove all surface dirt. Dry them well using paper towels.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/#wprm-recipe-33016-step-0-1"}, {"@type": "HowToStep", "text": "Place each potato on a cutting surface and slice lengthwise into halves. Position the flat side down, then divide each half into quarters. For larger potatoes, slice each quarter again to yield 8 evenly sized wedges.", "name": "Place each potato on a cutting surface and slice lengthwise into halves. Position the flat side down, then divide each half into quarters. For larger potatoes, slice each quarter again to yield 8 evenly sized wedges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/#wprm-recipe-33016-step-0-2"}, {"@type": "HowToStep", "text": "In a small bowl, combine the olive oil with garlic powder, onion powder, smoked paprika, salt, and pepper. Whisk until well blended.", "name": "In a small bowl, combine the olive oil with garlic powder, onion powder, smoked paprika, salt, and pepper. Whisk until well blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/#wprm-recipe-33016-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the potato wedges into a sizable mixing bowl. Drizzle the seasoned oil mixture over them and toss thoroughly to ensure each piece is coated evenly.", "name": "Transfer the potato wedges into a sizable mixing bowl. Drizzle the seasoned oil mixture over them and toss thoroughly to ensure each piece is coated evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/#wprm-recipe-33016-step-0-4"}, {"@type": "HowToStep", "text": "Arrange the seasoned wedges in a single layer across the prepared baking sheets, spacing them slightly apart to promote even roasting.", "name": "Arrange the seasoned wedges in a single layer across the prepared baking sheets, spacing them slightly apart to promote even roasting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/#wprm-recipe-33016-step-0-5"}, {"@type": "HowToStep", "text": "Sprinkle about three-quarters of the Parmesan over the wedges and place in the preheated oven. Bake for 30 to 35 minutes, turning each wedge halfway through the cooking time for uniform crispness.", "name": "Sprinkle about three-quarters of the Parmesan over the wedges and place in the preheated oven. Bake for 30 to 35 minutes, turning each wedge halfway through the cooking time for uniform crispness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/#wprm-recipe-33016-step-0-6"}, {"@type": "HowToStep", "text": "Remove from the oven once golden and crisp. Scatter the remaining Parmesan over the top and garnish with freshly chopped parsley.", "name": "Remove from the oven once golden and crisp. Scatter the remaining Parmesan over the top and garnish with freshly chopped parsley.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/#wprm-recipe-33016-step-0-7"}, {"@type": "HowToStep", "text": "Taste and adjust with additional salt and pepper if necessary. Serve immediately while warm, accompanied by your preferred dipping sauce.", "name": "Taste and adjust with additional salt and pepper if necessary. Serve immediately while warm, accompanied by your preferred dipping sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-garlic-parmesan-potato-wedges/#wprm-recipe-33016-step-0-8"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "baked garlic parmesan potato wedges"}</script>
