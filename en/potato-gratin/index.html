    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Potato Gratin", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, oven-baked potato gratin made with thinly sliced potatoes layered in a velvety Gruyère béchamel infused with onion, garlic, thyme, and a subtle touch of nutmeg. A generous cheese topping creates a lightly golden finish while the interior remains tender and creamy.", "datePublished": "2022-12-21T19:58:25+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/potato-gratin2.png", "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/potato-gratin2.png", "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/potato-gratin2.png", "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/potato-gratin2.png"], "cookTime": "PT45M", "totalTime": "PT55M", "recipeIngredient": ["1  small onion (finely minced into approximately 1/4-inch pieces)", "3 tablespoons unsalted butter", "1 teaspoon finely chopped fresh thyme (or 1/2 teaspoon dried thyme)", "1 1/2 cups milk (with heavy cream as an option for a richer sauce)", "1  garlic clove (finely grated or freshly minced)", "1/2 cup freshly shredded Gruyère cheese", "3 tablespoons all-purpose flour or gluten-free flour", "A small pinch of ground nutmeg (optional)", "Fine salt and freshly ground black pepper (according to taste)", "4 pounds potatoes (cut into approximately 1/8-inch-thick slices)", "1 cup freshly grated Gruyère cheese"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the ingredients and heat the oven. Preheat the oven to 350°F. Cut the potatoes into uniform rounds approximately 1/8 inch thick. A mandoline or slicing blade may be used to maintain an even thickness. Finely mince the onion, grate or mince the garlic, chop the fresh thyme, and grate the Gruyère, keeping the 1/2-cup and 1-cup portions separate.", "name": "Prepare the ingredients and heat the oven. Preheat the oven to 350°F. Cut the potatoes into uniform rounds approximately 1/8 inch thick. A mandoline or slicing blade may be used to maintain an even thickness. Finely mince the onion, grate or mince the garlic, chop the fresh thyme, and grate the Gruyère, keeping the 1/2-cup and 1-cup portions separate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/#wprm-recipe-43701-step-0-0"}, {"@type": "HowToStep", "text": "Cook the aromatics. Melt the butter in a saucepan over medium heat. Add the minced onion, garlic, and thyme. Gently sauté for 3–5 minutes, until the onion has softened and turned translucent without developing significant color.", "name": "Cook the aromatics. Melt the butter in a saucepan over medium heat. Add the minced onion, garlic, and thyme. Gently sauté for 3–5 minutes, until the onion has softened and turned translucent without developing significant color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/#wprm-recipe-43701-step-0-1"}, {"@type": "HowToStep", "text": "Form the roux. Sprinkle the flour evenly over the softened aromatic mixture. Stir continuously and cook for 1 minute to remove the uncooked flour flavor.", "name": "Form the roux. Sprinkle the flour evenly over the softened aromatic mixture. Stir continuously and cook for 1 minute to remove the uncooked flour flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/#wprm-recipe-43701-step-0-2"}, {"@type": "HowToStep", "text": "Prepare the cream sauce. Gradually pour the milk into the saucepan while whisking continuously to keep the mixture smooth. Continue whisking for another 1–2 minutes, or until the sauce thickens sufficiently to coat the back of a spoon.", "name": "Prepare the cream sauce. Gradually pour the milk into the saucepan while whisking continuously to keep the mixture smooth. Continue whisking for another 1–2 minutes, or until the sauce thickens sufficiently to coat the back of a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/#wprm-recipe-43701-step-0-3"}, {"@type": "HowToStep", "text": "Add the cheese and seasonings. Remove the saucepan from the heat. Stir in 1/2 cup of shredded Gruyère along with the nutmeg, salt, and black pepper. Continue stirring until the cheese has completely melted and the sauce has a smooth, creamy consistency.", "name": "Add the cheese and seasonings. Remove the saucepan from the heat. Stir in 1/2 cup of shredded Gruyère along with the nutmeg, salt, and black pepper. Continue stirring until the cheese has completely melted and the sauce has a smooth, creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/#wprm-recipe-43701-step-0-4"}, {"@type": "HowToStep", "text": "Begin assembling the gratin. Lightly butter a baking dish, then spread a thin coating of the prepared cheese sauce across the bottom. Arrange half of the sliced potatoes over the sauce in overlapping rows.", "name": "Begin assembling the gratin. Lightly butter a baking dish, then spread a thin coating of the prepared cheese sauce across the bottom. Arrange half of the sliced potatoes over the sauce in overlapping rows.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/#wprm-recipe-43701-step-0-5"}, {"@type": "HowToStep", "text": "Complete the layers. Pour approximately half of the remaining sauce over the first potato layer. Arrange the rest of the potato slices on top in the same overlapping fashion, then distribute the remaining sauce evenly over the surface, allowing it to settle into the spaces between the potatoes.", "name": "Complete the layers. Pour approximately half of the remaining sauce over the first potato layer. Arrange the rest of the potato slices on top in the same overlapping fashion, then distribute the remaining sauce evenly over the surface, allowing it to settle into the spaces between the potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/#wprm-recipe-43701-step-0-6"}, {"@type": "HowToStep", "text": "Add the Gruyère topping. Scatter the remaining 1 cup of freshly grated Gruyère evenly over the assembled potato layers.", "name": "Add the Gruyère topping. Scatter the remaining 1 cup of freshly grated Gruyère evenly over the assembled potato layers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/#wprm-recipe-43701-step-0-7"}, {"@type": "HowToStep", "text": "Bake the gratin. Transfer the dish to the preheated oven and bake at 350°F for 45–60 minutes. The gratin is ready when a knife passes easily through the potatoes and the cheese topping has developed a light golden-brown color.", "name": "Bake the gratin. Transfer the dish to the preheated oven and bake at 350°F for 45–60 minutes. The gratin is ready when a knife passes easily through the potatoes and the cheese topping has developed a light golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/#wprm-recipe-43701-step-0-8"}, {"@type": "HowToStep", "text": "Brown further if desired. For a more deeply caramelized surface, switch the oven to broil during the final 2–3 minutes. Monitor the gratin closely to prevent the cheese from burning.", "name": "Brown further if desired. For a more deeply caramelized surface, switch the oven to broil during the final 2–3 minutes. Monitor the gratin closely to prevent the cheese from burning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/potato-gratin/#wprm-recipe-43701-step-0-9"}, {"@type": "HowToStep", "text": "Rest before serving. Remove the gratin from the oven and allow it to stand for 10 minutes. This brief resting period helps the layers settle and makes the gratin easier to portion while retaining its creamy texture.", "name": "Rest before serving. Remove the gratin from the oven and allow it to stand for 10 minutes. This brief resting period helps the layers settle
