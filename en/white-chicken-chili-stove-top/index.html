 "HowToStep", "text": "Submerge the raw chicken breasts into the pot. Increase heat to medium-high and bring the mixture to a gentle boil. Once boiling, reduce the heat to low and let it simmer uncovered for 15 to 20 minutes, or until the chicken is thoroughly cooked and tender.", "name": "Submerge the raw chicken breasts into the pot. Increase heat to medium-high and bring the mixture to a gentle boil. Once boiling, reduce the heat to low and let it simmer uncovered for 15 to 20 minutes, or until the chicken is thoroughly cooked and tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chicken-chili-stove-top/#wprm-recipe-32703-step-0-4"}, {"@type": "HowToStep", "text": "Turn off the heat and carefully remove the chicken breasts from the pot. Set them aside to cool slightly, then shred the meat using two forks.", "name": "Turn off the heat and carefully remove the chicken breasts from the pot. Set them aside to cool slightly, then shred the meat using two forks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chicken-chili-stove-top/#wprm-recipe-32703-step-0-5"}, {"@type": "HowToStep", "text": "Return the shredded chicken to the chili. Pour in the freshly squeezed lime juice and stir in the Greek yogurt until fully incorporated.", "name": "Return the shredded chicken to the chili. Pour in the freshly squeezed lime juice and stir in the Greek yogurt until fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chicken-chili-stove-top/#wprm-recipe-32703-step-0-6"}, {"@type": "HowToStep", "text": "Serve hot, topped with your choice of garnishes such as cilantro, yogurt, cheese, jalapeños, lime wedges, or tortilla chips.", "name": "Serve hot, topped with your choice of garnishes such as cilantro, yogurt, cheese, jalapeños, lime wedges, or tortilla chips.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-chicken-chili-stove-top/#wprm-recipe-32703-step-0-7"}], "recipeCategory"
