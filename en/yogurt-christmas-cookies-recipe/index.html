    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Yogurt Christmas Cookies Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "These festive yogurt Christmas cookies have a soft, tender texture enriched with full-fat Greek yogurt and butter. After baking, the completely cooled cookies are topped with a smooth buttercream frosting that can be tinted with food coloring for seasonal decorating.", "datePublished": "2020-12-13T17:49:39+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/yogurt-christmas-cookies-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/yogurt-christmas-cookies-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/yogurt-christmas-cookies-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/yogurt-christmas-cookies-recipe.png"], "prepTime": "PT25M", "cookTime": "PT10M", "totalTime": "PT155M", "recipeIngredient": ["160 g full-fat Greek yogurt (preferably for the best texture)", "75 g unsalted butter (softened to room temperature)", "1  medium egg (lightly beaten)", "250 g all-purpose flour", "1/2 teaspoon vanilla essence", "110 g granulated sugar", "1/4 teaspoon baking soda", "1 teaspoon baking powder", "Food coloring (as desired)", "150 g powdered sugar (sifted until free of lumps)", "90 g unsalted butter (softened)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the all-purpose flour, baking powder, and baking soda in a bowl, stirring until the leavening agents are evenly distributed.", "name": "Combine the all-purpose flour, baking powder, and baking soda in a bowl, stirring until the leavening agents are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-0"}, {"@type": "HowToStep", "text": "In a separate large mixing bowl, beat the softened butter with the granulated sugar for several minutes, continuing until the mixture appears pale, light, and fluffy.", "name": "In a separate large mixing bowl, beat the softened butter with the granulated sugar for several minutes, continuing until the mixture appears pale, light, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-1"}, {"@type": "HowToStep", "text": "Blend in the lightly beaten egg and vanilla essence until they are fully incorporated.", "name": "Blend in the lightly beaten egg and vanilla essence until they are fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-2"}, {"@type": "HowToStep", "text": "Add the flour mixture gradually, alternating it with portions of Greek yogurt. Mix only until the ingredients come together into a smooth but noticeably sticky dough.", "name": "Add the flour mixture gradually, alternating it with portions of Greek yogurt. Mix only until the ingredients come together into a smooth but noticeably sticky dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-3"}, {"@type": "HowToStep", "text": "Cover the dough securely with plastic wrap and refrigerate it for a minimum of 2 hours.", "name": "Cover the dough securely with plastic wrap and refrigerate it for a minimum of 2 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-5"}, {"@type": "HowToStep", "text": "Take half of the chilled dough from the refrigerator, leaving the remaining portion cold until needed.", "name": "Take half of the chilled dough from the refrigerator, leaving the remaining portion cold until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-6"}, {"@type": "HowToStep", "text": "Lightly flour the work surface, then roll out the dough to a moderately thick layer rather than making it excessively thin.", "name": "Lightly flour the work surface, then roll out the dough to a moderately thick layer rather than making it excessively thin.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-7"}, {"@type": "HowToStep", "text": "Cut the dough with a large round cookie cutter and arrange the shapes on a baking sheet, leaving adequate space between each cookie.", "name": "Cut the dough with a large round cookie cutter and arrange the shapes on a baking sheet, leaving adequate space between each cookie.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-8"}, {"@type": "HowToStep", "text": "Place the baking sheet in the preheated oven and bake for 10–12 minutes.", "name": "Place the baking sheet in the preheated oven and bake for 10–12 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-9"}, {"@type": "HowToStep", "text": "Remove the cookies while they are still relatively soft and before they develop significant browning.", "name": "Remove the cookies while they are still relatively soft and before they develop significant browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-10"}, {"@type": "HowToStep", "text": "Repeat the rolling, cutting, and baking process with the remaining refrigerated dough.", "name": "Repeat the rolling, cutting, and baking process with the remaining refrigerated dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-11"}, {"@type": "HowToStep", "text": "Transfer the baked cookies to a wire rack and allow them to cool completely before applying the frosting.", "name": "Transfer the baked cookies to a wire rack and allow them to cool completely before applying the frosting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-12"}, {"@type": "HowToStep", "text": "Beat the softened butter in a bowl for several minutes until it becomes light and fluffy.", "name": "Beat the softened butter in a bowl for several minutes until it becomes light and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-13"}, {"@type": "HowToStep", "text": "Add the sifted powdered sugar little by little while continuing to beat the mixture until the frosting is smooth.", "name": "Add the sifted powdered sugar little by little while continuing to beat the mixture until the frosting is smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-14"}, {"@type": "HowToStep", "text": "If necessary, incorporate a small amount of milk to modify the frosting consistency. Blend in food coloring as desired until the preferred shade is achieved.", "name": "If necessary, incorporate a small amount of milk to modify the frosting consistency. Blend in food coloring as desired until the preferred shade is achieved.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-15"}, {"@type": "HowToStep", "text": "After the cookies are entirely cool, spoon a generous amount of buttercream onto each one and spread it evenly across the surface.", "name": "After the cookies are entirely cool, spoon a generous amount of buttercream onto each one and spread it evenly across the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-16"}, {"@type": "HowToStep", "text": "Decorate the frosted cookies as desired, then allow the buttercream to set before serving.", "name": "Decorate the frosted cookies as desired, then allow the buttercream to set before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/yogurt-christmas-cookies-recipe/#wprm-recipe-44967-step-0-17"}], "recipeCategory": ["Cookies", "Dessert"], "keywords": "Yogurt Christmas Cookies Recipe"}</script>
