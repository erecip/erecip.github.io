    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Nutmeg Eggnog Cheesecake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich holiday cheesecake flavored with creamy eggnog and aromatic nutmeg, set over a buttery graham cracker crust and finished with eggnog-infused whipped cream, a light nutmeg dusting, and optional pearl sprinkles.", "datePublished": "2021-09-24T03:26:47+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/nutmeg-eggnog-cheesecake1.png", "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/nutmeg-eggnog-cheesecake1.png", "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/nutmeg-eggnog-cheesecake1.png", "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/nutmeg-eggnog-cheesecake1.png"], "cookTime": "PT100M", "totalTime": "PT160M", "recipeIngredient": ["3 tablespoons granulated sugar", "2 1/4 cups finely crushed graham crackers", "1/2 teaspoon ground nutmeg", "1/2 cup salted butter (melted and allowed to cool slightly)", "1 cup eggnog", "24 ounces cream cheese (softened to room temperature)", "4  large eggs (brought to room temperature, approximately 70°F)", "3 tablespoons all-purpose flour", "3/4 teaspoon ground nutmeg (preferably freshly grated)", "1 cup granulated sugar", "10 tablespoons confectioners’ sugar", "3 tablespoons eggnog", "1 cup cold full-fat heavy cream", "Ground nutmeg (for finishing)", "Pearl sprinkles (optional, for garnish)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the graham cracker crust. Preheat the oven to 325°F (163°C). Place parchment paper over the base of a 9-inch (23 cm) springform pan and lightly grease the sides.", "name": "Prepare the graham cracker crust. Preheat the oven to 325°F (163°C). Place parchment paper over the base of a 9-inch (23 cm) springform pan and lightly grease the sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-0"}, {"@type": "HowToStep", "text": "Combine the graham cracker crumbs, granulated sugar, ground nutmeg, and melted salted butter in a small bowl. Stir thoroughly until all of the crumbs are evenly moistened and the texture resembles damp sand.", "name": "Combine the graham cracker crumbs, granulated sugar, ground nutmeg, and melted salted butter in a small bowl. Stir thoroughly until all of the crumbs are evenly moistened and the texture resembles damp sand.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-1"}, {"@type": "HowToStep", "text": "Firmly press the crumb mixture across the bottom of the prepared pan and approximately halfway up its sides, creating a compact and even crust.", "name": "Firmly press the crumb mixture across the bottom of the prepared pan and approximately halfway up its sides, creating a compact and even crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-2"}, {"@type": "HowToStep", "text": "Bake for 10 minutes, or until the crust is set. Remove the pan from the oven and allow the crust to cool. Once cooled, securely wrap the exterior of the springform pan with aluminum foil so water cannot enter during baking.", "name": "Bake for 10 minutes, or until the crust is set. Remove the pan from the oven and allow the crust to cool. Once cooled, securely wrap the exterior of the springform pan with aluminum foil so water cannot enter during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-3"}, {"@type": "HowToStep", "text": "Mix the eggnog cheesecake filling. Lower the oven temperature to 300°F (148°C).", "name": "Mix the eggnog cheesecake filling. Lower the oven temperature to 300°F (148°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-4"}, {"@type": "HowToStep", "text": "Place the softened cream cheese, granulated sugar, and all-purpose flour in a large mixing bowl. Beat on low speed until the mixture is completely smooth and uniform, scraping the sides of the bowl whenever necessary.", "name": "Place the softened cream cheese, granulated sugar, and all-purpose flour in a large mixing bowl. Beat on low speed until the mixture is completely smooth and uniform, scraping the sides of the bowl whenever necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-5"}, {"@type": "HowToStep", "text": "Pour in the eggnog and add the ground nutmeg. Continue mixing on low speed only until evenly incorporated.", "name": "Pour in the eggnog and add the ground nutmeg. Continue mixing on low speed only until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-6"}, {"@type": "HowToStep", "text": "Add the eggs individually, blending gently on low speed after each addition. Scrape down the bowl between additions and avoid excessive mixing, as incorporating too much air can encourage cracking during baking.", "name": "Add the eggs individually, blending gently on low speed after each addition. Scrape down the bowl between additions and avoid excessive mixing, as incorporating too much air can encourage cracking during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the completed filling to the cooled graham cracker crust and level the surface with a spatula.", "name": "Transfer the completed filling to the cooled graham cracker crust and level the surface with a spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-8"}, {"@type": "HowToStep", "text": "Bake the cheesecake in a water bath. Set the foil-covered springform pan inside a larger roasting pan. Carefully pour warm water into the roasting pan until it reaches approximately halfway up the outside of the springform pan, ensuring the water remains below the upper edge of the foil.", "name": "Bake the cheesecake in a water bath. Set the foil-covered springform pan inside a larger roasting pan. Carefully pour warm water into the roasting pan until it reaches approximately halfway up the outside of the springform pan, ensuring the water remains below the upper edge of the foil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-9"}, {"@type": "HowToStep", "text": "Bake at 300°F (148°C) for 1 hour 30 minutes to 1 hour 40 minutes. The cheesecake is ready when the center appears set but retains a slight wobble.", "name": "Bake at 300°F (148°C) for 1 hour 30 minutes to 1 hour 40 minutes. The cheesecake is ready when the center appears set but retains a slight wobble.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-10"}, {"@type": "HowToStep", "text": "Switch off the oven and leave the cheesecake inside for 30 minutes with the oven door completely closed.", "name": "Switch off the oven and leave the cheesecake inside for 30 minutes with the oven door completely closed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-11"}, {"@type": "HowToStep", "text": "After the initial resting period, partially open the oven door and allow the cheesecake to remain inside for another 30 minutes. This gradual temperature reduction helps minimize cracking.", "name": "After the initial resting period, partially open the oven door and allow the cheesecake to remain inside for another 30 minutes. This gradual temperature reduction helps minimize cracking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-12"}, {"@type": "HowToStep", "text": "Remove the cheesecake from the oven and take it out of the water bath. Refrigerate until thoroughly chilled and firm, approximately 5–6 hours or preferably overnight.", "name": "Remove the cheesecake from the oven and take it out of the water bath. Refrigerate until thoroughly chilled and firm, approximately 5–6 hours or preferably overnight.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-13"}, {"@type": "HowToStep", "text": "Prepare the eggnog whipped cream. Add the chilled heavy cream, confectioners’ sugar, and eggnog to a large mixing bowl.", "name": "Prepare the eggnog whipped cream. Add the chilled heavy cream, confectioners’ sugar, and eggnog to a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-14"}, {"@type": "HowToStep", "text": "Whip the mixture on high speed until stiff peaks develop. Stop once the cream holds its shape to prevent overwhipping. For the best texture, prepare the topping shortly before the cheesecake is served.", "name": "Whip the mixture on high speed until stiff peaks develop. Stop once the cream holds its shape to prevent overwhipping. For the best texture, prepare the topping shortly before the cheesecake is served.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-15"}, {"@type": "HowToStep", "text": "Finish and serve. Once the cheesecake has completely chilled and set, carefully release it from the springform pan and place it on a serving platter.", "name": "Finish and serve. Once the cheesecake has completely chilled and set, carefully release it from the springform pan and place it on a serving platter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-16"}, {"@type": "HowToStep", "text": "Pipe or spoon the eggnog whipped cream over the top in the desired arrangement.", "name": "Pipe or spoon the eggnog whipped cream over the top in the desired arrangement.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-17"}, {"@type": "HowToStep", "text": "Lightly dust the surface with ground nutmeg and, if desired, finish with pearl sprinkles. Keep the decorated cheesecake refrigerated until serving.", "name": "Lightly dust the surface with ground nutmeg and, if desired, finish with pearl sprinkles. Keep the decorated cheesecake refrigerated until serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/nutmeg-eggnog-cheesecake/#wprm-recipe-44458-step-0-18"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Nutmeg Eggnog Cheesecake"}</script>
