    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Easy Summer Salad Recipes", "author": {"@type": "Person", "name": "BenDes"}, "description": "A vibrant and refreshing salad that harmonizes ripe peaches, crisp cucumbers, tangy pickled onions, and creamy feta, all brought together with a zesty lime-cilantro dressing—perfect for warm-weather gatherings.", "datePublished": "2024-09-25T14:03:30+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/easy-summer-salad-recipes/Easy-Summer-Salad-Recipes.png", "https://easy-recipes322.github.io/easy-recipes323/en/easy-summer-salad-recipes/Easy-Summer-Salad-Recipes.png", "https://easy-recipes322.github.io/easy-recipes323/en/easy-summer-salad-recipes/Easy-Summer-Salad-Recipes.png", "https://easy-recipes322.github.io/easy-recipes323/en/easy-summer-salad-recipes/Easy-Summer-Salad-Recipes.png"], "recipeYield": ["4"], "prepTime": "PT30M", "totalTime": "PT30M", "recipeIngredient": ["1/4 cup roasted (salted pumpkin seeds (pepitas))", "1/2  small red onion", "2  Persian cucumbers (or 1 medium English cucumber)", "1/4 cup packed finely chopped fresh cilantro leaves (plus whole leaves and tender stems for garnish)", "1/4 cup olive oil", "4 ounces feta cheese", "1 1/4 teaspoons granulated sugar (divided)", "2  large ripe peaches", "1  medium head butter lettuce (about 1 pound, such as Boston or Bibb)", "1 clove garlic", "2  large limes (divided)", "6 ounces multi-colored cherry tomatoes (about 1 cup)", "3/4 teaspoon kosher salt (divided, plus more to taste)", "Freshly ground black pepper"], "recipeInstructions": [{"@type": "HowToStep", "text": "Finely zest one lime, reserving 1 teaspoon for the onions and setting aside the remainder for topping the salad later. Juice one tablespoon of lime into a small bowl. Thinly slice the red onion (about 1/2 cup) and add it to the bowl along with 1/4 teaspoon of the granulated sugar and 1/4 teaspoon of kosher salt. Combine thoroughly to coat the onions and allow them to pickle for at least 15 minutes, stirring once or twice. Juice the remaining 1 1/2 limes to yield 1/4 cup juice. Finely chop the garlic and enough cilantro leaves to pack 1/4 cup. In a separate bowl or jar, combine the lime juice, garlic, chopped cilantro, olive oil, remaining 1 teaspoon sugar, and remaining 1/2 teaspoon kosher salt; whisk or shake until emulsified. Tear the butter lettuce into bite-sized portions, adding about 10 packed cups to a large salad bowl. Thinly slice the cucumbers; halve the cherry tomatoes; pit and slice the peaches into 1/2-inch wedges; crumble the feta cheese and add all to the bowl. Scatter the pumpkin seeds over the top, followed by the pickled onions (discarding the pickling liquid), reserved lime zest, and extra torn cilantro leaves and stems. Season with kosher salt and freshly ground black pepper to taste. Drizzle half of the dressing over the salad, gently toss to coat, then finish with the remaining dressing.", "name": "Finely zest one lime, reserving 1 teaspoon for the onions and setting aside the remainder for topping the salad later. Juice one tablespoon of lime into a small bowl. Thinly slice the red onion (about 1/2 cup) and add it to the bowl along with 1/4 teaspoon of the granulated sugar and 1/4 teaspoon of kosher salt. Combine thoroughly to coat the onions and allow them to pickle for at least 15 minutes, stirring once or twice. Juice the remaining 1 1/2 limes to yield 1/4 cup juice. Finely chop the garlic and enough cilantro leaves to pack 1/4 cup. In a separate bowl or jar, combine the lime juice, garlic, chopped cilantro, olive oil, remaining 1 teaspoon sugar, and remaining 1/2 teaspoon kosher salt; whisk or shake until emulsified. Tear the butter lettuce into bite-sized portions, adding about 10 packed cups to a large salad bowl. Thinly slice the cucumbers; halve the cherry tomatoes; pit and slice the peaches into 1/2-inch wedges; crumble the feta cheese and add all to the bowl. Scatter the pumpkin seeds over the top, followed by the pickled onions (discarding the pickling liquid), reserved lime zest, and extra torn cilantro leaves and stems. Season with kosher salt and freshly ground black pepper to taste. Drizzle half of the dressing over the salad, gently toss to coat, then finish with the remaining dressing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/easy-summer-salad-recipes/#wprm-recipe-14512-step-0-0"}], "recipeCategory": ["Salad"], "recipeCuisine": ["American"], "keywords": "Easy Summer Salad Recipes"}</script>
