: "Return the drained pasta to the skillet, tossing thoroughly to coat it in the garlic-butter mixture. Stir in half of the grated Parmesan and half of the chopped parsley. Gently fold in the cooked shrimp.", "name": "Return the drained pasta to the skillet, tossing thoroughly to coat it in the garlic-butter mixture. Stir in half of the grated Parmesan and half of the chopped parsley. Gently fold in the cooked shrimp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/shrimp-scampi-garlic-cream-pasta/#wprm-recipe-11074-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the combined shrimp and pasta mixture into a lightly greased 9-by-13-inch baking dish. Scatter the shredded mozzarella and the remaining Parmesan evenly across the top.", "name": "Transfer the combined shrimp and pasta mixture into a lightly greased 9-by-13-inch baking dish. Scatter the shredded mozzarella and the remaining Parmesan evenly across the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/shrimp-scampi-garlic-cream-pasta/#wprm-recipe-11074-step-0-4"}, {"@type": "HowToStep", "text": "Place the baking dish, uncovered, into a preheated oven at 375°F (190°C). Bake for 15 minutes, or until the cheese is fully melted and develops a golden hue.", "name": "Place the baking dish, uncovered, into a preheated oven at 375°F (190°C). Bake for 15 minutes, or until the cheese is fully melted and develops a golden hue.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/shrimp-scampi-garlic-cream-pasta/#wprm-recipe-11074-step-0-5"}, {"@type": "HowToStep", "text": "Remove from the oven and garnish with the remaining parsley. Optionally, finish with an additional squeeze of lemon before serving hot.", "name": "Remove from the oven and garnish with the remaining parsley. Optionally, finish with an additional squeeze of lemon before serving hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/shrimp-scampi-garlic-cream-pasta/#wprm-recipe-11074-step-0-6"
