    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cranberry Sauce Pound Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender, moist pound-style loaf made with whole-milk Greek yogurt and neutral oil, layered with cranberry sauce and gently swirled for a marbled finish. The cake bakes until golden at the edges, then cools slowly to develop its best slicing texture.", "datePublished": "2022-07-21T11:57:20+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/cranberry-sauce-pound-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/cranberry-sauce-pound-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/cranberry-sauce-pound-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/cranberry-sauce-pound-cake2.png"], "cookTime": "PT60M", "totalTime": "PT120M", "recipeIngredient": ["½ cup cranberry sauce (homemade or store-bought)", "3  large eggs (brought to room temperature, approximately 70°F)", "1½ cups all-purpose flour", "1 cup plain whole-milk Greek yogurt", "1 tablespoon vanilla extract", "½ cup vegetable oil (or another neutral-flavored oil such as canola)", "2 teaspoons baking powder", "¾ cup granulated sugar", "½ teaspoon salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the oven and pan. Preheat the oven to 350°F (175°C). Line an 8 × 4-inch, 1-pound loaf pan with parchment paper, allowing enough paper to extend beyond the two long sides. These overhanging edges will make it easier to remove the baked loaf from the pan.", "name": "Prepare the oven and pan. Preheat the oven to 350°F (175°C). Line an 8 × 4-inch, 1-pound loaf pan with parchment paper, allowing enough paper to extend beyond the two long sides. These overhanging edges will make it easier to remove the baked loaf from the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/#wprm-recipe-43957-step-0-0"}, {"@type": "HowToStep", "text": "Blend the dry ingredients. In a medium mixing bowl, thoroughly whisk together the all-purpose flour, baking powder, and salt. Set this mixture aside.", "name": "Blend the dry ingredients. In a medium mixing bowl, thoroughly whisk together the all-purpose flour, baking powder, and salt. Set this mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/#wprm-recipe-43957-step-0-1"}, {"@type": "HowToStep", "text": "Prepare the wet mixture. Place the room-temperature eggs, whole-milk Greek yogurt, and granulated sugar in a large bowl. Using a hand mixer, beat until the ingredients form a smooth, evenly blended mixture.", "name": "Prepare the wet mixture. Place the room-temperature eggs, whole-milk Greek yogurt, and granulated sugar in a large bowl. Using a hand mixer, beat until the ingredients form a smooth, evenly blended mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/#wprm-recipe-43957-step-0-2"}, {"@type": "HowToStep", "text": "Add the oil and vanilla. Pour the vegetable oil and vanilla extract into the egg and yogurt mixture. Continue beating until the oil is completely incorporated and the mixture has a uniform consistency.", "name": "Add the oil and vanilla. Pour the vegetable oil and vanilla extract into the egg and yogurt mixture. Continue beating until the oil is completely incorporated and the mixture has a uniform consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/#wprm-recipe-43957-step-0-3"}, {"@type": "HowToStep", "text": "Finish the batter. Gradually incorporate the prepared dry ingredients into the wet mixture while mixing on low speed. Beat only until no visible streaks of flour remain, approximately 30–60 seconds. Avoid excessive mixing, which may produce a denser loaf.", "name": "Finish the batter. Gradually incorporate the prepared dry ingredients into the wet mixture while mixing on low speed. Beat only until no visible streaks of flour remain, approximately 30–60 seconds. Avoid excessive mixing, which may produce a denser loaf.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/#wprm-recipe-43957-step-0-4"}, {"@type": "HowToStep", "text": "Layer the batter and cranberry sauce. Transfer half of the batter to the prepared loaf pan. Spoon approximately half of the cranberry sauce over the batter in 2–3 separate dollops.", "name": "Layer the batter and cranberry sauce. Transfer half of the batter to the prepared loaf pan. Spoon approximately half of the cranberry sauce over the batter in 2–3 separate dollops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/#wprm-recipe-43957-step-0-5"}, {"@type": "HowToStep", "text": "Create the cranberry swirl. Spread the remaining batter over the first cranberry layer, then distribute the rest of the cranberry sauce across the surface in several dollops. Draw a toothpick gently through the batter a few times to produce a marbled cranberry pattern without over-swirling.", "name": "Create the cranberry swirl. Spread the remaining batter over the first cranberry layer, then distribute the rest of the cranberry sauce across the surface in several dollops. Draw a toothpick gently through the batter a few times to produce a marbled cranberry pattern without over-swirling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/#wprm-recipe-43957-step-0-6"}, {"@type": "HowToStep", "text": "Bake the loaf. Place the pan in the preheated oven and bake for 60–70 minutes. The cake is ready when its edges are browned and a toothpick inserted into the center comes out clean. If the surface becomes too dark before the center has finished baking, loosely cover the loaf with aluminum foil during the final 20 minutes.", "name": "Bake the loaf. Place the pan in the preheated oven and bake for 60–70 minutes. The cake is ready when its edges are browned and a toothpick inserted into the center comes out clean. If the surface becomes too dark before the center has finished baking, loosely cover the loaf with aluminum foil during the final 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/#wprm-recipe-43957-step-0-7"}, {"@type": "HowToStep", "text": "Cool in the pan. Set the loaf pan on a wire cooling rack and leave the cake undisturbed in the pan for approximately 1 hour.", "name": "Cool in the pan. Set the loaf pan on a wire cooling rack and leave the cake undisturbed in the pan for approximately 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/#wprm-recipe-43957-step-0-8"}, {"@type": "HowToStep", "text": "Cool completely. Use the extended parchment paper to carefully lift the loaf from the pan. Transfer it directly to the wire rack and allow it to cool for an additional 1–2 hours before slicing.", "name": "Cool completely. Use the extended parchment paper to carefully lift the loaf from the pan. Transfer it directly to the wire rack and allow it to cool for an additional 1–2 hours before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-sauce-pound-cake/#wprm-recipe-43957-step-0-9"}], "recipeCategory": ["cake", "Dessert"], "recipeCuisine": ["American"], "keywords": "Cranberry Sauce Pound Cake"}</script>
