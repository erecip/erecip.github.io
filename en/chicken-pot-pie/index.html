    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Pot Pie", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty, double-crust chicken pot pie crafted for maximum comfort during chilly seasons. Rich with tender poultry, vibrant vegetables, and a luxuriously thick gravy, all nestled between two flaky pastry layers.", "datePublished": "2024-08-29T03:21:57+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/chicken-pot-pie.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/chicken-pot-pie.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/chicken-pot-pie.jpg", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/chicken-pot-pie.jpg"], "recipeYield": ["8"], "prepTime": "PT170M", "cookTime": "PT35M", "totalTime": "PT205M", "recipeIngredient": ["1 cup 125 grams green peas, frozen and unthawed", "1 teaspoon finely chopped garlic", "1/3 cup approximately 45 grams finely diced yellow onion (roughly half of a small bulb)", "2/3 cup 160 milliliters half-and-half cream (or equal parts heavy cream and whole milk)", "1  large egg (whisked together with 1 tablespoon (15 ml) of milk for the egg wash)", "1  and 3/4 cups (420 milliliters low-sodium chicken stock)", "1 pound 450 grams skinless, boneless chicken breast or thighs, cut into bite-sized chunks", "3/4 teaspoon kosher salt", "1/2 cup about 40 grams thinly sliced celery", "1/3 cup 5 tablespoons or 71 grams unsalted butter", "1 cup approximately 130 grams sliced carrots (around 2 medium carrots)", "1/3 cup 41 grams plain all-purpose flour", "1 teaspoon dried thyme leaves", "1/2 teaspoon freshly ground black pepper", "Optional garnish: fresh thyme sprigs", "Two 9-inch discs of homemade or store-bought pie dough (chilled)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the pastry dough in advance and allow it to chill for a minimum of two hours. You may refrigerate the dough overnight if more convenient. You will need both discs for the base and top crusts.", "name": "Prepare the pastry dough in advance and allow it to chill for a minimum of two hours. You may refrigerate the dough overnight if more convenient. You will need both discs for the base and top crusts.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/#wprm-recipe-32473-step-0-0"}, {"@type": "HowToStep", "text": "In a large saucepan, place the cubed chicken, sliced carrots, and celery. Pour in just enough water to submerge the ingredients. Bring to a rolling boil over medium-high heat and continue to boil for 10 minutes. Remove from heat, drain thoroughly, and set the mixture aside.", "name": "In a large saucepan, place the cubed chicken, sliced carrots, and celery. Pour in just enough water to submerge the ingredients. Bring to a rolling boil over medium-high heat and continue to boil for 10 minutes. Remove from heat, drain thoroughly, and set the mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/#wprm-recipe-32473-step-0-1"}, {"@type": "HowToStep", "text": "In a separate skillet set over medium heat, melt the butter and sauté the onions and garlic until the onions are soft and translucent and the butter takes on a light golden hue. Add the flour, salt, pepper, and thyme, whisking continuously. Slowly incorporate the chicken broth and the half-and-half. Continue to whisk until the mixture is smooth and lump-free, then reduce heat slightly and simmer until the mixture thickens into a hearty gravy, about 10 minutes. Adjust seasoning if desired. Remove from heat and set aside.", "name": "In a separate skillet set over medium heat, melt the butter and sauté the onions and garlic until the onions are soft and translucent and the butter takes on a light golden hue. Add the flour, salt, pepper, and thyme, whisking continuously. Slowly incorporate the chicken broth and the half-and-half. Continue to whisk until the mixture is smooth and lump-free, then reduce heat slightly and simmer until the mixture thickens into a hearty gravy, about 10 minutes. Adjust seasoning if desired. Remove from heat and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/#wprm-recipe-32473-step-0-2"}, {"@type": "HowToStep", "text": "Preheat your oven to 425°F (218°C).", "name": "Preheat your oven to 425°F (218°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/#wprm-recipe-32473-step-0-3"}, {"@type": "HowToStep", "text": "Roll one of the chilled dough discs on a lightly floured surface into a 12-inch circle, rotating as needed to maintain an even thickness. Gently fit the rolled dough into a 9-inch pie dish with a depth of 1.5 to 2 inches. Press the dough evenly into the bottom and along the sides. Trim any overhang with kitchen shears or a sharp knife and discard.", "name": "Roll one of the chilled dough discs on a lightly floured surface into a 12-inch circle, rotating as needed to maintain an even thickness. Gently fit the rolled dough into a 9-inch pie dish with a depth of 1.5 to 2 inches. Press the dough evenly into the bottom and along the sides. Trim any overhang with kitchen shears or a sharp knife and discard.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/#wprm-recipe-32473-step-0-4"}, {"@type": "HowToStep", "text": "Layer the pre-cooked chicken and vegetable mixture evenly into the pie shell. Scatter the frozen peas over the top. Spoon the thickened gravy over the filling, spreading it evenly to ensure full coverage.", "name": "Layer the pre-cooked chicken and vegetable mixture evenly into the pie shell. Scatter the frozen peas over the top. Spoon the thickened gravy over the filling, spreading it evenly to ensure full coverage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/#wprm-recipe-32473-step-0-5"}, {"@type": "HowToStep", "text": "Roll out the second dough disc to the same size and gently place it over the filling. Trim excess dough, then crimp the edges together using a fork to seal. Using a paring knife, make a few small slits in the top crust to allow steam to escape during baking. Brush the surface and edges of the crust with the prepared egg wash.", "name": "Roll out the second dough disc to the same size and gently place it over the filling. Trim excess dough, then crimp the edges together using a fork to seal. Using a paring knife, make a few small slits in the top crust to allow steam to escape during baking. Brush the surface and edges of the crust with the prepared egg wash.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/#wprm-recipe-32473-step-0-6"}, {"@type": "HowToStep", "text": "Bake the pie in the preheated oven for 32 to 38 minutes, or until the top crust has turned a deep golden brown. After 20 minutes of baking, shield the edges with foil or a crust protector to avoid overbrowning.", "name": "Bake the pie in the preheated oven for 32 to 38 minutes, or until the top crust has turned a deep golden brown. After 20 minutes of baking, shield the edges with foil or a crust protector to avoid overbrowning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/#wprm-recipe-32473-step-0-7"}, {"@type": "HowToStep", "text": "Once baked, remove the pie from the oven and allow it to rest for at least 10 minutes before slicing and serving. The filling will set further upon cooling and is excellent the next day. Store leftovers in an airtight container in the refrigerator for up to 5 days.", "name": "Once baked, remove the pie from the oven and allow it to rest for at least 10 minutes before slicing and serving. The filling will set further upon cooling and is excellent the next day. Store leftovers in an airtight container in the refrigerator for up to 5 days.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-pot-pie/#wprm-recipe-32473-step-0-8"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "chicken pot pie"}</script>
