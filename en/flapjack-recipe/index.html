    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Flapjack Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A nostalgic British treat reminiscent of school canteens, these traditional flapjacks offer a delightful balance of chewy edges and a soft, buttery centre, brimming with golden syrup. Perfect with a warm cup of tea.", "datePublished": "2024-10-15T19:46:28+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/flapjack-recipe/Flapjack-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/flapjack-recipe/Flapjack-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/flapjack-recipe/Flapjack-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/flapjack-recipe/Flapjack-Recipe.png"], "recipeYield": ["16"], "prepTime": "PT10M", "cookTime": "PT23M", "totalTime": "PT33M", "recipeIngredient": ["¼ tsp salt", "160 ml ½ cup golden syrup", "400 g 4 cups porridge oats or rolled oats (avoid jumbo or steel-cut)", "200 g 2 sticks unsalted butter", "160 g ¾ packed cup light brown sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Set the oven to 160°C/320°F (fan). Line a square baking tin (20cm x 20cm, 5cm deep) with baking parchment, ensuring an overhang of 1–2 cm for easy removal later. Place the butter in a large saucepan and melt gently over medium heat. Once fully melted, switch off the heat and add the sugar, golden syrup, oats, and salt directly to the pan. Combine thoroughly until the mixture is uniform. Spoon the mixture into the prepared tin, level it out with the back of a spoon, and press down firmly so it compacts well. Bake for 23–25 minutes until the edges are golden. Allow to cool completely in the tin at room temperature for a minimum of 4 hours. Once fully cooled, lift the flapjack out using the parchment, peel it away, place on a chopping board, cut into squares, and serve.", "name": "Set the oven to 160°C/320°F (fan). Line a square baking tin (20cm x 20cm, 5cm deep) with baking parchment, ensuring an overhang of 1–2 cm for easy removal later. Place the butter in a large saucepan and melt gently over medium heat. Once fully melted, switch off the heat and add the sugar, golden syrup, oats, and salt directly to the pan. Combine thoroughly until the mixture is uniform. Spoon the mixture into the prepared tin, level it out with the back of a spoon, and press down firmly so it compacts well. Bake for 23–25 minutes until the edges are golden. Allow to cool completely in the tin at room temperature for a minimum of 4 hours. Once fully cooled, lift the flapjack out using the parchment, peel it away, place on a chopping board, cut into squares, and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/flapjack-recipe/#wprm-recipe-51438-step-0-0"}], "recipeCategory": ["Snack"], "recipeCuisine": ["British"], "keywords": "Flapjack Recipe"}</script>
