, chicken broth, vegetable mix, dried basil, and parsley to the pot.", "name": "Add the diced potatoes, chicken broth, vegetable mix, dried basil, and parsley to the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/creamy-potato-hamburger-soup-recipe/#wprm-recipe-2510-step-0-2"}, {"@type": "HowToStep", "text": "For slow cooking, set the crockpot on low for 6-8 hours, or on high for 3-4 hours. If using a stovetop, simmer the mixture until the potatoes are tender and slightly breaking down.", "name": "For slow cooking, set the crockpot on low for 6-8 hours, or on high for 3-4 hours. If using a stovetop, simmer the mixture until the potatoes are tender and slightly breaking down.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/creamy-potato-hamburger-soup-recipe/#wprm-recipe-2510-step-0-3"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the cornstarch into the milk until smooth, then gradually stir this mixture into the soup.", "name": "In a separate bowl, whisk the cornstarch into the milk until smooth, then gradually stir this mixture into the soup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/creamy-potato-hamburger-soup-recipe/#wprm-recipe-2510-step-0-4"}, {"@type": "HowToStep", "text": "Add the cubed Velveeta cheese, stirring occasionally until it is completely melted into the soup. Once well combined, ladle the soup into bowls and serve warm.", "name": "Add the cubed Velveeta cheese, stirring occasionally until it is completely melted into the soup. Once well combined, ladle the soup into bowls and serve warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/creamy-potato-hamburger-soup-recipe/#wprm-recipe-2510-step-0-5"}], "recipeCategory": ["Soup"], "recipeCuisine": ["American"], "keywords": "Creamy Potato &amp; Hamburger Soup Recipe"}</script>
