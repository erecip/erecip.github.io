    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Halloumi Carbonara", "author": {"@type": "Person", "name": "BenDes"}, "description": "A meat-free carbonara-style spaghetti dish featuring golden-seared halloumi, Parmesan, egg, garlic-infused olive oil, and plenty of black pepper. Starchy pasta water and residual heat create the smooth, creamy sauce without scrambling the egg.", "datePublished": "2018-02-24T06:19:13+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/halloumi-carbonara2.png", "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/halloumi-carbonara2.png", "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/halloumi-carbonara2.png", "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/halloumi-carbonara2.png"], "totalTime": "PT6M", "recipeIngredient": ["5 oz halloumi cheese (cut into slices approximately 1/4 inch thick)", "1/4 cup Parmesan cheese (finely and freshly grated when possible)", "7 oz dried spaghetti", "1 tbsp high-quality extra-virgin olive oil", "1  garlic clove (finely chopped)", "1  large egg (brought to room temperature)", "Kosher salt (as required)", "Freshly ground black pepper (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of generously salted water to a rolling boil.", "name": "Bring a large pot of generously salted water to a rolling boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-0"}, {"@type": "HowToStep", "text": "While the water heats, finely mince the garlic, cut the halloumi into 1/4-inch-thick slices, and grate the Parmesan if it has not already been prepared.", "name": "While the water heats, finely mince the garlic, cut the halloumi into 1/4-inch-thick slices, and grate the Parmesan if it has not already been prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-1"}, {"@type": "HowToStep", "text": "Crack the room-temperature egg into a bowl. Add the grated Parmesan and whisk thoroughly until the two ingredients are evenly combined. Keep the mixture at room temperature until needed.", "name": "Crack the room-temperature egg into a bowl. Add the grated Parmesan and whisk thoroughly until the two ingredients are evenly combined. Keep the mixture at room temperature until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-2"}, {"@type": "HowToStep", "text": "Add the spaghetti to the boiling water and cook according to the package instructions until al dente.", "name": "Add the spaghetti to the boiling water and cook according to the package instructions until al dente.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-3"}, {"@type": "HowToStep", "text": "Before draining the pasta, scoop out and reserve 1/2 cup of the starchy cooking water. Drain the spaghetti.", "name": "Before draining the pasta, scoop out and reserve 1/2 cup of the starchy cooking water. Drain the spaghetti.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-4"}, {"@type": "HowToStep", "text": "Heat the extra-virgin olive oil in a large skillet over medium-high heat until shimmering.", "name": "Heat the extra-virgin olive oil in a large skillet over medium-high heat until shimmering.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-5"}, {"@type": "HowToStep", "text": "Arrange the halloumi slices in a single layer. Sear for approximately 2 minutes, or until the underside develops a golden crust. Turn each piece and cook the second side for another 2 minutes, until lightly browned.", "name": "Arrange the halloumi slices in a single layer. Sear for approximately 2 minutes, or until the underside develops a golden crust. Turn each piece and cook the second side for another 2 minutes, until lightly browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-6"}, {"@type": "HowToStep", "text": "Add the finely minced garlic and cook for about 30 seconds, just until aromatic.", "name": "Add the finely minced garlic and cook for about 30 seconds, just until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-7"}, {"@type": "HowToStep", "text": "Remove and discard the garlic, allowing its flavor to remain infused in the olive oil.", "name": "Remove and discard the garlic, allowing its flavor to remain infused in the olive oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the cooked spaghetti to the skillet containing the seared halloumi.", "name": "Transfer the cooked spaghetti to the skillet containing the seared halloumi.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-9"}, {"@type": "HowToStep", "text": "Pour in between 1/3 and 1/2 cup of the reserved pasta water. Toss the mixture over medium heat for about 1 minute so the spaghetti becomes evenly coated.", "name": "Pour in between 1/3 and 1/2 cup of the reserved pasta water. Toss the mixture over medium heat for about 1 minute so the spaghetti becomes evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-10"}, {"@type": "HowToStep", "text": "Season generously with freshly ground black pepper.", "name": "Season generously with freshly ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-11"}, {"@type": "HowToStep", "text": "Take the skillet completely off the heat before adding the egg mixture. This step is essential for preventing the egg from scrambling.", "name": "Take the skillet completely off the heat before adding the egg mixture. This step is essential for preventing the egg from scrambling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-12"}, {"@type": "HowToStep", "text": "Immediately pour the egg-and-Parmesan mixture over the hot spaghetti. Stir quickly and continuously so the residual heat gently thickens the egg and produces a creamy, cohesive sauce.", "name": "Immediately pour the egg-and-Parmesan mixture over the hot spaghetti. Stir quickly and continuously so the residual heat gently thickens the egg and produces a creamy, cohesive sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-13"}, {"@type": "HowToStep", "text": "Continue stirring vigorously for approximately 30 seconds, ensuring the sauce is evenly distributed and remains smooth rather than forming cooked pieces of egg.", "name": "Continue stirring vigorously for approximately 30 seconds, ensuring the sauce is evenly distributed and remains smooth rather than forming cooked pieces of egg.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-14"}, {"@type": "HowToStep", "text": "Taste the finished pasta and add kosher salt and additional freshly ground black pepper as necessary.", "name": "Taste the finished pasta and add kosher salt and additional freshly ground black pepper as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-15"}, {"@type": "HowToStep", "text": "If the carbonara sauce has become thicker than desired, incorporate a small splash of the remaining reserved pasta water and stir until the preferred consistency is reached.", "name": "If the carbonara sauce has become thicker than desired, incorporate a small splash of the remaining reserved pasta water and stir until the preferred consistency is reached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-16"}, {"@type": "HowToStep", "text": "Divide the halloumi carbonara between serving bowls or plates and serve immediately while hot. Finish with another grinding of black pepper, if desired.", "name": "Divide the halloumi carbonara between serving bowls or plates and serve immediately while hot. Finish with another grinding of black pepper, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/halloumi-carbonara/#wprm-recipe-44739-step-0-17"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian-Inspired"], "keywords": "Halloumi Carbonara"}</script>
