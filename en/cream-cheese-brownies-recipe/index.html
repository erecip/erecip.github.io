    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cream Cheese Brownies Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Decadent and irresistibly fudgy, these Cream Cheese Brownies blend rich chocolate with a velvety sweetened cream cheese swirl. Effortless to prepare, they promise indulgence in every bite.", "datePublished": "2024-09-22T07:44:39+00:00", "image": ["https://erecip.github.io/en/cream-cheese-brownies-recipe/Cream-Cheese-Brownies-Recipe.png", "https://erecip.github.io/en/cream-cheese-brownies-recipe/Cream-Cheese-Brownies-Recipe.png", "https://erecip.github.io/en/cream-cheese-brownies-recipe/Cream-Cheese-Brownies-Recipe.png", "https://erecip.github.io/en/cream-cheese-brownies-recipe/Cream-Cheese-Brownies-Recipe.png"], "recipeYield": ["16", "16 Brownies"], "prepTime": "PT30M", "cookTime": "PT40M", "totalTime": "PT70M", "recipeIngredient": ["1½ teaspoons pure vanilla extract (6 grams)", "1 cup semisweet chocolate chips (170 grams)", "¼ cup unsweetened cocoa powder (21 grams)", "1 cup granulated sugar (200 grams)", "½ teaspoon kosher salt", "3  large eggs (150 grams, at room temperature)", "¼ cup brown sugar (53 grams)", "½ cup unsalted butter (113 grams, at room temperature, cut into quarters)", "1 cup all-purpose flour (120 grams)", "½ teaspoon pure vanilla extract (2 grams)", "8 ounces cream cheese (227 grams, at room temperature)", "¼ cup granulated sugar (50 grams)", "1  large egg (50 grams, at room temperature)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Line an 8-inch square baking pan with parchment paper and lightly coat with nonstick spray; set aside. In a double boiler over low heat, melt the chocolate chips and butter together, stirring until smooth. Remove from the heat, whisk in the cocoa powder, and let the mixture cool for 10 minutes. Whisk in the granulated sugar and brown sugar until fully incorporated. Add the eggs one at a time, whisking thoroughly. Stir in the vanilla extract and salt, then gently fold in the flour until just blended; set aside. In a medium bowl, beat the cream cheese and granulated sugar with a hand mixer until smooth and creamy, about 2 minutes. Add the egg and vanilla extract, beating until the mixture is well combined. Pour the prepared brownie batter into the pan, reserving about ¼ cup of the batter. Spread the cream cheese topping evenly over the brownie layer. Drop the reserved brownie batter over the top and swirl gently with a knife to create a marbled effect. Bake for 30–40 minutes, or until the center is set and a toothpick inserted comes out mostly clean with a few fudgy crumbs. Allow the brownies to cool completely before slicing and serving.", "name": "Preheat the oven to 350°F. Line an 8-inch square baking pan with parchment paper and lightly coat with nonstick spray; set aside. In a double boiler over low heat, melt the chocolate chips and butter together, stirring until smooth. Remove from the heat, whisk in the cocoa powder, and let the mixture cool for 10 minutes. Whisk in the granulated sugar and brown sugar until fully incorporated. Add the eggs one at a time, whisking thoroughly. Stir in the vanilla extract and salt, then gently fold in the flour until just blended; set aside. In a medium bowl, beat the cream cheese and granulated sugar with a hand mixer until smooth and creamy, about 2 minutes. Add the egg and vanilla extract, beating until the mixture is well combined. Pour the prepared brownie batter into the pan, reserving about ¼ cup of the batter. Spread the cream cheese topping evenly over the brownie layer. Drop the reserved brownie batter over the top and swirl gently with a knife to create a marbled effect. Bake for 30–40 minutes, or until the center is set and a toothpick inserted comes out mostly clean with a few fudgy crumbs. Allow the brownies to cool completely before slicing and serving.", "url": "https://erecip.github.io/en/cream-cheese-brownies-recipe/#wprm-recipe-14411-step-0-0"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Cream Cheese Brownies Recipe"}</script>
