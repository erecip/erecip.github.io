es, chili powder, and lemon juice; continue to simmer uncovered for about 30 minutes until the soup thickens to your liking. Add the reserved seasoning packet and adjust seasoning with salt and pepper to taste; simmer for a final minute.", "name": "Rinse the beans thoroughly and drain, discarding any debris; reserve the seasoning packet. Submerge the beans in a large pot of cool water, cover, and leave to soak for at least 8 hours or overnight. Drain the soaking liquid once complete. Pour the water and broth into a large pot. If using a smoked ham hock, place it in the pot with the liquids, bring to a boil, reduce to a gentle simmer, cover, and cook for 1 hour. (Should you opt for a ham bone, leftover ham, or smoked sausage, add it later with the beans and skip the pre-cook.) Incorporate the onion, garlic, and drained beans into the pot, then lower the heat to a simmer, cover, and cook for an additional 1½ to 2 hours until the beans are tender. Mix in the diced tomatoes, chili powder, and lemon juice; continue to simmer uncovered for about 30 minutes until the soup thickens to your liking. Add the reserved seasoning packet and adjust seasoning with salt and pepper to taste; simmer for a final minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/15-bean-soup-recipe/#wprm-recipe-14704-step-0-0"}], "recipeCategory": ["Soup"], "recipeCuisine": ["American"], "keywords": "15 Bean Soup Recipe"}</script>
