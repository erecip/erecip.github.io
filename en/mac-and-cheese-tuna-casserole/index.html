y-recipes322.github.io/easy-recipes323/en/mac-and-cheese-tuna-casserole/#wprm-recipe-44632-step-0-10"}, {"@type": "HowToStep", "text": "Return the casserole to the oven and bake for approximately 5 additional minutes, or until the cheddar has melted and the onions are golden brown.", "name": "Return the casserole to the oven and bake for approximately 5 additional minutes, or until the cheddar has melted and the onions are golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mac-and-cheese-tuna-casserole/#wprm-recipe-44632-step-0-11"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["American"], "keywords": "Mac and Cheese Tuna Casserole"}</script>
