    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Zucchini Fritters", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender in the center and crisp around the edges, these savory zucchini fritters combine fresh squash, scallions, eggs, and a lightly seasoned flour mixture. They are pan-fried until deeply golden and served warm with sour cream.", "datePublished": "2022-04-29T22:19:21+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/zucchini-fritters/zucchini-fritters.png", "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-fritters/zucchini-fritters.png", "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-fritters/zucchini-fritters.png", "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-fritters/zucchini-fritters.png"], "prepTime": "PT20M", "cookTime": "PT5M", "totalTime": "PT25M", "recipeIngredient": ["¾ cup plain all-purpose flour", "½ cup finely chopped scallions", "2  large eggs (thoroughly beaten)", "½ teaspoon freshly ground black pepper", "2 pounds zucchini (approximately 2 large or 5 medium)", "1 teaspoon baking powder", "1½ teaspoons fine sea salt (divided)", "Olive oil (as needed for sautéing)", "Sour cream (for serving)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Wash the zucchini thoroughly and remove both ends. Shred it using the coarse side of a box grater or the grating attachment of a food processor.", "name": "Wash the zucchini thoroughly and remove both ends. Shred it using the coarse side of a box grater or the grating attachment of a food processor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-fritters/#wprm-recipe-41000-step-0-0"}, {"@type": "HowToStep", "text": "Place the grated zucchini in a large bowl and mix it with 1 teaspoon of the fine sea salt. Allow the mixture to rest for 10 minutes so the salt can draw out the excess moisture.", "name": "Place the grated zucchini in a large bowl and mix it with 1 teaspoon of the fine sea salt. Allow the mixture to rest for 10 minutes so the salt can draw out the excess moisture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-fritters/#wprm-recipe-41000-step-0-1"}, {"@type": "HowToStep", "text": "Working in handfuls, firmly squeeze the zucchini over the sink to extract as much liquid as possible. A clean cheesecloth may also be used to wring it more thoroughly. The drained zucchini should yield approximately 3½ to 4 cups.", "name": "Working in handfuls, firmly squeeze the zucchini over the sink to extract as much liquid as possible. A clean cheesecloth may also be used to wring it more thoroughly. The drained zucchini should yield approximately 3½ to 4 cups.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-fritters/#wprm-recipe-41000-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the well-drained zucchini to a clean mixing bowl. Add the beaten eggs and chopped scallions, then stir until the ingredients are evenly distributed.", "name": "Transfer the well-drained zucchini to a clean mixing bowl. Add the beaten eggs and chopped scallions, then stir until the ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-fritters/#wprm-recipe-41000-step-0-3"}, {"@type": "HowToStep", "text": "In a separate small bowl, whisk together the flour, baking powder, black pepper, and the remaining ½ teaspoon of sea salt.", "name": "In a separate small bowl, whisk together the flour, baking powder, black pepper, and the remaining ½ teaspoon of sea salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-fritters/#wprm-recipe-41000-step-0-4"}, {"@type": "HowToStep", "text": "Pour the dry ingredients into the zucchini mixture. Stir only until everything is incorporated and a consistent batter has formed.", "name": "Pour the dry ingredients into the zucchini mixture. Stir only until everything  for dipping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-fritters/#wprm-recipe-41000-step-0-9"}], "recipeCategory": ["Appetizer", "Side Dish"], "recipeCuisine": ["American"], "keywords": "Zucchini Fritters"}</script>
