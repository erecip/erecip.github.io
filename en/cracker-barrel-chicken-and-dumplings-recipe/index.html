    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Delicious Cracker Barrel Chicken and Dumplings Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This recipe replicates the beloved Cracker Barrel chicken and dumplings, offering a comforting, homemade meal that brings the warmth of traditional Southern cooking right to your table.", "datePublished": "2024-02-04T07:49:33+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Cracker-Barrel-Chicken-and-Dumplings-Recipe-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Cracker-Barrel-Chicken-and-Dumplings-Recipe-1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Cracker-Barrel-Chicken-and-Dumplings-Recipe-1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Cracker-Barrel-Chicken-and-Dumplings-Recipe-1-480x270.jpg"], "recipeYield": ["6"], "prepTime": "PT5M", "cookTime": "PT35M", "totalTime": "PT40M", "recipeIngredient": ["6 cups chicken broth", "1 lb boneless (skinless chicken breasts, halved)", "2  ribs of celery (broken in half)", "1/2  medium onion (kept as a whole chunk)", "3 cups all-purpose flour", "1 tablespoon baking powder", "1 1/4 teaspoons salt", "1 cup plus 2 tablespoons milk", "Salt and pepper (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a large stockpot or Dutch oven, combine the chicken broth, celery, onion, and chicken breasts. Bring the mixture to a boil, then reduce the heat to a simmer. Cover partially and cook for approximately 15 minutes, or until the chicken is fully cooked. While the chicken is cooking, begin preparing the dumplings.", "name": "In a large stockpot or Dutch oven, combine the chicken broth, celery, onion, and chicken breasts. Bring the mixture to a boil, then reduce the heat to a simmer. Cover partially and cook for approximately 15 minutes, or until the chicken is fully cooked. While the chicken is cooking, begin preparing the dumplings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cracker-barrel-chicken-and-dumplings-recipe/#wprm-recipe-492-step-0-0"}, {"@type": "HowToStep", "text": "In a medium-sized mixing bowl, blend the flour, baking powder, and salt. Gradually stir in the milk until the ingredients are just combined into a shaggy dough.", "name": "In a medium-sized mixing bowl, blend the flour, baking powder, and salt. Gradually stir in the milk until the ingredients are just combined into a shaggy dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cracker-barrel-chicken-and-dumplings-recipe/#wprm-recipe-492-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the dough to a floured surface and roll it out to a thickness of about 1/4 inch. Cut the dough into strips or squares, roughly 1 to 2 inches in size, using a pizza cutter.", "name": "Transfer the dough to a floured surface and roll it out to a thickness of about 1/4 inch. Cut the dough into strips or squares, roughly 1 to 2 inches in size, using a pizza cutter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cracker-barrel-chicken-and-dumplings-recipe/#wprm-recipe-492-step-0-2"}, {"@type": "HowToStep", "text": "Once the chicken is thoroughly cooked, remove it from the pot and place it on a cutting board. Discard the celery and onion from the broth.", "name": "Once the chicken is thoroughly cooked, remove it from the pot and place it on a cutting board. Discard the celery and onion from the broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cracker-barrel-chicken-and-dumplings-recipe/#wprm-recipe-492-step-0-3"}, {"@type": "HowToStep", "text": "Add the dough strips to the simmering broth, stirring occasionally. Let them simmer for 20-30 minutes, or until the dumplings are cooked and the broth has thickened to a gravy-like consistency.", "name": "Add the dough strips to the simmering broth, stirring occasionally. Let them simmer for 20-30 minutes, or until the dumplings are cooked and the broth has thickened to a gravy-like consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cracker-barrel-chicken-and-dumplings-recipe/#wprm-recipe-492-step-0-4"}, {"@type": "HowToStep", "text": "While the dumplings are cooking, shred or chop the chicken, then return it to the pot. Season with salt and pepper to taste, and serve the dish warm.", "name": "While the dumplings are cooking, shred or chop the chicken, then return it to the pot. Season with salt and pepper to taste, and serve the dish warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cracker-barrel-chicken-and-dumplings-recipe/#wprm-recipe-492-step-0-5"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Delicious Cracker Barrel Chicken and Dumplings Recipe"}</script>
