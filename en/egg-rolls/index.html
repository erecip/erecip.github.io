    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Egg Rolls", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic appetizer beloved for its crispy texture and savory filling, these egg rolls combine seasoned meat with fresh vegetables, all wrapped and deep-fried to perfection.", "datePublished": "2023-02-24T14:52:00+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2025/05/Egg-Rolls2.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2025/05/Egg-Rolls2-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2025/05/Egg-Rolls2-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2025/05/Egg-Rolls2-480x270.png"], "prepTime": "PT20M", "cookTime": "PT15M", "totalTime": "PT35M", "recipeIngredient": ["2 tablespoons water", "1 pound ground beef or pork", "8  7-inch square egg roll wrappers", "1 teaspoon garlic powder (or to preference)", "2 tablespoons all-purpose flour", "2 ounces shredded carrots", "1 teaspoon ground ginger (or as needed)", "2 tablespoons sesame seeds (optional)", "2 cups finely shredded cabbage", "1 quart peanut oil (or enough for deep frying)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a mixing bowl, thoroughly combine the ground meat with garlic powder and ground ginger.", "name": "In a mixing bowl, thoroughly combine the ground meat with garlic powder and ground ginger.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/egg-rolls/#wprm-recipe-25455-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the seasoned meat to a skillet set over medium heat. Sauté, stirring frequently, until browned and broken into crumbles, about 5 to 7 minutes.", "name": "Transfer the seasoned meat to a skillet set over medium heat. Sauté, stirring frequently, until browned and broken into crumbles, about 5 to 7 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/egg-rolls/#wprm-recipe-25455-step-0-1"}, {"@type": "HowToStep", "text": "Once cooked, return the meat to a bowl and mix with the cabbage and carrots until evenly blended.", "name": "Once cooked, return the meat to a bowl and mix with the cabbage and carrots until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/egg-rolls/#wprm-recipe-25455-step-0-2"}, {"@type": "HowToStep", "text": "In a small bowl, blend the flour and water to create a sealing paste with a smooth consistency.", "name": "In a small bowl, blend the flour and water to create a sealing paste with a smooth consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/egg-rolls/#wprm-recipe-25455-step-0-3"}, {"@type": "HowToStep", "text": "Heat the peanut oil in a large frying pan or deep skillet to 375°F (190°C).", "name": "Heat the peanut oil in a large frying pan or deep skillet to 375°F (190°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/egg-rolls/#wprm-recipe-25455-step-0-4"}, {"@type": "HowToStep", "text": "As the oil heats, arrange an egg roll wrapper on a clean surface in a diamond orientation. Spoon approximately 1/4 to 1/3 cup of the meat mixture into the center. Fold the bottom corner over the filling, then fold in the sides. Roll tightly towards the top corner. Seal the edge with a brush of the flour paste.", "name": "As the oil heats, arrange an egg roll wrapper on a clean surface in a diamond orientation. Spoon approximately 1/4 to 1/3 cup of the meat mixture into the center. Fold the bottom corner over the filling, then fold in the sides. Roll tightly towards the top corner. Seal the edge with a brush of the flour paste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/egg-rolls/#wprm-recipe-25455-step-0-5"}, {"@type": "HowToStep", "text": "Carefully lower each roll into the hot oil, frying in batches. Turn occasionally until they develop a uniform golden-brown hue, about 5 to 8 minutes.", "name": "Carefully lower each roll into the hot oil, frying in batches. Turn occasionally until they develop a uniform golden-brown hue, about 5 to 8 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/egg-rolls/#wprm-recipe-25455-step-0-6"}, {"@type": "HowToStep", "text": "Remove the egg rolls with tongs and allow excess oil to drain on paper towels or a rack.", "name": "Remove the egg rolls with tongs and allow excess oil to drain on paper towels or a rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/egg-rolls/#wprm-recipe-25455-step-0-7"}, {"@type": "HowToStep", "text": "Arrange on a serving dish and, if desired, garnish with a sprinkle of sesame seeds.", "name": "Arrange on a serving dish and, if desired, garnish with a sprinkle of sesame seeds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/egg-rolls/#wprm-recipe-25455-step-0-8"}]}</script>
