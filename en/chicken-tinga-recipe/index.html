    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mexican Chicken Tinga Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "This flavorful Chicken Tinga combines tender shredded chicken with a smoky, spicy tomato-chipotle sauce, perfect for tacos, tostadas, or burritos. Prepared in just one pot for a simple, satisfying meal.", "datePublished": "2024-04-07T19:18:43+00:00", "image": ["https://erecip.github.io/wp-content/uploads/2024/11/Mexican-Chicken-Tinga-1.jpg", "https://erecip.github.io/wp-content/uploads/2024/11/Mexican-Chicken-Tinga-1-500x500.jpg", "https://erecip.github.io/wp-content/uploads/2024/11/Mexican-Chicken-Tinga-1-500x375.jpg", "https://erecip.github.io/wp-content/uploads/2024/11/Mexican-Chicken-Tinga-1-480x270.jpg"], "recipeYield": ["8"], "prepTime": "PT5M", "cookTime": "PT35M", "totalTime": "PT40M", "recipeIngredient": ["1 tablespoon olive oil", "2 pounds skinless chicken thighs (or substitute chicken breast)", "1  medium onion (chopped)", "1 teaspoon Mexican oregano", "1  jalapeño pepper (chopped (optional, for extra heat))", "½ teaspoon cumin", "Salt and pepper (to taste)", "4 cloves garlic (chopped)", "16- ounce can tomato sauce", "7- ounce can chipotles in adobo sauce (use half for a milder dish)", "1 tablespoon chili powder (preferably ancho)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat olive oil in a large pan over medium heat. Add the chopped onion and jalapeño, cooking for about 5 minutes until softened.", "name": "Heat olive oil in a large pan over medium heat. Add the chopped onion and jalapeño, cooking for about 5 minutes until softened.", "url": "https://erecip.github.io/en/chicken-tinga-recipe/#wprm-recipe-4823-step-0-0"}, {"@type": "HowToStep", "text": "Add the garlic and sauté for another 30 seconds to 1 minute, until fragrant.", "name": "Add the garlic and sauté for another 30 seconds to 1 minute, until fragrant.", "url": "https://erecip.github.io/en/chicken-tinga-recipe/#wprm-recipe-4823-step-0-1"}, {"@type": "HowToStep", "text": "Season the chicken thighs with salt and pepper, then place them in the pan. Sear each side for about 2 minutes, just until lightly browned.", "name": "Season the chicken thighs with salt and pepper, then place them in the pan. Sear each side for about 2 minutes, just until lightly browned.", "url": "https://erecip.github.io/en/chicken-tinga-recipe/#wprm-recipe-4823-step-0-2"}, {"@type": "HowToStep", "text": "In a food processor, blend the tomato sauce and chipotles in adobo sauce until smooth. Pour the blended mixture into the pan, covering the chicken.", "name": "In a food processor, blend the tomato sauce and chipotles in adobo sauce until smooth. Pour the blended mixture into the pan, covering the chicken.", "url": "https://erecip.github.io/en/chicken-tinga-recipe/#wprm-recipe-4823-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the chili powder, Mexican oregano, cumin, and additional salt and pepper as desired.", "name": "Stir in the chili powder, Mexican oregano, cumin, and additional salt and pepper as desired.", "url": "https://erecip.github.io/en/chicken-tinga-recipe/#wprm-recipe-4823-step-0-4"}, {"@type": "HowToStep", "text": "Bring the sauce to a gentle boil, then reduce the heat and allow the chicken to simmer for about 30 minutes, until it’s cooked through and tender.", "name": "Bring the sauce to a gentle boil, then reduce the heat and allow the chicken to simmer for about 30 minutes, until it’s cooked through and tender.", "url": "https://erecip.github.io/en/chicken-tinga-recipe/#wprm-recipe-4823-step-0-5"}, {"@type": "HowToStep", "text": "Remove the chicken and shred it using two forks. Return the shredded chicken to the pan, mixing it thoroughly into the sauce, and let it simmer for an additional 5 minutes.", "name": "Remove the chicken and shred it using two forks. Return the shredded chicken to the pan, mixing it thoroughly into the sauce, and let it simme
