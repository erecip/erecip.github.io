    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies with Cardamom", "author": {"@type": "Person", "name": "BenDes"}, "description": "These delicate Christmas cookies combine rich butter, vegetable shortening, fragrant ground cardamom, and vanilla in a tender, lightly crisp cut-out cookie. Chilling the dough before rolling and again after shaping helps the cookies maintain their decorative form while baking.", "datePublished": "2020-07-28T05:38:29+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/christmas-cookies-with-cardamom1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/christmas-cookies-with-cardamom1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/christmas-cookies-with-cardamom1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/christmas-cookies-with-cardamom1.png"], "prepTime": "PT20M", "cookTime": "PT10M", "totalTime": "PT35M", "recipeIngredient": ["1 1/2 teaspoons ground cardamom (preferably fresh and aromatic)", "1/2 cup confectioners’ sugar (sifted until free of lumps)", "1 tablespoon vanilla extract", "2 1/2 cups all-purpose flour (such as King Arthur all-purpose flour)", "1/4 teaspoon salt", "1/2 cup unsalted butter (softened to room temperature)", "1/2 cup vegetable shortening"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the room-temperature butter and vegetable shortening in the bowl of a stand mixer fitted with the paddle attachment. Alternatively, use a handheld electric mixer. Beat on medium speed for 1–2 minutes, or until the two fats are smooth and thoroughly blended.", "name": "Place the room-temperature butter and vegetable shortening in the bowl of a stand mixer fitted with the paddle attachment. Alternatively, use a handheld electric mixer. Beat on medium speed for 1–2 minutes, or until the two fats are smooth and thoroughly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-0"}, {"@type": "HowToStep", "text": "Add the sifted confectioners’ sugar, vanilla extract, ground cardamom, and salt. Mix on medium-low speed only until the ingredients are evenly incorporated and the mixture is uniform.", "name": "Add the sifted confectioners’ sugar, vanilla extract, ground cardamom, and salt. Mix on medium-low speed only until the ingredients are evenly incorporated and the mixture is uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-1"}, {"@type": "HowToStep", "text": "Add the all-purpose flour to the butter mixture. Beat on the lowest mixer setting just until the flour disappears into the dough and no dry streaks remain.", "name": "Add the all-purpose flour to the butter mixture. Beat on the lowest mixer setting just until the flour disappears into the dough and no dry streaks remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-2"}, {"@type": "HowToStep", "text": "Stop as necessary to scrape the sides and bottom of the mixing bowl so the dough combines evenly.", "name": "Stop as necessary to scrape the sides and bottom of the mixing bowl so the dough combines evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-3"}, {"@type": "HowToStep", "text": "Gather the finished dough into a ball, then gently press it into a flat disk. Wrap the disk securely in plastic wrap and refrigerate for 30–60 minutes, or until sufficiently firm for rolling.", "name": "Gather the finished dough into a ball, then gently press it into a flat disk. Wrap the disk securely in plastic wrap and refrigerate for 30–60 minutes, or until sufficiently firm for rolling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Prepare three baking sheets by lining them with parchment paper or silicone baking mats.", "name": "Preheat the oven to 350°F (175°C). Prepare three baking sheets by lining them with parchment paper or silicone baking mats.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-5"}, {"@type": "HowToStep", "text": "Dust the work surface lightly with flour. Roll the chilled dough to a thickness just under 1/2 inch.", "name": "Dust the work surface lightly with flour. Roll the chilled dough to a thickness just under 1/2 inch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-6"}, {"@type": "HowToStep", "text": "Cut the dough into the desired shapes using cookie cutters. A 1 1/2-inch fluted round cutter may be used to create cookies similar in size to those prepared in the original recipe.", "name": "Cut the dough into the desired shapes using cookie cutters. A 1 1/2-inch fluted round cutter may be used to create cookies similar in size to those prepared in the original recipe.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the shaped dough pieces to the prepared baking sheets, leaving approximately 1 inch of space between each cookie.", "name": "Transfer the shaped dough pieces to the prepared baking sheets, leaving approximately 1 inch of space between each cookie.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-8"}, {"@type": "HowToStep", "text": "Place the baking sheets in the refrigerator for 30 minutes before baking. This additional chilling period firms the dough and helps the cookies preserve their shape in the oven.", "name": "Place the baking sheets in the refrigerator for 30 minutes before baking. This additional chilling period firms the dough and helps the cookies preserve their shape in the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-9"}, {"@type": "HowToStep", "text": "Bake the cookie sheets individually in the fully preheated oven for 8–10 minutes per tray.", "name": "Bake the cookie sheets individually in the fully preheated oven for 8–10 minutes per tray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-10"}, {"@type": "HowToStep", "text": "Remove the cookies when their edges show a light golden-brown color and the centers have just set. Avoid baking them too long, as they will continue to become firmer while cooling.", "name": "Remove the cookies when their edges show a light golden-brown color and the centers have just set. Avoid baking them too long, as they will continue to become firmer while cooling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-11"}, {"@type": "HowToStep", "text": "Leave the freshly baked cookies on the baking sheet for 5 minutes.", "name": "Leave the freshly baked cookies on the baking sheet for 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-12"}, {"@type": "HowToStep", "text": "Carefully transfer them to a wire cooling rack and allow them to cool completely before serving.", "name": "Carefully transfer them to a wire cooling rack and allow them to cool completely before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-cardamom/#wprm-recipe-45375-step-0-13"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Christmas Cookies with Cardamom"}</script>
