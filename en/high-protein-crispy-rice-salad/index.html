    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "High Protein Crispy Rice Salad", "author": {"@type": "Person", "name": "BenDes"}, "description": "A protein-rich salad featuring golden, crunchy jasmine rice, crisp-coated chicken thighs, fresh vegetables, edamame, herbs, and roasted cashews, all brought together with a creamy cilantro-lime tahini dressing.", "datePublished": "2023-04-18T05:37:43+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/high-protein-crispy-rice-salad2.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/high-protein-crispy-rice-salad2-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/high-protein-crispy-rice-salad2-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/high-protein-crispy-rice-salad2-480x270.png"], "prepTime": "PT5M", "cookTime": "PT14M", "totalTime": "PT19M", "recipeIngredient": ["1 tablespoon rice vinegar", "3 cups cooked and cooled jasmine rice (prepared from approximately 1 cup uncooked rice)", "1 teaspoon honey", "1  garlic clove (very finely minced)", "2 teaspoons toasted sesame oil", "2 tablespoons tamari", "600 g boneless (skinless chicken thighs, cut into roughly 1-inch pieces)", "Freshly ground black pepper (according to taste)", "2 tablespoons corn flour", "¼ teaspoon fine sea salt", "2 tablespoons extra virgin olive oil (or another neutral cooking oil such as grapeseed oil)", "½ cup loosely packed fresh cilantro (roughly chopped)", "2 tablespoons water", "35 ml freshly squeezed lime juice", "1 teaspoon honey", "2 teaspoons fish sauce", "1 tablespoon extra virgin olive oil", "2 tablespoons unhulled tahini", "¼ teaspoon fine sea salt", "200 g shelled edamame beans (approximately 1 cup)", "3  spring onion stalks (finely sliced)", "⅓ cup roasted cashews (roughly chopped)", "2  Lebanese cucumbers (cut into thin rounds)", "A generous handful of fresh mint leaves", "½  head iceberg lettuce (finely shredded)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven grill or broiler to 200°C (approximately 400°F). Place a large baking tray inside the oven and allow it to heat for 5 minutes.", "name": "Preheat the oven grill or broiler to 200°C (approximately 400°F). Place a large baking tray inside the oven and allow it to heat for 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the cooked and cooled jasmine rice to a large mixing bowl.", "name": "Transfer the cooked and cooled jasmine rice to a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-1"}, {"@type": "HowToStep", "text": "In a separate small bowl, whisk the tamari with the rice vinegar, honey, toasted sesame oil, and finely minced garlic until combined.", "name": "In a separate small bowl, whisk the tamari with the rice vinegar, honey, toasted sesame oil, and finely minced garlic until combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-2"}, {"@type": "HowToStep", "text": "Pour the seasoned mixture over the rice and toss thoroughly so the grains are evenly coated.", "name": "Pour the seasoned mixture over the rice and toss thoroughly so the grains are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-3"}, {"@type": "HowToStep", "text": "Carefully remove the heated baking tray and distribute the rice over it in a thin, uniform layer. Bake for 14 minutes, tossing the rice halfway through the cooking time so it becomes evenly crisp.", "name": "Carefully remove the heated baking tray and distribute the rice over it in a thin, uniform layer. Bake for 14 minutes, tossing the rice halfway through the cooking time so it becomes evenly crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-4"}, {"@type": "HowToStep", "text": "Place the diced boneless, skinless chicken thighs in a large bowl.", "name": "Place the diced boneless, skinless chicken thighs in a large bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-5"}, {"@type": "HowToStep", "text": "Sprinkle over the corn flour, ¼ teaspoon fine sea salt, and freshly cracked black pepper to taste. Toss until every piece is evenly coated.", "name": "Sprinkle over the corn flour, ¼ teaspoon fine sea salt, and freshly cracked black pepper to taste. Toss until every piece is evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-6"}, {"@type": "HowToStep", "text": "Heat a large frying pan over medium heat and add the extra virgin olive oil.", "name": "Heat a large frying pan over medium heat and add the extra virgin olive oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the chicken in the pan without allowing the pieces to touch. Cook in 2 to 3 batches if necessary to encourage proper browning.", "name": "Arrange the chicken in the pan without allowing the pieces to touch. Cook in 2 to 3 batches if necessary to encourage proper browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-8"}, {"@type": "HowToStep", "text": "Cook until the chicken develops a golden exterior on all sides, then transfer the cooked pieces to a plate lined with paper towel.", "name": "Cook until the chicken develops a golden exterior on all sides, then transfer the cooked pieces to a plate lined with paper towel.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-9"}, {"@type": "HowToStep", "text": "Continue with the remaining batches until all of the chicken has been cooked.", "name": "Continue with the remaining batches until all of the chicken has been cooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-10"}, {"@type": "HowToStep", "text": "Add the fresh lime juice, unhulled tahini, fish sauce, cilantro, water, honey, extra virgin olive oil, and fine sea salt to a bullet blender or small food processor.", "name": "Add the fresh lime juice, unhulled tahini, fish sauce, cilantro, water, honey, extra virgin olive oil, and fine sea salt to a bullet blender or small food processor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-11"}, {"@type": "HowToStep", "text": "Blend on high speed until the dressing reaches a smooth, creamy consistency.", "name": "Blend on high speed until the dressing reaches a smooth, creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-12"}, {"@type": "HowToStep", "text": "Taste the dressing and adjust the salt or lime juice as needed to achieve the desired balance. An additional splash of lime juice may be added for greater brightness.", "name": "Taste the dressing and adjust the salt or lime juice as needed to achieve the desired balance. An additional splash of lime juice may be added for greater brightness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-13"}, {"@type": "HowToStep", "text": "Finely shred the iceberg lettuce, cut the Lebanese cucumbers into thin rounds, and slice the spring onions thinly.", "name": "Finely shred the iceberg lettuce, cut the Lebanese cucumbers into thin rounds, and slice the spring onions thinly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-14"}, {"@type": "HowToStep", "text": "Prepare the shelled edamame, roughly chop the roasted cashews, and remove a generous handful of fresh mint leaves from their stems.", "name": "Prepare the shelled edamame, roughly chop the roasted cashews, and remove a generous handful of fresh mint leaves from their stems.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-15"}, {"@type": "HowToStep", "text": "Keep the prepared vegetables, herbs, edamame, and cashews ready for assembly while the remaining components finish cooking.", "name": "Keep the prepared vegetables, herbs, edamame, and cashews ready for assembly while the remaining components finish cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-16"}, {"@type": "HowToStep", "text": "Place the cooked chicken, shredded iceberg lettuce, sliced cucumber, mint leaves, spring onions, and shelled edamame in a large salad bowl.", "name": "Place the cooked chicken, shredded iceberg lettuce, sliced cucumber, mint leaves, spring onions, and shelled edamame in a large salad bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-17"}, {"@type": "HowToStep", "text": "Drizzle the cilantro lime dressing over the mixture and toss gently until the ingredients are evenly coated.", "name": "Drizzle the cilantro lime dressing over the mixture and toss gently until the ingredients are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-crispy-rice-salad/#wprm-recipe-42404-step-0-18"}, {"@type": "HowToStep", "text": "Finish by scattering the crispy jasmine rice and chopped roasted cashews over the salad to
