    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Roasted Maple Pecan Acorn Squash", "author": {"@type": "Person", "name": "BenDes"}, "description": "A comforting combination of creamy mashed potatoes, tender green cabbage, and crisp bacon, finished with butter, milk, salt, and black pepper. The cabbage and bacon are gently folded into the potatoes to preserve a light, fluffy texture.", "datePublished": "2020-12-30T19:30:18+00:00", "image": ["https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/roasted-maple-pecan-acorn-squash2.png", "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/roasted-maple-pecan-acorn-squash2.png", "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/roasted-maple-pecan-acorn-squash2.png", "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/roasted-maple-pecan-acorn-squash2.png"], "totalTime": "PT35M", "recipeIngredient": ["½ cup milk", "6  strips bacon", "3 cups green cabbage (chopped)", "½ teaspoon freshly ground black pepper", "4 tablespoons unsalted butter", "2 pounds potatoes", "1½ teaspoons salt (separated for use throughout the recipe)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Peel the 2 pounds of potatoes and cut them into similarly sized pieces so they cook at an even rate.", "name": "Peel the 2 pounds of potatoes and cut them into similarly sized pieces so they cook at an even rate.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the potatoes to a large saucepan or pot and add enough water to cover them completely. Stir in 1 teaspoon of the salt.", "name": "Transfer the potatoes to a large saucepan or pot and add enough water to cover them completely. Stir in 1 teaspoon of the salt.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-1"}, {"@type": "HowToStep", "text": "Bring the water to a full boil over high heat. Lower the heat to maintain a steady simmer and cook for approximately 15–20 minutes, or until the potato pieces are easily pierced with a fork.", "name": "Bring the water to a full boil over high heat. Lower the heat to maintain a steady simmer and cook for approximately 15–20 minutes, or until the potato pieces are easily pierced with a fork.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-2"}, {"@type": "HowToStep", "text": "Drain the potatoes thoroughly once tender.", "name": "Drain the potatoes thoroughly once tender.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-3"}, {"@type": "HowToStep", "text": "While the potatoes cook, prepare the 3 cups of chopped green cabbage if it has not already been cut.", "name": "While the potatoes cook, prepare the 3 cups of chopped green cabbage if it has not already been cut.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-4"}, {"@type": "HowToStep", "text": "Place the cabbage in a separate pot and pour in only enough water to cover the base, approximately ½ cup or the minimum amount required to create steam.", "name": "Place the cabbage in a separate pot and pour in only enough water to cover the base, approximately ½ cup or the minimum amount required to create steam.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-5"}, {"@type": "HowToStep", "text": "Cook over medium heat for roughly 8–10 minutes, until the cabbage becomes tender. Drain away any remaining liquid.", "name": "Cook over medium heat for roughly 8–10 minutes, until the cabbage becomes tender. Drain away any remaining liquid.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-6"}, {"@type": "HowToStep", "text": "Cook until the bacon is crisp and evenly golden, turning the slices when necessary.", "name": "Cook until the bacon is crisp and evenly golden, turning the slices when necessary.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the cooked bacon to a paper towel-lined surface to remove excess grease. When it is cool enough to handle, break or crumble it into small pieces.", "name": "Transfer the cooked bacon to a paper towel-lined surface to remove excess grease. When it is cool enough to handle, break or crumble it into small pieces.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-8"}, {"@type": "HowToStep", "text": "If desired, reserve a small quantity of the rendered bacon fat for drizzling over the finished dish.", "name": "If desired, reserve a small quantity of the rendered bacon fat for drizzling over the finished dish.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-9"}, {"@type": "HowToStep", "text": "Return the hot, drained potatoes to their pot.", "name": "Return the hot, drained potatoes to their pot.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-10"}, {"@type": "HowToStep", "text": "Add the 4 tablespoons of unsalted butter along with the ½ cup of warm milk. Mash the potatoes until creamy and smooth.", "name": "Add the 4 tablespoons of unsalted butter along with the ½ cup of warm milk. Mash the potatoes until creamy and smooth.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-11"}, {"@type": "HowToStep", "text": "For the most desirable consistency, complete the mashing process while the potatoes remain hot.", "name": "For the most desirable consistency, complete the mashing process while the potatoes remain hot.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-12"}, {"@type": "HowToStep", "text": "Season the mashed potatoes with ½ teaspoon of salt.", "name": "Season the mashed potatoes with ½ teaspoon of salt.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-13"}, {"@type": "HowToStep", "text": "Fold the ingredients together gently until the cabbage and bacon are evenly dispersed throughout the potatoes.", "name": "Fold the ingredients together gently until the cabbage and bacon are evenly dispersed throughout the potatoes.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-14"}, {"@type": "HowToStep", "text": "Avoid excessive stirring, as minimal mixing helps maintain a soft and fluffy potato texture.", "name": "Avoid excessive stirring, as minimal mixing helps maintain a soft and fluffy potato texture.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-15"}, {"@type": "HowToStep", "text": "Taste the finished mixture and season with the remaining salt as needed, along with the ½ teaspoon of ground black pepper.", "name": "Taste the finished mixture and season with the remaining salt as needed, along with the ½ teaspoon of ground black pepper.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-16"}, {"@type": "HowToStep", "text": "Serve the dish while warm.", "name": "Serve the dish while warm.", "url": "https://erecip.github.io/en/roasted-maple-pecan-acorn-squash/#wprm-recipe-45583-step-0-17"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["Irish"], "keywords": "Roasted Maple Pecan Acorn Squash"}</script>
