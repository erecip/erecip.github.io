    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Fall Salad", "author": {"@type": "Person", "name": "BenDes"}, "description": "A seasonal salad combining tender roasted butternut squash, cooked quinoa, fresh kale, diced autumn fruit, dried cranberries, feta, and crunchy nuts or seeds. A maple-Dijon vinaigrette adds a balanced mixture of sweetness, acidity, and savory flavor.", "datePublished": "2019-09-01T09:09:09+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/fall-salad2.png", "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/fall-salad2.png", "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/fall-salad2.png", "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/fall-salad2.png"], "totalTime": "PT35M", "recipeIngredient": ["1/2 tablespoon neutral-flavored oil (such as canola or grapeseed)", "Fine salt and ground black pepper (to taste)", "1  butternut squash (peeled, seeds removed, and cut into roughly 3/4-inch cubes)", "1/4 cup dried cranberries", "2 cups kale leaves (stems removed and greens chopped)", "1/4 cup pecans (roughly cut into approximately 1/4-inch pieces)", "1/2 cup dry quinoa or uncooked rice", "1/3 cup reduced-fat feta (crumbled)", "2  small apples (pears, or figs, cut into approximately 1/2-inch pieces)", "2 tablespoons assorted nuts or seeds (optional)", "2 tablespoons apple cider vinegar", "1 tablespoon pure maple syrup or honey", "1 1/2 teaspoons Dijon mustard", "3 tablespoons extra-virgin olive oil", "1  garlic clove (very finely minced, yielding about 1 teaspoon)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 400°F.", "name": "Heat the oven to 400°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-0"}, {"@type": "HowToStep", "text": "Place the cubed butternut squash on a baking sheet. Add the neutral oil and season with salt and ground black pepper. Toss until evenly coated, then arrange the pieces in a single layer.", "name": "Place the cubed butternut squash on a baking sheet. Add the neutral oil and season with salt and ground black pepper. Toss until evenly coated, then arrange the pieces in a single layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-1"}, {"@type": "HowToStep", "text": "Roast for 16 minutes, stirring the squash halfway through the cooking time to promote even browning.", "name": "Roast for 16 minutes, stirring the squash halfway through the cooking time to promote even browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-2"}, {"@type": "HowToStep", "text": "Once the cubes are tender and golden, transfer them to a plate and allow them to cool completely while the remaining ingredients are prepared.", "name": "Once the cubes are tender and golden, transfer them to a plate and allow them to cool completely while the remaining ingredients are prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-3"}, {"@type": "HowToStep", "text": "While the squash is roasting, rinse the quinoa and cook it according to the package instructions, which generally requires about 15 minutes. Set the cooked quinoa aside until cooled. If using rice instead, prepare it according to its package directions.", "name": "While the squash is roasting, rinse the quinoa and cook it according to the package instructions, which generally requires about 15 minutes. Set the cooked quinoa aside until cooled. If using rice instead, prepare it according to its package directions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-4"}, {"@type": "HowToStep", "text": "Remove the tough stems from the kale by holding each leaf and pulling the leafy portion away from the stem. Roughly chop the tender greens.", "name": "Remove the tough stems from the kale by holding each leaf and pulling the leafy portion away from the stem. Roughly chop the tender greens.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-5"}, {"@type": "HowToStep", "text": "Cut the apples, pears, or figs into approximately 1/2-inch pieces. Roughly chop the pecans into pieces measuring about 1/4 inch, and finely mince the garlic.", "name": "Cut the apples, pears, or figs into approximately 1/2-inch pieces. Roughly chop the pecans into pieces measuring about 1/4 inch, and finely mince the garlic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-6"}, {"@type": "HowToStep", "text": "Add the extra-virgin olive oil, apple cider vinegar, maple syrup or honey, Dijon mustard, and minced garlic to a jar.", "name": "Add the extra-virgin olive oil, apple cider vinegar, maple syrup or honey, Dijon mustard, and minced garlic to a jar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-7"}, {"@type": "HowToStep", "text": "Secure the lid and shake vigorously for approximately 30 seconds, or until the mixture becomes thoroughly blended and emulsified. The Dijon mustard helps the oil and vinegar combine into a cohesive dressing.", "name": "Secure the lid and shake vigorously for approximately 30 seconds, or until the mixture becomes thoroughly blended and emulsified. The Dijon mustard helps the oil and vinegar combine into a cohesive dressing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the chopped kale to a large mixing bowl and drizzle approximately half of the prepared vinaigrette over the leaves.", "name": "Transfer the chopped kale to a large mixing bowl and drizzle approximately half of the prepared vinaigrette over the leaves.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-9"}, {"@type": "HowToStep", "text": "Massage the kale with your hands for 1–2 minutes, working the dressing into the greens until they begin to soften.", "name": "Massage the kale with your hands for 1–2 minutes, working the dressing into the greens until they begin to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-10"}, {"@type": "HowToStep", "text": "Pour in the remaining vinaigrette and toss thoroughly so the kale is evenly coated.", "name": "Pour in the remaining vinaigrette and toss thoroughly so the kale is evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-11"}, {"@type": "HowToStep", "text": "Add the cooled quinoa, cooled roasted butternut squash, and diced apples, pears, or figs to the dressed kale.", "name": "Add the cooled quinoa, cooled roasted butternut squash, and diced apples, pears, or figs to the dressed kale.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-12"}, {"@type": "HowToStep", "text": "Toss gently until all components are evenly distributed and coated with the vinaigrette.", "name": "Toss gently until all components are evenly distributed and coated with the vinaigrette.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-13"}, {"@type": "HowToStep", "text": "Allow the combined salad to rest for a few minutes so the flavors can mingle before adding the final toppings.", "name": "Allow the combined salad to rest for a few minutes so the flavors can mingle before adding the final toppings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-14"}, {"@type": "HowToStep", "text": "Transfer the finished salad to a serving bowl or divide it among individual plates.", "name": "Transfer the finished salad to a serving bowl or divide it among individual plates.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-15"}, {"@type": "HowToStep", "text": "Scatter the dried cranberries, chopped pecans, crumbled reduced-fat feta, and optional mixed nuts or seeds over the top immediately before serving so the crunchy ingredients retain their texture.", "name": "Scatter the dried cranberries, chopped pecans, crumbled reduced-fat feta, and optional mixed nuts or seeds over the top immediately before serving so the crunchy ingredients retain their texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fall-salad/#wprm-recipe-45339-step-0-16"}], "recipeCategory": ["Salad", "Side Dish"], "recipeCuisine": ["American"], "keywords": "Fall Salad"}</script>
