    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "French Onion Pasta", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, savory one-pot pasta featuring deeply caramelized yellow onions, aromatic herbs, beefy broth, evaporated milk, and a smooth finish of Gruyère and Parmesan. The pasta cooks directly in the seasoned broth, allowing it to absorb the French onion-inspired flavors while naturally contributing starch to the silky sauce.", "datePublished": "2023-11-10T09:03:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/french-onion-pasta.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/french-onion-pasta-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/french-onion-pasta-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/french-onion-pasta-480x270.png"], "cookTime": "PT55M", "totalTime": "PT55M", "recipeIngredient": ["3  large yellow onions (cut into 1/8-inch-thick rounds)", "2 tablespoons unsalted butter", "1/8 teaspoon freshly ground black pepper", "3 tablespoons olive oil", "1/8 teaspoon kosher salt", "4  garlic cloves (finely minced)", "1 pound uncooked short pasta (such as orecchiette)", "2 teaspoons chopped fresh thyme", "1/2 teaspoon paprika", "1 tablespoon low-sodium soy sauce", "5 1/2 cups water or beef broth", "1/2 tablespoon cornstarch", "1 tablespoon minced fresh parsley", "2 tablespoons beef bouillon granules", "1/2 teaspoon dried oregano", "1 tablespoon Worcestershire sauce", "1/2 teaspoon black pepper", "A pinch to 1/4 teaspoon red pepper flakes", "1  12-ounce can evaporated milk", "For Finishing", "5 ounces freshly shredded Gruyère cheese", "Chopped fresh parsley"], "recipeInstructions": [{"@type": "HowToStep", "text": "Caramelize the onions. Heat the olive oil and unsalted butter in a large, heavy-bottomed pot over medium-high heat. When the butter begins to foam, add the sliced yellow onions, kosher salt, and black pepper.", "name": "Caramelize the onions. Heat the olive oil and unsalted butter in a large, heavy-bottomed pot over medium-high heat. When the butter begins to foam, add the sliced yellow onions, kosher salt, and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-0"}, {"@type": "HowToStep", "text": "Cook the onions for 30–35 minutes, stirring only occasionally, until they become deeply golden brown and develop concentrated sweetness. Allowing the onions to remain undisturbed for a minute or two between stirs encourages greater contact with the hot surface and promotes even browning.", "name": "Cook the onions for 30–35 minutes, stirring only occasionally, until they become deeply golden brown and develop concentrated sweetness. Allowing the onions to remain undisturbed for a minute or two between stirs encourages greater contact with the hot surface and promotes even browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-1"}, {"@type": "HowToStep", "text": "Add the aromatics and savory seasonings. Stir the minced garlic, red pepper flakes, Worcestershire sauce, and low-sodium soy sauce into the caramelized onions.", "name": "Add the aromatics and savory seasonings. Stir the minced garlic, red pepper flakes, Worcestershire sauce, and low-sodium soy sauce into the caramelized onions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-2"}, {"@type": "HowToStep", "text": "Cook for approximately 30 seconds while stirring continuously, ensuring the garlic becomes fragrant without scorching.", "name": "Cook for approximately 30 seconds while stirring continuously, ensuring the garlic becomes fragrant without scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-3"}, {"@type": "HowToStep", "text": "Prepare the creamy broth base. Pour the water or beef broth into the pot along with half of the evaporated milk, stirring until combined.", "name": "Prepare the creamy broth base. Pour the water or beef broth into the pot along with half of the evaporated milk, stirring until combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-4"}, {"@type": "HowToStep", "text": "In a small bowl, whisk the cornstarch with the remaining evaporated milk until completely smooth. Pour this mixture into the pot, then add the beef bouillon granules. Stir thoroughly until the bouillon has fully dissolved.", "name": "In a small bowl, whisk the cornstarch with the remaining evaporated milk until completely smooth. Pour this mixture into the pot, then add the beef bouillon granules. Stir thoroughly until the bouillon has fully dissolved.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-5"}, {"@type": "HowToStep", "text": "Season the broth. Add the fresh parsley, thyme, dried oregano, paprika, and black pepper. Stir to distribute the seasonings evenly throughout the liquid.", "name": "Season the broth. Add the fresh parsley, thyme, dried oregano, paprika, and black pepper. Stir to distribute the seasonings evenly throughout the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-6"}, {"@type": "HowToStep", "text": "Increase the heat and bring the mixture to a boil.", "name": "Increase the heat and bring the mixture to a boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-7"}, {"@type": "HowToStep", "text": "Cook the pasta directly in the broth. Add the uncooked short pasta to the boiling mixture and stir immediately to minimize sticking.", "name": "Cook the pasta directly in the broth. Add the uncooked short pasta to the boiling mixture and stir immediately to minimize sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-8"}, {"@type": "HowToStep", "text": "Cook uncovered for 20–25 minutes, stirring thoroughly every 2–3 minutes. Continue until the pasta is cooked and the broth has developed into a creamy, cohesive sauce. Frequent stirring helps release starch from the pasta while preventing the pieces from clumping together.", "name": "Cook uncovered for 20–25 minutes, stirring thoroughly every 2–3 minutes. Continue until the pasta is cooked and the broth has developed into a creamy, cohesive sauce. Frequent stirring helps release starch from the pasta while preventing the pieces from clumping together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-9"}, {"@type": "HowToStep", "text": "Incorporate the cheeses. Remove the pot from the heat. Add the shredded Gruyère and Parmesan in two additions, stirring gently after each addition until the cheese is completely melted and evenly incorporated.", "name": "Incorporate the cheeses. Remove the pot from the heat. Add the shredded Gruyère and Parmesan in two additions, stirring gently after each addition until the cheese is completely melted and evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-10"}, {"@type": "HowToStep", "text": "Use the residual heat of the pasta and sauce to melt the cheeses smoothly.", "name": "Use the residual heat of the pasta and sauce to melt the cheeses smoothly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-11"}, {"@type": "HowToStep", "text": "Serve and garnish. Portion the French onion pasta into individual bowls or plates. If desired, finish each serving with chopped fresh parsley.", "name": "Serve and garnish. Portion the French onion pasta into individual bowls or plates. If desired, finish each serving with chopped fresh parsley.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-12"}, {"@type": "HowToStep", "text": "Serve immediately while the pasta is hot and the cheese sauce remains creamy.", "name": "Serve immediately while the pasta is hot and the cheese sauce remains creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-pasta/#wprm-recipe-44812-step-0-13"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["French"], "keywords": "French Onion Pasta"}</script>
