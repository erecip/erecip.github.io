    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Southern Candied Sweet Potatoes", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender rounds of sweet potato are baked beneath a buttery brown sugar glaze seasoned with cinnamon, nutmeg, and fresh orange juice. Covered baking softens the potatoes, while the final uncovered portion allows the syrup to reduce into a glossy, caramelized coating.", "datePublished": "2022-07-08T23:27:58+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/southern-candied-sweet-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/southern-candied-sweet-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/southern-candied-sweet-potatoes.png", "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/southern-candied-sweet-potatoes.png"], "cookTime": "PT60M", "totalTime": "PT70M", "recipeIngredient": ["¾ cup firmly packed light brown sugar", "2 pounds sweet potatoes (peeled and cut into ¼-inch-thick rounds)", "1 teaspoon ground cinnamon (preferably freshly ground)", "2 tablespoons orange juice (preferably freshly squeezed)", "½ cup granulated white sugar", "½ teaspoon salt", "½ teaspoon ground nutmeg (ideally freshly grated)", "½ cup unsalted butter (such as Kerrygold for additional richness)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 350°F. Peel the sweet potatoes and slice them evenly into rounds approximately ¼ inch thick so they cook at a consistent rate.", "name": "Heat the oven to 350°F. Peel the sweet potatoes and slice them evenly into rounds approximately ¼ inch thick so they cook at a consistent rate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-0"}, {"@type": "HowToStep", "text": "Layer the sweet potato slices in a 9 × 13-inch baking dish, allowing them to overlap slightly in a gratin-style arrangement. Distribute the ½ teaspoon salt evenly over the potatoes.", "name": "Layer the sweet potato slices in a 9 × 13-inch baking dish, allowing them to overlap slightly in a gratin-style arrangement. Distribute the ½ teaspoon salt evenly over the potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-1"}, {"@type": "HowToStep", "text": "Place the unsalted butter in a medium saucepan and melt it over medium heat. Once liquefied, add the light brown sugar, white sugar, cinnamon, and nutmeg.", "name": "Place the unsalted butter in a medium saucepan and melt it over medium heat. Once liquefied, add the light brown sugar, white sugar, cinnamon, and nutmeg.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-2"}, {"@type": "HowToStep", "text": "Stir the butter and sugar mixture continuously for approximately 2–3 minutes, until the sugars have dissolved and the syrup appears smooth and glossy.", "name": "Stir the butter and sugar mixture continuously for approximately 2–3 minutes, until the sugars have dissolved and the syrup appears smooth and glossy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-3"}, {"@type": "HowToStep", "text": "Take the saucepan off the heat and immediately blend in the 2 tablespoons orange juice, stirring until fully incorporated.", "name": "Take the saucepan off the heat and immediately blend in the 2 tablespoons orange juice, stirring until fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-4"}, {"@type": "HowToStep", "text": "Pour the warm spiced syrup evenly across the arranged sweet potatoes, distributing it carefully so the glaze reaches between the layers and coats the slices throughout.", "name": "Pour the warm spiced syrup evenly across the arranged sweet potatoes, distributing it carefully so the glaze reaches between the layers and coats the slices throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-5"}, {"@type": "HowToStep", "text": "Cover the baking dish securely with aluminum foil. Bake at 350°F for 30 minutes, allowing the potatoes to soften while absorbing the flavored syrup.", "name": "Cover the baking dish securely with aluminum foil. Bake at 350°F for 30 minutes, allowing the potatoes to soften while absorbing the flavored syrup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-6"}, {"@type": "HowToStep", "text": "After the first 30 minutes, remove the dish from the oven and carefully discard the foil. Gently stir the potatoes to redistribute the syrup and encourage even cooking.", "name": "After the first 30 minutes, remove the dish from the oven and carefully discard the foil. Gently stir the potatoes to redistribute the syrup and encourage even cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-7"}, {"@type": "HowToStep", "text": "Return the dish to the oven uncovered and bake for an additional 30 minutes. During this stage, the glaze will thicken and the exposed portions of the potatoes will begin to caramelize. Gently stir once halfway through the uncovered baking period to help the edges candy evenly without scorching.", "name": "Return the dish to the oven uncovered and bake for an additional 30 minutes. During this stage, the glaze will thicken and the exposed portions of the potatoes will begin to caramelize. Gently stir once halfway through the uncovered baking period to help the edges candy evenly without scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-8"}, {"@type": "HowToStep", "text": "Remove the finished sweet potatoes from the oven and allow them to rest for 10–15 minutes. This brief cooling period gives the syrup time to thicken slightly and helps the potato slices retain their shape when served.", "name": "Remove the finished sweet potatoes from the oven and allow them to rest for 10–15 minutes. This brief cooling period gives the syrup time to thicken slightly and helps the potato slices retain their shape when served.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-9"}, {"@type": "HowToStep", "text": "Serve the candied sweet potatoes warm or at room temperature, spooning additional syrup from the bottom of the baking dish over each serving.", "name": "Serve the candied sweet potatoes warm or at room temperature, spooning additional syrup from the bottom of the baking dish over each serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southern-candied-sweet-potatoes/#wprm-recipe-44540-step-0-10"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["Southern American"], "keywords": "Southern Candied Sweet Potatoes"}</script>
