    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Baked Apple Cider Donuts", "author": {"@type": "Person", "name": "BenDes"}, "description": "These oven-baked apple cider donuts feature concentrated cider, warm baking spices, Greek yogurt for a soft and tender texture, and a buttery cider coating finished with cinnamon sugar.", "datePublished": "2023-03-19T20:40:07+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/baked-apple-cider-donuts2.png", "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/baked-apple-cider-donuts2.png", "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/baked-apple-cider-donuts2.png", "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/baked-apple-cider-donuts2.png"], "cookTime": "PT11M", "totalTime": "PT14M", "recipeIngredient": ["1  large egg (brought to room temperature)", "1/2 teaspoon baking powder", "2 tablespoons plain Greek yogurt", "Pinch of ground cloves", "1 cup apple cider (simmered or microwaved until reduced to 1/2 cup)", "1/2 teaspoon ground cinnamon (preferably freshly ground)", "3 tablespoons unsalted butter (melted and allowed to cool slightly)", "1/4 cup granulated sugar", "Pinch of salt", "1/2 teaspoon pure vanilla extract", "1 cup all-purpose flour (such as King Arthur)", "Pinch of ground nutmeg (preferably freshly grated)", "1/2 teaspoon baking soda", "3 tablespoons unsalted butter (melted)", "1 1/2 teaspoons ground cinnamon (preferably freshly ground)", "2 tablespoons reserved reduced cider", "1/2 cup granulated sugar (for coating)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Reduce the 1 cup of apple cider until only 1/2 cup remains. This can be done in the microwave for approximately 8–10 minutes or in a saucepan on the stovetop for about 10 minutes.", "name": "Reduce the 1 cup of apple cider until only 1/2 cup remains. This can be done in the microwave for approximately 8–10 minutes or in a saucepan on the stovetop for about 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-0"}, {"@type": "HowToStep", "text": "While the cider is reducing, heat the oven to 350°F. Thoroughly grease the cavities of the donut pans with butter or nonstick cooking spray, taking care to cover the edges and crevices.", "name": "While the cider is reducing, heat the oven to 350°F. Thoroughly grease the cavities of the donut pans with butter or nonstick cooking spray, taking care to cover the edges and crevices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-1"}, {"@type": "HowToStep", "text": "After the cider has reduced, combine it with the 3 tablespoons of melted butter and allow the mixture to cool slightly. Measure out 2 tablespoons and set this portion aside for use with the final coating.", "name": "After the cider has reduced, combine it with the 3 tablespoons of melted butter and allow the mixture to cool slightly. Measure out 2 tablespoons and set this portion aside for use with the final coating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-2"}, {"@type": "HowToStep", "text": "Place the remaining cider-butter mixture in a large mixing bowl. Add the 1/4 cup sugar, room-temperature egg, Greek yogurt, and vanilla extract.", "name": "Place the remaining cider-butter mixture in a large mixing bowl. Add the 1/4 cup sugar, room-temperature egg, Greek yogurt, and vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-3"}, {"@type": "HowToStep", "text": "Whisk until the ingredients form a smooth, evenly blended mixture. The Greek yogurt contributes moisture and a mild tang while helping produce a tender crumb.", "name": "Whisk until the ingredients form a smooth, evenly blended mixture. The Greek yogurt contributes moisture and a mild tang while helping produce a tender crumb.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-4"}, {"@type": "HowToStep", "text": "Using an egg at room temperature allows it to incorporate more readily into the liquid ingredients and promotes a more uniform mixture.", "name": "Using an egg at room temperature allows it to incorporate more readily into the liquid ingredients and promotes a more uniform mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-5"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk together the all-purpose flour, 1/2 teaspoon cinnamon, baking soda, baking powder, nutmeg, cloves, and salt until the spices and leavening agents are evenly distributed.", "name": "In a separate bowl, whisk together the all-purpose flour, 1/2 teaspoon cinnamon, baking soda, baking powder, nutmeg, cloves, and salt until the spices and leavening agents are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-6"}, {"@type": "HowToStep", "text": "Add the wet mixture to the dry ingredients. Using a spatula, gently fold everything together only until no large streaks of dry flour remain.", "name": "Add the wet mixture to the dry ingredients. Using a spatula, gently fold everything together only until no large streaks of dry flour remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-7"}, {"@type": "HowToStep", "text": "Avoid excessive mixing. A few small lumps may remain in the batter; overworking it can develop too much gluten and lead to donuts with a firmer, denser texture.", "name": "Avoid excessive mixing. A few small lumps may remain in the batter; overworking it can develop too much gluten and lead to donuts with a firmer, denser texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-8"}, {"@type": "HowToStep", "text": "Spoon the prepared batter into a piping bag, or use a zip-top bag with one corner trimmed away.", "name": "Spoon the prepared batter into a piping bag, or use a zip-top bag with one corner trimmed away.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-9"}, {"@type": "HowToStep", "text": "Pipe the batter into the prepared donut cavities, filling each approximately two-thirds full to provide enough space for rising during baking.", "name": "Pipe the batter into the prepared donut cavities, filling each approximately two-thirds full to provide enough space for rising during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-10"}, {"@type": "HowToStep", "text": "Bake at 350°F for 9–11 minutes, or until the donuts are lightly golden and a toothpick inserted into one comes out clean or with only a few moist crumbs attached.", "name": "Bake at 350°F for 9–11 minutes, or until the donuts are lightly golden and a toothpick inserted into one comes out clean or with only a few moist crumbs attached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-11"}, {"@type": "HowToStep", "text": "Remove the pans from the oven and allow the donuts to rest inside them for 2–3 minutes before carefully releasing them. Avoid overbaking, as the donuts will continue cooking slightly from residual heat while cooling.", "name": "Remove the pans from the oven and allow the donuts to rest inside them for 2–3 minutes before carefully releasing them. Avoid overbaking, as the donuts will continue cooking slightly from residual heat while cooling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-12"}, {"@type": "HowToStep", "text": "Place the 3 tablespoons of melted butter in a shallow bowl and stir in the 2 tablespoons of reserved cider mixture.", "name": "Place the 3 tablespoons of melted butter in a shallow bowl and stir in the 2 tablespoons of reserved cider mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-13"}, {"@type": "HowToStep", "text": "In a second shallow bowl, thoroughly combine the 1/2 cup sugar with the 1 1/2 teaspoons ground cinnamon.", "name": "In a second shallow bowl, thoroughly combine the 1/2 cup sugar with the 1 1/2 teaspoons ground cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-14"}, {"@type": "HowToStep", "text": "Keep both coatings ready before dipping the donuts so they can be coated while still warm.", "name": "Keep both coatings ready before dipping the donuts so they can be coated while still warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-15"}, {"@type": "HowToStep", "text": "When the baked donuts have cooled for approximately 2–3 minutes and can be comfortably handled, dip each one into the cider-butter mixture, coating both sides.", "name": "When the baked donuts have cooled for approximately 2–3 minutes and can be comfortably handled, dip each one into the cider-butter mixture, coating both sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-16"}, {"@type": "HowToStep", "text": "Immediately transfer each glazed donut to the cinnamon sugar and cover it generously on all surfaces.", "name": "Immediately transfer each glazed donut to the cinnamon sugar and cover it generously on all surfaces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-17"}, {"@type": "HowToStep", "text": "Place the coated donuts on a wire cooling rack or a sheet of parchment paper and allow them to cool completely.", "name": "Place the coated donuts on a wire cooling rack or a sheet of parchment paper and allow them to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-apple-cider-donuts/#wprm-recipe-41996-step-0-18"}], "recipeCuisine": ["American"], "keywords": "Baked Apple Cider Donuts"}</script>
