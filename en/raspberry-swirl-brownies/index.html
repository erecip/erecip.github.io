    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Raspberry Swirl Brownies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Rich, fudgy brownies are finished with a smooth raspberry ribbon, creating a striking marbled top and a balanced contrast between deep chocolate flavor and bright berry sweetness.", "datePublished": "2022-10-27T07:45:00+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/Fudgy-Raspberry-Swirl-Brownies.png", "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/Fudgy-Raspberry-Swirl-Brownies.png", "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/Fudgy-Raspberry-Swirl-Brownies.png", "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/Fudgy-Raspberry-Swirl-Brownies.png"], "cookTime": "PT30M", "totalTime": "PT30M", "recipeIngredient": ["1 cup white granulated sugar", "3  large eggs (brought to room temperature for smoother blending)", "1/2 cup plain all-purpose flour", "1/2 teaspoon fine sea salt", "1 teaspoon pure vanilla extract", "1/8 teaspoon baking powder", "1/2 cup unsalted butter (preferably a high-quality variety)", "1/8 teaspoon baking soda", "1 1/2 cups premium semi-sweet chocolate chips", "1/2 cup fresh raspberries", "A small splash of water", "1/2 cup white granulated sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Line an 8-inch baking pan with parchment paper or aluminum foil, allowing extra material to extend over the sides so the brownies can be lifted out easily after cooling.", "name": "Line an 8-inch baking pan with parchment paper or aluminum foil, allowing extra material to extend over the sides so the brownies can be lifted out easily after cooling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-0"}, {"@type": "HowToStep", "text": "Lightly mist the lined pan with cooking spray to help prevent the brownies from adhering to the surface.", "name": "Lightly mist the lined pan with cooking spray to help prevent the brownies from adhering to the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-1"}, {"@type": "HowToStep", "text": "Place the raspberries, sugar, and a small splash of water into a saucepan. Warm the mixture over medium heat, stirring until the sugar dissolves and the fruit begins to break down into a sauce.", "name": "Place the raspberries, sugar, and a small splash of water into a saucepan. Warm the mixture over medium heat, stirring until the sugar dissolves and the fruit begins to break down into a sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-2"}, {"@type": "HowToStep", "text": "Crush the raspberries with a spoon, or blend them with an immersion blender for a smoother consistency. Let the sauce boil briefly for a few minutes, then remove it from the heat.", "name": "Crush the raspberries with a spoon, or blend them with an immersion blender for a smoother consistency. Let the sauce boil briefly for a few minutes, then remove it from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-3"}, {"@type": "HowToStep", "text": "Pass the raspberry mixture through a strainer to separate out the seeds. Reserve the smooth sauce and set it aside.", "name": "Pass the raspberry mixture through a strainer to separate out the seeds. Reserve the smooth sauce and set it aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-5"}, {"@type": "HowToStep", "text": "In a large saucepan, melt the unsalted butter together with the semi-sweet chocolate chips over low heat. Stir until the mixture becomes glossy, uniform, and completely smooth.", "name": "In a large saucepan, melt the unsalted butter together with the semi-sweet chocolate chips over low heat. Stir until the mixture becomes glossy, uniform, and completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-6"}, {"@type": "HowToStep", "text": "Remove the chocolate mixture from the heat and allow it to cool. The pan may be placed in the refrigerator briefly to help it cool more quickly.", "name": "Remove the chocolate mixture from the heat and allow it to cool. The pan may be placed in the refrigerator briefly to help it cool more quickly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-7"}, {"@type": "HowToStep", "text": "In a separate mixing bowl, whisk the eggs, granulated sugar, and vanilla extract until fully combined.", "name": "In a separate mixing bowl, whisk the eggs, granulated sugar, and vanilla extract until fully combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-8"}, {"@type": "HowToStep", "text": "Gradually pour the egg mixture into the cooled chocolate mixture, stirring constantly as it is added so the eggs blend evenly without curdling.", "name": "Gradually pour the egg mixture into the cooled chocolate mixture, stirring constantly as it is added so the eggs blend evenly without curdling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-9"}, {"@type": "HowToStep", "text": "Add the flour, salt, baking powder, and baking soda to the chocolate mixture. Stir until the dry ingredients are fully incorporated and the batter is smooth.", "name": "Add the flour, salt, baking powder, and baking soda to the chocolate mixture. Stir until the dry ingredients are fully incorporated and the batter is smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-10"}, {"@type": "HowToStep", "text": "Transfer the brownie batter to the prepared baking pan, spreading it into an even layer.", "name": "Transfer the brownie batter to the prepared baking pan, spreading it into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-11"}, {"@type": "HowToStep", "text": "Drop small spoonfuls of the raspberry sauce across the surface of the batter. Drag a knife gently through the sauce and top layer of batter to form a marbled swirl pattern.", "name": "Drop small spoonfuls of the raspberry sauce across the surface of the batter. Drag a knife gently through the sauce and top layer of batter to form a marbled swirl pattern.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-12"}, {"@type": "HowToStep", "text": "Bake for 30 minutes, or until a toothpick inserted into the center comes out with a few moist crumbs attached.", "name": "Bake for 30 minutes, or until a toothpick inserted into the center comes out with a few moist crumbs attached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-13"}, {"@type": "HowToStep", "text": "Let the brownies cool completely in the pan. Once cooled, lift them out using the parchment or foil overhang, then slice and serve.", "name": "Let the brownies cool completely in the pan. Once cooled, lift them out using the parchment or foil overhang, then slice and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/raspberry-swirl-brownies/#wprm-recipe-38760-step-0-14"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Raspberry Swirl Brownies"}</script>
