    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Buddha Bowls Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A vibrant, nourishing bowl crafted with wholesome vegetables, hearty grains, and a luscious Turmeric Tahini Sauce. Ideal for a quick lunch or an effortless dinner, this vegan and gluten-free dish is satisfying and versatile.", "datePublished": "2024-10-25T19:54:28+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/buddha-bowls-recipe/Buddha-Bowls-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/buddha-bowls-recipe/Buddha-Bowls-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/buddha-bowls-recipe/Buddha-Bowls-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/buddha-bowls-recipe/Buddha-Bowls-Recipe.png"], "recipeYield": ["4"], "prepTime": "PT15M", "cookTime": "PT20M", "totalTime": "PT35M", "recipeIngredient": ["2 cups cooked brown rice or quinoa", "1  watermelon radish or 2 red radishes", "8  kale leaves (chopped)", "¾ cup sauerkraut or other fermented vegetable", "1 cup cooked chickpeas or cooked lentils", "1  large sweet potato (cubed)", "Extra-virgin olive oil (for drizzling)", "1 cup shredded red cabbage", "Sea salt and freshly ground black pepper", "Lemon wedge (for squeezing)", "2 tablespoons sesame seeds or hemp seeds", "Microgreens (optional)", "2  medium carrots", "Turmeric Tahini Sauce (for serving)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F and prepare a large baking sheet with parchment paper. Toss the cubed sweet potato with a drizzle of olive oil, salt, and pepper, then spread evenly on the baking sheet. Roast for about 20 minutes until tender and golden. Thinly slice the radish into rounds using a mandoline, and shave the carrots into ribbons with a vegetable peeler. Combine the radish slices, carrot ribbons, and shredded cabbage in a bowl and brighten with a squeeze of lemon juice. In a separate bowl, place the chopped kale leaves, add a squeeze of lemon and a generous pinch of salt, then massage with your hands until the leaves are soft and reduced in volume by half. To serve, arrange the brown rice, chickpeas, kale, carrots, radishes, cabbage, sweet potatoes, sauerkraut, and sesame seeds in individual bowls. Add microgreens if desired, season with salt and pepper, and accompany with the Turmeric Tahini Sauce.", "name": "Preheat the oven to 400°F and prepare a large baking sheet with parchment paper. Toss the cubed sweet potato with a drizzle of olive oil, salt, and pepper, then spread evenly on the baking sheet. Roast for about 20 minutes until tender and golden. Thinly slice the radish into rounds using a mandoline, and shave the carrots into ribbons with a vegetable peeler. Combine the radish slices, carrot ribbons, and shredded cabbage in a bowl and brighten with a squeeze of lemon juice. In a separate bowl, place the chopped kale leaves, add a squeeze of lemon and a generous pinch of salt, then massage with your hands until the leaves are soft and reduced in volume by half. To serve, arrange the brown rice, chickpeas, kale, carrots, radishes, cabbage, sweet potatoes, sauerkraut, and sesame seeds in individual bowls. Add microgreens if desired, season with salt and pepper, and accompany with the Turmeric Tahini Sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/buddha-bowls-recipe/#wprm-recipe-51525-step-0-0"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Vegan"], "keywords": "Buddha Bowls Recipe"}</script>
