    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mashed Potatoes with Heavy Cream", "author": {"@type": "Person", "name": "BenDes"}, "description": "Rich, smooth mashed russet potatoes prepared with warm heavy cream, milk, butter, and softened cream cheese. The potatoes are gently seasoned and may be finished with sour cream, fresh thyme, and black pepper for additional flavor.", "datePublished": "2018-08-17T06:08:04+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/mashed-potatoes-with-heavy-cream.png", "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/mashed-potatoes-with-heavy-cream.png", "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/mashed-potatoes-with-heavy-cream.png"], "recipeIngredient": ["3 ounces cream cheese (brought to room temperature until softened)", "3½ pounds russet potatoes (peeled and cut into approximately 1-inch pieces)", "¾ cup heavy whipping cream (for a rich and creamy consistency)", "Kosher salt (as needed for the cooking water and final seasoning)", "4 tablespoons unsalted butter (softened)", "¾ cup milk", "Fresh thyme (finely chopped, for an optional garnish)", "Freshly ground black pepper (optional, for seasoning and serving)", "Sour cream (optional, for finishing)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Assemble all of the ingredients. Fill a large pot with water and place it on the stovetop without bringing it to a boil yet. If working with whole potatoes rather than pre-cut pieces, divide medium potatoes in half and larger potatoes into thirds, keeping the pieces as uniform as possible to promote even cooking.", "name": "Assemble all of the ingredients. Fill a large pot with water and place it on the stovetop without bringing it to a boil yet. If working with whole potatoes rather than pre-cut pieces, divide medium potatoes in half and larger potatoes into thirds, keeping the pieces as uniform as possible to promote even cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/#wprm-recipe-43597-step-0-0"}, {"@type": "HowToStep", "text": "Season the water generously with kosher salt and bring it to a boil. Reduce the heat to maintain a simmer, then add the potatoes. Cook until exceptionally tender and easily broken apart when tested with a fork.", "name": "Season the water generously with kosher salt and bring it to a boil. Reduce the heat to maintain a simmer, then add the potatoes. Cook until exceptionally tender and easily broken apart when tested with a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/#wprm-recipe-43597-step-0-1"}, {"@type": "HowToStep", "text": "Drain the cooked potatoes thoroughly, then transfer them back to the still-hot pot. Allow them to remain there briefly so residual moisture can evaporate.", "name": "Drain the cooked potatoes thoroughly, then transfer them back to the still-hot pot. Allow them to remain there briefly so residual moisture can evaporate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/#wprm-recipe-43597-step-0-2"}, {"@type": "HowToStep", "text": "Combine the milk, heavy cream, and softened unsalted butter in a separate saucepan. Warm the mixture gently without allowing it to reach a boil.", "name": "Combine the milk, heavy cream, and softened unsalted butter in a separate saucepan. Warm the mixture gently without allowing it to reach a boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/#wprm-recipe-43597-step-0-3"}, {"@type": "HowToStep", "text": "Add the softened cream cheese to the warm milk-and-cream mixture. Stir until the cheese is thoroughly incorporated and the mixture becomes smooth.", "name": "Add the softened cream cheese to the warm milk-and-cream mixture. Stir until the cheese is thoroughly incorporated and the mixture becomes smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/#wprm-recipe-43597-step-0-4"}, {"@type": "HowToStep", "text": "Mash the drained potatoes with a potato masher or pass them through a potato ricer, depending on the texture preferred.", "name": "Mash the drained potatoes with a potato masher or pass them through a potato ricer, depending on the texture preferred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/#wprm-recipe-43597-step-0-5"}, {"@type": "HowToStep", "text": "Pour the warm dairy mixture into the potatoes gradually, mixing as you go. Continue until the liquid is fully incorporated and the potatoes have a smooth, creamy consistency.", "name": "Pour the warm dairy mixture into the potatoes gradually, mixing as you go. Continue until the liquid is fully incorporated and the potatoes have a smooth, creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/#wprm-recipe-43597-step-0-6"}, {"@type": "HowToStep", "text": "Season the mashed potatoes with kosher salt and freshly ground black pepper to taste, adjusting as necessary. If desired, fold in one or two spoonfuls of sour cream along with a small amount of chopped fresh thyme. Serve warm, optionally finishing each portion with additional butter and freshly ground black pepper.", "name": "Season the mashed potatoes with kosher salt and freshly ground black pepper to taste, adjusting as necessary. If desired, fold in one or two spoonfuls of sour cream along with a small amount of chopped fresh thyme. Serve warm, optionally finishing each portion with additional butter and freshly ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mashed-potatoes-with-heavy-cream/#wprm-recipe-43597-step-0-7"}], "recipeCategory": ["Side Dish"], "keywords":
