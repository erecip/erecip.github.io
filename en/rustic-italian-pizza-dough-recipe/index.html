    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Rustic Italian Pizza Dough Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic Neapolitan-style dough yielding a thin, crisp base with rich flavor and authentic texture. Ideal for traditional toppings and a true Italian pizzeria experience at home.", "datePublished": "2024-06-20T07:54:58+00:00", "image": ["https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/Rustic-Italian-Pizza-Dough-Recipe.png", "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/Rustic-Italian-Pizza-Dough-Recipe.png", "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/Rustic-Italian-Pizza-Dough-Recipe.png", "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/Rustic-Italian-Pizza-Dough-Recipe.png"], "prepTime": "PT10M", "cookTime": "PT7M", "totalTime": "PT137M", "recipeIngredient": ["2.25 cups cold water", "1.5 tsp sea salt", "Favorite toppings (see below)", "5 cups all-purpose or 00 flour (plus more for dusting)", "1.5 tsp instant dry yeast or active dry yeast", "1 tbsp extra virgin olive oil", "Caramelized onions", "Smoked mozzarella cheese", "Sauteed mushrooms", "Arrabiata sauce", "Roasted peppers", "Heirloom tomatoes", "Ricotta meatballs", "Fresh basil", "Green onions"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat your oven to its maximum temperature—at least 525°F—and allow a pizza stone to heat inside for 45 minutes to an hour. In the bowl of a stand mixer fitted with the paddle attachment, combine flour, yeast, and sea salt. Mix briefly on low speed, then pour in cold water.", "name": "Preheat your oven to its maximum temperature—at least 525°F—and allow a pizza stone to heat inside for 45 minutes to an hour. In the bowl of a stand mixer fitted with the paddle attachment, combine flour, yeast, and sea salt. Mix briefly on low speed, then pour in cold water.", "url": "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/#wprm-recipe-49119-step-0-0"}, {"@type": "HowToStep", "text": "Replace the paddle with the dough hook and continue mixing on low for 8 to 10 minutes until the dough is smooth and only slightly adheres to the bottom of the bowl. If the dough clings to the sides, incorporate a small amount of flour; if overly dry, adjust with a touch more water.", "name": "Replace the paddle with the dough hook and continue mixing on low for 8 to 10 minutes until the dough is smooth and only slightly adheres to the bottom of the bowl. If the dough clings to the sides, incorporate a small amount of flour; if overly dry, adjust with a touch more water.", "url": "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/#wprm-recipe-49119-step-0-1"}, {"@type": "HowToStep", "text": "Turn the dough onto a surface, divide into six equal portions, and shape each into a ball. Place on a lightly oiled baking sheet, drizzle with olive oil, and cover loosely with plastic wrap. Let rise in a draft-free place, such as a turned-off oven, for 2 hours. The dough may also be refrigerated or frozen at this stage.", "name": "Turn the dough onto a surface, divide into six equal portions, and shape each into a ball. Place on a lightly oiled baking sheet, drizzle with olive oil, and cover loosely with plastic wrap. Let rise in a draft-free place, such as a turned-off oven, for 2 hours. The dough may also be refrigerated or frozen at this stage.", "url": "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/#wprm-recipe-49119-step-0-2"}, {"@type": "HowToStep", "text": "Lightly flour your countertop. Flatten a single dough ball into a ½-inch thick round or oval using your fingertips. Stretch it gently with your knuckles until approximately 10 inches across, being careful not to tear it.", "name": "Lightly flour your countertop. Flatten a single dough ball into a ½-inch thick round or oval using your fingertips. Stretch it gently with your knuckles until approximately 10 inches across, being careful not to tear it.", "url": "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/#wprm-recipe-49119-step-0-3"}, {"@type": "HowToStep", "text": "Generously coat a pizza peel or a piece of sturdy cardboard with semolina flour or cornmeal. Lay the stretched dough on the surface, ensuring it slides freely. Spoon 2 to 3 tablespoons of sauce into the center, spreading with the back of a spoon while keeping a 1-inch border clear and avoiding contact with the peel. Sprinkle with mozzarella and arrange desired toppings sparingly.", "name": "Generously coat a pizza peel or a piece of sturdy cardboard with semolina flour or cornmeal. Lay the stretched dough on the surface, ensuring it slides freely. Spoon 2 to 3 tablespoons of sauce into the center, spreading with the back of a spoon while keeping a 1-inch border clear and avoiding contact with the peel. Sprinkle with mozzarella and arrange desired toppings sparingly.", "url": "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/#wprm-recipe-49119-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the assembled pizza to the preheated stone and bake for 5 to 7 minutes until the edges are golden brown. For breakfast versions with egg, bake approximately 6 minutes for optimal doneness. Once baked, remove and garnish with fresh basil and grated Parmigiano Reggiano. Let stand briefly before slicing.", "name": "Transfer the assembled pizza to the preheated stone and bake for 5 to 7 minutes until the edges are golden brown. For breakfast versions with egg, bake approximately 6 minutes for optimal doneness. Once baked, remove and garnish with fresh basil and grated Parmigiano Reggiano. Let stand briefly before slicing.", "url": "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/#wprm-recipe-49119-step-0-5"}, {"@type": "HowToStep", "text": "By Hand Method", "name": "By Hand Method", "url": "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/#wprm-recipe-49119-step-0-6"}, {"@type": "HowToStep", "text": "Combine flour, salt, yeast, and cold water in a large bowl using a wooden spoon. Transfer to a floured surface and knead for 10 to 15 minutes until a smooth, slightly tacky dough forms. Proceed with the division, rising, and baking steps as outlined above.", "name": "Combine flour, salt, yeast, and cold water in a large bowl using a wooden spoon. Transfer to a floured surface and knead for 10 to 15 minutes until a smooth, slightly tacky dough forms. Proceed with the division, rising, and baking steps as outlined above.", "url": "https://erecip.github.io/en/rustic-italian-pizza-dough-recipe/#wprm-recipe-49119-step-0-7"}], "recipeCategory": ["dough"], "recipeCuisine": ["Italian"], "keywords": "Rustic Italian Pizza Dough Recipe"}</script>
