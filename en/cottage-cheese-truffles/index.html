    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Truffles", "author": {"@type": "Person", "name": "BenDes"}, "description": "Rich, smooth chocolate truffles made with blended cottage cheese, maple syrup, and cocoa powder, then finished with a crisp semi-sweet chocolate shell and a touch of flaky sea salt.", "datePublished": "2020-02-17T08:01:57+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/cottage-cheese-truffles.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/cottage-cheese-truffles.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/cottage-cheese-truffles.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/cottage-cheese-truffles.png"], "prepTime": "PT20M", "totalTime": "PT320M", "recipeIngredient": ["¾ cup cocoa powder (sifted until free of lumps)", "3 tablespoons pure maple syrup", "1 cup plain cottage cheese (preferably full-fat for a creamier texture)", "1 teaspoon coconut oil", "Flaky sea salt (added according to taste)", "¾ cup semi-sweet chocolate chips"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the cottage cheese mixture. Place the cottage cheese in a mini food processor and pulse until completely smooth and creamy.", "name": "Prepare the cottage cheese mixture. Place the cottage cheese in a mini food processor and pulse until completely smooth and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-0"}, {"@type": "HowToStep", "text": "Add the maple syrup and sifted cocoa powder. Continue processing until the ingredients form a uniform chocolate mixture, pausing when necessary to scrape down the sides of the processor. Taste and adjust the sweetness if needed.", "name": "Add the maple syrup and sifted cocoa powder. Continue processing until the ingredients form a uniform chocolate mixture, pausing when necessary to scrape down the sides of the processor. Taste and adjust the sweetness if needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-1"}, {"@type": "HowToStep", "text": "Refrigerate until firm. Spoon the blended mixture into a container and level the top. Cover securely and refrigerate for at least 4 hours, or leave it overnight, until sufficiently firm for shaping.", "name": "Refrigerate until firm. Spoon the blended mixture into a container and level the top. Cover securely and refrigerate for at least 4 hours, or leave it overnight, until sufficiently firm for shaping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-2"}, {"@type": "HowToStep", "text": "Shape the truffles. Line a plate with parchment paper. Using a small scoop, portion approximately 2 teaspoons of the chilled mixture at a time and shape each portion into a ball.", "name": "Shape the truffles. Line a plate with parchment paper. Using a small scoop, portion approximately 2 teaspoons of the chilled mixture at a time and shape each portion into a ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the formed truffles on the prepared plate. Continue until all of the mixture has been portioned, then place the plate in the freezer for 30 minutes to 1 hour.", "name": "Arrange the formed truffles on the prepared plate. Continue until all of the mixture has been portioned, then place the plate in the freezer for 30 minutes to 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-4"}, {"@type": "HowToStep", "text": "Prepare the melted chocolate. Combine the semi-sweet chocolate chips and coconut oil in a small saucepan. Heat over low heat, stirring continuously, until the chocolate is fully melted and smooth.", "name": "Prepare the melted chocolate. Combine the semi-sweet chocolate chips and coconut oil in a small saucepan. Heat over low heat, stirring continuously, until the chocolate is fully melted and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-5"}, {"@type": "HowToStep", "text": "Pour the melted chocolate into a small bowl to make coating the truffles easier.", "name": "Pour the melted chocolate into a small bowl to make coating the truffles easier.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-6"}, {"@type": "HowToStep", "text": "Coat each truffle. Working promptly, dip the chilled truffle balls individually into the melted chocolate until completely covered.", "name": "Coat each truffle. Working promptly, dip the chilled truffle balls individually into the melted chocolate until completely covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-7"}, {"@type": "HowToStep", "text": "Return each coated truffle to the parchment-lined plate and repeat until every piece has been coated.", "name": "Return each coated truffle to the parchment-lined plate and repeat until every piece has been coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-8"}, {"@type": "HowToStep", "text": "Finish and set. While the chocolate coating remains wet, lightly sprinkle the tops with flaky sea salt.", "name": "Finish and set. While the chocolate coating remains wet, lightly sprinkle the tops with flaky sea salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the finished truffles to the freezer for another 30 minutes to 1 hour, or until the chocolate shell has completely hardened.", "name": "Transfer the finished truffles to the freezer for another 30 minutes to 1 hour, or until the chocolate shell has completely hardened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-truffles/#wprm-recipe-44364-step-0-10"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Cottage Cheese Truffles"}</script>
