    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Black Bean Casserole Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty layered casserole featuring seasoned black beans, whole-wheat tortillas, salsa, and melted cheddar cheese. The beans are flavored with garlic, cumin, cilantro, and vegetable broth before being assembled into a warm, cheesy baked dish.", "datePublished": "2023-05-22T09:51:58+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/black-bean-casserole-recipe/black-bean-casserole-recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/black-bean-casserole-recipe/black-bean-casserole-recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/black-bean-casserole-recipe/black-bean-casserole-recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/black-bean-casserole-recipe/black-bean-casserole-recipe1.png"], "prepTime": "PT10M", "cookTime": "PT35M", "totalTime": "PT45M", "recipeIngredient": ["30 ounces black beans (thoroughly drained and rinsed)", "2  garlic cloves (finely minced, approximately 1 tablespoon)", "1 teaspoon ground cumin (preferably fresh and aromatic)", "1/2 cup low-sodium vegetable broth", "2 tablespoons fresh cilantro (finely chopped)", "2 teaspoons olive oil", "1/4 teaspoon freshly ground black pepper", "1/4 teaspoon salt", "1 cup shredded cheddar cheese (preferably 2% reduced-fat to minimize excess grease)", "4  whole-wheat tortillas (ideally 6 inches in diameter)", "12 ounces salsa with no added sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 375°F. Drain and thoroughly rinse the black beans, then set them aside while preparing the remaining ingredients.", "name": "Heat the oven to 375°F. Drain and thoroughly rinse the black beans, then set them aside while preparing the remaining ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/black-bean-ca t tortilla in the bottom of the prepared dish. Spread one-quarter of the seasoned black bean mixture over the tortilla, followed by one-quarter of the salsa and one-quarter of the shredded cheddar cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/black-bean-casserole-recipe/#wprm-recipe-44272-step-0-5"}, {"@type": "HowToStep", "text": "Repeat the layers with the remaining tortillas, beans, salsa, and cheese until all of the ingredients have been used, making sure the final layer is topped with cheese.", "name": "Repeat the layers with the remaining tortillas, beans, salsa, and cheese until all of the ingredients have been used, making sure the final layer is topped with cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/black-bean-casserole-recipe/#wprm-recipe-44272-step-0-6"}, {"@type": "HowToStep", "text": "Cover the casserole dish with aluminum foil and place it in the preheated oven. Bake for approximately 20 minutes, or until the cheese is thoroughly heated and bubbling.", "name": "Cover the casserole dish with aluminum foil and place it in the preheated oven. Bake for approximately 20 minutes, or until the cheese is thoroughly heated and bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/black-bean-casserole-recipe/#wprm-recipe-44272-step-0-7"}, {"@type": "HowToStep", "text": "Remove the foil and return the casserole to the oven for another 8–10 minutes, allowing the cheese on top to develop a lightly browned finish.", "name": "Remove the foil and return the casserole to the oven for another 8–10 minutes, allowing the cheese on top to develop a lightly browned finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/black-bean-casserole-recipe/#wprm-recipe-44272-step-0-8"}, {"@type": "HowToStep", "text": "Take the casserole out of the oven and allow it to rest for several minutes before serving. Serve while warm.", "name": "Take the casserole out of the oven and allow it to rest for several minutes before serving. Serve while warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/black-bean-casserole-recipe/#wprm-recipe-44272-step-0-9"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["Southwestern"], "keywords": "Black Bean Casserole Recipe"}</script>
