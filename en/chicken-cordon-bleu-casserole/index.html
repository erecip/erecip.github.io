    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Cordon Bleu Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy baked pasta casserole featuring tender chicken, savory ham, Swiss cheese sauce, and a crisp garlic-seasoned panko topping. Dijon mustard and apple cider vinegar add a subtle tang that balances the richness of the cream and cheese.", "datePublished": "2023-03-16T01:52:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/chicken-cordon-bleu-casserole2.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/chicken-cordon-bleu-casserole2.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/chicken-cordon-bleu-casserole2.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/chicken-cordon-bleu-casserole2.png"], "cookTime": "PT20M", "totalTime": "PT20M", "recipeIngredient": ["16 ounces penne pasta", "2 cups heavy whipping cream", "1 tablespoon packed brown sugar", "2 tablespoons finely minced fresh garlic", "¼ teaspoon freshly ground black pepper", "1 cup shredded Swiss cheese", "2 cups chicken broth", "2 tablespoons smooth Dijon mustard", "¼ cup unsalted butter", "1 tablespoon apple cider vinegar", "¼ cup all-purpose flour", "¼ teaspoon salt", "16 ounces cooked chicken (shredded or cut into cubes)", "16 ounces good-quality ham (chopped)", "½ teaspoon garlic powder", "2 tablespoons butter (melted)", "½ cup panko breadcrumbs"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the pasta and baking dish. Preheat the oven to 400°F (200°C). Lightly grease a 9 × 13-inch baking dish. Cook the penne according to the directions on the package, then drain thoroughly. Transfer the cooked pasta to the prepared dish and arrange it in an even layer.", "name": "Prepare the pasta and baking dish. Preheat the oven to 400°F (200°C). Lightly grease a 9 × 13-inch baking dish. Cook the penne according to the directions on the package, then drain thoroughly. Transfer the cooked pasta to the prepared dish and arrange it in an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/#wprm-recipe-43865-step-0-0"}, {"@type": "HowToStep", "text": "Begin the cheese sauce. Place ¼ cup unsalted butter in a medium saucepan over medium heat and allow it to melt. Add the minced garlic and all-purpose flour. Cook, stirring, for 1–2 minutes, until the garlic becomes aromatic.", "name": "Begin the cheese sauce. Place ¼ cup unsalted butter in a medium saucepan over medium heat and allow it to melt. Add the minced garlic and all-purpose flour. Cook, stirring, for 1–2 minutes, until the garlic becomes aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/#wprm-recipe-43865-step-0-1"}, {"@type": "HowToStep", "text": "Add the liquids and seasonings. Slowly whisk the chicken broth and heavy cream into the flour mixture, continuing until the sauce is smooth. Stir in the Dijon mustard, brown sugar, apple cider vinegar, salt, and black pepper.", "name": "Add the liquids and seasonings. Slowly whisk the chicken broth and heavy cream into the flour mixture, continuing until the sauce is smooth. Stir in the Dijon mustard, brown sugar, apple cider vinegar, salt, and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/#wprm-recipe-43865-step-0-2"}, {"@type": "HowToStep", "text": "Thicken and finish the sauce. Bring the mixture to a gentle simmer. Cook for 2–3 minutes, stirring occasionally, until the sauce thickens slightly. Take the saucepan off the heat and add the shredded Swiss cheese, stirring until completely melted and incorporated.", "name": "Thicken and finish the sauce. Bring the mixture to a gentle simmer. Cook for 2–3 minutes, stirring occasionally, until the sauce thickens slightly. Take the saucepan off the heat and add the shredded Swiss cheese, stirring until completely melted and incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/#wprm-recipe-43865-step-0-3"}, {"@type": "HowToStep", "text": "Assemble the casserole. Distribute the cooked chicken evenly over the penne. Scatter the chopped ham over the chicken, then pour the prepared Swiss cheese sauce across the casserole, making sure the pasta, chicken, and ham are evenly covered.", "name": "Assemble the casserole. Distribute the cooked chicken evenly over the penne. Scatter the chopped ham over the chicken, then pour the prepared Swiss cheese sauce across the casserole, making sure the pasta, chicken, and ham are evenly covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/#wprm-recipe-43865-step-0-4"}, {"@type": "HowToStep", "text": "Make the breadcrumb topping. Combine the panko breadcrumbs, melted butter, and garlic powder in a small bowl. Stir until the crumbs are evenly coated, then sprinkle the mixture uniformly over the casserole.", "name": "Make the breadcrumb topping. Combine the panko breadcrumbs, melted butter, and garlic powder in a small bowl. Stir until the crumbs are evenly coated, then sprinkle the mixture uniformly over the casserole.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/#wprm-recipe-43865-step-0-5"}, {"@type": "HowToStep", "text": "Bake. Place the casserole in the preheated oven and bake uncovered for 15–20 minutes. It is ready when the sauce is bubbling and the breadcrumb topping has developed a light golden-brown color.", "name": "Bake. Place the casserole in the preheated oven and bake uncovered for 15–20 minutes. It is ready when the sauce is bubbling and the breadcrumb topping has developed a light golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/#wprm-recipe-43865-step-0-6"}, {"@type": "HowToStep", "text": "Serve. Remove the baking dish from the oven and allow the casserole to cool briefly before serving. Serve while hot.", "name": "Serve. Remove the baking dish from the oven and allow the casserole to cool briefly before serving. Serve while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-cordon-bleu-casserole/#wprm-recipe-43865-step-0-7"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["American"], "keywords": "Chicken Cordon Bleu Casserole"}</script>
