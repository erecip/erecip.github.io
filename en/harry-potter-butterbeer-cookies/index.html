    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Harry Potter Butterbeer Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These Harry Potter Butterbeer Cookies combine soft butterscotch-packed cookies with a fluffy butterscotch frosting and a rich butterbeer-inspired caramel drizzle. Vanilla bean paste and butter extract reinforce the buttery flavor, while a reduced butterscotch beverage gives the finishing sauce its concentrated sweetness.", "datePublished": "2022-05-06T01:06:42+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/harry-potter-butterbeer-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/harry-potter-butterbeer-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/harry-potter-butterbeer-cookies.png", "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/harry-potter-butterbeer-cookies.png"], "totalTime": "PT55M", "recipeIngredient": ["¾ cup unsalted butter (softened to approximately 70°F)", "2 cups all-purpose flour", "¼ cup butterscotch chips (melted and cooled)", "2  large egg yolks (at room temperature)", "½ teaspoon baking powder", "¾ cup firmly packed light brown sugar", "1 tablespoon vanilla bean paste (or vanilla extract if preferred)", "½ teaspoon salt", "½ cup butterscotch chips", "1½ teaspoons butter extract", "¼ cup granulated sugar", "½ teaspoon baking soda", "3 tablespoons softened unsalted butter", "Pinch of salt", "12 ounces butterscotch beer or cream soda", "3 tablespoons heavy cream (brought to room temperature)", "½ cup unsalted butter (softened)", "¼ teaspoon butter extract", "1 cup powdered sugar (sifted)", "½ cup butterscotch chips (melted and cooled)", "⅛ teaspoon salt", "½ teaspoon vanilla bean paste"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F and cover two baking sheets with parchment paper.", "name": "Preheat the oven to 350°F and cover two baking sheets with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-0"}, {"@type": "HowToStep", "text": "Bring the refrigerated ingredients to room temperature before mixing. Properly softened butter will cream more effectively and help the cookie dough develop a smooth, even consistency.", "name": "Bring the refrigerated ingredients to room temperature before mixing. Properly softened butter will cream more effectively and help the cookie dough develop a smooth, even consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-1"}, {"@type": "HowToStep", "text": "Sift the 1 cup powdered sugar intended for the frosting. Melt the ¼ cup butterscotch chips for the cookie dough and the separate ½ cup portion for the frosting, keeping them in different bowls. Allow both melted portions to cool slightly.", "name": "Sift the 1 cup powdered sugar intended for the frosting. Melt the ¼ cup butterscotch chips for the cookie dough and the separate ½ cup portion for the frosting, keeping them in different bowls. Allow both melted portions to cool slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-2"}, {"@type": "HowToStep", "text": "Combine the all-purpose flour, baking soda, baking powder, and ½ teaspoon salt in a medium bowl. Whisk thoroughly so the leavening ingredients are distributed evenly.", "name": "Combine the all-purpose flour, baking soda, baking powder, and ½ teaspoon salt in a medium bowl. Whisk thoroughly so the leavening ingredients are distributed evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-3"}, {"@type": "HowToStep", "text": "Set the flour mixture aside until needed. Incorporating the dry ingredients only after the wet mixture is complete reduces the amount of stirring required and helps prevent an overly firm cookie texture.", "name": "Set the flour mixture aside until needed. Incorporating the dry ingredients only after the wet mixture is complete reduces the amount of stirring required and helps prevent an overly firm cookie texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-4"}, {"@type": "HowToStep", "text": "Place the softened ¾ cup butter, packed brown sugar, and granulated sugar in a large mixing bowl.", "name": "Place the softened ¾ cup butter, packed brown sugar, and granulated sugar in a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-5"}, {"@type": "HowToStep", "text": "Beat for 2–3 minutes, until the mixture becomes pale, airy, and noticeably increased in volume. This creaming stage introduces air into the mixture and contributes to the cookies' tender structure.", "name": "Beat for 2–3 minutes, until the mixture becomes pale, airy, and noticeably increased in volume. This creaming stage introduces air into the mixture and contributes to the cookies' tender structure.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-6"}, {"@type": "HowToStep", "text": "Add the room-temperature egg yolks, vanilla bean paste, and butter extract to the creamed butter mixture. Beat for approximately 1 minute, or until completely incorporated.", "name": "Add the room-temperature egg yolks, vanilla bean paste, and butter extract to the creamed butter mixture. Beat for approximately 1 minute, or until completely incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-7"}, {"@type": "HowToStep", "text": "Mix in the cooled ¼ cup melted butterscotch chips until the dough appears uniform in color.", "name": "Mix in the cooled ¼ cup melted butterscotch chips until the dough appears uniform in color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-8"}, {"@type": "HowToStep", "text": "Using a spatula or wooden spoon, gently fold in the prepared dry ingredients. Stop mixing as soon as the flour is no longer visible.", "name": "Using a spatula or wooden spoon, gently fold in the prepared dry ingredients. Stop mixing as soon as the flour is no longer visible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-9"}, {"@type": "HowToStep", "text": "Fold the remaining ½ cup whole butterscotch chips into the dough, distributing them as evenly as possible.", "name": "Fold the remaining ½ cup whole butterscotch chips into the dough, distributing them as evenly as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-10"}, {"@type": "HowToStep", "text": "Measure the cookie dough into approximately 2-tablespoon portions. Roll or shape each portion into a ball and place them on the prepared baking sheets, leaving about 2 inches between cookies.", "name": "Measure the cookie dough into approximately 2-tablespoon portions. Roll or shape each portion into a ball and place them on the prepared baking sheets, leaving about 2 inches between cookies.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-11"}, {"@type": "HowToStep", "text": "Bake for 10–11 minutes. The outer edges should look set while the centers remain slightly underbaked.", "name": "Bake for 10–11 minutes. The outer edges should look set while the centers remain slightly underbaked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-12"}, {"@type": "HowToStep", "text": "Allow the cookies to rest on the baking sheets for 5 minutes after removing them from the oven. Transfer them to a wire rack and cool completely before decorating.", "name": "Allow the cookies to rest on the baking sheets for 5 minutes after removing them from the oven. Transfer them to a wire rack and cool completely before decorating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-13"}, {"@type": "HowToStep", "text": "If a more precise round shape is desired, gently circle each warm cookie with a round cutter immediately after baking.", "name": "If a more precise round shape is desired, gently circle each warm cookie with a round cutter immediately after baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-14"}, {"@type": "HowToStep", "text": "While the cookies cool, pour the butterscotch beer or cream soda into a medium saucepan. Bring the liquid to a simmer over medium heat.", "name": "While the cookies cool, pour the butterscotch beer or cream soda into a medium saucepan. Bring the liquid to a simmer over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-15"}, {"@type": "HowToStep", "text": "Continue simmering for 15–17 minutes, stirring occasionally, until the beverage reduces to a thick, syrup-like consistency that coats the back of a spoon.", "name": "Continue simmering for 15–17 minutes, stirring occasionally, until the beverage reduces to a thick, syrup-like consistency that coats the back of a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-16"}, {"@type": "HowToStep", "text": "Turn the heat to low and stir in the 3 tablespoons softened butter until completely melted. Add the room-temperature heavy cream and a pinch of salt, then stir gently for approximately 1 minute.", "name": "Turn the heat to low and stir in the 3 tablespoons softened butter until completely melted. Add the room-temperature heavy cream and a pinch of salt, then stir gently for approximately 1 minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-17"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat and allow the butterbeer caramel to reach room temperature before using.", "name": "Remove the saucepan from the heat and allow the butterbeer caramel to reach room temperature before using.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-18"}, {"@type": "HowToStep", "text": "In a clean mixing bowl, beat the softened ½ cup butter together with ⅛ teaspoon salt for 5–10 minutes. Continue whipping until the butter is very light, creamy, and pale.", "name": "In a clean mixing bowl, beat the softened ½ cup butter together with ⅛ teaspoon salt for 5–10 minutes. Continue whipping until the butter is very light, creamy, and pale.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-19"}, {"@type": "HowToStep", "text": "Add the cooled ½ cup melted butterscotch chips and blend until incorporated.", "name": "Add the cooled ½ cup melted butterscotch chips and blend until incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-20"}, {"@type": "HowToStep", "text": "Gradually mix in the sifted powdered sugar, followed by the butter extract and vanilla bean paste. Beat for approximately 1 minute, or until the frosting becomes smooth and easily spreadable.", "name": "Gradually mix in the sifted powdered sugar, followed by the butter extract and vanilla bean paste. Beat for approximately 1 minute, or until the frosting becomes smooth and easily spreadable.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-21"}, {"@type": "HowToStep", "text": "After the cookies have cooled completely, pipe or spread a generous amount of butterscotch frosting onto each cookie. Finish by drizzling the cooled butterbeer caramel over the frosting.", "name": "After the cookies have cooled completely, pipe or spread a generous amount of butterscotch frosting onto each cookie. Finish by drizzling the cooled butterbeer caramel over the frosting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/harry-potter-butterbeer-cookies/#wprm-recipe-44478-step-0-22"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Harry Potter Butterbeer Cookies"}</script>
