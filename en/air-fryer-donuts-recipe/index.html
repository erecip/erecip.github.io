    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Air Fryer Donuts Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Crafted without yeast and using only four ingredients, these air fryer donuts offer a delightful blend of fluffiness and sweetness. With a golden exterior and tender interior, they’re quickly prepared and ideally glazed, making them a perfect indulgence ready in just minutes.", "datePublished": "2024-07-07T10:01:08+00:00", "image": ["https://erecip.github.io/en/air-fryer-donuts-recipe/Air-Fryer-Donuts-Recipe.png", "https://erecip.github.io/en/air-fryer-donuts-recipe/Air-Fryer-Donuts-Recipe.png", "https://erecip.github.io/en/air-fryer-donuts-recipe/Air-Fryer-Donuts-Recipe.png", "https://erecip.github.io/en/air-fryer-donuts-recipe/Air-Fryer-Donuts-Recipe.png"], "prepTime": "PT5M", "cookTime": "PT7M", "totalTime": "PT12M", "recipeIngredient": ["1 1/2 cups powdered sugar (sifted)", "1 3/4 cups self-rising flour", "1-2 tablespoons water or milk", "1 cup vanilla yogurt (refer to notes)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the self-rising flour and vanilla yogurt in a large mixing bowl and stir until a dense dough forms. If the consistency appears too wet, incorporate additional flour; if too dry, adjust with more yogurt.", "name": "Combine the self-rising flour and vanilla yogurt in a large mixing bowl and stir until a dense dough forms. If the consistency appears too wet, incorporate additional flour; if too dry, adjust with more yogurt.", "url": "https://erecip.github.io/en/air-fryer-donuts-recipe/#wprm-recipe-11606-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the dough onto a lightly floured surface. Knead it briefly until it becomes smooth and pliable. Partition into 8 equal segments. Roll each into a rope-like shape and seal the ends to form a donut.", "name": "Transfer the dough onto a lightly floured surface. Knead it briefly until it becomes smooth and pliable. Partition into 8 equal segments. Roll each into a rope-like shape and seal the ends to form a donut.", "url": "https://erecip.github.io/en/air-fryer-donuts-recipe/#wprm-recipe-11606-step-0-1"}, {"@type": "HowToStep", "text": "Place parchment paper inside your air fryer basket and arrange 2 to 4 donuts, ensuring at least half an inch of space between each for proper expansion.", "name": "Place parchment paper inside your air fryer basket and arrange 2 to 4 donuts, ensuring at least half an inch of space between each for proper expansion.", "url": "https://erecip.github.io/en/air-fryer-donuts-recipe/#wprm-recipe-11606-step-0-2"}, {"@type": "HowToStep", "text": "Cook in the air fryer at 200°C (400°F) for 7 to 8 minutes or until the exterior is firm. Repeat with the remaining dough.", "name": "Cook in the air fryer at 200°C (400°F) for 7 to 8 minutes or until the exterior is firm. Repeat with the remaining dough.", "url": "https://erecip.github.io/en/air-fryer-donuts-recipe/#wprm-recipe-11606-step-0-3"}, {"@type": "HowToStep", "text": "Allow the cooked donuts to cool entirely. While they cool, sift powdered sugar into a bowl, then gradually mix in water or milk to achieve a smooth, thick glaze.", "name": "Allow the cooked donuts to cool entirely. While they cool, sift powdered sugar into a bowl, then gradually mix in water or milk to achieve a smooth, thick glaze.", "url": "https://erecip.github.io/en/air-fryer-donuts-recipe/#wprm-recipe-11606-step-0-4"}, {"@type": "HowToStep", "text": "Dip each cooled donut into the glaze, then set on a wire rack to let excess drip off. Optionally, decorate with sprinkles.", "name": "Dip each cooled donut into the glaze, then set on a wire rack to let excess drip off. Optionally, decorate with sprinkles.", "url": "https://erecip.github.io/en/air-fryer-donuts-recipe/#wprm-recipe-11606-step-0-5"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Air Fryer Donuts Recipe"}</script>
