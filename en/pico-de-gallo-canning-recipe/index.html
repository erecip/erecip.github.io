    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pico de Gallo Canning Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tomato-based pico de gallo prepared with Roma tomatoes, white onion, jalapeño, cilantro, bottled lime juice, and pickling salt. The mixture is briefly simmered before being packed into jars.", "datePublished": "2022-05-23T02:28:31+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/pico-de-gallo-canning-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/pico-de-gallo-canning-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/pico-de-gallo-canning-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/pico-de-gallo-canning-recipe2.png"], "prepTime": "PT25M", "cookTime": "PT10M", "totalTime": "PT50M", "recipeIngredient": ["1  medium white onion (cut into a fine dice)", "½ cup commercially bottled lime juice", "2 tablespoons fresh cilantro (finely chopped)", "2 pounds Roma tomatoes (cut into ¼-inch cubes)", "1 teaspoon pickling salt", "1  large jalapeño pepper (seeded and finely minced for moderate heat)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Wash the jars, lids, and screw bands thoroughly. Following the supplied method, hold the jars in water heated to 180°F for 10 minutes and keep them hot until filling.", "name": "Wash the jars, lids, and screw bands thoroughly. Following the supplied method, hold the jars in water heated to 180°F for 10 minutes and keep them hot until filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-0"}, {"@type": "HowToStep", "text": "Rinse the tomatoes, onion, and jalapeño thoroughly.", "name": "Rinse the tomatoes, onion, and jalapeño thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-1"}, {"@type": "HowToStep", "text": "Cut the Roma tomatoes into approximately ¼-inch pieces. Finely dice the white onion. Remove the jalapeño seeds and ribs for a moderate level of heat, then mince the pepper finely.", "name": "Cut the Roma tomatoes into approximately ¼-inch pieces. Finely dice the white onion. Remove the jalapeño seeds and ribs for a moderate level of heat, then mince the pepper finely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-2"}, {"@type": "HowToStep", "text": "Finely chop the cilantro and arrange all prepared ingredients so they are ready before cooking begins.", "name": "Finely chop the cilantro and arrange all prepared ingredients so they are ready before cooking begins.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-3"}, {"@type": "HowToStep", "text": "Place the prepared tomatoes and onion in a saucepan over medium-high heat.", "name": "Place the prepared tomatoes and onion in a saucepan over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-4"}, {"@type": "HowToStep", "text": "As the vegetables begin to heat, incorporate the minced jalapeño, chopped cilantro, ½ cup bottled lime juice, and 1 teaspoon pickling salt.", "name": "As the vegetables begin to heat, incorporate the minced jalapeño, chopped cilantro, ½ cup bottled lime juice, and 1 teaspoon pickling salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-5"}, {"@type": "HowToStep", "text": "Stir thoroughly until the ingredients are evenly distributed, then bring the mixture to a full rolling boil.", "name": "Stir thoroughly until the ingredients are evenly distributed, then bring the mixture to a full rolling boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-6"}, {"@type": "HowToStep", "text": "Reduce the heat once boiling and maintain a gentle simmer for 3 minutes, stirring periodically to promote even heating.", "name": "Reduce the heat once boiling and maintain a gentle simmer for 3 minutes, stirring periodically to promote even heating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-7"}, {"@type": "HowToStep", "text": "Using a ladle, transfer the hot pico de gallo into the prepared hot jars, allowing ½ inch of headspace between the food and the top of each jar.", "name": "Using a ladle, transfer the hot pico de gallo into the prepared hot jars, allowing ½ inch of headspace between the food and the top of each jar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-8"}, {"@type": "HowToStep", "text": "Slide a clean bubble-removal tool or appropriate nonreactive utensil around the inside of each jar to release trapped air.", "name": "Slide a clean bubble-removal tool or appropriate nonreactive utensil around the inside of each jar to release trapped air.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-9"}, {"@type": "HowToStep", "text": "Clean the rims carefully with a damp cloth so no food residue remains where the lids must seal.", "name": "Clean the rims carefully with a damp cloth so no food residue remains where the lids must seal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-10"}, {"@type": "HowToStep", "text": "Position the lids on the jars and apply the screw bands until fingertip tight. The bands should be secure without being excessively tightened.", "name": "Position the lids on the jars and apply the screw bands until fingertip tight. The bands should be secure without being excessively tightened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-11"}, {"@type": "HowToStep", "text": "Following the originally supplied directions, place the filled jars in a boiling-water canner with the water reaching 1–2 inches above the tops of the jars.", "name": "Following the originally supplied directions, place the filled jars in a boiling-water canner with the water reaching 1–2 inches above the tops of the jars.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-12"}, {"@type": "HowToStep", "text": "Return the water to a vigorous boil and maintain the boil for the entire stated processing period.", "name": "Return the water to a vigorous boil and maintain the boil for the entire stated processing period.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-13"}, {"@type": "HowToStep", "text": "The supplied processing schedule is 15 minutes at elevations from 0–1,000 feet, 20 minutes from 1,001–6,000 feet, and 25 minutes above 6,000 feet. Use these processing times for shelf-stable preservation only when they correspond to a tested canning recipe for the same ingredients, proportions, and jar size.", "name": "The supplied processing schedule is 15 minutes at elevations from 0–1,000 feet, 20 minutes from 1,001–6,000 feet, and 25 minutes above 6,000 feet. Use these processing times for shelf-stable preservation only when they correspond to a tested canning recipe for the same ingredients, proportions, and jar size.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-14"}, {"@type": "HowToStep", "text": "At the end of processing, switch off the heat and leave the jars in the canner for 5 minutes before lifting them from the water.", "name": "At the end of processing, switch off the heat and leave the jars in the canner for 5 minutes before lifting them from the water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-15"}, {"@type": "HowToStep", "text": "Remove the jars carefully with a jar lifter and place them upright on a clean, heat-resistant surface with enough room between them for air circulation.", "name": "Remove the jars carefully with a jar lifter and place them upright on a clean, heat-resistant surface with enough room between them for air circulation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-16"}, {"@type": "HowToStep", "text": "Allow the jars to remain undisturbed for 12–24 hours while they cool completely.", "name": "Allow the jars to remain undisturbed for 12–24 hours while they cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-17"}, {"@type": "HowToStep", "text": "After cooling, press the center of each lid gently. A properly vacuum-sealed lid should remain firm and should not move up and down when pressed.", "name": "After cooling, press the center of each lid gently. A properly vacuum-sealed lid should remain firm and should not move up and down when pressed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-18"}, {"@type": "HowToStep", "text": "Refrigerate any jar that fails to seal. The supplied recipe recommends consuming an unsealed refrigerated jar within 2–3 weeks.", "name": "Refrigerate any jar that fails to seal. The supplied recipe recommends consuming an unsealed refrigerated jar within 2–3 weeks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pico-de-gallo-canning-recipe/#wprm-recipe-41927-step-0-19"}], "recipeCategory": ["Condiment", "salsa"], "recipeCuisine": ["Mexican-Inspired"], "keywords": "Pico de Gallo Canning Recipe"}</script>
