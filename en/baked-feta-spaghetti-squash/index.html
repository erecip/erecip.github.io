e into two halves. Scoop out and discard the seeds with a spoon.", "name": "Carefully slice the spaghetti squash lengthwise into two halves. Scoop out and discard the seeds with a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-feta-spaghetti-squash/#wprm-recipe-45816-step-0-1"}, {"@type": "HowToStep", "text": "Arrange both squash halves with their cut surfaces facing upward in a baking dish or on a rimmed baking sheet. Drizzle the flesh with 1 tablespoon of the olive oil, then season evenly with ¼ teaspoon kosher salt and a pinch of black pepper. Spread the oil and seasonings over the exposed flesh using clean hands or a pastry brush.", "name": "Arrange both squash halves with their cut surfaces facing upward in a baking dish or on a rimmed baking sheet. Drizzle the flesh with 1 tablespoon of the olive oil, then season evenly with ¼ teaspoon kosher salt and a pinch of black pepper. Spread the oil and seasonings over the exposed flesh using clean hands or a pastry brush.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-feta-spaghetti-squash/#wprm-recipe-45816-step-0-2"}, {"@type": "HowToStep", "text": "Measure out half of the total feta cheese, approximately 2–4 ounces depending on the amount being used, and divide it between the centers of the two squash halves. Gently press the feta pieces into the squash so they can soften and melt as the squash roasts. Reserve the remaining feta.", "name": "Measure out half of the total feta cheese, approximately 2–4 ounces depending on the amount being used, and divide it between the centers of the two squash halves. Gently press the feta pieces into the squash so they can soften and melt as the squash roasts. Reserve the remaining feta.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-feta-spaghetti-squash/#wprm-recipe-45816-step-0-3"}, {"@type": "HowToStep", "text": "In a small bowl, combine the cherry tomatoes, chopped roasted red peppers, minced garlic, Italian seasoning, and the remaining 2 tablespoons olive oil. Add kosher salt to taste along with a pinch of ground black pepper, then stir until everything is evenly coated.", "name": "In a small bowl, combine the cherry tomatoes, chopped roasted red peppers, minced garlic, Italian seasoning, and the remaining 2 tablespoons olive oil. Add kosher salt to taste along with a pinch of ground black pepper, then stir until everything is evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-feta-spaghetti-squash/#wprm-recipe-45816-step-0-4"}, {"@type": "HowToStep", "text": "Divide the tomato and roasted pepper mixture evenly between the prepared squash halves, arranging it over the feta.", "name": "Divide the tomato and roasted pepper mixture evenly between the prepared squash halves, arranging it over the feta.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-feta-spaghetti-squash/#wprm-recipe-45816-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the filled squash halves to the preheated oven. Roast for 50–60 minutes, or until the spaghetti squash is tender when pierced with a fork and the tomato-feta filling is hot and bubbling.", "name": "Transfer the filled squash halves to the preheated oven. Roast for 50–60 minutes, or until the spaghetti squash is tender when pierced with a fork and the tomato-feta filling is hot and bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-feta-spaghetti-squash/#wprm-recipe-45816-step-0-6"}, {"@type": "HowToStep", "text": "Remove the squash from the oven and allow it to cool for at least 10 minutes, making the shells easier to handle.", "name": "Remove the squash from the oven and allow it to cool for at least 10 minutes, making the shells easier to handle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-feta-spaghetti-squash/#wprm-recipe-45816-step-0-7"}, {"@type": "HowToStep", "text": "Use a fork to gently scrape the softened squash flesh into spaghetti-like strands. Mix the strands directly with the roasted tomato and feta filling until the melted cheese is thoroughly incorporated and the mixture develops a creamy consistency.", "name": "Use a fork to gently scrape the softened squash flesh into spaghetti-like strands. Mix the strands directly with the roasted tomato and feta filling until the melted cheese is thoroughly incorporated and the mixture develops a creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-feta-spaghetti-squash/#wprm-recipe-45816-step-0-8"}, {"@type": "HowToStep", "text": "Spoon the combined spaghetti squash mixture back into the hollowed squash shells to form filled squash boats.", "name": "Spoon the combined spaghetti squash mixture back into the hollowed squash shells to form filled squash boats.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-feta-spaghetti-squash/#wprm-recipe-45816-step-0-9"}, {"@type": "HowToStep", "text": "Finish with chopped fresh basil and additional or reserved feta cheese, if desired. Serve the baked feta spaghetti squash while warm.", "name": "Finish with chopped fresh basil and additional or reserved feta cheese, if desired. Serve the baked feta spaghetti squash while warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/baked-feta-spaghetti-squash/#wprm-recipe-45816-step-0-10"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Mediterranean-inspired"], "keywords": "Baked Feta Spaghetti Squash"}</script>
