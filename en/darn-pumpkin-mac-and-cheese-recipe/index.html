    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Darn Pumpkin Mac and Cheese Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich and creamy pumpkin mac and cheese featuring extra-sharp cheddar, Gruyere, and Parmesan, infused with the warmth of spices and crispy bacon. This dish brings a soul-warming twist to a classic favorite, perfect for cozy gatherings.", "datePublished": "2024-05-01T00:31:09+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Darn-Pumpkin-Mac-and-Cheese-recipe-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Darn-Pumpkin-Mac-and-Cheese-recipe-1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Darn-Pumpkin-Mac-and-Cheese-recipe-1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Darn-Pumpkin-Mac-and-Cheese-recipe-1-480x270.jpg"], "prepTime": "PT25M", "cookTime": "PT50M", "totalTime": "PT75M", "recipeIngredient": ["1 pound macaroni pasta or shell-shaped pasta", "1 teaspoon salt (for pasta water)", "1 pound thick-cut bacon", "3  large shallots (diced)", "5 tablespoons 70g unsalted butter", "3 tablespoons fresh sage (minced)", "2 cloves garlic (minced)", "1/3 cup 40g all-purpose flour", "3 cups 681ml whole milk", "1  can (15 ounces/425g pumpkin puree)", "2 1/2 teaspoons coarse Dijon mustard", "2 teaspoons packed light brown sugar", "1 1/4 teaspoons salt", "3/4 teaspoon cayenne pepper", "1/2 teaspoon onion powder", "1/4 teaspoon black pepper", "1/2 cup 113ml heavy cream", "10 ounces 283g extra-sharp cheddar cheese, grated", "8 ounces 226g Gruyere cheese, grated", "2 ounces 57g Parmesan cheese, finely grated", "2 teaspoons olive oil", "1/2 cup 30g panko bread crumbs"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C) and lightly grease a 3-quart baking dish. Set aside.", "name": "Preheat the oven to 375°F (190°C) and lightly grease a 3-quart baking dish. Set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-0"}, {"@type": "HowToStep", "text": "In a large pot, bring water to a boil and add 1 teaspoon of salt. Add the pasta and cook for 4 minutes, leaving it very al dente. Drain and pour into the prepared baking dish; set aside.", "name": "In a large pot, bring water to a boil and add 1 teaspoon of salt. Add the pasta and cook for 4 minutes, leaving it very al dente. Drain and pour into the prepared baking dish; set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-1"}, {"@type": "HowToStep", "text": "In a large skillet over medium heat, cook the bacon until crisp, about 4-5 minutes on each side. Place on a paper towel-lined plate to drain excess oil, then chop into small pieces. Reserve half for garnish and set aside.", "name": "In a large skillet over medium heat, cook the bacon until crisp, about 4-5 minutes on each side. Place on a paper towel-lined plate to drain excess oil, then chop into small pieces. Reserve half for garnish and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-2"}, {"@type": "HowToStep", "text": "In a large pan, melt the butter over medium heat. Add diced shallots and sauté for 5-6 minutes until softened and nearly translucent. Add the minced sage and garlic, stirring for 1-2 minutes until fragrant.", "name": "In a large pan, melt the butter over medium heat. Add diced shallots and sauté for 5-6 minutes until softened and nearly translucent. Add the minced sage and garlic, stirring for 1-2 minutes until fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-3"}, {"@type": "HowToStep", "text": "Sprinkle the flour over the shallot mixture, stirring constantly, and cook for 1 minute. Gradually add the milk, whisking continuously to avoid lumps. Add the pumpkin puree, whisking until the mixture is smooth.", "name": "Sprinkle the flour over the shallot mixture, stirring constantly, and cook for 1 minute. Gradually add the milk, whisking continuously to avoid lumps. Add the pumpkin puree, whisking until the mixture is smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-4"}, {"@type": "HowToStep", "text": "Continue whisking the mixture as it cooks, allowing it to thicken over approximately 5 minutes. Add the Dijon mustard, brown sugar, 1 1/4 teaspoons salt, cayenne pepper, onion powder, and black pepper, mixing well.", "name": "Continue whisking the mixture as it cooks, allowing it to thicken over approximately 5 minutes. Add the Dijon mustard, brown sugar, 1 1/4 teaspoons salt, cayenne pepper, onion powder, and black pepper, mixing well.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-5"}, {"@type": "HowToStep", "text": "Lower the heat and incorporate the heavy cream. Fold in the grated cheeses, stirring until melted and smooth. Mix in half of the bacon.", "name": "Lower the heat and incorporate the heavy cream. Fold in the grated cheeses, stirring until melted and smooth. Mix in half of the bacon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-6"}, {"@type": "HowToStep", "text": "Pour the cheese sauce over the pasta in the baking dish, stirring gently to coat the pasta evenly.", "name": "Pour the cheese sauce over the pasta in the baking dish, stirring gently to coat the pasta evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-7"}, {"@type": "HowToStep", "text": "In a small bowl, mix the panko bread crumbs with olive oil until thoroughly coated. Sprinkle this mixture evenly over the top of the mac and cheese.", "name": "In a small bowl, mix the panko bread crumbs with olive oil until thoroughly coated. Sprinkle this mixture evenly over the top of the mac and cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-8"}, {"@type": "HowToStep", "text": "Cover the baking dish with foil and bake in the preheated oven for 12 minutes. Remove the foil, sprinkle the remaining bacon over the top, and bake uncovered for an additional 5 minutes until golden.", "name": "Cover the baking dish with foil and bake in the preheated oven for 12 minutes. Remove the foil, sprinkle the remaining bacon over the top, and bake uncovered for an additional 5 minutes until golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-9"}, {"@type": "HowToStep", "text": "Garnish with extra sage, if desired, and serve warm.", "name": "Garnish with extra sage, if desired, and serve warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/darn-pumpkin-mac-and-cheese-recipe/#wprm-recipe-23775-step-0-10"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Darn Pumpkin Mac and Cheese Recipe"}</script>
