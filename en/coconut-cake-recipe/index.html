    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Coconut Cake Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A supremely soft and moist coconut cake enriched with the essence of coconut, frosted with a luscious coconut cream cheese icing, and adorned with a coating of shredded coconut for a delightful texture.", "datePublished": "2024-07-21T04:58:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/Coconut-Cake-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/Coconut-Cake-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/Coconut-Cake-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/Coconut-Cake-Recipe1.png"], "recipeYield": ["12"], "prepTime": "PT10M", "cookTime": "PT33M", "totalTime": "PT103M", "recipeIngredient": ["3  large eggs (at room temperature)", "1¼ cups 275 g canned coconut milk", "½ tsp salt (omit if using salted butter)", "½ cup 113 g unsalted butter, softened", "5 tbsp 66 g unflavoured vegetable oil (e.g., canola)", "1 tsp coconut essence or extract (or ½ tsp almond essence as a substitute)", "1 cup 80 g shredded coconut, dried and unsweetened", "2¼ cups 280 g all-purpose flour", "1 tbsp baking powder", "¼ cup 30 g cornstarch", "1½ tsps vanilla essence or extract", "1⅔ cups 332 g granulated white sugar", "1 tsp coconut essence or extract (or ½ tsp almond essence as a substitute)", "4½ cups 570 g icing sugar (also known as powdered or confectioners sugar)", "1½ tsps vanilla essence or extract", "1½ cups 120 g shredded coconut, dried and unsweetened, for decorating", "1½ cups 335 g cream cheese, firm and cold", "1 cup 225 g unsalted butter, softened"], "recipeInstructions": [{"@type": "HowToSection", "name": "Coconut Cake", "itemListElement": [{"@type": "HowToStep", "text": "Set your oven to 160°C (320°F) with the fan function activated. Prepare two 8-inch cake pans by greasing the sides and base, and lining the bottoms with parchment paper.", "name": "Set your oven to 160°C (320°F) with the fan function activated. Prepare two 8-inch cake pans by greasing the sides and base, and lining the bottoms with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-0-0"}, {"@type": "HowToStep", "text": "Sift together the flour, cornstarch, baking powder, and salt into a mixing bowl. Whisk briefly to combine evenly.", "name": "Sift together the flour, cornstarch, baking powder, and salt into a mixing bowl. Whisk briefly to combine evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-0-1"}, {"@type": "HowToStep", "text": "In a separate large bowl, cream the butter, oil, and sugar using an electric mixer on medium speed for approximately 2 minutes until the mixture becomes pale and fluffy.", "name": "In a separate large bowl, cream the butter, oil, and sugar using an electric mixer on medium speed for approximately 2 minutes until the mixture becomes pale and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-0-2"}, {"@type": "HowToStep", "text": "Incorporate the eggs one at a time, mixing thoroughly between each addition.", "name": "Incorporate the eggs one at a time, mixing thoroughly between each addition.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-0-3"}, {"@type": "HowToStep", "text": "Pour in the vanilla extract, coconut essence, and ½ cup of the coconut milk, then mix until smooth. Set aside the mixer.", "name": "Pour in the vanilla extract, coconut essence, and ½ cup of the coconut milk, then mix until smooth. Set aside the mixer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-0-4"}, {"@type": "HowToStep", "text": "Fold in half of the sifted dry ingredients using a spatula until just blended. Add the remaining ¾ cup of coconut milk, folding gently, then incorporate the rest of the dry mixture, being cautious not to overmix.", "name": "Fold in half of the sifted dry ingredients using a spatula until just blended. Add the remaining ¾ cup of coconut milk, folding gently, then incorporate the rest of the dry mixture, being cautious not to overmix.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-0-5"}, {"@type": "HowToStep", "text": "Add the shredded coconut and fold through gently until integrated.", "name": "Add the shredded coconut and fold through gently until integrated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-0-6"}, {"@type": "HowToStep", "text": "Divide the batter equally between the two prepared pans and bake for approximately 33 minutes, or until a skewer inserted comes out clean.", "name": "Divide the batter equally between the two prepared pans and bake for approximately 33 minutes, or until a skewer inserted comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-0-7"}, {"@type": "HowToStep", "text": "Cool the cakes in their tins for 15–20 minutes before transferring them to a wire rack to cool completely prior to frosting.", "name": "Cool the cakes in their tins for 15–20 minutes before transferring them to a wire rack to cool completely prior to frosting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-0-8"}]}, {"@type": "HowToSection", "name": "Coconut Cream Cheese Frosting", "itemListElement": [{"@type": "HowToStep", "text": "Beat the butter for several minutes until light and airy using a stand or hand mixer on medium-high speed.", "name": "Beat the butter for several minutes until light and airy using a stand or hand mixer on medium-high speed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-1-0"}, {"@type": "HowToStep", "text": "Gradually add the icing sugar in three additions, beating on low until fully incorporated before the next batch.", "name": "Gradually add the icing sugar in three additions, beating on low until fully incorporated before the next batch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-1-1"}, {"@type": "HowToStep", "text": "Add the cold cream cheese, vanilla, and coconut essence, then mix only until the frosting is smooth. Avoid overmixing.", "name": "Add the cold cream cheese, vanilla, and coconut essence, then mix only until the frosting is smooth. Avoid overmixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-1-2"}, {"@type": "HowToStep", "text": "Once the cakes are cooled, generously frost each layer and the exterior of the assembled cake.", "name": "Once the cakes are cooled, generously frost each layer and the exterior of the assembled cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-1-3"}]}, {"@type": "HowToSection", "name": "Assembly", "itemListElement": [{"@type": "HowToStep", "text": "Optionally trim the browned edges of each cake layer.", "name": "Optionally trim the browned edges of each cake layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-2-0"}, {"@type": "HowToStep", "text": "Spread a thick layer of frosting over the first cake layer.", "name": "Spread a thick layer of frosting over the first cake layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-2-1"}, {"@type": "HowToStep", "text": "Stack the second layer atop the first and frost the top and sides uniformly.", "name": "Stack the second layer atop the first and frost the top and sides uniformly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-2-2"}, {"@type": "HowToStep", "text": "Press shredded coconut onto the frosted exterior for added texture and visual appeal.", "name": "Press shredded coconut onto the frosted exterior for added texture and visual appeal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-2-3"}, {"@type": "HowToStep", "text": "Store leftovers in an airtight container to retain moisture.", "name": "Store leftovers in an airtight container to retain moisture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coconut-cake-recipe/#wprm-recipe-50925-step-2-4"}]}], "recipeCategory": ["Dessert"], "recipeCuisine": ["Western"], "keywords": "Coconut Cake Recipe"}</script>
