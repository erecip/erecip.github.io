    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Dark Chocolate Mousse", "author": {"@type": "Person", "name": "BenDes"}, "description": "A smooth, chocolate-forward mousse made from full-fat cottage cheese, cocoa powder, and powdered sugar. After a brief freeze, the mousse is finished with an optional layer of melted dark chocolate that sets into a firm shell, with sea salt providing a contrasting finish.", "datePublished": "2021-02-19T23:43:10+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dark-chocolate-mousse/cottage-cheese-dark-chocolate-mousse2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dark-chocolate-mousse/cottage-cheese-dark-chocolate-mousse2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dark-chocolate-mousse/cottage-cheese-dark-chocolate-mousse2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dark-chocolate-mousse/cottage-cheese-dark-chocolate-mousse2.png"], "totalTime": "PT120M", "recipeIngredient": ["1 cup full-fat cottage cheese (recommended for the smoothest texture)", "1/4 cup confectioners’ sugar", "1/3 cup Dutch-process cocoa powder (preferred for a deeper chocolate color)", "Dark chocolate (preferably approximately 70% cacao, amount as needed)", "Sea salt (for sprinkling, optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Add the cottage cheese, confectioners’ sugar, and cocoa powder to a blender or food processor. Process until completely smooth and relatively thin in consistency, forming a creamy chocolate mousse base.", "name": "Add the cottage cheese, confectioners’ sugar, and cocoa powder to a blender or food processor. Process until completely smooth and relatively thin in consistency, forming a creamy chocolate mousse base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dark-chocolate-mousse/#wprm-recipe-41735-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the blended mousse to a freezer-safe serving dish. Freeze for 1–2 hours, stirring the mixture once at the halfway point to encourage an even texture and help minimize the formation of ice crystals.", "name": "Transfer the blended mousse to a freezer-safe serving dish. Freeze for 1–2 hours, stirring the mixture once at the halfway point to encourage an even texture and help minimize the formation of ice crystals.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dark-chocolate-mousse/#wprm-recipe-41735-step-0-1"}, {"@type": "HowToStep", "text": "While the mousse is chilling, place the dark chocolate in a microwave-safe container. Microwave it in short intervals, stirring approximately every 10 seconds, until the chocolate is fully melted, glossy, and smooth. Take care not to overheat it.", "name": "While the mousse is chilling, place the dark chocolate in a microwave-safe container. Microwave it in short intervals, stirring approximately every 10 seconds, until the chocolate is fully melted, glossy, and smooth. Take care not to overheat it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dark-chocolate-mousse/#wprm-recipe-41735-step-0-2"}, {"@type": "HowToStep", "text": "Remove the set mousse from the freezer and pour the melted dark chocolate evenly over the surface. If desired, scatter a small amount of sea salt over the chocolate for a sweet-and-salty contrast. Serve once assembled.", "name": "Remove the set mousse from the freezer and pour the melted dark chocolate evenly over the surface. If desired, scatter a small amount of sea salt over the chocolate for a sweet-and-salty contrast. Serve once assembled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-dark-chocolate-mousse/#wprm-recipe-41735-step-0-3"}], "recipeCategory": ["Dessert"], "keywords": "Cottage Cheese Dark Chocolate Mousse"}</script>
