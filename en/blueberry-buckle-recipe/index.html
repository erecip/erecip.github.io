    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Blueberry Buckle Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A timeless treat, this classic Blueberry Buckle comes together effortlessly with just a handful of pantry staples. Delightful as a morning indulgence or a comforting dessert, its tender crumb and sweet streusel make it irresistible.", "datePublished": "2024-09-17T11:22:19+00:00", "image": ["https://erecip.github.io/en/blueberry-buckle-recipe/Blueberry-Buckle-Recipe1.png", "https://erecip.github.io/en/blueberry-buckle-recipe/Blueberry-Buckle-Recipe1.png", "https://erecip.github.io/en/blueberry-buckle-recipe/Blueberry-Buckle-Recipe1.png", "https://erecip.github.io/en/blueberry-buckle-recipe/Blueberry-Buckle-Recipe1.png"], "recipeYield": ["9"], "prepTime": "PT20M", "cookTime": "PT50M", "totalTime": "PT90M", "recipeIngredient": ["2 tablespoons granulated sugar", "½ cup all-purpose flour (60g)", "1 teaspoon ground cinnamon", "2 tablespoons unsalted butter (softened)", "¼ cup packed light brown sugar (55g)", "2 teaspoons vanilla extract", "2 teaspoons baking powder", "1 cup granulated sugar (200g)", "½ cup whole milk (120mL)", "1½ cups all-purpose flour (180g)", "½ cup unsalted butter (softened (113g))", "2½ cups fresh blueberries (394g)", "2 teaspoons lemon zest", "2  large eggs", "1 teaspoon salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "For the Streusel: In a small bowl, blend the flour, both sugars, and cinnamon. With a fork or fingertips, incorporate the softened butter until the mixture forms coarse crumbs. Refrigerate until needed.", "name": "For the Streusel: In a small bowl, blend the flour, both sugars, and cinnamon. With a fork or fingertips, incorporate the softened butter until the mixture forms coarse crumbs. Refrigerate until needed.", "url": "https://erecip.github.io/en/blueberry-buckle-recipe/#wprm-recipe-51243-step-0-0"}, {"@type": "HowToStep", "text": "For the Buckle: Begin by preheating the oven to 375°F and lightly greasing an 8×8-inch baking pan with baking spray. In a separate medium bowl, whisk the flour, baking powder, and salt. In a large bowl or stand mixer fitted with a paddle attachment, cream the butter, sugar, and lemon zest on medium speed for about 2 to 3 minutes until pale and fluffy. Incorporate the eggs one at a time, pausing to scrape down the sides as needed, then blend in the vanilla extract. With the mixer on low, add one-third of the dry ingredients, then pour in half the milk, mixing just until combined. Alternate adding the remaining dry ingredients and milk, finishing with the flour mixture. Gently fold in 2 cups of the blueberries. Evenly spread the batter into the prepared pan, scatter the chilled streusel over the top, and dot with the remaining ½ cup of blueberries. Bake for 50 to 55 minutes, loosely tenting with foil after 25 minutes if needed, until the surface is golden and a toothpick inserted in the center emerges clean. Allow the buckle to cool for at least 20 minutes before slicing to ensure clean cuts.", "name": "For the Buckle: Begin by preheating the oven to 375°F and lightly greasing an 8×8-inch baking pan with baking spray. In a separate medium bowl, whisk the flour, baking powder, and salt. In a large bowl or stand mixer fitted with a paddle attachment, cream the butter, sugar, and lemon zest on medium speed for about 2 to 3 minutes until pale and fluffy. Incorporate the eggs one at a time, pausing to scrape down the sides as needed, then blend in the vanilla extract. With the mixer on low, add one-third of the dry ingredients, then pour in half the milk, mixing just until combined. Alternate adding the remaining dry ingredients and milk, finishing with the flour mixture. Gently fold in 2 cups of the blueberries. Evenly spread the batter into the prepared pan, scatter the chilled streusel over the top, and dot with the remaining ½ cup of blueberries. Bake for 50 to 55 minutes, loosely tenting with foil after 25 minutes if needed, until the surface is golden and a toothpick inserted in the center emerges clean. Allow the buckle to cool for at least 20 minutes before slicing to ensure clean cuts.", "url": "https://erecip.github.io/en/blueberry-buckle-recipe/#wprm-recipe-51243-step-0-1"}], "recipeCategory": ["Breakfast", "Dessert"], "recipeCuisine": ["American"], "keywords": "Blueberry Buckle Recipe"}</script>
