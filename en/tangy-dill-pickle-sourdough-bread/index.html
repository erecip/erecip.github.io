    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Tangy Dill Pickle Sourdough Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "A naturally leavened sourdough loaf with a bright, savory character from dill pickle brine, chopped fresh dill, and small pieces of dill pickle folded into the dough. The finished bread has a crisp crust, a tender interior, and a pleasantly tangy flavor.", "datePublished": "2022-10-18T08:01:38+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/Tangy-Dill-Pickle-Sourdough-Bread1.png", "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/Tangy-Dill-Pickle-Sourdough-Bread1.png", "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/Tangy-Dill-Pickle-Sourdough-Bread1.png", "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/Tangy-Dill-Pickle-Sourdough-Bread1.png"], "prepTime": "PT30M", "cookTime": "PT45M", "totalTime": "PT495M", "recipeIngredient": ["35 g whole wheat flour", "30 g dill pickle brine (used to add tang and depth to the dough)", "375 g white bread flour", "50 g lively active sourdough starter", "260 g filtered water (warmed to 85°F)", "7 g fine sea salt", "80 g dill pickles (diced and blotted dry to reduce extra moisture)", "1 1/2 tablespoons fresh dill (finely minced for even distribution)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a large mixing bowl, combine the active sourdough starter, warm filtered water, and dill pickle brine. Stir with a fork until the starter has loosened and dispersed through the liquid.", "name": "In a large mixing bowl, combine the active sourdough starter, warm filtered water, and dill pickle brine. Stir with a fork until the starter has loosened and dispersed through the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-0"}, {"@type": "HowToStep", "text": "Add the white bread flour and whole wheat flour. Begin mixing with a spatula, then continue by hand until a rough, shaggy dough forms and no dry flour remains visible.", "name": "Add the white bread flour and whole wheat flour. Begin mixing with a spatula, then continue by hand until a rough, shaggy dough forms and no dry flour remains visible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-1"}, {"@type": "HowToStep", "text": "Scatter the fine sea salt over the surface of the dough. Cover the bowl with a damp cloth and allow the dough to rest for 40 minutes.", "name": "Scatter the fine sea salt over the surface of the dough. Cover the bowl with a damp cloth and allow the dough to rest for 40 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-2"}, {"@type": "HowToStep", "text": "After the resting period, knead the dough firmly by hand for 2 minutes to work the salt fully into the dough.", "name": "After the resting period, knead the dough firmly by hand for 2 minutes to work the salt fully into the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-3"}, {"@type": "HowToStep", "text": "Complete the first stretch-and-fold sequence by lifting one section of dough upward, stretching it gently, and folding it back over itself. Continue around the bowl until the dough has been folded from several sides.", "name": "Complete the first stretch-and-fold sequence by lifting one section of dough upward, stretching it gently, and folding it back over itself. Continue around the bowl until the dough has been folded from several sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-4"}, {"@type": "HowToStep", "text": "Cover the bowl again and let the dough rest for 30 minutes.", "name": "Cover the bowl again and let the dough rest for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-5"}, {"@type": "HowToStep", "text": "After the rest, distribute the diced dill pickles and finely chopped fresh dill evenly across the dough, reaching toward the edges of the bowl.", "name": "After the rest, distribute the diced dill pickles and finely chopped fresh dill evenly across the dough, reaching toward the edges of the bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-6"}, {"@type": "HowToStep", "text": "Perform another round of stretch and folds, working the pickles and dill into the dough as evenly as possible.", "name": "Perform another round of stretch and folds, working the pickles and dill into the dough as evenly as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-7"}, {"@type": "HowToStep", "text": "Cover the dough and let it rest for another 30 minutes.", "name": "Cover the dough and let it rest for another 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-8"}, {"@type": "HowToStep", "text": "Continue with 2 additional stretch-and-fold rounds, each followed by a 30-minute rest, for a total of 4 stretch-and-fold cycles. These folds help strengthen the dough and develop its structure.", "name": "Continue with 2 additional stretch-and-fold rounds, each followed by a 30-minute rest, for a total of 4 stretch-and-fold cycles. These folds help strengthen the dough and develop its structure.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-9"}, {"@type": "HowToStep", "text": "Once the folding sequence is complete, keep the dough covered with a damp cloth and leave it on the counter for bulk fermentation until it has risen by roughly 75%.", "name": "Once the folding sequence is complete, keep the dough covered with a damp cloth and leave it on the counter for bulk fermentation until it has risen by roughly 75%.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-10"}, {"@type": "HowToStep", "text": "At approximately 74°F, bulk fermentation will take about 4 hours. Cooler conditions may require more time, while warmer conditions may shorten the rise.", "name": "At approximately 74°F, bulk fermentation will take about 4 hours. Cooler conditions may require more time, while warmer conditions may shorten the rise.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-11"}, {"@type": "HowToStep", "text": "The dough is ready for shaping when it is glossy, slightly under doubled in size, and showing a few bubbles near the surface.", "name": "The dough is ready for shaping when it is glossy, slightly under doubled in size, and showing a few bubbles near the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-12"}, {"@type": "HowToStep", "text": "Gently transfer the dough onto a lightly floured work surface. Allow it to rest undisturbed for 10 to 15 minutes.", "name": "Gently transfer the dough onto a lightly floured work surface. Allow it to rest undisturbed for 10 to 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-13"}, {"@type": "HowToStep", "text": "Shape the dough as desired, then place it seam-side up in a flour-dusted, linen-lined banneton.", "name": "Shape the dough as desired, then place it seam-side up in a flour-dusted, linen-lined banneton.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-14"}, {"@type": "HowToStep", "text": "Cover the banneton with a shower cap or damp cloth and allow the dough to complete its final proof.", "name": "Cover the banneton with a shower cap or damp cloth and allow the dough to complete its final proof.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-15"}, {"@type": "HowToStep", "text": "For the final rise, refrigerate the dough overnight for up to 12 hours, or let it proof at room temperature for about 1 1/2 hours.", "name": "For the final rise, refrigerate the dough overnight for up to 12 hours, or let it proof at room temperature for about 1 1/2 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-16"}, {"@type": "HowToStep", "text": "When the dough has risen slightly and looks visibly puffy, prepare to bake.", "name": "When the dough has risen slightly and looks visibly puffy, prepare to bake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-17"}, {"@type": "HowToStep", "text": "Preheat the oven to 450°F with a Dutch oven inside.", "name": "Preheat the oven to 450°F with a Dutch oven inside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-18"}, {"@type": "HowToStep", "text": "Place a sheet of parchment paper over the dough, then carefully invert it so the seam side faces down.", "name": "Place a sheet of parchment paper over the dough, then carefully invert it so the seam side faces down.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-19"}, {"@type": "HowToStep", "text": "Score the top of the loaf at least 1/2 inch deep to help steam escape and guide expansion during baking.", "name": "Score the top of the loaf at least 1/2 inch deep to help steam escape and guide expansion during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-20"}, {"@type": "HowToStep", "text": "Lift the dough with the parchment and place it into the hot Dutch oven. Cover with the lid.", "name": "Lift the dough with the parchment and place it into the hot Dutch oven. Cover with the lid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-21"}, {"@type": "HowToStep", "text": "Bake at 450°F for 25 minutes.", "name": "Bake at 450°F for 25 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-22"}, {"@type": "HowToStep", "text": "Remove the lid, reduce the oven temperature to 435°F, and continue baking for another 20 minutes, or until the crust is deeply golden and crisp.", "name": "Remove the lid, reduce the oven temperature to 435°F, and continue baking for another 20 minutes, or until the crust is deeply golden and crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-23"}, {"@type": "HowToStep", "text": "Transfer the loaf to a cooling rack and let it cool for at least 1 hour before slicing so the interior can set properly and avoid a gummy texture.", "name": "Transfer the loaf to a cooling rack and let it cool for at least 1 hour before slicing so the interior can set properly and avoid a gummy texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tangy-dill-pickle-sourdough-bread/#wprm-recipe-38843-step-0-24"}], "recipeCategory": ["Bread"], "recipeCuisine": ["Artisan Bread"], "keywords": "Tangy Dill Pickle Sourdough Bread"}</script>
