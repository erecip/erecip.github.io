 "Bake the assembled layers for an additional 25–30 minutes, or until the filling sets firmly.", "name": "Bake the assembled layers for an additional 25–30 minutes, or until the filling sets firmly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/german-chocolate-pecan-pie-bars/#wprm-recipe-6206-step-0-5"}, {"@type": "HowToStep", "text": "As the bars bake, prepare the topping. In a small saucepan over low heat, melt together the sweetened condensed milk, unsalted butter, semisweet chocolate chips, and vanilla extract, stirring until smooth and well combined.", "name": "As the bars bake, prepare the topping. In a small saucepan over low heat, melt together the sweetened condensed milk, unsalted butter, semisweet chocolate chips, and vanilla extract, stirring until smooth and well combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/german-chocolate-pecan-pie-bars/#wprm-recipe-6206-step-0-6"}, {"@type": "HowToStep", "text": "Once the bars are removed from the oven, immediately pour the warm chocolate topping evenly over the baked filling.", "name": "Once the bars are removed from the oven, immediately pour the warm chocolate topping evenly over the baked filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/german-chocolate-pecan-pie-bars/#wprm-recipe-6206-step-0-7"}, {"@type": "HowToStep", "text": "Allow the bars to cool completely on a wire rack before refrigerating for 1–2 hours, ensuring the topping sets firmly.", "name": "Allow the bars to cool completely on a wire rack before refrigerating for 1–2 hours, ensuring the topping sets firmly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/german-chocolate-pecan-pie-bars/#wprm-recipe-6206-step-0-8"}, {"@type": "HowToStep", "text": "Slice into squares or bars and serve.", "name": "Slice into squares or bars and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/german-chocolate-pecan-pie-bars/#wprm-recipe-6206-step-0-9"}], "recipeCa
