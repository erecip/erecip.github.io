    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sweet Potato Bites", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, caramelized sweet potato rounds are topped with a lightly mashed avocado mixture, crisp bacon, and fresh cilantro. These savory bites combine creamy, smoky, salty, and citrus-forward flavors in an easy-to-serve appetizer.", "datePublished": "2019-03-26T23:34:49+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/sweet-potato-bites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/sweet-potato-bites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/sweet-potato-bites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/sweet-potato-bites2.png"], "totalTime": "PT55M", "recipeIngredient": ["3/4 teaspoon freshly ground black pepper", "2  sweet potatoes (left unpeeled)", "1 teaspoon kosher salt", "1 1/2 tablespoons olive oil (divided)", "1/2 teaspoon smoked paprika", "2  medium avocados (cut into small cubes)", "1/4 teaspoon kosher salt", "1 tablespoon fresh lime juice", "4  thick-cut bacon slices (approximately 3 ounces)", "3 tablespoons finely chopped fresh cilantro"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 400°F.", "name": "Preheat the oven to 400°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-0"}, {"@type": "HowToStep", "text": "Lay the four thick bacon slices on a baking sheet in a single layer. Bake for approximately 12–15 minutes, or until the bacon becomes crisp.", "name": "Lay the four thick bacon slices on a baking sheet in a single layer. Bake for approximately 12–15 minutes, or until the bacon becomes crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the cooked bacon to a plate lined with paper towels and gently blot away any excess grease.", "name": "Transfer the cooked bacon to a plate lined with paper towels and gently blot away any excess grease.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-2"}, {"@type": "HowToStep", "text": "Allow the bacon to cool until it can be comfortably handled, then chop it into small pieces and reserve for assembly.", "name": "Allow the bacon to cool until it can be comfortably handled, then chop it into small pieces and reserve for assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-3"}, {"@type": "HowToStep", "text": "Raise the oven temperature to 425°F. If reusing the baking sheets from the bacon, replace the used foil with a fresh lining.", "name": "Raise the oven temperature to 425°F. If reusing the baking sheets from the bacon, replace the used foil with a fresh lining.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-4"}, {"@type": "HowToStep", "text": "Coat two rimmed baking sheets with 1/2 tablespoon olive oil each.", "name": "Coat two rimmed baking sheets with 1/2 tablespoon olive oil each.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-5"}, {"@type": "HowToStep", "text": "Using a mandoline slicer or a sharp knife, cut the unpeeled sweet potatoes crosswise into rounds approximately 1/4- to 1/2-inch thick.", "name": "Using a mandoline slicer or a sharp knife, cut the unpeeled sweet potatoes crosswise into rounds approximately 1/4- to 1/2-inch thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-6"}, {"@type": "HowToStep", "text": "Spread the sweet potato rounds over the prepared pans in a single layer. Brush their upper surfaces with the remaining 1 tablespoon olive oil.", "name": "Spread the sweet potato rounds over the prepared pans in a single layer. Brush their upper surfaces with the remaining 1 tablespoon olive oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-7"}, {"@type": "HowToStep", "text": "Season evenly with 1 teaspoon kosher salt and the full 3/4 teaspoon of ground black pepper.", "name": "Season evenly with 1 teaspoon kosher salt and the full 3/4 teaspoon of ground black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-8"}, {"@type": "HowToStep", "text": "Roast for 20–25 minutes, rotating the baking sheets halfway through the cooking period. Turn each sweet potato round over, then continue roasting for another 8–11 minutes, until both sides are attractively golden.", "name": "Roast for 20–25 minutes, rotating the baking sheets halfway through the cooking period. Turn each sweet potato round over, then continue roasting for another 8–11 minutes, until both sides are attractively golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-9"}, {"@type": "HowToStep", "text": "While the sweet potatoes are roasting, place the diced avocados in a small bowl with 1 tablespoon lime juice, 1/4 teaspoon kosher salt, and 1/2 teaspoon smoked paprika.", "name": "While the sweet potatoes are roasting, place the diced avocados in a small bowl with 1 tablespoon lime juice, 1/4 teaspoon kosher salt, and 1/2 teaspoon smoked paprika.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-10"}, {"@type": "HowToStep", "text": "Gently press and stir the mixture with a fork until partially mashed while retaining small pieces of avocado for texture.", "name": "Gently press and stir the mixture with a fork until partially mashed while retaining small pieces of avocado for texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-11"}, {"@type": "HowToStep", "text": "Set the prepared avocado mixture aside until the sweet potatoes are ready.", "name": "Set the prepared avocado mixture aside until the sweet potatoes are ready.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-12"}, {"@type": "HowToStep", "text": "Arrange the roasted sweet potato rounds on a serving platter.", "name": "Arrange the roasted sweet potato rounds on a serving platter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-13"}, {"@type": "HowToStep", "text": "Spoon a portion of the avocado topping onto each sweet potato slice.", "name": "Spoon a portion of the avocado topping onto each sweet potato slice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-14"}, {"@type": "HowToStep", "text": "Scatter the chopped bacon over the avocado, then garnish each bite with freshly chopped cilantro.", "name": "Scatter the chopped bacon over the avocado, then garnish each bite with freshly chopped cilantro.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-15"}, {"@type": "HowToStep", "text": "Serve the assembled sweet potato bites while warm or allow them to reach room temperature before serving.", "name": "Serve the assembled sweet potato bites while warm or allow them to reach room temperature before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-bites/#wprm-recipe-41173-step-0-16"}], "recipeCategory": ["Appetizer", "Snack"], "recipeCuisine": ["American"], "keywords": "Sweet Potato Bites"}</script>
