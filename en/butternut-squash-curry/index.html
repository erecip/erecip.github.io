    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Butternut Squash Curry", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy, aromatic butternut squash curry made with red lentils, coconut milk, red curry paste, warming spices, fresh ginger, garlic, and lime. The squash becomes tender while the lentils help give the sauce a satisfying body. This recipe includes directions for both Instant Pot and stovetop preparation.", "datePublished": "2023-09-02T17:14:27+00:00", "cookTime": "PT4M", "totalTime": "PT19M", "recipeIngredient": ["2 cups butternut squash (cut into approximately 1-inch cubes)", "1  can (13.5 oz coconut milk, with roughly 3/4 of the can used initially)", "2 tablespoons red curry paste (preferably Maesri)", "1  medium yellow onion (chopped (about 175 grams))", "1 cup water (8 oz)", "1 inch fresh ginger (finely minced (about 12 grams))", "3/4 teaspoon ground coriander", "Juice from 1 lime", "1/4 cup split red lentils (masuri dal dhuli, about 55 grams)", "1 1/2 tablespoons avocado oil (22 ml)", "1/2 teaspoon smoked paprika", "3 to 4  large garlic cloves (chopped, about 12 grams)", "2 teaspoons brown sugar", "1/2  jalapeño (seeds removed and flesh finely minced)", "1/2 teaspoon ground turmeric", "3/4 teaspoon salt (with additional salt as needed)", "Fresh cilantro leaves (roughly chopped as desired)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the avocado oil using the Sauté setting of the Instant Pot. For stovetop preparation, warm the oil in a pan over medium heat.", "name": "Heat the avocado oil using the Sauté setting of the Instant Pot. For stovetop preparation, warm the oil in a pan over medium heat.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-0"}, {"@type": "HowToStep", "text": "Add the chopped yellow onion, minced ginger, garlic, and deseeded jalapeño. Sauté for approximately 3 minutes, stirring from time to time, until the onion has softened and the aromatics become fragrant.", "name": "Add the chopped yellow onion, minced ginger, garlic, and deseeded jalapeño. Sauté for approximately 3 minutes, stirring from time to time, until the onion has softened and the aromatics become fragrant.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-1"}, {"@type": "HowToStep", "text": "Stir the red curry paste into the sautéed mixture. Continue mixing until the paste is thoroughly distributed and releases its aroma.", "name": "Stir the red curry paste into the sautéed mixture. Continue mixing until the paste is thoroughly distributed and releases its aroma.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-2"}, {"@type": "HowToStep", "text": "Add the cubed butternut squash and split red lentils. Stir carefully so the squash and lentils are evenly coated with the curry mixture.", "name": "Add the cubed butternut squash and split red lentils. Stir carefully so the squash and lentils are evenly coated with the curry mixture.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-3"}, {"@type": "HowToStep", "text": "Season with the coriander, turmeric, smoked paprika, brown sugar, and salt. Mix until the seasonings are evenly incorporated.", "name": "Season with the coriander, turmeric, smoked paprika, brown sugar, and salt. Mix until the seasonings are evenly incorporated.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-4"}, {"@type": "HowToStep", "text": "Pour in 1 cup of water. Stir thoroughly while scraping across the bottom of the pot to loosen any ingredients that may have adhered to the surface.", "name": "Pour in 1 cup of water. Stir thoroughly while scraping across the bottom of the pot to loosen any ingredients that may have adhered to the surface.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-5"}, {"@type": "HowToStep", "text": "For the Instant Pot method, secure the lid and move the valve to the sealing position. Cook on High Pressure for 4 minutes, then perform a quick pressure release when the cooking cycle is complete.", "name": "For the Instant Pot method, secure the lid and move the valve to the sealing position. Cook on High Pressure for 4 minutes, then perform a quick pressure release when the cooking cycle is complete.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-6"}, {"@type": "HowToStep", "text": "For the stovetop method, reduce the temperature to medium-low, cover the pan, and simmer for approximately 15–18 minutes, or until the butternut squash is tender and the lentils are fully cooked.", "name": "For the stovetop method, reduce the temperature to medium-low, cover the pan, and simmer for approximately 15–18 minutes, or until the butternut squash is tender and the lentils are fully cooked.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-7"}, {"@type": "HowToStep", "text": "Once the pressure has been released, open the Instant Pot and select the Sauté function again. If using the stovetop method, increase the heat after the squash and lentils have finished cooking.", "name": "Once the pressure has been released, open the Instant Pot and select the Sauté function again. If using the stovetop method, increase the heat after the squash and lentils have finished cooking.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-8"}, {"@type": "HowToStep", "text": "Stir in approximately 3/4 of the can of coconut milk. More coconut milk may be incorporated if a richer, creamier consistency is preferred.", "name": "Stir in approximately 3/4 of the can of coconut milk. More coconut milk may be incorporated if a richer, creamier consistency is preferred.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-9"}, {"@type": "HowToStep", "text": "Add the freshly squeezed lime juice along with fresh cilantro leaves. Stir gently to distribute them throughout the curry.", "name": "Add the freshly squeezed lime juice along with fresh cilantro leaves. Stir gently to distribute them throughout the curry.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-10"}, {"@type": "HowToStep", "text": "Allow the curry to simmer for another 2–3 minutes, giving the coconut milk, lime, spices, and aromatics time to blend together.", "name": "Allow the curry to simmer for another 2–3 minutes, giving the coconut milk, lime, spices, and aromatics time to blend together.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-11"}, {"@type": "HowToStep", "text": "Serve the butternut squash curry hot and finish with additional fresh cilantro leaves as a garnish, if desired. Pair with steamed rice or another preferred grain.", "name": "Serve the butternut squash curry hot and finish with additional fresh cilantro leaves as a garnish, if desired. Pair with steamed rice or another preferred grain.", "url": "https://erecip.github.io/en/butternut-squash-curry/#wprm-recipe-41447-step-0-12"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Thai-Inspired"], "keywords": "Butternut Squash Curry"}</script>
