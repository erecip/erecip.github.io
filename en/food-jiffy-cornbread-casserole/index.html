    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Food Jiffy Cornbread Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "A hearty layered casserole featuring seasoned ground beef, corn, tomatoes, cheddar cheese, and a tender corn muffin topping. The dish is baked until golden, then rested briefly so the layers hold together neatly when served.", "datePublished": "2018-11-25T10:13:54+00:00", "image": ["https://erecip.github.io/en/food-jiffy-cornbread-casserole/food-jiffy-cornbread-casserole.png", "https://erecip.github.io/en/food-jiffy-cornbread-casserole/food-jiffy-cornbread-casserole.png", "https://erecip.github.io/en/food-jiffy-cornbread-casserole/food-jiffy-cornbread-casserole.png", "https://erecip.github.io/en/food-jiffy-cornbread-casserole/food-jiffy-cornbread-casserole.png"], "prepTime": "PT20M", "cookTime": "PT35M", "totalTime": "PT65M", "recipeIngredient": ["1 cup full-fat whole milk", "2 tablespoons butter (melted)", "2  large eggs", "½ cup sour cream", "2  packages corn muffin mix (8.5 ounces each)", "2 cups cheddar cheese (shredded and divided into two 1-cup portions)", "2 cups frozen corn", "¼ teaspoon freshly ground black pepper", "1  large yellow onion (cut into small dice)", "1  can (14.5 ounces diced tomatoes, thoroughly drained)", "2 teaspoons ground cumin", "1 pound ground beef", "1 teaspoon garlic salt", "1 tablespoon chili powder"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 375°F (190°C). Coat a 9 × 13-inch baking dish with grease and set it aside.", "name": "Heat the oven to 375°F (190°C). Coat a 9 × 13-inch baking dish with grease and set it aside.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-0"}, {"@type": "HowToStep", "text": "Place the ground beef and diced yellow onion in a large skillet over medium heat. Cook for approximately 8 minutes, breaking up the meat as necessary, until the beef is completely browned and the onion has softened.", "name": "Place the ground beef and diced yellow onion in a large skillet over medium heat. Cook for approximately 8 minutes, breaking up the meat as necessary, until the beef is completely browned and the onion has softened.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-1"}, {"@type": "HowToStep", "text": "Drain away any excess grease from the skillet.", "name": "Drain away any excess grease from the skillet.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-2"}, {"@type": "HowToStep", "text": "Add the frozen corn, chili powder, cumin, garlic salt, and black pepper to the cooked beef mixture. Stir thoroughly and continue cooking for another 3 minutes. Remove the skillet from the heat.", "name": "Add the frozen corn, chili powder, cumin, garlic salt, and black pepper to the cooked beef mixture. Stir thoroughly and continue cooking for another 3 minutes. Remove the skillet from the heat.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-3"}, {"@type": "HowToStep", "text": "In a large mixing bowl, combine the corn muffin mix, eggs, whole milk, sour cream, and melted butter. Stir only until the ingredients are incorporated. Avoid excessive mixing so the baked cornbread remains light and tender.", "name": "In a large mixing bowl, combine the corn muffin mix, eggs, whole milk, sour cream, and melted butter. Stir only until the ingredients are incorporated. Avoid excessive mixing so the baked cornbread remains light and tender.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-4"}, {"@type": "HowToStep", "text": "Spread half of the prepared cornbread batter evenly across the bottom of the greased baking dish.", "name": "Spread half of the prepared cornbread batter evenly across the bottom of the greased baking dish.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-5"}, {"@type": "HowToStep", "text": "Distribute the cooked beef and corn mixture evenly over the batter rather than placing it in a single area. Scatter 1 cup of the shredded cheddar over the beef layer.", "name": "Distribute the cooked beef and corn mixture evenly over the batter rather than placing it in a single area. Scatter 1 cup of the shredded cheddar over the beef layer.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-6"}, {"@type": "HowToStep", "text": "Arrange the drained diced tomatoes evenly over the cheese.", "name": "Arrange the drained diced tomatoes evenly over the cheese.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-7"}, {"@type": "HowToStep", "text": "Carefully spread the remaining cornbread batter over the tomato layer. Sprinkle the final 1 cup of shredded cheddar evenly across the top.", "name": "Carefully spread the remaining cornbread batter over the tomato layer. Sprinkle the final 1 cup of shredded cheddar evenly across the top.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the casserole to the preheated oven and bake for 35–40 minutes. It is ready when the cornbread is golden brown and a toothpick inserted into the bread portion comes out clean.", "name": "Transfer the casserole to the preheated oven and bake for 35–40 minutes. It is ready when the cornbread is golden brown and a toothpick inserted into the bread portion comes out clean.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-9"}, {"@type": "HowToStep", "text": "Allow the casserole to stand for 10 minutes after removing it from the oven. This resting period helps the layers set and makes the casserole easier to slice.", "name": "Allow the casserole to stand for 10 minutes after removing it from the oven. This resting period helps the layers set and makes the casserole easier to slice.", "url": "https://erecip.github.io/en/food-jiffy-cornbread-casserole/#wprm-recipe-44211-step-0-10"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["American"], "keywords": "Food Jiffy Cornbread Casserole"}</script>
