    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sweet Potato Gnocchi", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender, delicately textured gnocchi prepared with roasted sweet potatoes, egg yolk, and a modest amount of flour. The dough is piped directly into simmering water, producing light dumplings that may be served with sauce immediately or pan-crisped before serving.", "datePublished": "2020-10-11T20:37:32+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/sweet-potato-gnocchi.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/sweet-potato-gnocchi.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/sweet-potato-gnocchi.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/sweet-potato-gnocchi.png"], "cookTime": "PT45M", "totalTime": "PT45M", "recipeIngredient": ["5.3 oz all-purpose flour (preferably King Arthur all-purpose flour)", "1½ teaspoons salt", "2.2 lb sweet potatoes (selected in similar sizes for even baking)", "1  egg yolk (omitted for a vegan preparation)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 400°F (200°C).", "name": "Heat the oven to 400°F (200°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-0"}, {"@type": "HowToStep", "text": "Using a sharp knife, puncture each sweet potato several times around its surface.", "name": "Using a sharp knife, puncture each sweet potato several times around its surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-1"}, {"@type": "HowToStep", "text": "Place the sweet potatoes on a baking sheet and roast for 45 minutes to 1 hour. Turn them over halfway through the baking period. They are ready when a knife passes easily through the center.", "name": "Place the sweet potatoes on a baking sheet and roast for 45 minutes to 1 hour. Turn them over halfway through the baking period. They are ready when a knife passes easily through the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-2"}, {"@type": "HowToStep", "text": "Avoid baking them beyond this point, as excessively cooked sweet potatoes may become watery and overly soft.", "name": "Avoid baking them beyond this point, as excessively cooked sweet potatoes may become watery and overly soft.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-3"}, {"@type": "HowToStep", "text": "While the baked sweet potatoes remain warm, make a lengthwise opening through the center of each one and remove the flesh. The skins should separate without difficulty.", "name": "While the baked sweet potatoes remain warm, make a lengthwise opening through the center of each one and remove the flesh. The skins should separate without difficulty.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-4"}, {"@type": "HowToStep", "text": "Press the sweet potato flesh through a potato ricer directly onto a paper towel-lined tray. This helps maintain a lighter consistency.", "name": "Press the sweet potato flesh through a potato ricer directly onto a paper towel-lined tray. This helps maintain a lighter consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-5"}, {"@type": "HowToStep", "text": "When a potato ricer is unavailable, thoroughly mash the flesh with a potato masher, then distribute it across the paper towels in a thin, level layer.", "name": "When a potato ricer is unavailable, thoroughly mash the flesh with a potato masher, then distribute it across the paper towels in a thin, level layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-6"}, {"@type": "HowToStep", "text": "Allow the prepared sweet potato to cool completely before mixing the dough.", "name": "Allow the prepared sweet potato to cool completely before mixing the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the cooled sweet potato flesh to a mixing bowl.", "name": "Transfer the cooled sweet potato flesh to a mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-8"}, {"@type": "HowToStep", "text": "Add the egg yolk and stir briefly to incorporate it. Leave out the yolk when preparing the vegan variation.", "name": "Add the egg yolk and stir briefly to incorporate it. Leave out the yolk when preparing the vegan variation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-9"}, {"@type": "HowToStep", "text": "Sprinkle in the salt and all-purpose flour.", "name": "Sprinkle in the salt and all-purpose flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-10"}, {"@type": "HowToStep", "text": "Using a fork, make gentle cutting motions back and forth through the mixture until the ingredients form a soft, loosely combined dough. Handle the mixture lightly and avoid vigorous stirring, which can produce dense gnocchi.", "name": "Using a fork, make gentle cutting motions back and forth through the mixture until the ingredients form a soft, loosely combined dough. Handle the mixture lightly and avoid vigorous stirring, which can produce dense gnocchi.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-11"}, {"@type": "HowToStep", "text": "Spoon the finished dough into a piping bag. A resealable plastic bag may also be used; cut an opening approximately 1.5 cm wide from one corner.", "name": "Spoon the finished dough into a piping bag. A resealable plastic bag may also be used; cut an opening approximately 1.5 cm wide from one corner.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-12"}, {"@type": "HowToStep", "text": "At this stage, the filled bag may be refrigerated when the gnocchi will be boiled later.", "name": "At this stage, the filled bag may be refrigerated when the gnocchi will be boiled later.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-13"}, {"@type": "HowToStep", "text": "Bring a large pot of generously salted water to a boil.", "name": "Bring a large pot of generously salted water to a boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-14"}, {"@type": "HowToStep", "text": "Position the opening of the bag slightly above the water. Squeeze out the dough continuously and use sharp scissors to cut it into pieces measuring approximately 2 cm, allowing each portion to fall directly into the boiling water.", "name": "Position the opening of the bag slightly above the water. Squeeze out the dough continuously and use sharp scissors to cut it into pieces measuring approximately 2 cm, allowing each portion to fall directly into the boiling water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-15"}, {"@type": "HowToStep", "text": "Work in separate batches, piping and cutting the dough for approximately 30 seconds at a time.", "name": "Work in separate batches, piping and cutting the dough for approximately 30 seconds at a time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-16"}, {"@type": "HowToStep", "text": "Cook each batch until the gnocchi rise to the surface.", "name": "Cook each batch until the gnocchi rise to the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-17"}, {"@type": "HowToStep", "text": "Once they are floating, continue cooking them for an additional 30 seconds.", "name": "Once they are floating, continue cooking them for an additional 30 seconds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-18"}, {"@type": "HowToStep", "text": "Lift the cooked gnocchi from the water with a slotted spoon or spider strainer, then place them on a tray. Repeat the process with the remaining dough.", "name": "Lift the cooked gnocchi from the water with a slotted spoon or spider strainer, then place them on a tray. Repeat the process with the remaining dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-19"}, {"@type": "HowToStep", "text": "Because the recipe uses only a small quantity of flour, the exterior of the cooked gnocchi may appear exceptionally soft or fluffy. This is the intended texture.", "name": "Because the recipe uses only a small quantity of flour, the exterior of the cooked gnocchi may appear exceptionally soft or fluffy. This is the intended texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-20"}, {"@type": "HowToStep", "text": "Add the freshly boiled gnocchi directly to the pasta sauce of your choice.", "name": "Add the freshly boiled gnocchi directly to the pasta sauce of your choice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-21"}, {"@type": "HowToStep", "text": "For a crisp exterior and deeper flavor, lightly pan-fry the gnocchi in olive oil until evenly golden. They may then be served with browned butter and crisp sage.", "name": "For a crisp exterior and deeper flavor, lightly pan-fry the gnocchi in olive oil until evenly golden. They may then be served with browned butter and crisp sage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-gnocchi/#wprm-recipe-40403-step-0-22"}], "recipeCategory": ["Pasta"], "recipeCuisine": ["Italian"], "keywords": "Sweet Potato Gnocchi"}</script>
