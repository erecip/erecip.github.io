    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Potato Casserole", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich and comforting baked casserole featuring seasoned chicken, tender diced potatoes, condensed mushroom soup, sour cream, and generous layers of cheddar cheese. The casserole is baked until the potatoes soften, then finished with an additional layer of melted cheese and an optional parsley garnish.", "datePublished": "2020-09-20T04:26:15+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/chicken-potato-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/chicken-potato-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/chicken-potato-casserole.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/chicken-potato-casserole.png"], "cookTime": "PT45M", "totalTime": "PT55M", "recipeIngredient": ["1 cup sour cream", "2  medium potatoes (peeled and chopped into ½-inch cubes)", "Salt (as needed)", "1  can condensed cream of mushroom soup (such as Campbell’s)", "Oil (as needed for frying; olive oil is suitable)", "3  boneless (skinless chicken breasts, approximately 1½ pounds, cut into 1-inch pieces)", "Black pepper (to taste)", "2 cups shredded sharp cheddar cheese (divided)", "Parsley flakes (optional, for added color)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Season the boneless, skinless chicken breasts with salt and a generous amount of black pepper.", "name": "Season the boneless, skinless chicken breasts with salt and a generous amount of black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-0"}, {"@type": "HowToStep", "text": "Preheat a frying pan over medium-high heat and add enough oil for cooking. Place the chicken breasts in the hot pan and cook for approximately 8–10 minutes, turning them halfway through so they cook evenly.", "name": "Preheat a frying pan over medium-high heat and add enough oil for cooking. Place the chicken breasts in the hot pan and cook for approximately 8–10 minutes, turning them halfway through so they cook evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-1"}, {"@type": "HowToStep", "text": "When the chicken is fully cooked, cut it into bite-sized pieces and transfer it to a mixing bowl.", "name": "When the chicken is fully cooked, cut it into bite-sized pieces and transfer it to a mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-2"}, {"@type": "HowToStep", "text": "Add the diced potatoes, condensed cream of mushroom soup, sour cream, and 1 cup of the shredded cheddar cheese to the bowl containing the cooked chicken.", "name": "Add the diced potatoes, condensed cream of mushroom soup, sour cream, and 1 cup of the shredded cheddar cheese to the bowl containing the cooked chicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-3"}, {"@type": "HowToStep", "text": "Add a little more salt and pepper according to taste, then stir thoroughly until the chicken and potatoes are evenly coated with the creamy mixture.", "name": "Add a little more salt and pepper according to taste, then stir thoroughly until the chicken and potatoes are evenly coated with the creamy mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-4"}, {"@type": "HowToStep", "text": "Spoon the chicken and potato mixture into a casserole dish.", "name": "Spoon the chicken and potato mixture into a casserole dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-5"}, {"@type": "HowToStep", "text": "Spread the mixture into a reasonably even layer while maintaining a slightly rustic surface so the casserole cooks consistently throughout.", "name": "Spread the mixture into a reasonably even layer while maintaining a slightly rustic surface so the casserole cooks consistently throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the casserole dish to an oven preheated to 350°F (177°C).", "name": "Transfer the casserole dish to an oven preheated to 350°F (177°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-7"}, {"@type": "HowToStep", "text": "Bake for approximately 45 minutes, or until the diced potatoes have become tender and the surface has developed a light golden appearance.", "name": "Bake for approximately 45 minutes, or until the diced potatoes have become tender and the surface has developed a light golden appearance.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-8"}, {"@type": "HowToStep", "text": "Remove the casserole from the oven after the initial baking period and distribute the remaining 1 cup of shredded cheddar cheese evenly over the top.", "name": "Remove the casserole from the oven after the initial baking period and distribute the remaining 1 cup of shredded cheddar cheese evenly over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-9"}, {"@type": "HowToStep", "text": "If desired, scatter parsley flakes over the cheese for additional color and a subtle finishing touch.", "name": "If desired, scatter parsley flakes over the cheese for additional color and a subtle finishing touch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-10"}, {"@type": "HowToStep", "text": "Return the casserole to the oven for several more minutes, allowing the cheddar to melt completely and become hot and bubbly.", "name": "Return the casserole to the oven for several more minutes, allowing the cheddar to melt completely and become hot and bubbly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-11"}, {"@type": "HowToStep", "text": "Take the finished casserole out of the oven once the cheese has melted.", "name": "Take the finished casserole out of the oven once the cheese has melted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-12"}, {"@type": "HowToStep", "text": "Allow the dish to rest for a few minutes before serving so the casserole can settle and the flavors can come together.", "name": "Allow the dish to rest for a few minutes before serving so the casserole can settle and the flavors can come together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-13"}, {"@type": "HowToStep", "text": "Serve the chicken potato casserole warm.", "name": "Serve the chicken potato casserole warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-potato-casserole/#wprm-recipe-46023-step-0-14"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["American"], "keywords": "Chicken Potato Casserole"}</script>
