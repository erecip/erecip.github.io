    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Beef Stroganoff", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich and savory beef stroganoff featuring tender strips of top sirloin, browned mushrooms and onion, and a smooth cream-based sauce flavored with Dijon mustard and Worcestershire sauce. Serve the finished stroganoff over egg noodles and garnish with fresh green onion or parsley.", "datePublished": "2022-12-17T21:15:43+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/beef-stroganoff3.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/beef-stroganoff3.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/beef-stroganoff3.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/beef-stroganoff3.png"], "recipeIngredient": ["1 lb top sirloin steak (cut against the grain into 1/4-inch-thick strips)", "1/2 lb cremini or brown mushrooms (sliced approximately 1/4 inch thick)", "2 tbsp extra-virgin olive oil", "1  garlic clove (freshly minced)", "1/2  medium onion (finely chopped)", "2 tbsp unsalted butter", "1 tbsp all-purpose flour", "1 cup beef stock", "1 tbsp Worcestershire sauce", "3/4 cup heavy cream", "1/4 tsp freshly ground black pepper", "1/2 tsp Dijon mustard", "1/4 cup full-fat sour cream", "1/2 tsp salt", "1 tbsp chopped green onions or fresh parsley", "8  –12 oz egg noodles (cooked al dente, if desired)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place a large, deep skillet or Dutch oven over medium-high heat. Pour in the olive oil and allow it to become very hot.", "name": "Place a large, deep skillet or Dutch oven over medium-high heat. Pour in the olive oil and allow it to become very hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-0"}, {"@type": "HowToStep", "text": "Arrange the sliced sirloin in a single layer. Sear for approximately 1 minute on each side without stirring, cooking only until the exterior is browned and the meat is no longer red. Work in two batches when necessary to prevent overcrowding.", "name": "Arrange the sliced sirloin in a single layer. Sear for approximately 1 minute on each side without stirring, cooking only until the exterior is browned and the meat is no longer red. Work in two batches when necessary to prevent overcrowding.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the browned beef to a plate and cover it to retain its warmth.", "name": "Transfer the browned beef to a plate and cover it to retain its warmth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-2"}, {"@type": "HowToStep", "text": "Add the unsalted butter to the same pan. Once melted, add the finely chopped onion and sliced mushrooms.", "name": "Add the unsalted butter to the same pan. Once melted, add the finely chopped onion and sliced mushrooms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-3"}, {"@type": "HowToStep", "text": "Cook for 6–8 minutes, stirring from time to time, until the vegetables are tender and lightly browned and the moisture released by the mushrooms has evaporated.", "name": "Cook for 6–8 minutes, stirring from time to time, until the vegetables are tender and lightly browned and the moisture released by the mushrooms has evaporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-4"}, {"@type": "HowToStep", "text": "Stir the minced garlic into the cooked onion and mushrooms and sauté for 1 minute, just until aromatic.", "name": "Stir the minced garlic into the cooked onion and mushrooms and sauté for 1 minute, just until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-5"}, {"@type": "HowToStep", "text": "Scatter the all-purpose flour evenly over the vegetables. Continue cooking for another minute while stirring continuously so the flour cooks into the mixture and can later help thicken the sauce.", "name": "Scatter the all-purpose flour evenly over the vegetables. Continue cooking for another minute while stirring continuously so the flour cooks into the mixture and can later help thicken the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-6"}, {"@type": "HowToStep", "text": "Stir in the heavy cream and allow the mixture to simmer for 1–2 minutes, until it begins to develop a slightly thicker consistency.", "name": "Stir in the heavy cream and allow the mixture to simmer for 1–2 minutes, until it begins to develop a slightly thicker consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-7"}, {"@type": "HowToStep", "text": "Place the sour cream in a small bowl and blend in several tablespoons of the hot sauce. Once the sour cream has been tempered, gradually stir it back into the pan while continuously mixing to help prevent curdling.", "name": "Place the sour cream in a small bowl and blend in several tablespoons of the hot sauce. Once the sour cream has been tempered, gradually stir it back into the pan while continuously mixing to help prevent curdling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-8"}, {"@type": "HowToStep", "text": "Add the Worcestershire sauce, Dijon mustard, salt, and black pepper. Stir until the seasonings are thoroughly incorporated and the sauce is creamy and uniform.", "name": "Add the Worcestershire sauce, Dijon mustard, salt, and black pepper. Stir until the seasonings are thoroughly incorporated and the sauce is creamy and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-9"}, {"@type": "HowToStep", "text": "Return the seared sirloin to the pan along with any juices that have collected on the plate. Bring the stroganoff just to a gentle simmer and cook only until the beef is warmed through.", "name": "Return the seared sirloin to the pan along with any juices that have collected on the plate. Bring the stroganoff just to a gentle simmer and cook only until the beef is warmed through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-10"}, {"@type": "HowToStep", "text": "Taste the finished sauce and adjust the salt or pepper as desired.", "name": "Taste the finished sauce and adjust the salt or pepper as desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-11"}, {"@type": "HowToStep", "text": "Spoon the hot beef stroganoff over cooked egg noodles, if using.", "name": "Spoon the hot beef stroganoff over cooked egg noodles, if using.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-12"}, {"@type": "HowToStep", "text": "Finish with chopped green onions or fresh parsley and serve immediately.", "name": "Finish with chopped green onions or fresh parsley and serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-stroganoff/#wprm-recipe-44957-step-0-13"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Russian"], "keywords": "Beef Stroganoff"}</script>
