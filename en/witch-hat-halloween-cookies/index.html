en your hands to form a smooth ball. Roll every ball in Halloween sprinkles or purple sanding sugar until the exterior is coated, creating the decorative “brim” of each witch hat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/witch-hat-halloween-cookies/#wprm-recipe-44136-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the coated dough balls approximately 2 inches apart on fresh parchment-lined baking trays. Bake for 9–11 minutes, until the edges appear set while the centers remain slightly soft when gently touched.", "name": "Arrange the coated dough balls approximately 2 inches apart on fresh parchment-lined baking trays. Bake for 9–11 minutes, until the edges appear set while the centers remain slightly soft when gently touched.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/witch-hat-halloween-cookies/#wprm-recipe-44136-step-0-8"}, {"@type": "HowToStep", "text": "Remove the cookies from the oven and allow them to remain on the baking tray for approximately 5 minutes. They will continue to firm slightly from the residual heat.", "name": "Remove the cookies from the oven and allow them to remain on the baking tray for approximately 5 minutes. They will continue to firm slightly from the residual heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/witch-hat-halloween-cookies/#wprm-recipe-44136-step-0-9"}, {"@type": "HowToStep", "text": "While the cookies are still warm, firmly press one unwrapped chocolate kiss or hug candy into the center of each cookie. The warmth will soften the base of the chocolate enough to help it adhere while forming the pointed “crown” of the witch hat.", "name": "While the cookies are still warm, firmly press one unwrapped chocolate kiss or hug candy into the center of each cookie. The warmth will soften the base of the chocolate enough to help it adhere while forming the pointed “crown” of the witch hat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/witch-hat-halloween-cookies/#wprm-recipe-44136-step-0-10"}, {"@type": "HowToStep", "text": "Place the entire tray of chocolate-topped cookies in the freezer for approximately 10 minutes. This brief chilling period allows the chocolate candies to set while helping the cookies retain their finished shape.", "name": "Place the entire tray of chocolate-topped cookies in the freezer for approximately 10 minutes. This brief chilling period allows the chocolate candies to set while helping the cookies retain their finished shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/witch-hat-halloween-cookies/#wprm-recipe-44136-step-0-11"}, {"@type": "HowToStep", "text": "Transfer the cookies to a wire cooling rack and allow them to return completely to room temperature before serving or storing.", "name": "Transfer the cookies to a wire cooling rack and allow them to return completely to room temperature before serving or storing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/witch-hat-halloween-cookies/#wprm-recipe-44136-step-0-12"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Witch Hat Halloween Cookies"}</script>
