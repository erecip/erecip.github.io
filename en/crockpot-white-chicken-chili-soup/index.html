    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Crockpot White Chicken Chili Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich and comforting slow-cooker white chicken chili featuring tender shredded chicken, Great Northern beans, green chiles, corn, aromatic seasonings, and a creamy finish of cream cheese and half-and-half. Serve it hot with your preferred toppings for a hearty meal.", "datePublished": "2018-08-03T15:52:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/crockpot-white-chicken-chili-soup2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/crockpot-white-chicken-chili-soup2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/crockpot-white-chicken-chili-soup2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/crockpot-white-chicken-chili-soup2.png"], "cookTime": "PT480M", "totalTime": "PT495M", "recipeIngredient": ["1 lb boneless (skinless chicken breast, suitable for easy shredding)", "1  can whole-kernel corn (thoroughly drained)", "3/4 tsp dried oregano", "2  garlic cloves (freshly minced)", "2  cans Great Northern beans (rinsed and drained)", "Fresh cilantro (chopped, for mixing into the chili)", "1/4 tsp cayenne pepper", "1  yellow onion (finely diced to yield approximately 1 cup)", "3 cups low-sodium chicken broth (such as Swanson)", "1 tsp ground cumin", "2  cans diced green chiles (preferably Hatch)", "1/2 tsp freshly ground or regular black pepper", "1/2 tsp chili powder", "1 tsp salt", "1/2 cup reduced-fat cream cheese (softened for easier blending)", "1/4 cup half-and-half", "Fresh cilantro (chopped)", "Monterey Jack cheese (grated)", "Jalapeños (thinly sliced)", "Tortilla strips", "Avocado (sliced)", "Sour cream (such as Daisy)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Arrange the chicken breasts across the bottom of the slow cooker.", "name": "Arrange the chicken breasts across the bottom of the slow cooker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-0"}, {"@type": "HowToStep", "text": "Season the chicken evenly with the salt, black pepper, cumin, oregano, chili powder, and cayenne pepper.", "name": "Season the chicken evenly with the salt, black pepper, cumin, oregano, chili powder, and cayenne pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-1"}, {"@type": "HowToStep", "text": "Add the chopped yellow onion, minced garlic, drained Great Northern beans, diced green chiles, drained corn, chicken broth, and chopped cilantro.", "name": "Add the chopped yellow onion, minced garlic, drained Great Northern beans, diced green chiles, drained corn, chicken broth, and chopped cilantro.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-2"}, {"@type": "HowToStep", "text": "Gently stir the ingredients together without disturbing the chicken more than necessary.", "name": "Gently stir the ingredients together without disturbing the chicken more than necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-3"}, {"@type": "HowToStep", "text": "Place the lid securely on the slow cooker.", "name": "Place the lid securely on the slow cooker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-4"}, {"@type": "HowToStep", "text": "Cook on LOW for 8 hours. For a faster option, cook on HIGH for 3–4 hours.", "name": "Cook on LOW for 8 hours. For a faster option, cook on HIGH for 3–4 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-5"}, {"@type": "HowToStep", "text": "At the end of the cooking period, transfer the chicken breasts from the slow cooker to a large bowl.", "name": "At the end of the cooking period, transfer the chicken breasts from the slow cooker to a large bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-6"}, {"@type": "HowToStep", "text": "Using two forks, pull the chicken apart into bite-size shreds. Return all of the shredded chicken to the slow cooker.", "name": "Using two forks, pull the chicken apart into bite-size shreds. Return all of the shredded chicken to the slow cooker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-7"}, {"@type": "HowToStep", "text": "Add the softened cream cheese and half-and-half to the chili.", "name": "Add the softened cream cheese and half-and-half to the chili.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-8"}, {"@type": "HowToStep", "text": "Stir until incorporated, cover the slow cooker again, and cook on HIGH for an additional 15 minutes, allowing the mixture to become creamy and slightly thicker.", "name": "Stir until incorporated, cover the slow cooker again, and cook on HIGH for an additional 15 minutes, allowing the mixture to become creamy and slightly thicker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-9"}, {"@type": "HowToStep", "text": "For an especially smooth consistency, place the softened cream cheese in a small bowl and whisk it with several ladlefuls of hot chili. Once smooth, stir the mixture back into the slow cooker along with the half-and-half.", "name": "For an especially smooth consistency, place the softened cream cheese in a small bowl and whisk it with several ladlefuls of hot chili. Once smooth, stir the mixture back into the slow cooker along with the half-and-half.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-10"}, {"@type": "HowToStep", "text": "Stir the finished chili thoroughly so the creamy ingredients and shredded chicken are evenly distributed.", "name": "Stir the finished chili thoroughly so the creamy ingredients and shredded chicken are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-11"}, {"@type": "HowToStep", "text": "Ladle the chili into bowls while hot and garnish as desired with grated Monterey Jack cheese, sliced avocado, jalapeños, tortilla strips, sour cream, or fresh cilantro.", "name": "Ladle the chili into bowls while hot and garnish as desired with grated Monterey Jack cheese, sliced avocado, jalapeños, tortilla strips, sour cream, or fresh cilantro.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-white-chicken-chili-soup/#wprm-recipe-43711-step-0-12"}], "recipeCategory": ["Main Course", "Soup"], "recipeCuisine": ["American", "Southwestern"], "keywords": "Crockpot White Chicken Chili Soup"}</script>
