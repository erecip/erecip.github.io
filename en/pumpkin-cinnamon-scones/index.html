    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Cinnamon Scones", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft pumpkin scones flavored with pumpkin pie spice and finished with a smooth cinnamon-spiced confectioners’ sugar glaze. Frozen grated butter helps create a tender, crumbly texture.", "datePublished": "2021-10-30T11:10:33+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/pumpkin-cinnamon-scones2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/pumpkin-cinnamon-scones2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/pumpkin-cinnamon-scones2.png"], "cookTime": "PT16M", "totalTime": "PT16M", "recipeIngredient": ["1/2 cup pure pumpkin purée", "6 tablespoons butter (frozen and finely grated)", "1 1/2 teaspoons pumpkin pie spice", "3 tablespoons half-and-half", "2 cups all-purpose flour", "1  large egg", "1/2 teaspoon salt", "1 tablespoon baking powder", "1/2 cup granulated sugar", "1/2 teaspoon ground cinnamon", "1/2 cup confectioners’ sugar", "1/8 teaspoon pumpkin pie spice", "3 teaspoons milk"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the oven and pan. Preheat the oven to 425°F (218°C). Cover a baking sheet with parchment paper, or lightly grease a scone pan to keep the dough from sticking.", "name": "Prepare the oven and pan. Preheat the oven to 425°F (218°C). Cover a baking sheet with parchment paper, or lightly grease a scone pan to keep the dough from sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/#wprm-recipe-43895-step-0-0"}, {"@type": "HowToStep", "text": "Combine the dry ingredients. Sift the all-purpose flour, granulated sugar, baking powder, salt, and 1 1/2 teaspoons pumpkin pie spice into a large mixing bowl or the bowl of a stand mixer. Stir until the ingredients are evenly distributed.", "name": "Combine the dry ingredients. Sift the all-purpose flour, granulated sugar, baking powder, salt, and 1 1/2 teaspoons pumpkin pie spice into a large mixing bowl or the bowl of a stand mixer. Stir until the ingredients are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/#wprm-recipe-43895-step-0-1"}, {"@type": "HowToStep", "text": "Incorporate the frozen butter. Grate the frozen butter directly into the flour mixture. Gently work the grated butter through the dry ingredients with your hands until no large pieces remain and the mixture develops a coarse, crumb-like consistency.", "name": "Incorporate the frozen butter. Grate the frozen butter directly into the flour mixture. Gently work the grated butter through the dry ingredients with your hands until no large pieces remain and the mixture develops a coarse, crumb-like consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/#wprm-recipe-43895-step-0-2"}, {"@type": "HowToStep", "text": "Prepare the wet mixture. In a separate medium bowl, whisk the pumpkin purée, half-and-half, and egg together until evenly blended.", "name": "Prepare the wet mixture. In a separate medium bowl, whisk the pumpkin purée, half-and-half, and egg together until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/#wprm-recipe-43895-step-0-3"}, {"@type": "HowToStep", "text": "Form the dough. Fold the pumpkin mixture into the flour-and-butter mixture just until a cohesive dough develops. Avoid excessive mixing. The finished dough should remain slightly sticky rather than becoming dry.", "name": "Form the dough. Fold the pumpkin mixture into the flour-and-butter mixture just until a cohesive dough develops. Avoid excessive mixing. The finished dough should remain slightly sticky rather than becoming dry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/#wprm-recipe-43895-step-0-4"}, {"@type": "HowToStep", "text": "Shape the scones. Place the dough onto a lightly floured work surface and form it into a large round approximately 1 inch thick. Cut the round into 6 or 8 triangular wedges with a knife.", "name": "Shape the scones. Place the dough onto a lightly floured work surface and form it into a large round approximately 1 inch thick. Cut the round into 6 or 8 triangular wedges with a knife.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/#wprm-recipe-43895-step-0-5"}, {"@type": "HowToStep", "text": "Bake. Arrange the scones on the prepared baking sheet or scone pan. Bake for 14–16 minutes, or until they develop a light golden-brown color. Remove them from the oven and allow them to cool before applying the glaze.", "name": "Bake. Arrange the scones on the prepared baking sheet or scone pan. Bake for 14–16 minutes, or until they develop a light golden-brown color. Remove them from the oven and allow them to cool before applying the glaze.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/#wprm-recipe-43895-step-0-6"}, {"@type": "HowToStep", "text": "Prepare the cinnamon glaze. While the scones are cooling, whisk the confectioners’ sugar, milk, ground cinnamon, and 1/8 teaspoon pumpkin pie spice in a medium bowl until completely smooth. Adjust the amount of milk as needed to achieve the preferred glaze consistency, then allow the mixture to rest briefly so it can thicken slightly.", "name": "Prepare the cinnamon glaze. While the scones are cooling, whisk the confectioners’ sugar, milk, ground cinnamon, and 1/8 teaspoon pumpkin pie spice in a medium bowl until completely smooth. Adjust the amount of milk as needed to achieve the preferred glaze consistency, then allow the mixture to rest briefly so it can thicken slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/#wprm-recipe-43895-step-0-7"}, {"@type": "HowToStep", "text": "Glaze the scones. Once the baked scones have cooled, drizzle them generously with the cinnamon glaze. Allow the coating to set and firm before serving.", "name": "Glaze the scones. Once the baked scones have cooled, drizzle them generously with the cinnamon glaze. Allow the coating to set and firm before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-cinnamon-scones/#wprm-recipe-43895-step-0-8"}], "keywords": "Pumpkin Cinnamon Scones"}</script>
