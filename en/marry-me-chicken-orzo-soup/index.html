    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Marry Me Chicken Orzo Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "Marry Me Chicken Orzo Soup is a rich, creamy one-pot soup featuring tender pieces of chicken, delicate orzo pasta, sun-dried tomatoes, fresh spinach, Parmesan, and cream cheese. Tomato paste, basil, garlic, Italian herbs, and a touch of red pepper create a deeply savory broth with a subtle Italian-inspired character.", "datePublished": "2023-03-07T00:42:57+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/marry-me-chicken-orzo-soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/marry-me-chicken-orzo-soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/marry-me-chicken-orzo-soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/marry-me-chicken-orzo-soup.png"], "cookTime": "PT30M", "totalTime": "PT30M", "recipeIngredient": ["8 cups reduced-sodium chicken broth", "1 1/2 pounds boneless (skinless chicken breasts, cut into approximately 1-inch cubes)", "3 tablespoons concentrated tomato paste", "4 teaspoons finely minced fresh garlic", "1 cup heavy whipping cream", "1/2 cup chopped sun-dried tomatoes (preferably packed in oil)", "1 tablespoon olive oil", "4 teaspoons finely chopped fresh basil", "1 1/2 teaspoons Italian seasoning blend", "2 teaspoons kosher salt (or adjusted to taste)", "1 teaspoon onion powder", "1/4 teaspoon crushed red pepper flakes (optional)", "1 teaspoon garlic powder", "1  package (8 ounces cream cheese, softened to room temperature)", "3/4 cup dry orzo pasta", "1/2 cup finely grated Parmesan cheese", "3 cups chopped baby spinach"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm the olive oil in a Dutch oven over medium-high heat. Add the cubed chicken breast and cook for approximately 5–7 minutes, turning as needed, until the pieces are browned on all sides.", "name": "Warm the olive oil in a Dutch oven over medium-high heat. Add the cubed chicken breast and cook for approximately 5–7 minutes, turning as needed, until the pieces are browned on all sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/#wprm-recipe-45754-step-0-0"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and continue cooking for about 30 seconds, stirring continuously to prevent the garlic from scorching.", "name": "Stir in the minced garlic and continue cooking for about 30 seconds, stirring continuously to prevent the garlic from scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/#wprm-recipe-45754-step-0-1"}, {"@type": "HowToStep", "text": "Add the tomato paste and chopped sun-dried tomatoes. Stir thoroughly and cook for another 1–2 minutes, until the mixture is aromatic and evenly incorporated.", "name": "Add the tomato paste and chopped sun-dried tomatoes. Stir thoroughly and cook for another 1–2 minutes, until the mixture is aromatic and evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/#wprm-recipe-45754-step-0-2"}, {"@type": "HowToStep", "text": "Pour the low-sodium chicken broth and heavy cream into the Dutch oven with the browned chicken mixture.", "name": "Pour the low-sodium chicken broth and heavy cream into the Dutch oven with the browned chicken mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/#wprm-recipe-45754-step-0-3"}, {"@type": "HowToStep", "text": "Add the fresh basil, kosher salt, Italian seasoning, onion powder, garlic powder, and crushed red pepper flakes. Stir until the seasonings are evenly dispersed throughout the liquid.", "name": "Add the fresh basil, kosher salt, Italian seasoning, onion powder, garlic powder, and crushed red pepper flakes. Stir until the seasonings are evenly dispersed throughout the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/#wprm-recipe-45754-step-0-4"}, {"@type": "HowToStep", "text": "Bring the soup to a gentle boil over medium heat, allowing the broth and seasonings to blend before adding the pasta.", "name": "Bring the soup to a gentle boil over medium heat, allowing the broth and seasonings to blend before adding the pasta.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/#wprm-recipe-45754-step-0-5"}, {"@type": "HowToStep", "text": "Stir the orzo into the boiling soup, distributing it evenly throughout the pot.", "name": "Stir the orzo into the boiling soup, distributing it evenly throughout the pot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/#wprm-recipe-45754-step-0-6"}, {"@type": "HowToStep", "text": "Reduce the heat so the soup maintains a steady simmer. Cook for 10–15 minutes, stirring periodically, until the orzo becomes tender and absorbs some of the seasoned broth.", "name": "Reduce the heat so the soup maintains a steady simmer. Cook for 10–15 minutes, stirring periodically, until the orzo becomes tender and absorbs some of the seasoned broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/#wprm-recipe-45754-step-0-7"}, {"@type": "HowToStep", "text": "Turn the heat down to low. Add the chopped baby spinach, softened cream cheese, and grated Parmesan to the soup.", "name": "Turn the heat down to low. Add the chopped baby spinach, softened cream cheese, and grated Parmesan to the soup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/#wprm-recipe-45754-step-0-8"}, {"@type": "HowToStep", "text": "Cook for an additional 10–15 minutes, stirring frequently, until both cheeses have fully melted into the broth and the spinach is completely wilted. The finished soup should have a smooth, rich, and creamy consistency.", "name": "Cook for an additional 10–15 minutes, stirring frequently, until both cheeses have fully melted into the broth and the spinach is completely wilted. The finished soup should have a smooth, rich, and creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-orzo-soup/#wprm-recipe-45754-step-0-9"}], "recipeCategory": ["Main Course", "Soup"], "recipeCuisine": ["American", "Italian"], "keywords": "Marry Me Chicken Orzo Soup"}</script>
