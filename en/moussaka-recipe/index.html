    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Moussaka Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A celebrated classic of Greek cuisine, Moussaka features tender layers of roasted eggplant, enriched with a savory spiced meat ragù, and finished with a luxuriously smooth béchamel topping. Each component contributes depth, creating a harmonious and comforting dish emblematic of Mediterranean culinary heritage.", "datePublished": "2024-06-23T08:09:36+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/moussaka-recipe/Moussaka-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/moussaka-recipe/Moussaka-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/moussaka-recipe/Moussaka-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/moussaka-recipe/Moussaka-Recipe.png"], "prepTime": "PT40M", "cookTime": "PT30M", "totalTime": "PT70M", "recipeIngredient": ["2 to 3 tablespoons olive oil", "1 teaspoon salt", "1 kg / 2 lb eggplants (sliced into 0.75 cm / 0.3″ rounds)", "1  bay leaf", "1  beef bouillon cube (crushed (or 1 teaspoon powder))", "1 tablespoon olive oil", "3  garlic cloves (finely minced)", "3 tablespoons tomato paste", "1.5 teaspoons sugar", "1  onion (finely chopped)", "1/2 cup dry red wine (optional)", "700 g / 1.4 lb ground beef or lamb", "2 teaspoons dried oregano", "400 g / 14 oz crushed tomatoes", "3/4 teaspoon salt", "1/2 teaspoon cinnamon or 1 whole cinnamon stick", "1 cup beef broth or stock", "1/4 teaspoon freshly grated nutmeg (optional)", "2 1/2 cups milk", "4 tablespoons 60 g butter", "1  egg", "1/4 teaspoon black pepper", "1  egg yolk", "1/2 cup grated parmesan or Kefalotiri cheese", "5 tablespoons plain flour", "1 1/4 teaspoons Vegeta or vegetable/chicken stock powder (or salt)", "1/3 cup panko breadcrumbs"], "recipeInstructions": [{"@type": "HowToSection", "name": "Preparing the Eggplant", "itemListElement": [{"@type": "HowToStep", "text": "Arrange the eggplant slices in a colander, layering them slightly and sprinkling each layer with salt. Allow them to sit for 30 minutes to draw out moisture. Meanwhile, begin preparing the meat and béchamel sauces. Preheat the oven to 240°C/450°F. Once sweated, pat the eggplant slices dry thoroughly to remove excess salt. Lay them out on parchment-lined trays, brush with olive oil, and roast for 15 to 20 minutes or until golden and tender. Set aside to cool.", "name": "Arrange the eggplant slices in a colander, layering them slightly and sprinkling each layer with salt. Allow them to sit for 30 minutes to draw out moisture. Meanwhile, begin preparing the meat and béchamel sauces. Preheat the oven to 240°C/450°F. Once sweated, pat the eggplant slices dry thoroughly to remove excess salt. Lay them out on parchment-lined trays, brush with olive oil, and roast for 15 to 20 minutes or until golden and tender. Set aside to cool.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/moussaka-recipe/#wprm-recipe-49140-step-0-0"}]}, {"@type": "HowToSection", "name": "Meat Filling", "itemListElement": [{"@type": "HowToStep", "text": "In a large skillet over high heat, heat the olive oil. Sauté the garlic and onion for approximately two minutes. Add the ground meat and cook until no longer pink, breaking it up with a spoon. Stir in the wine, simmer for about 1.5 minutes until the alcohol evaporates. Combine with the tomato paste, crushed tomatoes, broth, bouillon, bay leaf, sugar, oregano, cinnamon, and salt. Simmer over medium-low heat for 15 minutes until reduced to a thick, rich sauce.", "name": "In a large skillet over high heat, heat the olive oil. Sauté the garlic and onion for approximately two minutes. Add the ground meat and cook until no longer pink, breaking it up with a spoon. Stir in the wine, simmer for about 1.5 minutes until the alcohol evaporates. Combine with the tomato paste, crushed tomatoes, broth, bouillon, bay leaf, sugar, oregano, cinnamon, and salt. Simmer over medium-low heat for 15 minutes until reduced to a thick, rich sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/moussaka-recipe/#wprm-recipe-49140-step-1-0"}]}, {"@type": "HowToSection", "name": "Béchamel Sauce", "itemListElement": [{"@type": "HowToStep", "text": "In a medium saucepan, melt butter over moderate heat. Whisk in flour and cook for one minute. Gradually pour in the milk while whisking continuously. Stir until the sauce thickens enough to coat the back of a spoon, around 3 to 5 minutes. Remove from heat and blend in the cheese, nutmeg, stock powder, and pepper. Let cool for five minutes, then incorporate the egg and yolk. Cover and set aside.", "name": "In a medium saucepan, melt butter over moderate heat. Whisk in flour and cook for one minute. Gradually pour in the milk while whisking continuously. Stir until the sauce thickens enough to coat the back of a spoon, around 3 to 5 minutes. Remove from heat and blend in the cheese, nutmeg, stock powder, and pepper. Let cool for five minutes, then incorporate the egg and yolk. Cover and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/moussaka-recipe/#wprm-recipe-49140-step-2-0"}]}, {"@type": "HowToSection", "name": "Assembly and Baking", "itemListElement": [{"@type": "HowToStep", "text": "Reduce the oven temperature to 180°C/350°F. Layer half of the roasted eggplant in the base of a baking dish. Spread the meat filling evenly over the eggplant. Add the remaining eggplant slices on top, pour over the béchamel sauce, and sprinkle with panko breadcrumbs. Bake for 30 to 40 minutes until the top is golden. Allow to rest for 10 minutes before serving.", "name": "Reduce the oven temperature to 180°C/350°F. Layer half of the roasted eggplant in the base of a baking dish. Spread the meat filling evenly over the eggplant. Add the remaining eggplant slices on top, pour over the béchamel sauce, and sprinkle with panko breadcrumbs. Bake for 30 to 40 minutes until the top is golden. Allow to rest for 10 minutes before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/moussaka-recipe/#wprm-recipe-49140-step-3-0"}]}], "recipeCategory": ["Main Course"], "recipeCuisine": ["greek"], "keywords": "Moussaka Recipe"}</script>
