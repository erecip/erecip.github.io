    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pizza Dough Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A reliable and flavorful homemade pizza dough, yielding a soft, elastic crust perfect for any topping preference. This recipe is adaptable, beginner-friendly, and ideal for crafting a classic 10–12\" pizza.", "datePublished": "2024-03-03T06:24:23+00:00", "image": ["https://erecip.github.io/en/pizza-dough-recipe/pizza-dough-recipe3.webp", "https://erecip.github.io/en/pizza-dough-recipe/pizza-dough-recipe3.webp", "https://erecip.github.io/en/pizza-dough-recipe/pizza-dough-recipe3.webp", "https://erecip.github.io/en/pizza-dough-recipe/pizza-dough-recipe3.webp"], "prepTime": "PT15M", "cookTime": "PT15M", "totalTime": "PT60M", "recipeIngredient": ["¾ cup warm water (175ml)", "1  packet instant yeast (2 ¼ teaspoons)", "⅛  –¼ teaspoon garlic powder and/or dried basil leaves (optional)", "2 tablespoons olive oil (plus more for brushing)", "1 ½ teaspoons sugar", "¾ teaspoon salt", "2  –2 ⅓ cups all-purpose flour or bread flour (divided (250–295g))"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a large mixing bowl, combine 1 cup (125g) of the flour with the yeast, sugar, and salt. Incorporate garlic powder and dried basil at this stage if using.", "name": "In a large mixing bowl, combine 1 cup (125g) of the flour with the yeast, sugar, and salt. Incorporate garlic powder and dried basil at this stage if using.", "url": "https://erecip.github.io/en/pizza-dough-recipe/#wprm-recipe-25798-step-0-0"}, {"@type": "HowToStep", "text": "Pour in the olive oil and warm water, stirring thoroughly with a wooden spoon.", "name": "Pour in the olive oil and warm water, stirring thoroughly with a wooden spoon.", "url": "https://erecip.github.io/en/pizza-dough-recipe/#wprm-recipe-25798-step-0-1"}, {"@type": "HowToStep", "text": "Gradually incorporate the remaining flour, starting with 1 cup (125g) and adding up to an additional ⅓ cup as needed, mixing until the dough begins to pull away from the sides and forms a soft, slightly tacky, but manageable ball.", "name": "Gradually incorporate the remaining flour, starting with 1 cup (125g) and adding up to an additional ⅓ cup as needed, mixing until the dough begins to pull away from the sides and forms a soft, slightly tacky, but manageable ball.", "url": "https://erecip.github.io/en/pizza-dough-recipe/#wprm-recipe-25798-step-0-2"}, {"@type": "HowToStep", "text": "Generously drizzle a clean, large bowl with olive oil and brush it along the sides. Shape the dough into a smooth ball using floured hands, place it in the oiled bowl, and turn it to coat fully in oil. Cover tightly with plastic wrap and allow it to rise in a warm spot for approximately 30 minutes or until doubled in volume.", "name": "Generously drizzle a clean, large bowl with olive oil and brush it along the sides. Shape the dough into a smooth ball using floured hands, place it in the oiled bowl, and turn it to coat fully in oil. Cover tightly with plastic wrap and allow it to rise in a warm spot for approximately 30 minutes or until doubled in volume.", "url": "https://erecip.github.io/en/pizza-dough-recipe/#wprm-recipe-25798-step-0-3"}, {"@type": "HowToStep", "text": "While the dough is rising, preheat your oven to 425°F (215°C).", "name": "While the dough is rising, preheat your oven to 425°F (215°C).", "url": "https://erecip.github.io/en/pizza-dough-recipe/#wprm-recipe-25798-step-0-4"}, {"@type": "HowToStep", "text": "After rising, gently deflate the dough and transfer it to a floured surface. Knead briefly, about 3–5 times, until smooth.", "name": "After rising, gently deflate the dough and transfer it to a floured surface. Knead briefly, about 3–5 times, until smooth.", "url": "https://erecip.github.io/en/pizza-dough-recipe/#wprm-recipe-25798-step-0-5"}, {"@type": "HowToStep", "text": "Roll or stretch the dough into a 12-inch circle and transfer it to a pizza pan lined with parchment paper. Fold or pinch the edges to shape a crust.", "name": "Roll or stretch the dough into a 12-inch circle and transfer it to a pizza pan lined with parchment paper. Fold or pinch the edges to shape a crust.", "url": "https://erecip.github.io/en/pizza-dough-recipe/#wprm-recipe-25798-step-0-6"}, {"@type": "HowToStep", "text": "Brush about 1 tablespoon of olive oil across the entire dough surface, including the crust. Poke holes across the center of the dough with a fork to prevent air bubbles during baking.", "name": "Brush about 1 tablespoon of olive oil across the entire dough surface, including the crust. Poke holes across the center of the dough with a fork to prevent air bubbles during baking.", "url": "https://erecip.github.io/en/pizza-dough-recipe/#wprm-recipe-25798-step-0-7"}, {"@type": "HowToStep", "text": "Add desired toppings and bake in the preheated oven for 13–15 minutes, or until the crust is golden and toppings are cooked to your liking. Slice and serve.", "name": "Add desired toppings and bake in the preheated oven for 13–15 minutes, or until the crust is golden and toppings are cooked to your liking. Slice and serve.", "url": "https://erecip.github.io/en/pizza-dough-recipe/#wprm-recipe-25798-step-0-8"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "pizza dough recipe"}</script>
