ToStep", "text": "Add the onion, mushrooms, and broccoli to the hot pan.", "name": "Add the onion, mushrooms, and broccoli to the hot pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-broccoli/#wprm-recipe-46421-step-0-12"}, {"@type": "HowToStep", "text": "Cook for approximately 3 minutes while stirring continuously, until the vegetables become tender while retaining a pleasant texture.", "name": "Cook for approximately 3 minutes while stirring continuously, until the vegetables become tender while retaining a pleasant texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-broccoli/#wprm-recipe-46421-step-0-13"}, {"@type": "HowToStep", "text": "Lower the heat to medium-low.", "name": "Lower the heat to medium-low.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-broccoli/#wprm-recipe-46421-step-0-14"}, {"@type": "HowToStep", "text": "Give the prepared sauce another thorough stir to redistribute the ingredients, then pour it over the vegetables in the skillet.", "name": "Give the prepared sauce another thorough stir to redistribute the ingredients, then pour it over the vegetables in the skillet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-broccoli/#wprm-recipe-46421-step-0-15"}, {"@type": "HowToStep", "text": "Allow the mixture to simmer for 3–4 minutes, stirring regularly, until the sauce thickens and the ingredients are well combined.", "name": "Allow the mixture to simmer for 3–4 minutes, stirring regularly, until the sauce thickens and the ingredients are well combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-broccoli/#wprm-recipe-46421-step-0-16"}, {"@type": "HowToStep", "text": "For a thinner consistency, incorporate water 1 tablespoon at a time until the sauce reaches the preferred texture, then return the mixture to a simmer.", "name": "For a thinner consistency, incorpo
