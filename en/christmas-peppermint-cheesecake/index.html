    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Peppermint Cheesecake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, no-bake frozen cheesecake featuring a chocolate cookie crumb base, a light cream cheese filling, and crisp pieces of peppermint candy. The combination creates a cool, creamy holiday dessert with chocolate and mint flavors.", "datePublished": "2021-09-15T10:29:23+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/christmas-peppermint-cheesecake.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/christmas-peppermint-cheesecake.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/christmas-peppermint-cheesecake.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/christmas-peppermint-cheesecake.png"], "totalTime": "PT480M", "recipeIngredient": ["1½ cups finely crushed chocolate sandwich cookies (approximately 15 cookies)", "4 tablespoons unsalted butter (melted; Kerrygold may be used if preferred)", "1 pound cream cheese (softened to room temperature)", "1 cup peppermint candies (finely crushed; starlight mints are a suitable choice)", "1  can sweetened condensed milk (for a smooth and moist consistency)", "1 pint heavy whipping cream (thoroughly chilled for optimal whipping)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Process the chocolate sandwich cookies in a food processor until fine crumbs form. Alternatively, place the cookies inside a sturdy bag and crush them finely with a meat pounder.", "name": "Process the chocolate sandwich cookies in a food processor until fine crumbs form. Alternatively, place the cookies inside a sturdy bag and crush them finely with a meat pounder.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-0"}, {"@type": "HowToStep", "text": "Pour the melted unsalted butter into the cookie crumbs and stir thoroughly until the crumbs are evenly coated.", "name": "Pour the melted unsalted butter into the cookie crumbs and stir thoroughly until the crumbs are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the mixture to a 9-inch springform pan and firmly press it across the bottom in an even layer.", "name": "Transfer the mixture to a 9-inch springform pan and firmly press it across the bottom in an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-2"}, {"@type": "HowToStep", "text": "If the crumbs cling to your hands while pressing, cover the surface with plastic wrap and use the flat bottom of a measuring cup to compact and level the crust.", "name": "If the crumbs cling to your hands while pressing, cover the surface with plastic wrap and use the flat bottom of a measuring cup to compact and level the crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-3"}, {"@type": "HowToStep", "text": "Set the prepared crust aside while making the filling.", "name": "Set the prepared crust aside while making the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-4"}, {"@type": "HowToStep", "text": "Place the very cold heavy cream in the bowl of an electric mixer and whip until stiff peaks develop, approximately 2–3 minutes.", "name": "Place the very cold heavy cream in the bowl of an electric mixer and whip until stiff peaks develop, approximately 2–3 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the whipped cream to a separate bowl and reserve it for the filling.", "name": "Transfer the whipped cream to a separate bowl and reserve it for the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-6"}, {"@type": "HowToStep", "text": "Using the same mixer bowl without washing it, beat the softened cream cheese for approximately 2–3 minutes, or until completely creamy and smooth.", "name": "Using the same mixer bowl without washing it, beat the softened cream cheese for approximately 2–3 minutes, or until completely creamy and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-7"}, {"@type": "HowToStep", "text": "Pour in the sweetened condensed milk and continue mixing until the filling is uniform, silky, and completely free of lumps.", "name": "Pour in the sweetened condensed milk and continue mixing until the filling is uniform, silky, and completely free of lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-8"}, {"@type": "HowToStep", "text": "Add approximately half of the reserved whipped cream to the cream cheese mixture. Fold it in gently to lighten the filling.", "name": "Add approximately half of the reserved whipped cream to the cream cheese mixture. Fold it in gently to lighten the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-9"}, {"@type": "HowToStep", "text": "Add the remaining whipped cream and continue folding carefully until the mixture is evenly combined. Avoid vigorous stirring so the whipped cream retains as much volume as possible.", "name": "Add the remaining whipped cream and continue folding carefully until the mixture is evenly combined. Avoid vigorous stirring so the whipped cream retains as much volume as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-10"}, {"@type": "HowToStep", "text": "Fold the crushed peppermint candy into the creamy cheesecake mixture until evenly distributed.", "name": "Fold the crushed peppermint candy into the creamy cheesecake mixture until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-11"}, {"@type": "HowToStep", "text": "Spoon or pour the finished filling over the prepared chocolate cookie crust and spread it evenly in the springform pan.", "name": "Spoon or pour the finished filling over the prepared chocolate cookie crust and spread it evenly in the springform pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-12"}, {"@type": "HowToStep", "text": "Cover the pan securely with plastic wrap and transfer it to the freezer. Freeze for a minimum of 8 hours, allowing the cheesecake to become completely firm.", "name": "Cover the pan securely with plastic wrap and transfer it to the freezer. Freeze for a minimum of 8 hours, allowing the cheesecake to become completely firm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-13"}, {"@type": "HowToStep", "text": "Take the cheesecake out of the freezer approximately 20 minutes before serving so it softens slightly and is easier to slice.", "name": "Take the cheesecake out of the freezer approximately 20 minutes before serving so it softens slightly and is easier to slice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-14"}, {"@type": "HowToStep", "text": "Carefully cut the cheesecake into portions and serve while still chilled.", "name": "Carefully cut the cheesecake into portions and serve while still chilled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-peppermint-cheesecake/#wprm-recipe-44379-step-0-15"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Christmas Peppermint Cheesecake"}</script>
