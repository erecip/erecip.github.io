    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mini Pineapple Upside Down Cake Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Individual pineapple upside-down cakes feature a tender, lightly spiced pineapple batter over a rich brown sugar and butter topping. Each cake is finished with a pineapple ring and a maraschino cherry, creating the familiar caramelized presentation in a convenient single-serving size.", "datePublished": "2023-08-23T06:35:37+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/mini-pineapple-upside-down-cake-recipemini-pineapple-upside-down-cake-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/mini-pineapple-upside-down-cake-recipemini-pineapple-upside-down-cake-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/mini-pineapple-upside-down-cake-recipemini-pineapple-upside-down-cake-recipe2.png", "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/mini-pineapple-upside-down-cake-recipemini-pineapple-upside-down-cake-recipe2.png"], "cookTime": "PT20M", "totalTime": "PT25M", "recipeIngredient": ["½ cup pineapple juice", "2 tablespoons cornstarch", "4  large eggs (brought to room temperature (approximately 70°F))", "½ teaspoon ground cinnamon", "1½ cups all-purpose flour", "2 teaspoons rum (or an equal amount of vanilla extract)", "¼ teaspoon salt", "1¼ cups granulated white sugar", "2¼ teaspoons baking powder", "¼ cup packed dark brown sugar", "12  well-drained canned pineapple rings", "1½ cups firmly packed dark brown sugar", "12  maraschino cherries", "⅛ teaspoon salt", "1 teaspoon rum", "6 tablespoons unsalted butter"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Coat all 12 cavities of a jumbo muffin pan generously with nonstick cooking spray so the finished cakes can be released easily. Set the prepared pan aside.", "name": "Preheat the oven to 350°F (175°C). Coat all 12 cavities of a jumbo muffin pan generously with nonstick cooking spray so the finished cakes can be released easily. Set the prepared pan aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-0"}, {"@type": "HowToStep", "text": "Place the 4 room-temperature eggs in a large mixing bowl and whisk until uniformly smooth.", "name": "Place the 4 room-temperature eggs in a large mixing bowl and whisk until uniformly smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-1"}, {"@type": "HowToStep", "text": "Add the granulated sugar, ¼ cup dark brown sugar, and 2 teaspoons rum or vanilla extract. Beat until the ingredients form a smooth, well-blended mixture.", "name": "Add the granulated sugar, ¼ cup dark brown sugar, and 2 teaspoons rum or vanilla extract. Beat until the ingredients form a smooth, well-blended mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-2"}, {"@type": "HowToStep", "text": "Pour in the pineapple juice and stir until incorporated.", "name": "Pour in the pineapple juice and stir until incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-3"}, {"@type": "HowToStep", "text": "In a separate bowl, sift together the all-purpose flour, baking powder, cinnamon, ¼ teaspoon salt, and cornstarch.", "name": "In a separate bowl, sift together the all-purpose flour, baking powder, cinnamon, ¼ teaspoon salt, and cornstarch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-4"}, {"@type": "HowToStep", "text": "Gradually incorporate the sifted dry mixture into the wet ingredients, whisking only until combined. Avoid excessive mixing. Set the completed batter aside while preparing the topping.", "name": "Gradually incorporate the sifted dry mixture into the wet ingredients, whisking only until combined. Avoid excessive mixing. Set the completed batter aside while preparing the topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-5"}, {"@type": "HowToStep", "text": "Melt the unsalted butter in a small saucepan over medium heat.", "name": "Melt the unsalted butter in a small saucepan over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-6"}, {"@type": "HowToStep", "text": "Stir in the 1½ cups dark brown sugar, 1 teaspoon rum, and ⅛ teaspoon salt. Whisk continuously and cook for 1 minute, until the mixture is glossy and evenly blended.", "name": "Stir in the 1½ cups dark brown sugar, 1 teaspoon rum, and ⅛ teaspoon salt. Whisk continuously and cook for 1 minute, until the mixture is glossy and evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-7"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat.", "name": "Remove the saucepan from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-8"}, {"@type": "HowToStep", "text": "Immediately distribute approximately 2 tablespoons of the warm brown sugar mixture into the bottom of each prepared muffin cavity.", "name": "Immediately distribute approximately 2 tablespoons of the warm brown sugar mixture into the bottom of each prepared muffin cavity.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-9"}, {"@type": "HowToStep", "text": "Position one drained pineapple ring over the topping in every cavity, then place one maraschino cherry in the center of each ring. Arrange the fruit promptly because the brown sugar mixture will become firmer as it cools.", "name": "Position one drained pineapple ring over the topping in every cavity, then place one maraschino cherry in the center of each ring. Arrange the fruit promptly because the brown sugar mixture will become firmer as it cools.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-10"}, {"@type": "HowToStep", "text": "Divide the prepared cake batter evenly among the 12 muffin cavities, spooning it over the pineapple and cherry layers. Fill each cavity to approximately three-quarters full.", "name": "Divide the prepared cake batter evenly among the 12 muffin cavities, spooning it over the pineapple and cherry layers. Fill each cavity to approximately three-quarters full.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-11"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 20–22 minutes, or until the cakes are puffed and golden and a toothpick inserted into the center comes out clean. Monitor them carefully during the final few minutes because individual ovens can bake at slightly different rates.", "name": "Bake in the preheated oven for 20–22 minutes, or until the cakes are puffed and golden and a toothpick inserted into the center comes out clean. Monitor them carefully during the final few minutes because individual ovens can bake at slightly different rates.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-12"}, {"@type": "HowToStep", "text": "Remove the muffin pan from the oven and allow the cakes to rest in the pan for 5 minutes.", "name": "Remove the muffin pan from the oven and allow the cakes to rest in the pan for 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-13"}, {"@type": "HowToStep", "text": "Carefully run a knife around the perimeter of each cake to release any areas that may be sticking to the pan.", "name": "Carefully run a knife around the perimeter of each cake to release any areas that may be sticking to the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-14"}, {"@type": "HowToStep", "text": "Position a wire cooling rack over the muffin tin, then securely invert the pan and rack together to release the cakes. The rack may be placed over a large sheet pan to catch any topping and simplify cleanup.", "name": "Position a wire cooling rack over the muffin tin, then securely invert the pan and rack together to release the cakes. The rack may be placed over a large sheet pan to catch any topping and simplify cleanup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-15"}, {"@type": "HowToStep", "text": "Serve the mini pineapple upside-down cakes while slightly warm or allow them to reach room temperature before serving.", "name": "Serve the mini pineapple upside-down cakes while slightly warm or allow them to reach room temperature before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mini-pineapple-upside-down-cake-recipe/#wprm-recipe-42765-step-0-16"}], "recipeCategory": ["Dessert"], "keywords": "Mini Pineapple Upside Down Cake Recipe"}</script>
