31-step-0-4"}, {"@type": "HowToStep", "text": "Remove the casserole from the oven and allow it to stand for 5–10 minutes before cutting. Garnish with chopped fresh chives, if desired, and serve.", "name": "Remove the casserole from the oven and allow it to stand for 5–10 minutes before cutting. Garnish with chopped fresh chives, if desired, and serve.", "url": "https://erecip.github.io/en/cottage-cheese-hashbrown-casserole/#wprm-recipe-45931-step-0-5"}], "recipeCategory": ["Casserole"], "keywords": "Cottage Cheese Hashbrown Casserole"}</script>
