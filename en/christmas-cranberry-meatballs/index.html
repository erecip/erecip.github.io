rown sugar, and lemon juice in a large skillet. Stir the ingredients together and warm over medium heat until the sauce begins to boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-meatballs/#wprm-recipe-38672-step-0-4"}, {"@type": "HowToStep", "text": "Lower the heat, then add the baked meatballs to the skillet. Gently turn them in the sauce until coated, and continue cooking until the meatballs are thoroughly heated and the sauce clings evenly.", "name": "Lower the heat, then add the baked meatballs to the skillet. Gently turn them in the sauce until coated, and continue cooking until the meatballs are thoroughly heated and the sauce clings evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-meatballs/#wprm-recipe-38672-step-0-5"}, {"@type": "HowToStep", "text": "Garnish with additional chopped fresh parsley, if desired. Serve warm.", "name": "Garnish with additional chopped fresh parsley, if desired. Serve warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cranberry-meatballs/#wprm-recipe-38672-step-0-6"}], "recipeCategory": ["Appetizer"], "recipeCuisine": ["American"], "keywords": "Christmas Cranberry Meatballs"}</script>
