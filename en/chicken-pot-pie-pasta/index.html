rm-recipe-38525-step-0-4"}, {"@type": "HowToStep", "text": "Stir in the condensed cream of chicken soup, condensed cream of mushroom soup, and milk. Mix until the sauce is fully incorporated with the chicken and vegetables.", "name": "Stir in the condensed cream of chicken soup, condensed cream of mushroom soup, and milk. Mix until the sauce is fully incorporated with the chicken and vegetables.", "url": "https://erecip.github.io/en/chicken-pot-pie-pasta/#wprm-recipe-38525-step-0-5"}, {"@type": "HowToStep", "text": "Reduce the heat to low and let the mixture come to a gentle simmer. Cook for a few minutes until everything is hot and the sauce has thickened slightly, then turn off the heat.", "name": "Reduce the heat to low and let the mixture come to a gentle simmer. Cook for a few minutes until everything is hot and the sauce has thickened slightly, then turn off the heat.", "url": "https://erecip.github.io/en/chicken-pot-pie-pasta/#wprm-recipe-38525-step-0-6"}, {"@type": "HowToStep", "text": "Add the cooked and drained egg noodles to the skillet. Stir well until the noodles are completely coated in the creamy chicken and vegetable sauce.", "name": "Add the cooked and drained egg noodles to the skillet. Stir well until the noodles are completely coated in the creamy chicken and vegetable sauce.", "url": "https://erecip.github.io/en/chicken-pot-pie-pasta/#wprm-recipe-38525-step-0-7"}, {"@type": "HowToStep", "text": "Serve hot.", "name": "Serve hot.", "url": "https://erecip.github.io/en/chicken-pot-pie-pasta/#wprm-recipe-38525-step-0-8"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Chicken Pot Pie Pasta"}</script>
