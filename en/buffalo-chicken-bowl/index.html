ganize all the vegetables and toppings. Set aside.", "name": "Begin by preparing the rice according to the instructions on the packaging, which generally takes around 20 minutes. While the rice cooks, chop and organize all the vegetables and toppings. Set aside.", "url": "https://erecip.github.io/en/buffalo-chicken-bowl/#wprm-recipe-31457-step-0-0"}, {"@type": "HowToStep", "text": "Slice the chicken breasts or thighs into uniform, bite-sized cubes. This ensures even cooking and optimal texture.", "name": "Slice the chicken breasts or thighs into uniform, bite-sized cubes. This ensures even cooking and optimal texture.", "url": "https://erecip.github.io/en/buffalo-chicken-bowl/#wprm-recipe-31457-step-0-1"}, {"@type": "HowToStep", "text": "Season the chicken with salt, pepper, garlic powder, and dried basil. Heat olive oil in a large skillet over medium-high heat. Add the chicken and sear until browned on all sides, cooking for about 12 minutes or until the internal temperature reaches 165°F.", "name": "Season the chicken with salt, pepper, garlic powder, and dried basil. Heat olive oil in a large skillet over medium-high heat. Add the chicken and sear until browned on all sides, cooking for about 12 minutes or until the internal temperature reaches 165°F.", "url": "https://erecip.github.io/en/buffalo-chicken-bowl/#wprm-recipe-31457-step-0-2"}, {"@type": "HowToStep", "text": "As the chicken cooks, prepare the herby ranch. In a small food processor or blender, combine sour cream (or Greek yogurt), apple cider vinegar, garlic, onion powder, chives, cilantro, and salt. Blend until smooth and creamy.", "name": "As the chicken cooks, prepare the herby ranch. In a small food processor or blender, combine sour cream (or Greek yogurt), apple cider vinegar, garlic, onion powder, chives, cilantro, and salt. Blend until smooth and creamy.", "url": "https://erecip.github.io/en/buffalo-chicken-bowl/#wprm-recipe-31457-step-0-3"}, {"@type": "HowToStep", "text": "Once the chicken is
