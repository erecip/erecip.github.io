Step", "text": "Add the prepared pineapple, cucumber, red onion, cilantro, and optional jalapeño to a large mixing bowl.", "name": "Add the prepared pineapple, cucumber, red onion, cilantro, and optional jalapeño to a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-cucumber-salad/#wprm-recipe-42609-step-0-7"}, {"@type": "HowToStep", "text": "Toss gently until the ingredients are distributed evenly throughout the bowl.", "name": "Toss gently until the ingredients are distributed evenly throughout the bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-cucumber-salad/#wprm-recipe-42609-step-0-8"}, {"@type": "HowToStep", "text": "Pour the prepared lime dressing evenly over the pineapple and cucumber mixture.", "name": "Pour the prepared lime dressing evenly over the pineapple and cucumber mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-cucumber-salad/#wprm-recipe-42609-step-0-9"}, {"@type": "HowToStep", "text": "Gently toss the salad once more so that the dressing lightly coats all of the ingredients.", "name": "Gently toss the salad once more so that the dressing lightly coats all of the ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-cucumber-salad/#wprm-recipe-42609-step-0-10"}, {"@type": "HowToStep", "text": "Scatter the optional crumbled feta cheese over the top.", "name": "Scatter the optional crumbled feta cheese over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-cucumber-salad/#wprm-recipe-42609-step-0-11"}, {"@type": "HowToStep", "text": "For a colder salad with more integrated flavors, refrigerate the assembled mixture for 15–30 minutes before serving.", "name": "For a colder salad with more integrated flavors, refrigerate the assembled mixture for 15–30 minutes before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pineapple-cucumber-salad/#wprm-recipe-42609-
