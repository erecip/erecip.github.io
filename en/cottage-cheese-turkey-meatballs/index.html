    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Turkey Meatballs", "author": {"@type": "Person", "name": "BenDes"}, "description": "These tender turkey meatballs combine lean ground turkey with smoothly blended low-fat cottage cheese for added moisture and protein. Italian-seasoned breadcrumbs, basil, and black pepper provide simple savory flavor, while a quick skillet browning creates a golden exterior before the meatballs finish cooking in the oven.", "datePublished": "2018-11-18T11:35:51+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/cottage-cheese-turkey-meatballs.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/cottage-cheese-turkey-meatballs.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/cottage-cheese-turkey-meatballs.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/cottage-cheese-turkey-meatballs.png"], "cookTime": "PT15M", "totalTime": "PT15M", "recipeIngredient": ["½ cup small-curd (low-fat cottage cheese)", "2 teaspoons dried basil", "1  large egg (for binding)", "1 pound 93% lean ground turkey breast", "½ teaspoon ground black pepper", "½ cup Italian-seasoned breadcrumbs", "1 tablespoon 1% milk", "2 tablespoons canola oil (divided as needed; another neutral cooking oil, such as vegetable oil, may also be used)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Set the oven to 375°F (190°C) so it is fully heated when the browned meatballs are ready to bake.", "name": "Set the oven to 375°F (190°C) so it is fully heated when the browned meatballs are ready to bake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/#wprm-recipe-46098-step-0-0"}, {"@type": "HowToStep", "text": "Add the cottage cheese and 1% milk to a blender or food processor. Process for approximately one minute, or until the mixture becomes smooth and uniform.", "name": "Add the cottage cheese and 1% milk to a blender or food processor. Process for approximately one minute, or until the mixture becomes smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/#wprm-recipe-46098-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the blended cottage cheese mixture to a large mixing bowl. Add the ground turkey, egg, Italian-seasoned breadcrumbs, dried basil, and black pepper.", "name": "Transfer the blended cottage cheese mixture to a large mixing bowl. Add the ground turkey, egg, Italian-seasoned breadcrumbs, dried basil, and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/#wprm-recipe-46098-step-0-2"}, {"@type": "HowToStep", "text": "Mix thoroughly until all ingredients are evenly distributed throughout the turkey mixture.", "name": "Mix thoroughly until all ingredients are evenly distributed throughout the turkey mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/#wprm-recipe-46098-step-0-3"}, {"@type": "HowToStep", "text": "Divide and shape the mixture into 15 evenly sized meatballs to promote consistent cooking.", "name": "Divide and shape the mixture into 15 evenly sized meatballs to promote consistent cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/#wprm-recipe-46098-step-0-4"}, {"@type": "HowToStep", "text": "Place a 12-inch nonstick skillet over medium-high heat and add 1 tablespoon of the canola oil.", "name": "Place a 12-inch nonstick skillet over medium-high heat and add 1 tablespoon of the canola oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/#wprm-recipe-46098-step-0-5"}, {"@type": "HowToStep", "text": "Arrange the meatballs in the heated skillet and cook, turning as necessary, until their surfaces are browned on all sides.", "name": "Arrange the meatballs in the heated skillet and cook, turning as necessary, until their surfaces are browned on all sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/#wprm-recipe-46098-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the browned meatballs to a rack positioned over a baking sheet. If the meatballs need to be cooked in batches, repeat the browning process using the remaining tablespoon of oil.", "name": "Transfer the browned meatballs to a rack positioned over a baking sheet. If the meatballs need to be cooked in batches, repeat the browning process using the remaining tablespoon of oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/#wprm-recipe-46098-step-0-7"}, {"@type": "HowToStep", "text": "Place the browned meatballs in the preheated oven and bake for 12–15 minutes. They are fully cooked when the centers reach an internal temperature of 165°F (74°C).", "name": "Place the browned meatballs in the preheated oven and bake for 12–15 minutes. They are fully cooked when the centers reach an internal temperature of 165°F (74°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/#wprm-recipe-46098-step-0-8"}, {"@type": "HowToStep", "text": "Serve the cooked turkey meatballs alongside pasta, tuck them into sandwiches, or slice them and use them as a pizza topping.", "name": "Serve the cooked turkey meatballs alongside pasta, tuck them into sandwiches, or slice them and use them as a pizza topping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-turkey-meatballs/#wprm-recipe-46098-step-0-9"}], "recipeCuisine": ["American"], "keywords": "Cottage Cheese Turkey Meatballs"}</script>
