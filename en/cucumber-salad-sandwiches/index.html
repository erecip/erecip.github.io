e large bowl, blend the Greek yogurt with the crumbled feta, chopped herbs, lemon zest, lemon juice, and black pepper. Stir until the mixture becomes evenly combined and creamy.", "name": "In a separate large bowl, blend the Greek yogurt with the crumbled feta, chopped herbs, lemon zest, lemon juice, and black pepper. Stir until the mixture becomes evenly combined and creamy.", "url": "https://erecip.github.io/en/cucumber-salad-sandwiches/#wprm-recipe-38634-step-0-1"}, {"@type": "HowToStep", "text": "Once the cucumber has rested, drain away any released liquid. Transfer the cucumber pieces to a paper towel and gently pat them dry to remove as much moisture as possible.", "name": "Once the cucumber has rested, drain away any released liquid. Transfer the cucumber pieces to a paper towel and gently pat them dry to remove as much moisture as possible.", "url": "https://erecip.github.io/en/cucumber-salad-sandwiches/#wprm-recipe-38634-step-0-2"}, {"@type": "HowToStep", "text": "Add the dried cucumber to the yogurt and feta mixture. Fold thoroughly until the cucumber is evenly coated in the seasoned yogurt dressing.", "name": "Add the dried cucumber to the yogurt and feta mixture. Fold thoroughly until the cucumber is evenly coated in the seasoned yogurt dressing.", "url": "https://erecip.github.io/en/cucumber-salad-sandwiches/#wprm-recipe-38634-step-0-3"}, {"@type": "HowToStep", "text": "Lay out two slices of whole-grain bread. Divide the alfalfa sprouts evenly between the slices, then spoon the cucumber salad mixture over the sprouts.", "name": "Lay out two slices of whole-grain bread. Divide the alfalfa sprouts evenly between the slices, then spoon the cucumber salad mixture over the sprouts.", "url": "https://erecip.github.io/en/cucumber-salad-sandwiches/#wprm-recipe-38634-step-0-4"}, {"@type": "HowToStep", "text": "Place one thin slice of red onion over each cucumber layer. Cover each sandwich with the remaining slices of bread.", "name": "Place one thin slice of red
