    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Jam Sandwich Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Delicate, buttery sandwich cookies filled with bright raspberry jam and finished, if desired, with a snowy coating of confectioners’ sugar. Chilling the cream cheese-enriched dough helps it remain manageable while producing a tender finished texture.", "datePublished": "2018-07-18T10:22:12+00:00", "image": ["https://erecip.github.io/en/christmas-jam-sandwich-cookies/christmas-jam-sandwich-cookies2.png", "https://erecip.github.io/en/christmas-jam-sandwich-cookies/christmas-jam-sandwich-cookies2.png", "https://erecip.github.io/en/christmas-jam-sandwich-cookies/christmas-jam-sandwich-cookies2.png", "https://erecip.github.io/en/christmas-jam-sandwich-cookies/christmas-jam-sandwich-cookies2.png"], "cookTime": "PT10M", "totalTime": "PT30M", "recipeIngredient": ["1 cup unsalted butter (softened and sliced into 1/2-inch pieces)", "1/4 teaspoon salt", "2 tablespoons cream cheese (softened to approximately 70°F (room temperature))", "2 1/2 cups all-purpose flour", "2 teaspoons pure vanilla extract", "3/4 cup granulated sugar", "2 cups raspberry jam", "Confectioners’ sugar (as needed for an optional dusting)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the all-purpose flour, granulated sugar, and salt in the bowl of an electric mixer. Blend briefly until the dry ingredients are evenly combined.", "name": "Place the all-purpose flour, granulated sugar, and salt in the bowl of an electric mixer. Blend briefly until the dry ingredients are evenly combined.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-0"}, {"@type": "HowToStep", "text": "With the mixer operating on low speed, incorporate the softened butter gradually, adding one 1/2-inch piece at a time. Continue mixing for approximately 1–2 minutes, until the mixture develops a crumbly appearance with a slightly moist texture.", "name": "With the mixer operating on low speed, incorporate the softened butter gradually, adding one 1/2-inch piece at a time. Continue mixing for approximately 1–2 minutes, until the mixture develops a crumbly appearance with a slightly moist texture.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-1"}, {"@type": "HowToStep", "text": "Add the vanilla extract and softened cream cheese. Mix on low speed for about 30 seconds, stopping as soon as the dough begins to gather into large clumps.", "name": "Add the vanilla extract and softened cream cheese. Mix on low speed for about 30 seconds, stopping as soon as the dough begins to gather into large clumps.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-2"}, {"@type": "HowToStep", "text": "Turn the prepared dough out onto a countertop and divide it into two equal portions. Shape each portion into a disk measuring approximately 4 inches across.", "name": "Turn the prepared dough out onto a countertop and divide it into two equal portions. Shape each portion into a disk measuring approximately 4 inches across.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-3"}, {"@type": "HowToStep", "text": "Securely wrap both disks in plastic wrap and refrigerate for 20–30 minutes, or until the dough has started to firm.", "name": "Securely wrap both disks in plastic wrap and refrigerate for 20–30 minutes, or until the dough has started to firm.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C). Line a baking sheet with parchment paper.", "name": "Preheat the oven to 375°F (190°C). Line a baking sheet with parchment paper.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-5"}, {"@type": "HowToStep", "text": "Remove one chilled dough disk from the refrigerator. On a lightly floured work surface, roll the dough evenly to a thickness of about 1/8 inch.", "name": "Remove one chilled dough disk from the refrigerator. On a lightly floured work surface, roll the dough evenly to a thickness of about 1/8 inch.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-6"}, {"@type": "HowToStep", "text": "Cut the dough into shapes using cookie cutters of your choice. From half of the cutouts, remove a smaller shape from the center; these pieces will form the upper halves of the sandwich cookies.", "name": "Cut the dough into shapes using cookie cutters of your choice. From half of the cutouts, remove a smaller shape from the center; these pieces will form the upper halves of the sandwich cookies.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the cut cookies on the prepared baking sheet, leaving roughly 1 1/2 inches of space between them.", "name": "Arrange the cut cookies on the prepared baking sheet, leaving roughly 1 1/2 inches of space between them.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-8"}, {"@type": "HowToStep", "text": "Repeat the rolling and cutting procedure with the remaining chilled dough disk.", "name": "Repeat the rolling and cutting procedure with the remaining chilled dough disk.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-9"}, {"@type": "HowToStep", "text": "Bake the shaped cookies at 375°F (190°C) for 8–10 minutes, until their edges become lightly golden.", "name": "Bake the shaped cookies at 375°F (190°C) for 8–10 minutes, until their edges become lightly golden.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-10"}, {"@type": "HowToStep", "text": "Turn the baking sheet around halfway through the baking period to encourage even browning.", "name": "Turn the baking sheet around halfway through the baking period to encourage even browning.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-11"}, {"@type": "HowToStep", "text": "Leave the baked cookies on the baking sheet for 1–2 minutes before carefully transferring them to a wire cooling rack. Allow them to cool completely before assembling.", "name": "Leave the baked cookies on the baking sheet for 1–2 minutes before carefully transferring them to a wire cooling rack. Allow them to cool completely before assembling.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-12"}, {"@type": "HowToStep", "text": "Spread a thin, even coating of raspberry jam over the flat underside of each solid cookie.", "name": "Spread a thin, even coating of raspberry jam over the flat underside of each solid cookie.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-13"}, {"@type": "HowToStep", "text": "Position one cookie with a center opening over each jam-covered base, pressing very gently to create a sandwich without forcing out the filling.", "name": "Position one cookie with a center opening over each jam-covered base, pressing very gently to create a sandwich without forcing out the filling.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-14"}, {"@type": "HowToStep", "text": "Finish the assembled cookies with confectioners’ sugar, if desired.", "name": "Finish the assembled cookies with confectioners’ sugar, if desired.", "url": "https://erecip.github.io/en/christmas-jam-sandwich-cookies/#wprm-recipe-42060-step-0-15"}], "recipeCategory": ["Cookies"], "recipeCuisine": ["American"], "keywords": "Christmas Jam Sandwich Cookies"}</script>
