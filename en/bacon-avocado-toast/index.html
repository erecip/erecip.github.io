    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Bacon Avocado Toast", "author": {"@type": "Person", "name": "BenDes"}, "description": "Crisp, golden sourdough is topped with lightly mashed lemon-seasoned avocado, smoky bacon, tangy feta, fresh green onion, hot honey, and a savory bagel seasoning blend. The combination delivers creamy, crunchy, salty, bright, and subtly sweet-spicy flavors in each bite.", "datePublished": "2020-02-04T19:04:20+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/bacon-avocado-toast.png", "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/bacon-avocado-toast.png", "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/bacon-avocado-toast.png", "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/bacon-avocado-toast.png"], "totalTime": "PT15M", "recipeIngredient": ["½  ripe avocado (halved lengthwise and pit removed)", "½ oz feta cheese (crumbled)", "1  thick slice sourdough bread (approximately ¾ inch thick)", "Hot honey (as needed for a finishing drizzle)", "1  green onion (finely sliced, using the white and pale green portions)", "1  lemon wedge (for fresh juice)", "1 slice bacon (cooked and chopped into roughly 2 tablespoons of pieces)", "A small pinch of fine sea salt", "Everything bagel seasoning or another bagel-style seasoning blend (to taste)", "1 tablespoon mayonnaise (such as Hellmann’s)", "Cooking spray (or butter for browning the bread)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Cook the bacon slice until it reaches the preferred degree of crispness. For a balance of textures, allow it to become crisp around the edges while retaining a slight chew in the center.", "name": "Cook the bacon slice until it reaches the preferred degree of crispness. For a balance of textures, allow it to become crisp around the edges while retaining a slight chew in the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/#wprm-recipe-42436-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the cooked bacon to a plate lined with paper towel to absorb excess fat. Once drained, chop it into bite-size pieces, yielding approximately 2 tablespoons, and set aside.", "name": "Transfer the cooked bacon to a plate lined with paper towel to absorb excess fat. Once drained, chop it into bite-size pieces, yielding approximately 2 tablespoons, and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/#wprm-recipe-42436-step-0-1"}, {"@type": "HowToStep", "text": "Coat both surfaces of the sourdough slice evenly with the mayonnaise.", "name": "Coat both surfaces of the sourdough slice evenly with the mayonnaise.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/#wprm-recipe-42436-step-0-2"}, {"@type": "HowToStep", "text": "Warm a skillet or griddle over medium-high heat, then lightly grease the cooking surface with cooking spray or butter.", "name": "Warm a skillet or griddle over medium-high heat, then lightly grease the cooking surface with cooking spray or butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/#wprm-recipe-42436-step-0-3"}, {"@type": "HowToStep", "text": "Place the prepared bread in the hot pan and toast for 3–4 minutes on each side, or until the exterior is deeply golden and crisp while the center remains tender.", "name": "Place the prepared bread in the hot pan and toast for 3–4 minutes on each side, or until the exterior is deeply golden and crisp while the center remains tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/#wprm-recipe-42436-step-0-4"}, {"@type": "HowToStep", "text": "While the bread is browning, scoop the flesh from the avocado half into a small bowl.", "name": "While the bread is browning, scoop the flesh from the avocado half into a small bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/#wprm-recipe-42436-step-0-5"}, {"@type": "HowToStep", "text": "Squeeze the lemon wedge over the avocado, then season it with a pinch of fine sea salt.", "name": "Squeeze the lemon wedge over the avocado, then season it with a pinch of fine sea salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/#wprm-recipe-42436-step-0-6"}, {"@type": "HowToStep", "text": "Mash gently with a fork until the avocado reaches the desired texture. Keep some small pieces intact rather than making the mixture completely smooth if a chunkier consistency is preferred.", "name": "Mash gently with a fork until the avocado reaches the desired texture. Keep some small pieces intact rather than making the mixture completely smooth if a chunkier consistency is preferred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/#wprm-recipe-42436-step-0-7"}, {"@type": "HowToStep", "text": "Place the freshly toasted sourdough on a serving plate and distribute the avocado mixture evenly over the warm surface.", "name": "Place the freshly toasted sourdough on a serving plate and distribute the avocado mixture evenly over the warm surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/#wprm-recipe-42436-step-0-8"}, {"@type": "HowToStep", "text": "Scatter the chopped bacon over the avocado, followed by the crumbled feta and thinly sliced green onion.", "name": "Scatter the chopped bacon over the avocado, followed by the crumbled feta and thinly sliced green onion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bacon-avocado-toast/#wprm-recipe-42436-step-0-9"}, {"@type": "HowToStep", "text": "Complete the toast with a light drizzle of hot honey and a sprinkling of bagel seasoning. Serve immediately while the bread remains warm and crisp.", "name": "Complete the toast with a light drizzle o
