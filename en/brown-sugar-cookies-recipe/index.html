heet with parchment paper or leave ungreased if none is available. Retrieve the chilled dough and portion into balls approximately 2 tablespoons each, rolling each into a smooth sphere before coating thoroughly in granulated sugar. Arrange the cookie dough balls on the prepared sheet, ensuring at least 2 inches of space between each. Bake for 11–12 minutes; the centers may appear slightly underdone — this ensures a soft texture. Leave the cookies on the sheet to cool entirely, allowing them to finish setting as they rest.", "name": "In a large mixing bowl, blend the cooled melted butter and brown sugar thoroughly until fully incorporated. Stir in the whole egg, additional yolk, and vanilla extract, mixing until smooth. In a separate medium bowl, whisk together the flour, cornstarch, baking soda, baking powder, and salt until evenly combined. Gradually fold the dry mixture into the wet ingredients, stirring just until the dough forms. Cover the bowl securely with plastic wrap and refrigerate for no less than 45 minutes. Preheat the oven to 350°F (175°C) and line a baking sheet with parchment paper or leave ungreased if none is available. Retrieve the chilled dough and portion into balls approximately 2 tablespoons each, rolling each into a smooth sphere before coating thoroughly in granulated sugar. Arrange the cookie dough balls on the prepared sheet, ensuring at least 2 inches of space between each. Bake for 11–12 minutes; the centers may appear slightly underdone — this ensures a soft texture. Leave the cookies on the sheet to cool entirely, allowing them to finish setting as they rest.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/brown-sugar-cookies-recipe/#wprm-recipe-15134-step-0-0"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Brown Sugar Cookies Recipe"}</script>
