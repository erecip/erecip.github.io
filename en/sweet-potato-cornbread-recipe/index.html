 coloring at this stage, if using. Four drops may be stirred in for additional color.", "name": "Add the orange food coloring at this stage, if using. Four drops may be stirred in for additional color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-5"}, {"@type": "HowToStep", "text": "Mix the wet ingredients until the mixture appears smooth and fully blended.", "name": "Mix the wet ingredients until the mixture appears smooth and fully blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-6"}, {"@type": "HowToStep", "text": "Gradually fold the dry mixture into the wet mixture, stirring gently only until combined.", "name": "Gradually fold the dry mixture into the wet mixture, stirring gently only until combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-7"}, {"@type": "HowToStep", "text": "Avoid excessive mixing, as overworking the batter may create a heavier texture.", "name": "Avoid excessive mixing, as overworking the batter may create a heavier texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the batter into the prepared 8-inch baking dish, spreading it evenly.", "name": "Transfer the batter into the prepared 8-inch baking dish, spreading it evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-9"}, {"@type": "HowToStep", "text": "Place the dish on the center rack of the preheated oven and bake for 20 minutes.", "name": "Place the dish on the center rack of the preheated oven and bake for 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-10"}, {"@type": "HowToStep", "text": "After the first 20 minutes, loosely cover the dish with aluminum foil to reduce excessive browning.", "name": "After the first 20 minutes, loosely cover the dish with aluminum foil to reduce excessive browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-11"}, {"@type": "HowToStep", "text": "Continue baking for another 20 minutes, or until the center is set.", "name": "Continue baking for another 20 minutes, or until the center is set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-12"}, {"@type": "HowToStep", "text": "While the cornbread finishes baking, prepare the glaze by stirring together the melted butter, honey, packed brown sugar, cinnamon, and salt while the butter and sugar are still warm enough to help the sugar dissolve.", "name": "While the cornbread finishes baking, prepare the glaze by stirring together the melted butter, honey, packed brown sugar, cinnamon, and salt while the butter and sugar are still warm enough to help the sugar dissolve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-13"}, {"@type": "HowToStep", "text": "Remove the cornbread from the oven and brush the warm glaze generously over the surface several times.", "name": "Remove the cornbread from the oven and brush the warm glaze generously over the surface several times.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-14"}, {"@type": "HowToStep", "text": "Use only as much glaze as needed.", "name": "Use only as much glaze as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-cornbread-recipe/#wprm-recipe-38740-step-0-15"}, {"@type": "HowToStep", "text": "Allow the glaze to settle into the hot cornbread, then serve warm.", "name": "Allow the glaze to settle into
