    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "High Protein Pepperoni Pizza Rolls", "author": {"@type": "Person", "name": "BenDes"}, "description": "These high-protein pepperoni pizza rolls combine seasoned lean ground beef, chopped pepperoni, a rich tomato mixture, and reduced-fat mozzarella inside large wraps. Once tightly rolled, they are toasted until crisp on the outside and hot and melted in the center, creating a protein-packed meal with classic pizza-inspired flavors.", "datePublished": "2023-08-02T13:22:21+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/high-protein-pepperoni-pizza-rolls.png", "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/high-protein-pepperoni-pizza-rolls.png", "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/high-protein-pepperoni-pizza-rolls.png", "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/high-protein-pepperoni-pizza-rolls.png"], "totalTime": "PT20M", "recipeIngredient": ["2.2 lb 95% lean ground beef", "2 tbsp concentrated tomato paste", "2 tsp smoked paprika", "5.2 oz pepperoni (roughly chopped)", "14 oz crushed tomatoes (preferably San Marzano-style)", "Fine salt and freshly ground black pepper (as needed)", "2 tsp garlic powder", "0.5 oz fresh flat-leaf parsley (finely chopped)", "Cooking oil spray", "2 tsp dried oregano (rubbed between the fingers before adding)", "2 tsp onion powder", "7.05 oz reduced-fat mozzarella (shredded)", "Sauce of choice (as desired)", "6  large wraps (approximately 10 inches in diameter)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the onion powder, garlic powder, smoked paprika, and dried oregano in a small bowl. Stir until the seasonings are evenly distributed.", "name": "Combine the onion powder, garlic powder, smoked paprika, and dried oregano in a small bowl. Stir until the seasonings are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-0"}, {"@type": "HowToStep", "text": "Coat a large pan lightly with cooking spray and place it over medium-high heat. Add the lean ground beef, then season with salt and ground black pepper according to taste.", "name": "Coat a large pan lightly with cooking spray and place it over medium-high heat. Add the lean ground beef, then season with salt and ground black pepper according to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-1"}, {"@type": "HowToStep", "text": "Cook for approximately 5 minutes, stirring from time to time, until the beef has browned and no pink remains.", "name": "Cook for approximately 5 minutes, stirring from time to time, until the beef has browned and no pink remains.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-2"}, {"@type": "HowToStep", "text": "Stir the coarsely chopped pepperoni into the cooked beef, followed by the prepared seasoning mixture.", "name": "Stir the coarsely chopped pepperoni into the cooked beef, followed by the prepared seasoning mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-3"}, {"@type": "HowToStep", "text": "Continue cooking for another 2 minutes, stirring occasionally, until the pepperoni develops a light golden color and becomes aromatic.", "name": "Continue cooking for another 2 minutes, stirring occasionally, until the pepperoni develops a light golden color and becomes aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-4"}, {"@type": "HowToStep", "text": "Add the crushed tomatoes, tomato paste, and chopped flat-leaf parsley to the beef and pepperoni mixture. Stir thoroughly so all ingredients are evenly incorporated.", "name": "Add the crushed tomatoes, tomato paste, and chopped flat-leaf parsley to the beef and pepperoni mixture. Stir thoroughly so all ingredients are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-5"}, {"@type": "HowToStep", "text": "Bring the mixture to a gentle simmer and cook for 2–3 minutes, allowing excess moisture to evaporate and the filling to thicken. Remove the pan from the heat once the mixture is rich and no longer watery.", "name": "Bring the mixture to a gentle simmer and cook for 2–3 minutes, allowing excess moisture to evaporate and the filling to thicken. Remove the pan from the heat once the mixture is rich and no longer watery.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-6"}, {"@type": "HowToStep", "text": "Arrange the six wraps on a flat work surface. Divide the prepared beef, pepperoni, and tomato filling evenly among them.", "name": "Arrange the six wraps on a flat work surface. Divide the prepared beef, pepperoni, and tomato filling evenly among them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-7"}, {"@type": "HowToStep", "text": "Distribute the shredded low-fat mozzarella over the filling, then add a small drizzle of your preferred sauce if desired.", "name": "Distribute the shredded low-fat mozzarella over the filling, then add a small drizzle of your preferred sauce if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-8"}, {"@type": "HowToStep", "text": "Fold and roll each wrap firmly into a burrito-style shape, keeping the filling securely enclosed.", "name": "Fold and roll each wrap firmly into a burrito-style shape, keeping the filling securely enclosed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-9"}, {"@type": "HowToStep", "text": "Arrange the filled wraps seam-side down on a baking tray or place them in an air fryer basket. Lightly coat their surfaces with cooking spray. Additional chopped flat-leaf parsley may be scattered over the top if desired.", "name": "Arrange the filled wraps seam-side down on a baking tray or place them in an air fryer basket. Lightly coat their surfaces with cooking spray. Additional chopped flat-leaf parsley may be scattered over the top if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-10"}, {"@type": "HowToStep", "text": "For the oven method, bake in a preheated oven at 200°C (400°F) for 8–10 minutes.", "name": "For the oven method, bake in a preheated oven at 200°C (400°F) for 8–10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-11"}, {"@type": "HowToStep", "text": "For the air fryer method, cook at 180°C (350°F) for 8–10 minutes.", "name": "For the air fryer method, cook at 180°C (350°F) for 8–10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-12"}, {"@type": "HowToStep", "text": "The pizza rolls are ready when the exterior is crisp and lightly golden and the mozzarella inside has melted.", "name": "The pizza rolls are ready when the exterior is crisp and lightly golden and the mozzarella inside has melted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-13"}, {"@type": "HowToStep", "text": "Allow them to cool for several minutes before slicing or serving.", "name": "Allow them to cool for several minutes before slicing or serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/high-protein-pepperoni-pizza-rolls/#wprm-recipe-42166-step-0-14"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "High Protein Pepperoni Pizza Rolls"}</script>
