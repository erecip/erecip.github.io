    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mushroom Pasta Bake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, oven-baked pasta dish featuring golden sautéed mushrooms, garlic, fresh herbs, and a smooth cream sauce brightened with lemon juice. Sour cream adds a gentle tang, while a layer of mozzarella melts over the top to create a bubbling, lightly golden finish.", "datePublished": "2021-12-16T16:49:03+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/mushroom-pasta-bake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/mushroom-pasta-bake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/mushroom-pasta-bake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/mushroom-pasta-bake2.png"], "prepTime": "PT20M", "cookTime": "PT35M", "totalTime": "PT58M", "recipeIngredient": ["1 cup full-fat heavy cream", "2  –3 tablespoons freshly squeezed lemon juice (adjusted to taste)", "6 cups button or cremini mushrooms (wiped clean and cut in halves, approximately 1 pound)", "Fine salt and freshly ground black pepper (as needed)", "2 tablespoons cornstarch (for thickening the sauce)", "½ cup finely chopped fresh chives (or an equal amount of fresh parsley)", "2 tablespoons unsalted butter (preferably a rich-quality butter such as Kerrygold)", "1 cup milk", "2 teaspoons finely minced fresh garlic", "1 pound cooked pasta (preferably penne or rigatoni)", "1 cup freshly grated mozzarella", "1 cup sour cream"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 180°C (350°F).", "name": "Preheat the oven to 180°C (350°F).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-0"}, {"@type": "HowToStep", "text": "Wipe the mushrooms clean with a damp cloth, then slice each mushroom in half. Finely mince the garlic and chop the chives. Measure the heavy cream, milk, sour cream, and remaining ingredients so they are ready for cooking.", "name": "Wipe the mushrooms clean with a damp cloth, then slice each mushroom in half. Finely mince the garlic and chop the chives. Measure the heavy cream, milk, sour cream, and remaining ingredients so they are ready for cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-1"}, {"@type": "HowToStep", "text": "Place a large skillet over medium-high heat and melt the 2 tablespoons of butter.", "name": "Place a large skillet over medium-high heat and melt the 2 tablespoons of butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-2"}, {"@type": "HowToStep", "text": "Once the butter begins to foam, arrange the halved mushrooms in a single layer. Leave them undisturbed for 3–4 minutes, allowing one side to become deeply golden.", "name": "Once the butter begins to foam, arrange the halved mushrooms in a single layer. Leave them undisturbed for 3–4 minutes, allowing one side to become deeply golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-3"}, {"@type": "HowToStep", "text": "Stir the mushrooms and continue cooking for another 3–4 minutes, or until they are tender and have released their moisture.", "name": "Stir the mushrooms and continue cooking for another 3–4 minutes, or until they are tender and have released their moisture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-4"}, {"@type": "HowToStep", "text": "Add the 2 teaspoons minced garlic to the browned mushrooms and cook for approximately 30 seconds, just until aromatic.", "name": "Add the 2 teaspoons minced garlic to the browned mushrooms and cook for approximately 30 seconds, just until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-5"}, {"@type": "HowToStep", "text": "In a small bowl, combine the 2 tablespoons cornstarch with several tablespoons of the measured milk. Whisk until completely smooth to form a lump-free slurry.", "name": "In a small bowl, combine the 2 tablespoons cornstarch with several tablespoons of the measured milk. Whisk until completely smooth to form a lump-free slurry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-6"}, {"@type": "HowToStep", "text": "Pour the cornstarch slurry into the skillet, followed by the remaining milk and the 1 cup heavy cream. Stir continuously as the mixture comes together.", "name": "Pour the cornstarch slurry into the skillet, followed by the remaining milk and the 1 cup heavy cream. Stir continuously as the mixture comes together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-7"}, {"@type": "HowToStep", "text": "Allow the sauce to simmer gently for 3–5 minutes, stirring frequently, until it thickens sufficiently to coat the back of a spoon.", "name": "Allow the sauce to simmer gently for 3–5 minutes, stirring frequently, until it thickens sufficiently to coat the back of a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-8"}, {"@type": "HowToStep", "text": "Stir in 2–3 tablespoons fresh lemon juice, using the amount that best suits your preferred level of acidity. Adding the lemon at this stage allows its sharpness to soften slightly as it blends into the creamy sauce.", "name": "Stir in 2–3 tablespoons fresh lemon juice, using the amount that best suits your preferred level of acidity. Adding the lemon at this stage allows its sharpness to soften slightly as it blends into the creamy sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-9"}, {"@type": "HowToStep", "text": "Remove the skillet from the heat. Stir in the 1 cup sour cream until smoothly and completely incorporated. Keeping the pan off the heat at this stage helps prevent the sour cream from separating.", "name": "Remove the skillet from the heat. Stir in the 1 cup sour cream until smoothly and completely incorporated. Keeping the pan off the heat at this stage helps prevent the sour cream from separating.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-10"}, {"@type": "HowToStep", "text": "Fold in the ½ cup chopped chives, then season the mixture with salt and freshly ground black pepper according to taste.", "name": "Fold in the ½ cup chopped chives, then season the mixture with salt and freshly ground black pepper according to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-11"}, {"@type": "HowToStep", "text": "Add the 1 pound cooked pasta and gently fold everything together until the pasta is thoroughly covered with the mushroom cream sauce.", "name": "Add the 1 pound cooked pasta and gently fold everything together until the pasta is thoroughly covered with the mushroom cream sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the creamy mushroom pasta mixture to a baking dish and spread it evenly.", "name": "Transfer the creamy mushroom pasta mixture to a baking dish and spread it evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-13"}, {"@type": "HowToStep", "text": "Scatter the 1 cup freshly grated mozzarella uniformly over the surface.", "name": "Scatter the 1 cup freshly grated mozzarella uniformly over the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-14"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 20 minutes, or until the mozzarella is melted, bubbling around the edges, and lightly golden across the top.", "name": "Bake in the preheated oven for 20 minutes, or until the mozzarella is melted, bubbling around the edges, and lightly golden across the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-15"}, {"@type": "HowToStep", "text": "Remove the pasta bake from the oven and allow it to stand for 2–3 minutes before serving. This brief resting period gives the creamy sauce time to settle slightly and helps the pasta maintain its structure when portioned.", "name": "Remove the pasta bake from the oven and allow it to stand for 2–3 minutes before serving. This brief resting period gives the creamy sauce time to settle slightly and helps the pasta maintain its structure when portioned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-pasta-bake/#wprm-recipe-41705-step-0-16"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["European"], "keywords": "Mushroom Pasta Bake"}</script>
