 until they begin to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fried-rice/#wprm-recipe-32307-step-0-3"}, {"@type": "HowToStep", "text": "Add the marinated chicken to the pan and stir-fry until the pieces turn from pink to white, which will take roughly 1½ minutes.", "name": "Add the marinated chicken to the pan and stir-fry until the pieces turn from pink to white, which will take roughly 1½ minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fried-rice/#wprm-recipe-32307-step-0-4"}, {"@type": "HowToStep", "text": "Incorporate the chilled cooked rice along with the remaining sauce. Stir vigorously and continuously for another 1½ minutes to heat the rice thoroughly and coat each grain with flavor.", "name": "Incorporate the chilled cooked rice along with the remaining sauce. Stir vigorously and continuously for another 1½ minutes to heat the rice thoroughly and coat each grain with flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fried-rice/#wprm-recipe-32307-step-0-5"}, {"@type": "HowToStep", "text": "Return the scrambled eggs to the skillet along with the chopped green onions. Fold everything together until evenly distributed, then remove from heat.", "name": "Return the scrambled eggs to the skillet along with the chopped green onions. Fold everything together until evenly distributed, then remove from heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fried-rice/#wprm-recipe-32307-step-0-6"}, {"@type": "HowToStep", "text": "Serve hot, straight from the wok.", "name": "Serve hot, straight from the wok.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-fried-rice/#wprm-recipe-32307-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Asian", "Chinese"], "keywords": "chicken fried rice"}</script>
