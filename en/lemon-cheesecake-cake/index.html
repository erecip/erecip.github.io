    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Cheesecake Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "This lemon cheesecake cake combines two tender lemon cake layers with a rich, citrus-scented cheesecake center and a smooth lemon cream cheese frosting. Fresh lemon juice, zest, and lemon extract provide bright flavor throughout, while the chilled cheesecake layer creates a creamy contrast to the soft cake.", "datePublished": "2018-01-14T16:52:41+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/lemon-cheesecake-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/lemon-cheesecake-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/lemon-cheesecake-cake2.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/lemon-cheesecake-cake2.png"], "cookTime": "PT24M", "totalTime": "PT69M", "recipeIngredient": ["3/4 cup full-fat sour cream", "1 teaspoon lemon extract", "3  large eggs (brought to room temperature, approximately 70°F)", "3 tablespoons all-purpose flour", "16 ounces full-fat cream cheese (slightly softened)", "1/4 teaspoon salt", "1 cup white granulated sugar", "1/4 cup freshly squeezed lemon juice", "3 cups cake flour", "Finely grated zest from 2 lemons", "1 1/4 cups buttermilk", "3  large eggs", "1/2 teaspoon baking soda", "1 tablespoon lemon extract", "1 1/2  sticks (12 tablespoons unsalted butter, softened)", "2 teaspoons baking powder", "1/4 cup vegetable oil", "1/2 teaspoon salt", "2 cups granulated sugar", "1 teaspoon lemon extract", "6 to 6 1/2 cups confectioners’ sugar", "2  sticks unsalted butter (only slightly softened to approximately 65°F)", "Yellow gel food coloring (optional)", "16 ounces full-fat cream cheese (barely softened)", "Finely grated zest from 1 lemon (approximately 1 1/2 teaspoons, optional)", "Disposable piping bag fitted with a 2D piping tip", "Small offset spatula", "Prepared lemon cake layers", "Chilled cheesecake layer", "Prepared lemon cream cheese frosting"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place a pan containing approximately 1 inch of water on a lower oven rack. This provides moisture during baking and helps reduce the likelihood of cracks forming in the cheesecake.", "name": "Place a pan containing approximately 1 inch of water on a lower oven rack. This provides moisture during baking and helps reduce the likelihood of cracks forming in the cheesecake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-0"}, {"@type": "HowToStep", "text": "Preheat the oven to 300°F.", "name": "Preheat the oven to 300°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-1"}, {"@type": "HowToStep", "text": "Cut a parchment-paper circle to fit the base of a 9-inch springform pan and line the bottom of the pan.", "name": "Cut a parchment-paper circle to fit the base of a 9-inch springform pan and line the bottom of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-2"}, {"@type": "HowToStep", "text": "Place the slightly softened cream cheese in a mixing bowl and beat until completely smooth.", "name": "Place the slightly softened cream cheese in a mixing bowl and beat until completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-3"}, {"@type": "HowToStep", "text": "Add the granulated sugar, salt, and all-purpose flour. Mix on low speed until evenly incorporated.", "name": "Add the granulated sugar, salt, and all-purpose flour. Mix on low speed until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-4"}, {"@type": "HowToStep", "text": "Blend in the sour cream and lemon extract until the mixture is uniform.", "name": "Blend in the sour cream and lemon extract until the mixture is uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-5"}, {"@type": "HowToStep", "text": "Add the room-temperature eggs one at a time, mixing after each addition until incorporated.", "name": "Add the room-temperature eggs one at a time, mixing after each addition until incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the cheesecake batter to the parchment-lined springform pan.", "name": "Transfer the cheesecake batter to the parchment-lined springform pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-7"}, {"@type": "HowToStep", "text": "Position the springform pan on the oven rack directly above the pan of water. Bake for 45 minutes, or until the cheesecake is set around the edges while retaining a slight jiggle in the center.", "name": "Position the springform pan on the oven rack directly above the pan of water. Bake for 45 minutes, or until the cheesecake is set around the edges while retaining a slight jiggle in the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-8"}, {"@type": "HowToStep", "text": "Turn the oven off and leave the cheesecake inside for an additional 30 minutes, keeping the oven door slightly open so the cheesecake can cool gradually.", "name": "Turn the oven off and leave the cheesecake inside for an additional 30 minutes, keeping the oven door slightly open so the cheesecake can cool gradually.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-9"}, {"@type": "HowToStep", "text": "Remove the cheesecake and allow it to finish cooling on the countertop. Once cooled, cover it and freeze for 2–3 hours, or refrigerate for at least 5–6 hours. Refrigerating overnight is also suitable.", "name": "Remove the cheesecake and allow it to finish cooling on the countertop. Once cooled, cover it and freeze for 2–3 hours, or refrigerate for at least 5–6 hours. Refrigerating overnight is also suitable.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-10"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F. Grease and flour two 9 × 2-inch round cake pans.", "name": "Preheat the oven to 350°F. Grease and flour two 9 × 2-inch round cake pans.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-11"}, {"@type": "HowToStep", "text": "In a medium bowl, whisk the cake flour, baking powder, baking soda, salt, and fresh lemon zest together for approximately 30 seconds. Set the dry mixture aside.", "name": "In a medium bowl, whisk the cake flour, baking powder, baking soda, salt, and fresh lemon zest together for approximately 30 seconds. Set the dry mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-12"}, {"@type": "HowToStep", "text": "In a separate bowl, stir together the buttermilk, vegetable oil, freshly squeezed lemon juice, and lemon extract.", "name": "In a separate bowl, stir together the buttermilk, vegetable oil, freshly squeezed lemon juice, and lemon extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-13"}, {"@type": "HowToStep", "text": "Using a stand mixer, beat the softened unsalted butter until smooth.", "name": "Using a stand mixer, beat the softened unsalted butter until smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-14"}, {"@type": "HowToStep", "text": "Gradually incorporate the granulated sugar and continue beating until the butter mixture becomes pale, light, and fluffy.", "name": "Gradually incorporate the granulated sugar and continue beating until the butter mixture becomes pale, light, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-15"}, {"@type": "HowToStep", "text": "Add the eggs individually, mixing thoroughly after each one.", "name": "Add the eggs individually, mixing thoroughly after each one.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-16"}, {"@type": "HowToStep", "text": "Add the dry and liquid mixtures alternately. Begin with the flour mixture, follow with the buttermilk mixture, and continue until everything has been added, using three additions of the dry mixture and two additions of the liquid mixture. Finish with the dry ingredients.", "name": "Add the dry and liquid mixtures alternately. Begin with the flour mixture, follow with the buttermilk mixture, and continue until everything has been added, using three additions of the dry mixture and two additions of the liquid mixture. Finish with the dry ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-17"}, {"@type": "HowToStep", "text": "Mix only until the batter is combined; avoid excessive mixing.", "name": "Mix only until the batter is combined; avoid excessive mixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-18"}, {"@type": "HowToStep", "text": "Distribute the batter evenly between the two prepared cake pans.", "name": "Distribute the batter evenly between the two prepared cake pans.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-19"}, {"@type": "HowToStep", "text": "Bake for 20–24 minutes, or until a toothpick inserted into the center emerges clean or with only a few moist crumbs attached.", "name": "Bake for 20–24 minutes, or until a toothpick inserted into the center emerges clean or with only a few moist crumbs attached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-20"}, {"@type": "HowToStep", "text": "Allow the cake layers to rest in their pans for 10 minutes, then carefully turn them out onto cooling racks and let them cool completely.", "name": "Allow the cake layers to rest in their pans for 10 minutes, then carefully turn them out onto cooling racks and let them cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-21"}, {"@type": "HowToStep", "text": "Place the slightly softened butter in the mixer bowl and beat until smooth.", "name": "Place the slightly softened butter in the mixer bowl and beat until smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-22"}, {"@type": "HowToStep", "text": "Cut the barely softened cream cheese into smaller pieces. Add the pieces to the butter and mix until the frosting base becomes smooth and creamy.", "name": "Cut the barely softened cream cheese into smaller pieces. Add the pieces to the butter and mix until the frosting base becomes smooth and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-23"}, {"@type": "HowToStep", "text": "Blend in the lemon extract. Add the optional fresh lemon zest at this stage if a stronger citrus note is desired.", "name": "Blend in the lemon extract. Add the optional fresh lemon zest at this stage if a stronger citrus note is desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-24"}, {"@type": "HowToStep", "text": "Gradually incorporate 6 to 6 1/2 cups of powdered sugar, beating until the frosting reaches a smooth, fluffy consistency.", "name": "Gradually incorporate 6 to 6 1/2 cups of powdered sugar, beating until the frosting reaches a smooth, fluffy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-25"}, {"@type": "HowToStep", "text": "For a brighter yellow appearance, blend in a small quantity of yellow gel food coloring if desired.", "name": "For a brighter yellow appearance, blend in a small quantity of yellow gel food coloring if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-26"}, {"@type": "HowToStep", "text": "Keep the frosting slightly chilled for the best spreading and piping consistency. If preparing it in advance, refrigerate it and remix briefly before decorating the cake.", "name": "Keep the frosting slightly chilled for the best spreading and piping consistency. If preparing it in advance, refrigerate it and remix briefly before decorating the cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-27"}, {"@type": "HowToStep", "text": "Set one completely cooled lemon cake layer on a serving plate or cake pedestal.", "name": "Set one completely cooled lemon cake layer on a serving plate or cake pedestal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-28"}, {"@type": "HowToStep", "text": "Apply a thin coating of lemon cream cheese frosting across the top of the cake layer.", "name": "Apply a thin coating of lemon cream cheese frosting across the top of the cake layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-29"}, {"@type": "HowToStep", "text": "Carefully run a thin knife around the perimeter of the chilled cheesecake to release it from the springform pan. Warming the knife with hot water can make this process easier and help reduce sticking.", "name": "Carefully run a thin knife around the perimeter of the chilled cheesecake to release it from the springform pan. Warming the knife with hot water can make this process easier and help reduce sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-30"}, {"@type": "HowToStep", "text": "Release and remove the springform pan sides. Carefully invert the chilled cheesecake onto the frosted lemon cake layer.", "name": "Release and remove the springform pan sides. Carefully invert the chilled cheesecake onto the frosted lemon cake layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-31"}, {"@type": "HowToStep", "text": "Remove the base of the springform pan and gently peel away the parchment paper.", "name": "Remove the base of the springform pan and gently peel away the parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-32"}, {"@type": "HowToStep", "text": "If the cheesecake extends beyond the edges of the lemon cake, carefully trim the excess with a warmed knife so the layers are even.", "name": "If the cheesecake extends beyond the edges of the lemon cake, carefully trim the excess with a warmed knife so the layers are even.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-33"}, {"@type": "HowToStep", "text": "Spread another thin coating of lemon cream cheese frosting over the cheesecake layer.", "name": "Spread another thin coating of lemon cream cheese frosting over the cheesecake layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-34"}, {"@type": "HowToStep", "text": "Position the second lemon cake layer over the cheesecake.", "name": "Position the second lemon cake layer over the cheesecake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-35"}, {"@type": "HowToStep", "text": "Cover the top and sides of the assembled cake with the remaining lemon cream cheese frosting. If either the cake or frosting becomes too soft while decorating, chill it as needed before continuing.", "name": "Cover the top and sides of the assembled cake with the remaining lemon cream cheese frosting. If either the cake or frosting becomes too soft while decorating, chill it as needed before continuing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-36"}, {"@type": "HowToStep", "text": "Finish the cake using the small offset spatula. If decorative piping is desired, transfer frosting to a disposable piping bag fitted with a 2D piping tip and add the final decorations.", "name": "Finish the cake using the small offset spatula. If decorative piping is desired, transfer frosting to a disposable piping bag fitted with a 2D piping tip and add the final decorations.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-cheesecake-cake/#wprm-recipe-41525-step-0-37"}], "recipeCategory": ["cake", "Dessert"], "keywords": "Lemon Cheesecake Cake"}</script>
