    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Garlic Herb Roasted Turkey Breast", "author": {"@type": "Person", "name": "BenDes"}, "description": "A bone-in turkey breast coated beneath and over the skin with a savory blend of butter, garlic, and fresh herbs, then roasted at two temperatures to create a beautifully browned exterior and tender, juicy meat.", "datePublished": "2023-06-09T15:56:46+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/garlic-herb-roasted-turkey-breast.png", "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/garlic-herb-roasted-turkey-breast.png", "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/garlic-herb-roasted-turkey-breast.png", "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/garlic-herb-roasted-turkey-breast.png"], "totalTime": "PT90M", "recipeIngredient": ["One 6-pound bone-in turkey breast (preferably a half breast for easier roasting)", "Nonstick cooking spray (such as original Pam)", "Fresh rosemary sprigs (optional, for finishing and garnish)", "2 tablespoons finely minced fresh parsley", "5 tablespoons unsalted or regular butter (brought to room temperature until soft)", "1 tablespoon finely minced fresh thyme leaves", "1 teaspoon finely chopped fresh garlic", "1/2 teaspoon freshly ground black pepper", "1 tablespoon chopped fresh sage", "1 teaspoon salt", "1 1/2 teaspoons finely minced fresh rosemary"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 450°F (232°C). Thoroughly mist a baking dish with cooking spray to help prevent the turkey from adhering during roasting.", "name": "Preheat the oven to 450°F (232°C). Thoroughly mist a baking dish with cooking spray to help prevent the turkey from adhering during roasting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/#wprm-recipe-46368-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened butter in a bowl with the garlic, sage, rosemary, thyme, parsley, salt, and black pepper. Mix until the herbs and seasonings are evenly dispersed throughout the butter.", "name": "Place the softened butter in a bowl with the garlic, sage, rosemary, thyme, parsley, salt, and black pepper. Mix until the herbs and seasonings are evenly dispersed throughout the butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/#wprm-recipe-46368-step-0-1"}, {"@type": "HowToStep", "text": "Carefully separate the skin from the turkey breast meat while keeping the skin attached. Spread approximately half of the herb butter directly over the meat beneath the loosened skin.", "name": "Carefully separate the skin from the turkey breast meat while keeping the skin attached. Spread approximately half of the herb butter directly over the meat beneath the loosened skin.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/#wprm-recipe-46368-step-0-2"}, {"@type": "HowToStep", "text": "Distribute the remaining herb butter evenly across the outside of the turkey skin.", "name": "Distribute the remaining herb butter evenly across the outside of the turkey skin.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/#wprm-recipe-46368-step-0-3"}, {"@type": "HowToStep", "text": "Set the seasoned turkey breast into the prepared baking dish. Roast at 450°F (232°C) for 15–20 minutes, stopping when the skin begins to develop a golden-brown color.", "name": "Set the seasoned turkey breast into the prepared baking dish. Roast at 450°F (232°C) for 15–20 minutes, stopping when the skin begins to develop a golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/#wprm-recipe-46368-step-0-4"}, {"@type": "HowToStep", "text": "Reduce the oven temperature to 350°F (177°C). Continue roasting for approximately 1 hour and 15 minutes, occasionally spooning the accumulated pan juices over the turkey.", "name": "Reduce the oven temperature to 350°F (177°C). Continue roasting for approximately 1 hour and 15 minutes, occasionally spooning the accumulated pan juices over the turkey.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/#wprm-recipe-46368-step-0-5"}, {"@type": "HowToStep", "text": "Begin checking the internal temperature after roughly 1 hour. Insert a meat thermometer into the thickest portion of the breast without resting it against the bone.", "name": "Begin checking the internal temperature after roughly 1 hour. Insert a meat thermometer into the thickest portion of the breast without resting it against the bone.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/#wprm-recipe-46368-step-0-6"}, {"@type": "HowToStep", "text": "Remove the turkey from the oven once the internal temperature reaches at least 160°F (71°C).", "name": "Remove the turkey from the oven once the internal temperature reaches at least 160°F (71°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/#wprm-recipe-46368-step-0-7"}, {"@type": "HowToStep", "text": "Loosely cover the roasted turkey breast with foil and allow it to rest for 5–10 minutes, or until the internal temperature reaches at least 165°F (74°C). Resting allows the juices to redistribute throughout the meat before carving.", "name": "Loosely cover the roasted turkey breast with foil and allow it to rest for 5–10 minutes, or until the internal temperature reaches at least 165°F (74°C). Resting allows the juices to redistribute throughout the meat before carving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/#wprm-recipe-46368-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the rested turkey breast to a serving platter. Add fresh rosemary sprigs as a garnish, if desired, then carve the turkey into slices and serve.", "name": "Transfer the rested turkey breast to a serving platter. Add fresh rosemary sprigs as a garnish, if desired, then carve the turkey into slices and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/garlic-herb-roasted-turkey-breast/#wprm-recipe-46368-step-0-9"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Garlic Herb Roasted Turkey Breast"}</script>
