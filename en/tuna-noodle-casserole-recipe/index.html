    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Tuna Noodle Casserole Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A comforting and velvety tuna noodle casserole enriched with sharp white cheddar and a golden Panko-Parmesan crust. This timeless baked dish brings together tender egg noodles, flaky tuna, and delicate green peas in a creamy Dijon-laced sauce—perfectly finished in the oven for a bubbling, crisp-topped delight.", "datePublished": "2024-08-18T06:20:01+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/Tuna-Noodle-Casserole-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/Tuna-Noodle-Casserole-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/Tuna-Noodle-Casserole-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/Tuna-Noodle-Casserole-Recipe.png"], "recipeYield": ["6"], "prepTime": "PT20M", "cookTime": "PT45M", "totalTime": "PT65M", "recipeIngredient": ["2 tablespoons chopped fresh chives", "2 teaspoons Dijon mustard", "1 tablespoon lemon zest", "1 tablespoon olive oil", "3 cloves garlic (minced)", "⅓ cup freshly grated Parmesan", "10 ounces wide egg noodles (approximately 4 ½ cups)", "3  5-ounce cans tuna in water, drained", "⅓ cup Panko", "3 tablespoons unsalted butter", "3 ½ cups half and half", "2  large shallots (diced)", "1 cup frozen green peas (rinsed)", "2 tablespoons all-purpose flour", "Kosher salt and freshly ground black pepper (to taste)", "8 ounces shredded sharp white cheddar cheese (approximately 2 cups)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a generously salted pot of boiling water, cook the egg noodles following the package instructions; drain thoroughly and set aside.", "name": "In a generously salted pot of boiling water, cook the egg noodles following the package instructions; drain thoroughly and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/#wprm-recipe-13040-step-0-0"}, {"@type": "HowToStep", "text": "Preheat the oven to 400°F.", "name": "Preheat the oven to 400°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/#wprm-recipe-13040-step-0-1"}, {"@type": "HowToStep", "text": "In a Dutch oven over medium heat, melt the butter. Incorporate the garlic and shallots, sautéing with frequent stirring until aromatic and softened, about 2 minutes.", "name": "In a Dutch oven over medium heat, melt the butter. Incorporate the garlic and shallots, sautéing with frequent stirring until aromatic and softened, about 2 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/#wprm-recipe-13040-step-0-2"}, {"@type": "HowToStep", "text": "Whisk in the flour and cook until it develops a light golden hue, approximately 1 minute.", "name": "Whisk in the flour and cook until it develops a light golden hue, approximately 1 minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/#wprm-recipe-13040-step-0-3"}, {"@type": "HowToStep", "text": "Gradually pour in the half and half and add Dijon mustard; stir constantly until the mixture thickens slightly, about 4 to 5 minutes.", "name": "Gradually pour in the half and half and add Dijon mustard; stir constantly until the mixture thickens slightly, about 4 to 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/#wprm-recipe-13040-step-0-4"}, {"@type": "HowToStep", "text": "Remove the pot from heat and blend in the shredded cheddar cheese until the sauce is smooth and fully integrated, roughly 2 minutes.", "name": "Remove the pot from heat and blend in the shredded cheddar cheese until the sauce is smooth and fully integrated, roughly 2 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/#wprm-recipe-13040-step-0-5"}, {"@type": "HowToStep", "text": "Fold in the drained noodles, tuna, and peas, ensuring the ingredients are evenly distributed; adjust seasoning with salt and pepper as needed.", "name": "Fold in the drained noodles, tuna, and peas, ensuring the ingredients are evenly distributed; adjust seasoning with salt and pepper as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/#wprm-recipe-13040-step-0-6"}, {"@type": "HowToStep", "text": "Evenly spread the Panko topping mixture over the casserole.", "name": "Evenly spread the Panko topping mixture over the casserole.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/#wprm-recipe-13040-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the Dutch oven to the preheated oven and bake uncovered until the surface turns golden and the filling is bubbling, 25 to 30 minutes.", "name": "Transfer the Dutch oven to the preheated oven and bake uncovered until the surface turns golden and the filling is bubbling, 25 to 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/#wprm-recipe-13040-step-0-8"}, {"@type": "HowToStep", "text": "Serve immediately, garnished with fresh chives if preferred.", "name": "Serve immediately, garnished with fresh chives if preferred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole-recipe/#wprm-recipe-13040-step-0-9"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Tuna Noodle Casserole Recipe"}</script>
