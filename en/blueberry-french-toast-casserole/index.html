iquid reaches the bread throughout the dish.", "name": "Pour the egg mixture over the layered bread, making sure the liquid reaches the bread throughout the dish.", "url": "https://erecip.github.io/en/blueberry-french-toast-casserole/#wprm-recipe-38445-step-0-6"}, {"@type": "HowToStep", "text": "Scatter the remaining 1 cup of blueberries evenly over the surface.", "name": "Scatter the remaining 1 cup of blueberries evenly over the surface.", "url": "https://erecip.github.io/en/blueberry-french-toast-casserole/#wprm-recipe-38445-step-0-7"}, {"@type": "HowToStep", "text": "Cover the baking dish securely with aluminum foil and refrigerate for at least 8 hours or overnight.", "name": "Cover the baking dish securely with aluminum foil and refrigerate for at least 8 hours or overnight.", "url": "https://erecip.github.io/en/blueberry-french-toast-casserole/#wprm-recipe-38445-step-0-8"}, {"@type": "HowToStep", "text": "Take the casserole out of the refrigerator 30 to 60 minutes before baking.", "name": "Take the casserole out of the refrigerator 30 to 60 minutes before baking.", "url": "https://erecip.github.io/en/blueberry-french-toast-casserole/#wprm-recipe-38445-step-0-9"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F, or 190°C.", "name": "Preheat the oven to 375°F, or 190°C.", "url": "https://erecip.github.io/en/blueberry-french-toast-casserole/#wprm-recipe-38445-step-0-10"}, {"@type": "HowToStep", "text": "Bake the covered casserole for 45 minutes.", "name": "Bake the covered casserole for 45 minutes.", "url": "https://erecip.github.io/en/blueberry-french-toast-casserole/#wprm-recipe-38445-step-0-11"}, {"@type": "HowToStep", "text": "Remove the foil and continue baking for about 30 additional minutes, or until the center is set and the top is lightly browned.", "name": "Remove the foil and continue baking for about 30 additional minutes, or until the center is set and the top is lightly browned.", "url": "https://erecip.github.io/en/blueberry-french-toast-casserole/#wprm-recipe-38445-step-0-12"}, {"@type": "HowToStep", "text": "Allow the casserole to cool slightly after removing it from the oven before serving.", "name": "Allow the casserole to cool slightly after removing it from the oven before serving.", "url": "https://erecip.github.io/en/blueberry-french-toast-casserole/#wprm-recipe-38445-step-0-13"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Blueberry French Toast Casserole"}</script>
