    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Keto Lemon Cheesecake", "author": {"@type": "Person", "name": "BenDes"}, "description": "This keto lemon cheesecake combines a tender lemon-almond shortbread base with a smooth, full-fat cream cheese filling. Fresh lemon juice and zest provide bright citrus flavor, while granulated erythritol keeps the dessert low in carbohydrates. Slow cooling and thorough chilling help create a rich, creamy texture with a neatly set center.", "datePublished": "2022-11-14T23:48:48+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/keto-lemon-cheesecake.png", "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/keto-lemon-cheesecake.png", "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/keto-lemon-cheesecake.png", "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/keto-lemon-cheesecake.png"], "cookTime": "PT80M", "totalTime": "PT140M", "recipeIngredient": ["1  prepared batch lemon-almond shortbread dough", "4  large eggs", "1 tablespoon freshly grated lemon zest", "⅓ cup heavy whipping cream", "1¼ cups granulated erythritol sweetener (such as Swerve)", "1 teaspoon pure vanilla extract", "4  packages full-fat cream cheese (32 ounces total, softened to approximately 70°F)", "1 teaspoon freshly squeezed lemon juice"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-0"}, {"@type": "HowToStep", "text": "Press the lemon-almond shortbread dough firmly and evenly across the base of a 10-inch springform pan. Extend the dough approximately 1 inch up the inner sides of the pan to create a shallow crust edge.", "name": "Press the lemon-almond shortbread dough firmly and evenly across the base of a 10-inch springform pan. Extend the dough approximately 1 inch up the inner sides of the pan to create a shallow crust edge.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-1"}, {"@type": "HowToStep", "text": "Bake the crust for 10 minutes, or until it begins to set. Remove the pan from the oven.", "name": "Bake the crust for 10 minutes, or until it begins to set. Remove the pan from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-2"}, {"@type": "HowToStep", "text": "Lower the oven temperature to 325°F (163°C).", "name": "Lower the oven temperature to 325°F (163°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-3"}, {"@type": "HowToStep", "text": "Place the softened cream cheese, erythritol sweetener, eggs, heavy cream, vanilla extract, lemon juice, and grated lemon zest in a blender.", "name": "Place the softened cream cheese, erythritol sweetener, eggs, heavy cream, vanilla extract, lemon juice, and grated lemon zest in a blender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-4"}, {"@type": "HowToStep", "text": "Blend on high speed for approximately 2 minutes, stopping once to scrape down the sides as needed. Continue blending until the filling is completely smooth and free of lumps.", "name": "Blend on high speed for approximately 2 minutes, stopping once to scrape down the sides as needed. Continue blending until the filling is completely smooth and free of lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-5"}, {"@type": "HowToStep", "text": "Pour the prepared filling over the pre-baked crust. Use a spatula to level the surface.", "name": "Pour the prepared filling over the pre-baked crust. Use a spatula to level the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-6"}, {"@type": "HowToStep", "text": "Gently tap the springform pan to release any visible air bubbles trapped in the filling.", "name": "Gently tap the springform pan to release any visible air bubbles trapped in the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-7"}, {"@type": "HowToStep", "text": "Position the cheesecake in the center of the oven and bake at 325°F (163°C) for 80 minutes. The outer portion should appear set, while the center should retain a slight wobble.", "name": "Position the cheesecake in the center of the oven and bake at 325°F (163°C) for 80 minutes. The outer portion should appear set, while the center should retain a slight wobble.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-8"}, {"@type": "HowToStep", "text": "When the baking time has finished, turn off the oven and leave the cheesecake inside.", "name": "When the baking time has finished, turn off the oven and leave the cheesecake inside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-9"}, {"@type": "HowToStep", "text": "Open the oven door approximately 10 inches and allow the cheesecake to cool in the oven for 1 hour. This gradual decrease in temperature helps reduce the likelihood of surface cracks.", "name": "Open the oven door approximately 10 inches and allow the cheesecake to cool in the oven for 1 hour. This gradual decrease in temperature helps reduce the likelihood of surface cracks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-10"}, {"@type": "HowToStep", "text": "Remove the cheesecake from the oven and allow it to continue cooling at room temperature.", "name": "Remove the cheesecake from the oven and allow it to continue cooling at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-11"}, {"@type": "HowToStep", "text": "Transfer the cooled cheesecake to the refrigerator and chill thoroughly, preferably overnight.", "name": "Transfer the cooled cheesecake to the refrigerator and chill thoroughly, preferably overnight.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-12"}, {"@type": "HowToStep", "text": "Release the cheesecake from the springform pan, cut it into slices, and serve cold.", "name": "Release the cheesecake from the springform pan, cut it into slices, and serve cold.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-lemon-cheesecake/#wprm-recipe-40670-step-0-13"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Keto Lemon Cheesecake"}</script>
