 tin in the preheated oven and bake for 20 to 25 minutes, or until the edges are lightly golden and a toothpick inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-breakfast-cinnamon-sugar-muffins/#wprm-recipe-33645-step-0-5"}, {"@type": "HowToStep", "text": "While the muffins are baking, prepare the topping by combining the sugar and cinnamon in a shallow dish. Pour the melted butter into a separate bowl.", "name": "While the muffins are baking, prepare the topping by combining the sugar and cinnamon in a shallow dish. Pour the melted butter into a separate bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-breakfast-cinnamon-sugar-muffins/#wprm-recipe-33645-step-0-6"}, {"@type": "HowToStep", "text": "Once baked, allow the muffins to cool slightly before handling. While still warm, dip each muffin top—or the entire muffin, for enhanced flavor—into the melted butter, then immediately roll in the cinnamon-sugar mixture to coat thoroughly.", "name": "Once baked, allow the muffins to cool slightly before handling. While still warm, dip each muffin top—or the entire muffin, for enhanced flavor—into the melted butter, then immediately roll in the cinnamon-sugar mixture to coat thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-breakfast-cinnamon-sugar-muffins/#wprm-recipe-33645-step-0-7"}]}</script>
