ed sugar (½ cup)", "300 grams of heavy cream (well chilled (1¼ cups))", "8  x 8-inch metal baking pan", "Medium saucepan", "Large mixing bowl (chilled, if possible)", "Stand mixer or handheld electric mixer", "Whisk attachment", "Parchment paper"], "recipeInstructions": [{"@type": "HowToSection", "name": "Preparing the Cherry Topping", "itemListElement": [{"@type": "HowToStep", "text": "In a medium-sized saucepan, combine the pitted cherries, granulated sugar, and Kirsch (if using). Heat over medium-high, stirring regularly, until the mixture begins to gently bubble—this may take slightly longer if using frozen fruit.", "name": "In a medium-sized saucepan, combine the pitted cherries, granulated sugar, and Kirsch (if using). Heat over medium-high, stirring regularly, until the mixture begins to gently bubble—this may take slightly longer if using frozen fruit.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-0-0"}, {"@type": "HowToStep", "text": "Once it reaches a light simmer, lower the heat to medium-low. In a separate bowl, blend water and cornstarch until smooth, then add this slurry to the cherry mixture. Stir frequently as it cooks for an additional 3 minutes, mashing the cherries slightly to release their juices and soften their texture.", "name": "Once it reaches a light simmer, lower the heat to medium-low. In a separate bowl, blend water and cornstarch until smooth, then add this slurry to the cherry mixture. Stir frequently as it cooks for an additional 3 minutes, mashing the cherries slightly to release their juices and soften their texture.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-0-1"}, {"@type": "HowToStep", "text": "When the sauce has thickened enough to leave a clean path when a spoon is swiped through it, remove from heat. Transfer to a separate container and place in the refrigerator to cool completely. The mixture can be prepared up to one week in advance and kept in la, gently incorporate the dry ingredients into the wet until just blended. Fold in the chocolate chips if desired.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-1-3"}, {"@type": "HowToStep", "text": "Transfer the brownie batter to the lined pan and spread into an even layer. Bake for 35–40 minutes, or until a skewer inserted near the center comes out mostly clean with a few moist crumbs. Allow the brownies to cool in the pan completely. For faster cooling, chill in the freezer for 30 minutes after they’ve reached room temperature.", "name": "Transfer the brownie batter to the lined pan and spread into an even layer. Bake for 35–40 minutes, or until a skewer inserted near the center comes out mostly clean with a few moist crumbs. Allow the brownies to cool in the pan completely. For faster cooling, chill in the freezer for 30 minutes after they’ve reached room temperature.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-1-4"}]}, {"@type": "HowToSection", "name": "Making the Stabilized Whipped Cream", "itemListElement": [{"@type": "HowToStep", "text": "While the brownies cool, prepare the whipped topping. Using a chilled bowl and whisk attachment, beat the cold cream cheese on medium-low speed until smooth.", "name": "While the brownies cool, prepare the whipped topping. Using a chilled bowl and whisk attachment, beat the cold cream cheese on medium-low speed until smooth.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-2-0"}, {"@type": "HowToStep", "text": "Add powdered sugar and begin mixing on low, gradually increasing to medium-high once fully incorporated. Scrape down the sides of the bowl as necessary.", "name": "Add powdered sugar and begin mixing on low, gradually increasing to medium-high once fully incorporated. Scrape down the sides of the bowl as necessary.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-2-1"}, {"@type": "HowToStep", "text": "Pour in the vanilla, then slowly stream in the cold heavy cream while mixing on medium-high speed. Add the cream in increments, directing it along the side of the bowl to minimize splatter.", "name": "Pour in the vanilla, then slowly stream in the cold heavy cream while mixing on medium-high speed. Add the cream in increments, directing it along the side of the bowl to minimize splatter.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-2-2"}, {"@type": "HowToStep", "text": "Continue to whip the mixture until it holds firm peaks—check this by dipping in the whisk and flipping it upright; the cream should maintain its structure. If needed, continue whipping in short 30-second bursts.", "name": "Continue to whip the mixture until it holds firm peaks—check this by dipping in the whisk and flipping it upright; the cream should maintain its structure. If needed, continue whipping in short 30-second bursts.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-2-3"}]}, {"@type": "HowToSection", "name": "Assembling the Black Forest Brownies", "itemListElement": [{"@type": "HowToStep", "text": "Once fully cooled, lift the brownies from the pan using the parchment sling.", "name": "Once fully cooled, lift the brownies from the pan using the parchment sling.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-3-0"}, {"@type": "HowToStep", "text": "Spread the stabilized whipped cream across the surface of the brownies in a smooth, even layer.", "name": "Spread the stabilized whipped cream across the surface of the brownies in a smooth, even layer.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-3-1"}, {"@type": "HowToStep", "text": "Dollop the cherry compote over the whipped cream and gently swirl with a spoon or spatula to create a marbled pattern. Garnish with whole cherries and shavings of dark chocolate, if desired.", "name": "Dollop the cherry compote over the whipped cream and gently swirl with a spoon or spatula to create a marbled pattern. Garnish with whole cherries and shavings of dark chocolate, if desired.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-3-2"}, {"@type": "HowToStep", "text": "Slice into 16 equal portions using a warm, sharp knife, cleaning the blade between each cut for best results.", "name": "Slice into 16 equal portions using a warm, sharp knife, cleaning the blade between each cut for best results.", "url": "https://schnellrezept.com/en/black-forest-brownies/#wprm-recipe-32722-step-3-3"}]}], "recipeCategory": ["Brownies &amp; Bars"], "recipeCuisine": ["American"], "keywords": "Black Forest Brownies"}</script>
