    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Braised beef short ribs Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender and flavorful beef short ribs, simmered in a savory, rich sauce and served atop creamy mashed potatoes. This comforting dish is made using just one pot for an easy yet impressive meal.", "datePublished": "2024-03-02T15:04:02+00:00", "image": ["https://erecip.github.io/wp-content/uploads/2024/11/BEEF-Short-Ribs-1.jpg", "https://erecip.github.io/wp-content/uploads/2024/11/BEEF-Short-Ribs-1-500x500.jpg", "https://erecip.github.io/wp-content/uploads/2024/11/BEEF-Short-Ribs-1-500x375.jpg", "https://erecip.github.io/wp-content/uploads/2024/11/BEEF-Short-Ribs-1-480x270.jpg"], "recipeYield": ["4"], "prepTime": "PT20M", "cookTime": "PT160M", "totalTime": "PT180M", "recipeIngredient": ["8  whole beef short ribs", "3 tablespoons olive oil (divided)", "1  yellow onion (diced)", "2 tablespoons tomato paste", "Salt and freshly ground black pepper (to taste)", "2  sprigs fresh rosemary", "1 cup dry red wine (e.g., Cote du Rhone, Pinot Noir)", "2 ½ cups low-sodium beef broth", "1/4 cup all-purpose flour", "3  carrots (chopped)", "2  sprigs fresh thyme"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://erecip.github.io/en/braised-beef-short-ribs/#wprm-recipe-2197-step-0-0"}, {"@type": "HowToStep", "text": "In a large Dutch oven, heat 1 tablespoon of olive oil over medium-high heat. Sauté the diced onion and chopped carrots for a few minutes, stirring frequently. Remove the vegetables from the pot and set them aside on a plate.", "name": "In a large Dutch oven, heat 1 tablespoon of olive oil over medium-high heat. Sauté the diced onion and chopped carrots for a few minutes, stirring frequently. Remove the vegetables from the pot and set them aside on a plate.", "url": "https://erecip.github.io/en/braised-beef-short-ribs/#wprm-recipe-2197-step-0-1"}, {"@type": "HowToStep", "text": "Season the short ribs generously with salt and pepper, then coat them evenly with flour. Add the remaining 2 tablespoons of oil to the pot and increase the heat to high. Sear the ribs on all sides, about 45 seconds per side, until browned. Remove the ribs and set aside.", "name": "Season the short ribs generously with salt and pepper, then coat them evenly with flour. Add the remaining 2 tablespoons of oil to the pot and increase the heat to high. Sear the ribs on all sides, about 45 seconds per side, until browned. Remove the ribs and set aside.", "url": "https://erecip.github.io/en/braised-beef-short-ribs/#wprm-recipe-2197-step-0-2"}, {"@type": "HowToStep", "text": "Pour the red wine into the pot to deglaze, using a wooden spoon to scrape up the browned bits at the bottom. Bring to a boil and cook for 2 minutes.", "name": "Pour the red wine into the pot to deglaze, using a wooden spoon to scrape up the browned bits at the bottom. Bring to a boil and cook for 2 minutes.", "url": "https://erecip.github.io/en/braised-beef-short-ribs/#wprm-recipe-2197-step-0-3"}, {"@type": "HowToStep", "text": "Stir in the beef broth and tomato paste, tasting and adjusting the seasoning if needed.", "name": "Stir in the beef broth and tomato paste, tasting and adjusting the seasoning if needed.", "url": "https://erecip.github.io/en/braised-beef-short-ribs/#wprm-recipe-2197-step-0-4"}, {"@type": "HowToStep", "text": "Return the seared ribs, sautéed vegetables, and sprigs of thyme and rosemary to the pot. Cover with a lid.", "name": "Return the seared ribs, sautéed vegetables, and sprigs of thyme and rosemary to the pot. Cover with a lid.", "url": "https://erecip.github.io/en/braised-beef-short-ribs/#wprm-recipe-2197-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the pot to the oven and cook for 2 hours at 350°F. After 2 hours, reduce the temperature to 325°F (160°C) and continue cooking for an additional 30-45 minutes, until the ribs are tender and nearly falling off the bone.", "name": "Transfer the pot to the oven and cook for 2 hours at 350°F. After 2 hours, reduce the temperature to 325°F (160°C) and continue cooking for an additional 30-45 minutes, until the ribs are tender and nearly falling off the bone.", "url": "https://erecip.github.io/en/braised-beef-short-ribs/#wprm-recipe-2197-step-0-6"}, {"@type": "HowToStep", "text": "Remove the pot from the oven and let it rest, covered, for 20 minutes. Skim any excess fat from the surface before serving.", "name": "Remove the pot from the oven and let it rest, covered, for 20 minutes. Skim any excess fat from the surface before serving.", "url": "https://erecip.github.io/en/braised-beef-short-ribs/#wprm-recipe-2197-step-0-7"}, {"@type": "HowToStep", "text": "Serve the ribs over mashed potatoes, spooning the rich gravy from the pot over the top.", "name": "Serve the ribs over mashed potatoes, spooning the rich gravy from the pot over the top.", "url": "https://erecip.github.io/en/braised-beef-short-ribs/#wprm-recipe-2197-step-0-8"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Braised Short Ribs Recipe"}</script>
