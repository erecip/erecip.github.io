ue mixing until the spices and leavening are evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/libbys-pumpkin-bread/#wprm-recipe-39748-step-0-1"}, {"@type": "HowToStep", "text": "Pour the vegetable oil and water into the dry mixture, then add the eggs. Stir only until the flour is moistened and the ingredients have come together. Avoid excessive mixing, which may produce a heavier loaf.", "name": "Pour the vegetable oil and water into the dry mixture, then add the eggs. Stir only until the flour is moistened and the ingredients have come together. Avoid excessive mixing, which may produce a heavier loaf.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/libbys-pumpkin-bread/#wprm-recipe-39748-step-0-2"}, {"@type": "HowToStep", "text": "Add the pumpkin purée and gently fold it into the batter with a spatula or wooden spoon. Stop mixing once the batter has an even orange color and no visible streaks of dry flour remain.", "name": "Add the pumpkin purée and gently fold it into the batter with a spatula or wooden spoon. Stop mixing once the batter has an even orange color and no visible streaks of dry flour remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/libbys-pumpkin-bread/#wprm-recipe-39748-step-0-3"}, {"@type": "HowToStep", "text": "Distribute the batter evenly among the four prepared mini loaf pans, or transfer the entire mixture to the prepared large loaf pan.", "name": "Distribute the batter evenly among the four prepared mini loaf pans, or transfer the entire mixture to the prepared large loaf pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/libbys-pumpkin-bread/#wprm-recipe-39748-step-0-4"}, {"@type": "HowToStep", "text": "Bake the mini loaves for approximately 30 minutes. For one large loaf, bake for about 55 minutes. The bread is ready when a toothpick inserted into the center comes out clean.", "name": "Bake the mini loaves for approximately 30 minutes. For one large loaf, bake for about 55 minutes. The bread is ready when a toothpick inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/libbys-pumpkin-bread/#wprm-recipe-39748-step-0-5"}, {"@type": "HowToStep", "text": "Remove the baked bread from the oven and allow it to rest in the pan for approximately 10 minutes. Carefully turn the loaf or loaves onto a wire rack and leave them to finish cooling before slicing.", "name": "Remove the baked bread from the oven and allow it to rest in the pan for approximately 10 minutes. Carefully turn the loaf or loaves onto a wire rack and leave them to finish cooling before slicing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/libbys-pumpkin-bread/#wprm-recipe-39748-step-0-6"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Libby’s Pumpkin Bread"}</script>
