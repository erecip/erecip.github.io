 the interior of a 6-quart slow cooker with nonstick cooking spray or lightly grease it with butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-cinnamon-roll-casserole/#wprm-recipe-44146-step-0-1"}, {"@type": "HowToStep", "text": "Cut the cinnamon rolls. Slice each cinnamon roll into four equal pieces, then distribute the pieces evenly across the bottom of the prepared slow cooker.", "name": "Cut the cinnamon rolls. Slice each cinnamon roll into four equal pieces, then distribute the pieces evenly across the bottom of the prepared slow cooker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-cinnamon-roll-casserole/#wprm-recipe-44146-step-0-2"}, {"@type": "HowToStep", "text": "Whisk the eggs. Crack the four eggs into a mixing bowl and whisk thoroughly until evenly blended.", "name": "Whisk the eggs. Crack the four eggs into a mixing bowl and whisk thoroughly until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-cinnamon-roll-casserole/#wprm-recipe-44146-step-0-3"}, {"@type": "HowToStep", "text": "Prepare the custard mixture. Add the milk, ground cinnamon, vanilla, and maple syrup to the beaten eggs. Whisk until the ingredients are completely incorporated.", "name": "Prepare the custard mixture. Add the milk, ground cinnamon, vanilla, and maple syrup to the beaten eggs. Whisk until the ingredients are completely incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-cinnamon-roll-casserole/#wprm-recipe-44146-step-0-4"}, {"@type": "HowToStep", "text": "Combine the casserole. Pour the egg mixture evenly over the cinnamon roll pieces, taking care to coat the pieces throughout.", "name": "Combine the casserole. Pour the egg mixture evenly over the cinnamon roll pieces, taking care to coat the pieces throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-cinnamon-roll-casserole/#wprm-recipe-44146-step-0-5"}, {"@type": "HowToStep", "text": "Add the first icing packet. Drizzle the contents of one reserved icing packet evenly across the top of the casserole mixture.", "name": "Add the first icing packet. Drizzle the contents of one reserved icing packet evenly across the top of the casserole mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-cinnamon-roll-casserole/#wprm-recipe-44146-step-0-6"}, {"@type": "HowToStep", "text": "Slow-cook the casserole. Cover the slow cooker and cook on the LOW setting for 2 to 2½ hours. Check the casserole periodically toward the end of cooking to ensure the edges do not become overly browned while the center cooks completely without remaining soggy.", "name": "Slow-cook the casserole. Cover the slow cooker and cook on the LOW setting for 2 to 2½ hours. Check the casserole periodically toward the end of cooking to ensure the edges do not become overly browned while the center cooks completely without remaining soggy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-cinnamon-roll-casserole/#wprm-recipe-44146-step-0-7"}, {"@type": "HowToStep", "text": "Finish with icing. Once the casserole is fully cooked, remove the lid and drizzle the second reserved icing packet over the surface before serving.", "name": "Finish with icing. Once the casserole is fully cooked, remove the lid and drizzle the second reserved icing packet over the surface before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crockpot-cinnamon-roll-casserole/#wprm-recipe-44146-step-0-8"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Crockpot Cinnamon Roll Casserole"}</script>
