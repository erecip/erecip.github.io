}, {"@type": "HowToStep", "text": "Place the wrapped hot dogs on an ungreased baking sheet, leaving a little space between each one. Mist the tops lightly with nonstick cooking spray.", "name": "Place the wrapped hot dogs on an ungreased baking sheet, leaving a little space between each one. Mist the tops lightly with nonstick cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crescent-mummy-dogs/#wprm-recipe-40950-step-0-7"}, {"@type": "HowToStep", "text": "Bake for 15–17 minutes, or until the crescent dough has puffed and developed an even golden-brown color.", "name": "Bake for 15–17 minutes, or until the crescent dough has puffed and developed an even golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crescent-mummy-dogs/#wprm-recipe-40950-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the baked mummy dogs immediately to a wire cooling rack. Allow them to cool slightly before placing the optional candy eyeballs onto the uncovered sections.", "name": "Transfer the baked mummy dogs immediately to a wire cooling rack. Allow them to cool slightly before placing the optional candy eyeballs onto the uncovered sections.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crescent-mummy-dogs/#wprm-recipe-40950-step-0-9"}, {"@type": "HowToStep", "text": "Serve the crescent mummy dogs warm with a preferred dipping sauce.", "name": "Serve the crescent mummy dogs warm with a preferred dipping sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crescent-mummy-dogs/#wprm-recipe-40950-step-0-10"}], "recipeCategory": ["Appetizer", "Snack"], "recipeCuisine": ["American"], "keywords": "Crescent Mummy Dogs"}</script>
