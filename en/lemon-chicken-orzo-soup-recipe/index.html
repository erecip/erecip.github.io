    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Chicken Orzo Soup Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Warm and comforting, this lemon chicken orzo soup brims with bright citrus, tender chicken, and wholesome vegetables, creating a hearty yet refreshing meal ready in just half an hour.", "datePublished": "2024-10-20T04:12:34+00:00", "image": ["https://erecip.github.io/en/lemon-chicken-orzo-soup-recipe/Lemon-Chicken-Orzo-Soup-Recipe.png", "https://erecip.github.io/en/lemon-chicken-orzo-soup-recipe/Lemon-Chicken-Orzo-Soup-Recipe.png", "https://erecip.github.io/en/lemon-chicken-orzo-soup-recipe/Lemon-Chicken-Orzo-Soup-Recipe.png", "https://erecip.github.io/en/lemon-chicken-orzo-soup-recipe/Lemon-Chicken-Orzo-Soup-Recipe.png"], "recipeYield": ["6"], "prepTime": "PT5M", "cookTime": "PT25M", "totalTime": "PT30M", "recipeIngredient": ["½ teaspoon turmeric", "2 cups water", "2 teaspoons dried oregano", "2  lemons (zested and juiced)", "4 cups chicken stock", "1  yellow onion (chopped)", "¾ cup uncooked orzo pasta", "1 cup frozen peas", "Kosher salt and black pepper", "½ cup chopped fresh parsley", "2  celery sticks (chopped)", "2  green onions (trimmed and chopped (whites and green parts))", "Extra virgin olive oil", "½ teaspoon red pepper flakes (or 1 teaspoon Aleppo pepper)", "3  garlic cloves (minced)", "1 pound boneless skinless chicken breast (2 halves)", "2  carrots (peeled and sliced into ¼-inch rounds)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a large Dutch oven or sturdy pot, warm about 2 tablespoons of extra virgin olive oil until it shimmers. Incorporate the chopped onion, celery, carrots, and minced garlic, seasoning generously with kosher salt and freshly ground black pepper. Sauté, stirring from time to time, until the vegetables are tender, about 5 minutes. Pour in the chicken stock and water, then nestle in the chicken breasts. Season again with salt and pepper, sprinkle in the dried oregano, turmeric, and red pepper flakes or Aleppo pepper. Bring everything to a rolling boil, then reduce the heat to medium-low and allow to cook for 10–15 minutes until the chicken is nearly cooked through, skimming any foam that surfaces. Remove the chicken breasts to a plate and add the orzo pasta and frozen peas to the pot, increasing the heat to return the broth to a boil. Meanwhile, shred the chicken using two forks, then stir it back into the pot and continue cooking until the orzo reaches an al dente texture, about 8 minutes more. Remove the pot from the heat and finish the soup by stirring in the fresh lemon juice and zest, chopped green onions, and parsley. Serve immediately.", "name": "In a large Dutch oven or sturdy pot, warm about 2 tablespoons of extra virgin olive oil until it shimmers. Incorporate the chopped onion, celery, carrots, and minced garlic, seasoning generously with kosher salt and freshly ground black pepper. Sauté, stirring from time to time, until the vegetables are tender, about 5 minutes. Pour in the chicken stock and water, then nestle in the chicken breasts. Season again with salt and pepper, sprinkle in the dried oregano, turmeric, and red pepper flakes or Aleppo pepper. Bring everything to a rolling boil, then reduce the heat to medium-low and allow to cook for 10–15 minutes until the chicken is nearly cooked through, skimming any foam that surfaces. Remove the chicken breasts to a plate and add the orzo pasta and frozen peas to the pot, increasing the heat to return the broth to a boil. Meanwhile, shred the chicken using two forks, then stir it back into the pot and continue cooking until the orzo reaches an al dente texture, about 8 minutes more. Remove the pot from the heat and finish the soup by stirring in the fresh lemon juice and zest, chopped green onions, and parsley. Serve immediately."}], "recipeCategory": ["Soup"], "recipeCuisine": ["Mediterranean"], "keywords": "Lemon Chicken Orzo Soup Recipe"}</script>
