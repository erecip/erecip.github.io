    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken Caesar Pasta Salad", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy pasta salad combining tender chicken, crisp romaine lettuce, al dente pasta, and a rich homemade Caesar dressing. Parmesan adds savory depth, while optional croutons provide a crisp finishing touch.", "datePublished": "2018-11-07T16:23:46+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/chicken-caesar-pasta-salad2.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/chicken-caesar-pasta-salad2.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/chicken-caesar-pasta-salad2.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/chicken-caesar-pasta-salad2.png"], "cookTime": "PT10M", "totalTime": "PT10M", "recipeIngredient": ["1/3 cup Parmesan cheese (finely and freshly grated)", "2 tablespoons freshly squeezed lemon juice", "3/4 cup creamy mayonnaise (preferably Hellmann’s)", "1 teaspoon anchovy paste", "2 teaspoons freshly minced garlic", "2 teaspoons Dijon mustard", "2 teaspoons Worcestershire sauce", "Black pepper (according to taste)", "1 pound rotisserie chicken (shredded or cut into approximately 1-inch pieces)", "2  hearts of romaine lettuce (chopped into bite-size portions)", "8 ounces rotini or penne pasta (cooked to an al dente texture)", "Additional Parmesan cheese (for sprinkling over the finished salad)", "Croutons (optional, for added crispness)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a medium mixing bowl, whisk the Dijon mustard with the lemon juice, Worcestershire sauce, anchovy paste, and minced garlic until the ingredients are thoroughly blended. The anchovy paste should disperse completely throughout the mixture, providing the characteristic savory flavor associated with Caesar dressing.", "name": "In a medium mixing bowl, whisk the Dijon mustard with the lemon juice, Worcestershire sauce, anchovy paste, and minced garlic until the ingredients are thoroughly blended. The anchovy paste should disperse completely throughout the mixture, providing the characteristic savory flavor associated with Caesar dressing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-0"}, {"@type": "HowToStep", "text": "Add the mayonnaise and stir until the dressing develops a smooth, creamy consistency. Fold in the finely grated Parmesan, then season with black pepper according to taste. Set the dressing aside while preparing the remaining ingredients so the flavors can combine.", "name": "Add the mayonnaise and stir until the dressing develops a smooth, creamy consistency. Fold in the finely grated Parmesan, then season with black pepper according to taste. Set the dressing aside while preparing the remaining ingredients so the flavors can combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-1"}, {"@type": "HowToStep", "text": "Bring a large saucepan or pot of salted water to a rolling boil. Add the rotini or penne and cook according to the package instructions until al dente, which will generally take about 10 minutes. The pasta should be tender while retaining a slight firmness when bitten.", "name": "Bring a large saucepan or pot of salted water to a rolling boil. Add the rotini or penne and cook according to the package instructions until al dente, which will generally take about 10 minutes. The pasta should be tender while retaining a slight firmness when bitten.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-2"}, {"@type": "HowToStep", "text": "Drain the cooked pasta through a colander and give it a brief rinse under cool water to halt further cooking and wash away excess surface starch.", "name": "Drain the cooked pasta through a colander and give it a brief rinse under cool water to halt further cooking and wash away excess surface starch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the pasta in a thin layer on a plate or sheet pan and allow it to cool for several minutes. Cooling it before assembly helps prevent the warm pasta from wilting the romaine.", "name": "Arrange the pasta in a thin layer on a plate or sheet pan and allow it to cool for several minutes. Cooling it before assembly helps prevent the warm pasta from wilting the romaine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-4"}, {"@type": "HowToStep", "text": "While the pasta is cooling, shred the rotisserie chicken or cut it into pieces measuring roughly 1 inch. Remove the chicken skin if preferred.", "name": "While the pasta is cooling, shred the rotisserie chicken or cut it into pieces measuring roughly 1 inch. Remove the chicken skin if preferred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-5"}, {"@type": "HowToStep", "text": "Trim and chop the romaine hearts into manageable bite-size pieces, discarding any tough outer leaves. Rinse the lettuce thoroughly if necessary and have both the chicken and romaine ready for assembly.", "name": "Trim and chop the romaine hearts into manageable bite-size pieces, discarding any tough outer leaves. Rinse the lettuce thoroughly if necessary and have both the chicken and romaine ready for assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-6"}, {"@type": "HowToStep", "text": "Place the cooled pasta, prepared chicken, and chopped romaine in a large mixing bowl.", "name": "Place the cooled pasta, prepared chicken, and chopped romaine in a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-7"}, {"@type": "HowToStep", "text": "Pour the prepared Caesar dressing over the ingredients and toss thoroughly until the pasta, chicken, and lettuce are evenly covered. Scrape along the bottom and sides of the bowl as needed to distribute all of the creamy dressing throughout the salad.", "name": "Pour the prepared Caesar dressing over the ingredients and toss thoroughly until the pasta, chicken, and lettuce are evenly covered. Scrape along the bottom and sides of the bowl as needed to distribute all of the creamy dressing throughout the salad.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the finished chicken Caesar pasta salad to a serving bowl or divide it among individual plates.", "name": "Transfer the finished chicken Caesar pasta salad to a serving bowl or divide it among individual plates.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-9"}, {"@type": "HowToStep", "text": "Add croutons if desired for extra crunch, then finish with an additional sprinkling of Parmesan cheese. Serve immediately, or refrigerate the salad until it is ready to be served.", "name": "Add croutons if desired for extra crunch, then finish with an additional sprinkling of Parmesan cheese. Serve immediately, or refrigerate the salad until it is ready to be served.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-caesar-pasta-salad/#wprm-recipe-43648-step-0-10"}], "recipeCategory": ["Salad"], "recipeCuisine": ["American"], "keywords": "Chicken Caesar Pasta Salad"}</script>
