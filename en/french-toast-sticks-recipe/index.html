-inch wide sticks. In a medium-sized bowl, whisk together the milk, eggs, vanilla extract, maple syrup, nutmeg, salt, and 1 tablespoon of melted butter.", "name": "Slice each piece of bread into 1-inch wide sticks. In a medium-sized bowl, whisk together the milk, eggs, vanilla extract, maple syrup, nutmeg, salt, and 1 tablespoon of melted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-toast-sticks-recipe/#wprm-recipe-1785-step-0-1"}, {"@type": "HowToStep", "text": "Dip each breadstick into the egg mixture, ensuring it is thoroughly coated. Allow any excess mixture to drip back into the bowl, then place the sticks on the prepared baking sheet. Continue with the remaining breadsticks. Bake for 10 minutes, then flip each stick and bake for an additional 10-15 minutes, or until they are lightly golden.", "name": "Dip each breadstick into the egg mixture, ensuring it is thoroughly coated. Allow any excess mixture to drip back into the bowl, then place the sticks on the prepared baking sheet. Continue with the remaining breadsticks. Bake for 10 minutes, then flip each stick and bake for an additional 10-15 minutes, or until they are lightly golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-toast-sticks-recipe/#wprm-recipe-1785-step-0-2"}, {"@type": "HowToStep", "text": "While the breadsticks are baking, melt the remaining 5 tablespoons of butter in a medium pot over medium heat. Let the butter cook until it begins to brown and gives off a nutty aroma, about 2-3 minutes, then remove from the heat.", "name": "While the breadsticks are baking, melt the remaining 5 tablespoons of butter in a medium pot over medium heat. Let the butter cook until it begins to brown and gives off a nutty aroma, about 2-3 minutes, then remove from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-toast-sticks-recipe/#wprm-recipe-1785-step-0-3"}, {"@type": "HowToStep", "text": "In a small bowl, mix the granulated sugar with the cinnamon.", "name": "In a small bowl, mix the granulated sugar with the cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-toast-sticks-recipe/#wprm-recipe-1785-step-0-4"}, {"@type": "HowToStep", "text": "Once the french toast sticks are baked, brush them with the browned butter, then either sprinkle or toss them in the cinnamon-sugar mixture to coat thoroughly. Serve warm with additional maple syrup if desired.", "name": "Once the french toast sticks are baked, brush them with the browned butter, then either sprinkle or toss them in the cinnamon-sugar mixture to coat thoroughly. Serve warm with additional maple syrup if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-toast-sticks-recipe/#wprm-recipe-1785-step-0-5"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Homemade French Toast Sticks Recipe"}</script>
