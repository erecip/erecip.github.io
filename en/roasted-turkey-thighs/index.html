    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Roasted Turkey Thighs", "author": {"@type": "Person", "name": "BenDes"}, "description": "Herb-buttered turkey thighs are roasted over a fragrant mixture of onion, celery, and thyme until the skin is deeply golden and the meat is tender and juicy. Garlic, sage, rosemary, parsley, and paprika give the butter a savory, aromatic character while the vegetables beneath the turkey enrich the flavorful pan drippings.", "datePublished": "2020-08-21T07:34:39+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/roasted-turkey-thighs.png", "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/roasted-turkey-thighs.png", "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/roasted-turkey-thighs.png", "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/roasted-turkey-thighs.png"], "prepTime": "PT20M", "cookTime": "PT90M", "totalTime": "PT120M", "recipeIngredient": ["4 oz unsalted butter (preferably a high-quality variety such as Kerrygold)", "1 tablespoon fresh parsley (finely chopped)", "2  –3 lb turkey thighs", "1 teaspoon paprika", "5  fresh sage leaves (finely minced)", "Kosher or sea salt (as needed)", "1 tablespoon fresh rosemary leaves (chopped)", "Freshly ground black pepper (to taste)", "2 teaspoons freshly minced garlic", "2  fresh thyme sprigs (finely minced)", "1  medium onion (quartered)", "2  celery stalks (cut into small dice)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Rinse the turkey thighs thoroughly beneath cold running water, then use paper towels to pat them completely dry. Removing excess surface moisture will help the skin become crisper during roasting.", "name": "Rinse the turkey thighs thoroughly beneath cold running water, then use paper towels to pat them completely dry. Removing excess surface moisture will help the skin become crisper during roasting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-0"}, {"@type": "HowToStep", "text": "Season every side of the thighs with salt and black pepper. Where possible, carefully work a small amount of salt beneath the skin so the meat itself receives additional seasoning.", "name": "Season every side of the thighs with salt and black pepper. Where possible, carefully work a small amount of salt beneath the skin so the meat itself receives additional seasoning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-1"}, {"@type": "HowToStep", "text": "Place the softened unsalted butter in a small bowl and add the minced garlic, sage, chopped rosemary, paprika, and parsley.", "name": "Place the softened unsalted butter in a small bowl and add the minced garlic, sage, chopped rosemary, paprika, and parsley.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-2"}, {"@type": "HowToStep", "text": "Blend the ingredients thoroughly until the seasonings are evenly distributed and the butter forms a smooth herb mixture. The seasoned butter may be prepared one or two days in advance and refrigerated until needed.", "name": "Blend the ingredients thoroughly until the seasonings are evenly distributed and the butter forms a smooth herb mixture. The seasoned butter may be prepared one or two days in advance and refrigerated until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-3"}, {"@type": "HowToStep", "text": "Gently slide your fingers between the skin and meat of each turkey thigh to loosen the skin without tearing it.", "name": "Gently slide your fingers between the skin and meat of each turkey thigh to loosen the skin without tearing it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-4"}, {"@type": "HowToStep", "text": "Spread the herb butter generously over the exterior of each thigh, then work some of the mixture beneath the loosened skin to season the meat more thoroughly.", "name": "Spread the herb butter generously over the exterior of each thigh, then work some of the mixture beneath the loosened skin to season the meat more thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the prepared thighs to the refrigerator until roasting time. They may be marinated for several hours or kept refrigerated for as long as 24 hours.", "name": "Transfer the prepared thighs to the refrigerator until roasting time. They may be marinated for several hours or kept refrigerated for as long as 24 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-6"}, {"@type": "HowToStep", "text": "Preheat the oven to 400°F (205°C).", "name": "Preheat the oven to 400°F (205°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-7"}, {"@type": "HowToStep", "text": "Place the quartered onion, diced celery, and minced fresh thyme in the bottom of a 3-quart baking dish, distributing the aromatics to form a bed for the turkey.", "name": "Place the quartered onion, diced celery, and minced fresh thyme in the bottom of a 3-quart baking dish, distributing the aromatics to form a bed for the turkey.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-8"}, {"@type": "HowToStep", "text": "Roast the Turkey Thighs", "name": "Roast the Turkey Thighs", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-9"}, {"@type": "HowToStep", "text": "Set the marinated turkey thighs skin-side upward over the prepared onion, celery, and thyme.", "name": "Set the marinated turkey thighs skin-side upward over the prepared onion, celery, and thyme.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-10"}, {"@type": "HowToStep", "text": "Lower the oven temperature to 325°F (165°C) and continue roasting for approximately 1 additional hour, depending on the size of the thighs. An instant-read thermometer inserted into the thickest portion should register 165°F (75°C).", "name": "Lower the oven temperature to 325°F (165°C) and continue roasting for approximately 1 additional hour, depending on the size of the thighs. An instant-read thermometer inserted into the thickest portion should register 165°F (75°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-11"}, {"@type": "HowToStep", "text": "Check the turkey after about 45 minutes of the lower-temperature roasting period to make sure it is cooking and browning evenly. If the skin becomes too dark before the meat is fully cooked, loosely cover the thighs with aluminum foil.", "name": "Check the turkey after about 45 minutes of the lower-temperature roasting period to make sure it is cooking and browning evenly. If the skin becomes too dark before the meat is fully cooked, loosely cover the thighs with aluminum foil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-12"}, {"@type": "HowToStep", "text": "Remove the roasted turkey thighs from the oven and allow them to rest for 10–15 minutes before carving. This resting period allows the juices to redistribute throughout the meat.", "name": "Remove the roasted turkey thighs from the oven and allow them to rest for 10–15 minutes before carving. This resting period allows the juices to redistribute throughout the meat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-13"}, {"@type": "HowToStep", "text": "Reserve the flavorful drippings remaining in the baking dish if desired for preparing gravy.", "name": "Reserve the flavorful drippings remaining in the baking dish if desired for preparing gravy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-14"}, {"@type": "HowToStep", "text": "Carve and serve the turkey thighs with accompaniments such as mashed potatoes, roasted vegetables, or other preferred side dishes.", "name": "Carve and serve the turkey thighs with accompaniments such as mashed potatoes, roasted vegetables, or other preferred side dishes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/roasted-turkey-thighs/#wprm-recipe-45867-step-0-15"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Roasted Turkey Thighs"}</script>
