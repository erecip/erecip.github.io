    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Maple Sugar Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These maple sugar cookies combine a soft, chewy brown sugar cookie base with the rich flavor of pure maple syrup and maple extract. Once baked until lightly golden, the cookies are finished with a smooth maple icing that adds an extra layer of sweetness and depth.", "datePublished": "2018-10-05T23:29:49+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/maple-sugar-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/maple-sugar-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/maple-sugar-cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/maple-sugar-cookies2.png"], "prepTime": "PT20M", "cookTime": "PT9M", "totalTime": "PT49M", "recipeIngredient": ["1 cup light brown sugar (firmly packed)", "1 teaspoon baking soda", "1  large egg (brought to room temperature, approximately 70°F)", "1 teaspoon pure vanilla extract", "2 1/3 cups all-purpose flour", "1/3 cup pure maple syrup (preferably Grade A amber or dark for a more pronounced maple flavor)", "1/2 teaspoon kosher salt", "1 teaspoon maple extract", "1/2 cup unsalted butter (softened to approximately 70°F)", "1 tablespoon unsalted butter (melted and allowed to cool to room temperature)", "Pinch of kosher salt", "1/4 teaspoon maple extract", "1/2 cup confectioners’ sugar (sifted until free of lumps)", "3 tablespoons pure maple syrup"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Line two large baking sheets with parchment paper and set them aside for the shaped cookie dough.", "name": "Preheat the oven to 350°F (175°C). Line two large baking sheets with parchment paper and set them aside for the shaped cookie dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-0"}, {"@type": "HowToStep", "text": "Place the 2 1/3 cups all-purpose flour, 1 teaspoon baking soda, and 1/2 teaspoon kosher salt in a medium mixing bowl. Whisk thoroughly until the leavening and salt are evenly distributed throughout the flour.", "name": "Place the 2 1/3 cups all-purpose flour, 1 teaspoon baking soda, and 1/2 teaspoon kosher salt in a medium mixing bowl. Whisk thoroughly until the leavening and salt are evenly distributed throughout the flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-1"}, {"@type": "HowToStep", "text": "Add the softened 1/2 cup unsalted butter and 1 cup packed light brown sugar to the bowl of a stand mixer fitted with the paddle attachment. Beat at medium speed for approximately 1–2 minutes, or until the mixture becomes smooth, pale, and creamy.", "name": "Add the softened 1/2 cup unsalted butter and 1 cup packed light brown sugar to the bowl of a stand mixer fitted with the paddle attachment. Beat at medium speed for approximately 1–2 minutes, or until the mixture becomes smooth, pale, and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-2"}, {"@type": "HowToStep", "text": "Add the large room-temperature egg and continue mixing until it is fully incorporated into the butter and sugar mixture.", "name": "Add the large room-temperature egg and continue mixing until it is fully incorporated into the butter and sugar mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-3"}, {"@type": "HowToStep", "text": "Pour in the 1/3 cup pure maple syrup, 1 teaspoon vanilla extract, and 1 teaspoon maple extract. Beat on high speed until the ingredients are evenly blended, stopping as necessary to scrape down the sides and bottom of the mixing bowl.", "name": "Pour in the 1/3 cup pure maple syrup, 1 teaspoon vanilla extract, and 1 teaspoon maple extract. Beat on high speed until the ingredients are evenly blended, stopping as necessary to scrape down the sides and bottom of the mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-4"}, {"@type": "HowToStep", "text": "Add the previously prepared dry ingredients. Mix on low speed only until the flour has disappeared into the dough and no dry streaks remain. Avoid excessive mixing so the finished cookies retain a tender texture.", "name": "Add the previously prepared dry ingredients. Mix on low speed only until the flour has disappeared into the dough and no dry streaks remain. Avoid excessive mixing so the finished cookies retain a tender texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-5"}, {"@type": "HowToStep", "text": "Using a 2-tablespoon cookie scoop, portion the dough and gently roll each piece into a ball. Arrange the dough balls on the parchment-lined baking sheets, leaving approximately 2 inches of space between each cookie.", "name": "Using a 2-tablespoon cookie scoop, portion the dough and gently roll each piece into a ball. Arrange the dough balls on the parchment-lined baking sheets, leaving approximately 2 inches of space between each cookie.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-6"}, {"@type": "HowToStep", "text": "Bake for 8–9 minutes, until the edges have developed a light golden-brown color while the centers still appear slightly underbaked.", "name": "Bake for 8–9 minutes, until the edges have developed a light golden-brown color while the centers still appear slightly underbaked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-7"}, {"@type": "HowToStep", "text": "Allow the cookies to remain on the hot baking sheets for 5 minutes. Transfer them carefully to a wire cooling rack and leave them until completely cooled.", "name": "Allow the cookies to remain on the hot baking sheets for 5 minutes. Transfer them carefully to a wire cooling rack and leave them until completely cooled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-8"}, {"@type": "HowToStep", "text": "While the cookies cool, place the 1/2 cup sifted confectioners’ sugar, 3 tablespoons pure maple syrup, 1 tablespoon melted and cooled unsalted butter, 1/4 teaspoon maple extract, and a pinch of kosher salt in a medium bowl.", "name": "While the cookies cool, place the 1/2 cup sifted confectioners’ sugar, 3 tablespoons pure maple syrup, 1 tablespoon melted and cooled unsalted butter, 1/4 teaspoon maple extract, and a pinch of kosher salt in a medium bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-9"}, {"@type": "HowToStep", "text": "Stir until the icing is completely smooth and has a thick yet pourable consistency. The maple syrup may be incorporated gradually to help control the final thickness of the icing.", "name": "Stir until the icing is completely smooth and has a thick yet pourable consistency. The maple syrup may be incorporated gradually to help control the final thickness of the icing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-10"}, {"@type": "HowToStep", "text": "Once the cookies have cooled fully, drizzle the maple icing evenly across their tops.", "name": "Once the cookies have cooled fully, drizzle the maple icing evenly across their tops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-11"}, {"@type": "HowToStep", "text": "Allow the icing to set before serving or storing the cookies.", "name": "Allow the icing to set before serving or storing the cookies.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-sugar-cookies/#wprm-recipe-42020-step-0-12"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Maple Sugar Cookies"}</script>
