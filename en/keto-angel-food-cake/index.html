    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Keto Angel Food Cake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A light, delicately flavored low-carbohydrate cake made with whipped egg whites, finely milled almond flour, and sugar-free sweeteners. Careful sifting and gentle folding help preserve its airy structure.", "datePublished": "2019-06-14T20:01:29+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/keto-angel-food-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/keto-angel-food-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/keto-angel-food-cake.png", "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/keto-angel-food-cake.png"], "cookTime": "PT40M", "totalTime": "PT60M", "recipeIngredient": ["10  large egg whites (brought to room temperature)", "1¾ cups finely ground almond flour (approximately 175 grams)", "½ cup sifted powdered Swerve sweetener", "1 teaspoon high-quality almond extract", "¼ teaspoon fine salt", "½ cup egg white protein powder (approximately 40 grams)", "½ teaspoon vanilla extract", "½ cup granular Swerve sweetener", "½ teaspoon cream of tartar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place an oven rack in the second-lowest position, then preheat the oven to 325°F (163°C).", "name": "Place an oven rack in the second-lowest position, then preheat the oven to 325°F (163°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-0"}, {"@type": "HowToStep", "text": "Cut parchment paper to fit the base of a tube pan and line only the bottom. Leave the sides completely ungreased, as the batter must adhere to the pan while rising.", "name": "Cut parchment paper to fit the base of a tube pan and line only the bottom. Leave the sides completely ungreased, as the batter must adhere to the pan while rising.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-1"}, {"@type": "HowToStep", "text": "Whisk the granular Swerve and sifted powdered Swerve together in a medium bowl until evenly blended.", "name": "Whisk the granular Swerve and sifted powdered Swerve together in a medium bowl until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-2"}, {"@type": "HowToStep", "text": "In a separate large bowl, combine the almond flour, egg white protein powder, salt, and one-half of the blended sweeteners.", "name": "In a separate large bowl, combine the almond flour, egg white protein powder, salt, and one-half of the blended sweeteners.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-3"}, {"@type": "HowToStep", "text": "Pass the dry mixture through a fine-mesh sieve into another large bowl. Sift it back and forth between the two bowls three times to create a light, evenly aerated mixture.", "name": "Pass the dry mixture through a fine-mesh sieve into another large bowl. Sift it back and forth between the two bowls three times to create a light, evenly aerated mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-4"}, {"@type": "HowToStep", "text": "When a sieve is unavailable, thoroughly fluff and separate the dry ingredients with a fork for several minutes.", "name": "When a sieve is unavailable, thoroughly fluff and separate the dry ingredients with a fork for several minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-5"}, {"@type": "HowToStep", "text": "Place the room-temperature egg whites and cream of tartar in a large, impeccably clean mixing bowl. Beat until the whites become foamy and frothy.", "name": "Place the room-temperature egg whites and cream of tartar in a large, impeccably clean mixing bowl. Beat until the whites become foamy and frothy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-6"}, {"@type": "HowToStep", "text": "With the mixer running, add the reserved sweetener mixture in a slow, steady stream.", "name": "With the mixer running, add the reserved sweetener mixture in a slow, steady stream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-7"}, {"@type": "HowToStep", "text": "Continue whipping until medium peaks develop. When the beaters are lifted, the peaks should hold their shape while the tips bend slightly.", "name": "Continue whipping until medium peaks develop. When the beaters are lifted, the peaks should hold their shape while the tips bend slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-8"}, {"@type": "HowToStep", "text": "Pour the almond extract and vanilla extract into the whipped egg whites.", "name": "Pour the almond extract and vanilla extract into the whipped egg whites.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-9"}, {"@type": "HowToStep", "text": "Resume beating until stiff peaks form. The peaks should remain upright without folding over when the beaters are raised.", "name": "Resume beating until stiff peaks form. The peaks should remain upright without folding over when the beaters are raised.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-10"}, {"@type": "HowToStep", "text": "Divide the sifted dry mixture into four portions. Add one portion at a time to the whipped egg whites, folding gently after each addition with a large silicone spatula.", "name": "Divide the sifted dry mixture into four portions. Add one portion at a time to the whipped egg whites, folding gently after each addition with a large silicone spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-11"}, {"@type": "HowToStep", "text": "Use slow, deliberate movements to avoid compressing the whipped whites. Sweep the spatula across the bottom of the bowl to incorporate any dry ingredients that may have settled.", "name": "Use slow, deliberate movements to avoid compressing the whipped whites. Sweep the spatula across the bottom of the bowl to incorporate any dry ingredients that may have settled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the batter to the prepared tube pan and distribute it evenly. Smooth the surface and remove any batter clinging above the batter line on the sides of the pan.", "name": "Transfer the batter to the prepared tube pan and distribute it evenly. Smooth the surface and remove any batter clinging above the batter line on the sides of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-13"}, {"@type": "HowToStep", "text": "Tap the pan lightly against the countertop to release large trapped air pockets.", "name": "Tap the pan lightly against the countertop to release large trapped air pockets.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-14"}, {"@type": "HowToStep", "text": "Bake on the second-lowest oven rack for 40–50 minutes. Rotate the pan halfway through baking. The cake is ready when the surface is golden and springs back after gentle pressure.", "name": "Bake on the second-lowest oven rack for 40–50 minutes. Rotate the pan halfway through baking. The cake is ready when the surface is golden and springs back after gentle pressure.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-15"}, {"@type": "HowToStep", "text": "Begin checking the cake at the 40-minute point to prevent excessive baking and preserve its tender texture.", "name": "Begin checking the cake at the 40-minute point to prevent excessive baking and preserve its tender texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-16"}, {"@type": "HowToStep", "text": "Remove the cake from the oven and leave it in the pan for 20 minutes.", "name": "Remove the cake from the oven and leave it in the pan for 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-17"}, {"@type": "HowToStep", "text": "Turn the pan upside down and allow the cake to cool completely while inverted.", "name": "Turn the pan upside down and allow the cake to cool completely while inverted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-18"}, {"@type": "HowToStep", "text": "After the cake is fully cooled, slide a sharp knife carefully around the outer edge and along the center tube to loosen it.", "name": "After the cake is fully cooled, slide a sharp knife carefully around the outer edge and along the center tube to loosen it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-19"}, {"@type": "HowToStep", "text": "For a pan with a removable base, press upward to release the cake. For a fixed-bottom pan, invert it over a serving plate and tap gently until the cake comes free.", "name": "For a pan with a removable base, press upward to release the cake. For a fixed-bottom pan, invert it over a serving plate and tap gently until the cake comes free.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/keto-angel-food-cake/#wprm-recipe-40120-step-0-20"}], "recipeCategory": ["cake", "Dessert"], "recipeCuisine": ["American"], "keywords": "Keto Angel Food Cake"}</script>
