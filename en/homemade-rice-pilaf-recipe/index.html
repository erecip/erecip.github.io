g, take the stock out of the fridge to reach room temperature or warm it up in a pot or microwave-safe measuring cup. This helps reduce the time needed to bring it to a boil.", "name": "While the garlic and onion are cooking, take the stock out of the fridge to reach room temperature or warm it up in a pot or microwave-safe measuring cup. This helps reduce the time needed to bring it to a boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-rice-pilaf-recipe/#wprm-recipe-1564-step-0-1"}, {"@type": "HowToStep", "text": "Stir in the orzo, making sure it is well coated with oil, and toast for approximately 3 minutes, stirring frequently to prevent sticking.", "name": "Stir in the orzo, making sure it is well coated with oil, and toast for approximately 3 minutes, stirring frequently to prevent sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-rice-pilaf-recipe/#wprm-recipe-1564-step-0-2"}, {"@type": "HowToStep", "text": "Pour in the remaining tablespoon of olive oil, followed by the rinsed rice. Stir thoroughly to coat all the grains in oil, then toast for 4-5 minutes until the rice appears slightly translucent.", "name": "Pour in the remaining tablespoon of olive oil, followed by the rinsed rice. Stir thoroughly to coat all the grains in oil, then toast for 4-5 minutes until the rice appears slightly translucent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-rice-pilaf-recipe/#wprm-recipe-1564-step-0-3"}, {"@type": "HowToStep", "text": "Sprinkle the garlic powder, onion powder, coriander, paprika, and salt over the rice mixture. Stir well to distribute the spices evenly.", "name": "Sprinkle the garlic powder, onion powder, coriander, paprika, and salt over the rice mixture. Stir well to distribute the spices evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-rice-pilaf-recipe/#wprm-recipe-1564-step-0-4"}, {"@type": "HowToStep", "text": "Gradually add the warmed or room-temperature stock to the skillet. Increase the heat to bring it to a boil, then lower the heat to medium-low to maintain a gentle simmer. Cover with a lid and cook for 15 minutes (or follow the cooking time on your rice package). Avoid removing the lid during cooking.", "name": "Gradually add the warmed or room-temperature stock to the skillet. Increase the heat to bring it to a boil, then lower the heat to medium-low to maintain a gentle simmer. Cover with a lid and cook for 15 minutes (or follow the cooking time on your rice package). Avoid removing the lid during cooking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-rice-pilaf-recipe/#wprm-recipe-1564-step-0-5"}, {"@type": "HowToStep", "text": "Once the cooking time is complete, remove the skillet from the heat and allow the rice to rest, covered, for 3 minutes.", "name": "Once the cooking time is complete, remove the skillet from the heat and allow the rice to rest, covered, for 3 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-rice-pilaf-recipe/#wprm-recipe-1564-step-0-6"}, {"@type": "HowToStep", "text": "Remove the lid, fluff the rice gently with a fork, garnish with chopped parsley, and serve immediately.", "name": "Remove the lid, fluff the rice gently with a fork, garnish with chopped parsley, and serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/homemade-rice-pilaf-recipe/#wprm-recipe-1564-step-0-7"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["Mediterranean"], "keywords": "HOMEMADE RICE PILAF RECIPE"}</script>
