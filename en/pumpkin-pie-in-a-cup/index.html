    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Pie in a Cup", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy pumpkin dessert layered over a buttery graham cracker base and chilled in individual cups until set. Warm spices add classic pumpkin pie flavor, while an optional spoonful of whipped cream provides a simple finishing touch.", "datePublished": "2019-11-14T09:37:18+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/pumpkin-pie-in-a-cup.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/pumpkin-pie-in-a-cup.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/pumpkin-pie-in-a-cup.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/pumpkin-pie-in-a-cup.png"], "cookTime": "PT10M", "totalTime": "PT130M", "recipeIngredient": ["2 cups finely pulverized graham cracker crumbs (crushed to a sand-like consistency)", "5 tablespoons butter (melted)", "1 cup heavy whipping cream", "1/2 teaspoon fine salt", "15 ounces canned pumpkin purée (such as Libby’s)", "1 teaspoon ground cinnamon (for a fragrant, warmly spiced flavor)", "2  eggs (thoroughly beaten until smooth)", "1  packet plain (unflavored gelatin)", "1/8 cup white granulated sugar", "1/2 teaspoon ground nutmeg", "Ground ginger (amount not specified in the original recipe)", "Whipped cream (optional, for topping)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the graham crackers inside a large resealable plastic bag.", "name": "Place the graham crackers inside a large resealable plastic bag.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-0"}, {"@type": "HowToStep", "text": "Crush them thoroughly with a rolling pin until the pieces become very fine and resemble coarse sand.", "name": "Crush them thoroughly with a rolling pin until the pieces become very fine and resemble coarse sand.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the crushed graham crackers to a medium mixing bowl.", "name": "Transfer the crushed graham crackers to a medium mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-2"}, {"@type": "HowToStep", "text": "Pour in the melted butter and stir until the crumbs are evenly coated and the mixture is thoroughly combined.", "name": "Pour in the melted butter and stir until the crumbs are evenly coated and the mixture is thoroughly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-3"}, {"@type": "HowToStep", "text": "Set the prepared crust mixture aside.", "name": "Set the prepared crust mixture aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-4"}, {"@type": "HowToStep", "text": "Add the unflavored gelatin, cinnamon, ginger, nutmeg, and salt to a heavy-bottomed saucepan and combine.", "name": "Add the unflavored gelatin, cinnamon, ginger, nutmeg, and salt to a heavy-bottomed saucepan and combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-5"}, {"@type": "HowToStep", "text": "Pour in the heavy cream, then add the granulated sugar and beaten eggs. Stir well until the mixture is uniform.", "name": "Pour in the heavy cream, then add the granulated sugar and beaten eggs. Stir well until the mixture is uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-6"}, {"@type": "HowToStep", "text": "Cook over low heat while stirring continuously. Continue cooking until the gelatin has completely dissolved and the mixture has thickened, approximately 10 minutes.", "name": "Cook over low heat while stirring continuously. Continue cooking until the gelatin has completely dissolved and the mixture has thickened, approximately 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-7"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat once the filling has thickened, then stir in the pumpkin purée until evenly incorporated.", "name": "Remove the saucepan from the heat once the filling has thickened, then stir in the pumpkin purée until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-8"}, {"@type": "HowToStep", "text": "Spoon a portion of the graham cracker mixture into the bottom of each serving cup.", "name": "Spoon a portion of the graham cracker mixture into the bottom of each serving cup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-9"}, {"@type": "HowToStep", "text": "Press the crumbs down gently to form a compact, sturdy crust layer.", "name": "Press the crumbs down gently to form a compact, sturdy crust layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-10"}, {"@type": "HowToStep", "text": "Distribute the pumpkin filling over the prepared graham cracker bases.", "name": "Distribute the pumpkin filling over the prepared graham cracker bases.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-11"}, {"@type": "HowToStep", "text": "Cover each cup with foil and refrigerate for at least 2 hours, or until the pumpkin filling has fully set.", "name": "Cover each cup with foil and refrigerate for at least 2 hours, or until the pumpkin filling has fully set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-12"}, {"@type": "HowToStep", "text": "Remove the chilled pumpkin pie cups from the refrigerator when ready to serve.", "name": "Remove the chilled pumpkin pie cups from the refrigerator when ready to serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-13"}, {"@type": "HowToStep", "text": "Finish each portion with a dollop of whipped cream, if desired.", "name": "Finish each portion with a dollop of whipped cream, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-14"}, {"@type": "HowToStep", "text": "Serve immediately while chilled.", "name": "Serve immediately while chilled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-in-a-cup/#wprm-recipe-46388-step-0-15"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Pie In A Cup"}</script>
