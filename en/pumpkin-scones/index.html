    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Scones", "author": {"@type": "Person", "name": "BenDes"}, "description": "These tender pumpkin scones combine finely milled almond flour, coconut flour, warm pumpkin pie spices, and rich pumpkin purée. Optional pecans provide a pleasant crunch, while a smooth vanilla glaze adds a lightly sweet finish.", "datePublished": "2020-08-10T03:29:37+00:00", "image": ["https://erecip.github.io/en/pumpkin-scones/pumpkin-scones2.png", "https://erecip.github.io/en/pumpkin-scones/pumpkin-scones2.png", "https://erecip.github.io/en/pumpkin-scones/pumpkin-scones2.png", "https://erecip.github.io/en/pumpkin-scones/pumpkin-scones2.png"], "cookTime": "PT23M", "totalTime": "PT33M", "recipeIngredient": ["⅓ cup plain canned pumpkin purée (not pumpkin pie filling)", "2  large eggs", "¼ cup coconut flour", "1½ teaspoons pumpkin pie spice blend", "¼ cup unsalted butter (melted)", "2¼ cups finely ground almond flour", "1 tablespoon baking powder", "½ cup roughly chopped pecans (optional)", "¼ teaspoon fine salt", "⅓ cup brown sugar substitute", "½ teaspoon pure vanilla extract", "2 tablespoons heavy whipping cream", "¼ cup powdered sugar alternative"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 325°F. Cover a baking sheet with parchment paper or a silicone baking mat to prevent sticking and promote consistent baking.", "name": "Preheat the oven to 325°F. Cover a baking sheet with parchment paper or a silicone baking mat to prevent sticking and promote consistent baking.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-0"}, {"@type": "HowToStep", "text": "Place the almond flour, coconut flour, brown sugar substitute, baking powder, and salt in a large mixing bowl. Whisk until the dry ingredients are evenly distributed.", "name": "Place the almond flour, coconut flour, brown sugar substitute, baking powder, and salt in a large mixing bowl. Whisk until the dry ingredients are evenly distributed.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-1"}, {"@type": "HowToStep", "text": "Fold in the chopped pecans at this stage when using them.", "name": "Fold in the chopped pecans at this stage when using them.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-2"}, {"@type": "HowToStep", "text": "Add the pumpkin purée, eggs, melted butter, and pumpkin pie spice to the dry mixture. Stir just until the ingredients come together and form a unified dough. Avoid excessive mixing to preserve a tender texture.", "name": "Add the pumpkin purée, eggs, melted butter, and pumpkin pie spice to the dry mixture. Stir just until the ingredients come together and form a unified dough. Avoid excessive mixing to preserve a tender texture.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the dough to the prepared baking sheet. Gently press it into a rectangle measuring approximately 6 by 8 inches and about 1 inch thick.", "name": "Transfer the dough to the prepared baking sheet. Gently press it into a rectangle measuring approximately 6 by 8 inches and about 1 inch thick.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-4"}, {"@type": "HowToStep", "text": "Cut the rectangle into six equal squares with a sharp knife. Slice each square diagonally to produce two triangular scones, creating 12 pieces altogether.", "name": "Cut the rectangle into six equal squares with a sharp knife. Slice each square diagonally to produce two triangular scones, creating 12 pieces altogether.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-5"}, {"@type": "HowToStep", "text": "Carefully move the shaped scones apart so that none of them are touching.", "name": "Carefully move the shaped scones apart so that none of them are touching.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-6"}, {"@type": "HowToStep", "text": "Bake for 23 minutes, or until the scones feel firm and develop a light golden-brown color. Rotate the baking sheet halfway through the baking period to encourage even browning.", "name": "Bake for 23 minutes, or until the scones feel firm and develop a light golden-brown color. Rotate the baking sheet halfway through the baking period to encourage even browning.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-7"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and allow the scones to cool directly on the baking sheet.", "name": "Remove the pan from the oven and allow the scones to cool directly on the baking sheet.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-8"}, {"@type": "HowToStep", "text": "To prepare the glaze, whisk the powdered sugar alternative, heavy whipping cream, and vanilla extract in a small bowl until completely smooth.", "name": "To prepare the glaze, whisk the powdered sugar alternative, heavy whipping cream, and vanilla extract in a small bowl until completely smooth.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-9"}, {"@type": "HowToStep", "text": "Drizzle the vanilla glaze over the cooled scones. Leave the glaze undisturbed for approximately 10 minutes, or until set, before serving.", "name": "Drizzle the vanilla glaze over the cooled scones. Leave the glaze undisturbed for approximately 10 minutes, or until set, before serving.", "url": "https://erecip.github.io/en/pumpkin-scones/#wprm-recipe-39726-step-0-10"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Pumpkin Scones"}</script>
