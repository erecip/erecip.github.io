    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Amish Recipe for Apple Fritters", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender apple fritters filled with finely diced fresh apples and cinnamon, fried until golden, then coated with a smooth vanilla glaze. These classic Amish-style fritters are best enjoyed fresh while the exterior is crisp and the center remains soft.", "datePublished": "2021-03-31T07:57:54+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/amish-recipe-for-apple-fritters2.png", "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/amish-recipe-for-apple-fritters2.png", "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/amish-recipe-for-apple-fritters2.png", "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/amish-recipe-for-apple-fritters2.png"], "cookTime": "PT6M", "totalTime": "PT6M", "recipeIngredient": ["1 teaspoon ground cinnamon", "2  large eggs", "3 cups peeled apples (finely diced)", "¼ cup granulated sugar", "1 tablespoon freshly squeezed lemon juice", "2 cups all-purpose flour", "1 teaspoon salt", "⅔ cup milk", "3 teaspoons baking powder", "Vegetable oil or canola oil (as needed for deep-frying)", "2 teaspoons vanilla extract", "3 to 4 tablespoons milk", "2½ cups confectioners’ sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the apples. Peel the apples and cut them into very small, fine pieces. The apples may also be shredded if preferred. Set aside until the batter is ready.", "name": "Prepare the apples. Peel the apples and cut them into very small, fine pieces. The apples may also be shredded if preferred. Set aside until the batter is ready.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-0"}, {"@type": "HowToStep", "text": "Combine the liquid ingredients. Place the eggs, ⅔ cup milk, and freshly squeezed lemon juice in a large mixing bowl. Beat until the ingredients are thoroughly blended.", "name": "Combine the liquid ingredients. Place the eggs, ⅔ cup milk, and freshly squeezed lemon juice in a large mixing bowl. Beat until the ingredients are thoroughly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-1"}, {"@type": "HowToStep", "text": "Prepare the dry mixture. In a separate bowl, whisk together the all-purpose flour, baking powder, salt, granulated sugar, and ground cinnamon until evenly distributed.", "name": "Prepare the dry mixture. In a separate bowl, whisk together the all-purpose flour, baking powder, salt, granulated sugar, and ground cinnamon until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-2"}, {"@type": "HowToStep", "text": "Make the fritter batter. Gradually add the dry ingredients to the egg and milk mixture, stirring only until the two mixtures are combined. Gently fold in the prepared apples. Do not overmix; a slightly lumpy batter helps the fritters remain light and tender.", "name": "Make the fritter batter. Gradually add the dry ingredients to the egg and milk mixture, stirring only until the two mixtures are combined. Gently fold in the prepared apples. Do not overmix; a slightly lumpy batter helps the fritters remain light and tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-3"}, {"@type": "HowToStep", "text": "Heat the frying oil. Pour several inches of vegetable or canola oil into a deep, heavy pot. Heat the oil to 350°F (175°C).", "name": "Heat the frying oil. Pour several inches of vegetable or canola oil into a deep, heavy pot. Heat the oil to 350°F (175°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-4"}, {"@type": "HowToStep", "text": "Fry the fritters. Carefully lower generous tablespoonfuls of batter into the hot oil. If the batter forms compact, round portions, spread each one slightly. Cook only a few fritters at a time so the pot is not overcrowded and the oil maintains its temperature.", "name": "Fry the fritters. Carefully lower generous tablespoonfuls of batter into the hot oil. If the batter forms compact, round portions, spread each one slightly. Cook only a few fritters at a time so the pot is not overcrowded and the oil maintains its temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-5"}, {"@type": "HowToStep", "text": "Brown both sides. Fry the apple fritters for approximately 3 minutes per side, or until they develop an even golden-brown color.", "name": "Brown both sides. Fry the apple fritters for approximately 3 minutes per side, or until they develop an even golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-6"}, {"@type": "HowToStep", "text": "Drain and cool. Lift the cooked fritters from the oil with a slotted spoon and transfer them to a wire cooling rack. Allow them to cool slightly while preparing the glaze.", "name": "Drain and cool. Lift the cooked fritters from the oil with a slotted spoon and transfer them to a wire cooling rack. Allow them to cool slightly while preparing the glaze.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-7"}, {"@type": "HowToStep", "text": "Mix the vanilla glaze. Whisk the confectioners’ sugar, vanilla extract, and 3 to 4 tablespoons of milk together in a small bowl until smooth. The glaze should have a relatively thin consistency. Add additional confectioners’ sugar if it becomes too loose, or a small amount of extra milk if it is too thick.", "name": "Mix the vanilla glaze. Whisk the confectioners’ sugar, vanilla extract, and 3 to 4 tablespoons of milk together in a small bowl until smooth. The glaze should have a relatively thin consistency. Add additional confectioners’ sugar if it becomes too loose, or a small amount of extra milk if it is too thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-8"}, {"@type": "HowToStep", "text": "Glaze the fritters. Dip the slightly cooled fritters into the vanilla glaze, then return them to the wire rack so the coating can set. Alternatively, brush the glaze generously over the tops.", "name": "Glaze the fritters. Dip the slightly cooled fritters into the vanilla glaze, then return them to the wire rack so the coating can set. Alternatively, brush the glaze generously over the tops.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-9"}, {"@type": "HowToStep", "text": "Serve. Enjoy the apple fritters while fresh for the best texture and flavor.", "name": "Serve. Enjoy the apple fritters while fresh for the best texture and flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/amish-recipe-for-apple-fritters/#wprm-recipe-44231-step-0-10"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Amish Recipe for Apple Fritters"}</script>
