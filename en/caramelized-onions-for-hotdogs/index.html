    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Caramelized Onions for Hot Dogs", "author": {"@type": "Person", "name": "BenDes"}, "description": "These savory beef hot dogs are topped with deeply caramelized white onions, a bright parsley-Dijon mayonnaise, and shredded Gruyère cheese. A brief finish under the broiler melts the cheese into a bubbling, lightly golden layer.", "datePublished": "2019-04-20T15:56:37+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/caramelized-onions-for-hotdogs.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/caramelized-onions-for-hotdogs.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/caramelized-onions-for-hotdogs.png", "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/caramelized-onions-for-hotdogs.png"], "prepTime": "PT15M", "cookTime": "PT90M", "totalTime": "PT105M", "recipeIngredient": ["2 pounds white onions (peeled and sliced into thin strips)", "2 tablespoons apple cider vinegar", "1/4 cup unsalted butter", "1 tablespoon finely chopped fresh parsley", "1/4 cup mayonnaise", "Fresh juice from 1/2 lemon", "1 tablespoon Dijon mustard", "4 ounces Gruyère cheese (freshly shredded)", "6  hot dog buns", "6  beef hot dogs"], "recipeInstructions": [{"@type": "HowToStep", "text": "Melt the unsalted butter in a large skillet or pan over medium heat.", "name": "Melt the unsalted butter in a large skillet or pan over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-0"}, {"@type": "HowToStep", "text": "Add the thinly sliced white onions and stir thoroughly so the pieces are evenly coated with the melted butter.", "name": "Add the thinly sliced white onions and stir thoroughly so the pieces are evenly coated with the melted butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-1"}, {"@type": "HowToStep", "text": "Cook the onions for approximately 1 hour and 15 minutes to 1 hour and 30 minutes, stirring periodically, until they become very tender and develop a rich golden caramelized color.", "name": "Cook the onions for approximately 1 hour and 15 minutes to 1 hour and 30 minutes, stirring periodically, until they become very tender and develop a rich golden caramelized color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-2"}, {"@type": "HowToStep", "text": "Reduce the heat if the onions begin browning more rapidly than desired. If the pan becomes dry during the long cooking process, stir in approximately 1 tablespoon of water as needed.", "name": "Reduce the heat if the onions begin browning more rapidly than desired. If the pan becomes dry during the long cooking process, stir in approximately 1 tablespoon of water as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-3"}, {"@type": "HowToStep", "text": "Near the end of the cooking time, pour in the apple cider vinegar. Continue stirring and cooking until most of the vinegar has evaporated.", "name": "Near the end of the cooking time, pour in the apple cider vinegar. Continue stirring and cooking until most of the vinegar has evaporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the finished caramelized onions to a bowl and reserve them for assembly.", "name": "Transfer the finished caramelized onions to a bowl and reserve them for assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-5"}, {"@type": "HowToStep", "text": "While the onions are cooking, place the mayonnaise, Dijon mustard, chopped parsley, and fresh lemon juice in a small bowl.", "name": "While the onions are cooking, place the mayonnaise, Dijon mustard, chopped parsley, and fresh lemon juice in a small bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-6"}, {"@type": "HowToStep", "text": "Stir until all ingredients are thoroughly incorporated and the sauce has a smooth, even consistency.", "name": "Stir until all ingredients are thoroughly incorporated and the sauce has a smooth, even consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-7"}, {"@type": "HowToStep", "text": "Refrigerate the prepared sauce until it is needed.", "name": "Refrigerate the prepared sauce until it is needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-8"}, {"@type": "HowToStep", "text": "After removing the caramelized onions, use the same pan to prepare the beef hot dogs.", "name": "After removing the caramelized onions, use the same pan to prepare the beef hot dogs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-9"}, {"@type": "HowToStep", "text": "Set the pan over medium heat and add the hot dogs. Cook while turning them occasionally until the exterior develops crisp areas and is evenly browned in spots.", "name": "Set the pan over medium heat and add the hot dogs. Cook while turning them occasionally until the exterior develops crisp areas and is evenly browned in spots.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-10"}, {"@type": "HowToStep", "text": "Arrange each cooked beef hot dog inside a hot dog bun.", "name": "Arrange each cooked beef hot dog inside a hot dog bun.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-11"}, {"@type": "HowToStep", "text": "Spoon some of the chilled parsley mayo sauce over each hot dog, then generously distribute the caramelized onions over the top.", "name": "Spoon some of the chilled parsley mayo sauce over each hot dog, then generously distribute the caramelized onions over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-12"}, {"@type": "HowToStep", "text": "Finish each hot dog with an even layer of shredded Gruyère cheese.", "name": "Finish each hot dog with an even layer of shredded Gruyère cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-13"}, {"@type": "HowToStep", "text": "Transfer the assembled hot dogs to a baking sheet and place them under the oven broiler for a few minutes, cooking only until the Gruyère is fully melted and bubbling.", "name": "Transfer the assembled hot dogs to a baking sheet and place them under the oven broiler for a few minutes, cooking only until the Gruyère is fully melted and bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-14"}, {"@type": "HowToStep", "text": "Remove from the oven once the cheese is melted, or allow it to broil slightly longer for a lightly golden surface.", "name": "Remove from the oven once the cheese is melted, or allow it to broil slightly longer for a lightly golden surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramelized-onions-for-hotdogs/#wprm-recipe-42040-step-0-15"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Caramelized Onions for Hot Dogs"}</script>
