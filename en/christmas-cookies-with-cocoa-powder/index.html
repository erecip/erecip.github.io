    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies with Cocoa Powder", "author": {"@type": "Person", "name": "BenDes"}, "description": "These rich chocolate Christmas cookies are prepared with unsweetened cocoa, dark brown sugar, butter, vanilla, and a subtle touch of espresso powder. Once baked until softly set, the cookies are coated with a smooth cocoa glaze and paired with festive colored sprinkles or jimmies for decoration.", "datePublished": "2022-11-30T06:16:08+00:00", "image": ["https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/christmas-cookies-with-cocoa-powder.png", "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/christmas-cookies-with-cocoa-powder.png", "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/christmas-cookies-with-cocoa-powder.png", "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/christmas-cookies-with-cocoa-powder.png"], "cookTime": "PT15M", "totalTime": "PT20M", "recipeIngredient": ["14 tablespoons unsalted butter (softened to room temperature before melting)", "1 1/2 cups plus 2 tablespoons plain flour", "1 tablespoon pure vanilla extract", "1/4 teaspoon baking powder", "1  large egg and 1 additional large egg yolk", "1 3/4 cups firmly packed dark brown sugar (preferably for its pronounced molasses character)", "1/2 teaspoon salt", "3/4 cup 100% unsweetened cocoa powder", "1/2 teaspoon baking soda", "1/2 teaspoon instant espresso powder", "1 1/2 cups powdered sugar", "4 to 8 tablespoons milk (with whole milk providing a creamier texture)", "3/8 cup cocoa powder", "2 teaspoons vanilla extract", "Colored sugar sprinkles or jimmies (for a festive appearance)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Cover two baking sheets with parchment paper and reserve them for the cookie dough.", "name": "Preheat the oven to 350°F (175°C). Cover two baking sheets with parchment paper and reserve them for the cookie dough.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-0"}, {"@type": "HowToStep", "text": "In a medium bowl, thoroughly whisk together the plain flour, unsweetened cocoa powder, instant espresso powder, baking soda, and baking powder. Set the combined dry ingredients aside.", "name": "In a medium bowl, thoroughly whisk together the plain flour, unsweetened cocoa powder, instant espresso powder, baking soda, and baking powder. Set the combined dry ingredients aside.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the butter to a large microwave-safe bowl and melt it. Leave the melted butter to cool before continuing.", "name": "Transfer the butter to a large microwave-safe bowl and melt it. Leave the melted butter to cool before continuing.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-2"}, {"@type": "HowToStep", "text": "Once the butter has cooled, whisk in the packed dark brown sugar, vanilla extract, and salt until the mixture becomes smooth and no noticeable lumps remain.", "name": "Once the butter has cooled, whisk in the packed dark brown sugar, vanilla extract, and salt until the mixture becomes smooth and no noticeable lumps remain.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-3"}, {"@type": "HowToStep", "text": "Add the whole egg and extra egg yolk, mixing until they are fully incorporated into the butter and sugar mixture.", "name": "Add the whole egg and extra egg yolk, mixing until they are fully incorporated into the butter and sugar mixture.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-4"}, {"@type": "HowToStep", "text": "Fold the prepared dry ingredients gently into the wet mixture, stopping as soon as a cohesive dough forms. Avoid excessive mixing so the finished cookies retain a soft texture.", "name": "Fold the prepared dry ingredients gently into the wet mixture, stopping as soon as a cohesive dough forms. Avoid excessive mixing so the finished cookies retain a soft texture.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-5"}, {"@type": "HowToStep", "text": "Portion the dough into balls using approximately 2 tablespoons of dough for each cookie. Arrange them on the parchment-lined baking sheets, leaving about 2 inches of space between each portion. Keep the dough balls rounded rather than flattening them.", "name": "Portion the dough into balls using approximately 2 tablespoons of dough for each cookie. Arrange them on the parchment-lined baking sheets, leaving about 2 inches of space between each portion. Keep the dough balls rounded rather than flattening them.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-6"}, {"@type": "HowToStep", "text": "Bake one tray at a time in the preheated oven. Turn the baking sheet halfway through the baking period so the cookies bake evenly.", "name": "Bake one tray at a time in the preheated oven. Turn the baking sheet halfway through the baking period so the cookies bake evenly.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-7"}, {"@type": "HowToStep", "text": "Continue baking for approximately 15 minutes, or until the cookies appear slightly puffed and their outer edges have only just begun to set.", "name": "Continue baking for approximately 15 minutes, or until the cookies appear slightly puffed and their outer edges have only just begun to set.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-8"}, {"@type": "HowToStep", "text": "Remove the tray from the oven and allow the cookies to remain on the baking sheet for 5 minutes. Carefully transfer them to a wire cooling rack and leave them until completely cooled.", "name": "Remove the tray from the oven and allow the cookies to remain on the baking sheet for 5 minutes. Carefully transfer them to a wire cooling rack and leave them until completely cooled.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-9"}, {"@type": "HowToStep", "text": "For the glaze, sift the powdered sugar and cocoa powder together into a medium mixing bowl.", "name": "For the glaze, sift the powdered sugar and cocoa powder together into a medium mixing bowl.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-10"}, {"@type": "HowToStep", "text": "Add 4 tablespoons of the milk along with the vanilla extract, then whisk until the glaze is smooth. Gradually incorporate additional milk as necessary, using only enough to create a glaze with a pourable consistency.", "name": "Add 4 tablespoons of the milk along with the vanilla extract, then whisk until the glaze is smooth. Gradually incorporate additional milk as necessary, using only enough to create a glaze with a pourable consistency.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-11"}, {"@type": "HowToStep", "text": "Position a wire rack over a rimmed baking sheet. Arrange the fully cooled cookies on the rack with approximately 1/2 inch of space between them.", "name": "Position a wire rack over a rimmed baking sheet. Arrange the fully cooled cookies on the rack with approximately 1/2 inch of space between them.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-12"}, {"@type": "HowToStep", "text": "Spoon the prepared chocolate glaze over the cookies, then leave them undisturbed until the coating has set firmly.", "name": "Spoon the prepared chocolate glaze over the cookies, then leave them undisturbed until the coating has set firmly.", "url": "https://erecip.github.io/en/christmas-cookies-with-cocoa-powder/#wprm-recipe-46684-step-0-13"}], "recipeCategory": ["Cookies", "Dessert"], "keywords": "Christmas Cookies with Cocoa Powder"}</script>
