owToStep", "text": "Prepare the Crumb Topping: While the batter rests, create the crumb topping. In a bowl, mix together the flour, brown sugar, cinnamon, salt, and melted butter. Stir with a spatula until the mixture forms a sandy texture. Use your hands to press the mixture together into clumps and set aside.", "name": "Prepare the Crumb Topping: While the batter rests, create the crumb topping. In a bowl, mix together the flour, brown sugar, cinnamon, salt, and melted butter. Stir with a spatula until the mixture forms a sandy texture. Use your hands to press the mixture together into clumps and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coffee-cake-muffins-recipe/#wprm-recipe-888-step-0-4"}, {"@type": "HowToStep", "text": "Fill the Muffin Pan: Line a 12-cup muffin pan, but only fill 6 of the wells to allow room for the muffins to expand. Spoon 2 tablespoons of batter into each lined muffin cup. Add 1 teaspoon of the cinnamon sugar mixture to the center of each muffin and spread it gently. Cover with an additional 4-6 tablespoons of batter, filling each cup completely.", "name": "Fill the Muffin Pan: Line a 12-cup muffin pan, but only fill 6 of the wells to allow room for the muffins to expand. Spoon 2 tablespoons of batter into each lined muffin cup. Add 1 teaspoon of the cinnamon sugar mixture to the center of each muffin and spread it gently. Cover with an additional 4-6 tablespoons of batter, filling each cup completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coffee-cake-muffins-recipe/#wprm-recipe-888-step-0-5"}, {"@type": "HowToStep", "text": "Top the Muffins: Sprinkle the crumb topping over each muffin, pressing it gently to adhere. For an optional touch, add a sprinkling of sparkling sugar.", "name": "Top the Muffins: Sprinkle the crumb topping over each muffin, pressing it gently to adhere. For an optional touch, add a sprinkling of sparkling sugar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coffee-cake-muffins-recipe/#wprm-recipe-888-step-0-6"}, {"@type": "HowToStep", "text": "Bake the Muffins: Place the pan in the center of the oven. Bake at 425°F (220°C) for 7 minutes. Then, without opening the oven door, reduce the temperature to 350°F (175°C) and continue baking for 16-20 minutes or until a toothpick inserted into the center comes out clean.", "name": "Bake the Muffins: Place the pan in the center of the oven. Bake at 425°F (220°C) for 7 minutes. Then, without opening the oven door, reduce the temperature to 350°F (175°C) and continue baking for 16-20 minutes or until a toothpick inserted into the center comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coffee-cake-muffins-recipe/#wprm-recipe-888-step-0-7"}, {"@type": "HowToStep", "text": "Cool the Muffins: Allow the muffins to cool in the pan for 15 minutes before removing them. Repeat the process with any remaining batter, ensuring the oven temperature is reset to 425°F.", "name": "Cool the Muffins: Allow the muffins to cool in the pan for 15 minutes before removing them. Repeat the process with any remaining batter, ensuring the oven temperature is reset to 425°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coffee-cake-muffins-recipe/#wprm-recipe-888-step-0-8"}, {"@type": "HowToStep", "text": "Prepare the Glaze (Optional): In a small bowl, mix together the powdered sugar, vanilla extract, and milk. If the glaze is too thin, add more powdered sugar, a teaspoon at a time. Drizzle over the cooled muffins if desired.", "name": "Prepare the Glaze (Optional): In a small bowl, mix together the powdered sugar, vanilla extract, and milk. If the glaze is too thin, add more powdered sugar, a teaspoon at a time. Drizzle over the cooled muffins if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/coffee-cake-muffins-recipe/#wprm-recipe-888-step-0-9"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "
