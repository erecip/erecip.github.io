    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Glazed Pumpkin Bread", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warmly spiced pumpkin loaf with a tender, moist crumb and a delicate vanilla glaze. This recipe produces two loaves, making it suitable for seasonal gatherings, gifting, or enjoying alongside coffee or tea.", "datePublished": "2019-07-01T14:27:03+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/glazed-pumpkin-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/glazed-pumpkin-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/glazed-pumpkin-bread.png", "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/glazed-pumpkin-bread.png"], "prepTime": "PT15M", "cookTime": "PT45M", "totalTime": "PT70M", "recipeIngredient": ["1  can (15 ounces plain pumpkin purée)", "1½ teaspoons aromatic ground cinnamon", "½ cup neutral canola oil", "2 cups standard all-purpose flour", "2  large eggs (brought to room temperature, approximately 70°F)", "½ teaspoon finely ground cloves", "1½ cups white granulated sugar", "1 teaspoon baking soda", "1 teaspoon ground nutmeg", "½ teaspoon fine salt", "½ teaspoon baking powder", "1 tablespoon milk or water", "¼ teaspoon pure vanilla extract", "⅓ cup powdered confectioners’ sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C). Lightly coat two 8-by-5-inch loaf pans with cooking spray or a thin layer of oil, then place them aside.", "name": "Preheat the oven to 350°F (175°C). Lightly coat two 8-by-5-inch loaf pans with cooking spray or a thin layer of oil, then place them aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/#wprm-recipe-39562-step-0-0"}, {"@type": "HowToStep", "text": "In a medium mixing bowl, thoroughly whisk together the flour, cinnamon, baking soda, nutmeg, salt, cloves, and baking powder. Continue whisking until the spices and leavening agents are evenly dispersed throughout the flour.", "name": "In a medium mixing bowl, thoroughly whisk together the flour, cinnamon, baking soda, nutmeg, salt, cloves, and baking powder. Continue whisking until the spices and leavening agents are evenly dispersed throughout the flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/#wprm-recipe-39562-step-0-1"}, {"@type": "HowToStep", "text": "Place the canola oil, granulated sugar, pumpkin purée, and room-temperature eggs in a large bowl. Whisk by hand or blend with a handheld mixer until the mixture is smooth and uniformly combined.", "name": "Place the canola oil, granulated sugar, pumpkin purée, and room-temperature eggs in a large bowl. Whisk by hand or blend with a handheld mixer until the mixture is smooth and uniformly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/#wprm-recipe-39562-step-0-2"}, {"@type": "HowToStep", "text": "Gradually add the prepared dry mixture to the pumpkin mixture. Stir gently only until no visible streaks of dry flour remain. Scrape along the sides and bottom of the bowl with a flexible spatula to incorporate any unmixed ingredients without overworking the batter.", "name": "Gradually add the prepared dry mixture to the pumpkin mixture. Stir gently only until no visible streaks of dry flour remain. Scrape along the sides and bottom of the bowl with a flexible spatula to incorporate any unmixed ingredients without overworking the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/#wprm-recipe-39562-step-0-3"}, {"@type": "HowToStep", "text": "Divide the finished batter evenly between the two prepared loaf pans. Smooth the surface of each portion with a rubber spatula.", "name": "Divide the finished batter evenly between the two prepared loaf pans. Smooth the surface of each portion with a rubber spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/#wprm-recipe-39562-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the pans to the preheated oven and bake for 45–55 minutes. Test the loaves by inserting a toothpick into the center; they are fully baked when it emerges clean.", "name": "Transfer the pans to the preheated oven and bake for 45–55 minutes. Test the loaves by inserting a toothpick into the center; they are fully baked when it emerges clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/#wprm-recipe-39562-step-0-5"}, {"@type": "HowToStep", "text": "Set the baked loaves, still in their pans, on a wire cooling rack for at least 10 minutes. Carefully remove them from the pans and allow them to continue cooling before applying the glaze.", "name": "Set the baked loaves, still in their pans, on a wire cooling rack for at least 10 minutes. Carefully remove them from the pans and allow them to continue cooling before applying the glaze.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/#wprm-recipe-39562-step-0-6"}, {"@type": "HowToStep", "text": "While the bread cools, combine the confectioners’ sugar, milk or water, and vanilla extract in a small bowl. Whisk until the glaze becomes smooth and thin enough to drizzle.", "name": "While the bread cools, combine the confectioners’ sugar, milk or water, and vanilla extract in a small bowl. Whisk until the glaze becomes smooth and thin enough to drizzle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/#wprm-recipe-39562-step-0-7"}, {"@type": "HowToStep", "text": "Once the pumpkin loaves have cooled, spoon or drizzle the vanilla glaze evenly over their surfaces. Let the coating rest for several minutes so it can set before slicing and serving.", "name": "Once the pumpkin loaves have cooled, spoon or drizzle the vanilla glaze evenly over their surfaces. Let the coating rest for several minutes so it can set before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/glazed-pumpkin-bread/#wprm-recipe-39562-step-0-8"}], "recipeCategory": ["Bread", "Dessert"], "recipeCuisine": ["American"], "keywords": "Glazed Pumpkin Bread"}</script>
