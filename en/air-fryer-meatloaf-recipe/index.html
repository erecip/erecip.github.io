 over the meatloaves and return them to the air fryer for an additional 5–7 minutes, or until the internal temperature registers 165°F. Let the meatloaves rest for 5 minutes before slicing and serving.", "name": "Preheat the air fryer to 350°F. In a large bowl, combine the ground beef, green bell pepper, breadcrumbs, onion, milk, Parmesan, parsley, garlic, egg yolk, Italian seasoning, salt, and black pepper. Mix gently until all ingredients are just incorporated. Split the mixture into two equal portions and mold each into compact loaves approximately 5 inches in length and 2 inches in width. Place the loaves into the air fryer basket and cook for 20 minutes. While they cook, mix the tomato sauce and chili sauce in a small bowl to create the topping. Once the initial cook time is complete, spoon the topping over the meatloaves and return them to the air fryer for an additional 5–7 minutes, or until the internal temperature registers 165°F. Let the meatloaves rest for 5 minutes before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/air-fryer-meatloaf-recipe/#wprm-recipe-11628-step-0-0"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Air Fryer Meatloaf Recipe"}</script>
