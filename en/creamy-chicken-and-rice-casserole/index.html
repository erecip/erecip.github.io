op. Place the dish back into the warm oven, uncovered, for 2 to 4 minutes or until the cheese melts completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/creamy-chicken-and-rice-casserole/#wprm-recipe-33031-step-0-7"}], "recipeCategory": ["Casserole", "Main Course"], "recipeCuisine": ["American"], "keywords": "creamy chicken and rice casserole"}</script>
