    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chicken and Dumplings", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warming, stove-top comfort classic featuring tender chicken simmered in a savory broth with aromatic vegetables and soft, pillowy dumplings. Choose between homemade dumplings or a shortcut using pre-made biscuit dough for a satisfying meal the entire family will enjoy.", "datePublished": "2024-08-11T18:38:01+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/chicken-and-dumplings.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/chicken-and-dumplings.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/chicken-and-dumplings.png", "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/chicken-and-dumplings.png"], "recipeYield": ["6"], "prepTime": "PT20M", "cookTime": "PT40M", "totalTime": "PT60M", "recipeIngredient": ["1 teaspoon Worcestershire sauce", "3  garlic cloves (finely chopped)", "5 tablespoons unsalted butter", "¾ cup petite green peas (frozen)", "1  small yellow onion (finely chopped)", "4½ cups low-sodium chicken stock", "2 pounds of bone-in (skinless chicken thighs or breasts (see notes for alternatives))", "1  bouillon cube (optional, for richer depth)", "2  sticks of celery (chopped)", "1/3 cup all-purpose flour", "1 tablespoon light olive oil", "1 cup diced carrots", "Salt and ground black pepper (to taste)", "1½ cups half-and-half cream", "1 teaspoon hot sauce (such as Frank’s RedHot)", "½ teaspoon each of dried thyme (rosemary, parsley, basil, and mustard powder)", "1 teaspoon onion powder", "¼ teaspoon ground sage", "1/8 teaspoon black pepper", "2 teaspoons baking powder", "¾ cup chilled sour cream", "½ teaspoon baking soda", "4 tablespoons butter (melted and cooled slightly)", "¼ cup cold milk", "½ teaspoon garlic powder", "2 cups sifted cake flour (or use all-purpose as an alternative; see notes)", "1 teaspoon fine salt", "2 teaspoons granulated sugar"], "recipeInstructions": [{"@type": "HowToSection", "name": "Sear the Chicken (Optional)", "itemListElement": [{"@type": "HowToStep", "text": "Season chicken pieces on both sides with salt and pepper. Warm olive oil in a large soup pot (4½-quart capacity) over medium-high heat. Sear the chicken for 3 minutes on each side until lightly browned on the exterior—interior may remain undercooked. Remove chicken and let rest for 10 minutes before dicing into bite-sized chunks and discarding the bones.", "name": "Season chicken pieces on both sides with salt and pepper. Warm olive oil in a large soup pot (4½-quart capacity) over medium-high heat. Sear the chicken for 3 minutes on each side until lightly browned on the exterior—interior may remain undercooked. Remove chicken and let rest for 10 minutes before dicing into bite-sized chunks and discarding the bones.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-0-0"}]}, {"@type": "HowToSection", "name": "Prepare the Base", "itemListElement": [{"@type": "HowToStep", "text": "Blend together all dried seasonings and set aside. In the same pot used for searing, melt the butter over medium heat, scraping up any browned bits from the bottom. Stir in onions, celery, and carrots. Sauté for approximately 5 minutes until vegetables soften.", "name": "Blend together all dried seasonings and set aside. In the same pot used for searing, melt the butter over medium heat, scraping up any browned bits from the bottom. Stir in onions, celery, and carrots. Sauté for approximately 5 minutes until vegetables soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-1-0"}, {"@type": "HowToStep", "text": "Incorporate the garlic, Worcestershire sauce, hot sauce, and reserved seasoning blend. Cook for 1 additional minute to release flavors.", "name": "Incorporate the garlic, Worcestershire sauce, hot sauce, and reserved seasoning blend. Cook for 1 additional minute to release flavors.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-1-1"}, {"@type": "HowToStep", "text": "Sprinkle flour evenly over the vegetable mixture. Stir constantly for 2 minutes, ensuring everything is well-coated and the raw flour taste is eliminated.", "name": "Sprinkle flour evenly over the vegetable mixture. Stir constantly for 2 minutes, ensuring everything is well-coated and the raw flour taste is eliminated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-1-2"}, {"@type": "HowToStep", "text": "Gradually pour in the chicken stock, stirring continuously to avoid lumps. Scrape any fond from the bottom of the pot for added flavor. Slowly add half-and-half in the same fashion. If using bouillon, dissolve and stir in now.", "name": "Gradually pour in the chicken stock, stirring continuously to avoid lumps. Scrape any fond from the bottom of the pot for added flavor. Slowly add half-and-half in the same fashion. If using bouillon, dissolve and stir in now.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-1-3"}, {"@type": "HowToStep", "text": "Stir in the frozen peas and bring the liquid to a gentle boil. Keep at a low simmer, uncovered, while preparing the dumplings.", "name": "Stir in the frozen peas and bring the liquid to a gentle boil. Keep at a low simmer, uncovered, while preparing the dumplings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-1-4"}]}, {"@type": "HowToSection", "name": "Make the Dumplings", "itemListElement": [{"@type": "HowToStep", "text": "In a mixing bowl, whisk together the flour, baking powder, baking soda, salt, garlic powder, and sugar. Add cold sour cream, milk, and melted butter. Gently fold the mixture until a cohesive but soft dough forms; do not overwork.", "name": "In a mixing bowl, whisk together the flour, baking powder, baking soda, salt, garlic powder, and sugar. Add cold sour cream, milk, and melted butter. Gently fold the mixture until a cohesive but soft dough forms; do not overwork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-2-0"}, {"@type": "HowToStep", "text": "Return the chopped chicken and any collected juices to the pot. Reduce the heat to low and stir to incorporate evenly.", "name": "Return the chopped chicken and any collected juices to the pot. Reduce the heat to low and stir to incorporate evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-2-1"}, {"@type": "HowToStep", "text": "Using a small scoop or spoon, form dumplings and place them gently over the surface of the simmering broth in an even layer. Spoon a bit of the hot liquid over each to moisten.", "name": "Using a small scoop or spoon, form dumplings and place them gently over the surface of the simmering broth in an even layer. Spoon a bit of the hot liquid over each to moisten.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-2-2"}, {"@type": "HowToStep", "text": "Securely cover the pot with a lid. Slightly raise the heat to maintain a soft simmer. Cook undisturbed for 15 minutes to allow the dumplings to steam through.", "name": "Securely cover the pot with a lid. Slightly raise the heat to maintain a soft simmer. Cook undisturbed for 15 minutes to allow the dumplings to steam through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-2-3"}, {"@type": "HowToStep", "text": "After 15 minutes, remove the lid and test the center of one dumpling with a toothpick. If it emerges clean, the dumplings are cooked. If not, re-cover and simmer a few minutes longer.", "name": "After 15 minutes, remove the lid and test the center of one dumpling with a toothpick. If it emerges clean, the dumplings are cooked. If not, re-cover and simmer a few minutes longer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-2-4"}, {"@type": "HowToStep", "text": "Garnish with freshly chopped parsley, if desired, and serve hot.", "name": "Garnish with freshly chopped parsley, if desired, and serve hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-and-dumplings/#wprm-recipe-32689-step-2-5"}]}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "chicken and dumplings"}</script>
