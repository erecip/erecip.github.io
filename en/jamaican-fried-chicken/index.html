 salt, chicken bouillon powder, hot sauce, minced garlic, grated ginger, white pepper, paprika, curry powder, and fresh thyme.", "name": "Place the portioned chicken in a large mixing bowl. Add the salt, chicken bouillon powder, hot sauce, minced garlic, grated ginger, white pepper, paprika, curry powder, and fresh thyme.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-0"}, {"@type": "HowToStep", "text": "Thoroughly toss and massage the seasonings over the chicken until every piece is evenly coated. Cover the bowl securely and refrigerate for a minimum of 1 hour. For more developed flavor, leave the chicken to marinate overnight.", "name": "Thoroughly toss and massage the seasonings over the chicken until every piece is evenly coated. Cover the bowl securely and refrigerate for a minimum of 1 hour. For more developed flavor, leave the chicken to marinate overnight.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-1"}, {"@type": "HowToStep", "text": "Remove the seasoned chicken from the refrigerator and pour 1 cup of milk over the pieces.", "name": "Remove the seasoned chicken from the refrigerator and pour 1 cup of milk over the pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-2"}, {"@type": "HowToStep", "text": "Gently turn the chicken until all surfaces are moistened with the milk. Reserve approximately 2 tablespoons of this milk for preparing the coating mixture.", "name": "Gently turn the chicken until all surfaces are moistened with the milk. Reserve approximately 2 tablespoons of this milk for preparing the coating mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-3"}, {"@type": "HowToStep", "text": "In a large bowl, thoroughly combine the all-purpose flour, cornstarch, baking powder, paprika, salt, garlic powder, onion powder, cayenne pepper, dried mixed herbs, and additional white pepper.", "name": "In a large bowl, thoroughly combine the all-purpose flour, cornstarch, baking powder, paprika, salt, garlic powder, onion powder, cayenne pepper, dried mixed herbs, and additional white pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-4"}, {"@type": "HowToStep", "text": "Immediately before coating the chicken, work approximately 2 tablespoons of the reserved milk into the dry mixture with your fingertips. Continue until small, irregular clumps form throughout the flour mixture. These pieces will produce a rougher, extra-crisp crust during frying.", "name": "Immediately before coating the chicken, work approximately 2 tablespoons of the reserved milk into the dry mixture with your fingertips. Continue until small, irregular clumps form throughout the flour mixture. These pieces will produce a rougher, extra-crisp crust during frying.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-5"}, {"@type": "HowToStep", "text": "Remove each milk-coated piece of chicken and thoroughly cover it with the seasoned flour mixture, gently pressing the coating against the surface to encourage a craggy texture. Shake away any loose excess flour.", "name": "Remove each milk-coated piece of chicken and thoroughly cover it with the seasoned flour mixture, gently pressing the coating against the surface to encourage a craggy texture. Shake away any loose excess flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-6"}, {"@type": "HowToStep", "text": "A zip-top bag may also be used for coating if preferred.", "name": "A zip-top bag may also be used for coating if preferred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the coated chicken to a tray or wire rack and allow it to stand for approximately 15 minutes before frying. This resting period helps the coating adhere more securely to the chicken.", "name": "Transfer the coated chicken to a tray or wire rack and allow it to stand for approximately 15 minutes before frying. This resting period helps the coating adhere more securely to the chicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-8"}, {"@type": "HowToStep", "text": "Heat frying oil in a deep fryer or a large cast-iron skillet to 375°F (190°C).", "name": "Heat frying oil in a deep fryer or a large cast-iron skillet to 375°F (190°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-9"}, {"@type": "HowToStep", "text": "Carefully lower the coated chicken into the hot oil in batches, leaving sufficient room between the pieces to prevent overcrowding.", "name": "Carefully lower the coated chicken into the hot oil in batches, leaving sufficient room between the pieces to prevent overcrowding.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-10"}, {"@type": "HowToStep", "text": "Fry until the exterior is deeply golden and crisp, turning each piece once during cooking. Depending on the size of the chicken pieces, frying will take approximately 10–20 minutes.", "name": "Fry until the exterior is deeply golden and crisp, turning each piece once during cooking. Depending on the size of the chicken pieces, frying will take approximately 10–20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-11"}, {"@type": "HowToStep", "text": "Continue cooking until the chicken is no longer pink inside and the juices run clear. Check the thickest pieces carefully to confirm they are fully cooked.", "name": "Continue cooking until the chicken is no longer pink inside and the juices run clear. Check the thickest pieces carefully to confirm they are fully cooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-12"}, {"@type": "HowToStep", "text": "Transfer the finished chicken from the oil to paper towels arranged over a wire rack to remove excess oil.", "name": "Transfer the finished chicken from the oil to paper towels arranged over a wire rack to remove excess oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-13"}, {"@type": "HowToStep", "text": "Repeat the frying procedure with the remaining chicken pieces.", "name": "Repeat the frying procedure with the remaining chicken pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-14"}, {"@type": "HowToStep", "text": "Allow the fried chicken to rest for at least 10 minutes before serving. This short resting period helps preserve the crisp coating while allowing the juices inside the chicken to redistribute.", "name": "Allow the fried chicken to rest for at least 10 minutes before serving. This short resting period helps preserve the crisp coating while allowing the juices inside the chicken to redistribute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/jamaican-fried-chicken/#wprm-recipe-41415-step-0-15"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Jamaican"], "keywords": "Jamaican Fried Chicken"}</script>
