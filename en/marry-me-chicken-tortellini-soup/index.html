Place the chicken in a medium saucepan and season it generously with salt and ground black pepper. Pour in enough water to cover the chicken by approximately 1 inch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-0"}, {"@type": "HowToStep", "text": "Bring the water to a boil over high heat. Once boiling, reduce the temperature to low, cover the saucepan, and simmer for 10–20 minutes, depending on the thickness of the chicken, until it is fully cooked.", "name": "Bring the water to a boil over high heat. Once boiling, reduce the temperature to low, cover the saucepan, and simmer for 10–20 minutes, depending on the thickness of the chicken, until it is fully cooked.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the cooked chicken to a large mixing bowl or the bowl of a stand mixer. Shred it into bite-sized pieces using two forks, a hand mixer, or a stand mixer. Set the shredded chicken aside.", "name": "Transfer the cooked chicken to a large mixing bowl or the bowl of a stand mixer. Shred it into bite-sized pieces using two forks, a hand mixer, or a stand mixer. Set the shredded chicken aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-2"}, {"@type": "HowToStep", "text": "Add the olive oil and unsalted butter to a large soup pot or Dutch oven and warm over medium heat.", "name": "Add the olive oil and unsalted butter to a large soup pot or Dutch oven and warm over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-3"}, {"@type": "HowToStep", "text": "Once the butter has melted and the pot is hot, add the diced yellow onion with a small pinch of salt. Cook for approximately 3 minutes, stirring periodically, until the onion begins to soften and becomes translucent.", "name": "Once the butter has melted and the pot is hot, add the diced yellow onion with a small pinch of salt. Cook for approximately 3 minutes, stirring periodically, until the onion begins to soften and becomes translucent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-4"}, {"@type": "HowToStep", "text": "Stir in the chopped sun-dried tomatoes and minced garlic. Continue sautéing for another 3 minutes, stirring occasionally, to develop their flavor.", "name": "Stir in the chopped sun-dried tomatoes and minced garlic. Continue sautéing for another 3 minutes, stirring occasionally, to develop their flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-5"}, {"@type": "HowToStep", "text": "Sprinkle the Italian seasoning, crushed red pepper flakes, paprika, and ground black pepper into the pot. Stir briefly to distribute and lightly toast the seasonings.", "name": "Sprinkle the Italian seasoning, crushed red pepper flakes, paprika, and ground black pepper into the pot. Stir briefly to distribute and lightly toast the seasonings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-6"}, {"@type": "HowToStep", "text": "Add the reserved shredded chicken, rinsed cannellini beans, fire-roasted diced tomatoes along with their juices, and chicken broth.", "name": "Add the reserved shredded chicken, rinsed cannellini beans, fire-roasted diced tomatoes along with their juices, and chicken broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-7"}, {"@type": "HowToStep", "text": "Mix thoroughly, then taste the broth and adjust the salt, black pepper, or other seasonings as necessary.", "name": "Mix thoroughly, then taste the broth and adjust the salt, black pepper, or other seasonings as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-8"}, {"@type": "HowToStep", "text": "Increase the heat to medium-high and bring the soup to a boil. Cover the pot and allow the soup to cook for 10 minutes.", "name": "Increase the heat to medium-high and bring the soup to a boil. Cover the pot and allow the soup to cook for 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-9"}, {"@type": "HowToStep", "text": "Check the cooking time listed on the tortellini package. When the remaining soup-cooking time equals the required pasta cooking time, add the gluten-free cheese tortellini directly to the boiling soup.", "name": "Check the cooking time listed on the tortellini package. When the remaining soup-cooking time equals the required pasta cooking time, add the gluten-free cheese tortellini directly to the boiling soup.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-10"}, {"@type": "HowToStep", "text": "Cook according to the package directions until the tortellini are tender and rise to the surface. Check one piece for doneness before removing the soup from the heat.", "name": "Cook according to the package directions until the tortellini are tender and rise to the surface. Check one piece for doneness before removing the soup from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-11"}, {"@type": "HowToStep", "text": "Once the tortellini are fully cooked, turn off the heat.", "name": "Once the tortellini are fully cooked, turn off the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-12"}, {"@type": "HowToStep", "text": "Stir the chopped kale and grated Parmesan into the hot soup. Continue stirring until the kale softens and the Parmesan has melted into the broth.", "name": "Stir the chopped kale and grated Parmesan into the hot soup. Continue stirring until the kale softens and the Parmesan has melted into the broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-13"}, {"@type": "HowToStep", "text": "Gradually pour in the heavy cream while stirring continuously to help keep the mixture smooth and prevent the cream from curdling.", "name": "Gradually pour in the heavy cream while stirring continuously to help keep the mixture smooth and prevent the cream from curdling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-14"}, {"@type": "HowToStep", "text": "Taste the finished soup and make any final seasoning adjustments. Additional grated Parmesan may be added immediately before serving for a richer finish.", "name": "Taste the finished soup and make any final seasoning adjustments. Additional grated Parmesan may be added immediately before serving for a richer finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-tortellini-soup/#wprm-recipe-46648-step-0-15"}], "recipeCategory": ["Soup"], "recipeCuisine": ["Italian"], "keywords": "Marry Me Chicken Tortellini Soup"}</script>
