    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Old Fashioned Gingerbread Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These traditional gingerbread cookies combine molasses, brown sugar, butter, and a warming assortment of spices. Chilling the dough makes it easier to roll and cut while allowing the flavors to deepen. Once baked, the cookies develop set edges with softly chewy centers that become firmer as they cool.", "datePublished": "2021-09-15T03:56:00+00:00", "image": ["https://erecip.github.io/wp-content/uploads/old-fashioned-gingerbread-cookies.png", "https://erecip.github.io/wp-content/uploads/old-fashioned-gingerbread-cookies-500x500.png", "https://erecip.github.io/wp-content/uploads/old-fashioned-gingerbread-cookies-500x375.png", "https://erecip.github.io/wp-content/uploads/old-fashioned-gingerbread-cookies-480x270.png"], "cookTime": "PT10M", "totalTime": "PT70M", "recipeIngredient": ["1/3 cup unsulphured molasses", "1/2 teaspoon finely ground allspice", "6 tablespoons salted butter (softened to room temperature)", "1 3/4 cups all-purpose flour", "3/4 teaspoon ground ginger", "1  large egg (brought to room temperature)", "1/4 teaspoon salt", "1/2 teaspoon baking soda", "1/4 cup firmly packed brown sugar", "1/2 teaspoon ground cloves (preferably freshly ground)", "3/4 teaspoon ground cinnamon (preferably freshly ground)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the softened salted butter and firmly packed brown sugar in a mixing bowl. Beat for 2–3 minutes, or until the mixture becomes pale, airy, and fluffy. Properly softened butter will blend more readily and help incorporate the air needed for a tender cookie texture.", "name": "Place the softened salted butter and firmly packed brown sugar in a mixing bowl. Beat for 2–3 minutes, or until the mixture becomes pale, airy, and fluffy. Properly softened butter will blend more readily and help incorporate the air needed for a tender cookie texture.", "url": "https://erecip.github.io/en/old-fashioned-gingerbread-cookies/#wprm-recipe-40098-step-0-0"}, {"@type": "HowToStep", "text": "Pour the molasses into the creamed butter mixture, then add the room-temperature egg. Mix at medium speed until the ingredients are smooth and thoroughly combined.", "name": "Pour the molasses into the creamed butter mixture, then add the room-temperature egg. Mix at medium speed until the ingredients are smooth and thoroughly combined.", "url": "https://erecip.github.io/en/old-fashioned-gingerbread-cookies/#wprm-recipe-40098-step-0-1"}, {"@type": "HowToStep", "text": "Add the cinnamon, ginger, allspice, cloves, baking soda, and salt. Continue mixing only until the spices are distributed evenly throughout the mixture. Avoid excessive mixing after the baking soda has been added, as it will begin reacting with the acidic molasses.", "name": "Add the cinnamon, ginger, allspice, cloves, baking soda, and salt. Continue mixing only until the spices are distributed evenly throughout the mixture. Avoid excessive mixing after the baking soda has been added, as it will begin reacting with the acidic molasses.", "url": "https://erecip.github.io/en/old-fashioned-gingerbread-cookies/#wprm-recipe-40098-step-0-2"}, {"@type": "HowToStep", "text": "Add the all-purpose flour to the wet mixture. Stir on low speed or fold by hand until a unified dough forms and no visible streaks of dry flour remain. Do not overwork the dough.", "name": "Add the all-purpose flour to the wet mixture. Stir on low speed or fold by hand until a unified dough forms and no visible streaks of dry flour remain. Do not overwork the dough.", "url": "https://erecip.github.io/en/old-fashioned-gingerbread-cookies/#wprm-recipe-40098-step-0-3"}, {"@type": "HowToStep", "text": "Wrap the dough securely in plastic wrap and refrigerate it for at least 1 hour. This resting period firms the dough for easier rolling and cutting while giving the spices time to blend more fully.", "name": "Wrap the dough securely in plastic wrap and refrigerate it for at least 1 hour. This resting period firms the dough for easier rolling and cutting while giving the spices time to blend more fully.", "url": "https://erecip.github.io/en/old-fashioned-gingerbread-cookies/#wprm-recipe-40098-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F. Line a baking sheet with parchment paper.", "name": "Preheat the oven to 350°F. Line a baking sheet with parchment paper.", "url": "https://erecip.github.io/en/old-fashioned-gingerbread-cookies/#wprm-recipe-40098-step-0-5"}, {"@type": "HowToStep", "text": "Remove the chilled dough from the refrigerator and position it between two sheets of parchment paper. Roll it evenly to a thickness of 1/4 inch.", "name": "Remove the chilled dough from the refrigerator and position it between two sheets of parchment paper. Roll it evenly to a thickness of 1/4 inch.", "url": "https://erecip.github.io/en/old-fashioned-gingerbread-cookies/#wprm-recipe-40098-step-0-6"}, {"@type": "HowToStep", "text": "Cut the dough with cookie cutters of your choice. Arrange the shapes on the prepared baking sheet, leaving approximately 1 inch of space between them to accommodate slight spreading.", "name": "Cut the dough with cookie cutters of your choice. Arrange the shapes on the prepared baking sheet, leaving approximately 1 inch of space between them to accommodate slight spreading.", "url": "https://erecip.github.io/en/old-fashioned-gingerbread-cookies/#wprm-recipe-40098-step-0-7"}, {"@type": "HowToStep", "text": "Bake the cookies for 10–12 minutes. They are ready when the edges appear set while the centers remain slightly soft when gently touched.", "name": "Bake the cookies for 10–12 minutes. They are ready when the edges appear set while the centers remain slightly soft when gently touched.", "url": "https://erecip.github.io/en/old-fashioned-gingerbread-cookies/#wprm-recipe-40098-step-0-8"}, {"@type": "HowToStep", "text": "Allow the cookies to stand on the baking sheet for 2 minutes after removing them from the oven. Transfer them carefully to a wire cooling rack and leave them for approximately 30 minutes, or until completely cooled. The cookies will continue to firm as they rest, developing a balanced chewy and lightly crisp texture.", "name": "Allow the cookies to stand on the baking sheet for 2 minutes after removing them from the oven. Transfer them carefully to a wire cooling rack and leave them for approximately 30 minutes, or until completely cooled. The cookies will continue to firm as they rest, developing a balanced chewy and lightly crisp texture.", "url": "https://erecip.github.io/en/old-fashioned-gingerbread-cookies/#wprm-recipe-40098-step-0-9"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Old Fashioned Gingerbread Cookies"}</script>
