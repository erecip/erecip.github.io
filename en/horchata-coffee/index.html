    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Horchata Coffee", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy, refreshing variation of traditional horchata, enriched with aromatic cinnamon, almonds, brown sugar, vanilla, and freshly ground coffee. The extended soaking period allows the rice and almonds to soften while developing a balanced blend of roasted, spiced, and gently caramelized flavors.", "datePublished": "2021-04-26T18:23:18+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/horchata-coffee.png", "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/horchata-coffee.png", "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/horchata-coffee.png", "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/horchata-coffee.png"], "prepTime": "PT20M", "totalTime": "PT320M", "recipeIngredient": ["10 cups filtered water", "3  whole cinnamon sticks", "2 teaspoons pure vanilla extract", "6.5 ounces blanched almonds (approximately 1½ cups)", "1¼ cups firmly packed brown sugar; dark brown sugar may be used for deeper molasses flavor", "2.75 ounces medium-ground coffee (approximately 1 cup when measured from whole beans)", "17.5 ounces uncooked white rice (approximately 2½ cups)", "1  small pinch kosher salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the filtered water, white rice, blanched almonds, ground coffee, packed brown sugar, cinnamon sticks, vanilla extract, and kosher salt in a large bowl.", "name": "Place the filtered water, white rice, blanched almonds, ground coffee, packed brown sugar, cinnamon sticks, vanilla extract, and kosher salt in a large bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-0"}, {"@type": "HowToStep", "text": "Stir thoroughly until the ingredients are evenly dispersed throughout the water.", "name": "Stir thoroughly until the ingredients are evenly dispersed throughout the water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-1"}, {"@type": "HowToStep", "text": "Cover the bowl and leave the mixture at room temperature for 5 hours. For a more developed flavor, refrigerate it overnight instead.", "name": "Cover the bowl and leave the mixture at room temperature for 5 hours. For a more developed flavor, refrigerate it overnight instead.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the entire soaked mixture to a blender, including the cinnamon sticks. Process it in batches when necessary to avoid overcrowding the blender.", "name": "Transfer the entire soaked mixture to a blender, including the cinnamon sticks. Process it in batches when necessary to avoid overcrowding the blender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-3"}, {"@type": "HowToStep", "text": "Blend each portion for approximately 1 minute, or until the liquid appears cloudy and resembles milky coffee.", "name": "Blend each portion for approximately 1 minute, or until the liquid appears cloudy and resembles milky coffee.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-4"}, {"@type": "HowToStep", "text": "Allow each blended batch to rest in the blender for roughly 20 seconds so the heavier pulp can begin settling toward the bottom.", "name": "Allow each blended batch to rest in the blender for roughly 20 seconds so the heavier pulp can begin settling toward the bottom.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-5"}, {"@type": "HowToStep", "text": "Slowly pour the liquid through a fine-mesh strainer into a large bowl, keeping as much of the almond, rice, cinnamon, and coffee sediment as possible inside the blender.", "name": "Slowly pour the liquid through a fine-mesh strainer into a large bowl, keeping as much of the almond, rice, cinnamon, and coffee sediment as possible inside the blender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-6"}, {"@type": "HowToStep", "text": "Repeat the blending and straining process until the full mixture has been processed.", "name": "Repeat the blending and straining process until the full mixture has been processed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-7"}, {"@type": "HowToStep", "text": "Pass the strained liquid through the fine-mesh strainer once more to remove any remaining particles of coffee, rice, or almond.", "name": "Pass the strained liquid through the fine-mesh strainer once more to remove any remaining particles of coffee, rice, or almond.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-8"}, {"@type": "HowToStep", "text": "For an especially smooth consistency, line the strainer with cheesecloth during this second filtration.", "name": "For an especially smooth consistency, line the strainer with cheesecloth during this second filtration.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-9"}, {"@type": "HowToStep", "text": "Pour the twice-strained horchata coffee into a pitcher and refrigerate until thoroughly chilled.", "name": "Pour the twice-strained horchata coffee into a pitcher and refrigerate until thoroughly chilled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-10"}, {"@type": "HowToStep", "text": "Stir briefly before serving, as natural settling may occur during refrigeration.", "name": "Stir briefly before serving, as natural settling may occur during refrigeration.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-11"}, {"@type": "HowToStep", "text": "Pour the chilled horchata coffee over ice and serve immediately.", "name": "Pour the chilled horchata coffee over ice and serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/horchata-coffee/#wprm-recipe-39588-step-0-12"}], "recipeCategory": ["Beverage"], "recipeCuisine": ["Mexican-Inspired"], "keywords": "Horchata Coffee"}</script>
