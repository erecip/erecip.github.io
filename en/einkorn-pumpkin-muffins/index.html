    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Einkorn Pumpkin Muffins", "author": {"@type": "Person", "name": "BenDes"}, "description": "These tender einkorn pumpkin muffins combine rich pumpkin purée, aromatic autumn spices, and pure vanilla beneath a crisp brown sugar–oat streusel. Allowing the batter to rest gives the einkorn flour time to hydrate, producing a soft, pleasantly structured crumb.", "datePublished": "2019-05-27T23:00:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/einkorn-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/einkorn-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/einkorn-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/einkorn-pumpkin-muffins2.png"], "prepTime": "PT20M", "cookTime": "PT25M", "totalTime": "PT65M", "recipeIngredient": ["1  can (15 ounces pure pumpkin purée)", "2 teaspoons pure vanilla extract", "½ teaspoon finely grated ground nutmeg", "2½ cups all-purpose einkorn flour", "2  large eggs (brought to room temperature, approximately 70°F)", "1 teaspoon ground cinnamon", "½ cup unsalted butter (melted and allowed to cool slightly)", "½ teaspoon ground ginger", "1 cup white granulated sugar", "1 teaspoon baking powder", "½ teaspoon fine salt", "1 teaspoon baking soda", "⅔ cup firmly packed brown sugar", "2 tablespoons all-purpose einkorn flour", "⅛ cup old-fashioned rolled oats (finely ground)", "¼ teaspoon ground cinnamon"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Lightly coat 24 standard muffin cups with nonstick cooking spray and set the prepared pans aside.", "name": "Preheat the oven to 350°F. Lightly coat 24 standard muffin cups with nonstick cooking spray and set the prepared pans aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-0"}, {"@type": "HowToStep", "text": "Place the cooled melted butter, pumpkin purée, room-temperature eggs, granulated sugar, and vanilla extract in a large mixing bowl. Whisk until the ingredients form a smooth, evenly blended mixture.", "name": "Place the cooled melted butter, pumpkin purée, room-temperature eggs, granulated sugar, and vanilla extract in a large mixing bowl. Whisk until the ingredients form a smooth, evenly blended mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-1"}, {"@type": "HowToStep", "text": "In a separate bowl, thoroughly combine the einkorn flour, baking soda, baking powder, cinnamon, nutmeg, ginger, and salt. Stir well so the leavening agents and spices are distributed uniformly.", "name": "In a separate bowl, thoroughly combine the einkorn flour, baking soda, baking powder, cinnamon, nutmeg, ginger, and salt. Stir well so the leavening agents and spices are distributed uniformly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-2"}, {"@type": "HowToStep", "text": "Pour the pumpkin mixture into the bowl of dry ingredients. Fold gently only until no large streaks of dry flour remain. Avoid excessive mixing, which can negatively affect the finished texture.", "name": "Pour the pumpkin mixture into the bowl of dry ingredients. Fold gently only until no large streaks of dry flour remain. Avoid excessive mixing, which can negatively affect the finished texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-3"}, {"@type": "HowToStep", "text": "Cover the bowl with plastic wrap and leave the batter to rest for at least 20 minutes. For advance preparation, the covered batter may be refrigerated overnight. This resting period allows the einkorn flour to absorb the liquid and contributes to a more delicate, consistent crumb.", "name": "Cover the bowl with plastic wrap and leave the batter to rest for at least 20 minutes. For advance preparation, the covered batter may be refrigerated overnight. This resting period allows the einkorn flour to absorb the liquid and contributes to a more delicate, consistent crumb.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-4"}, {"@type": "HowToStep", "text": "While the batter rests, process the rolled oats in a blender or food processor until they reach a fine, cornmeal-like texture. Transfer the ground oats to a small bowl and mix them thoroughly with the packed brown sugar, einkorn flour, and cinnamon.", "name": "While the batter rests, process the rolled oats in a blender or food processor until they reach a fine, cornmeal-like texture. Transfer the ground oats to a small bowl and mix them thoroughly with the packed brown sugar, einkorn flour, and cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-5"}, {"@type": "HowToStep", "text": "After resting, stir the muffin batter briefly to eliminate any remaining dry pockets or uneven areas.", "name": "After resting, stir the muffin batter briefly to eliminate any remaining dry pockets or uneven areas.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-6"}, {"@type": "HowToStep", "text": "Distribute the batter among the prepared muffin cups, filling each cavity approximately three-quarters full. Use roughly ¼ cup of batter for each muffin.", "name": "Distribute the batter among the prepared muffin cups, filling each cavity approximately three-quarters full. Use roughly ¼ cup of batter for each muffin.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-7"}, {"@type": "HowToStep", "text": "Scatter approximately ¾ tablespoon of the oat streusel evenly over the top of each portion of batter.", "name": "Scatter approximately ¾ tablespoon of the oat streusel evenly over the top of each portion of batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-8"}, {"@type": "HowToStep", "text": "Bake for 25–30 minutes. The muffins are ready when a toothpick inserted into the center emerges clean or with only a few moist crumbs attached.", "name": "Bake for 25–30 minutes. The muffins are ready when a toothpick inserted into the center emerges clean or with only a few moist crumbs attached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-9"}, {"@type": "HowToStep", "text": "Let the muffins remain in the pans for several minutes before transferring them to a wire cooling rack. Serve warm or allow them to cool completely.", "name": "Let the muffins remain in the pans for several minutes before transferring them to a wire cooling rack. Serve warm or allow them to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/einkorn-pumpkin-muffins/#wprm-recipe-39383-step-0-10"}], "recipeCategory": ["Breakfast and Brunch"], "recipeCuisine": ["American"], "keywords": "Einkorn Pumpkin Muffins"}</script>
