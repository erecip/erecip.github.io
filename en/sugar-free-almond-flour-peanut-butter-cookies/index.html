    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sugar-Free Almond Flour Peanut Butter Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These almond flour peanut butter cookies are tender, lightly crisp at the edges, and made with a short list of simple ingredients. Creamy natural peanut butter, finely milled almond flour, and maple syrup come together to create a thick dough that bakes into classic fork-pressed cookies with a delicate nutty flavor.", "datePublished": "2020-03-10T05:08:24+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/Sugar-Free-Almond-Flour-Peanut-Butter-Cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/Sugar-Free-Almond-Flour-Peanut-Butter-Cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/Sugar-Free-Almond-Flour-Peanut-Butter-Cookies2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/Sugar-Free-Almond-Flour-Peanut-Butter-Cookies2.png"], "prepTime": "PT10M", "cookTime": "PT15M", "totalTime": "PT40M", "recipeIngredient": ["2/3 cup smooth natural peanut butter (made from 100% peanuts with no added sugar)", "Flaky sea salt (for finishing and added texture)", "1 1/4 cups super-fine almond flour (such as Bob’s Red Mill)", "1/4 cup maple syrup (recommended instead of artificial sweeteners)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Line a baking sheet with parchment paper so the cookies release easily and bake evenly, then set the pan aside.", "name": "Preheat the oven to 350°F. Line a baking sheet with parchment paper so the cookies release easily and bake evenly, then set the pan aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/#wprm-recipe-38893-step-0-0"}, {"@type": "HowToStep", "text": "In a large mixing bowl, add the almond flour, natural peanut butter, and maple syrup. Stir thoroughly with a spoon until the mixture becomes a dense, sticky cookie dough. Continue mixing until the almond flour is fully incorporated into the wet ingredients.", "name": "In a large mixing bowl, add the almond flour, natural peanut butter, and maple syrup. Stir thoroughly with a spoon until the mixture becomes a dense, sticky cookie dough. Continue mixing until the almond flour is fully incorporated into the wet ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/#wprm-recipe-38893-step-0-1"}, {"@type": "HowToStep", "text": "Portion the dough into evenly sized rounds using a small cookie scoop. Arrange the dough balls on the prepared baking sheet, leaving about 1–2 inches of space between each one.", "name": "Portion the dough into evenly sized rounds using a small cookie scoop. Arrange the dough balls on the prepared baking sheet, leaving about 1–2 inches of space between each one.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/#wprm-recipe-38893-step-0-2"}, {"@type": "HowToStep", "text": "Press each dough ball gently with a fork, then press again in the opposite direction to form a crisscross design. This gives the cookies their traditional peanut butter cookie appearance and helps them bake more evenly.", "name": "Press each dough ball gently with a fork, then press again in the opposite direction to form a crisscross design. This gives the cookies their traditional peanut butter cookie appearance and helps them bake more evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/#wprm-recipe-38893-step-0-3"}, {"@type": "HowToStep", "text": "Place the baking sheet in the preheated oven and bake for 10–15 minutes, or until the edges appear set and lightly golden. Watch closely near the end of baking, since oven temperatures can vary.", "name": "Place the baking sheet in the preheated oven and bake for 10–15 minutes, or until the edges appear set and lightly golden. Watch closely near the end of baking, since oven temperatures can vary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/#wprm-recipe-38893-step-0-4"}, {"@type": "HowToStep", "text": "Remove the cookies from the oven and let them rest on the baking sheet for 5–10 minutes. This cooling period allows them to firm up before moving.", "name": "Remove the cookies from the oven and let them rest on the baking sheet for 5–10 minutes. This cooling period allows them to firm up before moving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/#wprm-recipe-38893-step-0-5"}, {"@type": "HowToStep", "text": "Sprinkle the cookies with flaky sea salt, if using. Transfer them carefully to a wire rack and allow them to cool completely before serving.", "name": "Sprinkle the cookies with flaky sea salt, if using. Transfer them carefully to a wire rack and allow them to cool completely before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sugar-free-almond-flour-peanut-butter-cookies/#wprm-recipe-38893-step-0-6"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Sugar-Free Almond Flour Peanut Butter Cookies"}</script>
