    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gluten Free Cinnamon Rolls Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Delicately soft and richly flavored with cinnamon, these gluten free cinnamon rolls offer a tender bite and an inviting aroma that fills your kitchen. The dough is manageable, making the process approachable and rewarding.", "datePublished": "2024-07-08T12:43:53+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/Gluten-Free-Cinnamon-Rolls-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/Gluten-Free-Cinnamon-Rolls-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/Gluten-Free-Cinnamon-Rolls-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/Gluten-Free-Cinnamon-Rolls-Recipe.png"], "recipeYield": ["12", "12 rolls"], "prepTime": "PT20M", "cookTime": "PT20M", "totalTime": "PT130M", "recipeIngredient": ["2 teaspoons instant yeast", "1 ¼ cups 10 ounces warm milk, approximately 95°F (plus extra if needed)", "¼ cup 36 g tapioca starch", "2 tablespoons 26 g packed light brown sugar", "4 tablespoons 56 g unsalted butter, room temperature", "¼ teaspoon baking soda", "3 cups 420 g gluten free all-purpose flour blend (plus extra for dusting)", "1 teaspoon kosher salt", "¼ teaspoon cream of tartar", "1 teaspoon apple cider vinegar", "½ cup 43 g dry milk powder or buttermilk powder (ensure it's powdered)", "1  50 g, shelled egg, room temperature, beaten", "2 teaspoons xanthan gum (omit if blend already contains it)", "¾ cup 164 g packed light brown sugar", "1 teaspoon ground cinnamon", "4 tablespoons 56 g unsalted butter, softened", "1 cup 115 g confectioners' sugar, sifted", "1 tablespoon milk of choice (add more ¼ teaspoon at a time as needed)", "6 tablespoons 84 g unsalted butter, softened", "3 tablespoons heavy whipping cream (room temperature (more as needed))", "2 cups 230 g confectioners' sugar, sifted"], "recipeInstructions": [{"@type": "HowToStep", "text": "Grease a 9×13-inch baking dish and set aside.", "name": "Grease a 9×13-inch baking dish and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-0"}, {"@type": "HowToStep", "text": "In the bowl of a stand mixer fitted with a paddle attachment, blend the flour, xanthan gum, tapioca starch, milk powder, instant yeast, cream of tartar, baking soda, and brown sugar. Add the salt and mix again briefly.", "name": "In the bowl of a stand mixer fitted with a paddle attachment, blend the flour, xanthan gum, tapioca starch, milk powder, instant yeast, cream of tartar, baking soda, and brown sugar. Add the salt and mix again briefly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-1"}, {"@type": "HowToStep", "text": "Introduce the vinegar, butter, egg, and warm milk. Mix until incorporated, then increase to high speed and beat for 3 minutes until the dough appears smooth and begins pulling from the bowl sides.", "name": "Introduce the vinegar, butter, egg, and warm milk. Mix until incorporated, then increase to high speed and beat for 3 minutes until the dough appears smooth and begins pulling from the bowl sides.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the dough to a sealed container and chill for 30 minutes to ease handling.", "name": "Transfer the dough to a sealed container and chill for 30 minutes to ease handling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-3"}, {"@type": "HowToStep", "text": "On a lightly floured surface, gently knead the chilled dough to smooth it. Halve the dough and keep one portion covered. Roll the first half into a 9×12-inch rectangle, approximately ½ inch thick, dusting with flour as necessary.", "name": "On a lightly floured surface, gently knead the chilled dough to smooth it. Halve the dough and keep one portion covered. Roll the first half into a 9×12-inch rectangle, approximately ½ inch thick, dusting with flour as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-4"}, {"@type": "HowToStep", "text": "Spread half the softened butter across the surface, leaving a 1-inch margin. Sprinkle half the brown sugar evenly, pat to adhere, and dust with half the cinnamon.", "name": "Spread half the softened butter across the surface, leaving a 1-inch margin. Sprinkle half the brown sugar evenly, pat to adhere, and dust with half the cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-5"}, {"@type": "HowToStep", "text": "Roll tightly from a short end into a log, then slice into six portions using floss or a sharp knife. Arrange rolls in the prepared pan, spacing them an inch apart and gently pressing each roll down by a third.", "name": "Roll tightly from a short end into a log, then slice into six portions using floss or a sharp knife. Arrange rolls in the prepared pan, spacing them an inch apart and gently pressing each roll down by a third.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-6"}, {"@type": "HowToStep", "text": "Repeat with the remaining dough and filling. Cover the pan with lightly greased plastic wrap and let rise in a warm spot until rolls expand by roughly 50%, about 45 minutes.", "name": "Repeat with the remaining dough and filling. Cover the pan with lightly greased plastic wrap and let rise in a warm spot until rolls expand by roughly 50%, about 45 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-7"}, {"@type": "HowToStep", "text": "Preheat oven to 350°F. Remove the plastic wrap and bake for 20 minutes, until the rolls are risen, golden, and fully baked. Allow to cool for 5 to 10 minutes before glazing or frosting.", "name": "Preheat oven to 350°F. Remove the plastic wrap and bake for 20 minutes, until the rolls are risen, golden, and fully baked. Allow to cool for 5 to 10 minutes before glazing or frosting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-8"}, {"@type": "HowToStep", "text": "Optional glaze: Combine confectioners' sugar with milk until smooth and pourable; drizzle over warm rolls.", "name": "Optional glaze: Combine confectioners' sugar with milk until smooth and pourable; drizzle over warm rolls.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-9"}, {"@type": "HowToStep", "text": "Optional frosting: Cream butter and sugar until smooth, adding cream gradually to reach a spreadable texture. Generously frost while rolls are still warm.", "name": "Optional frosting: Cream butter and sugar until smooth, adding cream gradually to reach a spreadable texture. Generously frost while rolls are still warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-cinnamon-rolls-recipe/#wprm-recipe-11617-step-0-10"}], "recipeCategory": ["Breakfast", "Dessert"], "recipeCuisine": ["American"], "keywords": "Gluten Free Cinnamon Rolls Recipe"}</script>
