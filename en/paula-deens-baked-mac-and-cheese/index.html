ns-baked-mac-and-cheese/#wprm-recipe-43967-step-0-4"}, {"@type": "HowToStep", "text": "Begin baking. Transfer the prepared macaroni mixture to a casserole dish and distribute it evenly. Bake uncovered at 350°F for 20 minutes.", "name": "Begin baking. Transfer the prepared macaroni mixture to a casserole dish and distribute it evenly. Bake uncovered at 350°F for 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paula-deens-baked-mac-and-cheese/#wprm-recipe-43967-step-0-5"}, {"@type": "HowToStep", "text": "Stir and finish baking. After the first 20 minutes, gently stir the macaroni to encourage even cooking. Return the casserole to the oven and continue baking for another 10–15 minutes.", "name": "Stir and finish baking. After the first 20 minutes, gently stir the macaroni to encourage even cooking. Return the casserole to the oven and continue baking for another 10–15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paula-deens-baked-mac-and-cheese/#wprm-recipe-43967-step-0-6"}, {"@type": "HowToStep", "text": "Add the optional topping. If desired, scatter a small amount of additional shredded sharp cheddar over the surface shortly before serving. Place the casserole back in the oven for a couple of minutes, just until the cheese has melted.", "name": "Add the optional topping. If desired, scatter a small amount of additional shredded sharp cheddar over the surface shortly before serving. Place the casserole back in the oven for a couple of minutes, just until the cheese has melted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/paula-deens-baked-mac-and-cheese/#wprm-recipe-43967-step-0-7"}, {"@type": "HowToStep", "text": "Rest before serving. Allow the baked macaroni and cheese to stand for several minutes before portioning so the casserole can settle slightly and hold together more easily.", "name": "Rest before serving. Allow the baked macaroni and cheese to stand for several minutes before portioning
