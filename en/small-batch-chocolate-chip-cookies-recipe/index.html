    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Small Batch Chocolate Chip Cookies Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Crafted with nutty brown butter and requiring no electric mixer, these Small Batch Chocolate Chip Cookies yield a dozen tender, chocolate-filled delights that can be effortlessly doubled to suit any craving.", "datePublished": "2024-10-06T11:22:13+00:00", "image": ["https://erecip.github.io/en/small-batch-chocolate-chip-cookies-recipe/Small-Batch-Chocolate-Chip-Cookies-Recipe.png", "https://erecip.github.io/en/small-batch-chocolate-chip-cookies-recipe/Small-Batch-Chocolate-Chip-Cookies-Recipe.png", "https://erecip.github.io/en/small-batch-chocolate-chip-cookies-recipe/Small-Batch-Chocolate-Chip-Cookies-Recipe.png", "https://erecip.github.io/en/small-batch-chocolate-chip-cookies-recipe/Small-Batch-Chocolate-Chip-Cookies-Recipe.png"], "recipeYield": ["12", "12 cookies"], "prepTime": "PT15M", "cookTime": "PT15M", "totalTime": "PT30M", "recipeIngredient": ["¼ tsp baking soda", "1  large egg (room temperature)", "½ tsp kosher salt", "140 g all-purpose flour", "1 tsp vanilla extract or vanilla bean paste", "120 g unsalted butter (cold is acceptable)", "½ tsp espresso powder (optional)", "120 g dark or light brown sugar", "180 g chopped chocolate (such as 100g dark and 80g milk, plus extra for topping if desired)", "45 g granulated sugar", "¼ tsp baking powder"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the butter in a medium-sized saucepan set over medium heat. Allow it to melt completely, then continue cooking, swirling the pan often, until the butter foams and develops a golden brown hue with a nutty aroma—this should require about 3–4 minutes. Measure 95g of the browned butter into a mixing bowl and leave it to cool for 15–20 minutes to prevent scrambling the egg later. Once sufficiently cooled, whisk in the brown sugar and granulated sugar just until combined. Introduce the egg and whisk vigorously for 1–2 minutes, or use an electric mixer, until the mixture becomes paler and thickens. Blend in the vanilla extract thoroughly. Add the flour, salt, espresso powder if using, baking powder, and baking soda, then fold gently with a rubber spatula until faint flour streaks remain. Incorporate the chopped chocolate, folding to fully combine while finishing the flour integration. Line a quarter sheet pan or suitable container with parchment paper. Using a 2-tablespoon cookie scoop (approximately 55g per scoop), portion the dough and place the mounds close together on the parchment. Cover securely with plastic wrap or a lid and refrigerate for at least 30 minutes. About 10 minutes into chilling, preheat the oven to 350°F (180°C) and line two baking sheets with parchment. Arrange six dough balls on one prepared sheet. If preferred, gently flatten, press additional chocolate pieces on top, and roll back into balls, spacing them apart evenly. Bake for 11–13 minutes, until the edges are set and golden brown—bake closer to 11 minutes for a softer center or up to 13 for a firmer texture. Remove from the oven and, if desired, use a slightly larger cookie cutter to ‘scoot’ them into perfect rounds. Sprinkle with flaky sea salt if you wish. Allow the cookies to cool on the tray for 10–15 minutes before transferring to a wire rack. Repeat the process with the remaining dough. Store any leftover cookies in an airtight container at room temperature.", "name": "Place the butter in a medium-sized saucepan set over medium heat. Allow it to melt completely, then continue cooking, swirling the pan often, until the butter foams and develops a golden brown hue with a nutty aroma—this should require about 3–4 minutes. Measure 95g of the browned butter into a mixing bowl and leave it to cool for 15–20 minutes to prevent scrambling the egg later. Once sufficiently cooled, whisk in the brown sugar and granulated sugar just until combined. Introduce the egg and whisk vigorously for 1–2 minutes, or use an electric mixer, until the mixture becomes paler and thickens. Blend in the vanilla extract thoroughly. Add the flour, salt, espresso powder if using, baking powder, and baking soda, then fold gently with a rubber spatula until faint flour streaks remain. Incorporate the chopped chocolate, folding to fully combine while finishing the flour integration. Line a quarter sheet pan or suitable container with parchment paper. Using a 2-tablespoon cookie scoop (approximately 55g per scoop), portion the dough and place the mounds close together on the parchment. Cover securely with plastic wrap or a lid and refrigerate for at least 30 minutes. About 10 minutes into chilling, preheat the oven to 350°F (180°C) and line two baking sheets with parchment. Arrange six dough balls on one prepared sheet. If preferred, gently flatten, press additional chocolate pieces on top, and roll back into balls, spacing them apart evenly. Bake for 11–13 minutes, until the edges are set and golden brown—bake closer to 11 minutes for a softer center or up to 13 for a firmer texture. Remove from the oven and, if desired, use a slightly larger cookie cutter to ‘scoot’ them into perfect rounds. Sprinkle with flaky sea salt if you wish. Allow the cookies to cool on the tray for 10–15 minutes before transferring to a wire rack. Repeat the process with the remaining dough. Store any leftover cookies in an airtight container at room temperature.", "url": "https://erecip.github.io/en/small-batch-chocolate-chip-cookies-recipe/#wprm-recipe-49713-step-0-0"}], "recipeCategory": ["Cookies"], "recipeCuisine": ["American"], "keywords": "Small Batch Chocolate Chip Cookies Recipe"}</script>
