haking the pan periodically until the underside is golden. Flip and continue frying for another 2 to 4 minutes until browned but not burnt. Transfer tofu to the prepared surface to drain. Wipe the wok clean.", "name": "Set a paper towel-lined surface nearby. Heat a flat-bottomed wok over medium-high until it begins to smoke lightly. Add 3 tablespoons oil, swirling to coat the pan. Add the tofu in a single layer and cook for 3 to 5 minutes, shaking the pan periodically until the underside is golden. Flip and continue frying for another 2 to 4 minutes until browned but not burnt. Transfer tofu to the prepared surface to drain. Wipe the wok clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tofu-stir-fry-recipe/#wprm-recipe-13817-step-0-3"}, {"@type": "HowToStep", "text": "If working in batches due to wok size, repeat frying with remaining tofu.", "name": "If working in batches due to wok size, repeat frying with remaining tofu.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tofu-stir-fry-recipe/#wprm-recipe-13817-step-0-4"}, {"@type": "HowToStep", "text": "Return wok to high heat until smoking again, then pour in the remaining tablespoon of oil. Add chopped garlic and ginger, stir-frying for 20 to 30 seconds to release their aroma.", "name": "Return wok to high heat until smoking again, then pour in the remaining tablespoon of oil. Add chopped garlic and ginger, stir-frying for 20 to 30 seconds to release their aroma.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tofu-stir-fry-recipe/#wprm-recipe-13817-step-0-5"}, {"@type": "HowToStep", "text": "Introduce the vegetables to the wok, beginning with firm ones like carrots or broccoli, cooking for 1 to 2 minutes. Follow with softer vegetables, such as bell peppers, and cook an additional 1 to 1.5 minutes. Pour in the pre-mixed sauce and stir fry for 2 ½ minutes. Add any leafy vegetables like bok choy at the end, stir-frying for an extra 30 seconds until wilted.", "name": "Introduce the vegetables to the wok, beginning with firm ones like carrots or broccoli, cooking for 1 to 2 minutes. Follow with softer vegetables, such as bell peppers, and cook an additional 1 to 1.5 minutes. Pour in the pre-mixed sauce and stir fry for 2 ½ minutes. Add any leafy vegetables like bok choy at the end, stir-frying for an extra 30 seconds until wilted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tofu-stir-fry-recipe/#wprm-recipe-13817-step-0-6"}, {"@type": "HowToStep", "text": "Stir together the cornstarch and water mixture, add it to the wok, and stir until the sauce thickens and glistens.", "name": "Stir together the cornstarch and water mixture, add it to the wok, and stir until the sauce thickens and glistens.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tofu-stir-fry-recipe/#wprm-recipe-13817-step-0-7"}, {"@type": "HowToStep", "text": "Remove from heat. Add tofu back into the wok along with chopped cilantro, sesame seeds, and sesame oil. Toss thoroughly to coat all ingredients.", "name": "Remove from heat. Add tofu back into the wok along with chopped cilantro, sesame seeds, and sesame oil. Toss thoroughly to coat all ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tofu-stir-fry-recipe/#wprm-recipe-13817-step-0-8"}, {"@type": "HowToStep", "text": "Serve hot over cooked rice.", "name": "Serve hot over cooked rice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tofu-stir-fry-recipe/#wprm-recipe-13817-step-0-9"}], "recipeCategory": ["Dinner"], "recipeCuisine": ["Chinese"], "keywords": "Tofu Stir Fry Recipe"}</script>
