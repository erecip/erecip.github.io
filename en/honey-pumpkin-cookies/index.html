    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Honey Pumpkin Cookies", "author": {"@type": "Person", "name": "BenDes"}, "description": "These soft, chewy pumpkin cookies combine deeply browned butter, floral honey, dark brown sugar, and warming pumpkin pie spice. A cinnamon-sugar coating creates a delicately crisp exterior, while the pan-tapping technique produces attractive cracks and an exceptionally chewy texture.", "datePublished": "2023-08-05T04:32:20+00:00", "image": ["https://erecip.github.io/en/honey-pumpkin-cookies/honey-pumpkin-cookies2.png", "https://erecip.github.io/en/honey-pumpkin-cookies/honey-pumpkin-cookies2.png", "https://erecip.github.io/en/honey-pumpkin-cookies/honey-pumpkin-cookies2.png", "https://erecip.github.io/en/honey-pumpkin-cookies/honey-pumpkin-cookies2.png"], "prepTime": "PT20M", "cookTime": "PT10M", "totalTime": "PT60M", "recipeIngredient": ["⅓ cup pure pumpkin purée (not pumpkin pie filling)", "1 teaspoon fine-grain kosher salt", "1  large egg yolk", "2 teaspoons pumpkin pie spice", "1 cup salted butter (softened to approximately 70°F)", "3 tablespoons honey", "1 teaspoon baking soda", "2¼ cups all-purpose flour (such as King Arthur)", "1 teaspoon vanilla extract (such as Nielsen-Massey)", "1½ cups firmly packed dark brown sugar", "1 teaspoon ground cinnamon (preferably freshly ground)", "¼ cup granulated white sugar", "Flaked sea salt (as desired)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the salted butter in a large saucepan and melt it over medium-low heat.", "name": "Place the salted butter in a large saucepan and melt it over medium-low heat.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-0"}, {"@type": "HowToStep", "text": "Continue cooking while stirring constantly until the butter develops a deep amber hue and a distinctly nutty aroma, approximately 5 minutes.", "name": "Continue cooking while stirring constantly until the butter develops a deep amber hue and a distinctly nutty aroma, approximately 5 minutes.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-1"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat and allow the browned butter to cool for 30 minutes.", "name": "Remove the saucepan from the heat and allow the browned butter to cool for 30 minutes.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-2"}, {"@type": "HowToStep", "text": "While the butter cools, place the honey and kosher salt in a small bowl.", "name": "While the butter cools, place the honey and kosher salt in a small bowl.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-3"}, {"@type": "HowToStep", "text": "Stir thoroughly until the salt is evenly dissolved throughout the honey. Set the mixture aside.", "name": "Stir thoroughly until the salt is evenly dissolved throughout the honey. Set the mixture aside.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-4"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F (175°C).", "name": "Preheat the oven to 350°F (175°C).", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-5"}, {"@type": "HowToStep", "text": "Line a baking sheet with parchment paper and reserve it for the shaped cookie dough.", "name": "Line a baking sheet with parchment paper and reserve it for the shaped cookie dough.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-6"}, {"@type": "HowToStep", "text": "Once the browned butter has cooled, add the packed dark brown sugar and the prepared honey-salt mixture to the saucepan.", "name": "Once the browned butter has cooled, add the packed dark brown sugar and the prepared honey-salt mixture to the saucepan.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-7"}, {"@type": "HowToStep", "text": "Blend thoroughly with a rubber spatula, scraping the bottom of the pan to incorporate all of the browned butter solids.", "name": "Blend thoroughly with a rubber spatula, scraping the bottom of the pan to incorporate all of the browned butter solids.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-8"}, {"@type": "HowToStep", "text": "Add the egg yolk, vanilla extract, pumpkin purée, baking soda, and pumpkin pie spice. Stir until the mixture is smooth and uniform.", "name": "Add the egg yolk, vanilla extract, pumpkin purée, baking soda, and pumpkin pie spice. Stir until the mixture is smooth and uniform.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-9"}, {"@type": "HowToStep", "text": "Fold in the all-purpose flour until no dry streaks remain and a cohesive cookie dough forms.", "name": "Fold in the all-purpose flour until no dry streaks remain and a cohesive cookie dough forms.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-10"}, {"@type": "HowToStep", "text": "Coat every dough ball evenly in the cinnamon-sugar mixture.", "name": "Coat every dough ball evenly in the cinnamon-sugar mixture.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-11"}, {"@type": "HowToStep", "text": "Arrange the coated portions on the parchment-lined baking sheet, leaving approximately 3 inches of space between them.", "name": "Arrange the coated portions on the parchment-lined baking sheet, leaving approximately 3 inches of space between them.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-12"}, {"@type": "HowToStep", "text": "Bake for 9–11 minutes, or until the cookie edges become golden.", "name": "Bake for 9–11 minutes, or until the cookie edges become golden.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-13"}, {"@type": "HowToStep", "text": "Immediately after removing the cookies from the oven, firmly strike the baking sheet against the stovetop five times. This action encourages the tops to crack and helps create a chewier finished texture.", "name": "Immediately after removing the cookies from the oven, firmly strike the baking sheet against the stovetop five times. This action encourages the tops to crack and helps create a chewier finished texture.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-14"}, {"@type": "HowToStep", "text": "Leave the cookies on the baking sheet for 5 minutes.", "name": "Leave the cookies on the baking sheet for 5 minutes.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-15"}, {"@type": "HowToStep", "text": "Transfer them to a wire cooling rack and allow them to cool completely.", "name": "Transfer them to a wire cooling rack and allow them to cool completely.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-16"}, {"@type": "HowToStep", "text": "Finish with a light sprinkling of flaked sea salt, if desired.", "name": "Finish with a light sprinkling of flaked sea salt, if desired.", "url": "https://erecip.github.io/en/honey-pumpkin-cookies/#wprm-recipe-40001-step-0-17"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Honey Pumpkin Cookies"}</script>
