    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sweet Air Fryer Churro Bites Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "These sweet air fryer churro bites deliver the classic cinnamon-sugar charm of traditional churros in a lighter, bite-sized form. The dough is cooked briefly on the stovetop, blended until smooth, then piped or spooned into an air fryer and finished with a fragrant cinnamon sugar coating.", "datePublished": "2023-02-26T13:22:48+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/Sweet-Air-Fryer-Churro-Bites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/Sweet-Air-Fryer-Churro-Bites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/Sweet-Air-Fryer-Churro-Bites2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/Sweet-Air-Fryer-Churro-Bites2.png"], "prepTime": "PT15M", "cookTime": "PT10M", "totalTime": "PT30M", "recipeIngredient": ["1 cup plain flour or all-purpose flour", "1  large egg", "1 cup water", "1 teaspoon vanilla essence", "1 teaspoon salt", "2 tablespoons sugar", "1/3 cup plus 1 tablespoon unsalted butter", "1 tablespoon ground cinnamon (freshly ground if available)", "1 cup white sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the water, unsalted butter, salt, and sugar into a saucepan. Set the pan over high heat and bring the mixture to a full boil.", "name": "Place the water, unsalted butter, salt, and sugar into a saucepan. Set the pan over high heat and bring the mixture to a full boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-0"}, {"@type": "HowToStep", "text": "Once the liquid is boiling, lower the heat and add the flour gradually while stirring continuously. Continue mixing until the dough pulls together into a smooth, cohesive mass.", "name": "Once the liquid is boiling, lower the heat and add the flour gradually while stirring continuously. Continue mixing until the dough pulls together into a smooth, cohesive mass.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-1"}, {"@type": "HowToStep", "text": "Switch off the heat and remove the saucepan from the stovetop.", "name": "Switch off the heat and remove the saucepan from the stovetop.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the warm dough into a large mixing bowl and allow it to cool for approximately 4–5 minutes.", "name": "Transfer the warm dough into a large mixing bowl and allow it to cool for approximately 4–5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-3"}, {"@type": "HowToStep", "text": "Add the egg and vanilla essence to the slightly cooled dough. Using an electric hand mixer, beat the mixture thoroughly until it becomes smooth and evenly combined.", "name": "Add the egg and vanilla essence to the slightly cooled dough. Using an electric hand mixer, beat the mixture thoroughly until it becomes smooth and evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-4"}, {"@type": "HowToStep", "text": "Spoon the prepared churro dough into a piping bag.", "name": "Spoon the prepared churro dough into a piping bag.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-5"}, {"@type": "HowToStep", "text": "Preheat the air fryer to 375°F / 190°C.", "name": "Preheat the air fryer to 375°F / 190°C.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-6"}, {"@type": "HowToStep", "text": "Coat the air fryer basket lightly with a neutral nonstick cooking spray, such as coconut oil spray.", "name": "Coat the air fryer basket lightly with a neutral nonstick cooking spray, such as coconut oil spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-7"}, {"@type": "HowToStep", "text": "Pipe small bite-sized portions of dough into the basket, leaving enough space between each piece so they cook evenly. The dough may also be dropped into the basket by spoonfuls for a more rustic shape.", "name": "Pipe small bite-sized portions of dough into the basket, leaving enough space between each piece so they cook evenly. The dough may also be dropped into the basket by spoonfuls for a more rustic shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-8"}, {"@type": "HowToStep", "text": "Lightly brush the tops of the churro bites with butter.", "name": "Lightly brush the tops of the churro bites with butter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-9"}, {"@type": "HowToStep", "text": "Air fry the churro bites for 10–12 minutes, or until they are golden brown. Cook in multiple batches as needed, depending on the size of the air fryer basket.", "name": "Air fry the churro bites for 10–12 minutes, or until they are golden brown. Cook in multiple batches as needed, depending on the size of the air fryer basket.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-10"}, {"@type": "HowToStep", "text": "In a shallow bowl, combine the white sugar and ground cinnamon until evenly blended.", "name": "In a shallow bowl, combine the white sugar and ground cinnamon until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-11"}, {"@type": "HowToStep", "text": "Transfer the freshly cooked churro bites directly into the cinnamon sugar mixture and toss gently until fully coated.", "name": "Transfer the freshly cooked churro bites directly into the cinnamon sugar mixture and toss gently until fully coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-12"}, {"@type": "HowToStep", "text": "For better coating adhesion, lightly brush the churro bites with melted butter, or mist them with water or nonstick cooking spray, before rolling them in the cinnamon sugar mixture.", "name": "For better coating adhesion, lightly brush the churro bites with melted butter, or mist them with water or nonstick cooking spray, before rolling them in the cinnamon sugar mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-13"}, {"@type": "HowToStep", "text": "Serve the churro bites warm with chocolate syrup, honey, Nutella, or another preferred sweet dipping sauce.", "name": "Serve the churro bites warm with chocolate syrup, honey, Nutella, or another preferred sweet dipping sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-air-fryer-churro-bites-recipe/#wprm-recipe-38435-step-0-14"}], "recipeCategory": ["Dessert", "Snack"], "recipeCuisine": ["Spanish-Inspired"], "keywords": "Sweet Air Fryer Churro Bites Recipe"}</script>
