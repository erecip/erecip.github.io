    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Dutch Apple Pie", "author": {"@type": "Person", "name": "BenDes"}, "description": "A classic Dutch apple pie featuring a flaky single-crust pastry filled with warmly spiced apples and finished with a generous buttery brown sugar crumble. Precooking and thoroughly cooling the apple mixture helps the filling maintain its structure, while the staged baking process produces a crisp, golden topping.", "datePublished": "2022-10-08T10:52:07+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/dutch-apple-pie2.png", "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/dutch-apple-pie2.png", "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/dutch-apple-pie2.png", "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/dutch-apple-pie2.png"], "prepTime": "PT45M", "cookTime": "PT50M", "totalTime": "PT335M", "recipeIngredient": ["1  homemade single-crust pie dough (thawed if previously frozen)", "5 pounds apples (preferably a combination of Granny Smith and Honeycrisp, peeled, cored, and cut into 1/4-inch slices)", "1 teaspoon vanilla extract", "1/2 cup firmly packed brown sugar", "2 tablespoons fresh lemon juice (approximately the juice from 1/2 lemon)", "1 1/2 teaspoons ground cinnamon (preferably freshly ground)", "1/3 cup all-purpose flour (such as King Arthur)", "3/4 teaspoon ground nutmeg", "1/2 teaspoon kosher salt", "1/2 cup granulated sugar", "1/4 teaspoon finely grated fresh lemon zest", "1/2 teaspoon ground cardamom (optional)", "3/4 cup unsalted butter (melted; Kerrygold may be used for a particularly rich flavor)", "1 1/2 cups all-purpose flour", "3/4 cup firmly packed brown sugar", "1/2 teaspoon kosher salt", "1/3 cup granulated sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the dough and crumble.", "name": "Prepare the dough and crumble.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-0"}, {"@type": "HowToStep", "text": "If the pie dough is frozen, remove it from the freezer and allow it to thaw as needed.", "name": "If the pie dough is frozen, remove it from the freezer and allow it to thaw as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-1"}, {"@type": "HowToStep", "text": "Combine the 1 1/2 cups flour, 1/3 cup granulated sugar, 3/4 cup packed brown sugar, and 1/2 teaspoon kosher salt in a mixing bowl. Pour the melted butter over the dry ingredients and blend with a fork until coarse crumbs form, leaving some pieces approximately the size of peas.", "name": "Combine the 1 1/2 cups flour, 1/3 cup granulated sugar, 3/4 cup packed brown sugar, and 1/2 teaspoon kosher salt in a mixing bowl. Pour the melted butter over the dry ingredients and blend with a fork until coarse crumbs form, leaving some pieces approximately the size of peas.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-2"}, {"@type": "HowToStep", "text": "Refrigerate the prepared crumble while completing the remaining components.", "name": "Refrigerate the prepared crumble while completing the remaining components.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-3"}, {"@type": "HowToStep", "text": "Prepare and cook the apple filling.", "name": "Prepare and cook the apple filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-4"}, {"@type": "HowToStep", "text": "Place the lemon zest and lemon juice in a large skillet over medium heat and warm them for approximately 30 seconds.", "name": "Place the lemon zest and lemon juice in a large skillet over medium heat and warm them for approximately 30 seconds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-5"}, {"@type": "HowToStep", "text": "Meanwhile, peel, core, and slice the apples to roughly 1/4-inch thickness, working efficiently to limit browning. Transfer the prepared apples to the skillet and toss them with the warmed lemon mixture.", "name": "Meanwhile, peel, core, and slice the apples to roughly 1/4-inch thickness, working efficiently to limit browning. Transfer the prepared apples to the skillet and toss them with the warmed lemon mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-6"}, {"@type": "HowToStep", "text": "Add the packed brown sugar, granulated sugar, 1/3 cup flour, kosher salt, cinnamon, nutmeg, and optional cardamom. Stir gently until the apples are evenly coated.", "name": "Add the packed brown sugar, granulated sugar, 1/3 cup flour, kosher salt, cinnamon, nutmeg, and optional cardamom. Stir gently until the apples are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-7"}, {"@type": "HowToStep", "text": "Cover the skillet and cook over medium heat for about 20 minutes, stirring frequently. The apples should become tender while retaining their shape.", "name": "Cover the skillet and cook over medium heat for about 20 minutes, stirring frequently. The apples should become tender while retaining their shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-8"}, {"@type": "HowToStep", "text": "Take the skillet off the heat and stir in the vanilla extract.", "name": "Take the skillet off the heat and stir in the vanilla extract.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-9"}, {"@type": "HowToStep", "text": "Spread the cooked apple mixture over a sheet pan. Refrigerate it for a minimum of 2 hours, or place it in the freezer for 30 minutes, until completely cooled.", "name": "Spread the cooked apple mixture over a sheet pan. Refrigerate it for a minimum of 2 hours, or place it in the freezer for 30 minutes, until completely cooled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-10"}, {"@type": "HowToStep", "text": "Shape and chill the crust.", "name": "Shape and chill the crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-11"}, {"@type": "HowToStep", "text": "On a lightly floured work surface, roll the thawed pie dough to approximately 1/8-inch thickness. Make the round large enough to line a 9-inch pie plate with a small amount of dough extending beyond the rim.", "name": "On a lightly floured work surface, roll the thawed pie dough to approximately 1/8-inch thickness. Make the round large enough to line a 9-inch pie plate with a small amount of dough extending beyond the rim.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-12"}, {"@type": "HowToStep", "text": "Carefully position the pastry in the pie dish and press it lightly against the bottom and sides without stretching it. Trim away unnecessary excess and crimp the perimeter decoratively if desired.", "name": "Carefully position the pastry in the pie dish and press it lightly against the bottom and sides without stretching it. Trim away unnecessary excess and crimp the perimeter decoratively if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-13"}, {"@type": "HowToStep", "text": "Refrigerate the pastry-lined pie dish for 30 minutes. This resting period allows the dough to chill and the gluten to relax, helping minimize shrinkage during baking.", "name": "Refrigerate the pastry-lined pie dish for 30 minutes. This resting period allows the dough to chill and the gluten to relax, helping minimize shrinkage during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-14"}, {"@type": "HowToStep", "text": "Assemble the pie and begin baking.", "name": "Assemble the pie and begin baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-15"}, {"@type": "HowToStep", "text": "Preheat the oven to 425°F. Position a baking sheet on the lowest oven rack to collect any possible drips.", "name": "Preheat the oven to 425°F. Position a baking sheet on the lowest oven rack to collect any possible drips.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-16"}, {"@type": "HowToStep", "text": "Remove the chilled crust from the refrigerator and spoon the fully cooled apple filling into it, distributing the apples evenly.", "name": "Remove the chilled crust from the refrigerator and spoon the fully cooled apple filling into it, distributing the apples evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-17"}, {"@type": "HowToStep", "text": "Take the crumble from the refrigerator and scatter approximately 1 to 2 cups over the apples, reserving about 1 cup for a later stage. At this point, some of the filling should remain visible.", "name": "Take the crumble from the refrigerator and scatter approximately 1 to 2 cups over the apples, reserving about 1 cup for a later stage. At this point, some of the filling should remain visible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-18"}, {"@type": "HowToStep", "text": "Place the pie on the middle oven rack and bake at 425°F for 15 minutes, allowing the crust to begin setting.", "name": "Place the pie on the middle oven rack and bake at 425°F for 15 minutes, allowing the crust to begin setting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-19"}, {"@type": "HowToStep", "text": "Lower the baking temperature.", "name": "Lower the baking temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-20"}, {"@type": "HowToStep", "text": "After the first 15 minutes, reduce the oven temperature to 350°F without removing the pie. Continue baking for another 10 minutes. The lower temperature allows the filling to continue cooking without causing the crumble to brown excessively.", "name": "After the first 15 minutes, reduce the oven temperature to 350°F without removing the pie. Continue baking for another 10 minutes. The lower temperature allows the filling to continue cooking without causing the crumble to brown excessively.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-21"}, {"@type": "HowToStep", "text": "Add the remaining crumble and finish baking.", "name": "Add the remaining crumble and finish baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-22"}, {"@type": "HowToStep", "text": "Remove the pie from the oven. Carefully distribute the reserved crumble over any exposed sections of apple filling so the surface is completely and evenly covered.", "name": "Remove the pie from the oven. Carefully distribute the reserved crumble over any exposed sections of apple filling so the surface is completely and evenly covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-23"}, {"@type": "HowToStep", "text": "Protect the outer crust with foil, then return the pie to the 350°F oven. Bake for an additional 25 to 35 minutes, or until the crumble is golden brown and the apple filling shows slight bubbling around the edges.", "name": "Protect the outer crust with foil, then return the pie to the 350°F oven. Bake for an additional 25 to 35 minutes, or until the crumble is golden brown and the apple filling shows slight bubbling around the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-24"}, {"@type": "HowToStep", "text": "For a deeper golden finish, the protective foil may be removed during the final 5 to 10 minutes, while monitoring the crust carefully to prevent excessive browning.", "name": "For a deeper golden finish, the protective foil may be removed during the final 5 to 10 minutes, while monitoring the crust carefully to prevent excessive browning.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-25"}, {"@type": "HowToStep", "text": "Cool before serving.", "name": "Cool before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-26"}, {"@type": "HowToStep", "text": "Transfer the finished pie to a wire cooling rack and allow it to stand for at least 4 hours before cutting. This extended cooling period gives the filling sufficient time to set and helps produce clean slices.", "name": "Transfer the finished pie to a wire cooling rack and allow it to stand for at least 4 hours before cutting. This extended cooling period gives the filling sufficient time to set and helps produce clean slices.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-27"}, {"@type": "HowToStep", "text": "Serve the pie at room temperature or slightly warmed. Vanilla ice cream or whipped cream may accompany each serving.", "name": "Serve the pie at room temperature or slightly warmed. Vanilla ice cream or whipped cream may accompany each serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/dutch-apple-pie/#wprm-recipe-43587-step-0-28"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Dutch Apple Pie"}</script>
