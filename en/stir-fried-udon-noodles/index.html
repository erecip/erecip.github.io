ditional sliced green onions. Serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/stir-fried-udon-noodles/#wprm-recipe-40970-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Japanese"], "keywords": "Stir-Fried Udon Noodles"}</script>
