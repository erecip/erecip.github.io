    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Focaccia Genovese", "author": {"@type": "Person", "name": "BenDes"}, "description": "A traditional Ligurian-style focaccia distinguished by its tender, airy crumb, golden surface, and characteristic deep dimples filled with an olive oil and salt brine. The dough is enriched with olive oil, malt, and lard for a supple texture and authentic flavor.", "datePublished": "2018-06-16T21:48:35+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/focaccia-genovese.png", "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/focaccia-genovese.png", "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/focaccia-genovese.png", "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/focaccia-genovese.png"], "prepTime": "PT35M", "cookTime": "PT15M", "totalTime": "PT255M", "recipeIngredient": ["12 ounces water", "½ ounce dry malt (or 1 ounce liquid malt)", "2 teaspoons fine salt", "2 tablespoons extra-virgin olive oil", "19 ounces high-protein bread flour or strong Tipo 00 flour (preferably W 320)", "1 ounce lard (ideally Lardo di Colonnata di Cinta Senese)", "2 teaspoons active dry yeast", "2 ounces extra-virgin olive oil (divided between the baking trays)", "1 teaspoon fine salt", "Slightly less than ½ cup water"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the flour, active dry yeast, and dry malt in a large mixing bowl or the bowl of a stand mixer. If using liquid malt, reserve it to add with the water. Stir thoroughly so the yeast and malt are distributed evenly throughout the flour.", "name": "Place the flour, active dry yeast, and dry malt in a large mixing bowl or the bowl of a stand mixer. If using liquid malt, reserve it to add with the water. Stir thoroughly so the yeast and malt are distributed evenly throughout the flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-0"}, {"@type": "HowToStep", "text": "Gradually pour in the 12 ounces of water while mixing by hand or with the paddle attachment of a stand mixer. Add the liquid malt at this stage when substituting it for dry malt.", "name": "Gradually pour in the 12 ounces of water while mixing by hand or with the paddle attachment of a stand mixer. Add the liquid malt at this stage when substituting it for dry malt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-1"}, {"@type": "HowToStep", "text": "Continue mixing until a cohesive dough begins to form. Add the extra-virgin olive oil and work it into the dough until fully incorporated.", "name": "Continue mixing until a cohesive dough begins to form. Add the extra-virgin olive oil and work it into the dough until fully incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-2"}, {"@type": "HowToStep", "text": "Add the lard and mix until it is completely absorbed and no visible pieces remain.", "name": "Add the lard and mix until it is completely absorbed and no visible pieces remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-3"}, {"@type": "HowToStep", "text": "Lastly, incorporate the fine salt. Continue mixing until the salt has dissolved into the dough. Adding the salt at the end prevents it from interfering with the initial activity of the yeast.", "name": "Lastly, incorporate the fine salt. Continue mixing until the salt has dissolved into the dough. Adding the salt at the end prevents it from interfering with the initial activity of the yeast.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-4"}, {"@type": "HowToStep", "text": "Knead the dough until it becomes smooth, soft, and elastic. With a stand mixer, change to the dough hook and knead on low speed, approximately setting 2, for about 10 minutes.", "name": "Knead the dough until it becomes smooth, soft, and elastic. With a stand mixer, change to the dough hook and knead on low speed, approximately setting 2, for about 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-5"}, {"@type": "HowToStep", "text": "When kneading by hand, transfer the dough to a lightly floured surface and work it for approximately 15 minutes, or until supple and uniform.", "name": "When kneading by hand, transfer the dough to a lightly floured surface and work it for approximately 15 minutes, or until supple and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-6"}, {"@type": "HowToStep", "text": "Cover the dough and leave it undisturbed for 10 minutes to allow the gluten to relax.", "name": "Cover the dough and leave it undisturbed for 10 minutes to allow the gluten to relax.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-7"}, {"@type": "HowToStep", "text": "Knead it again for approximately 3 minutes, forming a smoother and more even ball. Finish with a gentle stretch and fold to strengthen the dough structure.", "name": "Knead it again for approximately 3 minutes, forming a smoother and more even ball. Finish with a gentle stretch and fold to strengthen the dough structure.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-8"}, {"@type": "HowToStep", "text": "Gently stretch the dough, fold it over itself, and shape it into a firm, rounded ball.", "name": "Gently stretch the dough, fold it over itself, and shape it into a firm, rounded ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-9"}, {"@type": "HowToStep", "text": "Cover it with an inverted bowl or a clean kitchen towel and let it rest on the work surface for 30 minutes.", "name": "Cover it with an inverted bowl or a clean kitchen towel and let it rest on the work surface for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-10"}, {"@type": "HowToStep", "text": "Divide the dough into two equal portions, each weighing approximately 500 grams. Lightly stretch each portion, roll it into shape, and pinch the seam closed.", "name": "Divide the dough into two equal portions, each weighing approximately 500 grams. Lightly stretch each portion, roll it into shape, and pinch the seam closed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-11"}, {"@type": "HowToStep", "text": "Position the dough pieces seam-side down, cover them, and allow them to rest for another 30 minutes.", "name": "Position the dough pieces seam-side down, cover them, and allow them to rest for another 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-12"}, {"@type": "HowToStep", "text": "Dust the work surface and dough lightly with flour. Using a rolling pin, carefully extend each portion until it is close to the dimensions of its baking tray.", "name": "Dust the work surface and dough lightly with flour. Using a rolling pin, carefully extend each portion until it is close to the dimensions of its baking tray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-13"}, {"@type": "HowToStep", "text": "Coat the trays lightly with some of the measured olive oil. Transfer the dough to the prepared trays and gently adjust each piece so it fits the pan.", "name": "Coat the trays lightly with some of the measured olive oil. Transfer the dough to the prepared trays and gently adjust each piece so it fits the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-14"}, {"@type": "HowToStep", "text": "Apply a light dusting of flour to the surface, cover the trays, and rest the dough for 30 minutes. This resting period allows the gluten to relax before the final shaping.", "name": "Apply a light dusting of flour to the surface, cover the trays, and rest the dough for 30 minutes. This resting period allows the gluten to relax before the final shaping.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-15"}, {"@type": "HowToStep", "text": "Keep the dough covered in the trays and allow it to proof for an additional 1 hour.", "name": "Keep the dough covered in the trays and allow it to proof for an additional 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-16"}, {"@type": "HowToStep", "text": "While it proofs, dissolve 1 teaspoon of fine salt in slightly less than ½ cup of water to prepare the brine.", "name": "While it proofs, dissolve 1 teaspoon of fine salt in slightly less than ½ cup of water to prepare the brine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-17"}, {"@type": "HowToStep", "text": "Remove the coverings. Press firmly into the dough with your fingertips to create deep, evenly spaced indentations, gently stretching the dough outward as you work.", "name": "Remove the coverings. Press firmly into the dough with your fingertips to create deep, evenly spaced indentations, gently stretching the dough outward as you work.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-18"}, {"@type": "HowToStep", "text": "Carefully pierce any unusually large air pockets with a toothpick or thin cake tester.", "name": "Carefully pierce any unusually large air pockets with a toothpick or thin cake tester.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-19"}, {"@type": "HowToStep", "text": "Pour the 2 ounces of extra-virgin olive oil over the dough, dividing it equally between the two trays. Pour half of the prepared brine onto each focaccia.", "name": "Pour the 2 ounces of extra-virgin olive oil over the dough, dividing it equally between the two trays. Pour half of the prepared brine onto each focaccia.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-20"}, {"@type": "HowToStep", "text": "Use your hands to spread the oil and salted water evenly across the entire surface, ensuring that the liquid settles into the deep dimples.", "name": "Use your hands to spread the oil and salted water evenly across the entire surface, ensuring that the liquid settles into the deep dimples.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-21"}, {"@type": "HowToStep", "text": "Leave the trays uncovered and allow the dough to complete its final proof for 45 minutes.", "name": "Leave the trays uncovered and allow the dough to complete its final proof for 45 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-22"}, {"@type": "HowToStep", "text": "Preheat a conventional, non-fan oven to 450°F (230°C).", "name": "Preheat a conventional, non-fan oven to 450°F (230°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-23"}, {"@type": "HowToStep", "text": "Add thinly sliced onions, olives, or other desired toppings before baking, when using them.", "name": "Add thinly sliced onions, olives, or other desired toppings before baking, when using them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-24"}, {"@type": "HowToStep", "text": "Place the trays in the lower third of the oven. Alternatively, position them directly on a preheated pizza stone.", "name": "Place the trays in the lower third of the oven. Alternatively, position them directly on a preheated pizza stone.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-25"}, {"@type": "HowToStep", "text": "Bake for 15 minutes, taking care not to exceed the stated baking time.", "name": "Bake for 15 minutes, taking care not to exceed the stated baking time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-26"}, {"@type": "HowToStep", "text": "Remove the focaccia from the oven and let it cool briefly before slicing and serving.", "name": "Remove the focaccia from the oven and let it cool briefly before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/focaccia-genovese/#wprm-recipe-39373-step-0-27"}], "recipeCategory": ["Bread"], "recipeCuisine": ["Italian"], "keywords": "Focaccia Genovese"}</script>
