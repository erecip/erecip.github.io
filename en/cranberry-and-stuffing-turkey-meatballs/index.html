d bake for 18–20 minutes, or until the turkey meatballs are fully cooked and lightly browned. Remove the tray from the oven and allow the meatballs to cool briefly while the glaze is prepared.", "url": "https://erecip.github.io/en/cranberry-and-stuffing-turkey-meatballs/#wprm-recipe-46077-step-0-3"}, {"@type": "HowToStep", "text": "Combine the glaze ingredients. Add the cranberry sauce, orange juice, brown sugar or maple syrup, cornstarch-and-water slurry, 1 teaspoon dried rosemary, and ground cinnamon to a medium saucepan. Whisk until thoroughly combined.", "name": "Combine the glaze ingredients. Add the cranberry sauce, orange juice, brown sugar or maple syrup, cornstarch-and-water slurry, 1 teaspoon dried rosemary, and ground cinnamon to a medium saucepan. Whisk until thoroughly combined.", "url": "https://erecip.github.io/en/cranberry-and-stuffing-turkey-meatballs/#wprm-recipe-46077-step-0-4"}, {"@type": "HowToStep", "text": "Cook and thicken the glaze. Set the saucepan over medium heat and bring the cranberry mixture to a boil, whisking frequently. Allow it to boil for approximately 60 seconds, until thickening begins. Reduce the heat and simmer for another 2–3 minutes, stirring regularly, until the sauce develops a thick, glossy consistency.", "name": "Cook and thicken the glaze. Set the saucepan over medium heat and bring the cranberry mixture to a boil, whisking frequently. Allow it to boil for approximately 60 seconds, until thickening begins. Reduce the heat and simmer for another 2–3 minutes, stirring regularly, until the sauce develops a thick, glossy consistency.", "url": "https://erecip.github.io/en/cranberry-and-stuffing-turkey-meatballs/#wprm-recipe-46077-step-0-5"}, {"@type": "HowToStep", "text": "Coat or serve the meatballs. Add the baked turkey meatballs to the warm cranberry-orange glaze and gently toss until evenly coated. Alternatively, serve the meatballs warm with the glaze alongside for dipping.", "name": "Coat or serve the meatballs. Add th
