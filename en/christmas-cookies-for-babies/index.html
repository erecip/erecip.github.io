    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies for Babies", "author": {"@type": "Person", "name": "BenDes"}, "description": "A soft, naturally sweetened banana cookie made without added sugar. These simple Christmas cut-out cookies combine ripe bananas, butter, vanilla, flour, and baking powder for a gently flavored treat that can be shaped with festive cookie cutters.", "datePublished": "2019-04-24T15:21:10+00:00", "image": ["https://erecip.github.io/en/christmas-cookies-for-babies/christmas-cookies-for-babies1.png", "https://erecip.github.io/en/christmas-cookies-for-babies/christmas-cookies-for-babies1.png", "https://erecip.github.io/en/christmas-cookies-for-babies/christmas-cookies-for-babies1.png", "https://erecip.github.io/en/christmas-cookies-for-babies/christmas-cookies-for-babies1.png"], "totalTime": "PT85M", "recipeIngredient": ["2 cups 260 g all-purpose flour", "2  fully ripened bananas (thoroughly mashed with a fork)", "1/2 cup 115 g unsalted butter, softened to room temperature", "1 teaspoon baking powder", "Seeds scraped from 1 vanilla bean (or 1 teaspoon vanilla extract)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven. Set the oven to 347°F (175°C) and allow it to heat fully while the cookie mixture is prepared.", "name": "Preheat the oven. Set the oven to 347°F (175°C) and allow it to heat fully while the cookie mixture is prepared.", "url": "https://erecip.github.io/en/christmas-cookies-for-babies/#wprm-recipe-43773-step-0-0"}, {"@type": "HowToStep", "text": "Prepare the banana mixture. Mash the ripe bananas in a mixing bowl until they have a smooth, even consistency.", "name": "Prepare the banana mixture. Mash the ripe bananas in a mixing bowl until they have a smooth, even consistency.", "url": "https://erecip.github.io/en/christmas-cookies-for-babies/#wprm-recipe-43773-step-0-1"}, {"@type": "HowToStep", "text": "Add the butter. Place the softened unsalted butter into the mashed banana and mix thoroughly until the two ingredients are well incorporated.", "name": "Add the butter. Place the softened unsalted butter into the mashed banana and mix thoroughly until the two ingredients are well incorporated.", "url": "https://erecip.github.io/en/christmas-cookies-for-babies/#wprm-recipe-43773-step-0-2"}, {"@type": "HowToStep", "text": "Form the dough. Gradually work the flour and baking powder into the banana-butter mixture. Add the scraped vanilla bean seeds, or the vanilla extract if using, and knead everything together until a smooth, uniform dough develops.", "name": "Form the dough. Gradually work the flour and baking powder into the banana-butter mixture. Add the scraped vanilla bean seeds, or the vanilla extract if using, and knead everything together until a smooth, uniform dough develops.", "url": "https://erecip.github.io/en/christmas-cookies-for-babies/#wprm-recipe-43773-step-0-3"}, {"@type": "HowToStep", "text": "Chill the dough. Enclose the prepared dough in plastic wrap and refrigerate it for approximately 1 hour. Chilling firms the mixture and makes it easier to roll and shape.", "name": "Chill the dough. Enclose the prepared dough in plastic wrap and refrigerate it for approximately 1 hour. Chilling firms the mixture and makes it easier to roll and shape.", "url": "https://erecip.github.io/en/christmas-cookies-for-babies/#wprm-recipe-43773-step-0-4"}, {"@type": "HowToStep", "text": "Roll and shape. Lightly flour a clean work surface as well as the surface of the chilled dough. Roll it out to the preferred thickness, keeping in mind that the cookies will approximately double in thickness during baking.", "name": "Roll and shape. Lightly flour a clean work surface as well as the surface of the chilled dough. Roll it out to the preferred thickness, keeping in mind that the cookies will approximately double in thickness during baking.", "url": "https://erecip.github.io/en/christmas-cookies-for-babies/#wprm-recipe-43773-step-0-5"}, {"@type": "HowToStep", "text": "Cut the cookies. Press Christmas-themed or other desired cookie cutters into the rolled dough and carefully transfer the shapes to a baking tray, leaving a little space between each cookie.", "name": "Cut the cookies. Press Christmas-themed or other desired cookie cutters into the rolled dough and carefully transfer the shapes to a baking tray, leaving a little space between each cookie.", "url": "https://erecip.github.io/en/christmas-cookies-for-babies/#wprm-recipe-43773-step-0-6"}, {"@type": "HowToStep", "text": "Bake. Place the tray in the preheated oven and bake for approximately 10 minutes, or until the edges of the cookies develop a light golden-brown color.", "name": "Bake. Place the tray in the preheated oven and bake for approximately 10 minutes, or until the edges of the cookies develop a light golden-brown color.", "url": "https://erecip.github.io/en/christmas-cookies-for-babies/#wprm-recipe-43773-step-0-7"}, {"@type": "HowToStep", "text": "Cool completely. Allow the cookies to rest briefly on the baking tray before moving them to a wire rack to finish cooling.", "name": "Cool completely. Allow the cookies to rest briefly on the baking tray before moving them to a wire rack to finish cooling.", "url": "https://erecip.github.io/en/christmas-cookies-for-babies/#wprm-recipe-43773-step-0-8"}], "recipeCategory": ["Cookies"], "recipeCuisine": ["International"], "keywords": "Christmas Cookies for Babies"}</script>
