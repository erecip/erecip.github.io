water in a medium saucepan. Stir until the apples are evenly coated.", "name": "Place the diced Granny Smith apples, granulated sugar, cinnamon, cornstarch, and water in a medium saucepan. Stir until the apples are evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-0"}, {"@type": "HowToStep", "text": "Cook over medium heat for approximately 5–6 minutes, stirring as necessary, until the fruit begins to soften and the surrounding liquid develops a thick consistency.", "name": "Cook over medium heat for approximately 5–6 minutes, stirring as necessary, until the fruit begins to soften and the surrounding liquid develops a thick consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-1"}, {"@type": "HowToStep", "text": "Take the saucepan off the heat and leave the apple filling to cool while the remaining components are prepared.", "name": "Take the saucepan off the heat and leave the apple filling to cool while the remaining components are prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-2"}, {"@type": "HowToStep", "text": "Stir the packed dark brown sugar and ground cinnamon together in a small bowl until evenly blended. Reserve this mixture for layering the cake.", "name": "Stir the packed dark brown sugar and ground cinnamon together in a small bowl until evenly blended. Reserve this mixture for layering the cake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-3"}, {"@type": "HowToStep", "text": "Heat the oven to 350°F (175°C). Lightly coat a 9 × 13-inch baking pan with nonstick cooking spray.", "name": "Heat the oven to 350°F (175°C). Lightly coat a 9 × 13-inch baking pan with nonstick cooking spray.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-4"}, {"@type": "HowToStep", "text": "Using a stand mixer fitted with the paddle attachment, cream the softened unsalted butter with the granulated sugar for about 3 minutes, or until the mixture becomes pale and fluffy.", "name": "Using a stand mixer fitted with the paddle attachment, cream the softened unsalted butter with the granulated sugar for about 3 minutes, or until the mixture becomes pale and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-5"}, {"@type": "HowToStep", "text": "Add the unsweetened applesauce, vanilla extract, and eggs. Beat at medium speed until thoroughly incorporated, stopping to scrape down the sides of the bowl when necessary.", "name": "Add the unsweetened applesauce, vanilla extract, and eggs. Beat at medium speed until thoroughly incorporated, stopping to scrape down the sides of the bowl when necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-6"}, {"@type": "HowToStep", "text": "In a separate mixing bowl, whisk together the all-purpose flour, baking powder, baking soda, kosher salt, and ground cinnamon.", "name": "In a separate mixing bowl, whisk together the all-purpose flour, baking powder, baking soda, kosher salt, and ground cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-7"}, {"@type": "HowToStep", "text": "Add the flour mixture and Greek yogurt to the butter mixture in alternating portions, starting and finishing with the dry ingredients. Sour cream may be used in place of the Greek yogurt as indicated in the original preparation.", "name": "Add the flour mixture and Greek yogurt to the butter mixture in alternating portions, starting and finishing with the dry ingredients. Sour cream may be used in place of the Greek yogurt as indicated in the original preparation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-8"}, {"@type": "HowToStep", "text": "Mix only until the batter comes together. Avoid excessive mixing, which can produce a less tender texture. Finish folding the batter gently with a spatula if necessary.", "name": "Mix only until the batter comes together. Avoid excessive mixing, which can produce a less tender texture. Finish folding the batter gently with a spatula if necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-9"}, {"@type": "HowToStep", "text": "Transfer half of the prepared batter to the greased baking pan and spread it into an even layer.", "name": "Transfer half of the prepared batter to the greased baking pan and spread it into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-10"}, {"@type": "HowToStep", "text": "Distribute the cooled apple filling over the batter, gently spreading the apples across the entire surface.", "name": "Distribute the cooled apple filling over the batter, gently spreading the apples across the entire surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-11"}, {"@type": "HowToStep", "text": "Scatter approximately two-thirds of the cinnamon-brown sugar mixture evenly over the apple layer.", "name": "Scatter approximately two-thirds of the cinnamon-brown sugar mixture evenly over the apple layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-12"}, {"@type": "HowToStep", "text": "Carefully spread the remaining cake batter over the apples. Finish by sprinkling the reserved one-third of the brown sugar mixture across the top.", "name": "Carefully spread the remaining cake batter over the apples. Finish by sprinkling the reserved one-third of the brown sugar mixture across the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-13"}, {"@type": "HowToStep", "text": "Place the assembled cake in the preheated oven and bake for 35–40 minutes. The cake is ready when the center is set and a toothpick inserted into the middle comes out clean.", "name": "Place the assembled cake in the preheated oven and bake for 35–40 minutes. The cake is ready when the center is set and a toothpick inserted into the middle comes out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-14"}, {"@type": "HowToStep", "text": "Keep the baked cake in its pan for glazing. If the surface begins to darken too quickly, loosely cover the cake with aluminum foil during approximately the final 10 minutes of baking.", "name": "Keep the baked cake in its pan for glazing. If the surface begins to darken too quickly, loosely cover the cake with aluminum foil during approximately the final 10 minutes of baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-15"}, {"@type": "HowToStep", "text": "While the cake completes its baking time, whisk the sifted powdered sugar, whole milk, and vanilla extract together in a medium bowl until completely smooth.", "name": "While the cake completes its baking time, whisk the sifted powdered sugar, whole milk, and vanilla extract together in a medium bowl until completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-16"}, {"@type": "HowToStep", "text": "Once the cake is baked and still warm, use a butter knife to make approximately 30 holes across the surface.", "name": "Once the cake is baked and still warm, use a butter knife to make approximately 30 holes across the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-17"}, {"@type": "HowToStep", "text": "Immediately pour the prepared vanilla glaze over the warm cake and spread it evenly with a spatula.", "name": "Immediately pour the prepared vanilla glaze over the warm cake and spread it evenly with a spatula.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-18"}, {"@type": "HowToStep", "text": "Allow the glaze to set for approximately 20 minutes before slicing and serving.", "name": "Allow the glaze to set for approximately 20 minutes before slicing and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-fritter-cake-recipe/#wprm-recipe-42217-step-0-19"}], "recipeCategory": ["cake", "Dessert"], "recipeCuisine": ["American"], "keywords": "Apple Fritter Cake Recipe"}</script>
