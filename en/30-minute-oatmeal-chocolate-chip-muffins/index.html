    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "30 Minute Oatmeal Chocolate Chip Muffins", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, tender oatmeal muffins filled with sweet chocolate chips and lightly flavored with cinnamon. A brief oat soak helps create a moist crumb, while the two-stage baking temperature encourages a nicely risen, golden exterior. These muffins can be prepared and baked in approximately 30 minutes.", "datePublished": "2019-09-11T14:08:50+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/30-minute-oatmeal-chocolate-chip-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/30-minute-oatmeal-chocolate-chip-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/30-minute-oatmeal-chocolate-chip-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/30-minute-oatmeal-chocolate-chip-muffins2.png"], "prepTime": "PT10M", "cookTime": "PT20M", "totalTime": "PT30M", "recipeIngredient": ["1 1/2 cups quick-cooking oats (preferably quick oats for a softer finished texture)", "1/3 cup unsalted butter (melted and allowed to cool)", "3/4 teaspoon ground cinnamon", "2  large eggs (lightly beaten)", "1/2 cup chocolate chips (with milk chocolate chips providing a sweeter flavor)", "1 teaspoon baking powder", "1 cup almond milk", "1/2 teaspoon fine sea salt (for consistent distribution throughout the batter)", "3/4 cup light brown sugar (firmly packed)", "1 cup all-purpose plain flour", "1/2 teaspoon baking soda"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 425°F (218°C). Place paper liners into all 12 wells of a standard muffin pan to make the baked muffins easier to remove.", "name": "Preheat the oven to 425°F (218°C). Place paper liners into all 12 wells of a standard muffin pan to make the baked muffins easier to remove.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/#wprm-recipe-45603-step-0-0"}, {"@type": "HowToStep", "text": "Place the 1 cup plain flour, 1 teaspoon baking powder, 3/4 teaspoon ground cinnamon, 1/2 teaspoon baking soda, and 1/2 teaspoon salt in a medium mixing bowl. Whisk thoroughly so the spices and leavening ingredients are distributed evenly throughout the flour.", "name": "Place the 1 cup plain flour, 1 teaspoon baking powder, 3/4 teaspoon ground cinnamon, 1/2 teaspoon baking soda, and 1/2 teaspoon salt in a medium mixing bowl. Whisk thoroughly so the spices and leavening ingredients are distributed evenly throughout the flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/#wprm-recipe-45603-step-0-1"}, {"@type": "HowToStep", "text": "In a large bowl, stir together the 1 1/2 cups quick oats and 1 cup almond milk until all of the oats are evenly moistened. Leave the mixture undisturbed for 10 minutes so the oats can absorb some of the liquid and soften.", "name": "In a large bowl, stir together the 1 1/2 cups quick oats and 1 cup almond milk until all of the oats are evenly moistened. Leave the mixture undisturbed for 10 minutes so the oats can absorb some of the liquid and soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/#wprm-recipe-45603-step-0-2"}, {"@type": "HowToStep", "text": "Add the 3/4 cup packed light brown sugar, 1/3 cup melted and cooled unsalted butter, and 2 lightly beaten eggs to the soaked oat mixture. Stir until the wet ingredients are thoroughly incorporated.", "name": "Add the 3/4 cup packed light brown sugar, 1/3 cup melted and cooled unsalted butter, and 2 lightly beaten eggs to the soaked oat mixture. Stir until the wet ingredients are thoroughly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/#wprm-recipe-45603-step-0-3"}, {"@type": "HowToStep", "text": "Add the prepared flour mixture to the bowl. Fold gently only until the visible streaks of dry flour disappear. Avoid excessive mixing, as overworking the batter can produce heavier, denser muffins.", "name": "Add the prepared flour mixture to the bowl. Fold gently only until the visible streaks of dry flour disappear. Avoid excessive mixing, as overworking the batter can produce heavier, denser muffins.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/#wprm-recipe-45603-step-0-4"}, {"@type": "HowToStep", "text": "Carefully fold 1/2 cup chocolate chips into the batter until evenly dispersed. Divide the mixture equally among the 12 prepared muffin cups.", "name": "Carefully fold 1/2 cup chocolate chips into the batter until evenly dispersed. Divide the mixture equally among the 12 prepared muffin cups.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/#wprm-recipe-45603-step-0-5"}, {"@type": "HowToStep", "text": "For a more pronounced chocolate topping, a few additional chocolate chips may be scattered over the surface of each muffin before baking.", "name": "For a more pronounced chocolate topping, a few additional chocolate chips may be scattered over the surface of each muffin before baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/#wprm-recipe-45603-step-0-6"}, {"@type": "HowToStep", "text": "Bake at 425°F (218°C) for 7 minutes. Without opening the oven or removing the muffin pan, lower the oven temperature to 350°F (177°C).", "name": "Bake at 425°F (218°C) for 7 minutes. Without opening the oven or removing the muffin pan, lower the oven temperature to 350°F (177°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/#wprm-recipe-45603-step-0-7"}, {"@type": "HowToStep", "text": "Continue baking for an additional 12–15 minutes, until the muffins are golden brown and their centers spring back gently when touched.", "name": "Continue baking for an additional 12–15 minutes, until the muffins are golden brown and their centers spring back gently when touched.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/#wprm-recipe-45603-step-0-8"}, {"@type": "HowToStep", "text": "Allow the muffins to rest in the pan for several minutes before transferring them to a wire cooling rack. They may be served warm once cool enough to handle or left to cool completely.", "name": "Allow the muffins to rest in the pan for several minutes before transferring them to a wire cooling rack. They may be served warm once cool enough to handle or left to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/30-minute-oatmeal-chocolate-chip-muffins/#wprm-recipe-45603-step-0-9"}], "recipeCategory": ["Breakfast", "Snack"], "recipeCuisine": ["American"], "keywords": "30 Minute Oatmeal Chocolate Chip Muffins"}</script>
