ince the garlic until fine.", "name": "Finely grate the cucumber without removing its skin. Chop the fresh mint and dill, if using, and mince the garlic until fine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-tzatziki-dip/#wprm-recipe-44937-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the grated cucumber to a clean tea towel. Gather the towel securely around the cucumber and squeeze it firmly over the sink, removing as much liquid as possible. Proper draining is important for maintaining a thicker dip consistency.", "name": "Transfer the grated cucumber to a clean tea towel. Gather the towel securely around the cucumber and squeeze it firmly over the sink, removing as much liquid as possible. Proper draining is important for maintaining a thicker dip consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-tzatziki-dip/#wprm-recipe-44937-step-0-2"}, {"@type": "HowToStep", "text": "Place the drained cucumber in a bowl along with the chopped mint, dill, and minced garlic. Add the cottage cheese, olive oil, and salt, then stir thoroughly until all ingredients are evenly incorporated.", "name": "Place the drained cucumber in a bowl along with the chopped mint, dill, and minced garlic. Add the cottage cheese, olive oil, and salt, then stir thoroughly until all ingredients are evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-tzatziki-dip/#wprm-recipe-44937-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the finished cottage cheese tzatziki dip to a serving bowl and serve as desired.", "name": "Transfer the finished cottage cheese tzatziki dip to a serving bowl and serve as desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-tzatziki-dip/#wprm-recipe-44937-step-0-4"}], "recipeCategory": ["Appetizer", "Dip"], "recipeCuisine": ["Mediterranean-inspired"], "keywords": "Cottage Cheese Tzatziki Dip"}</script>
