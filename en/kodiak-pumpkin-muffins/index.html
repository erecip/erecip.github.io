    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Kodiak Pumpkin Muffins", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, warmly spiced pumpkin muffins made with Kodiak buttermilk flapjack mix, pumpkin purée, ripe banana, Greek yogurt, honey, and avocado oil. An optional scattering of brown sugar adds a lightly crisp, sweet finish.", "datePublished": "2020-06-11T19:07:05+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/kodiak-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/kodiak-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/kodiak-pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/kodiak-pumpkin-muffins2.png"], "cookTime": "PT18M", "totalTime": "PT21M", "recipeIngredient": ["1 cup pumpkin purée", "1/4 cup avocado oil (or another mild-flavored oil such as canola)", "1 1/2 teaspoons pumpkin pie spice", "2 cups Kodiak buttermilk flapjack mix", "1  ripe banana (thoroughly mashed)", "1/3 cup plain Greek yogurt (brought to room temperature)", "1/4 teaspoon salt", "1/2 cup honey (or pure maple syrup for a richer flavor)", "2 teaspoons pure vanilla extract", "1 teaspoon ground cinnamon (preferably freshly ground)", "2  large eggs", "1 teaspoon baking powder (preferably fresh for optimal lift)", "Brown sugar (optional, for sprinkling over the muffins)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 350°F. Line a muffin tin with paper baking liners, or thoroughly grease the individual muffin wells to prevent sticking.", "name": "Heat the oven to 350°F. Line a muffin tin with paper baking liners, or thoroughly grease the individual muffin wells to prevent sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-0"}, {"@type": "HowToStep", "text": "Remove the Greek yogurt from the refrigerator so it can approach room temperature before mixing. This allows it to incorporate more smoothly into the batter.", "name": "Remove the Greek yogurt from the refrigerator so it can approach room temperature before mixing. This allows it to incorporate more smoothly into the batter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-1"}, {"@type": "HowToStep", "text": "Place the Kodiak buttermilk flapjack mix, cinnamon, pumpkin pie spice, baking powder, and salt in a medium mixing bowl.", "name": "Place the Kodiak buttermilk flapjack mix, cinnamon, pumpkin pie spice, baking powder, and salt in a medium mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-2"}, {"@type": "HowToStep", "text": "Whisk until the spices and leavening are evenly dispersed and no noticeable clumps remain. Uniform distribution helps the muffins rise consistently and ensures the spices are balanced throughout the batch.", "name": "Whisk until the spices and leavening are evenly dispersed and no noticeable clumps remain. Uniform distribution helps the muffins rise consistently and ensures the spices are balanced throughout the batch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-3"}, {"@type": "HowToStep", "text": "In a large bowl, mash the ripe banana until mostly smooth; a few small pieces may remain.", "name": "In a large bowl, mash the ripe banana until mostly smooth; a few small pieces may remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-4"}, {"@type": "HowToStep", "text": "Add the pumpkin purée, room-temperature Greek yogurt, vanilla extract, eggs, avocado oil, and honey. Stir vigorously until the ingredients are thoroughly blended and the mixture is fairly smooth.", "name": "Add the pumpkin purée, room-temperature Greek yogurt, vanilla extract, eggs, avocado oil, and honey. Stir vigorously until the ingredients are thoroughly blended and the mixture is fairly smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-5"}, {"@type": "HowToStep", "text": "Pour the wet mixture into the bowl containing the dry ingredients.", "name": "Pour the wet mixture into the bowl containing the dry ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-6"}, {"@type": "HowToStep", "text": "Using a spatula or wooden spoon, gently fold the mixtures together only until no visible streaks of dry ingredients remain. Avoid excessive stirring, as overmixing may produce muffins with a firmer, denser texture.", "name": "Using a spatula or wooden spoon, gently fold the mixtures together only until no visible streaks of dry ingredients remain. Avoid excessive stirring, as overmixing may produce muffins with a firmer, denser texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-7"}, {"@type": "HowToStep", "text": "Distribute the batter evenly among the prepared muffin cups, filling each approximately three-quarters full.", "name": "Distribute the batter evenly among the prepared muffin cups, filling each approximately three-quarters full.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-8"}, {"@type": "HowToStep", "text": "If desired, scatter a small amount of brown sugar over the surface of each portion. The sugar provides additional sweetness and a delicate crunch after baking.", "name": "If desired, scatter a small amount of brown sugar over the surface of each portion. The sugar provides additional sweetness and a delicate crunch after baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-9"}, {"@type": "HowToStep", "text": "Bake the muffins for 18–20 minutes. They are ready when the tops appear golden brown and a toothpick inserted into the center comes out clean or carries only a few moist crumbs.", "name": "Bake the muffins for 18–20 minutes. They are ready when the tops appear golden brown and a toothpick inserted into the center comes out clean or carries only a few moist crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-10"}, {"@type": "HowToStep", "text": "Avoid baking beyond this point, as the muffins will continue to set slightly from residual heat after leaving the oven.", "name": "Avoid baking beyond this point, as the muffins will continue to set slightly from residual heat after leaving the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-11"}, {"@type": "HowToStep", "text": "Allow the muffins to remain in the pan for 3–5 minutes. Transfer them to a wire cooling rack and let them finish cooling so excess warmth does not leave the bottoms damp.", "name": "Allow the muffins to remain in the pan for 3–5 minutes. Transfer them to a wire cooling rack and let them finish cooling so excess warmth does not leave the bottoms damp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-12"}, {"@type": "HowToStep", "text": "Serve the Kodiak pumpkin muffins warm or at room temperature.", "name": "Serve the Kodiak pumpkin muffins warm or at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/kodiak-pumpkin-muffins/#wprm-recipe-42661-step-0-13"}], "recipeCategory": ["Breakfast"], "recipeCuisine": ["American"], "keywords": "Kodiak Pumpkin Muffins"}</script>
