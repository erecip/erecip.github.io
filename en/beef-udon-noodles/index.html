    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Beef Udon Noodles", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warming Japanese noodle dish featuring thick udon strands in a savory broth, topped with tender soy-glazed beef, lightly caramelized negi, and optional traditional garnishes.", "datePublished": "2021-09-16T15:55:49+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/beef-udon-noodles2.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/beef-udon-noodles2.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/beef-udon-noodles2.png", "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/beef-udon-noodles2.png"], "prepTime": "PT15M", "cookTime": "PT20M", "totalTime": "PT35M", "recipeIngredient": ["2½ cups Japanese dashi soup stock", "1 teaspoon granulated sugar", "1½ tablespoons soy sauce", "⅛ teaspoon Diamond Crystal kosher salt", "1 tablespoon mirin", "1 tablespoon mirin", "2⅓ cups water", "⅓ cup concentrated mentsuyu noodle soup base", "6  –8 ounces thinly sliced beef (such as ribeye, cut into bite-sized strips)", "1 tablespoon soy sauce", "½  Tokyo negi (white section only, or 2 green onions, sliced diagonally into 1-inch pieces)", "1 tablespoon neutral cooking oil (such as canola or grapeseed oil)", "2 teaspoons granulated sugar", "4 pieces narutomaki fish cake (sliced diagonally, optional)", "2  portions fresh or frozen udon noodles", "Shichimi togarashi (optional, for serving)", "1  green onion (thinly sliced)", "4  sprigs mitsuba (thinly sliced, optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "For the traditional broth, pour the dashi into a medium saucepan and bring it to a boil over medium heat. Reduce the heat and allow it to simmer gently for 2–3 minutes.", "name": "For the traditional broth, pour the dashi into a medium saucepan and bring it to a boil over medium heat. Reduce the heat and allow it to simmer gently for 2–3 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-0"}, {"@type": "HowToStep", "text": "Add the soy sauce, mirin, sugar, and kosher salt to the dashi. Stir until the seasonings are fully incorporated. Cover the saucepan, switch off the heat, and keep the broth warm.", "name": "Add the soy sauce, mirin, sugar, and kosher salt to the dashi. Stir until the seasonings are fully incorporated. Cover the saucepan, switch off the heat, and keep the broth warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-1"}, {"@type": "HowToStep", "text": "To prepare the quicker broth variation, combine the concentrated mentsuyu, water, and mirin in a saucepan. Bring the mixture to a gentle simmer over medium heat, then cover the pan and remove it from the heat.", "name": "To prepare the quicker broth variation, combine the concentrated mentsuyu, water, and mirin in a saucepan. Bring the mixture to a gentle simmer over medium heat, then cover the pan and remove it from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-2"}, {"@type": "HowToStep", "text": "While the broth is heating, cut the white portion of the Tokyo negi, or the green onions, diagonally into 1-inch sections.", "name": "While the broth is heating, cut the white portion of the Tokyo negi, or the green onions, diagonally into 1-inch sections.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-3"}, {"@type": "HowToStep", "text": "Thinly slice the mitsuba and the additional green onion intended for garnish. If using narutomaki, cut each piece diagonally.", "name": "Thinly slice the mitsuba and the additional green onion intended for garnish. If using narutomaki, cut each piece diagonally.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-4"}, {"@type": "HowToStep", "text": "Slice the beef into manageable strips approximately 1½–2 inches wide. Arrange all prepared toppings nearby for convenient assembly.", "name": "Slice the beef into manageable strips approximately 1½–2 inches wide. Arrange all prepared toppings nearby for convenient assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-5"}, {"@type": "HowToStep", "text": "Warm the neutral oil in a frying pan over medium heat. Add the sliced negi and sauté until softened and lightly browned.", "name": "Warm the neutral oil in a frying pan over medium heat. Add the sliced negi and sauté until softened and lightly browned.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-6"}, {"@type": "HowToStep", "text": "Place the beef in the pan and cook until no pink remains.", "name": "Place the beef in the pan and cook until no pink remains.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-7"}, {"@type": "HowToStep", "text": "Sprinkle the sugar over the beef, then add the soy sauce. Continue stir-frying until the meat and negi are evenly coated with a glossy seasoning. Remove the pan from the heat.", "name": "Sprinkle the sugar over the beef, then add the soy sauce. Continue stir-frying until the meat and negi are evenly coated with a glossy seasoning. Remove the pan from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-8"}, {"@type": "HowToStep", "text": "Meanwhile, bring a large pot of water to a rolling boil. Cook the udon according to the package directions. Frozen udon generally requires about 1 minute to heat through.", "name": "Meanwhile, bring a large pot of water to a rolling boil. Cook the udon according to the package directions. Frozen udon generally requires about 1 minute to heat through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-9"}, {"@type": "HowToStep", "text": "Drain the noodles thoroughly and divide them evenly between two serving bowls.", "name": "Drain the noodles thoroughly and divide them evenly between two serving bowls.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-10"}, {"@type": "HowToStep", "text": "Ladle the hot broth over the udon. Top each bowl with the cooked beef and negi, followed by the narutomaki, mitsuba, and sliced green onion.", "name": "Ladle the hot broth over the udon. Top each bowl with the cooked beef and negi, followed by the narutomaki, mitsuba, and sliced green onion.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-11"}, {"@type": "HowToStep", "text": "Finish with shichimi togarashi for a mild spicy accent, if desired, and serve immediately.", "name": "Finish with shichimi togarashi for a mild spicy accent, if desired, and serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/beef-udon-noodles/#wprm-recipe-40990-step-0-12"}], "recipeCategory": ["Main Course", "Soup"], "recipeCuisine": ["Japanese"], "keywords": "Beef Udon Noodles"}</script>
