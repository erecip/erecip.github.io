    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Apple Cobbler", "author": {"@type": "Person", "name": "BenDes"}, "description": "A warm, fruit-filled dessert featuring tender cinnamon-spiced apples beneath a soft, golden cobbler topping. The cornstarch-thickened filling remains juicy without becoming runny, while the lightly sweetened batter bakes into a rustic, tender crust.", "datePublished": "2019-09-02T14:26:21+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/apple-cobbler.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/apple-cobbler.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/apple-cobbler.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/apple-cobbler.png"], "cookTime": "PT40M", "totalTime": "PT55M", "recipeIngredient": ["6  medium apples (peeled and cut into ¼-inch slices, preferably Granny Smith, Golden Delicious, or a combination)", "½ teaspoon pure vanilla extract", "⅓ cup packed brown sugar", "1 tablespoon freshly squeezed lemon juice", "½ teaspoon ground nutmeg", "1 cup apple juice or water", "⅛ teaspoon salt", "1 tablespoon cornstarch", "1 teaspoon ground cinnamon (preferably freshly ground)", "¾ cup room-temperature milk", "2 teaspoons baking powder", "5 tablespoons unsalted butter (melted and allowed to cool slightly)", "1 cup granulated sugar", "¼ teaspoon salt", "1 cup all-purpose flour", "Approximately ¼ teaspoon ground cinnamon (for sprinkling)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F. Lightly grease a baking pan and set it aside. Peel the apples, remove the cores, and slice the fruit into pieces approximately ¼ inch thick.", "name": "Preheat the oven to 350°F. Lightly grease a baking pan and set it aside. Peel the apples, remove the cores, and slice the fruit into pieces approximately ¼ inch thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-0"}, {"@type": "HowToStep", "text": "Place the brown sugar, apple juice or water, cornstarch, lemon juice, vanilla extract, cinnamon, nutmeg, and salt in a saucepan. Whisk thoroughly until the cornstarch has dissolved and the mixture is smooth.", "name": "Place the brown sugar, apple juice or water, cornstarch, lemon juice, vanilla extract, cinnamon, nutmeg, and salt in a saucepan. Whisk thoroughly until the cornstarch has dissolved and the mixture is smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-1"}, {"@type": "HowToStep", "text": "Set the saucepan over medium heat and bring the liquid to a gentle simmer. Add the sliced apples and cook for 3–5 minutes, stirring carefully, until the fruit begins to soften and the surrounding liquid thickens slightly. Avoid cooking the apples completely, as they will continue to soften in the oven.", "name": "Set the saucepan over medium heat and bring the liquid to a gentle simmer. Add the sliced apples and cook for 3–5 minutes, stirring carefully, until the fruit begins to soften and the surrounding liquid thickens slightly. Avoid cooking the apples completely, as they will continue to soften in the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-2"}, {"@type": "HowToStep", "text": "In a separate mixing bowl, whisk together the all-purpose flour, granulated sugar, baking powder, and salt until evenly distributed.", "name": "In a separate mixing bowl, whisk together the all-purpose flour, granulated sugar, baking powder, and salt until evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-3"}, {"@type": "HowToStep", "text": "Combine the room-temperature milk with the melted, slightly cooled butter in a small bowl or measuring jug.", "name": "Combine the room-temperature milk with the melted, slightly cooled butter in a small bowl or measuring jug.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the warm apple mixture to the prepared baking pan and spread it into an even layer.", "name": "Transfer the warm apple mixture to the prepared baking pan and spread it into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-5"}, {"@type": "HowToStep", "text": "Pour the milk-and-butter mixture into the dry ingredients. Stir gently with a spatula only until a batter forms. Do not overmix; a few small lumps will help preserve the topping’s tender, rustic consistency.", "name": "Pour the milk-and-butter mixture into the dry ingredients. Stir gently with a spatula only until a batter forms. Do not overmix; a few small lumps will help preserve the topping’s tender, rustic consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-6"}, {"@type": "HowToStep", "text": "Distribute the batter evenly over the apple filling. The mixture may appear relatively thin at this stage, but it will rise and firm as it bakes.", "name": "Distribute the batter evenly over the apple filling. The mixture may appear relatively thin at this stage, but it will rise and firm as it bakes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-7"}, {"@type": "HowToStep", "text": "Dust the surface with approximately ¼ teaspoon ground cinnamon.", "name": "Dust the surface with approximately ¼ teaspoon ground cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-8"}, {"@type": "HowToStep", "text": "Bake for 38–40 minutes, or until the topping is golden brown and a toothpick inserted into the baked batter comes out clean. The apple filling should be visibly bubbling around the edges.", "name": "Bake for 38–40 minutes, or until the topping is golden brown and a toothpick inserted into the baked batter comes out clean. The apple filling should be visibly bubbling around the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-9"}, {"@type": "HowToStep", "text": "Remove the cobbler from the oven and allow it to rest for 15 minutes before serving. This cooling period helps the filling thicken while keeping the apples warm and succulent.", "name": "Remove the cobbler from the oven and allow it to rest for 15 minutes before serving. This cooling period helps the filling thicken while keeping the apples warm and succulent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-cobbler/#wprm-recipe-39991-step-0-10"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Apple Cobbler"}</script>
