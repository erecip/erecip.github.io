    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Zucchini Lasagna", "author": {"@type": "Person", "name": "BenDes"}, "description": "This zucchini lasagna features thinly sliced zucchini layered with a seasoned ground turkey and tomato sauce, a cottage cheese and spinach filling, and a combination of mozzarella and Parmesan cheeses. Salting the zucchini before assembly helps remove excess moisture and creates a firmer finished lasagna.", "datePublished": "2020-03-21T23:31:09+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/cottage-cheese-zucchini-lasagna.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/cottage-cheese-zucchini-lasagna.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/cottage-cheese-zucchini-lasagna.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/cottage-cheese-zucchini-lasagna.png"], "prepTime": "PT40M", "cookTime": "PT50M", "totalTime": "PT90M", "recipeIngredient": ["5  medium-sized zucchini", "Kosher or sea salt (as needed for drawing moisture from the zucchini)", "1 pound ground turkey", "2  cans (14 ounces each low-sodium tomato sauce)", "1 tablespoon olive oil or avocado oil", "1 tablespoon granulated sugar", "1 teaspoon dried basil", "1 teaspoon garlic powder", "1 teaspoon dried oregano", "1/2 teaspoon salt", "Freshly ground black pepper (to taste)", "11 ounces fresh spinach (finely chopped)", "15 ounces good-quality cottage cheese (such as Knudsen)", "1  large egg", "1/2 teaspoon dried oregano", "8 ounces mozzarella cheese (shredded)", "1/3 cup Parmesan cheese (preferably freshly grated)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C).", "name": "Preheat the oven to 375°F (190°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-0"}, {"@type": "HowToStep", "text": "Slice the zucchini lengthwise into approximately 1/8-inch-thick strips using a mandoline, box grater, or sharp knife.", "name": "Slice the zucchini lengthwise into approximately 1/8-inch-thick strips using a mandoline, box grater, or sharp knife.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-1"}, {"@type": "HowToStep", "text": "Cover a large baking sheet with two layers of paper towels. Arrange the zucchini slices in a single layer and season them lightly with salt.", "name": "Cover a large baking sheet with two layers of paper towels. Arrange the zucchini slices in a single layer and season them lightly with salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-2"}, {"@type": "HowToStep", "text": "Allow the zucchini to stand for 30 minutes so the salt can draw out excess moisture.", "name": "Allow the zucchini to stand for 30 minutes so the salt can draw out excess moisture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-3"}, {"@type": "HowToStep", "text": "Heat the oil in a large skillet over medium-high heat. Add the ground turkey and cook for approximately 5 minutes, stirring frequently and breaking the meat into small pieces as it browns.", "name": "Heat the oil in a large skillet over medium-high heat. Add the ground turkey and cook for approximately 5 minutes, stirring frequently and breaking the meat into small pieces as it browns.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-4"}, {"@type": "HowToStep", "text": "Season the turkey with 1 teaspoon oregano, the dried basil, garlic powder, 1/2 teaspoon salt, and freshly ground black pepper. Continue cooking for about 30 seconds so the seasonings become evenly incorporated.", "name": "Season the turkey with 1 teaspoon oregano, the dried basil, garlic powder, 1/2 teaspoon salt, and freshly ground black pepper. Continue cooking for about 30 seconds so the seasonings become evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-5"}, {"@type": "HowToStep", "text": "Pour in the tomato sauce and stir in the sugar. Bring the sauce to a boil, then lower the heat and simmer for 5 minutes.", "name": "Pour in the tomato sauce and stir in the sugar. Bring the sauce to a boil, then lower the heat and simmer for 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the finished meat sauce to a medium bowl and reserve it for assembly.", "name": "Transfer the finished meat sauce to a medium bowl and reserve it for assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-7"}, {"@type": "HowToStep", "text": "Using the same skillet, add the chopped fresh spinach in batches. Stir continuously as each portion wilts before adding more.", "name": "Using the same skillet, add the chopped fresh spinach in batches. Stir continuously as each portion wilts before adding more.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-8"}, {"@type": "HowToStep", "text": "Once all of the spinach has wilted, transfer it to a separate bowl and allow it to cool to room temperature.", "name": "Once all of the spinach has wilted, transfer it to a separate bowl and allow it to cool to room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-9"}, {"@type": "HowToStep", "text": "Place the cottage cheese in a medium bowl. Add the egg and 1/2 teaspoon dried oregano, then mix thoroughly until evenly combined.", "name": "Place the cottage cheese in a medium bowl. Add the egg and 1/2 teaspoon dried oregano, then mix thoroughly until evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-10"}, {"@type": "HowToStep", "text": "Fold the cooled spinach into the cottage cheese mixture.", "name": "Fold the cooled spinach into the cottage cheese mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-11"}, {"@type": "HowToStep", "text": "Use clean paper towels to gently blot the zucchini slices, removing the moisture that has collected on their surfaces.", "name": "Use clean paper towels to gently blot the zucchini slices, removing the moisture that has collected on their surfaces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-12"}, {"@type": "HowToStep", "text": "Spread a thin portion of the meat sauce across the bottom of a baking dish. Arrange a layer of zucchini slices over the sauce, followed by a portion of the cottage cheese and spinach mixture.", "name": "Spread a thin portion of the meat sauce across the bottom of a baking dish. Arrange a layer of zucchini slices over the sauce, followed by a portion of the cottage cheese and spinach mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-13"}, {"@type": "HowToStep", "text": "Add some of the shredded mozzarella and continue building layers with the remaining meat sauce, zucchini, cottage cheese mixture, and mozzarella until the ingredients have been used.", "name": "Add some of the shredded mozzarella and continue building layers with the remaining meat sauce, zucchini, cottage cheese mixture, and mozzarella until the ingredients have been used.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-14"}, {"@type": "HowToStep", "text": "Finish with zucchini and a final layer of meat sauce. Sprinkle the remaining mozzarella and grated Parmesan evenly over the top.", "name": "Finish with zucchini and a final layer of meat sauce. Sprinkle the remaining mozzarella and grated Parmesan evenly over the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-15"}, {"@type": "HowToStep", "text": "Cover the baking dish with aluminum foil and transfer it to the preheated oven. Bake for approximately 30 minutes.", "name": "Cover the baking dish with aluminum foil and transfer it to the preheated oven. Bake for approximately 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-16"}, {"@type": "HowToStep", "text": "Remove the foil and continue baking for another 10 to 15 minutes, or until the top is lightly browned and the lasagna is heated throughout.", "name": "Remove the foil and continue baking for another 10 to 15 minutes, or until the top is lightly browned and the lasagna is heated throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-17"}, {"@type": "HowToStep", "text": "Remove the dish from the oven and allow the lasagna to rest for several minutes before cutting into portions and serving.", "name": "Remove the dish from the oven and allow the lasagna to rest for several minutes before cutting into portions and serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-zucchini-lasagna/#wprm-recipe-46294-step-0-18"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian-Inspired"], "keywords": "Cottage Cheese Zucchini Lasagna"}</script>
