    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Butter Biscuits Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Delicate and buttery, these traditional American biscuits feature a flaky texture and golden crust, ideal as a breakfast item or savory side. This small-batch recipe yields six biscuits, with an option to double for larger gatherings.", "datePublished": "2024-09-05T09:23:14+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/Butter-Biscuits-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/Butter-Biscuits-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/Butter-Biscuits-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/Butter-Biscuits-Recipe.png"], "prepTime": "PT15M", "cookTime": "PT12M", "totalTime": "PT27M", "recipeIngredient": ["1 Tablespoon granulated sugar", "¾ cup whole milk (177ml – buttermilk or 2% milk may also be used)", "6 Tablespoons unsalted butter (very cold (85g) – preferably European-style, though not mandatory)", "1 Tablespoon baking powder", "1 teaspoon salt", "2 cups all-purpose flour (250g)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the butter in the freezer for 10–20 minutes before beginning to ensure it is exceptionally cold, which contributes to a flakier texture.", "name": "Place the butter in the freezer for 10–20 minutes before beginning to ensure it is exceptionally cold, which contributes to a flakier texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-0"}, {"@type": "HowToStep", "text": "Preheat the oven to 425°F and prepare a baking sheet by lining it with parchment paper.", "name": "Preheat the oven to 425°F and prepare a baking sheet by lining it with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-1"}, {"@type": "HowToStep", "text": "In a large mixing bowl, blend the flour, baking powder, sugar, and salt thoroughly.", "name": "In a large mixing bowl, blend the flour, baking powder, sugar, and salt thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-2"}, {"@type": "HowToStep", "text": "Retrieve the chilled butter and either cut it into the flour mixture using a pastry cutter or grate it with a box grater directly into the dry ingredients, stirring gently afterward to combine. The mixture should resemble coarse crumbs.", "name": "Retrieve the chilled butter and either cut it into the flour mixture using a pastry cutter or grate it with a box grater directly into the dry ingredients, stirring gently afterward to combine. The mixture should resemble coarse crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-3"}, {"@type": "HowToStep", "text": "Pour in the milk and stir with a wooden spoon or spatula just until the dough comes together—avoid excessive mixing.", "name": "Pour in the milk and stir with a wooden spoon or spatula just until the dough comes together—avoid excessive mixing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-4"}, {"@type": "HowToStep", "text": "Turn the dough onto a well-floured surface and gently bring it together by hand. If it's too sticky, incorporate small amounts of flour until manageable.", "name": "Turn the dough onto a well-floured surface and gently bring it together by hand. If it's too sticky, incorporate small amounts of flour until manageable.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-5"}, {"@type": "HowToStep", "text": "Fold the dough in half, press to flatten slightly, rotate 90 degrees, and fold again. Repeat this layering and folding technique 5 to 6 times, taking care not to overwork the dough.", "name": "Fold the dough in half, press to flatten slightly, rotate 90 degrees, and fold again. Repeat this layering and folding technique 5 to 6 times, taking care not to overwork the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-6"}, {"@type": "HowToStep", "text": "Pat the dough to a 1-inch thickness using only your hands. Lightly flour a 2 ¾-inch round biscuit cutter and press straight down to cut out the biscuits.", "name": "Pat the dough to a 1-inch thickness using only your hands. Lightly flour a 2 ¾-inch round biscuit cutter and press straight down to cut out the biscuits.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the biscuits on the prepared baking sheet with less than ½ inch between them. Re-form any remaining dough and continue cutting until you have at least six biscuits.", "name": "Arrange the biscuits on the prepared baking sheet with less than ½ inch between them. Re-form any remaining dough and continue cutting until you have at least six biscuits.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-8"}, {"@type": "HowToStep", "text": "Bake for 12 minutes or until the tops begin to acquire a light golden hue.", "name": "Bake for 12 minutes or until the tops begin to acquire a light golden hue.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-9"}, {"@type": "HowToStep", "text": "Optionally, brush with melted salted butter immediately upon removal from the oven. Serve warm.", "name": "Optionally, brush with melted salted butter immediately upon removal from the oven. Serve warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/butter-biscuits-recipe/#wprm-recipe-13889-step-0-10"}], "recipeCategory": ["Bread", "Breakfast", "Side Dish"], "recipeCuisine": ["American"], "keywords": "Butter Biscuits Recipe"}</script>
