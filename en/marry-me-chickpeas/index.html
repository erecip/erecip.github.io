    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Marry Me Chickpeas", "author": {"@type": "Person", "name": "BenDes"}, "description": "Marry Me Chickpeas combines tender chickpeas with sun-dried tomatoes, garlic, baby spinach, herbs, and a creamy plant-based sauce. Tomato paste and vegetable broth create a savory foundation, while basil and optional vegan parmesan provide a fresh, flavorful finish.", "datePublished": "2019-09-30T16:18:40+00:00", "image": ["https://erecip.github.io/en/marry-me-chickpeas/marry-me-chickpeas2.png", "https://erecip.github.io/en/marry-me-chickpeas/marry-me-chickpeas2.png", "https://erecip.github.io/en/marry-me-chickpeas/marry-me-chickpeas2.png", "https://erecip.github.io/en/marry-me-chickpeas/marry-me-chickpeas2.png"], "cookTime": "PT8M", "totalTime": "PT8M", "recipeIngredient": ["2 cups baby spinach (thinly sliced)", "1 cup vegetable broth (or 1 cup water combined with 1 teaspoon bouillon)", "5  fresh garlic cloves (finely minced)", "1/2 teaspoon crushed red pepper flakes (with the amount adjustable for preferred heat)", "2  cans chickpeas (thoroughly rinsed and drained)", "1 tablespoon tomato paste", "1/4 teaspoon freshly ground black pepper", "1 cup plant-based cream (preferably oat milk or coconut milk)", "1/2 cup sun-dried tomatoes (chopped into roughly 1/4-inch pieces)", "1 teaspoon salt", "1/2 teaspoon dried oregano", "1 tablespoon olive oil (or another neutral cooking oil such as canola)", "4  –5 fresh basil leaves (chopped into approximately 1/4-inch pieces)", "1/2 cup vegan parmesan (optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm 1 tablespoon olive oil in a large skillet over medium heat.", "name": "Warm 1 tablespoon olive oil in a large skillet over medium heat.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-0"}, {"@type": "HowToStep", "text": "When the oil is hot and shimmering, add the 5 minced garlic cloves. Cook for approximately 1–2 minutes, stirring frequently, until the garlic becomes aromatic without allowing it to brown.", "name": "When the oil is hot and shimmering, add the 5 minced garlic cloves. Cook for approximately 1–2 minutes, stirring frequently, until the garlic becomes aromatic without allowing it to brown.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-1"}, {"@type": "HowToStep", "text": "Stir in the 1/2 cup chopped sun-dried tomatoes, 1/2 teaspoon dried oregano, 1/2 teaspoon crushed red pepper flakes, 1 teaspoon salt, and 1/4 teaspoon ground black pepper. Continue cooking for another minute while stirring continuously. This gently toasts the dried seasonings and slightly softens the sun-dried tomatoes, producing a concentrated flavor base.", "name": "Stir in the 1/2 cup chopped sun-dried tomatoes, 1/2 teaspoon dried oregano, 1/2 teaspoon crushed red pepper flakes, 1 teaspoon salt, and 1/4 teaspoon ground black pepper. Continue cooking for another minute while stirring continuously. This gently toasts the dried seasonings and slightly softens the sun-dried tomatoes, producing a concentrated flavor base.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-2"}, {"@type": "HowToStep", "text": "Add 1 tablespoon tomato paste to the skillet and thoroughly combine it with the aromatic mixture. Cook for approximately 30 seconds so the paste can lightly caramelize and develop a richer savory flavor.", "name": "Add 1 tablespoon tomato paste to the skillet and thoroughly combine it with the aromatic mixture. Cook for approximately 30 seconds so the paste can lightly caramelize and develop a richer savory flavor.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-3"}, {"@type": "HowToStep", "text": "Pour in 1 cup vegetable broth followed by 1 cup plant-based cream. Stir until the liquids and tomato paste form a smooth, evenly blended sauce.", "name": "Pour in 1 cup vegetable broth followed by 1 cup plant-based cream. Stir until the liquids and tomato paste form a smooth, evenly blended sauce.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-4"}, {"@type": "HowToStep", "text": "Add the 2 cans of rinsed and drained chickpeas. Fold them gently through the mixture until they are completely coated in the creamy sauce.", "name": "Add the 2 cans of rinsed and drained chickpeas. Fold them gently through the mixture until they are completely coated in the creamy sauce.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-5"}, {"@type": "HowToStep", "text": "Adding the cream after incorporating the tomato paste allows the paste to disperse more evenly, helping the sauce remain smooth rather than lumpy.", "name": "Adding the cream after incorporating the tomato paste allows the paste to disperse more evenly, helping the sauce remain smooth rather than lumpy.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-6"}, {"@type": "HowToStep", "text": "Add the 2 cups sliced baby spinach directly to the chickpea mixture.", "name": "Add the 2 cups sliced baby spinach directly to the chickpea mixture.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-7"}, {"@type": "HowToStep", "text": "Bring the contents of the skillet to a gentle simmer over medium heat. Cook for approximately 5 minutes, stirring from time to time.", "name": "Bring the contents of the skillet to a gentle simmer over medium heat. Cook for approximately 5 minutes, stirring from time to time.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-8"}, {"@type": "HowToStep", "text": "During simmering, the spinach will substantially reduce in volume and become tender while the chickpeas absorb the surrounding flavors. Cooking the spinach directly in the sauce also allows its released moisture to blend throughout the dish.", "name": "During simmering, the spinach will substantially reduce in volume and become tender while the chickpeas absorb the surrounding flavors. Cooking the spinach directly in the sauce also allows its released moisture to blend throughout the dish.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-9"}, {"@type": "HowToStep", "text": "Remove the skillet from the heat and fold in the 4–5 chopped fresh basil leaves. The basil contributes a fresh herbal element that balances the richness of the creamy sauce.", "name": "Remove the skillet from the heat and fold in the 4–5 chopped fresh basil leaves. The basil contributes a fresh herbal element that balances the richness of the creamy sauce.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-10"}, {"@type": "HowToStep", "text": "If desired, add 1/2 cup vegan parmesan and stir gently until evenly distributed.", "name": "If desired, add 1/2 cup vegan parmesan and stir gently until evenly distributed.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-11"}, {"@type": "HowToStep", "text": "Taste before serving and adjust the salt, black pepper, or crushed red pepper flakes as preferred.", "name": "Taste before serving and adjust the salt, black pepper, or crushed red pepper flakes as preferred.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-12"}, {"@type": "HowToStep", "text": "Serve the Marry Me Chickpeas while warm.", "name": "Serve the Marry Me Chickpeas while warm.", "url": "https://erecip.github.io/en/marry-me-chickpeas/#wprm-recipe-45774-step-0-13"}], "keywords": "Marry Me Chickpeas"}</script>
