    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Tuscan Chicken Pasta Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy, flavor-packed Tuscan chicken pasta with sun-dried tomatoes, fresh basil, and tender spinach leaves. Ready in 30 minutes, this dish combines comforting textures and rich flavors for a satisfying meal.", "datePublished": "2024-04-10T21:16:37+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Tuscan-chicken-pasta-1.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Tuscan-chicken-pasta-1-500x500.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Tuscan-chicken-pasta-1-500x375.jpg", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/Tuscan-chicken-pasta-1-480x270.jpg"], "recipeYield": ["4"], "prepTime": "PT10M", "cookTime": "PT20M", "totalTime": "PT30M", "recipeIngredient": ["2  boneless chicken breasts (diced into bite-sized pieces)", "8 ounces uncooked pasta", "1 tablespoon olive oil", "1/2 teaspoon garlic powder", "1/4 teaspoon smoked paprika", "Salt and pepper (to taste)", "1/2 teaspoon Italian seasoning", "1/2 cup chicken broth (or dry white wine)", "3  –4 cloves garlic (minced)", "1/2 teaspoon Dijon mustard", "1 teaspoon all-purpose flour", "1 teaspoon lemon juice", "1/4 cup sun-dried tomatoes (drained and chopped)", "1 cup heavy or whipping cream", "1  –2 cups loosely packed baby spinach", "Small handful fresh basil (finely chopped)", "Freshly grated Parmesan cheese (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a pot of salted water to a boil and cook pasta until al dente, following package instructions. Drain and set aside.", "name": "Bring a pot of salted water to a boil and cook pasta until al dente, following package instructions. Drain and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuscan-chicken-pasta-recipe/#wprm-recipe-4647-step-0-0"}, {"@type": "HowToStep", "text": "In a large skillet over medium-high heat, warm the olive oil. Add the diced chicken, seasoning it with garlic powder, smoked paprika, Italian seasoning, salt, and pepper. Stir well and cook for about 4 minutes, or until the chicken is no longer pink on the outside. Transfer the chicken to a plate.", "name": "In a large skillet over medium-high heat, warm the olive oil. Add the diced chicken, seasoning it with garlic powder, smoked paprika, Italian seasoning, salt, and pepper. Stir well and cook for about 4 minutes, or until the chicken is no longer pink on the outside. Transfer the chicken to a plate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuscan-chicken-pasta-recipe/#wprm-recipe-4647-step-0-1"}, {"@type": "HowToStep", "text": "In the same skillet, combine chicken broth, minced garlic, Dijon mustard, flour, and lemon juice. Whisk until the mixture is smooth and simmer for approximately one minute.", "name": "In the same skillet, combine chicken broth, minced garlic, Dijon mustard, flour, and lemon juice. Whisk until the mixture is smooth and simmer for approximately one minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuscan-chicken-pasta-recipe/#wprm-recipe-4647-step-0-2"}, {"@type": "HowToStep", "text": "Stir in the sun-dried tomatoes and heavy cream. Allow the sauce to simmer gently for 2 minutes, letting the flavors meld together.", "name": "Stir in the sun-dried tomatoes and heavy cream. Allow the sauce to simmer gently for 2 minutes, letting the flavors meld together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuscan-chicken-pasta-recipe/#wprm-recipe-4647-step-0-3"}, {"@type": "HowToStep", "text": "Return the chicken to the skillet, cooking for an additional few minutes until the chicken is thoroughly cooked and the sauce thickens slightly. Avoid overcooking the chicken.", "name": "Return the chicken to the skillet, cooking for an additional few minutes until the chicken is thoroughly cooked and the sauce thickens slightly. Avoid overcooking the chicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuscan-chicken-pasta-recipe/#wprm-recipe-4647-step-0-4"}, {"@type": "HowToStep", "text": "Add the fresh basil and spinach to the skillet, stirring until the spinach wilts, about a minute. Taste and adjust with additional salt and pepper if desired.", "name": "Add the fresh basil and spinach to the skillet, stirring until the spinach wilts, about a minute. Taste and adjust with additional salt and pepper if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuscan-chicken-pasta-recipe/#wprm-recipe-4647-step-0-5"}, {"@type": "HowToStep", "text": "Gently toss the drained pasta with the sauce until well-coated. Serve immediately, garnished with freshly grated Parmesan.", "name": "Gently toss the drained pasta with the sauce until well-coated. Serve immediately, garnished with freshly grated Parmesan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuscan-chicken-pasta-recipe/#wprm-recipe-4647-step-0-6"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Tuscan Chicken Pasta Recipe"}</script>
