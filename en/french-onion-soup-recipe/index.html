p with a slice of toasted bread. Evenly distribute Gruyere, Mozzarella, and Parmesan cheeses over each.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-soup-recipe/#wprm-recipe-13880-step-0-10"}, {"@type": "HowToStep", "text": "Broil until the cheese is melted, golden, and bubbly, forming a delicious crust over the bowl’s edge.", "name": "Broil until the cheese is melted, golden, and bubbly, forming a delicious crust over the bowl’s edge.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-soup-recipe/#wprm-recipe-13880-step-0-11"}, {"@type": "HowToStep", "text": "Serve hot.", "name": "Serve hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/french-onion-soup-recipe/#wprm-recipe-13880-step-0-12"}], "recipeCategory": ["Soup"], "recipeCuisine": ["French"], "keywords": "French Onion Soup Recipe"}</script>
