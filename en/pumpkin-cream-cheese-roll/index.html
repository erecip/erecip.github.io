    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Cream Cheese Roll", "author": {"@type": "Person", "name": "BenDes"}, "description": "A tender, warmly spiced pumpkin sponge is rolled around a smooth vanilla cream cheese filling. Chilling the finished roll helps it retain its shape and makes it easier to cut into clean, attractive slices.", "datePublished": "2020-05-30T18:33:54+00:00", "image": ["https://erecip.github.io/en/pumpkin-cream-cheese-roll/pumpkin-cream-cheese-roll.png", "https://erecip.github.io/en/pumpkin-cream-cheese-roll/pumpkin-cream-cheese-roll.png", "https://erecip.github.io/en/pumpkin-cream-cheese-roll/pumpkin-cream-cheese-roll.png", "https://erecip.github.io/en/pumpkin-cream-cheese-roll/pumpkin-cream-cheese-roll.png"], "prepTime": "PT20M", "cookTime": "PT14M", "totalTime": "PT34M", "recipeIngredient": ["⅔ cup pumpkin purée", "½ teaspoon fine salt", "3  large eggs (brought to room temperature)", "2 teaspoons ground cinnamon", "¾ cup all-purpose flour", "½ teaspoon ground nutmeg", "1 cup white granulated sugar", "1 teaspoon baking powder", "1 teaspoon pumpkin pie spice (or an equivalent mixture of cloves, ginger, and allspice)", "6 tablespoons unsalted butter (softened)", "1 teaspoon pure vanilla extract", "1 cup confectioners’ sugar", "1  package cream cheese (8 ounces, softened)", "Additional confectioners’ sugar (for dusting)", "Ground cinnamon (optional)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the baking pan. Preheat the oven to 375°F. Grease a 10 x 15-inch or 9½ x 14-inch jelly roll pan, then cover the bottom with parchment paper to prevent sticking and simplify removal.", "name": "Prepare the baking pan. Preheat the oven to 375°F. Grease a 10 x 15-inch or 9½ x 14-inch jelly roll pan, then cover the bottom with parchment paper to prevent sticking and simplify removal.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-0"}, {"@type": "HowToStep", "text": "Place the all-purpose flour, baking powder, cinnamon, pumpkin pie spice, nutmeg, and salt in a small bowl. Whisk thoroughly until evenly distributed, then set the mixture aside.", "name": "Place the all-purpose flour, baking powder, cinnamon, pumpkin pie spice, nutmeg, and salt in a small bowl. Whisk thoroughly until evenly distributed, then set the mixture aside.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-1"}, {"@type": "HowToStep", "text": "In a large mixing bowl, beat the eggs with the granulated sugar until the mixture becomes pale, thick, and fluffy. Add the pumpkin purée and continue beating until fully incorporated.", "name": "In a large mixing bowl, beat the eggs with the granulated sugar until the mixture becomes pale, thick, and fluffy. Add the pumpkin purée and continue beating until fully incorporated.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-2"}, {"@type": "HowToStep", "text": "Add the prepared dry mixture to the pumpkin mixture. Blend only until no visible streaks of flour remain. Transfer the batter to the lined jelly roll pan and spread it into an even layer.", "name": "Add the prepared dry mixture to the pumpkin mixture. Blend only until no visible streaks of flour remain. Transfer the batter to the lined jelly roll pan and spread it into an even layer.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-3"}, {"@type": "HowToStep", "text": "Place the pan in the preheated oven and bake for 14 to 16 minutes. The cake is ready when its surface springs back gently after being lightly pressed.", "name": "Place the pan in the preheated oven and bake for 14 to 16 minutes. The cake is ready when its surface springs back gently after being lightly pressed.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-4"}, {"@type": "HowToStep", "text": "Leave the baked cake in the pan for 2 minutes. Carefully loosen the edges with a thin knife or spatula.", "name": "Leave the baked cake in the pan for 2 minutes. Carefully loosen the edges with a thin knife or spatula.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-5"}, {"@type": "HowToStep", "text": "Lightly coat a second sheet of parchment paper with nonstick cooking spray. Invert the cake onto the prepared parchment and remove the parchment that lined the baking pan. Using the parchment for support, roll the cake from one short end to the other.", "name": "Lightly coat a second sheet of parchment paper with nonstick cooking spray. Invert the cake onto the prepared parchment and remove the parchment that lined the baking pan. Using the parchment for support, roll the cake from one short end to the other.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-6"}, {"@type": "HowToStep", "text": "Position the wrapped cake seam-side down and allow it to cool fully in its rolled form. Cooling it this way establishes the spiral shape and reduces the likelihood of unrolling.", "name": "Position the wrapped cake seam-side down and allow it to cool fully in its rolled form. Cooling it this way establishes the spiral shape and reduces the likelihood of unrolling.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-7"}, {"@type": "HowToStep", "text": "Beat the softened cream cheese and butter in a medium bowl until completely smooth and evenly combined. Add the confectioners’ sugar and vanilla extract, then continue beating until the filling is light and fluffy.", "name": "Beat the softened cream cheese and butter in a medium bowl until completely smooth and evenly combined. Add the confectioners’ sugar and vanilla extract, then continue beating until the filling is light and fluffy.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-8"}, {"@type": "HowToStep", "text": "Carefully unroll the cooled pumpkin cake. Spread the cream cheese mixture evenly across the entire surface, reaching close to the edges.", "name": "Carefully unroll the cooled pumpkin cake. Spread the cream cheese mixture evenly across the entire surface, reaching close to the edges.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-9"}, {"@type": "HowToStep", "text": "Gently roll the cake again from the short end, enclosing the filling inside. Transfer it to a serving plate and position it seam-side down.", "name": "Gently roll the cake again from the short end, enclosing the filling inside. Transfer it to a serving plate and position it seam-side down.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-10"}, {"@type": "HowToStep", "text": "Trim both ends for a tidy presentation. Immediately before slicing, lightly dust the top with confectioners’ sugar. Add a small sprinkling of cinnamon when desired.", "name": "Trim both ends for a tidy presentation. Immediately before slicing, lightly dust the top with confectioners’ sugar. Add a small sprinkling of cinnamon when desired.", "url": "https://erecip.github.io/en/pumpkin-cream-cheese-roll/#wprm-recipe-40312-step-0-11"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Cream Cheese Roll"}</script>
