    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Lemon Pudding Cheesecake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A chilled, layered lemon cheesecake dessert featuring a buttery cinnamon-kissed graham cracker base, a smooth lemon pudding and cream cheese filling, and a generous layer of homemade vanilla whipped cream. Fresh lemon zest and slices provide a bright finishing touch.", "datePublished": "2020-08-04T02:47:05+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/lemon-pudding-cheesecake.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/lemon-pudding-cheesecake.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/lemon-pudding-cheesecake.png", "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/lemon-pudding-cheesecake.png"], "totalTime": "PT120M", "recipeIngredient": ["1  dash ground cinnamon", "4 tablespoons unsalted butter (melted)", "10  graham crackers (finely processed into approximately 1 1/2 cups crumbs)", "1 teaspoon freshly grated lemon zest", "6.8 ounces instant lemon pudding mix (equivalent to 2 small packages)", "2 cups coconut milk (or whole milk as indicated in the preparation)", "8 ounces cream cheese (softened to room temperature)", "1/3 cup granulated sugar", "1 teaspoon vanilla extract", "2 cups well-chilled heavy cream", "2  fresh lemons (for additional zest and decorative slices or peel)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the chilled heavy cream, granulated sugar, and vanilla extract in a large cold mixing bowl. Using a hand mixer, beat the ingredients together until the cream becomes airy and fluffy and develops stiff peaks.", "name": "Place the chilled heavy cream, granulated sugar, and vanilla extract in a large cold mixing bowl. Using a hand mixer, beat the ingredients together until the cream becomes airy and fluffy and develops stiff peaks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-0"}, {"@type": "HowToStep", "text": "Cover the prepared whipped cream and transfer it to the refrigerator until the dessert is ready to be assembled.", "name": "Cover the prepared whipped cream and transfer it to the refrigerator until the dessert is ready to be assembled.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-1"}, {"@type": "HowToStep", "text": "For a slightly softer initial consistency, the cream may be whipped just short of fully stiff peaks, allowing it to continue firming as it chills.", "name": "For a slightly softer initial consistency, the cream may be whipped just short of fully stiff peaks, allowing it to continue firming as it chills.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-2"}, {"@type": "HowToStep", "text": "Process the graham crackers in a blender or food processor until they are reduced to fine crumbs.", "name": "Process the graham crackers in a blender or food processor until they are reduced to fine crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-3"}, {"@type": "HowToStep", "text": "Melt the unsalted butter in the microwave. Place the graham cracker crumbs in a mixing bowl, then pour in the melted butter and add a dash of ground cinnamon.", "name": "Melt the unsalted butter in the microwave. Place the graham cracker crumbs in a mixing bowl, then pour in the melted butter and add a dash of ground cinnamon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-4"}, {"@type": "HowToStep", "text": "Stir until all of the crumbs are evenly coated and moistened.", "name": "Stir until all of the crumbs are evenly coated and moistened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-5"}, {"@type": "HowToStep", "text": "Firmly press the crumb mixture across the bottom of a 9 × 12-inch baking dish, forming an even crust layer.", "name": "Firmly press the crumb mixture across the bottom of a 9 × 12-inch baking dish, forming an even crust layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-6"}, {"@type": "HowToStep", "text": "Place the prepared crust in the refrigerator while making the lemon filling.", "name": "Place the prepared crust in the refrigerator while making the lemon filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-7"}, {"@type": "HowToStep", "text": "Add the room-temperature cream cheese to a large mixing bowl and beat with a hand mixer until completely smooth and creamy.", "name": "Add the room-temperature cream cheese to a large mixing bowl and beat with a hand mixer until completely smooth and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-8"}, {"@type": "HowToStep", "text": "Add the instant lemon pudding mix, coconut milk or whole milk, and 1 teaspoon of freshly grated lemon zest.", "name": "Add the instant lemon pudding mix, coconut milk or whole milk, and 1 teaspoon of freshly grated lemon zest.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-9"}, {"@type": "HowToStep", "text": "Continue beating until the mixture is thoroughly blended, silky, and free from lumps.", "name": "Continue beating until the mixture is thoroughly blended, silky, and free from lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-10"}, {"@type": "HowToStep", "text": "Remove the chilled graham cracker crust from the refrigerator.", "name": "Remove the chilled graham cracker crust from the refrigerator.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-11"}, {"@type": "HowToStep", "text": "Spoon or pour the prepared lemon cheesecake filling over the crust and spread it evenly from edge to edge.", "name": "Spoon or pour the prepared lemon cheesecake filling over the crust and spread it evenly from edge to edge.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-12"}, {"@type": "HowToStep", "text": "Carefully distribute the refrigerated whipped cream over the lemon filling, smoothing it into a soft, even top layer.", "name": "Carefully distribute the refrigerated whipped cream over the lemon filling, smoothing it into a soft, even top layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-13"}, {"@type": "HowToStep", "text": "Finish the cheesecake with additional freshly grated lemon zest. Thin lemon slices may also be arranged over the surface for decoration.", "name": "Finish the cheesecake with additional freshly grated lemon zest. Thin lemon slices may also be arranged over the surface for decoration.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-14"}, {"@type": "HowToStep", "text": "Cover the baking dish and refrigerate the dessert for a minimum of 2 hours, allowing the layers to become firm and the flavors to develop together.", "name": "Cover the baking dish and refrigerate the dessert for a minimum of 2 hours, allowing the layers to become firm and the flavors to develop together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-pudding-cheesecake/#wprm-recipe-45649-step-0-15"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Lemon Pudding Cheesecake"}</script>
