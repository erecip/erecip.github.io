n syrup, melted salted butter, beaten eggs, and vanilla extract in a medium mixing bowl. Stir gently until the ingredients are thoroughly incorporated and the mixture has a smooth, uniform consistency.", "name": "Make the filling. Place the granulated sugar, packed brown sugar, salt, light corn syrup, melted salted butter, beaten eggs, and vanilla extract in a medium mixing bowl. Stir gently until the ingredients are thoroughly incorporated and the mixture has a smooth, uniform consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-pecan-pie/#wprm-recipe-43793-step-0-1"}, {"@type": "HowToStep", "text": "Assemble the pie. Distribute the diced pecans evenly across the bottom of the prepared pastry shell. Slowly pour the syrup mixture over the pecans, allowing the filling to spread evenly throughout the crust.", "name": "Assemble the pie. Distribute the diced pecans evenly across the bottom of the prepared pastry shell. Slowly pour the syrup mixture over the pecans, allowing the filling to spread evenly throughout the crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-pecan-pie/#wprm-recipe-43793-step-0-2"}, {"@type": "HowToStep", "text": "Begin baking. Loosely cover the pie with aluminum foil to protect the pastry and surface from excessive browning. Transfer the pie to the preheated oven and bake for 30 minutes.", "name": "Begin baking. Loosely cover the pie with aluminum foil to protect the pastry and surface from excessive browning. Transfer the pie to the preheated oven and bake for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-pecan-pie/#wprm-recipe-43793-step-0-3"}, {"@type": "HowToStep", "text": "Continue uncovered. Carefully remove the foil and return the pie to the oven for an additional 20 minutes.", "name": "Continue uncovered. Carefully remove the foil and return the pie to the oven for an additional 20 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-pecan-pie/#wprm-recipe-43793-step-0-4"}, {"@type": "HowToStep", "text": "Check for doneness. Examine the center of the pie after the initial 50 minutes of baking. If the middle remains very loose or shakes considerably, cover the pie again with foil and continue baking for as long as 20 additional minutes, or until the filling is just set. A slight movement in the center is appropriate because the filling will firm further while cooling.", "name": "Check for doneness. Examine the center of the pie after the initial 50 minutes of baking. If the middle remains very loose or shakes considerably, cover the pie again with foil and continue baking for as long as 20 additional minutes, or until the filling is just set. A slight movement in the center is appropriate because the filling will firm further while cooling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-pecan-pie/#wprm-recipe-43793-step-0-5"}, {"@type": "HowToStep", "text": "Cool completely. Transfer the finished pecan pie to a wire rack and allow it to cool for several hours. For the firmest filling and easiest slicing, it may be left to set overnight.", "name": "Cool completely. Transfer the finished pecan pie to a wire rack and allow it to cool for several hours. For the firmest filling and easiest slicing, it may be left to set overnight.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-pecan-pie/#wprm-recipe-43793-step-0-6"}, {"@type": "HowToStep", "text": "Serve. Once completely cooled and set, cut the pie into thin slices and serve.", "name": "Serve. Once completely cooled and set, cut the pie into thin slices and serve.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pioneer-womans-pecan-pie/#wprm-recipe-43793-step-0-7"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pioneer Woman’s Pecan Pie"}</script>
