    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cranberry Orange Pecan Muffins", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender almond- and coconut-flour muffins flavored with fresh orange juice and zest, then filled with whole cranberries and chopped pecans. Honey provides sweetness, while coconut oil helps create a moist texture.", "datePublished": "2020-05-03T07:13:00+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/cranberry-orange-pecan-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/cranberry-orange-pecan-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/cranberry-orange-pecan-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/cranberry-orange-pecan-muffins2.png"], "cookTime": "PT25M", "totalTime": "PT45M", "recipeIngredient": ["2 1/3 cups finely milled almond flour", "1/4 cup honey", "2  large eggs (brought to room temperature)", "1/3 cup coconut flour", "1/2 cup freshly squeezed orange juice (preferably fresh)", "1 teaspoon pure vanilla extract", "1/2 teaspoon baking soda", "2 tablespoons coconut oil (melted and allowed to cool slightly)", "1/2 tablespoon freshly grated orange zest", "1/2 cup pecans (roughly chopped)", "1 cup whole fresh or frozen cranberries (not dried)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 175°C (350°F). Line a muffin tin with paper liners to make the baked muffins easier to remove.", "name": "Preheat the oven to 175°C (350°F). Line a muffin tin with paper liners to make the baked muffins easier to remove.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/#wprm-recipe-42651-step-0-0"}, {"@type": "HowToStep", "text": "Place the eggs, vanilla extract, melted coconut oil, honey, orange juice, and grated orange zest in a large mixing bowl.", "name": "Place the eggs, vanilla extract, melted coconut oil, honey, orange juice, and grated orange zest in a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/#wprm-recipe-42651-step-0-1"}, {"@type": "HowToStep", "text": "Sprinkle the baking soda over the orange juice mixture, allowing it to react and foam. Stir until all of the ingredients are thoroughly combined.", "name": "Sprinkle the baking soda over the orange juice mixture, allowing it to react and foam. Stir until all of the ingredients are thoroughly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/#wprm-recipe-42651-step-0-2"}, {"@type": "HowToStep", "text": "Incorporate the finely ground almond flour and coconut flour into the wet mixture. Mix gently by hand or at low speed only until no dry flour remains. Avoid excessive mixing to help preserve a tender muffin texture.", "name": "Incorporate the finely ground almond flour and coconut flour into the wet mixture. Mix gently by hand or at low speed only until no dry flour remains. Avoid excessive mixing to help preserve a tender muffin texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/#wprm-recipe-42651-step-0-3"}, {"@type": "HowToStep", "text": "Carefully fold the whole cranberries and chopped pecans through the batter without crushing the berries. Reserve a small number of cranberries for decorating the tops, if desired.", "name": "Carefully fold the whole cranberries and chopped pecans through the batter without crushing the berries. Reserve a small number of cranberries for decorating the tops, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/#wprm-recipe-42651-step-0-4"}, {"@type": "HowToStep", "text": "Fill the muffin cups. Divide the batter among the prepared muffin liners, filling each cup to the top. Lightly press the batter down so that each portion is firmly packed. Arrange the reserved cranberries over the surface of the muffins.", "name": "Fill the muffin cups. Divide the batter among the prepared muffin liners, filling each cup to the top. Lightly press the batter down so that each portion is firmly packed. Arrange the reserved cranberries over the surface of the muffins.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/#wprm-recipe-42651-step-0-5"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for approximately 25 minutes, or until a toothpick inserted into the center of a muffin emerges clean.", "name": "Bake in the preheated oven for approximately 25 minutes, or until a toothpick inserted into the center of a muffin emerges clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/#wprm-recipe-42651-step-0-6"}, {"@type": "HowToStep", "text": "Leave the muffins in the pan for at least 20 minutes, allowing them to cool completely before removal. This cooling period helps prevent the muffins from breaking apart while they are still warm.", "name": "Leave the muffins in the pan for at least 20 minutes, allowing them to cool completely before removal. This cooling period helps prevent the muffins from breaking apart while they are still warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cranberry-orange-pecan-muffins/#wprm-recipe-42651-step-0-7"}], "recipeCategory": ["Muffins"], "keywords": "Cranberry Orange Pecan Muffins"}</script>
