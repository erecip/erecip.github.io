    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Maple Bourbon Smash", "author": {"@type": "Person", "name": "BenDes"}, "description": "A refined bourbon cocktail featuring fresh citrus, rosemary, orange bitters, and a warmly infused maple syrup. Ginger beer creates a lively, spiced finish, while soda water provides a lighter and more restrained alternative.", "datePublished": "2022-06-25T04:57:53+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/maple-bourbon-smash/maple-bourbon-smash.png", "https://easy-recipes322.github.io/easy-recipes323/en/maple-bourbon-smash/maple-bourbon-smash.png", "https://easy-recipes322.github.io/easy-recipes323/en/maple-bourbon-smash/maple-bourbon-smash.png", "https://easy-recipes322.github.io/easy-recipes323/en/maple-bourbon-smash/maple-bourbon-smash.png"], "prepTime": "PT15M", "cookTime": "PT3M", "totalTime": "PT18M", "recipeIngredient": ["1  whole star anise pod", "½ cup water", "1  fresh rosemary sprig", "2  cinnamon sticks (snapped in half to encourage quicker infusion)", "1  orange wheel", "½ cup pure maple syrup (preferably Grade A dark amber)", "1- inch piece fresh ginger (peeled and gently crushed)", "2 ounces bourbon (preferably Maker’s Mark)", "1 tablespoon freshly squeezed lemon juice", "Ginger beer or soda water (approximately 2–3 ounces for finishing)", "1  fresh rosemary sprig measuring roughly 2–3 inches (plus additional rosemary for garnish)", "5  drops orange bitters", "2 tablespoons prepared spiced maple syrup", "1  orange wheel (for muddling and garnishing)", "2 tablespoons freshly squeezed orange juice", "Ice (for shaking and serving)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Pour the maple syrup and water into a small saucepan. Set the pan over medium-high heat and bring the mixture to a boil.", "name": "Pour the maple syrup and water into a small saucepan. Set the pan over medium-high heat and bring the mixture to a boil.", "  forcefully, as excessive muddling may introduce unwanted bitterness.", "name": "Using a muddler, press and turn the orange and rosemary gently to release their juice and aromatic oils. Avoid crushing them too forcefully, as excessive muddling may introduce unwanted bitterness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-bourbon-smash/#wprm-recipe-40593-step-0-6"}, {"@type": "HowToStep", "text": "Measure 2 tablespoons of the cooled spiced maple syrup into the shaker containing the muddled citrus and rosemary.", "name": "Measure 2 tablespoons of the cooled spiced maple syrup into the shaker containing the muddled citrus and rosemary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-bourbon-smash/#wprm-recipe-40593-step-0-7"}, {"@type": "HowToStep", "text": "Pour in the bourbon and add the orange bitters.", "name": "Pour in the bourbon and add the orange bitters.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-bourbon-smash/#wprm-recipe-40593-step-0-8"}, {"@type": "HowToStep", "text": "Fill the shaker approximately three-quarters full with ice. Shake vigorously for 10–12 seconds, or until the outside of the shaker becomes thoroughly chilled and frosted.", "name": "Fill the shaker approximately three-quarters full with ice. Shake vigorously for 10–12 seconds, or until the outside of the shaker becomes thoroughly chilled and frosted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-bourbon-smash/#wprm-recipe-40593-step-0-9"}, {"@type": "HowToStep", "text": "Fill a rocks glass with fresh ice cubes.", "name": "Fill a rocks glass with fresh ice cubes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/maple-bourbon-smash/#wprm-recipe-40593-step-0-10"}, {"@type": "HowToStep", "text": "Fine-strain the shaken cocktail into the prepared glass to remove small pieces of pulp and herbs.", "name": "Fine-strain the shaken cocktail into the prepared glass to remove small pieces of pulp
