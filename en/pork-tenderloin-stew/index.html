-recipe-46159-step-0-10"}, {"@type": "HowToStep", "text": "Return the reserved browned pork to the Dutch oven and continue heating until the meat is thoroughly warmed.", "name": "Return the reserved browned pork to the Dutch oven and continue heating until the meat is thoroughly warmed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-stew/#wprm-recipe-46159-step-0-11"}, {"@type": "HowToStep", "text": "Lower the heat and gently blend in the ½ cup sour cream.", "name": "Lower the heat and gently blend in the ½ cup sour cream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-stew/#wprm-recipe-46159-step-0-12"}, {"@type": "HowToStep", "text": "Once the sour cream has been incorporated, keep the stew below a boil to help prevent the creamy mixture from curdling.", "name": "Once the sour cream has been incorporated, keep the stew below a boil to help prevent the creamy mixture from curdling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-stew/#wprm-recipe-46159-step-0-13"}, {"@type": "HowToStep", "text": "Serve the pork tenderloin stew hot. Finish each portion with chopped fresh parsley and freshly cracked black pepper, if desired.", "name": "Serve the pork tenderloin stew hot. Finish each portion with chopped fresh parsley and freshly cracked black pepper, if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pork-tenderloin-stew/#wprm-recipe-46159-step-0-14"}], "recipeCategory": ["Main Course"], "keywords": "Pork Tenderloin Stew"}</script>
