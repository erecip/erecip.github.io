nly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pound-cake-recipe/#wprm-recipe-49145-step-0-6"}, {"@type": "HowToStep", "text": "Bake for approximately 40 minutes or until a wooden skewer inserted into the center emerges with just a few moist crumbs attached.", "name": "Bake for approximately 40 minutes or until a wooden skewer inserted into the center emerges with just a few moist crumbs attached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pound-cake-recipe/#wprm-recipe-49145-step-0-7"}, {"@type": "HowToStep", "text": "Cool the loaf in the pan for 10 minutes before gently transferring it to a wire rack to cool completely.", "name": "Cool the loaf in the pan for 10 minutes before gently transferring it to a wire rack to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pound-cake-recipe/#wprm-recipe-49145-step-0-8"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pound Cake Recipe"}</script>
