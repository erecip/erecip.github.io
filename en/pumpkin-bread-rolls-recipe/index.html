    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Bread Rolls Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender and pillowy vegan pumpkin dinner rolls made with minimal ingredients—ideal as a comforting side dish for cozy autumn or winter meals.", "datePublished": "2024-08-24T15:19:56+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/Pumpkin-Bread-Rolls-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/Pumpkin-Bread-Rolls-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/Pumpkin-Bread-Rolls-Recipe1.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/Pumpkin-Bread-Rolls-Recipe1.png"], "prepTime": "PT15M", "cookTime": "PT25M", "totalTime": "PT160M", "recipeIngredient": ["1 teaspoon pumpkin pie spice (optional)", "2 tablespoons 25g granulated sugar, coconut sugar, or maple syrup", "1 tablespoon maple syrup (for glaze)", "½ cup 120g warm dairy-free milk", "½ cup 115g vegan butter, softened", "3 ½ cups 440g all-purpose or bread flour, plus more for dusting", "1 tablespoon melted vegan butter (oil, or water (for glaze))", "Pinch of salt (if using unsalted vegan butter)", "1 cup 200g pumpkin puree (unsweetened)", "2 ¼ teaspoons instant dry yeast"], "recipeInstructions": [{"@type": "HowToStep", "text": "Add all dough components—flour, pumpkin puree, warm milk, softened vegan butter, sugar, yeast, pumpkin pie spice (if using), and salt—into the bowl of a stand mixer fitted with the dough hook or into a large mixing bowl.", "name": "Add all dough components—flour, pumpkin puree, warm milk, softened vegan butter, sugar, yeast, pumpkin pie spice (if using), and salt—into the bowl of a stand mixer fitted with the dough hook or into a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/#wprm-recipe-13156-step-0-0"}, {"@type": "HowToStep", "text": "Knead the mixture for 5–10 minutes if using a mixer, until it becomes soft and elastic. If kneading by hand, use a sturdy spoon to combine before transferring to a lightly floured surface to knead until smooth and pliable.", "name": "Knead the mixture for 5–10 minutes if using a mixer, until it becomes soft and elastic. If kneading by hand, use a sturdy spoon to combine before transferring to a lightly floured surface to knead until smooth and pliable.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/#wprm-recipe-13156-step-0-1"}, {"@type": "HowToStep", "text": "Adjust the consistency by adding more flour if sticky or a splash more milk if dry. A softer dough results in fluffier rolls.", "name": "Adjust the consistency by adding more flour if sticky or a splash more milk if dry. A softer dough results in fluffier rolls.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/#wprm-recipe-13156-step-0-2"}, {"@type": "HowToStep", "text": "Transfer the dough to a greased bowl, cover with a clean kitchen towel, and set in a warm area to rise for about 1 hour, or until it doubles in volume.", "name": "Transfer the dough to a greased bowl, cover with a clean kitchen towel, and set in a warm area to rise for about 1 hour, or until it doubles in volume.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/#wprm-recipe-13156-step-0-3"}, {"@type": "HowToStep", "text": "Once risen, divide the dough into 12 even portions, approximately 75g each. Shape each into a smooth round ball on a lightly floured surface.", "name": "Once risen, divide the dough into 12 even portions, approximately 75g each. Shape each into a smooth round ball on a lightly floured surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/#wprm-recipe-13156-step-0-4"}, {"@type": "HowToStep", "text": "Prepare an 11 x 6-inch (28 x 15 cm) baking dish by greasing or lining it with parchment paper. Arrange the dough balls inside and cover again with a towel. Let them rise for a second time in a warm place for about 1 hour until noticeably puffy.", "name": "Prepare an 11 x 6-inch (28 x 15 cm) baking dish by greasing or lining it with parchment paper. Arrange the dough balls inside and cover again with a towel. Let them rise for a second time in a warm place for about 1 hour until noticeably puffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/#wprm-recipe-13156-step-0-5"}, {"@type": "HowToStep", "text": "Preheat your oven to 350°F (180°C). Once the rolls are well-risen, bake for 22–28 minutes, tenting with foil if browning too fast. Rolls should be golden and sound hollow when tapped, or a toothpick inserted between rolls should come out clean.", "name": "Preheat your oven to 350°F (180°C). Once the rolls are well-risen, bake for 22–28 minutes, tenting with foil if browning too fast. Rolls should be golden and sound hollow when tapped, or a toothpick inserted between rolls should come out clean.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/#wprm-recipe-13156-step-0-6"}, {"@type": "HowToStep", "text": "For the glaze, stir together the maple syrup and melted vegan butter (or alternative). Brush over the warm rolls post-bake and garnish with optional flaked salt or pumpkin seeds.", "name": "For the glaze, stir together the maple syrup and melted vegan butter (or alternative). Brush over the warm rolls post-bake and garnish with optional flaked salt or pumpkin seeds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/#wprm-recipe-13156-step-0-7"}, {"@type": "HowToStep", "text": "Serve warm with vegan butter. Best enjoyed fresh, though leftovers can be stored at room temperature in an airtight container for up to 3 days or frozen for 1 month. Reheat before serving.", "name": "Serve warm with vegan butter. Best enjoyed fresh, though leftovers can be stored at room temperature in an airtight container for up to 3 days or frozen for 1 month. Reheat before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-bread-rolls-recipe/#wprm-recipe-13156-step-0-8"}], "recipeCategory": ["Bread"], "recipeCuisine": ["American"], "keywords": "Pumpkin Bread Rolls Recipe"}</script>
