    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gluten Free Lemon Brownies", "author": {"@type": "Person", "name": "BenDes"}, "description": "Bright, tangy, and indulgently rich, these gluten free lemon brownies offer a citrus-forward twist on the traditional chocolate version. With their dense, fudgy texture and vibrant lemon zest throughout, they're finished with a luscious cream cheese icing that enhances the zesty profile. This simple recipe yields a delightful dessert that is both satisfying and refreshing.", "datePublished": "2023-12-11T14:21:10+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-lemon-brownies/Gluten-Free-Lemon-Brownies4-e1743599609127.webp", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-lemon-brownies/Gluten-Free-Lemon-Brownies4-e1743599609127.webp", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-lemon-brownies/Gluten-Free-Lemon-Brownies4-e1743599609127.webp", "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-lemon-brownies/Gluten-Free-Lemon-Brownies4-e1743599609127.webp"], "recipeYield": ["16"], "prepTime": "PT30M", "cookTime": "PT20M", "totalTime": "PT50M", "recipeIngredient": ["Lemon Brownies:", "2  large eggs (US or medium eggs (UK), at room temperature)", "½ teaspoon vanilla bean paste or 1 teaspoon vanilla extract", "170 g 1½ sticks unsalted butter, melted and slightly cooled", "¼ teaspoon salt", "250 g 1¼ cups caster or granulated sugar", "Zest of 2 unwaxed organic lemons", "2  large egg yolks (US or medium (UK), at room temperature)", "½ teaspoon xanthan gum (or ¼ teaspoon if using flour blend with xanthan)", "45 g 3 tablespoons freshly squeezed lemon juice", "150 g 1¼ cups plain gluten free flour blend (e.g., Doves Farm Freee)", "Lemon Cream Cheese Icing:", "10 g 2 teaspoons freshly squeezed lemon juice", "55 g ¼ cup full-fat cream cheese, softened", "½ teaspoon vanilla bean paste or 1 teaspoon vanilla extract", "Zest of ½ organic unwaxed lemon", "120 g 1 cup sifted powdered sugar"], "recipeInstructions": [{"@type": "HowToStep", "text": "Adjust your oven rack to the center and preheat the oven to 350ºF (180ºC). Line a 9-inch (23 cm) square baking tin with parchment paper, ensuring there’s overhang for easy removal after baking.", "name": "Adjust your oven rack to the center and preheat the oven to 350ºF (180ºC). Line a 9-inch (23 cm) square baking tin with parchment paper, ensuring there’s overhang for easy removal after baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-lemon-brownies/#wprm-recipe-24650-step-0-0"}, {"@type": "HowToStep", "text": "In a large bowl, combine the caster sugar and lemon zest. Using your fingertips, rub the zest into the sugar to release aromatic oils and maximize flavor.", "name": "In a large bowl, combine the caster sugar and lemon zest. Using your fingertips, rub the zest into the sugar to release aromatic oils and maximize flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-lemon-brownies/#wprm-recipe-24650-step-0-1"}, {"@type": "HowToStep", "text": "Add the melted butter, eggs, egg yolks, and vanilla to the sugar-zest mixture. Whisk gently until smooth and cohesive, avoiding overmixing to preserve the brownies’ fudgy texture.", "name": "Add the melted butter, eggs, egg yolks, and vanilla to the sugar-zest mixture. Whisk gently until smooth and cohesive, avoiding overmixing to preserve the brownies’ fudgy texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-lemon-brownies/#wprm-recipe-24650-step-0-2"}, {"@type": "HowToStep", "text": "Incorporate the lemon juice and continue whisking until fully combined.", "name": "Incorporate the lemon juice and continue whisking until fully combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gluten-free-lemon-brownies/#wprm-recipe-24650-step-0-3"}, {"@type": "HowToStep", "tex
