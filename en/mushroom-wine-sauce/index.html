    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mushroom Wine Sauce", "author": {"@type": "Person", "name": "BenDes"}, "description": "A velvety, indulgent sauce perfect for enhancing meats, pasta, and vegetables, this Mushroom Wine Sauce blends savory depth with creamy richness. Wine, parmesan, and broth bring layered complexity, resulting in a versatile, restaurant-quality finish ready in minutes.", "datePublished": "2024-04-06T00:43:00+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Mushroom-Wine-Sauce.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Mushroom-Wine-Sauce-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Mushroom-Wine-Sauce-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/Mushroom-Wine-Sauce-480x270.png"], "recipeIngredient": ["½ cup 125 ml chicken or vegetable broth", "2 tsp fresh thyme leaves (or ¼ – ½ tsp dried)", "2 tbsp unsalted butter", "½ cup parmesan (finely grated (30g / 1 oz))", "1 cup 250 ml heavy / thickened cream", "½ tbsp olive oil", "Pinch of salt and pepper", "2  garlic cloves (minced)", "¼ cup 65 ml dry white wine or rosé", "300 g / 10 oz mushrooms (sliced)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a skillet over medium-high heat, combine the butter and olive oil, allowing the butter to melt completely. Introduce the sliced mushrooms and sauté leisurely until they reach a golden hue, approximately 4 to 5 minutes, stirring occasionally.", "name": "In a skillet over medium-high heat, combine the butter and olive oil, allowing the butter to melt completely. Introduce the sliced mushrooms and sauté leisurely until they reach a golden hue, approximately 4 to 5 minutes, stirring occasionally.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-wine-sauce/#wprm-recipe-11805-step-0-0"}, {"@type": "HowToStep", "text": "Once the mushrooms are nearly browned, incorporate the minced garlic along with a pinch of salt and pepper. Continue cooking for around 1 minute, or until the garlic becomes fragrant and lightly golden.", "name": "Once the mushrooms are nearly browned, incorporate the minced garlic along with a pinch of salt and pepper. Continue cooking for around 1 minute, or until the garlic becomes fragrant and lightly golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-wine-sauce/#wprm-recipe-11805-step-0-1"}, {"@type": "HowToStep", "text": "Pour in the wine; it should sizzle upon contact. Stir briskly, scraping any browned bits from the base of the pan, and allow the liquid to mostly evaporate within a minute.", "name": "Pour in the wine; it should sizzle upon contact. Stir briskly, scraping any browned bits from the base of the pan, and allow the liquid to mostly evaporate within a minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-wine-sauce/#wprm-recipe-11805-step-0-2"}, {"@type": "HowToStep", "text": "Add the broth, cream, and finely grated parmesan to the pan. Stir well, then reduce the heat to medium, maintaining a gentle simmer. Avoid a vigorous boil to prevent the cream from curdling.", "name": "Add the broth, cream, and finely grated parmesan to the pan. Stir well, then reduce the heat to medium, maintaining a gentle simmer. Avoid a vigorous boil to prevent the cream from curdling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-wine-sauce/#wprm-recipe-11805-step-0-3"}, {"@type": "HowToStep", "text": "Let the sauce simmer for 2 to 3 minutes, stirring occasionally, until it achieves a slightly thickened consistency—rich but not overly dense.", "name": "Let the sauce simmer for 2 to 3 minutes, stirring occasionally, until it achieves a slightly thickened consistency—rich but not overly dense.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-wine-sauce/#wprm-recipe-11805-step-0-4"}, {"@type": "HowToStep", "text": "Fold in the thyme leaves, adjusting seasoning with additional salt and pepper as needed. Remove from heat.", "name": "Fold in the thyme leaves, adjusting seasoning with additional salt and pepper as needed. Remove from heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-wine-sauce/#wprm-recipe-11805-step-0-5"}, {"@type": "HowToStep", "text": "Serve generously over grilled steak, poultry, or pork. Alternatively, use it to coat pasta, fill baked potatoes, or accompany vegetables and omelettes.", "name": "Serve generously over grilled steak, poultry, or pork. Alternatively, use it to coat pasta, fill baked potatoes, or accompany vegetables and omelettes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-wine-sauce/#wprm-recipe-11805-step-0-6"}]}</script>
