    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Zucchini Sauce", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy zucchini pasta sauce prepared with sweet onion, garlic, Romano cheese, and a generous blend of fresh basil, oregano, and mint. Slowly cooking the shredded zucchini softens it into a rich, herbaceous sauce that coats pasta beautifully.", "datePublished": "2022-07-22T11:18:51+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/zucchini-sauce2.png", "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/zucchini-sauce2.png", "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/zucchini-sauce2.png", "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/zucchini-sauce2.png"], "cookTime": "PT15M", "totalTime": "PT15M", "recipeIngredient": ["12 oz dried pasta (any preferred shape)", "1 cup heavy cream", "2 1/2 lb fresh zucchini", "3/4 cup finely grated Romano cheese", "1 cup sweet onion (finely diced, such as Vidalia)", "1 1/2 tbsp freshly minced garlic", "3/4 cup extra-virgin olive oil", "1 tsp freshly ground black pepper", "1 tsp kosher salt", "Small pinch crushed red pepper flakes", "2 tbsp finely chopped fresh basil (for cooking)", "2 tbsp finely chopped fresh oregano (for cooking)", "2 tbsp finely chopped fresh mint (for cooking)", "2 tbsp chopped fresh basil (for finishing)", "2 tbsp chopped fresh oregano (for finishing)", "2 tbsp chopped fresh mint (for finishing)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of generously salted water to a rolling boil. Add the dried pasta and prepare it according to the package instructions until it reaches an al dente texture.", "name": "Bring a large pot of generously salted water to a rolling boil. Add the dried pasta and prepare it according to the package instructions until it reaches an al dente texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-0"}, {"@type": "HowToStep", "text": "Before draining, scoop out and reserve 1 cup of the starchy pasta cooking water. Drain the pasta and set it aside. If necessary, coat it lightly with a small drizzle of olive oil to keep the pieces from adhering to one another while the sauce is prepared.", "name": "Before draining, scoop out and reserve 1 cup of the starchy pasta cooking water. Drain the pasta and set it aside. If necessary, coat it lightly with a small drizzle of olive oil to keep the pieces from adhering to one another while the sauce is prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-1"}, {"@type": "HowToStep", "text": "While the pasta is cooking, remove the ends from the zucchini and slice each one lengthwise into halves. Scoop out the seeds.", "name": "While the pasta is cooking, remove the ends from the zucchini and slice each one lengthwise into halves. Scoop out the seeds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-2"}, {"@type": "HowToStep", "text": "Using the coarse side of a box grater or the shredding attachment of a food processor, grate the zucchini into shreds. Set the prepared zucchini aside.", "name": "Using the coarse side of a box grater or the shredding attachment of a food processor, grate the zucchini into shreds. Set the prepared zucchini aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-3"}, {"@type": "HowToStep", "text": "Pour the extra-virgin olive oil into a large skillet and place it over medium-high heat.", "name": "Pour the extra-virgin olive oil into a large skillet and place it over medium-high heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-4"}, {"@type": "HowToStep", "text": "Once the oil is hot, add the diced sweet onion. Sauté for approximately 3 minutes, or until the onion begins to soften.", "name": "Once the oil is hot, add the diced sweet onion. Sauté for approximately 3 minutes, or until the onion begins to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-5"}, {"@type": "HowToStep", "text": "Stir in the crushed red pepper flakes and minced garlic. Continue cooking for another minute, just until the garlic becomes aromatic.", "name": "Stir in the crushed red pepper flakes and minced garlic. Continue cooking for another minute, just until the garlic becomes aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-6"}, {"@type": "HowToStep", "text": "Transfer the shredded zucchini to the skillet. Season with the kosher salt and black pepper, then add 1 tablespoon each of the chopped basil, oregano, and mint.", "name": "Transfer the shredded zucchini to the skillet. Season with the kosher salt and black pepper, then add 1 tablespoon each of the chopped basil, oregano, and mint.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-7"}, {"@type": "HowToStep", "text": "Increase the heat briefly until the zucchini mixture begins to bubble gently. Cover the skillet, lower the heat to medium-low, and cook for approximately 15 minutes.", "name": "Increase the heat briefly until the zucchini mixture begins to bubble gently. Cover the skillet, lower the heat to medium-low, and cook for approximately 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-8"}, {"@type": "HowToStep", "text": "Stir the mixture from time to time during cooking, checking the bottom of the skillet to ensure the zucchini does not stick.", "name": "Stir the mixture from time to time during cooking, checking the bottom of the skillet to ensure the zucchini does not stick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-9"}, {"@type": "HowToStep", "text": "Remove the lid after the 15-minute cooking period. Pour in the heavy cream and stir in the remaining 1 tablespoon each of basil, oregano, and mint reserved for the sauce.", "name": "Remove the lid after the 15-minute cooking period. Pour in the heavy cream and stir in the remaining 1 tablespoon each of basil, oregano, and mint reserved for the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-10"}, {"@type": "HowToStep", "text": "Allow the mixture to heat through again, cooking just long enough for the cream to warm completely and the sauce to thicken slightly.", "name": "Allow the mixture to heat through again, cooking just long enough for the cream to warm completely and the sauce to thicken slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-11"}, {"@type": "HowToStep", "text": "Stir the finely grated Romano cheese into the hot zucchini sauce until evenly incorporated.", "name": "Stir the finely grated Romano cheese into the hot zucchini sauce until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-12"}, {"@type": "HowToStep", "text": "If the consistency is thicker than desired, add the reserved pasta cooking water gradually, using only enough to loosen the sauce to the preferred texture.", "name": "If the consistency is thicker than desired, add the reserved pasta cooking water gradually, using only enough to loosen the sauce to the preferred texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-13"}, {"@type": "HowToStep", "text": "Add the cooked pasta to the skillet and toss until thoroughly coated, or portion the pasta first and spoon the zucchini sauce over each serving.", "name": "Add the cooked pasta to the skillet and toss until thoroughly coated, or portion the pasta first and spoon the zucchini sauce over each serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-14"}, {"@type": "HowToStep", "text": "Finish the dish with the additional 2 tablespoons each of fresh basil, oregano, and mint scattered over the top immediately before serving.", "name": "Finish the dish with the additional 2 tablespoons each of fresh basil, oregano, and mint scattered over the top immediately before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/zucchini-sauce/#wprm-recipe-41632-step-0-15"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian"], "keywords": "Zucchini Sauce"}</script>
