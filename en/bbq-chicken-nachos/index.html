    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "BBQ Chicken Nachos", "author": {"@type": "Person", "name": "BenDes"}, "description": "An irresistible blend of smoky barbecue flavors layered over crisp tortilla chips and smothered in melted cheese, these BBQ Chicken Nachos are the ideal centerpiece for a casual gathering or spirited game day spread.", "datePublished": "2023-03-18T16:13:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/bbq-chicken-nachos.png", "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/bbq-chicken-nachos.png", "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/bbq-chicken-nachos.png", "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/bbq-chicken-nachos.png"], "recipeYield": ["4"], "prepTime": "PT30M", "cookTime": "PT15M", "totalTime": "PT45M", "recipeIngredient": ["¼ cup chopped cilantro and/or sliced green onions", "1  large boneless (skinless chicken breast (approximately 10 oz), or 1½ cups pre-cooked shredded chicken)", "½  red onion (finely diced (about ½ cup))", "2 cups shredded Monterey Jack cheese", "6 oz tortilla chips (slightly over half a standard 10 oz bag)", "1  small tomato (diced)", "1  jalapeño (thinly sliced (optional))", "½ cup barbecue sauce"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the chicken breast in a large saucepan and add enough water to submerge it by approximately 1 inch. Bring to a gentle boil over medium-high heat, then lower the heat to medium and simmer for 12 to 14 minutes, or until the internal temperature reaches 165°F.", "name": "Place the chicken breast in a large saucepan and add enough water to submerge it by approximately 1 inch. Bring to a gentle boil over medium-high heat, then lower the heat to medium and simmer for 12 to 14 minutes, or until the internal temperature reaches 165°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/#wprm-recipe-31959-step-0-0"}, {"@type": "HowToStep", "text": "Remove the chicken from the water using a slotted spoon or tongs and shred it thoroughly. For quick shredding, use a hand mixer in a deep bowl or process it briefly in a stand mixer. Alternatively, chop finely with a knife.", "name": "Remove the chicken from the water using a slotted spoon or tongs and shred it thoroughly. For quick shredding, use a hand mixer in a deep bowl or process it briefly in a stand mixer. Alternatively, chop finely with a knife.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/#wprm-recipe-31959-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the shredded chicken to a mixing bowl and stir in the barbecue sauce until the meat is fully coated.", "name": "Transfer the shredded chicken to a mixing bowl and stir in the barbecue sauce until the meat is fully coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/#wprm-recipe-31959-step-0-2"}, {"@type": "HowToStep", "text": "Preheat your oven to 400°F.", "name": "Preheat your oven to 400°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/#wprm-recipe-31959-step-0-3"}, {"@type": "HowToStep", "text": "Arrange half of the tortilla chips on a large baking sheet, slightly overlapping them. Distribute approximately ¾ cup of the barbecue chicken over the chips, then sprinkle with half of the diced red onion, half the jalapeño slices (if using), and half of the shredded cheese.", "name": "Arrange half of the tortilla chips on a large baking sheet, slightly overlapping them. Distribute approximately ¾ cup of the barbecue chicken over the chips, then sprinkle with half of the diced red onion, half the jalapeño slices (if using), and half of the shredded cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/#wprm-recipe-31959-step-0-4"}, {"@type": "HowToStep", "text": "Layer the remaining chips over the first layer. Top with the remaining chicken mixture, onions, jalapeños, and cheese.", "name": "Layer the remaining chips over the first layer. Top with the remaining chicken mixture, onions, jalapeños, and cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/#wprm-recipe-31959-step-0-5"}, {"@type": "HowToStep", "text": "Bake for 15 to 20 minutes, or until the cheese has melted and taken on a light golden hue.", "name": "Bake for 15 to 20 minutes, or until the cheese has melted and taken on a light golden hue.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/#wprm-recipe-31959-step-0-6"}, {"@type": "HowToStep", "text": "Once removed from the oven, garnish with chopped cilantro and diced tomato before serving.", "name": "Once removed from the oven, garnish with chopped cilantro and diced tomato before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/bbq-chicken-nachos/#wprm-recipe-31959-step-0-7"}], "recipeCategory": ["Appetizer", "Main Course"], "recipeCuisine": ["American"], "keywords": "bbq chicken nachos"}</script>
