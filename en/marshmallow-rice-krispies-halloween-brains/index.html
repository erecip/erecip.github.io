    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Marshmallow Rice Krispies Halloween Brains", "author": {"@type": "Person", "name": "BenDes"}, "description": "A spooky Halloween variation on classic marshmallow cereal treats, these edible brains combine crisp puffed rice with a buttery marshmallow coating, vivid red coloring, and hand-drawn vein details for a suitably creepy finish.", "datePublished": "2018-03-13T21:23:13+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/marshmallow-rice-krispies-halloween-brains.png", "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/marshmallow-rice-krispies-halloween-brains.png", "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/marshmallow-rice-krispies-halloween-brains.png", "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/marshmallow-rice-krispies-halloween-brains.png"], "totalTime": "PT5M", "recipeIngredient": ["6 cups plain marshmallows (preferably a variety that melts smoothly and consistently)", "½ teaspoon salt", "4 cups crisp puffed rice cereal (such as Rice Krispies)", "Red food coloring (with gel coloring preferred for stronger color without loosening the mixture)", "6 tablespoons unsalted butter (softened to room temperature)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Melt the butter and marshmallows. Bring a pot of water to a gentle simmer and position a heat-safe bowl over the top, making certain that the bottom of the bowl does not come into contact with the water.", "name": "Melt the butter and marshmallows. Bring a pot of water to a gentle simmer and position a heat-safe bowl over the top, making certain that the bottom of the bowl does not come into contact with the water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/#wprm-recipe-43823-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened unsalted butter and marshmallows in the bowl. Stir continuously for 2–4 minutes, or until both ingredients have melted together into a completely smooth mixture. Using gentle indirect heat helps the marshmallow base melt evenly without scorching or developing lumps.", "name": "Place the softened unsalted butter and marshmallows in the bowl. Stir continuously for 2–4 minutes, or until both ingredients have melted together into a completely smooth mixture. Using gentle indirect heat helps the marshmallow base melt evenly without scorching or developing lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/#wprm-recipe-43823-step-0-1"}, {"@type": "HowToStep", "text": "Add the salt and red coloring. Remove the bowl from the heat. Immediately mix in the salt along with enough red food coloring to achieve the desired shade.", "name": "Add the salt and red coloring. Remove the bowl from the heat. Immediately mix in the salt along with enough red food coloring to achieve the desired shade.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/#wprm-recipe-43823-step-0-2"}, {"@type": "HowToStep", "text": "Stir vigorously for approximately 30 seconds so the coloring is distributed evenly throughout the melted marshmallow mixture.", "name": "Stir vigorously for approximately 30 seconds so the coloring is distributed evenly throughout the melted marshmallow mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/#wprm-recipe-43823-step-0-3"}, {"@type": "HowToStep", "text": "Coat the puffed rice cereal. Add the puffed rice cereal to the tinted marshmallow mixture. Fold gently yet thoroughly until each piece of cereal is evenly coated.", "name": "Coat the puffed rice cereal. Add the puffed rice cereal to the tinted marshmallow mixture. Fold gently yet thoroughly until each piece of cereal is evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/#wprm-recipe-43823-step-0-4"}, {"@type": "HowToStep", "text": "Continue working while the mixture remains warm and flexible, as it will become more difficult to shape as it cools.", "name": "Continue working while the mixture remains warm and flexible, as it will become more difficult to shape as it cools.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/#wprm-recipe-43823-step-0-5"}, {"@type": "HowToStep", "text": "Form the brain shapes. Lightly coat your hands with cooking oil or butter to prevent sticking. Scoop out portions of the cereal mixture and mold each one into an oval approximately the size of a tennis ball.", "name": "Form the brain shapes. Lightly coat your hands with cooking oil or butter to prevent sticking. Scoop out portions of the cereal mixture and mold each one into an oval approximately the size of a tennis ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/#wprm-recipe-43823-step-0-6"}, {"@type": "HowToStep", "text": "Press your thumb lengthwise into the center of each oval to form the distinctive central brain groove. For a deeper indentation, a chopstick or the handle of a wooden spoon may be used instead.", "name": "Press your thumb lengthwise into the center of each oval to form the distinctive central brain groove. For a deeper indentation, a chopstick or the handle of a wooden spoon may be used instead.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/#wprm-recipe-43823-step-0-7"}, {"@type": "HowToStep", "text": "Create the vein details. Allow the shaped treats to firm slightly for 5–10 minutes.", "name": "Create the vein details. Allow the shaped treats to firm slightly for 5–10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/#wprm-recipe-43823-step-0-8"}, {"@type": "HowToStep", "text": "Dip a toothpick into red food coloring and draw vein-like markings over the surface of each brain. Begin near the central ridge and extend irregular branching lines outward to create a natural-looking, asymmetrical pattern.", "name": "Dip a toothpick into red food coloring and draw vein-like markings over the surface of each brain. Begin near the central ridge and extend irregular branching lines outward to create a natural-looking, asymmetrical pattern.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marshmallow-rice-krispies-halloween-brains/#wprm-recipe-43823-step-0-9"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Marshmallow Rice Krispies Halloween Brains"}</script>
