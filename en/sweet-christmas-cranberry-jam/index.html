    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sweet Christmas Cranberry Jam", "author": {"@type": "Person", "name": "BenDes"}, "description": "Sweet Christmas Cranberry Jam is a festive fruit preserve made with strawberries, cranberries, warm baking spices, sugar, and liquid pectin. The result is a bright, warmly spiced jam suitable for holiday breakfasts, dessert boards, or homemade gifting.", "datePublished": "2019-04-04T16:20:22+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/Sweet-Christmas-Cranberry-Jam2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/Sweet-Christmas-Cranberry-Jam2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/Sweet-Christmas-Cranberry-Jam2.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/Sweet-Christmas-Cranberry-Jam2.png"], "cookTime": "PT10M", "totalTime": "PT730M", "recipeIngredient": ["5 cups granulated sugar (measured as regular white sugar rather than powdered sugar)", "1 teaspoon ground cinnamon", "2  sachets liquid fruit pectin (such as Sure-Jell)", "1/4 teaspoon ground allspice", "6 cups strawberries (fresh or frozen; thaw frozen berries before using)", "1 teaspoon ground ginger", "2 cups cranberries (fresh or frozen; thaw first if using frozen fruit)", "1/4 teaspoon ground cloves (finely ground for even blending)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Puree the strawberries and cranberries in a food processor until the fruit is smoothly broken down. Fresh and thawed frozen berries may be handled in the same manner. Work in portions if the processor bowl is not large enough to hold all the fruit at once.", "name": "Puree the strawberries and cranberries in a food processor until the fruit is smoothly broken down. Fresh and thawed frozen berries may be handled in the same manner. Work in portions if the processor bowl is not large enough to hold all the fruit at once.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-0"}, {"@type": "HowToStep", "text": "Transfer the full amount of pureed strawberry and cranberry mixture into a large saucepan.", "name": "Transfer the full amount of pureed strawberry and cranberry mixture into a large saucepan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-1"}, {"@type": "HowToStep", "text": "Add the measured granulated sugar, cinnamon, allspice, ginger, and cloves to the saucepan with the fruit puree. Stir thoroughly so the sugar and spices are evenly distributed throughout the mixture.", "name": "Add the measured granulated sugar, cinnamon, allspice, ginger, and cloves to the saucepan with the fruit puree. Stir thoroughly so the sugar and spices are evenly distributed throughout the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-2"}, {"@type": "HowToStep", "text": "Set the saucepan over medium-high heat and bring the jam mixture to a full rolling boil. The boil should continue bubbling vigorously across the surface even while the mixture is being stirred.", "name": "Set the saucepan over medium-high heat and bring the jam mixture to a full rolling boil. The boil should continue bubbling vigorously across the surface even while the mixture is being stirred.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-3"}, {"@type": "HowToStep", "text": "Once the mixture reaches a full rolling boil, keep it boiling for 1 complete minute.", "name": "Once the mixture reaches a full rolling boil, keep it boiling for 1 complete minute.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-4"}, {"@type": "HowToStep", "text": "Take the saucepan off the heat and pour in the liquid fruit pectin. Stir well to incorporate it fully into the hot fruit mixture.", "name": "Take the saucepan off the heat and pour in the liquid fruit pectin. Stir well to incorporate it fully into the hot fruit mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-5"}, {"@type": "HowToStep", "text": "Return the saucepan to the heat and bring the jam back to a full rolling boil. Boil for another 1 full minute, stirring continuously.", "name": "Return the saucepan to the heat and bring the jam back to a full rolling boil. Boil for another 1 full minute, stirring continuously.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-6"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat again. Let the bubbling subside, then skim away any foam from the surface with a spoon or ladle and discard it.", "name": "Remove the saucepan from the heat again. Let the bubbling subside, then skim away any foam from the surface with a spoon or ladle and discard it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-7"}, {"@type": "HowToStep", "text": "Ladle the hot jam into prepared hot jars, leaving approximately 1/4 inch of headspace at the top of each jar.", "name": "Ladle the hot jam into prepared hot jars, leaving approximately 1/4 inch of headspace at the top of each jar.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-8"}, {"@type": "HowToStep", "text": "Place a clean, warm, sterilized seal onto each jar, then screw on the band until it is fingertip-tight without forcing it.", "name": "Place a clean, warm, sterilized seal onto each jar, then screw on the band until it is fingertip-tight without forcing it.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-9"}, {"@type": "HowToStep", "text": "Carefully lower the filled jars into the canning pot. Make sure the jars are covered by 2 inches of water.", "name": "Carefully lower the filled jars into the canning pot. Make sure the jars are covered by 2 inches of water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-10"}, {"@type": "HowToStep", "text": "Bring the water to a boil, cover the canning pot, and process the jars for 10 minutes.", "name": "Bring the water to a boil, cover the canning pot, and process the jars for 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-11"}, {"@type": "HowToStep", "text": "Remove the jars carefully from the water and place them on a heat-safe surface. Leave them undisturbed for 12 hours so the jam can cool and set.", "name": "Remove the jars carefully from the water and place them on a heat-safe surface. Leave them undisturbed for 12 hours so the jam can cool and set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-12"}, {"@type": "HowToStep", "text": "Wipe the jars clean, label them, and store the finished jam in a cool, dark cabinet.", "name": "Wipe the jars clean, label them, and store the finished jam in a cool, dark cabinet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-christmas-cranberry-jam/#wprm-recipe-38833-step-0-13"}], "recipeCategory": ["Jam"], "recipeCuisine": ["Holiday-style preserves"], "keywords": "Sweet Christmas Cranberry Jam"}</script>
