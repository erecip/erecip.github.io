    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Stuffed Chicken Breast", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender chicken breasts are filled with a rich combination of cream cheese, feta, Parmesan, spinach, and sun-dried tomatoes, then pan-cooked in butter until browned and fully cooked.", "datePublished": "2020-03-07T11:36:40+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/christmas-stuffed-chicken-breast.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/christmas-stuffed-chicken-breast.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/christmas-stuffed-chicken-breast.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/christmas-stuffed-chicken-breast.png"], "recipeIngredient": ["1 teaspoon smoked paprika", "4  small boneless chicken breasts", "1 teaspoon salt", "½ teaspoon ground pepper", "⅓ cup crumbled feta cheese", "1 cup baby spinach (chopped and squeezed to remove excess moisture)", "¼ cup sun-dried tomatoes (finely diced)", "6 ounces cream cheese (softened to room temperature)", "⅓ cup finely grated Parmesan cheese", "1 tablespoon unsalted butter (such as Kerrygold)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Butterfly and season the chicken. Slice horizontally through the center of each chicken breast, stopping before cutting completely through. Open each breast to form a pocket that can hold the filling.", "name": "Butterfly and season the chicken. Slice horizontally through the center of each chicken breast, stopping before cutting completely through. Open each breast to form a pocket that can hold the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/#wprm-recipe-44642-step-0-0"}, {"@type": "HowToStep", "text": "Season the exterior of the butterflied chicken breasts evenly with the salt, pepper, and smoked paprika. Set the prepared chicken aside.", "name": "Season the exterior of the butterflied chicken breasts evenly with the salt, pepper, and smoked paprika. Set the prepared chicken aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/#wprm-recipe-44642-step-0-1"}, {"@type": "HowToStep", "text": "Make the cheese and spinach filling. Place the softened cream cheese, Parmesan, feta, chopped spinach, and finely chopped sun-dried tomatoes in a small bowl. Mix thoroughly until the ingredients form a cohesive, creamy filling.", "name": "Make the cheese and spinach filling. Place the softened cream cheese, Parmesan, feta, chopped spinach, and finely chopped sun-dried tomatoes in a small bowl. Mix thoroughly until the ingredients form a cohesive, creamy filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/#wprm-recipe-44642-step-0-2"}, {"@type": "HowToStep", "text": "Fill the chicken breasts. Divide the prepared cheese and spinach mixture among the seasoned chicken breasts, placing the filling inside each pocket.", "name": "Fill the chicken breasts. Divide the prepared cheese and spinach mixture among the seasoned chicken breasts, placing the filling inside each pocket.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/#wprm-recipe-44642-step-0-3"}, {"@type": "HowToStep", "text": "Secure the open edges of each breast with toothpicks to help contain the stuffing. A small amount of filling may escape during cooking, which is perfectly acceptable.", "name": "Secure the open edges of each breast with toothpicks to help contain the stuffing. A small amount of filling may escape during cooking, which is perfectly acceptable.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/#wprm-recipe-44642-step-0-4"}, {"@type": "HowToStep", "text": "Cook the stuffed chicken. Set a skillet over medium heat and add the butter. Once the butter is hot and beginning to melt, arrange the stuffed chicken breasts in the skillet.", "name": "Cook the stuffed chicken. Set a skillet over medium heat and add the butter. Once the butter is hot and beginning to melt, arrange the stuffed chicken breasts in the skillet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/#wprm-recipe-44642-step-0-5"}, {"@type": "HowToStep", "text": "Brown the chicken on all sides, turning each breast carefully to encourage even cooking. Continue cooking until the thickest part of the chicken reaches an internal temperature of 165°F (75°C).", "name": "Brown the chicken on all sides, turning each breast carefully to encourage even cooking. Continue cooking until the thickest part of the chicken reaches an internal temperature of 165°F (75°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/#wprm-recipe-44642-step-0-6"}, {"@type": "HowToStep", "text": "Rest and serve. Transfer the fully cooked chicken breasts from the skillet and allow them to rest for a couple of minutes.", "name": "Rest and serve. Transfer the fully cooked chicken breasts from the skillet and allow them to rest for a couple of minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/#wprm-recipe-44642-step-0-7"}, {"@type": "HowToStep", "text": "Remove all toothpicks before serving. Serve the Christmas stuffed chicken breasts while hot.", "name": "Remove all toothpicks before serving. Serve the Christmas stuffed chicken breasts while hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-stuffed-chicken-breast/#wprm-recipe-44642-step-0-8"}], "recipeCategory": ["Main Course"], "keywords": "Christmas Stuffed Chicken Breast"}</script>
