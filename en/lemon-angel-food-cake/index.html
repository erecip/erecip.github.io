-recipe-42393-step-0-1"}, {"@type": "HowToStep", "text": "Begin stirring gently with only the tip of a whisk to help prevent the dry cake mix from scattering out of the bowl.", "name": "Begin stirring gently with only the tip of a whisk to help prevent the dry cake mix from scattering out of the bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-angel-food-cake/#wprm-recipe-42393-step-0-2"}, {"@type": "HowToStep", "text": "Once the ingredients start to blend together, use the full whisk to continue beating until the mixture becomes smooth, well combined, and fluffy.", "name": "Once the ingredients start to blend together, use the full whisk to continue beating until the mixture becomes smooth, well combined, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-angel-food-cake/#wprm-recipe-42393-step-0-3"}, {"@type": "HowToStep", "text": "Transfer the prepared batter to the greased baking dish and spread it evenly.", "name": "Transfer the prepared batter to the greased baking dish and spread it evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-angel-food-cake/#wprm-recipe-42393-step-0-4"}, {"@type": "HowToStep", "text": "Place the pan in the preheated oven and bake for 30 to 33 minutes.", "name": "Place the pan in the preheated oven and bake for 30 to 33 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-angel-food-cake/#wprm-recipe-42393-step-0-5"}, {"@type": "HowToStep", "text": "When first removed from the oven, the cake should appear puffed with a lightly cracked surface. It will naturally settle somewhat as it cools.", "name": "When first removed from the oven, the cake should appear puffed with a lightly cracked surface. It will naturally settle somewhat as it cools.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-angel-food-cake/#wprm-recipe-42393-step-0-6"}, {"@type": "HowToStep", "text": "Leave the cake in the baking dish and allow it to cool for approximately 15 minutes before cutting.", "name": "Leave the cake in the baking dish and allow it to cool for approximately 15 minutes before cutting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-angel-food-cake/#wprm-recipe-42393-step-0-7"}, {"@type": "HowToStep", "text": "This brief cooling period allows the cake to set, making it easier to slice into clean portions before serving.", "name": "This brief cooling period allows the cake to set, making it easier to slice into clean portions before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/lemon-angel-food-cake/#wprm-recipe-42393-step-0-8"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Lemon Angel Food Cake"}</script>
