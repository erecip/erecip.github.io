    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Sweet Potato Pasta Salad", "author": {"@type": "Person", "name": "BenDes"}, "description": "This hearty pasta salad combines smoky roasted sweet potatoes, tender chickpeas, crisp onions, creamy avocado, and al dente pasta. A smooth chipotle-cilantro dressing adds a rich, mildly spicy finish, making the dish suitable for serving either chilled or at room temperature.", "datePublished": "2021-06-18T16:55:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/sweet-potato-pasta-salad3.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/sweet-potato-pasta-salad3.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/sweet-potato-pasta-salad3.png", "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/sweet-potato-pasta-salad3.png"], "prepTime": "PT20M", "cookTime": "PT25M", "totalTime": "PT45M", "recipeIngredient": ["2  medium sweet potatoes (peeled and sliced into 1-inch cubes)", "½ teaspoon onion powder", "2 tablespoons olive oil", "½ teaspoon freshly ground black pepper", "1 teaspoon smoked paprika", "½ teaspoon garlic powder", "½ teaspoon salt", "5  fresh basil leaves", "1 tablespoon apple cider vinegar", "3  peeled garlic cloves", "½ cup creamy vegan mayonnaise", "1 to 2  chipotle peppers packed in adobo sauce", "½  bunch fresh cilantro", "1 tablespoon adobo sauce from the canned chipotles", "¼ cup olive oil", "4  green onions (finely sliced)", "1  ripe yet firm avocado (diced)", "1  can chickpeas (rinsed and thoroughly drained, equivalent to approximately 1½ cups cooked chickpeas)", "½  bunch fresh cilantro (chopped)", "1 pound short pasta (such as penne or rotini, cooked until al dente)", "1  small red onion (finely diced)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 425°F (220°C). Cover a baking sheet with parchment paper.", "name": "Preheat the oven to 425°F (220°C). Cover a baking sheet with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-0"}, {"@type": "HowToStep", "text": "Place the cubed sweet potatoes in a large mixing bowl. Add 2 tablespoons olive oil, smoked paprika, garlic powder, onion powder, salt, and black pepper. Toss thoroughly until every piece is evenly coated with the oil and seasonings.", "name": "Place the cubed sweet potatoes in a large mixing bowl. Add 2 tablespoons olive oil, smoked paprika, garlic powder, onion powder, salt, and black pepper. Toss thoroughly until every piece is evenly coated with the oil and seasonings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-1"}, {"@type": "HowToStep", "text": "Arrange the seasoned sweet potatoes across the prepared baking sheet in a single, uncrowded layer.", "name": "Arrange the seasoned sweet potatoes across the prepared baking sheet in a single, uncrowded layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-2"}, {"@type": "HowToStep", "text": "Roast for 25 minutes, turning the cubes after the first 15 minutes to encourage even browning. Remove them from the oven and set aside.", "name": "Roast for 25 minutes, turning the cubes after the first 15 minutes to encourage even browning. Remove them from the oven and set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-3"}, {"@type": "HowToStep", "text": "While the sweet potatoes are roasting, bring a large pot of water to a rolling boil. Add the pasta and cook according to the package directions until al dente.", "name": "While the sweet potatoes are roasting, bring a large pot of water to a rolling boil. Add the pasta and cook according to the package directions until al dente.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-4"}, {"@type": "HowToStep", "text": "Drain the cooked pasta, then rinse it under cold running water to halt the cooking process and lower its temperature. Set it aside until needed.", "name": "Drain the cooked pasta, then rinse it under cold running water to halt the cooking process and lower its temperature. Set it aside until needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-5"}, {"@type": "HowToStep", "text": "Place the vegan mayonnaise, ¼ cup olive oil, chipotle peppers, adobo sauce, apple cider vinegar, cilantro, basil leaves, and peeled garlic cloves in a food processor.", "name": "Place the vegan mayonnaise, ¼ cup olive oil, chipotle peppers, adobo sauce, apple cider vinegar, cilantro, basil leaves, and peeled garlic cloves in a food processor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-6"}, {"@type": "HowToStep", "text": "Blend until the dressing becomes smooth and fully combined. Taste and adjust with additional chipotle pepper or apple cider vinegar when a stronger spicy or tangy flavor is desired. Reserve the finished dressing.", "name": "Blend until the dressing becomes smooth and fully combined. Taste and adjust with additional chipotle pepper or apple cider vinegar when a stronger spicy or tangy flavor is desired. Reserve the finished dressing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-7"}, {"@type": "HowToStep", "text": "Transfer the cooled pasta to a large serving bowl. Add the roasted sweet potatoes, diced red onion, chopped cilantro, sliced green onions, and drained chickpeas.", "name": "Transfer the cooled pasta to a large serving bowl. Add the roasted sweet potatoes, diced red onion, chopped cilantro, sliced green onions, and drained chickpeas.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-8"}, {"@type": "HowToStep", "text": "Pour the chipotle-cilantro dressing over the salad. Toss carefully until the pasta and vegetables are uniformly coated.", "name": "Pour the chipotle-cilantro dressing over the salad. Toss carefully until the pasta and vegetables are uniformly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-9"}, {"@type": "HowToStep", "text": "Immediately before serving, gently fold in the diced avocado to preserve its shape, color, and fresh texture.", "name": "Immediately before serving, gently fold in the diced avocado to preserve its shape, color, and fresh texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-10"}, {"@type": "HowToStep", "text": "Serve the sweet potato pasta salad chilled or at room temperature.", "name": "Serve the sweet potato pasta salad chilled or at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/sweet-potato-pasta-salad/#wprm-recipe-40563-step-0-11"}], "recipeCategory": ["Salad"], "recipeCuisine": ["Southwestern-inspired American"], "keywords": "Sweet Potato Pasta Salad"}</script>
