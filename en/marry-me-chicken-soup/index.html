    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Marry Me Chicken Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, creamy chicken soup featuring tender shredded chicken, sun-dried tomatoes, aromatic herbs, spinach, and a silky cauliflower-based cream mixture. Tomato paste and petite diced tomatoes provide depth, while nutritional yeast adds savory flavor to the dairy-free broth.", "datePublished": "2020-04-07T21:26:38+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup/marry-me-chicken-soup1.png", "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup/marry-me-chicken-soup1.png", "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup/marry-me-chicken-soup1.png", "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup/marry-me-chicken-soup1.png"], "totalTime": "PT40M", "recipeIngredient": ["1 1/2 pounds boneless chicken breasts or boneless chicken thighs", "1/2 teaspoon crushed red pepper flakes", "8- ounce jar sun-dried tomatoes (rinsed, drained, and finely minced)", "1 teaspoon dried thyme", "1  medium yellow onion (finely diced)", "1/4 cup nutritional yeast", "14.5- ounce can petite diced tomatoes", "2 teaspoons garlic salt (plus additional as needed)", "1/2 teaspoon paprika", "4 cups chicken broth or bone broth", "1 tablespoon freshly minced garlic", "6 ounces tomato paste", "1 1/2 teaspoons dried oregano", "2 tablespoons plant-based butter (ghee, or olive oil)", "10  –12 ounces fresh or frozen cauliflower rice", "1 1/2 cups vegan heavy cream (or one 14.5-ounce can unsweetened coconut cream)", "1 cup chicken broth", "1 ounce fresh or frozen spinach (roughly 2 cups chopped)", "Fresh basil (finely sliced or chopped)", "Additional garlic salt (as needed)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the plant-based butter, ghee, or olive oil in a large pot over medium heat. When using an Instant Pot, select the Sauté setting.", "name": "Heat the plant-based butter, ghee, or olive oil in a large pot over medium heat. When using an Instant Pot, select the Sauté setting.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup/#wprm-recipe-46169-step-0-0"}, {"@type": "HowToStep", "text": "Add the finely diced yellow onion and cook for approximately 5 minutes, or until it begins to soften.", "name": "Add the finely diced yellow onion and cook for approximately 5 minutes, or until it begins to soften.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup/#wprm-recipe-46169-step-0-1"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and continue cooking for another 2 minutes, just until fragrant.", "name": "Stir in the minced garlic and continue cooking for another 2 minutes, just until fragrant.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup/#wprm-recipe-46169-step-0-2"}, {"@type": "HowToStep", "text": "Add the garlic salt, dried oregano, thyme, paprika, and crushed red pepper flakes to the softened onion and garlic, stirring to distribute the seasonings evenly.", "name": "Add the garlic salt, dried oregano, thyme, paprika, and crushed red pepper flakes to the softened onion and garlic, stirring to distribute the seasonings evenly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup/#wprm-recipe-46169-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the chicken breasts or thighs in the pot. Pour in 4 cups of chicken broth, then incorporate the tomato paste, petite diced tomatoes, chopped sun-dried tomatoes, and nutritional yeast.", "name": "Arrange the chicken breasts or thighs in the pot. Pour in 4 cups of chicken broth, then incorporate the tomato paste, petite diced tomatoes, chopped sun-dried tomatoes, and nutritional yeast.", "url": "https://easy-recipes322.github.io/easy-recipes323/en d, if desired, an additional light seasoning of garlic salt.", "name": "Finish each portion with freshly chopped basil and, if desired, an additional light seasoning of garlic salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/marry-me-chicken-soup/#wprm-recipe-46169-step-0-15"}], "recipeCategory": ["Soup"], "recipeCuisine": ["American"], "keywords": "Marry Me Chicken Soup"}</script>
