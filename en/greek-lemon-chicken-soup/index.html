    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Greek Lemon Chicken Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "A comforting Greek-style chicken soup featuring a vibrant lemon-infused broth, tender vegetables, cooked rice, chicken, and egg yolks for a smooth, velvety finish.", "datePublished": "2020-04-23T21:24:36+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/greek-lemon-chicken-soup/greek-lemon-chicken-soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/greek-lemon-chicken-soup/greek-lemon-chicken-soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/greek-lemon-chicken-soup/greek-lemon-chicken-soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/greek-lemon-chicken-soup/greek-lemon-chicken-soup.png"], "totalTime": "PT15M", "recipeIngredient": ["1 cup cooked white rice", "½ cup celery (finely minced)", "8  large egg yolks", "¼ teaspoon white pepper (ground)", "½ cup freshly pressed lemon juice", "¼ cup all-purpose flour", "1 cup cooked chicken (cut into small cubes)", "8 cups chicken broth", "½ cup onion (finely diced)", "16  thin lemon slices (for garnishing)", "¼ cup margarine", "6 tablespoons chicken soup base", "½ cup shredded carrot"], "recipeInstructions": [{"@type": "HowToStep", "text": "Prepare the broth and vegetables. Place the chicken broth, fresh lemon juice, shredded carrot, diced onion, minced celery, chicken soup base, and ground white pepper in a large pot. Bring the contents to a boil over high heat, then lower the heat and simmer for 15–20 minutes, or until the vegetables become tender.", "name": "Prepare the broth and vegetables. Place the chicken broth, fresh lemon juice, shredded carrot, diced onion, minced celery, chicken soup base, and ground white pepper in a large pot. Bring the contents to a boil over high heat, then lower the heat and simmer for 15–20 minutes, or until the vegetables become tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-lemon-chicken-soup/#wprm-recipe-43628-step-0-0"}, {"@type": "HowToStep", "text": "Thicken the soup. Blend the margarine with the all-purpose flour in a small bowl until a uniform, smooth paste is formed. Gradually stir this mixture into the simmering soup, mixing thoroughly so that no lumps remain. Continue cooking for 8–10 minutes, stirring frequently, until the broth develops a slightly thicker consistency.", "name": "Thicken the soup. Blend the margarine with the all-purpose flour in a small bowl until a uniform, smooth paste is formed. Gradually stir this mixture into the simmering soup, mixing thoroughly so that no lumps remain. Continue cooking for 8–10 minutes, stirring frequently, until the broth develops a slightly thicker consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-lemon-chicken-soup/#wprm-recipe-43628-step-0-1"}, {"@type": "HowToStep", "text": "Temper the egg yolks. In a separate bowl, whisk the egg yolks until pale and creamy. While whisking continuously, slowly add a small quantity of the hot thickened soup to the yolks. Gradually return the tempered yolk mixture to the pot, stirring constantly as it is incorporated.", "name": "Temper the egg yolks. In a separate bowl, whisk the egg yolks until pale and creamy. While whisking continuously, slowly add a small quantity of the hot thickened soup to the yolks. Gradually return the tempered yolk mixture to the pot, stirring constantly as it is incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-lemon-chicken-soup/#wprm-recipe-43628-step-0-2"}, {"@type": "HowToStep", "text": "Heat gently. Continue warming the soup over gentle heat without allowing it to return to a boil. This careful heating helps preserve the smooth, silky texture of the egg-enriched broth.", "name": "Heat gently. Continue warming the soup over gentle heat without allowing it to return to a boil. This careful heating helps preserve the smooth, silky texture of the egg-enriched broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-lemon-chicken-soup/#wprm-recipe-43628-step-0-3"}, {"@type": "HowToStep", "text": "Add the chicken and rice. Stir the cooked white rice and diced cooked chicken into the soup. Cook for a few additional minutes, only until both ingredients are thoroughly heated.", "name": "Add the chicken and rice. Stir the cooked white rice and diced cooked chicken into the soup. Cook for a few additional minutes, only until both ingredients are thoroughly heated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-lemon-chicken-soup/#wprm-recipe-43628-step-0-4"}, {"@type": "HowToStep", "text": "Serve. Portion the hot soup into individual bowls and garnish each serving with a lemon slice. Serve immediately.", "name": "Serve. Portion the hot soup into individual bowls and garnish each serving with a lemon slice. Serve immediately.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/greek-lemon-chicken-soup/#wprm-recipe-43628-step-0-5"}], "recipeCategory": ["Soup"], "recipeCuisine": ["greek"], "keywords": "Greek Lemon Chicken Soup"}</script>
