 bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/doritos-pumpkin-shaped-cheese-ball/#wprm-recipe-45100-step-0-0"}, {"@type": "HowToStep", "text": "Blend thoroughly with a sturdy spoon or hand mixer until the ingredients are evenly incorporated and the cheese mixture has a smooth, uniform consistency.", "name": "Blend thoroughly with a sturdy spoon or hand mixer until the ingredients are evenly incorporated and the cheese mixture has a smooth, uniform consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/doritos-pumpkin-shaped-cheese-ball/#wprm-recipe-45100-step-0-1"}, {"@type": "HowToStep", "text": "Spread a large sheet of cling wrap over a flat work surface, then transfer the prepared cheese mixture to the center.", "name": "Spread a large sheet of cling wrap over a flat work surface, then transfer the prepared cheese mixture to the center.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/doritos-pumpkin-shaped-cheese-ball/#wprm-recipe-45100-step-0-2"}, {"@type": "HowToStep", "text": "Bring the edges of the plastic wrap upward around the mixture and twist them together at the top to enclose it securely. Gently shape the wrapped mixture into a rounded ball.", "name": "Bring the edges of the plastic wrap upward around the mixture and twist them together at the top to enclose it securely. Gently shape the wrapped mixture into a rounded ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/doritos-pumpkin-shaped-cheese-ball/#wprm-recipe-45100-step-0-3"}, {"@type": "HowToStep", "text": "Lightly mold the surface to form subtle ridges that resemble the natural contours of a pumpkin.", "name": "Lightly mold the surface to form subtle ridges that resemble the natural contours of a pumpkin.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/doritos-pumpkin-shaped-cheese-ball/#wprm-recipe-45100-step-0-4"}, {"@type": "HowToStep", "text": "Refrigerate the wrapped cheese ball for a minimum of 2 hours. Chilling allows it to become firm enough to retain its shape while also giving the flavors time to combine.", "name": "Refrigerate the wrapped cheese ball for a minimum of 2 hours. Chilling allows it to become firm enough to retain its shape while also giving the flavors time to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/doritos-pumpkin-shaped-cheese-ball/#wprm-recipe-45100-step-0-5"}, {"@type": "HowToStep", "text": "Remove the chilled cheese ball from the refrigerator. Carefully peel away and discard the cling wrap.", "name": "Remove the chilled cheese ball from the refrigerator. Carefully peel away and discard the cling wrap.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/doritos-pumpkin-shaped-cheese-ball/#wprm-recipe-45100-step-0-6"}, {"@type": "HowToStep", "text": "Roll the cheese ball in the crushed nacho cheese tortilla chips, pressing gently as necessary so the crumbs cover the exterior evenly and produce a bright orange, pumpkin-like finish.", "name": "Roll the cheese ball in the crushed nacho cheese tortilla chips, pressing gently as necessary so the crumbs cover the exterior evenly and produce a bright orange, pumpkin-like finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/doritos-pumpkin-shaped-cheese-ball/#wprm-recipe-45100-step-0-7"}, {"@type": "HowToStep", "text": "Insert the stemmed top of the bell pepper into the center of the cheese ball to complete the pumpkin appearance.", "name": "Insert the stemmed top of the bell pepper into the center of the cheese ball to complete the pumpkin appearance.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/doritos-pumpkin-shaped-cheese-ball/#wprm-recipe-45100-step-0-8"}, {"@type": "HowToStep", "text": "Set the finished pumpkin-shaped cheese ball on a serving platter.", "name": "Set the finished pumpkin-shaped cheese ball on a serving platter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/doritos-pumpkin-shaped-c
