    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Tomato Bisque Soup Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A smooth, comforting tomato bisque prepared with whole tomatoes, aromatic vegetables, dried basil, garlic, and a touch of cream. The soup is blended until velvety and served with crisp homemade sourdough croutons for added texture.", "datePublished": "2018-11-06T19:37:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/tomato-bisque-soup-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/tomato-bisque-soup-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/tomato-bisque-soup-recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/tomato-bisque-soup-recipe.png"], "prepTime": "PT15M", "cookTime": "PT35M", "totalTime": "PT50M", "recipeIngredient": ["1  medium onion (cut into a fine dice)", "1 teaspoon dried basil", "1 cup water", "2  garlic cloves (finely minced)", "1  large celery stalk (finely diced)", "1 tablespoon olive oil", "1  can (28 ounces whole tomatoes with their juices)", "1/8 teaspoon ground black pepper", "1  large carrot (finely diced)", "1 tablespoon butter", "1 teaspoon coarse salt", "A pinch of red pepper flakes (optional)", "1/4 cup heavy cream", "2 tablespoons olive oil", "5 ounces sourdough bread (sliced into 1/2-inch cubes)", "Salt (as needed)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the butter and 1 tablespoon olive oil in a large saucepan over medium heat. Heat until the butter has melted and the mixture begins to sizzle.", "name": "Place the butter and 1 tablespoon olive oil in a large saucepan over medium heat. Heat until the butter has melted and the mixture begins to sizzle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-0"}, {"@type": "HowToStep", "text": "Add the diced onion, carrot, celery, and minced garlic. Cook for approximately 5 minutes, stirring periodically, until the onion becomes translucent.", "name": "Add the diced onion, carrot, celery, and minced garlic. Cook for approximately 5 minutes, stirring periodically, until the onion becomes translucent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-1"}, {"@type": "HowToStep", "text": "Add the whole tomatoes and their juices, water, coarse salt, black pepper, optional red pepper flakes, and dried basil to the saucepan.", "name": "Add the whole tomatoes and their juices, water, coarse salt, black pepper, optional red pepper flakes, and dried basil to the saucepan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-2"}, {"@type": "HowToStep", "text": "Stir thoroughly, then bring the mixture to a boil. Once boiling, lower the heat and maintain a gentle simmer for 15 minutes.", "name": "Stir thoroughly, then bring the mixture to a boil. Once boiling, lower the heat and maintain a gentle simmer for 15 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-3"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat and stir in the heavy cream.", "name": "Remove the saucepan from the heat and stir in the heavy cream.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-4"}, {"@type": "HowToStep", "text": "Using an immersion blender, purée the soup directly in the saucepan until the consistency is completely smooth.", "name": "Using an immersion blender, purée the soup directly in the saucepan until the consistency is completely smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-5"}, {"@type": "HowToStep", "text": "When using a standard countertop blender instead, process the soup in batches. Exercise caution with hot liquids, as trapped steam can force the blender lid upward. Cover the blender pitcher securely with a towel rather than sealing it tightly with the lid.", "name": "When using a standard countertop blender instead, process the soup in batches. Exercise caution with hot liquids, as trapped steam can force the blender lid upward. Cover the blender pitcher securely with a towel rather than sealing it tightly with the lid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-6"}, {"@type": "HowToStep", "text": "Pour the blended soup back into the saucepan. Taste and adjust with additional salt or black pepper as necessary. Return the soup to a gentle simmer if reheating is needed.", "name": "Pour the blended soup back into the saucepan. Taste and adjust with additional salt or black pepper as necessary. Return the soup to a gentle simmer if reheating is needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-7"}, {"@type": "HowToStep", "text": "Preheat the oven to 400°F.", "name": "Preheat the oven to 400°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-8"}, {"@type": "HowToStep", "text": "Place the sourdough cubes in a medium bowl. Drizzle them with 2 tablespoons olive oil and toss until the bread is evenly coated.", "name": "Place the sourdough cubes in a medium bowl. Drizzle them with 2 tablespoons olive oil and toss until the bread is evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-9"}, {"@type": "HowToStep", "text": "Arrange the cubes in one layer on a baking sheet and season with salt to taste.", "name": "Arrange the cubes in one layer on a baking sheet and season with salt to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-10"}, {"@type": "HowToStep", "text": "Bake for 15 to 20 minutes, or until the croutons are crisp and evenly golden. Remove them from the oven and allow them to cool slightly.", "name": "Bake for 15 to 20 minutes, or until the croutons are crisp and evenly golden. Remove them from the oven and allow them to cool slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-11"}, {"@type": "HowToStep", "text": "Ladle the hot tomato bisque into serving bowls and finish each portion with the freshly baked sourdough croutons.", "name": "Ladle the hot tomato bisque into serving bowls and finish each portion with the freshly baked sourdough croutons.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-bisque-soup-recipe/#wprm-recipe-46378-step-0-12"}], "recipeCategory": ["Soup"], "recipeCuisine": ["American"], "keywords": "Tomato Bisque Soup Recipe"}</script>
