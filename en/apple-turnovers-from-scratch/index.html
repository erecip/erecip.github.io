    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Apple Turnovers from Scratch", "author": {"@type": "Person", "name": "BenDes"}, "description": "These homemade apple turnovers feature a crisp, buttery pastry made entirely from scratch and a warmly spiced apple filling thickened with cornstarch. An egg wash and sugar topping create a deeply golden finish with a delicate crunch.", "datePublished": "2018-05-25T02:30:36+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/apple-turnovers-from-scratch.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/apple-turnovers-from-scratch.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/apple-turnovers-from-scratch.png", "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/apple-turnovers-from-scratch.png"], "totalTime": "PT80M", "recipeIngredient": ["3/4 cup 170 g cold unsalted butter, cut into 1/2-inch cubes", "1/2 teaspoon salt", "8 to 9 tablespoons 120–135 ml ice-cold water", "2 tablespoons 25 g granulated sugar", "2 1/4 cups plus 1 tablespoon (300 g all-purpose flour)", "1 tablespoon cornstarch", "2  apples (peeled, cored, and finely diced into approximately 1/4-inch pieces)", "Pinch of salt", "1/4 cup 60 ml water", "1/2 teaspoon ground cinnamon", "1 tablespoon lemon juice (optional)", "1/4 cup 50 g granulated sugar", "1/2 tablespoon milk", "1 tablespoon 12 g granulated sugar, for topping", "1  large egg"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the flour, sugar, and salt in a large mixing bowl and whisk until evenly combined.", "name": "Place the flour, sugar, and salt in a large mixing bowl and whisk until evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-0"}, {"@type": "HowToStep", "text": "Add the chilled, cubed butter and gently toss until the pieces are coated with the flour mixture.", "name": "Add the chilled, cubed butter and gently toss until the pieces are coated with the flour mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-1"}, {"@type": "HowToStep", "text": "Using a pastry cutter or your fingertips, work the butter into the dry ingredients until the mixture develops a coarse, crumb-like texture.", "name": "Using a pastry cutter or your fingertips, work the butter into the dry ingredients until the mixture develops a coarse, crumb-like texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-2"}, {"@type": "HowToStep", "text": "Add the ice-cold water gradually, approximately 1 tablespoon at a time, while lightly stirring with a fork. Continue only until the flour is moistened and the dough begins to hold together.", "name": "Add the ice-cold water gradually, approximately 1 tablespoon at a time, while lightly stirring with a fork. Continue only until the flour is moistened and the dough begins to hold together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-3"}, {"@type": "HowToStep", "text": "Gather the dough into a ball, cover it securely with plastic wrap or parchment paper, and refrigerate for no less than 30 minutes, or until thoroughly chilled and firm. Keeping the dough cold is important for producing a flaky pastry.", "name": "Gather the dough into a ball, cover it securely with plastic wrap or parchment paper, and refrigerate for no less than 30 minutes, or until thoroughly chilled and firm. Keeping the dough cold is important for producing a flaky pastry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-4"}, {"@type": "HowToStep", "text": "Add the sugar, cinnamon, salt, cornstarch, and water to a small saucepan and stir to combine.", "name": "Add the sugar, cinnamon, salt, cornstarch, and water to a small saucepan and stir to combine.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-5"}, {"@type": "HowToStep", "text": "Set the pan over medium heat and bring the mixture to a boil, stirring continuously. Cook until the liquid becomes thick and glossy.", "name": "Set the pan over medium heat and bring the mixture to a boil, stirring continuously. Cook until the liquid becomes thick and glossy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-6"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Fold in the finely diced apples along with the lemon juice, when using.", "name": "Remove the saucepan from the heat. Fold in the finely diced apples along with the lemon juice, when using.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-7"}, {"@type": "HowToStep", "text": "Set the filling aside and allow it to cool completely before proceeding with assembly.", "name": "Set the filling aside and allow it to cool completely before proceeding with assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-8"}, {"@type": "HowToStep", "text": "Line a baking sheet with parchment paper.", "name": "Line a baking sheet with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-9"}, {"@type": "HowToStep", "text": "Lightly flour a work surface and roll out half of the refrigerated pastry dough to approximately 1/8-inch thickness.", "name": "Lightly flour a work surface and roll out half of the refrigerated pastry dough to approximately 1/8-inch thickness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-10"}, {"@type": "HowToStep", "text": "Using a sharp knife, pizza cutter, or cookie cutter, divide the pastry into circles, squares, or rectangles as desired.", "name": "Using a sharp knife, pizza cutter, or cookie cutter, divide the pastry into circles, squares, or rectangles as desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-11"}, {"@type": "HowToStep", "text": "Spoon approximately 1 to 2 tablespoons of the cooled apple mixture into the center of each piece of pastry.", "name": "Spoon approximately 1 to 2 tablespoons of the cooled apple mixture into the center of each piece of pastry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-12"}, {"@type": "HowToStep", "text": "Fold the dough over the filling to form individual turnovers. Press the edges together, then crimp them securely with the tines of a fork.", "name": "Fold the dough over the filling to form individual turnovers. Press the edges together, then crimp them securely with the tines of a fork.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-13"}, {"@type": "HowToStep", "text": "Arrange the completed turnovers on the parchment-lined baking sheet.", "name": "Arrange the completed turnovers on the parchment-lined baking sheet.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-14"}, {"@type": "HowToStep", "text": "Place the baking sheet in the freezer for 20 minutes or refrigerate it for 30 minutes.", "name": "Place the baking sheet in the freezer for 20 minutes or refrigerate it for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-15"}, {"@type": "HowToStep", "text": "This additional chilling period firms the pastry and helps the turnovers retain their shape during baking.", "name": "This additional chilling period firms the pastry and helps the turnovers retain their shape during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-16"}, {"@type": "HowToStep", "text": "Preheat the oven to 400°F (200°C).", "name": "Preheat the oven to 400°F (200°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-17"}, {"@type": "HowToStep", "text": "Whisk the egg and milk together in a small bowl until evenly blended.", "name": "Whisk the egg and milk together in a small bowl until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-18"}, {"@type": "HowToStep", "text": "Remove the chilled turnovers from the refrigerator or freezer and lightly coat their tops with the egg wash.", "name": "Remove the chilled turnovers from the refrigerator or freezer and lightly coat their tops with the egg wash.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-19"}, {"@type": "HowToStep", "text": "With a sharp knife, make several small slits in the top of each turnover so steam can escape while they bake.", "name": "With a sharp knife, make several small slits in the top of each turnover so steam can escape while they bake.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-20"}, {"@type": "HowToStep", "text": "Sprinkle the surfaces generously with the remaining sugar to create a crisp, sparkling finish.", "name": "Sprinkle the surfaces generously with the remaining sugar to create a crisp, sparkling finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-21"}, {"@type": "HowToStep", "text": "Transfer the turnovers to the preheated 400°F (200°C) oven and bake for 10 minutes.", "name": "Transfer the turnovers to the preheated 400°F (200°C) oven and bake for 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-22"}, {"@type": "HowToStep", "text": "Reduce the oven temperature to 375°F (190°C) and continue baking for another 18 to 20 minutes, or until the pastry is crisp and evenly golden brown.", "name": "Reduce the oven temperature to 375°F (190°C) and continue baking for another 18 to 20 minutes, or until the pastry is crisp and evenly golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-23"}, {"@type": "HowToStep", "text": "Because baking time may vary depending on the thickness of the rolled pastry, monitor the turnovers closely during the final few minutes.", "name": "Because baking time may vary depending on the thickness of the rolled pastry, monitor the turnovers closely during the final few minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-24"}, {"@type": "HowToStep", "text": "Remove the baked apple turnovers from the oven and allow them to cool slightly before serving.", "name": "Remove the baked apple turnovers from the oven and allow them to cool slightly before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-25"}, {"@type": "HowToStep", "text": "Serve warm or at room temperature.", "name": "Serve warm or at room temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/apple-turnovers-from-scratch/#wprm-recipe-39253-step-0-26"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Apple Turnovers from Scratch"}</script>
