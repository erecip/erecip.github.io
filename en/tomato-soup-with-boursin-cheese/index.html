    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Tomato Soup with Boursin Cheese", "author": {"@type": "Person", "name": "BenDes"}, "description": "A smooth, richly flavored tomato soup made with oven-roasted tomatoes, onion, and an entire head of garlic, then blended with creamy Garlic & Fine Herbs Boursin. A finishing touch of heavy cream and fresh basil gives the soup an elegant, velvety finish.", "datePublished": "2021-08-24T12:56:26+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/tomato-soup-with-boursin-cheese.png", "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/tomato-soup-with-boursin-cheese.png", "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/tomato-soup-with-boursin-cheese.png", "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/tomato-soup-with-boursin-cheese.png"], "prepTime": "PT10M", "cookTime": "PT30M", "totalTime": "PT40M", "recipeIngredient": ["1  whole garlic bulb (with the upper portion trimmed away to reveal the cloves)", "1 tablespoon paprika", "1 pound Roma (vine-ripened, or similar tomatoes, cut into halves)", "1 teaspoon freshly ground black pepper", "4 tablespoons high-quality extra-virgin olive oil", "1  medium onion (peeled and divided into quarters)", "1 teaspoon dried oregano", "1 teaspoon salt", "10.4 ounces Garlic & Fine Herbs Boursin cheese", "1/4 cup water", "6 tablespoons heavy cream", "1 tablespoon fresh basil (finely minced)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat the oven to 425°F. Rinse the tomatoes thoroughly, remove their stems, and slice them in half.", "name": "Heat the oven to 425°F. Rinse the tomatoes thoroughly, remove their stems, and slice them in half.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-0"}, {"@type": "HowToStep", "text": "Remove the papery outer skin from the onion, trim away the ends, and cut the onion into quarters.", "name": "Remove the papery outer skin from the onion, trim away the ends, and cut the onion into quarters.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-1"}, {"@type": "HowToStep", "text": "Slice the top from the garlic bulb so the cloves are exposed, keeping the base intact so the head remains together.", "name": "Slice the top from the garlic bulb so the cloves are exposed, keeping the base intact so the head remains together.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-2"}, {"@type": "HowToStep", "text": "Coat the bottom of a 9-by-13-inch baking dish with the extra-virgin olive oil.", "name": "Coat the bottom of a 9-by-13-inch baking dish with the extra-virgin olive oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the halved tomatoes, quartered onion, and whole garlic bulb in the prepared dish. Season evenly with the paprika, dried oregano, salt, and black pepper.", "name": "Arrange the halved tomatoes, quartered onion, and whole garlic bulb in the prepared dish. Season evenly with the paprika, dried oregano, salt, and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-4"}, {"@type": "HowToStep", "text": "If desired, gently toss the tomatoes and onion in the dish so the vegetables are thoroughly coated with the oil and seasonings.", "name": "If desired, gently toss the tomatoes and onion in the dish so the vegetables are thoroughly coated with the oil and seasonings.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-5"}, {"@type": "HowToStep", "text": "Transfer the baking dish to the preheated oven and roast for 15–20 minutes, or until the tomatoes begin to burst and the onion develops a well-browned exterior.", "name": "Transfer the baking dish to the preheated oven and roast for 15–20 minutes, or until the tomatoes begin to burst and the onion develops a well-browned exterior.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-6"}, {"@type": "HowToStep", "text": "Carefully remove the baking dish from the oven.", "name": "Carefully remove the baking dish from the oven.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-7"}, {"@type": "HowToStep", "text": "Place the Boursin cheese into the baking dish with the roasted vegetables, then add 1/4 cup water.", "name": "Place the Boursin cheese into the baking dish with the roasted vegetables, then add 1/4 cup water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-8"}, {"@type": "HowToStep", "text": "Return the dish to the oven and continue baking for another 15 minutes, until the cheese has melted and is lightly golden.", "name": "Return the dish to the oven and continue baking for another 15 minutes, until the cheese has melted and is lightly golden.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the roasted tomatoes, onion, melted cheese, and all accumulated juices and sauce from the baking dish to a blender or suitable mixing bowl.", "name": "Transfer the roasted tomatoes, onion, melted cheese, and all accumulated juices and sauce from the baking dish to a blender or suitable mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-10"}, {"@type": "HowToStep", "text": "Remove the roasted garlic bulb and gently squeeze the softened cloves from their skins into the other ingredients. Discard the garlic skin and remaining base.", "name": "Remove the roasted garlic bulb and gently squeeze the softened cloves from their skins into the other ingredients. Discard the garlic skin and remaining base.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-11"}, {"@type": "HowToStep", "text": "Blend the mixture in a standard blender, or process it with an immersion blender, for approximately 1 minute. Continue until the tomatoes, onion, and garlic are fully puréed and the soup reaches the preferred consistency.", "name": "Blend the mixture in a standard blender, or process it with an immersion blender, for approximately 1 minute. Continue until the tomatoes, onion, and garlic are fully puréed and the soup reaches the preferred consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-12"}, {"@type": "HowToStep", "text": "Pour the finished tomato soup into serving bowls. Finish each portion with a drizzle of heavy cream and a scattering of finely chopped fresh basil for added richness, color, and fresh herbal flavor.", "name": "Pour the finished tomato soup into serving bowls. Finish each portion with a drizzle of heavy cream and a scattering of finely chopped fresh basil for added richness, color, and fresh herbal flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tomato-soup-with-boursin-cheese/#wprm-recipe-46462-step-0-13"}], "recipeCategory": ["Soup"], "recipeCuisine": ["American"], "keywords": "Tomato Soup with Boursin Cheese"}</script>
