 to 325°F. Line baking sheets with parchment paper.", "name": "Preheat the oven to 325°F. Line baking sheets with parchment paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-for-diabetics/#wprm-recipe-43443-step-0-6"}, {"@type": "HowToStep", "text": "Shape the prepared dough into balls measuring approximately 1 inch in diameter and arrange them on the lined baking sheets.", "name": "Shape the prepared dough into balls measuring approximately 1 inch in diameter and arrange them on the lined baking sheets.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-for-diabetics/#wprm-recipe-43443-step-0-7"}, {"@type": "HowToStep", "text": "Bake for 12 minutes, or until the cookies feel firm when gently touched. Remove them from the oven and allow them to cool for approximately 5 minutes.", "name": "Bake for 12 minutes, or until the cookies feel firm when gently touched. Remove them from the oven and allow them to cool for approximately 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-for-diabetics/#wprm-recipe-43443-step-0-8"}, {"@type": "HowToStep", "text": "Pour about ½ cup of the confectioners-style sugar substitute into a shallow bowl. Roll the slightly cooled cookies in the sweetener until evenly coated.", "name": "Pour about ½ cup of the confectioners-style sugar substitute into a shallow bowl. Roll the slightly cooled cookies in the sweetener until evenly coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-for-diabetics/#wprm-recipe-43443-step-0-9"}, {"@type": "HowToStep", "text": "Leave the coated mint-chocolate cookies to cool completely before serving.", "name": "Leave the coated mint-chocolate cookies to cool completely before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-for-diabetics/#wprm-recipe-43443-step-0-10"}], "recipeCategory": ["Cookies", "Dessert"], "keywords": "Chri
