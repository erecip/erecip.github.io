    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Rotisserie Chicken Gnocchi Soup", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy, comforting soup made with tender potato gnocchi, savory rotisserie chicken, aromatic vegetables, fresh spinach, Parmesan cheese, and a delicately seasoned broth enriched with half-and-half.", "datePublished": "2023-03-08T03:43:31+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/Rotisserie-Chicken-Gnocchi-Soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/Rotisserie-Chicken-Gnocchi-Soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/Rotisserie-Chicken-Gnocchi-Soup.png", "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/Rotisserie-Chicken-Gnocchi-Soup.png"], "prepTime": "PT15M", "cookTime": "PT25M", "totalTime": "PT40M", "recipeIngredient": ["1 pound gnocchi", "2 cups cooked rotisserie chicken (shredded or cut into small pieces)", "4 cups chicken broth", "2 cups half-and-half (gently warmed to help prevent curdling)", "3 tablespoons unsalted butter", "1 tablespoon olive oil", "1 cup yellow onion (diced)", "3/4 cup carrots (grated)", "1/2 cup celery (finely sliced or finely chopped)", "2  large garlic cloves (minced)", "1/2 cup dry white wine", "1/4 cup all-purpose flour", "1/2 to 3/4 cup shredded Parmesan cheese (preferably Parmigiano Reggiano)", "2 cups fresh spinach (roughly chopped)", "1 to 2 teaspoons fresh thyme (finely chopped)", "1/2 teaspoon dried Italian herbs", "1/8 teaspoon freshly grated nutmeg (optional)", "Salt (added to taste)", "Freshly ground black pepper (added to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a large heavy-bottomed pot, warm the butter and olive oil together over medium heat until the butter melts and the bubbling begins to se ed wine and softened vegetables. Cook for 1 to 2 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/#wprm-recipe-38612-step-0-4"}, {"@type": "HowToStep", "text": "Slowly whisk in the chicken broth, adding it gradually to keep the soup base smooth. Let the mixture come to a gentle simmer and thicken slightly.", "name": "Slowly whisk in the chicken broth, adding it gradually to keep the soup base smooth. Let the mixture come to a gentle simmer and thicken slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/#wprm-recipe-38612-step-0-5"}, {"@type": "HowToStep", "text": "Whisk in the warmed half-and-half, then add the fresh thyme and dried Italian herbs. Keep the soup at a soft simmer rather than a full boil, stirring occasionally until the base is fully combined.", "name": "Whisk in the warmed half-and-half, then add the fresh thyme and dried Italian herbs. Keep the soup at a soft simmer rather than a full boil, stirring occasionally until the base is fully combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/#wprm-recipe-38612-step-0-6"}, {"@type": "HowToStep", "text": "Add the gnocchi and simmer for 3 to 5 minutes, or until the gnocchi becomes tender and rises to the surface.", "name": "Add the gnocchi and simmer for 3 to 5 minutes, or until the gnocchi becomes tender and rises to the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/#wprm-recipe-38612-step-0-7"}, {"@type": "HowToStep", "text": "Stir in the Parmesan cheese, rotisserie chicken, and chopped spinach. Continue cooking for 2 to 3 minutes, until the chicken is warmed through and the spinach has softened.", "name": "Stir in the Parmesan cheese, rotisserie chicken, and chopped spinach. Continue cooking for 2 to 3 minutes, until the chicken is warmed through and the spinach has softened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/#wprm-recipe-38612-step-0-8"}, {"@type": "HowToStep", "text": "Finish the soup with the optional nutmeg, then adjust the salt and black pepper to taste.", "name": "Finish the soup with the optional nutmeg, then adjust the salt and black pepper to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/#wprm-recipe-38612-step-0-9"}, {"@type": "HowToStep", "text": "Serve while warm, garnished with extra freshly grated Parmigiano Reggiano and cracked black pepper, with crusty Italian bread on the side.", "name": "Serve while warm, garnished with extra freshly grated Parmigiano Reggiano and cracked black pepper, with crusty Italian bread on the side.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/rotisserie-chicken-gnocchi-soup/#wprm-recipe-38612-step-0-10"}], "recipeCategory": ["Soup"], "recipeCuisine": ["Italian"], "keywords": "Rotisserie Chicken Gnocchi Soup"}</script>
