ipe-12122-step-0-5"}, {"@type": "HowToStep", "text": "Pour the seasoned butter mixture evenly over the assembled sliders, ensuring thorough coverage.", "name": "Pour the seasoned butter mixture evenly over the assembled sliders, ensuring thorough coverage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders-recipe/#wprm-recipe-12122-step-0-6"}, {"@type": "HowToStep", "text": "Return the dish to the oven and bake uncovered for 10 minutes. Then, cover with a greased piece of foil (greased side down) and continue baking for an additional 10 minutes.", "name": "Return the dish to the oven and bake uncovered for 10 minutes. Then, cover with a greased piece of foil (greased side down) and continue baking for an additional 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders-recipe/#wprm-recipe-12122-step-0-7"}, {"@type": "HowToStep", "text": "Remove from oven and allow to cool slightly before slicing into individual sliders. Serve warm.", "name": "Remove from oven and allow to cool slightly before slicing into individual sliders. Serve warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/hawaiian-roll-sliders-recipe/#wprm-recipe-12122-step-0-8"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Hawaiian Roll Sliders Recipe"}</script>
