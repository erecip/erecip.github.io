    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Muffins", "author": {"@type": "Person", "name": "BenDes"}, "description": "Hearty multigrain muffins filled with finely shredded carrot, apple, pineapple, dried fruit, coconut, seeds, and warming cinnamon. The combination creates a moist, textured muffin with a balanced mixture of fruit, vegetables, grains, and nutrient-rich seeds.", "datePublished": "2018-04-25T04:40:38+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/pumpkin-muffins2.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/pumpkin-muffins2.png"], "cookTime": "PT30M", "totalTime": "PT35M", "recipeIngredient": ["2 teaspoons baking powder", "¾ cup granulated sugar", "½ teaspoon salt", "2 cups multigrain flour (such as King Arthur multigrain blend)", "1 tablespoon ground cinnamon (preferably freshly ground for fuller flavor)", "¼ cup chia seeds", "1  can crushed pineapple (thoroughly drained)", "½ cup pepitas", "2 cups finely grated carrot", "¼ cup hemp hearts", "½ cup sweetened shredded coconut", "1  medium apple (finely shredded)", "½ cup hulled sunflower seeds", "½ cup dried fruit (such as raisins, cranberries, blueberries, chopped figs, or chopped apricots)", "1 teaspoon vanilla extract", "⅔ cup vegetable oil (or another neutral-flavored oil such as canola)", "3  large eggs (brought to room temperature)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Measure and organize all ingredients before beginning. Place the multigrain flour, granulated sugar, cinnamon, baking powder, and salt in a large mixing bowl. Whisk thoroughly so the cinnamon and leavening are distributed uniformly throughout the flour mixture and no concentrated pockets remain.", "name": "Measure and organize all ingredients before beginning. Place the multigrain flour, granulated sugar, cinnamon, baking powder, and salt in a large mixing bowl. Whisk thoroughly so the cinnamon and leavening are distributed uniformly throughout the flour mixture and no concentrated pockets remain.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-0"}, {"@type": "HowToStep", "text": "Freshly ground cinnamon may be used for a brighter and more pronounced spice flavor.", "name": "Freshly ground cinnamon may be used for a brighter and more pronounced spice flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-1"}, {"@type": "HowToStep", "text": "Add the finely grated carrot, shredded apple, drained crushed pineapple, dried fruit, sweetened coconut, sunflower seeds, pepitas, chia seeds, and hemp hearts to the dry mixture.", "name": "Add the finely grated carrot, shredded apple, drained crushed pineapple, dried fruit, sweetened coconut, sunflower seeds, pepitas, chia seeds, and hemp hearts to the dry mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-2"}, {"@type": "HowToStep", "text": "Stir until all additions are dispersed evenly. Pay particular attention to separating the carrot, apple, and pineapple throughout the flour mixture so that the ingredients do not collect in clumps. Some initial hydration of the dry ingredients from the moisture in the fruit and vegetables is normal.", "name": "Stir until all additions are dispersed evenly. Pay particular attention to separating the carrot, apple, and pineapple throughout the flour mixture so that the ingredients do not collect in clumps. Some initial hydration of the dry ingredients from the moisture in the fruit and vegetables is normal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-3"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk the room-temperature eggs with the vegetable oil and vanilla extract. Continue whisking for approximately 30 seconds, or until the mixture appears uniform, lightly creamy, and somewhat emulsified.", "name": "In a separate bowl, whisk the room-temperature eggs with the vegetable oil and vanilla extract. Continue whisking for approximately 30 seconds, or until the mixture appears uniform, lightly creamy, and somewhat emulsified.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-4"}, {"@type": "HowToStep", "text": "Using eggs at room temperature helps them combine more readily with the remaining ingredients.", "name": "Using eggs at room temperature helps them combine more readily with the remaining ingredients.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-5"}, {"@type": "HowToStep", "text": "Pour the egg-and-oil mixture into the bowl containing the dry ingredients and mix-ins.", "name": "Pour the egg-and-oil mixture into the bowl containing the dry ingredients and mix-ins.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-6"}, {"@type": "HowToStep", "text": "Using a spatula, gently fold the mixtures together only until they are combined. Avoid excessive mixing, as additional agitation can develop the gluten and produce muffins with a tougher, denser texture.", "name": "Using a spatula, gently fold the mixtures together only until they are combined. Avoid excessive mixing, as additional agitation can develop the gluten and produce muffins with a tougher, denser texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-7"}, {"@type": "HowToStep", "text": "The finished batter should remain slightly uneven and shaggy rather than completely smooth. A few small traces of dry flour are acceptable.", "name": "The finished batter should remain slightly uneven and shaggy rather than completely smooth. A few small traces of dry flour are acceptable.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-8"}, {"@type": "HowToStep", "text": "Preheat the oven to 350°F. Line 12–16 muffin cups with paper liners, or lightly coat the cups with a neutral-flavored oil.", "name": "Preheat the oven to 350°F. Line 12–16 muffin cups with paper liners, or lightly coat the cups with a neutral-flavored oil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-9"}, {"@type": "HowToStep", "text": "Distribute the batter evenly among the prepared muffin cups, filling each approximately two-thirds to three-quarters full to provide sufficient space for rising.", "name": "Distribute the batter evenly among the prepared muffin cups, filling each approximately two-thirds to three-quarters full to provide sufficient space for rising.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-10"}, {"@type": "HowToStep", "text": "Bake for 30–35 minutes. The muffins are ready when a toothpick inserted into the center comes out clean or carries only a few moist crumbs.", "name": "Bake for 30–35 minutes. The muffins are ready when a toothpick inserted into the center comes out clean or carries only a few moist crumbs.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-11"}, {"@type": "HowToStep", "text": "Allow the muffins to rest in the pan for 5 minutes, then remove them and transfer them to a wire cooling rack.", "name": "Allow the muffins to rest in the pan for 5 minutes, then remove them and transfer them to a wire cooling rack.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-muffins/#wprm-recipe-45282-step-0-12"}], "keywords": "Pumpkin Muffins"}</script>
