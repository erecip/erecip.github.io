 bottom to prevent sticking, until the mixture has thickened slightly. Taste and adjust seasonings if needed. Serve promptly over the prepared long grain white rice.", "name": "In a spacious skillet set over medium heat, melt the bacon grease together with the salted butter until fully liquefied. Sprinkle in the garlic powder, onion powder, creole seasoning, salt, and black pepper, stirring thoroughly and allowing the spices to bloom for about one minute. Incorporate the undrained red beans along with the water, stirring until the mixture is evenly combined. Using a potato masher, gently crush the beans, leaving a mix of both large and small pieces for varied texture. Bring the beans to a gentle simmer and maintain it for 15 to 20 minutes, stirring periodically and scraping the bottom to prevent sticking, until the mixture has thickened slightly. Taste and adjust seasonings if needed. Serve promptly over the prepared long grain white rice.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/red-beans-and-rice-recipe/#wprm-recipe-14559-step-0-0"}], "recipeCategory": ["Main Course", "Side Dish"], "recipeCuisine": ["American"], "keywords": "Red Beans And Rice Recipe"}</script>
