    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Pumpkin Pasta Bake", "author": {"@type": "Person", "name": "BenDes"}, "description": "A creamy, plant-based pasta casserole featuring a smooth pumpkin and sage sauce beneath a crisp, buttery panko crust. Garlic, vegetable broth, and aromatic sage provide savory depth, while the golden breadcrumb topping adds a pleasing contrast in texture.", "datePublished": "2018-10-05T15:19:33+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/pumpkin-pasta-bake.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/pumpkin-pasta-bake.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/pumpkin-pasta-bake.png", "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/pumpkin-pasta-bake.png"], "prepTime": "PT20M", "cookTime": "PT20M", "totalTime": "PT40M", "recipeIngredient": ["1 cup smooth pumpkin purée", "5  fresh sage leaves (finely chopped, or 1 teaspoon dried sage)", "2½ cups vegetable broth (plus an additional ¼–½ cup if required)", "¼ cup all-purpose flour", "3  fresh garlic cloves (finely minced)", "1 pound dry pasta", "¼ cup plant-based butter", "Fine salt (added according to taste)", "Freshly ground black pepper (added as desired)", "1 cup panko breadcrumbs", "2 tablespoons vegan butter"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of generously salted water to a rolling boil. Add the dry pasta and cook it according to the package directions until it reaches an al dente texture.", "name": "Bring a large pot of generously salted water to a rolling boil. Add the dry pasta and cook it according to the package directions until it reaches an al dente texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-0"}, {"@type": "HowToStep", "text": "Drain the pasta thoroughly and place it aside until the sauce is ready. When the pasta must stand for a while, it may be lightly tossed with olive oil to help keep the pieces from adhering to one another.", "name": "Drain the pasta thoroughly and place it aside until the sauce is ready. When the pasta must stand for a while, it may be lightly tossed with olive oil to help keep the pieces from adhering to one another.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-1"}, {"@type": "HowToStep", "text": "While the pasta cooks, place ¼ cup of plant-based butter in a large saucepan over medium-low heat. Allow the butter to melt completely.", "name": "While the pasta cooks, place ¼ cup of plant-based butter in a large saucepan over medium-low heat. Allow the butter to melt completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-2"}, {"@type": "HowToStep", "text": "Sprinkle the flour into the melted butter. Stir continuously with a wooden spoon and cook the roux until it develops a pale golden hue.", "name": "Sprinkle the flour into the melted butter. Stir continuously with a wooden spoon and cook the roux until it develops a pale golden hue.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-3"}, {"@type": "HowToStep", "text": "Add the minced garlic and chopped sage. Cook for 1 minute, stirring frequently so the aromatics do not scorch.", "name": "Add the minced garlic and chopped sage. Cook for 1 minute, stirring frequently so the aromatics do not scorch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-4"}, {"@type": "HowToStep", "text": "Gradually pour in the vegetable broth while whisking without interruption. Continue whisking to produce a smooth mixture without flour lumps.", "name": "Gradually pour in the vegetable broth while whisking without interruption. Continue whisking to produce a smooth mixture without flour lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-5"}, {"@type": "HowToStep", "text": "Increase the heat to medium-high. Bring the sauce to a boil, whisking steadily, and cook until it thickens.", "name": "Increase the heat to medium-high. Bring the sauce to a boil, whisking steadily, and cook until it thickens.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-6"}, {"@type": "HowToStep", "text": "Remove the saucepan from the heat. Add the pumpkin purée and whisk until the sauce is completely smooth and evenly blended.", "name": "Remove the saucepan from the heat. Add the pumpkin purée and whisk until the sauce is completely smooth and evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-7"}, {"@type": "HowToStep", "text": "Taste the sauce, then season it with salt and freshly ground black pepper as needed.", "name": "Taste the sauce, then season it with salt and freshly ground black pepper as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-8"}, {"@type": "HowToStep", "text": "Add the drained pasta to the prepared pumpkin-sage sauce. Toss gently until every piece is evenly covered.", "name": "Add the drained pasta to the prepared pumpkin-sage sauce. Toss gently until every piece is evenly covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the coated pasta to a 2½-quart baking dish. When the mixture appears too dry, add ¼–½ cup of vegetable broth or water and stir carefully to distribute the liquid.", "name": "Transfer the coated pasta to a 2½-quart baking dish. When the mixture appears too dry, add ¼–½ cup of vegetable broth or water and stir carefully to distribute the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-10"}, {"@type": "HowToStep", "text": "Melt the remaining 2 tablespoons of vegan butter in a medium skillet over medium heat.", "name": "Melt the remaining 2 tablespoons of vegan butter in a medium skillet over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-11"}, {"@type": "HowToStep", "text": "Add the panko breadcrumbs and stir until the crumbs are thoroughly coated with butter and have just begun to toast. Remove the skillet from the heat.", "name": "Add the panko breadcrumbs and stir until the crumbs are thoroughly coated with butter and have just begun to toast. Remove the skillet from the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-12"}, {"@type": "HowToStep", "text": "Distribute the toasted panko evenly over the pasta mixture.", "name": "Distribute the toasted panko evenly over the pasta mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-13"}, {"@type": "HowToStep", "text": "Place the baking dish in an oven preheated to 375°F. Bake for 20–25 minutes, or until the breadcrumb layer is golden and the pasta is hot throughout.", "name": "Place the baking dish in an oven preheated to 375°F. Bake for 20–25 minutes, or until the breadcrumb layer is golden and the pasta is hot throughout.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-14"}, {"@type": "HowToStep", "text": "Serve immediately while the sauce remains creamy and the panko topping is crisp.", "name": "Serve immediately while the sauce remains creamy and the panko topping is crisp.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pasta-bake/#wprm-recipe-40085-step-0-15"}], "recipeCategory": [
