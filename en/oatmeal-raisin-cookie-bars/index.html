    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Oatmeal Raisin Cookie Bars", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, warmly spiced oatmeal raisin cookie bars are baked until lightly golden, then finished with a smooth maple-cinnamon frosting. Quick oats and plump raisins give the bars a hearty, chewy texture, while brown sugar, vanilla, and cinnamon provide rich sweetness and depth.", "datePublished": "2019-11-30T16:19:53+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/oatmeal-raisin-cookie-bars2.png", "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/oatmeal-raisin-cookie-bars2.png", "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/oatmeal-raisin-cookie-bars2.png", "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/oatmeal-raisin-cookie-bars2.png"], "cookTime": "PT18M", "totalTime": "PT23M", "recipeIngredient": ["1 cup plump (moist raisins)", "3/4 cup unsalted butter (softened to approximately 70°F)", "2 cups quick-cooking oats", "1/2 teaspoon fine salt", "2 teaspoons pure vanilla extract", "3/4 cup firmly packed light brown sugar", "1 teaspoon baking soda", "2  large eggs (brought to room temperature)", "1 1/2 cups all-purpose flour", "3/4 teaspoon ground cinnamon (preferably freshly ground)", "1 tablespoon pure maple syrup", "1/2 teaspoon ground cinnamon", "1 1/2 cups powdered sugar (sifted until free of lumps)", "1/2 cup unsalted butter (softened to approximately 70°F)", "1/4 teaspoon maple extract (optional)", "1  –2 tablespoons heavy cream (at room temperature)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F and prepare a 9 × 13-inch baking pan. In a medium bowl, thoroughly whisk together the all-purpose flour, baking soda, ground cinnamon, and fine salt. Mixing the dry ingredients evenly helps distribute the leavening throughout the batter. Set the bowl aside.", "name": "Preheat the oven to 350°F and prepare a 9 × 13-inch baking pan. In a medium bowl, thoroughly whisk together the all-purpose flour, baking soda, ground cinnamon, and fine salt. Mixing the dry ingredients evenly helps distribute the leavening throughout the batter. Set the bowl aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/#wprm-recipe-41986-step-0-0"}, {"@type": "HowToStep", "text": "Place the softened unsalted butter and packed light brown sugar in a large mixing bowl. Beat for 2–3 minutes, or until the mixture becomes lighter in color and develops a fluffy consistency. Properly softened butter, at approximately 70°F, allows air to be incorporated effectively without making the dough greasy.", "name": "Place the softened unsalted butter and packed light brown sugar in a large mixing bowl. Beat for 2–3 minutes, or until the mixture becomes lighter in color and develops a fluffy consistency. Properly softened butter, at approximately 70°F, allows air to be incorporated effectively without making the dough greasy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/#wprm-recipe-41986-step-0-1"}, {"@type": "HowToStep", "text": "Beat in the room-temperature eggs one at a time, making certain the first egg is fully incorporated before adding the second. Pour in the vanilla extract and continue mixing until the wet mixture appears smooth and uniform.", "name": "Beat in the room-temperature eggs one at a time, making certain the first egg is fully incorporated before adding the second. Pour in the vanilla extract and continue mixing until the wet mixture appears smooth and uniform.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/#wprm-recipe-41986-step-0-2"}, {"@type": "HowToStep", "text": "Add the reserved flour mixture to the wet ingredients and stir only until the dry ingredients have been incorporated. Avoid excessive mixing, which can encourage gluten development and produce firmer bars. Fold in the quick oats and raisins with a spatula or wooden spoon until they are evenly dispersed throughout the dough.", "name": "Add the reserved flour mixture to the wet ingredients and stir only until the dry ingredients have been incorporated. Avoid excessive mixing, which can encourage gluten development and produce firmer bars. Fold in the quick oats and raisins with a spatula or wooden spoon until they are evenly dispersed throughout the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/#wprm-recipe-41986-step-0-3"}, {"@type": "HowToStep", "text": "Press the dough into the prepared baking pan, smoothing it into an even layer with your fingers or the back of a spatula. Bake for 18–20 minutes, until the surface is golden brown and a toothpick inserted near the center emerges with only a few moist crumbs attached.", "name": "Press the dough into the prepared baking pan, smoothing it into an even layer with your fingers or the back of a spatula. Bake for 18–20 minutes, until the surface is golden brown and a toothpick inserted near the center emerges with only a few moist crumbs attached.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/#wprm-recipe-41986-step-0-4"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and allow the bars to cool in the pan for 5–10 minutes. They may then be transferred to a wire rack or left in the pan to finish cooling. Allow them to become completely cool before applying the frosting so the butter-based topping does not melt.", "name": "Remove the pan from the oven and allow the bars to cool in the pan for 5–10 minutes. They may then be transferred to a wire rack or left in the pan to finish cooling. Allow them to become completely cool before applying the frosting so the butter-based topping does not melt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/#wprm-recipe-41986-step-0-5"}, {"@type": "HowToStep", "text": "While the bars are cooling, beat the softened butter in a clean mixing bowl for approximately 1 minute, until creamy. Gradually add the sifted powdered sugar, beating well between additions to maintain a smooth, airy consistency.", "name": "While the bars are cooling, beat the softened butter in a clean mixing bowl for approximately 1 minute, until creamy. Gradually add the sifted powdered sugar, beating well between additions to maintain a smooth, airy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/#wprm-recipe-41986-step-0-6"}, {"@type": "HowToStep", "text": "Mix in the maple syrup, cinnamon, and maple extract, if using. Add 1 tablespoon of heavy cream first, then incorporate up to 1 additional tablespoon as necessary to achieve a smooth, spreadable texture. Beat until the frosting is evenly blended.", "name": "Mix in the maple syrup, cinnamon, and maple extract, if using. Add 1 tablespoon of heavy cream first, then incorporate up to 1 additional tablespoon as necessary to achieve a smooth, spreadable texture. Beat until the frosting is evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/#wprm-recipe-41986-step-0-7"}, {"@type": "HowToStep", "text": "Once the oatmeal raisin bars are fully cooled, spread or pipe the maple frosting evenly across the surface. Slice into squares with a sharp knife, wiping the blade clean between cuts to create neat edges. Serve immediately or keep the bars in an airtight container.", "name": "Once the oatmeal raisin bars are fully cooled, spread or pipe the maple frosting evenly across the surface. Slice into squares with a sharp knife, wiping the blade clean between cuts to create neat edges. Serve immediately or keep the bars in an airtight container.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/oatmeal-raisin-cookie-bars/#wprm-recipe-41986-step-0-8"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Oatmeal Raisin Cookie Bars"}</script>
