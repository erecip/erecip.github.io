    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gluten-Free and Dairy-Free Pumpkin Pie with Almond Milk", "author": {"@type": "Person", "name": "BenDes"}, "description": "A smooth, warmly spiced pumpkin pie made with unsweetened almond milk and maple syrup, baked inside a tender gluten-free, dairy-free pastry crust. After baking, the pie is thoroughly chilled to create a firm, sliceable filling.", "datePublished": "2020-10-14T22:48:24+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/and-dairy-free-pumpkin-pie-with-almond-milk.png", "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/and-dairy-free-pumpkin-pie-with-almond-milk.png", "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/and-dairy-free-pumpkin-pie-with-almond-milk.png", "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/and-dairy-free-pumpkin-pie-with-almond-milk.png"], "cookTime": "PT58M", "totalTime": "PT298M", "recipeIngredient": ["6 tablespoons chilled plant-based butter (divided into small pieces)", "1/4 teaspoon salt", "4  –6 tablespoons ice-cold water (added only as needed)", "1 1/4 cups gluten-free all-purpose flour (such as Bob’s Red Mill 1-to-1 Baking Flour)", "1/4 cup pure maple syrup", "1/3 cup unsweetened almond milk", "2 3/4 cups pumpkin purée (such as Libby’s for a consistent texture)", "1 tablespoon olive oil", "1/4 teaspoon sea salt", "1/4 cup packed brown sugar", "1 3/4 teaspoons pumpkin pie spice", "2 1/2 tablespoons cornstarch (used as the thickener)", "Coconut whipped cream", "Vegan pumpkin pie ice cream"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the gluten-free flour and salt in a large mixing bowl and whisk until evenly blended.", "name": "Place the gluten-free flour and salt in a large mixing bowl and whisk until evenly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-0"}, {"@type": "HowToStep", "text": "Add the pieces of cold plant-based butter. Using a pastry cutter or fork, work the butter into the flour mixture without excessively handling the dough.", "name": "Add the pieces of cold plant-based butter. Using a pastry cutter or fork, work the butter into the flour mixture without excessively handling the dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-1"}, {"@type": "HowToStep", "text": "Pour in the ice water gradually, stirring with a wooden spoon after each addition. Use only enough water for the mixture to begin holding together, and do not exceed 6 tablespoons.", "name": "Pour in the ice water gradually, stirring with a wooden spoon after each addition. Use only enough water for the mixture to begin holding together, and do not exceed 6 tablespoons.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-2"}, {"@type": "HowToStep", "text": "Once the mixture forms a crumbly dough, place it on a sheet of parchment paper or plastic wrap. Gently shape it into a disc approximately 1/2 inch thick, wrap securely, and refrigerate for at least 30 minutes or for as long as 2 days.", "name": "Once the mixture forms a crumbly dough, place it on a sheet of parchment paper or plastic wrap. Gently shape it into a disc approximately 1/2 inch thick, wrap securely, and refrigerate for at least 30 minutes or for as long as 2 days.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-3"}, {"@type": "HowToStep", "text": "Before rolling, allow the chilled dough to soften slightly at room temperature. It should become workable without turning overly soft.", "name": "Before rolling, allow the chilled dough to soften slightly at room temperature. It should become workable without turning overly soft.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-4"}, {"@type": "HowToStep", "text": "While the dough is chilling, preheat the oven to 350°F (176°C).", "name": "While the dough is chilling, preheat the oven to 350°F (176°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-5"}, {"@type": "HowToStep", "text": "Place the pumpkin purée, almond milk, brown sugar, maple syrup, cornstarch, pumpkin pie spice, sea salt, and olive oil in a blender. Process until completely smooth, stopping to scrape down the blender sides whenever necessary.", "name": "Place the pumpkin purée, almond milk, brown sugar, maple syrup, cornstarch, pumpkin pie spice, sea salt, and olive oil in a blender. Process until completely smooth, stopping to scrape down the blender sides whenever necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-6"}, {"@type": "HowToStep", "text": "Taste the mixture and adjust the seasoning as needed, then set the filling aside.", "name": "Taste the mixture and adjust the seasoning as needed, then set the filling aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-7"}, {"@type": "HowToStep", "text": "Remove the chilled dough from its wrapping and position it between two large sheets of parchment or wax paper.", "name": "Remove the chilled dough from its wrapping and position it between two large sheets of parchment or wax paper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-8"}, {"@type": "HowToStep", "text": "Using a rolling pin, carefully roll the dough into a round large enough to fit a 9-inch pie dish. Small cracks are acceptable, as they can be repaired after the crust is placed in the pan.", "name": "Using a rolling pin, carefully roll the dough into a round large enough to fit a 9-inch pie dish. Small cracks are acceptable, as they can be repaired after the crust is placed in the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-9"}, {"@type": "HowToStep", "text": "Peel away the upper sheet of parchment or wax paper. Position the pie dish upside down over the rolled pastry.", "name": "Peel away the upper sheet of parchment or wax paper. Position the pie dish upside down over the rolled pastry.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-10"}, {"@type": "HowToStep", "text": "Using the lower sheet of paper for support, carefully turn the crust and dish over together. Press the pastry gently into the bottom and along the sides of the pan.", "name": "Using the lower sheet of paper for support, carefully turn the crust and dish over together. Press the pastry gently into the bottom and along the sides of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-11"}, {"@type": "HowToStep", "text": "Handle the dough as little as possible. Patch any cracks with small pieces of excess pastry, using the warmth of your fingers to help seal them.", "name": "Handle the dough as little as possible. Patch any cracks with small pieces of excess pastry, using the warmth of your fingers to help seal them.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-12"}, {"@type": "HowToStep", "text": "Pour the blended pumpkin mixture into the prepared gluten-free crust.", "name": "Pour the blended pumpkin mixture into the prepared gluten-free crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-13"}, {"@type": "HowToStep", "text": "Bake for 58–65 minutes. When ready, the pastry should appear lightly golden, while the center of the pumpkin filling may retain a gentle jiggle. Some cracking across the surface is also normal.", "name": "Bake for 58–65 minutes. When ready, the pastry should appear lightly golden, while the center of the pumpkin filling may retain a gentle jiggle. Some cracking across the surface is also normal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-14"}, {"@type": "HowToStep", "text": "Remove the pie from the oven and allow it to cool completely. Once cooled, cover it loosely and place it in the refrigerator for 4–6 hours, preferably overnight, so the filling can fully set.", "name": "Remove the pie from the oven and allow it to cool completely. Once cooled, cover it loosely and place it in the refrigerator for 4–6 hours, preferably overnight, so the filling can fully set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-15"}, {"@type": "HowToStep", "text": "After the pie has thoroughly chilled and firmed, cut it into slices and serve with coconut whipped cream if desired.", "name": "After the pie has thoroughly chilled and firmed, cut it into slices and serve with coconut whipped cream if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-16"}, {"@type": "HowToStep", "text": "For additional flavor, garnish with a light dusting of cinnamon, nutmeg, or pumpkin pie spice. Vegan pumpkin pie ice cream may also be served alongside the pie, with brown sugar pecans as an optional accompaniment.", "name": "For additional flavor, garnish with a light dusting of cinnamon, nutmeg, or pumpkin pie spice. Vegan pumpkin pie ice cream may also be served alongside the pie, with brown sugar pecans as an optional accompaniment.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/and-dairy-free-pumpkin-pie-with-almond-milk/#wprm-recipe-46210-step-0-17"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Gluten-Free and Dairy-Free Pumpkin Pie with Almond Milk"}</script>
