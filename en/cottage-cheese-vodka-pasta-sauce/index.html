    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Vodka Pasta Sauce", "author": {"@type": "Person", "name": "BenDes"}, "description": "A smooth, creamy vodka tomato sauce blended with full-fat cottage cheese and Parmesan, then tossed with al dente rigatoni. Garlic, onion, red pepper flakes, and basil provide a savory, aromatic finish while adding depth to the rich tomato base.", "datePublished": "2023-04-15T04:42:02+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/cottage-cheese-vodka-pasta-sauce2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/cottage-cheese-vodka-pasta-sauce2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/cottage-cheese-vodka-pasta-sauce2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/cottage-cheese-vodka-pasta-sauce2.png"], "recipeIngredient": ["1 cup full-fat cottage cheese (preferably for a richer, creamier consistency)", "5  fresh garlic cloves (finely minced)", "1/4 cup vodka", "3 cups onion (diced)", "1  can (15 ounces diced tomatoes, or whole peeled tomatoes crushed by hand)", "2  –3 tablespoons olive oil", "1/2 cup finely grated Parmesan cheese", "1  can (6 ounces tomato paste)", "1/4 teaspoon crushed red pepper flakes", "1/4 teaspoon salt", "1 pound rigatoni pasta (such as Barilla)", "1 tablespoon salt", "1/4 cup fresh basil (chopped)", "1/4 cup freshly grated Parmesan cheese"], "recipeInstructions": [{"@type": "HowToStep", "text": "Warm the olive oil in a sauté pan over medium heat. Add the diced onion, minced garlic, 1/4 teaspoon salt, and crushed red pepper flakes.", "name": "Warm the olive oil in a sauté pan over medium heat. Add the diced onion, minced garlic, 1/4 teaspoon salt, and crushed red pepper flakes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-0"}, {"@type": "HowToStep", "text": "Cook for 2–3 minutes, stirring from time to time, until the onion becomes tender and the garlic is aromatic.", "name": "Cook for 2–3 minutes, stirring from time to time, until the onion becomes tender and the garlic is aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-1"}, {"@type": "HowToStep", "text": "While the aromatics cook, fill a large pot with 4–5 quarts of water and season it with the tablespoon of salt. Place the pot over heat and bring the water to a boil as the sauce is prepared.", "name": "While the aromatics cook, fill a large pot with 4–5 quarts of water and season it with the tablespoon of salt. Place the pot over heat and bring the water to a boil as the sauce is prepared.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-2"}, {"@type": "HowToStep", "text": "Add the tomato paste, canned tomatoes, and chopped basil to the sautéed onion and garlic mixture.", "name": "Add the tomato paste, canned tomatoes, and chopped basil to the sautéed onion and garlic mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-3"}, {"@type": "HowToStep", "text": "Stir until thoroughly combined, then cook for approximately 5 minutes. Stir regularly so the tomato mixture does not adhere to the bottom of the pan.", "name": "Stir until thoroughly combined, then cook for approximately 5 minutes. Stir regularly so the tomato mixture does not adhere to the bottom of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-4"}, {"@type": "HowToStep", "text": "Transfer the cooked tomato mixture to a blender and add the cottage cheese.", "name": "Transfer the cooked tomato mixture to a blender and add the cottage cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-5"}, {"@type": "HowToStep", "text": "Blend on high speed for 1–2 minutes, or until completely smooth, creamy, and free of visible lumps. Set the blended sauce aside.", "name": "Blend on high speed for 1–2 minutes, or until completely smooth, creamy, and free of visible lumps. Set the blended sauce aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-6"}, {"@type": "HowToStep", "text": "Add the rigatoni to the boiling water and cook according to the package directions until al dente.", "name": "Add the rigatoni to the boiling water and cook according to the package directions until al dente.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-7"}, {"@type": "HowToStep", "text": "While the pasta cooks, clean the sauté pan and return it to the stovetop over low to medium heat. Pour the blended tomato-cottage cheese sauce back into the pan, then stir in the 1/2 cup grated Parmesan.", "name": "While the pasta cooks, clean the sauté pan and return it to the stovetop over low to medium heat. Pour the blended tomato-cottage cheese sauce back into the pan, then stir in the 1/2 cup grated Parmesan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-8"}, {"@type": "HowToStep", "text": "Heat gently, stirring occasionally, until the Parmesan has melted smoothly into the sauce.", "name": "Heat gently, stirring occasionally, until the Parmesan has melted smoothly into the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-9"}, {"@type": "HowToStep", "text": "Pour in the vodka and allow the sauce to simmer for roughly 2 minutes so that some of the alcohol cooks off.", "name": "Pour in the vodka and allow the sauce to simmer for roughly 2 minutes so that some of the alcohol cooks off.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-10"}, {"@type": "HowToStep", "text": "Drain the al dente rigatoni thoroughly and transfer it directly to the pan containing the simmering vodka sauce.", "name": "Drain the al dente rigatoni thoroughly and transfer it directly to the pan containing the simmering vodka sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-11"}, {"@type": "HowToStep", "text": "Stir and toss until every piece of pasta is evenly coated with the creamy tomato sauce. Serve hot with the additional grated Parmesan as garnish.", "name": "Stir and toss until every piece of pasta is evenly coated with the creamy tomato sauce. Serve hot with the additional grated Parmesan as garnish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-vodka-pasta-sauce/#wprm-recipe-44408-step-0-12"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American", "Italian"], "keywords": "Cottage Cheese Vodka Pasta Sauce"}</script>
