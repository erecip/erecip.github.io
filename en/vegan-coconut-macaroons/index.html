    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Vegan Coconut Macaroons", "author": {"@type": "Person", "name": "BenDes"}, "description": "These vegan coconut macaroons feature a rich, chewy coconut center with lightly toasted edges. Whipped aquafaba gives the mixture structure, while almond flour adds tenderness. Once cooled, the macaroons may be finished with a smooth non-dairy chocolate coating.", "datePublished": "2023-09-04T08:00:08+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/vegan-coconut-macaroons.png", "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/vegan-coconut-macaroons.png", "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/vegan-coconut-macaroons.png", "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/vegan-coconut-macaroons.png"], "cookTime": "PT23M", "totalTime": "PT33M", "recipeIngredient": ["¾ cup full-fat coconut milk (using mostly the thick coconut cream and up to ¼ cup of the thinner liquid as needed)", "¼ teaspoon fine salt", "4  heaping tablespoons whipped aquafaba (prepared from canned chickpea liquid)", "½ cup finely ground almond flour", "1 teaspoon pure vanilla extract", "14 ounces sweetened shredded coconut (such as Baker’s Angel Flake)", "¼ teaspoon cream of tartar", "½ teaspoon  almond extract, optional", "8 ounces dairy-free chocolate chips (such as Enjoy Life)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 325°F (163°C). Cover a large baking sheet with parchment paper to keep the macaroons from sticking.", "name": "Preheat the oven to 325°F (163°C). Cover a large baking sheet with parchment paper to keep the macaroons from sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-0"}, {"@type": "HowToStep", "text": "Scoop the firm white cream from a can of full-fat coconut milk. When the cream is too solid to measure easily, warm it in the microwave for 10–20 seconds, just until softened.", "name": "Scoop the firm white cream from a can of full-fat coconut milk. When the cream is too solid to measure easily, warm it in the microwave for 10–20 seconds, just until softened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-1"}, {"@type": "HowToStep", "text": "Measure ¾ cup of coconut milk, relying primarily on the thick cream. Add up to ¼ cup of the thinner coconut liquid from the can, if necessary, to reach the required amount.", "name": "Measure ¾ cup of coconut milk, relying primarily on the thick cream. Add up to ¼ cup of the thinner coconut liquid from the can, if necessary, to reach the required amount.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-2"}, {"@type": "HowToStep", "text": "Place the measured coconut milk in a large mixing bowl. Add the sweetened shredded coconut, almond flour, vanilla extract, optional almond extract, and salt.", "name": "Place the measured coconut milk in a large mixing bowl. Add the sweetened shredded coconut, almond flour, vanilla extract, optional almond extract, and salt.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-3"}, {"@type": "HowToStep", "text": "Stir the ingredients thoroughly with a sturdy spoon until the coconut mixture is evenly combined.", "name": "Stir the ingredients thoroughly with a sturdy spoon until the coconut mixture is evenly combined.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-4"}, {"@type": "HowToStep", "text": "Pour the liquid from a can of chickpeas into a medium bowl. Add the cream of tartar and beat with a hand mixer for approximately 3–6 minutes, or until the aquafaba forms stiff peaks.", "name": "Pour the liquid from a can of chickpeas into a medium bowl. Add the cream of tartar and beat with a hand mixer for approximately 3–6 minutes, or until the aquafaba forms stiff peaks.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-5"}, {"@type": "HowToStep", "text": "Measure 4 heaping tablespoons of the whipped aquafaba. Gently fold it into the prepared coconut mixture until just incorporated, taking care not to overmix.", "name": "Measure 4 heaping tablespoons of the whipped aquafaba. Gently fold it into the prepared coconut mixture until just incorporated, taking care not to overmix.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-6"}, {"@type": "HowToStep", "text": "Using a small cookie scoop or tablespoon, portion out heaping spoonfuls of the mixture and shape them into compact mounds.", "name": "Using a small cookie scoop or tablespoon, portion out heaping spoonfuls of the mixture and shape them into compact mounds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the shaped macaroons on the lined baking sheet, leaving approximately 1 inch of space between each one.", "name": "Arrange the shaped macaroons on the lined baking sheet, leaving approximately 1 inch of space between each one.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-8"}, {"@type": "HowToStep", "text": "Bake on the center oven rack for 23–25 minutes, or until the tops and outer edges are golden brown and lightly toasted.", "name": "Bake on the center oven rack for 23–25 minutes, or until the tops and outer edges are golden brown and lightly toasted.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-9"}, {"@type": "HowToStep", "text": "Allow the macaroons to rest on the baking sheet for 10 minutes. Carefully transfer them to a wire rack and leave them to cool completely.", "name": "Allow the macaroons to rest on the baking sheet for 10 minutes. Carefully transfer them to a wire rack and leave them to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-10"}, {"@type": "HowToStep", "text": "After the macaroons have cooled, place the non-dairy chocolate chips in a small microwave-safe bowl. Heat them in 30-second intervals, stirring after each interval, until the chocolate is fully melted and smooth.", "name": "After the macaroons have cooled, place the non-dairy chocolate chips in a small microwave-safe bowl. Heat them in 30-second intervals, stirring after each interval, until the chocolate is fully melted and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-11"}, {"@type": "HowToStep", "text": "Dip the base of each macaroon into the melted chocolate. Handle the macaroons carefully, using a fork when helpful, because they may be delicate.", "name": "Dip the base of each macaroon into the melted chocolate. Handle the macaroons carefully, using a fork when helpful, because they may be delicate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-12"}, {"@type": "HowToStep", "text": "Return the chocolate-dipped macaroons to the parchment-lined baking sheet. Refrigerate them for about 10 minutes, or until the chocolate coating has set.", "name": "Return the chocolate-dipped macaroons to the parchment-lined baking sheet. Refrigerate them for about 10 minutes, or until the chocolate coating has set.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/vegan-coconut-macaroons/#wprm-recipe-40302-step-0-13"}], "recipeCategory": ["Dessert"], "keywords": "Vegan Coconut Macaroons"}
