    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Southwestern Chicken Salad", "author": {"@type": "Person", "name": "BenDes"}, "description": "This Southwestern chicken salad combines tender shredded chicken with black beans, corn, red bell pepper, red onion, and fresh cilantro. A creamy Greek yogurt dressing seasoned with lime, cumin, chili powder, and smoked paprika brings the ingredients together, while optional cayenne adds extra heat.", "datePublished": "2022-04-27T03:09:48+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/southwestern-chicken-salad2.png", "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/southwestern-chicken-salad2.png", "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/southwestern-chicken-salad2.png", "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/southwestern-chicken-salad2.png"], "cookTime": "PT15M", "totalTime": "PT45M", "recipeIngredient": ["1 lb skinless (boneless chicken breast)", "Kosher salt (as needed for seasoning)", "Freshly ground black pepper (to taste)", "Water (enough to cover the chicken by at least 1 inch)", "1/4 cup finely chopped fresh cilantro", "3/4 cup black beans (thoroughly rinsed and drained)", "3/4 teaspoon ground cumin", "1/2 cup red bell pepper (cut into small dice)", "1 cup plain full-fat Greek yogurt or skyr", "3/4 teaspoon smoked paprika", "2 tablespoons freshly squeezed lime juice", "1/4 cup finely chopped red onion", "1/2 cup corn kernels (with fire-roasted corn optional for added flavor)", "3/4 teaspoon chili powder", "Kosher salt (to taste)", "Cayenne pepper (optional and to taste)", "Black pepper (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the boneless, skinless chicken breast in a medium saucepan. Season it to taste with kosher salt and black pepper.", "name": "Place the boneless, skinless chicken breast in a medium saucepan. Season it to taste with kosher salt and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-0"}, {"@type": "HowToStep", "text": "Pour in enough water to submerge the chicken beneath at least 1 inch of water.", "name": "Pour in enough water to submerge the chicken beneath at least 1 inch of water.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-1"}, {"@type": "HowToStep", "text": "Set the saucepan over medium-high heat and bring the water to a boil.", "name": "Set the saucepan over medium-high heat and bring the water to a boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-2"}, {"@type": "HowToStep", "text": "Once boiling, cover the saucepan, lower the heat, and gently simmer the chicken for 15–20 minutes, adjusting the cooking time according to its thickness. Continue cooking until the center of the chicken reaches an internal temperature of 165°F.", "name": "Once boiling, cover the saucepan, lower the heat, and gently simmer the chicken for 15–20 minutes, adjusting the cooking time according to its thickness. Continue cooking until the center of the chicken reaches an internal temperature of 165°F.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-3"}, {"@type": "HowToStep", "text": "Remove the cooked chicken and place it in a large bowl or the bowl of a stand mixer. Shred it using two forks, or use the stand mixer to separate the meat into shreds.", "name": "Remove the cooked chicken and place it in a large bowl or the bowl of a stand mixer. Shred it using two forks, or use the stand mixer to separate the meat into shreds.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-4"}, {"@type": "HowToStep", "text": "In a separate large mixing bowl, combine the full-fat Greek yogurt or skyr with the freshly squeezed lime juice, ground cumin, chili powder, smoked paprika, kosher salt, and black pepper. Add cayenne pepper to taste if additional heat is desired.", "name": "In a separate large mixing bowl, combine the full-fat Greek yogurt or skyr with the freshly squeezed lime juice, ground cumin, chili powder, smoked paprika, kosher salt, and black pepper. Add cayenne pepper to taste if additional heat is desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-5"}, {"@type": "HowToStep", "text": "Whisk the mixture thoroughly until the seasonings are evenly incorporated and the yogurt forms a smooth, creamy dressing.", "name": "Whisk the mixture thoroughly until the seasonings are evenly incorporated and the yogurt forms a smooth, creamy dressing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-6"}, {"@type": "HowToStep", "text": "Add the shredded chicken to the bowl containing the seasoned yogurt mixture.", "name": "Add the shredded chicken to the bowl containing the seasoned yogurt mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-7"}, {"@type": "HowToStep", "text": "Add the drained black beans, diced red bell pepper, corn kernels, finely chopped red onion, and chopped cilantro.", "name": "Add the drained black beans, diced red bell pepper, corn kernels, finely chopped red onion, and chopped cilantro.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-8"}, {"@type": "HowToStep", "text": "Stir until the chicken, beans, and vegetables are evenly distributed and thoroughly coated with the creamy yogurt dressing.", "name": "Stir until the chicken, beans, and vegetables are evenly distributed and thoroughly coated with the creamy yogurt dressing.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-9"}, {"@type": "HowToStep", "text": "Taste the finished mixture and adjust the kosher salt, black pepper, or optional cayenne as needed.", "name": "Taste the finished mixture and adjust the kosher salt, black pepper, or optional cayenne as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-10"}, {"@type": "HowToStep", "text": "Place the prepared chicken salad in the refrigerator and chill it for at least 30 minutes so the flavors have time to blend.", "name": "Place the prepared chicken salad in the refrigerator and chill it for at least 30 minutes so the flavors have time to blend.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-11"}, {"@type": "HowToStep", "text": "After chilling, serve the Southwestern chicken salad on whole-wheat toast, alongside tortilla chips, over a rice cake, or inside a tortilla as a wrap.", "name": "After chilling, serve the Southwestern chicken salad on whole-wheat toast, alongside tortilla chips, over a rice cake, or inside a tortilla as a wrap.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/southwestern-chicken-salad/#wprm-recipe-41937-step-0-12"}], "recipeCategory": ["Salad"], "recipeCuisine": ["Southwestern"], "keywords": "Southwestern Chicken Salad"}</script>
