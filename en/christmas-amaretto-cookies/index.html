 sugars. Place the softened unsalted butter, 1/4 cup confectioners’ sugar, and packed light brown sugar in the bowl of an electric mixer. Beat for approximately 2–3 minutes, until thoroughly blended, light, and fluffy.", "url": "https://erecip.github.io/en/christmas-amaretto-cookies/#wprm-recipe-44550-step-0-1"}, {"@type": "HowToStep", "text": "Incorporate the flour and salt. Add the all-purpose flour and salt to the creamed butter mixture. Mix only until the dry ingredients have disappeared into the dough. Avoid excessive mixing, as this helps preserve the cookies’ tender texture.", "name": "Incorporate the flour and salt. Add the all-purpose flour and salt to the creamed butter mixture. Mix only until the dry ingredients have disappeared into the dough. Avoid excessive mixing, as this helps preserve the cookies’ tender texture.", "url": "https://erecip.github.io/en/christmas-amaretto-cookies/#wprm-recipe-44550-step-0-2"}, {"@type": "HowToStep", "text": "Add the almond and Amaretto flavors. Pour in the Amaretto and almond essence or extract, then add the finely chopped almonds. Continue mixing just until the flavorings and nuts are distributed evenly throughout the dough.", "name": "Add the almond and Amaretto flavors. Pour in the Amaretto and almond essence or extract, then add the finely chopped almonds. Continue mixing just until the flavorings and nuts are distributed evenly throughout the dough.", "url": "https://erecip.github.io/en/christmas-amaretto-cookies/#wprm-recipe-44550-step-0-3"}, {"@type": "HowToStep", "text": "Shape the cookies. Portion the dough with a medium cookie scoop, using approximately 2 tablespoons for each cookie. Gently roll each portion between your hands to create a smooth ball.", "name": "Shape the cookies. Portion the dough with a medium cookie scoop, using approximately 2 tablespoons for each cookie. Gently roll each portion between your hands to create a smooth ball.", "url": "https://erecip.github.io/en/christmas-amaretto-cookies/#
