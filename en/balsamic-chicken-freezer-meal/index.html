en-freezer-meal/#wprm-recipe-40352-step-1-1"}, {"@type": "HowToStep", "text": "While the chicken cooks, transfer the reserved marinade to a saucepan. Bring it to a full boil and continue boiling for 5 minutes.", "name": "While the chicken cooks, transfer the reserved marinade to a saucepan. Bring it to a full boil and continue boiling for 5 minutes.", "url": "https://erecip.github.io/en/balsamic-chicken-freezer-meal/#wprm-recipe-40352-step-1-2"}, {"@type": "HowToStep", "text": "Stir in the cornstarch and packed brown sugar. Reduce the heat and simmer until the mixture develops a thick, glaze-like consistency.", "name": "Stir in the cornstarch and packed brown sugar. Reduce the heat and simmer until the mixture develops a thick, glaze-like consistency.", "url": "https://erecip.github.io/en/balsamic-chicken-freezer-meal/#wprm-recipe-40352-step-1-3"}, {"@type": "HowToStep", "text": "Spoon or pour the glaze over the baked chicken. Place the chicken under the broiler for approximately 5 minutes, or until the surface becomes caramelized.", "name": "Spoon or pour the glaze over the baked chicken. Place the chicken under the broiler for approximately 5 minutes, or until the surface becomes caramelized.", "url": "https://erecip.github.io/en/balsamic-chicken-freezer-meal/#wprm-recipe-40352-step-1-4"}]}, {"@type": "HowToSection", "name": "Cook using the slow cooker method.", "itemListElement": [{"@type": "HowToStep", "text": "Transfer the marinated chicken and all the marinade into the slow cooker.", "name": "Transfer the marinated chicken and all the marinade into the slow cooker.", "url": "https://erecip.github.io/en/balsamic-chicken-freezer-meal/#wprm-recipe-40352-step-2-0"}, {"@type": "HowToStep", "text": "Cover and cook on low for 8 hours or on high for 4 hours.", "name": "Cover and cook on low for 8 hours or on high for 4 hours.", "url": "https://erecip.github.io/en/balsamic-chicken-freezer-meal/#wprm-recipe-40352-step-2-1"}, {"@type": "HowToStep", "text": "Approximately
