/#wprm-recipe-45733-step-0-0"}, {"@type": "HowToStep", "text": "Place the pumpkin purée, thick coconut cream, brown sugar, sifted cornstarch, maple syrup, vanilla extract, pumpkin spice blend, cinnamon, and salt in a blender or large mixing bowl. Blend or mix thoroughly until the filling is completely smooth and uniform, with no visible lumps.", "name": "Place the pumpkin purée, thick coconut cream, brown sugar, sifted cornstarch, maple syrup, vanilla extract, pumpkin spice blend, cinnamon, and salt in a blender or large mixing bowl. Blend or mix thoroughly until the filling is completely smooth and uniform, with no visible lumps.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-with-coconut-milk/#wprm-recipe-45733-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the pumpkin mixture into the prepared unbaked pie shell. Gently spread the filling with a spatula, leveling and smoothing the surface so the pie cooks as evenly as possible.", "name": "Transfer the pumpkin mixture into the prepared unbaked pie shell. Gently spread the filling with a spatula, leveling and smoothing the surface so the pie cooks as evenly as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-with-coconut-milk/#wprm-recipe-45733-step-0-2"}, {"@type": "HowToStep", "text": "Set the filled pie crust in the preheated oven and bake for 60 minutes. At the end of baking, the outer portion of the filling should show slight cracking, while the center will still have a noticeable wobble. This texture is expected at this stage.", "name": "Set the filled pie crust in the preheated oven and bake for 60 minutes. At the end of baking, the outer portion of the filling should show slight cracking, while the center will still have a noticeable wobble. This texture is expected at this stage.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-with-coconut-milk/#wprm-recipe-45733-step-0-3"}, {"@type": "HowToStep", "text": "Remove the pie from the oven and allow it to cool at room temperature. Once cooled, place it uncovered in the refrigerator for at least 4 hours. For the firmest and most fully set texture, refrigerate it overnight.", "name": "Remove the pie from the oven and allow it to cool at room temperature. Once cooled, place it uncovered in the refrigerator for at least 4 hours. For the firmest and most fully set texture, refrigerate it overnight.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-with-coconut-milk/#wprm-recipe-45733-step-0-4"}, {"@type": "HowToStep", "text": "After the filling has chilled completely and become firm, slice the pumpkin pie and serve. It may be enjoyed as prepared or finished with coconut whipped cream for a richer presentation.", "name": "After the filling has chilled completely and become firm, slice the pumpkin pie and serve. It may be enjoyed as prepared or finished with coconut whipped cream for a richer presentation.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/pumpkin-pie-with-coconut-milk/#wprm-recipe-45733-step-0-5"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Pie with Coconut Milk"}</script>
