 then place the coating mixture aside for later use.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-0"}, {"@type": "HowToStep", "text": "Add the softened butter and 1⅓ cups granulated sugar to a large mixing bowl. Using an electric mixer, beat the ingredients for 1–2 minutes, or until the mixture becomes pale, airy, and fluffy.", "name": "Add the softened butter and 1⅓ cups granulated sugar to a large mixing bowl. Using an electric mixer, beat the ingredients for 1–2 minutes, or until the mixture becomes pale, airy, and fluffy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-1"}, {"@type": "HowToStep", "text": "Mix the egg and vanilla extract into the creamed butter mixture. Continue beating until the wet ingredients are thoroughly incorporated, then set the bowl aside.", "name": "Mix the egg and vanilla extract into the creamed butter mixture. Continue beating until the wet ingredients are thoroughly incorporated, then set the bowl aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-2"}, {"@type": "HowToStep", "text": "In a separate bowl, whisk together the flour, cream of tartar, baking soda, 2 teaspoons cinnamon, and salt until uniformly blended.", "name": "In a separate bowl, whisk together the flour, cream of tartar, baking soda, 2 teaspoons cinnamon, and salt until uniformly blended.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-3"}, {"@type": "HowToStep", "text": "Gradually add the dry mixture to the prepared wet ingredients. Mix on low speed only until a cohesive cookie dough forms, taking care not to overmix.", "name": "Gradually add the dry mixture to the prepared wet ingredients. Mix on low speed only until a cohesive cookie dough forms, taking care not to overmix.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-4"}, {"@type": "HowToStep", "text": "Gently fold the peeled, finely diced apple into the dough until the pieces are evenly dispersed.", "name": "Gently fold the peeled, finely diced apple into the dough until the pieces are evenly dispersed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-5"}, {"@type": "HowToStep", "text": "Portion the dough with a cookie scoop, then lightly flatten each serving between your fingers.", "name": "Portion the dough with a cookie scoop, then lightly flatten each serving between your fingers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-6"}, {"@type": "HowToStep", "text": "Press one soft caramel into a slightly flattened shape and position it in the center of each portion of dough.", "name": "Press one soft caramel into a slightly flattened shape and position it in the center of each portion of dough.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-7"}, {"@type": "HowToStep", "text": "Carefully draw the dough around the caramel, fully enclosing it so no part of the candy remains exposed. Roll the sealed dough gently between your palms to form a smooth ball.", "name": "Carefully draw the dough around the caramel, fully enclosing it so no part of the candy remains exposed. Roll the sealed dough gently between your palms to form a smooth ball.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-8"}, {"@type": "HowToStep", "text": "Roll each filled dough ball through the reserved cinnamon-sugar mixture until the exterior is completely coated.", "name": "Roll each filled dough ball through the reserved cinnamon-sugar mixture until the exterior is completely coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-9"}, {"@type": "HowToStep", "text": "Place the coated dough balls on a greased baking sheet, leaving approximately 2 inches of space between each cookie.", "name": "Place the coated dough balls on a greased baking sheet, leaving approximately 2 inches of space between each cookie.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-10"}, {"@type": "HowToStep", "text": "Bake at 350°F (175°C) for 10–11 minutes, or until the cookies show only a very light golden color.", "name": "Bake at 350°F (175°C) for 10–11 minutes, or until the cookies show only a very light golden color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-11"}, {"@type": "HowToStep", "text": "Leave the cookies on the baking sheet for at least 15–20 minutes before transferring them to a wire cooling rack. This resting period allows the caramel and cookie structure to set properly.", "name": "Leave the cookies on the baking sheet for at least 15–20 minutes before transferring them to a wire cooling rack. This resting period allows the caramel and cookie structure to set properly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/caramel-apple-snickerdoodle-cookies/#wprm-recipe-39774-step-0-12"}], "recipeCategory": ["Cookies", "Dessert"], "recipeCuisine": ["American"], "keywords": "Caramel Apple Snickerdoodle Cookies"}</script>
