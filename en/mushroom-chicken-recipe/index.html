    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Mushroom Chicken Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A comforting mushroom chicken dish with tender chicken breasts smothered in a rich, creamy mushroom sauce that captures the essence of a classic gravy. Perfectly paired with sides like mashed potatoes or buttered noodles, this recipe makes a delightful, satisfying meal.", "datePublished": "2024-03-16T21:51:51+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/c2a15c4829-1.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/c2a15c4829-1-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/c2a15c4829-1-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/2024/11/c2a15c4829-1-480x270.png"], "recipeYield": ["4"], "prepTime": "PT15M", "cookTime": "PT50M", "totalTime": "PT65M", "recipeIngredient": ["2  large boneless (skinless chicken breasts)", "10 oz mushrooms (button or baby bella, cleaned and sliced)", "½ cup all-purpose flour", "2 tablespoons salted butter", "3-4 tablespoons olive oil (plus extra if needed)", "Salt and pepper (to taste)", "2 ½ cups beef broth", "1  chicken bouillon cube or 1 teaspoon Better Than Bouillon", "1 teaspoon soy sauce (or substitute with Worcestershire sauce)", "1 teaspoon onion powder", "½ teaspoon each of mustard powder and dried thyme", "3 tablespoons cornstarch (combined with 3 tablespoons cold water)", "½ cup dry white wine (see notes)", "3 cloves garlic (minced)", "⅓ cup heavy cream"], "recipeInstructions": [{"@type": "HowToSection", "name": "Preparation", "itemListElement": [{"@type": "HowToStep", "text": "In a mixing bowl, combine the beef broth, bouillon, soy sauce, onion powder, mustard powder, and thyme. Set aside.", "name": "In a mixing bowl, combine the beef broth, bouillon, soy sauce, onion powder, mustard powder, and thyme. Set aside.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-0-0"}, {"@type": "HowToStep", "text": "Mix cornstarch with 3 tablespoons of cold water in a small container, seal, and shake until well blended. Set in a cool place.", "name": "Mix cornstarch with 3 tablespoons of cold water in a small container, seal, and shake until well blended. Set in a cool place.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-0-1"}, {"@type": "HowToStep", "text": "Gently rinse the mushrooms, pat them dry, and slice as necessary.", "name": "Gently rinse the mushrooms, pat them dry, and slice as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-0-2"}, {"@type": "HowToStep", "text": "Slice each chicken breast lengthwise into 2-3 thin pieces. Pound with a meat tenderizer if needed, aiming for a thickness of about ½ inch.", "name": "Slice each chicken breast lengthwise into 2-3 thin pieces. Pound with a meat tenderizer if needed, aiming for a thickness of about ½ inch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-0-3"}]}, {"@type": "HowToSection", "name": "Cooking the Mushrooms", "itemListElement": [{"@type": "HowToStep", "text": "Melt the butter in a large skillet over medium-high heat. Add mushrooms in a single layer and cook undisturbed for 3-4 minutes per side until browned. Sauté in batches if necessary, allowing space around each mushroom to encourage crisping. Add extra butter or a splash of olive oil if needed. Set aside on a plate when golden brown.", "name": "Melt the butter in a large skillet over medium-high heat. Add mushrooms in a single layer and cook undisturbed for 3-4 minutes per side until browned. Sauté in batches if necessary, allowing space around each mushroom to encourage crisping. Add extra butter or a splash of olive oil if needed. Set aside on a plate when golden brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-1-0"}]}, {"@type": "HowToSection", "name": "Dredging and Searing the Chicken", "itemListElement": [{"@type": "HowToStep", "text": "Season each chicken slice with salt and pepper, then dredge in flour, shaking off any excess.", "name": "Season each chicken slice with salt and pepper, then dredge in flour, shaking off any excess.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-2-0"}, {"@type": "HowToStep", "text": "Heat olive oil in the skillet over medium-high heat. Cook the chicken in batches, allowing 4-5 minutes per side until a golden crust forms. Remove and set aside on a plate, repeating with any remaining pieces.", "name": "Heat olive oil in the skillet over medium-high heat. Cook the chicken in batches, allowing 4-5 minutes per side until a golden crust forms. Remove and set aside on a plate, repeating with any remaining pieces.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-2-1"}, {"@type": "HowToStep", "text": "Pro Tip: Adjust the heat as necessary, adding a bit more olive oil if needed. Avoid moving the chicken while cooking to achieve a well-seared crust.", "name": "Pro Tip: Adjust the heat as necessary, adding a bit more olive oil if needed. Avoid moving the chicken while cooking to achieve a well-seared crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-2-2"}]}, {"@type": "HowToSection", "name": "Deglazing the Pan", "itemListElement": [{"@type": "HowToStep", "text": "Turn off the heat and carefully remove any excess oil from the skillet, leaving the brown bits (fond) for flavor.", "name": "Turn off the heat and carefully remove any excess oil from the skillet, leaving the brown bits (fond) for flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-3-0"}, {"@type": "HowToStep", "text": "Pour in the white wine and add minced garlic. Turn the heat to medium and use a silicone spatula to scrape up the fond. Allow the wine to reduce by half, approximately 4 minutes.", "name": "Pour in the white wine and add minced garlic. Turn the heat to medium and use a silicone spatula to scrape up the fond. Allow the wine to reduce by half, approximately 4 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-3-1"}]}, {"@type": "HowToSection", "name": "Finishing the Sauce", "itemListElement": [{"@type": "HowToStep", "text": "Pour in the beef broth mixture, increasing the heat slightly to bring it to a gentle boil. Let the sauce reduce for about 10 minutes.", "name": "Pour in the beef broth mixture, increasing the heat slightly to bring it to a gentle boil. Let the sauce reduce for about 10 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-4-0"}, {"@type": "HowToStep", "text": "Shake the cornstarch mixture again and slowly pour it into the sauce, stirring constantly until the sauce thickens. Lower the heat.", "name": "Shake the cornstarch mixture again and slowly pour it into the sauce, stirring constantly until the sauce thickens. Lower the heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-4-1"}, {"@type": "HowToStep", "text": "Stir in the heavy cream, then add the cooked mushrooms.", "name": "Stir in the heavy cream, then add the cooked mushrooms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-4-2"}, {"@type": "HowToStep", "text": "Return the chicken to the pan, along with any accumulated juices. Spoon the sauce over the chicken, partially cover, and let it warm through for about 5 minutes.", "name": "Return the chicken to the pan, along with any accumulated juices. Spoon the sauce over the chicken, partially cover, and let it warm through for about 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-4-3"}, {"@type": "HowToStep", "text": "Serve with mashed potatoes, buttered noodles, or roasted green beans for a complete meal.", "name": "Serve with mashed potatoes, buttered noodles, or roasted green beans for a complete meal.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/mushroom-chicken-recipe/#wprm-recipe-23710-step-4-4"}]}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Mushroom Chicken Recipe"}</script>
