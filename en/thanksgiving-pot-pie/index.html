    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Thanksgiving Pot Pie", "author": {"@type": "Person", "name": "BenDes"}, "description": "A festive vegan pot pie featuring a creamy vegetable and plant-based chicken filling nestled in a traditional pie shell and finished with a crisp, savory stuffing topping. The rich sauce, tender vegetables, and golden stuffing make this a substantial holiday main course.", "datePublished": "2019-11-03T08:23:11+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/thanksgiving-pot-pie1.png", "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/thanksgiving-pot-pie1.png", "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/thanksgiving-pot-pie1.png", "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/thanksgiving-pot-pie1.png"], "prepTime": "PT20M", "cookTime": "PT40M", "totalTime": "PT60M", "recipeIngredient": ["1  vegan 9- to 10-inch pie shell (homemade or purchased)", "1 cup frozen green peas (used directly from frozen)", "6 tablespoons plant-based butter", "2 cups cooked vegan chicken-style pieces", "1 teaspoon dried thyme (or 1 tablespoon fresh thyme)", "½  medium onion (cut into ½-inch dice)", "⅔ cup vegan heavy cream", "½ teaspoon freshly ground black pepper", "2  medium carrots (sliced into ¼-inch half-moons)", "1½ cups vegan vegetable broth", "1 teaspoon kosher salt", "⅓ cup all-purpose flour", "½ cup celery (cut into ¼-inch slices)", "1 teaspoon freshly minced garlic", "2  –3 cups unbaked vegan stuffing (homemade or packaged)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 425°F and arrange an oven rack in the center position. Slice the carrots into ¼-inch half-moons, cut the celery into ¼-inch pieces, dice the onion into ½-inch pieces, and finely mince the garlic. Measure the flour, salt, pepper, thyme, vegetable broth, and vegan heavy cream. Set the pie shell on a baking sheet and reserve it for assembly.", "name": "Preheat the oven to 425°F and arrange an oven rack in the center position. Slice the carrots into ¼-inch half-moons, cut the celery into ¼-inch pieces, dice the onion into ½-inch pieces, and finely mince the garlic. Measure the flour, salt, pepper, thyme, vegetable broth, and vegan heavy cream. Set the pie shell on a baking sheet and reserve it for assembly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-0"}, {"@type": "HowToStep", "text": "Melt the plant-based butter in a large pot over medium heat. Once the butter is melted and foaming, add the onion, carrots, and celery. Cook for 5–7 minutes, stirring periodically, until the vegetables begin to soften and the onion appears translucent.", "name": "Melt the plant-based butter in a large pot over medium heat. Once the butter is melted and foaming, add the onion, carrots, and celery. Cook for 5–7 minutes, stirring periodically, until the vegetables begin to soften and the onion appears translucent.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-1"}, {"@type": "HowToStep", "text": "Add the minced garlic, kosher salt, black pepper, and thyme. Stir continuously for approximately 1 minute, or until the garlic and seasonings become aromatic.", "name": "Add the minced garlic, kosher salt, black pepper, and thyme. Stir continuously for approximately 1 minute, or until the garlic and seasonings become aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-2"}, {"@type": "HowToStep", "text": "Scatter the flour evenly over the vegetables. Continue stirring for 1–2 minutes so the flour cooks into the butter and vegetables, forming the roux that will thicken the filling.", "name": "Scatter the flour evenly over the vegetables. Continue stirring for 1–2 minutes so the flour cooks into the butter and vegetables, forming the roux that will thicken the filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-3"}, {"@type": "HowToStep", "text": "Gradually pour in the vegetable broth while stirring continuously to keep the mixture smooth and prevent flour lumps. Once all the broth has been incorporated, allow the sauce to simmer for 2–3 minutes, stirring occasionally, until noticeably thickened and able to coat the back of a spoon.", "name": "Gradually pour in the vegetable broth while stirring continuously to keep the mixture smooth and prevent flour lumps. Once all the broth has been incorporated, allow the sauce to simmer for 2–3 minutes, stirring occasionally, until noticeably thickened and able to coat the back of a spoon.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-4"}, {"@type": "HowToStep", "text": "Stir in the vegan heavy cream, followed by the frozen peas and cooked vegan chicken-style pieces. Simmer everything together for another 5–8 minutes, until the peas are heated through and the sauce develops a thick, creamy consistency. The finished filling should retain body rather than appearing thin or soupy.", "name": "Stir in the vegan heavy cream, followed by the frozen peas and cooked vegan chicken-style pieces. Simmer everything together for another 5–8 minutes, until the peas are heated through and the sauce develops a thick, creamy consistency. The finished filling should retain body rather than appearing thin or soupy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-5"}, {"@type": "HowToStep", "text": "Pour the warm filling into the prepared vegan pie shell, stopping approximately ½ inch below the rim to reduce the chance of overflow during baking.", "name": "Pour the warm filling into the prepared vegan pie shell, stopping approximately ½ inch below the rim to reduce the chance of overflow during baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-6"}, {"@type": "HowToStep", "text": "Spread 2–3 cups of unbaked vegan stuffing evenly across the surface of the filling. Break larger portions into bite-size pieces as necessary. Keep the topping relatively loose rather than compressing it so the exposed surface can become crisp while the underside remains moist.", "name": "Spread 2–3 cups of unbaked vegan stuffing evenly across the surface of the filling. Break larger portions into bite-size pieces as necessary. Keep the topping relatively loose rather than compressing it so the exposed surface can become crisp while the underside remains moist.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-7"}, {"@type": "HowToStep", "text": "Place the assembled pot pie in the preheated oven and bake for 40–45 minutes, or until the stuffing is golden brown and the filling is gently bubbling around the edges.", "name": "Place the assembled pot pie in the preheated oven and bake for 40–45 minutes, or until the stuffing is golden brown and the filling is gently bubbling around the edges.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-8"}, {"@type": "HowToStep", "text": "Check the topping after approximately 25 minutes of baking. If the stuffing is becoming too dark before the pie has finished cooking, loosely cover the top with aluminum foil and continue baking for the remaining time.", "name": "Check the topping after approximately 25 minutes of baking. If the stuffing is becoming too dark before the pie has finished cooking, loosely cover the top with aluminum foil and continue baking for the remaining time.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-9"}, {"@type": "HowToStep", "text": "Remove the finished pot pie from the oven and allow it to stand for at least 10 minutes before portioning. This resting period gives the creamy filling time to settle and thicken slightly.", "name": "Remove the finished pot pie from the oven and allow it to stand for at least 10 minutes before portioning. This resting period gives the creamy filling time to settle and thicken slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/thanksgiving-pot-pie/#wprm-recipe-44560-step-0-10"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "Thanksgiving Pot Pie"}</script>
