    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Scalloped Potatoes Without Cheese", "author": {"@type": "Person", "name": "BenDes"}, "description": "A comforting baked potato casserole made without cheese, featuring thinly sliced red potatoes and onions layered with butter, flour, simple seasonings, and warm milk. Baking the dish uncovered creates tender potatoes, a thickened creamy sauce, and a lightly golden surface.", "datePublished": "2020-01-08T14:34:17+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/scalloped-potatoes-without-cheese1.png", "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/scalloped-potatoes-without-cheese1.png", "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/scalloped-potatoes-without-cheese1.png", "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/scalloped-potatoes-without-cheese1.png"], "cookTime": "PT60M", "totalTime": "PT65M", "recipeIngredient": ["4.3 cups milk (warmed; whole milk produces a richer, creamier consistency)", "1 1/2 teaspoons freshly ground black pepper", "8  –10 medium red potatoes (peeled and sliced into approximately 1/8-inch rounds)", "1/2 cup salted butter", "3  onions (halved and cut into thin, even slices)", "6 tablespoons all-purpose flour", "2 1/2 teaspoons salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 350°F (176°C).", "name": "Preheat the oven to 350°F (176°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-0"}, {"@type": "HowToStep", "text": "Wash the red potatoes thoroughly, then remove the skins.", "name": "Wash the red potatoes thoroughly, then remove the skins.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-1"}, {"@type": "HowToStep", "text": "Cut the potatoes into uniform rounds approximately 1/8 inch thick using a mandoline, food processor, or sharp knife.", "name": "Cut the potatoes into uniform rounds approximately 1/8 inch thick using a mandoline, food processor, or sharp knife.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-2"}, {"@type": "HowToStep", "text": "Halve the onions and slice them into evenly sized half-rounds so they cook consistently with the potatoes.", "name": "Halve the onions and slice them into evenly sized half-rounds so they cook consistently with the potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-3"}, {"@type": "HowToStep", "text": "For the most uniform texture, keep both the potato and onion slices thin and consistent in thickness.", "name": "For the most uniform texture, keep both the potato and onion slices thin and consistent in thickness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-4"}, {"@type": "HowToStep", "text": "Place the milk in a saucepan over medium heat and warm it gently until hot, taking care not to let it boil.", "name": "Place the milk in a saucepan over medium heat and warm it gently until hot, taking care not to let it boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-5"}, {"@type": "HowToStep", "text": "Stir the milk from time to time so it does not scorch on the bottom of the pan.", "name": "Stir the milk from time to time so it does not scorch on the bottom of the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-6"}, {"@type": "HowToStep", "text": "Although warming the milk is optional, doing so can encourage more even cooking and help produce a smoother finished sauce.", "name": "Although warming the milk is optional, doing so can encourage more even cooking and help produce a smoother finished sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-7"}, {"@type": "HowToStep", "text": "Arrange one-third of the sliced potatoes evenly across the bottom of a 13 × 9-inch casserole dish.", "name": "Arrange one-third of the sliced potatoes evenly across the bottom of a 13 × 9-inch casserole dish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-8"}, {"@type": "HowToStep", "text": "Distribute one-third of the sliced onions over the potatoes.", "name": "Distribute one-third of the sliced onions over the potatoes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-9"}, {"@type": "HowToStep", "text": "Scatter half of the flour across the vegetables, dot the layer with one-third of the butter, and season with one-third of the salt and black pepper.", "name": "Scatter half of the flour across the vegetables, dot the layer with one-third of the butter, and season with one-third of the salt and black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-10"}, {"@type": "HowToStep", "text": "Create the second layer with another one-third of the potatoes and onions. Add half of the remaining flour, another one-third of the butter, and another one-third of the salt and pepper.", "name": "Create the second layer with another one-third of the potatoes and onions. Add half of the remaining flour, another one-third of the butter, and another one-third of the salt and pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-11"}, {"@type": "HowToStep", "text": "Finish with the remaining potatoes and onions, then distribute the remaining butter over the surface.", "name": "Finish with the remaining potatoes and onions, then distribute the remaining butter over the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-12"}, {"@type": "HowToStep", "text": "Season the top with the final portion of salt and pepper.", "name": "Season the top with the final portion of salt and pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-13"}, {"@type": "HowToStep", "text": "An additional small pinch of black pepper may be scattered over the uppermost layer for a slightly stronger pepper flavor.", "name": "An additional small pinch of black pepper may be scattered over the uppermost layer for a slightly stronger pepper flavor.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-14"}, {"@type": "HowToStep", "text": "Slowly pour the warmed milk evenly over the assembled potato and onion layers.", "name": "Slowly pour the warmed milk evenly over the assembled potato and onion layers.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-15"}, {"@type": "HowToStep", "text": "Transfer the casserole to the preheated oven and bake uncovered for 60–80 minutes, or until the potatoes are easily pierced with a fork and the surface has developed a golden-brown color.", "name": "Transfer the casserole to the preheated oven and bake uncovered for 60–80 minutes, or until the potatoes are easily pierced with a fork and the surface has developed a golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-16"}, {"@type": "HowToStep", "text": "If the top begins to brown before the potatoes become tender, loosely cover the casserole with aluminum foil to protect the surface from becoming overly dark.", "name": "If the top begins to brown before the potatoes become tender, loosely cover the casserole with aluminum foil to protect the surface from becoming overly dark.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-17"}, {"@type": "HowToStep", "text": "For a crisper finish, the casserole may be placed under the broiler for 1–2 minutes at the conclusion of baking.", "name": "For a crisper finish, the casserole may be placed under the broiler for 1–2 minutes at the conclusion of baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-18"}, {"@type": "HowToStep", "text": "Remove the casserole from the oven and allow it to stand for approximately 5 minutes. This resting period gives the sauce time to thicken slightly and allows the flavors to settle.", "name": "Remove the casserole from the oven and allow it to stand for approximately 5 minutes. This resting period gives the sauce time to thicken slightly and allows the flavors to settle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/scalloped-potatoes-without-cheese/#wprm-recipe-41455-step-0-19"}], "recipeCategory": ["Side Dish"], "keywords": "Scalloped Potatoes Without Cheese"}</script>
