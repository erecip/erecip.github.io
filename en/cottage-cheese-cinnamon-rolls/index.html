    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cottage Cheese Cinnamon Rolls", "author": {"@type": "Person", "name": "BenDes"}, "description": "Soft, tender cinnamon rolls made with a cottage cheese-based dough and layered with melted butter, honey, brown sugar, and cinnamon. The rolls bake until golden and are best served pleasantly warm.", "datePublished": "2018-04-23T21:23:44+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/cottage-cheese-cinnamon-rolls2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/cottage-cheese-cinnamon-rolls2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/cottage-cheese-cinnamon-rolls2.png", "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/cottage-cheese-cinnamon-rolls2.png"], "cookTime": "PT35M", "recipeIngredient": ["1 cup cottage cheese (drained first if it contains excess liquid)", "½ cup vegetable or canola oil", "4¼ cups all-purpose flour", "2  large eggs (brought to room temperature)", "½ cup milk", "2 tablespoons baking powder", "¾ cup granulated sugar", "½ cup honey", "1½  –2 tablespoons ground cinnamon (according to preference)", "2 cups firmly packed light or dark brown sugar", "½ cup unsalted butter (melted)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Preheat the oven to 325°F (163°C). Thoroughly grease a 9 × 13-inch baking pan so the finished cinnamon rolls release easily after baking.", "name": "Preheat the oven to 325°F (163°C). Thoroughly grease a 9 × 13-inch baking pan so the finished cinnamon rolls release easily after baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-0"}, {"@type": "HowToStep", "text": "Place the cottage cheese in a blender and process until its texture is completely smooth. Add the granulated sugar, eggs, oil, and milk, then continue blending until evenly combined and creamy.", "name": "Place the cottage cheese in a blender and process until its texture is completely smooth. Add the granulated sugar, eggs, oil, and milk, then continue blending until evenly combined and creamy.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the blended cottage cheese mixture to a large mixing bowl. Stir in the baking powder until it is evenly distributed.", "name": "Transfer the blended cottage cheese mixture to a large mixing bowl. Stir in the baking powder until it is evenly distributed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-2"}, {"@type": "HowToStep", "text": "Add the all-purpose flour gradually, incorporating a small amount at a time. Continue mixing until a smooth dough forms.", "name": "Add the all-purpose flour gradually, incorporating a small amount at a time. Continue mixing until a smooth dough forms.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-3"}, {"@type": "HowToStep", "text": "Lightly dust a work surface with flour. Place the dough on the prepared surface and stretch or shape it into a large rectangle.", "name": "Lightly dust a work surface with flour. Place the dough on the prepared surface and stretch or shape it into a large rectangle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-4"}, {"@type": "HowToStep", "text": "In a separate bowl, thoroughly combine the packed brown sugar with the ground cinnamon to prepare the filling mixture.", "name": "In a separate bowl, thoroughly combine the packed brown sugar with the ground cinnamon to prepare the filling mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-5"}, {"@type": "HowToStep", "text": "Brush the melted unsalted butter evenly across the entire surface of the rectangular dough. Drizzle the honey over the butter, distributing it as uniformly as possible.", "name": "Brush the melted unsalted butter evenly across the entire surface of the rectangular dough. Drizzle the honey over the butter, distributing it as uniformly as possible.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-6"}, {"@type": "HowToStep", "text": "Scatter the brown sugar and cinnamon mixture over the honey-coated dough, covering the surface evenly from edge to edge.", "name": "Scatter the brown sugar and cinnamon mixture over the honey-coated dough, covering the surface evenly from edge to edge.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-7"}, {"@type": "HowToStep", "text": "Starting at one end, carefully roll the dough into a tight log. Slice the log into pieces approximately 1 to 1½ inches thick.", "name": "Starting at one end, carefully roll the dough into a tight log. Slice the log into pieces approximately 1 to 1½ inches thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-8"}, {"@type": "HowToStep", "text": "Arrange the sliced rolls in the prepared 9 × 13-inch baking pan. Transfer the pan to the preheated oven and bake for 35–40 minutes, or until the cinnamon rolls are golden brown and fully baked through.", "name": "Arrange the sliced rolls in the prepared 9 × 13-inch baking pan. Transfer the pan to the preheated oven and bake for 35–40 minutes, or until the cinnamon rolls are golden brown and fully baked through.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-9"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and allow the rolls to cool briefly before serving. Serve while still warm.", "name": "Remove the pan from the oven and allow the rolls to cool briefly before serving. Serve while still warm.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cottage-cheese-cinnamon-rolls/#wprm-recipe-42287-step-0-10"}], "recipeCategory": ["Breakfast"], "keywords": "Cottage Cheese Cinnamon Rolls"}</script>
