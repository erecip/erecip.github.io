    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Szechuan Chicken Recipe", "author": {"@type": "Person", "name": "BenDes"}, "description": "A vibrant and fiery stir-fry showcasing succulent chicken morsels enveloped in a robust sweet and savory sauce, complemented by crisp vegetables and an aromatic medley of chilies. This classic Chinese-style entrée rivals any restaurant favorite.", "datePublished": "2024-09-12T13:14:44+00:00", "image": ["https://erecip.github.io/en/szechuan-chicken-recipe/Szechuan-Chicken-Recipe.png", "https://erecip.github.io/en/szechuan-chicken-recipe/Szechuan-Chicken-Recipe.png", "https://erecip.github.io/en/szechuan-chicken-recipe/Szechuan-Chicken-Recipe.png", "https://erecip.github.io/en/szechuan-chicken-recipe/Szechuan-Chicken-Recipe.png"], "recipeYield": ["4"], "prepTime": "PT10M", "cookTime": "PT20M", "totalTime": "PT30M", "recipeIngredient": ["1/4 cup chicken broth", "1 pound boneless (skinless chicken breasts, diced into 1-inch pieces)", "1 tablespoon corn starch (for the sauce)", "1 tablespoon sesame oil", "1 tablespoon minced ginger", "1 1/2 tablespoons hoisin sauce", "1/4 cup vegetable oil", "1/4 cup corn starch (for the chicken)", "1/2 cup yellow onion (chopped into 1/2-inch chunks)", "1 teaspoon minced garlic", "1  red bell pepper (cut into 1-inch squares)", "1  green bell pepper (cut into 1-inch squares)", "3 tablespoons low-sodium soy sauce", "1 1/2 tablespoons brown sugar", "25  small dried red chilies", "1 tablespoon Sichuan peppercorns (optional)", "Salt and pepper (to taste)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Combine the chicken pieces with the 1/4 cup corn starch, seasoning with salt and pepper as desired, ensuring the meat is well-coated. Warm the vegetable oil in a spacious skillet over high heat. Arrange the chicken in a single layer and sear for 3–4 minutes per side until each piece turns a rich golden hue; work in batches if necessary. Remove the cooked chicken and cover to maintain warmth. Introduce the onion, red bell pepper, and green bell pepper to the pan, then add the dried chilies and Sichuan peppercorns. Sauté for 3–4 minutes until the vegetables soften slightly. Stir in the minced garlic and ginger and cook for an additional 30 seconds until fragrant. Return the browned chicken to the skillet, mixing thoroughly with the vegetables. In a separate small bowl, whisk together the soy sauce, hoisin sauce, sesame oil, brown sugar, 1 tablespoon corn starch, and chicken broth until smooth. Pour this sauce over the chicken and vegetable medley. Bring the mixture to a vigorous boil and cook for 30 seconds to 1 minute until the sauce thickens to a glossy consistency. Serve immediately.", "name": "Combine the chicken pieces with the 1/4 cup corn starch, seasoning with salt and pepper as desired, ensuring the meat is well-coated. Warm the vegetable oil in a spacious skillet over high heat. Arrange the chicken in a single layer and sear for 3–4 minutes per side until each piece turns a rich golden hue; work in batches if necessary. Remove the cooked chicken and cover to maintain warmth. Introduce the onion, red bell pepper, and green bell pepper to the pan, then add the dried chilies and Sichuan peppercorns. Sauté for 3–4 minutes until the vegetables soften slightly. Stir in the minced garlic and ginger and cook for an additional 30 seconds until fragrant. Return the browned chicken to the skillet, mixing thoroughly with the vegetables. In a separate small bowl, whisk together the soy sauce, hoisin sauce, sesame oil, brown sugar, 1 tablespoon corn starch, and chicken broth until smooth. Pour this sauce over the chicken and vegetable medley. Bring the mixture to a vigorous boil and cook for 30 seconds to 1 minute until the sauce thickens to a glossy consistency. Serve immediately.", "url": "https://erecip.github.io/en/szechuan-chicken-recipe/#wprm-recipe-14145-step-0-0"}], "recipeCategory": ["Main Course"], "rec
