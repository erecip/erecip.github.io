    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "White Bean Mushroom Stew", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, savory plant-based stew featuring tender baby potatoes, hearty white beans, and a generous mixture of mushrooms in a creamy dairy-free broth. Dijon mustard, tamari, garlic, rosemary, and thyme provide depth, while fresh parsley adds a bright finishing touch.", "datePublished": "2023-01-10T00:18:20+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/white-bean-mushroom-stew2.png", "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/white-bean-mushroom-stew2.png", "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/white-bean-mushroom-stew2.png"], "cookTime": "PT35M", "totalTime": "PT35M", "recipeIngredient": ["2  cans white beans (15 ounces each, thoroughly rinsed and drained)", "4  garlic cloves (finely minced)", "1 pound baby potatoes (chopped into 1/2-inch pieces, approximately 3 cups)", "3/4 teaspoon dried rosemary", "2 cups nondairy milk", "1 tablespoon Dijon mustard", "1  medium yellow onion (chopped, approximately 2 cups)", "2 tablespoons cornstarch", "3 cups vegetable broth", "1 pound assorted mushrooms (sliced, approximately 7 cups; shiitake and cremini are recommended)", "3/4 teaspoon dried thyme", "2 teaspoons tamari or soy sauce (using a gluten-free variety when necessary)", "3 tablespoons vegan butter (such as Miyoko’s, or olive oil)", "3/4 teaspoon sea salt and black pepper", "Fresh parsley (chopped, for garnishing)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the vegan butter or olive oil in a large pot or Dutch oven and warm it over medium heat. Once the butter has melted, add the chopped yellow onion and sauté for several minutes, allowing it to soften slightly.", "name": "Place the vegan butter or olive oil in a large pot or Dutch oven and warm it over medium heat. Once the butter has melted, add the chopped yellow onion and sauté for several minutes, allowing it to soften slightly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/#wprm-recipe-44201-step-0-0"}, {"@type": "HowToStep", "text": "Add the sliced mushrooms along with the dried thyme, rosemary, sea salt, and black pepper. Cook for 7–10 minutes, stirring periodically, until the mushrooms have released most of their liquid and are beginning to brown.", "name": "Add the sliced mushrooms along with the dried thyme, rosemary, sea salt, and black pepper. Cook for 7–10 minutes, stirring periodically, until the mushrooms have released most of their liquid and are beginning to brown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/#wprm-recipe-44201-step-0-1"}, {"@type": "HowToStep", "text": "Stir in the minced garlic and continue cooking for approximately 1 minute, just until aromatic.", "name": "Stir in the minced garlic and continue cooking for approximately 1 minute, just until aromatic.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/#wprm-recipe-44201-step-0-2"}, {"@type": "HowToStep", "text": "Scatter the cornstarch evenly over the cooked vegetables and stir thoroughly so the ingredients are well coated.", "name": "Scatter the cornstarch evenly over the cooked vegetables and stir thoroughly so the ingredients are well coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/#wprm-recipe-44201-step-0-3"}, {"@type": "HowToStep", "text": "Add the tamari or soy sauce and Dijon mustard, stirring until both seasonings are evenly incorporated throughout the mushroom mixture.", "name": "Add the tamari or soy sauce and Dijon mustard, stirring until both seasonings are evenly incorporated throughout the mushroom mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/#wprm-recipe-44201-step-0-4"}, {"@type": "HowToStep", "text": "Pour in the vegetable broth and add the diced baby potatoes. Raise the heat and bring the contents of the pot to a boil.", "name": "Pour in the vegetable broth and add the diced baby potatoes. Raise the heat and bring the contents of the pot to a boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/#wprm-recipe-44201-step-0-5"}, {"@type": "HowToStep", "text": "Once boiling, lower the heat and allow the stew to simmer uncovered for 15–20 minutes, stirring occasionally, until the potatoes become tender.", "name": "Once boiling, lower the heat and allow the stew to simmer uncovered for 15–20 minutes, stirring occasionally, until the potatoes become tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/#wprm-recipe-44201-step-0-6"}, {"@type": "HowToStep", "text": "Stir the drained white beans and nondairy milk into the simmering stew. Continue cooking uncovered for another 10–15 minutes, or until the vegetables are completely tender and the broth has thickened.", "name": "Stir the drained white beans and nondairy milk into the simmering stew. Continue cooking uncovered for another 10–15 minutes, or until the vegetables are completely tender and the broth has thickened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/#wprm-recipe-44201-step-0-7"}, {"@type": "HowToStep", "text": "Taste before serving and adjust the seasoning or consistency as needed. Additional tamari or salt may be used for greater saltiness, extra Dijon mustard may increase the acidity, and more nondairy milk may be stirred in for a thinner consistency.", "name": "Taste before serving and adjust the seasoning or consistency as needed. Additional tamari or salt may be used for greater saltiness, extra Dijon mustard may increase the acidity, and more nondairy milk may be stirred in for a thinner consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/#wprm-recipe-44201-step-0-8"}, {"@type": "HowToStep", "text": "Ladle the stew into bowls while warm. Finish each serving with chopped fresh parsley and freshly cracked black pepper to taste.", "name": "Ladle the stew into bowls while warm. Finish each serving with chopped fresh parsley and freshly cracked black pepper to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/white-bean-mushroom-stew/#wprm-recipe-44201-step-0-9"}], "recipeCategory": ["Main Course"], "keywords": "White Bean Mushroom Stew"}</script>
