m-recipe-44728-step-0-3"}, {"@type": "HowToStep", "text": "Arrange the thinly sliced chicken breasts beneath a sheet of plastic wrap. Pound each piece until it is uniformly thin, aiming for approximately 1/2-inch thickness.", "name": "Arrange the thinly sliced chicken breasts beneath a sheet of plastic wrap. Pound each piece until it is uniformly thin, aiming for approximately 1/2-inch thickness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-italian-bread-crumbs/#wprm-recipe-44728-step-0-4"}, {"@type": "HowToStep", "text": "Season one side of each chicken cutlet liberally with salt and pepper. Stack the pieces after seasoning so some of the seasoning transfers naturally between the cutlets.", "name": "Season one side of each chicken cutlet liberally with salt and pepper. Stack the pieces after seasoning so some of the seasoning transfers naturally between the cutlets.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-italian-bread-crumbs/#wprm-recipe-44728-step-0-5"}, {"@type": "HowToStep", "text": "Using one hand, coat a chicken piece thoroughly in the seasoned flour. Lift it from the dish and gently shake away any loose excess.", "name": "Using one hand, coat a chicken piece thoroughly in the seasoned flour. Lift it from the dish and gently shake away any loose excess.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-italian-bread-crumbs/#wprm-recipe-44728-step-0-6"}, {"@type": "HowToStep", "text": "With the opposite hand, dip the floured chicken into the prepared egg mixture, making sure the surface is coated.", "name": "With the opposite hand, dip the floured chicken into the prepared egg mixture, making sure the surface is coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-italian-bread-crumbs/#wprm-recipe-44728-step-0-7"}, {"@type": "HowToStep", "text": "Switch back to the first hand and press the chicken into the seasoned breadcrumb mixture until it is completely covered.", "name": "Switch back to the first hand and press the chicken into the seasoned breadcrumb mixture until it is completely covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-italian-bread-crumbs/#wprm-recipe-44728-step-0-8"}, {"@type": "HowToStep", "text": "Repeat with the remaining cutlets. Allow all of the breaded chicken to rest for approximately 30 minutes before cooking; this resting period helps the coating remain attached during frying.", "name": "Repeat with the remaining cutlets. Allow all of the breaded chicken to rest for approximately 30 minutes before cooking; this resting period helps the coating remain attached during frying.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-italian-bread-crumbs/#wprm-recipe-44728-step-0-9"}, {"@type": "HowToStep", "text": "Pour a generous amount of extra virgin olive oil into a large skillet and heat it over medium heat.", "name": "Pour a generous amount of extra virgin olive oil into a large skillet and heat it over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-italian-bread-crumbs/#wprm-recipe-44728-step-0-10"}, {"@type": "HowToStep", "text": "Working in batches, place the breaded chicken into the hot oil. Cook the first side until the coating develops a rich golden-brown color.", "name": "Working in batches, place the breaded chicken into the hot oil. Cook the first side until the coating develops a rich golden-brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chicken-breast-with-italian-bread-crumbs/#wprm-recipe-44728-step-0-11"}, {"@type": "HowToStep", "text": "Turn each cutlet and continue frying the second side until it is equally golden and the chicken is cooked through.", "name": "Turn each cutlet and continue frying the second side until it is equally golden and the chicken is cooked through.", "url": "ht
