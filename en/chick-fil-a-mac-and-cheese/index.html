    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Chick-fil-A Mac and Cheese", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich, ultra-creamy macaroni and cheese made with tender elbow pasta and a combination of American, extra-sharp cheddar, and Italian-blend cheeses. A final layer of cheddar is broiled until browned and bubbling, creating the signature golden finish.", "datePublished": "2021-08-25T06:43:30+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/chick-fil-a-mac-and-cheese.png", "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/chick-fil-a-mac-and-cheese.png", "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/chick-fil-a-mac-and-cheese.png", "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/chick-fil-a-mac-and-cheese.png"], "totalTime": "PT25M", "recipeIngredient": ["1 pound elbow-shaped macaroni pasta", "2 cups whole milk", "8 slices American cheese (torn into smaller pieces)", "1  large egg yolk", "¼ cup unsalted butter", "⅛ teaspoon paprika", "8 ounces extra-sharp cheddar cheese (freshly grated for smoother melting)", "1 teaspoon salt", "¼ cup all-purpose flour", "1 cup shredded Italian cheese blend", "8 ounces extra-sharp cheddar cheese (grated, for the browned cheese layer)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Bring a large pot of well-salted water to a rolling boil. Add the elbow macaroni and cook for 20 minutes. Although this is considerably longer than standard pasta cooking time, the macaroni should become exceptionally tender for this recipe.", "name": "Bring a large pot of well-salted water to a rolling boil. Add the elbow macaroni and cook for 20 minutes. Although this is considerably longer than standard pasta cooking time, the macaroni should become exceptionally tender for this recipe.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-0"}, {"@type": "HowToStep", "text": "Drain the cooked pasta thoroughly and reserve it while preparing the cheese mixture.", "name": "Drain the cooked pasta thoroughly and reserve it while preparing the cheese mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-1"}, {"@type": "HowToStep", "text": "While the macaroni cooks, place the butter in a large pot over medium heat and allow it to melt completely.", "name": "While the macaroni cooks, place the butter in a large pot over medium heat and allow it to melt completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-2"}, {"@type": "HowToStep", "text": "Whisk in the all-purpose flour, salt, and paprika until the mixture becomes uniformly smooth. Continue whisking for approximately 1 minute, taking care not to let the roux develop any brown color.", "name": "Whisk in the all-purpose flour, salt, and paprika until the mixture becomes uniformly smooth. Continue whisking for approximately 1 minute, taking care not to let the roux develop any brown color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-3"}, {"@type": "HowToStep", "text": "Add the whole milk to the roux gradually, incorporating a small amount at a time and whisking thoroughly after each addition. This gradual process helps maintain a lump-free consistency.", "name": "Add the whole milk to the roux gradually, incorporating a small amount at a time and whisking thoroughly after each addition. This gradual process helps maintain a lump-free consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-4"}, {"@type": "HowToStep", "text": "After all of the milk has been incorporated, continue whisking over medium heat for another 1–2 minutes, or until the mixture visibly thickens.", "name": "After all of the milk has been incorporated, continue whisking over medium heat for another 1–2 minutes, or until the mixture visibly thickens.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-5"}, {"@type": "HowToStep", "text": "Place the egg yolk in a small bowl and whisk it briefly. Slowly whisk a spoonful of the hot milk mixture into the yolk to gently raise its temperature.", "name": "Place the egg yolk in a small bowl and whisk it briefly. Slowly whisk a spoonful of the hot milk mixture into the yolk to gently raise its temperature.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-6"}, {"@type": "HowToStep", "text": "Return the tempered yolk mixture to the pot and whisk until completely blended into the sauce.", "name": "Return the tempered yolk mixture to the pot and whisk until completely blended into the sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-7"}, {"@type": "HowToStep", "text": "Lower the heat to low. Gradually add the torn American cheese, the 8 ounces of grated extra-sharp cheddar designated for the sauce, and the entire cup of shredded Italian-blend cheese.", "name": "Lower the heat to low. Gradually add the torn American cheese, the 8 ounces of grated extra-sharp cheddar designated for the sauce, and the entire cup of shredded Italian-blend cheese.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-8"}, {"@type": "HowToStep", "text": "Stir continuously over low heat until each cheese has fully melted and the sauce develops a smooth, creamy consistency.", "name": "Stir continuously over low heat until each cheese has fully melted and the sauce develops a smooth, creamy consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-9"}, {"@type": "HowToStep", "text": "Add the thoroughly drained macaroni to the finished cheese sauce.", "name": "Add the thoroughly drained macaroni to the finished cheese sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-10"}, {"@type": "HowToStep", "text": "Fold and stir gently until every piece of pasta is evenly covered with the creamy cheese mixture.", "name": "Fold and stir gently until every piece of pasta is evenly covered with the creamy cheese mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-11"}, {"@type": "HowToStep", "text": "Transfer the coated macaroni into a 9×13-inch baking dish and spread it into an even layer.", "name": "Transfer the coated macaroni into a 9×13-inch baking dish and spread it into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-12"}, {"@type": "HowToStep", "text": "Distribute the remaining 8 ounces of grated extra-sharp cheddar evenly across the surface.", "name": "Distribute the remaining 8 ounces of grated extra-sharp cheddar evenly across the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-13"}, {"@type": "HowToStep", "text": "Place the baking dish beneath the oven broiler and cook only until the cheese topping becomes bubbly and lightly browned. Monitor it closely because the cheese can progress from browned to burned very quickly. Rotate the baking dish when necessary to encourage even coloring.", "name": "Place the baking dish beneath the oven broiler and cook only until the cheese topping becomes bubbly and lightly browned. Monitor it closely because the cheese can progress from browned to burned very quickly. Rotate the baking dish when necessary to encourage even coloring.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-14"}, {"@type": "HowToStep", "text": "Remove the macaroni and cheese from the oven immediately after the topping reaches a golden-brown finish.", "name": "Remove the macaroni and cheese from the oven immediately after the topping reaches a golden-brown finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-15"}, {"@type": "HowToStep", "text": "Allow the dish to cool briefly before serving it hot.", "name": "Allow the dish to cool briefly before serving it hot.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/chick-fil-a-mac-and-cheese/#wprm-recipe-44874-step-0-16"}], "recipeCategory": ["Side Dish"], "recipeCuisine": ["American"], "keywords": "Chick-fil-A Mac and Cheese"}</script>
