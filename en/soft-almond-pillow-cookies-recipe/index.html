ng. Combine the almond paste, sugar, milk, egg yolk, and almond extract in a separate bowl. Beat until all ingredients are fully incorporated and the mixture is smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/soft-almond-pillow-cookies-recipe/#wprm-recipe-362-step-0-2"}, {"@type": "HowToStep", "text": "Using a medium cookie scoop, form balls of the chilled cookie dough. Flatten each ball gently in the palm of your hand. Take a scant tablespoon (or about 0.5 oz) of the almond filling, roll it into a small ball, and position it in the center of the flattened dough. Carefully wrap the dough around the filling, rolling it between your hands to create a smooth, uniform ball. Place each ball on a parchment-lined baking sheet. Flatten slightly with your hand, and if desired, use a round cookie cutter to tidy the edges. Repeat this process with the remaining dough and filling.", "name": "Using a medium cookie scoop, form balls of the chilled cookie dough. Flatten each ball gently in the palm of your hand. Take a scant tablespoon (or about 0.5 oz) of the almond filling, roll it into a small ball, and position it in the center of the flattened dough. Carefully wrap the dough around the filling, rolling it between your hands to create a smooth, uniform ball. Place each ball on a parchment-lined baking sheet. Flatten slightly with your hand, and if desired, use a round cookie cutter to tidy the edges. Repeat this process with the remaining dough and filling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/soft-almond-pillow-cookies-recipe/#wprm-recipe-362-step-0-3"}, {"@type": "HowToStep", "text": "Bake in the preheated oven for 15-20 minutes, keeping a close eye on the cookies to ensure they do not overbrown.", "name": "Bake in the preheated oven for 15-20 minutes, keeping a close eye on the cookies to ensure they do not overbrown.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/soft-almond-pillow-cookies-recipe/#wprm-recipe
