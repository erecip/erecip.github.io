    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Crock Pot Marry Me Chicken", "author": {"@type": "Person", "name": "BenDes"}, "description": "A rich slow-cooker chicken dish featuring tender breast fillets in a creamy, savory sauce flavored with sun-dried tomatoes, Parmesan, Italian herbs, garlic, and paprika. The chicken is briefly browned before slow cooking, creating deeper flavor while keeping the meat moist and tender.", "datePublished": "2018-04-04T02:42:18+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/crock-pot-marry-me-chicken2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/crock-pot-marry-me-chicken2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/crock-pot-marry-me-chicken2.png", "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/crock-pot-marry-me-chicken2.png"], "prepTime": "PT15M", "cookTime": "PT90M", "totalTime": "PT105M", "recipeIngredient": ["1 cup sour cream or heavy cream", "4  chicken breast fillets (skin-on or skinless)", "4 tablespoons drained sun-dried tomatoes (chopped)", "1 teaspoon olive oil", "2 to 3 tablespoons Parmesan cheese (grated)", "1 teaspoon garlic powder", "1 tablespoon unsalted butter", "2 tablespoons fresh flat-leaf parsley or basil (chopped)", "2 teaspoons dried Italian seasoning", "Salt (as needed)", "Freshly ground black pepper (to taste)", "1 teaspoon sweet paprika", "1 teaspoon chicken bouillon granules (only when using the wine option)", "½ cup white wine combined with ½ cup water (or substitute 1 cup chicken broth)", "Optional: 1 tablespoon cornstarch blended with 2 tablespoons cold water"], "recipeInstructions": [{"@type": "HowToStep", "text": "Pat the chicken breast fillets thoroughly dry with paper towels. Season both sides with salt and black pepper, then distribute the dried Italian seasoning evenly over each piece, ensuring the surface is well coated.", "name": "Pat the chicken breast fillets thoroughly dry with paper towels. Season both sides with salt and black pepper, then distribute the dried Italian seasoning evenly over each piece, ensuring the surface is well coated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/#wprm-recipe-45088-step-0-0"}, {"@type": "HowToStep", "text": "Warm the unsalted butter and olive oil in a large skillet over medium-high heat. Alternatively, use the browning setting on the slow cooker if available. Add the seasoned chicken, placing skin-on fillets skin-side down first, and sear for approximately 2 to 3 minutes on each side until golden. If using a separate skillet, transfer the browned chicken to the slow cooker.", "name": "Warm the unsalted butter and olive oil in a large skillet over medium-high heat. Alternatively, use the browning setting on the slow cooker if available. Add the seasoned chicken, placing skin-on fillets skin-side down first, and sear for approximately 2 to 3 minutes on each side until golden. If using a separate skillet, transfer the browned chicken to the slow cooker.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/#wprm-recipe-45088-step-0-1"}, {"@type": "HowToStep", "text": "Turn the chicken as needed and pour in either the white wine and water mixture or the chicken broth. Sprinkle the sweet paprika and garlic powder over the chicken. When using wine and water, add the chicken bouillon granules as well. Scatter the drained, chopped sun-dried tomatoes around the chicken.", "name": "Turn the chicken as needed and pour in either the white wine and water mixture or the chicken broth. Sprinkle the sweet paprika and garlic powder over the chicken. When using wine and water, add the chicken bouillon granules as well. Scatter the drained, chopped sun-dried tomatoes around the chicken.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/#wprm-recipe-45088-step-0-2"}, {"@type": "HowToStep", "text": "Cover the slow cooker and cook on LOW for 90 minutes to 2 hours. The chicken is ready when it is tender and the thickest portion reaches an internal temperature of 165°F (75°C).", "name": "Cover the slow cooker and cook on LOW for 90 minutes to 2 hours. The chicken is ready when it is tender and the thickest portion reaches an internal temperature of 165°F (75°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/#wprm-recipe-45088-step-0-3"}, {"@type": "HowToStep", "text": "For a thicker consistency, stir together the cornstarch and cold water until smooth. Add this slurry to the sauce approximately 10 minutes before the end of the cooking time, then allow the sauce to continue cooking until slightly thickened.", "name": "For a thicker consistency, stir together the cornstarch and cold water until smooth. Add this slurry to the sauce approximately 10 minutes before the end of the cooking time, then allow the sauce to continue cooking until slightly thickened.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/#wprm-recipe-45088-step-0-4"}, {"@type": "HowToStep", "text": "Once the chicken is fully cooked, move the pieces toward one side of the slow cooker. Stir the sour cream or heavy cream into the cooking liquid until completely incorporated and smooth.", "name": "Once the chicken is fully cooked, move the pieces toward one side of the slow cooker. Stir the sour cream or heavy cream into the cooking liquid until completely incorporated and smooth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/#wprm-recipe-45088-step-0-5"}, {"@type": "HowToStep", "text": "Add the grated Parmesan cheese along with the chopped flat-leaf parsley or fresh basil. Stir gently until the cheese blends into the creamy sauce.", "name": "Add the grated Parmesan cheese along with the chopped flat-leaf parsley or fresh basil. Stir gently until the cheese blends into the creamy sauce.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/#wprm-recipe-45088-step-0-6"}, {"@type": "HowToStep", "text": "Serve the Crock Pot Marry Me Chicken hot over rice, noodles, or mashed potatoes. Spoon a generous amount of the creamy sun-dried tomato sauce over each portion and finish with additional fresh herbs if desired.", "name": "Serve the Crock Pot Marry Me Chicken hot over rice, noodles, or mashed potatoes. Spoon a generous amount of the creamy sun-dried tomato sauce over each portion and finish with additional fresh herbs if desired.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-marry-me-chicken/#wprm-recipe-45088-step-0-7"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["Italian-Inspired"], "keywords": "Crock Pot Marry Me Chicken"}</script>
