", "text": "Preheat the oven to 400°F (200°C).", "name": "Preheat the oven to 400°F (200°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole/#wprm-recipe-31024-step-0-1"}, {"@type": "HowToStep", "text": "In a Dutch oven set over medium heat, melt the butter. Add the minced garlic and diced shallots, stirring regularly, and cook until aromatic, approximately 2 minutes.", "name": "In a Dutch oven set over medium heat, melt the butter. Add the minced garlic and diced shallots, stirring regularly, and cook until aromatic, approximately 2 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole/#wprm-recipe-31024-step-0-2"}, {"@type": "HowToStep", "text": "Whisk in the flour and cook for about 1 minute until it turns a light golden hue.", "name": "Whisk in the flour and cook for about 1 minute until it turns a light golden hue.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole/#wprm-recipe-31024-step-0-3"}, {"@type": "HowToStep", "text": "Gradually stir in the half and half and Dijon mustard. Continue whisking until the mixture thickens slightly, which should take about 4–5 minutes.", "name": "Gradually stir in the half and half and Dijon mustard. Continue whisking until the mixture thickens slightly, which should take about 4–5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole/#wprm-recipe-31024-step-0-4"}, {"@type": "HowToStep", "text": "Remove the Dutch oven from heat. Stir in the shredded cheddar cheese and continue mixing until completely smooth and incorporated, around 2 minutes.", "name": "Remove the Dutch oven from heat. Stir in the shredded cheddar cheese and continue mixing until completely smooth and incorporated, around 2 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole/#wprm-recipe-31024-step-0-5"}, {"@type": "HowToStep", "text": "Fold in the cooked noodles, drained tuna, and peas until all ingredients are well distributed. Season generously with salt and freshly ground black pepper to taste.", "name": "Fold in the cooked noodles, drained tuna, and peas until all ingredients are well distributed. Season generously with salt and freshly ground black pepper to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole/#wprm-recipe-31024-step-0-6"}, {"@type": "HowToStep", "text": "In a separate small bowl, prepare the topping by combining the Panko, grated Parmesan, lemon zest, and olive oil. Mix thoroughly.", "name": "In a separate small bowl, prepare the topping by combining the Panko, grated Parmesan, lemon zest, and olive oil. Mix thoroughly.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole/#wprm-recipe-31024-step-0-7"}, {"@type": "HowToStep", "text": "Evenly sprinkle the prepared Panko mixture over the casserole.", "name": "Evenly sprinkle the prepared Panko mixture over the casserole.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole/#wprm-recipe-31024-step-0-8"}, {"@type": "HowToStep", "text": "Transfer the Dutch oven to the preheated oven and bake uncovered for 25–30 minutes, or until the top is crisp and the filling is bubbling.", "name": "Transfer the Dutch oven to the preheated oven and bake uncovered for 25–30 minutes, or until the top is crisp and the filling is bubbling.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole/#wprm-recipe-31024-step-0-9"}, {"@type": "HowToStep", "text": "Serve immediately, garnished with chopped fresh chives.", "name": "Serve immediately, garnished with chopped fresh chives.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/tuna-noodle-casserole/#wprm-recipe-31024-step-0-10"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["American"], "keywords": "tuna noodle casserole"}</script>
