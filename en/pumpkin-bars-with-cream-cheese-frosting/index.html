ating of nonstick cooking spray to the paper. Set the prepared pan aside.", "url": "https://erecip.github.io/en/pumpkin-bars-with-cream-cheese-frosting/#wprm-recipe-40011-step-0-0"}, {"@type": "HowToStep", "text": "Place the all-purpose flour, granulated sugar, baking powder, baking soda, cinnamon, nutmeg, kosher salt, cloves, neutral oil, pumpkin purée, and eggs in a large mixing bowl.", "name": "Place the all-purpose flour, granulated sugar, baking powder, baking soda, cinnamon, nutmeg, kosher salt, cloves, neutral oil, pumpkin purée, and eggs in a large mixing bowl.", "url": "https://erecip.github.io/en/pumpkin-bars-with-cream-cheese-frosting/#wprm-recipe-40011-step-0-1"}, {"@type": "HowToStep", "text": "Using a hand mixer or stand mixer, blend the ingredients on low speed just until the dry components are moistened. Raise the mixer to medium speed and continue beating for 2 minutes, or until the batter is uniform and smooth.", "name": "Using a hand mixer or stand mixer, blend the ingredients on low speed just until the dry components are moistened. Raise the mixer to medium speed and continue beating for 2 minutes, or until the batter is uniform and smooth.", "url": "https://erecip.github.io/en/pumpkin-bars-with-cream-cheese-frosting/#wprm-recipe-40011-step-0-2"}, {"@type": "HowToStep", "text": "Bake for 25–30 minutes. The bars are ready when the center is set and a toothpick inserted into the middle comes out clean.", "name": "Bake for 25–30 minutes. The bars are ready when the center is set and a toothpick inserted into the middle comes out clean.", "url": "https://erecip.github.io/en/pumpkin-bars-with-cream-cheese-frosting/#wprm-recipe-40011-step-0-3"}, {"@type": "HowToStep", "text": "Remove the pan from the oven and allow the pumpkin bars to cool completely in the pan before applying the frosting.", "name": "Remove the pan from the oven and allow the pumpkin bars to cool completely in the pan before applying the frosting.", "url": "https://erecip.github.io/en/pumpkin-bars-with-cream-cheese-frosting/#wprm-recipe-40011-step-0-4"}, {"@type": "HowToStep", "text": "While the bars cool, add the sifted confectioners’ sugar, softened butter, softened cream cheese, milk, and vanilla extract to a medium mixing bowl.", "name": "While the bars cool, add the sifted confectioners’ sugar, softened butter, softened cream cheese, milk, and vanilla extract to a medium mixing bowl.", "url": "https://erecip.github.io/en/pumpkin-bars-with-cream-cheese-frosting/#wprm-recipe-40011-step-0-5"}, {"@type": "HowToStep", "text": "Beat the mixture with a hand mixer on medium speed until the frosting becomes creamy, smooth, and fully blended.", "name": "Beat the mixture with a hand mixer on medium speed until the frosting becomes creamy, smooth, and fully blended.", "url": "https://erecip.github.io/en/pumpkin-bars-with-cream-cheese-frosting/#wprm-recipe-40011-step-0-6"}, {"@type": "HowToStep", "text": "Once the pumpkin bars have cooled completely, distribute the cream cheese frosting evenly across the surface.", "name": "Once the pumpkin bars have cooled completely, distribute the cream cheese frosting evenly across the surface.", "url": "https://erecip.github.io/en/pumpkin-bars-with-cream-cheese-frosting/#wprm-recipe-40011-step-0-7"}, {"@type": "HowToStep", "text": "Cut the frosted sheet into 48 individual bars and serve.", "name": "Cut the frosted sheet into 48 individual bars and serve.", "url": "https://erecip.github.io/en/pumpkin-bars-with-cream-cheese-frosting/#wprm-recipe-40011-step-0-8"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Pumpkin Bars with Cream Cheese Frosting"}</script>
