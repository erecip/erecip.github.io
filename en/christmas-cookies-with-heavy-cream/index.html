    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Christmas Cookies with Heavy Cream", "author": {"@type": "Person", "name": "BenDes"}, "description": "These delicate Christmas cookies are prepared with softened butter, rich heavy cream, and egg yolk to create a tender, smooth dough. After chilling, the dough is rolled thin, cut into festive shapes, baked until lightly golden, and generously coated with confectioners’ sugar while still warm.", "datePublished": "2021-07-08T19:26:01+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/christmas-cookies-with-heavy-cream1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/christmas-cookies-with-heavy-cream1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/christmas-cookies-with-heavy-cream1.png", "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/christmas-cookies-with-heavy-cream1.png"], "cookTime": "PT10M", "totalTime": "PT100M", "recipeIngredient": ["3 1/2 tablespoons heavy cream (for added moisture and improved texture)", "1  large egg yolk", "1 1/2 cups all-purpose flour", "1/2 cup confectioners’ sugar (for coating)", "1 1/4  sticks unsalted butter (softened to room temperature and cut into pieces)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Place the all-purpose flour, softened butter pieces, heavy cream, and egg yolk in a large mixing bowl.", "name": "Place the all-purpose flour, softened butter pieces, heavy cream, and egg yolk in a large mixing bowl.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-0"}, {"@type": "HowToStep", "text": "Using a fork, begin incorporating the egg yolk and cream into the flour mixture.", "name": "Using a fork, begin incorporating the egg yolk and cream into the flour mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-1"}, {"@type": "HowToStep", "text": "Continue combining the ingredients with your fingertips until the mixture develops a crumbly consistency.", "name": "Continue combining the ingredients with your fingertips until the mixture develops a crumbly consistency.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-2"}, {"@type": "HowToStep", "text": "Turn the mixture onto a clean work surface and knead it briefly, just until it comes together as a soft, smooth dough. If it feels excessively sticky, lightly dust the dough with a small amount of flour as you knead.", "name": "Turn the mixture onto a clean work surface and knead it briefly, just until it comes together as a soft, smooth dough. If it feels excessively sticky, lightly dust the dough with a small amount of flour as you knead.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-3"}, {"@type": "HowToStep", "text": "Stop kneading as soon as the dough becomes cohesive. Form it into a cylinder, then cover it securely with plastic wrap.", "name": "Stop kneading as soon as the dough becomes cohesive. Form it into a cylinder, then cover it securely with plastic wrap.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-4"}, {"@type": "HowToStep", "text": "Refrigerate the wrapped dough for 1 1/2 hours. Chilling allows the butter within the dough to become firm again, helping prevent sticking when the dough is later rolled and reducing the need for additional flour.", "name": "Refrigerate the wrapped dough for 1 1/2 hours. Chilling allows the butter within the dough to become firm again, helping prevent sticking when the dough is later rolled and reducing the need for additional flour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-5"}, {"@type": "HowToStep", "text": "Once the chilled dough is semi-firm, place it on a work surface and roll it to approximately 1/8 inch (0.3 mm) thick.", "name": "Once the chilled dough is semi-firm, place it on a work surface and roll it to approximately 1/8 inch (0.3 mm) thick.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-6"}, {"@type": "HowToStep", "text": "Cut the dough into assorted shapes with cookie cutters. Smaller cutters are preferable when possible, as they can promote more consistent results.", "name": "Cut the dough into assorted shapes with cookie cutters. Smaller cutters are preferable when possible, as they can promote more consistent results.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-7"}, {"@type": "HowToStep", "text": "Arrange the shaped cookies on a parchment-lined baking sheet. A thin pastry scraper may be used to lift and transfer the delicate cutouts while preserving their shape.", "name": "Arrange the shaped cookies on a parchment-lined baking sheet. A thin pastry scraper may be used to lift and transfer the delicate cutouts while preserving their shape.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-8"}, {"@type": "HowToStep", "text": "Preheat the oven to 360°F (182°C).", "name": "Preheat the oven to 360°F (182°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-9"}, {"@type": "HowToStep", "text": "Bake the cookies for approximately 10–12 minutes, watching them closely and removing them once they develop a light golden color.", "name": "Bake the cookies for approximately 10–12 minutes, watching them closely and removing them once they develop a light golden color.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-10"}, {"@type": "HowToStep", "text": "Avoid baking them for too long, since excessive baking can produce cookies with an overly firm texture.", "name": "Avoid baking them for too long, since excessive baking can produce cookies with an overly firm texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-11"}, {"@type": "HowToStep", "text": "Transfer the freshly baked cookies to a wire cooling rack and allow them to rest for approximately 5 minutes.", "name": "Transfer the freshly baked cookies to a wire cooling rack and allow them to rest for approximately 5 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-12"}, {"@type": "HowToStep", "text": "While they remain warm, generously coat each cookie with the confectioners’ sugar, creating a sweet coating and a classic snowy holiday finish.", "name": "While they remain warm, generously coat each cookie with the confectioners’ sugar, creating a sweet coating and a classic snowy holiday finish.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/christmas-cookies-with-heavy-cream/#wprm-recipe-45532-step-0-13"}], "recipeCategory": ["Cookies", "Dessert"], "keywords": "Christmas Cookies with Heavy Cream"}</script>
