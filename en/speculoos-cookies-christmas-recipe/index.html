ably, continue combining it by kneading with your hands as necessary.", "name": "When preparing the dough without a stand mixer, begin by stirring it with a wooden spoon. Once the mixture becomes too firm to stir comfortably, continue combining it by kneading with your hands as necessary.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/speculoos-cookies-christmas-recipe/#wprm-recipe-43987-step-0-4"}, {"@type": "HowToStep", "text": "If the finished dough appears excessively dry or crumbly, work in a small amount of additional egg yolk until the proper consistency is achieved.", "name": "If the finished dough appears excessively dry or crumbly, work in a small amount of additional egg yolk until the proper consistency is achieved.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/speculoos-cookies-christmas-recipe/#wprm-recipe-43987-step-0-5"}, {"@type": "HowToStep", "text": "Place the wrapped dough in a cool location for a minimum of 5 hours, or leave it to rest overnight. Do not refrigerate the dough during this initial resting period, since refrigeration can make it brittle.", "name": "Place the wrapped dough in a cool location for a minimum of 5 hours, or leave it to rest overnight. Do not refrigerate the dough during this initial resting period, since refrigeration can make it brittle.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/speculoos-cookies-christmas-recipe/#wprm-recipe-43987-step-0-6"}, {"@type": "HowToStep", "text": "Allowing the dough this extended resting time helps the spices develop and contributes to the desired final texture.", "name": "Allowing the dough this extended resting time helps the spices develop and contributes to the desired final texture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/speculoos-cookies-christmas-recipe/#wprm-recipe-43987-step-0-7"}, {"@type": "HowToStep", "text": "Dust a work surface lightly with flour, then roll the rested dough to approximately 4 mm thick, or slightly less than 1/4 inch.", "name": "Dust a work surface lightly with flour, then roll the rested dough to approximately 4 mm thick, or slightly less than 1/4 inch.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/speculoos-cookies-christmas-recipe/#wprm-recipe-43987-step-0-8"}, {"@type": "HowToStep", "text": "Cut it into small rectangular cookies reminiscent of Biscoff biscuits, or shape the dough with decorative molds, cookie stamps, a patterned rolling pin, or cookie cutters.", "name": "Cut it into small rectangular cookies reminiscent of Biscoff biscuits, or shape the dough with decorative molds, cookie stamps, a patterned rolling pin, or cookie cutters.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/speculoos-cookies-christmas-recipe/#wprm-recipe-43987-step-0-9"}, {"@type": "HowToStep", "text": "When using cookie molds, coat them lightly with flour before pressing in the dough to reduce sticking.", "name": "When using cookie molds, coat them lightly with flour before pressing in the dough to reduce sticking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/speculoos-cookies-christmas-recipe/#wprm-recipe-43987-step-0-10"}, {"@type": "HowToStep", "text": "Arrange the shaped cookies on a non-stick baking sheet. Transfer the tray to the refrigerator and chill the cookies for at least 1 hour before baking.", "name": "Arrange the shaped cookies on a non-stick baking sheet. Transfer the tray to the refrigerator and chill the cookies for at least 1 hour before baking.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/speculoos-cookies-christmas-recipe/#wprm-recipe-43987-step-0-11"}, {"@type": "HowToStep", "text": "Preheat the oven to 375°F (190°C).", "name": "Preheat the oven to 375°F (190°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/speculoos-cookies-christmas-recipe/#wprm-recipe-43987-step-0-12"}, {"@type": "HowToStep", "text": "Position the baking sheet on the center oven rack and
