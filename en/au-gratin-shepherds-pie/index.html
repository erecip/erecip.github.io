ed tomato paste with the meat mixture. Season with dried thyme, salt, and black pepper, then add the gluten-free Worcestershire sauce and broth.", "name": "Combine the toasted tomato paste with the meat mixture. Season with dried thyme, salt, and black pepper, then add the gluten-free Worcestershire sauce and broth.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-4"}, {"@type": "HowToStep", "text": "Bring the filling to a gentle simmer. Reduce the heat and cook uncovered for 30 minutes, or until most of the liquid has evaporated and the mixture has developed a thick consistency. Taste and adjust the salt, pepper, or thyme as needed.", "name": "Bring the filling to a gentle simmer. Reduce the heat and cook uncovered for 30 minutes, or until most of the liquid has evaporated and the mixture has developed a thick consistency. Taste and adjust the salt, pepper, or thyme as needed.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-5"}, {"@type": "HowToStep", "text": "While the filling simmers, preheat the oven to 400°F (200°C).", "name": "While the filling simmers, preheat the oven to 400°F (200°C).", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-6"}, {"@type": "HowToStep", "text": "Using a mandoline or a sharp knife, cut the russet potato and peeled sweet potato into thin, even slices. When the slices are especially moist or begin sticking together, coat them very lightly with rice flour to help keep them separate.", "name": "Using a mandoline or a sharp knife, cut the russet potato and peeled sweet potato into thin, even slices. When the slices are especially moist or begin sticking together, coat them very lightly with rice flour to help keep them separate.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-7"}, {"@type": "HowToStep", "text": "Lightly grease a pie dish with olive oil or nonstick cooking spray. Transfer the hot beef and vegetable filling into the prepared dish and spread it into an even layer.", "name": "Lightly grease a pie dish with olive oil or nonstick cooking spray. Transfer the hot beef and vegetable filling into the prepared dish and spread it into an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-8"}, {"@type": "HowToStep", "text": "Arrange half of the russet and sweet potato slices over the filling in a circular, slightly overlapping pattern. Dust the potatoes lightly with paprika, then distribute half of the Gruyère and half of the Parmesan over the surface.", "name": "Arrange half of the russet and sweet potato slices over the filling in a circular, slightly overlapping pattern. Dust the potatoes lightly with paprika, then distribute half of the Gruyère and half of the Parmesan over the surface.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-9"}, {"@type": "HowToStep", "text": "Place the remaining potato slices over the cheese in a second overlapping layer. Sprinkle with the rest of the Gruyère and Parmesan, then scatter small pieces of butter across the top. Finish with seasoned salt to taste.", "name": "Place the remaining potato slices over the cheese in a second overlapping layer. Sprinkle with the rest of the Gruyère and Parmesan, then scatter small pieces of butter across the top. Finish with seasoned salt to taste.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-10"}, {"@type": "HowToStep", "text": "Cover the pie dish with aluminum foil and bake for 30 minutes.", "name": "Cover the pie dish with aluminum foil and bake for 30 minutes.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-11"}, {"@type": "HowToStep", "text": "Remove the foil and continue baking for another 25 to 30 minutes, or until the potato slices are completely tender.", "name": "Remove the foil and continue baking for another 25 to 30 minutes, or until the potato slices are completely tender.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-12"}, {"@type": "HowToStep", "text": "For a deeper golden-brown surface, place the uncovered pie beneath the broiler for a few minutes, monitoring it closely to prevent scorching.", "name": "For a deeper golden-brown surface, place the uncovered pie beneath the broiler for a few minutes, monitoring it closely to prevent scorching.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-13"}, {"@type": "HowToStep", "text": "Allow the baked shepherd’s pie to rest for approximately 10 minutes before slicing. Garnish with finely chopped Italian parsley immediately before serving.", "name": "Allow the baked shepherd’s pie to rest for approximately 10 minutes before slicing. Garnish with finely chopped Italian parsley immediately before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/au-gratin-shepherds-pie/#wprm-recipe-40426-step-0-14"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["British"], "keywords": "Shepherd’s Pie"}</script>
