    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Gnocchi with Caramelized Onions and Gruyère", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender potato gnocchi are pan-seared until golden, then combined with deeply caramelized onions, aromatic thyme, white wine, and a touch of vinegar. A generous layer of Gruyère is melted under the broiler, creating a rich, savory dish with crisp edges, sweet onions, and a bubbling cheese topping.", "datePublished": "2023-12-10T16:25:12+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/gnocchi-with-caramelized-onions-and-gruyere2.png", "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/gnocchi-with-caramelized-onions-and-gruyere2.png", "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/gnocchi-with-caramelized-onions-and-gruyere2.png", "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/gnocchi-with-caramelized-onions-and-gruyere2.png"], "prepTime": "PT15M", "cookTime": "PT45M", "totalTime": "PT60M", "recipeIngredient": ["6 oz Gruyère cheese (freshly shredded for smooth melting)", "2 lb yellow onions (halved and cut into thin slices)", "1 tsp balsamic vinegar or sherry vinegar", "2  packages potato gnocchi (16–18 oz each, fresh, shelf-stable, or frozen)", "1  small bunch fresh thyme (divided)", "1/4 cup dry white wine", "2 tbsp unsalted butter", "1/2 tsp freshly ground black pepper (plus additional pepper for serving)", "2 tbsp olive oil (divided, preferably extra-virgin)", "1 tsp kosher salt"], "recipeInstructions": [{"@type": "HowToStep", "text": "Heat 1 tablespoon of the olive oil in a 12-inch skillet that is safe for broiling, setting the pan over medium heat.", "name": "Heat 1 tablespoon of the olive oil in a 12-inch skillet that is safe for broiling, setting the pan over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-0"}, {"@type": "HowToStep", "text": "Add one package of potato gnocchi in an even layer. Leave the gnocchi undisturbed for 3 to 5 minutes, or until the undersides develop a rich golden-brown crust.", "name": "Add one package of potato gnocchi in an even layer. Leave the gnocchi undisturbed for 3 to 5 minutes, or until the undersides develop a rich golden-brown crust.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the browned gnocchi to a baking sheet. Pour the remaining tablespoon of olive oil into the skillet and repeat the searing process with the second package. Move the second batch to the baking sheet and reserve all of the gnocchi.", "name": "Transfer the browned gnocchi to a baking sheet. Pour the remaining tablespoon of olive oil into the skillet and repeat the searing process with the second package. Move the second batch to the baking sheet and reserve all of the gnocchi.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-2"}, {"@type": "HowToStep", "text": "Add the unsalted butter to the same skillet and allow it to melt over medium heat.", "name": "Add the unsalted butter to the same skillet and allow it to melt over medium heat.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-3"}, {"@type": "HowToStep", "text": "Place the thinly sliced onions in the pan along with half of the fresh thyme, reserving the remainder for the final garnish. Season with the kosher salt and 1/2 teaspoon black pepper.", "name": "Place the thinly sliced onions in the pan along with half of the fresh thyme, reserving the remainder for the final garnish. Season with the kosher salt and 1/2 teaspoon black pepper.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-4"}, {"@type": "HowToStep", "text": "Cook the onions for approximately 30 minutes, stirring from time to time, until they become exceptionally soft, deeply golden, and reduced to roughly half their original volume. If the onions begin adhering to the skillet before they are fully caramelized, a small splash of water may be added to loosen them from the pan.", "name": "Cook the onions for approximately 30 minutes, stirring from time to time, until they become exceptionally soft, deeply golden, and reduced to roughly half their original volume. If the onions begin adhering to the skillet before they are fully caramelized, a small splash of water may be added to loosen them from the pan.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-5"}, {"@type": "HowToStep", "text": "Pour the dry white wine into the skillet. Using a wooden spoon, scrape the browned caramelized residue from the bottom of the pan so it incorporates into the onions.", "name": "Pour the dry white wine into the skillet. Using a wooden spoon, scrape the browned caramelized residue from the bottom of the pan so it incorporates into the onions.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-6"}, {"@type": "HowToStep", "text": "Continue cooking for about 1 minute, until the wine has reduced and is nearly evaporated. Stir in the balsamic vinegar or sherry vinegar until evenly incorporated.", "name": "Continue cooking for about 1 minute, until the wine has reduced and is nearly evaporated. Stir in the balsamic vinegar or sherry vinegar until evenly incorporated.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-7"}, {"@type": "HowToStep", "text": "Return the reserved seared gnocchi to the skillet with the caramelized onion mixture. Fold everything together gently, then arrange the mixture in an even layer.", "name": "Return the reserved seared gnocchi to the skillet with the caramelized onion mixture. Fold everything together gently, then arrange the mixture in an even layer.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-8"}, {"@type": "HowToStep", "text": "Scatter the shredded Gruyère uniformly over the surface, ensuring the gnocchi and onions are well covered.", "name": "Scatter the shredded Gruyère uniformly over the surface, ensuring the gnocchi and onions are well covered.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-9"}, {"@type": "HowToStep", "text": "Transfer the skillet beneath the broiler and cook for 4 to 6 minutes, watching carefully, until the Gruyère is fully melted, bubbling, and golden-brown across the top.", "name": "Transfer the skillet beneath the broiler and cook for 4 to 6 minutes, watching carefully, until the Gruyère is fully melted, bubbling, and golden-brown across the top.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-10"}, {"@type": "HowToStep", "text": "Remove the skillet from the broiler. Finish with the reserved fresh thyme and additional freshly ground black pepper before serving.", "name": "Remove the skillet from the broiler. Finish with the reserved fresh thyme and additional freshly ground black pepper before serving.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/gnocchi-with-caramelized-onions-and-gruyere/#wprm-recipe-42050-step-0-11"}], "recipeCategory": ["Main Course"], "recipeCuisine": ["European"], "keywords": "Gnocchi with Caramelized Onions and Gruyère"}</script>
