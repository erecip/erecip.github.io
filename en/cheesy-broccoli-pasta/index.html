    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Cheesy Broccoli Pasta", "author": {"@type": "Person", "name": "BenDes"}, "description": "Tender pasta and broccoli are enveloped in a smooth, savory cheese sauce made with sharp cheddar, Parmesan, chicken broth, and half-and-half. This comforting dish is best served immediately while the sauce remains creamy.", "datePublished": "2022-03-26T14:27:10+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/cheesy-broccoli-pasta.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/cheesy-broccoli-pasta-500x500.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/cheesy-broccoli-pasta-500x375.png", "https://easy-recipes322.github.io/easy-recipes323/wp-content/uploads/cheesy-broccoli-pasta-480x270.png"], "recipeIngredient": ["4 cups fresh or frozen broccoli florets (cut into bite-size pieces)", "1 cup freshly grated sharp cheddar cheese", "1 cup regular chicken broth", "¼ teaspoon freshly ground black pepper (plus additional pepper as desired)", "8 ounces medium-size dried pasta (such as penne or rotini)", "½ teaspoon onion powder", "¼ cup finely shredded Parmesan cheese", "1 cup half-and-half or light cream", "¼ teaspoon garlic salt", "¼ teaspoon salt (with more added according to taste)", "2 tablespoons plus 1 teaspoon cornstarch", "2 tablespoons cold water (for combining with the cornstarch)"], "recipeInstructions": [{"@type": "HowToStep", "text": "Fill a large saucepan with salted water and bring it to a rolling boil.", "name": "Fill a large saucepan with salted water and bring it to a rolling boil.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/cheesy-broccoli-pasta/#wprm-recipe-39554-step-0-0"}, {"@type": "HowToStep", "text": "Add the dried pasta and cook according to the package instructions until it reaches an al dente texture.", "name": "Add the dried pasta and cook acco
