, "name": "Rinse the dry elbow macaroni under cold water thoroughly and drain well.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-mac-and-cheese-recipe/#wprm-recipe-13772-step-0-1"}, {"@type": "HowToStep", "text": "Transfer the pasta into the slow cooker. Pour in the whole milk and evaporated milk, then add the shredded cheeses, salt, pepper, dry mustard, garlic powder, and cayenne pepper. Stir the contents thoroughly to ensure the macaroni is mostly immersed in the liquid.", "name": "Transfer the pasta into the slow cooker. Pour in the whole milk and evaporated milk, then add the shredded cheeses, salt, pepper, dry mustard, garlic powder, and cayenne pepper. Stir the contents thoroughly to ensure the macaroni is mostly immersed in the liquid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-mac-and-cheese-recipe/#wprm-recipe-13772-step-0-2"}, {"@type": "HowToStep", "text": "Distribute the butter cubes evenly over the mixture.", "name": "Distribute the butter cubes evenly over the mixture.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-mac-and-cheese-recipe/#wprm-recipe-13772-step-0-3"}, {"@type": "HowToStep", "text": "Cover with the lid and set the slow cooker to low. Cook for 1 hour without lifting the lid.", "name": "Cover with the lid and set the slow cooker to low. Cook for 1 hour without lifting the lid.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-mac-and-cheese-recipe/#wprm-recipe-13772-step-0-4"}, {"@type": "HowToStep", "text": "After 1 hour, uncover briefly and stir swiftly, then replace the lid. Continue to cook on low, checking every 30 minutes thereafter.", "name": "After 1 hour, uncover briefly and stir swiftly, then replace the lid. Continue to cook on low, checking every 30 minutes thereafter.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/crock-pot-mac-and-cheese-recipe/#wprm-recipe-13772-step-0-5"}, {"@type": "HowToStep", "text":
