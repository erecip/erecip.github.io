    <script type="application/ld+json">{"@context": "http://schema.org/", "@type": "Recipe", "name": "Fresh Fruit Tart", "author": {"@type": "Person", "name": "BenDes"}, "description": "Brimming with the vibrancy of seasonal produce, this Fresh Fruit Tart offers a delightful medley of fruits atop a silky pastry cream nestled in a tender tart crust. This recipe provides not only a visual and gustatory treat but also a lesson in classic baking fundamentals.", "datePublished": "2024-06-19T09:51:06+00:00", "image": ["https://easy-recipes322.github.io/easy-recipes323/en/fruit-tart-recipe/Fruit-Tart-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/fruit-tart-recipe/Fruit-Tart-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/fruit-tart-recipe/Fruit-Tart-Recipe.png", "https://easy-recipes322.github.io/easy-recipes323/en/fruit-tart-recipe/Fruit-Tart-Recipe.png"], "prepTime": "PT20M", "cookTime": "PT100M", "totalTime": "PT240M", "recipeIngredient": ["1/4 cup cornstarch", "1 teaspoon vanilla extract", "6  large egg yolks", "2 cups whole milk", "1 cup granulated sugar", "1/4 teaspoon salt", "1/2 teaspoon vanilla extract", "1  egg", "1/4 teaspoon baking powder", "7 tablespoons unsalted butter (softened)", "1 1/4 cups all-purpose flour (sifted)", "1/4 teaspoon salt", "1/2 cup powdered sugar", "Apricot jam (melted, as required)", "1 pint mixed fresh fruit such as strawberries (raspberries, mango, blueberries, blackberries, kiwi, and peaches)"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a medium non-aluminum saucepan over medium heat, warm the milk until small bubbles form along the edges, approximately 6 to 8 minutes, ensuring it does not boil. In a large mixing bowl, whisk the egg yolks with sugar, then incorporate cornstarch and salt until smooth. Gradually pour in half the hot milk, whisking continuously to temper the yolks, then add the remaining milk. Return the mixture to the saucepan and cook over medium heat, whisking constantly, until the cream thickens firmly, about 5 to 8 minutes. Stir in vanilla extract and transfer to a bowl, pressing plastic wrap directly onto the surface to prevent a skin from forming. Refrigerate for 2 to 3 hours.", "name": "In a medium non-aluminum saucepan over medium heat, warm the milk until small bubbles form along the edges, approximately 6 to 8 minutes, ensuring it does not boil. In a large mixing bowl, whisk the egg yolks with sugar, then incorporate cornstarch and salt until smooth. Gradually pour in half the hot milk, whisking continuously to temper the yolks, then add the remaining milk. Return the mixture to the saucepan and cook over medium heat, whisking constantly, until the cream thickens firmly, about 5 to 8 minutes. Stir in vanilla extract and transfer to a bowl, pressing plastic wrap directly onto the surface to prevent a skin from forming. Refrigerate for 2 to 3 hours.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fruit-tart-recipe/#wprm-recipe-11244-step-0-0"}, {"@type": "HowToStep", "text": "Using a stand mixer with the paddle attachment or a handheld electric mixer, beat the softened butter and powdered sugar on medium-high until light and airy, about 3 minutes. Scrape down the bowl, then mix in the egg, followed by the vanilla extract and salt. Reduce the speed and add the flour and baking powder, blending just until a dough forms. Shape the dough into a disc, wrap it in plastic, and chill for at least 1 hour.", "name": "Using a stand mixer with the paddle attachment or a handheld electric mixer, beat the softened butter and powdered sugar on medium-high until light and airy, about 3 minutes. Scrape down the bowl, then mix in the egg, followed by the vanilla extract and salt. Reduce the speed and add the flour and baking powder, blending just until a dough forms. Shape the dough into a disc, wrap it in plastic, and chill for at least 1 hour.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fruit-tart-recipe/#wprm-recipe-11244-step-0-1"}, {"@type": "HowToStep", "text": "Preheat oven to 350°F (175°C). On a floured surface, roll the chilled dough to 1/8 to 1/4 inch thick. Carefully transfer it into a 9-inch tart pan with a removable bottom, pressing it into the sides and trimming the excess. Line the crust with parchment paper or foil, fill with pie weights or dried beans, and bake for 12 minutes. Remove the weights and lining, then bake an additional 10 to 15 minutes until golden and fully cooked. Allow to cool completely.", "name": "Preheat oven to 350°F (175°C). On a floured surface, roll the chilled dough to 1/8 to 1/4 inch thick. Carefully transfer it into a 9-inch tart pan with a removable bottom, pressing it into the sides and trimming the excess. Line the crust with parchment paper or foil, fill with pie weights or dried beans, and bake for 12 minutes. Remove the weights and lining, then bake an additional 10 to 15 minutes until golden and fully cooked. Allow to cool completely.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fruit-tart-recipe/#wprm-recipe-11244-step-0-2"}, {"@type": "HowToStep", "text": "Spread the chilled pastry cream evenly in the cooled crust. Artfully arrange the fresh fruit over the cream. Lightly warm the apricot jam until fluid, and gently brush it over the fruit using a pastry brush to enhance sheen and preserve freshness.", "name": "Spread the chilled pastry cream evenly in the cooled crust. Artfully arrange the fresh fruit over the cream. Lightly warm the apricot jam until fluid, and gently brush it over the fruit using a pastry brush to enhance sheen and preserve freshness.", "url": "https://easy-recipes322.github.io/easy-recipes323/en/fruit-tart-recipe/#wprm-recipe-11244-step-0-3"}], "recipeCategory": ["Dessert"], "recipeCuisine": ["American"], "keywords": "Fruit Tart Recipe"}</script>
